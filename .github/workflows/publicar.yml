# Publica en Instagram el reel aprobado más viejo (ver herramientas/publicar.mjs).
# 12:00 y 19:00 de Uruguay. A mano: Actions → "Publicar reel" → Run workflow (con "prueba" no publica).
name: Publicar reel
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba: hace todo menos publicar"
        type: boolean
        default: true
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node herramientas/publicar.mjs ${{ inputs.prueba && '--prueba' || '' }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRIVE_APROBADOS: 1VRxt08EiUNDxKDrJk5ugXzsRCRZKedGK
          DRIVE_PUBLICADOS: 1QGCBFfdUfWAF7hCHfgYJfMXfd_CUzh2p
