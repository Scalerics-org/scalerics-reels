# Publica el reel aprobado más viejo de la cola (ver herramientas/publicar.mjs).
# Corre cada hora, pero solo sigue si la hora de Uruguay está en los horarios de alguna red, que se
# editan en el CRM (panel Reels) y viven en horarios.json (reels.scalerics.com/api/horarios).
# A mano: Actions → "Publicar reel" → Run workflow (con "prueba" no publica).
name: Publicar reel
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba: hace todo menos publicar"
        type: boolean
        default: true
      tiktok_code:
        description: "Solo la primera vez: el code de TikTok (scalerics.com/tiktok?code=...)"
        type: string
        default: ""
      panel:
        description: "Lo manda el panel de aprobación (no tocar a mano)"
        type: string
        default: ""
      turno:
        description: "Como la corrida de la hora: solo publica si hay un horario pendiente y lo marca (lo usa el reloj externo)"
        type: boolean
        default: false
      tiktok_inbox:
        description: "Prueba: manda ese reel (slug) a la bandeja de TikTok, sin anotar nada"
        type: string
        default: ""
      tiktok_estado:
        description: "Diagnóstico: publish_id de TikTok para ver en qué quedó (no publica nada)"
        type: string
        default: ""
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Barato: si es una corrida de la hora y ninguna red tiene un horario pendiente, termina acá
      # (sin bajar los videos). Pendiente = ya pasó y el publicador no lo atendió (turnos.json).
      - id: toca
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.turno }}" != "true" ]; then echo "si=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          T=$(curl -sf --max-time 20 "https://reels.scalerics.com/api/horarios?turno=1" || echo '{"redes":[],"turnos":{}}')
          REDES=$(echo "$T" | jq -r '.redes | join(",")')
          echo "pendientes: ${REDES:-ninguno} $(echo "$T" | jq -c .turnos)"
          if [ -n "$REDES" ]; then
            echo "si=true" >> "$GITHUB_OUTPUT"
            echo "redes=$REDES" >> "$GITHUB_OUTPUT"
            echo "turnos=$(echo "$T" | jq -c .turnos)" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.toca.outputs.si == 'true'
        uses: actions/checkout@v4
      # las ramas reel/* tienen los mp4: la cola automática los saca de ahí
      - if: steps.toca.outputs.si == 'true'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/reel/*:refs/remotes/origin/reel/*"
      - if: steps.toca.outputs.si == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.toca.outputs.si == 'true'
        run: node herramientas/publicar.mjs ${{ inputs.prueba && '--prueba' || '' }} ${{ inputs.tiktok_code && format('--tiktok-code={0}', inputs.tiktok_code) || '' }} ${{ inputs.tiktok_estado && format('--tiktok-estado={0}', inputs.tiktok_estado) || '' }} ${{ inputs.tiktok_inbox && format('--tiktok-inbox={0}', inputs.tiktok_inbox) || '' }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          TIKTOK_PAUSADO: "1"
          PANEL: ${{ inputs.panel }}
          REDES_HORA: ${{ steps.toca.outputs.redes }}
          TURNOS: ${{ steps.toca.outputs.turnos }}
          DRIVE_APROBADOS: 1VRxt08EiUNDxKDrJk5ugXzsRCRZKedGK
          DRIVE_PUBLICADOS: 1QGCBFfdUfWAF7hCHfgYJfMXfd_CUzh2p
