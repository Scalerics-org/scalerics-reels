  <script>
    (function () {
      const ID = "s09-ganamos";
      const DUR = 2.65;
      const FASE = 0.169;
      const BEAT = 0.4545;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // aparece con estirón de goma (squash and stretch)
      const pop = (el, t, o, d = 0.45) => {
        gsap.set(el, { opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.05 }, t);
        tl.fromTo(el, { scaleX: 0.3, scaleY: 1.5, svgOrigin: o }, { scaleX: 1, scaleY: 1, svgOrigin: o, duration: d, ease: "elastic.out(1, 0.45)" }, t);
      };
      const popTxt = (el, t, d = 0.35) => tl.fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(2.2)" }, t);
      const fuera = (el, t, d = 0.2) => tl.to(el, { opacity: 0, duration: d }, t);
      // rebote al compás (dibujo animado: todo baila con la música)
      const rebote = (el, o, desde = 0, hasta = DUR, amp = 0.05) => {
        let t = desde + ((FASE - desde) % BEAT + BEAT) % BEAT;
        for (; t + BEAT <= hasta; t += BEAT) {
          tl.to(el, { scaleY: 1 - amp, scaleX: 1 + amp * 0.6, svgOrigin: o, duration: 0.09, ease: "power2.out" }, t);
          tl.to(el, { scaleY: 1, scaleX: 1, svgOrigin: o, duration: BEAT - 0.12, ease: "power1.inOut" }, t + 0.09);
        }
      };
      // parpadeo de párpados (pares de elementos) en los tiempos dados
      const parpadeo = (els, o, ts, base = 0) => ts.forEach((t) => {
        tl.to(els, { scaleY: 1, svgOrigin: o, duration: 0.06 }, t);
        tl.to(els, { scaleY: base, svgOrigin: o, duration: 0.08 }, t + 0.1);
      });
      // etiqueta
      const etq = (sel, t, sale) => { tl.fromTo(q(sel), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, t); if (sale) tl.to(q(sel), { opacity: 0, duration: 0.12 }, sale); };

      // "¡Ganamos!": salta con los brazos arriba
      tl.to(q(".s09-dia-bi"), { rotation: 120, svgOrigin: "-44 -150", duration: 0.15 }, 0);
      tl.to(q(".s09-dia-bd"), { rotation: -30, svgOrigin: "44 -150", duration: 0.15 }, 0);
      tl.fromTo(q(".s09-diaw"), { y: 0 }, { y: -110, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1 }, 0.02);
      tl.to(q(".s09-diaw"), { scaleY: 0.85, scaleX: 1.1, svgOrigin: "0 0", duration: 0.06, yoyo: true, repeat: 1 }, 0.46);
      qa(".s09-cf").forEach((el, i) => tl.fromTo(el, { opacity: 0, scale: 0, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(3)" }, 0.05 + i * 0.04));
      qa(".s09-cf").forEach((el, i) => tl.to(el, { y: 60, rotation: 90, opacity: 0, duration: 0.6 }, 0.7 + i * 0.03));
      etq(".s09-e1", 0.05, 0.6);
      // "¿Y ese?": se congela y mira a la derecha
      tl.to([q(".s09-dia-bi"), q(".s09-dia-bd")], { rotation: 0, duration: 0.2 }, 0.62);
      tl.to(qa(".s09-dia-oi .s09-pupila, .s09-dia-od .s09-pupila"), { x: 9, duration: 0.15 }, 0.62);
      tl.to(q(".s09-dia-cejas"), { y: -12, duration: 0.12 }, 0.65);
      // "quién es": se prende la luz y aparece la silueta
      tl.to(q(".s09-luz"), { opacity: 0.28, duration: 0.1 }, 1.0);
      tl.fromTo(q(".s09-silueta"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, 1.05);
      tl.fromTo(q(".s09-preg"), { opacity: 0, scale: 0.3, svgOrigin: "820 820" }, { opacity: 1, scale: 1, svgOrigin: "820 820", duration: 0.35, ease: "back.out(3)" }, 1.35);
      tl.to(q(".s09-preg"), { rotation: 10, svgOrigin: "820 820", duration: 0.12, yoyo: true, repeat: 5 }, 1.7);
      etq(".s09-e2", 1.36);
    
      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
