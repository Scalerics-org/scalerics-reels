<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    /* grano de película: una capa de ruido que salta de lugar 12 veces por segundo */
    [data-composition-id="ambiente"] .amb-grano { position: absolute; left: 0; top: 0; width: 1700px; height: 2700px; opacity: 0.2; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0 0.06  0 0 0 1.6 -0.55'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
      background-size: 300px 300px; }
    /* viñeta redonda de proyector viejo */
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0;
      background: radial-gradient(ellipse 600px 1000px at 540px 900px, rgba(29, 22, 16, 0) 62%, rgba(29, 22, 16, 0.38) 82%, rgba(29, 22, 16, 0.82) 100%); }
    [data-composition-id="ambiente"] .amb-parpadeo { position: absolute; inset: 0; background: #1d1610; opacity: 0; }
    [data-composition-id="ambiente"] .amb-luz { position: absolute; inset: 0; background: #fff6dc; opacity: 0; }
    [data-composition-id="ambiente"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    [data-composition-id="ambiente"] .amb-raya { stroke: #1d1610; stroke-width: 2.5; opacity: 0; }
    [data-composition-id="ambiente"] .amb-pelo { fill: none; stroke: #1d1610; stroke-width: 2.5; opacity: 0; }
    [data-composition-id="ambiente"] .amb-mota { fill: #1d1610; opacity: 0; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="70.77">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="70.77" data-track-index="0">
      <div class="amb-grano"></div>
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="amb-raya" x1="212" y1="0" x2="216" y2="1920" />
        <line class="amb-raya" x1="790" y1="0" x2="786" y2="1920" />
        <line class="amb-raya" x1="455" y1="300" x2="458" y2="1500" />
        <path class="amb-pelo" d="M880 640 q30 -20 20 30 q-10 40 30 50" />
        <path class="amb-pelo" d="M150 1180 q-20 30 20 40 q30 6 10 40" />
        <circle class="amb-mota" cx="320" cy="760" r="6" />
        <circle class="amb-mota" cx="742" cy="1060" r="4" />
        <circle class="amb-mota" cx="610" cy="640" r="5" />
        <circle class="amb-mota" cx="180" cy="980" r="4" />
        <circle class="amb-mota" cx="930" cy="1250" r="6" />
      </svg>
      <div class="amb-vineta"></div>
      <div class="amb-parpadeo"></div>
      <div class="amb-luz"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 70.77;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // grano: salta a una posición nueva 12 veces por segundo (steps), en bucle de 1 s
      tl.fromTo(q(".amb-grano"), { x: 0, y: 0 }, { x: -444, y: -636, duration: 1, ease: "steps(12)", repeat: Math.floor(DUR) }, 0);

      // parpadeo del proyector: la imagen se oscurece apenas, a saltos
      const P = [0.05, 0.02, 0.07, 0.03, 0.0, 0.06, 0.01, 0.04, 0.08, 0.02, 0.05, 0.0, 0.03];
      let t = 0, k = 0;
      while (t < DUR - 0.2) {
        const d = 0.083 + (k % 3) * 0.042;
        tl.to(q(".amb-parpadeo"), { opacity: P[k % P.length], duration: 0.01 }, t);
        t += d; k++;
      }

      // rayas y pelitos del celuloide: aparecen un instante en tiempos fijos
      const rayas = qa(".amb-raya"), pelos = qa(".amb-pelo"), motas = qa(".amb-mota");
      const flash = (el, ts, op, d) => ts.forEach((tt) => { tl.to(el, { opacity: op, duration: 0.01 }, tt); tl.to(el, { opacity: 0, duration: 0.01 }, tt + d); });
      flash(rayas[0], [1.2, 1.5, 7.9, 8.1, 19.3, 31.0, 31.2, 44.6, 52.3, 61.8, 66.0], 0.35, 0.16);
      flash(rayas[1], [3.4, 12.6, 12.8, 24.1, 37.7, 47.9, 48.1, 58.4, 68.2], 0.3, 0.2);
      flash(rayas[2], [5.6, 16.2, 28.5, 40.9, 55.1, 63.3], 0.22, 0.12);
      flash(pelos[0], [2.2, 14.4, 33.3, 50.5, 65.2], 0.45, 0.25);
      flash(pelos[1], [9.6, 26.0, 42.2, 57.7, 69.0], 0.45, 0.25);
      motas.forEach((m, i) => flash(m, [0.7 + i * 1.9, 11.3 + i * 2.3, 22.9 + i * 1.7, 35.5 + i * 2.1, 46.4 + i * 1.3, 59.1 + i * 1.6], 0.5, 0.09));

      // la luz se prende cuando aparece el agente (43.39) y en el cierre de Scalerics (57.7)
      [43.39, 57.7].forEach((tt) => {
        tl.to(q(".amb-luz"), { opacity: 0.55, duration: 0.04 }, tt);
        tl.to(q(".amb-luz"), { opacity: 0, duration: 0.5, ease: "power2.out" }, tt + 0.06);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
