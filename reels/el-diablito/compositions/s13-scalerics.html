  <script>
    (function () {
      const ID = "s13-scalerics";
      const DUR = 6.86;
      const FASE = 0.027;
      const BEAT = 0.4545;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // aparece con estirón de goma (squash and stretch)
      const pop = (el, t, o, d = 0.45) => {
        gsap.set(el, { opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.05 }, t);
        tl.fromTo(el, { scaleX: 0.3, scaleY: 1.5, svgOrigin: o }, { scaleX: 1, scaleY: 1, svgOrigin: o, duration: d, ease: "elastic.out(1, 0.45)" }, t);
      };
      const popTxt = (el, t, d = 0.35) => tl.fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(2.2)" }, t);
      const fuera = (el, t, d = 0.2) => tl.to(el, { opacity: 0, duration: d }, t);
      // rebote al compás (dibujo animado: todo baila con la música)
      const rebote = (el, o, desde = 0, hasta = DUR, amp = 0.05) => {
        let t = desde + ((FASE - desde) % BEAT + BEAT) % BEAT;
        for (; t + BEAT <= hasta; t += BEAT) {
          tl.to(el, { scaleY: 1 - amp, scaleX: 1 + amp * 0.6, svgOrigin: o, duration: 0.09, ease: "power2.out" }, t);
          tl.to(el, { scaleY: 1, scaleX: 1, svgOrigin: o, duration: BEAT - 0.12, ease: "power1.inOut" }, t + 0.09);
        }
      };
      // parpadeo de párpados (pares de elementos) en los tiempos dados
      const parpadeo = (els, o, ts, base = 0) => ts.forEach((t) => {
        tl.to(els, { scaleY: 1, svgOrigin: o, duration: 0.06 }, t);
        tl.to(els, { scaleY: base, svgOrigin: o, duration: 0.08 }, t + 0.1);
      });
      // etiqueta
      const etq = (sel, t, sale) => { tl.fromTo(q(sel), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, t); if (sale) tl.to(q(sel), { opacity: 0, duration: 0.12 }, sale); };

      gsap.set(q(".s13-due-pi"), { scaleY: 1, svgOrigin: "-48 -252" });
      gsap.set(q(".s13-due-pd"), { scaleY: 1, svgOrigin: "48 -252" });
      tl.set(q(".s13-due-boca"), { attr: { d: "M-26 -70 q26 16 52 0" } }, 0);
      rebote(q(".s13-agew"), "0 0", 0, DUR, 0.05);
      tl.to(q(".s13-due"), { y: 8, duration: 1.1, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s13-trio"), { opacity: 0.3, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 0);
      tl.fromTo([q(".s13-ventana"), q(".s13-reloj")], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
      qa(".s13-zz text").forEach((el, i) => tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: -10, duration: 0.8, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.3 + i * 0.3));
      etq(".s13-e1", 0.38, 1.8);
      // "empleado de IA": tipea en su celular
      tl.to(q(".s13-age-bd"), { rotation: -8, svgOrigin: "44 -140", duration: 0.1, yoyo: true, repeat: 23, ease: "sine.inOut" }, 1.9);
      tl.to(q(".s13-age-luz"), { scale: 1.4, svgOrigin: "0 -344", duration: 0.2, yoyo: true, repeat: 15 }, 1.9);
      etq(".s13-e2", 1.9, 4.0);
      // "seguimiento": los mensajes salen volando
      qa(".s13-sob").forEach((el, i) => {
        const t = 3.2 + i * 0.35;
        tl.fromTo(el, { opacity: 0, x: 0, y: 0, scale: 0.4 }, { opacity: 1, x: 40 + (i % 2) * 30, y: -230 - i * 30, scale: 1, duration: 0.7, ease: "power2.out" }, t);
        tl.to(el, { opacity: 0, duration: 0.2 }, t + 0.7);
      });
      // "a cualquier hora": el reloj gira loco
      tl.to(q(".s13-aguja-m"), { rotation: 1440, svgOrigin: "850 700", duration: 1.2, ease: "power1.inOut" }, 4.0);
      tl.to(q(".s13-aguja-h"), { rotation: 120, svgOrigin: "850 700", duration: 1.2, ease: "power1.inOut" }, 4.0);
      etq(".s13-e3", 4.06, 5.3);
      // "sin quedar pesado": baja una pluma (en vez de la pesa)

      tl.to(q(".s13-pluma"), { x: 40, rotation: -25, svgOrigin: "250 1000", duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 5.2);
      etq(".s13-e4", 5.34);
    
      // salida
      tl.to(q("#s13-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
