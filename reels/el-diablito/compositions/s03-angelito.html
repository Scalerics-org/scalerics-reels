  <script>
    (function () {
      const ID = "s03-angelito";
      const DUR = 4.41;
      const FASE = 0.042;
      const BEAT = 0.4545;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // aparece con estirón de goma (squash and stretch)
      const pop = (el, t, o, d = 0.45) => {
        gsap.set(el, { opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.05 }, t);
        tl.fromTo(el, { scaleX: 0.3, scaleY: 1.5, svgOrigin: o }, { scaleX: 1, scaleY: 1, svgOrigin: o, duration: d, ease: "elastic.out(1, 0.45)" }, t);
      };
      const popTxt = (el, t, d = 0.35) => tl.fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(2.2)" }, t);
      const fuera = (el, t, d = 0.2) => tl.to(el, { opacity: 0, duration: d }, t);
      // rebote al compás (dibujo animado: todo baila con la música)
      const rebote = (el, o, desde = 0, hasta = DUR, amp = 0.05) => {
        let t = desde + ((FASE - desde) % BEAT + BEAT) % BEAT;
        for (; t + BEAT <= hasta; t += BEAT) {
          tl.to(el, { scaleY: 1 - amp, scaleX: 1 + amp * 0.6, svgOrigin: o, duration: 0.09, ease: "power2.out" }, t);
          tl.to(el, { scaleY: 1, scaleX: 1, svgOrigin: o, duration: BEAT - 0.12, ease: "power1.inOut" }, t + 0.09);
        }
      };
      // parpadeo de párpados (pares de elementos) en los tiempos dados
      const parpadeo = (els, o, ts, base = 0) => ts.forEach((t) => {
        tl.to(els, { scaleY: 1, svgOrigin: o, duration: 0.06 }, t);
        tl.to(els, { scaleY: base, svgOrigin: o, duration: 0.08 }, t + 0.1);
      });
      // etiqueta
      const etq = (sel, t, sale) => { tl.fromTo(q(sel), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, t); if (sale) tl.to(q(sel), { opacity: 0, duration: 0.12 }, sale); };

      gsap.set(q(".s03-due-pi"), { scaleY: 0.45, svgOrigin: "-48 -252" });
      gsap.set(q(".s03-due-pd"), { scaleY: 0.45, svgOrigin: "48 -252" });
      gsap.set(q(".s03-ang-pi"), { scaleY: 0, svgOrigin: "-21 -267" }); gsap.set(q(".s03-ang-pd"), { scaleY: 0, svgOrigin: "21 -267" });
      [2].forEach((t) => { parpadeo([q(".s03-due-pi")], "-48 -252", [t], 0.45); parpadeo([q(".s03-due-pd")], "48 -252", [t], 0.45); });
      rebote(q(".s03-due"), "0 170", 0, DUR, 0.015);
      
      rebote(q(".s03-ang"), "0 0", 0, DUR, 0.05);

      // el angelito aparece en el hombro, con el halo que brilla
      pop(q(".s03-ang"), 0.0, "0 0", 0.5);
      tl.fromTo(q(".s03-ang-halo"), { y: -30, rotation: 0 }, { y: 0, rotation: 0, duration: 0.5, ease: "bounce.out" }, 0.05);
      etq(".s03-e1", 0.2, 1.4);
      // "corazón": el corazoncito late
      tl.fromTo(q(".s03-corazon"), { opacity: 0, scale: 0.3, svgOrigin: "900 870" }, { opacity: 1, scale: 1, svgOrigin: "900 870", duration: 0.3, ease: "back.out(3)" }, 0.6);
      tl.to(q(".s03-corazon"), { scale: 1.2, svgOrigin: "900 870", duration: 0.15, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.9);
      tl.to(q(".s03-corazon"), { opacity: 0, y: -60, duration: 0.4 }, 2.4);
      // le susurra: mano a la boca
      tl.to(q(".s03-ang-bi"), { rotation: 70, svgOrigin: "-38 -150", duration: 0.25, ease: "back.out(2)" }, 0.1);
      // el dueño mira al angelito
      tl.to(qa(".s03-due-oi .s03-pupila, .s03-due-od .s03-pupila"), { x: 14, duration: 0.2 }, 0.2);
      tl.to(q(".s03-due-cab"), { rotation: 5, svgOrigin: "0 -40", duration: 0.3 }, 0.2);
      // "Pasale el precio": el borrador del mensaje
      pop(q(".s03-chat"), 1.45, "600 800");
      gsap.set([q(".s03-l1"), q(".s03-l2")], { opacity: 0 });
      tl.to(q(".s03-l1"), { opacity: 1, duration: 0.2 }, 1.7);
      tl.to(q(".s03-l2"), { opacity: 1, duration: 0.2 }, 2.6);
      tl.fromTo(qa(".s03-dots circle"), { y: 0 }, { y: -10, duration: 0.18, yoyo: true, repeat: 11, stagger: 0.08, ease: "sine.inOut" }, 1.6);
      tl.to(q(".s03-due-pantalla"), { fill: "#f2c230", duration: 0.1 }, 1.5);
      etq(".s03-e2", 1.55);
      tl.to(q(".s03-ang-bd"), { rotation: -40, svgOrigin: "38 -150", duration: 0.2, yoyo: true, repeat: 3 }, 2.6);
    
      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
