  <script>
    (function () {
      const ID = "s06-senora";
      const DUR = 5.97;
      const FASE = 0.156;
      const BEAT = 0.4545;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // aparece con estirón de goma (squash and stretch)
      const pop = (el, t, o, d = 0.45) => {
        gsap.set(el, { opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.05 }, t);
        tl.fromTo(el, { scaleX: 0.3, scaleY: 1.5, svgOrigin: o }, { scaleX: 1, scaleY: 1, svgOrigin: o, duration: d, ease: "elastic.out(1, 0.45)" }, t);
      };
      const popTxt = (el, t, d = 0.35) => tl.fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(2.2)" }, t);
      const fuera = (el, t, d = 0.2) => tl.to(el, { opacity: 0, duration: d }, t);
      // rebote al compás (dibujo animado: todo baila con la música)
      const rebote = (el, o, desde = 0, hasta = DUR, amp = 0.05) => {
        let t = desde + ((FASE - desde) % BEAT + BEAT) % BEAT;
        for (; t + BEAT <= hasta; t += BEAT) {
          tl.to(el, { scaleY: 1 - amp, scaleX: 1 + amp * 0.6, svgOrigin: o, duration: 0.09, ease: "power2.out" }, t);
          tl.to(el, { scaleY: 1, scaleX: 1, svgOrigin: o, duration: BEAT - 0.12, ease: "power1.inOut" }, t + 0.09);
        }
      };
      // parpadeo de párpados (pares de elementos) en los tiempos dados
      const parpadeo = (els, o, ts, base = 0) => ts.forEach((t) => {
        tl.to(els, { scaleY: 1, svgOrigin: o, duration: 0.06 }, t);
        tl.to(els, { scaleY: base, svgOrigin: o, duration: 0.08 }, t + 0.1);
      });
      // etiqueta
      const etq = (sel, t, sale) => { tl.fromTo(q(sel), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, t); if (sale) tl.to(q(sel), { opacity: 0, duration: 0.12 }, sale); };

      gsap.set(q(".s06-ang-pi"), { scaleY: 0, svgOrigin: "-21 -267" }); gsap.set(q(".s06-ang-pd"), { scaleY: 0, svgOrigin: "21 -267" });
      rebote(q(".s06-angw"), "0 0", 0, DUR, 0.05);
      tl.fromTo(q(".s06-foto"), { opacity: 0, y: -40, rotation: -10, svgOrigin: "540 600" }, { opacity: 1, y: 0, rotation: 0, svgOrigin: "540 600", duration: 0.5, ease: "back.out(2)" }, 0);
      tl.to(q(".s06-foto"), { rotation: 3, svgOrigin: "540 600", duration: 0.9, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.5);
      tl.fromTo(q(".s06-angw"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.05);
      // "sábados": los cuatro sábados aparecen
      qa(".s06-sab").forEach((el, i) => pop(el, 0.9 + i * 0.1, (210 + i * 150) + " 1200"));
      gsap.set(qa(".s06-cruz"), { opacity: 0 });
      // "Hace un mes": se tachan los sábados y la foto se destiñe
      qa(".s06-cruz").forEach((el, i) => dibujar([el], 1.84 + i * 0.18, 0.2));
      tl.to(q(".s06-sen-foto"), { opacity: 0.18, duration: 0.6 }, 2.1);
      etq(".s06-e1", 1.9);
      // "Escribile... escribile...": el angelito se duerme de a poco
      tl.to(q(".s06-ang-pi"), { scaleY: 0.55, svgOrigin: "-21 -267", duration: 0.3 }, 3.5);
      tl.to(q(".s06-ang-pd"), { scaleY: 0.55, svgOrigin: "21 -267", duration: 0.3 }, 3.5);
      tl.to(q(".s06-ang-cab"), { rotation: 12, svgOrigin: "0 -180", duration: 0.5, ease: "sine.inOut" }, 3.6);
      tl.to(q(".s06-ang-halo"), { rotation: 18, y: 10, svgOrigin: "0 -326", duration: 0.5 }, 3.6);
      tl.to(q(".s06-ang-pi"), { scaleY: 1, svgOrigin: "-21 -267", duration: 0.4 }, 4.7);
      tl.to(q(".s06-ang-pd"), { scaleY: 1, svgOrigin: "21 -267", duration: 0.4 }, 4.7);
      tl.to(q(".s06-ang-cab"), { rotation: 22, svgOrigin: "0 -180", duration: 0.5, ease: "sine.inOut" }, 4.8);
      tl.fromTo(q(".s06-zz"), { opacity: 0, y: 20 }, { opacity: 1, y: -20, duration: 0.8 }, 5.0);
    
      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
