<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/kit.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-pelea"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-pelea"] .s01-escenario { position: absolute; inset: 0; }
    [data-composition-id="s01-pelea"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-pelea"] .s01-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; }
    [data-composition-id="s01-pelea"] .s01-perdiendo { top: 560px; font-weight: 900; font-size: 128px; letter-spacing: -0.02em; color: #e5383b; text-shadow: 0 0 40px rgba(229, 56, 59, 0.35); }
    [data-composition-id="s01-pelea"] .s01-marcador { position: absolute; left: 70px; top: 1400px; padding: 10px 20px; background: #0d0e14; border: 4px solid #ffc531; border-radius: 10px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.1em; color: #f5f1e8; white-space: nowrap; }
    [data-composition-id="s01-pelea"] .s01-marcador b { position: relative; display: inline-block; width: 40px; height: 34px; color: #ffc531; font-weight: 500; vertical-align: top; }
    [data-composition-id="s01-pelea"] .s01-marcador b span { position: absolute; left: 0; top: 0; }
    [data-composition-id="s01-pelea"] .s01-n1, [data-composition-id="s01-pelea"] .s01-n2 { opacity: 0; }
    [data-composition-id="s01-pelea"] .s01-ticket { position: absolute; left: 570px; top: 1000px; width: 380px; padding: 22px 24px 26px; background: #f5f1e8; border-radius: 4px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; color: #0d0e14; letter-spacing: 0.06em; line-height: 1.4; }
    [data-composition-id="s01-pelea"] .s01-ticket .s01-tit { font-size: 26px; opacity: 0.6; }
    [data-composition-id="s01-pelea"] .s01-ticket .s01-linea { border-top: 3px dashed #0d0e14; margin: 10px 0; opacity: 0.4; }
    [data-composition-id="s01-pelea"] .s01-vos { position: absolute; left: 610px; top: 1300px; padding: 6px 26px; border: 7px solid #e5383b; border-radius: 12px; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 92px; color: #e5383b; letter-spacing: 0.04em; line-height: 1; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s01-pelea" data-width="1080" data-height="1920" data-duration="5.66">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="5.66" data-track-index="0">
      <div class="s01-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g transform="translate(540 690) scale(1.0)"><g class="s01-robot"></g></g>
          <g transform="translate(30 770) scale(1.12)"><g class="s01-duenio"></g></g>
          <g transform="translate(470 920) scale(0.8)"><g class="s01-pum1"></g></g>
          <g transform="translate(420 1060) scale(0.7)"><g class="s01-pum2"></g></g>
        </svg>
        <div class="s01-txt s01-perdiendo">Perdiendo</div>
        <div class="s01-marcador">GOLPES RECIBIDOS <b class="s01-n"><span class="s01-n0">00</span><span class="s01-n1">01</span><span class="s01-n2">02</span></b></div>
        <div class="s01-ticket">
          <div class="s01-tit">TICKET DE COMPRA</div>
          <div class="s01-linea"></div>
          <div>1 SISTEMA ENLATADO</div>
          <div>MODELO ÚNICO</div>
          <div class="s01-linea"></div>
          <div>COMPRADO POR:</div>
        </div>
        <div class="s01-vos">VOS</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-pelea";
      const DUR = 5.66;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const K = window.KIT;
      q(".s01-robot").innerHTML = K.enlatado({ pantalla: ["LISTO", "JA JA JA"] });
      q(".s01-duenio").innerHTML = K.duenio({ cara: "guardia" });
      q(".s01-pum1").innerHTML = K.estallido("¡PUM!", "#ffc531", "#0d0e14", 60);
      q(".s01-pum2").innerHTML = K.estallido("¡PAF!", "#e5383b", "#f5f1e8", 60);
      const tl = gsap.timeline({ paused: true });

      const PERDIENDO = 0.83, PELEA = 1.58, PEGA = 2.92, SISTEMA = 3.75, COMPRASTE = 4.58;

      // cuadro 0: los dos ya están en el ring; cámara que se acerca
      tl.fromTo(q(".s01-escenario"), { scale: 1.08 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);
      tl.fromTo(q(".s01-robot"), { opacity: 0.4, x: 60 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0);
      // el dueño baila en el lugar
      tl.to(q(".s01-duenio"), { y: 10, duration: 0.25, yoyo: true, repeat: 4, ease: "sine.inOut" }, 0);
      tl.to(q(".s01-robot .k-e-ojoI"), { opacity: 0.3, duration: 0.08, yoyo: true, repeat: 3 }, 0.3);

      // "perdiendo"
      K.golpe(tl, q(".s01-perdiendo"), PERDIENDO);
      K.sacudir(tl, q(".s01-escenario"), PERDIENDO + 0.05, 10);
      K.pop(tl, q(".s01-marcador"), 0.6);

      // "pelea": primer golpe del enlatado
      const golpe = (t, guante, pum, n) => {
        tl.to(q(".s01-robot " + guante), { x: -260, y: 40, duration: 0.12, ease: "power4.in" }, t - 0.12);
        tl.to(q(".s01-robot " + guante), { x: 0, y: 0, duration: 0.3, ease: "power2.out" }, t + 0.12);
        tl.to(q(".s01-duenio"), { x: -60, rotation: -9, svgOrigin: "200 590", duration: 0.1, ease: "power3.out" }, t);
        tl.to(q(".s01-duenio"), { x: 0, rotation: 0, svgOrigin: "200 590", duration: 0.5, ease: "elastic.out(1, 0.5)" }, t + 0.3);
        gsap.set(q(pum), { opacity: 0 });
        tl.fromTo(q(pum), { opacity: 1, scale: 0.3, rotation: -10, svgOrigin: "0 0" }, { scale: 1, rotation: 0, svgOrigin: "0 0", duration: 0.16, ease: "back.out(3)", immediateRender: false }, t);
        tl.to(q(pum), { opacity: 0, scale: 1.3, svgOrigin: "0 0", duration: 0.2 }, t + 0.55);
        K.sacudir(tl, q(".s01-escenario"), t + 0.02, 18);
        ["0", "1", "2"].forEach((k) => tl.set(q(".s01-n" + k), { opacity: k === n ? 1 : 0 }, t));
        tl.fromTo(q(".s01-marcador"), { scale: 1.15 }, { scale: 1, duration: 0.2, immediateRender: false }, t);
      };
      golpe(PELEA, ".k-e-brazoI", ".s01-pum1", "1");
      K.cara(tl, q(".s01-duenio"), "dolor", PELEA);
      golpe(PEGA, ".k-e-brazoI", ".s01-pum2", "2");
      tl.to(q(".s01-duenio .k-d-moreton"), { opacity: 0.85, duration: 0.1 }, PEGA + 0.05);

      // "sistema": la pantalla del enlatado se ríe
      K.pantalla(tl, q(".s01-robot"), 1, SISTEMA - 0.05);
      tl.fromTo(q(".s01-robot .k-e-cabeza"), { rotation: -4, svgOrigin: "250 250" }, { rotation: 4, svgOrigin: "250 250", duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, SISTEMA);
      tl.to(q(".s01-perdiendo"), { opacity: 0.25, duration: 0.2 }, SISTEMA);

      // "que vos mismo compraste": sale el ticket de la caja y cae el sello VOS
      gsap.set(q(".s01-ticket"), { opacity: 0 });
      tl.fromTo(q(".s01-ticket"), { opacity: 1, y: 160, clipPath: "inset(0 0 100% 0)" }, { y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.5, ease: "power2.out", immediateRender: false }, 4.0);
      K.golpe(tl, q(".s01-vos"), COMPRASTE + 0.1, 2.8);
      tl.fromTo(q(".s01-vos"), { rotation: 0 }, { rotation: -8, duration: 0.14, immediateRender: false }, COMPRASTE);
      K.sacudir(tl, q(".s01-escenario"), COMPRASTE + 0.06, 12);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
