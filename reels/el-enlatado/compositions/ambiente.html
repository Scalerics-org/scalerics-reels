  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 76.23;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });

      // el reflector se mece apenas, el humo flota
      tl.fromTo(q(".amb-cono"), { x: -30 }, { x: 30, duration: DUR / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo(q(".amb-h1"), { x: 0 }, { x: 260, duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".amb-h2"), { x: 0 }, { x: -300, duration: DUR, ease: "none" }, 0);
      // el punto rojo de EN VIVO titila
      tl.to(q(".amb-punto"), { opacity: 0.2, duration: 0.5, yoyo: true, repeat: Math.floor(DUR / 0.5) - 1, ease: "steps(1)" }, 0);
      // el público se mueve un poco, y salta en los golpes
      tl.fromTo(q(".amb-fila2"), { y: 0 }, { y: 6, duration: 0.6, yoyo: true, repeat: Math.floor(DUR / 0.6) - 1, ease: "sine.inOut" }, 0);
      gsap.set([q(".amb-brazo1"), q(".amb-brazo2"), q(".amb-brazo3")], { opacity: 0 });

      // golpes (segundos globales): "pelea", "hígado", "mandíbula", "cuerdas", "nocaut"
      const GOLPES = [1.58, 20.14, 28.25, 44.66, 66.0];
      GOLPES.forEach((t, i) => {
        tl.to(q(".amb-flash"), { opacity: 0.3, duration: 0.03 }, t);
        tl.to(q(".amb-flash"), { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.04);
        tl.to(q(".amb-fila1"), { y: -26, duration: 0.15, yoyo: true, repeat: 3, ease: "power2.out" }, t + 0.05);
        const b = [".amb-brazo1", ".amb-brazo2", ".amb-brazo3"][i % 3];
        tl.to(q(b), { opacity: 1, duration: 0.05 }, t + 0.05);
        tl.to(q(b), { opacity: 0, duration: 0.2 }, t + 1.3);
        qa(".amb-flashes circle").forEach((c, k) => {
          tl.to(c, { opacity: 0.95, duration: 0.03 }, t + 0.06 + k * 0.09);
          tl.to(c, { opacity: 0, duration: 0.18 }, t + 0.1 + k * 0.09);
        });
      });

      // el marcador de rounds de la transmisión
      const RONDAS = [[".amb-r0", 0.2, 13.0], [".amb-r1", 13.05, 21.7], [".amb-r2", 21.78, 29.6], [".amb-r3", 29.69, 36.85], [".amb-r4", 36.91, 54.3], [".amb-r5", 54.41, 64.5]];

        tl.fromTo(q(s), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, a);
        tl.to(q(s), { opacity: 0, duration: 0.15 }, b);

      // entra Scalerics: el rincón se tiñe de verde

      tl.to(q(".amb-verde"), { opacity: 0.6, duration: 1 }, 68.9);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
