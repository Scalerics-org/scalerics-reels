<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/kit.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s12-esquina"] .esc-capa { position: absolute; inset: 0; }
    [data-composition-id="s12-esquina"] .esc-escenario { position: absolute; inset: 0; }
    [data-composition-id="s12-esquina"] svg.esc-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s12-esquina"] .txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; font-weight: 900; letter-spacing: -0.01em; }
    [data-composition-id="s12-esquina"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="s12-esquina"] .sello { position: absolute; padding: 8px 24px; border: 7px solid currentColor; border-radius: 12px; font-family: "Lexend", sans-serif; font-weight: 900; line-height: 1; white-space: nowrap; text-transform: uppercase; }
    [data-composition-id="s12-esquina"] .s12-rot { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font-size: 34px; color: #5ce611; }
    [data-composition-id="s12-esquina"] .s12-medida { left: 560px; top: 680px; font-size: 76px; color: #5ce611; background: #0d0e14; transform: rotate(-6deg); }
    [data-composition-id="s12-esquina"] .s12-hecho { position: absolute; left: 0; right: 0; top: 1410px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 800; font-size: 52px; color: #f5f1e8; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="s12-esquina"] .s12-hecho b { color: #5ce611; font-weight: 900; }
  </style>
  <div id="root" data-composition-id="s12-esquina" data-width="1080" data-height="1920" data-duration="4.54">
    <div id="s12-esquina-escena" class="esc-capa clip" data-start="0" data-duration="4.54" data-track-index="0">
      <div class="esc-escenario">

        <svg class="esc-svg" viewBox="0 0 1080 1920" aria-hidden="true">
          <rect x="980" y="560" width="40" height="780" rx="8" fill="#5ce611"/>
          <g transform="translate(470 740) scale(0.88)"><g class="s12-robotM"><g class="s12-robot"></g></g></g>
          <g transform="translate(20 860) scale(0.95)"><g class="s12-duenio"></g></g>
          <g class="s12-cinta" fill="none" stroke-linecap="round">
            <path class="s12-c1" d="M500 1000 Q700 1080 900 1000" stroke="#ffc531" stroke-width="22"/>
            <path class="s12-c2" d="M500 1000 Q700 1080 900 1000" stroke="#0d0e14" stroke-width="4" stroke-dasharray="3 22"/>
            <path class="s12-c3" d="M520 1180 Q700 1250 880 1180" stroke="#ffc531" stroke-width="22"/>
            <path class="s12-c4" d="M520 1180 Q700 1250 880 1180" stroke="#0d0e14" stroke-width="4" stroke-dasharray="3 22"/>
          </g>
        </svg>
        <div class="mono s12-rot">RINCÓN VERDE · SCALERICS</div>
        <div class="sello s12-medida">A medida</div>
        <div class="s12-hecho">Hecho para <b>tu negocio</b></div>

      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s12-esquina";
      const DUR = 4.54;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const K = window.KIT;
      const esc = q(".esc-escenario");
      const tl = gsap.timeline({ paused: true });

      const PANT = ["HOLA, SOCIO", "¿CÓMO TRABAJÁS?", "ANOTADO"];
      q(".s12-robot").innerHTML = K.enlatado({ color: "#5ce611", oscuro: "#2e7a08", etiqueta: "A MEDIDA", lata: "#e9ecf2", ojos: "#f5f1e8", amable: true, modelo: "HECHO PARA VOS", pantalla: PANT, tam: 28, colorPantalla: "#5ce611" });
      q(".s12-duenio").innerHTML = K.duenio({ cara: "guardia" });
      const SCALERICS = 0.32, SISTEMA = 1.37, MEDIDA = 1.8, HECHO = 2.52, TRABAJA = 3.25, NEGOCIO = 3.68;
      // el sistema a medida cae en el rincón verde
      tl.fromTo(q(".s12-robotM"), { y: -700 }, { y: 0, duration: 0.45, ease: "bounce.out" }, 0);
      K.pop(tl, q(".s12-rot"), SCALERICS);
      K.sacudir(tl, esc, 0.3, 12);
      // la cinta de sastre lo mide
      qa(".s12-cinta path").forEach((p, i) => K.dibujar(tl, p, SISTEMA + (i > 1 ? 0.2 : 0), 0.45));
      K.golpe(tl, q(".s12-medida"), MEDIDA, 2.2);
      K.pantalla(tl, q(".s12-robot"), 1, HECHO - 0.1);
      // el dueño entra por la izquierda, con su forma de trabajar
      gsap.set(q(".s12-duenio"), { opacity: 0 });
      tl.fromTo(q(".s12-duenio"), { opacity: 1, x: -460 }, { x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, HECHO);
      tl.to(q(".s12-cinta"), { opacity: 0, duration: 0.2 }, TRABAJA);
      tl.to(q(".s12-medida"), { opacity: 0, duration: 0.2 }, TRABAJA);
      tl.to(q(".s12-robot .k-e-cabeza"), { rotation: -10, svgOrigin: "250 250", duration: 0.25, yoyo: true, repeat: 1 }, TRABAJA);
      K.pantalla(tl, q(".s12-robot"), 2, NEGOCIO);
      K.cara(tl, q(".s12-duenio"), "feliz", NEGOCIO);
      K.golpe(tl, q(".s12-hecho"), NEGOCIO, 1.8);

      // salida
      tl.to(q("#s12-esquina-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
