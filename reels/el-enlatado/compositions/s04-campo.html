<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/kit.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s04-campo"] .esc-capa { position: absolute; inset: 0; }
    [data-composition-id="s04-campo"] .esc-escenario { position: absolute; inset: 0; }
    [data-composition-id="s04-campo"] svg.esc-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s04-campo"] .txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; font-weight: 900; letter-spacing: -0.01em; }
    [data-composition-id="s04-campo"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="s04-campo"] .sello { position: absolute; padding: 8px 24px; border: 7px solid currentColor; border-radius: 12px; font-family: "Lexend", sans-serif; font-weight: 900; line-height: 1; white-space: nowrap; text-transform: uppercase; }
    [data-composition-id="s04-campo"] .s04-form { position: absolute; left: 50px; top: 640px; width: 600px; padding: 26px 30px 30px; background: #0d0e14; border: 5px solid #2f6bff; border-radius: 16px; }
    [data-composition-id="s04-campo"] .s04-tit { font-size: 28px; color: #2f6bff; margin-bottom: 22px; }
    [data-composition-id="s04-campo"] .s04-campo { position: relative; margin-top: 16px; padding: 14px 20px; border: 4px solid rgba(245, 241, 232, 0.4); border-radius: 10px; font-family: "Lexend", sans-serif; font-weight: 600; font-size: 40px; color: #f5f1e8; white-space: nowrap; }
    [data-composition-id="s04-campo"] .s04-campo small { display: block; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.12em; opacity: 0.6; margin-bottom: 4px; }
    [data-composition-id="s04-campo"] .s04-err { border-color: #e5383b; }
    [data-composition-id="s04-campo"] .s04-error { position: absolute; left: 50px; top: 1090px; width: 600px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 64px; line-height: 1.02; color: #e5383b; text-transform: uppercase; }
    [data-composition-id="s04-campo"] .s04-solo { left: 90px; top: 1290px; font-size: 76px; color: #2f6bff; background: #0d0e14; transform: rotate(-6deg); }
    [data-composition-id="s04-campo"] .s04-uni { position: absolute; left: 0; top: 0; }
  </style>
  <div id="root" data-composition-id="s04-campo" data-width="1080" data-height="1920" data-duration="4.27">
    <div id="s04-campo-escena" class="esc-capa clip" data-start="0" data-duration="4.27" data-track-index="0">
      <div class="esc-escenario">

        <svg class="esc-svg" viewBox="0 0 1080 1920" aria-hidden="true">
          <g transform="translate(640 760) scale(0.84)"><g class="s04-robot"></g></g>
        </svg>
        <div class="s04-form">
          <div class="mono s04-tit">NUEVA VENTA</div>
          <div class="s04-campo"><small>PRODUCTO</small>Yerba suelta</div>
          <div class="s04-campo s04-err"><small>CANTIDAD</small><span class="s04-v1">2,5 kg</span><span class="s04-v2 s04-uni" style="left: 20px; top: 46px; opacity: 0">1 unidad</span></div>
        </div>
        <div class="s04-error">Ese campo<br />no existe</div>
        <div class="sello s04-solo">Solo unidades</div>

      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s04-campo";
      const DUR = 4.27;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const K = window.KIT;
      const esc = q(".esc-escenario");
      const tl = gsap.timeline({ paused: true });

      q(".s04-robot").innerHTML = K.enlatado({ pantalla: ["...", "ERROR", "UNIDAD"] });
      const CAMPO = 0.51, EXISTE = 1.28, SOLO = 2.47, UNIDADES = 3.07;
      tl.fromTo(q(".s04-form"), { opacity: 0.4, x: -60 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(q(".s04-robot"), { x: 80 }, { x: 0, duration: 0.4, ease: "power3.out" }, 0);
      // el campo cantidad parpadea en rojo
      tl.fromTo(q(".s04-err"), { x: 0 }, { x: 14, duration: 0.05, yoyo: true, repeat: 7, ease: "none", immediateRender: false }, CAMPO);
      K.pantalla(tl, q(".s04-robot"), 1, CAMPO);
      tl.to(q(".s04-robot .k-e-ojoI"), { fill: "#e5383b", duration: 0.05 }, CAMPO);
      tl.to(q(".s04-robot .k-e-ojoD"), { fill: "#e5383b", duration: 0.05 }, CAMPO);
      K.golpe(tl, q(".s04-error"), EXISTE, 1.8);
      K.sacudir(tl, esc, EXISTE + 0.05, 12);
      // "solo unidades": el 2,5 kg se tacha y queda 1 unidad
      tl.to(q(".s04-v1"), { opacity: 0, duration: 0.1 }, SOLO);
      tl.to(q(".s04-v2"), { opacity: 1, duration: 0.1 }, SOLO);
      K.pantalla(tl, q(".s04-robot"), 2, SOLO);
      tl.to(q(".s04-error"), { opacity: 0.3, duration: 0.2 }, SOLO);
      K.golpe(tl, q(".s04-solo"), UNIDADES, 2.6);
      K.sacudir(tl, esc, UNIDADES + 0.05, 14);
      tl.to(q(".s04-robot .k-e-cabeza"), { rotation: 8, svgOrigin: "250 250", duration: 0.15, yoyo: true, repeat: 3 }, UNIDADES + 0.1);

      // salida
      tl.to(q("#s04-campo-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
