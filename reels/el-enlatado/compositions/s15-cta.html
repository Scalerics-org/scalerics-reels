<template>

  <script src="assets/kit.js"></script>
  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s15-cta"] .esc-capa { position: absolute; inset: 0; }
    [data-composition-id="s15-cta"] .esc-escenario { position: absolute; inset: 0; }
    [data-composition-id="s15-cta"] svg.esc-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s15-cta"] .txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; font-weight: 900; letter-spacing: -0.01em; }
    [data-composition-id="s15-cta"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="s15-cta"] .sello { position: absolute; padding: 8px 24px; border: 7px solid currentColor; border-radius: 12px; font-family: "Lexend", sans-serif; font-weight: 900; line-height: 1; white-space: nowrap; text-transform: uppercase; }
    [data-composition-id="s15-cta"] .s15-quien { top: 596px; font-size: 74px; color: #f5f1e8; }
    [data-composition-id="s15-cta"] .s15-card { position: absolute; top: 760px; width: 440px; height: 520px; border-radius: 22px; border: 8px solid; background: #0d0e14; }
    [data-composition-id="s15-cta"] .s15-neg { left: 60px; border-color: #e5383b; }
    [data-composition-id="s15-cta"] .s15-sis { right: 60px; border-color: #2f6bff; }
    [data-composition-id="s15-cta"] .s15-nom { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 62px; text-transform: uppercase; }
    [data-composition-id="s15-cta"] .s15-neg .s15-nom { color: #e5383b; }
    [data-composition-id="s15-cta"] .s15-sis .s15-nom { color: #2f6bff; }
    [data-composition-id="s15-cta"] .s15-vs { position: absolute; left: 0; right: 0; top: 960px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 70px; color: #ffc531; }
    [data-composition-id="s15-cta"] .s15-coment { position: absolute; left: 0; right: 0; top: 1330px; text-align: center; }
    [data-composition-id="s15-cta"] .s15-coment span { display: inline-block; padding: 14px 30px; background: #ffc531; color: #0d0e14; border-radius: 30px; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 50px; text-transform: uppercase; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s15-cta" data-width="1080" data-height="1920" data-duration="7.24">
    <div id="s15-cta-escena" class="esc-capa clip" data-start="0" data-duration="7.24" data-track-index="0">
      <div class="esc-escenario">

        <div class="s15-card s15-neg"><div class="s15-nom">Negocio</div></div>
        <div class="s15-card s15-sis"><div class="s15-nom">Sistema</div></div>
        <svg class="esc-svg" viewBox="0 0 1080 1920" aria-hidden="true">
          <g transform="translate(160 800) scale(0.6)"><g class="s15-duenio"></g></g>
          <g transform="translate(668 810) scale(0.5)"><g class="s15-enl"></g></g>
        </svg>
        <div class="s15-vs">VS</div>
        <div class="txt s15-quien">¿Quién va ganando?</div>
        <div class="s15-coment"><span>Votá en los comentarios</span></div>

      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s15-cta";
      const DUR = 7.24;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const K = window.KIT;
      const esc = q(".esc-escenario");
      const tl = gsap.timeline({ paused: true });

      q(".s15-duenio").innerHTML = K.duenio({ cara: "guardia" });
      q(".s15-enl").innerHTML = K.enlatado({ pantalla: ["???"] });
      const QUIEN = 0.9, COMENTA = 1.93, NEGOCIO = 2.18, SISTEMA = 3.27;
      tl.fromTo([q(".s15-neg"), q(".s15-sis")], { opacity: 0.3, scale: 0.92 }, { opacity: 0.55, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(q(".s15-duenio"), { opacity: 0.3 }, { opacity: 0.55, duration: 0.4 }, 0);
      tl.fromTo(q(".s15-enl"), { opacity: 0.3 }, { opacity: 0.55, duration: 0.4 }, 0);
      K.golpe(tl, q(".s15-quien"), QUIEN);
      K.sacudir(tl, esc, QUIEN + 0.05, 10);
      K.pop(tl, q(".s15-vs"), QUIEN + 0.3);
      K.pop(tl, q(".s15-coment"), COMENTA);
      // NEGOCIO
      tl.to([q(".s15-neg"), q(".s15-duenio")], { opacity: 1, duration: 0.1 }, NEGOCIO);
      tl.fromTo(q(".s15-neg"), { scale: 1.12 }, { scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, NEGOCIO);
      tl.to(q(".s15-duenio .k-d-brazoD"), { y: -60, duration: 0.15, yoyo: true, repeat: 3 }, NEGOCIO);
      // SISTEMA
      tl.to([q(".s15-sis"), q(".s15-enl")], { opacity: 1, duration: 0.1 }, SISTEMA);
      tl.fromTo(q(".s15-sis"), { scale: 1.12 }, { scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, SISTEMA);
      tl.to(q(".s15-enl .k-e-brazoI"), { y: -60, duration: 0.15, yoyo: true, repeat: 3 }, SISTEMA);
      // queda latiendo, de a uno, hasta el final
      for (let k = 0; k < 6; k++) {
        const t = 4.0 + k * 0.5;
        tl.to(k % 2 ? q(".s15-sis") : q(".s15-neg"), { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      }
      tl.fromTo(q(".s15-coment"), { y: 0 }, { y: -10, duration: 0.3, yoyo: true, repeat: 9, ease: "sine.inOut", immediateRender: false }, COMENTA + 0.4);

      // salida
      tl.to(q("#s15-cta-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
