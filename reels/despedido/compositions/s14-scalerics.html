  <script>
    (function () {
      const ID = "s14-scalerics";
      const DUR = 8.1;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const lista = (s) => (typeof s === "string" ? qa(s) : Array.isArray(s) ? s : [s]);
      const esSVG = (el) => el instanceof SVGElement;
      const centro = (el) => { const b = el.getBBox(); return (b.x + b.width / 2) + " " + (b.y + b.height / 2); };
      const origen = (el, o) => (esSVG(el) && !(o && o.includes("%")) ? { svgOrigin: o || centro(el) } : { transformOrigin: o || "50% 50%" });
      // trazo que se dibuja; desde = fracción ya dibujada en el cuadro 0
      const dibujar = (s, t, d = 0.6, desde = 0) => lista(s).forEach((el) => {
        const L = el.getTotalLength() + 2;
        const ya = t <= 0 && desde > 0;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - desde), opacity: ya ? 1 : 0 });
        if (!ya) tl.to(el, { opacity: 1, duration: 0.01 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote
      const pop = (s, t, de = 0.6, o) => lista(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: de, ...origen(el, o) }, { opacity: 1, scale: 1, ...origen(el, o), duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe (palabra clave)
      const golpe = (s, t, de = 2.4, o) => lista(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: de, ...origen(el, o) }, { opacity: 1, scale: 1, ...origen(el, o), duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      });
      const sacudon = (t, f = 1) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s14-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // sello de marcador: golpe + sacudón
      const sello = (s, t, rot = -7) => { lista(s).forEach((el) => gsap.set(el, { rotation: rot })); golpe(s, t, 2.2); sacudon(t + 0.04, 0.9); };
      // birome que escribe de izquierda a derecha
      const escribir = (s, t, d = 0.5) => lista(s).forEach((el) => {
        gsap.set(el, { clipPath: "inset(-30% 100% -30% -8%)", opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.01 }, t);
        tl.to(el, { clipPath: "inset(-30% -12% -30% -8%)", duration: d, ease: "power1.inOut" }, t);
      });
      // respiración (algo se mueve siempre)
      const flotar = (s, t, d, y = -8) => lista(s).forEach((el) => tl.to(el, { y, duration: d / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, t));

      // la hoja de ayer se arranca: se despega de la esquina izquierda y cae girando
      const vieja = q(".s14-vieja");
      tl.fromTo(vieja, { rotation: 0, transformOrigin: "100% 0%" }, { rotation: -4, transformOrigin: "100% 0%", duration: 0.12, ease: "power2.out" }, 0);
      tl.to(vieja, { rotation: 28, x: -260, y: 1250, transformOrigin: "100% 0%", duration: 0.62, ease: "power2.in" }, 0.12);
      tl.to(vieja, { opacity: 0, duration: 0.1 }, 0.66);
      // el día nuevo entra de golpe
      golpe(q(".s14-hoja .s14-dia"), 0.22, 1.8);
      sacudon(0.16, 0.7);


      qa(".s14-agpos .s14-ojo, .s14-ag-bolita").forEach((e) => gsap.set(e, { fill: "#5ce611" }));
      pop(q(".s14-rot"), 0.29, 0.6, "0% 50%");
      pop(q(".s14-agpos"), 0.5, 0.5, "50% 100%");
      // el agente trabaja: se balancea y teclea
      [1.2, 2.4, 3.6, 4.8, 6.0].forEach((t) => tl.to(q(".s14-agpos"), { rotation: 4, transformOrigin: "50% 100%", duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, t));
      const T = [2.48,3.62,4.19,5.81,7.33];
      qa(".s14-item").forEach((el, i) => escribir(el, T[i] - 0.55, 0.5));
      qa(".s14-tic").forEach((el, i) => dibujar(el, T[i] - 0.1, 0.2));
  

      // salida: se borra lo dibujado; la hoja queda (la escena siguiente arranca con ella)
      tl.to(q(".s14-contenido"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
