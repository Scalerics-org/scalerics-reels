  <script>
    (function () {
      const ID = "s01-lunes";
      const DUR = 6.5;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const lista = (s) => (typeof s === "string" ? qa(s) : Array.isArray(s) ? s : [s]);
      const esSVG = (el) => el instanceof SVGElement;
      const centro = (el) => { const b = el.getBBox(); return (b.x + b.width / 2) + " " + (b.y + b.height / 2); };
      const origen = (el, o) => (esSVG(el) && !(o && o.includes("%")) ? { svgOrigin: o || centro(el) } : { transformOrigin: o || "50% 50%" });
      // trazo que se dibuja; desde = fracción ya dibujada en el cuadro 0
      const dibujar = (s, t, d = 0.6, desde = 0) => lista(s).forEach((el) => {
        const L = el.getTotalLength() + 2;
        const ya = t <= 0 && desde > 0;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - desde), opacity: ya ? 1 : 0 });
        if (!ya) tl.to(el, { opacity: 1, duration: 0.01 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote
      const pop = (s, t, de = 0.6, o) => lista(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: de, ...origen(el, o) }, { opacity: 1, scale: 1, ...origen(el, o), duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe (palabra clave)
      const golpe = (s, t, de = 2.4, o) => lista(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: de, ...origen(el, o) }, { opacity: 1, scale: 1, ...origen(el, o), duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      });
      const sacudon = (t, f = 1) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // sello de marcador: golpe + sacudón
      const sello = (s, t, rot = -7) => { lista(s).forEach((el) => gsap.set(el, { rotation: rot })); golpe(s, t, 2.2); sacudon(t + 0.04, 0.9); };
      // birome que escribe de izquierda a derecha
      const escribir = (s, t, d = 0.5) => lista(s).forEach((el) => {
        gsap.set(el, { clipPath: "inset(-30% 100% -30% -8%)", opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.01 }, t);
        tl.to(el, { clipPath: "inset(-30% -12% -30% -8%)", duration: d, ease: "power1.inOut" }, t);
      });
      // respiración (algo se mueve siempre)
      const flotar = (s, t, d, y = -8) => lista(s).forEach((el) => tl.to(el, { y, duration: d / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, t));


      // cuadro 0: la hoja LUNES y el agente a medio dibujar
      dibujar(qa(".s01-agente .tinta"), 0, 0.45, 0.45);
      pop(qa(".s01-agente .s01-ojo"), 0.12, 0.2);
      // "despedí": aparece la caja de cartón con la plantita
      dibujar(qa(".s01-caja .tinta"), 0.4, 0.45);
      tl.to(q(".s01-ag-boca"), { attr: { d: "M-24 -152 Q0 -170 24 -152" }, duration: 0.2 }, 0.6);
      flotar(q(".s01-agpos"), 0.9, 0.8, -6);
      // "IA": sello DESPEDIDO
      sello(q(".s01-despedido"), 1.71, -9);
      // "ahorrar": chanchito de birome y moneda que cae
      dibujar(qa(".s01-chancho .azul"), 2.45, 0.45);
      pop(q(".s01-chancho circle"), 2.7, 0.2);
      gsap.set(q(".s01-moneda"), { opacity: 0 });
      tl.fromTo(q(".s01-moneda"), { opacity: 0, y: -60 }, { opacity: 1, y: 70, duration: 0.35, ease: "power2.in", immediateRender: false }, 2.67);
      tl.to(q(".s01-moneda"), { opacity: 0, duration: 0.05 }, 3.02);
      tl.fromTo(q(".s01-chancho"), { scale: 1 }, { scale: 1.08, svgOrigin: "760 1080", duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, 3.02);
      escribir(q(".s01-nota1"), 2.9, 0.5);
      // "Total": el agente se va caminando con su caja, se borra el sello
      tl.to(q(".s01-despedido"), { opacity: 0, scale: 0.9, duration: 0.2 }, 2.5);
      tl.to(q(".s01-agpos"), { x: 560, duration: 1.1, ease: "power1.in" }, 3.78);
      tl.to(q(".s01-agpos"), { opacity: 0, duration: 0.3 }, 4.6);
      [0, 1, 2, 3, 4].forEach((i) => tl.to(q(".s01-agpos"), { y: -14, duration: 0.11, yoyo: true, repeat: 1, ease: "sine.out" }, 3.78 + i * 0.22));
      tl.to([q(".s01-chancho"), q(".s01-nota1")], { opacity: 0, duration: 0.25 }, 4.2);
      // entra el dueño, sobrado, con el celular en alto
      gsap.set(q(".s01-dupos"), { opacity: 0 });
      tl.fromTo(q(".s01-dupos"), { opacity: 0, x: -460 }, { opacity: 1, x: -110, duration: 0.5, ease: "back.out(1.4)", immediateRender: false }, 4.3);
      tl.to(q(".s01-dupos"), { rotation: -4, transformOrigin: "50% 100%", duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.85);
      // "cualquiera": nota "contestar: YO" con flecha y círculo rojo
      escribir(q(".s01-nota2"), 5.3, 0.45);
      dibujar(q(".s01-flecha"), 5.5, 0.3);
      dibujar(q(".s01-circulo"), 5.6, 0.4);
  

      // salida: se borra lo dibujado; la hoja queda (la escena siguiente arranca con ella)
      tl.to(q(".s01-contenido"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
