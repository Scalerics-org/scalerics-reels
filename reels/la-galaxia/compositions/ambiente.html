<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    [data-composition-id="ambiente"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="ambiente"] .amb-verde { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 700px 620px at 540px 1000px, rgba(92, 230, 17, 0.12) 0%, rgba(92, 230, 17, 0) 75%); }
    [data-composition-id="ambiente"] .amb-alarma { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 620px 620px at 0% 0%, rgba(229, 72, 77, 0.42), rgba(229, 72, 77, 0) 70%), radial-gradient(ellipse 620px 620px at 100% 100%, rgba(229, 72, 77, 0.42), rgba(229, 72, 77, 0) 70%); }
    [data-composition-id="ambiente"] .amb-flash { position: absolute; inset: 0; background: #f2f0e6; opacity: 0; }
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 760px 1120px at 540px 920px, rgba(3, 4, 10, 0) 55%, rgba(3, 4, 10, 0.85) 100%); }
    [data-composition-id="ambiente"] .amb-ep { position: absolute; left: 0; right: 0; top: 138px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-ep1 { color: #ffd21f; }
    [data-composition-id="ambiente"] .amb-ep2 { color: #5ce611; opacity: 0; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="76.26">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="76.26" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="amb-lejos" fill="#f2f0e6" opacity="0.45"></g>
        <g class="amb-medio" fill="#f2f0e6" opacity="0.7"></g>
        <g class="amb-cerca" fill="#f2f0e6"></g>
        <g class="amb-hiper" stroke="#f2f0e6" stroke-width="3" stroke-linecap="round" opacity="0"></g>
      </svg>
      <div class="amb-verde"></div>
      <div class="amb-vineta"></div>
      <div class="amb-alarma"></div>
      <div class="amb-ep amb-ep1">Episodio IV · La amenaza del visto</div>
      <div class="amb-ep amb-ep2">Episodio V · El agente contraataca</div>
      <div class="amb-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 76.26;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      // estrellas con una semilla fija (determinista)
      let s = 1234567;
      const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
      const estrellas = (g, n, r0, r1, alto) => {
        for (let i = 0; i < n; i++) {
          const c = document.createElementNS(NS, "circle");
          c.setAttribute("cx", (rnd() * 1080).toFixed(1));
          c.setAttribute("cy", (rnd() * alto).toFixed(1));
          c.setAttribute("r", (r0 + rnd() * (r1 - r0)).toFixed(2));
          g.appendChild(c);
        }
      };
      // cada capa tiene el doble de alto para derivar hacia abajo sin cortes
      estrellas(q(".amb-lejos"), 220, 0.8, 1.6, 3840);
      estrellas(q(".amb-medio"), 110, 1.4, 2.4, 3840);
      estrellas(q(".amb-cerca"), 40, 2.2, 3.6, 3840);
      // rayas del hiperespacio, desde el centro hacia afuera
      for (let i = 0; i < 64; i++) {
        const a = rnd() * Math.PI * 2, r0 = 120 + rnd() * 220, r1 = r0 + 260 + rnd() * 520;
        const l = document.createElementNS(NS, "line");
        l.setAttribute("x1", (540 + Math.cos(a) * r0).toFixed(1)); l.setAttribute("y1", (960 + Math.sin(a) * r0).toFixed(1));
        l.setAttribute("x2", (540 + Math.cos(a) * r1).toFixed(1)); l.setAttribute("y2", (960 + Math.sin(a) * r1).toFixed(1));
        q(".amb-hiper").appendChild(l);
      }
      // TIEMPOS (segundos globales)
      const GUERRA = 6.61, SCALERICS = 52.2, COMPETENCIA = 37.82, NO = 39.76, IMPOSIBLE = 65.23;

      // deriva lenta de las estrellas (parallax)
      tl.fromTo(q(".amb-lejos"), { y: -1920 }, { y: -1920 + 260, duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".amb-medio"), { y: -1920 }, { y: -1920 + 620, duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".amb-cerca"), { y: -1920 }, { y: -1920 + 1400, duration: DUR, ease: "none" }, 0);
      // titileo
      tl.fromTo(q(".amb-cerca"), { opacity: 0.75 }, { opacity: 1, duration: 1.3, yoyo: true, repeat: Math.floor(DUR / 1.3) - 1, ease: "sine.inOut" }, 0);

      // saltos al hiperespacio
      const salto = (t, color) => {
        tl.set(q(".amb-hiper"), { stroke: color }, t - 0.3);
        tl.fromTo(q(".amb-hiper"), { opacity: 0, scale: 0.4, svgOrigin: "540 960" }, { opacity: 0.9, scale: 1.25, svgOrigin: "540 960", duration: 0.35, ease: "power3.in", immediateRender: false }, t - 0.3);
        tl.to(q(".amb-hiper"), { opacity: 0, scale: 1.8, svgOrigin: "540 960", duration: 0.35, ease: "power2.out" }, t + 0.05);
      };
      salto(GUERRA, "#f2f0e6");
      salto(SCALERICS, "#5ce611");

      // flash en "guerra"
      tl.to(q(".amb-flash"), { opacity: 0.6, duration: 0.03 }, GUERRA - 0.02);
      tl.to(q(".amb-flash"), { opacity: 0, duration: 0.4, ease: "power2.out" }, GUERRA + 0.02);

      // alarma roja
      [COMPETENCIA, NO, IMPOSIBLE].forEach((t) => tl.to(q(".amb-alarma"), { opacity: 1, duration: 0.1, yoyo: true, repeat: 3, ease: "steps(1)" }, t - 0.02));

      // el episodio cambia cuando entra Scalerics; nebulosa verde
      tl.to(q(".amb-ep1"), { opacity: 0, y: -16, duration: 0.25 }, SCALERICS - 0.1);
      tl.fromTo(q(".amb-ep2"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, SCALERICS + 0.1);
      tl.to(q(".amb-verde"), { opacity: 1, duration: 1.2, ease: "power1.out" }, SCALERICS);
      tl.to(q(".amb-verde"), { opacity: 0.6, duration: 0.6, ease: "power1.in" }, IMPOSIBLE - 0.2);
      tl.to(q(".amb-verde"), { opacity: 1, duration: 0.8 }, IMPOSIBLE + 1.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
