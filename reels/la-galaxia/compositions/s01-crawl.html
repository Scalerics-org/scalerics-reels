      const DUR = 6.05;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      const APAGA = 2.95, TITULO = 3.0, CRAWL = 3.75, VISTO = 5.3;

      // la línea azul: las primeras palabras ya están a medio encender en el cuadro 0
      qa(".s01-azul span").forEach((w, i) => {
        gsap.set(w, { opacity: i < 2 ? 0.6 : 0.12 });
        tl.to(w, { opacity: 1, duration: 0.25, ease: "power2.out" }, T[i]);

      tl.fromTo(q(".s01-azul"), { y: 10 }, { y: -10, duration: APAGA, ease: "none" }, 0);

      tl.to(q(".s01-persp"), { opacity: 1, duration: 0.3 }, CRAWL);
      tl.fromTo(q(".s01-texto"), { y: 640 }, { y: -200, duration: DUR - CRAWL, ease: "none" }, CRAWL);

      // "visto": doble tilde azul que se clava

      tl.fromTo(q(".s01-tildes"), { opacity: 0, scale: 2.2, svgOrigin: "540 1095" }, { opacity: 1, scale: 1, svgOrigin: "540 1095", duration: 0.16, ease: "power4.in", immediateRender: false }, VISTO - 0.12);
