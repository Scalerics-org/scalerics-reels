  <script>
    (function () {
      const ID = "s01-truco";
      const DUR = 6.21;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = ".s01-escenario";
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(ESC), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, desde = 2.4) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const pop = (sel, t, extra = {}) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 0.7, ...extra }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      const entra = (sel, t, desde = { x: -600 }) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, t);
      };
      const dibujar = (sel, t, d = 0.5) => qa(sel).forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // vaivén suave (respira) de t a t+d
      const respira = (sel, t, d, dy = 8, per = 0.5) => tl.fromTo(q(sel), { y: 0 }, { y: dy, duration: per, yoyo: true, repeat: Math.max(1, Math.round(d / per) | 1), ease: "sine.inOut", immediateRender: false }, t);
      // destellos: estrellitas que titilan (escala 0 -> 1 -> 0, con giro)
      const destello = (sel, t, n = 2) => qa(sel).forEach((el, k) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 1, scale: 0, rotation: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 90, duration: 0.25, ease: "back.out(2)", yoyo: true, repeat: n * 2 - 1, repeatDelay: 0.12, immediateRender: false }, t + k * 0.09);
      });
      // humo: puf que se agranda y se desvanece
      const puf = (sel, t) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.1, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
        tl.to(q(sel), { opacity: 0, scale: 1.35, duration: 0.5, ease: "power1.in" }, t + 0.35);
      };
      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.4, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);

      const TRUCO = 1.35, DESAP = 2.67, TRES = 3.08, HORAS = 4.46, VIDA = 5.17;
      // cuadro 0: el mago ya está, a media luz, y se acerca
      gsap.set(q(".s01-mago"), { opacity: 0.5 });
      tl.fromTo(q(".s01-mago"), { scale: 0.94, svgOrigin: "400 1500" }, { scale: 1, svgOrigin: "350 1500", duration: 1.4, ease: "power2.out" }, 0);
      tl.to(q(".s01-mago"), { opacity: 1, duration: 0.3 }, 0.15);
      tl.fromTo(q(".s01-haz"), { opacity: 0.04 }, { opacity: 0.16, duration: 0.4, ease: "power2.out" }, 0);
      habla(".s01-boca", 0, 1.2, "180 300");
      tl.fromTo(q(".s01-ceja"), { y: 0 }, { y: -10, duration: 0.2, yoyo: true, repeat: 3, immediateRender: false }, 0.3);
      // "truco": la varita tira chispas
      tl.fromTo(q(".s01-brazo"), { rotation: 0, svgOrigin: "276 418" }, { rotation: -14, svgOrigin: "276 418", duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, TRUCO - 0.1);
      destello(".s01-d1 path", TRUCO, 2);
      // aparece el reloj (las tres horas)
      pop(".s01-rel", DESAP - 0.3);
      tl.fromTo(q(".s01-aguja-m"), { rotation: 0, svgOrigin: "830 1170" }, { rotation: 1080, svgOrigin: "830 1170", duration: 2.2, ease: "power1.in", immediateRender: false }, DESAP);
      tl.fromTo(q(".s01-aguja-h"), { rotation: 0, svgOrigin: "830 1170" }, { rotation: 90, svgOrigin: "830 1170", duration: 2.2, ease: "power1.in", immediateRender: false }, DESAP);
      habla(".s01-boca", DESAP, 2.2, "180 300");
      // TRES HORAS
      gsap.set(q(".s01-t2"), { opacity: 0 });
      golpe(".s01-t1", TRES, 2.2);
      sacudon(TRES + 0.04, 0.8);
      golpe(".s01-t2", HORAS, 2.4);
      sacudon(HORAS + 0.04, 1.2);
      tl.to(q(".s01-rel"), { scale: 1.15, svgOrigin: "830 1170", duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut" }, TRES + 0.3);
      // "de tu vida": ¡puf! el reloj desaparece
      tl.to(q(".s01-brazo"), { rotation: -30, svgOrigin: "276 418", duration: 0.15, ease: "power3.out" }, VIDA - 0.3);
      puf(".s01-puf", VIDA - 0.1);
      tl.to(q(".s01-rel"), { opacity: 0, scale: 0.3, svgOrigin: "830 1170", duration: 0.2, ease: "power2.in" }, VIDA);
      destello(".s01-d2 path", VIDA + 0.05, 2);
      pop(".s01-vida", VIDA, { rotation: -4 });
      tl.to(q(".s01-tres"), { scale: 1.05, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, VIDA + 0.2);

      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
