    (function () {
      const ID = "s03-voluntario";
      const DUR = 7.4;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = ".s03-escenario";
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(ESC), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const pop = (sel, t, extra = {}) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 0.7, ...extra }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      const entra = (sel, t, desde = { x: -600 }) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, t);
      };
      const dibujar = (sel, t, d = 0.5) => qa(sel).forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // vaivén suave (respira) de t a t+d
      const respira = (sel, t, d, dy = 8, per = 0.5) => tl.fromTo(q(sel), { y: 0 }, { y: dy, duration: per, yoyo: true, repeat: Math.max(1, Math.round(d / per) | 1), ease: "sine.inOut", immediateRender: false }, t);
      // destellos: estrellitas que titilan (escala 0 -> 1 -> 0, con giro)
      const destello = (sel, t, n = 2) => qa(sel).forEach((el, k) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 1, scale: 0, rotation: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 90, duration: 0.25, ease: "back.out(2)", yoyo: true, repeat: n * 2 - 1, repeatDelay: 0.12, immediateRender: false }, t + k * 0.09);
      });
      // humo: puf que se agranda y se desvanece
      const puf = (sel, t) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.1, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
        tl.to(q(sel), { opacity: 0, scale: 1.35, duration: 0.5, ease: "power1.in" }, t + 0.35);
      };
      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.4, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);

      const MAXI = 0.33, NECESITA = 1.07, VOLUNTARIO = 1.89, USTED = 2.87, LOCAL = 3.86, BUENO = 4.63, RAPIDITO = 5.56, PEDIDOS = 6.49;
      // la asistente presenta
      tl.fromTo(q(".s03-asis"), { x: -120, opacity: 0.6 }, { x: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
      habla(".s03-boca", 0, 2.6, "180 292");
      tl.fromTo(q(".s03-brazo"), { rotation: 20, svgOrigin: "268 420" }, { rotation: -10, svgOrigin: "268 420", duration: 0.3, ease: "back.out(2)" }, 0.1);
      golpe(".s03-titulo", MAXI, 2.0);
      sacudon(MAXI + 0.04, 0.8);
      destello(".s03-d1 path", MAXI + 0.1, 3);
      // voluntario: el foco barre al público
      gsap.set(q(".s03-sala"), { opacity: 0 });
      tl.to([q(".s03-titulo"), q(".s03-asis")], { opacity: 0, y: -60, duration: 0.25, ease: "power2.in" }, VOLUNTARIO - 0.3);
      tl.to(q(".s03-sala"), { opacity: 1, duration: 0.2 }, VOLUNTARIO - 0.1);
      tl.fromTo(q(".s03-foco"), { rotation: 30, svgOrigin: "560 0" }, { rotation: -22, svgOrigin: "560 0", duration: 0.5, ease: "sine.inOut", immediateRender: false }, VOLUNTARIO);
      tl.to(q(".s03-foco"), { rotation: 0, svgOrigin: "560 0", duration: 0.35, ease: "back.out(2)" }, USTED - 0.4);
      tl.fromTo(q(".s03-el"), { opacity: 0.4 }, { opacity: 1, duration: 0.1, immediateRender: false }, USTED - 0.05);
      tl.fromTo(q(".s03-foco"), { opacity: 0.09 }, { opacity: 0.2, duration: 0.1, immediateRender: false }, USTED - 0.05);
      pop(".s03-cl", LOCAL - 0.1, { rotation: -4 });
      tl.fromTo(q(".s03-el"), { y: 0 }, { y: -18, duration: 0.15, yoyo: true, repeat: 3, immediateRender: false }, LOCAL);
      // "bueno, pero rapidito": sube al escenario con el celular
      gsap.set(q(".s03-esc"), { opacity: 0 });
      tl.to([q(".s03-sala"), q(".s03-cl")], { opacity: 0, duration: 0.2 }, BUENO - 0.2);
      tl.fromTo(q(".s03-esc"), { opacity: 1, x: -900 }, { opacity: 1, x: -170, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, BUENO - 0.1);
      habla(".s03b-boca", BUENO, 2.5, "180 294");
      tl.fromTo(q(".s03b-pantalla"), { opacity: 0.5 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 7, immediateRender: false }, RAPIDITO);
      pop(".s03-n1", RAPIDITO - 0.2, { x: 80 }); pop(".s03-n2", PEDIDOS - 0.35, { x: 80 }); pop(".s03-n3", PEDIDOS, { x: 80 });

      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
