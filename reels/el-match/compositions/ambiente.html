<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    [data-composition-id="ambiente"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="ambiente"] .amb-cor { fill: none; stroke: #ff5a6e; stroke-width: 4; stroke-linejoin: round; }
    [data-composition-id="ambiente"] .amb-cor.v { stroke: #9b6bff; }
    [data-composition-id="ambiente"] .amb-cor.b { stroke: #fff7f4; }
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 760px 1120px at 540px 920px, rgba(18, 8, 32, 0) 55%, rgba(18, 8, 32, 0.85) 100%); }
    [data-composition-id="ambiente"] .amb-rotulo { position: absolute; right: 60px; top: 1600px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.16em; color: #b9a8d6; opacity: 0.7; text-align: right; line-height: 1.5; }
    [data-composition-id="ambiente"] .amb-rotulo b { color: #ff5a6e; font-weight: 500; }
    [data-composition-id="ambiente"] .amb-latido { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 560px 560px at 0% 50%, rgba(255, 90, 110, 0.32), rgba(255, 90, 110, 0) 70%), radial-gradient(ellipse 560px 560px at 100% 50%, rgba(255, 90, 110, 0.32), rgba(255, 90, 110, 0) 70%); }
    [data-composition-id="ambiente"] .amb-flash { position: absolute; inset: 0; background: #fff7f4; opacity: 0; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="68.97">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="68.97" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true" class="amb-corazones"></svg>
      <div class="amb-vineta"></div>
      <div class="amb-latido"></div>
      <div class="amb-rotulo" data-layout-ignore><b>&#9829;</b> CORAZONADA<br />MODO COACH</div>
      <div class="amb-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 68.97;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // corazoncitos de línea que suben despacio por los costados (posiciones fijas, sin azar)
      const svg = q(".amb-corazones");
      const NS = "http://www.w3.org/2000/svg";
      const COR = "M0 -6 C-6 -18 -26 -14 -24 2 C-22 14 -8 22 0 30 C8 22 22 14 24 2 C26 -14 6 -18 0 -6 Z";
      const H = [
        [70, 0.9, 0, ""], [1010, 0.7, 4, "v"], [130, 0.6, 9, "b"], [960, 1.0, 13, ""], [60, 0.8, 18, "v"],
        [1020, 0.6, 22, "b"], [110, 1.0, 27, ""], [980, 0.8, 31, "v"], [80, 0.7, 36, "b"], [1000, 0.9, 40, ""],
        [140, 0.8, 45, "v"], [950, 0.7, 49, "b"], [70, 1.0, 54, ""], [1015, 0.8, 58, "v"], [120, 0.6, 62, ""],
      ];
      H.forEach(([x, s, t0, c], i) => {
        const g = document.createElementNS(NS, "g");
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", COR);
        p.setAttribute("class", "amb-cor " + c);
        g.appendChild(p);
        svg.appendChild(g);
        const dur = 11 + (i % 3) * 2;
        const ini = Math.max(0, t0 - 6);
        const d = Math.min(dur, DUR - ini);
        gsap.set(g, { x, y: 1980, scale: s, opacity: 0 });
        tl.fromTo(g, { x, y: t0 >= 6 ? 1980 : 1980 - (6 - t0) * 120, opacity: 0.35 }, { y: 1980 - d * 120, x: x + (i % 2 ? -30 : 30), duration: d, ease: "none", immediateRender: false }, ini);
        tl.to(g, { opacity: 0, duration: 1.2 }, ini + d - 1.2);
      });

      // latido coral (segundos globales): "clientes", "serio", "Match"
      [[6.2, 2], [26.35, 2], [60.6, 3]].forEach(([t, n]) => {
        for (let k = 0; k < n; k++) {
          tl.to(q(".amb-latido"), { opacity: 1, duration: 0.1, ease: "power2.out" }, t + k * 0.42);
          tl.to(q(".amb-latido"), { opacity: 0, duration: 0.28, ease: "power2.in" }, t + k * 0.42 + 0.1);
        }
      });

      // destello: entra Scalerics
      tl.to(q(".amb-flash"), { opacity: 0.55, duration: 0.03 }, 42.58);
      tl.to(q(".amb-flash"), { opacity: 0, duration: 0.35, ease: "power2.out" }, 42.62);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
