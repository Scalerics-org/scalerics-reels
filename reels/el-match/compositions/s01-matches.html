          <div class="s01-grilla">

            <div class="s01-av c" style="left:240px;top:0"><svg viewBox="0 0 96 96"><circle class="nf" cx="48" cy="38" r="16" /><path class="nf" d="M18 92 Q22 62 48 60 Q74 62 78 92" /></svg><i></i></div>

  <script>
    (function () {
      const ID = "s01-matches";
      const DUR = 7.36;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const MATCHES = 0.94, NINGUNO = 3.02, ASI = 4.29, PAREJA = 5.09, CLIENTES = 6.2;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.02);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.02);
        });
      };
      const pop = (el, t, desde = 0.85) => tl.fromTo(el, { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      // golpe: el escenario tiembla
      const golpe = (t, f = 10) => tl.fromTo(q(".s01-escenario"), { x: -f }, { x: 0, duration: 0.3, ease: "elastic.out(1, 0.3)", immediateRender: false }, t);

      // cuadro 0: la coach a medio dibujar, el celular ya está
      dibujar(qa(".s01-l"), 0, 0.8, 0.45);
      tl.fromTo(q(".s01-cel"), { opacity: 0.6, scale: 0.94, rotation: -4 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.5)" }, 0);
      // "Veintisiete": el contador sube de 0 a 27
      const cnt = { v: 0 };
      tl.to(cnt, { v: 27, duration: 0.9, ease: "power2.out", onUpdate: () => { q(".s01-num").textContent = Math.round(cnt.v); } }, 0.05);
      tl.fromTo(q(".s01-num"), { scale: 0.7 }, { scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.05);
      // "matches": etiqueta y la grilla de perfiles con su puntito de "sin leer"
      gsap.set([q(".s01-lbl"), ...qa(".s01-av"), q(".s01-msj")], { opacity: 0 });
      tl.fromTo(q(".s01-lbl"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, MATCHES - 0.05);
      qa(".s01-av").forEach((a, i) => pop(a, MATCHES + 0.1 + i * 0.08, 0.5));
      qa(".s01-av i").forEach((d, i) => tl.to(d, { scale: 1.35, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.8 + i * 0.06));
      tl.fromTo(q(".s01-num"), { scale: 1 }, { scale: 1.1, duration: 0.14, yoyo: true, repeat: 1, immediateRender: false }, MATCHES);
      // "no le escribiste a ninguno": la caja de mensaje vacía titila, y cae el sello
      tl.fromTo(q(".s01-msj"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, 2.1);
      tl.to(q(".s01-msj"), { opacity: 0.4, duration: 0.12, yoyo: true, repeat: 3, ease: "steps(1)" }, 2.5);
      gsap.set(q(".s01-sello"), { opacity: 0 });
      tl.fromTo(q(".s01-sello"), { opacity: 0, scale: 2.2, rotation: -16 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.22, ease: "power4.in", immediateRender: false }, NINGUNO - 0.18);
      golpe(NINGUNO + 0.04, 14);
      // la coach levanta la ceja ("así no vas a conseguir...")
      tl.to(q(".s01-ceja"), { y: -12, duration: 0.2, ease: "back.out(2)" }, ASI);
      tl.to(q(".s01-coach"), { rotation: -3, svgOrigin: "230 1500", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, ASI);
      tl.to(q(".s01-sello"), { opacity: 0, scale: 0.9, duration: 0.2 }, PAREJA - 0.3);
      // "pareja": el corazón coral entra y late
      gsap.set(q(".s01-corazon"), { opacity: 0 });
      tl.fromTo(q(".s01-corazon"), { opacity: 0, scale: 0.3, svgOrigin: "660 950" }, { opacity: 1, scale: 1, svgOrigin: "660 950", duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, PAREJA - 0.15);
      tl.to(q(".s01-corazon"), { scale: 1.1, svgOrigin: "660 950", duration: 0.16, yoyo: true, repeat: 3, ease: "sine.inOut" }, PAREJA + 0.25);
      // "Ni clientes": se parte en dos y cae; el celular se apaga
      tl.to(q(".s01-izq"), { x: -60, y: 160, rotation: -24, svgOrigin: "0 170", duration: 0.7, ease: "power2.in" }, CLIENTES);
      tl.to(q(".s01-der"), { x: 60, y: 160, rotation: 24, svgOrigin: "0 170", duration: 0.7, ease: "power2.in" }, CLIENTES);
      tl.to(q(".s01-corazon"), { opacity: 0, duration: 0.3 }, CLIENTES + 0.5);
      tl.to(q(".s01-cel"), { opacity: 0.45, duration: 0.25 }, CLIENTES);
      tl.to(q(".s01-msj"), { opacity: 0, duration: 0.15 }, CLIENTES - 0.15);
      gsap.set(q(".s01-ni"), { opacity: 0 });
      tl.fromTo(q(".s01-ni"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.in", immediateRender: false }, CLIENTES - 0.1);
      golpe(CLIENTES + 0.1, 16);
      tl.to(q(".s01-boca"), { scaleY: -1, svgOrigin: "236 1150", duration: 0.2 }, CLIENTES + 0.15);

      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
