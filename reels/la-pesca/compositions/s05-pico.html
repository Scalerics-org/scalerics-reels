<template>

  <script src="assets/pesca.js"></script>
  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }

    [data-composition-id="s05-pico"] .s05-p2 { left: 520px; top: 760px; font-size: 104px; }
    [data-composition-id="s05-pico"] .s05-recoge { position: absolute; left: 0; width: 1080px; top: 1440px; text-align: center; }
    [data-composition-id="s05-pico"] .s05-desp { position: absolute; left: 620px; top: 900px; font-family: "Caveat", cursive; font-weight: 700; font-size: 84px; color: #fff1d6; white-space: nowrap; text-shadow: 0 5px 0 #0d1b24, 3px 3px 0 #0d1b24, -3px -3px 0 #0d1b24, 3px -3px 0 #0d1b24, -3px 3px 0 #0d1b24; }

  </style>
  <div id="root" data-composition-id="s05-pico" data-width="1080" data-height="1920" data-duration="3.80">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="3.80" data-track-index="0">
      <div class="s05-escenario">
        <svg class="s05-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="pe-sello s05-p1">¡PICÓ!</div>
        <div class="pe-sello s05-p2">¡PICÓ!</div>
        <div class="s05-desp">despacito...</div>
        <div class="s05-recoge"><span class="pe-tag">RECOGÉ LA LÍNEA</span></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-pico";
      const DUR = 3.80;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = PE.INK;
      const tl = gsap.timeline({ paused: true });
      const K = PE.kit(tl, root);
      const { q, qa } = K;
      const svg = (h) => { root.querySelector(".s05-svg").innerHTML = h; };
      const CX = 400, CY = 1130, CR = 170;
      svg(`<g class="s05-arriba">
          <path d="M0 1240 Q90 1224 180 1240 T360 1240 T540 1240 T720 1240 T900 1240 T1080 1240 L1080 1540 L0 1540 Z" fill="${PE.TUR3}" opacity="0.55"/>
          <g class="s05-cana">${PE.cana(-80, 1300, 760, 760, { comba: 160, grosor: 22, carrete: 0.1 })}</g>
          <path class="s05-linea" d="M760 760 L860 1260" stroke="${I}" stroke-width="5"/>
          <g class="s05-boya">${PE.boya(860, 1250, 40)}</g>
          <ellipse class="s05-onda" cx="860" cy="1256" rx="120" ry="22" fill="none" stroke="${PE.CRE}" stroke-width="6"/>
        </g>
        <g class="s05-carrete">${PE.carrete(CX, CY, CR)}
          <path class="s05-flecha" d="M${CX - 230} ${CY - 60} A240 240 0 0 1 ${CX + 60} ${CY - 236}" fill="none" stroke="${PE.NAR2}" stroke-width="16" stroke-linecap="round"/>
          <path class="s05-punta" d="M${CX + 40} ${CY - 270} L${CX + 96} ${CY - 236} L${CX + 40} ${CY - 196} Z" fill="${PE.NAR2}" stroke="${I}" stroke-width="5" stroke-linejoin="round"/>
          <path d="M${CX + CR} ${CY} L1100 ${CY - 380}" stroke="${I}" stroke-width="5"/>
        </g>`);
      const PICO2 = 0.58, DESP = 1.25, RECOGE = 2.22, LINEA = 3.04;
      // "¡picó!": la boya se hunde y la caña se dobla
      K.origen(q(".s05-onda"), "860 1256");
      tl.fromTo(q(".s05-onda"), { scale: 0.3, opacity: 1 }, { scale: 1.4, opacity: 0, duration: 0.6, ease: "power2.out", svgOrigin: "860 1256" }, 0);
      tl.fromTo(q(".s05-boya"), { y: 0 }, { y: 70, opacity: 0.4, duration: 0.12, ease: "power3.in" }, 0);
      tl.to(q(".s05-boya"), { y: 20, opacity: 1, duration: 0.2, ease: "power2.out" }, 0.2);
      tl.to(q(".s05-boya"), { y: 80, opacity: 0.3, duration: 0.12, ease: "power3.in" }, PICO2);
      K.origen(q(".s05-cana"), "-80 1300");
      tl.fromTo(q(".s05-cana"), { rotation: 0 }, { rotation: 6, duration: 0.1, yoyo: true, repeat: 3, svgOrigin: "-80 1300", ease: "power2.inOut" }, 0);
      tl.fromTo(q(".s05-cana"), { rotation: 0 }, { rotation: 8, duration: 0.1, yoyo: true, repeat: 3, svgOrigin: "-80 1300", ease: "power2.inOut", immediateRender: false }, PICO2);
      K.sello(q(".s05-p1"), 0.08, -8);
      K.sello(q(".s05-p2"), PICO2 + 0.05, 7);
      K.sacudon(q(".s05-escenario"), 0.08, 1);
      K.sacudon(q(".s05-escenario"), PICO2 + 0.08, 1.2);
      // "despacito...": se va lo de arriba y entra el carrete en primer plano
      tl.to([q(".s05-p1"), q(".s05-p2")], { opacity: 0, scale: 0.9, duration: 0.2 }, DESP - 0.15);
      tl.to(q(".s05-arriba"), { opacity: 0, y: 60, duration: 0.3, ease: "power2.in" }, DESP - 0.1);
      gsap.set(q(".s05-carrete"), { opacity: 0 });
      tl.fromTo(q(".s05-carrete"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)", svgOrigin: `${CX} ${CY}`, immediateRender: false }, DESP);
      K.pop(q(".s05-desp"), DESP + 0.1);
      tl.fromTo(q(".s05-desp"), { x: 0 }, { x: 24, duration: 0.5, yoyo: true, repeat: 2, ease: "sine.inOut", immediateRender: false }, DESP + 0.4);
      // "recogé la línea": la manija gira despacito
      K.origen(q(".pe-cr-giro"), `${CX} ${CY}`);
      tl.to(q(".pe-cr-giro"), { rotation: 300, duration: DUR - DESP - 0.3, ease: "sine.inOut", svgOrigin: `${CX} ${CY}` }, DESP + 0.2);
      K.dibujar(q(".s05-flecha"), RECOGE - 0.1, 0.5);
      K.popSvg(q(".s05-punta"), RECOGE + 0.35, `${CX + 60} ${CY - 236}`, 0.25, 0.3);
      K.pop(q(".s05-recoge"), RECOGE);

      K.salida(q("#s05-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
