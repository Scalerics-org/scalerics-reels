<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/pesca.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-sonda"] .s03-capa, [data-composition-id="s03-sonda"] .s03-escenario { position: absolute; inset: 0; }
    [data-composition-id="s03-sonda"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-sonda"] .s03-ficha { position: absolute; left: 110px; top: 1270px; width: 860px; height: 250px; background: #0d1b24; border: 6px solid #ff8a3d; border-radius: 22px; box-shadow: 8px 10px 0 rgba(13, 27, 36, 0.4); }
    [data-composition-id="s03-sonda"] .s03-ficha b { position: absolute; left: 34px; top: 28px; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 52px; color: #fff1d6; white-space: nowrap; }
    [data-composition-id="s03-sonda"] .s03-ficha small { position: absolute; left: 36px; top: 112px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 28px; letter-spacing: 0.16em; color: #ffb35c; white-space: nowrap; }
    [data-composition-id="s03-sonda"] .s03-barra { position: absolute; left: 36px; top: 160px; width: 788px; height: 52px; border-radius: 26px; background: #06404a; border: 4px solid #7fe8e0; overflow: hidden; }
    [data-composition-id="s03-sonda"] .s03-llena { position: absolute; left: 0; top: 0; bottom: 0; width: 788px; background: linear-gradient(90deg, #ffb35c, #ff8a3d 60%, #e5484d); transform-origin: 0 50%; }
    [data-composition-id="s03-sonda"] .s03-alta { position: absolute; right: 24px; top: 4px; font-family: "Black Ops One", sans-serif; font-size: 34px; color: #0d1b24; }
    [data-composition-id="s03-sonda"] .s03-ejemplar { left: 600px; top: 600px; font-size: 54px; }
  </style>
  <div id="root" data-composition-id="s03-sonda" data-width="1080" data-height="1920" data-duration="5.23">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="5.23" data-track-index="0">
      <div class="s03-escenario">
        <svg class="s03-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="pe-sello nar s03-ejemplar">¡EJEMPLAR!</div>
        <div class="s03-ficha"><b>CLIENTE NUEVO</b><small>GANAS DE COMPRAR</small><div class="s03-barra"><div class="s03-llena"></div><span class="s03-alta">ALTAS</span></div></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-sonda";
      const DUR = 5.23;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const SX = 90, SY = 560, SW = 900, SH = 680;
      const PX = 560, PY = 900;
      root.querySelector(".s03-svg").innerHTML = PE.sonda(SX, SY, SW, SH, { id: "s03-clip", pez: [PX, PY], titulo: "SONDA", prof: "PROF 12 m" }) +
        `<g class="s03-mira"><circle cx="${PX}" cy="${PY - 30}" r="120" fill="none" stroke="#e5484d" stroke-width="8" stroke-dasharray="30 18"/>
          <path d="M${PX - 150} ${PY - 30} L${PX - 100} ${PY - 30} M${PX + 100} ${PY - 30} L${PX + 150} ${PY - 30} M${PX} ${PY - 180} L${PX} ${PY - 130} M${PX} ${PY + 70} L${PX} ${PY + 120}" stroke="#e5484d" stroke-width="8" stroke-linecap="round"/></g>`;
      const tl = gsap.timeline({ paused: true });
      const K = PE.kit(tl, root);
      const { q } = K;

      const SONDA = 0.32, ABAJO = 0.98, EJEMPLAR = 1.80, CLIENTE = 3.04, GANAS = 4.01;

      tl.fromTo(q(".s03-escenario"), { y: 80, scale: 0.94 }, { y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)", transformOrigin: "50% 50%" }, 0);
      // la sonda barre: el fondo y los ecos corren a la izquierda
      tl.fromTo(q(".pe-sn-scan"), { x: 0 }, { x: -820, duration: DUR, ease: "none" }, 0);
      gsap.set(q(".pe-sn-pez"), { opacity: 0 });
      // "ahí abajo": aparece el eco grande del cliente
      tl.fromTo(q(".pe-sn-pez"), { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, ABAJO - 0.2);
      tl.fromTo(q(".pe-sn-pez"), { y: 0 }, { y: -14, duration: 0.5, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, ABAJO + 0.4);
      // "ejemplar hermoso": la mira lo encierra
      K.popSvg(q(".s03-mira"), EJEMPLAR - 0.1, `${PX} ${PY - 30}`, 0.4, 1.8);
      K.origen(q(".s03-mira"), `${PX} ${PY - 30}`);
      tl.to(q(".s03-mira"), { rotation: 90, duration: 3, ease: "none", svgOrigin: `${PX} ${PY - 30}` }, EJEMPLAR + 0.3);
      K.sello(q(".s03-ejemplar"), EJEMPLAR + 0.3, 6);
      // "cliente nuevo, con ganas de comprar": la ficha y la barra que se llena
      tl.fromTo(q(".s03-ficha"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, CLIENTE - 0.1);
      gsap.set(q(".s03-ficha"), { opacity: 0 });
      tl.fromTo(q(".s03-llena"), { scaleX: 0.05 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, GANAS);
      gsap.set(q(".s03-alta"), { opacity: 0 });
      tl.to(q(".s03-alta"), { opacity: 1, duration: 0.15 }, GANAS + 0.55);
      K.sacudon(q(".s03-ficha"), GANAS + 0.6, 0.5);

      K.salida(q("#s03-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
