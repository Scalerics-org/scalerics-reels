  <script>
    (function () {
      const ID = "s04-copiar";
      const DUR = 5.52;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (els, t, paso = 0.06) => {
        els.forEach((el, i) => {
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t + i * paso);
        });
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const temblar = (el, t, n = 4, a = 12) => {
        for (let i = 0; i < n; i++) tl.to(el, { x: i % 2 ? -a : a, duration: 0.04, ease: "none" }, t + i * 0.05);
        tl.to(el, { x: 0, duration: 0.05, ease: "none" }, t + n * 0.05);
      };
      const etiquetas = (lista) => lista.forEach(([sel, t], i) => {
        if (i > 0) tl.to(q(lista[i - 1][0]), { opacity: 0, duration: 0.12 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      });


      const C1 = 0.0, V1 = 1.18, C2 = 2.77, V2 = 3.95;
      pop([q(".s04-planilla")], 0, 0);
      tl.fromTo(q(".s04-planilla"), { opacity: 0.4 }, { opacity: 1, duration: 0.3 }, 0);
      gsap.set(qa(".s04-f3, .s04-f4"), { opacity: 0 });
      pop([q(".s04-globo")], 0.05);
      gsap.set(q(".s04-m2"), { opacity: 0 });
      pop([q(".s04-ctrl"), q(".s04-letra")], 0.1, 0.08);
      // teclas: C / V / C / V con golpe
      gsap.set(q(".s04-lv"), { opacity: 0 });
      [[C1, "c"], [V1, "v"], [C2, "c"], [V2, "v"]].forEach(([t, k]) => {
        tl.set(q(".s04-lc"), { opacity: k === "c" ? 1 : 0 }, t);
        tl.set(q(".s04-lv"), { opacity: k === "v" ? 1 : 0 }, t);
        tl.fromTo([q(".s04-ctrl"), q(".s04-letra")], { y: 12 }, { y: 0, duration: 0.25, ease: "back.out(3)", immediateRender: false }, t + 0.02);
      });
      // copiar: el texto del chat se selecciona
      gsap.set(q(".s04-sel"), { scaleX: 0, transformOrigin: "0% 50%" });
      tl.to(q(".s04-sel"), { scaleX: 1, transformOrigin: "0% 50%", duration: 0.3 }, C1 + 0.15);
      tl.to(q(".s04-sel"), { scaleX: 0, duration: 0.1 }, V1 + 0.3);
      // pegar: se llena la fila 3
      qa(".s04-f3").forEach((el, i) => tl.to(el, { opacity: 1, duration: 0.05 }, V1 + 0.08 + i * 0.12));
      tl.to(q(".s04-cursor"), { y: 64, duration: 0.05 }, V1 + 0.4);
      // cambia el mensaje y se copia de nuevo
      tl.to(q(".s04-m1"), { opacity: 0, duration: 0.1 }, C2 - 0.4);
      tl.fromTo(q(".s04-m2"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2 }, C2 - 0.3);
      tl.fromTo(q(".s04-sel"), { scaleX: 0 }, { scaleX: 0.85, transformOrigin: "0% 50%", duration: 0.3, immediateRender: false }, C2 + 0.15);
      tl.to(q(".s04-sel"), { scaleX: 0, duration: 0.1 }, V2 + 0.3);
      qa(".s04-f4").forEach((el, i) => tl.to(el, { opacity: 1, duration: 0.05 }, V2 + 0.08 + i * 0.12));
      tl.to(q(".s04-cursor"), { y: 128, duration: 0.05 }, V2 + 0.4);
      // cursor parpadea; trance: todo late despacio
      tl.fromTo(q(".s04-cursor"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "steps(1)", yoyo: true, repeat: 16 }, 0.2);
      tl.fromTo(q(".s04-todo"), { scale: 1, svgOrigin: "540 950" }, { scale: 1.035, svgOrigin: "540 950", duration: 0.69, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
      etiquetas([[".s04-e1", 0.15]]);


      // salida

      window.__timelines = window.__timelines || {};
