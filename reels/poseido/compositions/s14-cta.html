  <style>

    [data-composition-id="s14-cta"] .celda-h { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; fill: #6dff8a; opacity: 0.75; }

        <text class="mono s14-estreno" x="540" y="640" text-anchor="middle" style="fill:#ffb547;letter-spacing:0.4em">ESTRENO 31·10</text>
        <text class="s14-arroba" x="540" y="960" text-anchor="middle" style="font-family:Lexend;font-weight:800;font-size:330px;fill:#6dff8a;filter:drop-shadow(0 0 26px rgba(109,255,138,0.8))">@</text>
        <text class="s14-etiq" x="540" y="1160" text-anchor="middle" style="font-family:Lexend;font-weight:900;font-size:120px;fill:#efe6d2;letter-spacing:0.02em">ETIQUETÁ</text>
        <text class="s14-sub" x="540" y="1230" text-anchor="middle" style="font-family:Lexend;font-weight:600;font-size:44px;fill:#efe6d2">al poseído <tspan style="fill:#6dff8a">por la planilla</tspan></text>

      <div class="etiqueta"><span class="s14-e1">Feliz Halloween</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s14-cta";
      const DUR = 5.9;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (els, t, paso = 0.06) => {
        els.forEach((el, i) => {
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t + i * paso);
        });
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const temblar = (el, t, n = 4, a = 12) => {
        for (let i = 0; i < n; i++) tl.to(el, { x: i % 2 ? -a : a, duration: 0.04, ease: "none" }, t + i * 0.05);
        tl.to(el, { x: 0, duration: 0.05, ease: "none" }, t + n * 0.05);
      };
      const etiquetas = (lista) => lista.forEach(([sel, t], i) => {
        if (i > 0) tl.to(q(lista[i - 1][0]), { opacity: 0, duration: 0.12 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      });


      const ETQ = 0.0, POS = 1.14, PLAN = 1.9;
      pop([q(".s14-arroba")], ETQ);
      tl.fromTo(q(".s14-etiq"), { opacity: 0, scale: 1.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "power3.out" }, ETQ + 0.1);
      pop([q(".s14-estreno")], 0.3);
      gsap.set(q(".s14-sub"), { opacity: 0 });
      tl.fromTo(q(".s14-sub"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, POS);
      temblar(q(".s14-arroba"), PLAN, 4, 8);
      tl.fromTo(q(".s14-arroba"), { scale: 1 }, { scale: 1.06, transformOrigin: "50% 50%", duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 4, immediateRender: false }, PLAN + 0.3);
      etiquetas([[".s14-e1", 2.4]]);


      // salida
      tl.to(q("#s14-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
