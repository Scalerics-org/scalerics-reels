    (function () {
      const ID = "s05-exorcista";
      const DUR = 4.32;

          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });

          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (els, t, paso = 0.06) => {
        els.forEach((el, i) => {
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t + i * paso);
        });
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const temblar = (el, t, n = 4, a = 12) => {
        for (let i = 0; i < n; i++) tl.to(el, { x: i % 2 ? -a : a, duration: 0.04, ease: "none" }, t + i * 0.05);
        tl.to(el, { x: 0, duration: 0.05, ease: "none" }, t + n * 0.05);
      };
      const etiquetas = (lista) => lista.forEach(([sel, t], i) => {
        if (i > 0) tl.to(q(lista[i - 1][0]), { opacity: 0, duration: 0.12 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      });


      const EXO = 1.72, PEOR = 3.49;
      pop([q(".s05-cura")], 0, 0);
      dibujar(qa(".s05-c"), 0, 0.5, 0.5);
      // se persigna: la mano hace la cruz
      tl.fromTo(q(".s05-mano"), { x: 0, y: -60 }, { x: 0, y: 40, duration: 0.3, ease: "power2.inOut" }, 0.1);
      tl.to(q(".s05-mano"), { x: -50, y: -10, duration: 0.2, ease: "power2.inOut" }, 0.45);
      tl.to(q(".s05-mano"), { x: 50, y: -10, duration: 0.25, ease: "power2.inOut" }, 0.68);

      tl.to(q(".s05-pantalla"), { opacity: 0, duration: 0.05 }, PEOR + 0.12);
      tl.to(q(".s05-punto"), { opacity: 1, duration: 0.02 }, PEOR + 0.12);
      tl.to(q(".s05-punto"), { scale: 0, svgOrigin: "785 895", duration: 0.4 }, PEOR + 0.2);
      tl.to(q(".s05-cura"), { x: -40, duration: 0.25, ease: "power3.out" }, PEOR);

        tl.to(g, { opacity: 1, duration: 0.05 }, PEOR + 0.1 + i * 0.12);

      tl.to(q(".s05-boca"), { scaleY: -1, svgOrigin: "0 -345", duration: 0.1 }, PEOR);
      etiquetas([[".s05-e1", EXO], [".s05-e2", PEOR]]);
