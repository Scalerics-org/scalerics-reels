  <style>

    [data-composition-id="s01-poseido"] .verde { fill: none; stroke: #6dff8a; stroke-width: 7; stroke-linecap: round; filter: drop-shadow(0 0 12px rgba(109, 255, 138, 0.8)); }
    [data-composition-id="s01-poseido"] .s01-luzcara { fill: #6dff8a; opacity: 0.16; filter: blur(40px); }
    [data-composition-id="s01-poseido"] .s01-pupila { fill: #efe6d2; }
    [data-composition-id="s01-poseido"] .s01-ojo { fill: #efe6d2; filter: drop-shadow(0 0 10px #6dff8a) drop-shadow(0 0 22px rgba(109, 255, 138, 0.8)); }
    [data-composition-id="s01-poseido"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.3em; text-transform: uppercase; color: #ffb547; }

      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- EL POSEÍDO (personaje de todo el reel): origen = centro del borde de la mesa -->
        <g class="s01-todo"><g transform="translate(540 1200)">
          <ellipse class="s01-luzcara" cx="0" cy="-330" rx="230" ry="200" />
          <g class="s01-cabeza">
            <ellipse class="ln s01-l" cx="0" cy="-420" rx="92" ry="108" />
            <path class="ln s01-l" d="M-88 -455 L-112 -500 L-70 -492 L-82 -540 L-36 -512 L-22 -560 L8 -516 L40 -556 L50 -506 L92 -530 L82 -486 L114 -482 L90 -452" />

  </div>
  <script>
    (function () {
      const ID = "s01-poseido";
      const DUR = 3.65;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const POSEIDO = 2.5;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // cuadro 0: el poseído a medio dibujar, en la oscuridad
      dibujar(qa(".s01-l"), 0, 0.8, 0.55);
      dibujar(qa(".s01-v"), 0.2, 0.5);
      tl.fromTo(q(".s01-luzcara"), { opacity: 0 }, { opacity: 0.16, duration: 0.6 }, 0.2);
      gsap.set(qa(".s01-ojo"), { opacity: 0 });
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.2);

      // teclea sin parar (manos que suben y bajan sobre la tapa)
      tl.fromTo(q(".s01-mano"), { y: 0 }, { y: -10, duration: 0.11, ease: "sine.inOut", yoyo: true, repeat: 19 }, 0.5);
      tl.fromTo(q(".s01-mano2"), { y: -10 }, { y: 0, duration: 0.11, ease: "sine.inOut", yoyo: true, repeat: 19 }, 0.5);
      // la pantalla parpadea
      [1.1, 1.9].forEach((t) => { tl.to(q(".s01-luzcara"), { opacity: 0.05, duration: 0.05 }, t); tl.to(q(".s01-luzcara"), { opacity: 0.16, duration: 0.1 }, t + 0.07); });

      // "poseído": los ojos se ponen en blanco y brillan, la cabeza da un tirón
      tl.to(qa(".s01-pupila"), { opacity: 0, duration: 0.05 }, POSEIDO);
      tl.fromTo(qa(".s01-ojo"), { opacity: 0, scale: 0.3, svgOrigin: "0 -428" }, { opacity: 1, scale: 1, svgOrigin: "0 -428", duration: 0.25, ease: "back.out(2.5)" }, POSEIDO);
      tl.to(q(".s01-luzcara"), { opacity: 0.32, duration: 0.15 }, POSEIDO);
      tl.fromTo(q(".s01-cabeza"), { rotation: 0 }, { rotation: -9, svgOrigin: "0 -300", duration: 0.08, ease: "power2.out" }, POSEIDO);
      tl.to(q(".s01-cabeza"), { rotation: 4, svgOrigin: "0 -300", duration: 0.12, ease: "power2.inOut" }, POSEIDO + 0.08);
      tl.to(q(".s01-cabeza"), { rotation: 0, svgOrigin: "0 -300", duration: 0.3, ease: "elastic.out(1, 0.4)" }, POSEIDO + 0.2);
      [0, 0.05, 0.1, 0.15].forEach((d, i) => tl.to(q(".s01-todo"), { x: (i % 2 ? -12 : 14), duration: 0.04, ease: "none" }, POSEIDO + d));
      tl.to(q(".s01-todo"), { x: 0, duration: 0.05, ease: "none" }, POSEIDO + 0.2);
      tl.fromTo(q(".s01-todo"), { scale: 1, svgOrigin: "540 900" }, { scale: 1.08, svgOrigin: "540 900", duration: 1.0, ease: "power2.out" }, POSEIDO);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.12 }, POSEIDO - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, POSEIDO);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
