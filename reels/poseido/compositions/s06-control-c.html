  <script>
    (function () {
      const ID = "s06-control-c";
      const DUR = 3.0;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (els, t, paso = 0.06) => {
        els.forEach((el, i) => {
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t + i * paso);
        });
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const temblar = (el, t, n = 4, a = 12) => {
        for (let i = 0; i < n; i++) tl.to(el, { x: i % 2 ? -a : a, duration: 0.04, ease: "none" }, t + i * 0.05);
        tl.to(el, { x: 0, duration: 0.05, ease: "none" }, t + n * 0.05);
      };
      const etiquetas = (lista) => lista.forEach(([sel, t], i) => {
        if (i > 0) tl.to(q(lista[i - 1][0]), { opacity: 0, duration: 0.12 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      });


      const SAL = 0.0, CTRL = 1.38, C = 1.95;
      pop([q(".s06-cura")], 0, 0);
      dibujar(qa(".s06-c"), 0, 0.4, 0.5);
      // levanta el crucifijo con fuerza
      tl.fromTo(q(".s06-brazo"), { rotation: 20, svgOrigin: "140 -200" }, { rotation: -6, svgOrigin: "140 -200", duration: 0.35, ease: "back.out(2)" }, SAL);
      temblar(q(".s06-cruz"), 0.5, 8, 5);
      // las teclas aparecen y tiemblan como el demonio
      pop([q(".s06-ctrl")], CTRL - 0.2);
      pop([q(".s06-letra")], C - 0.1);
      tl.fromTo(qa(".s06-ojito"), { scale: 0.2, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.2, immediateRender: false }, C + 0.1);
      // rayo del crucifijo: le pega y rebotan sin romperse
      dibujar(qa(".s06-rayo"), C + 0.02, 0.18);
      tl.to(qa(".s06-rayo"), { opacity: 0, duration: 0.3 }, C + 0.5);
      tl.to(q(".s06-teclas"), { x: 50, rotation: 6, svgOrigin: "790 950", duration: 0.12, ease: "power2.out" }, C + 0.15);
      tl.to(q(".s06-teclas"), { x: 0, rotation: 0, svgOrigin: "790 950", duration: 0.5, ease: "elastic.out(1, 0.35)" }, C + 0.3);
      tl.fromTo(q(".s06-letra"), { y: 0 }, { y: -10, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, C + 0.8);
      etiquetas([[".s06-e1", 0.1]]);


      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
