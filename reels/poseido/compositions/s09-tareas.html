  <script>
    (function () {
      const ID = "s09-tareas";
      const DUR = 3.99;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (els, t, paso = 0.06) => {
        els.forEach((el, i) => {
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t + i * paso);
        });
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const temblar = (el, t, n = 4, a = 12) => {
        for (let i = 0; i < n; i++) tl.to(el, { x: i % 2 ? -a : a, duration: 0.04, ease: "none" }, t + i * 0.05);
        tl.to(el, { x: 0, duration: 0.05, ease: "none" }, t + n * 0.05);
      };
      const etiquetas = (lista) => lista.forEach(([sel, t], i) => {
        if (i > 0) tl.to(q(lista[i - 1][0]), { opacity: 0, duration: 0.12 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      });


      const DEMONIO = 1.43, TAREAS = 2.5;
      pop([q(".s09-cura")], 0, 0);
      dibujar(qa(".s09-c"), 0, 0.5, 0.5);
      tl.fromTo(q(".s09-lupa"), { rotation: 8, svgOrigin: "-150 -200" }, { rotation: -6, svgOrigin: "-150 -200", duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.2);
      pop([q(".s09-diablo")], 0.3);
      gsap.set(q(".s09-tacha"), { opacity: 0 });
      dibujar([q(".s09-tacha")], DEMONIO, 0.3);
      tl.to(q(".s09-diablo"), { opacity: 0, y: 30, duration: 0.25 }, TAREAS - 0.3);
      // tareas repetidas: tarjetas iguales que pasan en loop
      const tj = qa(".s09-tarj");
      pop(tj, TAREAS, 0.07);
      tj.forEach((t) => tl.fromTo(t, { x: 0 }, { x: 200, duration: 0.5, ease: "none", repeat: 2, immediateRender: false }, TAREAS + 0.3));
      dibujar([q(".s09-flecha")], TAREAS + 0.1, 0.5);
      tl.to(q(".s09-cura"), { opacity: 0, x: 120, duration: 0.3 }, TAREAS - 0.2);
      etiquetas([[".s09-e1", 0.1], [".s09-e2", TAREAS]]);


      // salida

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
