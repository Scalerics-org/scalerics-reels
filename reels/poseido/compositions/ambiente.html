<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    [data-composition-id="ambiente"] .amb-halo { position: absolute; left: -230px; top: 1100px; width: 800px; height: 800px; border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 181, 71, 0.22) 0%, rgba(255, 181, 71, 0.07) 40%, rgba(255, 181, 71, 0) 70%); }
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 700px 1050px at 540px 920px, rgba(7, 6, 5, 0) 50%, rgba(7, 6, 5, 0.85) 100%); }
    [data-composition-id="ambiente"] .amb-polvo { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #efe6d2; }
    [data-composition-id="ambiente"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="ambiente"] .ln { fill: none; stroke: #efe6d2; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="ambiente"] .amb-llama { fill: #ffb547; filter: drop-shadow(0 0 16px rgba(255, 181, 71, 0.9)); }
    [data-composition-id="ambiente"] .amb-nucleo { fill: #fff3d6; }
    [data-composition-id="ambiente"] .amb-humo { fill: none; stroke: #efe6d2; stroke-width: 4; stroke-linecap: round; opacity: 0; }
    [data-composition-id="ambiente"] .amb-flash { position: absolute; inset: 0; opacity: 0; background: #eef2ff; }
    [data-composition-id="ambiente"] .amb-luz { position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(ellipse 760px 960px at 540px 920px, rgba(255, 181, 71, 0.13) 0%, rgba(255, 181, 71, 0.05) 50%, rgba(255, 181, 71, 0) 80%); }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="71.18">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="71.18" data-track-index="0">
      <div class="amb-luz"></div>
      <div class="amb-halo"></div>
      <div class="amb-polvo"></div><div class="amb-polvo"></div><div class="amb-polvo"></div><div class="amb-polvo"></div>
      <div class="amb-polvo"></div><div class="amb-polvo"></div><div class="amb-polvo"></div><div class="amb-polvo"></div>
      <div class="amb-polvo"></div><div class="amb-polvo"></div>
      <div class="amb-vineta"></div>
      <!-- la vela, abajo a la izquierda -->
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <path class="ln" d="M122 1600 V1468 Q122 1460 130 1460 H190 Q198 1460 198 1468 V1600" />
        <path class="ln" d="M150 1460 q4 18 -2 34 M178 1460 q-3 12 2 22" />
        <path class="ln" d="M90 1600 H230" />
        <line class="ln" x1="160" y1="1460" x2="160" y2="1446" />
        <g class="amb-fuego">
          <path class="amb-llama" d="M160 1446 C140 1430 144 1400 160 1372 C176 1400 180 1430 160 1446 Z" />
          <path class="amb-nucleo" d="M160 1442 C152 1434 153 1420 160 1406 C167 1420 168 1434 160 1442 Z" />
        </g>
        <path class="amb-humo" d="M160 1440 q-14 -22 0 -44 q14 -22 0 -44 q-14 -22 0 -44" />
      </svg>
      <div class="amb-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 71.18;
      const LUZ = 48.91;   // "se automatiza": se prende la luz
      const APAGA = 64.1;  // "dormir": se apaga la vela
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // la llama titila: escalas fijas (nada de random), cada 0.13-0.2 s
      const ESC = [1, 0.86, 1.08, 0.92, 1.04, 0.84, 1.1, 0.95, 0.88, 1.06, 0.9, 1.02];
      let t = 0, k = 0;
      while (t < APAGA) {
        const d = 0.13 + (k % 4) * 0.025;
        const s = ESC[k % ESC.length];
        tl.to(q(".amb-fuego"), { scaleY: s, scaleX: 2 - s, rotation: (k % 3 - 1) * 3, svgOrigin: "160 1446", duration: d, ease: "sine.inOut" }, t);
        tl.to(q(".amb-halo"), { opacity: 0.7 + (s - 0.84) * 1.1, duration: d, ease: "sine.inOut" }, t);
        t += d; k++;
      }
      // la vela se apaga: la llama se encoge, sube el humo
      tl.to(q(".amb-fuego"), { scale: 0, svgOrigin: "160 1446", duration: 0.25, ease: "power2.in" }, APAGA);
      tl.to(q(".amb-halo"), { opacity: 0, duration: 0.5 }, APAGA);
      const humo = q(".amb-humo");
      const L = humo.getTotalLength();
      gsap.set(humo, { strokeDasharray: L, strokeDashoffset: L });
      tl.to(humo, { opacity: 0.6, duration: 0.1 }, APAGA + 0.2);
      tl.to(humo, { strokeDashoffset: 0, duration: 1.4, ease: "power1.out" }, APAGA + 0.2);
      tl.to(humo, { y: -40, opacity: 0, duration: 1.4, ease: "power1.in" }, APAGA + 1.4);

      // polvo que flota despacio en la luz
      const X = [180, 320, 470, 610, 760, 880, 260, 540, 700, 950];
      const Y = [700, 1050, 820, 1200, 900, 760, 1350, 1500, 640, 1120];
      qa(".amb-polvo").forEach((p, i) => {
        const per = 6 + (i % 4) * 1.5;
        gsap.set(p, { x: X[i], y: Y[i], opacity: 0.12 + (i % 3) * 0.08, scale: 0.6 + (i % 3) * 0.3 });
        tl.to(p, { x: X[i] + 40 - (i % 2) * 80, y: Y[i] - 90, duration: per, ease: "sine.inOut", yoyo: true, repeat: Math.floor(DUR / per) - 1 }, 0);
      });

      // relámpagos (segundos globales): "poseído", "peor", "Control C", "Control Z"
      [2.5, 21.81, 24.59, 36.77].forEach((t) => {
        tl.to(q(".amb-flash"), { opacity: 0.55, duration: 0.03 }, t);
        tl.to(q(".amb-flash"), { opacity: 0.05, duration: 0.07 }, t + 0.04);
        tl.to(q(".amb-flash"), { opacity: 0.35, duration: 0.03 }, t + 0.13);
        tl.to(q(".amb-flash"), { opacity: 0, duration: 0.4, ease: "power2.out" }, t + 0.17);
      });

      // se automatiza: flash cálido y queda una luz ámbar suave, menos viñeta
      tl.to(q(".amb-flash"), { opacity: 0.4, duration: 0.04 }, LUZ);
      tl.to(q(".amb-flash"), { opacity: 0, duration: 0.6, ease: "power2.out" }, LUZ + 0.05);
      tl.to(q(".amb-luz"), { opacity: 1, duration: 0.8, ease: "power2.out" }, LUZ + 0.05);
      tl.to(q(".amb-vineta"), { opacity: 0.5, duration: 0.8 }, LUZ + 0.05);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
