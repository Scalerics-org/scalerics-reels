  <script>
    (function () {
      const ID = "s07-ritual";
      const DUR = 7.04;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      MU.llenar(root);
      const tl = gsap.timeline({ paused: true });
      const K = MU.kit(tl, root);
      const { q, qa } = K;

      const JOYA = 0.25;
      const RITUAL = 1.89;
      const PASA = 3.02;
      const NUEVE = 4.43;
      const SI = 5.64;

      // la visita llega a la sala de honor
      tl.fromTo(q(".s07-escenario"), { x: 260, opacity: 0.4 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(q(".s07-escenario"), { scale: 1 }, { scale: 1.06, duration: DUR - 0.4, ease: "none", transformOrigin: "50% 50%" }, 0.4);
      K.pop(q(".s07-sala"), 0.1);

      // "joya": se prende el foco, destellos
      tl.fromTo(q(".s07-foco"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, JOYA);
      tl.to(q(".s07-foco"), { opacity: 0.7, duration: 0.5, yoyo: true, repeat: 7, ease: "sine.inOut" }, JOYA + 0.4);
      qa(".s07-destellos path").forEach((d, i) => {
        const b = d.getBBox();
        const o = (b.x + b.width / 2) + " " + (b.y + b.height / 2);
        gsap.set(d, { opacity: 0 });
        tl.fromTo(d, { opacity: 0, scale: 0, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.25, ease: "back.out(3)", immediateRender: false }, JOYA + 0.1 + i * 0.1);
        tl.to(d, { scale: 0.5, rotation: 45, svgOrigin: o, duration: 0.4, yoyo: true, repeat: 7, ease: "sine.inOut" }, JOYA + 0.5 + i * 0.12);
      });
      K.dibujar(q(".s07-soporte"), 0.1, 0.6);

      // "ritual": la placa
      K.golpe(q(".s07-placa"), RITUAL);
      K.sacudon(q(".s07-escenario"), RITUAL + 0.06, 0.5);

      // "pasá a buscarlo": el cartelito cuelga
      gsap.set(q(".s07-cartel"), { opacity: 0 });
      gsap.set(q(".s07-dorso"), { rotationY: 180 });
      tl.fromTo(q(".s07-cartel"), { opacity: 0, y: -80, rotation: 8 }, { opacity: 1, y: 0, rotation: 0, duration: 0.45, ease: "back.out(2)", immediateRender: false }, PASA - 0.1);

      tl.fromTo(q(".s07-hora"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, NUEVE);

      tl.to(q(".s07-dorso"), { rotationY: 0, duration: 0.35, ease: "power2.inOut" }, SI);
      K.sacudon(q(".s07-escenario"), SI + 0.4, 0.6);
      K.reflejo(q(".s07-vit"), SI + 0.5);

      K.salida(q("#s07-escena"), DUR);
