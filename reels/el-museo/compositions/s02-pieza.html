  <script>
    (function () {
      const ID = "s02-pieza";
      const DUR = 4.67;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      MU.llenar(root);
      const tl = gsap.timeline({ paused: true });
      const K = MU.kit(tl, root);
      const { q, qa } = K;

      const ESTRELLA = 0.58;
      const ABRE = 1.67;
      const ES = 3.19;

      // entrada: pedestal y vitrina suben, la cámara se acerca
      tl.fromTo(q(".s02-ped"), { y: 80, opacity: 0.3 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo([q(".s02-vit"), q(".s02-local")], { y: -120, opacity: 0.3 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.3)" }, 0.05);
      tl.fromTo(q(".s02-escenario"), { scale: 1 }, { scale: 1.07, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);

      // "estrella": destellos alrededor
      qa(".s02-est").forEach((e, i) => {
        gsap.set(e, { opacity: 0 });
        tl.fromTo(e, { opacity: 0, scale: 0.2, rotation: -90, svgOrigin: e.getBBox().x + e.getBBox().width / 2 + " " + (e.getBBox().y + e.getBBox().height / 2) },
          { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)", immediateRender: false }, ESTRELLA - 0.15 + i * 0.08);
        tl.to(e, { opacity: 0.35, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, ESTRELLA + 0.5 + i * 0.1);
      });

      // "abre todos los días": sube la persiana, el cartel se da vuelta a ABIERTO
      gsap.set(q(".s02-abierto"), { opacity: 0 });
      tl.to(q(".s02-persiana"), { scaleY: 0.08, svgOrigin: "325 250", duration: 0.45, ease: "power2.inOut" }, ABRE - 0.1);
      tl.to(q(".s02-cartel"), { scaleX: 0, svgOrigin: "165 315", duration: 0.12, ease: "power1.in" }, ABRE + 0.2);
      tl.set(q(".s02-cerrado"), { opacity: 0 }, ABRE + 0.32);
      tl.set(q(".s02-abierto"), { opacity: 1 }, ABRE + 0.32);
      tl.to(q(".s02-cartel"), { scaleX: 1, svgOrigin: "165 315", duration: 0.12, ease: "power1.out" }, ABRE + 0.32);
      tl.to(q(".s02-local"), { y: -6, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 2.0);

      // "Es tu local": cae la placa, reflejo, sacudón
      K.golpe(q(".s02-placa"), ES + 0.3);
      K.sacudon(q(".s02-escenario"), ES + 0.36, 0.8);
      K.reflejo(q(".s02-vit"), ES + 0.5);

      K.salida(q("#s02-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
