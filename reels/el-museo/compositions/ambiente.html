  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="73.26">

      <svg class="amb-luz" viewBox="0 0 1080 1920" aria-hidden="true">

          </linearGradient>
          <radialGradient id="amb-pozo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ffe2a8" stop-opacity="0.28" />

        <path class="amb-haz amb-h1" d="M470 0 H610 L860 1450 H220 Z" fill="url(#amb-haz)" />

            <rect x="-11" y="1340" width="22" height="270" fill="#c9a24a" stroke="#120d0f" stroke-width="4" />

  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 73.26;
      const GIRO = 49.13; // "no es de museo"
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // polvo: partículas fijas (pseudoaleatorio con semilla) dentro del haz central
      let semilla = 23;
      const azar = () => ((semilla = (semilla * 16807) % 2147483647) / 2147483647);
      const NS = "http://www.w3.org/2000/svg";
      const polvo = q(".amb-polvo");
      const motas = [];
      for (let i = 0; i < 46; i++) {
        const y = 480 + azar() * 940;
        const ancho = 70 + (y / 1450) * 320;
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", (540 + (azar() * 2 - 1) * ancho).toFixed(1));
        c.setAttribute("cy", y.toFixed(1));
        c.setAttribute("r", (1.6 + azar() * 2.8).toFixed(1));
        c.setAttribute("opacity", (0.25 + azar() * 0.5).toFixed(2));
        polvo.appendChild(c);
        motas.push([c, azar(), azar()]);
      }
      for (const [c, a, b] of motas) {
        const per = 5 + a * 6;
        tl.fromTo(c, { x: 0, y: 0 }, { x: (b * 2 - 1) * 40, y: -50 - a * 60, duration: per, ease: "sine.inOut", yoyo: true, repeat: Math.floor(DUR / per) }, b * 2);
      }
      // el haz respira apenas
      tl.fromTo(q(".amb-h1"), { opacity: 0.85 }, { opacity: 1, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: Math.floor(DUR / 2.4) - 1 }, 0);
      tl.fromTo(q(".amb-pozo"), { opacity: 0.8 }, { opacity: 1, duration: 1.9, ease: "sine.inOut", yoyo: true, repeat: Math.floor(DUR / 1.9) - 1 }, 0);

      // el cartelito NO TOCAR se hamaca
      gsap.set(q(".amb-notocar"), { transformOrigin: "50% 0%" });
      tl.fromTo(q(".amb-notocar"), { rotation: -3 }, { rotation: 3, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: Math.floor(GIRO / 1.6) - 1 }, 0);

      // el giro: el cordón se desengancha del poste derecho y cae; el cartel se cae al piso
      gsap.set(q(".amb-caida"), { opacity: 0 });
      tl.to(q(".amb-soga"), { opacity: 0, duration: 0.05 }, GIRO);
      tl.set(q(".amb-caida"), { opacity: 1 }, GIRO);
      tl.fromTo(q(".amb-caida"), { rotation: -38, svgOrigin: "88 1352" }, { rotation: 0, svgOrigin: "88 1352", duration: 0.9, ease: "elastic.out(1, 0.45)", immediateRender: false }, GIRO);
      tl.to(q(".amb-notocar"), { y: 240, x: -60, rotation: -70, opacity: 0, duration: 0.5, ease: "power2.in" }, GIRO);

      // flash de cámara del turista ("foto")
      const FOTO = 43.03;
      tl.fromTo(q(".amb-flash"), { opacity: 0 }, { opacity: 0.85, duration: 0.04, immediateRender: false }, FOTO);
      tl.to(q(".amb-flash"), { opacity: 0, duration: 0.35, ease: "power2.out" }, FOTO + 0.06);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
