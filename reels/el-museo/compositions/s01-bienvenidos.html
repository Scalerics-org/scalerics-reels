      <div class="s01-escenario">
        <svg class="s01-fachada" viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- frontón -->
          <path class="s01-fill s01-fronton" d="M110 770 L540 590 L970 770 Z" fill="#ece8e1" stroke="#120d0f" stroke-width="6" stroke-linejoin="round" />

  <script>
    (function () {
      const ID = "s01-bienvenidos";
      const DUR = 2.75;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = MU.kit(tl, root);
      const { q, qa } = K;

      const MUSEO = 0.75;
      const COMERCIO = 1.33;
      const ANTIGUO = 1.92;

      // cuadro 0: la fachada ya está armándose (nada negro): las piezas suben desde el piso
      tl.fromTo(qa(".s01-fill"), { opacity: 0.35, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.04 }, 0);
      qa(".s01-col").forEach((c, i) => tl.fromTo(c, { scaleY: 0.4, opacity: 0.4, svgOrigin: "540 1306" }, { scaleY: 1, opacity: 1, svgOrigin: "540 1306", duration: 0.45, ease: "back.out(1.4)" }, 0.05 + i * 0.06));
      K.dibujar(q(".s01-ln"), 0.3, 0.6);
      // cámara que se acerca lento
      tl.fromTo(q(".s01-escenario"), { scale: 1.0 }, { scale: 1.06, duration: DUR, ease: "none", transformOrigin: "50% 60%" }, 0);

      // "Museo" / "Comercio": el friso se escribe
      gsap.set(q(".s01-friso"), { opacity: 0 });
      tl.fromTo(q(".s01-friso"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, MUSEO - 0.1);
      tl.to(q(".s01-friso"), { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, COMERCIO - 0.05);

      // "Antiguo": el cartel cae de golpe con sacudón
      K.golpe(q(".s01-antiguo"), ANTIGUO, -2);
      K.sacudon(q(".s01-escenario"), ANTIGUO + 0.06, 1);
      tl.to(q(".s01-antiguo"), { rotation: 0, duration: 0.3, ease: "back.out(2)" }, ANTIGUO + 0.25);

      K.salida(q("#s01-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
