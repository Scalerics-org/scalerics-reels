    (function () {
      const ID = "s07-ayer";
      const DUR = 3.73;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s07-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, s = 2.4) => { gsap.set(q(sel), { opacity: 0 }); tl.fromTo(q(sel), { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1); };

      const AYER = 1.23, NADA = 2.67;

      // la pelota va y viene cada vez más rápido: la "fase" crece con t^1.6
      const fase = (t) => 0.5 + 3.2 * Math.pow(t / DUR, 1.6) * DUR / 2;
      const pos = (t) => { const v = fase(t), k = Math.floor(v), f = v - k; const fx = k % 2 === 0 ? f : 1 - f; return { x: 420 + fx * 240, y: 860 - Math.sin(f * Math.PI) * 180 }; };
      const est = [];
      for (let i = 1; i <= 5; i++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("fill", "#e3f53a"); c.setAttribute("opacity", String(0.6 - i * 0.1)); q(".s07-estela").appendChild(c); est.push(c); }
      const pinta = (t) => {
        const p = pos(t);
        q(".s07-pelota").setAttribute("transform", `translate(${p.x} ${p.y})`);
        est.forEach((c, i) => { const g = pos(Math.max(0, t - (i + 1) * 0.025)); c.setAttribute("cx", g.x); c.setAttribute("cy", g.y); c.setAttribute("r", 24 - i * 3); });
      };
      const r = { t: 0 };
      pinta(0);
      tl.to(r, { t: DUR, duration: DUR, ease: "none", onUpdate: () => pinta(r.t) }, 0);

      tl.fromTo(q(".s07-escenario"), { scale: 1.04 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);
      // los dos hablan

      gsap.set(q(".s07-boca2"), { scaleY: 0.3, svgOrigin: "790 978" });

      golpe(".s07-ayer", AYER, 2.4);
      sacudon(AYER + 0.05, 0.7);
      tl.to(q(".s07-ayer"), { opacity: 0.3, duration: 0.2 }, NADA - 0.2);
      golpe(".s07-nada", NADA, 2.4);
      sacudon(NADA + 0.05, 0.9);

      // el camión cruza perdido

      tl.to(q(".s07-camion"), { y: -6, duration: 0.12, yoyo: true, repeat: Math.max(1, Math.floor(DUR / 0.12) - 1), ease: "sine.inOut" }, 0);

      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
