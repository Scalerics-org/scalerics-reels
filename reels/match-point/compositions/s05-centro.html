  <script>
    (function () {
      const ID = "s05-centro";
      const DUR = 5.17;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s05-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      const EXCEL = 0.18, DOS = 1.29, NO = 2.03, PREG = 3.61, CENTRO = 4.09;

      // la fila de la planilla entra; el "2" late

      tl.fromTo(q(".s05-dos"), { scale: 1 }, { scale: 1.35, duration: 0.14, yoyo: true, repeat: 3, ease: "power2.out", transformOrigin: "50% 50%" }, DOS - 0.1);
      // el depósito y el estante ya están; la linterna barre buscando
      tl.fromTo([q(".s05-estante"), q(".s05-dep")], { opacity: 0.5 }, { opacity: 1, duration: 0.3 }, 0);
      tl.fromTo(q(".s05-cono"), { rotation: -12, svgOrigin: "300 1120" }, { rotation: 10, svgOrigin: "300 1120", duration: 0.7, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s05-escenario"), { scale: 1.04 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);

      // "no los encuentro": el hueco titila y saltan los signos

      ["s05-q3", "s05-q1", "s05-q2"].forEach((c, i) => {
        gsap.set(q("." + c), { opacity: 0 });
        tl.fromTo(q("." + c), { opacity: 0, y: 60, scale: 0.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.25, ease: "back.out(2.4)", immediateRender: false, transformOrigin: "50% 100%" }, NO + 0.05 + i * 0.12);
        tl.to(q("." + c), { y: -16, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, NO + 0.35 + i * 0.12);
      });

      // "preguntale a Centro": estante y signos se van, entra Centro y la pelota viaja por el arco

      const arco = q(".s05-arco"), L = arco.getTotalLength();

      tl.to(arco, { opacity: 1, duration: 0.05 }, PREG + 0.1);
      tl.to(arco, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.inOut" }, PREG + 0.1);
      const est = [];
      for (let i = 1; i <= 5; i++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("fill", "#e3f53a"); c.setAttribute("opacity", String(0.6 - i * 0.1)); q(".s05-estela").appendChild(c); est.push(c); }
      const pinta = (f) => {

        q(".s05-pelota").setAttribute("transform", `translate(${p.x} ${p.y})`);
        est.forEach((c, i) => { const g = arco.getPointAtLength(Math.max(0, f - (i + 1) * 0.04) * L); c.setAttribute("cx", g.x); c.setAttribute("cy", g.y); c.setAttribute("r", 22 - i * 2); });
      };
      pinta(0);
      gsap.set([q(".s05-pelota"), q(".s05-estela")], { opacity: 0 });
      tl.to([q(".s05-pelota"), q(".s05-estela")], { opacity: 1, duration: 0.05 }, PREG + 0.1);
      const b = { f: 0 };

      tl.to(q(".s05-boca"), { scaleY: 3, svgOrigin: "220 1210", duration: 0.1, yoyo: true, repeat: 3 }, PREG);
      golpe(".s05-acentro", CENTRO, 2);
