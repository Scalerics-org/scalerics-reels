    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="4.98" data-track-index="0">
      <div class="s01-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">

          </defs>

            </g>
            <!-- líneas -->

            <circle class="s01-g3" r="10" fill="#e3f53a" opacity="0.22" />

        <div class="s01-placa s01-mira"><div class="f"></div><div class="t">Mirá este partido</div></div>

  <script>
    (function () {
      const ID = "s01-partido";
      const DUR = 4.98;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, s = 2.4) => { gsap.set(q(sel), { opacity: 0 }); tl.fromTo(q(sel), { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1); };

      // tiempos (relativos a la escena = palabras de la locución)
      const PARTIDO = 0.46, CUARENTA = 1.46, STOCK = 4.0;

      // ---- la pelota: va y viene entre la empleada (cerca) y el depósito (lejos) ----
      // cada tramo dura T; empieza a medio cruzar para que el cuadro 0 tenga movimiento
      const T = 0.62, CERCA = [548, 1170], LEJOS = [460, 610];
      const pos = (v) => {
        const k = Math.floor(v / T), f = (v % T) / T;
        const [a, b] = k % 2 === 0 ? [CERCA, LEJOS] : [LEJOS, CERCA];
        const x = a[0] + (b[0] - a[0]) * f, yb = a[1] + (b[1] - a[1]) * f;
        const y = yb - Math.sin(f * Math.PI) * 140;
        const z = 0.45 + 0.55 * ((yb - 610) / 560); // más chica al fondo
        return { x, y, yb, z };
      };
      const pinta = (v) => {
        const p = pos(v);
        q(".s01-pelota").setAttribute("transform", `translate(${p.x} ${p.y}) scale(${p.z})`);
        q(".s01-sombra").setAttribute("cx", p.x); q(".s01-sombra").setAttribute("cy", p.yb + 20 * p.z);
        q(".s01-sombra").setAttribute("r", 14 * p.z);
        [1, 2, 3, 4].forEach((i) => { const g = pos(Math.max(0, v - i * 0.035)); const c = q(".s01-g" + i); c.setAttribute("cx", g.x); c.setAttribute("cy", g.y); c.setAttribute("r", 18 * g.z); });
      };
      const bola = { v: T * 0.45 };
      pinta(bola.v);
      tl.to(bola, { v: T * 0.45 + DUR, duration: DUR, ease: "none", onUpdate: () => pinta(bola.v) }, 0);
      // la empleada golpea cada vez que la pelota llega a ella
      for (let k = 1; T * k - T * 0.45 < DUR; k += 2) {
        const t = T * (k + 1) - T * 0.45;
        if (t > DUR - 0.2) break;
        tl.to(q(".s01-cel"), { rotation: -28, svgOrigin: "540 1250", duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, t - 0.06);
      }

      // cuadro 0: la cancha ya está, la cámara se acerca despacio
      tl.fromTo(q(".s01-escenario"), { scale: 1.05 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);
      tl.fromTo(q(".s01-cancha"), { opacity: 0.6 }, { opacity: 1, duration: 0.3 }, 0);

      // "mirá este partido": placa de TV que entra barriendo
      gsap.set(q(".s01-mira"), { opacity: 0 });
      tl.fromTo(q(".s01-mira"), { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out", immediateRender: false }, PARTIDO - 0.2);

      // "cuarenta minutos": placa del reloj que golpea
      golpe(".s01-reloj", CUARENTA, 2);
      sacudon(CUARENTA + 0.05, 0.6);
      tl.fromTo(q(".s01-reloj .t"), { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 2.6);

      // "¿hay stock?": gigante con sacudón, todo lo demás se apaga
      golpe(".s01-stock", STOCK, 2.6);
      tl.to([q(".s01-cancha"), q(".s01-empleada"), q(".s01-deposito"), q(".s01-cajas")], { opacity: 0.45, duration: 0.15 }, STOCK);
      sacudon(STOCK + 0.06, 1);
      tl.to(q(".s01-stock"), { rotation: -3, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, STOCK + 0.3);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
