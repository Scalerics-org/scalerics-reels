<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    [data-composition-id="ambiente"] .amb-franjas { position: absolute; left: 0; top: -240px; width: 1080px; height: 2400px; opacity: 0.6;
      background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0) 0px, rgba(255, 255, 255, 0) 120px, rgba(255, 255, 255, 0.025) 120px, rgba(255, 255, 255, 0.025) 240px); }
    [data-composition-id="ambiente"] .amb-flash { position: absolute; inset: 0; background: #f7f7f2; opacity: 0; }
    [data-composition-id="ambiente"] .amb-flash-v { position: absolute; inset: 0; background: #7a4bb8; opacity: 0; }
    [data-composition-id="ambiente"] .amb-flash-a { position: absolute; inset: 0; background: #e3f53a; opacity: 0; }
    /* marcador de TV */
    [data-composition-id="ambiente"] .amb-marcador { position: absolute; left: 60px; top: 104px; width: 470px; height: 92px; display: flex; flex-direction: column; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35); }
    [data-composition-id="ambiente"] .amb-fila { display: flex; height: 46px; align-items: stretch; background: #0f3d24; font-family: "Lexend", sans-serif; font-weight: 700; font-size: 27px; color: #f7f7f2; }
    [data-composition-id="ambiente"] .amb-fila + .amb-fila { border-top: 2px solid #1f5426; }
    [data-composition-id="ambiente"] .amb-nom { width: 250px; display: flex; align-items: center; gap: 10px; padding-left: 16px; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; border-left: 8px solid #5b2d8c; }
    [data-composition-id="ambiente"] .amb-saque { width: 12px; height: 12px; border-radius: 50%; background: #e3f53a; flex: none; }
    [data-composition-id="ambiente"] .amb-n { width: 52px; display: flex; align-items: center; justify-content: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; color: #f7f7f2; opacity: 0.75; }
    [data-composition-id="ambiente"] .amb-pts { width: 116px; display: flex; align-items: center; justify-content: center; background: #5b2d8c; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; color: #e3f53a; }
    [data-composition-id="ambiente"] .amb-placa { position: absolute; left: 546px; top: 104px; width: 474px; height: 92px; background: #f7f7f2; display: flex; flex-direction: column; justify-content: center; padding: 0 20px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35); border-left: 8px solid #e3f53a; }
    [data-composition-id="ambiente"] .amb-lbl { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.1em; color: #5b2d8c; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-reloj { font-family: "Lexend", sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05; color: #0f3d24; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-rotulo { position: absolute; right: 60px; top: 1610px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.16em; color: #f7f7f2; opacity: 0.5; text-align: right; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="75.37">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="75.37" data-track-index="0">
      <div class="amb-franjas"></div>
      <div class="amb-marcador">
        <div class="amb-fila amb-f1"><div class="amb-nom"><span class="amb-saque amb-s1"></span><span class="amb-nom1">Local</span></div><div class="amb-n amb-set1">0</div><div class="amb-n amb-gam1">0</div><div class="amb-pts amb-p1">0</div></div>
        <div class="amb-fila amb-f2"><div class="amb-nom"><span class="amb-saque amb-s2" style="opacity:0"></span><span class="amb-nom2">Depósito</span></div><div class="amb-n amb-set2">0</div><div class="amb-n amb-gam2">0</div><div class="amb-pts amb-p2">0</div></div>
      </div>
      <div class="amb-placa">
        <div class="amb-lbl">Cancha central · tiempo</div>
        <div class="amb-reloj">40:00</div>
      </div>
      <div class="amb-rotulo" data-layout-ignore>CÁMARA 1 · CÉSPED</div>
      <div class="amb-flash"></div>
      <div class="amb-flash-v"></div>
      <div class="amb-flash-a"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 75.37;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // momentos (segundos globales = palabras de la locución)
      const SAQUE = 12.06, EXCEL = 16.13, CENTRO = 22.02, OTRO = 26.1, AYER = 30.14, NADA = 31.58;
      const OUT = 32.63, DEUCE = 34.49, GAME = 40.48, FIN = 43.21, SCAL = 52.1, HALCON = 62.6, SEGUNDO = 66.22;

      // puntos del peloteo [desde, local, depósito]
      const PUNTOS = [[0, "0", "0"], [SAQUE, "15", "0"], [EXCEL, "15", "15"], [CENTRO, "15", "30"], [OTRO, "30", "30"], [AYER, "40", "30"], [NADA, "40", "40"], [OUT, "40", "40"]];
      const p2 = (n) => String(n).padStart(2, "0");
      const mmss = (s) => p2(Math.floor(s / 60)) + ":" + p2(Math.floor(s % 60));
      const set = (sel, v) => { const el = q(sel); if (el.textContent !== v) el.textContent = v; };
      const pinta = (t) => {
        let lbl = "Cancha central · tiempo", reloj, n1 = "Local", n2 = "Depósito", p1, pp2, g1 = "0", g2 = "0", s1 = "0", s2 = "0";
        let col1 = "#e3f53a", col2 = "#e3f53a";
        const pt = PUNTOS.filter((x) => x[0] <= t).at(-1);
        p1 = pt[1]; pp2 = pt[2];
        reloj = mmss(40 * 60 + t);
        if (t >= DEUCE - 1.86 && t < GAME) { lbl = "Cuarenta iguales"; reloj = "DEUCE · " + mmss(40 * 60 + t); }
        if (t >= GAME && t < SCAL) { lbl = "Game, set y partido"; reloj = "GANA: ENFRENTE"; n2 = "Enfrente"; p1 = "0"; pp2 = "W"; g1 = "0"; g2 = "6"; s2 = "1"; col1 = "#f7f7f2"; }
        if (t >= SCAL) { lbl = "Tu local · stock"; n1 = "Mostrador"; n2 = "Depósito"; p1 = "0"; pp2 = "0"; reloj = "00:00"; }
        if (t >= HALCON) { lbl = "Ojo de halcón"; reloj = "DEPÓSITO: 2"; }
        if (t >= SEGUNDO) { lbl = "Punto en"; reloj = "00:01"; p1 = "15"; }
        set(".amb-lbl", lbl); set(".amb-reloj", reloj); set(".amb-nom1", n1); set(".amb-nom2", n2);
        set(".amb-p1", p1); set(".amb-p2", pp2); set(".amb-gam1", g1); set(".amb-gam2", g2); set(".amb-set1", s1); set(".amb-set2", s2);
        q(".amb-p1").style.color = col1; q(".amb-p2").style.color = col2;
      };
      const reloj_t = { t: 0 };
      pinta(0);
      tl.to(reloj_t, { t: DUR, duration: DUR, ease: "none", onUpdate: () => pinta(reloj_t.t) }, 0);

      // el césped se desliza muy lento (la cámara sigue el juego)
      tl.fromTo(q(".amb-franjas"), { y: 0 }, { y: 240, duration: DUR, ease: "none" }, 0);
      // el punto de saque late
      tl.to(q(".amb-s1"), { opacity: 0.25, duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor(DUR / 0.6) - 1), ease: "steps(1)" }, 0);
      // el marcador entra ya puesto en el cuadro 0
      tl.fromTo([q(".amb-marcador"), q(".amb-placa")], { x: -24, opacity: 0.6 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.06 }, 0);
      // cada cambio de punto salta
      [SAQUE, EXCEL, CENTRO, OTRO, AYER, NADA, GAME, SCAL, SEGUNDO].forEach((t) => {
        tl.fromTo([q(".amb-p1"), q(".amb-p2")], { scale: 1.3 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t);
      });
      [OUT, GAME, SCAL, HALCON, SEGUNDO].forEach((t) => {
        tl.fromTo(q(".amb-placa"), { scale: 1.08 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false, transformOrigin: "50% 50%" }, t);
      });

      // flashes
      [[".amb-flash", OUT, 0.45], [".amb-flash", SCAL, 0.4], [".amb-flash-v", GAME, 0.35], [".amb-flash-a", HALCON, 0.25]].forEach(([sel, t, o]) => {
        tl.to(q(sel), { opacity: o, duration: 0.03 }, t);
        tl.to(q(sel), { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.04);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
