    (function () {
      const ID = "s04-excel";
      const DUR = 4.0;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s04-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      const EXCEL = 0.47, PELOTA = 1.32, AL = 2.2, VALIENTE = 2.62;

      // la pelota viene hacia la cámara y en "Excel" se vuelve planilla

      const pos = (f) => ({ x: A[0] + (B[0] - A[0]) * f, y: A[1] + (B[1] - A[1]) * f - Math.sin(f * Math.PI) * 120, s: 0.5 + 1.5 * f });

        q(".s04-pelota").setAttribute("transform", `translate(${p.x} ${p.y}) scale(${p.s})`);

      const b1 = { f: 0.15 };

      tl.to(b1, { f: 1, duration: EXCEL - 0.05, ease: "power1.in", onUpdate: () => pinta(b1.f) }, 0);
      tl.to([q(".s04-pelota"), q(".s04-estela")], { opacity: 0, duration: 0.05 }, EXCEL - 0.05);

      // la planilla aparece de golpe
      gsap.set(q(".s04-hoja"), { opacity: 0 });
      tl.fromTo(q(".s04-hoja"), { opacity: 0, scale: 0.2, svgOrigin: "540 900" }, { opacity: 1, scale: 1, svgOrigin: "540 900", duration: 0.2, ease: "back.out(1.6)", immediateRender: false }, EXCEL - 0.08);
      sacudon(EXCEL + 0.1, 0.8);
      tl.fromTo(q(".s04-marca"), { opacity: 0 }, { opacity: 1, duration: 0.08, yoyo: true, repeat: 5, ease: "steps(1)" }, EXCEL + 0.2);
      tl.fromTo(q(".s04-fijate"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25 }, EXCEL + 0.1);

      // "pelota al Excel": la planilla se achica y se para en la cancha como un jugador

      tl.fromTo(q(".s04-piso"), { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, PELOTA - 0.2);
      tl.to(q(".s04-hoja"), { scale: 0.62, y: 110, svgOrigin: "540 900", duration: 0.32, ease: "power3.inOut" }, PELOTA - 0.15);
      tl.fromTo(q(".s04-piernas"), { opacity: 0, scale: 0.62, svgOrigin: "540 900", y: 70 }, { opacity: 1, scale: 0.62, y: 110, svgOrigin: "540 900", duration: 0.25, ease: "back.out(2)", immediateRender: false }, PELOTA + 0.15);
      tl.fromTo(q(".s04-cara"), { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, PELOTA + 0.2);
      // la pelota vuelve a entrar y le pega la planilla
      const b2 = { f: 0 };
      const A2 = [160, 660], B2 = [705, 990];

      tl.set([q(".s04-pelota"), q(".s04-estela")], { opacity: 1 }, AL - 0.4);
      tl.to(b2, { f: 1, duration: 0.4, ease: "none", onUpdate: () => { const p = pos2(b2.f); q(".s04-pelota").setAttribute("transform", `translate(${p.x} ${p.y}) scale(0.8)`); est.forEach((c, i) => { const g = pos2(Math.max(0, b2.f - (i + 1) * 0.07)); c.setAttribute("cx", g.x); c.setAttribute("cy", g.y); c.setAttribute("r", 18); }); } }, AL - 0.4);
      tl.to(q(".s04-raq"), { rotation: -40, svgOrigin: "870 1060", duration: 0.1, yoyo: true, repeat: 1 }, AL - 0.05);
      // y sale rebotada para cualquier lado (sale de cuadro arriba a la izquierda)
      const b3 = { f: 0 };
      const A3 = [705, 990], B3 = [-60, 560];
      tl.to(b3, { f: 1, duration: 0.45, ease: "power1.out", onUpdate: () => { const x = A3[0] + (B3[0] - A3[0]) * b3.f, y = A3[1] + (B3[1] - A3[1]) * b3.f - Math.sin(b3.f * Math.PI) * 160; q(".s04-pelota").setAttribute("transform", `translate(${x} ${y}) scale(0.8)`); est.forEach((c) => c.setAttribute("cx", x)); est.forEach((c) => c.setAttribute("cy", y)); } }, AL + 0.02);
