    (function () {

      const LARGO = 0.37, LADO = 2.28, OTRO = 3.0, FRUT = 4.28, CREMA = 4.91;

      const T = 0.72, OFF = LADO - T * 5; // en LADO y en OTRO la pelota llega a un costado
      const pos = (t) => { const v = t - OFF, k = Math.floor(v / T), f = (v % T) / T; const fx = k % 2 === 0 ? f : 1 - f; return { x: 40 + fx * 1000, y: 1250 - Math.sin(f * Math.PI) * 120, fx }; };
      const est = [];
      for (let i = 1; i <= 5; i++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("fill", "#e3f53a"); c.setAttribute("opacity", String(0.6 - i * 0.1)); q(".s06-estela").appendChild(c); est.push(c); }
      const pinta = (t) => {
        const p = pos(t);
        q(".s06-pelota").setAttribute("transform", `translate(${p.x} ${p.y})`);
        est.forEach((c, i) => { const g = pos(Math.max(0, t - (i + 1) * 0.03)); c.setAttribute("cx", g.x); c.setAttribute("cy", g.y); c.setAttribute("r", 28 - i * 3); });
        const lado = (p.fx - 0.5) * 2 * Math.max(0, Math.min(1, (FRUT - 0.1 - t) / 0.3)); // -1 izquierda, 1 derecha; en las frutillas deja de mirar
        q(".s06-pupilas").setAttribute("transform", `translate(${lado * 9} 0)`);
        q(".s06-cara").setAttribute("transform", `translate(${lado * 22} 0)`);
        q(".s06-cabeza").setAttribute("transform", `rotate(${lado * 7} 540 1060)`);
      };
      const reloj = { t: 0 };
      pinta(0);
      tl.to(reloj, { t: DUR, duration: DUR, ease: "none", onUpdate: () => pinta(reloj.t) }, 0);
      // en las frutillas se cansa: la pelota sigue pero ella deja de seguirla
      tl.to([q(".s06-pelota"), q(".s06-estela")], { opacity: 0.35, duration: 0.2 }, FRUT - 0.1);

      tl.fromTo(q(".s06-escenario"), { scale: 1.05 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);
      tl.fromTo(q(".s06-clienta"), { y: 30, opacity: 0.7 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);

      golpe(".s06-golpes", LARGO + 0.3, 1.8);
      const n = { v: 112 };
      tl.to(n, { v: 268, duration: DUR - LARGO - 0.5, ease: "none", onUpdate: () => { q(".s06-n").textContent = String(Math.round(n.v)); } }, LARGO + 0.3);
