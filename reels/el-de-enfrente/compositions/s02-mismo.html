  <script>
    (function () {
      const ID = "s02-mismo";
      const DUR = 4.4;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const BARRIO = 0.24;
      const PRECIOS = 1.16;
      const CRISIS = 2.24;
      const Y = 3.04;
      const VENDE = 3.12;
      const MAS = 3.38;
      const VOS = 3.72;

      const SUELO = 820;
      const XA = 290;
      const XB = 790;
      const FILAS = [925, 1035, 1145];

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // posiciones
      gsap.set(q(".s02-tuyo"), { x: XA, y: SUELO });
      gsap.set(q(".s02-otro"), { x: XB, y: SUELO });
      gsap.set(qa(".s02-tuyo-in, .s02-otro-in"), { scale: 0.62, svgOrigin: "0 0" });
      qa(".s02-fila").forEach((f, i) => gsap.set(f, { y: FILAS[i] }));
      qa(".s02-fila").forEach((f) => {
        gsap.set(f.querySelectorAll(".s02-it")[0], { x: XA });
        gsap.set(f.querySelectorAll(".s02-it")[1], { x: XB });
        gsap.set(f.querySelector(".s02-igual"), { x: 540 });
      });
      gsap.set(qa(".s02-it"), { opacity: 0 });
      gsap.set(qa(".s02-luz-b"), { opacity: 0 });

      // toda la escena se acerca despacio (nunca queda quieta)
      tl.fromTo(q(".s02-todo"), { scale: 0.97, svgOrigin: "540 960" }, { scale: 1.02, svgOrigin: "540 960", duration: DUR, ease: "none" }, 0);

      // los dos locales arrancan medio dibujados, iguales
      dibujar(qa(".s02-dib-a"), 0, 0.55, 0.45);
      dibujar(qa(".s02-dib-b"), 0.04, 0.55, 0.45);
      tl.fromTo(q(".s02-suelo"), { scaleX: 0.5, svgOrigin: "540 820" }, { scaleX: 1, svgOrigin: "540 820", duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(qa(".s02-txt-a, .s02-txt-b"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3);

      // fila 1: "barrio"
      pop(q(".s02-f1a"), BARRIO);
      pop(q(".s02-f1b"), BARRIO + 0.08);
      dibujar([q(".s02-ig1")], BARRIO + 0.2, 0.35);
      tl.fromTo(qa(".s02-f1a, .s02-f1b"), { rotation: -3 }, { rotation: 3, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, BARRIO + 0.35);
      tl.to(qa(".s02-f1a, .s02-f1b"), { rotation: 0, duration: 0.15 }, BARRIO + 1.15);

      // fila 2: "precios"
      pop(q(".s02-f2a"), PRECIOS - 0.04);
      pop(q(".s02-f2b"), PRECIOS + 0.04);
      dibujar([q(".s02-ig2")], PRECIOS + 0.18, 0.35);
      tl.fromTo(q(".s02-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, PRECIOS);
      tl.to(qa(".s02-f2a, .s02-f2b"), { y: -8, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, PRECIOS + 0.6);

      // fila 3: "crisis": la línea baja se dibuja en los dos a la vez
      tl.to(qa(".s02-f3a, .s02-f3b"), { opacity: 1, duration: 0.05 }, CRISIS - 0.12);
      dibujar(qa(".s02-f3a .s02-eje"), CRISIS - 0.12, 0.35);
      dibujar(qa(".s02-f3b .s02-eje"), CRISIS - 0.12, 0.35);
      dibujar(qa(".s02-f3a .s02-baja"), CRISIS + 0.05, 0.5);
      dibujar(qa(".s02-f3b .s02-baja"), CRISIS + 0.05, 0.5);
      tl.fromTo(qa(".s02-baja-p"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, CRISIS + 0.5);
      dibujar([q(".s02-ig3")], CRISIS + 0.2, 0.35);
      // los tres "=" laten juntos
      tl.to(qa(".s02-igual"), { scale: 1.3, transformOrigin: "50% 50%", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, CRISIS + 0.62);

      // "Y vende más": las filas se van, aparecen las barras
      tl.to(q(".s02-filas"), { opacity: 0, y: 30, duration: 0.2, ease: "power2.in" }, Y - 0.12);
      tl.to(q(".s02-e1"), { opacity: 0, duration: 0.2 }, Y - 0.1);
      dibujar([q(".s02-base")], Y, 0.35);
      dibujar([q(".s02-barra-vos")], VENDE, 0.35);
      tl.fromTo(q(".s02-barra-el"), { scaleY: 0, svgOrigin: "790 1180" }, { scaleY: 1, svgOrigin: "790 1180", duration: 0.45, ease: "back.out(1.8)" }, VENDE);
      tl.fromTo(q(".s02-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, VENDE);
      // él se prende, vos te apagás
      tl.to(qa(".s02-luz-b"), { opacity: 0.85, duration: 0.2 }, VENDE + 0.1);
      tl.to(qa(".s02-dib-a, .s02-txt-a, .s02-barra-vos"), { opacity: 0.4, duration: 0.35 }, VENDE + 0.1);
      // "más": punch en la barra de él y en su local
      tl.to(q(".s02-barra-el"), { scaleY: 1.08, svgOrigin: "790 1180", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, MAS);
      tl.to(q(".s02-otro-in"), { scale: 0.68, svgOrigin: "0 0", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, MAS);
      // "vos": tu barra se achica un poco más
      tl.to(q(".s02-barra-vos"), { scaleY: 0.6, svgOrigin: "290 1180", duration: 0.3, ease: "power3.out" }, VOS);

      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
