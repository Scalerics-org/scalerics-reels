  <div id="root" data-composition-id="s03-por-que" data-width="1080" data-height="1920" data-duration="3.70">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="3.70" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">

        <g class="s03-fila">
          <!-- 1: trébol -->
          <g class="s03-ico s03-ico1">
            <g class="s03-dib">
              <path class="ln s03-d1" d="M0 -10 C-12 -18 -40 -26 -34 -50 C-28 -66 -6 -64 0 -48 C6 -64 28 -66 34 -50 C40 -26 12 -18 0 -10 Z" />
              <path class="ln s03-d1" transform="rotate(90)" d="M0 -10 C-12 -18 -40 -26 -34 -50 C-28 -66 -6 -64 0 -48 C6 -64 28 -66 34 -50 C40 -26 12 -18 0 -10 Z" />
              <path class="ln s03-d1" transform="rotate(180)" d="M0 -10 C-12 -18 -40 -26 -34 -50 C-28 -66 -6 -64 0 -48 C6 -64 28 -66 34 -50 C40 -26 12 -18 0 -10 Z" />
              <path class="ln s03-d1" transform="rotate(270)" d="M0 -10 C-12 -18 -40 -26 -34 -50 C-28 -66 -6 -64 0 -48 C6 -64 28 -66 34 -50 C40 -26 12 -18 0 -10 Z" />

              <rect class="ln s03-d2" x="-52" y="16" width="34" height="30" rx="4" />

  <script>
    (function () {
      const ID = "s03-por-que";
      const DUR = 3.7;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const QUE = 0.22;
      const NO = 0.8;
      const SUERTE = 1.14;
      const NI1 = 1.74;
      const LOCAL = 2.06;
      const NI2 = 2.52;
      const PLATA = 2.92;

      const Y = 920;
      const XS = [270, 540, 810];
      const BADGE = [[64, -90], [70, -64], [64, -90]];

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const badge = (el, t) => {
        const inn = el.querySelector(".s03-b-in");
        tl.fromTo(inn, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const sacudir = (el, t) => {
        tl.to(el, { x: -6, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      };
      const nombre = (el, t) => {
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

      // posiciones
      gsap.set(q(".s03-preg"), { x: 540, y: 880 });
      const icos = [q(".s03-ico1"), q(".s03-ico2"), q(".s03-ico3")];
      icos.forEach((g, i) => gsap.set(g, { x: XS[i], y: Y }));
      qa(".s03-dib").forEach((d) => gsap.set(d, { scale: 1.12, svgOrigin: "0 0" }));
      [q(".s03-b1"), q(".s03-b2"), q(".s03-b3")].forEach((b, i) => gsap.set(b, { x: XS[i] + BADGE[i][0] * 1.12, y: Y + BADGE[i][1] * 1.12 }));
      qa(".s03-b-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      qa(".s03-n").forEach((n) => gsap.set(n, { opacity: 0 }));
      gsap.set(q(".s03-pesos"), { opacity: 0 });

      // "¿Por qué?": el signo se dibuja ya medio hecho y se balancea
      dibujar([q(".s03-preg-l")], 0, 0.45, 0.3);
      tl.fromTo(q(".s03-preg-in"), { scale: 1.05, svgOrigin: "0 0" }, { scale: 1.3, svgOrigin: "0 0", duration: 0.45, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s03-preg-p"), { opacity: 0, scale: 0.3, svgOrigin: "0 140" }, { opacity: 1, scale: 1, svgOrigin: "0 140", duration: 0.3, ease: "back.out(2.4)" }, QUE);
      tl.to(q(".s03-preg-in"), { rotation: -10, svgOrigin: "0 140", duration: 0.18, ease: "sine.inOut" }, QUE + 0.1);
      tl.to(q(".s03-preg-in"), { rotation: 8, svgOrigin: "0 140", duration: 0.2, ease: "sine.inOut" }, QUE + 0.28);
      // "No": el signo se va para arriba y se achica
      tl.to(q(".s03-preg-in"), { rotation: 0, scale: 0.4, opacity: 0, y: -80, svgOrigin: "0 0", duration: 0.25, ease: "power2.in" }, NO - 0.1);

      // la fila entera se acerca muy despacio
      tl.fromTo(q(".s03-fila"), { scale: 1.05, svgOrigin: "540 " + Y }, { scale: 1, svgOrigin: "540 " + Y, duration: DUR - NO, ease: "none" }, NO);

      // 1. suerte
      dibujar(qa(".s03-d1"), NO + 0.06, 0.4);
      tl.fromTo(q(".s03-ico1 .s03-dib"), { rotation: -30, svgOrigin: "0 0" }, { rotation: 0, svgOrigin: "0 0", duration: 0.55, ease: "back.out(1.8)" }, NO + 0.06);
      nombre(q(".s03-ico1 .s03-n"), SUERTE);
      badge(q(".s03-b1"), SUERTE + 0.12);
      sacudir(q(".s03-ico1 .s03-dib"), SUERTE + 0.14);

      // 2. el local
      tl.to(q(".s03-ico1"), { opacity: 0.4, duration: 0.3 }, NI1);
      dibujar(qa(".s03-d2"), NI1 + 0.04, 0.4);
      tl.fromTo(q(".s03-ico2 .s03-dib"), { y: 20 }, { y: 0, duration: 0.45, ease: "power3.out" }, NI1 + 0.04);
      nombre(q(".s03-ico2 .s03-n"), LOCAL);
      badge(q(".s03-b2"), LOCAL + 0.12);
      sacudir(q(".s03-ico2 .s03-dib"), LOCAL + 0.14);

      // 3. la plata
      tl.to(q(".s03-ico2"), { opacity: 0.4, duration: 0.3 }, NI2);
      dibujar(qa(".s03-d3"), NI2 + 0.04, 0.4);
      tl.fromTo(q(".s03-pesos"), { opacity: 0, scale: 0.5, svgOrigin: "0 20" }, { opacity: 1, scale: 1, svgOrigin: "0 20", duration: 0.3, ease: "back.out(2)" }, NI2 + 0.3);
      tl.fromTo(q(".s03-ico3 .s03-dib"), { rotation: 12, svgOrigin: "0 74" }, { rotation: 0, svgOrigin: "0 74", duration: 0.5, ease: "back.out(2)" }, NI2 + 0.04);
      nombre(q(".s03-ico3 .s03-n"), PLATA);
      badge(q(".s03-b3"), PLATA + 0.12);
      sacudir(q(".s03-ico3 .s03-dib"), PLATA + 0.14);

      // "nada de eso"
      tl.fromTo(q(".s03-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, PLATA);
      tl.to(qa(".s03-b-in"), { scale: 1.22, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, PLATA + 0.4);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
