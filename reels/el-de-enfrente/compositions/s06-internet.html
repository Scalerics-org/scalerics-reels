  <script>
    (function () {
      const ID = "s06-internet";
      const DUR = 4.44;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const VENDE = 0.18;
      const INTERNET = 0.62;
      const MIENTRAS = 1.06;
      const DUERME = 1.5;
      const VOS = 2.36;
      const DEPENDES = 2.6;
      const PASE = 3.5;
      const PUERTA = 4.16;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // ===== ÉL =====
      gsap.set(q(".s06-casa"), { x: 300, y: 1080 });
      gsap.set(q(".s06-luna"), { x: 170, y: 730, scale: 0.8 });
      // casa y laptop arrancan medio dibujadas (el cuadro 0 no puede ser negro)
      dibujar(qa(".s06-dib-casa"), 0, 0.55, 0.45);
      dibujar(qa(".s06-dib-lap"), 0.05, 0.55, 0.45);
      dibujar([q(".s06-dib-luna")], 0.1, 0.6);
      tl.fromTo(q(".s06-rot-el"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.05);
      tl.fromTo(q(".s06-luna-in"), { rotation: -20, svgOrigin: "0 0" }, { rotation: 0, svgOrigin: "0 0", duration: 1.2, ease: "power2.out" }, 0.1);
      tl.fromTo(q(".s06-estrella"), { opacity: 0, scale: 0.2, svgOrigin: "-84 -55" }, { opacity: 1, scale: 1, svgOrigin: "-84 -55", duration: 0.35, ease: "back.out(2.4)" }, 0.5);
      tl.to(q(".s06-estrella"), { rotation: 90, svgOrigin: "-84 -55", duration: 0.9, ease: "power2.inOut" }, 0.9);
      tl.fromTo(qa(".s06-tienda, .s06-online"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, VENDE + 0.1);
      dibujar([q(".s06-div")], VENDE + 0.1, 0.35);
      tl.fromTo(q(".s06-online"), { scale: 1, svgOrigin: "904 774" }, { scale: 1.5, svgOrigin: "904 774", duration: 0.2, ease: "power2.out", yoyo: true, repeat: 3 }, INTERNET);

      // Zzz: suben y titilan en cadena, todo el tramo
      qa(".s06-z").forEach((z, i) => {
        tl.fromTo(z, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.25 + i * 0.18);
        tl.to(z, { y: -10, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0.65 + i * 0.18);
      });

      // "+1 pedido": caen uno tras otro y empujan a los anteriores
      const SLOT0 = 846;
      const PASO = 64;
      const T = [INTERNET, MIENTRAS, DUERME, DUERME + 0.4];
      const pills = qa(".s06-pill");
      pills.forEach((p, i) => {
        tl.fromTo(p, { y: SLOT0 - 40, opacity: 0 }, { y: SLOT0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, T[i]);
        tl.fromTo(p.querySelector(".s06-pill-in"), { scale: 0.85, svgOrigin: "761 0" }, { scale: 1, svgOrigin: "761 0", duration: 0.35, ease: "back.out(1.6)" }, T[i]);
        for (let j = i + 1; j < T.length; j++) {
          const slot = j - i;
          tl.to(p, { y: SLOT0 + slot * PASO, duration: 0.3, ease: "power3.out" }, T[j]);
          if (slot >= 3) tl.to(p, { opacity: 0, duration: 0.2 }, T[j]);
        }
      });
      tl.to(q(".s06-laptop"), { y: -6, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, DUERME);
      tl.fromTo(q(".s06-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, INTERNET);

      // sale él
      tl.to(q(".s06-el"), { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, VOS - 0.2);
      tl.to(q(".s06-e1"), { opacity: 0, duration: 0.2 }, VOS - 0.15);

      // ===== VOS =====
      gsap.set(q(".s06-local"), { x: 330, y: 1060, opacity: 0.45 });
      gsap.set(q(".s06-yo"), { x: 330, y: 1060, opacity: 0 });
      tl.fromTo(q(".s06-rot-vos"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, VOS);
      dibujar(qa(".s06-dib-l"), VOS - 0.05, 0.5);
      dibujar([q(".s06-suelo")], VOS - 0.05, 0.5);
      tl.fromTo(q(".s06-txt-l"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, VOS + 0.3);
      // la puerta se abre y aparecés vos parado
      tl.fromTo(q(".s06-hoja"), { opacity: 0, scaleX: 0.2, svgOrigin: "36 0" }, { opacity: 1, scaleX: 1, svgOrigin: "36 0", duration: 0.35, ease: "back.out(1.6)" }, VOS + 0.2);
      tl.fromTo(q(".s06-yo"), { opacity: 0, scale: 0.85, svgOrigin: "0 0" }, { opacity: 0.6, scale: 1, svgOrigin: "0 0", duration: 0.35, ease: "back.out(1.6)" }, DEPENDES);
      tl.fromTo(q(".s06-calle"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, DEPENDES);
      tl.fromTo(q(".s06-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, DEPENDES);

      // relojito que avanza
      gsap.set(q(".s06-reloj"), { opacity: 0.75 });
      dibujar(qa(".s06-dib-reloj"), VOS + 0.05, 0.45);
      tl.fromTo(qa(".s06-hora-m, .s06-hora-h"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, VOS + 0.3);
      tl.fromTo(q(".s06-hora-m"), { rotation: 0, svgOrigin: "780 800" }, { rotation: 540, svgOrigin: "780 800", duration: DUR - VOS - 0.3, ease: "none" }, VOS + 0.3);
      tl.fromTo(q(".s06-hora-h"), { rotation: 0, svgOrigin: "780 800" }, { rotation: 45, svgOrigin: "780 800", duration: DUR - VOS - 0.3, ease: "none" }, VOS + 0.3);

      // "pase por la puerta": pasa uno de largo, sin entrar
      const P0 = PASE - 0.25;
      const pd = PUERTA + 0.15 - P0;
      tl.fromTo(q(".s06-p"), { x: 1040, y: 1188, opacity: 0 }, { x: 990, opacity: 1, duration: 0.12, ease: "none" }, P0);
      tl.to(q(".s06-p"), { x: 60, duration: pd, ease: "none" }, P0 + 0.12);
      tl.to(q(".s06-p"), { opacity: 0, duration: 0.15 }, P0 + 0.12 + pd - 0.15);
      tl.fromTo(q(".s06-p-cuerpo"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 5 }, P0);
      // vos lo seguís con la cabeza
      tl.to(q(".s06-yo-cab"), { x: 5, duration: 0.25, ease: "power2.out" }, PASE - 0.1);
      tl.to(q(".s06-yo-cab"), { x: -5, duration: 0.4, ease: "power2.inOut" }, PUERTA - 0.2);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
