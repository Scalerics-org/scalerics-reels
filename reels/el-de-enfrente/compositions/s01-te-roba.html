            <rect class="ln s01-dib-a" x="-80" y="-290" width="160" height="50" rx="10" />

  <script>
    (function () {
      const ID = "s01-te-roba";
      const DUR = 5.06;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const ENFRENTE = 0.74;
      const ROBANDO = 1.8;
      const CLIENTES = 2.4;
      const VISTA = 3.92;
      const TODOS = 4.4;

      const SUELO = 1120;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // tu local arranca medio dibujado (el cuadro 0 no puede ser negro), con la luz prendida
      gsap.set(q(".s01-tuyo"), { x: 270, y: SUELO });
      gsap.set(q(".s01-otro"), { x: 810, y: SUELO });
      dibujar(qa(".s01-dib-a"), 0, 0.6, 0.45);
      tl.fromTo(q(".s01-txt-a"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3);
      tl.fromTo(qa(".s01-luz-a"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 0.4);
      tl.fromTo(q(".s01-suelo"), { scaleX: 0.5, svgOrigin: "540 1120" }, { scaleX: 1, svgOrigin: "540 1120", duration: 0.7, ease: "power3.out" }, 0);

      // "enfrente": aparece el otro, con golpe
      dibujar(qa(".s01-dib-b"), ENFRENTE - 0.1, 0.5);
      tl.fromTo(q(".s01-txt-b"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, ENFRENTE + 0.3);
      gsap.set(qa(".s01-luz-b"), { opacity: 0 });
      tl.fromTo(q(".s01-otro-in"), { scale: 1.12, svgOrigin: "0 -110" }, { scale: 1, svgOrigin: "0 -110", duration: 0.4, ease: "power3.out" }, ENFRENTE);

      // "robando clientes": salen de tu local y cruzan al de enfrente
      qa(".s01-p").forEach((p, i) => {
        const t0 = ROBANDO + i * 0.32;
        tl.fromTo(p, { x: 270, y: SUELO, opacity: 0 }, { x: 330, opacity: 1, duration: 0.18, ease: "none" }, t0);
        tl.to(p, { x: 750, duration: 0.95, ease: "none" }, t0 + 0.18);
        tl.to(p, { opacity: 0, duration: 0.12 }, t0 + 1.08);
        tl.fromTo(p.querySelector("path"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 5 }, t0);
      });
      dibujar([q(".s01-flecha")], ROBANDO + 0.1, 0.7);
      tl.fromTo(q(".s01-punta"), { opacity: 0 }, { opacity: 1, duration: 0.12 }, ROBANDO + 0.75);
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, ROBANDO);
      // tu local se apaga, el de enfrente se prende
      tl.to(qa(".s01-luz-a"), { opacity: 0, duration: 0.3 }, CLIENTES + 0.3);
      tl.to(qa(".s01-dib-a, .s01-txt-a"), { opacity: 0.4, duration: 0.4 }, CLIENTES + 0.3);
      tl.to(qa(".s01-luz-b"), { opacity: 0.85, duration: 0.25 }, CLIENTES + 0.6);
      tl.to(q(".s01-otro-in"), { scale: 1.06, svgOrigin: "0 -110", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, CLIENTES + 0.6);

      // "a la vista de todos": se abre un ojo arriba y mira de un local al otro
      gsap.set(q(".s01-ojo"), { opacity: 1 });
      dibujar(qa(".s01-ojo-l"), VISTA - 0.15, 0.4);
      tl.fromTo(q(".s01-pupila"), { opacity: 0, scale: 0.4, svgOrigin: "540 690" }, { opacity: 1, scale: 1, svgOrigin: "540 690", duration: 0.25, ease: "back.out(2)" }, VISTA + 0.15);
      tl.to(q(".s01-pupila"), { x: -14, duration: 0.25, ease: "power2.inOut" }, VISTA + 0.4);
      tl.to(q(".s01-pupila"), { x: 14, duration: 0.3, ease: "power2.inOut" }, TODOS);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.2 }, VISTA - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, VISTA);
      tl.to(qa(".s01-flecha, .s01-punta"), { opacity: 0, duration: 0.25 }, VISTA);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
