      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s04-todo">

          <g class="s04-tel-a">
            <rect class="ln s04-dib-a" x="130" y="610" width="340" height="590" rx="52" />

            <text class="rotulo s04-rot-a" x="300" y="686" text-anchor="middle">VOS</text>
            <circle class="ln s04-dib-a" cx="178" cy="738" r="18" />

  <script>
    (function () {
      const ID = "s04-contesta";
      const DUR = 4.7;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const EL = 0.34;
      const CONTESTA = 0.58;
      const WHATSAPP = 1.16;
      const DOS = 1.8;
      const VOS = 2.82;
      const AL = 3.46;
      const DIA = 3.84;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // todo se acerca despacio (nunca queda quieto)
      tl.fromTo(q(".s04-todo"), { scale: 0.97, svgOrigin: "540 905" }, { scale: 1.02, svgOrigin: "540 905", duration: DUR, ease: "none" }, 0);

      // los dos celulares arrancan medio dibujados, con la pregunta del cliente
      dibujar(qa(".s04-dib-a"), 0, 0.6, 0.45);
      dibujar(qa(".s04-dib-b"), 0.04, 0.6, 0.45);
      tl.fromTo(qa(".s04-cab-a, .s04-cab-b, .s04-rot-a, .s04-rot-b"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.25);
      pop(q(".s04-msg-a"), 0.12, "444 862");
      pop(q(".s04-msg-b"), 0.18, "924 862");
      gsap.set(qa(".s04-tilde-a, .s04-tilde-b"), { opacity: 0 });

      // "él": su rótulo hace punch
      tl.fromTo(q(".s04-rot-b"), { scale: 1, svgOrigin: "780 678" }, { scale: 1.3, svgOrigin: "780 678", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, EL);

      // "contesta": tilde verde y la respuesta
      tl.to(q(".s04-tilde-b"), { opacity: 1, duration: 0.1 }, CONTESTA - 0.1);
      pop(q(".s04-resp"), CONTESTA, "636 1012");
      tl.to(q(".s04-tel-b"), { y: -6, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, CONTESTA + 0.05);
      // "WhatsApp": la burbuja late
      tl.to(q(".s04-resp"), { scale: 1.05, svgOrigin: "636 1012", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, WHATSAPP);

      // "dos minutos": el relojito y 2 MIN
      pop(q(".s04-reloj"), DOS, "680 1080");
      tl.fromTo(q(".s04-aguja"), { rotation: -120, svgOrigin: "680 1080" }, { rotation: 0, svgOrigin: "680 1080", duration: 0.6, ease: "power3.out" }, DOS);
      tl.fromTo(q(".s04-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, DOS + 0.16);
      tl.to(q(".s04-reloj"), { scale: 1.08, svgOrigin: "680 1080", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, 2.4);

      // "vos": tu celular, solo el doble tilde
      tl.fromTo(q(".s04-rot-a"), { scale: 1, svgOrigin: "300 678" }, { scale: 1.3, svgOrigin: "300 678", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, VOS);
      tl.fromTo(q(".s04-tilde-a"), { opacity: 0, scale: 0.4, svgOrigin: "410 884" }, { opacity: 1, scale: 1, svgOrigin: "410 884", duration: 0.3, ease: "back.out(2)" }, VOS + 0.08);
      tl.to(q(".s04-tilde-a"), { x: -4, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, VOS + 0.4);

      // "al otro día": el calendario pasa de hoja
      gsap.set(q(".s04-hoja2"), { opacity: 0 });
      gsap.set(q(".s04-dia"), { opacity: 0 });
      pop(q(".s04-cal"), AL - 0.12, "300 1010");
      tl.to(q(".s04-hoja1"), { scaleY: 0, opacity: 0, svgOrigin: "300 995", duration: 0.22, ease: "power2.in" }, DIA - 0.1);
      tl.fromTo(q(".s04-hoja2"), { opacity: 0, scaleY: 0, svgOrigin: "300 995" }, { opacity: 1, scaleY: 1, svgOrigin: "300 995", duration: 0.25, ease: "back.out(1.8)" }, DIA + 0.12);
      tl.fromTo(q(".s04-dia"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, DIA);
      // tu celular se apaga
      tl.to(q(".s04-tel-a"), { opacity: 0.4, duration: 0.4 }, DIA);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
