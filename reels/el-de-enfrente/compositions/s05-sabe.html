  <script>
    (function () {
      const ID = "s05-sabe";
      const DUR = 6.02;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SABE = 0.24;
      const QUIENES = 0.56;
      const CLIENTES = 1.22;
      const LES = 1.98;
      const ESCRIBE = 2.24;
      const VOS = 3.08;
      const NO = 3.42;
      const NI = 3.8;
      const TELEFONO = 4.2;
      const YA = 4.94;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origin) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origin }, { opacity: 1, scale: 1, svgOrigin: origin, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // ===== ÉL =====
      // la tarjeta arranca medio dibujada (el cuadro 0 no puede ser negro)
      dibujar([q(".s05-card")], 0, 0.6, 0.45);
      tl.fromTo(q(".s05-el"), { scale: 1.04, svgOrigin: "540 880" }, { scale: 1, svgOrigin: "540 880", duration: 3.0, ease: "none" }, 0);
      tl.fromTo(q(".s05-rot-el"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.05);
      tl.fromTo(q(".s05-head"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, SABE);
      dibujar([q(".s05-div")], SABE, 0.4);

      // "quiénes son": entran las cuatro filas
      qa(".s05-fila").forEach((f, i) => {
        tl.fromTo(f, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, QUIENES + i * 0.12);
      });
      tl.fromTo(q(".s05-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, QUIENES);
      // "clientes": el contador
      pop(q(".s05-num"), CLIENTES, "735 690");
      tl.to(q(".s05-num"), { scale: 1.3, svgOrigin: "735 690", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, CLIENTES + 0.35);

      // "les escribe": burbujas en cada fila y salen tres sobres volando
      qa(".s05-burb").forEach((b, i) => {
        const cy = 780 + i * 90;
        tl.fromTo(b, { opacity: 0, scale: 0.4, svgOrigin: "733 " + cy }, { opacity: 1, scale: 1, svgOrigin: "733 " + cy, duration: 0.3, ease: "back.out(2)" }, LES + i * 0.06);
      });
      const desde = [[733, 780], [733, 960], [733, 1050]];
      const hasta = [[930, 660], [990, 880], [940, 1150]];
      qa(".s05-sobre").forEach((s, i) => {
        const t0 = ESCRIBE + i * 0.12;
        gsap.set(s, { opacity: 0 });
        tl.fromTo(s, { x: desde[i][0], y: desde[i][1], opacity: 0, scale: 0.5, rotation: 0 },
          { x: hasta[i][0], y: hasta[i][1], opacity: 1, scale: 1, rotation: [-14, 8, 16][i], duration: 0.55, ease: "power3.out" }, t0);
        tl.to(s, { opacity: 0, duration: 0.25 }, t0 + 0.45);
      });

      // sale él
      tl.to(q(".s05-el"), { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, VOS - 0.2);
      tl.to(q(".s05-e1"), { opacity: 0, duration: 0.2 }, VOS - 0.15);

      // ===== VOS =====
      gsap.set(q(".s05-local"), { x: 770, y: 1060, scale: 0.85, opacity: 0.4 });
      gsap.set(qa(".s05-cero, .s05-contactos, .s05-renglon"), { opacity: 0 });
      tl.fromTo(q(".s05-rot-vos"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, VOS);
      dibujar(qa(".s05-lib"), VOS - 0.05, 0.55);
      tl.fromTo(q(".s05-libreta"), { rotation: -6, svgOrigin: "345 880" }, { rotation: 0, svgOrigin: "345 880", duration: 0.6, ease: "back.out(1.6)" }, VOS - 0.05);
      dibujar(qa(".s05-dib-l"), VOS + 0.05, 0.55);
      dibujar([q(".s05-suelo")], VOS, 0.5);
      tl.fromTo(q(".s05-txt-l"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, VOS + 0.4);
      // "no tenés": renglones vacíos
      qa(".s05-renglon").forEach((r, i) => {
        tl.to(r, { opacity: 1, duration: 0.2 }, NO + i * 0.06);
      });
      tl.fromTo(q(".s05-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, NI);
      // "teléfono": 0 CONTACTOS con golpe y la libreta se sacude
      tl.fromTo(q(".s05-cero"), { opacity: 0, scale: 1.4, svgOrigin: "345 900" }, { opacity: 1, scale: 1, svgOrigin: "345 900", duration: 0.35, ease: "back.out(2.2)" }, TELEFONO);
      tl.to(q(".s05-contactos"), { opacity: 1, duration: 0.25 }, TELEFONO + 0.15);
      tl.to(q(".s05-libreta"), { x: -7, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, TELEFONO + 0.2);

      // "ya vinieron": dos clientes salen de tu local y se van sin dejar nada
      qa(".s05-p").forEach((p, i) => {
        const t0 = YA - 0.1 + i * 0.3;
        tl.fromTo(p, { x: 770, y: 1060, opacity: 0, scale: 0.85, svgOrigin: "0 0" }, { x: 820, opacity: 1, duration: 0.18, ease: "none" }, t0);
        tl.to(p, { x: 990, duration: 0.65, ease: "none" }, t0 + 0.18);
        tl.to(p, { opacity: 0, duration: 0.15 }, t0 + 0.68);
        tl.fromTo(p.querySelector("path"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 4 }, t0);
      });
      // el cero late una vez más cuando se van
      tl.to(q(".s05-cero"), { scale: 1.12, svgOrigin: "345 900", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, YA + 0.5);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
