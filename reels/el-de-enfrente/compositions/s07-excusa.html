  <style>

    [data-composition-id="s07-excusa"] .s07-titular { font-family: "Lexend", sans-serif; font-weight: 800; font-size: 84px; letter-spacing: -0.01em; fill: #efeee5; }
    [data-composition-id="s07-excusa"] .s07-escudo-txt { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 50px; fill: #efeee5; }
    [data-composition-id="s07-excusa"] .s07-lista-tit { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.2em; fill: #efeee5; }

    [data-composition-id="s07-excusa"] .s07-cero { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 110px; fill: #5ce611; }

    [data-composition-id="s07-excusa"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s07-excusa" data-width="1080" data-height="1920" data-duration="5.02">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="5.02" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- ===== el diario ===== -->
        <g class="s07-papel">
          <rect class="ln s07-dib-d" x="340" y="640" width="400" height="460" rx="10" />
          <text class="s07-diario s07-masthead" x="540" y="690" text-anchor="middle">EL DIARIO</text>
          <path class="ln-4 s07-dib-d" d="M370 708 H710 M370 718 H710" />
          <text class="s07-titular s07-crisis" x="540" y="832" text-anchor="middle">CRISIS</text>
          <rect class="ln-4 s07-dib-d" x="370" y="878" width="160" height="116" rx="6" />
          <path class="ln-4 s07-dib-d" d="M388 906 L428 936 L458 924 L512 976" />
          <path class="ln-tenue s07-renglon" d="M552 888 H710 M552 918 H710 M552 948 H690 M552 978 H710 M370 1024 H710 M370 1054 H650" />

        <!-- flecha que señala -->

        <!-- ===== el escudo detrás del que te escondés ===== -->
        <g class="s07-escudo-mov">
          <g class="s07-escudo">
            <g class="s07-yo">
              <g class="s07-yo-cab"><circle class="ln" cx="540" cy="746" r="22" /><circle class="s07-ojo" cx="532" cy="744" r="3.5" /><circle class="s07-ojo" cx="548" cy="744" r="3.5" /></g>
              <path class="ln s07-yo-mano" d="M414 850 q14 -18 30 -4 M666 850 q-14 -18 -30 -4" />
            </g>
            <path class="ln s07-dib-esc" d="M430 770 H650 V900 Q650 1010 540 1066 Q430 1010 430 900 Z" />
            <text class="s07-escudo-txt s07-esc-txt" x="540" y="920" text-anchor="middle">CRISIS</text>
          </g>

        <!-- ===== la lista de cambios ===== -->
        <g class="s07-lista">
          <rect class="ln s07-dib-lista" x="600" y="690" width="320" height="420" rx="24" />

          <line class="ln-tenue s07-div" x1="626" y1="770" x2="894" y2="770" />
          <g class="s07-item"><rect class="ln-4 s07-caja" x="632" y="798" width="40" height="40" rx="8" /><line class="ln-tenue" x1="694" y1="818" x2="888" y2="818" /></g>
          <g class="s07-item"><rect class="ln-4 s07-caja" x="632" y="866" width="40" height="40" rx="8" /><line class="ln-tenue" x1="694" y1="886" x2="868" y2="886" /></g>
          <g class="s07-item"><rect class="ln-4 s07-caja" x="632" y="934" width="40" height="40" rx="8" /><line class="ln-tenue" x1="694" y1="954" x2="880" y2="954" /></g>

      <div class="etiqueta"><span class="s07-e1">La culpa es de la crisis</span><span class="s07-e2">La excusa perfecta</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s07-excusa";
      const DUR = 5.02;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const ECHAS = 0.72;
      const CULPA = 1.02;
      const CRISIS = 1.42;
      const PORQUE = 1.66;
      const EXCUSA = 2.22;
      const PERFECTA = 2.64;
      const NO = 3.34;
      const TE = 3.46;
      const PIDE = 3.72;
      const CAMBIAR = 3.9;
      const NADA = 4.2;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // ===== el diario: arranca medio dibujado (el cuadro 0 no puede ser negro) =====
      dibujar(qa(".s07-dib-d"), 0, 0.6, 0.45);
      tl.fromTo(q(".s07-masthead"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.25);
      tl.fromTo(q(".s07-renglon"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
      tl.fromTo(q(".s07-papel"), { rotation: -4, svgOrigin: "540 870" }, { rotation: 2, svgOrigin: "540 870", duration: 2.1, ease: "sine.inOut" }, 0);

      // "echás la culpa": la flecha acusa
      dibujar([q(".s07-flecha")], ECHAS - 0.05, 0.4);
      tl.fromTo(q(".s07-punta"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, ECHAS + 0.3);
      tl.fromTo(q(".s07-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, ECHAS);

      // "crisis": el titular cae con golpe y la flecha pincha dos veces
      tl.fromTo(q(".s07-crisis"), { opacity: 0, scale: 1.4, svgOrigin: "540 806" }, { opacity: 1, scale: 1, svgOrigin: "540 806", duration: 0.35, ease: "back.out(2)" }, CRISIS - 0.06);
      tl.to(q(".s07-papel"), { y: 8, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, CRISIS + 0.1);
      tl.to(q(".s07-dedo"), { x: 14, y: -6, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3 }, PORQUE);

      // "excusa perfecta": el diario se dobla y se vuelve escudo
      tl.to(q(".s07-papel"), { scaleY: 0.04, svgOrigin: "540 870", opacity: 0, duration: 0.22, ease: "power3.in" }, EXCUSA - 0.2);
      tl.to(q(".s07-dedo"), { opacity: 0, duration: 0.15 }, EXCUSA - 0.2);
      tl.to(q(".s07-e1"), { opacity: 0, duration: 0.2 }, EXCUSA - 0.15);
      tl.fromTo(q(".s07-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, EXCUSA);
      dibujar([q(".s07-dib-esc")], EXCUSA, 0.4, 0.6);
      tl.fromTo(q(".s07-escudo"), { scaleY: 0.2, svgOrigin: "540 900" }, { scaleY: 1, svgOrigin: "540 900", duration: 0.4, ease: "back.out(1.8)" }, EXCUSA);
      tl.fromTo(q(".s07-esc-txt"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, EXCUSA + 0.15);
      // vos te asomás detrás
      gsap.set(q(".s07-yo"), { opacity: 0 });
      tl.to(q(".s07-yo"), { opacity: 0.7, duration: 0.15 }, PERFECTA - 0.1);
      tl.fromTo(q(".s07-yo-cab"), { scale: 0.3, svgOrigin: "540 768" }, { scale: 1, svgOrigin: "540 768", duration: 0.35, ease: "back.out(2.2)" }, PERFECTA - 0.1);
      tl.fromTo(q(".s07-yo-mano"), { y: 10 }, { y: 0, duration: 0.3, ease: "back.out(2)" }, PERFECTA);
      tl.to(q(".s07-yo-cab"), { x: 8, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, PERFECTA + 0.3);

      // "no te pide cambiar nada": el escudo se corre y aparece la lista vacía
      tl.to(q(".s07-escudo-mov"), { x: -210, scale: 0.82, svgOrigin: "540 900", duration: 0.4, ease: "power3.inOut" }, NO - 0.12);
      dibujar([q(".s07-dib-lista")], NO, 0.45, 0.5);
      tl.fromTo(q(".s07-tit"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, NO + 0.1);
      tl.fromTo(q(".s07-div"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, NO + 0.15);
      const T = [TE, PIDE, CAMBIAR];
      qa(".s07-item").forEach((it, i) => {
        const cy = 818 + i * 68;
        tl.fromTo(it, { opacity: 0, scale: 0.85, svgOrigin: "652 " + cy }, { opacity: 1, scale: 1, svgOrigin: "652 " + cy, duration: 0.3, ease: "back.out(1.6)" }, T[i]);
      });
      // las casillas esperan un tilde que no llega
      qa(".s07-caja").forEach((c, i) => {
        const cy = 818 + i * 68;
        tl.to(c, { scale: 1.15, svgOrigin: "652 " + cy, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, NADA - 0.12 + i * 0.05);
      });
      // "nada": el cero con golpe
      tl.fromTo(q(".s07-cero"), { opacity: 0, scale: 1.5, svgOrigin: "760 1050" }, { opacity: 1, scale: 1, svgOrigin: "760 1050", duration: 0.35, ease: "back.out(2.2)" }, NADA);
      tl.to(q(".s07-lista"), { x: -6, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, NADA + 0.12);
      tl.to(q(".s07-cero"), { scale: 1.1, svgOrigin: "760 1050", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, NADA + 0.45);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
