<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s08-se-fue"] .s08-capa { position: absolute; inset: 0; }
    [data-composition-id="s08-se-fue"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s08-se-fue"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-se-fue"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-se-fue"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-se-fue"] .vidrio { fill: #5ce611; }
    [data-composition-id="s08-se-fue"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s08-se-fue"] .crisis { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 40px; letter-spacing: 0.08em; fill: #efeee5; }
    [data-composition-id="s08-se-fue"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s08-se-fue"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s08-se-fue" data-width="1080" data-height="1920" data-duration="4.56">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="4.56" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s08-suelo" x1="40" y1="1120" x2="1040" y2="1120" />
        <!-- tu local (izquierda), apagado -->
        <g class="s08-tuyo">
          <g class="s08-tuyo-in">
            <path class="ln s08-dib-a" d="M-120 0 V-170 H120 V0" />
            <path class="ln s08-dib-a" d="M-140 -170 H140 L122 -222 H-122 Z" />
            <path class="ln s08-dib-a" d="M-140 -170 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0" />
            <rect class="ln s08-dib-a" x="-80" y="-290" width="160" height="50" rx="10" />
            <text class="cartel s08-txt-a" x="0" y="-257" text-anchor="middle">TU LOCAL</text>
            <rect class="ln s08-dib-a" x="-100" y="-122" width="58" height="52" rx="5" />
            <rect class="ln s08-dib-a" x="42" y="-122" width="58" height="52" rx="5" />
            <path class="ln s08-dib-a" d="M-24 0 V-96 H24 V0" />
          </g>
        </g>
        <!-- el de enfrente (derecha), prendido -->
        <g class="s08-otro">
          <g class="s08-otro-in">
            <path class="ln s08-dib-b" d="M-120 0 V-170 H120 V0" />
            <path class="ln s08-dib-b" d="M-140 -170 H140 L122 -222 H-122 Z" />
            <path class="ln s08-dib-b" d="M-140 -170 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0" />
            <rect class="ln s08-dib-b" x="-80" y="-290" width="160" height="50" rx="10" />
            <text class="cartel s08-txt-b" x="0" y="-257" text-anchor="middle">ENFRENTE</text>
            <rect class="ln s08-dib-b" x="-100" y="-122" width="58" height="52" rx="5" />
            <rect class="ln s08-dib-b" x="42" y="-122" width="58" height="52" rx="5" />
            <rect class="vidrio s08-luz-b" x="-92" y="-114" width="42" height="36" rx="3" />
            <rect class="vidrio s08-luz-b" x="50" y="-114" width="42" height="36" rx="3" />
            <path class="ln s08-dib-b" d="M-24 0 V-96 H24 V0" />
          </g>
        </g>
        <!-- cartel "CRISIS" con su badge -->
        <g class="s08-crisis">
          <rect class="ln s08-dib-c" x="430" y="676" width="220" height="84" rx="12" />
          <text class="crisis s08-crisis-txt" x="540" y="733" text-anchor="middle">CRISIS</text>
          <g class="s08-badge"><circle class="ln-badge" cx="650" cy="676" r="18" /><path class="ln-badge" d="M643 669 L657 683 M657 669 L643 683" /></g>
        </g>
        <!-- tu cliente -->
        <g class="s08-p">
          <g class="s08-p-in">
            <circle class="ln" cx="0" cy="-96" r="14" />
            <path class="ln s08-p-cuerpo" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" />
          </g>
        </g>
        <!-- estrellitas: lo atendieron mejor -->
        <g class="s08-estrellas"></g>
      </svg>
      <div class="etiqueta"><span class="s08-e1">No fue la crisis</span><span class="s08-e2">Lo atendieron mejor</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-se-fue";
      const DUR = 4.56;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CLIENTE = 0.38;
      const NO = 0.86;
      const CRISIS = 1.86;
      const SE_FUE = 2.5;
      const ATENDIO = 3.26;
      const MEJOR = 3.58;

      const SUELO = 1120;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // estrellas de cinco puntas (geometría fija)
      const NS = "http://www.w3.org/2000/svg";
      const estrella = (cx, cy, r) => {
        let d = "";
        for (let i = 0; i < 10; i++) {
          const a = -Math.PI / 2 + (i * Math.PI) / 5;
          const rr = i % 2 ? r * 0.45 : r;
          d += (i ? " L" : "M") + (cx + rr * Math.cos(a)).toFixed(1) + " " + (cy + rr * Math.sin(a)).toFixed(1);
        }
        return d + " Z";
      };
      const POS = [[690, 770, 24], [750, 735, 28], [810, 720, 32], [870, 735, 28], [930, 770, 24]];
      POS.forEach(([x, y, r]) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("class", "ln-ac s08-star");
        p.setAttribute("d", estrella(x, y, r));
        p.dataset.o = x + " " + y;
        q(".s08-estrellas").appendChild(p);
      });

      // los dos locales: el tuyo arranca medio dibujado (cuadro 0 no negro) y apagado
      gsap.set(q(".s08-tuyo"), { x: 270, y: SUELO });
      gsap.set(q(".s08-otro"), { x: 810, y: SUELO });
      dibujar(qa(".s08-dib-a"), 0, 0.55, 0.45);
      tl.fromTo(q(".s08-txt-a"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.2);
      tl.fromTo(q(".s08-suelo"), { scaleX: 0.5, svgOrigin: "540 1120" }, { scaleX: 1, svgOrigin: "540 1120", duration: 0.7, ease: "power3.out" }, 0);
      dibujar(qa(".s08-dib-b"), 0.08, 0.5, 0.6);
      tl.fromTo(q(".s08-txt-b"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3);
      tl.fromTo(qa(".s08-luz-b"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 0.4);
      tl.to(qa(".s08-dib-a, .s08-txt-a"), { opacity: 0.4, duration: 0.4 }, 0.6);

      // "cliente": la figurita aparece al lado de tu local
      const P = q(".s08-p");
      gsap.set(P, { x: 450, y: SUELO });
      tl.fromTo(q(".s08-p-in"), { opacity: 0, scale: 0.7, svgOrigin: "0 0" }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.35, ease: "back.out(1.8)" }, CLIENTE);
      // respira mientras espera
      tl.to(q(".s08-p-in"), { y: -6, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, CLIENTE + 0.4);

      // "no se fue por la crisis": cartel que se dibuja, el texto pega, y el badge en "crisis"
      dibujar([q(".s08-dib-c")], NO - 0.05, 0.4);
      tl.fromTo(q(".s08-crisis-txt"), { opacity: 0, scale: 1.3, svgOrigin: "540 718" }, { opacity: 1, scale: 1, svgOrigin: "540 718", duration: 0.32, ease: "power3.out" }, NO + 0.2);
      tl.fromTo(q(".s08-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, NO);
      tl.fromTo(q(".s08-crisis"), { rotation: -2, svgOrigin: "540 718" }, { rotation: 2, svgOrigin: "540 718", duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, NO + 0.4);
      tl.fromTo(q(".s08-badge"), { opacity: 0, scale: 0.5, svgOrigin: "650 676" }, { opacity: 1, scale: 1, svgOrigin: "650 676", duration: 0.35, ease: "back.out(2.2)" }, CRISIS);
      tl.to(q(".s08-crisis"), { x: 6, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, CRISIS + 0.05);
      tl.to(qa(".s08-dib-c, .s08-crisis-txt"), { opacity: 0.4, duration: 0.35 }, CRISIS + 0.25);

      // "Se fue al que lo atendió mejor": el cartel se va, la figurita cruza
      tl.to(q(".s08-crisis"), { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, SE_FUE - 0.1);
      tl.to(q(".s08-e1"), { opacity: 0, duration: 0.2 }, SE_FUE - 0.1);
      tl.fromTo(q(".s08-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, SE_FUE);
      tl.to(P, { x: 810, duration: 0.95, ease: "power1.inOut" }, SE_FUE);
      tl.fromTo(q(".s08-p-cuerpo"), { rotation: -5, svgOrigin: "0 -40" }, { rotation: 5, svgOrigin: "0 -40", duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 5 }, SE_FUE);
      tl.to(P, { opacity: 0, duration: 0.15 }, SE_FUE + 0.9);

      // "atendió": el de enfrente se prende más; "mejor": estrellitas con punch
      tl.to(qa(".s08-luz-b"), { opacity: 1, duration: 0.15 }, ATENDIO);
      tl.to(q(".s08-otro-in"), { scale: 1.06, svgOrigin: "0 -110", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, ATENDIO);
      qa(".s08-star").forEach((s, i) => {
        const o = s.dataset.o;
        const t = MEJOR - 0.12 + Math.abs(i - 2) * 0.06;
        tl.fromTo(s, { opacity: 0, scale: 0.3, rotation: -40, svgOrigin: o }, { opacity: 1, scale: 1, rotation: 0, svgOrigin: o, duration: 0.38, ease: "back.out(2.4)" }, t);
        tl.to(s, { scale: 1.15, svgOrigin: o, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 1 }, MEJOR + 0.4 + i * 0.07);
      });

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
