  <script>
    (function () {
      const ID = "s12-cta";
      const DUR = 5.3;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, s0) => tl.fromTo(el, { opacity: 0, scale: s0 ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.6)" }, t);
      const punch = (el, t, s) => tl.to(el, { scale: s ?? 1.08, transformOrigin: "50% 50%", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const etq = (k, t) => {
        if (k > 1) tl.to(q(".s12-e" + (k - 1)), { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(q(".s12-e" + k), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      const aparecer = (el, t, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d ?? 0.3 }, t);

      tl.fromTo(q(".s12-cart"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);
      gsap.set(qa(".s12-luz, .s12-ok, .s12-avion"), { opacity: 0 });
      pop(q(".s12-btn"), 0.15, 0.7);
      punch(q(".s12-btn"), DUENO - 0.2, 1.12);
      dibujar([q(".s12-arco")], DUENO, 0.6);
      // el avión viaja del celular al café
      const P = [[300, 820], [410, 715], [530, 690], [650, 720], [760, 800]];

      tl.to(q(".s12-luz"), { opacity: 0.9, duration: 0.2 }, CAFE);
