  <script>
    (function () {
      const ID = "s12-llegan";
      const DUR = 5.6;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // helpers
      const pop = (el, t, from = 0.6, d = 0.32) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (el, t, d = 0.22) => tl.to(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%", duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s12-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (els, t, d = 0.6, st = 0.05) => {
        [].concat(els).forEach((el, i) => {
          const L = el.getTotalLength ? el.getTotalLength() + 2 : 1000;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t + i * st);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st);
        });
      };
      // boca que habla entre t0 y t1
      const hablar = (el, t0, t1, r = 0.11) => {
        const n = Math.max(1, Math.floor((t1 - t0) / (2 * r)));
        tl.fromTo(el, { scaleY: 0.3, transformOrigin: "50% 50%" }, { scaleY: 1.15, transformOrigin: "50% 50%", duration: r, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t0);
      };
      // respirar / flotar (cantidad fija de repeticiones)
      const flotar = (el, t, hasta, amp = 8, per = 0.9) => {
        const n = Math.max(1, Math.floor((hasta - t) / per));
        tl.fromTo(el, { y: 0 }, { y: -amp, duration: per, ease: "sine.inOut", yoyo: true, repeat: n - 1, immediateRender: false }, t);
      };
      
      const ABRE = 0.78, SIETE = 1.12, QUEDA = 1.84, CUADRAS = 2.24, F1 = 3.2, F2 = 3.84;
      // cuadro 0: el grumete salta con el celular en alto
      tl.fromTo(q(".s12-gru-g"), { y: 200 }, { y: 0, duration: 0.3, ease: "back.out(1.8)" }, 0);
      hablar(q(".s12-gru-boca"), 0.0, 2.8, 0.1);
      tl.to(q(".s12-gru-g"), { y: -40, duration: 0.18, yoyo: true, repeat: 5, ease: "power1.out" }, 0.35);
      tl.to(q(".s12-cel"), { rotation: 10, transformOrigin: "50% 100%", duration: 0.12, yoyo: true, repeat: 9 }, 0.3);
      slam(q(".s12-siete"), SIETE);
      golpe(SIETE + 0.04, 12);
      slam(q(".s12-cuadras"), CUADRAS);
      golpe(CUADRAS + 0.04, 12);
      // el loro entra con la porción
      tl.fromTo(q(".s12-loro-g"), { x: 500, y: -300 }, { x: 0, y: 0, duration: 0.4, ease: "power2.out" }, F1 - 0.5);
      gsap.set(q(".s12-porc-g"), { opacity: 0 });
      pop(q(".s12-porc-g"), F1 - 0.1, 0.3);
      tl.to(q(".s12-porc-g"), { rotation: 10, transformOrigin: "50% 50%", duration: 0.2, yoyo: true, repeat: 7 }, F1 + 0.2);
      [F1, F2].forEach((t) => {
        tl.to(q(".s12-loro-pico"), { rotation: 28, transformOrigin: "0% 0%", duration: 0.09, yoyo: true, repeat: 5 }, t);
        tl.to(q(".s12-loro-ala"), { rotation: -50, transformOrigin: "50% 0%", duration: 0.08, yoyo: true, repeat: 5 }, t);
        golpe(t + 0.03, 10);
      });
      slam(q(".s12-fuga"), F1 + 0.02);
      tl.to(q(".s12-fuga"), { scale: 1.12, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1 }, F2);
      // lluvia de monedas
      qa(".s12-moneda").forEach((m, i) => {
        gsap.set(m, { opacity: 0 });
        tl.fromTo(m, { opacity: 1, y: 480, rotation: 0 }, { opacity: 1, y: 1600, rotation: 360, transformOrigin: "50% 50%", duration: 1.6, ease: "power1.in", immediateRender: false }, F1 - 0.2 + (i % 5) * 0.15);
      });
      

      // salida
      tl.to(q("#s12-escena"), { opacity: 0, filter: "blur(6px)", scale: 1.04, transformOrigin: "50% 50%", duration: 0.28, ease: "power2.in" }, DUR - 0.28);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
