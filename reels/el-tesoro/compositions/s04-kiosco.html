  <script>
    (function () {
      const ID = "s04-kiosco";
      const DUR = 6.69;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // helpers
      const pop = (el, t, from = 0.6, d = 0.32) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (el, t, d = 0.22) => tl.to(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%", duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s04-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (els, t, d = 0.6, st = 0.05) => {
        [].concat(els).forEach((el, i) => {
          const L = el.getTotalLength ? el.getTotalLength() + 2 : 1000;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t + i * st);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st);
        });
      };
      // boca que habla entre t0 y t1
      const hablar = (el, t0, t1, r = 0.11) => {
        const n = Math.max(1, Math.floor((t1 - t0) / (2 * r)));
        tl.fromTo(el, { scaleY: 0.3, transformOrigin: "50% 50%" }, { scaleY: 1.15, transformOrigin: "50% 50%", duration: r, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t0);
      };
      // respirar / flotar (cantidad fija de repeticiones)
      const flotar = (el, t, hasta, amp = 8, per = 0.9) => {
        const n = Math.max(1, Math.floor((hasta - t) / per));
        tl.fromTo(el, { y: 0 }, { y: -amp, duration: per, ease: "sine.inOut", yoyo: true, repeat: n - 1, immediateRender: false }, t);
      };
      
      const FRENTE = 0.92, DONDE = 1.76, KIOSCO = 2.8, QUE = 3.96, SI = 4.65, NO = 5.65;
      // cuadro 0: el mapa del barrio y el grumete leyendo
      tl.fromTo(q(".s04-mapa"), { opacity: 0.6, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(q(".s04-gru-g"), { y: 300 }, { y: 0, duration: 0.3, ease: "back.out(1.6)" }, 0);
      hablar(q(".s04-gru-boca"), 0.05, 3.3);
      tl.to(qa(".s04-gru-pupila"), { x: 8, y: -8, duration: 0.2 }, 0.3);
      gsap.set(q(".s04-nota"), { clipPath: "inset(0 100% 0 0)" });
      tl.to(q(".s04-nota"), { clipPath: "inset(0 0% 0 0)", duration: 2.4, ease: "none" }, 0.1);
      // "frente a": flecha, local con "¿acá?"
      pop(q(".s04-local"), FRENTE - 0.1, 0.4);
      dibujar(q(".s04-flecha"), FRENTE + 0.1, 0.6);
      pop(q(".s04-etq:nth-of-type(3)"), FRENTE + 0.6, 0.4);
      // "estaba el kiosco": el fantasma del kiosco, punteado
      gsap.set(q(".s04-kiosco"), { opacity: 0 });
      tl.fromTo(q(".s04-kiosco"), { opacity: 0 }, { opacity: 0.85, duration: 0.3, immediateRender: false }, DONDE);
      tl.to(q(".s04-kiosco"), { opacity: 0.4, duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut" }, KIOSCO);
      pop(q(".s04-etq:nth-of-type(2)"), KIOSCO - 0.1, 0.4);
      // "¿Qué kiosco?": entra el capitán furioso
      tl.fromTo(q(".s04-cap-g"), { x: 700 }, { x: 0, duration: 0.25, ease: "back.out(1.6)" }, QUE - 0.25);
      tl.to(q(".s04-cap-ceja"), { rotation: 18, transformOrigin: "100% 50%", duration: 0.12 }, QUE);
      hablar(q(".s04-cap-boca"), QUE, DUR - 0.4, 0.09);
      golpe(QUE + 0.05, 12);
      tl.to(q(".s04-cap-g"), { y: -30, duration: 0.1, yoyo: true, repeat: 3 }, SI);
      // "¡ya no está!": el kiosco se desvanece en una nube
      tl.to(q(".s04-kiosco"), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 0.25 }, NO - 0.1);
      tl.to(q(".s04-etq:nth-of-type(2)"), { opacity: 0, duration: 0.2 }, NO);
      qa(".s04-puff circle").forEach((c, i) => {
        gsap.set(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 1, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 0, scale: 1.6, transformOrigin: "50% 50%", duration: 0.7, ease: "power2.out", immediateRender: false }, NO - 0.1 + i * 0.05);
      });
      tl.to(q(".s04-mapa"), { opacity: 0.45, duration: 0.2 }, NO - 0.05);
      tl.to(q(".s04-nota"), { opacity: 0.4, duration: 0.2 }, NO - 0.05);
      slam(q(".s04-yano"), NO + 0.02);
      golpe(NO + 0.06, 16);
      

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", scale: 1.04, transformOrigin: "50% 50%", duration: 0.28, ease: "power2.in" }, DUR - 0.28);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
