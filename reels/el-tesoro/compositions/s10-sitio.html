  <script>
    (function () {
      const ID = "s10-sitio";
      const DUR = 4.23;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // helpers
      const pop = (el, t, from = 0.6, d = 0.32) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (el, t, d = 0.22) => tl.to(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%", duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (els, t, d = 0.6, st = 0.05) => {
        [].concat(els).forEach((el, i) => {
          const L = el.getTotalLength ? el.getTotalLength() + 2 : 1000;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t + i * st);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st);
        });
      };
      // boca que habla entre t0 y t1
      const hablar = (el, t0, t1, r = 0.11) => {
        const n = Math.max(1, Math.floor((t1 - t0) / (2 * r)));
        tl.fromTo(el, { scaleY: 0.3, transformOrigin: "50% 50%" }, { scaleY: 1.15, transformOrigin: "50% 50%", duration: r, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t0);
      };
      // respirar / flotar (cantidad fija de repeticiones)
      const flotar = (el, t, hasta, amp = 8, per = 0.9) => {
        const n = Math.max(1, Math.floor((hasta - t) / per));
        tl.fromTo(el, { y: 0 }, { y: -amp, duration: per, ease: "sine.inOut", yoyo: true, repeat: n - 1, immediateRender: false }, t);
      };
      
      const SCAL = 0.16, HACEMOS = 0.67, ESE = 1.27, MAPA = 1.52, UN = 2.17, SITIO = 2.28, X = 3.22, MARCADA = 3.72;
      // cuadro 0: el mapa viejo flota
      tl.fromTo(q(".s10-viejo"), { scale: 0.85, opacity: 0.6, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(1.6)" }, 0);
      tl.to(q(".s10-viejo"), { rotation: 4, transformOrigin: "50% 50%", duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.3);
      pop(q(".s10-scal"), SCAL, 0.6);
      slam(q(".s10-ese"), HACEMOS + 0.3);
      golpe(HACEMOS + 0.34, 10);
      // "un sitio web": el mapa gira y se convierte en el celular
      tl.to(q(".s10-viejo"), { scaleX: 0, opacity: 0, transformOrigin: "50% 50%", duration: 0.2, ease: "power2.in" }, UN - 0.25);
      tl.to(q(".s10-scal"), { opacity: 0, duration: 0.15 }, UN - 0.25);
      tl.to(q(".s10-ese"), { opacity: 0, y: -30, duration: 0.15 }, SITIO - 0.15);
      gsap.set(q(".s10-tel"), { opacity: 0 });
      tl.fromTo(q(".s10-tel"), { opacity: 1, scaleX: 0, transformOrigin: "50% 50%" }, { opacity: 1, scaleX: 1, transformOrigin: "50% 50%", duration: 0.28, ease: "back.out(1.6)", immediateRender: false }, UN - 0.05);
      slam(q(".s10-web"), SITIO);
      gsap.set(q(".s10-ruta"), { opacity: 0 });
      tl.fromTo(q(".s10-ruta"), { opacity: 0, strokeDashoffset: 80 }, { opacity: 1, strokeDashoffset: 0, duration: 0.8, ease: "none", immediateRender: false }, SITIO + 0.2);
      // "con la X bien marcada"
      slam(q(".s10-xg"), X, 3);
      golpe(X + 0.04, 14);
      dibujar(q(".s10-circ"), MARCADA - 0.1, 0.35);
      pop(q(".s10-aca"), MARCADA, 0.5);
      tl.to(q(".s10-xg"), { scale: 1.15, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1 }, MARCADA + 0.2);
      

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", scale: 1.04, transformOrigin: "50% 50%", duration: 0.28, ease: "power2.in" }, DUR - 0.28);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
