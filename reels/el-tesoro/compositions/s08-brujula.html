    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

      <div class="s08-escenario">

        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g transform="translate(540 940)">

              <circle class="tinta" fill="#ecd7a6" r="220" />
              <g fill="none" stroke="#2b1a0c" stroke-width="5" stroke-linecap="round"><path d="M0 -205 L0 -170" transform="rotate(0)" /><path d="M0 -205 L0 -185" transform="rotate(22.5)" /><path d="M0 -205 L0 -185" transform="rotate(45)" /><path d="M0 -205 L0 -185" transform="rotate(67.5)" /><path d="M0 -205 L0 -170" transform="rotate(90)" /><path d="M0 -205 L0 -185" transform="rotate(112.5)" /><path d="M0 -205 L0 -185" transform="rotate(135)" /><path d="M0 -205 L0 -185" transform="rotate(157.5)" /><path d="M0 -205 L0 -170" transform="rotate(180)" /><path d="M0 -205 L0 -185" transform="rotate(202.5)" /><path d="M0 -205 L0 -185" transform="rotate(225)" /><path d="M0 -205 L0 -185" transform="rotate(247.5)" /><path d="M0 -205 L0 -170" transform="rotate(270)" /><path d="M0 -205 L0 -185" transform="rotate(292.5)" /><path d="M0 -205 L0 -185" transform="rotate(315)" /><path d="M0 -205 L0 -185" transform="rotate(337.5)" /></g>
              <g font-family="Cinzel" font-weight="900" font-size="46" fill="#2b1a0c" text-anchor="middle"><text y="-118">N</text><text y="150">S</text><text x="135" y="16">E</text><text x="-135" y="16">O</text></g>
              <g class="s08-aguja"><path class="tinta" fill="#d23a2a" d="M0 -150 L22 0 L-22 0 Z" /><path class="tinta" fill="#6b4423" d="M0 150 L22 0 L-22 0 Z" /><circle class="tinta" fill="#f5b82e" r="16" /></g>

          <g class="s08-preg" font-family="Cinzel" font-weight="900" font-size="110" fill="#f5b82e" stroke="#2b1a0c" stroke-width="8" paint-order="stroke"><text x="150" y="820">?</text><text x="870" y="900">?</text><text x="200" y="1180">?</text></g>

  </div>
  <script>
    (function () {
      const ID = "s08-brujula";
      const DUR = 3.39;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // helpers
      const pop = (el, t, from = 0.6, d = 0.32) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (el, t, d = 0.22) => tl.to(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%", duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s08-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (els, t, d = 0.6, st = 0.05) => {
        [].concat(els).forEach((el, i) => {
          const L = el.getTotalLength ? el.getTotalLength() + 2 : 1000;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t + i * st);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st);
        });
      };
      // boca que habla entre t0 y t1
      const hablar = (el, t0, t1, r = 0.11) => {
        const n = Math.max(1, Math.floor((t1 - t0) / (2 * r)));
        tl.fromTo(el, { scaleY: 0.3, transformOrigin: "50% 50%" }, { scaleY: 1.15, transformOrigin: "50% 50%", duration: r, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t0);
      };
      // respirar / flotar (cantidad fija de repeticiones)
      const flotar = (el, t, hasta, amp = 8, per = 0.9) => {
        const n = Math.max(1, Math.floor((hasta - t) / per));
        tl.fromTo(el, { y: 0 }, { y: -amp, duration: per, ease: "sine.inOut", yoyo: true, repeat: n - 1, immediateRender: false }, t);
      };
      
      const BRUJULA = 0.4, JACK = 1.12, ENCONTRAS = 1.92, CAPITAN = 2.32;
      // cuadro 0: la brújula ya está y la aguja tiembla
      tl.fromTo(q(".s08-caja"), { scale: 0.8, rotation: -20, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.6)" }, 0);
      slam(q(".s08-ni"), BRUJULA);
      golpe(BRUJULA + 0.04, 10);
      // la aguja gira como loca
      tl.fromTo(q(".s08-aguja"), { rotation: 0 }, { rotation: 1440, svgOrigin: "0 0", duration: ENCONTRAS - 0.1, ease: "power1.in" }, 0.1);
      pop(q(".s08-peli"), JACK, 0.5);
      // "no la encontrás": se clava apuntando a cualquier lado y tiembla
      tl.to(q(".s08-aguja"), { rotation: 1440 + 200, svgOrigin: "0 0", duration: 0.25, ease: "back.out(3)" }, ENCONTRAS);
      tl.to(q(".s08-aguja"), { rotation: 1440 + 170, svgOrigin: "0 0", duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut" }, ENCONTRAS + 0.25);
      tl.to(q(".s08-caja"), { rotation: -6, transformOrigin: "50% 50%", duration: 0.1, yoyo: true, repeat: 5 }, ENCONTRAS);
      slam(q(".s08-sin"), ENCONTRAS + 0.1);
      qa(".s08-preg text").forEach((p, i) => { pop(p, ENCONTRAS + 0.15 + i * 0.12, 0.2); tl.to(p, { y: -16, duration: 0.25, yoyo: true, repeat: 3 }, CAPITAN + i * 0.1); });
      

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", scale: 1.04, transformOrigin: "50% 50%", duration: 0.28, ease: "power2.in" }, DUR - 0.28);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
