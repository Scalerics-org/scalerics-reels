  <script>
    (function () {
      const ID = "s01-mapa";
      const DUR = 7.04;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // helpers
      const pop = (el, t, from = 0.6, d = 0.32) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (el, t, d = 0.22) => tl.to(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%", duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (els, t, d = 0.6, st = 0.05) => {
        [].concat(els).forEach((el, i) => {
          const L = el.getTotalLength ? el.getTotalLength() + 2 : 1000;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t + i * st);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st);
        });
      };
      // boca que habla entre t0 y t1
      const hablar = (el, t0, t1, r = 0.11) => {
        const n = Math.max(1, Math.floor((t1 - t0) / (2 * r)));
        tl.fromTo(el, { scaleY: 0.3, transformOrigin: "50% 50%" }, { scaleY: 1.15, transformOrigin: "50% 50%", duration: r, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t0);
      };
      // respirar / flotar (cantidad fija de repeticiones)
      const flotar = (el, t, hasta, amp = 8, per = 0.9) => {
        const n = Math.max(1, Math.floor((hasta - t) / per));
        tl.fromTo(el, { y: 0 }, { y: -amp, duration: per, ease: "sine.inOut", yoyo: true, repeat: n - 1, immediateRender: false }, t);
      };
      
      const LOCAL = 1.0, HACE = 1.78, MAPA = 2.62, TESORO = 3.38, Y = 4.41, LORO = 4.54, UN1 = 5.24, UN2 = 5.88;
      // cuadro 0: el pergamino ya se está desenrollando
      tl.fromTo(q(".s01-mapa"), { scaleX: 0.6, opacity: 0.85, transformOrigin: "50% 50%" }, { scaleX: 1, opacity: 1, transformOrigin: "50% 50%", duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(q(".s01-escenario"), { scale: 1.06 }, { scale: 1, duration: 4.3, ease: "none", transformOrigin: "50% 55%" }, 0);
      dibujar([q(".s01-costa"), q(".s01-costa2")], 0.05, 0.9, 0);
      dibujar(qa(".s01-monte, .s01-palma"), 0.6, 0.5);
      tl.fromTo(q(".s01-rosa-g"), { rotation: -90, scale: 0.4, opacity: 0, transformOrigin: "50% 50%" }, { rotation: 0, scale: 1, opacity: 1, transformOrigin: "50% 50%", duration: 0.7, ease: "back.out(1.4)" }, 0.2);
      pop(q(".s01-barco"), 0.45);
      tl.to(q(".s01-barco"), { rotation: 4, transformOrigin: "50% 100%", duration: 0.6, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.8);
      // "tu local": aparece la tiendita
      pop(q(".s01-tienda"), LOCAL - 0.1, 0.3);
      pop(q(".s01-local"), LOCAL + 0.1, 0.5);
      // "mapa del tesoro": el título y el camino punteado del barco al local
      pop(q(".s01-titulo"), MAPA - 0.15, 0.7);
      gsap.set(q(".s01-camino"), { strokeDashoffset: 0, opacity: 0 });
      tl.fromTo(q(".s01-camino"), { opacity: 0, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.8, ease: "power1.inOut", immediateRender: false }, HACE);
      // X roja en "tesoro"
      slam(q(".s01-x"), TESORO);
      golpe(TESORO + 0.05, 14);
      tl.to(q(".s01-x"), { scale: 1.12, transformOrigin: "50% 50%", duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, TESORO + 0.3);
      // "y un loro": cae el loro sobre la esquina del mapa
      gsap.set(q(".s01-loro-g"), { opacity: 0 });
      tl.fromTo(q(".s01-loro-g"), { y: -900, opacity: 1 }, { y: 0, opacity: 1, duration: 0.32, ease: "power2.in", immediateRender: false }, Y - 0.15);
      tl.to(q(".s01-loro-g"), { scaleY: 0.85, scaleX: 1.1, transformOrigin: "50% 100%", duration: 0.08, yoyo: true, repeat: 1 }, Y + 0.17);
      golpe(Y + 0.18, 10);
      tl.to(q(".s01-loro-ala"), { rotation: -35, transformOrigin: "50% 0%", duration: 0.1, yoyo: true, repeat: 3 }, LORO);
      // "¡Un loro! ¡Un loro!": el mapa se apaga, el loro al frente graznando
      tl.to(q(".s01-mapa"), { opacity: 0.3, duration: 0.25 }, UN1 - 0.25);
      tl.to(q(".s01-local"), { opacity: 0.3, duration: 0.25 }, UN1 - 0.25);
      tl.to(q(".s01-titulo"), { opacity: 0, duration: 0.2 }, UN1 - 0.25);
      tl.to(q(".s01-loro-g"), { x: -330, y: -170, scale: 1.75, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(1.5)" }, UN1 - 0.25);
      [UN1, UN2].forEach((t) => {
        tl.to(q(".s01-loro-pico"), { rotation: 28, transformOrigin: "0% 0%", duration: 0.09, yoyo: true, repeat: 3 }, t);
        tl.to(q(".s01-loro-ala"), { rotation: -50, transformOrigin: "50% 0%", duration: 0.08, yoyo: true, repeat: 3 }, t);
        tl.to(q(".s01-loro-g"), { rotation: -6, transformOrigin: "50% 100%", duration: 0.08, yoyo: true, repeat: 3 }, t);
        golpe(t + 0.02, 12);
      });
      slam(q(".s01-unloro"), UN1 + 0.02);
      slam(q(".s01-unloro2"), UN2 + 0.02);
      tl.set(q(".s01-unloro2"), { rotation: 4 }, 0);
      gsap.set(qa(".s01-plumas path"), { opacity: 0 });
      qa(".s01-plumas path").forEach((p, i) => {
        tl.fromTo(p, { opacity: 1, y: 0 }, { opacity: 0, y: 160 + i * 30, rotation: 90 + i * 40, transformOrigin: "50% 50%", duration: 1.1, ease: "power1.in", immediateRender: false }, UN1 + 0.05 + i * 0.08);
      });
      

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", scale: 1.04, transformOrigin: "50% 50%", duration: 0.28, ease: "power2.in" }, DUR - 0.28);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
