  <script>
    (function () {
      const ID = "s03-pista";
      const DUR = 6.2;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // helpers
      const pop = (el, t, from = 0.6, d = 0.32) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (el, t, d = 0.22) => tl.to(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%", duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s03-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (els, t, d = 0.6, st = 0.05) => {
        [].concat(els).forEach((el, i) => {
          const L = el.getTotalLength ? el.getTotalLength() + 2 : 1000;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t + i * st);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st);
        });
      };
      // boca que habla entre t0 y t1
      const hablar = (el, t0, t1, r = 0.11) => {
        const n = Math.max(1, Math.floor((t1 - t0) / (2 * r)));
        tl.fromTo(el, { scaleY: 0.3, transformOrigin: "50% 50%" }, { scaleY: 1.15, transformOrigin: "50% 50%", duration: r, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t0);
      };
      // respirar / flotar (cantidad fija de repeticiones)
      const flotar = (el, t, hasta, amp = 8, per = 0.9) => {
        const n = Math.max(1, Math.floor((hasta - t) / per));
        tl.fromTo(el, { y: 0 }, { y: -amp, duration: per, ease: "sine.inOut", yoyo: true, repeat: n - 1, immediateRender: false }, t);
      };
      
      const QUEDA = 0.32, CAPITAN = 0.64, TENEMOS = 1.6, PISTA = 2.45, POSTEO = 3.37, DOS = 4.29, DIECINUEVE = 4.83;
      // cuadro 0: el grumete pregunta
      tl.fromTo(q(".s03-gru-g"), { scale: 0.85, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)" }, 0);
      hablar(q(".s03-gru-boca"), 0.0, 1.2);
      qa(".s03-preg").forEach((p, i) => { pop(p, 0.1 + i * 0.22, 0.2); tl.to(p, { rotation: 12, y: -10, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.5 + i * 0.22); });
      tl.to(qa(".s03-gru-pupila"), { x: 6, y: -6, duration: 0.2 }, CAPITAN);
      // "una sola pista": el grumete se achica abajo y aparece el cartel
      tl.to(qa(".s03-preg"), { opacity: 0, scale: 0.4, duration: 0.2 }, TENEMOS - 0.2);
      tl.to(q(".s03-gru-g"), { x: -330, y: 200, scale: 0.55, transformOrigin: "50% 50%", duration: 0.4, ease: "power3.inOut" }, TENEMOS - 0.25);
      slam(q(".s03-pista"), PISTA - 0.25);
      golpe(PISTA - 0.15, 10);
      // "un posteo": la reliquia, con telarañas y polvo
      gsap.set(q(".s03-post"), { opacity: 0 });
      tl.fromTo(q(".s03-post"), { opacity: 0, y: 400, rotation: 8 }, { opacity: 1, y: 0, rotation: -3, duration: 0.45, ease: "back.out(1.4)", immediateRender: false }, POSTEO - 0.3);
      dibujar(qa(".s03-tela"), POSTEO + 0.2, 0.5, 0.1);
      qa(".s03-polvo circle").forEach((c, i) => {
        gsap.set(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 0.9, x: 0, y: 0 }, { opacity: 0, x: (i % 2 ? 60 : -60), y: -80 - i * 10, duration: 1.0, ease: "power1.out", immediateRender: false }, POSTEO + 0.1 + i * 0.06);
      });
      tl.to(q(".s03-post"), { rotation: -1, duration: 0.6, yoyo: true, repeat: 2, ease: "sine.inOut" }, POSTEO + 0.4);
      // "dos mil diecinueve": sello rojo
      slam(q(".s03-sello"), DOS);
      golpe(DOS + 0.04, 16);
      tl.to(q(".s03-sello"), { scale: 1.12, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 1 }, DIECINUEVE);
      tl.to(qa(".s03-gru-ojos"), { scaleY: 1.3, transformOrigin: "50% 50%", duration: 0.12 }, DIECINUEVE);
      

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", scale: 1.04, transformOrigin: "50% 50%", duration: 0.28, ease: "power2.in" }, DUR - 0.28);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
