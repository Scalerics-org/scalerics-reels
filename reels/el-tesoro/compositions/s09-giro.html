  <script>
    (function () {
      const ID = "s09-giro";
      const DUR = 6.67;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // helpers
      const pop = (el, t, from = 0.6, d = 0.32) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (el, t, d = 0.22) => tl.to(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%", duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s09-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (els, t, d = 0.6, st = 0.05) => {
        [].concat(els).forEach((el, i) => {
          const L = el.getTotalLength ? el.getTotalLength() + 2 : 1000;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t + i * st);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st);
        });
      };
      // boca que habla entre t0 y t1
      const hablar = (el, t0, t1, r = 0.11) => {
        const n = Math.max(1, Math.floor((t1 - t0) / (2 * r)));
        tl.fromTo(el, { scaleY: 0.3, transformOrigin: "50% 50%" }, { scaleY: 1.15, transformOrigin: "50% 50%", duration: r, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t0);
      };
      // respirar / flotar (cantidad fija de repeticiones)
      const flotar = (el, t, hasta, amp = 8, per = 0.9) => {
        const n = Math.max(1, Math.floor((hasta - t) / per));
        tl.fromTo(el, { y: 0 }, { y: -amp, duration: per, ease: "sine.inOut", yoyo: true, repeat: n - 1, immediateRender: false }, t);
      };
      
      const GRUMETE = 0.73, TESORO = 1.84, EXISTE = 2.96, BUEN = 3.61, PROBLEMA = 4.77, MAPA = 5.54;
      // cuadro 0: el capitán serio y el cofre cerrado
      tl.fromTo(q(".s09-cap-g"), { y: 200 }, { y: 0, duration: 0.35, ease: "back.out(1.5)" }, 0);
      pop(q(".s09-cofre"), 0, 0.85);
      hablar(q(".s09-cap-boca"), 0.05, 1.2, 0.13);
      hablar(q(".s09-cap-boca"), 1.78, 4.4, 0.12);
      hablar(q(".s09-cap-boca"), 4.71, 6.1, 0.13);
      tl.to(q(".s09-cofre"), { rotation: 2, transformOrigin: "50% 100%", duration: 0.1, yoyo: true, repeat: 5 }, GRUMETE);
      // "el tesoro existe": se abre el cofre
      gsap.set([q(".s09-porc-g"), q(".s09-monedas"), q(".s09-rayos")], { opacity: 0 });
      tl.to(q(".s09-tapa"), { rotation: -100, svgOrigin: "-206 30", y: -20, duration: 0.3, ease: "back.out(1.6)" }, TESORO - 0.05);
      tl.fromTo(q(".s09-monedas"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, TESORO + 0.05);
      tl.fromTo(q(".s09-porc-g"), { opacity: 0, y: 120, scale: 0.5, transformOrigin: "50% 100%" }, { opacity: 1, y: 0, scale: 1, transformOrigin: "50% 100%", duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, TESORO + 0.15);
      tl.fromTo(q(".s09-rayos"), { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, immediateRender: false }, TESORO + 0.1);
      tl.fromTo(q(".s09-rayos"), { rotation: 0 }, { rotation: 40, svgOrigin: "0 0", duration: 3, ease: "none", immediateRender: false }, TESORO);
      slam(q(".s09-existe"), EXISTE - 0.1);
      golpe(EXISTE, 12);
      // "buenísimo"
      slam(q(".s09-buen"), BUEN + 0.05, 1.8);
      tl.to(q(".s09-porc-g"), { scale: 1.1, transformOrigin: "50% 100%", duration: 0.15, yoyo: true, repeat: 3 }, BUEN);
      // "el problema es el mapa": el cofre se apaga y cae el mapa viejo arrugado
      tl.to([q(".s09-cofre"), q(".s09-rayos")], { opacity: 0.2, duration: 0.25 }, PROBLEMA - 0.15);
      tl.to([q(".s09-existe"), q(".s09-buen")], { opacity: 0, duration: 0.2 }, PROBLEMA - 0.15);
      slam(q(".s09-prob"), PROBLEMA);
      gsap.set(q(".s09-viejo"), { opacity: 0 });
      tl.fromTo(q(".s09-viejo"), { opacity: 1, y: -700, rotation: -20 }, { opacity: 1, y: 0, rotation: 0, duration: 0.35, ease: "power3.in", immediateRender: false }, MAPA - 0.4);
      slam(q(".s09-mapa-t"), MAPA);
      golpe(MAPA + 0.05, 18);
      dibujar(q(".s09-circulo"), MAPA + 0.1, 0.45);
      tl.to(q(".s09-cap-ceja"), { rotation: 15, transformOrigin: "100% 50%", duration: 0.15 }, MAPA);
      

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", scale: 1.04, transformOrigin: "50% 50%", duration: 0.28, ease: "power2.in" }, DUR - 0.28);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
