    (function () {
      const ID = "s05-depende";
      const DUR = 7.96;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // helpers
      const pop = (el, t, from = 0.6, d = 0.32) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (el, t, d = 0.22) => tl.to(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%", duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s05-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (els, t, d = 0.6, st = 0.05) => {
        [].concat(els).forEach((el, i) => {
          const L = el.getTotalLength ? el.getTotalLength() + 2 : 1000;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t + i * st);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st);
        });
      };
      // boca que habla entre t0 y t1
      const hablar = (el, t0, t1, r = 0.11) => {
        const n = Math.max(1, Math.floor((t1 - t0) / (2 * r)));
        tl.fromTo(el, { scaleY: 0.3, transformOrigin: "50% 50%" }, { scaleY: 1.15, transformOrigin: "50% 50%", duration: r, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t0);
      };
      // respirar / flotar (cantidad fija de repeticiones)
      const flotar = (el, t, hasta, amp = 8, per = 0.9) => {
        const n = Math.max(1, Math.floor((hasta - t) / per));
        tl.fromTo(el, { y: 0 }, { y: -amp, duration: per, ease: "sine.inOut", yoyo: true, repeat: n - 1, immediateRender: false }, t);
      };
      
      const HORARIO = 0.48, ABIERTO = 1.63, DEPENDE = 2.57, D1 = 3.45, D2 = 4.51, LLAME = 5.66, NADIE = 6.76;
      // cuadro 0: el cartel colgado se balancea
      tl.fromTo(q(".s05-tabla"), { y: -120, rotation: -10, opacity: 0.7 }, { y: 0, rotation: -3, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s05-soga"), { opacity: 0.6 }, { opacity: 1, duration: 0.3 }, 0);
      tl.to(q(".s05-tabla"), { rotation: 0, duration: 0.7, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.45);
      tl.fromTo(q(".s05-hor"), { scale: 0.7, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, HORARIO - 0.1);
      gsap.set([q(".s05-ab"), q(".s05-dep")], { clipPath: "inset(0 100% 0 0)" });
      tl.to(q(".s05-ab"), { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "none" }, ABIERTO - 0.1);
      tl.to(q(".s05-dep"), { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "none" }, DEPENDE - 0.1);
      tl.to(q(".s05-dep"), { scale: 1.15, transformOrigin: "0% 50%", duration: 0.15, yoyo: true, repeat: 1 }, DEPENDE + 0.5);
      // el loro repite
      tl.fromTo(q(".s05-loro-g"), { x: 400 }, { x: 0, duration: 0.3, ease: "back.out(1.6)" }, D1 - 0.4);
      [D1, D2].forEach((t) => {
        tl.to(q(".s05-loro-pico"), { rotation: 28, transformOrigin: "0% 0%", duration: 0.09, yoyo: true, repeat: 5 }, t);
        tl.to(q(".s05-loro-ala"), { rotation: -45, transformOrigin: "50% 0%", duration: 0.08, yoyo: true, repeat: 5 }, t);
        tl.to(q(".s05-loro-g"), { y: -40, duration: 0.12, yoyo: true, repeat: 1 }, t);
        golpe(t + 0.03, 12);
      });
      slam(q(".s05-d1"), D1 + 0.02);
      gsap.set(q(".s05-d2"), { rotation: 5 });
      slam(q(".s05-d2"), D2 + 0.02);
      // "llamé al número": todo se va y aparece el celular llamando
      tl.to([q(".s05-tabla"), q(".s05-soga"), q(".s05-d1"), q(".s05-d2"), q(".s05-loro-g")], { opacity: 0, y: 80, duration: 0.25, ease: "power2.in" }, LLAME - 0.35);
      gsap.set(q(".s05-tel"), { opacity: 0 });
      tl.fromTo(q(".s05-tel"), { opacity: 0, y: 300, rotation: 6 }, { opacity: 1, y: 0, rotation: 0, duration: 0.35, ease: "back.out(1.5)", immediateRender: false }, LLAME - 0.15);
      tl.to(q(".s05-tel"), { rotation: 3, duration: 0.05, yoyo: true, repeat: 15, ease: "none" }, LLAME + 0.25);
      qa(".s05-ondas path").forEach((p, i) => {
        gsap.set(p, { opacity: 0 });
        [0, 0.5].forEach((d) => tl.fromTo(p, { opacity: 1 }, { opacity: 0, duration: 0.35, immediateRender: false }, LLAME + 0.25 + d + (i % 3) * 0.1));
      });
      // "nadie atiende": sello
      tl.to(q(".s05-pant"), { opacity: 0.5, duration: 0.2 }, NADIE - 0.1);
      slam(q(".s05-nadie"), NADIE);
      golpe(NADIE + 0.04, 16);
      

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", scale: 1.04, transformOrigin: "50% 50%", duration: 0.28, ease: "power2.in" }, DUR - 0.28);

      window.__timelines = window.__timelines || {};

    })();
