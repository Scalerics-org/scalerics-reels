  <script>
    (function () {
      const ID = "s02-capitan";
      const DUR = 6.98;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // helpers
      const pop = (el, t, from = 0.6, d = 0.32) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (el, t, d = 0.22) => tl.to(el, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%", duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (els, t, d = 0.6, st = 0.05) => {
        [].concat(els).forEach((el, i) => {
          const L = el.getTotalLength ? el.getTotalLength() + 2 : 1000;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t + i * st);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st);
        });
      };
      // boca que habla entre t0 y t1
      const hablar = (el, t0, t1, r = 0.11) => {
        const n = Math.max(1, Math.floor((t1 - t0) / (2 * r)));
        tl.fromTo(el, { scaleY: 0.3, transformOrigin: "50% 50%" }, { scaleY: 1.15, transformOrigin: "50% 50%", duration: r, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t0);
      };
      // respirar / flotar (cantidad fija de repeticiones)
      const flotar = (el, t, hasta, amp = 8, per = 0.9) => {
        const n = Math.max(1, Math.floor((hasta - t) / per));
        tl.fromTo(el, { y: 0 }, { y: -amp, duration: per, ease: "sine.inOut", yoyo: true, repeat: n - 1, immediateRender: false }, t);
      };
      
      const BUSCAMOS = 0.98, LEGENDARIA = 1.54, FUGAZZETA = 2.0, DONA = 2.92, DICEN = 4.19, MEJOR = 4.85, MONTEVIDEO = 5.54;
      // cuadro 0: el capitán entra señalando
      tl.fromTo(q(".s02-cap-g"), { x: -260, rotation: -8, transformOrigin: "50% 100%" }, { x: 0, rotation: 0, transformOrigin: "50% 100%", duration: 0.35, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s02-cap-brazo"), { rotation: 30, transformOrigin: "0% 100%" }, { rotation: 0, transformOrigin: "0% 100%", duration: 0.3, ease: "back.out(2)" }, 0.1);
      hablar(q(".s02-cap-boca"), 0.02, 0.6);
      hablar(q(".s02-cap-boca"), BUSCAMOS, 3.6);
      hablar(q(".s02-cap-boca"), DICEN, 6.4);
      // el grumete se asoma asustado
      tl.fromTo(q(".s02-gru-g"), { y: 320 }, { y: 0, duration: 0.3, ease: "back.out(1.8)" }, 0.35);
      tl.to(qa(".s02-gru-pupila"), { x: -8, duration: 0.2 }, 0.7);
      tl.to(qa(".s02-gru-pupila"), { y: -8, x: -4, duration: 0.2 }, FUGAZZETA);
      flotar(q(".s02-gru-g"), 1.0, 6.5, 6, 0.45);
      // "la legendaria"
      slam(q(".s02-leyenda"), LEGENDARIA);
      golpe(LEGENDARIA + 0.04, 10);
      // "fugazzeta": la porción sube brillando como un tesoro
      gsap.set([q(".s02-porc-g"), q(".s02-rayos")], { opacity: 0 });
      tl.fromTo(q(".s02-porc-g"), { opacity: 0, y: 200, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, scale: 1, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(1.7)", immediateRender: false }, FUGAZZETA - 0.15);
      tl.fromTo(q(".s02-rayos"), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 0.9, scale: 1, transformOrigin: "50% 50%", duration: 0.3, immediateRender: false }, FUGAZZETA);
      tl.fromTo(q(".s02-rayos"), { rotation: 0 }, { rotation: 60, svgOrigin: "0 0", duration: DUR - FUGAZZETA, ease: "none", immediateRender: false }, FUGAZZETA);
      tl.to(q(".s02-porc-g"), { rotation: 4, transformOrigin: "50% 50%", duration: 0.5, yoyo: true, repeat: 7, ease: "sine.inOut" }, FUGAZZETA + 0.4);
      qa(".s02-brillos path").forEach((b, i) => {
        gsap.set(b, { opacity: 0 });
        tl.fromTo(b, { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, FUGAZZETA + 0.2 + i * 0.25);
      });
      // "de Doña Rosa"
      pop(q(".s02-dona"), DONA - 0.05, 0.5);
      // "la mejor de Montevideo": corona y cinta roja
      tl.to(q(".s02-dona"), { opacity: 0, y: -20, duration: 0.2 }, DICEN + 0.3);
      tl.to(q(".s02-leyenda"), { scale: 0.85, y: -10, transformOrigin: "50% 50%", duration: 0.25 }, DICEN);
      pop(q(".s02-corona"), MEJOR - 0.05, 0.3);
      slam(q(".s02-cinta"), MONTEVIDEO - 0.1, 1.8);
      golpe(MONTEVIDEO, 10);
      tl.to(q(".s02-cap-ojo"), { scale: 1.6, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1 }, MONTEVIDEO + 0.3);
      

      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", scale: 1.04, transformOrigin: "50% 50%", duration: 0.28, ease: "power2.in" }, DUR - 0.28);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
