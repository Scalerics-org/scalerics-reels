<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s13-companero"] .s13-capa { position: absolute; inset: 0; }
    [data-composition-id="s13-companero"] .s13-escenario { position: absolute; inset: 0; }
    [data-composition-id="s13-companero"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s13-companero"] .s13-placa { position: absolute; left: 50%; top: 900px; padding: 14px 30px 12px; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 64px; text-transform: uppercase; white-space: nowrap; transform: translateX(-50%) rotate(-3deg); background: #5ce611; color: #05170f; box-shadow: 8px 8px 0 #05170f; }
    [data-composition-id="s13-companero"] .s13-tag { position: absolute; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.14em; white-space: nowrap; text-align: center; width: 300px; top: 1366px; }
    [data-composition-id="s13-companero"] .s13-tag-d { left: 240px; color: #f2b632; }
    [data-composition-id="s13-companero"] .s13-tag-a { left: 540px; color: #5ce611; }
    [data-composition-id="s13-companero"] .s13-zzz { position: absolute; font-family: "Lexend", sans-serif; font-weight: 800; color: #f3ead6; opacity: 0.9; }
  </style>
  <div id="root" data-composition-id="s13-companero" data-width="1080" data-height="1920" data-duration="4.55">
    <div id="s13-escena" class="s13-capa clip" data-start="0" data-duration="4.55" data-track-index="0">
      <div class="s13-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- arriba, apagados: el de enfrente y su compañero -->
          <g opacity="0.4">
            <g transform="translate(390 650)">
              <ellipse cx="0" cy="-30" rx="130" ry="62" fill="#e5392b" stroke="#3a2416" stroke-width="6" />
              <circle r="66" fill="#e5392b" stroke="#3a2416" stroke-width="6" />
              <circle r="16" fill="#3a2416" />
            </g>
            <g transform="translate(690 650)">
              <ellipse cx="0" cy="-30" rx="130" ry="62" fill="#3a2416" stroke="#e5392b" stroke-width="6" />
              <circle r="66" fill="#05170f" stroke="#e5392b" stroke-width="7" />
              <path d="M-72 -4 C-72 -60 72 -60 72 -4" fill="none" stroke="#f3ead6" stroke-width="10" stroke-linecap="round" />
            </g>
          </g>
          <!-- la luna sobre el dueño -->
          <g transform="translate(250 1080)"><g class="s13-luna">
            <path d="M24 -50 A54 54 0 1 0 24 50 A40 40 0 1 1 24 -50 Z" fill="#f3ead6" />
          </g></g>
          <!-- abajo: el dueño -->
          <g transform="translate(390 1260)"><g class="s13-d">
            <ellipse cx="0" cy="30" rx="130" ry="62" fill="#f2b632" stroke="#3a2416" stroke-width="6" />
            <circle r="66" fill="#f2b632" stroke="#3a2416" stroke-width="6" />
            <path d="M-50 -46 C-30 -104 30 -104 50 -46 Z" fill="#f2b632" stroke="#3a2416" stroke-width="6" stroke-linejoin="round" />
            <circle r="14" fill="#3a2416" />
          </g></g>
          <!-- y su compañero: SU agente de IA, en verde -->
          <g transform="translate(690 1260)"><g class="s13-a">
            <circle class="s13-aro" r="110" fill="none" stroke="#5ce611" stroke-width="6" />
            <ellipse cx="0" cy="30" rx="130" ry="62" fill="#0a3a25" stroke="#5ce611" stroke-width="6" />
            <circle r="66" fill="#05170f" stroke="#5ce611" stroke-width="7" />
            <path d="M-72 4 C-72 -56 72 -56 72 4" fill="none" stroke="#f3ead6" stroke-width="10" stroke-linecap="round" />
            <rect x="-86" y="-10" width="26" height="40" rx="10" fill="#f3ead6" /><rect x="60" y="-10" width="26" height="40" rx="10" fill="#f3ead6" />
            <circle class="s13-led" r="14" fill="#5ce611" />
          </g></g>
          <!-- la carta que juega el agente -->
          <g transform="translate(560 940)"><g class="s13-carta"><g class="s13-cartai" transform="rotate(-8)"></g></g></g>
        </svg>
        <div class="s13-placa s13-p1">Tu agente de IA</div>
        <div class="s13-placa s13-p2">Tu compañero</div>
        <div class="s13-tag s13-tag-d">VOS</div>
        <div class="s13-tag s13-tag-a">TU AGENTE</div>
        <div class="s13-zzz" style="left: 120px; top: 930px; font-size: 44px;">z</div>
        <div class="s13-zzz" style="left: 160px; top: 870px; font-size: 56px;">z</div>
        <div class="s13-zzz" style="left: 210px; top: 795px; font-size: 70px;">Z</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s13-companero";
      const DUR = 4.55;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // <naipes> (lo inyecta partes/inyectar.mjs: no editar a mano en las escenas)
      const NAI = { crema: "#f3ead6", madera: "#7a4a26", oscuro: "#3a2416", rojo: "#e5392b", oro: "#f2b632", pano: "#0a3a25", verde: "#5ce611" };
      const COLOR_PALO = { espada: NAI.rojo, copa: NAI.rojo, oro: NAI.oro, basto: NAI.madera };
      // dibujo del palo en una caja de 100x100 centrada en 0,0
      const palo = (p, c = COLOR_PALO[p]) => ({
        espada: `<path d="M0 -50 L9 -36 L9 20 L-9 20 L-9 -36 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 -36 V14" stroke="${NAI.crema}" stroke-width="3" stroke-linecap="round" opacity="0.7"/><path d="M-28 24 H28" stroke="${NAI.oscuro}" stroke-width="10" stroke-linecap="round"/><path d="M-28 24 H28" stroke="${NAI.oro}" stroke-width="5" stroke-linecap="round"/><path d="M0 28 V44" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><circle cx="0" cy="50" r="7" fill="${NAI.oro}" stroke="${NAI.oscuro}" stroke-width="3"/>`,
        basto: `<path d="M-9 50 C-13 22 -18 -12 -16 -38 C-14 -54 14 -54 16 -38 C18 -12 13 22 9 50 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><circle cx="-10" cy="-18" r="5" fill="${NAI.oscuro}"/><circle cx="9" cy="2" r="5" fill="${NAI.oscuro}"/><circle cx="-6" cy="24" r="4" fill="${NAI.oscuro}"/>`,
        copa: `<path d="M-30 -40 H30 C30 -8 16 8 0 10 C-16 8 -30 -8 -30 -40 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 10 V36" stroke="${NAI.oscuro}" stroke-width="8" stroke-linecap="round"/><path d="M-22 42 H22" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><path d="M-20 -30 H20" stroke="${NAI.oro}" stroke-width="4" stroke-linecap="round"/>`,
        oro: `<circle r="38" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4"/><circle r="22" fill="none" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="8" fill="${NAI.oscuro}"/>`,
      })[p];
      // carta de frente centrada en 0,0 (alto = 1.5 ancho)
      const carta = (num, p, w = 220, c = COLOR_PALO[p]) => {
        const h = w * 1.5, s = w / 200;
        return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 12 * s}" y="${-h / 2 + 12 * s}" width="${w - 24 * s}" height="${h - 24 * s}" rx="${10 * s}" fill="none" stroke="${c}" stroke-width="3" opacity="0.55"/>` +
          `<text x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<text transform="rotate(180)" x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<g transform="scale(${1.15 * s})">${palo(p, c)}</g>`;
      };
      // dorso de carta centrado en 0,0
      const dorso = (w = 220) => {
        const h = w * 1.5, s = w / 200;
        let r = "";
        for (let k = -4; k <= 4; k++) r += `<path d="M${k * 40 * s - h / 2} ${-h / 2} L ${k * 40 * s + h / 2} ${h / 2} M${k * 40 * s + h / 2} ${-h / 2} L ${k * 40 * s - h / 2} ${h / 2}"/>`;
        const id = "cl" + Math.round(w) + "_" + (dorso.n = (dorso.n || 0) + 1);
        return `<defs><clipPath id="${id}"><rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}"/></clipPath></defs>` +
          `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}" fill="${NAI.rojo}"/>` +
          `<g clip-path="url(#${id})" stroke="${NAI.crema}" stroke-width="${4 * s}" opacity="0.55">${r}</g>` +
          `<circle r="${26 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="${12 * s}" fill="${NAI.rojo}"/>`;
      };
      const pinta = (sel, html) => { for (const el of root.querySelectorAll(sel)) el.innerHTML = html; };
      // </naipes>
      pinta(".s13-cartai", carta("1", "espada", 210, NAI.verde).replace(/<g transform="scale\([^)]*\)">/, '<g transform="scale(2.2)">'));

      const AGENTE = 0.48, COMPANERO = 1.62, MIENTRAS = 2.87, DORMIS = 3.54;

      // cuadro 0: el dueño ya está; en "Armamos" aparece su agente
      tl.fromTo(q(".s13-d"), { opacity: 0.7 }, { opacity: 1, duration: 0.2 }, 0);
      tl.fromTo(q(".s13-a"), { opacity: 0.3, scale: 0.4, svgOrigin: "0 0", smoothOrigin: false }, { opacity: 1, scale: 1, svgOrigin: "0 0", smoothOrigin: false, duration: 0.4, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".s13-aro"), { scale: 0.6, opacity: 1, svgOrigin: "0 0", smoothOrigin: false }, { scale: 1.6, opacity: 0, svgOrigin: "0 0", smoothOrigin: false, duration: 0.6, ease: "power2.out" }, 0.1);
      tl.fromTo(q(".s13-aro"), { scale: 0.6, opacity: 1 }, { scale: 1.6, opacity: 0, svgOrigin: "0 0", smoothOrigin: false, duration: 0.6, ease: "power2.out", immediateRender: false }, 1.0);
      tl.fromTo(q(".s13-led"), { opacity: 1 }, { opacity: 0.35, duration: 0.25, yoyo: true, repeat: 15, ease: "steps(1)" }, 0.3);
      gsap.set([q(".s13-tag-d"), q(".s13-tag-a")], { opacity: 0 });
      tl.fromTo([q(".s13-tag-d"), q(".s13-tag-a")], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.1, immediateRender: false }, 0.3);
      gsap.set([q(".s13-p1"), q(".s13-p2")], { opacity: 0 });
      tl.fromTo(q(".s13-p1"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)", immediateRender: false }, AGENTE);
      tl.to(q(".s13-p1"), { opacity: 0, y: -40, duration: 0.15 }, COMPANERO - 0.15);
      tl.fromTo(q(".s13-p2"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)", immediateRender: false }, COMPANERO);
      tl.to(q(".s13-p2"), { opacity: 0, y: -40, duration: 0.2 }, MIENTRAS - 0.3);

      // "mientras vos dormís": luna y zzz sobre el dueño; el agente juega la carta
      gsap.set(q(".s13-luna"), { opacity: 0 });
      tl.fromTo(q(".s13-luna"), { opacity: 0, scale: 0.4, svgOrigin: "0 0", smoothOrigin: false }, { opacity: 1, scale: 1, svgOrigin: "0 0", smoothOrigin: false, duration: 0.3, ease: "back.out(2)", immediateRender: false }, MIENTRAS);
      tl.to(q(".s13-d"), { opacity: 0.55, duration: 0.3 }, MIENTRAS);
      qa(".s13-zzz").forEach((z, i) => {
        gsap.set(z, { opacity: 0 });
        tl.fromTo(z, { opacity: 0, y: 20 }, { opacity: 0.9, y: -10, duration: 0.4, ease: "power1.out", immediateRender: false }, DORMIS - 0.3 + i * 0.18);
      });
      gsap.set(q(".s13-carta"), { opacity: 0 });
      tl.fromTo(q(".s13-carta"), { opacity: 1, x: 130, y: 320, rotation: 30, scale: 0.6, svgOrigin: "0 0", smoothOrigin: false }, { opacity: 1, x: 0, y: 0, rotation: 0, scale: 1, svgOrigin: "0 0", smoothOrigin: false, duration: 0.4, ease: "back.out(1.4)", immediateRender: false }, MIENTRAS + 0.05);
      tl.to(q(".s13-carta"), { rotation: 3, svgOrigin: "0 0", smoothOrigin: false, duration: 0.3, yoyo: true, repeat: 2, ease: "sine.inOut" }, MIENTRAS + 0.5);

      tl.to(q("#s13-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
