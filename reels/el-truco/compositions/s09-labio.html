<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s09-labio"] .s09-capa { position: absolute; inset: 0; }
    [data-composition-id="s09-labio"] .s09-escenario { position: absolute; inset: 0; }
    [data-composition-id="s09-labio"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s09-labio"] .s09-sena { position: absolute; left: 610px; top: 560px; font-family: "Lexend", sans-serif; font-weight: 700; font-size: 52px; color: #f3ead6; opacity: 0.92; transform: rotate(5deg); white-space: nowrap; }
    [data-composition-id="s09-labio"] .s09-sena small { display: block; font-size: 30px; color: #f2b632; letter-spacing: 0.1em; }
    [data-composition-id="s09-labio"] .s09-nervios { position: absolute; left: 600px; top: 712px; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 64px; color: #f2b632; text-shadow: 5px 5px 0 #3a2416; transform: rotate(-4deg); white-space: nowrap; }
    [data-composition-id="s09-labio"] .s09-preg { position: absolute; left: 760px; top: 860px; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 220px; line-height: 1; color: #f2b632; text-shadow: 8px 8px 0 #3a2416; }
  </style>
  <div id="root" data-composition-id="s09-labio" data-width="1080" data-height="1920" data-duration="3.76">
    <div id="s09-escena" class="s09-capa clip" data-start="0" data-duration="3.76" data-track-index="0">
      <div class="s09-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <path class="s09-tacha" d="M600 640 C720 628 860 640 990 622" stroke="#e5392b" stroke-width="12" stroke-linecap="round" fill="none" />
          <g transform="translate(420 960)"><g class="s09-cara">
            <g class="s09-cabeza">
              <circle cx="0" cy="0" r="160" fill="#f3ead6" stroke="#3a2416" stroke-width="7" />
              <!-- gorra oro con visera adelante -->
              <path d="M-156 -40 C-156 -190 156 -190 156 -40 Z" fill="#f2b632" stroke="#3a2416" stroke-width="7" stroke-linejoin="round" />
              <path d="M-176 -40 C-90 -66 90 -66 176 -40 C150 -10 -150 -10 -176 -40 Z" fill="#f2b632" stroke="#3a2416" stroke-width="7" stroke-linejoin="round" />
              <!-- ojos -->
              <circle cx="-56" cy="26" r="26" fill="#f3ead6" stroke="#3a2416" stroke-width="6" />
              <circle cx="56" cy="26" r="26" fill="#f3ead6" stroke="#3a2416" stroke-width="6" />
              <g class="s09-pupilas"><circle cx="-56" cy="30" r="10" fill="#3a2416" /><circle cx="56" cy="30" r="10" fill="#3a2416" /></g>
              <path d="M-90 -6 C-70 2 -40 4 -26 -2 M26 -2 C40 4 70 2 90 -6" stroke="#3a2416" stroke-width="10" stroke-linecap="round" fill="none" />
              <!-- bigote -->
              <path d="M-80 88 C-50 62 -16 66 0 80 C16 66 50 62 80 88 C50 82 20 92 0 90 C-20 92 -50 82 -80 88 Z" fill="#3a2416" />
              <!-- boca y labio mordido -->
              <path d="M-40 120 C-14 132 14 132 40 120" stroke="#3a2416" stroke-width="8" stroke-linecap="round" fill="none" />
              <g class="s09-dientes"><rect x="-30" y="104" width="60" height="22" rx="6" fill="#f3ead6" stroke="#3a2416" stroke-width="5" /><path d="M-10 106 V124 M10 106 V124" stroke="#3a2416" stroke-width="4" /></g>
              <!-- gotas de sudor -->
              <g fill="#9fdcff" stroke="#3a2416" stroke-width="4">
                <path class="s09-gota" d="M150 -40 C138 -16 136 0 150 8 C164 0 162 -16 150 -40 Z" />
                <path class="s09-gota" d="M-150 -10 C-162 14 -164 30 -150 38 C-136 30 -138 14 -150 -10 Z" />
                <path class="s09-gota" d="M118 60 C108 80 106 94 118 100 C130 94 128 80 118 60 Z" />
              </g>
            </g>
            <!-- su abanico (mangas oro) -->
            <g transform="translate(0 230)">
              <g transform="rotate(-18 0 140)"><g class="s09-cd"></g></g>
              <g><g class="s09-cd" transform="translate(0 -12)"></g></g>
              <g transform="rotate(18 0 140)"><g class="s09-cd"></g></g>
              <ellipse cx="0" cy="110" rx="70" ry="44" fill="#f3ead6" stroke="#3a2416" stroke-width="5" />
              <path d="M-60 140 L-80 260 L80 260 L60 140 Z" fill="#f2b632" stroke="#3a2416" stroke-width="6" stroke-linejoin="round" />
            </g>
          </g></g>
        </svg>
        <div class="s09-sena"><small>SEÑA</small>muerdo el labio</div>
        <div class="s09-nervios">(son nervios)</div>
        <div class="s09-preg">?</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s09-labio";
      const DUR = 3.76;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // <naipes> (lo inyecta partes/inyectar.mjs: no editar a mano en las escenas)
      const NAI = { crema: "#f3ead6", madera: "#7a4a26", oscuro: "#3a2416", rojo: "#e5392b", oro: "#f2b632", pano: "#0a3a25", verde: "#5ce611" };
      const COLOR_PALO = { espada: NAI.rojo, copa: NAI.rojo, oro: NAI.oro, basto: NAI.madera };
      // dibujo del palo en una caja de 100x100 centrada en 0,0
      const palo = (p, c = COLOR_PALO[p]) => ({
        espada: `<path d="M0 -50 L9 -36 L9 20 L-9 20 L-9 -36 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 -36 V14" stroke="${NAI.crema}" stroke-width="3" stroke-linecap="round" opacity="0.7"/><path d="M-28 24 H28" stroke="${NAI.oscuro}" stroke-width="10" stroke-linecap="round"/><path d="M-28 24 H28" stroke="${NAI.oro}" stroke-width="5" stroke-linecap="round"/><path d="M0 28 V44" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><circle cx="0" cy="50" r="7" fill="${NAI.oro}" stroke="${NAI.oscuro}" stroke-width="3"/>`,
        basto: `<path d="M-9 50 C-13 22 -18 -12 -16 -38 C-14 -54 14 -54 16 -38 C18 -12 13 22 9 50 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><circle cx="-10" cy="-18" r="5" fill="${NAI.oscuro}"/><circle cx="9" cy="2" r="5" fill="${NAI.oscuro}"/><circle cx="-6" cy="24" r="4" fill="${NAI.oscuro}"/>`,
        copa: `<path d="M-30 -40 H30 C30 -8 16 8 0 10 C-16 8 -30 -8 -30 -40 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 10 V36" stroke="${NAI.oscuro}" stroke-width="8" stroke-linecap="round"/><path d="M-22 42 H22" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><path d="M-20 -30 H20" stroke="${NAI.oro}" stroke-width="4" stroke-linecap="round"/>`,
        oro: `<circle r="38" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4"/><circle r="22" fill="none" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="8" fill="${NAI.oscuro}"/>`,
      })[p];
      // carta de frente centrada en 0,0 (alto = 1.5 ancho)
      const carta = (num, p, w = 220, c = COLOR_PALO[p]) => {
        const h = w * 1.5, s = w / 200;
        return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 12 * s}" y="${-h / 2 + 12 * s}" width="${w - 24 * s}" height="${h - 24 * s}" rx="${10 * s}" fill="none" stroke="${c}" stroke-width="3" opacity="0.55"/>` +
          `<text x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<text transform="rotate(180)" x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<g transform="scale(${1.15 * s})">${palo(p, c)}</g>`;
      };
      // dorso de carta centrado en 0,0
      const dorso = (w = 220) => {
        const h = w * 1.5, s = w / 200;
        let r = "";
        for (let k = -4; k <= 4; k++) r += `<path d="M${k * 40 * s - h / 2} ${-h / 2} L ${k * 40 * s + h / 2} ${h / 2} M${k * 40 * s + h / 2} ${-h / 2} L ${k * 40 * s - h / 2} ${h / 2}"/>`;
        const id = "cl" + Math.round(w) + "_" + (dorso.n = (dorso.n || 0) + 1);
        return `<defs><clipPath id="${id}"><rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}"/></clipPath></defs>` +
          `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}" fill="${NAI.rojo}"/>` +
          `<g clip-path="url(#${id})" stroke="${NAI.crema}" stroke-width="${4 * s}" opacity="0.55">${r}</g>` +
          `<circle r="${26 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="${12 * s}" fill="${NAI.rojo}"/>`;
      };
      const pinta = (sel, html) => { for (const el of root.querySelectorAll(sel)) el.innerHTML = html; };
      // </naipes>
      pinta(".s09-cd", dorso(170));
      const dibujar = (el, t, d = 0.3) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.01 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t);
      };
      const MUERDO = 0.47, LABIO = 0.84, NERVIOS = 1.88, QUE = 2.67;

      // cuadro 0: la cara ya sube
      tl.fromTo(q(".s09-cara"), { y: 220, opacity: 0.7 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.5)" }, 0);
      // muerde el labio
      gsap.set(q(".s09-dientes"), { opacity: 0 });
      tl.fromTo(q(".s09-dientes"), { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.12, immediateRender: false }, MUERDO);
      tl.to(q(".s09-dientes"), { y: 4, duration: 0.08, yoyo: true, repeat: 5, ease: "none" }, LABIO);
      gsap.set(q(".s09-sena"), { opacity: 0 });
      tl.fromTo(q(".s09-sena"), { opacity: 0, scale: 1.5 }, { opacity: 0.92, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, MUERDO + 0.1);

      // "nervios": se tacha la seña, tiembla, gotas
      dibujar(q(".s09-tacha"), NERVIOS - 0.1, 0.25);
      gsap.set(q(".s09-nervios"), { opacity: 0 });
      tl.fromTo(q(".s09-nervios"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)", immediateRender: false }, NERVIOS);
      tl.to(q(".s09-cabeza"), { x: 5, duration: 0.04, yoyo: true, repeat: 17, ease: "none" }, NERVIOS);
      qa(".s09-gota").forEach((g, i) => {
        gsap.set(g, { opacity: 0 });
        tl.fromTo(g, { opacity: 0, y: -10 }, { opacity: 1, y: 30, duration: 0.6, ease: "power1.in", immediateRender: false }, NERVIOS + i * 0.12);
      });

      // "¿qué tenés, a ver?": ojos para arriba y el signo
      tl.to(q(".s09-pupilas"), { y: -16, x: 6, duration: 0.15, ease: "power2.out" }, QUE);
      gsap.set(q(".s09-preg"), { opacity: 0 });
      tl.fromTo(q(".s09-preg"), { opacity: 0, scale: 0.3, rotation: -30 }, { opacity: 1, scale: 1, rotation: 8, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, QUE + 0.1);
      tl.to(q(".s09-preg"), { rotation: -6, duration: 0.2, yoyo: true, repeat: 2, ease: "sine.inOut" }, QUE + 0.4);

      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
