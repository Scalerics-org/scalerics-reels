<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s11-mazo"] .s11-capa { position: absolute; inset: 0; }
    [data-composition-id="s11-mazo"] .s11-escenario { position: absolute; inset: 0; }
    [data-composition-id="s11-mazo"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s11-mazo"] .s11-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; text-transform: uppercase; line-height: 1; white-space: nowrap; letter-spacing: -0.02em; color: #f3ead6; text-shadow: 10px 10px 0 #e5392b; transform: rotate(-6deg); }
    [data-composition-id="s11-mazo"] .s11-sefue { top: 590px; font-size: 136px; }
    [data-composition-id="s11-mazo"] .s11-almazo { top: 750px; font-size: 136px; }
    [data-composition-id="s11-mazo"] .s11-ja { position: absolute; font-family: "Lexend", sans-serif; font-weight: 700; font-size: 56px; color: #9fdcff; opacity: 0.92; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s11-mazo" data-width="1080" data-height="1920" data-duration="3.39">
    <div id="s11-escena" class="s11-capa clip" data-start="0" data-duration="3.39" data-track-index="0">
      <div class="s11-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- el mazo -->
          <g transform="translate(540 1060)"><g class="s11-mazo">
            <g transform="translate(12 12) rotate(6)" class="s11-dm"></g>
            <g transform="translate(6 6) rotate(2)" class="s11-dm"></g>
            <g transform="rotate(-3)" class="s11-dm"></g>
          </g></g>
          <!-- las tres cartas del dueño vuelan al mazo -->
          <g transform="translate(400 1330)"><g class="s11-vuela"><g class="s11-dv" transform="rotate(-14)"></g></g></g>
          <g transform="translate(540 1340)"><g class="s11-vuela"><g class="s11-dv"></g></g></g>
          <g transform="translate(680 1330)"><g class="s11-vuela"><g class="s11-dv" transform="rotate(14)"></g></g></g>
          <!-- la gorra del dueño que se hunde -->
          <g transform="translate(540 1330)"><g class="s11-gorra">
            <path d="M-120 40 C-120 -80 120 -80 120 40 Z" fill="#f2b632" stroke="#3a2416" stroke-width="7" stroke-linejoin="round" />
            <path d="M-140 40 C-70 18 70 18 140 40 C120 64 -120 64 -140 40 Z" fill="#f2b632" stroke="#3a2416" stroke-width="7" stroke-linejoin="round" />
            <circle cx="0" cy="-62" r="10" fill="#3a2416" />
          </g></g>
        </svg>
        <div class="s11-txt s11-sefue">¡Se fue</div>
        <div class="s11-txt s11-almazo">al mazo!</div>
        <div class="s11-ja" style="left: 90px; top: 1000px; transform: rotate(-12deg);">JA</div>
        <div class="s11-ja" style="left: 860px; top: 960px; transform: rotate(10deg);">JA JA</div>
        <div class="s11-ja" style="left: 120px; top: 1220px; transform: rotate(8deg);">JA JA JA</div>
        <div class="s11-ja" style="left: 820px; top: 1200px; transform: rotate(-8deg);">JA</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s11-mazo";
      const DUR = 3.39;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // <naipes> (lo inyecta partes/inyectar.mjs: no editar a mano en las escenas)
      const NAI = { crema: "#f3ead6", madera: "#7a4a26", oscuro: "#3a2416", rojo: "#e5392b", oro: "#f2b632", pano: "#0a3a25", verde: "#5ce611" };
      const COLOR_PALO = { espada: NAI.rojo, copa: NAI.rojo, oro: NAI.oro, basto: NAI.madera };
      // dibujo del palo en una caja de 100x100 centrada en 0,0
      const palo = (p, c = COLOR_PALO[p]) => ({
        espada: `<path d="M0 -50 L9 -36 L9 20 L-9 20 L-9 -36 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 -36 V14" stroke="${NAI.crema}" stroke-width="3" stroke-linecap="round" opacity="0.7"/><path d="M-28 24 H28" stroke="${NAI.oscuro}" stroke-width="10" stroke-linecap="round"/><path d="M-28 24 H28" stroke="${NAI.oro}" stroke-width="5" stroke-linecap="round"/><path d="M0 28 V44" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><circle cx="0" cy="50" r="7" fill="${NAI.oro}" stroke="${NAI.oscuro}" stroke-width="3"/>`,
        basto: `<path d="M-9 50 C-13 22 -18 -12 -16 -38 C-14 -54 14 -54 16 -38 C18 -12 13 22 9 50 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><circle cx="-10" cy="-18" r="5" fill="${NAI.oscuro}"/><circle cx="9" cy="2" r="5" fill="${NAI.oscuro}"/><circle cx="-6" cy="24" r="4" fill="${NAI.oscuro}"/>`,
        copa: `<path d="M-30 -40 H30 C30 -8 16 8 0 10 C-16 8 -30 -8 -30 -40 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 10 V36" stroke="${NAI.oscuro}" stroke-width="8" stroke-linecap="round"/><path d="M-22 42 H22" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><path d="M-20 -30 H20" stroke="${NAI.oro}" stroke-width="4" stroke-linecap="round"/>`,
        oro: `<circle r="38" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4"/><circle r="22" fill="none" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="8" fill="${NAI.oscuro}"/>`,
      })[p];
      // carta de frente centrada en 0,0 (alto = 1.5 ancho)
      const carta = (num, p, w = 220, c = COLOR_PALO[p]) => {
        const h = w * 1.5, s = w / 200;
        return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 12 * s}" y="${-h / 2 + 12 * s}" width="${w - 24 * s}" height="${h - 24 * s}" rx="${10 * s}" fill="none" stroke="${c}" stroke-width="3" opacity="0.55"/>` +
          `<text x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<text transform="rotate(180)" x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<g transform="scale(${1.15 * s})">${palo(p, c)}</g>`;
      };
      // dorso de carta centrado en 0,0
      const dorso = (w = 220) => {
        const h = w * 1.5, s = w / 200;
        let r = "";
        for (let k = -4; k <= 4; k++) r += `<path d="M${k * 40 * s - h / 2} ${-h / 2} L ${k * 40 * s + h / 2} ${h / 2} M${k * 40 * s + h / 2} ${-h / 2} L ${k * 40 * s - h / 2} ${h / 2}"/>`;
        const id = "cl" + Math.round(w) + "_" + (dorso.n = (dorso.n || 0) + 1);
        return `<defs><clipPath id="${id}"><rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}"/></clipPath></defs>` +
          `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}" fill="${NAI.rojo}"/>` +
          `<g clip-path="url(#${id})" stroke="${NAI.crema}" stroke-width="${4 * s}" opacity="0.55">${r}</g>` +
          `<circle r="${26 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="${12 * s}" fill="${NAI.rojo}"/>`;
      };
      const pinta = (sel, html) => { for (const el of root.querySelectorAll(sel)) el.innerHTML = html; };
      // </naipes>
      pinta(".s11-dm", dorso(170));
      pinta(".s11-dv", dorso(150));

      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s11-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const MAZO = 0.55, EL = 1.52, DUENO = 1.67, MAZO2 = 2.13;

      // cuadro 0: las cartas ya vuelan
      const desde = [[400, 1330], [540, 1340], [680, 1330]];
      qa(".s11-vuela").forEach((c, i) => {
        tl.fromTo(c, { x: 0, y: 0, rotation: 0, opacity: 1, svgOrigin: "0 0", smoothOrigin: false },
          { x: 540 - desde[i][0], y: 1060 - desde[i][1], rotation: 200 + i * 60, svgOrigin: "0 0", smoothOrigin: false, duration: 0.32, ease: "power2.in" }, i * 0.1);
        tl.to(c, { opacity: 0, duration: 0.05 }, i * 0.1 + 0.32);
      });
      tl.fromTo(q(".s11-mazo"), { scale: 1 }, { scale: 1.08, svgOrigin: "0 0", smoothOrigin: false, duration: 0.08, yoyo: true, repeat: 5, ease: "none" }, 0.3);

      // "¡se fue al mazo!"
      gsap.set([q(".s11-sefue"), q(".s11-almazo")], { opacity: 0 });
      tl.fromTo(q(".s11-sefue"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.13, ease: "power4.in", immediateRender: false }, 0.05);
      tl.fromTo(q(".s11-almazo"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.13, ease: "power4.in", immediateRender: false }, MAZO - 0.1);
      sacudon(MAZO + 0.03, 1.3);
      tl.to([q(".s11-sefue"), q(".s11-almazo")], { rotation: -3, duration: 0.15, yoyo: true, repeat: 7, ease: "sine.inOut" }, MAZO + 0.2);

      // la gorra del dueño se hunde abajo de la mesa
      gsap.set(q(".s11-gorra"), { opacity: 0 });
      tl.fromTo(q(".s11-gorra"), { opacity: 1, y: 160 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, EL - 0.1);
      tl.to(q(".s11-gorra"), { y: 260, duration: 0.6, ease: "power2.in" }, DUENO + 0.3);
      tl.to(q(".s11-gorra"), { opacity: 0, duration: 0.1 }, DUENO + 0.85);

      // las risas de la mesa
      qa(".s11-ja").forEach((j, i) => {
        gsap.set(j, { opacity: 0 });
        tl.fromTo(j, { opacity: 0, scale: 0.4 }, { opacity: 0.92, scale: 1, duration: 0.2, ease: "back.out(3)", immediateRender: false }, DUENO + 0.1 + i * 0.15);
        tl.to(j, { y: -14, duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut" }, DUENO + 0.3 + i * 0.15);
      });
      sacudon(MAZO2 + 0.05, 0.7);

      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
