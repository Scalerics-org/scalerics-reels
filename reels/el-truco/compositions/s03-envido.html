<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-envido"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-envido"] .s03-escenario { position: absolute; inset: 0; }
    [data-composition-id="s03-envido"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-envido"] .s03-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; text-transform: uppercase; line-height: 1; white-space: nowrap; }
    [data-composition-id="s03-envido"] .s03-envido { top: 1040px; font-size: 130px; color: #f2b632; text-shadow: 9px 9px 0 #3a2416; transform: rotate(-5deg); }
    [data-composition-id="s03-envido"] .s03-primero { top: 1236px; font-size: 64px; color: #f3ead6; text-shadow: 6px 6px 0 #05170f; transform: rotate(-5deg); }
    [data-composition-id="s03-envido"] .s03-dias { position: absolute; left: 120px; top: 590px; width: 840px; display: flex; gap: 12px; }
    [data-composition-id="s03-envido"] .s03-dia { width: 108px; height: 108px; border-radius: 14px; border: 5px solid #f3ead6; display: flex; align-items: center; justify-content: center; font-family: "Lexend", sans-serif; font-weight: 800; font-size: 54px; color: #f3ead6; opacity: 0.35; }
    [data-composition-id="s03-envido"] .s03-dia { position: relative; }
    [data-composition-id="s03-envido"] .s03-on { position: absolute; inset: -5px; border-radius: 14px; background: #f2b632; color: #05170f; display: flex; align-items: center; justify-content: center; opacity: 0; }
    [data-composition-id="s03-envido"] .s03-hs { position: absolute; left: 0; right: 0; top: 1262px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 52px; letter-spacing: 0.12em; color: #f2b632; }
  </style>
  <div id="root" data-composition-id="s03-envido" data-width="1080" data-height="1920" data-duration="5.53">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="5.53" data-track-index="0">
      <div class="s03-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- la mano del dueño: "pará, pará" -->
          <g transform="translate(540 820)"><g class="s03-mano">
            <path d="M-70 120 L-90 560 L90 560 L70 120 Z" fill="#f2b632" stroke="#3a2416" stroke-width="6" stroke-linejoin="round" />
            <path d="M-70 124 H70" stroke="#f3ead6" stroke-width="16" stroke-linecap="round" />
            <g stroke="#3a2416" stroke-width="6" stroke-linejoin="round" fill="#f3ead6">
              <rect x="-96" y="-150" width="40" height="160" rx="20" />
              <rect x="-48" y="-196" width="42" height="200" rx="21" />
              <rect x="2" y="-186" width="42" height="190" rx="21" />
              <rect x="52" y="-150" width="40" height="160" rx="20" />
              <rect x="64" y="-30" width="40" height="120" rx="20" transform="rotate(-38 84 60)" />
              <rect x="-100" y="-40" width="196" height="170" rx="56" />
            </g>
            <path d="M-50 40 C-20 60 20 60 50 40" stroke="#3a2416" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6" />
          </g></g>
          <!-- el envido del horario: 9 y 6 de oros -->
          <g transform="translate(400 1070)"><g class="s03-c9"><g class="s03-c9i" transform="rotate(-7)"></g></g></g>
          <g transform="translate(680 1070)"><g class="s03-c6"><g class="s03-c6i" transform="rotate(6)"></g></g></g>
        </svg>
        <div class="s03-txt s03-envido">El envido</div>
        <div class="s03-txt s03-primero" data-layout-allow-overlap>está primero</div>
        <div class="s03-dias">
          <div class="s03-dia">L<div class="s03-on">L</div></div><div class="s03-dia">M<div class="s03-on">M</div></div><div class="s03-dia">M<div class="s03-on">M</div></div><div class="s03-dia">J<div class="s03-on">J</div></div><div class="s03-dia">V<div class="s03-on">V</div></div><div class="s03-dia">S</div><div class="s03-dia">D</div>
        </div>
        <div class="s03-hs">9 A 18 HS</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-envido";
      const DUR = 5.53;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // <naipes> (lo inyecta partes/inyectar.mjs: no editar a mano en las escenas)
      const NAI = { crema: "#f3ead6", madera: "#7a4a26", oscuro: "#3a2416", rojo: "#e5392b", oro: "#f2b632", pano: "#0a3a25", verde: "#5ce611" };
      const COLOR_PALO = { espada: NAI.rojo, copa: NAI.rojo, oro: NAI.oro, basto: NAI.madera };
      // dibujo del palo en una caja de 100x100 centrada en 0,0
      const palo = (p, c = COLOR_PALO[p]) => ({
        espada: `<path d="M0 -50 L9 -36 L9 20 L-9 20 L-9 -36 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 -36 V14" stroke="${NAI.crema}" stroke-width="3" stroke-linecap="round" opacity="0.7"/><path d="M-28 24 H28" stroke="${NAI.oscuro}" stroke-width="10" stroke-linecap="round"/><path d="M-28 24 H28" stroke="${NAI.oro}" stroke-width="5" stroke-linecap="round"/><path d="M0 28 V44" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><circle cx="0" cy="50" r="7" fill="${NAI.oro}" stroke="${NAI.oscuro}" stroke-width="3"/>`,
        basto: `<path d="M-9 50 C-13 22 -18 -12 -16 -38 C-14 -54 14 -54 16 -38 C18 -12 13 22 9 50 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><circle cx="-10" cy="-18" r="5" fill="${NAI.oscuro}"/><circle cx="9" cy="2" r="5" fill="${NAI.oscuro}"/><circle cx="-6" cy="24" r="4" fill="${NAI.oscuro}"/>`,
        copa: `<path d="M-30 -40 H30 C30 -8 16 8 0 10 C-16 8 -30 -8 -30 -40 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 10 V36" stroke="${NAI.oscuro}" stroke-width="8" stroke-linecap="round"/><path d="M-22 42 H22" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><path d="M-20 -30 H20" stroke="${NAI.oro}" stroke-width="4" stroke-linecap="round"/>`,
        oro: `<circle r="38" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4"/><circle r="22" fill="none" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="8" fill="${NAI.oscuro}"/>`,
      })[p];
      // carta de frente centrada en 0,0 (alto = 1.5 ancho)
      const carta = (num, p, w = 220, c = COLOR_PALO[p]) => {
        const h = w * 1.5, s = w / 200;
        return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 12 * s}" y="${-h / 2 + 12 * s}" width="${w - 24 * s}" height="${h - 24 * s}" rx="${10 * s}" fill="none" stroke="${c}" stroke-width="3" opacity="0.55"/>` +
          `<text x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<text transform="rotate(180)" x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<g transform="scale(${1.15 * s})">${palo(p, c)}</g>`;
      };
      // dorso de carta centrado en 0,0
      const dorso = (w = 220) => {
        const h = w * 1.5, s = w / 200;
        let r = "";
        for (let k = -4; k <= 4; k++) r += `<path d="M${k * 40 * s - h / 2} ${-h / 2} L ${k * 40 * s + h / 2} ${h / 2} M${k * 40 * s + h / 2} ${-h / 2} L ${k * 40 * s - h / 2} ${h / 2}"/>`;
        const id = "cl" + Math.round(w) + "_" + (dorso.n = (dorso.n || 0) + 1);
        return `<defs><clipPath id="${id}"><rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}"/></clipPath></defs>` +
          `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}" fill="${NAI.rojo}"/>` +
          `<g clip-path="url(#${id})" stroke="${NAI.crema}" stroke-width="${4 * s}" opacity="0.55">${r}</g>` +
          `<circle r="${26 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="${12 * s}" fill="${NAI.rojo}"/>`;
      };
      const pinta = (sel, html) => { for (const el of root.querySelectorAll(sel)) el.innerHTML = html; };
      // </naipes>
      pinta(".s03-c9i", carta("9", "oro", 220));
      pinta(".s03-c6i", carta("6", "oro", 220));

      const sacudon = (t, f = 1) => [[-12, 7], [9, -5], [-4, 2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s03-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const PARA2 = 0.19, ENVIDO = 1.11, YO = 2.58, LUNES = 3.15, VIERNES = 3.43, NUEVE = 4.26, SEIS = 4.63;

      // cuadro 0: la mano ya sube
      tl.fromTo(q(".s03-mano"), { y: 260, opacity: 0.7 }, { y: 0, opacity: 1, duration: 0.2, ease: "back.out(1.6)" }, 0);
      tl.to(q(".s03-mano"), { rotation: -8, svgOrigin: "0 300", smoothOrigin: false, duration: 0.09, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.2);
      tl.to(q(".s03-mano"), { rotation: 8, svgOrigin: "0 300", smoothOrigin: false, duration: 0.09, yoyo: true, repeat: 1, ease: "sine.inOut" }, PARA2 + 0.25);
      tl.to(q(".s03-mano"), { opacity: 0, y: -80, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, ENVIDO - 0.2);

      gsap.set([q(".s03-envido"), q(".s03-primero")], { opacity: 0 });
      tl.fromTo(q(".s03-envido"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, ENVIDO - 0.08);
      sacudon(ENVIDO + 0.06);
      tl.fromTo(q(".s03-primero"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)", immediateRender: false }, 1.48);

      // "yo atiendo": se va el canto, entra la semana
      tl.to([q(".s03-mano"), q(".s03-envido"), q(".s03-primero")], { opacity: 0, y: "+=80", filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, YO - 0.25);
      const dias = qa(".s03-dia");
      gsap.set(dias, { opacity: 0 });
      tl.fromTo(dias, { opacity: 0, y: -30 }, { opacity: 0.35, y: 0, duration: 0.2, stagger: 0.04, ease: "back.out(2)", immediateRender: false }, YO);
      dias.slice(0, 5).forEach((d, i) => {
        const t = LUNES + i * ((VIERNES + 0.2 - LUNES) / 4);
        tl.to(d, { opacity: 1, duration: 0.05 }, t);
        tl.to(d.querySelector(".s03-on"), { opacity: 1, duration: 0.05 }, t);
        tl.fromTo(d, { scale: 1.3 }, { scale: 1, duration: 0.2, ease: "back.out(3)", immediateRender: false }, t);
      });
      // sábado y domingo: apagados, tiemblan
      tl.to(dias.slice(5), { x: 4, duration: 0.05, yoyo: true, repeat: 7, ease: "none" }, VIERNES + 0.4);

      // nueve y seis de oros
      gsap.set([q(".s03-c9"), q(".s03-c6"), q(".s03-hs")], { opacity: 0 });
      tl.fromTo(q(".s03-c9"), { opacity: 0, y: 260, rotation: -25, svgOrigin: "0 0", smoothOrigin: false }, { opacity: 1, y: 0, rotation: 0, svgOrigin: "0 0", smoothOrigin: false, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, NUEVE - 0.15);
      tl.fromTo(q(".s03-c6"), { opacity: 0, y: 260, rotation: 25, svgOrigin: "0 0", smoothOrigin: false }, { opacity: 1, y: 0, rotation: 0, svgOrigin: "0 0", smoothOrigin: false, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, SEIS - 0.15);
      tl.fromTo(q(".s03-hs"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, SEIS + 0.1);
      tl.to([q(".s03-c9"), q(".s03-c6")], { y: -12, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, SEIS + 0.3);

      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
