  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 73.05;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";

      // ---- lámpara que se balancea (y su luz) ----
      tl.fromTo(q(".am-lampara"), { rotation: -3.5, svgOrigin: "540 -20" }, { rotation: 3.5, svgOrigin: "540 -20", duration: 3.2, yoyo: true, repeat: Math.floor(DUR / 3.2), ease: "sine.inOut" }, 0);
      tl.fromTo(q(".am-cono"), { rotation: -2.2, transformOrigin: "50% 0%" }, { rotation: 2.2, transformOrigin: "50% 0%", duration: 3.2, yoyo: true, repeat: Math.floor(DUR / 3.2), ease: "sine.inOut" }, 0);
      tl.fromTo(q(".am-halo"), { opacity: 0.1 }, { opacity: 0.2, duration: 0.8, yoyo: true, repeat: Math.floor(DUR / 0.8), ease: "sine.inOut" }, 0);

      // ---- humo que sube ----
      [[".am-h1", 0, 9], [".am-h2", 2.5, 11], [".am-h3", 5, 10]].forEach(([s, a, d]) => {
        const n = Math.ceil((DUR - a) / d);
        for (let k = 0; k < n; k++) {
          const t = a + k * d;
          tl.fromTo(q(s), { y: 140, x: 0, opacity: 0 }, { y: -260, x: k % 2 ? 40 : -40, opacity: 1, duration: d * 0.5, ease: "none", immediateRender: k === 0 }, t);
          tl.to(q(s), { y: -660, x: k % 2 ? 70 : -70, opacity: 0, duration: d * 0.5, ease: "none" }, t + d * 0.5);
        }
      });

      // ---- el giro: la luz baja un poco y vuelve ----
      tl.to(q(".am-oscuro"), { opacity: 0.32, duration: 0.5 }, 55.9);
      tl.to(q(".am-oscuro"), { opacity: 0, duration: 0.6 }, 63.0);

      // ---- chapa de quién habla ----
      const T = [0, 4.75, 11.46, 16.99, 21.98, 26.31, 31.02, 36.62, 41.04, 44.8, 52.52, 55.91, DUR];
      root.querySelectorAll(".am-chapa").forEach((el, i) => {
        const a = T[i], b = T[i + 1];
        if (i === 0) tl.fromTo(el, { opacity: 1, x: 0, scale: 1 }, { opacity: 1, scale: 1, duration: 0.01 }, 0);
        else tl.fromTo(el, { opacity: 0, x: -110, scale: 1.25 }, { opacity: 1, x: 0, scale: 1, duration: 0.22, ease: "back.out(2)", immediateRender: false }, a);
        if (b < DUR) tl.to(el, { opacity: 0, x: 60, duration: 0.15, ease: "power2.in" }, b - 0.15);
      });

      // ---- pizarra de tantos ----
      const g = q(".am-palitos");
      const palito = (lado, n, color) => {
        // n = número de palito (0..), en grupos de 5: 4 rayas y la quinta cruzada
        const grupo = Math.floor(n / 5), k = n % 5;
        const x0 = (lado === "n" ? 46 : 436) + grupo * 112, y0 = 96, h = 112;
        const p = document.createElementNS(NS, "path");
        const tw = (n * 7) % 5 - 2;
        if (k < 4) p.setAttribute("d", `M${x0 + 12 + k * 20 + tw * 0.5} ${y0} C ${x0 + 14 + k * 20} ${y0 + 40} ${x0 + 10 + k * 20} ${y0 + 80} ${x0 + 12 + k * 20 - tw * 0.5} ${y0 + h}`);
        else p.setAttribute("d", `M${x0 - 4} ${y0 + h - 16} L ${x0 + 92} ${y0 + 14}`);
        p.setAttribute("fill", "none");
        p.setAttribute("stroke", color);
        p.setAttribute("stroke-width", "8");
        p.setAttribute("stroke-linecap", "round");
        g.appendChild(p);
        return p;
      };
      const dibujar = (p, t, d = 0.18) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power1.out" }, t);
      };
      // aparece al terminar s05 con los 3 del real envido ya hechos
      tl.fromTo(q(".am-pizarra"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, 26.1);
      const ELLOS = [26.15, 26.15, 26.15, 50.95, 51.12, 51.29, 51.46, 53.1, 53.25, 54.7];
      const NOS = [63.05, 63.2, 63.35, 63.5, 63.65, 64.6, 64.75, 64.9, 65.05, 65.2, 66.6];
      ELLOS.forEach((t, n) => dibujar(palito("e", n, "#f3ead6"), t, t < 26.2 ? 0.01 : 0.16));
      NOS.forEach((t, n) => dibujar(palito("n", n, "#5ce611"), t, 0.14));
      [50.95, 53.1, 63.05, 64.6, 66.6].forEach((t) => tl.fromTo(q(".am-pizarra"), { scale: 1.05 }, { scale: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, t));
      // NOS pasa adelante: el título late en verde
      tl.to(q(".am-tit-n"), { color: "#5ce611", scale: 1.25, duration: 0.2, ease: "back.out(3)" }, 66.6);
      tl.to(q(".am-tit-n"), { scale: 1, duration: 0.3 }, 66.9);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
