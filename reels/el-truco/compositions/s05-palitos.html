<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s05-palitos"] .s05-capa { position: absolute; inset: 0; }
    [data-composition-id="s05-palitos"] .s05-escenario { position: absolute; inset: 0; }
    [data-composition-id="s05-palitos"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s05-palitos"] .s05-tiza { position: absolute; font-family: "Lexend", sans-serif; font-weight: 700; color: #f3ead6; opacity: 0.92; white-space: nowrap; text-align: center; }
    [data-composition-id="s05-palitos"] .s05-nos { left: 150px; width: 380px; top: 676px; font-size: 64px; letter-spacing: 0.16em; }
    [data-composition-id="s05-palitos"] .s05-ellos { left: 550px; width: 380px; top: 676px; font-size: 64px; letter-spacing: 0.16em; }
    [data-composition-id="s05-palitos"] .s05-real { left: 550px; width: 380px; top: 1238px; font-size: 44px; color: #f3ead6; }
    [data-composition-id="s05-palitos"] .s05-real span { display: inline-block; }
    [data-composition-id="s05-palitos"] .s05-uh { left: 150px; width: 380px; top: 900px; font-size: 150px; font-weight: 900; transform: rotate(-10deg); }
  </style>
  <div id="root" data-composition-id="s05-palitos" data-width="1080" data-height="1920" data-duration="4.33">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="4.33" data-track-index="0">
      <div class="s05-escenario">
        <div class="s05-pizarra s05-capa">
          <svg viewBox="0 0 1080 1920" aria-hidden="true">
            <rect x="110" y="600" width="860" height="740" rx="24" fill="#0b1712" stroke="#7a4a26" stroke-width="26" />
            <rect x="110" y="600" width="860" height="740" rx="24" fill="none" stroke="#3a2416" stroke-width="5" />
            <path d="M180 1260 C340 1240 480 1270 620 1250 M700 1180 C780 1196 860 1170 920 1190" stroke="#f3ead6" stroke-opacity="0.06" stroke-width="30" stroke-linecap="round" fill="none" />
            <path class="s05-linea" d="M540 650 C544 860 536 1060 540 1300" stroke="#f3ead6" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round" fill="none" />
            <path class="s05-linea" d="M170 780 C400 774 700 786 910 778" stroke="#f3ead6" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round" fill="none" />
            <g fill="none" stroke="#f3ead6" stroke-width="16" stroke-linecap="round">
              <path class="s05-pal" d="M630 860 C634 940 626 1040 632 1140" />
              <path class="s05-pal" d="M700 856 C704 950 698 1040 702 1144" />
              <path class="s05-pal" d="M770 862 C772 950 766 1040 772 1138" />
            </g>
            <!-- la tiza -->
            <g class="s05-mano"><g transform="rotate(-30)">
              <rect x="-12" y="-60" width="24" height="70" rx="6" fill="#f3ead6" stroke="#3a2416" stroke-width="4" />
            </g></g>
          </svg>
          <div class="s05-tiza s05-nos">NOS</div>
          <div class="s05-tiza s05-ellos">ELLOS</div>
          <div class="s05-tiza s05-real"><span>R</span><span>E</span><span>A</span><span>L</span> <span>E</span><span>N</span><span>V</span><span>I</span><span>D</span><span>O</span></div>
          <div class="s05-tiza s05-uh">¡UH!</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-palitos";
      const DUR = 4.33;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const dibujar = (el, t, d = 0.5) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.01 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const REAL = 0.83, ANDA = 2.3, PALITOS = [2.52, 2.77, 2.96];

      // cuadro 0: la pizarra ya entrando
      tl.fromTo(q(".s05-pizarra"), { opacity: 0.6, scale: 0.9, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, 0);
      qa(".s05-linea").forEach((l, i) => dibujar(l, 0.05 + i * 0.15, 0.35));
      gsap.set([q(".s05-nos"), q(".s05-ellos")], { opacity: 0 });
      tl.fromTo([q(".s05-nos"), q(".s05-ellos")], { opacity: 0, y: 10 }, { opacity: 0.92, y: 0, duration: 0.25, stagger: 0.12, immediateRender: false }, 0.15);
      tl.fromTo(q(".s05-uh"), { opacity: 0, scale: 1.6 }, { opacity: 0.92, scale: 1, duration: 0.18, ease: "power4.in" }, 0.02);
      tl.to(q(".s05-uh"), { rotation: -14, duration: 0.15, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.25);
      tl.to(q(".s05-uh"), { opacity: 0, scale: 0.8, duration: 0.25 }, ANDA - 0.3);

      // "real envido" escrito con tiza en ELLOS, letra por letra
      const letras = qa(".s05-real span");
      gsap.set(letras, { opacity: 0 });
      tl.fromTo(letras, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.06, stagger: 0.045, immediateRender: false }, REAL);

      // la tiza va y dibuja los tres palitos
      const m = q(".s05-mano");
      gsap.set(m, { x: 980, y: 1380, opacity: 0 });
      tl.to(m, { opacity: 1, x: 640, y: 860, duration: 0.25, ease: "power2.out" }, ANDA - 0.05);
      const pal = qa(".s05-pal");
      const xs = [630, 700, 770];
      PALITOS.forEach((t, i) => {
        tl.set(m, { x: xs[i], y: 860 }, t - 0.02);
        dibujar(pal[i], t, 0.17);
        tl.to(m, { y: 1140, duration: 0.17, ease: "power2.inOut" }, t);
      });
      tl.to(m, { x: 1000, y: 1400, opacity: 0, duration: 0.3, ease: "power2.in" }, PALITOS[2] + 0.35);
      tl.fromTo(pal, { scale: 1 }, { scale: 1.04, svgOrigin: "700 1000", smoothOrigin: false, duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, PALITOS[2] + 0.2);

      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
