<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-retruco"] .s06-capa { position: absolute; inset: 0; }
    [data-composition-id="s06-retruco"] .s06-escenario { position: absolute; inset: 0; }
    [data-composition-id="s06-retruco"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-retruco"] .s06-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; text-transform: uppercase; line-height: 1; white-space: nowrap; letter-spacing: -0.02em; }
    [data-composition-id="s06-retruco"] .s06-quiero { top: 660px; font-size: 140px; color: #f2b632; text-shadow: 9px 9px 0 #3a2416; transform: rotate(-6deg); }
    [data-composition-id="s06-retruco"] .s06-retruco { top: 820px; font-size: 170px; color: #f2b632; text-shadow: 10px 10px 0 #3a2416, -3px -3px 0 #f3ead6; transform: rotate(-6deg); }
    [data-composition-id="s06-retruco"] .s06-cel { position: absolute; left: 400px; top: 640px; width: 380px; height: 700px; }
    [data-composition-id="s06-retruco"] .s06-head { position: absolute; left: 0; right: 0; top: 64px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 600; font-size: 30px; color: #f3ead6; opacity: 0.8; }
    [data-composition-id="s06-retruco"] .s06-bub { position: absolute; padding: 16px 22px; border-radius: 22px; font-family: "Lexend", sans-serif; font-weight: 600; font-size: 34px; line-height: 1.15; white-space: nowrap; }
    [data-composition-id="s06-retruco"] .s06-b1 { left: 30px; top: 170px; background: #f3ead6; color: #05170f; border-bottom-left-radius: 6px; }
    [data-composition-id="s06-retruco"] .s06-b2 { right: 30px; top: 290px; background: #f2b632; color: #05170f; border-bottom-right-radius: 6px; }
    [data-composition-id="s06-retruco"] .s06-sys { position: absolute; left: 20px; right: 20px; top: 430px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; line-height: 1.3; color: #ff5a43; }
    [data-composition-id="s06-retruco"] .s06-mala { position: absolute; left: 92px; top: 1290px; width: 300px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.14em; color: #f3ead6; }
  </style>
  <div id="root" data-composition-id="s06-retruco" data-width="1080" data-height="1920" data-duration="4.71">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="4.71" data-track-index="0">
      <div class="s06-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- el 4 de copas: la peor carta -->
          <g transform="translate(240 1110)"><g class="s06-c4"><g class="s06-c4i" transform="rotate(-12)"></g></g></g>
        </svg>
        <div class="s06-cel">
          <svg viewBox="0 0 380 700" style="width:380px;height:700px" aria-hidden="true">
            <rect x="4" y="4" width="372" height="692" rx="52" fill="#05170f" fill-opacity="0.75" stroke="#f3ead6" stroke-width="6" />
            <rect x="140" y="26" width="100" height="12" rx="6" fill="#f3ead6" opacity="0.6" />
            <path d="M30 120 H350" stroke="#f3ead6" stroke-opacity="0.3" stroke-width="3" />
          </svg>
          <div class="s06-head">Cliente</div>
          <div class="s06-bub s06-b1">¿Precio?</div>
          <div class="s06-bub s06-b2">Pasá el lunes</div>
          <div class="s06-sys">Comprando en<br />otro local...</div>
        </div>
        <div class="s06-txt s06-quiero">Quiero</div>
        <div class="s06-txt s06-retruco">retruco</div>
        <div class="s06-mala">MALA CARTA</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-retruco";
      const DUR = 4.71;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      // <naipes> (lo inyecta partes/inyectar.mjs: no editar a mano en las escenas)
      const NAI = { crema: "#f3ead6", madera: "#7a4a26", oscuro: "#3a2416", rojo: "#e5392b", oro: "#f2b632", pano: "#0a3a25", verde: "#5ce611" };
      const COLOR_PALO = { espada: NAI.rojo, copa: NAI.rojo, oro: NAI.oro, basto: NAI.madera };
      // dibujo del palo en una caja de 100x100 centrada en 0,0
      const palo = (p, c = COLOR_PALO[p]) => ({
        espada: `<path d="M0 -50 L9 -36 L9 20 L-9 20 L-9 -36 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 -36 V14" stroke="${NAI.crema}" stroke-width="3" stroke-linecap="round" opacity="0.7"/><path d="M-28 24 H28" stroke="${NAI.oscuro}" stroke-width="10" stroke-linecap="round"/><path d="M-28 24 H28" stroke="${NAI.oro}" stroke-width="5" stroke-linecap="round"/><path d="M0 28 V44" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><circle cx="0" cy="50" r="7" fill="${NAI.oro}" stroke="${NAI.oscuro}" stroke-width="3"/>`,
        basto: `<path d="M-9 50 C-13 22 -18 -12 -16 -38 C-14 -54 14 -54 16 -38 C18 -12 13 22 9 50 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><circle cx="-10" cy="-18" r="5" fill="${NAI.oscuro}"/><circle cx="9" cy="2" r="5" fill="${NAI.oscuro}"/><circle cx="-6" cy="24" r="4" fill="${NAI.oscuro}"/>`,
        copa: `<path d="M-30 -40 H30 C30 -8 16 8 0 10 C-16 8 -30 -8 -30 -40 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 10 V36" stroke="${NAI.oscuro}" stroke-width="8" stroke-linecap="round"/><path d="M-22 42 H22" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><path d="M-20 -30 H20" stroke="${NAI.oro}" stroke-width="4" stroke-linecap="round"/>`,
        oro: `<circle r="38" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4"/><circle r="22" fill="none" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="8" fill="${NAI.oscuro}"/>`,
      })[p];
      // carta de frente centrada en 0,0 (alto = 1.5 ancho)
      const carta = (num, p, w = 220, c = COLOR_PALO[p]) => {
        const h = w * 1.5, s = w / 200;
        return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 12 * s}" y="${-h / 2 + 12 * s}" width="${w - 24 * s}" height="${h - 24 * s}" rx="${10 * s}" fill="none" stroke="${c}" stroke-width="3" opacity="0.55"/>` +
          `<text x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<text transform="rotate(180)" x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<g transform="scale(${1.15 * s})">${palo(p, c)}</g>`;
      };
      // dorso de carta centrado en 0,0
      const dorso = (w = 220) => {
        const h = w * 1.5, s = w / 200;
        let r = "";
        for (let k = -4; k <= 4; k++) r += `<path d="M${k * 40 * s - h / 2} ${-h / 2} L ${k * 40 * s + h / 2} ${h / 2} M${k * 40 * s + h / 2} ${-h / 2} L ${k * 40 * s - h / 2} ${h / 2}"/>`;
        const id = "cl" + Math.round(w) + "_" + (dorso.n = (dorso.n || 0) + 1);
        return `<defs><clipPath id="${id}"><rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}"/></clipPath></defs>` +
          `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}" fill="${NAI.rojo}"/>` +
          `<g clip-path="url(#${id})" stroke="${NAI.crema}" stroke-width="${4 * s}" opacity="0.55">${r}</g>` +
          `<circle r="${26 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="${12 * s}" fill="${NAI.rojo}"/>`;
      };
      const pinta = (sel, html) => { for (const el of root.querySelectorAll(sel)) el.innerHTML = html; };
      // </naipes>
      pinta(".s06-c4i", carta("4", "copa", 220));

      const sacudon = (t, f = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s06-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const pop = (sel, t, from = 0.6) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const RETRUCO = 0.19, AL = 1.45, PRECIO = 2.32, PASA = 3.06, LUNES = 3.52;

      // cuadro 0: "QUIERO" ya cae
      tl.fromTo(q(".s06-quiero"), { opacity: 0.6, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power4.in" }, 0);
      gsap.set(q(".s06-retruco"), { opacity: 0 });
      tl.fromTo(q(".s06-retruco"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, RETRUCO);
      sacudon(RETRUCO + 0.14, 1.2);
      tl.to([q(".s06-quiero"), q(".s06-retruco")], { rotation: -3, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.45);
      tl.to([q(".s06-quiero"), q(".s06-retruco")], { y: -120, opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, AL - 0.15);

      // el celular del dueño
      gsap.set(q(".s06-cel"), { opacity: 0 });
      tl.fromTo(q(".s06-cel"), { opacity: 1, y: 900 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.2)", immediateRender: false }, AL);
      pop(".s06-b1", PRECIO - 0.05, 0.5);
      tl.to(q(".s06-b1"), { x: 6, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, PRECIO + 0.3);
      pop(".s06-b2", PASA, 0.5);
      gsap.set(q(".s06-sys"), { opacity: 0 });
      tl.fromTo(q(".s06-sys"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, LUNES + 0.35);
      tl.to(q(".s06-b1"), { opacity: 0.35, duration: 0.3 }, LUNES + 0.35);

      // el 4 de copas cae solo: mala carta
      gsap.set([q(".s06-c4"), q(".s06-mala")], { opacity: 0 });
      tl.fromTo(q(".s06-c4"), { opacity: 1, y: -500, rotation: -30, svgOrigin: "0 0", smoothOrigin: false }, { opacity: 1, y: 0, rotation: 0, svgOrigin: "0 0", smoothOrigin: false, duration: 0.3, ease: "bounce.out", immediateRender: false }, LUNES - 0.2);
      tl.fromTo(q(".s06-mala"), { opacity: 0 }, { opacity: 0.9, duration: 0.2, immediateRender: false }, LUNES + 0.2);

      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
