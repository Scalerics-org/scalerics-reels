<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-truco"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-truco"] .s01-escenario { position: absolute; inset: 0; }
    [data-composition-id="s01-truco"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-truco"] .s01-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; text-transform: uppercase; line-height: 1; white-space: nowrap; letter-spacing: -0.02em; }
    [data-composition-id="s01-truco"] .s01-truco { top: 560px; font-size: 220px; color: #ff5a43; text-shadow: 10px 10px 0 #05170f, -3px -3px 0 #f3ead6; transform: rotate(-6deg); }
    [data-composition-id="s01-truco"] .s01-placa { position: absolute; left: 50%; padding: 14px 28px 12px; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 52px; line-height: 1; text-transform: uppercase; white-space: nowrap; transform: translateX(-50%) rotate(-3deg); }
    [data-composition-id="s01-truco"] .s01-sota-p { top: 1236px; background: #f3ead6; color: #05170f; box-shadow: 8px 8px 0 #e5392b; }
    [data-composition-id="s01-truco"] .s01-cli-p { top: 1270px; background: #f2b632; color: #05170f; box-shadow: 8px 8px 0 #3a2416; }
  </style>
  <div id="root" data-composition-id="s01-truco" data-width="1080" data-height="1920" data-duration="4.76">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="4.76" data-track-index="0">
      <div class="s01-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- la sota que se hace la distraída -->
          <g transform="translate(320 1020)">
            <g class="s01-sota">
              <g class="s01-sota-carta" transform="rotate(-7)"></g>
              <g transform="rotate(-7)">
                <!-- paje genérico: boina, cara, ojos al costado, boca de silbido -->
                <path d="M-62 -40 C-60 -96 60 -96 62 -40 Z" fill="#7a4a26" stroke="#3a2416" stroke-width="5" stroke-linejoin="round" />
                <circle cx="44" cy="-90" r="10" fill="#e5392b" stroke="#3a2416" stroke-width="4" />
                <circle cx="0" cy="0" r="54" fill="#f3ead6" stroke="#3a2416" stroke-width="5" />
                <g class="s01-ojos"><circle cx="-6" cy="-10" r="7" fill="#3a2416" /><circle cx="30" cy="-10" r="7" fill="#3a2416" /></g>
                <circle class="s01-silbo" cx="22" cy="24" r="8" fill="none" stroke="#3a2416" stroke-width="5" />
                <path d="M-70 120 C-60 70 60 70 70 120" fill="#7a4a26" stroke="#3a2416" stroke-width="5" />
              </g>
              <!-- notas del silbido -->
              <g fill="#f3ead6" stroke="#f3ead6" stroke-width="5" stroke-linecap="round">
                <g transform="translate(110 -40)"><g class="s01-nota"><circle r="10" /><path d="M9 0 V-40 L22 -32" fill="none" /></g></g>
                <g transform="translate(150 -110)"><g class="s01-nota"><circle r="10" /><path d="M9 0 V-40 L22 -32" fill="none" /></g></g>
                <g transform="translate(196 -60)"><g class="s01-nota"><circle r="10" /><path d="M9 0 V-40 L22 -32" fill="none" /></g></g>
              </g>
            </g>
          </g>
          <!-- fichas: los clientes del dueño -->
          <g class="s01-fichas">
            <g transform="translate(300 1330) scale(1.2)"><g class="s01-ficha"><circle r="36" fill="#f3ead6" stroke="#3a2416" stroke-width="5" /><circle cy="-8" r="12" fill="#7a4a26" /><path d="M-19 22 C-19 6 19 6 19 22 Z" fill="#7a4a26" /></g></g>
            <g transform="translate(420 1380) scale(1.2)"><g class="s01-ficha"><circle r="36" fill="#f3ead6" stroke="#3a2416" stroke-width="5" /><circle cy="-8" r="12" fill="#7a4a26" /><path d="M-19 22 C-19 6 19 6 19 22 Z" fill="#7a4a26" /></g></g>
            <g transform="translate(540 1340) scale(1.2)"><g class="s01-ficha"><circle r="36" fill="#f3ead6" stroke="#3a2416" stroke-width="5" /><circle cy="-8" r="12" fill="#7a4a26" /><path d="M-19 22 C-19 6 19 6 19 22 Z" fill="#7a4a26" /></g></g>
            <g transform="translate(660 1385) scale(1.2)"><g class="s01-ficha"><circle r="36" fill="#f3ead6" stroke="#3a2416" stroke-width="5" /><circle cy="-8" r="12" fill="#7a4a26" /><path d="M-19 22 C-19 6 19 6 19 22 Z" fill="#7a4a26" /></g></g>
            <g transform="translate(780 1335) scale(1.2)"><g class="s01-ficha"><circle r="36" fill="#f3ead6" stroke="#3a2416" stroke-width="5" /><circle cy="-8" r="12" fill="#7a4a26" /><path d="M-19 22 C-19 6 19 6 19 22 Z" fill="#7a4a26" /></g></g>
          </g>
          <!-- la carta del de enfrente y su mano -->
          <g transform="translate(560 1010)">
            <g class="s01-golpe">
              <g class="s01-dorso" transform="rotate(-8)"></g>
              <g class="s01-mano">
                <path d="M-40 -70 L260 -380 L380 -270 L70 40 Z" fill="#e5392b" stroke="#3a2416" stroke-width="6" stroke-linejoin="round" />
                <path d="M-40 -70 L70 40" stroke="#f3ead6" stroke-width="16" stroke-linecap="round" />
                <path d="M-40 -70 L70 40" stroke="#3a2416" stroke-width="4" stroke-linecap="round" opacity="0.5" />
                <g transform="rotate(-45)">
                  <ellipse cx="0" cy="68" rx="70" ry="58" fill="#f3ead6" stroke="#3a2416" stroke-width="5" />
                  <path d="M-46 100 V150 M-16 110 V168 M14 110 V166 M42 100 V146" stroke="#3a2416" stroke-width="30" stroke-linecap="round" />
                  <path d="M-46 100 V150 M-16 110 V168 M14 110 V166 M42 100 V146" stroke="#f3ead6" stroke-width="20" stroke-linecap="round" />
                  <path d="M-70 60 C-96 70 -104 96 -92 110" stroke="#3a2416" stroke-width="30" stroke-linecap="round" fill="none" />
                  <path d="M-70 60 C-96 70 -104 96 -92 110" stroke="#f3ead6" stroke-width="20" stroke-linecap="round" fill="none" />
                </g>
              </g>
            </g>
          </g>
        </svg>
        <div class="s01-txt s01-truco">¡Truco!</div>
        <div class="s01-placa s01-sota-p">No te hagas el sota</div>
        <div class="s01-placa s01-cli-p">Tus clientes</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-truco";
      const DUR = 4.76;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // <naipes> (lo inyecta partes/inyectar.mjs: no editar a mano en las escenas)
      const NAI = { crema: "#f3ead6", madera: "#7a4a26", oscuro: "#3a2416", rojo: "#e5392b", oro: "#f2b632", pano: "#0a3a25", verde: "#5ce611" };
      const COLOR_PALO = { espada: NAI.rojo, copa: NAI.rojo, oro: NAI.oro, basto: NAI.madera };
      // dibujo del palo en una caja de 100x100 centrada en 0,0
      const palo = (p, c = COLOR_PALO[p]) => ({
        espada: `<path d="M0 -50 L9 -36 L9 20 L-9 20 L-9 -36 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 -36 V14" stroke="${NAI.crema}" stroke-width="3" stroke-linecap="round" opacity="0.7"/><path d="M-28 24 H28" stroke="${NAI.oscuro}" stroke-width="10" stroke-linecap="round"/><path d="M-28 24 H28" stroke="${NAI.oro}" stroke-width="5" stroke-linecap="round"/><path d="M0 28 V44" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><circle cx="0" cy="50" r="7" fill="${NAI.oro}" stroke="${NAI.oscuro}" stroke-width="3"/>`,
        basto: `<path d="M-9 50 C-13 22 -18 -12 -16 -38 C-14 -54 14 -54 16 -38 C18 -12 13 22 9 50 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><circle cx="-10" cy="-18" r="5" fill="${NAI.oscuro}"/><circle cx="9" cy="2" r="5" fill="${NAI.oscuro}"/><circle cx="-6" cy="24" r="4" fill="${NAI.oscuro}"/>`,
        copa: `<path d="M-30 -40 H30 C30 -8 16 8 0 10 C-16 8 -30 -8 -30 -40 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 10 V36" stroke="${NAI.oscuro}" stroke-width="8" stroke-linecap="round"/><path d="M-22 42 H22" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><path d="M-20 -30 H20" stroke="${NAI.oro}" stroke-width="4" stroke-linecap="round"/>`,
        oro: `<circle r="38" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4"/><circle r="22" fill="none" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="8" fill="${NAI.oscuro}"/>`,
      })[p];
      // carta de frente centrada en 0,0 (alto = 1.5 ancho)
      const carta = (num, p, w = 220, c = COLOR_PALO[p]) => {
        const h = w * 1.5, s = w / 200;
        return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 12 * s}" y="${-h / 2 + 12 * s}" width="${w - 24 * s}" height="${h - 24 * s}" rx="${10 * s}" fill="none" stroke="${c}" stroke-width="3" opacity="0.55"/>` +
          `<text x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<text transform="rotate(180)" x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<g transform="scale(${1.15 * s})">${palo(p, c)}</g>`;
      };
      // dorso de carta centrado en 0,0
      const dorso = (w = 220) => {
        const h = w * 1.5, s = w / 200;
        let r = "";
        for (let k = -4; k <= 4; k++) r += `<path d="M${k * 40 * s - h / 2} ${-h / 2} L ${k * 40 * s + h / 2} ${h / 2} M${k * 40 * s + h / 2} ${-h / 2} L ${k * 40 * s - h / 2} ${h / 2}"/>`;
        const id = "cl" + Math.round(w) + "_" + (dorso.n = (dorso.n || 0) + 1);
        return `<defs><clipPath id="${id}"><rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}"/></clipPath></defs>` +
          `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}" fill="${NAI.rojo}"/>` +
          `<g clip-path="url(#${id})" stroke="${NAI.crema}" stroke-width="${4 * s}" opacity="0.55">${r}</g>` +
          `<circle r="${26 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="${12 * s}" fill="${NAI.rojo}"/>`;
      };
      const pinta = (sel, html) => { for (const el of root.querySelectorAll(sel)) el.innerHTML = html; };
      // </naipes>
      pinta(".s01-dorso", dorso(250));
      pinta(".s01-sota-carta", carta("10", "basto", 260));
      // la sota no muestra el basto: la tapa el paje
      q(".s01-sota-carta g:last-child").setAttribute("opacity", "0");

      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const pop = (sel, t, from = 0.6) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const SOTA = 1.48, CLIENTES = 2.31, CONMIGO = 3.61;

      // cuadro 0: la mano ya baja y "¡TRUCO!" ya cae
      tl.fromTo(q(".s01-golpe"), { x: 160, y: -160, scale: 1.2, opacity: 0.85 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.14, ease: "power4.in" }, 0);
      tl.fromTo(q(".s01-truco"), { opacity: 0.55, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in" }, 0);
      sacudon(0.15, 1.3);
      tl.to(q(".s01-truco"), { rotation: -4, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.35);
      tl.to(q(".s01-mano"), { x: 18, y: -18, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.5);

      // "sota": el truco sube y se va, la carta roja se corre, entra la sota distraída
      tl.to(q(".s01-truco"), { y: -60, opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, SOTA - 0.3);
      tl.to(q(".s01-golpe"), { x: 200, y: -20, rotation: 6, scale: 0.86, duration: 0.35, ease: "power3.out" }, SOTA - 0.35);
      gsap.set(q(".s01-sota"), { opacity: 0 });
      tl.fromTo(q(".s01-sota"), { opacity: 0, x: -360, rotation: -20, svgOrigin: "0 0", smoothOrigin: false }, { opacity: 1, x: 0, rotation: 0, svgOrigin: "0 0", smoothOrigin: false, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, SOTA - 0.25);
      tl.to(q(".s01-sota"), { rotation: 5, svgOrigin: "0 0", smoothOrigin: false, duration: 0.25, yoyo: true, repeat: 2, ease: "sine.inOut" }, SOTA + 0.05);
      tl.fromTo(q(".s01-ojos"), { x: 0 }, { x: 10, duration: 0.15, yoyo: true, repeat: 3, ease: "steps(1)" }, SOTA);
      qa(".s01-nota").forEach((n, i) => {
        gsap.set(n, { opacity: 0 });
        tl.fromTo(n, { opacity: 0, y: 20, scale: 0.5 }, { opacity: 1, y: -30, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, SOTA + 0.08 + i * 0.16);
      });
      pop(".s01-sota-p", SOTA + 0.05, 1.6);

      // "clientes": la sota se va, las fichas cruzan la mesa hacia la carta roja
      tl.to([q(".s01-sota"), q(".s01-sota-p")], { x: -260, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, CLIENTES - 0.22);
      tl.to(q(".s01-golpe"), { x: -20, y: -260, rotation: 0, scale: 0.8, duration: 0.4, ease: "power3.inOut" }, CLIENTES - 0.2);
      const desde = [[300, 1330], [420, 1380], [540, 1340], [660, 1385], [780, 1335]];
      const destino = [[400, 950], [480, 1020], [560, 940], [640, 1020], [720, 950]].map(([x, y], i) => [(x - desde[i][0]) / 1.2, (y - desde[i][1]) / 1.2]);
      qa(".s01-ficha").forEach((f, i) => {
        gsap.set(f, { opacity: 0 });
        tl.fromTo(f, { opacity: 0, y: 180 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, CLIENTES - 0.05 + i * 0.06);
        tl.to(f, { x: destino[i][0], y: destino[i][1], duration: 0.9, ease: "power2.inOut" }, CLIENTES + 0.35 + i * 0.07);
      });
      pop(".s01-cli-p", CLIENTES, 1.5);

      // "conmigo": la mano les hace "vengan" y las fichas saltan
      tl.to(q(".s01-mano"), { rotation: -10, svgOrigin: "0 0", smoothOrigin: false, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" }, CONMIGO - 0.1);
      qa(".s01-ficha").forEach((f, i) => tl.to(f, { y: "-=26", duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, CONMIGO + i * 0.05));
      tl.to(q(".s01-cli-p"), { opacity: 0, y: 40, duration: 0.2 }, CONMIGO + 0.4);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
