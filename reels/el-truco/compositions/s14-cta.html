<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s14-cta"] .s14-capa { position: absolute; inset: 0; }
    [data-composition-id="s14-cta"] .s14-escenario { position: absolute; inset: 0; }
    [data-composition-id="s14-cta"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s14-cta"] .s14-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; text-transform: uppercase; line-height: 1; white-space: nowrap; transform: rotate(-5deg); }
    [data-composition-id="s14-cta"] .s14-manda { top: 590px; font-size: 132px; color: #f3ead6; text-shadow: 9px 9px 0 #5ce611; letter-spacing: -0.02em; }
    [data-composition-id="s14-cta"] .s14-al { top: 760px; font-size: 54px; color: #f3ead6; text-shadow: 4px 4px 0 #05170f; }
    [data-composition-id="s14-cta"] .s14-mazo { top: 1310px; font-size: 64px; color: #05170f; }
    [data-composition-id="s14-cta"] .s14-mazo span { display: inline-block; background: #5ce611; padding: 12px 28px 10px; box-shadow: 7px 7px 0 #05170f; }
  </style>
  <div id="root" data-composition-id="s14-cta" data-width="1080" data-height="1920" data-duration="5.46">
    <div id="s14-escena" class="s14-capa clip" data-start="0" data-duration="5.46" data-track-index="0">
      <div class="s14-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- el mazo -->
          <g transform="translate(470 1080)"><g class="s14-mazo-g">
            <g transform="translate(14 14) rotate(7)" class="s14-dm"></g>
            <g transform="translate(7 7) rotate(2)" class="s14-dm"></g>
            <g transform="rotate(-4)" class="s14-dm"></g>
          </g></g>
          <!-- el avioncito que sale volando del mazo -->
          <path class="s14-estela" d="M520 1030 C620 960 700 1000 760 940 C810 890 820 860 850 840" fill="none" stroke="#5ce611" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 18" />
          <g transform="translate(860 830)"><g class="s14-avion">
            <path d="M-60 20 L70 -50 L20 60 L0 22 Z" fill="#05170f" stroke="#5ce611" stroke-width="7" stroke-linejoin="round" />
            <path d="M0 22 L70 -50" stroke="#5ce611" stroke-width="6" stroke-linecap="round" />
          </g></g>
        </svg>
        <div class="s14-txt s14-manda">Mandáselo</div>
        <div class="s14-txt s14-al">al que siempre</div>
        <div class="s14-txt s14-mazo"><span>se va al mazo</span></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s14-cta";
      const DUR = 5.46;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      // <naipes> (lo inyecta partes/inyectar.mjs: no editar a mano en las escenas)
      const NAI = { crema: "#f3ead6", madera: "#7a4a26", oscuro: "#3a2416", rojo: "#e5392b", oro: "#f2b632", pano: "#0a3a25", verde: "#5ce611" };
      const COLOR_PALO = { espada: NAI.rojo, copa: NAI.rojo, oro: NAI.oro, basto: NAI.madera };
      // dibujo del palo en una caja de 100x100 centrada en 0,0
      const palo = (p, c = COLOR_PALO[p]) => ({
        espada: `<path d="M0 -50 L9 -36 L9 20 L-9 20 L-9 -36 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 -36 V14" stroke="${NAI.crema}" stroke-width="3" stroke-linecap="round" opacity="0.7"/><path d="M-28 24 H28" stroke="${NAI.oscuro}" stroke-width="10" stroke-linecap="round"/><path d="M-28 24 H28" stroke="${NAI.oro}" stroke-width="5" stroke-linecap="round"/><path d="M0 28 V44" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><circle cx="0" cy="50" r="7" fill="${NAI.oro}" stroke="${NAI.oscuro}" stroke-width="3"/>`,
        basto: `<path d="M-9 50 C-13 22 -18 -12 -16 -38 C-14 -54 14 -54 16 -38 C18 -12 13 22 9 50 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><circle cx="-10" cy="-18" r="5" fill="${NAI.oscuro}"/><circle cx="9" cy="2" r="5" fill="${NAI.oscuro}"/><circle cx="-6" cy="24" r="4" fill="${NAI.oscuro}"/>`,
        copa: `<path d="M-30 -40 H30 C30 -8 16 8 0 10 C-16 8 -30 -8 -30 -40 Z" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4" stroke-linejoin="round"/><path d="M0 10 V36" stroke="${NAI.oscuro}" stroke-width="8" stroke-linecap="round"/><path d="M-22 42 H22" stroke="${NAI.oscuro}" stroke-width="9" stroke-linecap="round"/><path d="M-20 -30 H20" stroke="${NAI.oro}" stroke-width="4" stroke-linecap="round"/>`,
        oro: `<circle r="38" fill="${c}" stroke="${NAI.oscuro}" stroke-width="4"/><circle r="22" fill="none" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="8" fill="${NAI.oscuro}"/>`,
      })[p];
      // carta de frente centrada en 0,0 (alto = 1.5 ancho)
      const carta = (num, p, w = 220, c = COLOR_PALO[p]) => {
        const h = w * 1.5, s = w / 200;
        return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 12 * s}" y="${-h / 2 + 12 * s}" width="${w - 24 * s}" height="${h - 24 * s}" rx="${10 * s}" fill="none" stroke="${c}" stroke-width="3" opacity="0.55"/>` +
          `<text x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<text transform="rotate(180)" x="${-w / 2 + 22 * s}" y="${-h / 2 + 62 * s}" font-family="Lexend" font-weight="800" font-size="${50 * s}" fill="${c}">${num}</text>` +
          `<g transform="scale(${1.15 * s})">${palo(p, c)}</g>`;
      };
      // dorso de carta centrado en 0,0
      const dorso = (w = 220) => {
        const h = w * 1.5, s = w / 200;
        let r = "";
        for (let k = -4; k <= 4; k++) r += `<path d="M${k * 40 * s - h / 2} ${-h / 2} L ${k * 40 * s + h / 2} ${h / 2} M${k * 40 * s + h / 2} ${-h / 2} L ${k * 40 * s - h / 2} ${h / 2}"/>`;
        const id = "cl" + Math.round(w) + "_" + (dorso.n = (dorso.n || 0) + 1);
        return `<defs><clipPath id="${id}"><rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}"/></clipPath></defs>` +
          `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${18 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="5"/>` +
          `<rect x="${-w / 2 + 16 * s}" y="${-h / 2 + 16 * s}" width="${w - 32 * s}" height="${h - 32 * s}" rx="${8 * s}" fill="${NAI.rojo}"/>` +
          `<g clip-path="url(#${id})" stroke="${NAI.crema}" stroke-width="${4 * s}" opacity="0.55">${r}</g>` +
          `<circle r="${26 * s}" fill="${NAI.crema}" stroke="${NAI.oscuro}" stroke-width="3"/><circle r="${12 * s}" fill="${NAI.rojo}"/>`;
      };
      const pinta = (sel, html) => { for (const el of root.querySelectorAll(sel)) el.innerHTML = html; };
      // </naipes>
      pinta(".s14-dm", dorso(200));

      const sacudon = (t, f = 1) => [[-12, 7], [9, -5], [-4, 2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s14-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const AL = 0.53, SIEMPRE = 1.01, MAZO = 1.78;

      // cuadro 0: "MANDÁSELO" ya cae y el mazo ya está
      tl.fromTo(q(".s14-manda"), { opacity: 0.6, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in" }, 0);
      sacudon(0.15);
      tl.fromTo(q(".s14-mazo-g"), { opacity: 0.6, y: 160 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.5)" }, 0);
      gsap.set(q(".s14-al"), { opacity: 0 });
      tl.fromTo(q(".s14-al"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, AL);
      gsap.set(q(".s14-mazo"), { opacity: 0 });
      tl.fromTo(q(".s14-mazo"), { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in", immediateRender: false }, MAZO - 0.1);
      sacudon(MAZO + 0.08, 0.8);

      // el avioncito sale del mazo
      const est = q(".s14-estela");
      gsap.set(est, { opacity: 0 });
      gsap.set(q(".s14-avion"), { opacity: 0 });
      tl.fromTo(q(".s14-avion"), { opacity: 1, x: -340, y: 200, scale: 0.4, svgOrigin: "0 0", smoothOrigin: false }, { opacity: 1, x: 0, y: 0, scale: 1, svgOrigin: "0 0", smoothOrigin: false, duration: 0.6, ease: "power2.out", immediateRender: false }, SIEMPRE);
      tl.to(est, { opacity: 1, duration: 0.4 }, SIEMPRE + 0.15);
      // queda flotando
      tl.to(q(".s14-avion"), { y: -14, duration: 0.6, yoyo: true, repeat: 5, ease: "sine.inOut" }, SIEMPRE + 0.6);
      tl.to(q(".s14-mazo"), { scale: 1.05, duration: 0.5, yoyo: true, repeat: 5, ease: "sine.inOut" }, MAZO + 0.3);
      tl.to(q(".s14-mazo-g"), { rotation: 2, svgOrigin: "0 0", smoothOrigin: false, duration: 0.7, yoyo: true, repeat: 4, ease: "sine.inOut" }, 0.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
