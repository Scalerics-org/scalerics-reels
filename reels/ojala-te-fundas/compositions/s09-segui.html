    (function () {
      const ID = "s09-segui";
      const DUR = 7.16;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const SEGUI = 0.46;
      const ASI = 0.78;
      const POR = 1.78;
      const FAVOR = 2.08;
      const NO = 3.24;
      const CAMBIES = 3.54;
      const NADA = 4.1;
      const ESTATICA = 6.8;
      const temblor = (t, f) => [[-18 * f, 10 * f], [14 * f, -8 * f], [-7 * f, 4 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s09-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const mons = qa(".s09-mon");
      gsap.set([q(".s09-segui"), q(".s09-porfavor"), q(".s09-nocambies"), q(".s09-nada"), q(".s09-mira")], { opacity: 0 });
      gsap.set(qa(".s09-sello"), { opacity: 0, rotation: -10 });
      gsap.set(qa(".s09-trazo"), { strokeDasharray: 1, strokeDashoffset: 1, opacity: 0 });

      // cuadro 0: la pared prendida, el sillón de espaldas; la copa sube
      mons.forEach((m, i) => tl.fromTo(m, { opacity: 0.35 }, { opacity: 1, duration: 0.06, ease: "steps(2)" }, (i * 0.05) % 0.3));
      tl.fromTo(q(".s09-pared"), { scale: 1.06 }, { scale: 1, duration: 1.6, ease: "power2.out" }, 0);
      tl.fromTo(q(".s09-sillon"), { y: 40 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(q(".s09-copa"), { y: 170, rotation: 0 }, { y: 0, duration: 0.4, ease: "back.out(1.4)" }, 0.1);
      // "seguí así": cae y brinda
      tl.fromTo(q(".s09-segui"), { opacity: 0, scale: 2.5 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power4.in", immediateRender: false }, SEGUI - 0.1);
      temblor(SEGUI + 0.03, 0.8);
      tl.to(q(".s09-copa"), { rotation: -14, transformOrigin: "0% 100%", duration: 0.12, ease: "power2.out" }, ASI);
      tl.to(q(".s09-copa"), { rotation: 0, transformOrigin: "0% 100%", duration: 0.3, ease: "back.out(2)" }, ASI + 0.14);
      mons.forEach((m, i) => tl.to(m, { opacity: 0.6, duration: 0.03, yoyo: true, repeat: 1 }, ASI + 0.05 + i * 0.03));
      [[16], [-10], [0]].forEach(([x], i) => tl.to(q(".s09-segui"), { x, duration: 0.03, ease: "none" }, 1.2 + i * 0.04));
      tl.to(q(".s09-sillon"), { rotation: -3, transformOrigin: "50% 100%", duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.9);

      // "por favor": se va SEGUÍ ASÍ, sonrisa enorme que se dibuja
      tl.to(q(".s09-segui"), { scaleY: 0.03, opacity: 0, duration: 0.08, ease: "power3.in" }, POR - 0.1);
      tl.fromTo(q(".s09-porfavor"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.15, ease: "power3.out", immediateRender: false }, POR);
      tl.to(mons, { opacity: 0.35, duration: 0.2 }, POR);
      tl.set(qa(".s09-trazo"), { opacity: 1 }, POR + 0.04);
      tl.to(qa(".s09-trazo"), { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut", stagger: 0.09 }, POR + 0.04);
      tl.fromTo(q(".s09-sonrisa"), { scale: 0.9 }, { scale: 1.04, duration: 0.25, ease: "back.out(2)" }, FAVOR);
      tl.to(q(".s09-sonrisa"), { scale: 1, duration: 0.5, ease: "sine.inOut" }, FAVOR + 0.3);
      tl.to(q(".s09-porfavor"), { scale: 1.06, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.4);
      tl.to(q(".s09-copa"), { rotation: -8, transformOrigin: "0% 100%", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.5);

      // "no cambies nada": sellos en todos los monitores y NADA gigante (flash rojo de ambiente en 4.1)

      tl.to(mons, { opacity: 1, duration: 0.1 }, NO - 0.05);
      tl.set(q(".s09-nocambies"), { opacity: 1 }, NO - 0.08);
      gsap.set(q(".s09-cambies"), { opacity: 0 });
      tl.fromTo(q(".s09-no"), { scale: 2.6 }, { scale: 1, duration: 0.1, ease: "power4.in", immediateRender: false }, NO - 0.08);
      tl.fromTo(q(".s09-cambies"), { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power4.in", immediateRender: false }, CAMBIES - 0.08);
      temblor(CAMBIES + 0.03, 0.8);
      qa(".s09-sello").forEach((s, i) => tl.fromTo(s, { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power4.in", immediateRender: false }, 3.6 + [0, 3, 1, 5, 2, 4][i] * 0.06));
      tl.fromTo(q(".s09-nada"), { opacity: 0, scale: 3 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, NADA - 0.14);
      temblor(NADA, 1.4);
      [[-20], [14], [-8], [0]].forEach(([x], i) => tl.to(q(".s09-nada"), { x, duration: 0.03, ease: "none" }, NADA + 0.3 + i * 0.04));

      // SILENCIO: se apagan las palabras; la risa (la sonrisa tiembla), la mira se cierra, todo se oscurece

      tl.to(q(".s09-oscuro"), { opacity: 0.72, duration: ESTATICA - 4.6, ease: "power1.in" }, 4.6);
      tl.to(q(".s09-escenario"), { scale: 1.16, transformOrigin: "540px 870px", duration: ESTATICA - 4.4, ease: "power1.in" }, 4.4);
      tl.fromTo(q(".s09-sonrisa"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 4.75);
      // la risa: la sonrisa y los hombros tiemblan, cada vez más
      const risa = [[-5, 4], [6, -3], [-4, 6], [5, -5], [-6, 3], [4, -6], [-7, 5], [7, -4], [-5, 7], [8, -6], [-8, 4], [6, -8]];
      for (let i = 0; i < 26; i++) {
        const [x, y] = risa[i % risa.length];

        tl.to(q(".s09-sonrisa"), { x: x * f, y: y * f, duration: 0.05, ease: "none" }, 4.9 + i * 0.07);
        if (i % 2 === 0) tl.to(q(".s09-cuerpo"), { y: i % 4 === 0 ? -6 : 0, duration: 0.07, ease: "sine.inOut" }, 4.9 + i * 0.07);
      }
      // los monitores parpadean de a uno
      [[0, 4.8], [4, 5.05], [2, 5.3], [5, 5.5], [1, 5.75], [3, 5.95], [0, 6.15], [5, 6.3], [2, 6.45], [4, 6.6]].forEach(([n, t]) => {

        tl.set(est[n], { opacity: 0.85 }, t);
        tl.set(est[n], { opacity: 0 }, t + 0.03);
      });
      [[34, 0.03], [-26, 0.06], [18, 0.09], [-40, 0.12], [0, 0.15]].forEach(([x, d]) => tl.to(q(".s09-pared"), { x, duration: 0.02, ease: "none" }, ESTATICA + d));
      tl.to(q(".s09-sonrisa"), { scaleY: 0.1, duration: 0.04, yoyo: true, repeat: 1, ease: "none" }, ESTATICA + 0.04);

      // salida: corte de monitor
      tl.to(q("#s09-escena"), { scaleY: 0.02, opacity: 0, duration: 0.18, ease: "power3.in", transformOrigin: "50% 50%" }, DUR - 0.18);

      window.__timelines = window.__timelines || {};
