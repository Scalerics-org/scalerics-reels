      const ENFRENTE = 0.66;
      const TE = 1.92;
      const CARINO = 2.68;

      function dibujar(el, t, d, ease) {
        const L = el.getTotalLength() + 2;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: ease || "power2.inOut" }, t);
      }
      function sacudon(t, f) {
        [[-18, 10], [14, -8], [-8, 4], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      }

      // cuadro 0: el monitor ya está, prendiendo con parpadeo; la cámara se acerca
      tl.fromTo(q(".s02-mon"), { opacity: 0.45, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(q(".s02-calle"), { scale: 1.12 }, { scale: 1, duration: DUR, ease: "none" }, 0);
      [[10, 0.02], [-6, 0.06], [0, 0.1]].forEach(([x, t]) => tl.to(q(".s02-calle"), { x, duration: 0.03, ease: "none" }, t));
      // en el cuadro 0 los trazos ya arrancaron (a medio dibujar), así no queda vacío
      function yaArrancado(el, frac, d) {
        const L = el.getTotalLength() + 2;
        gsap.set(el, { strokeDasharray: L });
        tl.fromTo(el, { strokeDashoffset: L * (1 - frac) }, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, 0);
      }
      qa(".s02-borde").forEach((el) => yaArrancado(el, 0.5, 0.4));
      tl.fromTo(q(".s02-medio"), { opacity: 0.15 }, { opacity: 0.45, duration: 0.2 }, 0);
      qa(".s02-tuyo .s02-ln").forEach((el, i) => yaArrancado(el, 0.35, 0.35 + i * 0.05));
      qa(".s02-suyo .s02-ln").forEach((el, i) => yaArrancado(el, 0.25, 0.4 + i * 0.05));
      gsap.set(qa(".s02-tuyo text"), { opacity: 0 });
      tl.to(qa(".s02-tuyo text"), { opacity: 1, duration: 0.1, ease: "steps(2)" }, 0.3);
      gsap.set(q(".s02-cartel"), { opacity: 0 });
      tl.fromTo(q(".s02-cartel"), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, 0.36);

      // "enfrente": la flecha cruza la calle, la palabra cae en rojo, sacudón

      tramos.forEach((el, i) => tl.to(el, { opacity: 1, duration: 0.03, ease: "none" }, ENFRENTE - 0.12 + i * 0.05));
      gsap.set(q(".s02-enfrente"), { opacity: 0 });

      sacudon(ENFRENTE + 0.06, 1);
      tl.to(q(".s02-mon"), { scaleY: 0.04, duration: 0.04, yoyo: true, repeat: 1, ease: "none" }, ENFRENTE + 0.02);

      tl.fromTo(q(".s02-mirita"), { opacity: 0, scale: 2, rotation: -60, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, ENFRENTE + 0.3);

      tl.to(tramos, { opacity: 0.35, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, ENFRENTE + 0.3);
      tl.to(q(".s02-enfrente"), { x: 10, duration: 0.03, yoyo: true, repeat: 3, ease: "none" }, 1.5);
