    [data-composition-id="ambiente"] .amb-villano { position: absolute; inset: 0; }

  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 54.02;
      const CAMBIO = 41.44; // "O cambiá todo": se termina la guarida
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(q(".amb-scan"), { y: 0 }, { y: 30, duration: 1, ease: "none", repeat: Math.floor(CAMBIO) - 1 }, 0);
      // el punto de REC titila
      tl.fromTo(q(".amb-punto"), { opacity: 1 }, { opacity: 0.15, duration: 0.5, ease: "steps(1)", yoyo: true, repeat: Math.floor(CAMBIO / 0.5) - 1 }, 0);
      // parpadeo de monitor viejo, cada tanto
      [2.9, 11.3, 19.9, 27.4, 33.6].forEach((t) => {
        tl.to(q(".amb-villano"), { opacity: 0.55, duration: 0.03 }, t);
        tl.to(q(".amb-villano"), { opacity: 1, duration: 0.05 }, t + 0.06);

      tl.to(q(".amb-blanco"), { opacity: 0.85, duration: 0.03 }, CAMBIO);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
