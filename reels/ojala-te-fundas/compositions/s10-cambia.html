  <script>
    (function () {
      const ID = "s10-cambia";
      const DUR = 2.84;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const CAMBIA = 0.5;
      const TODO = 0.84;
      const NO = 1.52;
      const GUSTO = 2.08;

      // cuadro 0: la pared del villano, recién golpeada por el flash: se agrieta
      tl.set(qa(".s10-mon .grieta"), { opacity: 1 }, 0.02);
      [[-20, 8], [16, -10], [-8, 4], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-escenario"), { x, y, duration: 0.03, ease: "none" }, 0.02 + i * 0.035));
      // y sale volando para afuera, cada monitor hacia su borde, y se apaga
      qa(".s10-mon").forEach((m, i) => {
        const col = i % 3, fila = Math.floor(i / 3);
        const dx = (col - 1) * 820 + (col === 1 ? (fila - 1) * 260 : 0);
        const dy = (fila - 1) * 900 + (fila === 1 && col === 1 ? 0 : 60);
        const rot = (i % 2 ? 1 : -1) * (30 + i * 9);
        if (col === 1 && fila === 1) {
          tl.to(m, { scale: 4, opacity: 0, duration: 0.32, ease: "power2.in" }, 0.14);
        } else {
          tl.to(m, { x: dx, y: dy, rotation: rot, duration: 0.42, ease: "power3.in" }, 0.12 + (i % 4) * 0.02);
          tl.to(m, { scaleY: 0.04, opacity: 0, duration: 0.12, ease: "power2.in" }, 0.4 + (i % 3) * 0.03);
        }
      });
      tl.fromTo(q(".s10-sillon"), { y: 0 }, { y: 14, duration: 0.5, ease: "sine.inOut" }, 0);

      // "CAMBIÁ" cae de golpe en hueso
      gsap.set(q(".s10-cambia"), { opacity: 0 });
      tl.fromTo(q(".s10-cambia"), { opacity: 0, scale: 2.6, rotation: -4 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.14, ease: "power4.in", immediateRender: false }, CAMBIA - 0.1);
      [[-18, 10], [14, -8], [-6, 4], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-escenario"), { x, y, duration: 0.04, ease: "none" }, CAMBIA + 0.05 + i * 0.045));
      // "TODO" en verde, desde abajo
      gsap.set(q(".s10-todo"), { opacity: 0 });
      tl.fromTo(q(".s10-todo"), { opacity: 0, scale: 0.4, y: 120 }, { opacity: 1, scale: 1, y: 0, duration: 0.2, ease: "back.out(2)", immediateRender: false }, TODO - 0.06);
      tl.to(q(".s10-todo"), { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, TODO + 0.22);
      tl.fromTo(q(".s10-cambia"), { y: 0 }, { y: -10, duration: DUR - CAMBIA, ease: "none", immediateRender: false }, CAMBIA + 0.1);

      // "no le des el gusto": aparece la mira sobre el sillón vacío...
      gsap.set(q(".s10-mira"), { opacity: 0 });
      tl.fromTo(q(".s10-mira"), { opacity: 0, scale: 1.8, rotation: -60 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.24, ease: "power3.out", immediateRender: false }, NO - 0.06);
      gsap.set(q(".s10-gusto"), { opacity: 0 });
      tl.fromTo(q(".s10-gusto"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.15, ease: "power3.out", immediateRender: false }, NO);
      tl.to(q(".s10-mira"), { x: 8, duration: 0.04, yoyo: true, repeat: 5, ease: "none" }, NO + 0.3);
      // ...y en "gusto" la mira se parte en dos y el sillón cae para atrás
      tl.to(q(".s10-izq"), { x: -260, y: 120, rotation: -70, opacity: 0, duration: 0.45, ease: "power3.in" }, GUSTO);
      tl.to(q(".s10-der"), { x: 260, y: 160, rotation: 80, opacity: 0, duration: 0.45, ease: "power3.in" }, GUSTO);
      tl.to(q(".s10-sillon"), { rotation: 78, transformOrigin: "90% 100%", y: 60, duration: 0.4, ease: "power2.in" }, GUSTO + 0.02);
      tl.to(q(".s10-sillon"), { opacity: 0, duration: 0.15 }, GUSTO + 0.34);
      [[-16, 8], [12, -6], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-escenario"), { x, y, duration: 0.04, ease: "none" }, GUSTO + 0.05 + i * 0.045));
      tl.to(q(".s10-gusto"), { scale: 1.12, color: "#5ce611", duration: 0.12, ease: "power3.out" }, GUSTO);

      // salida: blur
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
