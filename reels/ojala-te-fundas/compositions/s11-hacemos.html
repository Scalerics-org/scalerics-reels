  <script>
    (function () {
      const ID = "s11-hacemos";
      const DUR = 4.02;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const WPP = 0.3;
      const PUNTOS = 1.3;
      const WEB = 1.96;
      const LO = 2.62;
      const NOS = 2.94;

      function dibujar(el, t, dur) {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t);
      }
      function golpe(t, f) {
        const s = f || 1;
        [[-14 * s, 8 * s], [11 * s, -6 * s], [-5 * s, 3 * s], [0, 0]].forEach(([x, y], i) => tl.to(q(".s11-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      }
      // una palabra gigante que cae y otra que se va
      function palabra(sel, t, verde) {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 2.4, rotation: verde ? 3 : -3 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.13, ease: "power4.in", immediateRender: false }, t - 0.09);
      }
      function fuera(sel, t) { tl.to(q(sel), { opacity: 0, y: -40, scale: 0.8, duration: 0.1, ease: "power2.in" }, t); }

      // cuadro 0: el local ya está, y se termina de iluminar
      tl.fromTo(q(".s11-local"), { scale: 0.86, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
      tl.fromTo(qa(".s11-ventana"), { opacity: 0 }, { opacity: 1, duration: 0.05, stagger: 0.1, ease: "steps(2)" }, 0.08);
      tl.fromTo(q(".s11-local"), { y: 0 }, { y: -8, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 4, immediateRender: false }, 0.3);
      tl.fromTo(q(".s11-p1"), { opacity: 0.5, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in" }, 0);

      // las cosas aparecen ocultas
      gsap.set(qa(".s11-cosa"), { opacity: 0 });
      qa(".s11-con").forEach((c) => gsap.set(c, { opacity: 0 }));

      // 0.3 "WhatsApp": el celular se conecta y el bot contesta
      fuera(".s11-p1", WPP - 0.08);
      palabra(".s11-p2", WPP, true);
      golpe(WPP + 0.04);
      tl.fromTo(q(".s11-cel"), { opacity: 0, scale: 0.5, rotation: -14 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, WPP - 0.04);
      tl.fromTo(q(".s11-con1"), { opacity: 0, strokeDashoffset: 60 }, { opacity: 1, strokeDashoffset: 0, duration: 0.3, ease: "none", immediateRender: false }, WPP + 0.1);
      gsap.set(qa(".s11-burb1, .s11-burb2, .s11-burb3"), { opacity: 0 });
      tl.fromTo(q(".s11-burb1"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.2, ease: "back.out(2)", immediateRender: false }, WPP + 0.15);
      tl.fromTo(q(".s11-burb2"), { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.2, ease: "back.out(2)", immediateRender: false }, WPP + 0.42);
      tl.fromTo(q(".s11-burb3"), { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.2, ease: "back.out(2)", immediateRender: false }, WPP + 0.7);
      tl.to(q(".s11-cel"), { rotation: 3, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, WPP + 0.32);

      // 1.3 "puntos": la tarjeta se llena de sellos
      fuera(".s11-p2", PUNTOS - 0.1);
      palabra(".s11-p3", PUNTOS, false);
      golpe(PUNTOS + 0.04);
      tl.fromTo(q(".s11-tarjeta"), { opacity: 0, scale: 0.5, y: -60 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, PUNTOS - 0.06);
      tl.fromTo(q(".s11-con2"), { opacity: 0, strokeDashoffset: 60 }, { opacity: 1, strokeDashoffset: 0, duration: 0.3, ease: "none", immediateRender: false }, PUNTOS + 0.1);
      gsap.set(qa(".s11-sello"), { opacity: 0 });
      tl.fromTo(qa(".s11-sello"), { opacity: 0 }, { opacity: 1, duration: 0.06, stagger: 0.07, ease: "steps(2)", immediateRender: false }, PUNTOS + 0.12);
      tl.to(q(".s11-tarjeta"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut" }, PUNTOS + 0.7);

      // 1.96 "web": la ventana con tu local y el pin
      fuera(".s11-p3", WEB - 0.1);
      palabra(".s11-p4", WEB, true);
      golpe(WEB + 0.04);
      tl.fromTo(q(".s11-web"), { opacity: 0, scale: 0.5, rotation: 12 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, WEB - 0.06);
      tl.fromTo(q(".s11-con3"), { opacity: 0, strokeDashoffset: 60 }, { opacity: 1, strokeDashoffset: 0, duration: 0.3, ease: "none", immediateRender: false }, WEB + 0.1);
      gsap.set(q(".s11-pin"), { opacity: 0 });
      tl.fromTo(q(".s11-pin"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.25, ease: "bounce.out", immediateRender: false }, WEB + 0.15);

      // las conexiones laten (el flujo corre por las líneas)
      tl.to(qa(".s11-con"), { strokeDashoffset: -90, duration: DUR - 0.5, ease: "none" }, 0.5);

      // 2.62 "lo hacemos nosotros": todo se achica un poco, tilde grande y NOSOTROS
      fuera(".s11-p4", LO - 0.08);
      tl.to(qa(".s11-cosa, .s11-local"), { opacity: 0.35, duration: 0.2 }, LO);
      dibujar(q(".s11-check"), LO, 0.36);
      palabra(".s11-p5", NOS, true);
      golpe(NOS + 0.04, 1.3);
      tl.to(q(".s11-tilde"), { scale: 1.08, duration: 0.14, yoyo: true, repeat: 1, ease: "sine.inOut" }, NOS + 0.05);
      tl.fromTo(q(".s11-p5"), { y: 0 }, { y: -12, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, NOS + 0.2);

      // la etiqueta, siempre

      // salida: blur
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
