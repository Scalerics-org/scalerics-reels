        tl.to(h, { y: -36, opacity: 0, duration: 0.45, ease: "sine.in" }, 1.45 + i * 0.18);
      });
      tl.fromTo(q(".s04-taza"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, 0);

      [0.38, 0.5, 0.64, 1.14].forEach((t, i) => tl.fromTo(ws[i], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.12, ease: "power3.out", immediateRender: false }, t));

      tl.fromTo(q(".s04-grande"), { scale: 1 }, { scale: 1.05, duration: DUR - CORTE, ease: "none" }, CORTE + 0.06);
