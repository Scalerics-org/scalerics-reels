  <style>

  <div id="root" data-composition-id="s11-tuya" data-width="1080" data-height="1920" data-duration="3.12">
    <div id="s11-escena" class="s11-capa clip" data-start="0" data-duration="3.12" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s11-suelo" x1="90" y1="1150" x2="330" y2="1150" />
        <g class="s11-tuyo" transform="translate(210 1150) scale(0.55)">

  <script>
    (function () {
      const ID = "s11-tuya";
      const DUR = 3.12;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s11-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const ONCE = 0.85, NOCHE = 1.35, VENTA = 1.95, TUYA = 2.35;
      dibujar(qa(".s11-dc"), 0, 0.45, 0.4);
      dibujar(qa(".s11-dl"), 0, 0.45, 0.4);
      tl.fromTo(q(".s11-suelo"), { scaleX: 0.4, svgOrigin: "210 1150" }, { scaleX: 1, svgOrigin: "210 1150", duration: 0.5, ease: "power3.out" }, 0);
      gsap.set(qa(".s11-dl, .s11-dl-txt"), { opacity: 0.4 });
      gsap.set(qa(".s11-dl-luz"), { opacity: 0 });
      // "once": la hora
      gsap.set(q(".s11-hora"), { opacity: 0 });
      tl.fromTo(q(".s11-hora"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, ONCE - 0.15);
      et(1, ONCE);
      // "noche": la luna
      dibujar([q(".s11-luna")], NOCHE - 0.15, 0.4);
      // "venta": entra el pedido
      pop(q(".s11-ped"), VENTA - 0.2, 580, 898);
      // "tuya": tilde y tu local se prende
      dibujar(qa(".s11-dk"), TUYA - 0.1, 0.35);
      punch(q(".s11-ped"), TUYA + 0.1, 580, 898, 1.06);
      tl.to(qa(".s11-dl, .s11-dl-txt"), { opacity: 1, duration: 0.25 }, TUYA);
      tl.to(qa(".s11-dl-luz"), { opacity: 0.85, duration: 0.25 }, TUYA);
      et(2, TUYA - 0.1);

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
