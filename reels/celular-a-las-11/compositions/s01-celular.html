  <script>
    (function () {
      const ID = "s01-celular";
      const DUR = 5.71;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const COMPETENCIA = 0.3;
      const NO_ES = 1.29;
      const ENFRENTE = 2.0;
      const CELULAR = 3.1;
      const CLIENTE = 3.8;
      const ONCE = 4.4;
      const NOCHE = 4.8;

      const SUELO = 1150;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // los dos locales: el tuyo arranca medio dibujado (cuadro 0 no negro)
      dibujar(qa(".s01-dib-a"), 0, 0.55, 0.45);
      tl.fromTo(q(".s01-txt-a"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.25);
      tl.fromTo(qa(".s01-luz-a"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 0.35);
      tl.fromTo(q(".s01-suelo"), { scaleX: 0.5, svgOrigin: "540 1150" }, { scaleX: 1, svgOrigin: "540 1150", duration: 0.7, ease: "power3.out" }, 0);
      dibujar(qa(".s01-dib-b"), 0.15, 0.55);
      tl.fromTo(q(".s01-txt-b"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.5);
      tl.fromTo(qa(".s01-luz-b"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 0.6);

      // "competencia": VS entre los dos
      pop(q(".s01-vs"), COMPETENCIA, 540, 1045);
      tl.to(q(".s01-vs"), { scale: 1.15, svgOrigin: "540 1045", duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, COMPETENCIA + 0.6);
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, COMPETENCIA);

      // "no es el de enfrente": badge X, y el de enfrente se apaga
      pop(q(".s01-badge"), NO_ES + 0.2, 118, -268);
      tl.to(q(".s01-otro-in"), { x: 8, duration: 0.06, yoyo: true, repeat: 3, ease: "none" }, NO_ES + 0.25);
      tl.to(qa(".s01-luz-b"), { opacity: 0, duration: 0.25 }, ENFRENTE);
      tl.to(qa(".s01-dib-b, .s01-txt-b"), { opacity: 0.4, duration: 0.3 }, ENFRENTE);
      tl.to(q(".s01-vs"), { opacity: 0, duration: 0.25 }, ENFRENTE + 0.2);
      tl.to(q(".s01-e1"), { opacity: 0.45, duration: 0.3 }, ENFRENTE + 0.3);

      // "celular": los locales se hacen a un lado y entra el celular con golpe
      tl.to(q(".s01-otro"), { opacity: 0, attr: { transform: "translate(990 1150) scale(0.85)" }, duration: 0.35, ease: "power2.in" }, CELULAR - 0.3);
      tl.to(q(".s01-tuyo"), { attr: { transform: "translate(175 1150) scale(0.5)" }, duration: 0.45, ease: "power3.inOut" }, CELULAR - 0.3);
      tl.to(qa(".s01-dib-a, .s01-txt-a"), { opacity: 0.4, duration: 0.3 }, CELULAR);
      tl.to(qa(".s01-luz-a"), { opacity: 0, duration: 0.3 }, CELULAR);
      tl.to(q(".s01-suelo"), { opacity: 0, duration: 0.3 }, CELULAR - 0.3);
      dibujar(qa(".s01-dib-c"), CELULAR - 0.1, 0.45);
      tl.fromTo(q(".s01-cel"), { scale: 1.12, svgOrigin: "540 910" }, { scale: 1, svgOrigin: "540 910", duration: 0.45, ease: "power3.out" }, CELULAR - 0.1);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.2 }, CELULAR - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CELULAR);

      // "cliente": la pantalla se prende (barra y hora 22:59, notificaciones)
      gsap.set(qa(".s01-barra, .s01-rueda, .s01-fecha"), { opacity: 0 });
      tl.to(qa(".s01-barra, .s01-rueda, .s01-fecha"), { opacity: 1, duration: 0.25 }, CLIENTE - 0.25);
      qa(".s01-noti").forEach((n, i) => pop(n, CLIENTE + 0.15 + i * 0.22, 540, 1010 + i * 112));

      // "once": la hora rueda a 23:00
      tl.to(q(".s01-rueda"), { y: -120, duration: 0.3, ease: "back.out(1.4)" }, ONCE);
      tl.fromTo(q(".s01-hora-chica"), { opacity: 1 }, { scale: 1.2, svgOrigin: "424 668", duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, ONCE + 0.1);

      // "noche": la luna
      dibujar([q(".s01-dib-luna")], NOCHE - 0.1, 0.45);
      gsap.set(qa(".s01-zz"), { opacity: 0 });
      qa(".s01-zz").forEach((z, i) => tl.fromTo(z, { opacity: 0, y: 10 }, { opacity: 0.7, y: 0, duration: 0.3, ease: "power2.out" }, NOCHE + 0.2 + i * 0.15));
      tl.to(q(".s01-luna"), { rotation: -6, svgOrigin: "880 700", duration: 0.6, ease: "sine.inOut" }, NOCHE + 0.3);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
