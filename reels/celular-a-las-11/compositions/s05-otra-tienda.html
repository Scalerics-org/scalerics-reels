  <style>

  <div id="root" data-composition-id="s05-otra-tienda" data-width="1080" data-height="1920" data-duration="6.05">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="6.05" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s05-cel">
        
        <rect class="ln s05-dc" x="350" y="600" width="380" height="620" rx="52" />

    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-otra-tienda";
      const DUR = 6.05;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s05-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const FOTO = 1.05, PRECIO = 1.65, BOTON = 2.25, TOCA = 3.45, PAGA = 4.26, DORMIR = 5.05;
      dibujar(qa(".s05-dc"), 0, 0.45, 0.4);
      tl.fromTo(q(".s05-cel"), { y: 30 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
      gsap.set(qa(".s05-nombre"), { opacity: 0 });
      tl.to(qa(".s05-nombre"), { opacity: 1, duration: 0.3 }, 0.25);
      // "foto"
      dibujar([q(".s05-foto")], FOTO - 0.35, 0.4);
      dibujar(qa(".s05-mochi"), FOTO - 0.1, 0.5);
      gsap.set(q(".s05-nom"), { opacity: 0 });
      tl.fromTo(q(".s05-nom"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, FOTO + 0.2);
      et(1, FOTO);
      // "precio"
      pop(q(".s05-precio"), PRECIO, 460, 1034);
      punch(q(".s05-precio"), PRECIO + 0.4, 460, 1034, 1.12);
      // "botón de pagar"
      pop(q(".s05-btn"), BOTON, 540, 1119);
      // "toca"
      
      gsap.set(qa(".s05-dedo, .s05-dedo-onda"), { opacity: 0 });
      tl.fromTo(q(".s05-dedo"), { opacity: 0, x: 70, y: 90 }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "power3.out" }, TOCA - 0.3);
      tl.fromTo(q(".s05-dedo-onda"), { opacity: 0.9, scale: 1, svgOrigin: "600 1119" }, { opacity: 0, scale: 2.4, svgOrigin: "600 1119", duration: 0.45, ease: "power2.out", immediateRender: false }, TOCA);
      tl.to(q(".s05-dedo"), { opacity: 0, duration: 0.2 }, TOCA + 0.35);
      tl.to(q(".s05-btn"), { scale: 0.94, svgOrigin: "540 1119", duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, TOCA);
      // "paga": pago aprobado
      tl.to(q(".s05-cont"), { opacity: 0.07, duration: 0.25 }, PAGA - 0.2);
      dibujar(qa(".s05-dok"), PAGA - 0.1, 0.4);
      gsap.set(q(".s05-ok"), { opacity: 0 });
      tl.fromTo(q(".s05-ok"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, PAGA + 0.15);
      punch(q(".s05-aprob"), PAGA + 0.4, 540, 900, 1.08);
      et(2, PAGA);
      // "dormir": el celular se apaga, la luna
      tl.to(q(".s05-cel"), { opacity: 0.4, duration: 0.4 }, DORMIR);
      dibujar([q(".s05-dl")], DORMIR - 0.25, 0.45);
      gsap.set(qa(".s05-zz"), { opacity: 0 });
      qa(".s05-zz").forEach((z, i) => tl.fromTo(z, { opacity: 0, y: 10 }, { opacity: 0.75, y: 0, duration: 0.3, ease: "power2.out" }, DORMIR + 0.1 + i * 0.18));

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
