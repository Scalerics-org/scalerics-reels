  <script>
    (function () {
      const ID = "s07-sin-jugar";
      const DUR = 5.5;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s07-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const PRODUCTO = 0.7, MEJOR = 1.4, COMPRAR = 2.9, SILLON = 3.8, PERDISTE = 4.58, JUGAR = 5.2;
      dibujar(qa(".s07-dp"), 0, 0.5, 0.4);
      gsap.set(q(".s07-tp"), { opacity: 0 });
      tl.to(q(".s07-tp"), { opacity: 1, duration: 0.3 }, 0.3);
      punch(q(".s07-prod"), PRODUCTO, 290, 960, 1.08);
      // "mejor": la estrella
      dibujar([q(".s07-est")], MEJOR - 0.2, 0.4);
      tl.fromTo(q(".s07-est"), { rotation: -30, svgOrigin: "290 794" }, { rotation: 0, svgOrigin: "290 794", duration: 0.5, ease: "back.out(2)" }, MEJOR - 0.2);
      et(1, MEJOR);
      // "comprar desde el sillón": el sillón con alguien comprando
      dibujar(qa(".s07-ds"), COMPRAR - 0.3, 0.5);
      dibujar(qa(".s07-fig"), SILLON - 0.3, 0.4);
      tl.to(qa(".s07-prod, .s07-est"), { opacity: 0.35, duration: 0.4 }, COMPRAR);
      et(2, COMPRAR);
      punch(q(".s07-cel"), SILLON + 0.25, 809, 905, 1.3);
      // "perdiste": el tablero
      pop(q(".s07-tablero"), PERDISTE - 0.1, 540, 684);
      et(3, PERDISTE);
      // "sin jugar": golpe
      punch(q(".s07-tablero"), JUGAR - 0.05, 540, 684, 1.1);
      tl.to(q(".s07-prod"), { x: -8, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, JUGAR - 0.05);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
