  <script>
    (function () {
      const ID = "s06-privado";
      const DUR = 5.2;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s06-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const INSTAGRAM = 0.7, PRECIO = 1.77, PRIVADO = 2.2, NADIE = 3.7, COMPRA = 4.81;
      dibujar(qa(".s06-dc"), 0, 0.45, 0.4);
      gsap.set(q(".s06-usr"), { opacity: 0 });
      tl.to(q(".s06-usr"), { opacity: 1, duration: 0.3 }, 0.3);
      // "Instagram": el posteo
      dibujar(qa(".s06-dp"), INSTAGRAM - 0.2, 0.5);
      // "precio por privado"
      gsap.set(q(".s06-cap"), { opacity: 0 });
      tl.fromTo(q(".s06-cap"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, PRECIO - 0.1);
      et(1, PRECIO);
      punch(q(".s06-cap"), PRIVADO, 510, 1058, 1.08);
      // la burbuja que espera: los puntitos laten
      pop(q(".s06-msj"), PRIVADO + 0.2, 476, 1140);
      qa(".s06-pt").forEach((p, i) => tl.fromTo(p, { y: 0 }, { y: -8, duration: 0.2, ease: "sine.out", yoyo: true, repeat: 3, immediateRender: false }, PRIVADO + 0.5 + i * 0.12));
      // "nadie pregunta": se apagan, cero, tachado
      tl.to(qa(".s06-pt"), { opacity: 0.25, duration: 0.25 }, NADIE - 0.2);
      punch(q(".s06-cero"), NADIE, 610, 1137, 1.5);
      dibujar([q(".s06-tacha")], NADIE + 0.05, 0.35);
      et(2, NADIE);
      // "Compra": tu celular se apaga y corre; compra en otra tienda
      tl.to(q(".s06-cel"), { x: -150, opacity: 0.4, duration: 0.4, ease: "power3.inOut" }, COMPRA - 0.45);
      dibujar([q(".s06-flecha")], COMPRA - 0.1, 0.3);
      gsap.set(q(".s06-punta"), { opacity: 0 });
      tl.to(q(".s06-punta"), { opacity: 1, duration: 0.1 }, COMPRA + 0.15);
      pop(q(".s06-btn"), COMPRA, 880, 914);
      gsap.set(q(".s06-otro"), { opacity: 0 });
      tl.to(q(".s06-otro"), { opacity: 1, duration: 0.25 }, COMPRA + 0.05);
      punch(q(".s06-btn"), COMPRA + 0.4, 880, 914, 1.1);
      et(3, COMPRA);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
