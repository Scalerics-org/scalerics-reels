  <script>
    (function () {
      const ID = "s04-gana";
      const DUR = 2.8;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s04-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const GANA = 0.0, COMPRAR = 0.85, MOMENTO = 1.65;
      dibujar(qa(".s04-dc"), 0, 0.45, 0.4);
      punch(q(".s04-copa"), 0.45, 540, 720, 1.1);
      pop(q(".s04-btn"), GANA + 0.15, 540, 930);
      et(1, 0.3);
      
      gsap.set(qa(".s04-dedo, .s04-dedo-onda"), { opacity: 0 });
      tl.fromTo(q(".s04-dedo"), { opacity: 0, x: 70, y: 90 }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "power3.out" }, COMPRAR - 0.3);
      tl.fromTo(q(".s04-dedo-onda"), { opacity: 0.9, scale: 1, svgOrigin: "650 930" }, { opacity: 0, scale: 2.4, svgOrigin: "650 930", duration: 0.45, ease: "power2.out", immediateRender: false }, COMPRAR);
      tl.to(q(".s04-dedo"), { opacity: 0, duration: 0.2 }, COMPRAR + 0.35);
      tl.to(q(".s04-btn"), { scale: 0.94, svgOrigin: "540 930", duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, COMPRAR);
      gsap.set(q(".s04-hora"), { opacity: 0 });
      tl.fromTo(q(".s04-hora"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, MOMENTO - 0.25);
      dibujar(qa(".s04-dk"), MOMENTO, 0.35);
      punch(q(".s04-reloj"), MOMENTO + 0.4, 560, 1097, 1.08);
      tl.fromTo(q(".s04-copa"), { y: 0 }, { y: -10, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.0);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
