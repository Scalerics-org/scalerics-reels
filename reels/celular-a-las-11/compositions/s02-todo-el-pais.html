  <script>
    (function () {
      const ID = "s02-todo-el-pais";
      const DUR = 4.99;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s02-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const CUADRA = 0.79, COMPITEN = 1.7, TIENDAS = 1.89, PAIS = 2.73, TOQUE = 3.89;
      dibujar(qa(".s02-dib"), 0, 0.5, 0.4);
      tl.fromTo(qa(".s02-dib-txt, .s02-cartel"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.2);
      tl.fromTo(qa(".s02-dib-luz"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 0.3);
      // "cuadra": badge X en el cartel
      pop(q(".s02-badge"), CUADRA, 978, 642);
      punch(q(".s02-cuadra"), CUADRA + 0.1, 540, 1000, 1.04);
      et(1, CUADRA - 0.2);
      tl.to(qa(".s02-dib-luz"), { opacity: 0, duration: 0.25 }, CUADRA + 0.3);
      // "compiten": la cuadra se va, entra el celular
      tl.to(q(".s02-cuadra"), { opacity: 0, filter: "blur(6px)", y: 30, duration: 0.3, ease: "power2.in" }, COMPITEN - 0.35);
      dibujar(qa(".s02-dc"), COMPITEN - 0.05, 0.4);
      gsap.set(q(".s02-dc-hora"), { opacity: 0 });
      tl.to(q(".s02-dc-hora"), { opacity: 1, duration: 0.2 }, COMPITEN + 0.2);
      tl.fromTo(q(".s02-cel"), { scale: 1.1, svgOrigin: "540 910" }, { scale: 1, svgOrigin: "540 910", duration: 0.4, ease: "power3.out" }, COMPITEN - 0.05);
      // "tiendas": caen las tarjetas una tras otra
      qa(".s02-card").forEach((c, i) => {
      gsap.set(c, { opacity: 0 });
      tl.fromTo(c, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, TIENDAS + i * 0.16);
      });
      et(2, TIENDAS);
      // "todo el país": el pin
      pop(q(".s02-pin"), PAIS, 870, 880);
      tl.fromTo(q(".s02-pin"), { y: 0 }, { y: -14, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, PAIS + 0.4);
      // "toque": el dedo toca la primera tarjeta
      
      gsap.set(qa(".s02-dedo, .s02-dedo-onda"), { opacity: 0 });
      tl.fromTo(q(".s02-dedo"), { opacity: 0, x: 70, y: 90 }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "power3.out" }, TOQUE - 0.3);
      tl.fromTo(q(".s02-dedo-onda"), { opacity: 0.9, scale: 1, svgOrigin: "432 764" }, { opacity: 0, scale: 2.4, svgOrigin: "432 764", duration: 0.45, ease: "power2.out", immediateRender: false }, TOQUE);
      tl.to(q(".s02-dedo"), { opacity: 0, duration: 0.2 }, TOQUE + 0.35);
      punch(q(".s02-card"), TOQUE, 540, 764, 1.06);
      et(3, TOQUE);

      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
