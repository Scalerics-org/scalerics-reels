  <script>
    (function () {
      const ID = "s16-galletita";
      const DUR = 5.95;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const lista = (x) => (typeof x === "string" ? qa(x) : Array.isArray(x) ? x : [x]);
      // trazo que se dibuja solo (opacity 0 hasta que arranca: sin puntitos de los caps)
      const dibujar = (sel, t, d = 0.6) => lista(sel).forEach((el) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote
      const pop = (sel, t, d = 0.35, s = 0.8) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe, como un sello
      const golpe = (sel, t, s = 2.2) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      });
      const fuera = (sel, t, d = 0.25) => tl.to(lista(sel), { opacity: 0, duration: d }, t);
      const sacudon = (t, f = 1, sel = ".s16-esc") => [[-14, 8], [11, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(sel), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      // la boca se mueve mientras habla
      const hablar = (sel, t0, t1) => {
        const n = Math.max(1, Math.floor((t1 - t0) / 0.12));
        tl.fromTo(q(sel), { scaleY: 0.45, transformOrigin: "50% 50%" }, { scaleY: 1.3, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: n % 2 ? n : n + 1, immediateRender: false }, t0);
      };
      // la cola del perro
      const cola = (sel, t, veces = 5) => tl.fromTo(qa(sel), { rotation: -12, svgOrigin: "70 190" }, { rotation: 14, svgOrigin: "70 190", duration: 0.16, yoyo: true, repeat: veces * 2 - 1, ease: "sine.inOut", immediateRender: false }, t);
      // zócalos: cada uno entra desde la izquierda y saca al anterior
      const zocalos = (pares) => pares.forEach(([sel, t], i) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, x: -1100 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, t);
        if (i > 0) tl.to(q(pares[i - 1][0]), { opacity: 0, y: 30, duration: 0.18 }, t);
      });


      const DUENO = 0.45, DIEZ = 1.33, TOMA = 2.23, ES = 3.6, PERRO = 4.75;
      tl.fromTo(q(".s16-tab"), { y: -700 }, { y: 0, duration: 0.35, ease: "back.out(1.3)" }, 0);
      tl.fromTo(q(".s16-tito"), { x: -300 }, { x: 0, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(q(".s16-due"), { x: 300 }, { x: 0, duration: 0.3, ease: "power3.out" }, 0);
      hablar(".s16ti-boca", 0, 3.2);
      tl.fromTo(q(".s16t-num"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(q(".s16t-num"), { opacity: 0, scale: 2.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, DIEZ - 0.08);
      sacudon(DIEZ + 0.06, 1.1);
      gsap.set(qa(".s16-k"), { opacity: 0 });
      qa(".s16-k").forEach((k, i) => tl.fromTo(k, { y: 0, rotation: 0, opacity: 0 }, { opacity: 1, y: 900 + (i % 3) * 80, rotation: 360 + i * 40, transformOrigin: "50% 50%", duration: 2.2 + (i % 4) * 0.2, ease: "none", immediateRender: false }, DIEZ - 0.1 + (i % 5) * 0.08));
      // el dueño se agranda con el diez
      tl.to(q(".s16d-boca"), { scaleY: -1.4, transformOrigin: "50% 50%", duration: 0.15 }, DIEZ);
      tl.to(q(".s16-due"), { y: -20, duration: 0.15, yoyo: true, repeat: 3 }, DIEZ);
      // "tomá, una galletita"
      tl.fromTo(q(".s16ti-brazo"), { rotation: 0, svgOrigin: "96 130" }, { rotation: 30, svgOrigin: "96 130", duration: 0.25, ease: "power2.out" }, TOMA - 0.1);
      pop(".s16-gal", TOMA + 0.05, 0.35, 0.3);
      tl.to(q(".s16-gal"), { rotation: 10, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, TOMA + 0.4);
      // "¿es de las de perro?": la mira desconfiado
      tl.to(q(".s16d-boca"), { scaleY: 1, duration: 0.12 }, ES - 0.1);
      tl.to(qa(".s16d-ojos"), { x: -12, y: 6, duration: 0.2 }, ES);
      tl.to(q(".s16d-cejas"), { y: 6, rotation: 0, duration: 0.2 }, ES);
      tl.to(q(".s16-due"), { x: -30, rotation: -6, svgOrigin: "0 300", duration: 0.3 }, ES + 0.1);
      zocalos([[".s16-z", DIEZ + 0.2]]);
      // "perro": el perro salta y se la lleva
      tl.fromTo(q(".s16-per"), { y: 1400 }, { y: 0, duration: 0.3, ease: "back.out(1.4)" }, PERRO - 0.6);
      cola(".s16p-cola", PERRO - 0.3, 3);
      tl.to(q(".s16-per"), { x: -680, y: -380, rotation: -20, duration: 0.3, ease: "power2.out" }, PERRO + 0.1);
      tl.to(q(".s16-gal"), { opacity: 0, duration: 0.05 }, PERRO + 0.38);
      tl.to(q(".s16-per"), { x: -1200, y: 100, rotation: 10, duration: 0.4, ease: "power2.in" }, PERRO + 0.42);
      sacudon(PERRO + 0.4, 0.7);

      // salida: blur
      tl.to(q("#s16-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
