  <script>
    (function () {
      const ID = "s07-visto";
      const DUR = 5.71;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const lista = (x) => (typeof x === "string" ? qa(x) : Array.isArray(x) ? x : [x]);
      // trazo que se dibuja solo (opacity 0 hasta que arranca: sin puntitos de los caps)
      const dibujar = (sel, t, d = 0.6) => lista(sel).forEach((el) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote
      const pop = (sel, t, d = 0.35, s = 0.8) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe, como un sello
      const golpe = (sel, t, s = 2.2) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      });
      const fuera = (sel, t, d = 0.25) => tl.to(lista(sel), { opacity: 0, duration: d }, t);
      const sacudon = (t, f = 1, sel = ".s07-esc") => [[-14, 8], [11, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(sel), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      // la boca se mueve mientras habla
      const hablar = (sel, t0, t1) => {
        const n = Math.max(1, Math.floor((t1 - t0) / 0.12));
        tl.fromTo(q(sel), { scaleY: 0.45, transformOrigin: "50% 50%" }, { scaleY: 1.3, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: n % 2 ? n : n + 1, immediateRender: false }, t0);
      };
      // la cola del perro
      const cola = (sel, t, veces = 5) => tl.fromTo(qa(sel), { rotation: -12, svgOrigin: "70 190" }, { rotation: 14, svgOrigin: "70 190", duration: 0.16, yoyo: true, repeat: veces * 2 - 1, ease: "sine.inOut", immediateRender: false }, t);
      // zócalos: cada uno entra desde la izquierda y saca al anterior
      const zocalos = (pares) => pares.forEach(([sel, t], i) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, x: -1100 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, t);
        if (i > 0) tl.to(q(pares[i - 1][0]), { opacity: 0, y: 30, duration: 0.18 }, t);
      });


      const CLAVO = 0.82, VISTO = 1.36, VISTO2 = 2.46, CERO = 2.91, PROBEMOS = 4.17;
      tl.fromTo(q(".s07-cel"), { y: 60 }, { y: 0, duration: 0.3, ease: "power2.out" }, 0);
      pop(".s07-g1", 0.05, 0.3, 0.6);
      hablar(".s07s-boca", 0, 1.9);
      // "visto": las tildes se ponen azules, Sofía se indigna
      gsap.set([q(".s07-azul"), q(".s07-vt")], { opacity: 0 });
      tl.to([q(".s07-azul"), q(".s07-vt")], { opacity: 1, duration: 0.1 }, VISTO - 0.2);
      tl.to(q(".s07-g1-t"), { opacity: 0, duration: 0.1 }, VISTO - 0.2);
      tl.to(q(".s07s-cejas"), { y: 8, rotation: 0, duration: 0.15 }, CLAVO);
      golpe(".s07-sello", VISTO + 0.05, 2);
      sacudon(VISTO + 0.08, 1);
      // "visto. cero puntos": el tablero
      tl.to(q(".s07-a"), { x: -1100, duration: 0.35, ease: "power3.in" }, VISTO2 - 0.3);
      fuera(".s07-sello", VISTO2 - 0.3, 0.2);
      tl.fromTo(q(".s07-tab"), { y: -1300 }, { y: 0, duration: 0.35, ease: "back.out(1.3)", immediateRender: true }, VISTO2 - 0.1);
      tl.fromTo(q(".s07t-num"), { opacity: 0, scale: 2.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: true }, CERO - 0.08);
      sacudon(CERO + 0.06, 1.3);
      tl.fromTo(q(".s07-tito"), { y: 1500 }, { y: 0, duration: 0.35, ease: "power3.out", immediateRender: true }, VISTO2);
      hablar(".s07ti-boca", VISTO2, DUR - 0.2);
      tl.to(q(".s07-tito"), { rotation: -6, svgOrigin: "0 300", duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, CERO + 0.1);
      // "probemos de noche": la pizarra
      tl.to(q(".s07-tab"), { scale: 0.8, y: -40, transformOrigin: "50% 0%", duration: 0.3 }, PROBEMOS - 0.1);
      tl.fromTo(q(".s07-piz"), { x: 1100 }, { x: 0, duration: 0.35, ease: "power3.out", immediateRender: true }, PROBEMOS);
      tl.to(q(".s07-tito"), { y: 140, duration: 0.3 }, PROBEMOS);

      // salida: blur
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
