  <script>
    (function () {
      const ID = "s11-todo";
      const DUR = 7.26;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const lista = (x) => (typeof x === "string" ? qa(x) : Array.isArray(x) ? x : [x]);
      // trazo que se dibuja solo (opacity 0 hasta que arranca: sin puntitos de los caps)
      const dibujar = (sel, t, d = 0.6) => lista(sel).forEach((el) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote
      const pop = (sel, t, d = 0.35, s = 0.8) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe, como un sello
      const golpe = (sel, t, s = 2.2) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      });
      const fuera = (sel, t, d = 0.25) => tl.to(lista(sel), { opacity: 0, duration: d }, t);
      const sacudon = (t, f = 1, sel = ".s11-esc") => [[-14, 8], [11, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(sel), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      // la boca se mueve mientras habla
      const hablar = (sel, t0, t1) => {
        const n = Math.max(1, Math.floor((t1 - t0) / 0.12));
        tl.fromTo(q(sel), { scaleY: 0.45, transformOrigin: "50% 50%" }, { scaleY: 1.3, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: n % 2 ? n : n + 1, immediateRender: false }, t0);
      };
      // la cola del perro
      const cola = (sel, t, veces = 5) => tl.fromTo(qa(sel), { rotation: -12, svgOrigin: "70 190" }, { rotation: 14, svgOrigin: "70 190", duration: 0.16, yoyo: true, repeat: veces * 2 - 1, ease: "sine.inOut", immediateRender: false }, t);
      // zócalos: cada uno entra desde la izquierda y saca al anterior
      const zocalos = (pares) => pares.forEach(([sel, t], i) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, x: -1100 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, t);
        if (i > 0) tl.to(q(pares[i - 1][0]), { opacity: 0, y: 30, duration: 0.18 }, t);
      });


      const CAJA = 0.43, REPONE = 1.08, COBRA = 1.97, ONCE = 2.84, DORMIR = 4.09, PEDIR = 5.34, TAMBIEN = 6.23;
      tl.fromTo(q(".s11-due"), { scale: 0.92, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
      zocalos([[".s11-z", 0.1]]);
      [[".s11-i1", ".s11-l1", CAJA], [".s11-i2", ".s11-l2", REPONE], [".s11-i3", ".s11-l3", COBRA], [".s11-i4", ".s11-l4", ONCE]].forEach(([i, l, t], k) => {
        pop(i, t - 0.08, 0.35, 0.3);
        pop(l, t, 0.3, 0.6);
        tl.to(q(".s11-due"), { x: k % 2 ? 30 : -30, duration: 0.2, ease: "power2.out" }, t);
        tl.to(q(i), { y: -10, duration: 0.35, yoyo: true, repeat: Math.floor((DUR - t) / 0.35) - 2, ease: "sine.inOut" }, t + 0.35);
      });
      tl.to(q(".s11-due"), { x: 0, duration: 0.3 }, ONCE + 0.4);
      // "dormir": se le cierran los ojos
      tl.to(q(".s11d-ojos"), { scaleY: 0.15, transformOrigin: "50% 50%", duration: 0.3 }, DORMIR);
      tl.to(q(".s11d-zzz"), { opacity: 1, duration: 0.2 }, DORMIR + 0.1);
      tl.fromTo(q(".s11d-zzz"), { y: 0 }, { y: -18, duration: 0.4, yoyo: true, repeat: 2, ease: "sine.inOut" }, DORMIR + 0.1);
      tl.to(q(".s11d-boca"), { scaleY: 3, scaleX: 0.7, transformOrigin: "50% 50%", duration: 0.3, yoyo: true, repeat: 1 }, DORMIR - 0.1);
      // "pedir que conteste también": el celular le cae encima y lo despierta
      tl.to(q(".s11d-zzz"), { opacity: 0, duration: 0.1 }, PEDIR);
      gsap.set(q(".s11-cel"), { opacity: 0 });
      tl.fromTo(q(".s11-cel"), { opacity: 1, y: -500, rotation: -30 }, { opacity: 1, y: 0, rotation: 8, duration: 0.35, ease: "power3.in", immediateRender: false }, PEDIR);
      tl.to(q(".s11d-ojos"), { scaleY: 1.3, duration: 0.1 }, PEDIR + 0.35);
      tl.to(q(".s11-due"), { scaleY: 0.92, transformOrigin: "50% 100%", duration: 0.1, yoyo: true, repeat: 1 }, PEDIR + 0.35);
      sacudon(PEDIR + 0.36, 1);
      tl.to(q(".s11-cel"), { rotation: -6, duration: 0.06, yoyo: true, repeat: 11, ease: "none" }, PEDIR + 0.45);
      golpe(".s11-tamb", TAMBIEN, 1.8);
      sacudon(TAMBIEN + 0.04, 0.8);

      // salida: blur
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
