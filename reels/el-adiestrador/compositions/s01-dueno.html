  <script>
    (function () {
      const ID = "s01-dueno";
      const DUR = 5.16;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const lista = (x) => (typeof x === "string" ? qa(x) : Array.isArray(x) ? x : [x]);
      // trazo que se dibuja solo (opacity 0 hasta que arranca: sin puntitos de los caps)
      const dibujar = (sel, t, d = 0.6) => lista(sel).forEach((el) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote
      const pop = (sel, t, d = 0.35, s = 0.8) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe, como un sello
      const golpe = (sel, t, s = 2.2) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      });
      const fuera = (sel, t, d = 0.25) => tl.to(lista(sel), { opacity: 0, duration: d }, t);
      const sacudon = (t, f = 1, sel = ".s01-esc") => [[-14, 8], [11, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(sel), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      // la boca se mueve mientras habla
      const hablar = (sel, t0, t1) => {
        const n = Math.max(1, Math.floor((t1 - t0) / 0.12));
        tl.fromTo(q(sel), { scaleY: 0.45, transformOrigin: "50% 50%" }, { scaleY: 1.3, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: n % 2 ? n : n + 1, immediateRender: false }, t0);
      };
      // la cola del perro
      const cola = (sel, t, veces = 5) => tl.fromTo(qa(sel), { rotation: -12, svgOrigin: "70 190" }, { rotation: 14, svgOrigin: "70 190", duration: 0.16, yoyo: true, repeat: veces * 2 - 1, ease: "sine.inOut", immediateRender: false }, t);
      // zócalos: cada uno entra desde la izquierda y saca al anterior
      const zocalos = (pares) => pares.forEach(([sel, t], i) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, x: -1100 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, t);
        if (i > 0) tl.to(q(pares[i - 1][0]), { opacity: 0, y: 30, duration: 0.18 }, t);
      });


      const PERRO = 0.73, DUENO = 1.82, HOY = 2.64, VISTO = 4.09;
      // cuadro 0: Tito ya está entrando
      tl.fromTo(q(".s01-tito"), { scale: 0.9, y: 30, transformOrigin: "50% 100%" }, { scale: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s01-l1"), { opacity: 0.4, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in" }, 0);
      hablar(".s01t-boca", 0, 2.4);
      hablar(".s01t-boca", HOY, 4.6);
      tl.fromTo(q(".s01t-brazo"), { rotation: 40, svgOrigin: "96 130" }, { rotation: 22, svgOrigin: "96 130", duration: 0.3, ease: "power2.out" }, 0);
      // "perro": el perro, perfecto, con su tilde verde
      tl.fromTo(q(".s01-perro"), { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 0.1);
      pop(".s01-l2", PERRO - 0.05, 0.3, 0.6);
      pop(".s01-ok", PERRO + 0.1, 0.35, 0.3);
      cola(".s01p-cola", PERRO, 3);
      // "dueño": el perro se va, entra el dueño; Tito lo señala
      fuera(".s01-l2", DUENO - 0.12, 0.1);
      golpe(".s01-l3", DUENO, 2);
      sacudon(DUENO + 0.04, 1.2);
      tl.to([q(".s01-perro"), q(".s01-ok")], { x: 520, duration: 0.35, ease: "power2.in" }, DUENO - 0.1);
      tl.fromTo(q(".s01-due"), { x: 520 }, { x: 0, duration: 0.4, ease: "power3.out" }, DUENO + 0.1);
      tl.to(q(".s01t-brazo"), { rotation: 0, svgOrigin: "96 130", duration: 0.2, ease: "power2.out" }, DUENO);
      tl.to(q(".s01t-cejas"), { y: -6, duration: 0.2 }, DUENO);
      tl.to([q(".s01-l1"), q(".s01-l3")], { scale: 0.86, y: -16, duration: 0.3, ease: "power2.out" }, HOY);
      zocalos([[".s01-z", HOY]]);
      // el dueño ni mira: bosteza
      tl.to(q(".s01d-boca"), { scaleY: 3, scaleX: 0.7, transformOrigin: "50% 50%", duration: 0.3, yoyo: true, repeat: 1 }, 3.0);
      // "visto": sello y sacudón
      golpe(".s01-visto", VISTO + 0.05, 2);
      sacudon(VISTO + 0.08, 0.8);

      // salida: blur
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
