  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 72.52;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      // generador determinista (nada de Math.random)
      let semilla = 7;
      const azar = () => { semilla = (semilla * 16807) % 2147483647; return (semilla - 1) / 2147483646; };

      // ---------- lamparitas de la marquesina ----------
      const bulbs = q(".amb-bulbs");
      const pos = [];
      for (let x = 168; x <= 912; x += 48) { pos.push([x, 72]); pos.push([x, 204]); }
      for (let y = 112; y <= 172; y += 46) { pos.push([140, y]); pos.push([928, y]); }
      pos.forEach(([x, y], i) => {
        const b = document.createElement("div");
        b.className = "amb-bulb " + (i % 2 ? "par" : "impar");
        b.style.left = x - 7 + "px"; b.style.top = y - 7 + "px";
        bulbs.appendChild(b);
      });
      const vueltas = Math.floor((DUR - 0.5) / 0.9);
      tl.fromTo(qa(".amb-bulb.par"), { opacity: 1 }, { opacity: 0.3, duration: 0.45, yoyo: true, repeat: vueltas * 2 - 1, ease: "steps(1)" }, 0.2);
      tl.fromTo(qa(".amb-bulb.impar"), { opacity: 0.3 }, { opacity: 1, duration: 0.45, yoyo: true, repeat: vueltas * 2 - 1, ease: "steps(1)" }, 0.2);
      tl.to(q(".amb-marq-txt"), { opacity: 0.85, duration: 0.7, yoyo: true, repeat: Math.floor((DUR - 1) / 0.7) - 1, ease: "sine.inOut" }, 0.5);

      // ---------- focos que barren ----------
      tl.fromTo(q(".amb-foco.izq"), { rotation: -6, transformOrigin: "95px 0px" }, { rotation: 6, transformOrigin: "95px 0px", duration: 2.6, yoyo: true, repeat: Math.floor(DUR / 2.6) - 1, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".amb-foco.der"), { rotation: 6, transformOrigin: "985px 0px" }, { rotation: -6, transformOrigin: "985px 0px", duration: 3.1, yoyo: true, repeat: Math.floor(DUR / 3.1) - 1, ease: "sine.inOut" }, 0);

      // ---------- EN VIVO ----------
      tl.fromTo(q(".amb-punto"), { opacity: 1 }, { opacity: 0.25, duration: 0.5, yoyo: true, repeat: Math.floor((DUR - 0.5) / 0.5) - 1, ease: "steps(1)" }, 0.3);

      // ---------- aplausómetro ----------
      const aguja = q(".amb-aguja");
      gsap.set(aguja, { rotation: -10, svgOrigin: "888 1650" });
      const NIVEL = [[0.2, 10], [3.3, -20], [4.4, -78], [18.3, 20], [35.9, 80], [39.5, 50], [45.9, 65], [47.4, -40], [51.0, 10], [56.6, 60], [61.0, 40], [68.6, 80]];
      NIVEL.forEach(([t, a]) => {
        tl.to(aguja, { rotation: a, svgOrigin: "888 1650", duration: 0.45, ease: "back.out(2.2)" }, t);
        if (a >= 60) tl.to(aguja, { rotation: a - 10, svgOrigin: "888 1650", duration: 0.1, yoyo: true, repeat: 5, ease: "sine.inOut" }, t + 0.45);
      });

      // ---------- confeti: ganador y cierre ----------
      const conf = q(".amb-confeti");
      const COLORES = ["#f2c14e", "#f4ead5", "#b8862b", "#f2c14e", "#8c1022"];
      [35.9, 68.6].forEach((t0, k) => {
        for (let i = 0; i < 46; i++) {
          const c = document.createElement("div");
          const w = 12 + Math.floor(azar() * 12), h = 20 + Math.floor(azar() * 16);
          c.style.cssText = `position:absolute;left:${Math.floor(110 + azar() * 860)}px;top:-60px;width:${w}px;height:${h}px;background:${COLORES[i % 5]};border-radius:3px;opacity:0;`;
          conf.appendChild(c);
          const t = t0 + azar() * 0.7, caida = 2.6 + azar() * 1.4, x = (azar() - 0.5) * 260;
          tl.set(c, { opacity: 1 }, t);
          tl.fromTo(c, { y: 0, x: 0, rotation: azar() * 180 }, { y: 1700 + azar() * 250, x, rotation: 360 + azar() * 540, duration: caida, ease: "power1.in", immediateRender: false }, t);
          tl.to(c, { opacity: 0, duration: 0.3 }, t + caida - 0.3);
        }
      });

      // ---------- flashes: "No, Marcelo" y "IA" ----------
      [3.32, 35.93].forEach((t) => {
        tl.to(q(".amb-flash"), { opacity: 0.55, duration: 0.03 }, t);
        tl.to(q(".amb-flash"), { opacity: 0, duration: 0.35, ease: "power2.out" }, t + 0.04);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
