  <script>
    (function () {
      const ID = "s11-giro";
      const DUR = 5.88;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const els = (s) => (typeof s === "string" ? qa(s) : [].concat(s));
      const tl = gsap.timeline({ paused: true });
      // un trazo que se dibuja (opacity 0 hasta que arranca: nada de puntitos de los caps)
      const dibujar = (s, t, d) => els(s).forEach((el) => {
        const L = el.getTotalLength() + 2;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote
      const pop = (s, t, de) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0, scale: 0.6 }, de || {}), { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe como un sello o una palabra gigante
      const golpe = (s, t, esc, rot) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0, rotation: rot || 0 });
        tl.fromTo(el, { opacity: 0, scale: esc || 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.08);
      });
      const sacudon = (t, f) => {
        f = f || 1;
        [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s11-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      // se escribe de izquierda a derecha
      const escribir = (s, t, d) => els(s).forEach((el) => {
        gsap.set(el, { clipPath: "inset(-30% 100% -30% 0%)" });
        tl.to(el, { clipPath: "inset(-30% 0% -30% 0%)", duration: d || 0.5, ease: "none" }, t);
      });
      // la boca del youtuber se mueve mientras habla (patrón fijo, determinista)
      const PASOS = [0.11, 0.15, 0.12, 0.17, 0.1, 0.14];
      const hablar = (raiz, t0, t1) => {
        const a = qa(raiz + " .yt-ba"), c = qa(raiz + " .yt-bc");
        let t = t0, k = 0, abierta = false;
        while (t < t1) { abierta = !abierta; tl.set(a, { opacity: abierta ? 1 : 0 }, t); tl.set(c, { opacity: abierta ? 0 : 1 }, t); t += PASOS[k++ % PASOS.length]; }
        tl.set(a, { opacity: 0 }, t1); tl.set(c, { opacity: 1 }, t1);
      };
      const parpadeo = (raiz, t) => qa(raiz + " .yt-ojo, " + raiz + " .ag-ojo").forEach((o) => {
        tl.to(o, { scaleY: 0.12, smoothOrigin: false, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t);
      });

      const ROBOT = 0.64, FRIO = 0.91, MARQUE = 2.09, UNO = 2.82, Y = 3.54, MEJOR = 4.21;
      pop(".s11-lab1", 0.0, { y: 20 });
      gsap.set(q(".s11-robot"), { opacity: 0 });
      tl.fromTo(q(".s11-robot"), { opacity: 0, y: -260 }, { opacity: 1, y: 0, duration: 0.4, ease: "bounce.out", immediateRender: false }, ROBOT - 0.45);
      qa(".s11-copo").forEach((c, i) => pop(c, FRIO + i * 0.08));
      tl.to(qa(".s11-copo"), { rotation: 60, duration: 1.6, ease: "none", smoothOrigin: false, transformOrigin: "50% 50%" }, FRIO);
      // "marque uno, dos, tres" y glitch
      [[".s11-m1", ".s11-m2", MARQUE + 0.2], [".s11-m2", ".s11-m3", MARQUE + 0.45], [".s11-m3", ".s11-m1", MARQUE + 0.7], [".s11-m1", ".s11-m2", MARQUE + 0.95]].forEach(([a, b, t]) => { tl.set(q(a), { opacity: 0 }, t); tl.set(q(b), { opacity: 1 }, t); });
      tl.to(q(".s11-robot"), { x: 10, duration: 0.04, yoyo: true, repeat: 7, ease: "none" }, UNO);
      dibujar(".s11-x", Y - 0.3, 0.2);
      tl.to(q(".s11-robot"), { x: -720, rotation: -70, smoothOrigin: false, transformOrigin: "50% 100%", opacity: 0, duration: 0.5, ease: "power2.in" }, Y + 0.05);
      tl.to(qa(".s11-copo"), { opacity: 0, duration: 0.2 }, Y);
      tl.to(q(".s11-lab1"), { opacity: 0, duration: 0.1 }, Y);
      pop(".s11-lab2", Y + 0.05, { y: 20 });
      // el agente: el mejor empleado del local
      gsap.set(q(".s11-ag"), { opacity: 0 });
      tl.fromTo(q(".s11-ag"), { opacity: 0, scale: 0.2, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, smoothOrigin: false, transformOrigin: "50% 50%", duration: 0.45, ease: "back.out(2)", immediateRender: false }, Y + 0.3);
      tl.to(q(".s11-ag"), { y: -16, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, MEJOR + 0.3);
      parpadeo(".s11-ag", 5.2);
      gsap.set(q(".s11-esc"), { opacity: 0 });
      tl.fromTo(q(".s11-esc"), { opacity: 0, scale: 2.5, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, smoothOrigin: false, transformOrigin: "50% 50%", duration: 0.18, ease: "power4.in", immediateRender: false }, MEJOR - 0.1);
      golpe(".s11-mejor", MEJOR + 0.1, 2.4, -5);
      sacudon(MEJOR + 0.15, 1.2);
      qa(".s11-pp").forEach((p) => {
        gsap.set(p, { opacity: 0 });
        tl.fromTo(p, { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: +p.dataset.x * 1.3, y: +p.dataset.y * 1.3 + 140, rotation: +p.dataset.r * 6, duration: 1.2, ease: "power2.out", immediateRender: false }, MEJOR);
      });
  
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(8px)", y: -50, duration: 0.22, ease: "power3.in" }, DUR - 0.22);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
