  <script>
    (function () {
      const ID = "s15-cta";
      const DUR = 6.61;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const els = (s) => (typeof s === "string" ? qa(s) : [].concat(s));
      const tl = gsap.timeline({ paused: true });
      // un trazo que se dibuja (opacity 0 hasta que arranca: nada de puntitos de los caps)
      const dibujar = (s, t, d) => els(s).forEach((el) => {
        const L = el.getTotalLength() + 2;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote
      const pop = (s, t, de) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0, scale: 0.6 }, de || {}), { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe como un sello o una palabra gigante
      const golpe = (s, t, esc, rot) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0, rotation: rot || 0 });
        tl.fromTo(el, { opacity: 0, scale: esc || 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.08);
      });
      const sacudon = (t, f) => {
        f = f || 1;
        [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s15-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      // se escribe de izquierda a derecha
      const escribir = (s, t, d) => els(s).forEach((el) => {
        gsap.set(el, { clipPath: "inset(-30% 100% -30% 0%)" });
        tl.to(el, { clipPath: "inset(-30% 0% -30% 0%)", duration: d || 0.5, ease: "none" }, t);
      });
      // la boca del youtuber se mueve mientras habla (patrón fijo, determinista)
      const PASOS = [0.11, 0.15, 0.12, 0.17, 0.1, 0.14];
      const hablar = (raiz, t0, t1) => {
        const a = qa(raiz + " .yt-ba"), c = qa(raiz + " .yt-bc");
        let t = t0, k = 0, abierta = false;
        while (t < t1) { abierta = !abierta; tl.set(a, { opacity: abierta ? 1 : 0 }, t); tl.set(c, { opacity: abierta ? 0 : 1 }, t); t += PASOS[k++ % PASOS.length]; }
        tl.set(a, { opacity: 0 }, t1); tl.set(c, { opacity: 1 }, t1);
      };
      const parpadeo = (raiz, t) => qa(raiz + " .yt-ojo, " + raiz + " .ag-ojo").forEach((o) => {
        tl.to(o, { scaleY: 0.12, smoothOrigin: false, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t);
      });

      const ESTRELLAS = 0.4, DAS = 0.9, COMENTA = 1.83, UNO = 2.7, CINCO = 3.0;
      golpe(".s15-a", 0.05, 1.8);
      golpe(".s15-b", DAS - 0.1, 2.4, -3);
      sacudon(DAS, 1);
      // las estrellas se prenden de a una, en loop finito hasta el final
      const es = qa(".s15-e");
      es.forEach((e) => gsap.set(e, { opacity: 0 }));
      let t = ESTRELLAS;
      while (t < DUR - 1.2) {
        es.forEach((e, i) => tl.fromTo(e, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, smoothOrigin: false, transformOrigin: "50% 50%", duration: 0.14, ease: "back.out(2)", immediateRender: false }, t + i * 0.18));
        tl.to(es, { opacity: 0, duration: 0.18 }, t + 5 * 0.18 + 0.4);
        t += 5 * 0.18 + 0.7;
      }
      tl.to(es, { opacity: 1, duration: 0.15, stagger: 0.08 }, t);
      qa(".s15-n").forEach((n, i) => pop(n, UNO - 0.2 + i * 0.1, { y: 20 }));
      pop(".s15-com", COMENTA - 0.1, { y: 40 });
      gsap.set(q(".s15-tx"), { opacity: 0 });
      tl.set(q(".s15-ph"), { opacity: 0 }, CINCO + 0.2);
      tl.set(q(".s15-tx"), { opacity: 1 }, CINCO + 0.2);
      escribir(".s15-tx", CINCO + 0.2, 0.9);
      tl.fromTo(q(".s15-car"), { x: -330 }, { x: 75, duration: 0.9, ease: "none" }, CINCO + 0.2);
      tl.to(q(".s15-car"), { opacity: 0, duration: 0.25, yoyo: true, repeat: 9, ease: "steps(1)" }, 1.8);
      dibujar(".s15-fl", COMENTA + 0.3, 0.3);

      window.__timelines = window.__timelines || {};
