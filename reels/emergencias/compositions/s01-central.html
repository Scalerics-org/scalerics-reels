<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-central"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-central"] .s01-escenario { position: absolute; inset: 0; }
    [data-composition-id="s01-central"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-central"] .lin { fill: none; stroke: #3fd6e0; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-central"] .s01-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; }
    [data-composition-id="s01-central"] .s01-grande { top: 1250px; font-weight: 900; font-size: 118px; letter-spacing: -0.02em; color: #ffb020; text-shadow: 0 0 30px rgba(255, 176, 32, 0.35); }
    [data-composition-id="s01-central"] .s01-linea { top: 1392px; } [data-composition-id="s01-central"] .s01-linea b { display: inline-block; padding: 8px 22px; background: #ff4d4d; color: #e8f4f6; border-radius: 10px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 34px; letter-spacing: 0.12em; }
  </style>
  <div id="root" data-composition-id="s01-central" data-width="1080" data-height="1920" data-duration="2.34">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="2.34" data-track-index="0">
      <div class="s01-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- ondas de llamada entrante -->
          <g class="s01-ondas" fill="none" stroke="#3fd6e0" stroke-width="4">
            <circle class="s01-o" cx="540" cy="930" r="250" /><circle class="s01-o" cx="540" cy="930" r="250" /><circle class="s01-o" cx="540" cy="930" r="250" />
          </g>
          <!-- consola: auriculares con micrófono -->
          <g class="s01-auri">
            <path class="lin s01-d" d="M330 980 C330 700 750 700 750 980" stroke-width="16" />
            <rect class="s01-copa" x="282" y="930" width="112" height="190" rx="46" fill="#072630" stroke="#3fd6e0" stroke-width="7" />
            <rect class="s01-copa" x="686" y="930" width="112" height="190" rx="46" fill="#072630" stroke="#3fd6e0" stroke-width="7" />
            <path class="lin s01-d" d="M338 1110 C360 1210 450 1220 520 1210" stroke-width="10" />
            <rect class="s01-mic" x="508" y="1188" width="70" height="40" rx="20" fill="#ffb020" />
            <circle class="s01-led" cx="340" cy="1025" r="12" fill="#ff4d4d" />
          </g>
        </svg>
        <div class="s01-txt s01-grande">Emergencias</div>
        <div class="s01-txt s01-linea"><b>LÍNEA 1 · ENTRANTE</b></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-central";
      const DUR = 2.34;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const dibujar = (el, t, d = 0.6, desde = 1) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * desde, opacity: desde >= 1 ? 0 : 1 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const pop = (el, t, s = 0.85) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t); };

      const CUAL = 0.96;
      // cuadro 0: el arco a medio dibujar, las copas ya están
      qa(".s01-d").forEach((p, i) => dibujar(p, 0, 0.45, i === 0 ? 0.5 : 1));
      tl.fromTo(qa(".s01-copa"), { scale: 0.9, opacity: 0.6, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0);
      pop(q(".s01-mic"), 0.3);
      tl.fromTo(q(".s01-escenario"), { scale: 1.06 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);
      // "Emergencias": entra de golpe
      tl.fromTo(q(".s01-grande"), { opacity: 0.4, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.in" }, 0);
      // led y ondas: llamada entrante
      tl.fromTo(q(".s01-led"), { opacity: 1 }, { opacity: 0.2, duration: 0.15, yoyo: true, repeat: 7, ease: "steps(1)" }, 0.1);
      qa(".s01-o").forEach((o, i) => {
        gsap.set(o, { opacity: 0 });
        tl.fromTo(o, { opacity: 0.7, scale: 1, svgOrigin: "540 930" }, { opacity: 0, scale: 1.7, svgOrigin: "540 930", duration: 1.1, ease: "power1.out", immediateRender: false }, 0.15 + i * 0.45);
      });
      // "¿cuál es su emergencia?": la línea se marca
      pop(q(".s01-linea"), CUAL - 0.1, 0.6);
      tl.to(q(".s01-auri"), { y: -10, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, CUAL);

      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
