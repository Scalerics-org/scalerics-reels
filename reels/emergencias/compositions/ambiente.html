<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    /* mapa del barrio en líneas cian, muy tenue, que se desliza */
    [data-composition-id="ambiente"] .amb-mapa { position: absolute; left: -200px; top: 460px; width: 1480px; height: 1200px; opacity: 0.1; }
    /* barrido de radar */
    [data-composition-id="ambiente"] .amb-radar { position: absolute; left: 40px; top: 500px; width: 1000px; height: 1000px; border-radius: 50%; opacity: 0.5;
      background: conic-gradient(from 0deg, rgba(63, 214, 224, 0) 0deg, rgba(63, 214, 224, 0) 300deg, rgba(63, 214, 224, 0.13) 360deg); }
    [data-composition-id="ambiente"] .amb-anillos { position: absolute; left: 40px; top: 500px; width: 1000px; height: 1000px; opacity: 0.12; }
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 760px 1100px at 540px 960px, rgba(3, 18, 26, 0) 52%, rgba(3, 18, 26, 0.92) 100%); }
    /* balizas ámbar y alarma roja */
    [data-composition-id="ambiente"] .amb-baliza { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 560px 560px at 0% 0%, rgba(255, 176, 32, 0.42), rgba(255, 176, 32, 0) 70%), radial-gradient(ellipse 560px 560px at 100% 100%, rgba(255, 176, 32, 0.42), rgba(255, 176, 32, 0) 70%); }
    [data-composition-id="ambiente"] .amb-baliza-b { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 560px 560px at 100% 0%, rgba(255, 176, 32, 0.42), rgba(255, 176, 32, 0) 70%), radial-gradient(ellipse 560px 560px at 0% 100%, rgba(255, 176, 32, 0.42), rgba(255, 176, 32, 0) 70%); }
    [data-composition-id="ambiente"] .amb-alarma { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 620px 620px at 0% 0%, rgba(255, 77, 77, 0.42), rgba(255, 77, 77, 0) 70%), radial-gradient(ellipse 620px 620px at 100% 100%, rgba(255, 77, 77, 0.42), rgba(255, 77, 77, 0) 70%); }
    [data-composition-id="ambiente"] .amb-verde { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 700px 600px at 540px 1000px, rgba(92, 230, 17, 0.12), rgba(92, 230, 17, 0) 70%); }
    /* barra de la central */
    [data-composition-id="ambiente"] .amb-barra { position: absolute; left: 60px; top: 116px; height: 76px; display: flex; white-space: nowrap; border-radius: 12px; overflow: hidden; border: 3px solid #3fd6e0; }
    [data-composition-id="ambiente"] .amb-barra > div { display: flex; align-items: center; padding: 0 20px; font-family: "Lexend", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 26px; letter-spacing: 0.04em; }
    [data-composition-id="ambiente"] .amb-curso { background: #c92f2f; color: #e8f4f6; gap: 10px; position: relative; }
    [data-composition-id="ambiente"] .amb-punto { width: 14px; height: 14px; border-radius: 50%; background: #e8f4f6; }
    [data-composition-id="ambiente"] .amb-central { background: #072630; color: #3fd6e0; }
    [data-composition-id="ambiente"] .amb-reloj { background: #03121a; color: #ffb020; font-family: "IBM Plex Mono", monospace !important; font-weight: 500 !important; font-size: 32px !important; letter-spacing: 0.06em !important; }
    [data-composition-id="ambiente"] .amb-ok { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; background: #5ce611; color: #03121a; opacity: 0; }
    /* onda de la llamada y quién habla */
    [data-composition-id="ambiente"] .amb-onda { position: absolute; left: 60px; top: 1540px; width: 960px; height: 84px; }
    [data-composition-id="ambiente"] .amb-onda i { position: absolute; top: 0; width: 10px; height: 84px; border-radius: 5px; background: currentColor; transform: scaleY(0.08); }
    [data-composition-id="ambiente"] .amb-quien { position: absolute; left: 60px; top: 1640px; height: 40px; width: 700px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-quien span { position: absolute; left: 0; top: 0; opacity: 0; }
    [data-composition-id="ambiente"] .amb-canal { position: absolute; right: 60px; top: 1640px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.16em; color: #3fd6e0; opacity: 0.6; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="70.79">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="70.79" data-track-index="0">
      <svg class="amb-mapa" viewBox="0 0 1480 1200" aria-hidden="true" fill="none" stroke="#3fd6e0" stroke-linecap="round">
        <g stroke-width="10">
          <path d="M0 180 H1480 M0 520 H1480 M0 880 H1480 M180 0 V1200 M560 0 V1200 M940 0 V1200 M1320 0 V1200" />
        </g>
        <g stroke-width="4">
          <path d="M0 350 H1480 M0 700 H1480 M0 1050 H1480 M370 0 V1200 M750 0 V1200 M1130 0 V1200" />
          <path d="M0 1200 L1480 60" />
          <path d="M60 0 C200 300 120 700 300 1200" />
        </g>
      </svg>
      <div class="amb-radar"></div>
      <svg class="amb-anillos" viewBox="0 0 1000 1000" aria-hidden="true" fill="none" stroke="#3fd6e0" stroke-width="3">
        <circle cx="500" cy="500" r="490" /><circle cx="500" cy="500" r="340" /><circle cx="500" cy="500" r="190" />
        <path d="M500 10 V990 M10 500 H990" stroke-dasharray="6 14" />
      </svg>
      <div class="amb-vineta"></div>
      <div class="amb-baliza"></div>
      <div class="amb-baliza-b"></div>
      <div class="amb-alarma"></div>
      <div class="amb-verde"></div>
      <div class="amb-barra">
        <div class="amb-curso"><span class="amb-punto"></span><span class="amb-txt-curso">En curso</span><div class="amb-ok"><span>Resuelto</span></div></div>
        <div class="amb-central"><span>Central · Despacho</span></div>
        <div class="amb-reloj"><span class="amb-num">00:00</span></div>
      </div>
      <div class="amb-onda"></div>
      <div class="amb-quien" data-layout-ignore>
        <span class="amb-q-OPE" style="color:#3fd6e0">● Operadora</span>
        <span class="amb-q-LLA" style="color:#ffb020">● Llamador</span>
        <span class="amb-q-PAT" style="color:#e8f4f6">● Unidad 4</span>
        <span class="amb-q-ORUS" style="color:#5ce611">● Scalerics</span>
      </div>
      <div class="amb-canal" data-layout-ignore>CANAL 4 · NOCHE</div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 70.79;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // quién habla (segundos globales, de la locución)
      const TURNOS = [["OPE", 0, 1.333], ["LLA", 2.34, 6.611], ["OPE", 7.242, 9.695], ["LLA", 10.319, 13.425], ["OPE", 14.199, 18.067], ["LLA", 18.631, 24.592], ["OPE", 25.454, 27.435], ["LLA", 28.068, 32.01], ["OPE", 33.341, 34.944], ["PAT", 35.617, 41.798], ["OPE", 42.365, 43.015], ["PAT", 43.686, 52.614], ["ORUS", 53.288, 63.734], ["ORUS", 64.411, 67.335]];
      const COLOR = { OPE: "#3fd6e0", LLA: "#ffb020", PAT: "#e8f4f6", ORUS: "#5ce611" };
      const NO_RESPIRA = 12.83, OCUPADO = 28.07, GOMERIA = 31.91, DESPACHO = 14.2, LLEGAMOS = 35.62, DESTRABAMOS = 54.27;

      // onda de la llamada: 64 barras, del color de quien habla
      const onda = q(".amb-onda");
      const N = 64, barras = [];
      for (let i = 0; i < N; i++) { const b = document.createElement("i"); b.style.left = (i * 15) + "px"; onda.appendChild(b); barras.push(b); }
      const num = q(".amb-num");
      const reloj = (t) => { const s = Math.floor(Math.min(t, 53.29)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
      const turno = (t) => TURNOS.find(([, a, b]) => t >= a - 0.05 && t <= b + 0.3);
      let ultimo = null;
      const o = { t: 0 };
      const pintar = () => {
        const t = o.t;
        num.textContent = reloj(t);
        const tu = turno(t);
        const col = tu ? COLOR[tu[0]] : "#3fd6e0";
        onda.style.color = col;
        for (let i = 0; i < N; i++) {
          const x = i / N;
          const env = Math.sin(Math.PI * x) * 0.85 + 0.15;
          const v = tu ? Math.abs(Math.sin(t * 13.1 + i * 0.71) * Math.sin(t * 5.3 + i * 0.37 + 1.3)) * env : 0;
          barras[i].style.transform = "scaleY(" + (0.07 + v * 0.93).toFixed(3) + ")";
        }
        const quien = tu ? tu[0] : ultimo;
        if (quien !== ultimo) ultimo = quien;
        for (const k of ["OPE", "LLA", "PAT", "ORUS"]) q(".amb-q-" + k).style.opacity = k === quien ? (tu ? 1 : 0.45) : 0;
      };
      pintar();
      tl.fromTo(o, { t: 0 }, { t: DUR, duration: DUR, ease: "none", immediateRender: false, onUpdate: pintar }, 0);

      // mapa y radar
      tl.fromTo(q(".amb-mapa"), { x: 0, y: 0 }, { x: -180, y: -60, duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".amb-radar"), { rotation: 0 }, { rotation: 360 * 14, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);
      // el punto rojo de "en curso" titila
      tl.fromTo(q(".amb-punto"), { opacity: 1 }, { opacity: 0.25, duration: 0.5, yoyo: true, repeat: Math.floor(53 / 0.5), ease: "steps(1)" }, 0);

      // alarma roja: "no respira", "ocupado", "gomería"
      [NO_RESPIRA, OCUPADO, GOMERIA].forEach((t) => tl.to(q(".amb-alarma"), { opacity: 1, duration: 0.1, yoyo: true, repeat: 3, ease: "steps(1)" }, t - 0.02));
      // balizas ámbar: despacho y llegada de la unidad (alternan las dos diagonales)
      [[DESPACHO, 4.2], [LLEGAMOS, 3.2]].forEach(([t, d]) => {
        const n = Math.floor(d / 0.4);
        for (let k = 0; k < n; k++) {
          const cap = k % 2 ? ".amb-baliza-b" : ".amb-baliza";
          tl.to(q(cap), { opacity: 1, duration: 0.06 }, t + k * 0.4);
          tl.to(q(cap), { opacity: 0, duration: 0.3 }, t + k * 0.4 + 0.12);
        }
      });
      // entra Scalerics: la llamada se resuelve, el cronómetro para, brillo verde
      tl.to(q(".amb-ok"), { opacity: 1, duration: 0.2 }, DESTRABAMOS);
      tl.to([q(".amb-txt-curso"), q(".amb-punto")], { opacity: 0, duration: 0.1 }, DESTRABAMOS);
      tl.to(q(".amb-barra"), { borderColor: "#5ce611", duration: 0.2 }, DESTRABAMOS);
      tl.to(q(".amb-reloj"), { color: "#5ce611", duration: 0.2 }, DESTRABAMOS);
      tl.to(q(".amb-verde"), { opacity: 1, duration: 0.8 }, DESTRABAMOS);
      tl.to(q(".amb-radar"), { opacity: 0.2, duration: 0.8 }, DESTRABAMOS);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
