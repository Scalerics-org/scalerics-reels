      const ID = "s05-pensalo";

      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {

          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });

      };
      const pop = (el, t, s0) => tl.fromTo(el, { opacity: 0, scale: s0 ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.6)" }, t);

      const aparecer = (el, t, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d ?? 0.3 }, t);
      const etq = (k, t) => {
        if (k > 1) tl.to(q(".s05-e" + (k - 1)), { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(q(".s05-e" + k), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      // tarjeta: se dibuja y se escriben sus textos

        dibujar(qa("." + c + "-l"), t, dur ?? 0.55, desde);
        qa("." + c + "-txt").forEach((el, i) => aparecer(el, Math.max(0, t + 0.25 + i * 0.1), 0.25));
        const m = q("." + c + "-man"); if (m) aparecer(m, Math.max(0, t + 0.45), 0.25);
      };

      const X = [210, 540, 870];
      ["a", "b", "c"].forEach((k, i) => gsap.set(q(".s05-" + k), { x: X[i], y: 830, scale: 0.85, svgOrigin: "0 0" }));
