  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 77.82;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const TURNOS = [[0,"l"],[14.45,"c"],[16.62,"l"],[22.45,"c"],[24.9,"d"],[27.68,"l"],[38.65,"c"],[40.58,"d"],[43.36,"l"],[49.39,"o"],[62.77,"l"],[65.51,"c"],[67.05,"l"],[70.87,"o"]];

      const FLASHES = [49.91, 65.51];
      const SCALERICS = 49.91;
      const GANADORAS = 68.85;

      // luces de marquesina alrededor del cartel
      const luces = q(".am-luces");
      let html = "";
      for (let k = 0; k < 17; k++) html += `<div class="am-luz am-lz${k % 2}" style="left:${150 + k * 48}px;top:30px"></div><div class="am-luz am-lz${(k + 1) % 2}" style="left:${150 + k * 48}px;top:196px"></div>`;

      const veces = Math.floor(DUR / 0.5);
      tl.fromTo(qa(".am-lz0"), { opacity: 1 }, { opacity: 0.25, duration: 0.25, yoyo: true, repeat: veces * 2 - 1, ease: "steps(1)" }, 0);

      const CH = { l: ".am-chl", c: ".am-chc", d: ".am-chd", o: ".am-cho" };
      let ant = null;
      TURNOS.forEach(([t, quien]) => {
        const el = q(CH[quien]);
        if (ant && ant !== el) tl.to(ant, { opacity: 0, x: -30, duration: 0.12, ease: "power2.in" }, t - 0.12);
        if (ant !== el) tl.fromTo(el, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(2.2)", immediateRender: false }, Math.max(0, t));
