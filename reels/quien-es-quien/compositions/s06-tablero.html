<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/caritas.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-tablero"] .s06-capa { position: absolute; inset: 0; }
    [data-composition-id="s06-tablero"] .s06-escenario { position: absolute; inset: 0; }
    /* el tablero rojo de plástico con 9 marcos */
    [data-composition-id="s06-tablero"] .s06-tablero { position: absolute; left: 80px; top: 590px; width: 920px; height: 960px; border-radius: 40px; background: #e63946; border: 8px solid #14182b; box-shadow: 0 18px 0 #14182b; perspective: 1400px; }
    [data-composition-id="s06-tablero"] .s06-celda { position: absolute; width: 270px; height: 300px; }
    [data-composition-id="s06-tablero"] .s06-marco { position: absolute; left: 0; top: 0; width: 270px; height: 300px; border-radius: 18px; background: #fbf3e0; border: 6px solid #14182b; }
    [data-composition-id="s06-tablero"] .s06-cara { position: absolute; left: 34px; top: 10px; width: 190px; height: 202px; }
    [data-composition-id="s06-tablero"] .s06-placa { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 66px; border-radius: 10px; background: #ffc928; border: 5px solid #14182b; display: flex; align-items: center; justify-content: center; text-align: center; font-family: "Lexend", sans-serif; font-weight: 800; font-size: 25px; line-height: 1; color: #14182b; white-space: nowrap; }
    [data-composition-id="s06-tablero"] .s06-aro { position: absolute; left: -18px; top: -18px; width: 294px; height: 324px; border-radius: 28px; border: 10px solid #ffc928; box-shadow: 0 0 0 6px #14182b; opacity: 0; }
    [data-composition-id="s06-tablero"] .s06-baja { position: absolute; left: 0; right: 0; top: 1572px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 92px; line-height: 1; color: #ffc928; -webkit-text-stroke: 7px #14182b; paint-order: stroke fill; text-shadow: 0 9px 0 #14182b; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s06-tablero" data-width="1080" data-height="1920" data-duration="5.14">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="5.14" data-track-index="0">
      <div class="s06-escenario">
        <div class="s06-tablero"></div>
        <div class="s06-baja">¡BAJÁ CARITAS!</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-tablero";
      const DUR = 5.14;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const BAJA = 0.2;
      const OBRA = 2.06;
      const CALEFON = 3.22;
      const GOMEZ = 4.06;

      // 3x3: tipo, plaquita
      const CARTAS = [
        ["obra", "EL DE LA OBRA"], ["gomez", "GÓMEZ"], ["bano", "LA DEL BAÑO"],
        ["calefon", "LA DEL CALEFÓN"], ["regatea", "EL QUE REGATEA"], ["gomez", "GÓMEZ"],
        ["perro", "EL DEL PERRO"], ["gomez", "GÓMEZ"], ["senora", "LA SEÑORA"],
      ];
      const celdas = CARTAS.map(([t, n], i) => {
        const c = document.createElement("div");
        c.className = "s06-celda";
        c.style.left = 26 + (i % 3) * 296 + "px";
        c.style.top = 22 + Math.floor(i / 3) * 314 + "px";
        c.innerHTML = '<div class="s06-aro"></div><div class="s06-marco"><div class="s06-cara">' + QQ.carita(t) + '</div><div class="s06-placa">' + n + "</div></div>";
        q(".s06-tablero").appendChild(c);
        return c;
      });
      const marco = (i) => celdas[i].querySelector(".s06-marco");
      const aro = (i) => celdas[i].querySelector(".s06-aro");

      // entrada: el tablero sube y las caritas se paran en cascada
      tl.fromTo(q(".s06-tablero"), { y: 120, scale: 0.92, opacity: 0.5 }, { y: 0, scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 0);
      celdas.forEach((c, i) => {
        gsap.set(marco(i), { rotationX: -70, transformOrigin: "50% 100%" });
        tl.to(marco(i), { rotationX: 0, duration: 0.25, ease: "back.out(2.4)" }, 0.05 + i * 0.04);
      });

      // "¡Bajá caritas!": cartel y caen dos al azar (del perro y la del baño)
      gsap.set(q(".s06-baja"), { opacity: 0 });
      tl.fromTo(q(".s06-baja"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, BAJA + 0.3);
      [[6, 0.65], [2, 0.85]].forEach(([i, t]) => tl.to(marco(i), { rotationX: -84, duration: 0.25, ease: "power3.in" }, BAJA + t));
      [[-12, 6], [10, -5], [-4, 2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s06-escenario"), { x, y, duration: 0.04, ease: "none" }, BAJA + 0.45 + i * 0.045));

      // cada candidato se ilumina en su palabra: obra, calefón, Gómez (los tres)
      const marcar = (idx, t) => {
        idx.forEach((i) => {
          tl.fromTo(aro(i), { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power3.out" }, t);
          tl.to(celdas[i], { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
          tl.to(aro(i), { opacity: 0, duration: 0.2 }, t + 0.6);
        });
      };
      marcar([0], OBRA);
      marcar([3], CALEFON);
      marcar([1, 5, 7], GOMEZ);
      tl.to(q(".s06-tablero"), { rotation: -1, duration: 1.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1);

      tl.to(q("#s06-escena"), { opacity: 0, scale: 0.96, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
