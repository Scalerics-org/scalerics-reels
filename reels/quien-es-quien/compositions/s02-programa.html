<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/caritas.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-programa"] .s02-capa { position: absolute; inset: 0; }
    [data-composition-id="s02-programa"] .s02-escenario { position: absolute; inset: 0; }
    /* el cartel del programa: placa roja con borde de lamparitas */
    [data-composition-id="s02-programa"] .s02-cartel { position: absolute; left: 90px; top: 640px; width: 900px; height: 440px; border-radius: 40px; background: #e63946; border: 8px solid #14182b; box-shadow: 0 18px 0 #14182b; }
    [data-composition-id="s02-programa"] .s02-lamp { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #ffc928; border: 3px solid #14182b; }
    [data-composition-id="s02-programa"] .s02-t1, [data-composition-id="s02-programa"] .s02-t2 { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; line-height: 1; letter-spacing: -0.02em; color: #ffc928; -webkit-text-stroke: 7px #14182b; paint-order: stroke fill; text-shadow: 0 10px 0 #14182b; white-space: nowrap; }
    [data-composition-id="s02-programa"] .s02-t1 { top: 70px; font-size: 140px; }
    [data-composition-id="s02-programa"] .s02-t2 { top: 230px; font-size: 140px; color: #fbf3e0; }
    [data-composition-id="s02-programa"] .s02-sub { position: absolute; left: 0; right: 0; top: 1130px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.3em; color: #ffc928; }
    /* fila de caritas debajo (el tablero que espera) */
    [data-composition-id="s02-programa"] .s02-fila { position: absolute; left: 110px; top: 1210px; width: 860px; height: 230px; perspective: 900px; }
    [data-composition-id="s02-programa"] .s02-marco { position: absolute; top: 0; width: 150px; height: 200px; border-radius: 16px; background: #2f5bea; border: 6px solid #14182b; box-shadow: 0 8px 0 #14182b; }
    [data-composition-id="s02-programa"] .s02-cara { position: absolute; left: 10px; top: 10px; width: 118px; height: 150px; border-radius: 10px; background: #fbf3e0; border: 4px solid #14182b; overflow: hidden; }
  </style>
  <div id="root" data-composition-id="s02-programa" data-width="1080" data-height="1920" data-duration="2.67">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="2.67" data-track-index="0">
      <div class="s02-escenario">
        <div class="s02-cartel">
          <div class="s02-lamps"></div>
          <div class="s02-t1">¿QUIÉN ES</div>
          <div class="s02-t2">QUIÉN?</div>
        </div>
        <div class="s02-sub">EL JUEGO DEL COMERCIANTE</div>
        <div class="s02-fila"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-programa";
      const DUR = 2.67;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const TITULO = 1.29; // "¿Quién es quién?"

      // lamparitas alrededor del cartel
      const lamps = q(".s02-lamps");
      const L = [];
      for (let i = 0; i < 11; i++) L.push([30 + i * 82, 14], [30 + i * 82, 394]);
      for (let i = 1; i < 5; i++) L.push([14, 14 + i * 76], [858, 14 + i * 76]);
      L.forEach(([x, y], i) => {
        const d = document.createElement("div");
        d.className = "s02-lamp";
        d.style.left = x + "px";
        d.style.top = y + "px";
        lamps.appendChild(d);
      });
      const bombitas = [...root.querySelectorAll(".s02-lamp")];
      for (let k = 0; k < DUR / 0.25; k++) bombitas.forEach((b, i) => tl.set(b, { opacity: (i + k) % 2 ? 1 : 0.35 }, k * 0.25));

      // caritas de la fila
      const tipos = ["obra", "calefon", "gomez", "regatea", "senora"];
      tipos.forEach((t, i) => {
        const m = document.createElement("div");
        m.className = "s02-marco";
        m.style.left = i * 176 + "px";
        m.innerHTML = '<div class="s02-cara">' + QQ.carita(t) + "</div>";
        q(".s02-fila").appendChild(m);
      });

      // entrada: el cartel cae desde arriba y rebota
      tl.fromTo(q(".s02-cartel"), { y: -200, scale: 0.8, opacity: 0.4 }, { y: 0, scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      gsap.set([q(".s02-t1"), q(".s02-t2")], { opacity: 0 });
      tl.fromTo(q(".s02-t1"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, TITULO - 0.1);
      tl.fromTo(q(".s02-t2"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, 1.97);
      [[-14, 7], [11, -5], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x, y, duration: 0.04, ease: "none" }, TITULO + 0.4 + i * 0.045));
      tl.to(q(".s02-cartel"), { rotation: 1.5, duration: 0.6, yoyo: true, repeat: 2, ease: "sine.inOut" }, TITULO + 0.6);
      gsap.set(q(".s02-sub"), { opacity: 0 });
      tl.fromTo(q(".s02-sub"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, TITULO + 0.7);

      // las caritas se levantan una por una (marcos que se paran)
      root.querySelectorAll(".s02-marco").forEach((m, i) => {
        gsap.set(m, { rotationX: -88, transformOrigin: "50% 100%" });
        tl.to(m, { rotationX: 0, duration: 0.3, ease: "back.out(2)" }, 0.15 + i * 0.12);
      });

      tl.to(q("#s02-escena"), { opacity: 0, scale: 0.96, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
