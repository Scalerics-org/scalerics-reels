<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/caritas.js"></script>
  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s07-gomez"] .s07-capa { position: absolute; inset: 0; }
    [data-composition-id="s07-gomez"] .s07-escenario { position: absolute; inset: 0; }

    [data-composition-id="s07-gomez"] .s07-tablero { position: absolute; left: 80px; top: 590px; width: 920px; height: 960px; border-radius: 40px; background: #e63946; border: 8px solid #14182b; box-shadow: 0 18px 0 #14182b; perspective: 1400px; }

    [data-composition-id="s07-gomez"] .s07-placa { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 66px; border-radius: 10px; background: #ffc928; border: 5px solid #14182b; display: flex; align-items: center; justify-content: center; text-align: center; font-family: "Lexend", sans-serif; font-weight: 800; font-size: 25px; line-height: 1; color: #14182b; white-space: nowrap; }
    [data-composition-id="s07-gomez"] .s07-aro { position: absolute; left: -18px; top: -18px; width: 294px; height: 324px; border-radius: 28px; border: 10px solid #ffc928; box-shadow: 0 0 0 6px #14182b; opacity: 0; }
    [data-composition-id="s07-gomez"] .s07-num { position: absolute; right: -16px; top: -16px; width: 84px; height: 84px; border-radius: 50%; background: #ffc928; border: 6px solid #14182b; box-shadow: 0 6px 0 #14182b; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 52px; line-height: 72px; color: #14182b; opacity: 0; }
    [data-composition-id="s07-gomez"] .s07-mano { position: absolute; left: 0; top: 0; width: 160px; height: 220px; opacity: 0; }
    [data-composition-id="s07-gomez"] .s07-baja { position: absolute; left: 0; right: 0; top: 1572px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 92px; line-height: 1; color: #ffc928; -webkit-text-stroke: 7px #14182b; paint-order: stroke fill; text-shadow: 0 9px 0 #14182b; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s07-gomez" data-width="1080" data-height="1920" data-duration="5.09">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="5.09" data-track-index="0">
      <div class="s07-escenario">
        <div class="s07-tablero"></div>
        <div class="s07-baja">¿CUÁL GÓMEZ?</div>
        <div class="s07-mano"><svg viewBox="0 0 160 220" width="100%" height="100%" aria-hidden="true"><path d="M58 210 v-70 q-30 -10 -34 -40 q0 -14 14 -10 l24 26 v-96 q0 -16 16 -16 q16 0 16 16 v60 q20 -8 30 4 q20 -6 26 10 q16 -2 18 14 v60 q0 30 -22 42 v20z" fill="#fbf3e0" stroke="#14182b" stroke-width="7" stroke-linejoin="round"/><path d="M58 186 h86" stroke="#2f5bea" stroke-width="16"/></svg></div>
      </div>

  <script>
    (function () {
      const ID = "s07-gomez";
      const DUR = 5.09;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const CUAL = 0.0;
      const TRES = 1.34;
      const BAJO = 2.25;
      const CALEFON = 3.91;

      const CARTAS = [
        ["obra", "EL DE LA OBRA"], ["gomez", "GÓMEZ"], ["bano", "LA DEL BAÑO"],
        ["calefon", "LA DEL CALEFÓN"], ["regatea", "EL QUE REGATEA"], ["gomez", "GÓMEZ"],
        ["perro", "EL DEL PERRO"], ["gomez", "GÓMEZ"], ["senora", "LA SEÑORA"],
      ];
      const celdas = CARTAS.map(([t, n], i) => {
        const c = document.createElement("div");
        c.className = "s07-celda";
        c.style.left = 26 + (i % 3) * 296 + "px";
        c.style.top = 22 + Math.floor(i / 3) * 314 + "px";
        c.innerHTML = '<div class="s07-aro"></div><div class="s07-marco"><div class="s07-cara">' + QQ.carita(t) + '</div><div class="s07-placa">' + n + '</div></div><div class="s07-num"></div>';
        q(".s07-tablero").appendChild(c);
        return c;
      });
      const marco = (i) => celdas[i].querySelector(".s07-marco");
      const aro = (i) => celdas[i].querySelector(".s07-aro");
      const num = (i) => celdas[i].querySelector(".s07-num");
      // vienen bajadas de la escena anterior: la del perro y la del baño
      [6, 2].forEach((i) => gsap.set(marco(i), { rotationX: -84, transformOrigin: "50% 100%" }));
      celdas.forEach((c, i) => gsap.set(marco(i), { transformOrigin: "50% 100%" }));

      // entrada: el tablero ya está (corte directo), un empujoncito
      tl.fromTo(q(".s07-tablero"), { scale: 1.04 }, { scale: 1, duration: 0.3, ease: "power2.out" }, 0);

      // "¿Cuál Gómez?": cartel; los tres Gómez se numeran 1, 2, 3
      gsap.set(q(".s07-baja"), { opacity: 0 });
      tl.fromTo(q(".s07-baja"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, CUAL + 0.05);
      [1, 5, 7].forEach((i, k) => {
        num(i).textContent = String(k + 1);
        const t = CUAL + 0.3 + k * ((TRES - CUAL) / 3);
        tl.fromTo(num(i), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(3)" }, t);
        tl.fromTo(aro(i), { opacity: 0 }, { opacity: 1, duration: 0.12 }, t);
        tl.to(celdas[i], { scale: 1.07, duration: 0.12, yoyo: true, repeat: 1 }, t);
      });
      [[-12, 6], [10, -5], [-4, 2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s07-escenario"), { x, y, duration: 0.04, ease: "none" }, TRES + i * 0.045));
      tl.to([aro(1), aro(5), aro(7), num(1), num(5), num(7), q(".s07-baja")], { opacity: 0, duration: 0.2 }, BAJO - 0.2);

      // "Bajo...": la mano duda entre caritas y empuja la del calefón
      const mano = q(".s07-mano");
      const pos = (i) => [80 + 26 + (i % 3) * 296 + 60, 590 + 22 + Math.floor(i / 3) * 314 + 40];
      const [x0, y0] = pos(0), [x4, y4] = pos(4), [x3, y3] = pos(3);
      tl.set(mano, { x: x4, y: y4 + 120 }, 0);
      tl.to(mano, { opacity: 1, duration: 0.15 }, BAJO);
      tl.to(mano, { x: x0, y: y0, duration: 0.4, ease: "sine.inOut" }, BAJO);
      tl.to(mano, { x: x4, y: y4, duration: 0.4, ease: "sine.inOut" }, BAJO + 0.4);
      tl.to(mano, { x: x3, y: y3 - 30, duration: 0.3, ease: "sine.inOut" }, BAJO + 0.8);
      tl.to(mano, { y: y3 + 30, duration: 0.12, ease: "power3.in" }, CALEFON - 0.1);
      tl.to(marco(3), { rotationX: -84, duration: 0.25, ease: "power3.in" }, CALEFON);
      tl.to(mano, { y: y3 + 200, opacity: 0, duration: 0.3, ease: "power2.in" }, CALEFON + 0.2);
      [[-14, 7], [11, -5], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s07-escenario"), { x, y, duration: 0.04, ease: "none" }, CALEFON + 0.2 + i * 0.045));

      tl.to(q("#s07-escena"), { opacity: 0, scale: 0.96, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
