<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/caritas.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s12-memoria"] .s12-capa { position: absolute; inset: 0; }
    [data-composition-id="s12-memoria"] .s12-escenario { position: absolute; inset: 0; }
    [data-composition-id="s12-memoria"] .s12-ram { position: absolute; left: 240px; top: 900px; width: 600px; height: 690px; }
    [data-composition-id="s12-memoria"] svg.s12-globo { position: absolute; left: 60px; top: 580px; width: 960px; height: 380px; overflow: visible; }
    [data-composition-id="s12-memoria"] .s12-txt { position: absolute; left: 0; right: 0; top: 690px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 72px; line-height: 1.05; color: #14182b; white-space: nowrap; }
    [data-composition-id="s12-memoria"] .s12-todos { color: #e63946; }
    [data-composition-id="s12-memoria"] .s12-ficha { position: absolute; width: 90px; height: 90px; border-radius: 50%; background: #ffc928; border: 6px solid #14182b; box-shadow: 0 6px 0 #14182b; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 58px; line-height: 78px; color: #14182b; }
  </style>
  <div id="root" data-composition-id="s12-memoria" data-width="1080" data-height="1920" data-duration="2.82">
    <div id="s12-escena" class="s12-capa clip" data-start="0" data-duration="2.82" data-track-index="0">
      <div class="s12-escenario">
        <svg class="s12-globo" viewBox="0 0 960 380" aria-hidden="true">
          <path d="M60 60 L180 90 L250 10 L330 80 L470 0 L540 80 L690 20 L730 90 L900 50 L850 160 L950 230 L820 260 L840 360 L690 300 L600 370 L520 300 L380 370 L330 300 L170 350 L190 270 L20 250 L110 170 Z" fill="#fbf3e0" stroke="#14182b" stroke-width="9" stroke-linejoin="round" />
        </svg>
        <div class="s12-txt">¡ME ACUERDO<br />DE <span class="s12-todos">TODOS</span>!</div>
        <div class="s12-ram"></div>
        <div class="s12-ficha" style="left: 90px; top: 1100px">?</div>
        <div class="s12-ficha" style="left: 880px; top: 1060px">?</div>
        <div class="s12-ficha" style="left: 150px; top: 1360px">?</div>
        <div class="s12-ficha" style="left: 860px; top: 1340px">?</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s12-memoria";
      const DUR = 2.82;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // golpe: aparece de golpe (escala grande -> 1) en t
      const golpe = (el, t, extra = {}) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: extra.desde || 2.3, rotation: extra.rot || 0 }, { opacity: 1, scale: 1, rotation: extra.rot || 0, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1); };
      // pop: aparece con rebote en t
      const pop = (el, t, extra = {}) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.6, y: extra.y || 0 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(2)", immediateRender: false }, t); };
      // sacudón del escenario en t
      const sacudon = (t, f = 1) => [[-14, 7], [11, -5], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s12-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

      q(".s12-ram").innerHTML = QQ.ramiro("grito");
      const ACUERDO = 0.48, TODOS = 0.95, CLIENTES = 1.43;
      tl.fromTo(q(".s12-ram"), { y: 300, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
      gsap.set([q(".s12-globo"), q(".s12-txt")], { transformOrigin: "50% 100%" });
      tl.fromTo([q(".s12-globo"), q(".s12-txt")], { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2.4)" }, 0.05);
      tl.fromTo(q(".s12-todos"), { scale: 1 }, { scale: 1.25, duration: 0.12, yoyo: true, repeat: 1 }, TODOS);
      sacudon(TODOS, 1.2);
      qa(".s12-ficha").forEach((f, i) => {
        pop(f, ACUERDO + i * 0.12);
        tl.to(f, { y: -30, rotation: i % 2 ? 20 : -20, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, ACUERDO + 0.3 + i * 0.12);
      });
      tl.to(q(".s12-ram"), { rotation: 3, transformOrigin: "50% 100%", duration: 0.1, yoyo: true, repeat: 7, ease: "none" }, CLIENTES);

      tl.to(q("#s12-escena"), { opacity: 0, scale: 0.96, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
