  <style>

    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s15-sabes"] .s15-nota { position: absolute; left: 152px; top: 102px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; color: #ffc928; white-space: nowrap; }
    [data-composition-id="s15-sabes"] .s15-viejo { position: absolute; left: 150px; top: 60px; font-family: "Lexend", sans-serif; font-weight: 700; font-size: 38px; color: #fbf3e0; white-space: nowrap; }

  <div id="root" data-composition-id="s15-sabes" data-width="1080" data-height="1920" data-duration="3.59">
    <div id="s15-escena" class="s15-capa clip" data-start="0" data-duration="3.59" data-track-index="0">
      <div class="s15-escenario">
        <div class="s15-cel">
          <div class="s15-barra"><div class="s15-ava"><div class="s15-av1" style="position:absolute;inset:0"></div><div class="s15-ava2" style="position:absolute;inset:0;background:#fbf3e0"></div></div><div class="s15-viejo">Cliente nuevo 3</div><div class="s15-tacha"></div><div class="s15-nombre">Silvia</div><div class="s15-nota">la del calefón</div></div>

  <script>
    (function () {
      const ID = "s15-sabes";
      const DUR = 3.59;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // golpe: aparece de golpe (escala grande -> 1) en t
      const golpe = (el, t, extra = {}) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: extra.desde || 2.3, rotation: extra.rot || 0 }, { opacity: 1, scale: 1, rotation: extra.rot || 0, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1); };
      // pop: aparece con rebote en t
      const pop = (el, t, extra = {}) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.6, y: extra.y || 0 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(2)", immediateRender: false }, t); };
      // sacudón del escenario en t
      const sacudon = (t, f = 1) => [[-14, 7], [11, -5], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s15-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

      q(".s15-av1").innerHTML = QQ.carita("misterio");
      q(".s15-ava2").innerHTML = QQ.carita("calefon");
      gsap.set(q(".s15-ava2"), { opacity: 0 });
      q(".s15-ram").innerHTML = QQ.ramiro("sonrisa");
      const ESCRIBE = 0.32, SILVIA = 0.58, SABES = 1.37, DEBES = 2.6;
      // el mismo mensaje del principio... pero ahora con nombre
      tl.fromTo(q(".s15-cel"), { y: 80, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
      pop(q(".s15-burb"), ESCRIBE - 0.1, { y: 30 });
      gsap.set([q(".s15-nombre"), q(".s15-nota")], { opacity: 0 });
      gsap.set(q(".s15-tacha"), { scaleX: 0, transformOrigin: "0% 50%" });
      tl.to(q(".s15-tacha"), { scaleX: 1, duration: 0.15 }, SILVIA - 0.15);
      tl.to([q(".s15-viejo"), q(".s15-tacha")], { opacity: 0, y: -30, duration: 0.15 }, SILVIA + 0.05);
      tl.fromTo(q(".s15-nombre"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2, ease: "back.out(2)", immediateRender: false }, SILVIA + 0.1);
      tl.fromTo(q(".s15-nota"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, immediateRender: false }, SILVIA + 0.25);
      // el avatar "?" se vuelve la cara de Silvia
      tl.to(q(".s15-ava"), { rotationY: 90, duration: 0.12 }, SILVIA);
      tl.set(q(".s15-ava2"), { opacity: 1 }, SILVIA + 0.12);
      tl.to(q(".s15-ava"), { rotationY: 0, duration: 0.12 }, SILVIA + 0.12);
      tl.fromTo(q(".s15-ram"), { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, SABES - 0.2);
      gsap.set(q(".s15-ram"), { opacity: 0 });
      tl.to(q(".s15-ram"), { y: -18, duration: 0.15, yoyo: true, repeat: 3 }, SABES + 0.2);
      golpe(q(".s15-debes"), DEBES, { rot: -2, desde: 1.8 });
      sacudon(DEBES + 0.05, 0.8);

      tl.to(q("#s15-escena"), { opacity: 0, scale: 0.96, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
