  <script>
    (function () {
      const ID = "s09-enfrente";
      const DUR = 4.32;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // golpe: aparece de golpe (escala grande -> 1) en t
      const golpe = (el, t, extra = {}) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: extra.desde || 2.3, rotation: extra.rot || 0 }, { opacity: 1, scale: 1, rotation: extra.rot || 0, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1); };
      // pop: aparece con rebote en t
      const pop = (el, t, extra = {}) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.6, y: extra.y || 0 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(2)", immediateRender: false }, t); };
      // sacudón del escenario en t
      const sacudon = (t, f = 1) => [[-14, 7], [11, -5], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s09-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

      q(".s09-ficha-cara").innerHTML = QQ.carita("calefon");
      const FUE = 1.6, FERRE = 2.05, ENFRENTE = 2.76;
      tl.fromTo(q(".s09-calle"), { y: 80, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
      golpe(q(".s09-uuh"), 0.1);
      tl.to(q(".s09-uuh"), { scale: 1.1, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.2);
      tl.to(q(".s09-uuh"), { opacity: 0, y: -40, duration: 0.25 }, FUE - 0.2);
      // la ficha de Silvia salta de una ferretería a la otra por la ruta
      const ruta = q(".s09-ruta"), L = ruta.getTotalLength(), f = q(".s09-ficha");
      const ubicar = (p) => { const pt = ruta.getPointAtLength(p * L); gsap.set(f, { x: pt.x - 85, y: pt.y - 230 - Math.abs(Math.sin(p * Math.PI * 4)) * 50 }); };
      const prog = { p: 0 };
      ubicar(0);
      gsap.set(ruta, { clipPath: "inset(0 100% 0 0)" });
      tl.to(ruta, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power2.inOut" }, FUE - 0.3);
      tl.to(prog, { p: 1, duration: ENFRENTE - FUE + 0.2, ease: "power1.inOut", onUpdate: () => ubicar(prog.p) }, FUE);
      tl.to(q(".s09-izq"), { opacity: 0.4, duration: 0.4 }, FERRE);
      tl.to(q(".s09-der"), { y: -14, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, ENFRENTE);
      sacudon(ENFRENTE + 0.1);
      golpe(q(".s09-rot"), ENFRENTE + 0.3, { desde: 1.6 });

      tl.to(q("#s09-escena"), { opacity: 0, scale: 0.96, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
