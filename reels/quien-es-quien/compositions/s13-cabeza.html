<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/caritas.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s13-cabeza"] .s13-capa { position: absolute; inset: 0; }
    [data-composition-id="s13-cabeza"] .s13-escenario { position: absolute; inset: 0; }
    [data-composition-id="s13-cabeza"] .s13-ram { position: absolute; left: 330px; top: 1120px; width: 420px; height: 483px; }
    [data-composition-id="s13-cabeza"] svg.s13-nube { position: absolute; left: 60px; top: 580px; width: 960px; height: 600px; overflow: visible; }
    [data-composition-id="s13-cabeza"] .s13-grilla { position: absolute; left: 150px; top: 745px; width: 780px; height: 420px; }
    [data-composition-id="s13-cabeza"] .s13-mini { position: absolute; width: 100px; height: 106px; border-radius: 12px; background: #fbf3e0; border: 4px solid #14182b; }
    [data-composition-id="s13-cabeza"] .s13-sello { position: absolute; left: 0; right: 0; top: 870px; text-align: center; }
    [data-composition-id="s13-cabeza"] .s13-sello span { display: inline-block; padding: 14px 34px; border-radius: 20px; background: #e63946; border: 8px solid #14182b; box-shadow: 0 10px 0 #14182b; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 84px; line-height: 1; color: #fbf3e0; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s13-cabeza" data-width="1080" data-height="1920" data-duration="4.77">
    <div id="s13-escena" class="s13-capa clip" data-start="0" data-duration="4.77" data-track-index="0">
      <div class="s13-escenario">
        <svg class="s13-nube" viewBox="0 0 960 600" aria-hidden="true">
          <path d="M120 470 C20 470 10 330 110 320 C60 200 200 120 280 180 C320 60 500 50 540 150 C610 60 790 90 790 210 C900 200 960 340 860 400 C910 500 780 560 700 500 C640 580 470 580 420 510 C340 570 180 560 120 470 Z" fill="#fbf3e0" stroke="#14182b" stroke-width="9" stroke-linejoin="round" />
          <circle cx="430" cy="560" r="22" fill="#fbf3e0" stroke="#14182b" stroke-width="7" />
          <circle cx="465" cy="600" r="12" fill="#fbf3e0" stroke="#14182b" stroke-width="6" />
        </svg>
        <div class="s13-grilla"></div>
        <div class="s13-ram"></div>
        <div class="s13-sello"><span>MEMORIA LLENA</span></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s13-cabeza";
      const DUR = 4.77;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // golpe: aparece de golpe (escala grande -> 1) en t
      const golpe = (el, t, extra = {}) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: extra.desde || 2.3, rotation: extra.rot || 0 }, { opacity: 1, scale: 1, rotation: extra.rot || 0, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1); };
      // pop: aparece con rebote en t
      const pop = (el, t, extra = {}) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.6, y: extra.y || 0 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(2)", immediateRender: false }, t); };
      // sacudón del escenario en t
      const sacudon = (t, f = 1) => [[-14, 7], [11, -5], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s13-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

      q(".s13-ram").innerHTML = QQ.ramiro("sonrisa");
      const ACUERDA = 0.18, PASA = 1.42, DEMASIADOS = 2.29, CLIENTES = 2.9, MEMORIA = 3.86;
      const tipos = ["obra", "gomez", "bano", "calefon", "regatea", "gomez", "perro", "senora", "primo", "gomez"];
      const g = q(".s13-grilla");
      const minis = [];
      for (let i = 0; i < 24; i++) {
        const m = document.createElement("div");
        m.className = "s13-mini";
        // grilla 7x3 apretada + 3 que desbordan encima
        const fila = Math.floor(i / 7), col = i % 7;
        const x = i < 21 ? 10 + col * 110 + (fila % 2) * 30 : 160 + (i - 21) * 220;
        const y = i < 21 ? 20 + fila * 112 : -110;
        m.style.left = x + "px";
        m.style.top = y + "px";
        m.innerHTML = QQ.carita(tipos[(i * 7) % tipos.length]);
        g.appendChild(m);
        minis.push(m);
      }
      tl.fromTo(q(".s13-ram"), { y: 260, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
      tl.to(q(".s13-ram"), { y: -16, duration: 0.18, yoyo: true, repeat: 1 }, ACUERDA + 0.2);
      gsap.set(q(".s13-nube"), { transformOrigin: "45% 100%" });
      pop(q(".s13-nube"), PASA - 0.3);
      // las caritas se amontonan cada vez más rápido
      minis.forEach((m, i) => {
        const t = PASA + (CLIENTES + 0.3 - PASA) * Math.pow(i / 23, 0.7);
        pop(m, t);
      });
      sacudon(DEMASIADOS, 0.8);
      // las de arriba desbordan y se caen
      minis.slice(21).forEach((m, k) => tl.to(m, { y: 900, rotation: k % 2 ? 50 : -40, duration: 0.7, ease: "power2.in" }, CLIENTES + 0.4 + k * 0.1));
      tl.to(q(".s13-grilla"), { x: 6, duration: 0.05, yoyo: true, repeat: 9, ease: "none" }, CLIENTES);
      golpe(q(".s13-sello"), MEMORIA, { rot: -4 });
      sacudon(MEMORIA + 0.05, 1.3);

      tl.to(q("#s13-escena"), { opacity: 0, scale: 0.96, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
