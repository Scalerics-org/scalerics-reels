      const dibujar = (els, t, dur, desde) => {

          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1 });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });

      const etq = (sel, t) => {
        if (etqAct) tl.to(etqAct, { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" }, t - 0.12);

        gsap.set(MM, { rotation: rel * 6, svgOrigin: "540 700" });

      const girar = (t, hasta, dur) => {
        tl.to(HH, { rotation: hasta * 0.5, svgOrigin: "540 700", duration: dur ?? 0.9, ease: "power2.inOut" }, t);
        tl.to(MM, { rotation: hasta * 6, svgOrigin: "540 700", duration: dur ?? 0.9, ease: "power2.inOut" }, t);
        rel = hasta;
      };
      let rotAct = null;
      const rotulo = (i, t) => {
        if (rotAct) tl.to(rotAct, { opacity: 0, duration: 0.18 }, t - 0.1);
        const el = q("." + P + "-rot-" + i);
        if (t <= 0) gsap.set(el, { opacity: 1 }); else tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);

      tl.fromTo(q(".s12-lib"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
