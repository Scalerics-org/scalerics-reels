    (function () {
      const ID = "s01-dos-panaderias";

      const REL0 = 120;

      const qa = (sel) => Array.from(root.querySelectorAll(sel));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1 });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, Math.max(0, t + i * 0.04));
        });
      };
      const pop = (el, t, s0) => tl.fromTo(el, { opacity: 0, scale: s0 ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.6)" }, t);
      const punch = (el, t, s, org) => tl.to(el, { scale: s ?? 1.08, svgOrigin: org, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      let etqAct = null;
      const etq = (sel, t) => {
        if (etqAct) tl.to(etqAct, { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqAct = q(sel);
      };
      // reloj común: minutos desde las 0:00 (la aguja de minutos da 6 grados por minuto)
      let rel = REL0;
      const HH = q("." + P + "-hh"), MM = q("." + P + "-mm");
      if (HH) {
        gsap.set(HH, { rotation: rel * 0.5, svgOrigin: "540 700" });
        gsap.set(MM, { rotation: rel * 6, svgOrigin: "540 700" });
      }
      const girar = (t, hasta, dur) => {
        tl.to(HH, { rotation: hasta * 0.5, svgOrigin: "540 700", duration: dur ?? 0.9, ease: "power2.inOut" }, t);
        tl.to(MM, { rotation: hasta * 6, svgOrigin: "540 700", duration: dur ?? 0.9, ease: "power2.inOut" }, t);
        rel = hasta;
      };
      let rotAct = null;
      const rotulo = (i, t) => {
        if (rotAct) tl.to(rotAct, { opacity: 0, duration: 0.18 }, t - 0.1);
        const el = q("." + P + "-rot-" + i);
        if (t <= 0) gsap.set(el, { opacity: 1 }); else tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
        rotAct = el;
      };
      const lado = (sel, op, t, d) => tl.to(qa(sel), { opacity: op, duration: d ?? 0.4, ease: "power2.out" }, t);

      const PANADERIAS = 0.4, CUADRA = 1.5, UNA = 2.32, MEDIALUNAS = 3.4, DOMINGO = 4.3;
      gsap.set(q(".s01-pan-a"), { x: 270, y: 1180 });
      gsap.set(q(".s01-pan-b"), { x: 810, y: 1180 });
      gsap.set(q(".s01-mlv"), { x: 810, y: 1180 });
      gsap.set(qa(".s01-mlv path"), { opacity: 0 });
      gsap.set(qa(".s01-vit-a, .s01-vit-b, .s01-luz-a, .s01-luz-b"), { opacity: 0 });
      // cuadro 0: la izquierda ya medio dibujada
      dibujar(qa(".s01-dib-a"), 0, 0.6, 0.35);
      dibujar(qa(".s01-ml-a"), 0.05, 0.4, 0.5);
      tl.fromTo(q(".s01-txt-a"), { opacity: 0.3 }, { opacity: 1, duration: 0.3 }, 0.1);
      tl.to(q(".s01-luz-a"), { opacity: 0.35, duration: 0.25 }, 0.4);
      tl.fromTo(q(".s01-suelo"), { scaleX: 0.5, svgOrigin: "540 1180" }, { scaleX: 1, svgOrigin: "540 1180", duration: 0.7, ease: "power3.out" }, 0);
      // "panaderías": la segunda, idéntica
      dibujar(qa(".s01-dib-b"), PANADERIAS - 0.05, 0.55);
      dibujar(qa(".s01-ml-b"), PANADERIAS + 0.3, 0.35);
      tl.fromTo(q(".s01-txt-b"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, PANADERIAS + 0.35);
      tl.to(q(".s01-luz-b"), { opacity: 0.35, duration: 0.25 }, PANADERIAS + 0.5);
      tl.fromTo(q(".s01-pan-b-in"), { scale: 1.08, svgOrigin: "0 -150" }, { scale: 1, svgOrigin: "0 -150", duration: 0.4, ease: "power3.out" }, PANADERIAS);

      // "cuadra": el reloj común, la divisoria y los nombres
      dibujar(q(".s01-reloj-c"), CUADRA - 0.15, 0.45);

      rotulo(0, CUADRA + 0.2);
      tl.fromTo(q(".s01-div"), { scaleY: 0, svgOrigin: "540 812" }, { scaleY: 1, svgOrigin: "540 812", duration: 0.5, ease: "power2.out" }, CUADRA);

      // "Una": la de Mónica se prende, la de Jorge baja
      tl.to(q(".s01-luz-b"), { opacity: 0.9, duration: 0.2 }, UNA);
      tl.to(q(".s01-vit-b"), { opacity: 1, duration: 0.25 }, UNA);
      punch(q(".s01-pan-b-in"), UNA, 1.06, "0 -150");
      tl.to(qa(".s01-pan-a-in"), { opacity: 0.5, duration: 0.4 }, UNA + 0.1);

        tl.fromTo(el, { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)" }, MEDIALUNAS - 0.1 + i * 0.07);

      dibujar(q(".s01-tk-t"), DOMINGO + 0.1, 0.3);
