    [data-composition-id="s11-scalerics"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.18em; fill: #efeee5; }
    [data-composition-id="s11-scalerics"] .rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: #efeee5; fill-opacity: 0.6; opacity: 0; }
    [data-composition-id="s11-scalerics"] .nom { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 36px; }

      <div id="s11-dibujo" class="capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
        
        <text class="lex t-ac s11-marca" x="540" y="716" text-anchor="middle" font-size="76" letter-spacing="0.02em">SCALERICS</text>
        <g class="s11-todo">
        <g class="s11-mon">
          <rect class="ln s11-md" x="300" y="810" width="480" height="290" rx="18" />
          <path class="ln s11-md" d="M540 1100 V1140 M470 1140 H610" />
          <text class="mono t-cr s11-ft" x="330" y="876" font-size="24">MEDIALUNAS</text>
          <rect class="relleno s11-bar" x="530" y="854" width="210" height="30" rx="6" />
          <text class="mono t-cr s11-ft" x="330" y="954" font-size="24">BIZCOCHOS</text>
          <rect class="relleno s11-bar" x="530" y="932" width="160" height="30" rx="6" />
          <text class="mono t-cr s11-ft" x="330" y="1032" font-size="24">PAN</text>
          <rect class="relleno s11-bar" x="530" y="1010" width="120" height="30" rx="6" />
        </g>
        <g class="s11-caja">
          <rect class="ln" x="820" y="1080" width="150" height="60" rx="8" />
          <rect class="ln" x="840" y="1000" width="110" height="70" rx="8" />

        </g>
        <path class="ln-ac s11-cinta" d="M280 780 H990 V1170 H280 Z" />
        <path class="ln-ac4 s11-marcas" d="M300 780 v18 M330 780 v10 M360 780 v18 M390 780 v10 M420 780 v18 M450 780 v10 M480 780 v18 M510 780 v10 M540 780 v18 M570 780 v10 M600 780 v18 M630 780 v10 M660 780 v18 M690 780 v10 M720 780 v18 M750 780 v10 M780 780 v18 M810 780 v10 M840 780 v18 M870 780 v10 M900 780 v18 M930 780 v10 M960 780 v18 " />
        <g class="s11-tk"><circle class="ln-ac s11-tk-c" cx="990" cy="780" r="34" /><path class="ln-ac s11-tk-t" d="M973.68 780 L985.92 793.6 L1008.7 765.72" /></g>

  <script>
    (function () {
      const ID = "s11-scalerics";
      const P = "s11";
      const DUR = 4.7;
      const REL0 = 0;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (sel) => root.querySelector(sel);
      const qa = (sel) => Array.from(root.querySelectorAll(sel));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1 });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, Math.max(0, t + i * 0.04));
        });
      };
      const pop = (el, t, s0) => tl.fromTo(el, { opacity: 0, scale: s0 ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.6)" }, t);
      const punch = (el, t, s, org) => tl.to(el, { scale: s ?? 1.08, svgOrigin: org, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      let etqAct = null;
      const etq = (sel, t) => {
        if (etqAct) tl.to(etqAct, { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqAct = q(sel);
      };
      // reloj común: minutos desde las 0:00 (la aguja de minutos da 6 grados por minuto)
      let rel = REL0;
      const HH = q("." + P + "-hh"), MM = q("." + P + "-mm");
      if (HH) {
        gsap.set(HH, { rotation: rel * 0.5, svgOrigin: "540 700" });
        gsap.set(MM, { rotation: rel * 6, svgOrigin: "540 700" });
      }
      const girar = (t, hasta, dur) => {
        tl.to(HH, { rotation: hasta * 0.5, svgOrigin: "540 700", duration: dur ?? 0.9, ease: "power2.inOut" }, t);
        tl.to(MM, { rotation: hasta * 6, svgOrigin: "540 700", duration: dur ?? 0.9, ease: "power2.inOut" }, t);
        rel = hasta;
      };
      let rotAct = null;
      const rotulo = (i, t) => {
        if (rotAct) tl.to(rotAct, { opacity: 0, duration: 0.18 }, t - 0.1);
        const el = q("." + P + "-rot-" + i);
        if (t <= 0) gsap.set(el, { opacity: 1 }); else tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
        rotAct = el;
      };
      const lado = (sel, op, t, d) => tl.to(qa(sel), { opacity: op, duration: d ?? 0.4, ease: "power2.out" }, t);

      const SCALERICS = 0.66, SISTEMAS = 1.83, MEDIDA = 2.86, NEGOCIO = 3.36;
      gsap.set(qa(".s11-marca, .s11-ft, .s11-caja, .s11-marcas"), { opacity: 0 });
      gsap.set(q(".s11-todo"), { x: -95 });
      // cuadro 0: el monitor ya se está dibujando
      dibujar(qa(".s11-md"), 0, 0.6, 0.5);
      tl.fromTo(q(".s11-marca"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, SCALERICS - 0.1);
      punch(q(".s11-marca"), SCALERICS + 0.4, 1.05, "540 690");
      // "sistemas": filas por producto con barras
      qa(".s11-ft").forEach((el, i) => tl.fromTo(el, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25 }, 1.0 + i * 0.12));
      tl.fromTo(qa(".s11-bar"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.5, stagger: 0.12, ease: "power3.out" }, 1.2);
      pop(q(".s11-caja"), SISTEMAS + 0.3);
      etq(".s11-e1", SISTEMAS - 0.1);
      // "a la medida": la cinta métrica abraza todo
      dibujar(q(".s11-cinta"), MEDIDA - 0.3, 0.7);
      tl.to(q(".s11-marcas"), { opacity: 1, duration: 0.3 }, MEDIDA + 0.2);
      // "tu negocio": tilde
      gsap.set(q(".s11-tk"), { opacity: 1 });
      dibujar(q(".s11-tk-c"), NEGOCIO, 0.3); dibujar(q(".s11-tk-t"), NEGOCIO + 0.15, 0.25);
      tl.fromTo(q(".s11-tk"), { scale: 0.7, svgOrigin: "990 780" }, { scale: 1, svgOrigin: "990 780", duration: 0.4, ease: "back.out(2)" }, NEGOCIO);
      tl.to(q(".s11-pant"), { opacity: 0.5, duration: 0.2, yoyo: true, repeat: 3 }, NEGOCIO + 0.3);
      etq(".s11-e2", MEDIDA - 0.1);
      tl.to(q("#s11-dibujo"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
