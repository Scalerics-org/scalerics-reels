  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 70.46;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });

      // bombitas: corren en dos tandas alternadas todo el reel
      const bombitas = [...qa(".amb-bombita")];
      const pares = bombitas.filter((b, i) => i % 2 === 0), impares = bombitas.filter((b, i) => i % 2 === 1);
      gsap.set(impares, { opacity: 0.3 });
      const PASO = 0.45, N = Math.floor(DUR / PASO) - 1;
      tl.to(pares, { opacity: 0.3, duration: 0.05, yoyo: true, repeat: N, repeatDelay: PASO - 0.05, ease: "none" }, 0);
      tl.to(impares, { opacity: 1, duration: 0.05, yoyo: true, repeat: N, repeatDelay: PASO - 0.05, ease: "none" }, 0);
      // el cartel entra al arrancar
      tl.fromTo(q(".amb-cartel"), { y: -30, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, 0);
      tl.fromTo(q(".amb-marquee"), { y: -30, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, 0);
      tl.to(q(".amb-punto"), { opacity: 0.25, duration: 0.4, yoyo: true, repeat: Math.max(1, Math.floor(DUR / 0.4) - 1), ease: "sine.inOut" }, 0);

      // ---------- medidor de química: ángulo -90 (cero) a 90 (por las nubes) ----------
      const aguja = q(".amb-aguja");
      gsap.set(aguja, { rotation: 0, svgOrigin: "895 1680" });
      const MIDE = [
        [0.3, 15], [6.9, 45], [10.85, 0], [14.4, -35], [18.3, -62], [21.85, -40], [22.4, -62],
        [26.06, -90], [32.4, -55], [34.05, -15], [35.7, 25], [38.37, 55], [41.39, 90],
        [45.6, 35], [49.1, 5], [51.84, -25], [53.1, -5], [55.8, 20], [57.1, 45], [58.6, 65], [61.6, 90]
      ];
      MIDE.forEach(([t, a]) => tl.to(aguja, { rotation: a, svgOrigin: "895 1680", duration: a === -90 || a === 90 ? 0.35 : 0.5, ease: a === -90 ? "bounce.out" : "back.out(2)" }, t));
      // tiembla cuando toca los topes
      tl.to(aguja, { rotation: 84, svgOrigin: "895 1680", duration: 0.07, yoyo: true, repeat: 9, ease: "sine.inOut" }, 41.8);
      tl.to(aguja, { rotation: 85, svgOrigin: "895 1680", duration: 0.08, yoyo: true, repeat: 7, ease: "sine.inOut" }, 62.0);
      // tiembla el medidor entero en el cero y en las nubes
      [[26.1, 1], [41.4, 1.4], [61.65, 1]].forEach(([t, f]) => [[-8 * f, 4 * f], [6 * f, -3 * f], [-3 * f, 2 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".amb-medidor"), { x, y, duration: 0.05, ease: "none" }, t + i * 0.055)));

      // ---------- la caja del público ----------
      const REACC = [4.2, 18.95, 23.6, 26.1, 39.55, 41.45, 51.95, 62.3];
      REACC.forEach((t, k) => {
        const el = q(".k" + k);
        gsap.set(el, { opacity: 0 });
        tl.to(q(".amb-vivo"), { opacity: 0, duration: 0.08 }, t);
        tl.fromTo(el, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(3)", immediateRender: false }, t);
        const largo = Math.min(2.2, (REACC[k + 1] ?? 99) - t - 0.2);
        tl.to(el, { opacity: 0.45, duration: 0.12, yoyo: true, repeat: Math.max(1, Math.floor(largo / 0.24) * 2 - 3), ease: "none" }, t + 0.25);
        tl.to(el, { opacity: 0, duration: 0.15 }, t + largo);
        if (largo >= 2.2) tl.to(q(".amb-vivo"), { opacity: 1, duration: 0.2 }, t + largo + 0.1);
        tl.to(q(".amb-caja"), { rotation: k % 2 ? 3 : -3, duration: 0.08, yoyo: true, repeat: 3, ease: "sine.inOut" }, t);
      });

      // ---------- flashes de estudio: "desastre", "cero", "nubes" ----------

        tl.to(q(".amb-flash"), { opacity: 0, duration: 0.35, ease: "power2.out" }, t + 0.04);
