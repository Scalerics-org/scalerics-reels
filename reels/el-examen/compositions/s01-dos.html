      const CORREGI = 2.8;

      // "corregí yo": la birome entra y firma

      tl.fromTo(q(".s01-birome"), { opacity: 0, x: 400, y: 180, rotation: -30 }, { opacity: 1, x: 0, y: 0, rotation: -24, duration: 0.3, ease: "power3.out", immediateRender: false }, CORREGI - 0.25);
