      const DUR = 5.54;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);

      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, d = 0.5, ease = "power2.inOut") => {
        [].concat(els).forEach((el) => {
          const L = el.getTotalLength() + 2;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t);

      const sacudon = (t, f = 1) =>
        [[-18, 10], [14, -8], [-8, 5], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

      const VIDRIERA = 0.76, CLIENTE = 1.76, BUSCA = 2.26, SALIR = 3.46, ENCUENTRA = 4.46;

      // el local con su vidriera linda

      dibujar(q(".s10-circ"), VIDRIERA - 0.1, 0.35);
      gsap.set(q(".s10-reprueba"), { opacity: 0 });

      qa(".s10-c").forEach((c, i) => dibujar(c, CLIENTE - 0.2 + i * 0.08, 0.4));

      tl.to(q(".s10-busca"), { clipPath: "inset(-20% 0% -20% 0)", duration: 0.7, ease: "steps(10)" }, BUSCA);
      gsap.set(q(".s10-cargando"), { opacity: 0 });
      tl.set(q(".s10-cargando"), { opacity: 1 }, SALIR - 0.4);
      tl.fromTo(q(".s10-cargando"), { rotation: 0, svgOrigin: "540 1000" }, { rotation: 900, duration: ENCUENTRA - SALIR + 0.4, ease: "none" }, SALIR - 0.4);

      sacudon(ENCUENTRA + 0.3, 1.2);

      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
