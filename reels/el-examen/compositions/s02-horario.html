<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }

    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-horario"] .s02-capa { position: absolute; inset: 0; }
    [data-composition-id="s02-horario"] .s02-escenario { position: absolute; inset: 0; }
    [data-composition-id="s02-horario"] .s02-hoja { position: absolute; left: 70px; top: 590px; width: 940px; height: 940px; background-color: #f3ead2;
      background-image: linear-gradient(90deg, transparent 120px, #d42a1f 120px, #d42a1f 123px, transparent 123px), repeating-linear-gradient(180deg, transparent 0 78px, #9fb4d9 78px 80px);
      background-position: 0 0, 0 40px; box-shadow: 0 18px 0 rgba(0, 0, 0, 0.28); border-radius: 4px; }

    [data-composition-id="s02-horario"] .s02-preg { position: absolute; left: 160px; top: 92px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 44px; color: #2b2b2b; white-space: nowrap; }
    [data-composition-id="s02-horario"] .s02-resp-lbl { position: absolute; left: 160px; top: 270px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 32px; letter-spacing: 0.12em; color: #2b2b2b; opacity: 0.7; }
    [data-composition-id="s02-horario"] .s02-resp { position: absolute; left: 160px; top: 350px; font-family: "Caveat", cursive; font-weight: 700; font-size: 160px; line-height: 1; color: #1d3fa8; white-space: nowrap; }
    [data-composition-id="s02-horario"] .s02-resp2 { top: 530px; }

    [data-composition-id="s02-horario"] .s02-mal { position: absolute; left: 380px; top: 690px; font-family: "Caveat", cursive; font-weight: 700; font-size: 270px; line-height: 1; color: #d42a1f; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s02-horario" data-width="1080" data-height="1920" data-duration="6.56">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="6.56" data-track-index="0">
      <div class="s02-escenario">
        <div class="s02-hoja">
          <div class="s02-num">1.</div>
          <div class="s02-preg">¿Cuál es tu horario?</div>
          <div class="s02-resp-lbl">RESPUESTA:</div>
          <div class="s02-resp">"consultar</div>
          <div class="s02-resp s02-resp2">por privado"</div>
          <svg class="s02-svg" viewBox="0 0 940 940" aria-hidden="true">
            <!-- un relojito en birome, con signo de pregunta -->
            <g class="s02-reloj" fill="none" stroke="#1d3fa8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
              <circle class="s02-r1" cx="800" cy="300" r="70" />
              <path class="s02-r2" d="M800 300 V252 M800 300 L834 318" />

  <script>
    (function () {
      const ID = "s02-horario";
      const DUR = 6.56;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, d = 0.5, ease = "power2.inOut") => {
        [].concat(els).forEach((el) => {
          const L = el.getTotalLength() + 2;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease }, t);
        });
      };
      const sacudon = (t, f = 1) =>
        [[-18, 10], [14, -8], [-8, 5], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const escribir = (el, t, d) => {
        gsap.set(el, { clipPath: "inset(-20% 100% -20% 0)" });
        tl.to(el, { clipPath: "inset(-20% 0% -20% 0)", duration: d, ease: "none" }, t);
      };

      const UNO = 0.51, HORARIO = 1.81, RESP = 2.9, CONSULTAR = 3.61, PRIVADO = 4.91, MAL = 6.06;

      // la hoja ya está, de cerca, y la cámara se acerca despacio
      tl.fromTo(q(".s02-hoja"), { rotation: 3, y: 40, scale: 0.96 }, { rotation: 1.5, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.to(q(".s02-hoja"), { scale: 1.05, rotation: 0.5, duration: DUR - 0.45, ease: "none" }, 0.45);
      gsap.set(q(".s02-num"), { opacity: 0 });
      tl.fromTo(q(".s02-num"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in", immediateRender: false }, UNO - 0.1);
      escribir(q(".s02-preg"), UNO + 0.1, HORARIO - UNO + 0.2);
      dibujar([q(".s02-r1"), q(".s02-r2")], HORARIO + 0.1, 0.4);
      dibujar(q(".s02-r3"), HORARIO + 0.5, 0.3);
      tl.to(q(".s02-reloj"), { rotation: 8, svgOrigin: "800 300", duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut" }, HORARIO + 0.6);
      gsap.set(q(".s02-resp-lbl"), { opacity: 0 });
      tl.fromTo(q(".s02-resp-lbl"), { opacity: 0, y: 12 }, { opacity: 0.7, y: 0, duration: 0.2, immediateRender: false }, RESP);
      // la respuesta se escribe sola en birome azul
      escribir(q(".s02-resp"), CONSULTAR - 0.05, 0.9);
      escribir(q(".s02-resp2"), PRIVADO - 0.45, 0.8);
      dibujar(q(".s02-circ"), PRIVADO + 0.5, 0.35);
      tl.to(q(".s02-hoja"), { x: -10, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, PRIVADO + 0.4);

      // "Mal.": tachón doble y sello
      dibujar(q(".s02-tacha1"), MAL - 0.12, 0.14, "power1.in");
      dibujar(q(".s02-tacha2"), MAL - 0.02, 0.14, "power1.in");
      gsap.set(q(".s02-mal"), { opacity: 0 });
      tl.fromTo(q(".s02-mal"), { opacity: 0, scale: 2.6, rotation: -16 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.13, ease: "power4.in", immediateRender: false }, MAL - 0.08);
      sacudon(MAL + 0.06, 1.2);

      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.16, ease: "power2.in" }, DUR - 0.16);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
