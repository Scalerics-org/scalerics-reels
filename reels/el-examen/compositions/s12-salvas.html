  <style>

    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s12-salvas"] .s12-doce { position: absolute; left: 640px; top: 690px; width: 340px; text-align: center; font-family: "Caveat", cursive; font-weight: 700; font-size: 300px; line-height: 1; color: #ff5a4a; }
    [data-composition-id="s12-salvas"] .s12-salvas { position: absolute; left: 600px; top: 1080px; width: 420px; text-align: center; font-family: "Caveat", cursive; font-weight: 700; font-size: 104px; line-height: 0.95; color: #f2efe6; }
  </style>
  <div id="root" data-composition-id="s12-salvas" data-width="1080" data-height="1920" data-duration="6.3">
    <div id="s12-escena" class="s12-capa clip" data-start="0" data-duration="6.3" data-track-index="0">
      <div class="s12-escenario">
        <svg class="s12-svg" viewBox="0 0 1080 1920" aria-hidden="true">
          <defs>
            <filter id="s12-tiza" x="-5%" y="-5%" width="110%" height="110%">
              <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="27" result="r" />

          <g filter="url(#s12-tiza)" fill="none" stroke="#f2efe6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">

  <script>
    (function () {
      const ID = "s12-salvas";
      const DUR = 6.3;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, d = 0.5, ease = "power2.inOut") => {
        [].concat(els).forEach((el) => {
          const L = el.getTotalLength() + 2;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease }, t);
        });
      };
      const pop = (els, t) => {
        gsap.set(els, { opacity: 0 });
        tl.fromTo(els, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false, transformOrigin: "50% 50%" }, t);
      };

      const CARGUE = 0.9, HORARIO = 2.0, LLEGAR = 2.7, BOTON = 3.4, SALVAS = 4.43, DICIEMBRE = 5.1;

      qa(".s12-c").forEach((c, i) => dibujar(c, i * 0.1, 0.45));
      // carga de golpe
      gsap.set(q(".s12-carga"), { scaleX: 0, svgOrigin: "186 715" });
      tl.to(q(".s12-carga"), { scaleX: 0.15, duration: 0.3, ease: "none" }, 0.4);
      tl.to(q(".s12-carga"), { scaleX: 1, duration: 0.2, ease: "power4.in" }, CARGUE + 0.1);
      tl.to(q(".s12-carga"), { opacity: 0.3, duration: 0.2 }, CARGUE + 0.4);

      // bloques en la palabra que los nombra
      pop([q(".s12-b1"), q(".s12-h"), q(".s12-h2")], HORARIO - 0.2);
      dibujar(q(".s12-t1"), HORARIO + 0.1, 0.2);
      pop([q(".s12-b2"), q(".s12-m")], LLEGAR - 0.4);
      gsap.set(q(".s12-pin"), { opacity: 0 });
      tl.fromTo(q(".s12-pin"), { opacity: 1, y: -300 }, { y: 0, duration: 0.3, ease: "bounce.out", immediateRender: false }, LLEGAR - 0.1);
      dibujar(q(".s12-t2"), LLEGAR + 0.2, 0.2);
      pop(q(".s12-boton"), BOTON - 0.1);
      dibujar(q(".s12-t3"), BOTON + 0.4, 0.2);
      tl.to(q(".s12-boton"), { scale: 0.92, duration: 0.1, yoyo: true, repeat: 1 }, BOTON + 0.6);

      // "salvás en diciembre": 12 y festejo
      gsap.set(q(".s12-doce"), { opacity: 0 });
      tl.fromTo(q(".s12-doce"), { opacity: 0, scale: 2.4, rotation: 14 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.16, ease: "back.out(2)", immediateRender: false }, SALVAS - 0.08);
      dibujar(q(".s12-circ"), SALVAS + 0.1, 0.35);
      gsap.set(q(".s12-salvas"), { clipPath: "inset(-20% 100% -20% 0)" });
      tl.to(q(".s12-salvas"), { clipPath: "inset(-20% 0% -20% 0)", duration: 0.7, ease: "none" }, SALVAS + 0.2);
      tl.to(q(".s12-salvas"), { y: -14, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.out" }, DICIEMBRE);
      tl.to(q(".s12-escenario"), { scale: 1.04, duration: DUR, ease: "none", transformOrigin: "540px 1000px" }, 0);

      tl.to(q("#s12-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
