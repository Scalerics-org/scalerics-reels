    (function () {
      const ID = "ambiente";
      const SCALERICS = 58.3; // entra Orus: el borrador limpia el pizarrón

      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // las manchas de tiza respiran apenas

      // flashes rojos (segundos globales): "dos", los "Mal.", "a marzo"

      });
      // el giro: tiza blanca suave cuando el profe baja el tono

      tl.to(q(".amb-blanco"), { opacity: 0, duration: 0.5, ease: "power2.out" }, 36.7);
