      const q = (s) => root.querySelector(s);

      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, d = 0.5, ease = "power2.inOut") => {
        [].concat(els).forEach((el) => {
          const L = el.getTotalLength() + 2;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t);

      const sacudon = (t, f = 1) =>

        gsap.set(el, { clipPath: "inset(-20% 100% -20% 0)" });

      const DOS = 1.15, QUEDAS = 2.55, PIN = 3.95, OTRA = 5.35;

      dibujar(q(".s03-casa"), QUEDAS - 0.6, 0.5);
      gsap.set(q(".s03-tulocal"), { opacity: 0 });
      tl.fromTo(q(".s03-tulocal"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, QUEDAS);
      tl.to(q(".s03-casa"), { scale: 1.2, svgOrigin: "245 880", duration: 0.15, yoyo: true, repeat: 1 }, QUEDAS + 0.1);

      // "pin": cae y rebota en otra manzana

      tl.fromTo(q(".s03-pin"), { opacity: 1, y: -700 }, { y: 0, duration: 0.35, ease: "bounce.out", immediateRender: false }, PIN - 0.3);
      tl.fromTo(q(".s03-sombra"), { opacity: 0, scale: 0.3, svgOrigin: "835 1394" }, { opacity: 0.6, scale: 1, duration: 0.3, immediateRender: false }, PIN - 0.25);

      tl.fromTo(q(".s03-ruta"), { strokeDashoffset: 200 }, { strokeDashoffset: 0, duration: 1.3, ease: "none" }, OTRA - 0.4);
