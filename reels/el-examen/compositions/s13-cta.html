  <script>
    (function () {
      const ID = "s13-cta";
      const DUR = 8.3;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, d = 0.5, ease = "power2.inOut") => {
        [].concat(els).forEach((el) => {
          const L = el.getTotalLength() + 2;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.set(el, { opacity: 1 }, t);
          tl.to(el, { strokeDashoffset: 0, duration: d, ease }, t);
        });
      };

      const HACEMOS = 1.0, PONETE = 2.4, COMENTARIOS = 3.1, DEL = 3.8, DOCE = 4.6;

      // cuadro 0: el pizarrón recién borrado, "TU SITIO WEB" en tiza
      tl.fromTo(q(".s13-web"), { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, 0.05);
      dibujar(q(".s13-sub"), 0.3, 0.4);
      gsap.set(q(".s13-hacemos"), { clipPath: "inset(-20% 100% -20% 0)" });
      tl.to(q(".s13-hacemos"), { clipPath: "inset(-20% 0% -20% 0)", duration: 0.7, ease: "none" }, HACEMOS - 0.1);
      tl.to(q(".s13-web"), { scale: 1.04, duration: 0.15, yoyo: true, repeat: 1 }, HACEMOS + 0.5);

      // "Ponete nota"
      gsap.set(q(".s13-nota"), { clipPath: "inset(-20% 100% -20% 0)" });
      tl.to(q(".s13-nota"), { clipPath: "inset(-20% 0% -20% 0)", duration: 0.5, ease: "none" }, PONETE - 0.1);
      dibujar(q(".s13-caja"), PONETE + 0.1, 0.45);
      gsap.set(q(".s13-preg"), { opacity: 0 });
      tl.fromTo(q(".s13-preg"), { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)", immediateRender: false }, PONETE + 0.5);
      gsap.set(q(".s13-com"), { opacity: 0 });
      tl.fromTo(q(".s13-com"), { opacity: 0, y: 16 }, { opacity: 0.9, y: 0, duration: 0.3, immediateRender: false }, COMENTARIOS);

      // "del uno al doce": los números en cascada
      const nums = qa(".s13-n");
      gsap.set(nums, { opacity: 0 });
      nums.forEach((n, i) => tl.fromTo(n, { opacity: 0, y: 30, scale: 1.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(2)", immediateRender: false }, DEL - 0.1 + i * ((DOCE - DEL + 0.3) / 12)));

      // el aro rojo salta de número en número y vuelve al casillero vacío
      const centro = (i) => [105 + (i % 6) * 145 + 60, (i < 6 ? 1205 : 1335) + 50];
      const saltos = [0, 3, 7, 1, 10, 5, 11, 2, 8];
      gsap.set(q(".s13-aro"), { opacity: 0, x: centro(0)[0], y: centro(0)[1] });
      tl.set(q(".s13-aro"), { opacity: 1 }, DOCE + 0.4);
      let t = DOCE + 0.4;
      saltos.forEach((i) => {
        const [x, y] = centro(i);
        tl.to(q(".s13-aro"), { x, y, duration: 0.18, ease: "power2.inOut" }, t);
        t += 0.24;
      });
      tl.to(q(".s13-aro"), { x: 740, y: 1025, scale: 1.6, duration: 0.3, ease: "power3.inOut" }, t);
      tl.to(q(".s13-preg"), { scale: 1.15, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 0.3);
