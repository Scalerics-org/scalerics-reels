      <svg viewBox="0 0 1080 1920" aria-hidden="true">

          <!-- hilos: todo cuelga de vos -->
          <path class="ln-hilo s04-hilo" d="M260 840 L478 948" />
          <path class="ln-hilo s04-hilo" d="M540 830 L540 892" />
          <path class="ln-hilo s04-hilo" d="M820 840 L602 948" />

          <g transform="translate(0 40)">
          <!-- celular -->
          <g class="s04-tel">
            <rect class="ln s04-dib-tel" x="205" y="610" width="110" height="180" rx="22" />

            <g class="s04-cara s04-c2"><circle class="ln-4" cx="776" cy="706" r="13" /><path class="ln-4" d="M800 706 H860" /></g>

          <!-- vos -->
          <g class="s04-vos">
            <circle class="ln s04-dib-vos" cx="540" cy="930" r="34" />

  <script>
    (function () {
      const ID = "s04-todo-vos";
      const DUR = 7.64;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const TODO = 0.5;
      const DEPENDE = 0.8;
      const VOS = 1.2;
      const CONTESTAS = 2.2;
      const MENSAJES = 3.0;
      const ANOTAS = 4.1;
      const PEDIDOS = 4.7;
      const ACORDAS = 5.9;
      const CLIENTE = 6.6;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const golpe = (el, origen, t) => tl.to(el, { scale: 1.1, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const aparecer = (el, t) => tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);

      tl.fromTo(q(".s04-todo"), { scale: 0.97, svgOrigin: "540 900" }, { scale: 1.02, svgOrigin: "540 900", duration: DUR, ease: "none" }, 0);

      // vos arranca medio dibujado, con los brazos abajo
      dibujar(qa(".s04-dib-vos"), 0, 0.5, 0.45);
      tl.fromTo(q(".s04-brazo-i"), { rotation: -95, svgOrigin: "540 990", opacity: 1 }, { rotation: 0, svgOrigin: "540 990", duration: 0.4, ease: "back.out(1.6)" }, DEPENDE + 0.1);
      tl.fromTo(q(".s04-brazo-d"), { rotation: 95, svgOrigin: "540 990", opacity: 1 }, { rotation: 0, svgOrigin: "540 990", duration: 0.4, ease: "back.out(1.6)" }, DEPENDE + 0.1);
      gsap.set(q(".s04-vos-txt"), { opacity: 0 });
      gsap.set(qa(".s04-gota"), { opacity: 0 });

      // "todo": aparecen los tres íconos
      gsap.set(qa(".s04-msg1, .s04-msg2, .s04-msg3, .s04-cara, .s04-r1, .s04-r2, .s04-r3"), { opacity: 0 });
      dibujar(qa(".s04-dib-tel"), TODO - 0.2, 0.4);
      dibujar(qa(".s04-dib-cua"), TODO - 0.1, 0.4);
      dibujar(qa(".s04-dib-fic"), TODO, 0.4);
      tl.fromTo(q(".s04-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, TODO);
      // "depende": bajan los hilos hasta vos
      qa(".s04-hilo").forEach((h, i) => tl.fromTo(h, { opacity: 0 }, { opacity: 1, duration: 0.3 }, DEPENDE + i * 0.08));
      // "vos": rótulo VOS
      tl.fromTo(q(".s04-vos-txt"), { opacity: 0, scale: 0.6, svgOrigin: "540 1216" }, { opacity: 1, scale: 1, svgOrigin: "540 1216", duration: 0.3, ease: "back.out(2)" }, VOS);
      golpe(q(".s04-vos"), "540 1176", VOS);
      tl.to(q(".s04-vos"), { y: -6, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, VOS + 0.4);

      // "contestás los mensajes"
      tl.to(qa(".s04-e1, .s04-vos-txt"), { opacity: 0, duration: 0.2 }, CONTESTAS - 0.15);
      tl.fromTo(q(".s04-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CONTESTAS - 0.05);
      aparecer(q(".s04-r1"), CONTESTAS);
      golpe(q(".s04-tel"), "260 700", CONTESTAS);
      pop(q(".s04-msg1"), CONTESTAS + 0.1, "253 664");
      pop(q(".s04-msg2"), CONTESTAS + 0.45, "269 704");
      pop(q(".s04-msg3"), MENSAJES, "246 744");
      tl.to(q(".s04-brazo-i"), { rotation: -12, svgOrigin: "540 990", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3 }, CONTESTAS + 0.1);

      // "anotás los pedidos"
      aparecer(q(".s04-r2"), ANOTAS);
      golpe(q(".s04-cua"), "540 700", ANOTAS);
      dibujar(qa(".s04-renglon"), ANOTAS + 0.05, 0.3);
      tl.to(q(".s04-cua"), { rotation: 3, svgOrigin: "540 786", duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 1 }, PEDIDOS);

      // "te acordás de cada cliente"
      aparecer(q(".s04-r3"), ACORDAS - 0.2);
      golpe(q(".s04-fic"), "820 706", ACORDAS);
      [q(".s04-c1"), q(".s04-c2"), q(".s04-c3")].forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, ACORDAS + 0.1 + i * 0.22);
      });
      tl.to(q(".s04-brazo-d"), { rotation: 12, svgOrigin: "540 990", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3 }, ACORDAS + 0.1);

      // sobrecarga: vos tiembla, transpira y los tres íconos tiran
      tl.to(qa(".s04-gota"), { opacity: 1, duration: 0.15 }, CLIENTE);
      tl.fromTo(qa(".s04-gota"), { y: 0 }, { y: 30, duration: 0.6, ease: "power1.in", immediateRender: false }, CLIENTE);
      tl.to(q(".s04-vos"), { x: 5, duration: 0.05, ease: "none", yoyo: true, repeat: 9 }, CLIENTE);
      tl.to(qa(".s04-tel, .s04-cua, .s04-fic"), { y: -8, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.06 }, CLIENTE + 0.1);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
