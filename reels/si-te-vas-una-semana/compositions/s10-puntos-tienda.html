  <script>
    (function () {
      const ID = "s10-puntos-tienda";
      const DUR = 7.54;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const PUNTOS = 0.14;
      const AVISO = 1.84;
      const DEJO = 2.74;
      const VENIR = 3.04;
      const Y = 3.62;
      const TIENDA = 3.94;
      const VENDE = 4.84;
      const COBRA = 5.24;
      const MERCADO = 5.74;
      const ESTES = 6.64;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // ---------- A: Puntos ----------
      tl.fromTo(q(".s10-a"), { scale: 0.98, svgOrigin: "540 900" }, { scale: 1.02, svgOrigin: "540 900", duration: Y, ease: "none" }, 0);
      dibujar(qa(".s10-dib-tel"), 0, 0.5, 0.5);
      dibujar([q(".s10-dib-card")], 0.05, 0.45, 0.4);
      gsap.set(qa(".s10-n1, .s10-n2, .s10-sello"), { opacity: 0 });
      tl.fromTo(q(".s10-card .mono"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.1);
      qa(".s10-sello").forEach((s, i) => tl.fromTo(s, { opacity: 0, scale: 0.3, svgOrigin: (257 + i * 34) + " 940" }, { opacity: 1, scale: 1, svgOrigin: (257 + i * 34) + " 940", duration: 0.25, ease: "back.out(2.4)" }, PUNTOS + 0.1 + i * 0.12));
      tl.fromTo(q(".s10-n1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, PUNTOS + 0.1);
      tl.to(q(".s10-n1"), { opacity: 0, y: -14, duration: 0.12 }, PUNTOS + 0.5);
      tl.fromTo(q(".s10-n2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, PUNTOS + 0.6);
      tl.to(q(".s10-card"), { scale: 1.06, svgOrigin: "325 865", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, PUNTOS + 0.62);
      tl.fromTo(q(".s10-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, PUNTOS);

      // el cliente que dejó de venir: apagado a la derecha
      gsap.set(q(".s10-cli"), { x: 800, y: 1110 });
      gsap.set(q(".s10-cli-in"), { scale: 1.6, svgOrigin: "0 0" });
      tl.fromTo(q(".s10-cli"), { opacity: 0 }, { opacity: 0.35, duration: 0.4 }, 0.6);

      // "aviso": la burbuja sale del celular y viaja al cliente
      gsap.set(q(".s10-aviso"), { opacity: 0 });
      tl.fromTo(q(".s10-aviso"), { x: 330, y: 720, opacity: 0, scale: 0.6 }, { x: 420, y: 700, opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, AVISO - 0.25);
      tl.to(q(".s10-aviso"), { x: 760, y: 840, duration: 0.6, ease: "power2.inOut" }, AVISO + 0.15);
      tl.to(q(".s10-aviso"), { scale: 1.1, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, AVISO + 0.75);

      // "dejó de venir": se prende y vuelve
      tl.to(q(".s10-cli"), { opacity: 1, duration: 0.25 }, DEJO);
      tl.to(q(".s10-cli-in"), { y: -14, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, DEJO);
      tl.to(q(".s10-aviso"), { opacity: 0, y: 800, duration: 0.3 }, VENIR);
      tl.to(q(".s10-cli"), { x: 640, duration: 0.5, ease: "power1.inOut" }, VENIR);
      tl.fromTo(q(".s10-cli-cuerpo"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, VENIR);
      dibujar([q(".s10-vuelve")], DEJO + 0.1, 0.4);
      gsap.set(q(".s10-vuelve-p"), { opacity: 0 });
      tl.to(q(".s10-vuelve-p"), { opacity: 1, duration: 0.1 }, DEJO + 0.45);

      // transición
      tl.to(q(".s10-a"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, Y - 0.2);
      tl.to(q(".s10-e1"), { opacity: 0, duration: 0.2 }, Y - 0.2);

      // ---------- B: tienda online ----------
      gsap.set(qa(".s10-prod1, .s10-prod2, .s10-pago, .s10-playa"), { opacity: 0 });
      tl.fromTo(q(".s10-b"), { scale: 0.98, svgOrigin: "540 900" }, { scale: 1.02, svgOrigin: "540 900", duration: DUR - Y, ease: "none" }, Y);
      dibujar(qa(".s10-dib-nav"), Y + 0.05, 0.45);
      pop(q(".s10-prod1"), TIENDA, "380 986");
      pop(q(".s10-prod2"), TIENDA + 0.15, "700 986");
      gsap.set(q(".s10-tilde2"), { opacity: 0 });
      tl.fromTo(q(".s10-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, TIENDA);

      // "vende": el producto 1 salta
      tl.to(q(".s10-prod1"), { y: -16, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, VENDE);
      // "cobra": pago aprobado
      pop(q(".s10-pago"), COBRA, "540 1090");
      dibujar([q(".s10-tilde")], COBRA + 0.2, 0.3);
      // "Mercado Pago": el tilde late y vende otro
      tl.to(q(".s10-pago"), { scale: 1.06, svgOrigin: "540 1090", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, MERCADO);
      tl.to(q(".s10-tilde2"), { opacity: 1, duration: 0.05 }, MERCADO + 0.3);
      tl.fromTo(q(".s10-tilde2"), { scale: 0.4, svgOrigin: "799 913" }, { scale: 1, svgOrigin: "799 913", duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, MERCADO + 0.3);
      tl.to(q(".s10-prod2"), { y: -16, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, MERCADO + 0.3);

      // "aunque estés en la playa": la sombrilla chica al lado
      gsap.set(q(".s10-playa"), { x: 900, y: 1190 });
      tl.fromTo(q(".s10-playa"), { opacity: 0, y: 1230 }, { opacity: 1, y: 1190, duration: 0.35, ease: "back.out(2)" }, ESTES - 0.3);
      tl.to(q(".s10-playa"), { y: 1180, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, ESTES + 0.2);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
