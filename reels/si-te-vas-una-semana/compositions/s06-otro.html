<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-otro"] .s06-capa { position: absolute; inset: 0; }
    [data-composition-id="s06-otro"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-otro"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-otro"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

  </style>
  <div id="root" data-composition-id="s06-otro" data-width="1080" data-height="1920" data-duration="2.75">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="2.75" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s06-todo">
          <line class="ln s06-suelo" x1="40" y1="1120" x2="1040" y2="1120" />
          <!-- tu local, cerrado -->
          <g class="s06-tuyo">
            <path class="ln s06-dib-a" d="M-120 0 V-170 H120 V0" />
            <path class="ln s06-dib-a" d="M-140 -170 H140 L122 -222 H-122 Z" />
            <path class="ln s06-dib-a" d="M-140 -170 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0" />
            <rect class="ln s06-dib-a" x="-80" y="-290" width="160" height="50" rx="10" />
            <text class="cartel s06-txt-a" x="0" y="-257" text-anchor="middle">TU LOCAL</text>
            <rect class="ln s06-dib-a" x="-100" y="-122" width="58" height="52" rx="5" />
            <rect class="ln s06-dib-a" x="42" y="-122" width="58" height="52" rx="5" />
            <path class="ln s06-dib-a" d="M-24 0 V-96 H24 V0" />
            <g class="s06-cerrado">
              <path class="ln" d="M-14 -62 L0 -78 L14 -62" />
              <rect class="ln" x="-66" y="-62" width="132" height="40" rx="6" />
              <text class="cartel" x="0" y="-33" text-anchor="middle">CERRADO</text>

          </g>
          <!-- el otro local -->
          <g class="s06-otro">
            <g class="s06-otro-in">
              <path class="ln s06-dib-b" d="M-120 0 V-170 H120 V0" />
              <path class="ln s06-dib-b" d="M-140 -170 H140 L122 -222 H-122 Z" />
              <path class="ln s06-dib-b" d="M-140 -170 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0" />
              <rect class="ln s06-dib-b" x="-80" y="-290" width="160" height="50" rx="10" />
              <text class="cartel s06-txt-b" x="0" y="-257" text-anchor="middle">OTRO</text>
              <rect class="ln s06-dib-b" x="-100" y="-122" width="58" height="52" rx="5" />

            <circle class="ln" cx="0" cy="-96" r="14" />
            <path class="ln s06-cuerpo" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L20 -54 M0 -40 L-14 0 M0 -40 L14 0" />
            <path class="ln s06-bolsa" d="M14 -54 H44 L48 -14 H10 Z M20 -54 Q29 -70 38 -54" />

      <div class="etiqueta"><span class="s06-e1">Quería comprar</span><span class="s06-e2">Le compró a otro</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-otro";
      const DUR = 2.75;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const COMPRAR = 0.46;
      const LE = 1.22;
      const OTRO = 1.86;

      const SUELO = 1120;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      gsap.set(q(".s06-tuyo"), { x: 270, y: SUELO });
      gsap.set(q(".s06-otro"), { x: 810, y: SUELO });
      gsap.set(q(".s06-cli"), { x: 480, y: SUELO, scale: 1.5, svgOrigin: "0 0" });
      gsap.set(qa(".s06-luz-b, .s06-tilde"), { opacity: 0 });

      tl.fromTo(q(".s06-todo"), { scale: 0.98, svgOrigin: "540 960" }, { scale: 1.02, svgOrigin: "540 960", duration: DUR, ease: "none" }, 0);

      // tu local apagado (medio dibujado al arrancar), el otro también
      dibujar(qa(".s06-dib-a"), 0, 0.45, 0.45);
      dibujar(qa(".s06-dib-b"), 0, 0.45, 0.45);
      tl.fromTo(q(".s06-suelo"), { scaleX: 0.6, svgOrigin: "540 1120" }, { scaleX: 1, svgOrigin: "540 1120", duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(qa(".s06-txt-a, .s06-txt-b"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.2);
      tl.to(qa(".s06-dib-a, .s06-txt-a"), { opacity: 0.4, duration: 0.3 }, 0.4);
      tl.fromTo(q(".s06-cerrado"), { opacity: 0, rotation: -25, svgOrigin: "0 -78" }, { opacity: 1, rotation: 0, svgOrigin: "0 -78", duration: 0.5, ease: "back.out(2.5)" }, 0.25);

      // el cliente, con la bolsa vacía, frente a tu local
      tl.fromTo(q(".s06-cli"), { opacity: 0, x: 450 }, { opacity: 1, x: 480, duration: 0.3, ease: "power2.out" }, 0.05);
      tl.to(q(".s06-bolsa"), { y: -8, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3 }, COMPRAR);
      tl.fromTo(q(".s06-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);

      // "le compró a otro": cruza al otro local
      tl.to(q(".s06-cli"), { x: 660, duration: 0.6, ease: "power1.inOut" }, LE - 0.1);
      tl.fromTo(q(".s06-cuerpo"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, LE - 0.1);
      tl.to(qa(".s06-luz-b"), { opacity: 0.85, duration: 0.2 }, OTRO - 0.2);
      tl.to(q(".s06-otro-in"), { scale: 1.06, svgOrigin: "0 -110", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, OTRO - 0.1);
      tl.fromTo(q(".s06-tilde"), { opacity: 0, scale: 0.4, svgOrigin: "29 -34" }, { opacity: 1, scale: 1, svgOrigin: "29 -34", duration: 0.3, ease: "back.out(2.4)" }, OTRO);
      tl.to(q(".s06-e1"), { opacity: 0, duration: 0.2 }, LE - 0.1);
      tl.fromTo(q(".s06-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, LE + 0.1);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
