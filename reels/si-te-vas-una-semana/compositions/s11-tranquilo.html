      <svg viewBox="0 0 1080 1920" aria-hidden="true">

          <line class="ln s11-suelo" x1="50" y1="1150" x2="1030" y2="1150" />
          <!-- la playa -->
          <g class="s11-playa">
            <circle class="ln s11-dib-p" cx="100" cy="760" r="28" />
            <path class="ln s11-rayos" d="M100 714 V702 M100 806 V818 M54 760 H42 M146 760 H158 M67 727 L59 719 M133 727 L141 719 M67 793 L59 801 M133 793 L141 801" />
            <path class="ln s11-dib-p" d="M110 900 Q250 780 390 900 Z" />

  <script>
    (function () {
      const ID = "s11-tranquilo";
      const DUR = 3.62;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const VOS = 0.6;
      const TRANQUILO = 0.9;
      const NEGOCIO = 2.0;
      const SIGUE = 2.3;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      tl.fromTo(q(".s11-todo"), { scale: 0.97, svgOrigin: "540 950" }, { scale: 1.02, svgOrigin: "540 950", duration: DUR, ease: "none" }, 0);

      // la playa y el local arrancan medio dibujados
      dibujar(qa(".s11-dib-p"), 0, 0.5, 0.5);
      gsap.set(q(".s11-local"), { x: 800, y: 1150 });
      dibujar(qa(".s11-dib-l"), 0.05, 0.5, 0.5);
      tl.fromTo(q(".s11-suelo"), { scaleX: 0.6, svgOrigin: "540 1150" }, { scaleX: 1, svgOrigin: "540 1150", duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(q(".s11-txt"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
      tl.fromTo(qa(".s11-luz"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 0.35);

      // "vos te vas tranquilo": vos te recostás, el sol gira
      tl.fromTo(q(".s11-vos"), { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.8)" }, VOS - 0.2);
      gsap.set(q(".s11-rayos"), { opacity: 0 });
      tl.to(q(".s11-rayos"), { opacity: 1, duration: 0.2 }, TRANQUILO - 0.1);
      tl.fromTo(q(".s11-rayos"), { rotation: 0, svgOrigin: "100 760" }, { rotation: 80, svgOrigin: "100 760", duration: DUR - TRANQUILO, ease: "none", immediateRender: false }, TRANQUILO - 0.1);
      tl.to(q(".s11-vos"), { rotation: -3, svgOrigin: "370 1090", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, TRANQUILO + 0.2);
      tl.fromTo(q(".s11-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, VOS);

      // "el negocio sigue vendiendo": llegan pedidos al local
      tl.to(q(".s11-local-in"), { scale: 1.06, svgOrigin: "0 -110", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, NEGOCIO);
      tl.to(q(".s11-e1"), { opacity: 0, duration: 0.2 }, NEGOCIO - 0.15);
      tl.fromTo(q(".s11-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, NEGOCIO);
      gsap.set(qa(".s11-noti"), { opacity: 0 });
      qa(".s11-noti").forEach((n, i) => {
        const t = SIGUE - 0.2 + i * 0.32;
        tl.fromTo(n, { x: 800, y: 830 - i * 66, opacity: 0, scale: 0.7 }, { y: 790 - i * 66, opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, t);
        tl.to(qa(".s11-luz"), { opacity: 0.4, duration: 0.06, yoyo: true, repeat: 1 }, t);
      });

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
