  <script>
    (function () {
      const ID = "s01-vacaciones";
      const DUR = 4.26;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SEMANA = 0.9;
      const VACACIONES = 1.3;
      const NEGOCIO = 2.62;
      const SIGUE = 3.0;
      const VENDIENDO = 3.3;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // todo se acerca despacio
      tl.fromTo(q(".s01-todo"), { scale: 0.97, svgOrigin: "540 930" }, { scale: 1.02, svgOrigin: "540 930", duration: DUR, ease: "none" }, 0);

      // el calendario arranca medio dibujado (cuadro 0 no negro); los días caen uno tras otro
      dibujar(qa(".s01-dib-cal"), 0, 0.5, 0.5);
      qa(".s01-dia").forEach((d, i) => {
        tl.fromTo(d, { opacity: 0.3, y: -10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, i * 0.07);
      });
      // "semana": la llave verde abraza los 7 días y los días saltan
      dibujar([q(".s01-llave")], SEMANA - 0.1, 0.45);
      qa(".s01-dia").forEach((d, i) => {
        tl.to(d, { y: -8, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, SEMANA + i * 0.04);
      });

      // "vacaciones": la sombrilla, el sol y las olas
      tl.fromTo(q(".s01-suelo"), { scaleX: 0, svgOrigin: "540 1150" }, { scaleX: 1, svgOrigin: "540 1150", duration: 0.6, ease: "power3.out" }, VACACIONES - 0.2);
      dibujar(qa(".s01-dib-som"), VACACIONES - 0.1, 0.5);
      dibujar(qa(".s01-dib-sol"), VACACIONES + 0.1, 0.45);
      dibujar(qa(".s01-dib-ola"), VACACIONES + 0.2, 0.6);
      tl.fromTo(qa(".s01-dib-ola"), { x: 0 }, { x: 18, duration: DUR - VACACIONES, ease: "sine.inOut", immediateRender: false }, VACACIONES + 0.2);
      tl.to(qa(".s01-dib-sol")[1], { rotation: 45, svgOrigin: "132 850", duration: DUR - VACACIONES, ease: "none" }, VACACIONES + 0.1);
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, VACACIONES);

      // "negocio": tu local se dibuja con las luces prendidas
      gsap.set(q(".s01-local"), { x: 810, y: 1150 });
      dibujar(qa(".s01-dib-loc"), NEGOCIO - 0.25, 0.45);
      tl.fromTo(q(".s01-txt"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, NEGOCIO + 0.05);
      tl.fromTo(qa(".s01-luz"), { opacity: 0 }, { opacity: 0.85, duration: 0.2 }, NEGOCIO + 0.1);
      tl.fromTo(q(".s01-local-in"), { scale: 1.1, svgOrigin: "0 -110" }, { scale: 1, svgOrigin: "0 -110", duration: 0.4, ease: "power3.out" }, NEGOCIO - 0.2);

      // "sigue vendiendo": el "?" con golpe y las ventanas parpadean
      gsap.set(q(".s01-preg"), { opacity: 0 });
      tl.fromTo(q(".s01-preg"), { opacity: 0, scale: 0.4, svgOrigin: "962 850" }, { opacity: 1, scale: 1, svgOrigin: "962 850", duration: 0.35, ease: "back.out(2.2)" }, SIGUE);
      tl.to(q(".s01-preg"), { rotation: -12, svgOrigin: "962 892", duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 3 }, SIGUE + 0.35);
      tl.to(qa(".s01-luz"), { opacity: 0.2, duration: 0.07, ease: "none", yoyo: true, repeat: 5 }, VENDIENDO);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.2 }, SIGUE - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, SIGUE);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
