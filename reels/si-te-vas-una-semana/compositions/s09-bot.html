  <script>
    (function () {
      const ID = "s09-bot";
      const DUR = 6.93;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)

      const ARMAMOS = 0.87;
      const COMERCIOS = 1.47;
      const BOT = 2.57;
      const CONTESTA = 3.37;
      const INSTANTE = 3.97;
      const PRECIOS = 4.77;
      const TOMA = 5.57;
      const PEDIDOS = 5.97;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // caja de marca: arranca medio dibujada, nombre con pop
      dibujar([q(".s09-dib-caja")], 0, 0.55, 0.5);
      pop(q(".s09-nombre"), SCALERICS, "540 860");
      tl.fromTo(q(".s09-caja"), { scale: 0.97, svgOrigin: "540 880" }, { scale: 1.02, svgOrigin: "540 880", duration: BOT, ease: "none", immediateRender: false }, 0);
      tl.to(q(".s09-caja"), { scale: 1.07, svgOrigin: "540 880", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, ARMAMOS);
      tl.fromTo(q(".s09-para"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, COMERCIOS);
      // "bot": la caja se va
      tl.to(q(".s09-caja"), { opacity: 0, y: -60, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, BOT - 0.35);

      // el celular
      dibujar(qa(".s09-dib-tel"), BOT - 0.1, 0.5);
      gsap.set(qa(".s09-cab, .s09-m1, .s09-m2, .s09-m3, .s09-pedido"), { opacity: 0 });
      tl.to(qa(".s09-cab"), { opacity: 1, duration: 0.25 }, BOT + 0.2);
      tl.fromTo(q(".s09-tel"), { y: 40 }, { y: 0, duration: 0.5, ease: "power3.out" }, BOT - 0.1);
      tl.fromTo(q(".s09-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, BOT);
      pop(q(".s09-m1"), BOT + 0.45, "366 820");

      // "contesta al instante": la respuesta verde y el rayo
      pop(q(".s09-m2"), CONTESTA, "714 932");
      dibujar([q(".s09-rayo")], CONTESTA + 0.1, 0.35);
      tl.fromTo(q(".s09-rayo"), { scale: 1 }, { scale: 1.2, svgOrigin: "805 875", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, INSTANTE);
      // "precios": el precio late
      tl.to(q(".s09-precio"), { scale: 1.25, svgOrigin: "642 868", duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, PRECIOS);
      tl.to(q(".s09-rayo"), { opacity: 0.4, duration: 0.3 }, PRECIOS);

      // "toma los pedidos": el cliente dice dale y aparece el pedido
      pop(q(".s09-m3"), TOMA - 0.4, "366 1004");
      pop(q(".s09-pedido"), TOMA, "540 1180");
      dibujar([q(".s09-tilde")], PEDIDOS, 0.3);
      tl.to(q(".s09-pedido"), { scale: 1.05, svgOrigin: "540 1110", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, PEDIDOS + 0.3);
      tl.to(q(".s09-e1"), { opacity: 0, duration: 0.2 }, TOMA - 0.1);
      tl.fromTo(q(".s09-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, TOMA);
      tl.to(q(".s09-tel"), { y: -8, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, PEDIDOS + 0.2);

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
