<template>

  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s02-trabajo"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }

  <div id="root" data-composition-id="s02-trabajo" data-width="1080" data-height="1920" data-duration="4.06">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="4.06" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s02-todo">
          <line class="ln s02-suelo" x1="150" y1="1150" x2="930" y2="1150" />
          <!-- tu local, grande -->
          <g class="s02-local">
            <path class="ln s02-dib" d="M-168 0 V-238 H168 V0" />
            <path class="ln s02-dib" d="M-196 -238 H196 L171 -300 H-171 Z" />
            <path class="ln s02-dib" d="M-196 -238 q24.5 34 49 0 q24.5 34 49 0 q24.5 34 49 0 q24.5 34 49 0 q24.5 34 49 0 q24.5 34 49 0 q24.5 34 49 0 q24.5 34 49 0" />
            <rect class="ln s02-dib" x="-140" y="-170" width="80" height="72" rx="6" />
            <rect class="ln s02-dib" x="60" y="-170" width="80" height="72" rx="6" />
            <rect class="vidrio s02-luz" x="-130" y="-160" width="60" height="52" rx="4" />
            <rect class="vidrio s02-luz" x="70" y="-160" width="60" height="52" rx="4" />
            <path class="ln s02-dib" d="M-34 0 V-134 H34 V0" />
          </g>
          <!-- cartel -->
          <g class="s02-cartel">
            <g class="s02-cartel-in">
              <rect class="ln s02-marco" x="400" y="690" width="280" height="80" rx="14" />

              <text class="cartel s02-t1" x="540" y="745" text-anchor="middle">NEGOCIO</text>

  </div>
  <script>
    (function () {
      const ID = "s02-trabajo";
      const DUR = 4.06;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const NO = 0.74;
      const NO2 = 1.44;
      const NEGOCIO = 2.04;
      const TENES = 2.83;
      const TRABAJO = 3.14;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      gsap.set(q(".s02-local"), { x: 540, y: 1150 });
      tl.fromTo(q(".s02-todo"), { scale: 0.97, svgOrigin: "540 930" }, { scale: 1.02, svgOrigin: "540 930", duration: DUR, ease: "none" }, 0);

      // el local arranca medio dibujado, con luz
      dibujar(qa(".s02-dib"), 0, 0.5, 0.45);
      tl.fromTo(q(".s02-suelo"), { scaleX: 0.6, svgOrigin: "540 1150" }, { scaleX: 1, svgOrigin: "540 1150", duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(qa(".s02-luz"), { opacity: 0 }, { opacity: 0.85, duration: 0.2 }, 0.2);
      gsap.set(qa(".s02-marco-ac, .s02-t2"), { opacity: 0 });
      pop(q(".s02-cartel-in"), 0.15, "540 730");
      tl.fromTo(q(".s02-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);

      // "no,": se apagan las luces y aparece el badge
      tl.to(qa(".s02-luz"), { opacity: 0, duration: 0.25 }, NO);
      tl.to(qa(".s02-dib"), { opacity: 0.45, duration: 0.35 }, NO);
      gsap.set(q(".s02-badge"), { opacity: 0 });
      tl.fromTo(q(".s02-badge"), { opacity: 0, scale: 0.4, svgOrigin: "680 690" }, { opacity: 1, scale: 1, svgOrigin: "680 690", duration: 0.35, ease: "back.out(2.2)" }, NO + 0.05);

      // "no tenés un negocio": se tacha NEGOCIO
      dibujar([q(".s02-tacha")], NO2 + 0.1, 0.5);
      tl.to(q(".s02-cartel-in"), { x: 6, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, NEGOCIO);

      // "Tenés un trabajo": el cartel gira y dice TRABAJO
      tl.to(q(".s02-cartel-in"), { scaleY: 0, svgOrigin: "540 730", duration: 0.16, ease: "power2.in" }, TENES - 0.05);
      tl.to(qa(".s02-tacha, .s02-badge, .s02-t1, .s02-marco"), { opacity: 0, duration: 0.01 }, TENES + 0.11);
      tl.to(qa(".s02-marco-ac, .s02-t2"), { opacity: 1, duration: 0.01 }, TENES + 0.11);
      tl.to(q(".s02-cartel-in"), { scaleY: 1, svgOrigin: "540 730", duration: 0.3, ease: "back.out(2)" }, TENES + 0.12);
      tl.to(q(".s02-e1"), { opacity: 0, duration: 0.2 }, TENES - 0.1);
      tl.fromTo(q(".s02-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, TENES + 0.05);

      // vos, atado con la cadena
      gsap.set(qa(".s02-vos"), { opacity: 0 });
      pop(q(".s02-vos"), TRABAJO - 0.1, "800 1150");
      dibujar([q(".s02-cadena")], TRABAJO + 0.1, 0.3);
      tl.fromTo(q(".s02-bola"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.3, ease: "bounce.out" }, TRABAJO + 0.2);
      tl.to(q(".s02-vos"), { x: 10, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3 }, TRABAJO + 0.5);

      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
