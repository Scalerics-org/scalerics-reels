      const Y = 920;
      const XS = [270, 540, 810];
      const BADGE = [[70, -90], [80, -96], [64, -90]];

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const badge = (el, t) => {
        const inn = el.querySelector(".s03-b-in");
        tl.fromTo(inn, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const sacudir = (el, t) => tl.to(el, { x: -6, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      const nombre = (el, t) => tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);

      const icos = [q(".s03-ico1"), q(".s03-ico2"), q(".s03-ico3")];
      icos.forEach((g, i) => gsap.set(g, { x: XS[i], y: Y }));
      qa(".s03-dib").forEach((d) => gsap.set(d, { scale: 1.12, svgOrigin: "0 0" }));
      [q(".s03-b1"), q(".s03-b2"), q(".s03-b3")].forEach((b, i) => gsap.set(b, { x: XS[i] + BADGE[i][0] * 1.12, y: Y + BADGE[i][1] * 1.12 }));
      qa(".s03-b-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      qa(".s03-n").forEach((n) => gsap.set(n, { opacity: 0 }));
      gsap.set(q(".s03-ene"), { opacity: 0 });

      tl.fromTo(q(".s03-fila"), { scale: 1.05, svgOrigin: "540 " + Y }, { scale: 1, svgOrigin: "540 " + Y, duration: DUR, ease: "none" }, 0);

      // 1. empleados (arranca medio dibujado)
      dibujar(qa(".s03-d1"), 0, 0.45, 0.5);
      tl.fromTo(q(".s03-ico1 .s03-dib"), { y: 20 }, { y: 0, duration: 0.45, ease: "power3.out" }, 0);
      nombre(q(".s03-ico1 .s03-n"), EMPLEADOS - 0.2);
      badge(q(".s03-b1"), EMPLEADOS + 0.12);
      sacudir(q(".s03-ico1 .s03-dib"), EMPLEADOS + 0.14);

      // 2. temporada
      tl.to(q(".s03-ico1"), { opacity: 0.4, duration: 0.3 }, NI1);
      dibujar(qa(".s03-d2"), NI1 + 0.04, 0.4);
      tl.fromTo(q(".s03-ene"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, NI1 + 0.3);
      tl.fromTo(q(".s03-ico2 .s03-dib"), { rotation: -12, svgOrigin: "0 66" }, { rotation: 0, svgOrigin: "0 66", duration: 0.5, ease: "back.out(2)" }, NI1 + 0.04);
      nombre(q(".s03-ico2 .s03-n"), TEMPORADA);
      badge(q(".s03-b2"), TEMPORADA + 0.12);
      sacudir(q(".s03-ico2 .s03-dib"), TEMPORADA + 0.14);

      // 3. suerte
      tl.to(q(".s03-ico2"), { opacity: 0.4, duration: 0.3 }, NI2);
      dibujar(qa(".s03-d3"), NI2 + 0.04, 0.4);
      tl.fromTo(q(".s03-ico3 .s03-dib"), { rotation: -30, svgOrigin: "0 0" }, { rotation: 0, svgOrigin: "0 0", duration: 0.5, ease: "back.out(1.8)" }, NI2 + 0.04);
      nombre(q(".s03-ico3 .s03-n"), SUERTE - 0.1);
      badge(q(".s03-b3"), SUERTE);
      sacudir(q(".s03-ico3 .s03-dib"), SUERTE + 0.04);

      tl.fromTo(q(".s03-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, SUERTE - 0.15);

      // salida

      window.__timelines = window.__timelines || {};
