  <script>
    (function () {
      const ID = "s08-barco";
      const DUR = 6.34;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const qa = (s) => [...root.querySelectorAll(s)];
      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s08-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const habla = (sel, t, n, d = 0.11) => {
        // boca que se abre y cierra n veces
        for (let i = 0; i < n; i++) tl.to(q(sel), { scaleY: 0.25, duration: d, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + i * d * 2);
      };


      const BARCO = 0.16, CLIENTES = 1.04, C1 = 1.6, DM1 = 2.4, C2 = 3.12, DM2 = 3.84, SIGUIO = 4.7, LARGO = 5.25;
      // el barco cruza el horizonte
      tl.fromTo(q(".s08-barco"), { x: -120 }, { x: 600, duration: SIGUIO - 0.1, ease: "none" }, 0);
      tl.to(q(".s08-barco"), { x: 1450, duration: 1.0, ease: "power2.in" }, SIGUIO - 0.1);
      tl.to(q(".s08-barco"), { y: -8, rotation: 1.5, svgOrigin: "40 960", duration: 0.5, yoyo: true, repeat: 9, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s08-humo"), { y: 0, opacity: 0.7 }, { y: -40, opacity: 0.3, duration: 1.2, repeat: 4, ease: "none" }, 0);
      slam(q(".s08-un"), BARCO + 0.05);
      golpe(BARCO + 0.08, 10);
      fuera(q(".s08-un"), C1 - 0.2, 0.15);
      tl.to(qa(".s08-barco .cliente"), { y: -14, duration: 0.15, yoyo: true, repeat: 1, stagger: 0.04 }, CLIENTES);
      // Vero salta agitando el cartel
      gsap.set(q(".s08-cartel"), { opacity: 0 });
      tl.fromTo(q(".s08-cartel"), { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(1.6)", immediateRender: false }, C1 - 0.3);
      tl.to(q(".s08-brazo-d"), { rotation: -150, svgOrigin: "44 -262", duration: 0.2 }, C1 - 0.3);
      [C1, C2].forEach((t) => {
        tl.to(q(".s08-todo-vero"), { y: -120, duration: 0.22, ease: "power2.out" }, t);
        tl.to(q(".s08-todo-vero"), { y: 0, duration: 0.22, ease: "power2.in" }, t + 0.22);
        tl.to(q(".s08-cartel"), { rotation: 10, svgOrigin: "440 1330", duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut" }, t);
        tl.to(q(".s08-boca"), { scaleY: 2, svgOrigin: "0 -318", duration: 0.1, yoyo: true, repeat: 3 }, t);
      });
      golpe(DM1, 8);
      golpe(DM2, 10);
      // "siguió de largo": bocina, el barco se va, el cartel cae
      slam(q(".s08-largo"), LARGO);
      golpe(LARGO + 0.05, 12);
      tl.to(q(".s08-cartel"), { rotation: 75, svgOrigin: "440 1330", duration: 0.4, ease: "bounce.out" }, LARGO - 0.2);
      tl.to(q(".s08-brazo-d"), { rotation: -20, duration: 0.3 }, LARGO - 0.2);
      tl.to(q(".s08-boca"), { scaleY: -0.6, svgOrigin: "0 -312", duration: 0.2 }, LARGO);


      // salida: una ola se la lleva hacia abajo
      tl.to(q("#s08-escena"), { y: 260, opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
