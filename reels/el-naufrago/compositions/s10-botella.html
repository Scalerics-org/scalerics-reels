  <script>
    (function () {
      const ID = "s10-botella";
      const DUR = 4.45;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const qa = (s) => [...root.querySelectorAll(s)];
      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const habla = (sel, t, n, d = 0.11) => {
        // boca que se abre y cierra n veces
        for (let i = 0; i < n; i++) tl.to(q(sel), { scaleY: 0.25, duration: d, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + i * d * 2);
      };


      const PERDIDA = 0.24, PORQUE = 0.79, COMPRARTE = 1.33, HAY = 1.97, MANDARTE = 2.42, BOTELLA = 3.15;
      tl.fromTo(q(".s10-escenario"), { scale: 1.08 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "40% 60%" }, 0);
      tl.fromTo(q(".s10-clienta"), { x: -200, opacity: 0.4 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.to(q(".s10-cel"), { y: -10, duration: 0.15, yoyo: true, repeat: 3 }, 0.3);
      gsap.set(q(".s10-quiero"), { rotation: -6 });
      pop(q(".s10-quiero"), PORQUE - 0.1, 0.4);
      slam(q(".s10-para"), COMPRARTE);
      golpe(COMPRARTE + 0.05, 8);
      gsap.set(q(".s10-papel-g"), { opacity: 0 });
      fuera([q(".s10-quiero"), q(".s10-cel")], HAY - 0.1, 0.12);
      pop(q(".s10-papel-g"), HAY - 0.05, 0.5);
      tl.to(q(".s10-papel-g"), { rotation: 4, svgOrigin: "470 1280", duration: 0.08, yoyo: true, repeat: 5 }, HAY + 0.2);
      tl.to(q(".s10-cboca"), { scaleY: -1, svgOrigin: "300 1104", duration: 0.2 }, HAY);
      fuera(q(".s10-para"), MANDARTE - 0.12, 0.1);
      slam(q(".s10-hay"), MANDARTE);
      golpe(MANDARTE + 0.05, 10);
      gsap.set(q(".s10-gigante"), { opacity: 0 });
      tl.fromTo(q(".s10-gigante"), { opacity: 1, y: -900, rotation: -40 }, { opacity: 1, y: 0, rotation: 0, duration: 0.3, ease: "power3.in", immediateRender: false }, BOTELLA - 0.3);
      golpe(BOTELLA, 24);
      tl.to(q(".s10-gigante"), { rotation: 6, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, BOTELLA + 0.1);
      tl.to(q(".s10-hay span"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1 }, BOTELLA);


      // salida: una ola se la lleva hacia abajo
      tl.to(q("#s10-escena"), { y: 260, opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
