  <script>
    (function () {
      const ID = "s07-pelota";
      const DUR = 7.03;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const qa = (s) => [...root.querySelectorAll(s)];
      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s07-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const habla = (sel, t, n, d = 0.11) => {
        // boca que se abre y cierra n veces
        for (let i = 0; i < n; i++) tl.to(q(sel), { scaleY: 0.25, duration: d, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + i * d * 2);
      };


      const DIJE = 0.09, PRECIOS = 1.0, VISTA = 1.64, VOS = 2.75, PELOTA = 3.23, WILMAR = 3.63, Y = 4.6, SE = 4.73, VENTAS = 5.23, VOS2 = 5.96;
      tl.fromTo(q(".s07-escenario"), { scale: 1.12 }, { scale: 1, duration: 2.6, ease: "power2.out", transformOrigin: "70% 62%" }, 0);
      // Wilmar habla, seco
      habla(".s07-wboca", 0.05, 6, 0.1);
      pop(q(".s07-globo1"), 0.02, 0.5);
      // las etiquetas de precio caen de arriba
      qa(".s07-tag-in").forEach((t, i) => {
        gsap.set(t, { opacity: 0 });
        tl.fromTo(t, { opacity: 0, y: -300 }, { opacity: 1, y: 0, duration: 0.4, ease: "bounce.out", immediateRender: false }, PRECIOS - 0.15 + i * 0.1);
        tl.to(t, { rotation: i % 2 ? 6 : -6, svgOrigin: "0 -200", duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, PRECIOS + 0.3 + i * 0.05);
      });
      tl.to(qa(".s07-tag-in"), { scale: 1.15, duration: 0.12, yoyo: true, repeat: 1, stagger: 0.05 }, VISTA);
      // "¡Vos sos una pelota, Wilmar!": entra Vero furiosa y lo señala
      fuera([q(".s07-globo1"), q(".s07-tags")], VOS - 0.2, 0.15);
      gsap.set(q(".s07-vero"), { opacity: 0 });
      tl.fromTo(q(".s07-vero"), { opacity: 0, x: -300 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, VOS - 0.15);
      tl.to(q(".s07-brazo-d"), { rotation: -95, svgOrigin: "44 -262", duration: 0.15 }, VOS);
      tl.to(q(".s07-boca"), { scaleY: 2, svgOrigin: "0 -318", duration: 0.1 }, VOS);
      gsap.set(q(".s07-dedo"), { opacity: 0 });
      tl.fromTo(q(".s07-dedo"), { opacity: 0 }, { opacity: 1, duration: 0.06, yoyo: true, repeat: 5, immediateRender: false }, PELOTA);
      slam(q(".s07-pelota"), PELOTA);
      golpe(PELOTA + 0.05, 14);
      tl.to(q(".s07-vero-in"), { y: -30, duration: 0.12, yoyo: true, repeat: 1 }, WILMAR);
      // "Y sé más de ventas que vos": caen los lentes, Wilmar sobrador
      fuera(q(".s07-pelota"), Y - 0.1, 0.12);
      tl.to(q(".s07-vero"), { x: -80, opacity: 0.55, duration: 0.3 }, Y);
      tl.to(q(".s07-boca"), { scaleY: 0.3, duration: 0.15 }, Y);
      gsap.set(q(".s07-lentes"), { opacity: 0 });
      tl.fromTo(q(".s07-lentes"), { opacity: 1, y: -260 }, { opacity: 1, y: 0, duration: 0.3, ease: "bounce.out", immediateRender: false }, SE - 0.1);
      habla(".s07-wboca", Y, 6, 0.11);
      tl.to(q(".s07-wilmar"), { rotation: -8, duration: 0.3, ease: "sine.inOut" }, SE + 0.2);
      slam(q(".s07-ventas"), VENTAS);
      golpe(VENTAS + 0.05, 12);
      tl.to(q(".s07-ventas"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1 }, VOS2);


      // salida: una ola se la lleva hacia abajo
      tl.to(q("#s07-escena"), { y: 260, opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
