    (function () {
      const ID = "s05-visto";

      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const slam = (el, t, from = 2.4) => {

      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s05-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const habla = (sel, t, n, d = 0.11) => {
        // boca que se abre y cierra n veces
        for (let i = 0; i < n; i++) tl.to(q(sel), { scaleY: 0.25, duration: d, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + i * d * 2);
      };


      const ENVIOS = 0.29, INTERIOR = 0.76, CONTESTE = 1.83, DIA = 2.39, DEJO = 3.35, VISTO = 3.91, MEDIO = 4.88, MAR = 5.51;
      tl.fromTo(q(".s05-mundo"), { scale: 1.06 }, { scale: 1, svgOrigin: "540 1150", duration: MEDIO, ease: "none" }, 0);
      tl.fromTo(q(".s05-b"), { y: 0, rotation: 0 }, { y: -18, rotation: 8, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);
      gsap.set(q(".s05-msg"), { rotation: -3 });
      tl.fromTo(q(".s05-msg"), { opacity: 0.4, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out" }, 0);
      tl.to(q(".s05-msg"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1 }, INTERIOR);
      fuera(q(".s05-msg"), CONTESTE - 0.2);
      // el sol cruza el cielo: pasó un día entero
      const arco = q(".s05-arco");
      const L = arco.getTotalLength();
      const sol = q(".s05-sol");
      const pr = { p: 0 };
      tl.to(pr, { p: 1, duration: 1.1, ease: "power1.inOut", onUpdate: () => { const pt = arco.getPointAtLength(pr.p * L); sol.setAttribute("cx", pt.x); sol.setAttribute("cy", pt.y); } }, CONTESTE - 0.1);
      slam(q(".s05-dia"), DIA);
      golpe(DIA + 0.05, 10);
      fuera([q(".s05-dia"), q(".s05-arco"), q(".s05-sol")], DEJO - 0.15);
      // "me dejó en visto": dos tildes coral gigantes
      dibujar(q(".s05-t1"), DEJO - 0.05, 0.22);
      dibujar(q(".s05-t2"), DEJO + 0.15, 0.22);
      gsap.set(q(".s05-visto"), { rotation: -6 });
      slam(q(".s05-visto"), VISTO);
      golpe(VISTO + 0.05, 16);
      tl.to(q(".s05-boca"), { scaleY: 0.2, svgOrigin: "0 -315", duration: 0.15 }, VISTO);
      // "en el medio del mar": la cámara se aleja, la isla queda chiquita y las tildes flotan

      tl.to(q(".s05-mundo"), { scale: 0.42, svgOrigin: "540 1150", duration: 0.9, ease: "power3.inOut" }, MEDIO - 0.1);
      tl.to(q(".s05-tildes"), { y: 540, x: 520, duration: 0.9, ease: "power3.inOut" }, MEDIO - 0.1);

      tl.to(q(".s05-oceano"), { x: -40, duration: 1.4, ease: "sine.inOut" }, MEDIO + 0.3);
      tl.to(q(".s05-tildes"), { rotation: 8, svgOrigin: "490 860", duration: 0.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, MAR - 0.3);
