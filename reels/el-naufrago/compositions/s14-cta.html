    (function () {
      const ID = "s14-cta";
      const DUR = 6.81;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {

            const pth = document.createElementNS(NS, "path");

            pth.setAttribute("stroke", fila % 2 ? "#ff6f59" : "#04161c");
            pth.setAttribute("stroke-width", "7");

            pth.setAttribute("d", r < 4 ? `M${x0 + r * 18} ${y0} v66` : `M${x0 - 12} ${y0 + 54} L${x0 + 70} ${y0 + 10}`);

            gsap.set(pth, { strokeDasharray: 100, strokeDashoffset: 100, opacity: 0 });

            k++;
