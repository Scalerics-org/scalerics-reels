    (function () {
      const ID = "s02-botella";
      const DUR = 2.86;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const qa = (s) => [...root.querySelectorAll(s)];
      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const habla = (sel, t, n, d = 0.11) => {
        // boca que se abre y cierra n veces
        for (let i = 0; i < n; i++) tl.to(q(sel), { scaleY: 0.25, duration: d, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + i * d * 2);
      };


      const UNA = 0.47, BOTELLA = 0.96, PRECIO = 1.88;
      tl.fromTo(q(".s02-escenario"), { scale: 1.05 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 70%" }, 0);
      tl.fromTo(q(".s02-isla"), { y: 30, opacity: 0.7 }, { y: 0, opacity: 1, duration: 0.3 }, 0);
      tl.fromTo(q(".s02-vero"), { opacity: 0.6 }, { opacity: 1, duration: 0.25 }, 0);
      tl.fromTo([q(".s02-sol"), q(".s02-sol-r")], { y: -30 }, { y: 30, duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s02-sol-r"), { rotation: 0 }, { rotation: 30, svgOrigin: "800 900", duration: DUR, ease: "none" }, 0);
      // Vero emocionada: salta y levanta los brazos
      tl.to(q(".s02-vero-in"), { y: -40, duration: 0.18, yoyo: true, repeat: 3, ease: "power2.out" }, 0.05);
      tl.to(q(".s02-brazo-i"), { rotation: 130, svgOrigin: "-44 -262", duration: 0.2 }, 0.05);
      tl.to(q(".s02-brazo-d"), { rotation: -130, svgOrigin: "44 -262", duration: 0.2 }, 0.05);
      // la ola la trae desde la derecha
      const b = q(".s02-botella-pos");
      const pos = { t: 0 };
      const ruta = (k) => [1180 - 560 * k, 1180 + 150 * k - Math.sin(k * Math.PI * 2) * 60, -30 + 50 * k];
      const pon = () => { const [x, y, r] = ruta(pos.t); b.setAttribute("transform", `translate(${x} ${y}) rotate(${r}) scale(1.1)`); };
      pon();
      tl.to(pos, { t: 1, duration: BOTELLA, ease: "power1.in", onUpdate: pon }, 0);
      tl.fromTo(q(".s02-ola-g"), { x: 300 }, { x: -260, duration: BOTELLA + 0.3, ease: "power1.inOut" }, 0);
      tl.to(q(".s02-ola-g"), { opacity: 0, duration: 0.3 }, BOTELLA + 0.1);
      // aterriza: splash
      golpe(BOTELLA, 10);
      qa(".s02-gotas circle").forEach((c, i) => {
        gsap.set(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 1, x: 0, y: 40 }, { opacity: 0, x: (i - 2) * 40, y: -70 - (i % 2) * 40, duration: 0.5, ease: "power2.out", immediateRender: false }, BOTELLA);
      });
      pop(q(".s02-nueva"), UNA + 0.1, 0.4);
      fuera(q(".s02-nueva"), PRECIO - 0.2);
      // salta el corcho
      tl.to(q(".s02-corcho"), { x: 120, y: -160, rotation: 200, svgOrigin: "113 0", opacity: 0, duration: 0.45, ease: "power2.out" }, PRECIO - 0.45);
      // el papelito: ¿precio?
      gsap.set(q(".s02-msg"), { rotation: -5 });
      slam(q(".s02-msg"), PRECIO, 0.3);
      golpe(PRECIO + 0.05, 12);
      tl.to(q(".s02-msg"), { rotation: 3, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, PRECIO + 0.2);

      tl.to([q(".s02-brazo-i"), q(".s02-brazo-d")], { rotation: 0, duration: 0.25 }, PRECIO + 0.1);
      tl.to(q(".s02-boca"), { scaleY: 0.3, svgOrigin: "0 -315", duration: 0.2 }, PRECIO + 0.1);


      // salida: una ola se la lleva hacia abajo
