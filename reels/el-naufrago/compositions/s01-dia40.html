  <script>
    (function () {
      const ID = "s01-dia40";
      const DUR = 6.49;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";

      // helpers
      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };

      // tiempos (relativos a la escena)
      const CUARENTA = 0.24, ISLA = 1.28, SIGUEN = 2.76, DOS = 3.2, PERSONAS = 3.6, Y = 4.6, MADRE = 5.36;

      // cuadro 0: la isla ya está (a medio aparecer) y la cámara se acerca despacio
      tl.fromTo(q(".s01-escenario"), { scale: 1.08 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 62%" }, 0);
      tl.fromTo(q(".s01-isla"), { y: 40, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo(q(".s01-vero"), { y: 30, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s01-hojas"), { rotation: -3 }, { rotation: 3, svgOrigin: "734 896", duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      gsap.set(qa(".s01-clientes circle"), { opacity: 0 });

      // "Día cuarenta": cae DÍA 40 y el cuaderno con 40 rayitas que se tachan solas
      tl.fromTo(q(".s01-dia"), { opacity: 0.4, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out" }, 0.02);
      golpe(CUARENTA + 0.05, 12);
      pop(q(".s01-cuaderno"), 0.3, 0.8);
      const rayas = q(".s01-rayas");
      for (let g = 0; g < 8; g++) {
        const x0 = 176 + g * 52;
        for (let k = 0; k < 5; k++) {
          const p = document.createElementNS(NS, "path");
          p.setAttribute("class", "raya");
          p.setAttribute("d", k < 4 ? `M${x0 + k * 10} ${g % 2 ? 846 : 836} v84` : `M${x0 - 8} ${910} L${x0 + 42} ${852}`);
          rayas.appendChild(p);
          const L = 100;
          gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          const t = 0.4 + (g * 5 + k) * 0.022;
          tl.set(p, { opacity: 1 }, t);
          tl.to(p, { strokeDashoffset: 0, duration: 0.08, ease: "none" }, t);
        }
      }
      // el cuaderno se va (deja lugar al cartel y al contador)
      tl.to([q(".s01-cuaderno"), rayas], { opacity: 0, y: -40, duration: 0.25, ease: "power2.in" }, 2.45);

      // "isla de Instagram": cartelito clavado en la arena
      pop(q(".s01-cartel"), ISLA - 0.05, 0.4);
      tl.to(q(".s01-cartel"), { rotation: -2, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, ISLA + 0.3);

      // "me siguen dos mil personas": contador que sube y seguidores que aparecen en el mar
      pop(q(".s01-contador"), SIGUEN - 0.1);
      const num = { v: 0 };
      tl.to(num, { v: 2000, duration: 0.9, ease: "power2.out", onUpdate: () => { q(".s01-num").textContent = Math.round(num.v).toLocaleString("es-UY"); } }, DOS - 0.1);
      qa(".s01-clientes circle").forEach((c, i) => tl.fromTo(c, { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.22, ease: "back.out(3)", immediateRender: false }, DOS + i * 0.06));
      tl.to(q(".s01-contador"), { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1 }, PERSONAS + 0.2);
      // los seguidores flotan, mirando
      tl.to(qa(".s01-clientes circle"), { y: -8, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut", stagger: 0.05 }, PERSONAS + 0.4);

      // "y no me compra ni mi madre": sello VENTAS: 0, todo se apaga
      tl.to(q(".s01-boca"), { scaleY: 0.3, svgOrigin: "540 1055", duration: 0.2 }, Y);
      tl.to([q(".s01-contador"), q(".s01-cartel"), q(".s01-dia"), ...qa(".s01-clientes circle")], { opacity: 0.25, duration: 0.25 }, MADRE - 0.2);
      gsap.set(q(".s01-sello"), { rotation: -8 });
      slam(q(".s01-sello"), MADRE - 0.02);
      golpe(MADRE + 0.06, 18);
      pop(q(".s01-mama"), MADRE + 0.35, 0.5);

      // salida: una ola se la lleva hacia abajo
      tl.to(q("#s01-escena"), { y: 260, opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
