    (function () {
      const ID = "s03-respuesta";
      const DUR = 3.79;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const qa = (s) => [...root.querySelectorAll(s)];
      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s03-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const habla = (sel, t, n, d = 0.11) => {
        // boca que se abre y cierra n veces
        for (let i = 0; i < n; i++) tl.to(q(sel), { scaleY: 0.25, duration: d, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + i * d * 2);
      };


      const MANDE = 0.08, BOTELLA = 0.96, CUANDO = 1.73, COMPRADO = 2.4, OTRO = 2.88;
      tl.fromTo(q(".s03-escenario"), { scale: 1.04 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 60%" }, 0);
      tl.fromTo([q(".s03a-isla"), q(".s03-vero")], { x: -60, opacity: 0.6 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      gsap.set([q(".s03b-isla"), q(".s03-clienta")], { opacity: 0 });
      tl.fromTo([q(".s03b-isla"), q(".s03-clienta")], { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.3);
      gsap.set(q(".s03-bolsa"), { opacity: 0 });
      // el papelito con la respuesta
      gsap.set(q(".s03-resp"), { rotation: -4 });
      pop(q(".s03-resp"), MANDE, 0.4);
      fuera(q(".s03-resp"), BOTELLA - 0.1);
      // Vero la tira
      tl.to(q(".s03-brazo-d"), { rotation: -160, svgOrigin: "44 -262", duration: 0.18, ease: "power2.out" }, 0.25);
      tl.to(q(".s03-brazo-d"), { rotation: -40, svgOrigin: "44 -262", duration: 0.2 }, 0.5);
      // la ruta y la botella que viaja lento, lento
      const ruta = q(".s03-ruta");
      gsap.set(ruta, { clipPath: "inset(0 100% 0 0)" });
      tl.to(ruta, { clipPath: "inset(0 0% 0 0)", duration: 1.2, ease: "power1.inOut" }, 0.35);
      const L = ruta.getTotalLength();
      const b = q(".s03-botella-pos");
      const pr = { p: 0 };
      tl.to(pr, { p: 1, duration: 1.45, ease: "none", onUpdate: () => { const pt = ruta.getPointAtLength(pr.p * L); b.setAttribute("transform", `translate(${pt.x} ${pt.y}) rotate(${-30 + 60 * pr.p + Math.sin(pr.p * 18) * 8}) scale(0.55)`); } }, 0.35);
      // el calendario pasa los días
      gsap.set([q(".s03-cal"), q(".s03-d2"), q(".s03-d3")], { opacity: 0 });
      pop(q(".s03-cal"), BOTELLA - 0.4);
      [[".s03-d1", ".s03-d2", 0.98], [".s03-d2", ".s03-d3", 1.38]].forEach(([a, c, t]) => {
        tl.to(q(a), { y: -120, opacity: 0, duration: 0.12, ease: "power2.in" }, t);
        tl.fromTo(q(c), { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, t + 0.06);
      });
      // cuando llega: la clienta ya tiene la bolsa de otro lado
      fuera(q(".s03-cal"), CUANDO + 0.1);
      pop(q(".s03-bolsa"), CUANDO + 0.2, 0.3);
      tl.to(q(".s03-clienta"), { y: -16, duration: 0.15, yoyo: true, repeat: 3 }, CUANDO + 0.35);
      gsap.set(q(".s03-ya"), { rotation: 6 });
      slam(q(".s03-ya"), COMPRADO);
      golpe(COMPRADO + 0.04, 10);
      slam(q(".s03-otro"), OTRO + 0.04);
      golpe(OTRO + 0.08, 16);
      tl.to(q(".s03-boca"), { scaleY: 0.2, svgOrigin: "0 -315", duration: 0.15 }, OTRO);


      // salida: una ola se la lleva hacia abajo
      tl.to(q("#s03-escena"), { y: 260, opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
