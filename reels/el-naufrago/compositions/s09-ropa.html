  <script>
    (function () {
      const ID = "s09-ropa";
      const DUR = 5.98;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const qa = (s) => [...root.querySelectorAll(s)];
      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s09-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const habla = (sel, t, n, d = 0.11) => {
        // boca que se abre y cierra n veces
        for (let i = 0; i < n; i++) tl.to(q(sel), { scaleY: 0.25, duration: d, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + i * d * 2);
      };


      const ROPA = 0.48, LINDA = 0.96, ISLA = 1.44, POR = 2.31, ESO = 2.49, NO = 3.27, PERDIDA = 3.77, FALTA = 4.4, SEGUIDORES = 4.86;
      tl.fromTo(q(".s09-escenario"), { scale: 1.06 }, { scale: 1, duration: POR, ease: "none", transformOrigin: "50% 60%" }, 0);
      // las prendas se balancean en el perchero de ramas
      qa(".s09-prenda").forEach((el, i) => {
        tl.fromTo(el, { y: -40, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, i * 0.08);
        tl.to(el, { rotation: i % 2 ? 5 : -5, svgOrigin: "12 -54", duration: 0.4, yoyo: true, repeat: 4, ease: "sine.inOut" }, 0.3 + i * 0.1);
      });
      // brillan
      qa(".s09-ch").forEach((c, i) => {
        gsap.set(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.2, transformOrigin: "50% 50%", duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, LINDA - 0.2 + i * 0.12);
      });
      slam(q(".s09-linda"), LINDA);
      golpe(LINDA + 0.05, 8);
      // "Por eso.": corte a Wilmar con lentes, en primer plano
      fuera([q(".s09-linda"), q(".s09-perchero")], POR - 0.15, 0.15);
      gsap.set(q(".s09-wilmar"), { opacity: 0 });
      tl.fromTo(q(".s09-wilmar"), { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.2, ease: "power3.out", immediateRender: false }, POR - 0.05);
      slam(q(".s09-eso"), ESO);
      golpe(ESO + 0.05, 12);
      habla(".s09-wboca", POR, 5, 0.1);
      habla(".s09-wboca", NO, 12, 0.1);
      // le saca los lentes: habla en serio
      tl.to(q(".s09-lentes"), { y: -120, opacity: 0, duration: 0.3, ease: "power2.in" }, NO - 0.3);
      fuera(q(".s09-eso"), NO - 0.1, 0.12);
      // "seguidores" aparece y se tacha
      slam(q(".s09-seg"), FALTA);
      dibujar(q(".s09-tacha"), SEGUIDORES, 0.25);
      golpe(SEGUIDORES + 0.2, 12);
      tl.to(q(".s09-seg"), { opacity: 0.5, duration: 0.2 }, SEGUIDORES + 0.25);
      tl.to(q(".s09-wilmar"), { scale: 1.06, transformOrigin: "50% 50%", duration: 1, ease: "sine.inOut" }, NO);


      // salida: una ola se la lleva hacia abajo
      tl.to(q("#s09-escena"), { y: 260, opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
