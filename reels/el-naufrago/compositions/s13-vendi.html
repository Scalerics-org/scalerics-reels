    (function () {
      const ID = "s13-vendi";
      const DUR = 6.58;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const qa = (s) => [...root.querySelectorAll(s)];
      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s13-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const habla = (sel, t, n, d = 0.11) => {
        // boca que se abre y cierra n veces
        for (let i = 0; i < n; i++) tl.to(q(sel), { scaleY: 0.25, duration: d, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + i * d * 2);
      };


      const SIGUE = 0.28, COMPRA = 0.87, SIN = 1.06, BOTELLA = 1.58, WILMAR = 2.63, VENDI = 3.4, CAMPERA = 3.83, DURMIENDO = 4.23, TE = 5.28;
      // los que te siguen nadan hasta la tienda y compran
      qa(".s13-nadan circle").forEach((c, i) => tl.to(c, { x: (540 - Number(c.getAttribute("cx"))) * 0.9, y: -420 + i * 30, opacity: 0, duration: 0.6, ease: "power2.in" }, 0.05 + i * 0.12));
      qa(".s13-v").forEach((v, i) => {
        gsap.set(v, { opacity: 0 });
        tl.fromTo(v, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.22, ease: "back.out(2)", immediateRender: false }, SIGUE + 0.1 + i * 0.18);
      });
      gsap.set(q(".s13-vendido"), { rotation: -8 });
      slam(q(".s13-vendido"), COMPRA);
      golpe(COMPRA + 0.05, 10);
      // "sin esperar botella": la botella se hunde
      tl.to(q(".s13-hunde"), { y: 160, rotation: 50, opacity: 0, duration: 0.7, ease: "power2.in" }, SIN);
      gsap.set(qa(".s13-burbujas circle"), { opacity: 0 });
      qa(".s13-burbujas circle").forEach((c, i) => tl.fromTo(c, { opacity: 1, y: 40 }, { opacity: 0, y: -60, duration: 0.5, immediateRender: false }, BOTELLA - 0.2 + i * 0.1));
      // de noche: Vero duerme en la hamaca
      gsap.set(q(".s13-nocturno"), { opacity: 0 });
      tl.to(q(".s13-dia"), { opacity: 0, duration: 0.25 }, 2.25);
      fuera(q(".s13-vendido"), 2.25);
      tl.fromTo(q(".s13-nocturno"), { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 2.3);
      tl.fromTo(q(".s13-hamaca-g"), { rotation: -2 }, { rotation: 2, svgOrigin: "540 1000", duration: 0.7, yoyo: true, repeat: 2, ease: "sine.inOut" }, 2.3);
      [".s13-z1", ".s13-z2", ".s13-z3"].forEach((s, i) => {
        gsap.set(q(s), { opacity: 0 });
        tl.fromTo(q(s), { opacity: 0, y: 20 }, { opacity: 1, y: -10, duration: 0.3, immediateRender: false }, 2.4 + i * 0.2);
      });
      gsap.set(q(".s13-noti"), { opacity: 0 });
      gsap.set([q(".s13-wilmar"), q(".s13-tedije")], { opacity: 0 });
      // ¡vendí! notificación y se despierta de un salto
      tl.fromTo(q(".s13-noti"), { opacity: 0, y: -160 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, WILMAR - 0.1);
      fuera([q(".s13-z1"), q(".s13-z2"), q(".s13-z3")], VENDI - 0.1, 0.12);
      tl.to(q(".s13-vero"), { y: -40, x: -10, duration: 0.15, yoyo: true, repeat: 3, ease: "power2.out" }, VENDI);
      tl.to(q(".s13-boca"), { scaleY: 2.2, svgOrigin: "0 -318", duration: 0.1 }, VENDI);
      tl.to(q(".s13-noti"), { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1 }, CAMPERA);
      fuera(q(".s13-noti"), DURMIENDO - 0.12, 0.1);
      slam(q(".s13-vendi"), DURMIENDO);
      golpe(DURMIENDO + 0.05, 18);
      // "Te dije."
      tl.fromTo(q(".s13-wilmar"), { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(1.6)", immediateRender: false }, TE - 0.25);
      pop(q(".s13-tedije"), TE, 0.4);
      habla(".s13-wboca", TE, 2, 0.1);


      // salida: una ola se la lleva hacia abajo
      tl.to(q("#s13-escena"), { y: 260, opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
