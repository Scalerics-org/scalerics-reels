    (function () {
      const ID = "s06-wilmar";
      const DUR = 3.33;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const qa = (s) => [...root.querySelectorAll(s)];

      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s06-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const habla = (sel, t, n, d = 0.11) => {
        // boca que se abre y cierra n veces

      };


      const PELICULA = 0.24, PELOTA = 1.36, QUE = 1.76, WILMAR = 2.32;
      tl.fromTo(q(".s06-escenario"), { scale: 1.06 }, { scale: 1, duration: 1.7, ease: "none", transformOrigin: "50% 65%" }, 0);
      tl.fromTo(q(".s06-isla"), { opacity: 0.6 }, { opacity: 1, duration: 0.25 }, 0);
      // barras de cine

      tl.fromTo(q(".s06-b2"), { y: 90 }, { y: 0, duration: 0.3, ease: "power3.out" }, 0.05);
      gsap.set(q(".s06-peli"), { opacity: 0 });
      tl.fromTo(q(".s06-peli"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, PELICULA);
      fuera(q(".s06-peli"), PELOTA + 0.2);
      // llamas que tiemblan
