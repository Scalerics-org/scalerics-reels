    (function () {
      const ID = "s11-tienda";
      const DUR = 3.25;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const qa = (s) => [...root.querySelectorAll(s)];
      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t, from = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s11-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const habla = (sel, t, n, d = 0.11) => {
        // boca que se abre y cierra n veces
        for (let i = 0; i < n; i++) tl.to(q(sel), { scaleY: 0.25, duration: d, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + i * d * 2);
      };


      const SCALERICS = 0.44, TIENDAS = 1.3, ONLINE = 1.56, VENDEN = 2.08, SOLAS = 2.43;
      // el celular sale del mar como un muelle
      tl.fromTo(q(".s11-cel"), { y: 700, rotation: 6 }, { y: 0, rotation: 0, duration: 0.45, ease: "back.out(1.2)" }, 0);
      qa(".s11-salpica circle").forEach((c, i) => tl.fromTo(c, { opacity: 1, y: 0, x: 0 }, { opacity: 0, y: -120 - (i % 3) * 30, x: (i - 2) * 30, duration: 0.5, ease: "power2.out" }, 0.1));
      tl.fromTo(q(".s11-wilmar"), { x: -200 }, { x: 0, duration: 0.35, ease: "back.out(1.6)" }, 0.1);
      // las prendas entran a la grilla
      qa(".s11-card").forEach((c, i) => {
        gsap.set(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, TIENDAS - 0.2 + i * 0.1);
      });
      tl.to(q(".s11-barra"), { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1 }, SCALERICS);
      gsap.set(q(".s11-sello"), { rotation: -10 });
      slam(q(".s11-sello"), SOLAS);
      golpe(SOLAS + 0.05, 10);
      tl.to(q(".s11-wilmar"), { rotation: 10, duration: 0.2, yoyo: true, repeat: 1 }, SOLAS);


      // salida: una ola se la lleva hacia abajo
      tl.to(q("#s11-escena"), { y: 260, opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
