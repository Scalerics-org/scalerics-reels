  <script>
    (function () {
      const ID = "s02-programa";
      const DUR = 3.53;

      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut", immediateRender: false }, t + i * 0.04);
        });
      };
      const pop = (els, t, o) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.85, y: (o && o.y) || 0 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(1.6)", transformOrigin: (o && o.origin) || "50% 50%", immediateRender: false }, t + i * ((o && o.stagger) || 0.08));

        gsap.set(el, { opacity: 0, rotation: rot || 0 });

      const temblor = (el, t, f) => { f = f || 1; [[-12, 7], [9, -5], [-4, 2], [0, 0]].forEach(([x, y], i) => tl.to(el, { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045)); };
      const etiquetas = (lista) => {
        lista.forEach(([sel, t], i) => {
          tl.fromTo(q(sel), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
          if (i + 1 < lista.length) tl.to(q(sel), { opacity: 0, y: -10, duration: 0.2 }, lista[i + 1][0 + 1] - 0.2);

      const ES = 0.38, FEN = 0.95, MAS = 2.12;

      const L1 = qa(".s02-t1 span"), L2 = qa(".s02-t2 span");
      gsap.set([...L1, ...L2], { opacity: 0 });
      tl.fromTo(q(".s02-espiral"), { rotation: 0, svgOrigin: "540 820", opacity: 0.4 }, { rotation: 40, svgOrigin: "540 820", opacity: 1, duration: DUR, ease: "none" }, 0);

      L1.forEach((s, i) => tl.fromTo(s, { opacity: 0, y: -30, x: (i % 2 ? 14 : -14) }, { opacity: 1, y: 0, x: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, FEN - 0.35 + i * 0.05));
      L2.forEach((s, i) => tl.fromTo(s, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, MAS - 0.3 + i * 0.035));
      // temblor de señal del título
      [0.08, 0.5, 1.1, 1.7].forEach((d) => { tl.to([q(".s02-t1"), q(".s02-t2")], { x: 10, duration: 0.03, ease: "none" }, FEN + d); tl.to([q(".s02-t1"), q(".s02-t2")], { x: 0, duration: 0.03, ease: "none" }, FEN + d + 0.05); });
