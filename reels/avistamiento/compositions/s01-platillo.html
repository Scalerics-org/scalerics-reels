  <script>
    (function () {
      const ID = "s01-platillo";
      const DUR = 8.25;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const CONTESTO = 1.65, DOMINGO = 3.27, ONCE = 3.94, CIENCIA = 5.48, EXPLICAR = 7.02;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // cuadro 0: barrio y platillo a medio dibujar (nunca negro)
      dibujar(qa(".s01-l"), 0, 1.0, 0.5);
      dibujar(qa(".s01-p"), 0, 0.8, 0.45);
      tl.fromTo(qa(".s01-platillo .relleno"), { opacity: 0.4 }, { opacity: 1, duration: 0.5 }, 0);
      tl.fromTo(qa(".estrella"), { opacity: 0.2 }, { opacity: 0.7, duration: 0.6, stagger: 0.05 }, 0);
      // el platillo flota
      tl.fromTo(q(".s01-platillo"), { y: -10 }, { y: 14, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0);
      tl.fromTo(q(".s01-platillo"), { rotation: -3, svgOrigin: "540 820" }, { rotation: 3, svgOrigin: "540 820", duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0);
      // luces del disco en secuencia
      const LUCES = qa(".s01-luz");
      for (let t = 0, k = 0; t < DUR; t += 0.16, k++) tl.set(LUCES, { opacity: (i) => (i === k % 5 ? 1 : 0.25) }, t);

      // "contestó": se prende el haz hacia el almacén
      tl.to(q(".s01-haz"), { opacity: 0.22, duration: 0.15 }, CONTESTO - 0.05);
      tl.to(q(".s01-haz"), { opacity: 0.12, duration: 0.08, yoyo: true, repeat: 5 }, CONTESTO + 0.15);
      tl.to(q(".s01-haz"), { opacity: 0.2, duration: 0.2 }, CONTESTO + 0.7);

      // "domingo / once": sello ámbar
      gsap.set(q(".s01-dom"), { opacity: 0, rotation: -6 });
      tl.fromTo(q(".s01-dom"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, DOMINGO - 0.1);
      tl.to(q(".s01-dom"), { scale: 1.12, duration: 0.1, yoyo: true, repeat: 1 }, ONCE);

      // etiqueta
      gsap.set(q(".s01-e2"), { opacity: 0 });
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.to(q(".s01-e1"), { opacity: 0, y: -10, duration: 0.2 }, DOMINGO - 0.2);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, DOMINGO);

      // "ciencia": zoom digital sobre el platillo + CASO 0347
      tl.to(q(".s01-todo"), { scale: 1.1, transformOrigin: "540px 900px", duration: 0.5, ease: "power3.inOut" }, CIENCIA - 0.15);
      tl.to(q(".s01-dom"), { opacity: 0, duration: 0.2 }, CIENCIA - 0.15);
      gsap.set(q(".s01-caso"), { opacity: 0, rotation: -3 });
      tl.fromTo(q(".s01-caso"), { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, CIENCIA + 0.25);
      [[-12, 7], [9, -5], [-4, 2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-todo"), { x, y, duration: 0.04, ease: "none" }, CIENCIA + 0.4 + i * 0.045));

      // "explicar": SIN EXPLICACIÓN en rojo, torcido
      gsap.set(q(".s01-sin"), { opacity: 0, rotation: 5 });
      tl.fromTo(q(".s01-sin"), { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, EXPLICAR - 0.1);
      tl.to(q(".s01-todo"), { opacity: 0.55, duration: 0.2 }, EXPLICAR);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
