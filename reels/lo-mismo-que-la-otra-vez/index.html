<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #16243d; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #16243d; }
      #fondo { position: absolute; inset: 0; background: #16243d; }
      #capa3d { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #tres, #barrido { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
      #barrido { visibility: hidden; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      #firma { position: absolute; left: 50%; top: 1790px; height: 44px; width: auto; transform: translateX(-50%); opacity: 0.95; z-index: 50; filter: drop-shadow(0 0 6px rgba(11,18,32,0.95)) drop-shadow(0 2px 2px rgba(11,18,32,0.9)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="fondo" class="clip" data-start="0" data-duration="14" data-track-index="0"></div>
      <div id="capa3d" class="clip" data-start="0" data-duration="14" data-track-index="1"><canvas id="tres" width="1080" height="1920"></canvas><canvas id="barrido" width="1080" height="1920"></canvas></div>
      <div id="el-p1-hora" class="scene" data-composition-id="p1-hora" data-composition-src="compositions/p1-hora.html" data-start="0" data-duration="9.1" data-track-index="3" data-track-kind="graphics"></div>
      <div id="el-p1-linea" class="scene" data-composition-id="p1-linea" data-composition-src="compositions/p1-linea.html" data-start="9.75" data-duration="2.5" data-track-index="4" data-track-kind="graphics"></div>
      <img id="firma" class="clip" src="assets/logo-blanco.png" alt="Scalerics" data-start="0" data-duration="14" data-track-index="2" />
      <audio id="mezcla" src="assets/audio/mezcla-1.wav" data-start="0" data-duration="14" data-track-index="30" data-volume="1"></audio>
    </div>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["tres"] = new Promise((ok) => { window.__tresListo = ok; });
    </script>
    <script type="module" src="assets/tres.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#fondo", { opacity: 1, duration: 14 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
