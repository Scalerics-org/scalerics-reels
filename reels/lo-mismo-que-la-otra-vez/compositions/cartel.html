<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
    [data-composition-id="cartel"] .esc { position: absolute; inset: 0; overflow: hidden; }
    /* el cartel: verde de marca saturado, manchas orgánicas en verdes y crema, burbujas que suben */
    [data-composition-id="cartel"] .fondo { position: absolute; inset: -200px; background: #5ce611; }
    [data-composition-id="cartel"] svg.manchas { position: absolute; left: -200px; top: -200px; width: 1480px; height: 2320px; }
    [data-composition-id="cartel"] .texto { position: absolute; left: 0; right: 0; top: 660px; text-align: center; transform: rotate(-4deg); }
    [data-composition-id="cartel"] .linea { display: block; font: 900 136px/1.1 "Lexend", sans-serif; letter-spacing: -0.01em; }
    [data-composition-id="cartel"] .linea.b { font-size: 146px; margin-top: 22px; }
    [data-composition-id="cartel"] .l { display: inline-block; position: relative; color: #efeee5; -webkit-text-stroke: 16px #0b1220; paint-order: stroke fill; text-shadow: 0 16px 0 #0b1220, 10px 16px 0 #0b1220; }
    [data-composition-id="cartel"] .esp { display: inline-block; width: 0.32em; }
    /* transiciones: el último cuadro de la parte 1 sale girando; el primero de la parte 2 entra por un iris */
    [data-composition-id="cartel"] .p1, [data-composition-id="cartel"] .p2 { position: absolute; inset: 0; width: 1080px; height: 1920px; background-size: cover; }
    [data-composition-id="cartel"] .p1 { background-image: url("assets/img/fin-parte1.png"); }
    [data-composition-id="cartel"] .p2 { background-image: url("assets/img/inicio-parte2.png"); clip-path: circle(0px at 540px 960px); }
  </style>
  <div id="root" data-composition-id="cartel" data-width="1080" data-height="1920" data-duration="3.4">
    <div id="cartel-esc" class="esc clip" data-start="0" data-duration="3.4" data-track-index="0">
      <div class="fondo"></div>
      <svg class="manchas" viewBox="0 0 1480 2320" aria-hidden="true">
        <g class="giraA" style="transform-origin: 740px 1160px">
          <path d="M260 300 C 420 150, 640 260, 600 430 C 570 590, 330 640, 230 520 C 130 410, 140 380, 260 300 Z" fill="#3fa60a"/>
          <path d="M1080 420 C 1280 330, 1420 520, 1320 660 C 1220 800, 1000 760, 960 620 C 930 520, 980 470, 1080 420 Z" fill="#efeee5" opacity="0.9"/>
          <path d="M180 1500 C 330 1380, 560 1460, 540 1640 C 520 1800, 300 1840, 200 1730 C 110 1630, 90 1570, 180 1500 Z" fill="#efeee5" opacity="0.9"/>
          <path d="M1000 1680 C 1180 1580, 1380 1700, 1330 1880 C 1280 2050, 1040 2070, 960 1940 C 900 1840, 900 1740, 1000 1680 Z" fill="#3fa60a"/>
          <path d="M620 2040 C 760 1980, 880 2060, 850 2160 C 820 2260, 660 2270, 610 2190 C 570 2130, 560 2070, 620 2040 Z" fill="#16243d" opacity="0.85"/>
          <path d="M700 120 C 820 70, 920 140, 890 230 C 860 320, 720 320, 680 250 C 650 200, 640 150, 700 120 Z" fill="#16243d" opacity="0.85"/>
        </g>
        <g class="burbujas">
          <circle class="bu" cx="300" cy="1300" r="34" fill="none" stroke="#efeee5" stroke-width="10"/>
          <circle class="bu" cx="1180" cy="1200" r="26" fill="none" stroke="#efeee5" stroke-width="9"/>
          <circle class="bu" cx="420" cy="980" r="18" fill="none" stroke="#0b1220" stroke-width="8"/>
          <circle class="bu" cx="1100" cy="1500" r="40" fill="none" stroke="#0b1220" stroke-width="10"/>
          <circle class="bu" cx="760" cy="1720" r="22" fill="none" stroke="#efeee5" stroke-width="8"/>
          <circle class="bu" cx="560" cy="560" r="30" fill="none" stroke="#efeee5" stroke-width="9"/>
        </g>
      </svg>
      <div class="texto" data-layout-allow-overlap data-layout-allow-overflow>
        <span class="linea a"><span class="l">U</span><span class="l">n</span><span class="esp"></span><span class="l">s</span><span class="l">i</span><span class="l">s</span><span class="l">t</span><span class="l">e</span><span class="l">m</span><span class="l">a</span></span>
        <span class="linea a"><span class="l">d</span><span class="l">e</span><span class="esp"></span><span class="l">c</span><span class="l">l</span><span class="l">i</span><span class="l">e</span><span class="l">n</span><span class="l">t</span><span class="l">e</span><span class="l">s</span></span>
        <span class="linea b"><span class="l">m</span><span class="l">á</span><span class="l">s</span><span class="esp"></span><span class="l">t</span><span class="l">a</span><span class="l">r</span><span class="l">d</span><span class="l">e</span><span class="l">…</span></span>
      </div>
      <div class="p1"></div>
      <div class="p2"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "cartel";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // entra: la parte 1 se va girando y achicándose (el giro clásico del cartel de "un rato después")
      tl.fromTo(q(".p1"), { scale: 1, rotation: 0, opacity: 1 }, { scale: 0, rotation: 540, duration: 0.42, ease: "power2.in", immediateRender: true }, 0);
      // el fondo respira y las manchas giran despacio
      tl.fromTo(q(".giraA"), { rotation: -6, scale: 1.1 }, { rotation: 8, scale: 1, duration: 3.4, ease: "sine.inOut", immediateRender: true }, 0);
      qa(".bu").forEach((b, i) => tl.fromTo(b, { y: 0 }, { y: -220 - i * 30, duration: 3.4, ease: "none", immediateRender: true }, 0));
      // las letras: entran rebotando una por una y después bailan (cada una con su fase)
      // cada palabra entra cuando el narrador la dice (un poco antes): Un · sistema · de · clientes · más tarde…
      const PALABRA = [0.3, 0.92, 1.47, 1.92, 2.45];
      const letras = qa(".l");
      const palabraDe = [];
      { let w = 0; qa(".linea").forEach((ln, li) => { if (li > 0) w++; Array.from(ln.children).forEach((ch) => { if (ch.classList.contains("esp")) w++; else palabraDe.push(Math.min(w, PALABRA.length - 1)); }); }); }
      const primera = {};
      letras.forEach((l, i) => {
        const w = palabraDe[i]; primera[w] ??= i;
        const t0 = PALABRA[w] + (i - primera[w]) * 0.03;
        tl.fromTo(l, { scale: 0, y: 80, rotation: (i % 2 ? 1 : -1) * 25 }, { scale: 1, y: 0, rotation: 0, duration: 0.32, ease: "back.out(2.6)", immediateRender: true }, t0);
        for (let k = 0; k < 7; k++) {
          const s = k % 2 ? 1 : -1;
          tl.to(l, { y: s * (8 + (i % 3) * 3), rotation: s * (i % 2 ? 4 : -4), duration: 0.17 + (i % 4) * 0.02, ease: "sine.inOut" }, t0 + 0.34 + k * 0.2);
        }
      });
      // sale: el texto se agranda y el iris abre la parte 2
      tl.to(q(".texto"), { scale: 1.25, duration: 0.45, ease: "power2.in" }, 2.95);
      tl.fromTo(q(".p2"), { clipPath: "circle(0px at 540px 960px)" }, { clipPath: "circle(1150px at 540px 960px)", duration: 0.42, ease: "power2.in", immediateRender: true }, 2.96);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
