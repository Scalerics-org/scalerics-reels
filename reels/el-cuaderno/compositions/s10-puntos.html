<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s10-puntos"] .s10-capa { position: absolute; inset: 0; }
    [data-composition-id="s10-puntos"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s10-puntos"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-puntos"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-puntos"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.3); stroke-width: 3; stroke-linecap: round; }
    [data-composition-id="s10-puntos"] .sello { fill: #5ce611; }
    [data-composition-id="s10-puntos"] .sello-vacio { fill: none; stroke: rgba(239, 238, 229, 0.45); stroke-width: 3; }
    [data-composition-id="s10-puntos"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.18em; fill: #efeee5; }
    [data-composition-id="s10-puntos"] .puntos { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 84px; fill: #5ce611; }
    [data-composition-id="s10-puntos"] .ini { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; fill: #efeee5; }
    [data-composition-id="s10-puntos"] .nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 30px; fill: #efeee5; }
    [data-composition-id="s10-puntos"] .freq { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.06em; fill: #5ce611; }
    [data-composition-id="s10-puntos"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s10-puntos"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s10-puntos" data-width="1080" data-height="1920" data-duration="5.25">
    <div id="s10-escena" class="s10-capa clip" data-start="0" data-duration="5.25" data-track-index="0">
      <!-- A: la tarjeta de puntos -->
      <div id="s10-a" class="s10-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <rect class="ln s10-tarj" x="320" y="760" width="440" height="260" rx="28" />
          <text class="mono s10-tit" x="360" y="822">PUNTOS</text>
          <text class="puntos s10-pts" x="356" y="930">+120</text>
          <circle class="sello s10-sello" cx="380" cy="978" r="11" />
          <circle class="sello s10-sello" cx="420" cy="978" r="11" />
          <circle class="sello s10-sello" cx="460" cy="978" r="11" />
          <circle class="sello-vacio" cx="500" cy="978" r="11" />
          <circle class="sello-vacio" cx="540" cy="978" r="11" />
        </svg>
      </div>
      <!-- B: el panel -->
      <div id="s10-b" class="s10-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <rect class="ln s10-dib-p" x="200" y="640" width="680" height="540" rx="30" />
          <text class="mono s10-cab" x="240" y="702">TUS CLIENTES</text>
          <line class="ln-tenue s10-dib-p" x1="224" y1="728" x2="856" y2="728" />
          <g class="s10-fila"><circle class="ln" cx="272" cy="792" r="30" /><text class="ini" x="272" y="801" text-anchor="middle">LM</text><text class="nombre" x="324" y="803">Lucía M.</text><text class="freq s10-f" x="846" y="802" text-anchor="end">CADA 7 DÍAS</text></g>
          <g class="s10-fila"><circle class="ln" cx="272" cy="886" r="30" /><text class="ini" x="272" y="895" text-anchor="middle">MR</text><text class="nombre" x="324" y="897">Martín R.</text><text class="freq s10-f" x="846" y="896" text-anchor="end">CADA 15 DÍAS</text></g>
          <g class="s10-fila"><circle class="ln" cx="272" cy="980" r="30" /><text class="ini" x="272" y="989" text-anchor="middle">SP</text><text class="nombre" x="324" y="991">Sofía P.</text><text class="freq s10-f" x="846" y="990" text-anchor="end">CADA 4 DÍAS</text></g>
          <g class="s10-fila"><circle class="ln" cx="272" cy="1074" r="30" /><text class="ini" x="272" y="1083" text-anchor="middle">DA</text><text class="nombre" x="324" y="1085">Diego A.</text><text class="freq s10-f" x="846" y="1084" text-anchor="end">CADA 30 DÍAS</text></g>
        </svg>
      </div>
      <div class="etiqueta"><span class="s10-e1">Scalerics Puntos</span><span class="s10-e2">Quiénes y cada cuánto</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s10-puntos";
      const DUR = 5.25;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const PUNTOS = 0.58;
      const DICE = 1.78;
      const QUIENES = 1.98;
      const CADA = 3.18;
      const CUANTO = 3.98;

      const dibujar = (els, t, dur, desde, ease, escalon) => {
        const E = escalon ?? 0.05;
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * E <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * E); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: ease ?? "power2.inOut" }, t + i * E);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // A: la tarjeta (ya a medio dibujar en el cuadro 0); "Puntos": el número entra con golpe
      dibujar([q(".s10-tarj")], 0, 0.5, 0.5);
      tl.fromTo(q(".s10-tit"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.15);
      tl.fromTo(q(".s10-pts"), { opacity: 0, scale: 1.4, svgOrigin: "450 900" }, { opacity: 1, scale: 1, svgOrigin: "450 900", duration: 0.35, ease: "power3.out" }, PUNTOS);
      qa(".s10-sello").forEach((s, i) => pop(s, PUNTOS + 0.2 + i * 0.12, s.getAttribute("cx") + " 978"));
      tl.fromTo(q("#s10-a"), { rotation: -3, transformOrigin: "540px 890px" }, { rotation: 2, transformOrigin: "540px 890px", duration: 1.6, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s10-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, PUNTOS);
      // "dice": la tarjeta se va y se abre el panel
      tl.to(q("#s10-a"), { opacity: 0, scale: 0.6, transformOrigin: "540px 890px", filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DICE - 0.4);
      gsap.set(qa(".s10-fila, .s10-cab, .s10-f"), { opacity: 0 });
      dibujar(qa(".s10-dib-p"), DICE - 0.2, 0.45, 1, null, 0.1);
      tl.to(q(".s10-cab"), { opacity: 1, duration: 0.25 }, DICE);
      tl.to(q(".s10-e1"), { opacity: 0, duration: 0.2 }, QUIENES - 0.1);
      tl.fromTo(q(".s10-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, QUIENES);

      // "quiénes son": las filas entran
      qa(".s10-fila").forEach((f, i) => {
        tl.fromTo(f, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, QUIENES + i * 0.15);
      });
      // "cada cuánto": la frecuencia de cada uno, en verde
      qa(".s10-f").forEach((f, i) => {
        tl.fromTo(f, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, CADA + i * 0.2);
      });
      qa(".s10-f").forEach((f, i) => {
        const o = "846 " + (Number(f.getAttribute("y")) - 9);
        tl.fromTo(f, { scale: 1 }, { scale: 1.1, svgOrigin: o, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, CUANTO + i * 0.06);
      });
      tl.fromTo(q("#s10-b"), { scale: 1 }, { scale: 1.03, transformOrigin: "540px 910px", duration: DUR - DICE, ease: "none" }, DICE);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
