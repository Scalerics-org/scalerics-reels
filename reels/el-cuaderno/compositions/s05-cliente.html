<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s05-cliente"] .s05-capa { position: absolute; inset: 0; }
    [data-composition-id="s05-cliente"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s05-cliente"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-cliente"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-cliente"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.35); stroke-width: 3; stroke-linecap: round; }
    [data-composition-id="s05-cliente"] .rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.14em; fill: rgba(239, 238, 229, 0.7); }
    [data-composition-id="s05-cliente"] .nombre { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 52px; fill: #efeee5; }
    [data-composition-id="s05-cliente"] .nombre-ac { fill: #5ce611; }
    [data-composition-id="s05-cliente"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s05-cliente"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s05-cliente" data-width="1080" data-height="1920" data-duration="3.98">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="3.98" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s05-dib" x1="160" y1="1170" x2="920" y2="1170" />
        <!-- mostrador -->
        <path class="ln s05-dib" d="M200 1170 V1020 H520 V1170" />
        <path class="ln s05-dib" d="M184 1020 H536" />
        <rect class="ln s05-dib" x="250" y="950" width="110" height="70" rx="8" />
        <line class="ln-tenue s05-dib" x1="270" y1="975" x2="340" y2="975" />
        <!-- el cliente de siempre -->
        <g class="s05-cli">
          <g transform="translate(700 1170) scale(1.4)">
            <circle class="ln" cx="0" cy="-96" r="14" />
            <path class="ln s05-cuerpo" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" />
          </g>
        </g>
        <!-- conteo de visitas: hace años -->
        <g class="s05-conteo"></g>
        <text class="rotulo s05-rot" x="200" y="676">VISITAS</text>
        <!-- tarjeta de nombre vacía -->
        <g class="s05-tarj">
          <rect class="ln" x="590" y="860" width="220" height="90" rx="18" />
          <path class="ln" d="M690 950 L700 970 L710 950" />
          <text class="nombre" x="700" y="924" text-anchor="middle">¿ <tspan class="nombre-ac s05-q">?</tspan></text>
        </g>
      </svg>
      <div class="etiqueta"><span class="s05-e1">Hace años</span><span class="s05-e2">¿Cómo se llama?</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-cliente";
      const DUR = 3.98;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CLIENTE = 0.6;
      const VIENE = 1.2;
      const ANOS = 1.7;
      const SABES = 2.5;
      const LLAMA = 3.3;

      // marcas de conteo: 6 grupos de 4 palitos + la diagonal (geometría fija)
      const NS = "http://www.w3.org/2000/svg";
      const caja = q(".s05-conteo");
      for (let g = 0; g < 6; g++) {
        const x0 = 200 + (g % 3) * 120, y0 = 700 + Math.floor(g / 3) * 100;
        for (let k = 0; k < 5; k++) {
          const p = document.createElementNS(NS, "path");
          p.setAttribute("class", k < 4 ? "ln s05-palo" : "ln-ac s05-palo");
          p.setAttribute("d", k < 4 ? `M${x0 + k * 20} ${y0} V${y0 + 70}` : `M${x0 - 10} ${y0 + 56} L${x0 + 72} ${y0 + 14}`);
          caja.appendChild(p);
        }
      }

      const dibujar = (els, t, dur, desde, ease, escalon) => {
        const E = escalon ?? 0.05;
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * E <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * E); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: ease ?? "power2.inOut" }, t + i * E);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // mostrador ya a medio dibujar en el cuadro 0
      dibujar(qa(".s05-dib"), 0, 0.5, 0.5, null, 0);

      // "cliente": entra caminando desde la derecha
      tl.fromTo(q(".s05-cli"), { x: 220, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, CLIENTE - 0.45);
      tl.fromTo(q(".s05-cuerpo"), { rotation: -5, svgOrigin: "0 -40" }, { rotation: 5, svgOrigin: "0 -40", duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 4 }, CLIENTE - 0.45);

      // "viene hace años": el conteo se llena rápido
      tl.fromTo(q(".s05-rot"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, VIENE - 0.1);
      dibujar(qa(".s05-palo"), VIENE, 0.12, 1, "power2.out", 0.033);
      tl.fromTo(q(".s05-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, ANOS - 0.2);
      tl.fromTo(q(".s05-cli"), { y: 0 }, { y: -12, duration: 0.16, ease: "sine.out", yoyo: true, repeat: 1, immediateRender: false }, ANOS + 0.1);

      // "no sabés": aparece la tarjeta vacía
      pop(q(".s05-tarj"), SABES - 0.2, "700 960");
      tl.to(q(".s05-conteo"), { opacity: 0.45, duration: 0.3 }, SABES);
      tl.to(q(".s05-e1"), { opacity: 0, duration: 0.2 }, SABES - 0.1);
      tl.fromTo(q(".s05-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, SABES);
      // "cómo se llama": el ? late
      tl.fromTo(q(".s05-tarj"), { rotation: 0 }, { rotation: 4, svgOrigin: "700 960", duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, LLAMA);
      tl.fromTo(q(".s05-q"), { opacity: 1 }, { opacity: 0.3, duration: 0.15, yoyo: true, repeat: 1, immediateRender: false }, LLAMA - 0.3);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
