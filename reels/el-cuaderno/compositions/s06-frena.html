<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-frena"] .s06-capa { position: absolute; inset: 0; }
    [data-composition-id="s06-frena"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-frena"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-frena"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-frena"] .fondo-card { fill: #07111f; }
    [data-composition-id="s06-frena"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.12em; fill: #efeee5; }
    [data-composition-id="s06-frena"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s06-frena"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s06-frena" data-width="1080" data-height="1920" data-duration="3.23">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="3.23" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g transform="translate(540 1170) scale(1.15) translate(-540 -1170)">
        <g class="s06-todo">
          <line class="ln s06-dib" x1="160" y1="1170" x2="920" y2="1170" />
          <!-- vos, detrás del mostrador -->
          <g class="s06-vos">
            <circle class="ln" cx="380" cy="922" r="24" />
            <path class="ln" d="M322 1020 Q324 962 380 958 Q436 962 438 1020" />
          </g>
          <!-- mostrador -->
          <path class="ln s06-dib" d="M200 1170 V1020 H560 V1170" />
          <path class="ln s06-dib" d="M184 1020 H576" />
          <!-- cartel "vuelvo en 5'" -->
          <g class="s06-cartel">
            <path class="ln" d="M290 1020 L276 1062 M470 1020 L484 1062" />
            <rect class="fondo-card" x="216" y="1060" width="328" height="70" rx="12" />
            <rect class="ln" x="216" y="1060" width="328" height="70" rx="12" />
            <text class="cartel" x="380" y="1105" text-anchor="middle">VUELVO EN 5'</text>
          </g>
          <!-- el engranaje del negocio -->
          <g class="s06-eng">
            <path class="ln s06-dientes" d="" />
            <circle class="ln-ac s06-eje" cx="790" cy="860" r="30" />
          </g>
        </g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s06-e1">Si no estás</span><span class="s06-e2">Se frena</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-frena";
      const DUR = 3.23;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const VOS = 0.72;
      const NO_ESTAS = 0.92;
      const NEGOCIO = 1.63;
      const FRENA = 2.22;

      // dientes del engranaje (geometría fija)
      const CX = 790, CY = 860, RIN = 78, ROUT = 104, N = 8;
      const pt = (r, a) => (CX + r * Math.cos(a)).toFixed(1) + " " + (CY + r * Math.sin(a)).toFixed(1);
      let d = "";
      for (let i = 0; i < N; i++) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
        const sig = pt(RIN, a + (2 * Math.PI) / N - 0.22);
        d += (i === 0 ? "M" + pt(RIN, a - 0.22) : "") + " L" + pt(ROUT, a - 0.14) + " L" + pt(ROUT, a + 0.14) + " L" + pt(RIN, a + 0.22) + " A" + RIN + " " + RIN + " 0 0 1 " + sig;
      }
      q(".s06-dientes").setAttribute("d", d + " Z");

      const dibujar = (els, t, dur, desde, ease, escalon) => {
        const E = escalon ?? 0.05;
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * E <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * E); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: ease ?? "power2.inOut" }, t + i * E);
        });
      };

      // el mostrador y el engranaje ya están; vos atendés
      dibujar(qa(".s06-dib"), 0, 0.45, 0.5, null, 0);
      dibujar([q(".s06-dientes")], 0, 0.5, 0.4);
      gsap.set(q(".s06-eje"), { opacity: 1 });
      tl.fromTo(q(".s06-vos"), { opacity: 0.6, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);
      // el engranaje gira... hasta que se frena
      tl.fromTo(q(".s06-eng"), { rotation: 0, svgOrigin: "790 860" }, { rotation: 260, svgOrigin: "790 860", duration: FRENA, ease: "none" }, 0);
      tl.to(q(".s06-eng"), { rotation: 268, svgOrigin: "790 860", duration: 0.3, ease: "power4.out" }, FRENA);

      // "vos no estás": te vas y cae el cartel
      tl.to(q(".s06-vos"), { opacity: 0, y: 30, duration: 0.3, ease: "power2.in" }, VOS);
      tl.fromTo(q(".s06-cartel"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.8)" }, NO_ESTAS);
      tl.fromTo(q(".s06-cartel"), { rotation: 6, svgOrigin: "380 1020" }, { rotation: -3, svgOrigin: "380 1020", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 2, immediateRender: false }, NO_ESTAS + 0.3);
      tl.fromTo(q(".s06-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, NO_ESTAS);

      // "negocio": el engranaje late; "frena": tiembla, se traba y todo se apaga
      tl.fromTo(q(".s06-eje"), { scale: 1 }, { scale: 1.25, svgOrigin: "790 860", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, NEGOCIO);
      tl.to(q(".s06-eng"), { x: 6, duration: 0.04, ease: "none", yoyo: true, repeat: 7 }, FRENA);
      tl.to(q(".s06-eje"), { opacity: 0.4, duration: 0.3 }, FRENA + 0.3);
      tl.to(q(".s06-todo"), { opacity: 0.45, duration: 0.4 }, FRENA + 0.3);
      tl.to(q(".s06-e1"), { opacity: 0, duration: 0.2 }, FRENA - 0.15);
      tl.fromTo(q(".s06-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, FRENA);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
