          <text class="bajada s09-bajada" x="540" y="1010" text-anchor="middle">PARA COMERCIOS</text>
        </svg>

      <!-- B: el bot -->
      <div id="s09-b" class="s09-capa">

          <g class="s09-tel">

              <text class="ui" x="390" y="1002">jueves?</text>

  <script>
    (function () {
      const ID = "s09-bot";
      const DUR = 7.02;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SCALERICS = 0.48;
      const ARMAMOS = 1.6;
      const COMERCIOS = 2.1;
      const BOT = 3.2;
      const TOMA = 4.3;
      const AGENDA = 5.2;
      const SIN = 5.9;
      const PISEN = 6.6;

      const dibujar = (els, t, dur, desde, ease, escalon) => {
        const E = escalon ?? 0.05;
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * E <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * E); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: ease ?? "power2.inOut" }, t + i * E);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // A: la caja se dibuja (ya visible en el cuadro 0), "Scalerics" entra con golpe
      dibujar([q(".s09-caja")], 0, 0.6, 0.5);
      tl.fromTo(q(".s09-marca"), { opacity: 0, scale: 1.2, svgOrigin: "540 865", filter: "blur(8px)" }, { opacity: 1, scale: 1, svgOrigin: "540 865", filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, SCALERICS - 0.1);
      tl.fromTo(q("#s09-a"), { scale: 1 }, { scale: 1.05, transformOrigin: "540px 880px", duration: BOT - 0.3, ease: "none" }, 0);
      // "armamos": la caja late
      tl.fromTo(q(".s09-caja"), { scale: 1 }, { scale: 1.04, svgOrigin: "540 865", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, ARMAMOS);
      tl.fromTo(q(".s09-bajada"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, COMERCIOS);
      tl.to(q("#s09-a"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, BOT - 0.35);

      // B: el celular con el bot
      gsap.set(qa(".s09-m1, .s09-r1, .s09-m2, .s09-r2, .s09-agenda, .s09-cab"), { opacity: 0 });
      dibujar(qa(".s09-dib-t"), BOT - 0.15, 0.5, 1, null, 0.03);
      tl.to(q(".s09-cab"), { opacity: 1, duration: 0.25 }, BOT + 0.2);
      tl.fromTo(q(".s09-tel"), { y: 30 }, { y: 0, duration: 0.5, ease: "power3.out" }, BOT - 0.15);
      tl.fromTo(q(".s09-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, BOT);
      // "toma pedidos"
      pop(q(".s09-m1"), TOMA - 0.35, "580 806");
      pop(q(".s09-r1"), TOMA + 0.25, "252 914");
      // "agenda turnos"
      pop(q(".s09-m2"), AGENDA - 0.35, "580 1022");
      pop(q(".s09-r2"), AGENDA + 0.2, "252 1130");
      // "sin que se pisen": la agenda prolija, cada turno en su lugar
      tl.to(q(".s09-agenda"), { opacity: 1, duration: 0.01 }, SIN - 0.4);
      tl.fromTo(q(".s09-dia"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, SIN - 0.4);
      qa(".s09-slot").forEach((s, i) => {
        tl.fromTo(s, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, SIN - 0.35 + i * 0.1);
      });
      gsap.set(qa(".s09-tilde"), { opacity: 0 });
      dibujar(qa(".s09-tilde"), SIN + 0.1, 0.2, 1, "power2.out", 0.2);
      tl.to(q(".s09-e2"), { opacity: 0, duration: 0.2 }, SIN - 0.2);
      tl.fromTo(q(".s09-e3"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, SIN);
      tl.fromTo(q(".s09-agenda"), { scale: 1 }, { scale: 1.05, svgOrigin: "760 930", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, PISEN);

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
