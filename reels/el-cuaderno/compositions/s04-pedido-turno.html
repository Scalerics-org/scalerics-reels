    (function () {
      const ID = "s04-pedido-turno";
      const DUR = 3.68;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const PEDIDO = 0.08;
      const MAL = 0.98;
      const SALIO = 1.42;
      const DOS = 2.34;
      const TURNOS = 2.48;
      const MISMA = 3.08;

      const dibujar = (els, t, dur, desde, ease, escalon) => {
        const E = escalon ?? 0.05;
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * E <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * E); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: ease ?? "power2.inOut" }, t + i * E);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // la hoja entra dibujándose (ya visible en el cuadro 0)
      dibujar(qa(".s04-dib"), 0, 0.5, 0.5, null, 0);
      tl.fromTo(q(".s04-hoja"), { scale: 0.97, svgOrigin: "450 920" }, { scale: 1.02, svgOrigin: "450 920", duration: DUR, ease: "none" }, 0);
      gsap.set(q(".s04-b"), { opacity: 0 });

      // "pedido": título y renglones a mano
      tl.fromTo(q(".s04-tit"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, PEDIDO);
      dibujar(qa(".s04-esc"), PEDIDO + 0.1, 0.35, 1, "none", 0.3);
      // "mal": tachón torcido
      dibujar([q(".s04-tachon")], MAL - 0.08, 0.35, 1, "power2.out");
      tl.to(qa(".s04-esc"), { opacity: 0.4, duration: 0.25 }, MAL + 0.2);
      // "no salió": la caja con su X
      pop(q(".s04-caja"), SALIO - 0.25, "830 985");
      tl.fromTo(q(".s04-badge"), { opacity: 0, scale: 0.5, svgOrigin: "920 894" }, { opacity: 1, scale: 1, svgOrigin: "920 894", duration: 0.35, ease: "back.out(2.2)" }, SALIO + 0.05);
      tl.to(q(".s04-caja"), { x: 5, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, SALIO + 0.15);
      tl.fromTo(q(".s04-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, SALIO);

      // "dos turnos": la página pasa a la agenda
      tl.to(q(".s04-a"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DOS - 0.25);
      tl.to(q(".s04-e1"), { opacity: 0, duration: 0.2 }, DOS - 0.2);
      tl.to(q(".s04-b"), { opacity: 1, duration: 0.2 }, DOS - 0.05);
      gsap.set(qa(".s04-t1, .s04-t2, .s04-alerta"), { opacity: 0 });
      tl.fromTo(q(".s04-t1"), { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, TURNOS - 0.1);
      tl.fromTo(q(".s04-t2"), { opacity: 0, y: -110 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, TURNOS + 0.3);
      // "misma hora": chocan, tiemblan, alerta
      tl.to(qa(".s04-t1, .s04-t2"), { x: 6, duration: 0.05, ease: "none", yoyo: true, repeat: 7 }, MISMA);
      tl.fromTo(q(".s04-alerta"), { opacity: 0, scale: 0.5, svgOrigin: "790 990" }, { opacity: 1, scale: 1, svgOrigin: "790 990", duration: 0.3, ease: "back.out(2.4)" }, MISMA);
      tl.fromTo(q(".s04-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, MISMA - 0.1);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
