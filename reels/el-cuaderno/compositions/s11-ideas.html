  <script>
    (function () {
      const ID = "s11-ideas";
      const DUR = 3.73;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CRECER = 0.83;
      const CUADERNO = 1.63;
      const IDEAS = 2.73;

      const dibujar = (els, t, dur, desde, ease, escalon) => {
        const E = escalon ?? 0.05;
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * E <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * E); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: ease ?? "power2.inOut" }, t + i * E);
        });
      };

      // A: la escalera (ya a medio dibujar en el cuadro 0) y vos subiendo
      dibujar([q(".s11-escalera")], 0, 0.5, 0.5);
      const PASOS = [[300, 1140], [420, 1040], [540, 940], [660, 840], [780, 740]];
      gsap.set(q(".s11-fig"), { x: PASOS[0][0], y: PASOS[0][1] });
      tl.fromTo(q(".s11-fig"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);
      PASOS.slice(1).forEach(([x, y], i) => {
        const t = 0.15 + i * 0.22;
        tl.to(q(".s11-fig"), { x, duration: 0.2, ease: "none" }, t);
        tl.to(q(".s11-fig"), { y: y - 30, duration: 0.1, ease: "power2.out" }, t);
        tl.to(q(".s11-fig"), { y, duration: 0.1, ease: "power2.in" }, t + 0.1);
      });
      // "crecer": la flecha verde sube
      dibujar([q(".s11-flecha")], CRECER - 0.3, 0.35, 1, "power3.out");
      tl.fromTo(q(".s11-punta"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, CRECER);
      tl.to(q(".s11-fig"), { y: 700, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, CRECER + 0.1);
      tl.fromTo(q(".s11-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.4);
      tl.to(q("#s11-a"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, CUADERNO - 0.35);
      tl.to(q(".s11-e1"), { opacity: 0, duration: 0.2 }, CUADERNO - 0.25);

      // B: "cuaderno": vuelve, limpio
      dibujar(qa(".s11-dib"), CUADERNO - 0.15, 0.45, 1, null, 0.03);
      tl.fromTo(q(".s11-tit"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, CUADERNO + 0.2);
      tl.fromTo(q(".s11-cuad"), { scale: 0.95, svgOrigin: "540 920" }, { scale: 1.02, svgOrigin: "540 920", duration: DUR - CUADERNO, ease: "none" }, CUADERNO - 0.15);
      tl.fromTo(q(".s11-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUADERNO);
      // "ideas": la lamparita se garabatea y se prende
      dibujar(qa(".s11-lampara"), IDEAS - 0.6, 0.5, 1, null, 0.2);
      dibujar([q(".s11-filamento")], IDEAS - 0.1, 0.25);
      dibujar(qa(".s11-rayo"), IDEAS + 0.1, 0.15, 1, "power2.out", 0.05);

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
