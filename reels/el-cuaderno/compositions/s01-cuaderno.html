<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-cuaderno"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-cuaderno"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-cuaderno"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-cuaderno"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-cuaderno"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-cuaderno"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.3); stroke-width: 3; stroke-linecap: round; }
    [data-composition-id="s01-cuaderno"] .ln-mano { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-cuaderno"] .titulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s01-cuaderno"] .precio { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 72px; fill: #5ce611; }
    [data-composition-id="s01-cuaderno"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s01-cuaderno"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01-cuaderno" data-width="1080" data-height="1920" data-duration="5.88">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="5.88" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- el cuaderno -->
        <g class="s01-cuad">
          <rect class="ln s01-dib" x="290" y="640" width="500" height="540" rx="18" />
          <line class="ln-tenue s01-dib" x1="352" y1="668" x2="352" y2="1160" />
          <line class="ln-tenue s01-dib s01-renglon" x1="310" y1="760" x2="770" y2="760" />
          <line class="ln-tenue s01-dib s01-renglon" x1="310" y1="820" x2="770" y2="820" />
          <line class="ln-tenue s01-dib s01-renglon" x1="310" y1="880" x2="770" y2="880" />
          <line class="ln-tenue s01-dib s01-renglon" x1="310" y1="940" x2="770" y2="940" />
          <line class="ln-tenue s01-dib s01-renglon" x1="310" y1="1000" x2="770" y2="1000" />
          <line class="ln-tenue s01-dib s01-renglon" x1="310" y1="1060" x2="770" y2="1060" />
          <line class="ln-tenue s01-dib s01-renglon" x1="310" y1="1120" x2="770" y2="1120" />
          <!-- espiral -->
          <path class="ln s01-dib s01-anillos" d="" />
          <text class="titulo s01-titulo" x="372" y="738">PEDIDOS</text>
          <!-- renglones escritos a mano (se generan en el script) -->
          <path class="ln-mano s01-mano" d="" />
          <path class="ln-mano s01-mano" d="" />
          <path class="ln-mano s01-mano" d="" />
          <path class="ln-mano s01-mano" d="" />
          <path class="ln-mano s01-mano" d="" />
        </g>
        <!-- lápiz (la punta en 0,0) -->
        <g class="s01-lapiz">
          <path class="ln" d="M0 0 L8 -26 L78 -96 L96 -78 L26 -8 Z" />
          <path class="ln" d="M8 -26 L26 -8 M66 -108 L78 -96 M96 -78 L108 -66 M66 -108 L76 -118 Q82 -124 88 -118 L108 -98 Q114 -92 108 -86 L108 -66" />
        </g>
        <!-- etiqueta de precio colgada del espiral -->
        <path class="ln s01-piolin" d="M754 640 C 780 600 830 610 862 712" />
        <g class="s01-tag">
          <path class="ln s01-tag-l" d="M862 690 L918 740 V880 Q918 896 902 896 H822 Q806 896 806 880 V740 Z" />
          <circle class="ln s01-tag-l" cx="862" cy="728" r="11" />
          <text class="precio s01-precio" x="862" y="850" text-anchor="middle">$</text>
        </g>
        <!-- monedas que gotean -->
        <g class="s01-moneda"><circle class="ln-ac" cx="0" cy="0" r="22" /><line class="ln-ac" x1="0" y1="-9" x2="0" y2="9" /></g>
        <g class="s01-moneda"><circle class="ln-ac" cx="0" cy="0" r="22" /><line class="ln-ac" x1="0" y1="-9" x2="0" y2="9" /></g>
        <g class="s01-moneda"><circle class="ln-ac" cx="0" cy="0" r="22" /><line class="ln-ac" x1="0" y1="-9" x2="0" y2="9" /></g>
        <g class="s01-moneda"><circle class="ln-ac" cx="0" cy="0" r="22" /><line class="ln-ac" x1="0" y1="-9" x2="0" y2="9" /></g>
        <!-- ojo tachado: sin verlo -->
        <g class="s01-ojo">
          <path class="ln s01-ojo-l" d="M150 760 Q210 712 270 760 Q210 808 150 760 Z" />
          <circle class="ln s01-ojo-l" cx="210" cy="760" r="18" />
          <line class="ln-ac s01-tacha" x1="152" y1="806" x2="268" y2="714" />
        </g>
      </svg>
      <div class="etiqueta"><span class="s01-e1">Tu cuaderno</span><span class="s01-e2">Te cuesta</span><span class="s01-e3">Todos los días</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-cuaderno";
      const DUR = 5.88;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CUADERNO = 0.3;
      const PEDIDOS = 1.0;
      const CUESTA = 1.9;
      const SISTEMA = 2.8;
      const PAGAS = 4.0;
      const VERLO = 5.2;

      // espiral: anillos que cruzan el borde de arriba
      let an = "";
      for (let i = 0; i < 8; i++) {
        const x = 330 + i * 60;
        an += `M${x} 660 V632 Q${x} 616 ${x + 14} 616 Q${x + 28} 616 ${x + 28} 632 V646 `;
      }
      q(".s01-anillos").setAttribute("d", an);

      // letra a mano: ondas con "palabras" separadas (geometría fija)
      const RENG = [
        { y: 800, fin: 700, cortes: [470, 590] },
        { y: 860, fin: 640, cortes: [520] },
        { y: 920, fin: 730, cortes: [440, 600] },
        { y: 980, fin: 600, cortes: [500] },
        { y: 1040, fin: 690, cortes: [455, 575] },
      ];
      const ALT = [9, 13, 7, 12, 10, 14, 8];
      const LINEAS = RENG.map((r, k) => {
        let d = "", x = 372, j = k;
        const tramos = [...r.cortes, r.fin];
        let desde = 372;
        tramos.forEach((hasta) => {
          d += `M${desde} ${r.y - 12} `;
          for (x = desde; x + 18 <= hasta; x += 18) {
            const a = ALT[j++ % ALT.length];
            d += `q9 ${-a} 18 0 `;
          }
          desde = hasta + 26;
        });
        return { d, y: r.y - 12, fin: r.fin };
      });
      qa(".s01-mano").forEach((p, k) => p.setAttribute("d", LINEAS[k].d));

      const dibujar = (els, t, dur, desde, ease, escalon) => {
        const E = escalon ?? 0.04;
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          // lo que arranca en 0 ya se ve (el cuadro 0 no puede ser negro)
          if (t + i * E <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * E); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: ease ?? "power2.inOut" }, t + i * E);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // el cuaderno arranca medio dibujado (el cuadro 0 no puede ser negro) y se acerca despacio
      // todo el cuaderno arranca junto (sin escalonar) para que el cuadro 0 ya lo muestre
      dibujar(qa(".s01-dib"), 0, 0.6, 0.45, null, 0);
      tl.fromTo(q(".s01-cuad"), { scale: 0.95, svgOrigin: "540 910" }, { scale: 1.02, svgOrigin: "540 910", duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s01-titulo"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, CUADERNO);
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUADERNO);

      // "pedidos": el lápiz escribe renglón por renglón
      const lapiz = q(".s01-lapiz");
      const PASO = 0.3;
      gsap.set(lapiz, { x: 372, y: LINEAS[0].y, opacity: 0 });
      tl.fromTo(lapiz, { opacity: 0, x: 420, y: LINEAS[0].y - 40 }, { opacity: 1, x: 372, y: LINEAS[0].y, duration: 0.25, ease: "power3.out" }, PEDIDOS - 0.3);
      LINEAS.forEach((l, k) => {
        const t = PEDIDOS + k * PASO;
        dibujar([qa(".s01-mano")[k]], t, PASO - 0.04, 1, "none");
        tl.fromTo(lapiz, { x: 372, y: l.y }, { x: l.fin, y: l.y, duration: PASO - 0.04, ease: "none", immediateRender: false }, t);
        tl.to(lapiz, { rotation: 6, svgOrigin: "0 0", duration: 0.07, ease: "sine.inOut", yoyo: true, repeat: 3 }, t);
      });
      tl.to(lapiz, { x: 760, y: 1120, opacity: 0, duration: 0.35, ease: "power2.in" }, PEDIDOS + LINEAS.length * PASO);

      // "cuesta": cuelga la etiqueta de precio y se balancea
      gsap.set(q(".s01-tag"), { opacity: 0 });
      dibujar([q(".s01-piolin")], CUESTA - 0.15, 0.3);
      tl.fromTo(q(".s01-tag"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.8)" }, CUESTA);
      tl.fromTo(q(".s01-tag"), { rotation: 14, svgOrigin: "862 712" }, { rotation: -6, svgOrigin: "862 712", duration: 0.6, ease: "sine.inOut" }, CUESTA);
      tl.to(q(".s01-tag"), { rotation: 4, svgOrigin: "862 712", duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 4 }, CUESTA + 0.6);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.2 }, CUESTA - 0.15);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUESTA);
      // "sistema": el "$" late
      tl.fromTo(q(".s01-precio"), { scale: 1 }, { scale: 1.25, svgOrigin: "862 826", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, SISTEMA);

      // "pagás todos los días": gotean monedas de la etiqueta
      qa(".s01-moneda").forEach((m, i) => {
        const t = PAGAS - 0.1 + i * 0.32;
        tl.fromTo(m, { x: 862, y: 930, opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, t);
        tl.to(m, { y: 1150, duration: 0.6, ease: "power2.in" }, t);
        tl.to(m, { opacity: 0, duration: 0.18 }, t + 0.45);
      });
      tl.to(q(".s01-e2"), { opacity: 0, duration: 0.2 }, PAGAS - 0.15);
      tl.fromTo(q(".s01-e3"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, PAGAS);

      // "sin verlo": ojo tachado al costado
      dibujar(qa(".s01-ojo-l"), VERLO - 0.35, 0.3);
      dibujar([q(".s01-tacha")], VERLO, 0.22);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
