  <script>
    (function () {
      const ID = "s03-pasa-por-vos";
      const DUR = 7.62;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CRECES = 0.9;
      const NO = 1.5;
      const CLIENTES = 2.5;
      const GANAS = 3.7;
      const PLATA = 4.6;
      const TODO = 5.9;
      const PASA = 6.3;
      const VOS = 6.7;

      // flechas que llegan de todos lados (geometría fija)
      const CX = 540, CY = 920;
      const NS = "http://www.w3.org/2000/svg";
      const ANG = [0, 60, 120, 180, 240, 300];
      const caja = q(".s03-flechas");
      ANG.forEach((g, i) => {
        const a = (g * Math.PI) / 180;
        const c = Math.cos(a), s = Math.sin(a);
        const x1 = CX + 270 * c, y1 = CY + 225 * s, x2 = CX + 140 * c, y2 = CY + 125 * s;
        const ang = Math.atan2(y2 - y1, x2 - x1);
        const p = document.createElementNS(NS, "path");
        p.setAttribute("class", "ln-ac s03-fl");
        const h = (da) => (x2 - 22 * Math.cos(ang + da)).toFixed(1) + " " + (y2 - 22 * Math.sin(ang + da)).toFixed(1);
        p.setAttribute("d", `M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)} M${h(0.5)} L${x2.toFixed(1)} ${y2.toFixed(1)} L${h(-0.5)}`);
        caja.appendChild(p);
        const r = qa(".s03-rot")[i];
        r.setAttribute("x", (CX + 345 * c).toFixed(1));
        r.setAttribute("y", (CY + 290 * s + 9).toFixed(1));
      });

      const dibujar = (els, t, dur, desde, ease, escalon) => {
        const E = escalon ?? 0.05;
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * E <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * E); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: ease ?? "power2.inOut" }, t + i * E);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // A: barras que suben y se aplanan
      dibujar([q(".s03-base")], 0, 0.4, 0.4);
      dibujar(qa(".s03-barra"), 0, 0.4, 0.5, null, 0.12);
      dibujar([q(".s03-techo")], CRECES - 0.1, 0.4);
      tl.fromTo(q(".s03-preg"), { opacity: 0, scale: 1.5, svgOrigin: "860 840" }, { opacity: 1, scale: 1, svgOrigin: "860 840", duration: 0.35, ease: "power3.out" }, CRECES);
      tl.to(q(".s03-preg"), { rotation: 10, svgOrigin: "860 900", duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 3 }, CRECES + 0.35);
      tl.fromTo(q(".s03-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CRECES);
      tl.to(q("#s03-a"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, NO + 0.2);
      tl.to(q(".s03-e1"), { opacity: 0, duration: 0.2 }, NO + 0.3);

      // B: tres íconos, cada uno con su badge X en su palabra
      [[".s03-i1", ".s03-b1", CLIENTES, "320 910", "384 836"], [".s03-i2", ".s03-b2", GANAS, "540 910", "604 836"], [".s03-i3", ".s03-b3", PLATA, "760 910", "824 836"]].forEach(([ic, b, t, o, ob]) => {
        pop(q(ic), t - 0.25, o);
        tl.fromTo(q(b), { opacity: 0, scale: 0.5, svgOrigin: ob }, { opacity: 1, scale: 1, svgOrigin: ob, duration: 0.35, ease: "back.out(2.2)" }, t + 0.1);
        tl.to(q(ic), { opacity: 0.4, duration: 0.3 }, t + 0.3);
      });
      tl.fromTo(q(".s03-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, PLATA + 0.1);
      tl.to(q("#s03-b"), { opacity: 0, scale: 0.9, transformOrigin: "540px 910px", filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, TODO - 0.3);
      tl.to(q(".s03-e2"), { opacity: 0, duration: 0.2 }, TODO - 0.2);

      // C: vos al centro y todo llega a vos
      pop(q(".s03-vos"), TODO - 0.1, "540 1000");
      tl.fromTo(q(".s03-e3"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, TODO);
      qa(".s03-rot").forEach((r, i) => {
        tl.fromTo(r, { opacity: 0 }, { opacity: 0.85, duration: 0.2 }, PASA - 0.3 + i * 0.07);
      });
      dibujar(qa(".s03-fl"), PASA - 0.15, 0.3, 1, "power3.out", 0.07);
      // "vos": la figurita queda aplastada
      tl.to(q(".s03-vos"), { scaleY: 0.82, scaleX: 1.1, svgOrigin: "540 1000", duration: 0.18, ease: "power3.out" }, VOS);
      tl.to(q(".s03-vos"), { x: 4, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, VOS + 0.18);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
