  <script>
    (function () {
      const ID = "s02-te-va-bien";
      const DUR = 6.22;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const BIEN = 0.42;
      const PEDIDOS = 1.32;
      const TURNOS = 2.26;
      const CLIENTES = 2.72;
      const TODO = 3.92;
      const ANOTADO = 4.42;
      const CABEZA = 5.72;

      const dibujar = (els, t, dur, desde, ease, escalon) => {
        const E = escalon ?? 0.04;
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * E);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: ease ?? "power2.inOut" }, t + i * E);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // el local entra dibujándose
      dibujar(qa(".s02-dib-l"), 0, 0.5, 0.6, null, 0.02);
      tl.fromTo(q(".s02-txt"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.2);
      tl.fromTo(qa(".s02-luz"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 0.3);
      tl.fromTo(q(".s02-local"), { scale: 0.97, svgOrigin: "540 1160" }, { scale: 1.02, svgOrigin: "540 1160", duration: TODO, ease: "none" }, 0);

      // "bien": el gráfico sube
      dibujar([q(".s02-ejes")], BIEN - 0.2, 0.3);
      dibujar([q(".s02-sube")], BIEN, 0.5);
      tl.fromTo(q(".s02-punta"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, BIEN + 0.45);
      tl.fromTo(q(".s02-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, BIEN);

      // pedidos, turnos, clientes: uno por palabra
      pop(q(".s02-bolsa"), PEDIDOS, "380 730");
      pop(q(".s02-r1"), PEDIDOS + 0.08, "380 810");
      pop(q(".s02-reloj"), TURNOS, "540 720");
      pop(q(".s02-r2"), TURNOS + 0.08, "540 810");
      tl.fromTo(q(".s02-reloj path"), { rotation: 0, svgOrigin: "540 720" }, { rotation: 360, svgOrigin: "540 720", duration: 1.2, ease: "power2.inOut" }, TURNOS + 0.1);
      pop(q(".s02-cli"), CLIENTES, "700 730");
      pop(q(".s02-r3"), CLIENTES + 0.08, "700 810");
      tl.fromTo(q(".s02-cli"), { y: 0 }, { y: -10, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, CLIENTES + 0.4);

      // "todo": se va el local; aparece el cuaderno a la izquierda
      tl.to(q(".s02-local"), { opacity: 0, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, TODO - 0.2);
      tl.to(qa(".s02-r"), { opacity: 0, duration: 0.2 }, TODO - 0.1);
      tl.to(q(".s02-e1"), { opacity: 0, duration: 0.2 }, TODO);
      dibujar(qa(".s02-dib-c"), TODO, 0.45, 1, null, 0.03);
      // "anotado ahí": los tres íconos vuelan adentro del cuaderno y se escriben los renglones
      const destino = [[330, 940], [330, 1000], [330, 1060]];
      [".s02-bolsa", ".s02-reloj", ".s02-cli"].forEach((s, i) => {
        const [ox, oy] = [[380, 730], [540, 720], [700, 730]][i];
        tl.to(q(s), { x: destino[i][0] - ox, y: destino[i][1] - oy, scale: 0.3, opacity: 0, svgOrigin: ox + " " + oy, duration: 0.45, ease: "power2.in" }, ANOTADO - 0.2 + i * 0.1);
      });
      dibujar(qa(".s02-mano"), ANOTADO + 0.1, 0.35, 1, "none", 0.18);
      tl.fromTo(q(".s02-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, ANOTADO);
      tl.fromTo(q(".s02-cuad"), { rotation: 0, svgOrigin: "330 970" }, { rotation: -3, svgOrigin: "330 970", duration: 1.4, ease: "sine.inOut" }, ANOTADO);

      // "o en tu cabeza": la cabeza a la derecha, con el lío adentro
      dibujar([q(".s02-dib-h")], 5.0, 0.5);
      dibujar([q(".s02-lio")], CABEZA - 0.35, 0.5);
      tl.to(q(".s02-e2"), { opacity: 0, duration: 0.2 }, CABEZA - 0.3);
      tl.fromTo(q(".s02-e3"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, CABEZA - 0.2);
      tl.fromTo(q(".s02-lio"), { rotation: 0, svgOrigin: "770 920" }, { rotation: 25, svgOrigin: "770 920", duration: 0.5, ease: "sine.inOut" }, CABEZA - 0.1);

      // salida

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
