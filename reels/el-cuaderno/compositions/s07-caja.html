  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s07-caja"] .s07-capa { position: absolute; inset: 0; }
    [data-composition-id="s07-caja"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

    [data-composition-id="s07-caja"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

  <div id="root" data-composition-id="s07-caja" data-width="1080" data-height="1920" data-duration="6.19">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="6.19" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g transform="translate(540 1170) scale(1.2) translate(-540 -1170)">
        <line class="ln s07-suelo" x1="160" y1="1170" x2="920" y2="1170" />
        <!-- la caja registradora -->
        <g class="s07-caja">
          <path class="ln s07-dib" d="M380 1110 L404 950 H676 L700 1110 Z" />
          <rect class="ln s07-dib" x="450" y="840" width="180" height="80" rx="10" />
          <line class="ln s07-dib" x1="540" y1="920" x2="540" y2="950" />
          <rect class="tecla s07-tecla" x="440" y="980" width="44" height="30" rx="5" />
          <rect class="tecla s07-tecla" x="500" y="980" width="44" height="30" rx="5" />
          <rect class="tecla s07-tecla" x="560" y="980" width="44" height="30" rx="5" />

          <rect class="tecla s07-tecla" x="554" y="1030" width="44" height="30" rx="5" />
          <rect class="tecla s07-tecla" x="614" y="1030" width="44" height="30" rx="5" />
          <g class="s07-cajon">
            <rect class="ln" x="370" y="1110" width="340" height="56" rx="6" />

        <!-- el cliente que espera -->
        <g class="s07-hueco">
          <g transform="translate(760 1170) scale(1.4)">
            <circle class="ln-tenue" cx="0" cy="-96" r="14" />
            <path class="ln-tenue" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" />

          <g transform="translate(760 1170) scale(1.4)">

          </g>

        <g class="s07-reloj">
          <circle class="ln" cx="760" cy="920" r="44" />

        </g>
      </svg>
      <div class="etiqueta"><span class="s07-e1">No aparece en la caja</span><span class="s07-e2">Lo pagás igual</span><span class="s07-e3">No volvió</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s07-caja";
      const DUR = 6.19;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const APARECE = 0.79;
      const CAJA = 1.39;
      const PAGAS = 2.39;
      const CLIENTE = 3.49;
      const CANSO = 4.09;
      const ESPERAR = 4.59;
      const VOLVIO = 5.1;

      const dibujar = (els, t, dur, desde, ease, escalon) => {
        const E = escalon ?? 0.05;
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * E <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * E); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: ease ?? "power2.inOut" }, t + i * E);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // la caja ya está a medio dibujar en el cuadro 0
      dibujar(qa(".s07-dib, .s07-suelo"), 0, 0.5, 0.5, null, 0);
      tl.fromTo(qa(".s07-tecla"), { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.04 }, 0.2);
      tl.fromTo(q(".s07-cajon"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
      gsap.set(qa(".s07-visor, .s07-hueco, .s07-cli, .s07-reloj"), { opacity: 0 });

      // "no aparece": teclas que se aprietan
      [0, 2, 5].forEach((k, i) => {
        tl.fromTo(qa(".s07-tecla")[k], { y: 0 }, { y: 4, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, APARECE - 0.2 + i * 0.14);
      });
      tl.fromTo(q(".s07-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, APARECE);
      // "caja": se abre el cajón, el visor dice TODO OK
      tl.to(q(".s07-cajon"), { y: 26, duration: 0.25, ease: "back.out(2)" }, CAJA - 0.1);
      tl.to(q(".s07-visor"), { opacity: 1, duration: 0.15 }, CAJA);
      dibujar([q(".s07-tilde")], CAJA + 0.1, 0.25);

      // "pagás": la caja se corre a la izquierda y aparece el cliente esperando
      tl.to(q(".s07-caja"), { x: -150, scale: 0.85, svgOrigin: "540 1170", duration: 0.45, ease: "power3.inOut" }, PAGAS - 0.2);
      tl.to(q(".s07-cajon"), { y: 0, duration: 0.2 }, PAGAS);
      tl.to(q(".s07-e1"), { opacity: 0, duration: 0.2 }, PAGAS - 0.2);
      tl.fromTo(q(".s07-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, PAGAS);
      tl.fromTo(q(".s07-cli"), { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, CLIENTE - 0.55);
      tl.fromTo(q(".s07-cuerpo"), { rotation: -5, svgOrigin: "0 -40" }, { rotation: 5, svgOrigin: "0 -40", duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3 }, CLIENTE - 0.55);
      pop(q(".s07-reloj"), CLIENTE, "760 920");
      // el reloj corre; "esperar": las agujas vuelan
      tl.fromTo(q(".s07-min"), { rotation: 0, svgOrigin: "760 920" }, { rotation: 540, svgOrigin: "760 920", duration: ESPERAR - CLIENTE, ease: "none" }, CLIENTE);
      tl.to(q(".s07-min"), { rotation: 1620, svgOrigin: "760 920", duration: 0.6, ease: "power1.in" }, ESPERAR);
      tl.fromTo(q(".s07-hor"), { rotation: 0, svgOrigin: "760 920" }, { rotation: 160, svgOrigin: "760 920", duration: ESPERAR + 0.6 - CLIENTE, ease: "none" }, CLIENTE);
      // "cansó": se encorva
      tl.to(q(".s07-cli"), { rotation: -6, svgOrigin: "760 1170", duration: 0.3, ease: "power2.out" }, CANSO);

      // "no volvió": se da vuelta y se va; queda el hueco punteado
      tl.to(q(".s07-hueco"), { opacity: 1, duration: 0.25 }, VOLVIO);
      tl.to(q(".s07-cli"), { x: 300, rotation: 0, opacity: 0, svgOrigin: "760 1170", duration: 0.7, ease: "power2.in" }, VOLVIO - 0.15);
      tl.to(q(".s07-reloj"), { opacity: 0.35, duration: 0.3 }, VOLVIO);
      tl.to(q(".s07-e2"), { opacity: 0, duration: 0.2 }, VOLVIO - 0.2);
      tl.fromTo(q(".s07-e3"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, VOLVIO);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
