<template>

  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s07-no-cierra"] .s07-abierto { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.18em; fill: #5ce611; }
    [data-composition-id="s07-no-cierra"] .s07-hora { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 44px; letter-spacing: 0.06em; fill: rgba(239, 238, 229, 0.7); }
    [data-composition-id="s07-no-cierra"] .s07-rot { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: rgba(239, 238, 229, 0.6); }
    [data-composition-id="s07-no-cierra"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s07-no-cierra"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s07-no-cierra" data-width="1080" data-height="1920" data-duration="2.65">

      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s07-suelo" x1="60" y1="1120" x2="1020" y2="1120" />

  <script>
    (function () {
      const ID = "s07-no-cierra";
      const DUR = 2.65;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CERRASTE = 0.25;
      const OCHO = 0.95;
      const TIENDA = 1.65;
      const ONLINE = 1.95;
      const NO = 2.5;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };

      // tu local arranca medio dibujado y se apaga en "cerraste"
      gsap.set(q(".s07-local"), { x: 280, y: 1120 });
      dibujar(qa(".s07-dib-l"), 0, 0.4, 0.4);
      tl.fromTo(q(".s07-suelo"), { scaleX: 0.6, svgOrigin: "540 1120" }, { scaleX: 1, svgOrigin: "540 1120", duration: 0.5, ease: "power3.out" }, 0);
      tl.to(q(".s07-local"), { opacity: 0.4, duration: 0.35 }, CERRASTE + 0.1);
      tl.fromTo(q(".s07-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, CERRASTE);
      tl.fromTo(q(".s07-hora"), { opacity: 0, scale: 0.85, svgOrigin: "280 776" }, { opacity: 1, scale: 1, svgOrigin: "280 776", duration: 0.3, ease: "back.out(1.6)" }, OCHO - 0.1);

      // "tienda online": se prende la tienda
      dibujar(qa(".s07-dib-t"), TIENDA - 0.25, 0.4);
      tl.fromTo(q(".s07-btn"), { opacity: 0, scale: 0.6, svgOrigin: "800 1033" }, { opacity: 1, scale: 1, svgOrigin: "800 1033", duration: 0.3, ease: "back.out(2)" }, TIENDA + 0.1);
      tl.fromTo(q(".s07-rot-t"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, TIENDA);
      tl.fromTo(q(".s07-cartel"), { opacity: 0, scale: 0.85, svgOrigin: "800 696" }, { opacity: 1, scale: 1, svgOrigin: "800 696", duration: 0.35, ease: "back.out(1.6)" }, ONLINE);
      tl.to(q(".s07-e1"), { opacity: 0, duration: 0.15 }, ONLINE - 0.1);
      tl.fromTo(q(".s07-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, ONLINE);
      // "no": golpe
      tl.to(q(".s07-cartel"), { scale: 1.12, svgOrigin: "800 696", duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, NO - 0.1);
      tl.to(q(".s07-tienda-in"), { scale: 1.05, svgOrigin: "800 945", duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, NO - 0.1);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
