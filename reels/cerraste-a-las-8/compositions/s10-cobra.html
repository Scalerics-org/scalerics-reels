<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s10-cobra"] .s10-capa { position: absolute; inset: 0; }
    [data-composition-id="s10-cobra"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s10-cobra"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-cobra"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-cobra"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-cobra"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.35); stroke-width: 4; stroke-linecap: round; }
    [data-composition-id="s10-cobra"] .s10-z { font-family: "Lexend", sans-serif; font-weight: 600; fill: rgba(239, 238, 229, 0.75); }
    [data-composition-id="s10-cobra"] .s10-ped { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #5ce611; }
    [data-composition-id="s10-cobra"] .s10-mp { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 24px; fill: rgba(239, 238, 229, 0.8); }
    [data-composition-id="s10-cobra"] .s10-hora { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 72px; letter-spacing: 0.06em; fill: #5ce611; }
    [data-composition-id="s10-cobra"] .s10-envio { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.08em; fill: #efeee5; }
    [data-composition-id="s10-cobra"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s10-cobra"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s10-cobra" data-width="1080" data-height="1920" data-duration="5.96">
    <div id="s10-escena" class="s10-capa clip" data-start="0" data-duration="5.96" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- ===== parte 1: cobra mientras dormís ===== -->
        <g class="s10-uno">
          <g class="s10-luna"><path class="ln s10-dib-luna" d="M-24 -60 A66 66 0 1 0 42 26 A51 51 0 1 1 -24 -60 Z" /></g>
          <g class="s10-casa">
            <path class="ln s10-dib-casa" d="M-110 0 V-150 H110 V0" />
            <path class="ln s10-dib-casa" d="M-134 -144 L0 -250 L134 -144" />
            <rect class="ln s10-dib-casa" x="-78" y="-112" width="56" height="50" rx="5" />
            <path class="ln s10-dib-casa" d="M24 0 V-96 H72 V0" />
            <line class="ln s10-dib-casa" x1="-170" y1="0" x2="170" y2="0" />
          </g>
          <text data-layout-ignore class="s10-z s10-zz" x="372" y="836" font-size="28">z</text>
          <text data-layout-ignore class="s10-z s10-zz" x="398" y="796" font-size="36">z</text>
          <text data-layout-ignore class="s10-z s10-zz" x="430" y="750" font-size="44">Z</text>
          <!-- el celular que cobra -->
          <g class="s10-cel">
            <rect class="ln s10-dib-cel" x="620" y="720" width="260" height="400" rx="36" />
            <line class="ln s10-dib-cel" x1="720" y1="748" x2="780" y2="748" />
            <g class="s10-pill">
              <rect class="ln-ac" x="642" y="790" width="216" height="56" rx="28" />
              <text class="s10-ped" x="750" y="828" text-anchor="middle">+1 pedido</text>
            </g>
            <g class="s10-pago">
              <circle class="ln-ac s10-dib-ok" cx="750" cy="950" r="50" />
              <path class="ln-ac s10-dib-ok" d="M726 951 L744 969 L776 933" />
              <text class="s10-mp" x="750" y="1050" text-anchor="middle">Mercado Pago</text>
            </g>
          </g>
        </g>

        <!-- ===== parte 2: el envío sale a la mañana ===== -->
        <g class="s10-dos">
          <text class="s10-hora s10-reloj" x="540" y="676" text-anchor="middle">08:00</text>
          <path class="ln-tenue s10-calle" d="M40 1010 H120 M180 1010 H260 M320 1010 H400 M460 1010 H540 M600 1010 H680 M740 1010 H820 M880 1010 H960 M1020 1010 H1100" />
          <g class="s10-van">
            <g class="s10-van-in">
              <path class="ln s10-dib-van" d="M370 980 V800 Q370 780 390 780 H620 V980" />
              <path class="ln s10-dib-van" d="M620 840 H680 Q692 840 700 852 L736 908 V980 H620" />
              <path class="ln s10-dib-van" d="M370 980 H408 M472 980 H588 M652 980 H736" />
              <path class="ln-4 s10-dib-van" d="M640 860 H678 L704 900 H640 Z" />
              <g class="s10-caja"><rect class="ln-4" x="440" y="840" width="110" height="90" rx="6" /><path class="ln-ac" d="M495 840 V880" /></g>
            </g>
            <g class="s10-rueda"><circle class="ln" cx="440" cy="984" r="28" /><path class="ln-4" d="M440 966 V1002" /></g>
            <g class="s10-rueda"><circle class="ln" cx="620" cy="984" r="28" /><path class="ln-4" d="M620 966 V1002" /></g>
          </g>
          <path class="ln-tenue s10-vel" d="M250 840 H330 M220 890 H330 M270 940 H330" />
          <!-- las empresas de envío -->
          <g class="s10-e"><rect class="ln-4" x="230" y="1070" width="140" height="64" rx="32" /><text class="s10-envio" x="300" y="1112" text-anchor="middle">DAC</text></g>
          <g class="s10-e"><rect class="ln-4" x="390" y="1070" width="188" height="64" rx="32" /><text class="s10-envio" x="484" y="1112" text-anchor="middle">Correo</text></g>
          <g class="s10-e"><rect class="ln-4" x="598" y="1070" width="252" height="64" rx="32" /><text class="s10-envio" x="724" y="1112" text-anchor="middle">PedidosYa</text></g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s10-e1">Cobra sola</span><span class="s10-e2">Envío a la mañana</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s10-cobra";
      const DUR = 5.96;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const COBRA = 0.0;
      const MERCADO = 0.35;
      const DORMIS = 1.25;
      const Y = 2.27;
      const ENVIO = 2.35;
      const SALE = 2.65;
      const MANANA = 3.15;
      const DAC = 3.75;
      const CORREO = 4.36;
      const PEDIDOSYA = 4.85;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      const etiqueta = (sale, entra, t) => {
        if (sale) tl.to(q(sale), { opacity: 0, duration: 0.15 }, t - 0.12);
        tl.fromTo(q(entra), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

      // ===== parte 1 =====
      // el celular arranca medio dibujado y el pedido cae en "Cobra"
      dibujar(qa(".s10-dib-cel"), 0, 0.45, 0.4);
      gsap.set(qa(".s10-pill, .s10-mp"), { opacity: 0 });
      tl.fromTo(q(".s10-pill"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, COBRA + 0.05);
      dibujar(qa(".s10-dib-ok"), MERCADO - 0.05, 0.4);
      tl.fromTo(q(".s10-mp"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, MERCADO + 0.1);
      tl.to(q(".s10-pago"), { scale: 1.08, svgOrigin: "750 950", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, MERCADO + 0.45);
      etiqueta(null, ".s10-e1", 0.1);
      // "dormís": la casa de noche con luna y Zzz
      gsap.set(q(".s10-casa"), { x: 300, y: 1100 });
      gsap.set(q(".s10-luna"), { x: 170, y: 760 });
      dibujar(qa(".s10-dib-casa"), 0.5, 0.5);
      dibujar([q(".s10-dib-luna")], 0.7, 0.5);
      tl.fromTo(q(".s10-luna"), { rotation: -20, transformOrigin: "50% 50%" }, { rotation: 0, transformOrigin: "50% 50%", duration: 1.2, ease: "power2.out" }, 0.7);
      qa(".s10-zz").forEach((z, i) => {
        tl.fromTo(z, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, DORMIS - 0.2 + i * 0.15);
        tl.to(z, { y: -10, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1 }, DORMIS + 0.15 + i * 0.15);
      });
      tl.to(q(".s10-uno"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, Y - 0.2);

      // ===== parte 2 =====
      gsap.set(qa(".s10-reloj, .s10-caja, .s10-vel, .s10-e, .s10-calle"), { opacity: 0 });
      tl.to(q(".s10-calle"), { opacity: 1, duration: 0.3 }, Y);
      pop(q(".s10-reloj"), Y - 0.05, 540, 650);
      dibujar(qa(".s10-dib-van"), Y - 0.05, 0.45);
      qa(".s10-rueda").forEach((r) => dibujar([r.querySelector("circle")], Y + 0.1, 0.35));
      tl.fromTo(qa(".s10-rueda path"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, Y + 0.3);
      // "envío": la caja entra a la camioneta
      tl.fromTo(q(".s10-caja"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, ENVIO);
      etiqueta(".s10-e1", ".s10-e2", ENVIO);
      // "sale": arranca; la calle corre y las ruedas giran hasta el final
      tl.to(q(".s10-van-in"), { y: -5, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, SALE);
      tl.fromTo(q(".s10-van"), { x: 0 }, { x: 60, duration: 0.5, ease: "power2.out" }, SALE);
      tl.fromTo(q(".s10-vel"), { opacity: 0, x: 0 }, { opacity: 1, x: 40, duration: 0.3, ease: "power2.out" }, SALE);
      tl.to(q(".s10-calle"), { x: -280, duration: DUR - SALE, ease: "none" }, SALE);
      qa(".s10-rueda").forEach((r, i) => {
        const cx = i ? 620 : 440;
        tl.to(r, { rotation: 720, svgOrigin: cx + " 984", duration: DUR - SALE, ease: "none" }, SALE);
      });
      tl.to(q(".s10-van-in"), { y: -3, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 7 }, SALE + 0.3);
      // "mañana": el reloj late
      tl.to(q(".s10-reloj"), { scale: 1.08, svgOrigin: "540 650", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, MANANA);
      // "DAC", "Correo", "PedidosYa": las empresas aparecen en fila
      const es = qa(".s10-e");
      pop(es[0], DAC - 0.05, 300, 1102);
      pop(es[1], CORREO - 0.05, 484, 1102);
      pop(es[2], PEDIDOSYA - 0.05, 724, 1102);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
