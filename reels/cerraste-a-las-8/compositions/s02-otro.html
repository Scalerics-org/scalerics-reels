<template>

  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-otro"] .s02-capa { position: absolute; inset: 0; }
    [data-composition-id="s02-otro"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s02-otro"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-otro"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-otro"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-otro"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-otro"] .relleno { fill: #5ce611; }
    [data-composition-id="s02-otro"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s02-otro"] .s02-pedido { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 26px; fill: #5ce611; }
    [data-composition-id="s02-otro"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s02-otro"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s02-otro" data-width="1080" data-height="1920" data-duration="4.50">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="4.50" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s02-suelo" x1="40" y1="1120" x2="1040" y2="1120" />
        <!-- tu local, cerrado (izquierda) -->
        <g class="s02-local">
          <g class="s02-local-in">
            <path class="ln s02-dib-l" d="M-120 0 V-170 H120 V0" />
            <path class="ln s02-dib-l" d="M-140 -170 H140 L122 -222 H-122 Z" />
            <rect class="ln s02-dib-l" x="-80" y="-290" width="160" height="50" rx="10" />
            <text class="cartel s02-txt-l" x="0" y="-257" text-anchor="middle">TU LOCAL</text>
            <path class="ln-4 s02-dib-l" d="M-108 -150 H108 M-108 -128 H108 M-108 -106 H108 M-108 -84 H108 M-108 -62 H108 M-108 -40 H108 M-108 -18 H108" />
            <path class="ln-4 s02-dib-l" d="M-108 -168 V0 M108 -168 V0" />
          </g>
        </g>
        <g class="s02-badge"><g class="s02-b-in"><circle class="ln-badge" cx="0" cy="0" r="18" /><path class="ln-badge" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
        <!-- tu cliente -->
        <g class="s02-cli">
          <g class="s02-cli-in">
            <circle class="ln" cx="0" cy="-96" r="14" />
            <path class="ln s02-cuerpo" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -40 L-14 0 M0 -40 L14 0" />
            <path class="ln s02-brazo" d="M0 -70 L18 -56 L22 -74" />
            <g class="s02-cel"><rect class="ln-4" x="14" y="-98" width="20" height="32" rx="5" /><rect class="relleno s02-cel-luz" x="19" y="-92" width="10" height="18" rx="2" /></g>
          </g>
        </g>
        <g class="s02-bolsa"><path class="ln" d="M-26 -10 H26 L32 50 H-32 Z" /><path class="ln" d="M-12 -10 V-22 Q0 -38 12 -22 V-10" /></g>
        <!-- la flecha hacia el otro -->
        <path class="ln-ac s02-flecha" d="M590 990 Q640 840 700 860" />
        <path class="ln-ac s02-punta" d="M676 842 L702 860 L676 880" />
        <!-- el otro: una tienda en el celular -->
        <g class="s02-otro">
          <g class="s02-otro-in">
            <rect class="ln s02-dib-o" x="720" y="760" width="200" height="360" rx="30" />
            <line class="ln s02-dib-o" x1="795" y1="786" x2="845" y2="786" />
            <rect class="ln-4 s02-dib-o" x="744" y="820" width="70" height="70" rx="8" />
            <rect class="ln-4 s02-dib-o" x="826" y="820" width="70" height="70" rx="8" />
            <rect class="ln-4 s02-dib-o" x="744" y="902" width="70" height="70" rx="8" />
            <rect class="ln-4 s02-dib-o" x="826" y="902" width="70" height="70" rx="8" />
            <g class="s02-pill"><rect class="ln-ac" x="738" y="1006" width="164" height="50" rx="25" /><text class="s02-pedido" x="820" y="1040" text-anchor="middle">+1 venta</text></g>
          </g>
          <rect class="ln s02-dib-o" x="760" y="664" width="120" height="50" rx="10" />
          <text class="cartel s02-txt-o" x="820" y="697" text-anchor="middle">OTRO</text>
        </g>
      </svg>
      <div class="etiqueta"><span class="s02-e1">Sigue comprando</span><span class="s02-e2">A otro</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-otro";
      const DUR = 4.5;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CLIENTE = 0.4;
      const NO = 1.17;
      const SIGUE = 2.3;
      const COMPRANDO = 2.6;
      const COMPRA = 3.6;
      const OTRO = 4.0;

      const SUELO = 1120;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // tu local cerrado arranca medio dibujado, ya apagado
      gsap.set(q(".s02-local"), { x: 230, y: SUELO, opacity: 0.45 });
      dibujar(qa(".s02-dib-l"), 0, 0.5, 0.4);
      tl.fromTo(q(".s02-txt-l"), { opacity: 0.4 }, { opacity: 1, duration: 0.3 }, 0);
      tl.fromTo(q(".s02-suelo"), { scaleX: 0.6, svgOrigin: "540 1120" }, { scaleX: 1, svgOrigin: "540 1120", duration: 0.6, ease: "power3.out" }, 0);

      // "cliente": entra caminando desde la izquierda
      gsap.set(q(".s02-cli"), { x: 400, y: SUELO, opacity: 0 });
      gsap.set(q(".s02-cli-in"), { scale: 1.5, svgOrigin: "0 0" });
      gsap.set(q(".s02-cel"), { opacity: 0 });
      gsap.set(q(".s02-bolsa"), { opacity: 0 });
      tl.to(q(".s02-cli"), { opacity: 1, duration: 0.15 }, CLIENTE - 0.1);
      tl.to(q(".s02-cli"), { x: 520, duration: 0.8, ease: "power2.out" }, CLIENTE - 0.1);
      tl.fromTo(q(".s02-cuerpo"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 4 }, CLIENTE - 0.1);

      // "no": badge sobre tu local
      gsap.set(q(".s02-badge"), { x: 350, y: 900 });
      tl.fromTo(q(".s02-b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, NO);
      tl.to(q(".s02-local-in"), { x: -6, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, NO + 0.05);

      // "sigue comprando": celular en la mano y bolsa al lado
      tl.fromTo(q(".s02-cel"), { opacity: 0, scale: 0.4, svgOrigin: "24 -82" }, { opacity: 1, scale: 1, svgOrigin: "24 -82", duration: 0.3, ease: "back.out(2)" }, SIGUE);
      tl.fromTo(q(".s02-cel-luz"), { opacity: 0.4 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 5 }, SIGUE + 0.2);
      gsap.set(q(".s02-bolsa"), { x: 466, y: 1048 });
      tl.fromTo(q(".s02-bolsa"), { opacity: 0, scale: 0.85, svgOrigin: "0 20" }, { opacity: 1, scale: 1, svgOrigin: "0 20", duration: 0.35, ease: "back.out(1.6)" }, COMPRANDO);
      tl.fromTo(q(".s02-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, SIGUE);

      // el otro: la tienda en el celular aparece cuando compra
      dibujar(qa(".s02-dib-o"), COMPRANDO + 0.3, 0.5);
      tl.fromTo(q(".s02-txt-o"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, COMPRANDO + 0.6);
      gsap.set(q(".s02-pill"), { opacity: 0 });

      // "le compra a otro": la flecha sale de su celular hacia el otro
      dibujar([q(".s02-flecha")], COMPRA - 0.15, 0.4);
      tl.fromTo(q(".s02-punta"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, COMPRA + 0.2);
      tl.fromTo(q(".s02-pill"), { opacity: 0, scale: 0.85, svgOrigin: "820 1031" }, { opacity: 1, scale: 1, svgOrigin: "820 1031", duration: 0.35, ease: "back.out(1.6)" }, OTRO);
      tl.to(q(".s02-otro-in"), { scale: 1.06, svgOrigin: "820 940", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, OTRO);
      tl.to(q(".s02-e1"), { opacity: 0, duration: 0.2 }, COMPRA);
      tl.fromTo(q(".s02-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, OTRO - 0.1);
      tl.to(q(".s02-local"), { opacity: 0.3, duration: 0.3 }, OTRO);

      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
