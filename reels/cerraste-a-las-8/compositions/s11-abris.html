        <g class="s11-reloj" clip-path="url(#s11-clip-hora)">
          <text class="s11-hora s11-h1" x="540" y="676" text-anchor="middle">20:00</text>
          <text class="s11-hora s11-h2" x="540" y="676" text-anchor="middle">08:00</text>
        </g>
        <line class="ln s11-suelo" x1="60" y1="1160" x2="1020" y2="1160" />

        <!-- los pedidos pagos -->

  <script>
    (function () {
      const ID = "s11-abris";
      const DUR = 3.38;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CERRAS = 0.29;
      const OCHO = 0.89;
      const ABRIS = 1.59;
      const PEDIDOS = 1.99;
      const PAGOS = 2.59;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // el local arranca medio dibujado con la luz prendida
      dibujar(qa(".s11-dib"), 0, 0.4, 0.4);
      tl.fromTo(q(".s11-txt"), { opacity: 0.4 }, { opacity: 1, duration: 0.25 }, 0);
      tl.fromTo(qa(".s11-luz"), { opacity: 0.5 }, { opacity: 0.85, duration: 0.2 }, 0);
      tl.fromTo(q(".s11-suelo"), { scaleX: 0.6, svgOrigin: "540 1160" }, { scaleX: 1, svgOrigin: "540 1160", duration: 0.5, ease: "power3.out" }, 0);
      gsap.set(q(".s11-h2"), { y: 90 });
      tl.fromTo(q(".s11-reloj"), { opacity: 0, scale: 0.85, svgOrigin: "540 650" }, { opacity: 1, scale: 1, svgOrigin: "540 650", duration: 0.3, ease: "back.out(1.6)" }, 0.05);

      // "cerrás": baja la cortina y se apaga
      tl.fromTo(q(".s11-clip-r"), { scaleY: 0, svgOrigin: "0 -264" }, { scaleY: 1, svgOrigin: "0 -264", duration: 0.45, ease: "power2.in" }, CERRAS - 0.05);
      tl.fromTo(q(".s11-barra"), { y: -262 }, { y: 0, duration: 0.45, ease: "power2.in" }, CERRAS - 0.05);
      tl.to(qa(".s11-luz"), { opacity: 0, duration: 0.25 }, CERRAS + 0.15);
      tl.to(q(".s11-frente"), { opacity: 0, duration: 0.2 }, CERRAS + 0.3);
      tl.to(q(".s11-local"), { y: 6, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1 }, CERRAS + 0.4);
      tl.to(qa(".s11-dib, .s11-txt"), { opacity: 0.45, duration: 0.3 }, CERRAS + 0.45);
      tl.fromTo(q(".s11-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, CERRAS);
      tl.to(q(".s11-h1"), { opacity: 0.5, duration: 0.12, yoyo: true, repeat: 1 }, OCHO);

      // "abrís": el reloj rueda a 08:00 y la cortina sube, se prende
      tl.to(q(".s11-h1"), { y: -90, duration: 0.28, ease: "power3.in" }, ABRIS - 0.25);
      tl.to(q(".s11-h2"), { y: 0, duration: 0.32, ease: "back.out(1.6)" }, ABRIS);
      tl.to(q(".s11-clip-r"), { scaleY: 0, svgOrigin: "0 -264", duration: 0.4, ease: "power2.out" }, ABRIS);
      tl.to(q(".s11-barra"), { y: -262, duration: 0.4, ease: "power2.out" }, ABRIS);
      tl.to(q(".s11-barra"), { opacity: 0, duration: 0.1 }, ABRIS + 0.32);
      tl.to(qa(".s11-dib, .s11-txt, .s11-frente"), { opacity: 1, duration: 0.25 }, ABRIS + 0.15);
      tl.to(qa(".s11-luz"), { opacity: 0.85, duration: 0.25 }, ABRIS + 0.25);
      tl.to(q(".s11-e1"), { opacity: 0, duration: 0.15 }, ABRIS - 0.1);
      tl.fromTo(q(".s11-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, ABRIS);

      // "pedidos": salen los tres pedidos; "pagos": golpe
      const ps = qa(".s11-p");
      ps.forEach((p, i) => {
        gsap.set(p, { opacity: 0 });
        tl.fromTo(p, { opacity: 0, x: -140, scale: 0.85, svgOrigin: "790 " + (864 + i * 100) }, { opacity: 1, x: 0, scale: 1, svgOrigin: "790 " + (864 + i * 100), duration: 0.35, ease: "back.out(1.6)" }, PEDIDOS - 0.1 + i * 0.15);
      });
      tl.to(ps, { scale: 1.06, svgOrigin: "790 964", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, PAGOS);

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
