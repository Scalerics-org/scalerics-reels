<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-no-es"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-no-es"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-no-es"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-no-es"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-no-es"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-no-es"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.12em; fill: #efeee5; }
    [data-composition-id="s03-no-es"] .s03-nom { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: rgba(239, 238, 229, 0.6); }
    [data-composition-id="s03-no-es"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s03-no-es"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s03-no-es" data-width="1080" data-height="1920" data-duration="3.70">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="3.70" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- 1: el rubro (mostrador con balanza) -->
        <g class="s03-i1" transform="translate(220 1060)">
          <g class="s03-in">
            <path class="ln s03-d1" d="M-110 0 V-96 H110 V0" />
            <path class="ln s03-d1" d="M-122 -96 H122" />
            <path class="ln s03-d1" d="M-44 -96 V-118 H44 V-96" />
            <path class="ln s03-d1" d="M0 -118 V-150" />
            <path class="ln s03-d1" d="M-64 -170 Q0 -138 64 -170 Z" />
            <path class="ln-4 s03-d1" d="M-60 -56 H60" />
          </g>
          <text class="s03-nom s03-n" x="0" y="64" text-anchor="middle">RUBRO</text>
        </g>
        <!-- 2: el barrio (cartel de calle en la esquina) -->
        <g class="s03-i2" transform="translate(540 1060)">
          <g class="s03-in">
            <path class="ln s03-d2" d="M0 0 V-196" />
            <rect class="ln s03-d2" x="-92" y="-250" width="184" height="54" rx="8" />
            <text class="cartel s03-t2" x="0" y="-214" text-anchor="middle">BARRIO</text>
            <path class="ln-4 s03-d2" d="M-120 0 H120" />
            <path class="ln-4 s03-d2" d="M-40 -150 L40 -170 L40 -130 L-40 -110 Z" />
          </g>
          <text class="s03-nom s03-n" x="0" y="64" text-anchor="middle">BARRIO</text>
        </g>
        <!-- 3: los grandes (edificio con la red arriba) -->
        <g class="s03-i3" transform="translate(860 1060)">
          <g class="s03-in">
            <path class="ln s03-d3" d="M-62 0 V-250 H62 V0" />
            <path class="ln-4 s03-d3" d="M-34 -220 H-14 M14 -220 H34 M-34 -180 H-14 M14 -180 H34 M-34 -140 H-14 M14 -140 H34 M-34 -100 H-14 M14 -100 H34 M-34 -60 H-14 M14 -60 H34" />
            <path class="ln-4 s03-d3" d="M-14 0 V-30 H14 V0" />
            <circle class="ln-4 s03-red" cx="0" cy="-300" r="30" />
            <path class="ln-4 s03-red" d="M-30 -300 H30 M0 -330 Q-18 -300 0 -270 M0 -330 Q18 -300 0 -270" />
          </g>
          <text class="s03-nom s03-n" x="0" y="64" text-anchor="middle">GRANDES</text>
        </g>
        <!-- badges de "no" -->
        <g class="s03-badge s03-b1"><g class="s03-b-in"><circle class="ln-badge" cx="0" cy="0" r="18" /><path class="ln-badge" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
        <g class="s03-badge s03-b2"><g class="s03-b-in"><circle class="ln-badge" cx="0" cy="0" r="18" /><path class="ln-badge" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
        <g class="s03-badge s03-b3"><g class="s03-b-in"><circle class="ln-badge" cx="0" cy="0" r="18" /><path class="ln-badge" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
      </svg>
      <div class="etiqueta"><span class="s03-e1">No es el rubro</span><span class="s03-e2">Ni el barrio</span><span class="s03-e3">Ni el tamaño</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-no-es";
      const DUR = 3.7;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const RUBRO = 0.5;
      const BARRIO = 1.4;
      const NI2 = 2.22;
      const INTERNET = 2.4;
      const GRANDES = 3.4;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const badge = (el, t) => {
        const inn = el.querySelector(".s03-b-in");
        tl.fromTo(inn, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.3, ease: "back.out(2.2)" }, t);
      };
      const sacudir = (el, t) => tl.to(el, { x: -6, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      const etiqueta = (sale, entra, t) => {
        if (sale) tl.to(q(sale), { opacity: 0, duration: 0.15 }, t - 0.1);
        tl.fromTo(q(entra), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
      };
      const nombres = qa(".s03-n");
      gsap.set(nombres, { opacity: 0 });
      gsap.set(q(".s03-b1"), { x: 330, y: 870 });
      gsap.set(q(".s03-b2"), { x: 650, y: 790 });
      gsap.set(q(".s03-b3"), { x: 950, y: 790 });
      gsap.set(qa(".s03-b-in"), { opacity: 0 });

      // 1: el mostrador arranca medio dibujado (cuadro 0 no negro)
      dibujar(qa(".s03-d1"), 0, 0.45, 0.4);
      tl.fromTo(nombres[0], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.15);
      badge(q(".s03-b1"), RUBRO + 0.08);
      sacudir(q(".s03-i1 .s03-in"), RUBRO + 0.12);
      tl.to(q(".s03-i1"), { opacity: 0.4, duration: 0.3 }, RUBRO + 0.4);
      etiqueta(null, ".s03-e1", RUBRO);

      // 2: el barrio
      dibujar(qa(".s03-d2"), BARRIO - 0.45, 0.4);
      tl.fromTo(q(".s03-t2"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, BARRIO - 0.15);
      tl.fromTo(nombres[1], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, BARRIO - 0.3);
      badge(q(".s03-b2"), BARRIO + 0.08);
      sacudir(q(".s03-i2 .s03-in"), BARRIO + 0.12);
      tl.to(q(".s03-i2"), { opacity: 0.4, duration: 0.3 }, BARRIO + 0.45);
      etiqueta(".s03-e1", ".s03-e2", BARRIO);

      // 3: internet para los grandes: la red se prende, el edificio sube
      dibujar(qa(".s03-red"), INTERNET - 0.15, 0.4);
      tl.fromTo(q(".s03-i3 .s03-red"), { rotation: -30, svgOrigin: "0 -300" }, { rotation: 0, svgOrigin: "0 -300", duration: 0.8, ease: "power2.out" }, INTERNET - 0.15);
      dibujar(qa(".s03-d3"), INTERNET + 0.1, 0.5);
      tl.fromTo(q(".s03-i3 .s03-in"), { y: 30 }, { y: 0, duration: 0.8, ease: "power3.out" }, INTERNET);
      tl.fromTo(nombres[2], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, INTERNET + 0.4);
      etiqueta(".s03-e2", ".s03-e3", NI2 + 0.1);
      badge(q(".s03-b3"), GRANDES - 0.05);
      sacudir(q(".s03-i3 .s03-in"), GRANDES);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
