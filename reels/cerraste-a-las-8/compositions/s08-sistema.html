<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s08-sistema"] .s08-capa { position: absolute; inset: 0; }
    [data-composition-id="s08-sistema"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s08-sistema"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sistema"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sistema"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sistema"] .precio { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 76px; fill: #efeee5; }
    [data-composition-id="s08-sistema"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s08-sistema"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s08-sistema" data-width="1080" data-height="1920" data-duration="3.50">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="3.50" data-track-index="0">
      <!-- lo que no es: caro y complicado -->
      <div id="s08-no-capa" class="s08-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g class="s08-tag">
            <path class="ln s08-cuerpo" d="M170 910 L236 836 H414 Q432 836 432 854 V966 Q432 984 414 984 H236 Z" />
            <circle class="ln s08-cuerpo" cx="222" cy="910" r="12" />
            <path class="ln s08-piolin" d="M212 902 C 180 860 160 800 186 740" />
            <text class="precio s08-precio" x="334" y="936" text-anchor="middle">$</text>
          </g>
          <g class="s08-b1"><circle class="ln-badge" cx="432" cy="836" r="18" /><path class="ln-badge" d="M425 829 L439 843 M439 829 L425 843" /></g>
          <path class="ln s08-lio" d="M640 920 C 650 820 790 820 780 890 S 660 980 690 900 S 860 830 850 920 S 720 1000 690 950 S 800 850 880 880" />
          <g class="s08-b2"><circle class="ln-badge" cx="890" cy="836" r="18" /><path class="ln-badge" d="M883 829 L897 843 M897 829 L883 843" /></g>
        </svg>
      </div>
      <!-- el engranaje -->
      <div id="s08-sis-capa" class="s08-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g class="s08-engranaje">
            <path class="ln s08-dib-g s08-dientes" d="" />
            <circle class="ln-ac s08-dib-g" cx="540" cy="910" r="54" />
          </g>
        </svg>
      </div>
      <div class="etiqueta"><span class="s08-e1">Ni caro ni complicado</span><span class="s08-e2">Es un sistema</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-sistema";
      const DUR = 3.5;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const NO = 0.62;
      const CARO = 0.9;
      const COMPLICADO = 1.3;
      const ES = 1.9;
      const SISTEMA = 2.7;

      // dientes del engranaje (geometría fija, determinista)
      const CX = 540, CY = 910, RIN = 128, ROUT = 168, N = 9;
      const pt = (r, a) => (CX + r * Math.cos(a)).toFixed(1) + " " + (CY + r * Math.sin(a)).toFixed(1);
      let d = "";
      for (let i = 0; i < N; i++) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
        const p0 = pt(RIN, a - 0.2), p1 = pt(ROUT, a - 0.12), p2 = pt(ROUT, a + 0.12), p3 = pt(RIN, a + 0.2);
        const sig = pt(RIN, a + (2 * Math.PI) / N - 0.2);
        d += (i === 0 ? "M" + p0 : "") + " L" + p1 + " L" + p2 + " L" + p3 + " A" + RIN + " " + RIN + " 0 0 1 " + sig;
      }
      q(".s08-dientes").setAttribute("d", d + " Z");

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };
      const badge = (el, ox, oy, t) => tl.fromTo(el, { opacity: 0, scale: 0.4, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.3, ease: "back.out(2.2)" }, t);

      // la etiqueta de precio entra con pop (cuadro 0 no negro) y se balancea
      tl.fromTo(qa(".s08-cuerpo"), { opacity: 0.45, scale: 0.82, svgOrigin: "300 910" }, { opacity: 1, scale: 1, svgOrigin: "300 910", duration: 0.4, ease: "back.out(1.6)" }, 0);
      dibujar([q(".s08-piolin")], 0.1, 0.4);
      tl.fromTo(q(".s08-precio"), { opacity: 0, scale: 1.4, svgOrigin: "334 910" }, { opacity: 1, scale: 1, svgOrigin: "334 910", duration: 0.3, ease: "power3.out" }, 0.15);
      tl.fromTo(q(".s08-tag"), { rotation: -4, svgOrigin: "186 740" }, { rotation: 4, svgOrigin: "186 740", duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      // el lío de líneas se dibuja
      dibujar([q(".s08-lio")], 0.25, 0.9);
      tl.fromTo(q(".s08-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, NO);

      // "caro": badge y se apaga; "complicado": badge y se apaga
      gsap.set(qa(".s08-b1, .s08-b2"), { opacity: 0 });
      badge(q(".s08-b1"), 432, 836, CARO);
      tl.to(q(".s08-precio"), { x: 6, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, CARO + 0.05);
      tl.to(q(".s08-tag"), { opacity: 0.4, duration: 0.3 }, CARO + 0.25);
      badge(q(".s08-b2"), 890, 836, COMPLICADO);
      tl.to(q(".s08-lio"), { x: 6, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, COMPLICADO + 0.05);
      tl.to(q(".s08-lio"), { opacity: 0.4, duration: 0.3 }, COMPLICADO + 0.25);

      // "Es": lo de antes se va; el engranaje se dibuja en el centro
      tl.to(q("#s08-no-capa"), { opacity: 0, scale: 0.8, filter: "blur(6px)", transformOrigin: "540px 910px", duration: 0.35, ease: "power2.in" }, ES - 0.15);
      tl.to(q(".s08-e1"), { opacity: 0, duration: 0.2 }, ES - 0.15);
      dibujar(qa(".s08-dib-g"), ES, 0.55);
      tl.fromTo(q(".s08-engranaje"), { rotation: -30, svgOrigin: "540 910" }, { rotation: 70, svgOrigin: "540 910", duration: DUR - ES, ease: "none" }, ES);
      tl.fromTo(q(".s08-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, ES + 0.05);
      // "sistema": punch
      tl.fromTo(q("#s08-sis-capa"), { scale: 1 }, { scale: 1.12, transformOrigin: "540px 910px", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, SISTEMA);
      tl.to(q(".s08-e2"), { scale: 1.08, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, SISTEMA);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
