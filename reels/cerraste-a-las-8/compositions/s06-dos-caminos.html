  <script>
    (function () {
      const ID = "s06-dos-caminos";
      const DUR = 7.22;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const MANANA1 = 0.67;
      const ARMAS = 1.27;
      const PAQUETE = 1.87;
      const SALE = 2.37;
      const SINO = 2.67;
      const ABRIS = 4.17;
      const VENTA = 5.27;
      const LLEVO = 6.17;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const etiqueta = (sale, entra, t) => {
        if (sale) tl.to(q(sale), { opacity: 0, duration: 0.15 }, t - 0.12);
        tl.fromTo(q(entra), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

      // ===== camino 1 =====
      // el pedido pagado ya está (cuadro 0 no negro): entra con pop
      tl.fromTo(q(".s06-card1"), { opacity: 0.4, scale: 0.85, svgOrigin: "540 784" }, { opacity: 1, scale: 1, svgOrigin: "540 784", duration: 0.35, ease: "back.out(1.6)" }, 0);
      etiqueta(null, ".s06-e1", 0.1);
      // "mañana": el reloj marca 08:00
      tl.fromTo(q(".s06-reloj"), { opacity: 0, scale: 0.85, svgOrigin: "540 650" }, { opacity: 1, scale: 1, svgOrigin: "540 650", duration: 0.35, ease: "back.out(1.6)" }, MANANA1 - 0.05);
      // "armás el paquete": la caja se dibuja abierta, en "paquete" se cierra
      dibujar([q(".s06-suelo1")], 0.2, 0.5);
      dibujar([q(".s06-dib-caja"), q(".s06-tapa-a"), q(".s06-tapa-b")], ARMAS - 0.2, 0.45);
      gsap.set(qa(".s06-tapa-c, .s06-cinta, .s06-ok"), { opacity: 0 });
      tl.to(q(".s06-tapa-a"), { rotation: 135, svgOrigin: "440 960", duration: 0.25, ease: "power3.in" }, PAQUETE - 0.25);
      tl.to(q(".s06-tapa-b"), { rotation: -135, svgOrigin: "640 960", duration: 0.25, ease: "power3.in" }, PAQUETE - 0.25);
      tl.set(qa(".s06-tapa-a, .s06-tapa-b"), { opacity: 0 }, PAQUETE);
      tl.set(q(".s06-tapa-c"), { opacity: 1 }, PAQUETE);
      dibujar([q(".s06-cinta")], PAQUETE, 0.25);
      tl.fromTo(qa(".s06-ok"), { opacity: 0, scale: 0.4, svgOrigin: "600 1060" }, { opacity: 1, scale: 1, svgOrigin: "600 1060", duration: 0.3, ease: "back.out(2.2)" }, PAQUETE + 0.15);
      tl.to(q(".s06-caja"), { y: 6, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1 }, PAQUETE);
      // "sale": la caja se va hacia la derecha con rayas de velocidad
      gsap.set(q(".s06-vel"), { opacity: 0 });
      tl.to(qa(".s06-caja"), { x: 560, duration: 0.5, ease: "power3.in" }, SALE);
      tl.fromTo(q(".s06-vel"), { opacity: 0, x: 0 }, { opacity: 1, x: 300, duration: 0.3, ease: "power3.in" }, SALE + 0.1);
      tl.to(q(".s06-vel"), { opacity: 0, duration: 0.15 }, SALE + 0.4);
      etiqueta(".s06-e1", ".s06-e2", SALE - 0.2);
      tl.to(q(".s06-uno"), { opacity: 0, duration: 0.25 }, SINO + 0.1);

      // ===== camino 2 =====
      gsap.set(q(".s06-local"), { x: 540, y: 1160 });
      gsap.set(qa(".s06-dib-l, .s06-txt-l, .s06-frente, .s06-cortina, .s06-barra, .s06-suelo2"), { opacity: 0 });
      dibujar(qa(".s06-dib-l"), SINO + 0.2, 0.5);
      dibujar([q(".s06-suelo2")], SINO + 0.2, 0.5);
      tl.to(qa(".s06-txt-l, .s06-cortina, .s06-barra"), { opacity: 1, duration: 0.3 }, SINO + 0.5);
      tl.fromTo(q(".s06-local-in"), { scale: 0.94, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.6, ease: "power3.out" }, SINO + 0.2);
      tl.to(q(".s06-reloj"), { opacity: 0.5, duration: 0.15, yoyo: true, repeat: 3 }, SINO + 0.6);
      // "abrís": la cortina sube; adentro no hay nada
      tl.to(q(".s06-clip-r"), { scaleY: 0, svgOrigin: "0 -264", duration: 0.6, ease: "power2.out" }, ABRIS - 0.1);
      tl.fromTo(q(".s06-barra"), { y: 0 }, { y: -262, duration: 0.6, ease: "power2.out", immediateRender: false }, ABRIS - 0.1);
      tl.to(q(".s06-barra"), { opacity: 0, duration: 0.1 }, ABRIS + 0.45);
      tl.to(q(".s06-frente"), { opacity: 0.6, duration: 0.3 }, ABRIS + 0.1);
      etiqueta(".s06-e2", ".s06-e3", ABRIS);
      // "esa venta": aparece el pedido de las 23:14; "se la llevó otro": se va a la derecha
      gsap.set(q(".s06-card2"), { opacity: 0 });
      tl.fromTo(q(".s06-card2"), { opacity: 0, scale: 0.85, svgOrigin: "830 770" }, { opacity: 1, scale: 1, svgOrigin: "830 770", duration: 0.35, ease: "back.out(1.6)" }, VENTA - 0.1);
      tl.to(q(".s06-card2"), { x: 420, opacity: 0, duration: 0.4, ease: "power2.in" }, LLEVO - 0.25);
      tl.to(qa(".s06-local, .s06-suelo2"), { opacity: 0.4, duration: 0.35 }, LLEVO + 0.15);
      tl.to(q(".s06-local-in"), { x: -6, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, LLEVO + 0.3);
      etiqueta(".s06-e3", ".s06-e4", LLEVO);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
