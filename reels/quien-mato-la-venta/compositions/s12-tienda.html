  <script>
    (function () {
      const ID = "s12-tienda";
      const DUR = 8.1;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde = 0) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - desde), opacity: desde > 0 ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.03 }, t + i * 0.04);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const tipear = (el, texto, t, paso) => {
        el.innerHTML = [...texto].map((c) => '<span class="letra">' + (c === " " ? "&nbsp;" : c) + "</span>").join("");
        [...el.querySelectorAll(".letra")].forEach((s, i) => tl.set(s, { opacity: 1 }, t + i * paso));
      };
      const golpe = (t, k = 1) => [[-14, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".esc"), { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const sello = (el, t, rot = -6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.3, rotation: rot - 10 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.12);
        golpe(t + 0.05);
      };
      const pop = (el, t, extra = {}) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.8, ...extra }, { opacity: 1, scale: 1, x: 0, y: 0, rotation: 0, duration: 0.35, ease: "back.out(1.7)", immediateRender: false }, t);
      };
      const entra = (el, t, desde = { y: 24 }) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
      };
      const parpadeo = (el, ts) => ts.forEach((t) => tl.to(el, { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t));


      const SCALERICS = 0.4, TIENDA = 1.6, SOLA = 2.9, HORA = 3.6, MP = 4.8, DAC = 6.2, CORREO = 7.04, PYA = 7.5;
      tl.fromTo(q(".ventana"), { scale: 0.9, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo(q(".esc"), { scale: 1 }, { scale: 1.04, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);
      // la puerta se abre: luz verde
      tl.to(q(".hoja-p"), { scaleX: 0.12, svgOrigin: "333 400", duration: 0.5, ease: "power2.inOut" }, SCALERICS);
      tl.to(q(".luz"), { opacity: 1, duration: 0.4 }, SCALERICS + 0.1);
      tl.to(q(".marco"), { stroke: "#5ce611", duration: 0.3 }, SCALERICS + 0.1);
      // se arma la tienda
      tl.to([q(".puerta-svg")], { opacity: 0, scale: 1.4, duration: 0.3, ease: "power2.in", transformOrigin: "50% 50%" }, TIENDA - 0.45);
      tl.to(q(".luz"), { opacity: 0.35, duration: 0.3 }, TIENDA - 0.3);
      qa(".prod").forEach((p, i) => pop(p, TIENDA - 0.2 + i * 0.12, { y: 60 }));
      tl.to(q(".p1 .btn"), { scale: 1.15, duration: 0.15, yoyo: true, repeat: 1 }, SOLA - 0.2);
      // "vende sola": entra la notificación
      gsap.set(q(".toast"), { opacity: 0 });
      tl.fromTo(q(".toast"), { opacity: 1, x: 600 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(1.4)", immediateRender: false }, SOLA);
      entra(q(".rot"), HORA - 0.2);
      // "Mercado Pago"
      pop(q(".chip"), MP - 0.1, { y: 30 });
      tl.to(q(".toast"), { opacity: 0.0, x: 300, duration: 0.3 }, MP + 0.6);
      // envíos
      [[".e1", DAC], [".e2", CORREO], [".e3", PYA]].forEach(([s, t], i) => {
        gsap.set(q(s), { opacity: 0 });
        tl.fromTo(q(s), { opacity: 1, y: -300, rotation: i % 2 ? 8 : -8 }, { opacity: 1, y: 0, rotation: i % 2 ? 2 : -2, duration: 0.25, ease: "bounce.out", immediateRender: false }, t - 0.3);
      });

      tl.to(q(".capa"), { scale: 1.1, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
