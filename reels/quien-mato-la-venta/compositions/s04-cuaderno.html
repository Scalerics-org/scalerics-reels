  <script>
    (function () {
      const ID = "s04-cuaderno";
      const DUR = 6.4;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde = 0) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - desde), opacity: desde > 0 ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.03 }, t + i * 0.04);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const tipear = (el, texto, t, paso) => {
        el.innerHTML = [...texto].map((c) => '<span class="letra">' + (c === " " ? "&nbsp;" : c) + "</span>").join("");
        [...el.querySelectorAll(".letra")].forEach((s, i) => tl.set(s, { opacity: 1 }, t + i * paso));
      };
      const golpe = (t, k = 1) => [[-14, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".esc"), { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const sello = (el, t, rot = -6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.3, rotation: rot - 10 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.12);
        golpe(t + 0.05);
      };
      const pop = (el, t, extra = {}) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.8, ...extra }, { opacity: 1, scale: 1, x: 0, y: 0, rotation: 0, duration: 0.35, ease: "back.out(1.7)", immediateRender: false }, t);
      };
      const entra = (el, t, desde = { y: 24 }) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
      };
      const parpadeo = (el, ts) => ts.forEach((t) => tl.to(el, { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t));


      const UNO = 0.8, CUADERNO = 1.5, VISTO = 3.06, CAJA = 4.8, COARTADA = 5.7;
      // cuadro 0: la foto ya está, flash de foto policial
      tl.fromTo(q(".foto"), { scale: 1.08, rotation: -3 }, { scale: 1, rotation: 0, duration: 0.35, ease: "power3.out" }, 0);
      dibujar(qa(".sosp .linea"), 0, 0.5, 0.5);
      dibujar(qa(".tachon"), 0.4, 0.4);
      tl.fromTo(q(".cartel"), { y: 140 }, { y: 0, duration: 0.3, ease: "back.out(1.6)" }, UNO - 0.3);
      tl.fromTo(q(".cartel b"), { scale: 1.4, color: "#f1ece0" }, { scale: 1, color: "#ffd23f", duration: 0.2 }, UNO);
      parpadeo(q(".sosp .ojos"), [1.2, 2.6]);
      tl.to(qa(".sosp .pupila"), { x: -10, duration: 0.15 }, CUADERNO);
      tl.to(qa(".sosp .pupila"), { x: 8, duration: 0.15 }, CUADERNO + 0.6);
      tl.to(q(".foto"), { x: -8, duration: 0.05, yoyo: true, repeat: 5 }, CUADERNO);
      // "visto por última vez": la foto se corre y entra la foto de la caja
      tl.to(q(".foto"), { scale: 0.62, x: -170, y: -170, rotation: -4, duration: 0.4, ease: "power3.inOut" }, VISTO - 0.3);
      pop(q(".inset"), VISTO - 0.1, { rotation: 12, y: 80 });
      dibujar([q(".circulo")], CAJA - 0.3, 0.5);
      entra(q(".e1"), CAJA - 0.2);
      tl.to(q(".esc"), { scale: 1.04, duration: DUR - VISTO, ease: "none", transformOrigin: "60% 60%" }, VISTO);
      // "sin coartada"
      sello(q(".s1"), COARTADA - 0.05, -7);

      tl.to(q(".capa"), { scale: 1.1, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
