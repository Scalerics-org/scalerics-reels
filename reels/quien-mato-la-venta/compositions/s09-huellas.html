  <script>
    (function () {
      const ID = "s09-huellas";
      const DUR = 6.37;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde = 0) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - desde), opacity: desde > 0 ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.03 }, t + i * 0.04);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const tipear = (el, texto, t, paso) => {
        el.innerHTML = [...texto].map((c) => '<span class="letra">' + (c === " " ? "&nbsp;" : c) + "</span>").join("");
        [...el.querySelectorAll(".letra")].forEach((s, i) => tl.set(s, { opacity: 1 }, t + i * paso));
      };
      const golpe = (t, k = 1) => [[-14, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".esc"), { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const sello = (el, t, rot = -6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.3, rotation: rot - 10 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.12);
        golpe(t + 0.05);
      };
      const pop = (el, t, extra = {}) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.8, ...extra }, { opacity: 1, scale: 1, x: 0, y: 0, rotation: 0, duration: 0.35, ease: "back.out(1.7)", immediateRender: false }, t);
      };
      const entra = (el, t, desde = { y: 24 }) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
      };
      const parpadeo = (el, ts) => ts.forEach((t) => tl.to(el, { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t));


      const HUELLAS = 0.33, CSI = 1.93, PUERTA = 2.63, CERRADA = 3.23, LLAVE = 4.13, DUENO = 5.23;
      tl.fromTo(q(".esc"), { scale: 1.06 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);
      qa(".mini").forEach((m, i) => tl.fromTo(m, { opacity: 0.3, y: -30, rotation: (i % 2 ? 6 : -6) }, { opacity: 1, y: 0, rotation: (i % 2 ? 2 : -2), duration: 0.3, ease: "back.out(1.6)" }, i * 0.06));
      gsap.set(q(".c-duenio"), { opacity: 0 });
      gsap.set(q(".central"), { opacity: 0 });
      // "huellas": la lupa barre y aparece la huella
      gsap.set(q(".lupa"), { opacity: 0 });
      tl.fromTo(q(".lupa"), { opacity: 1, x: 500, y: 200, rotation: 20 }, { opacity: 1, x: 0, y: 0, rotation: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, HUELLAS - 0.25);
      dibujar(qa(".huella path"), HUELLAS + 0.15, 0.6);
      tl.to(q(".lupa"), { x: -30, y: 15, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, HUELLAS + 0.5);
      entra(q(".csi"), CSI - 0.15);
      tl.to(q(".lupa"), { x: -700, y: 300, rotation: -25, opacity: 0, duration: 0.35, ease: "power3.in" }, PUERTA - 0.4);
      tl.to(q(".csi"), { opacity: 0, duration: 0.2 }, PUERTA - 0.3);
      // "la puerta estaba cerrada"
      pop(q(".central"), PUERTA - 0.1, { rotation: -10 });
      tl.fromTo(q(".candado"), { y: -60 }, { y: 0, duration: 0.2, ease: "bounce.out" }, CERRADA - 0.1);
      // "la llave": aparece la llave y vuela hacia la foto
      pop(q(".llave"), LLAVE - 0.1, { rotation: -30 });
      tl.to(q(".llave"), { x: -240, y: -200, rotation: -20, scale: 0.6, opacity: 0, duration: 0.45, ease: "power2.in" }, LLAVE + 0.45);

      // "el dueño": la foto se da vuelta

      tl.set(q(".c-puerta"), { opacity: 0 }, DUENO - 0.08);
      tl.set(q(".c-duenio"), { opacity: 1 }, DUENO - 0.08);
