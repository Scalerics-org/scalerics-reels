  <script>
    (function () {
      const ID = "s01-escena";
      const DUR = 5.76;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const MARTES = 0.23;
      const MURIO = 2.3;
      const MONTEVIDEO = 3.7;
      const NADIE = 4.2;
      const MORIR = 5.2;

      // dibuja trazos; "desde" = cuánto ya está dibujado en el cuadro 0
      const dibujar = (els, t, dur, desde = 0) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - desde), opacity: desde > 0 ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.03 }, t + i * 0.04);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // máquina de escribir: arma spans por letra y los prende uno por uno
      const tipear = (el, texto, t, paso) => {
        el.innerHTML = [...texto].map((c) => `<span class="letra">${c === " " ? "&nbsp;" : c}</span>`).join("");
        qa("." + el.className.split(" ")[0] + " .letra").forEach((s, i) => tl.set(s, { opacity: 1 }, t + i * paso));
      };

      // cuadro 0: la fachada ya está a medio dibujar y la cámara se acerca
      dibujar(qa(".s01-t"), 0, 0.7, 0.45);
      tl.fromTo(q(".s01-escenario"), { scale: 1.0 }, { scale: 1.06, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);
      tl.fromTo(q(".s01-luz"), { opacity: 0 }, { opacity: 0.28, duration: 0.4 }, 0.1);
      tl.fromTo(q(".s01-cerrado"), { opacity: 0 }, { opacity: 0.9, duration: 0.2 }, 0.7);

      // "martes, 23:40": se tipea
      tipear(q(".s01-tipeo1"), "MARTES · 23:40", MARTES, 0.07);
      tl.to(q(".s01-cursor"), { opacity: 0, duration: 0.2, yoyo: true, repeat: 12, ease: "steps(1)" }, 0);

      // "murió": cinta policial cruzando, silueta de tiza (el flash lo pone ambiente)
      gsap.set([q(".s01-cinta1"), q(".s01-cinta2")], { opacity: 0 });
      tl.fromTo(q(".s01-cinta1"), { opacity: 1, x: -1700 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out", immediateRender: false }, MURIO - 0.12);
      tl.fromTo(q(".s01-cinta2"), { opacity: 1, x: 1700 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out", immediateRender: false }, MURIO + 0.12);
      [[-14, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, MURIO + 0.1 + i * 0.045));
      dibujar(qa(".s01-tz"), MURIO + 0.25, 0.6);
      gsap.set([q(".s01-victima"), q(".s01-flecha")], { opacity: 0 });
      tl.to(q(".s01-victima"), { opacity: 1, duration: 0.2 }, MURIO + 0.8);
      dibujar([q(".s01-flecha")], MURIO + 0.8, 0.3);
      // las cintas se mecen apenas
      tl.to(q(".s01-cinta1 span"), { x: -120, duration: 3, ease: "none" }, MURIO);
      tl.to(q(".s01-cinta2 span"), { x: 120, duration: 3, ease: "none" }, MURIO);

      // "Montevideo": se tipea abajo
      tipear(q(".s01-tipeo2"), "MONTEVIDEO", MONTEVIDEO - 0.15, 0.045);

      // "nadie la vio morir": la luz se apaga y cae el sello
      tl.to(q(".s01-luz"), { opacity: 0, duration: 0.05, ease: "steps(1)" }, NADIE);
      tl.to(q(".s01-luz"), { opacity: 0.2, duration: 0.05, ease: "steps(1)" }, NADIE + 0.12);
      tl.to(q(".s01-luz"), { opacity: 0, duration: 0.05, ease: "steps(1)" }, NADIE + 0.22);
      tl.to([q(".s01-fachada"), q(".s01-cinta1"), q(".s01-cinta2")], { opacity: 0.35, duration: 0.3 }, NADIE + 0.2);
      gsap.set(q(".s01-sello"), { opacity: 0 });
      tl.fromTo(q(".s01-sello"), { opacity: 0, scale: 2.3, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.16, ease: "power4.in", immediateRender: false }, MORIR - 0.35);
      [[-12, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, MORIR - 0.17 + i * 0.045));

      // salida: corte con zoom y blur
