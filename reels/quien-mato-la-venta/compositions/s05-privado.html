  <script>
    (function () {
      const ID = "s05-privado";
      const DUR = 5.9;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde = 0) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - desde), opacity: desde > 0 ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.03 }, t + i * 0.04);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const tipear = (el, texto, t, paso) => {
        el.innerHTML = [...texto].map((c) => '<span class="letra">' + (c === " " ? "&nbsp;" : c) + "</span>").join("");
        [...el.querySelectorAll(".letra")].forEach((s, i) => tl.set(s, { opacity: 1 }, t + i * paso));
      };
      const golpe = (t, k = 1) => [[-14, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".esc"), { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const sello = (el, t, rot = -6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.3, rotation: rot - 10 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.12);
        golpe(t + 0.05);
      };
      const pop = (el, t, extra = {}) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.8, ...extra }, { opacity: 1, scale: 1, x: 0, y: 0, rotation: 0, duration: 0.35, ease: "back.out(1.7)", immediateRender: false }, t);
      };
      const entra = (el, t, desde = { y: 24 }) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
      };
      const parpadeo = (el, ts) => ts.forEach((t) => tl.to(el, { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t));


      const DOS = 0.4, CONSULTA = 1.85, PRIVADO = 2.8, ELLA = 3.72, NUNCA = 5.1, RESPONDIO = 5.4;

      dibujar(qa(".sosp .linea"), 0, 0.5, 0.5);
      tl.fromTo(q(".cartel"), { y: 140 }, { y: 0, duration: 0.3, ease: "back.out(1.6)" }, DOS - 0.2);
      parpadeo(q(".sosp .ojos"), [1.0, 2.5]);
      // la frase del sospechoso se tipea adentro del globo
      tipear(q(".l1"), "CONSULTÁ", CONSULTA - 0.2, 0.04);
      tipear(q(".l2"), "PRECIO POR", CONSULTA + 0.3, 0.04);
      tipear(q(".l3"), "PRIVADO", PRIVADO - 0.1, 0.05);
      tl.to(qa(".sosp .pupila"), { x: 10, y: -4, duration: 0.15 }, PRIVADO);
      // "ella consultó": la foto se corre y aparece el celular
      tl.to(q(".foto"), { scale: 0.6, x: -190, y: -150, rotation: -3, duration: 0.4, ease: "power3.inOut", transformOrigin: "50% 50%" }, ELLA - 0.45);
      tl.to(q(".frase"), { scale: 0.6, x: -190, y: -150, rotation: -3, duration: 0.4, ease: "power3.inOut", transformOrigin: "210px 100px" }, ELLA - 0.45);
      pop(q(".cel"), ELLA - 0.25, { y: 100 });
      pop(q(".burbuja"), ELLA + 0.15, { x: 40 });
      gsap.set([q(".h2"), q(".h3"), q(".puntos")], { opacity: 0 });
      // "el privado nunca respondió": los puntitos aparecen y se apagan, el reloj corre
      tl.to(q(".puntos"), { opacity: 1, duration: 0.1 }, 4.4);
      qa(".puntos i").forEach((p, i) => tl.to(p, { y: -8, duration: 0.15, yoyo: true, repeat: 1 }, 4.5 + i * 0.1));
      tl.to(q(".puntos"), { opacity: 0, duration: 0.15 }, NUNCA);
      tl.set(q(".h1"), { opacity: 0 }, NUNCA);
      tl.set(q(".h2"), { opacity: 1 }, NUNCA);
      tl.set(q(".h2"), { opacity: 0 }, NUNCA + 0.25);
      tl.set(q(".h3"), { opacity: 1, color: "#e0313b" }, NUNCA + 0.25);
      entra(q(".cero"), RESPONDIO - 0.1);
      golpe(RESPONDIO, 0.7);
      tl.to(q(".esc"), { scale: 1.04, duration: DUR - ELLA, ease: "none", transformOrigin: "60% 60%" }, ELLA);

      tl.to(q(".capa"), { scale: 1.1, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
