<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s08-alto"] .s08-capa { position: absolute; inset: 0; }
    [data-composition-id="s08-alto"] .s08-pagina { position: absolute; inset: 0; }
    [data-composition-id="s08-alto"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="s08-alto" data-width="1080" data-height="1920" data-duration="4.17">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="4.17" data-track-index="0">
      <div class="s08-pagina">
        <svg class="s08-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      </div>
    </div>
  </div>
  <script src="assets/comic.js"></script>
  <script>
    (function () {
      const ID = "s08-alto";
      const DUR = 4.17;
      const P = "s08";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const C = window.COMIC;
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q("." + P + "-pagina"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // aparece de golpe (pop) un grupo SVG
      const pop = (sel, t, org, extra = {}) => { const el = typeof sel === "string" ? q(sel) : sel; gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 1, scale: extra.desde ?? 0.2, rotation: extra.rot ?? -12, svgOrigin: org }, { opacity: 1, scale: 1, rotation: 0, svgOrigin: org, duration: extra.dur ?? 0.3, ease: extra.ease ?? "back.out(2.4)", immediateRender: false }, t); };
      // se va
      const fuera = (sel, t, org) => tl.to(typeof sel === "string" ? q(sel) : sel, { opacity: 0, scale: 0.5, svgOrigin: org, duration: 0.18, ease: "power2.in" }, t);
      // late (para que nada quede quieto)
      const late = (sel, t, org, n = 6, s = 1.05) => tl.to(typeof sel === "string" ? q(sel) : sel, { scale: s, svgOrigin: org, duration: 0.12, yoyo: true, repeat: n, ease: "sine.inOut" }, t);
      const svg = q("." + P + "-svg");

      const BUENO2 = 0.38, BURLEN = 1.04, NO = 1.51, VAGO = 2.17, CHE = 2.45, MIL = 3.12;
      svg.innerHTML = C.defs(P) +
        `<g class="s08-main">` + C.vineta({ p: P, x: 70, y: 560, w: 940, h: 1080, fill: C.CIAN, trama: 0.16 }) +
        `<clipPath id="s08-clip"><rect x="75" y="565" width="930" height="1070"/></clipPath><g clip-path="url(#s08-clip)"><g class="s08-rayos">${C.rayos({ x: 300, y: 1150, r0: 330, r1: 1100, n: 48, sw: 9, color: C.BLANCO, op: 0.7 })}</g></g>` +
        `<g class="s08-rob">${C.robot({ p: P, x: 300, y: 1500, s: 1.45, kind: "pizza", cara: "serio", cls: "s08-r", tag: "El de la pizzería", tagSize: 28 })}</g>` +
        `<g class="s08-vago"><rect x="560" y="1040" width="400" height="150" rx="10" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="8"/><text x="760" y="1150" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="104" fill="${C.TINTA}" letter-spacing="2">VAGO</text></g>` +
        `<path class="s08-tacha" d="M560 1170 L960 1060" stroke="${C.MAGENTA}" stroke-width="26" stroke-linecap="round"/>` +
        `<g class="s08-mil"><g transform="rotate(-6 760 1340)"><rect x="560" y="1270" width="420" height="150" rx="10" fill="${C.AMARILLO}" stroke="${C.TINTA}" stroke-width="8"/><text x="770" y="1370" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="74" fill="${C.MAGENTA}" stroke="${C.TINTA}" stroke-width="8" paint-order="stroke fill">MIL COSAS</text></g></g>` +
        `</g>` +
        `<g class="s08-alto">${C.onomato({ x: 740, y: 790, r1: 210, r2: 150, n: 14, ax: 1.2, txt: "¡ALTO!", size: 120, fondo: C.AMARILLO, color: C.MAGENTA, rot: -6 })}</g>`;

      tl.fromTo(q(".s08-main"), { opacity: 1, scale: 1.1, svgOrigin: "540 1100" }, { scale: 1, svgOrigin: "540 1100", duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(q(".s08-rayos"), { rotation: 0, svgOrigin: "300 1150" }, { rotation: -8, svgOrigin: "300 1150", duration: DUR, ease: "none" }, 0);
      pop(".s08-alto", 0, "740 790", { rot: -25, desde: 0.3, dur: 0.22 });
      sacudon(0.12, 1.5);
      // la mano levantada: "pará"
      tl.fromTo(q(".s08-r .brazo-d"), { rotation: 0, svgOrigin: "66 -78" }, { rotation: -150, svgOrigin: "66 -78", duration: 0.2, ease: "back.out(2)" }, 0.02);
      tl.to(q(".s08-r .brazo-d"), { rotation: -135, svgOrigin: "66 -78", duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" }, BUENO2);
      tl.to(q(".s08-alto"), { scale: 0.55, x: 120, y: -90, svgOrigin: "740 790", duration: 0.3, ease: "power2.inOut" }, BURLEN);
      // la cabeza dice que no
      tl.to(q(".s08-r .cabeza"), { rotation: 8, svgOrigin: "0 -100", duration: 0.1, yoyo: true, repeat: 5, ease: "sine.inOut" }, NO);
      // "vago": aparece y se tacha
      pop(".s08-vago", VAGO - 0.25, "760 1115", { rot: 4, desde: 0.5 });
      gsap.set(q(".s08-tacha"), { opacity: 0, strokeDasharray: 440, strokeDashoffset: 440 });
      tl.to(q(".s08-tacha"), { opacity: 1, strokeDashoffset: 0, duration: 0.22, ease: "power2.inOut" }, CHE - 0.1);
      tl.to(q(".s08-vago"), { opacity: 0.55, duration: 0.2 }, CHE + 0.1);
      // "mil cosas": sello
      pop(".s08-mil", MIL - 0.08, "770 1345", { rot: -20, desde: 2.2, dur: 0.16, ease: "power4.in" });
      sacudon(MIL + 0.1, 1);
      late(".s08-mil", MIL + 0.35, "770 1345", 3, 1.04);


      // salida
      tl.to(q("#" + P + "-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
