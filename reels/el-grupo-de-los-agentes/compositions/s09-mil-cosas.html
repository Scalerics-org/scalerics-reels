<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s09-mil-cosas"] .s09-capa { position: absolute; inset: 0; }
    [data-composition-id="s09-mil-cosas"] .s09-pagina { position: absolute; inset: 0; }
    [data-composition-id="s09-mil-cosas"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="s09-mil-cosas" data-width="1080" data-height="1920" data-duration="5.66">
    <div id="s09-escena" class="s09-capa clip" data-start="0" data-duration="5.66" data-track-index="0">
      <div class="s09-pagina">
        <svg class="s09-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      </div>
    </div>
  </div>
  <script src="assets/comic.js"></script>
  <script>
    (function () {
      const ID = "s09-mil-cosas";
      const DUR = 5.66;
      const P = "s09";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const C = window.COMIC;
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q("." + P + "-pagina"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // aparece de golpe (pop) un grupo SVG
      const pop = (sel, t, org, extra = {}) => { const el = typeof sel === "string" ? q(sel) : sel; gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 1, scale: extra.desde ?? 0.2, rotation: extra.rot ?? -12, svgOrigin: org }, { opacity: 1, scale: 1, rotation: 0, svgOrigin: org, duration: extra.dur ?? 0.3, ease: extra.ease ?? "back.out(2.4)", immediateRender: false }, t); };
      // se va
      const fuera = (sel, t, org) => tl.to(typeof sel === "string" ? q(sel) : sel, { opacity: 0, scale: 0.5, svgOrigin: org, duration: 0.18, ease: "power2.in" }, t);
      // late (para que nada quede quieto)
      const late = (sel, t, org, n = 6, s = 1.05) => tl.to(typeof sel === "string" ? q(sel) : sel, { scale: s, svgOrigin: org, duration: 0.12, yoyo: true, repeat: n, ease: "sine.inOut" }, t);
      const svg = q("." + P + "-svg");

      const MOSTRADOR = 0.36, REPONE = 0.93, COBRA = 1.59, ENCIMA = 2.34, CONTESTAR = 3.1, PARA = 3.97, NOSOTROS = 4.42;
      const item = (cls, x, y, inner, txt) => `<g class="${cls}"><circle cx="${x}" cy="${y}" r="92" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="8"/>${inner}<g>${C.etiqueta({ x, y: y + 82, txt, color: C.AMARILLO, size: 28 })}</g></g>`;
      svg.innerHTML = C.defs(P) +
        `<g class="s09-main">` + C.vineta({ p: P, x: 70, y: 560, w: 940, h: 1080, fill: C.BLANCO, trama: 0.1 }) +
        `<clipPath id="s09-clip"><rect x="75" y="565" width="930" height="1070"/></clipPath><g clip-path="url(#s09-clip)"><g class="s09-rayos">${C.rayos({ x: 540, y: 1150, r0: 260, r1: 1000, n: 40, sw: 6, op: 0.25 })}</g>` +
        `<g class="s09-dueno-g">${C.dueno({ p: P, x: 540, y: 1560, s: 1.25, cara: "cansado", cls: "s09-d" })}</g></g>` +
        item("s09-i1", 230, 720, `<rect x="170" y="700" width="120" height="50" fill="${C.CIAN}" stroke="${C.TINTA}" stroke-width="6"/><path d="M180 700 L200 670 H260 L280 700" fill="${C.MAGENTA}" stroke="${C.TINTA}" stroke-width="6" stroke-linejoin="round"/>`, "Mostrador") +
        item("s09-i2", 850, 720, `<rect x="800" y="690" width="60" height="60" fill="${C.AMARILLO}" stroke="${C.TINTA}" stroke-width="6"/><rect x="840" y="660" width="60" height="60" fill="${C.AMARILLO}" stroke="${C.TINTA}" stroke-width="6"/><path d="M812 720 H848 M852 690 H888" stroke="${C.TINTA}" stroke-width="5"/>`, "Repone") +
        item("s09-i3", 210, 1120, `<rect x="160" y="1090" width="100" height="60" rx="6" fill="${C.MAGENTA}" stroke="${C.TINTA}" stroke-width="6"/><rect x="176" y="1064" width="68" height="30" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="5"/><text x="210" y="1132" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="30" fill="${C.BLANCO}">$</text>`, "Cobra") +
        item("s09-i4", 870, 1120, `<g class="s09-celu"><rect x="840" y="1060" width="60" height="104" rx="10" fill="${C.TINTA}"/><rect x="847" y="1070" width="46" height="80" rx="4" fill="${C.CIAN}"/><circle cx="896" cy="1066" r="14" fill="${C.MAGENTA}" stroke="${C.TINTA}" stroke-width="4"/></g><path class="s09-vib" d="M818 1080 L808 1100 L818 1120 M922 1080 L932 1100 L922 1120" fill="none" stroke="${C.TINTA}" stroke-width="5" stroke-linecap="round"/>`, "Contestar") +
        `</g>` +
        `<rect class="s09-velo" x="0" y="540" width="1080" height="1160" fill="${C.AMARILLO}" opacity="0"/>` +
        `<g class="s09-equipo"><clipPath id="s09-clip2"><rect x="75" y="565" width="930" height="1070"/></clipPath><g clip-path="url(#s09-clip2)"><g class="s09-rayos2">${C.rayos({ x: 540, y: 1200, r0: 200, r1: 1100, n: 48, sw: 12, color: C.MAGENTA, op: 0.6 })}</g></g>` +
        `<g class="s09-e1">${C.robot({ p: P, x: 260, y: 1480, s: 1.05, kind: "pelu", cara: "feliz" })}</g>` +
        `<g class="s09-e3">${C.robot({ p: P, x: 820, y: 1480, s: 1.05, kind: "ferre", cara: "feliz" })}</g>` +
        `<g class="s09-e2">${C.robot({ p: P, x: 540, y: 1440, s: 1.25, kind: "pizza", cara: "feliz" })}</g>` +
        `<g class="s09-lema">${C.cartucho({ x: 230, y: 1540, txt: "Para eso estamos", size: 44, fill: C.BLANCO })}</g></g>`;

      tl.fromTo(q(".s09-main"), { opacity: 1, y: 80, rotation: -2, svgOrigin: "540 1100" }, { y: 0, rotation: 0, svgOrigin: "540 1100", duration: 0.3, ease: "back.out(1.8)" }, 0);
      tl.fromTo(q(".s09-rayos"), { rotation: 0, svgOrigin: "540 1150" }, { rotation: 6, svgOrigin: "540 1150", duration: PARA, ease: "none" }, 0);
      // cada tarea aparece en su palabra y el dueño gira hacia ella
      [["s09-i1", MOSTRADOR, "230 720", -8], ["s09-i2", REPONE, "850 720", 8], ["s09-i3", COBRA, "210 1120", -10], ["s09-i4", CONTESTAR, "870 1120", 10]].forEach(([c, t, o, r]) => {
        pop("." + c, t - 0.1, o, { rot: r * 2 });
        tl.to(q(".s09-d .cabeza"), { rotation: r, svgOrigin: "0 -200", duration: 0.12, ease: "power2.out" }, t);
        tl.to(q(".s09-d"), { x: r * 1.5, duration: 0.12, ease: "power2.out" }, t);
      });
      // "encima": todo tiembla
      tl.to(qa(".s09-i1, .s09-i2, .s09-i3"), { y: 6, duration: 0.05, yoyo: true, repeat: 13, ease: "none" }, ENCIMA);
      tl.to(q(".s09-celu"), { x: 6, duration: 0.04, yoyo: true, repeat: 17, ease: "none" }, CONTESTAR);
      tl.fromTo(q(".s09-vib"), { opacity: 0 }, { opacity: 1, duration: 0.06, yoyo: true, repeat: 9 }, CONTESTAR);
      tl.to(q(".s09-d"), { y: 14, duration: 0.25, ease: "power2.out" }, ENCIMA);
      // "para eso estamos nosotros": pose de equipo
      tl.to(q(".s09-velo"), { opacity: 1, duration: 0.2 }, PARA - 0.2);
      gsap.set(q(".s09-equipo"), { opacity: 0 });
      tl.set(q(".s09-equipo"), { opacity: 1 }, PARA - 0.05);
      tl.to(q(".s09-main"), { opacity: 0, duration: 0.15 }, PARA);
      tl.fromTo(q(".s09-rayos2"), { rotation: 0, scale: 0.6, svgOrigin: "540 1200" }, { rotation: 12, scale: 1, svgOrigin: "540 1200", duration: DUR - PARA, ease: "power2.out" }, PARA);
      [["s09-e1", -400, 0.05], ["s09-e3", 400, 0.1], ["s09-e2", 0, 0]].forEach(([c, dx, d]) => tl.fromTo(q("." + c), { x: dx, y: dx ? 0 : 500 }, { x: 0, y: 0, duration: 0.3, ease: "back.out(1.8)" }, PARA - 0.05 + d));
      [...qa(".s09-equipo .brazo-d")].forEach((b) => tl.to(b, { rotation: -140, svgOrigin: "66 -78", duration: 0.2, ease: "back.out(2)" }, NOSOTROS));
      pop(".s09-lema", NOSOTROS - 0.1, "540 1580", { rot: -8, desde: 0.4 });
      sacudon(NOSOTROS + 0.05, 1.2);


      // salida
      tl.to(q("#" + P + "-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
