<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-ferre"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-ferre"] .s03-pagina { position: absolute; inset: 0; }
    [data-composition-id="s03-ferre"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="s03-ferre" data-width="1080" data-height="1920" data-duration="4.23">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="4.23" data-track-index="0">
      <div class="s03-pagina">
        <svg class="s03-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      </div>
    </div>
  </div>
  <script src="assets/comic.js"></script>
  <script>
    (function () {
      const ID = "s03-ferre";
      const DUR = 4.23;
      const P = "s03";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const C = window.COMIC;
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q("." + P + "-pagina"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // aparece de golpe (pop) un grupo SVG
      const pop = (sel, t, org, extra = {}) => { const el = typeof sel === "string" ? q(sel) : sel; gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 1, scale: extra.desde ?? 0.2, rotation: extra.rot ?? -12, svgOrigin: org }, { opacity: 1, scale: 1, rotation: 0, svgOrigin: org, duration: extra.dur ?? 0.3, ease: extra.ease ?? "back.out(2.4)", immediateRender: false }, t); };
      // se va
      const fuera = (sel, t, org) => tl.to(typeof sel === "string" ? q(sel) : sel, { opacity: 0, scale: 0.5, svgOrigin: org, duration: 0.18, ease: "power2.in" }, t);
      // late (para que nada quede quieto)
      const late = (sel, t, org, n = 6, s = 1.05) => tl.to(typeof sel === "string" ? q(sel) : sel, { scale: s, svgOrigin: org, duration: 0.12, yoyo: true, repeat: n, ease: "sine.inOut" }, t);
      const svg = q("." + P + "-svg");

      const VENDI = 0.19, CANILLA = 0.57, SENOR = 1.05, TRES = 1.54, MANANA = 1.92, DUENO = 2.69, RONCA = 2.98;
      const canilla = `<g class="s03-canilla"><path d="M-60 -20 H20 Q50 -20 50 10 V40 H22 V14 Q22 8 16 8 H-60 Z" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="7" stroke-linejoin="round"/><rect x="-74" y="-32" width="22" height="52" rx="5" fill="${C.CIAN}" stroke="${C.TINTA}" stroke-width="6"/><path d="M-20 -20 V-44 M-40 -48 H0" stroke="${C.TINTA}" stroke-width="8" stroke-linecap="round"/><circle class="s03-gotita" cx="36" cy="58" r="8" fill="${C.CIAN}" stroke="${C.TINTA}" stroke-width="4"/></g>`;
      const senor = `<g class="s03-senor">
        <path d="M720 1200 V1150 M800 1200 V1150" stroke="${C.TINTA}" stroke-width="18" stroke-linecap="round"/>
        <path d="M684 1160 L694 1010 Q700 970 760 966 Q820 970 826 1010 L836 1160 Z" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="8" stroke-linejoin="round"/>
        <path d="M700 1040 H820 M702 1080 H822 M704 1120 H826" stroke="${C.CIAN}" stroke-width="10"/>
        <g class="s03-brazo"><path d="M700 1010 Q650 1040 640 1080" fill="none" stroke="${C.TINTA}" stroke-width="18" stroke-linecap="round"/></g>
        <circle cx="760" cy="900" r="62" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="8"/>
        <path d="M704 880 Q706 830 760 832 Q812 830 816 880" fill="none" stroke="${C.TINTA}" stroke-width="7"/>
        <circle cx="738" cy="900" r="16" fill="none" stroke="${C.TINTA}" stroke-width="6"/><circle cx="784" cy="900" r="16" fill="none" stroke="${C.TINTA}" stroke-width="6"/><path d="M754 900 H768" stroke="${C.TINTA}" stroke-width="5"/>
        <path class="s03-boca" d="M744 934 Q760 948 776 934" fill="none" stroke="${C.TINTA}" stroke-width="6" stroke-linecap="round"/>
      </g>`;
      let estrellas = "";
      [[150, 640], [420, 610], [560, 700], [980, 800], [130, 880], [620, 620]].forEach(([x, y], i) => (estrellas += `<path class="s03-est" d="M${x} ${y - 14} L${x + 4} ${y - 4} L${x + 14} ${y} L${x + 4} ${y + 4} L${x} ${y + 14} L${x - 4} ${y + 4} L${x - 14} ${y} L${x - 4} ${y - 4} Z" fill="${i % 2 ? C.AMARILLO : C.BLANCO}"/>`));
      svg.innerHTML = C.defs(P) +
        `<g class="s03-main">` + C.vineta({ p: P, x: 70, y: 560, w: 940, h: 760, fill: C.TINTA }) +
        `<rect x="80" y="570" width="920" height="740" fill="url(#${P}-trama-f)" opacity="0"/>` +
        `<g class="s03-cielo">${estrellas}<circle cx="880" cy="680" r="62" fill="${C.AMARILLO}" stroke="${C.BLANCO}" stroke-width="5"/><circle cx="908" cy="664" r="56" fill="${C.TINTA}"/></g>` +
        `<path d="M80 1200 H1000" stroke="${C.BLANCO}" stroke-width="6" opacity="0.5"/>` +
        `<g class="s03-rob">${C.robot({ p: P, x: 330, y: 1200, s: 1.05, kind: "ferre", cara: "feliz", cls: "s03-r" })}</g>` +
        senor +
        `<g class="s03-can-pos" transform="translate(560 1120) scale(1.7)">${canilla}</g>` +
        `<g class="s03-tag">${C.etiqueta({ x: 330, y: 1236, txt: "El de la ferretería", color: C.BLANCO, size: 28 })}</g>` +
        `<g class="s03-reloj"><rect x="300" y="610" width="270" height="120" rx="16" fill="${C.TINTA}" stroke="${C.CIAN}" stroke-width="7"/><text x="435" y="702" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="84" fill="${C.CIAN}">3:00</text><text x="586" y="640" font-family="IBM Plex Mono" font-weight="500" font-size="28" fill="${C.BLANCO}">AM</text></g>` +
        `<g class="s03-globo">${C.globo({ x: 560, y: 600, w: 300, h: 110, cola: [700, 790], lines: ["¡VENDIDA!"], size: 46 })}</g>` +
        `</g>` +
        `<g class="s03-inset">` + C.vineta({ p: P, x: 470, y: 1300, w: 520, h: 330, fill: C.CIAN, trama: 0.15 }) +
        `<rect x="520" y="1500" width="420" height="70" rx="12" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="7"/>` +
        `<path d="M600 1500 Q700 1440 920 1470 L930 1500 Z" fill="${C.MAGENTA}" stroke="${C.TINTA}" stroke-width="7" stroke-linejoin="round"/>` +
        `<rect x="520" y="1456" width="110" height="56" rx="24" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="6"/>` +
        `<g class="s03-cab"><circle cx="590" cy="1450" r="50" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="7"/><path d="M546 1430 Q560 1396 600 1400 Q634 1404 640 1436" fill="none" stroke="${C.TINTA}" stroke-width="12"/><path d="M566 1450 Q574 1458 582 1450 M598 1450 Q606 1458 614 1450" fill="none" stroke="${C.TINTA}" stroke-width="5" stroke-linecap="round"/><ellipse class="s03-bocaz" cx="592" cy="1476" rx="10" ry="7" fill="${C.TINTA}"/></g>` +
        `<text x="600" y="1362" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="32" fill="${C.TINTA}">MI DUEÑO</text>` +
        `<g class="s03-z"><text class="s03-zz" x="770" y="1446" font-family="Lexend" font-weight="900" font-size="54" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="6" paint-order="stroke fill">Z</text><text class="s03-zz" x="830" y="1420" font-family="Lexend" font-weight="900" font-size="66" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="6" paint-order="stroke fill">Z</text><text class="s03-zz" x="900" y="1440" font-family="Lexend" font-weight="900" font-size="80" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="7" paint-order="stroke fill">Z</text></g>` +
        `</g>`;

      tl.fromTo(q(".s03-main"), { opacity: 1, x: 80, rotation: 2, svgOrigin: "540 940" }, { x: 0, rotation: 0, svgOrigin: "540 940", duration: 0.35, ease: "back.out(1.8)" }, 0);
      tl.fromTo(qa(".s03-est"), { opacity: 0.3 }, { opacity: 1, duration: 0.2, stagger: { each: 0.08, yoyo: true, repeat: 7 } }, 0);
      // la canilla pasa de la mano del robot a la del señor
      gsap.set(q(".s03-canilla"), { opacity: 0 });
      tl.fromTo(q(".s03-canilla"), { opacity: 1, x: -20, scale: 0.3, svgOrigin: "0 0" }, { opacity: 1, x: 0, scale: 1, svgOrigin: "0 0", duration: 0.25, ease: "back.out(2.5)", immediateRender: false }, CANILLA - 0.1);
      tl.to(q(".s03-r .brazo-d"), { rotation: -60, svgOrigin: "66 -78", duration: 0.2, ease: "power2.out" }, VENDI);
      tl.to(q(".s03-canilla"), { x: 45, y: -20, rotation: 10, svgOrigin: "0 0", duration: 0.35, ease: "power2.inOut" }, SENOR - 0.1);
      tl.to(q(".s03-brazo"), { rotation: -30, svgOrigin: "700 1010", duration: 0.2 }, SENOR + 0.1);
      tl.to(q(".s03-boca"), { attr: { d: "M740 930 Q760 956 780 930" }, duration: 0.15 }, SENOR + 0.2);
      tl.fromTo(q(".s03-gotita"), { y: 0, opacity: 1 }, { y: 40, opacity: 0, duration: 0.4, repeat: 3, ease: "power1.in" }, SENOR + 0.3);
      // "tres": el reloj
      pop(".s03-reloj", TRES - 0.12, "435 670");
      tl.to(q(".s03-reloj"), { opacity: 0.4, duration: 0.06, yoyo: true, repeat: 5 }, TRES + 0.3);
      // "mañana": ¡VENDIDA!
      pop(".s03-globo", MANANA - 0.05, "700 700");
      sacudon(MANANA, 0.7);
      // "dueño": la viñeta del que duerme
      pop(".s03-inset", DUENO - 0.12, "730 1465", { rot: -10, desde: 0.3 });
      tl.to(q(".s03-inset"), { rotation: -2, svgOrigin: "730 1465", duration: 0.2 }, DUENO + 0.2);
      tl.to(q(".s03-main"), { opacity: 0.6, duration: 0.25 }, DUENO);
      // "roncando": las Z suben, la cabeza respira
      const zs = [...qa(".s03-zz")];
      gsap.set(zs, { opacity: 0 });
      zs.forEach((z, i) => {
        tl.fromTo(z, { opacity: 0, y: 30, scale: 0.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false, transformOrigin: "50% 50%" }, RONCA - 0.1 + i * 0.18);
        tl.to(z, { y: -14, duration: 0.25, yoyo: true, repeat: 2, ease: "sine.inOut" }, RONCA + 0.2 + i * 0.18);
      });
      tl.to(q(".s03-cab"), { y: -6, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, DUENO + 0.3);
      tl.to(q(".s03-bocaz"), { scaleY: 1.8, transformOrigin: "50% 50%", duration: 0.3, yoyo: true, repeat: 3 }, DUENO + 0.3);


      // salida
      tl.to(q("#" + P + "-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
