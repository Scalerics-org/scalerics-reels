<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s10-conseguirle"] .s10-capa { position: absolute; inset: 0; }
    [data-composition-id="s10-conseguirle"] .s10-pagina { position: absolute; inset: 0; }
    [data-composition-id="s10-conseguirle"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="s10-conseguirle" data-width="1080" data-height="1920" data-duration="3.30">
    <div id="s10-escena" class="s10-capa clip" data-start="0" data-duration="3.30" data-track-index="0">
      <div class="s10-pagina">
        <svg class="s10-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      </div>
    </div>
  </div>
  <script src="assets/comic.js"></script>
  <script>
    (function () {
      const ID = "s10-conseguirle";
      const DUR = 3.30;
      const P = "s10";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const C = window.COMIC;
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q("." + P + "-pagina"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // aparece de golpe (pop) un grupo SVG
      const pop = (sel, t, org, extra = {}) => { const el = typeof sel === "string" ? q(sel) : sel; gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 1, scale: extra.desde ?? 0.2, rotation: extra.rot ?? -12, svgOrigin: org }, { opacity: 1, scale: 1, rotation: 0, svgOrigin: org, duration: extra.dur ?? 0.3, ease: extra.ease ?? "back.out(2.4)", immediateRender: false }, t); };
      // se va
      const fuera = (sel, t, org) => tl.to(typeof sel === "string" ? q(sel) : sel, { opacity: 0, scale: 0.5, svgOrigin: org, duration: 0.18, ease: "power2.in" }, t);
      // late (para que nada quede quieto)
      const late = (sel, t, org, n = 6, s = 1.05) => tl.to(typeof sel === "string" ? q(sel) : sel, { scale: s, svgOrigin: org, duration: 0.12, yoyo: true, repeat: n, ease: "sine.inOut" }, t);
      const svg = q("." + P + "-svg");

      const RAZON = 0.2, HAY = 0.98, CONSEGUIRLE = 1.06, UNO = 1.64, NOSOTROS = 1.93;
      const corazon = (x, y, s, cls) => `<g transform="translate(${x} ${y}) scale(${s})"><g class="${cls}"><path d="M0 30 C-60 -10 -40 -60 0 -30 C40 -60 60 -10 0 30 Z" fill="${C.MAGENTA}" stroke="${C.TINTA}" stroke-width="6" stroke-linejoin="round"/></g></g>`;
      svg.innerHTML = C.defs(P) +
        `<g class="s10-main">` + C.vineta({ p: P, x: 70, y: 560, w: 940, h: 1080, fill: C.BLANCO, trama: 0.14 }) +
        `<g class="s10-rob">${C.robot({ p: P, x: 330, y: 1460, s: 1.4, kind: "pelu", cara: "feliz", cls: "s10-r", tag: "La de la peluquería", tagSize: 28 })}</g>` +
        `<g class="s10-regalo">
          <g class="s10-cabecita"><rect x="700" y="1050" width="120" height="90" rx="26" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="7"/><rect x="718" y="1066" width="84" height="54" rx="14" fill="${C.TINTA}"/><circle cx="742" cy="1092" r="8" fill="${C.BLANCO}"/><circle cx="778" cy="1092" r="8" fill="${C.BLANCO}"/><path d="M760 1050 V1026" stroke="${C.TINTA}" stroke-width="6"/><circle cx="760" cy="1020" r="10" fill="${C.AMARILLO}" stroke="${C.TINTA}" stroke-width="5"/></g>
          <rect x="620" y="1170" width="280" height="250" fill="${C.CIAN}" stroke="${C.TINTA}" stroke-width="8"/>
          <rect x="740" y="1170" width="40" height="250" fill="${C.AMARILLO}" stroke="${C.TINTA}" stroke-width="6"/>
          <g class="s10-tapa"><rect x="600" y="1120" width="320" height="64" fill="${C.CIAN}" stroke="${C.TINTA}" stroke-width="8"/><rect x="740" y="1120" width="40" height="64" fill="${C.AMARILLO}" stroke="${C.TINTA}" stroke-width="6"/>
            <path d="M760 1120 Q700 1060 690 1100 Q690 1130 760 1120 Q820 1060 830 1100 Q830 1130 760 1120 Z" fill="${C.AMARILLO}" stroke="${C.TINTA}" stroke-width="6" stroke-linejoin="round"/></g>
          <g class="s10-tarjeta" data-layout-allow-overlap="true"><g transform="rotate(-6 760 1480)"><rect x="540" y="1430" width="440" height="110" rx="8" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="6"/><text x="760" y="1472" text-anchor="middle" font-family="IBM Plex Mono" font-weight="500" font-size="30" fill="${C.TINTA}">PARA EL DEL</text><text x="760" y="1522" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="38" fill="${C.MAGENTA}">ALMACÉN</text></g></g>
        </g>` +
        corazon(520, 780, 1, "s10-c1") + corazon(880, 900, 0.7, "s10-c2") + corazon(180, 760, 0.6, "s10-c3") +
        `</g>`;

      tl.fromTo(q(".s10-main"), { opacity: 1, x: -100, rotation: -2, svgOrigin: "540 1100" }, { x: 0, rotation: 0, svgOrigin: "540 1100", duration: 0.3, ease: "back.out(1.8)" }, 0);
      // "razón": asiente
      tl.to(q(".s10-r .cabeza"), { y: 12, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" }, RAZON);
      // "conseguirle": el regalo
      pop(".s10-regalo", CONSEGUIRLE - 0.15, "760 1300", { rot: 12, desde: 0.3 });
      tl.to(q(".s10-r .brazo-d"), { rotation: -40, svgOrigin: "66 -78", duration: 0.2 }, CONSEGUIRLE);
      pop(".s10-tarjeta", UNO - 0.2, "760 1480", { rot: -12, desde: 0.5 });
      // "nosotros": la tapa salta y asoma uno nuevo
      gsap.set(q(".s10-cabecita"), { opacity: 0 });
      tl.to(q(".s10-tapa"), { y: -150, rotation: -18, svgOrigin: "760 1150", duration: 0.25, ease: "back.out(2)" }, NOSOTROS - 0.1);
      tl.fromTo(q(".s10-cabecita"), { opacity: 1, y: 120 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, NOSOTROS);
      tl.to(q(".s10-cabecita"), { rotation: 8, svgOrigin: "760 1140", duration: 0.15, yoyo: true, repeat: 5, ease: "sine.inOut" }, NOSOTROS + 0.3);
      // corazones que laten
      ["s10-c1", "s10-c2", "s10-c3"].forEach((c, i) => {
        pop("." + c, 0.25 + i * 0.25, "0 0", { rot: 0, desde: 0.2 });
        tl.to(q("." + c), { scale: 1.2, svgOrigin: "0 0", duration: 0.14, yoyo: true, repeat: 7, ease: "sine.inOut" }, 0.6 + i * 0.25);
      });


      // salida
      tl.to(q("#" + P + "-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
