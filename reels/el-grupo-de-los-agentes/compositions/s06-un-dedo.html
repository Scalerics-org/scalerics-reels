<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-un-dedo"] .s06-capa { position: absolute; inset: 0; }
    [data-composition-id="s06-un-dedo"] .s06-pagina { position: absolute; inset: 0; }
    [data-composition-id="s06-un-dedo"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="s06-un-dedo" data-width="1080" data-height="1920" data-duration="7.45">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="7.45" data-track-index="0">
      <div class="s06-pagina">
        <svg class="s06-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      </div>
    </div>
  </div>
  <script src="assets/comic.js"></script>
  <script>
    (function () {
      const ID = "s06-un-dedo";
      const DUR = 7.45;
      const P = "s06";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const C = window.COMIC;
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q("." + P + "-pagina"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // aparece de golpe (pop) un grupo SVG
      const pop = (sel, t, org, extra = {}) => { const el = typeof sel === "string" ? q(sel) : sel; gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 1, scale: extra.desde ?? 0.2, rotation: extra.rot ?? -12, svgOrigin: org }, { opacity: 1, scale: 1, rotation: 0, svgOrigin: org, duration: extra.dur ?? 0.3, ease: extra.ease ?? "back.out(2.4)", immediateRender: false }, t); };
      // se va
      const fuera = (sel, t, org) => tl.to(typeof sel === "string" ? q(sel) : sel, { opacity: 0, scale: 0.5, svgOrigin: org, duration: 0.18, ease: "power2.in" }, t);
      // late (para que nada quede quieto)
      const late = (sel, t, org, n = 6, s = 1.05) => tl.to(typeof sel === "string" ? q(sel) : sel, { scale: s, svgOrigin: org, duration: 0.12, yoyo: true, repeat: n, ease: "sine.inOut" }, t);
      const svg = q("." + P + "-svg");

      const AGENTE = 0.76, CONTESTA = 1.84, CON = 3.17, DEDO = 3.49, A = 3.87, TRES = 4.72, DIAS = 5.09, POBRE = 6.02;
      const cel = (x, y, s, cls) => `<g transform="translate(${x} ${y}) scale(${s})"><g class="${cls}"><rect x="-50" y="-90" width="100" height="180" rx="16" fill="${C.TINTA}"/><rect x="-40" y="-74" width="80" height="140" rx="6" fill="${C.CIAN}"/><path d="M-26 -50 H20 M-26 -30 H10" stroke="${C.BLANCO}" stroke-width="7" stroke-linecap="round"/></g></g>`;
      let hojas = "";
      ["LUN", "MAR", "MIÉ", "JUE"].forEach((d, i) => {
        hojas =  `<g class="s06-hoja s06-h${i}"><rect x="400" y="1360" width="280" height="250" rx="14" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="8"/><rect x="400" y="1360" width="280" height="64" rx="14" fill="${C.MAGENTA}" stroke="${C.TINTA}" stroke-width="8"/><text x="540" y="1544" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="96" fill="${C.TINTA}">${d}</text></g>` + hojas;
      });
      svg.innerHTML = C.defs(P) +
        `<g class="s06-pa">` + C.vineta({ p: P, x: 70, y: 560, w: 940, h: 300, fill: C.CIAN, trama: 0.14 }) +
        `<g class="s06-rob">${C.robot({ p: P, x: 230, y: 850, s: 0.78, kind: "ferre", cara: "serio", cls: "s06-r" })}</g>` +
        `<g class="s06-globo">${C.globo({ x: 400, y: 600, w: 560, h: 130, cola: [380, 770], lines: ["¡NO TIENE AGENTE!"], size: 50 })}</g></g>` +
        `<g class="s06-pb">` + C.vineta({ p: P, x: 70, y: 890, w: 455, h: 380, fill: C.BLANCO, trama: 0.1 }) +
        C.cartucho({ x: 90, y: 905, txt: "Contesta él", size: 30 }) +
        `<clipPath id="s06-cb"><rect x="75" y="895" width="445" height="370"/></clipPath><g clip-path="url(#s06-cb)">` +
        C.dueno({ p: P, x: 230, y: 1330, s: 0.95, cara: "cansado", cls: "s06-d" }) + cel(400, 1150, 0.9, "s06-cel1") + `</g></g>` +
        `<g class="s06-pc">` + C.vineta({ p: P, x: 555, y: 890, w: 455, h: 380, fill: C.AMARILLO, trama: 0.14 }) +
        C.cartucho({ x: 575, y: 905, txt: "Con un dedo", size: 30 }) +
        cel(700, 1170, 0.95, "s06-cel2") +
        `<g class="s06-dedo"><rect x="800" y="1010" width="54" height="170" rx="27" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="8"/><path d="M812 1160 Q827 1146 842 1160" fill="none" stroke="${C.TINTA}" stroke-width="5"/><rect x="770" y="940" width="200" height="120" rx="44" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="8"/><path d="M860 960 V1040 M900 960 V1040" stroke="${C.TINTA}" stroke-width="5"/></g>` +
        `<g class="s06-tic">${C.onomato({ x: 900, y: 1200, r1: 80, r2: 58, n: 10, txt: "¡TIC!", size: 46, fondo: C.MAGENTA, color: C.AMARILLO, rot: 10 })}</g></g>` +
        `<g class="s06-pd">` + C.vineta({ p: P, x: 70, y: 1300, w: 940, h: 340, fill: C.BLANCO, trama: 0.1 }) +
        C.cartucho({ x: 90, y: 1316, txt: "3 días después...", size: 30 }) + `<g data-layout-allow-overlap="true">${hojas}</g>` +
        `<g class="s06-tela"><path d="M80 1310 L240 1310 M80 1310 L80 1470 M80 1310 L220 1450 M80 1360 Q120 1350 130 1310 M80 1410 Q170 1400 180 1310" fill="none" stroke="${C.TINTA}" stroke-width="3" opacity="0.6"/></g>` +
        `<g class="s06-plantita"><path d="M860 1600 V1480 M860 1520 Q820 1500 810 1460 M860 1500 Q900 1480 910 1440" fill="none" stroke="${C.TINTA}" stroke-width="7" stroke-linecap="round"/><rect x="820" y="1590" width="80" height="40" fill="${C.MAGENTA}" stroke="${C.TINTA}" stroke-width="6"/></g></g>` +
        `<rect class="s06-velo" x="0" y="540" width="1080" height="1160" fill="${C.PAPEL}" opacity="0"/>` +
        `<g class="s06-pobre">${C.robot({ p: P, x: 540, y: 1460, s: 1.4, kind: "pizza", cara: "pena", tag: "El de la pizzería", tagSize: 28 })}` +
        `<g class="s06-pglobo">${C.globo({ x: 650, y: 820, w: 300, h: 120, cola: [620, 1000], lines: ["Pobre..."], size: 50, weight: 700 })}</g></g>`;

      // panel A: el de la ferretería sentencia
      tl.fromTo(q(".s06-pa"), { opacity: 1, x: -120 }, { x: 0, duration: 0.3, ease: "back.out(1.8)" }, 0);
      pop(".s06-globo", AGENTE - 0.15, "400 760");
      tl.to(q(".s06-r .cabeza"), { rotation: -8, svgOrigin: "0 -100", duration: 0.15, yoyo: true, repeat: 5 }, 0.2);
      // panel B "contesta él"
      gsap.set(q(".s06-pb"), { opacity: 0 });
      tl.fromTo(q(".s06-pb"), { opacity: 1, y: 300, rotation: -6, svgOrigin: "300 1080" }, { opacity: 1, y: 0, rotation: 0, svgOrigin: "300 1080", duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, CONTESTA - 0.15);
      tl.to(q(".s06-d .cabeza"), { rotation: 8, svgOrigin: "0 -200", duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, CONTESTA + 0.2);
      // panel C "con un dedo": el dedo baja y toca
      gsap.set(q(".s06-pc"), { opacity: 0 });
      tl.fromTo(q(".s06-pc"), { opacity: 1, y: 300, rotation: 6, svgOrigin: "780 1080" }, { opacity: 1, y: 0, rotation: 0, svgOrigin: "780 1080", duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, CON - 0.25);
      tl.fromTo(q(".s06-dedo"), { y: -60 }, { y: 30, x: -90, duration: 0.18, ease: "power3.in" }, DEDO - 0.1);
      gsap.set(q(".s06-tic"), { opacity: 0 });
      pop(".s06-tic", DEDO + 0.08, "900 1200");
      tl.to(q(".s06-dedo"), { y: -10, duration: 0.15, yoyo: true, repeat: 3, ease: "power2.inOut" }, DEDO + 0.15);
      // panel D: las hojas del calendario pasan
      gsap.set(q(".s06-pd"), { opacity: 0 });
      tl.fromTo(q(".s06-pd"), { opacity: 1, y: 300 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, A - 0.1);
      // LUN queda arriba de la pila: cada hoja se arranca y vuela
      [[q(".s06-h0"), q(".s06-h1"), 4.25], [q(".s06-h1"), q(".s06-h2"), TRES], [q(".s06-h2"), q(".s06-h3"), DIAS]].forEach(([sale, entra, t]) => {
        tl.to(sale, { y: -260, x: 200, rotation: 30, svgOrigin: "540 1480", opacity: 0, duration: 0.3, ease: "power2.in" }, t - 0.05);
      });
      gsap.set(q(".s06-plantita"), { opacity: 0 });
      tl.fromTo(q(".s06-plantita"), { opacity: 1, scaleY: 0, svgOrigin: "860 1630" }, { opacity: 1, scaleY: 1, svgOrigin: "860 1630", duration: 1.2, ease: "power1.out", immediateRender: false }, A + 0.2);
      // "Pobre.": velo y aparece el de la pizzería con pena
      tl.to(q(".s06-velo"), { opacity: 0.82, duration: 0.25 }, POBRE - 0.25);
      gsap.set(q(".s06-pobre"), { opacity: 0 });
      tl.fromTo(q(".s06-pobre"), { opacity: 1, y: 200 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, POBRE - 0.3);
      gsap.set(q(".s06-pglobo"), { opacity: 0 });
      pop(".s06-pglobo", POBRE + 0.05, "640 960", { rot: 6, desde: 0.5 });
      tl.to(q(".s06-pobre .cabeza"), { rotation: 10, svgOrigin: "0 -100", duration: 0.6, ease: "sine.inOut" }, POBRE);
      tl.to(q(".s06-pobre .cuerpo-todo"), { y: 10, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, POBRE + 0.4);


      // salida
      tl.to(q("#" + P + "-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
