<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s12-cta"] .s12-capa { position: absolute; inset: 0; }
    [data-composition-id="s12-cta"] .s12-pagina { position: absolute; inset: 0; }
    [data-composition-id="s12-cta"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="s12-cta" data-width="1080" data-height="1920" data-duration="6.07">
    <div id="s12-escena" class="s12-capa clip" data-start="0" data-duration="6.07" data-track-index="0">
      <div class="s12-pagina">
        <svg class="s12-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      </div>
    </div>
  </div>
  <script src="assets/comic.js"></script>
  <script>
    (function () {
      const ID = "s12-cta";
      const DUR = 6.07;
      const P = "s12";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const C = window.COMIC;
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q("." + P + "-pagina"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // aparece de golpe (pop) un grupo SVG
      const pop = (sel, t, org, extra = {}) => { const el = typeof sel === "string" ? q(sel) : sel; gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 1, scale: extra.desde ?? 0.2, rotation: extra.rot ?? -12, svgOrigin: org }, { opacity: 1, scale: 1, rotation: 0, svgOrigin: org, duration: extra.dur ?? 0.3, ease: extra.ease ?? "back.out(2.4)", immediateRender: false }, t); };
      // se va
      const fuera = (sel, t, org) => tl.to(typeof sel === "string" ? q(sel) : sel, { opacity: 0, scale: 0.5, svgOrigin: org, duration: 0.18, ease: "power2.in" }, t);
      // late (para que nada quede quieto)
      const late = (sel, t, org, n = 6, s = 1.05) => tl.to(typeof sel === "string" ? q(sel) : sel, { scale: s, svgOrigin: org, duration: 0.12, yoyo: true, repeat: n, ease: "sine.inOut" }, t);
      const svg = q("." + P + "-svg");

      const AL = 0.67, TODAVIA = 1.05, CONTESTA = 1.33, DEDO = 2.27, FIN = 3.3;
      svg.innerHTML = C.defs(P) +
        `<g class="s12-main">` + C.vineta({ p: P, x: 70, y: 560, w: 940, h: 1080, fill: C.CIAN, trama: 0.16 }) +
        `<clipPath id="s12-clip"><rect x="75" y="565" width="930" height="1070"/></clipPath><g clip-path="url(#s12-clip)"><g class="s12-rayos">${C.rayos({ x: 540, y: 780, r0: 280, r1: 1200, n: 56, sw: 12, color: C.BLANCO, op: 0.6 })}</g>` +
        `<g class="s12-robots">
          <g class="s12-k">${C.robot({ p: P, x: 200, y: 1630, s: 0.78, kind: "pelu", cara: "risa" })}</g>
          <g class="s12-k">${C.robot({ p: P, x: 420, y: 1640, s: 0.82, kind: "pizza", cara: "risa" })}</g>
          <g class="s12-k">${C.robot({ p: P, x: 650, y: 1640, s: 0.82, kind: "scalerics", cara: "feliz" })}</g>
          <g class="s12-k">${C.robot({ p: P, x: 870, y: 1630, s: 0.78, kind: "ferre", cara: "risa" })}</g>
        </g></g></g>` +
        `<g class="s12-manda">${C.onomato({ x: 540, y: 760, r1: 230, r2: 165, n: 18, ax: 1.85, txt: "¡MANDÁSELO!", size: 104, fondo: C.AMARILLO, color: C.MAGENTA, rot: -5 })}</g>` +
        `<g class="s12-caja" data-layout-allow-overlap="true"><g transform="rotate(-2 540 1020)"><rect x="118" y="938" width="860" height="180" fill="${C.TINTA}"/><rect x="106" y="926" width="860" height="180" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="8"/>
          <text x="536" y="1004" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="52" fill="${C.TINTA}">AL QUE TODAVÍA CONTESTA</text>
          <text class="s12-condedo" x="536" y="1076" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="62" fill="${C.MAGENTA}" stroke="${C.TINTA}" stroke-width="7" paint-order="stroke fill">CON UN DEDO</text></g></g>` +
        `<g class="s12-dedo"><rect x="836" y="1160" width="60" height="190" rx="30" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="8" transform="rotate(180 866 1255)"/><path d="M850 1186 Q866 1172 882 1186" fill="none" stroke="${C.TINTA}" stroke-width="5"/><rect x="796" y="1300" width="220" height="130" rx="50" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="8"/><path d="M900 1320 V1410 M944 1320 V1410" stroke="${C.TINTA}" stroke-width="5"/></g>` +
        `<g class="s12-tic">${C.onomato({ x: 866, y: 1150, r1: 70, r2: 50, n: 10, txt: "¡TIC!", size: 40, fondo: C.MAGENTA, color: C.AMARILLO, rot: -10 })}</g>` +
        `<g class="s12-compartir"><circle cx="230" cy="1240" r="70" fill="${C.VERDE}" stroke="${C.TINTA}" stroke-width="8"/><path d="M196 1270 Q196 1220 248 1218 V1196 L282 1232 L248 1268 V1246 Q216 1246 196 1270 Z" fill="${C.BLANCO}" stroke="${C.TINTA}" stroke-width="6" stroke-linejoin="round"/></g>` +
        `<g class="s12-fin">${C.cartucho({ x: 380, y: 1196, txt: "Continuará...", size: 34 })}</g>`;

      tl.fromTo(q(".s12-main"), { opacity: 1, scale: 1.1, svgOrigin: "540 1100" }, { scale: 1, svgOrigin: "540 1100", duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(q(".s12-rayos"), { rotation: 0, svgOrigin: "540 780" }, { rotation: 14, svgOrigin: "540 780", duration: DUR, ease: "none" }, 0);
      pop(".s12-manda", 0, "540 760", { rot: -25, desde: 0.2, dur: 0.25 });
      sacudon(0.15, 1.5);
      late(".s12-manda", 0.5, "540 760", 9, 1.04);
      pop(".s12-caja", AL - 0.1, "540 1020", { rot: 6, desde: 0.4 });
      gsap.set(q(".s12-condedo"), { opacity: 0 });
      tl.fromTo(q(".s12-condedo"), { opacity: 1, scale: 1.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.18, ease: "power4.in", immediateRender: false }, DEDO - 0.15);
      // el dedo toca en "dedo"
      gsap.set(q(".s12-dedo"), { opacity: 0 });
      tl.fromTo(q(".s12-dedo"), { opacity: 1, x: 200, y: 200 }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, CONTESTA);
      tl.to(q(".s12-dedo"), { y: -30, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.in" }, DEDO - 0.05);
      pop(".s12-tic", DEDO + 0.05, "866 1150");
      tl.to(q(".s12-dedo"), { y: -14, duration: 0.18, yoyo: true, repeat: 9, ease: "sine.inOut" }, DEDO + 0.4);
      // los cuatro saludan
      const ks = [...qa(".s12-k")];
      ks.forEach((k, i) => tl.fromTo(k, { y: 400 }, { y: 0, duration: 0.3, ease: "back.out(1.8)" }, TODAVIA - 0.2 + i * 0.08));
      gsap.set(ks, { y: 400 });
      [...qa(".s12-robots .brazo-d")].forEach((b, i) => {
        tl.to(b, { rotation: -130, svgOrigin: "66 -78", duration: 0.2, ease: "back.out(2)" }, TODAVIA + 0.2 + i * 0.06);
        tl.to(b, { rotation: -100, svgOrigin: "66 -78", duration: 0.16, yoyo: true, repeat: 15, ease: "sine.inOut" }, TODAVIA + 0.45 + i * 0.06);
      });
      // compartir y "continuará"
      pop(".s12-compartir", DEDO + 0.3, "230 1240");
      tl.to(q(".s12-compartir"), { rotation: 10, svgOrigin: "230 1240", duration: 0.25, yoyo: true, repeat: 9, ease: "sine.inOut" }, DEDO + 0.7);
      pop(".s12-fin", FIN, "560 1230", { rot: -8, desde: 0.4 });


      // salida
      tl.to(q("#" + P + "-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
