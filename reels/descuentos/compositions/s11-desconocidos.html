<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s11-desconocidos"] .s11-capa { position: absolute; inset: 0; }
    [data-composition-id="s11-desconocidos"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s11-desconocidos"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s11-desconocidos"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s11-desconocidos"] .moneda-txt { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; fill: #5ce611; }
    [data-composition-id="s11-desconocidos"] .s11-preg { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 44px; fill: #5ce611; }
    [data-composition-id="s11-desconocidos"] .s11-vez { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 104px; letter-spacing: -0.02em; fill: #5ce611; }
    [data-composition-id="s11-desconocidos"] .s11-vidrio { fill: #5ce611; fill-opacity: 0; stroke: #efeee5; stroke-width: 5; stroke-linejoin: round; }
    [data-composition-id="s11-desconocidos"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s11-desconocidos"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s11-desconocidos" data-width="1080" data-height="1920" data-duration="3.42">
    <div id="s11-escena" class="s11-capa clip" data-start="0" data-duration="3.42" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s11-suelo" x1="80" y1="1100" x2="1000" y2="1100" />
        <!-- billetera abierta a la izquierda -->
        <g class="s11-bill">
          <rect class="ln s11-bdib" x="110" y="900" width="210" height="140" rx="22" />
          <path class="ln s11-bdib" d="M270 950 H320 V994 H270 a22 22 0 0 1 0 -44 Z" />
          <path class="ln s11-bdib" d="M126 900 L150 862 H290 L304 900" />
          <circle class="ln-ac s11-bdib" cx="282" cy="972" r="7" />
        </g>
        <!-- monedas que van a los desconocidos -->
        <g class="s11-mon"><circle class="ln-ac" cx="0" cy="0" r="24" /><text class="moneda-txt" x="0" y="10" text-anchor="middle">$</text></g>
        <g class="s11-mon"><circle class="ln-ac" cx="0" cy="0" r="24" /><text class="moneda-txt" x="0" y="10" text-anchor="middle">$</text></g>
        <g class="s11-mon"><circle class="ln-ac" cx="0" cy="0" r="24" /><text class="moneda-txt" x="0" y="10" text-anchor="middle">$</text></g>
        <g class="s11-mon"><circle class="ln-ac" cx="0" cy="0" r="24" /><text class="moneda-txt" x="0" y="10" text-anchor="middle">$</text></g>
        <!-- el local (entra en "vengan") -->
        <g class="s11-local">
          <path class="ln s11-ldib" d="M-150 0 V-180 H150 V0" />
          <path class="ln s11-ldib" d="M-176 -180 H176 L158 -236 H-158 Z" />
          <path class="ln s11-ldib" d="M-176 -180 q22 30 44 0 q22 30 44 0 q22 30 44 0 q22 30 44 0 q22 30 44 0 q22 30 44 0 q22 30 44 0 q22 30 44 0" />
          <rect class="s11-vidrio s11-ldib" x="-122" y="-118" width="72" height="62" />
          <rect class="s11-vidrio s11-ldib" x="50" y="-118" width="72" height="62" />
          <path class="ln s11-ldib" d="M-28 0 V-104 H28 V0" />
        </g>
        <!-- "1 VEZ" -->
        <text class="s11-vez" x="700" y="822" text-anchor="middle">1 VEZ</text>
        <!-- figuritas sin cara, con "?" -->
        <g class="s11-p"><g class="s11-cuerpo"><circle class="ln" cx="0" cy="-96" r="15" /><path class="ln" d="M0 -81 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g><text class="s11-preg" x="0" y="-128" text-anchor="middle">?</text></g>
        <g class="s11-p"><g class="s11-cuerpo"><circle class="ln" cx="0" cy="-96" r="15" /><path class="ln" d="M0 -81 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g><text class="s11-preg" x="0" y="-128" text-anchor="middle">?</text></g>
        <g class="s11-p"><g class="s11-cuerpo"><circle class="ln" cx="0" cy="-96" r="15" /><path class="ln" d="M0 -81 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g><text class="s11-preg" x="0" y="-128" text-anchor="middle">?</text></g>
        <g class="s11-p"><g class="s11-cuerpo"><circle class="ln" cx="0" cy="-96" r="15" /><path class="ln" d="M0 -81 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g><text class="s11-preg" x="0" y="-128" text-anchor="middle">?</text></g>
      </svg>
      <div class="etiqueta"><span class="s11-e1">Desconocidos</span><span class="s11-e2">Una sola vez</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s11-desconocidos";
      const DUR = 3.24;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const PAGARLE = 0.44;
      const DESCONOCIDOS = 0.88;
      const PARA = 1.59;
      const VENGAN = 1.88;
      const UNA = 2.17;
      const VEZ = 2.58;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.6, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.8)" }, t);
      };

      // entrada: suelo y billetera ya arrancados (el cuadro 0 no puede ser negro)
      dibujar([q(".s11-suelo")], 0, 0.5, 0.5);
      dibujar(qa(".s11-bdib"), 0, 0.5, 0.45);

      // figuritas: fila a la derecha, entran con pop escalonado
      const P1 = [480, 620, 760, 900];
      const P2 = [130, 230, 330, 430];
      const figs = qa(".s11-p");
      figs.forEach((g, i) => {
        gsap.set(g, { x: P1[i], y: 1100 });
        tl.fromTo(g, { opacity: 0, scale: 0.6, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 0.08 + i * 0.07);
        gsap.set(g.querySelector(".s11-preg"), { opacity: 0 });
      });

      // "pagarle": la billetera se sacude y le tira una moneda a cada uno
      tl.to(q(".s11-bill"), { rotation: -6, svgOrigin: "215 1040", duration: 0.08, ease: "power2.out", yoyo: true, repeat: 3 }, PAGARLE - 0.05);
      qa(".s11-mon").forEach((m, i) => {
        const t0 = PAGARLE + i * 0.1;
        gsap.set(m, { x: 270, y: 900, opacity: 0, scale: 0.7 });
        tl.to(m, { opacity: 1, scale: 1, duration: 0.08 }, t0);
        tl.to(m, { x: P1[i] + 22, duration: 0.5, ease: "power1.inOut" }, t0);
        tl.to(m, { y: 760 - i * 10, duration: 0.24, ease: "power2.out" }, t0);
        tl.to(m, { y: 1040, duration: 0.26, ease: "power2.in" }, t0 + 0.24);
        tl.to(m, { opacity: 0, scale: 0.5, duration: 0.14, ease: "power2.in" }, t0 + 0.5);
        // el que la recibe da un saltito
        tl.to(figs[i].querySelector(".s11-cuerpo"), { y: -12, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, t0 + 0.5);
      });

      // "desconocidos": a cada uno le salta un "?"
      figs.forEach((g, i) => {
        const pr = g.querySelector(".s11-preg");
        pop(pr, DESCONOCIDOS + i * 0.07, "0 -140");
        tl.fromTo(pr, { rotation: -10, svgOrigin: "0 -140" }, { rotation: 10, svgOrigin: "0 -140", duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 2 }, DESCONOCIDOS + 0.3 + i * 0.07);
      });
      tl.fromTo(q(".s11-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, DESCONOCIDOS);

      // "para que": la billetera se va, la fila se corre a la izquierda
      tl.to(q(".s11-bill"), { opacity: 0, y: 30, duration: 0.25, ease: "power2.in" }, PARA - 0.12);
      figs.forEach((g, i) => {
        tl.to(g, { x: P2[i], duration: 0.35, ease: "power3.inOut" }, PARA - 0.05 + i * 0.03);
      });

      // "vengan": se dibuja el local
      const loc = q(".s11-local");
      gsap.set(loc, { x: 700, y: 1100 });
      dibujar(qa(".s11-ldib"), PARA + 0.05, 0.4);

      // entran por la puerta y salen por el otro lado
      const PUERTA = 700, SALIDA = 885;
      const pasos = [];
      figs.forEach((g, i) => {
        // entra primero el más cercano a la puerta, así no se amontonan
        const t0 = VENGAN - 0.06 + (3 - i) * 0.1;
        const ida = (PUERTA - P2[i]) / 1200;
        pasos.push(t0 + ida);
        tl.to(g, { x: PUERTA, duration: ida, ease: "none" }, t0);
        // desaparece al tocar la fachada (x 550), no se ve atravesándola
        tl.to(g, { opacity: 0, duration: 0.04, ease: "none" }, t0 + (538 - P2[i]) / 1200);
        tl.set(g, { x: SALIDA }, t0 + ida);
        tl.to(g, { opacity: 1, duration: 0.06, ease: "none" }, t0 + ida + 0.05);
        tl.to(g, { x: 1040, duration: 0.3, ease: "power1.in" }, t0 + ida + 0.05);
        tl.to(g, { opacity: 0, duration: 0.14, ease: "none" }, t0 + ida + 0.2);
        // paso: rebote corto mientras camina
        tl.to(g.querySelector(".s11-cuerpo"), { y: -8, duration: 0.09, ease: "sine.out", yoyo: true, repeat: 5 }, t0);
      });
      // las vidrieras parpadean al pasar cada uno y quedan apagadas
      pasos.forEach((t) => {
        tl.to(qa(".s11-vidrio"), { fillOpacity: 0.9, duration: 0.06, ease: "none", yoyo: true, repeat: 1 }, t - 0.04);
      });

      // "una sola vez": etiqueta y el "1 VEZ" con punch
      tl.to(q(".s11-e1"), { opacity: 0, duration: 0.12 }, UNA - 0.14);
      tl.fromTo(q(".s11-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, UNA);
      tl.fromTo(q(".s11-vez"), { opacity: 0, scale: 1.6, svgOrigin: "700 790" }, { opacity: 1, scale: 1, svgOrigin: "700 790", duration: 0.3, ease: "power3.out" }, VEZ - 0.06);
      tl.to(q(".s11-vez"), { rotation: -4, svgOrigin: "700 790", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, VEZ + 0.24);
      tl.to(loc, { y: 1106, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, VEZ);

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      // escala de tiempo: la escena se armó con otra locución, se estira para calzar con la de Gemini
      tl.paused(false);
      tl.timeScale(0.9474);
      const tlx = gsap.timeline({ paused: true });
      tlx.add(tl, 0);
      window.__timelines[ID] = tlx;
    })();
  </script>
</template>
