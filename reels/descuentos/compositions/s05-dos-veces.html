<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s05-dos-veces"] .s05-capa { position: absolute; inset: 0; }
    [data-composition-id="s05-dos-veces"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s05-dos-veces"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-dos-veces"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-dos-veces"] .ln-ap { fill: none; stroke: rgba(239, 238, 229, 0.4); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 16; }
    [data-composition-id="s05-dos-veces"] .ln-ac-fina { fill: none; stroke: rgba(92, 230, 17, 0.45); stroke-width: 4; }
    [data-composition-id="s05-dos-veces"] .s05-signo { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 120px; fill: #5ce611; }
    [data-composition-id="s05-dos-veces"] .s05-x2 { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 150px; letter-spacing: -0.02em; fill: #5ce611; }
    [data-composition-id="s05-dos-veces"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s05-dos-veces"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s05-dos-veces" data-width="1080" data-height="1920" data-duration="2.4">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="2.4" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s05-todo">
          <!-- suelo y los dos huecos donde va a caer la plata -->
          <line class="ln s05-suelo" x1="180" y1="1150" x2="900" y2="1150" />
          <circle class="ln-ap s05-hueco" cx="370" cy="1020" r="120" />
          <circle class="ln-ap s05-hueco" cx="710" cy="1020" r="120" />
          <!-- moneda 1 -->
          <g class="s05-mon s05-m1">
            <circle class="ln-ac" cx="370" cy="1020" r="120" />
            <circle class="ln-ac-fina" cx="370" cy="1020" r="94" />
            <text class="s05-signo" x="370" y="1062" text-anchor="middle">$</text>
          </g>
          <!-- moneda 2 -->
          <g class="s05-mon s05-m2">
            <circle class="ln-ac" cx="710" cy="1020" r="120" />
            <circle class="ln-ac-fina" cx="710" cy="1020" r="94" />
            <text class="s05-signo" x="710" y="1062" text-anchor="middle">$</text>
          </g>
          <!-- rayitas del golpe -->
          <path class="ln s05-golpe s05-g1" d="M225 1120 L190 1100 M232 1080 L196 1070 M515 1120 L550 1100" />
          <path class="ln s05-golpe s05-g2" d="M565 1120 L530 1100 M855 1120 L890 1100 M848 1080 L884 1070" />
          <!-- x2 -->
          <text class="s05-x2" x="540" y="820" text-anchor="middle">x2</text>
        </g>
      </svg>
      <div class="etiqueta"><span class="s05-e1">Dos veces</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-dos-veces";
      const DUR = 1.72;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const PLATA = 0.45;
      const DOS = 0.7;
      const VECES = 0.87;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };

      // arranque: el suelo y los huecos (punteados) ya están
      dibujar([q(".s05-suelo")], 0, 0.35, 0.15);
      qa(".s05-hueco").forEach((h, i) => tl.fromTo(h, { opacity: 0.5, scale: 0.9, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, i * 0.08));

      // las dos monedas caen con golpe, una en "plata" y otra en "dos"
      const caer = (m, golpe, t) => {
        tl.fromTo(m, { opacity: 0, y: -300 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.in" }, t - 0.2);
        tl.fromTo(m, { scaleY: 0.82, scaleX: 1.1, transformOrigin: "50% 100%" }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, t);
        tl.fromTo(golpe, { opacity: 0 }, { opacity: 1, duration: 0.05 }, t);
        tl.to(golpe, { opacity: 0, duration: 0.2 }, t + 0.15);
      };
      gsap.set(qa(".s05-golpe"), { opacity: 0 });
      caer(q(".s05-m1"), q(".s05-g1"), PLATA);
      caer(q(".s05-m2"), q(".s05-g2"), DOS);
      tl.to(qa(".s05-hueco"), { opacity: 0, duration: 0.1 }, DOS);
      // temblor de todo al segundo golpe
      tl.to(q(".s05-todo"), { y: 8, duration: 0.04, ease: "none", yoyo: true, repeat: 3 }, DOS);

      // "veces": x2 con punch
      tl.fromTo(q(".s05-x2"), { opacity: 0, scale: 1.8, transformOrigin: "50% 60%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, VECES);
      tl.to(q(".s05-x2"), { scale: 1.08, transformOrigin: "50% 60%", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, VECES + 0.3);
      tl.to(qa(".s05-mon"), { scale: 0.92, transformOrigin: "50% 100%", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, VECES + 0.05);
      tl.fromTo(q(".s05-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, VECES);

      // salida seca
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      // escala de tiempo: la escena se armó con otra locución, se estira para calzar con la de Gemini
      tl.paused(false);
      tl.timeScale(0.7167);
      const tlx = gsap.timeline({ paused: true });
      tlx.add(tl, 0);
      window.__timelines[ID] = tlx;
    })();
  </script>
</template>
