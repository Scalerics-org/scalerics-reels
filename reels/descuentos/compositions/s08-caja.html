      <svg viewBox="0 0 1080 1920" aria-hidden="true">

          <!-- monedas adentro del cajón -->
          <g class="s08-mon"><circle class="ln-ac" cx="0" cy="0" r="22" /><text class="moneda-txt" data-layout-ignore x="0" y="9" text-anchor="middle">$</text></g>
          <g class="s08-mon"><circle class="ln-ac" cx="0" cy="0" r="22" /><text class="moneda-txt" data-layout-ignore x="0" y="9" text-anchor="middle">$</text></g>
          <g class="s08-mon"><circle class="ln-ac" cx="0" cy="0" r="22" /><text class="moneda-txt" data-layout-ignore x="0" y="9" text-anchor="middle">$</text></g>

  <script>
    (function () {
      const ID = "s08-caja";
      const DUR = 2.92;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const VACIA = 0.27;
      const CAJA = 0.69;
      const EL = 1.38;
      const OTRO = 1.53;
      const LLENA = 1.86;
      const LOCAL = 2.13;

      const SUELO = 1120;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // 1) la caja arranca medio dibujada
      dibujar([q(".s08-suelo")], 0, 0.45, 0.4);
      dibujar(qa(".s08-dib"), 0, 0.4, 0.45);
      gsap.set(q(".s08-num-b"), { opacity: 0 });
      tl.fromTo(q(".s08-num-a"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.1);
      // monedas apiladas adentro del cajón
      const mon = qa(".s08-mon");
      const xs = [430, 495, 560, 625, 528];
      const ys = [1022, 1022, 1022, 1022, 990];
      mon.forEach((m, i) => gsap.set(m, { x: xs[i], y: ys[i], opacity: 0 }));
      // "vacía": se abre el cajón y la plata sale volando
      tl.to(q(".s08-cajon"), { y: 34, duration: 0.2, ease: "back.out(2)" }, VACIA);
      tl.to(q(".s08-caja"), { x: -6, duration: 0.04, ease: "none", yoyo: true, repeat: 3 }, VACIA);
      const fx = [190, 300, 790, 900, 820];
      const fy = [930, 820, 900, 960, 720];
      mon.forEach((m, i) => {
        const t0 = VACIA + 0.08 + i * 0.07;
        tl.set(m, { y: ys[i] + 34, opacity: 1 }, t0);
        tl.to(m, { x: fx[i], duration: 0.55, ease: "power1.out" }, t0);
        tl.to(m, { y: fy[i], duration: 0.55, ease: "power2.out" }, t0);
        tl.to(m, { rotation: (i % 2 ? 1 : -1) * 200, duration: 0.55, ease: "none" }, t0);
        tl.to(m, { opacity: 0, scale: 0.5, transformOrigin: "50% 50%", duration: 0.25, ease: "power2.in" }, t0 + 0.32);
      });
      tl.fromTo(q(".s08-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, VACIA);
      // "caja": el número se va a cero y el cajón queda vacío
      tl.to(q(".s08-num-a"), { opacity: 0, duration: 0.08 }, CAJA);
      tl.fromTo(q(".s08-num-b"), { opacity: 0, scale: 1.5, svgOrigin: "540 786" }, { opacity: 1, scale: 1, svgOrigin: "540 786", duration: 0.25, ease: "power3.out" }, CAJA);
      tl.to(q(".s08-num-b"), { opacity: 0.3, duration: 0.08, ease: "none", yoyo: true, repeat: 3 }, CAJA + 0.35);
      tl.to(q(".s08-cajon"), { y: 40, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, CAJA + 0.4);

      // 2) la caja se va, aparece el local
      tl.to(q(".s08-caja"), { opacity: 0, y: -30, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, EL);
      tl.to(q(".s08-e1"), { opacity: 0, duration: 0.2 }, EL);
      dibujar(qa(".s08-dib-l"), OTRO - 0.12, 0.35);
      gsap.set(qa(".s08-luz"), { opacity: 0 });
      gsap.set(q(".s08-cartel"), { opacity: 0 });
      tl.to(q(".s08-cartel"), { opacity: 1, duration: 0.2 }, OTRO + 0.15);
      // "llena": entra la gente desde los costados, se prenden las vidrieras
      qa(".s08-p").forEach((p, i) => {
        const xf = Number(p.dataset.x);
        const desde = xf < 540 ? xf - 120 : xf + 120;
        const t0 = LLENA - 0.08 + i * 0.06;
        tl.fromTo(p, { x: desde, y: SUELO, opacity: 0 }, { x: xf, opacity: 1, duration: 0.3, ease: "power3.out" }, t0);
        tl.to(p, { y: SUELO - 14, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, LOCAL + 0.1 + (i % 3) * 0.06);
      });
      tl.to(qa(".s08-luz"), { opacity: 0.85, duration: 0.2, ease: "power2.out" }, LLENA + 0.05);
      tl.to(q(".s08-local"), { scale: 1.04, svgOrigin: "540 1120", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, LOCAL);
      tl.fromTo(q(".s08-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, LLENA);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      // escala de tiempo: la escena se armó con otra locución, se estira para calzar con la de Gemini
      tl.paused(false);
      tl.timeScale(0.8022);
      const tlx = gsap.timeline({ paused: true });
      tlx.add(tl, 0);
      window.__timelines[ID] = tlx;
    })();
  </script>
