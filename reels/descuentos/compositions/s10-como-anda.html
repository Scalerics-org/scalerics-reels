    [data-composition-id="s10-como-anda"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s10-como-anda" data-width="1080" data-height="1920" data-duration="7.14">
    <div id="s10-escena" class="s10-capa clip" data-start="0" data-duration="7.14" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- moneda que entra al celular en "suma" -->

        <g class="s10-cel">
          <g class="s10-cel-in">
            <!-- carcasa 380x640 -->

            <line class="ln s10-marco" x1="506" y1="620" x2="574" y2="620" />

            <!-- app -->

            <!-- puntos -->
            <g class="s10-saldo">

              <text class="s10-pts" x="594" y="934">PTS</text>

              <text class="s10-premio" x="460" y="1038">Café gratis</text>

              <g class="s10-btn">
                <rect class="s10-btn-fondo s10-btn-lleno" x="392" y="1110" width="296" height="60" rx="30" />
                <rect class="ln-ac" x="392" y="1110" width="296" height="60" rx="30" />
                <text class="s10-btn-txt" x="540" y="1150" text-anchor="middle">CANJEAR</text>
              </g>
            </g>

            <!-- próximo premio: barra casi llena -->
            <g class="s10-prox">
              <text data-layout-ignore class="s10-rotulo" x="378" y="1006">PRÓXIMO PREMIO</text>
              <text class="s10-premio" x="378" y="1054">Medialunas</text>
              <text class="s10-costo" x="702" y="1054" text-anchor="end">500 PTS</text>
              <line class="s10-riel" x1="392" y1="1100" x2="688" y2="1100" />
              <line class="s10-barra" x1="392" y1="1100" x2="658" y2="1100" />
              <circle class="ln-ac s10-meta" cx="688" cy="1100" r="17" />

        <!-- nota afuera del celular: lo que le cuesta al comercio -->
        <g class="s10-nota">

          <rect class="ln-4 s10-nota-caja" x="718" y="962" width="252" height="226" rx="22" />
          <text class="s10-nota-txt" x="740" y="1014">A VOS TE</text>

      </svg>
      <div class="etiqueta"><span class="s10-e1">Suma</span><span class="s10-e2">Canjea</span><span class="s10-e3">Le falta poco</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s10-como-anda";
      const DUR = 6.16;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CLIENTE = 0.15;
      const SUMA = 0.48;
      const COMPRA = 1.15;
      const CANJEA = 1.78;
      const PREMIOS = 2.16;
      const CUESTAN = 2.93;
      const POCO_1 = 3.29;
      const Y = 3.88;
      const VUELVE = 3.97;
      const PORQUE = 4.3;
      const FALTA = 4.6;
      const POCO_2 = 4.95;
      const PROXIMO = 5.4;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const fila = (el, t) => {
        tl.fromTo(el, { opacity: 0, y: 16, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.fromTo(el, { scale: 1 }, { scale: s || 1.1, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t);
      };
      const etiqueta = (entra, sale, t) => {
        if (sale) tl.to(sale, { opacity: 0, y: -8, duration: 0.15, ease: "power2.in" }, t - 0.1);
        tl.fromTo(entra, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

      // celular: arranca ya medio dibujado y se acerca
      dibujar(qa(".s10-marco"), 0, 0.55, 0.45);
      tl.fromTo(q(".s10-cel-in"), { scale: 0.93, svgOrigin: "540 910" }, { scale: 1, svgOrigin: "540 910", duration: 0.9, ease: "power3.out" }, 0);
      fila(q(".s10-head"), 0.08);
      dibujar([q(".s10-div")], 0.12, 0.4);
      // "cliente": Lucía y su saldo
      fila(q(".s10-quien"), CLIENTE);
      fila(q(".s10-saldo"), CLIENTE + 0.1);

      // "suma": entra una moneda al número, aparece +120 y el saldo sube 330 → 450
      gsap.set(q(".s10-moneda"), { opacity: 0 });
      tl.fromTo(q(".s10-moneda"), { x: 190, y: 1040, opacity: 0, scale: 0.7, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.14, ease: "power3.out" }, SUMA - 0.12);
      tl.to(q(".s10-moneda"), { x: 470, y: 890, scale: 0.4, duration: 0.3, ease: "power2.in" }, SUMA + 0.02);
      tl.to(q(".s10-moneda"), { opacity: 0, duration: 0.08 }, SUMA + 0.26);
      gsap.set(q(".s10-mas"), { opacity: 0 });
      tl.fromTo(q(".s10-mas"), { opacity: 0, y: 24, scale: 0.7, svgOrigin: "650 830" }, { opacity: 1, y: 0, scale: 1, svgOrigin: "650 830", duration: 0.32, ease: "back.out(2)" }, SUMA + 0.06);
      const num = q(".s10-n");
      const cuenta = { v: 330 };
      tl.fromTo(cuenta, { v: 330 }, { v: 450, duration: COMPRA - SUMA - 0.15, ease: "power2.out", onUpdate: () => { num.textContent = String(Math.round(cuenta.v / 10) * 10); } }, SUMA + 0.15);
      punch(q(".s10-saldo"), COMPRA, "378 900", 1.08);
      tl.to(q(".s10-mas"), { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, COMPRA + 0.25);
      etiqueta(q(".s10-e1"), null, SUMA);

      // "canjea premios": la tarjeta del premio sube; en "premios" se aprieta CANJEAR
      fila(q(".s10-premio-card"), CANJEA - 0.06);
      etiqueta(q(".s10-e2"), q(".s10-e1"), CANJEA);
      gsap.set(q(".s10-btn-lleno"), { opacity: 0 });
      tl.to(q(".s10-btn"), { scale: 0.92, svgOrigin: "540 1140", duration: 0.09, ease: "power2.in", yoyo: true, repeat: 1 }, PREMIOS);
      tl.to(q(".s10-btn-lleno"), { opacity: 1, duration: 0.1 }, PREMIOS + 0.04);
      tl.to(q(".s10-btn-lleno"), { opacity: 0.45, duration: 0.5, ease: "power2.out" }, PREMIOS + 0.3);

      // "te cuestan poco": el celular se corre a la izquierda y aparece la nota de costo
      tl.to(q(".s10-cel"), { x: -110, duration: 0.4, ease: "power3.inOut" }, CUESTAN - 0.32);
      gsap.set(q(".s10-nota"), { opacity: 0 });
      tl.set(q(".s10-nota"), { opacity: 1 }, CUESTAN - 0.05);
      dibujar([q(".s10-conector")], CUESTAN - 0.05, 0.25);
      gsap.set(qa(".s10-nota-caja, .s10-nota-txt, .s10-nota-num"), { opacity: 0 });
      pop(q(".s10-nota-caja"), CUESTAN, "844 1075");
      tl.fromTo(qa(".s10-nota-txt"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", stagger: 0.06 }, CUESTAN + 0.08);
      // "poco": el $40 cae con golpe
      tl.fromTo(q(".s10-nota-num"), { opacity: 0, scale: 1.5, svgOrigin: "800 1112" }, { opacity: 1, scale: 1, svgOrigin: "800 1112", duration: 0.28, ease: "power3.out" }, POCO_1 - 0.04);
      tl.fromTo(q(".s10-nota"), { rotation: 0 }, { rotation: -2, svgOrigin: "844 1075", duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, POCO_1 + 0.25);

      // "y vuelve": la nota se va, el celular vuelve al centro, cambia la tarjeta
      tl.to(q(".s10-nota"), { opacity: 0, x: 30, duration: 0.25, ease: "power2.in" }, Y - 0.1);
      tl.to(q(".s10-cel"), { x: 0, duration: 0.4, ease: "power3.inOut" }, Y);
      tl.to(q(".s10-premio-card"), { opacity: 0, y: -20, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, VUELVE - 0.08);
      gsap.set(q(".s10-prox"), { opacity: 0 });
      fila(q(".s10-prox"), VUELVE + 0.12);
      // "le falta poco": la barra se llena casi entera (450 de 500)
      dibujar([q(".s10-barra")], FALTA - 0.1, 0.55);
      gsap.set(q(".s10-faltan"), { opacity: 0 });
      tl.fromTo(q(".s10-faltan"), { opacity: 0, scale: 0.85, svgOrigin: "378 1152" }, { opacity: 1, scale: 1, svgOrigin: "378 1152", duration: 0.3, ease: "back.out(1.8)" }, FALTA + 0.2);
      punch(q(".s10-faltan"), POCO_2, "378 1152", 1.08);
      etiqueta(q(".s10-e3"), q(".s10-e2"), FALTA);
      // "próximo": la meta late
      tl.fromTo(q(".s10-meta"), { scale: 1 }, { scale: 1.35, svgOrigin: "688 1100", duration: 0.16, ease: "power2.out", yoyo: true, repeat: 3, immediateRender: false }, PROXIMO);
      tl.to(q(".s10-cel-in"), { scale: 1.03, svgOrigin: "540 910", duration: DUR - 0.3 - PORQUE, ease: "sine.inOut" }, PORQUE);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      // escala de tiempo: la escena se armó con otra locución, se estira para calzar con la de Gemini
      tl.paused(false);
      tl.timeScale(0.8627);
      const tlx = gsap.timeline({ paused: true });
      tlx.add(tl, 0);
      window.__timelines[ID] = tlx;
    })();
  </script>
</template>
