  <style>

  <div id="root" data-composition-id="s06-viven" data-width="1080" data-height="1920" data-duration="4.18">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="4.18" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s06-suelo" x1="120" y1="1120" x2="960" y2="1120" />
        <!-- el local grande (los que más venden) -->
        <g class="s06-local">
          <path class="ln s06-dib" d="M340 1120 V860 H740 V1120" />
          <path class="ln s06-dib" d="M310 860 H770 L745 790 H335 Z" />
          <path class="ln s06-dib" d="M310 860 q28.75 36 57.5 0 q28.75 36 57.5 0 q28.75 36 57.5 0 q28.75 36 57.5 0 q28.75 36 57.5 0 q28.75 36 57.5 0 q28.75 36 57.5 0 q28.75 36 57.5 0" />
          <rect class="ln s06-dib" x="430" y="700" width="220" height="70" rx="10" />
          <rect class="ln s06-dib" x="370" y="930" width="120" height="90" rx="6" />

          <!-- en el cartel: ventas que suben -->

          <path class="ln-ac s06-vuelta-arco" d="M540 630 A300 300 0 1 1 312 734" />

        <g class="s06-p"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln s06-p-cuerpo" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
        <g class="s06-p"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln s06-p-cuerpo" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
        <g class="s06-p"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln s06-p-cuerpo" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>

    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-viven";
      const DUR = 3.66;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const VENDEN = 0.54;
      const NO = 0.83;
      const VIVEN = 0.99;
      const DESCUENTO = 1.39;
      const VIVEN2 = 2.26;
      const VUELVAS = 2.79;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };

      // el local arranca medio dibujado
      dibujar([q(".s06-suelo")], 0, 0.5, 0.4);
      dibujar(qa(".s06-dib"), 0, 0.6, 0.45);
      gsap.set(qa(".s06-luz"), { opacity: 0 });
      tl.fromTo(q(".s06-local"), { scale: 0.94, svgOrigin: "540 1120" }, { scale: 1, svgOrigin: "540 1120", duration: 0.5, ease: "power3.out" }, 0);
      // "venden": las ventas suben en el cartel y se prenden las vidrieras
      dibujar(qa(".s06-sube"), VENDEN - 0.15, 0.35);
      tl.to(qa(".s06-luz"), { opacity: 0.85, duration: 0.2, ease: "power2.out" }, VENDEN);
      tl.to(q(".s06-local"), { scale: 1.03, svgOrigin: "540 1120", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, VENDEN);

      // "no viven del descuento": una etiqueta % se le acerca, le cae la X, se va
      const tag = q(".s06-tag");
      gsap.set(tag, { x: 1000, y: 820, opacity: 0 });
      tl.to(tag, { opacity: 1, duration: 0.1 }, NO - 0.15);
      tl.to(tag, { x: 860, duration: 0.3, ease: "power3.out" }, NO - 0.15);
      tl.fromTo(q(".s06-tag-in"), { rotation: -10, svgOrigin: "0 0" }, { rotation: 6, svgOrigin: "0 0", duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, NO + 0.1);
      tl.fromTo(q(".s06-badge"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.22, ease: "back.out(2)" }, VIVEN);
      tl.to(q(".s06-tag-in"), { opacity: 0.4, duration: 0.15 }, VIVEN + 0.2);
      tl.fromTo(q(".s06-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, VIVEN);
      tl.to(tag, { x: 1180, rotation: 25, opacity: 0, duration: 0.4, ease: "power2.in" }, DESCUENTO + 0.2);

      // "viven de que vuelvas": flecha circular grande que gira y gente que entra
      const arco = q(".s06-vuelta-arco");
      const La = arco.getTotalLength();
      gsap.set(arco, { strokeDasharray: La, strokeDashoffset: La, opacity: 0 });
      tl.to(arco, { opacity: 1, duration: 0.04 }, VIVEN2 - 0.1);
      tl.to(arco, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, VIVEN2 - 0.1);
      tl.fromTo(q(".s06-vuelta-punta"), { opacity: 0 }, { opacity: 1, duration: 0.12 }, VIVEN2 + 0.32);
      tl.to(q(".s06-vuelta"), { rotation: 300, svgOrigin: "540 930", duration: 1.1, ease: "power2.inOut" }, VIVEN2 + 0.45);
      tl.to(q(".s06-e1"), { opacity: 0, duration: 0.2 }, VIVEN2 - 0.1);
      tl.fromTo(q(".s06-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, VUELVAS - 0.1);

      const gente = qa(".s06-p");
      gente.forEach((p, i) => {
        const izq = i % 2 === 0;
        const t0 = VIVEN2 + 0.1 + i * 0.2;
        const desde = izq ? 200 : 880;
        tl.fromTo(p, { x: desde, y: 1120, opacity: 0 }, { x: desde + (izq ? 60 : -60), opacity: 1, duration: 0.15, ease: "none" }, t0);
        tl.to(p, { x: 540, duration: 0.6, ease: "none" }, t0 + 0.15);
        tl.to(p, { opacity: 0, duration: 0.1 }, t0 + 0.68);
        tl.fromTo(p.querySelector(".s06-p-cuerpo"), { rotation: -5, svgOrigin: "0 -40" }, { rotation: 5, svgOrigin: "0 -40", duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 4 }, t0);
      });
      // cada vez que entra uno, el local late
      gente.forEach((p, i) => {
        tl.to(q(".s06-local"), { scale: 1.025, svgOrigin: "540 1120", duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, VIVEN2 + 0.1 + i * 0.2 + 0.72);
      });

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      // escala de tiempo: la escena se armó con otra locución, se estira para calzar con la de Gemini
      tl.paused(false);
      tl.timeScale(0.8756);
      const tlx = gsap.timeline({ paused: true });
      tlx.add(tl, 0);
      window.__timelines[ID] = tlx;
    })();
  </script>
