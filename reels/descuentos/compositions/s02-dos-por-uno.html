  <style>

    [data-composition-id="s02-dos-por-uno"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s02-dos-por-uno"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s02-dos-por-uno" data-width="1080" data-height="1920" data-duration="6.02">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="6.02" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s02-suelo" x1="120" y1="1120" x2="960" y2="1120" />
        <!-- el local -->
        <g transform="translate(540 1120)">
          <g class="s02-local">
            <path class="ln s02-dib" d="M-200 0 V-220 H200 V0" />
            <path class="ln s02-dib" d="M-230 -220 H230 L208 -285 H-208 Z" />
            <path class="ln s02-dib" d="M-230 -220 q23 30 46 0 q23 30 46 0 q23 30 46 0 q23 30 46 0 q23 30 46 0 q23 30 46 0 q23 30 46 0 q23 30 46 0 q23 30 46 0 q23 30 46 0" />
            <rect class="ln s02-dib" x="-175" y="-160" width="120" height="92" rx="6" />
            <rect class="ln s02-dib" x="55" y="-160" width="120" height="92" rx="6" />
            <path class="ln s02-dib" d="M-34 0 V-132 H34 V0" />
            <rect class="vidrio s02-luz" x="-165" y="-150" width="100" height="72" rx="3" />
            <rect class="vidrio s02-luz" x="65" y="-150" width="100" height="72" rx="3" />
          </g>
          <!-- cartel 2x1 colgado del toldo -->
          <g class="s02-cartel">
            <g class="s02-cartel-in">
              <line class="ln s02-cuerda" x1="-62" y1="-285" x2="-62" y2="-316" />
              <line class="ln s02-cuerda" x1="62" y1="-285" x2="62" y2="-316" />
              <rect class="ln-ac" x="-104" y="-404" width="208" height="88" rx="14" />
              <text class="oferta" x="0" y="-337" text-anchor="middle">2x1</text>

        <!-- figuritas que llenan el local -->
        <g transform="translate(540 1196) scale(1.15)">
          <g class="s02-p" data-x="-250"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
          <g class="s02-p" data-x="-166"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
          <g class="s02-p" data-x="-84"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
          <g class="s02-p" data-x="0"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
          <g class="s02-p" data-x="84"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
          <g class="s02-p" data-x="166"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
          <g class="s02-p" data-x="250"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
        </g>
        <!-- calendario: pasa una semana -->
        <g transform="translate(872 700)">
          <g class="s02-cal">
            <rect class="ln" x="-62" y="-60" width="124" height="116" rx="12" />
            <line class="ln" x1="-62" y1="-28" x2="62" y2="-28" />
            <line class="ln" x1="-30" y1="-76" x2="-30" y2="-46" />
            <line class="ln" x1="30" y1="-76" x2="30" y2="-46" />
            <text class="dia s02-d1" x="0" y="31" text-anchor="middle">12</text>
            <text class="dia s02-d2" x="0" y="31" text-anchor="middle">15</text>
            <text class="dia s02-d3" x="0" y="31" text-anchor="middle">19</text>
            <rect class="hoja s02-hoja" x="-62" y="-28" width="124" height="84" rx="6" />
            <text class="dias s02-mas7" x="0" y="104" text-anchor="middle">+7 DÍAS</text>
          </g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s02-e1">2x1</span><span class="s02-e2">Una semana después</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-dos-por-uno";
      const DUR = 5.14;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const DOS = 1.27;
      const LLENA = 2.59;
      const SEMANA = 3.34;
      const SIGUIENTE = 3.64;
      const VACIO = 4.33;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.6, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.8)" }, t);
      };

      // el local arranca medio dibujado (el cuadro 0 no puede ser negro)
      dibujar(qa(".s02-dib"), 0, 0.7, 0.45);
      tl.fromTo(q(".s02-suelo"), { scaleX: 0.5, svgOrigin: "540 1120" }, { scaleX: 1, svgOrigin: "540 1120", duration: 0.8, ease: "power3.out" }, 0);
      gsap.set(qa(".s02-luz"), { opacity: 0 });
      // respira un poco mientras espera el "dos por uno"
      tl.fromTo(q(".s02-local"), { scale: 0.96, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: DOS, ease: "power1.out" }, 0);

      // "dos por uno": el cartel cae con golpe y se hamaca
      gsap.set(q(".s02-cartel"), { opacity: 0 });
      tl.set(q(".s02-cartel"), { opacity: 1 }, DOS);
      tl.fromTo(q(".s02-cartel-in"), { y: -200 }, { y: 0, duration: 0.4, ease: "back.out(2)" }, DOS);
      tl.fromTo(q(".s02-cartel-in"), { rotation: -5, svgOrigin: "0 -285" }, { rotation: 5, svgOrigin: "0 -285", duration: 0.32, ease: "sine.inOut", yoyo: true, repeat: 3 }, DOS + 0.3);
      tl.to(q(".s02-cartel-in"), { rotation: 0, svgOrigin: "0 -285", duration: 0.25, ease: "sine.out" }, DOS + 1.58);
      tl.fromTo(q(".s02-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, DOS);

      // "llena": entran las figuritas de los dos lados y se prenden las vidrieras
      const gente = qa(".s02-p");
      const orden = [3, 2, 4, 1, 5, 0, 6];
      orden.forEach((idx, k) => {
        const p = gente[idx];
        const x = Number(p.dataset.x);
        const desde = x < 0 || (x === 0 && k % 2) ? -1 : 1;
        const t0 = LLENA - 0.25 + k * 0.07;
        tl.fromTo(p, { x: x + desde * 380, opacity: 0 }, { x: x, opacity: 1, duration: 0.42, ease: "power3.out" }, t0);
        tl.fromTo(p, { y: 0 }, { y: -8, duration: 0.1, ease: "sine.out", yoyo: true, repeat: 3 }, t0);
        // "semana siguiente": se van todos
        tl.to(p, { x: x + desde * 420, opacity: 0, duration: 0.42, ease: "power2.in" }, SIGUIENTE + 0.05 + k * 0.05);
      });
      tl.to(qa(".s02-luz"), { opacity: 0.85, duration: 0.2, ease: "power2.out", stagger: 0.08 }, LLENA + 0.1);
      tl.to(q(".s02-local"), { scale: 1.04, svgOrigin: "0 0", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, LLENA + 0.15);

      // "semana siguiente": el calendario pasa hojas
      pop(q(".s02-cal"), SEMANA - 0.08, "0 0");
      gsap.set(qa(".s02-d2, .s02-d3"), { opacity: 0 });
      const hoja = q(".s02-hoja");
      [0, 1, 2].forEach((k) => {
        const t0 = SEMANA + 0.15 + k * 0.2;
        tl.fromTo(hoja, { scaleY: 1, opacity: 1, svgOrigin: "0 -28" }, { scaleY: 0, opacity: 0.4, svgOrigin: "0 -28", duration: 0.17, ease: "power2.in", immediateRender: k === 0 ? true : false }, t0);
        if (k === 0) { tl.set(q(".s02-d1"), { opacity: 0 }, t0 + 0.1); tl.set(q(".s02-d2"), { opacity: 1 }, t0 + 0.1); }
        if (k === 2) { tl.set(q(".s02-d2"), { opacity: 0 }, t0 + 0.1); tl.set(q(".s02-d3"), { opacity: 1 }, t0 + 0.1); }
      });
      tl.set(hoja, { opacity: 0 }, SEMANA + 0.72);
      pop(q(".s02-mas7"), SIGUIENTE, "0 96");
      tl.to(q(".s02-e1"), { opacity: 0, duration: 0.2 }, SEMANA - 0.1);
      tl.fromTo(q(".s02-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, SEMANA + 0.05);

      // "vacío": se apagan las luces y el local queda en crema 0.4
      tl.to(qa(".s02-luz"), { opacity: 0, duration: 0.18, ease: "power2.in" }, VACIO);
      tl.to(qa(".s02-dib, .s02-cuerda"), { opacity: 0.4, duration: 0.35 }, VACIO);
      tl.to(q(".s02-cartel-in"), { opacity: 0.4, rotation: 8, svgOrigin: "0 -285", duration: 0.4, ease: "back.out(2)" }, VACIO);
      tl.to(q(".s02-local"), { scale: 0.97, svgOrigin: "0 0", duration: 0.5, ease: "power2.out" }, VACIO);

      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      // escala de tiempo: la escena se armó con otra locución, se estira para calzar con la de Gemini
      tl.paused(false);
      tl.timeScale(0.8538);
      const tlx = gsap.timeline({ paused: true });
      tlx.add(tl, 0);
      window.__timelines[ID] = tlx;
    })();
  </script>
