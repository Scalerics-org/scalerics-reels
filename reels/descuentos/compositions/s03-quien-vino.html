  <div id="root" data-composition-id="s03-quien-vino" data-width="1080" data-height="1920" data-duration="6.58">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="6.58" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- ¿quién vino? -->
        <g class="s03-preg">
          <path class="ln s03-preg-dib" style="stroke-width: 9" d="M450 750 Q450 640 540 640 Q630 640 630 730 Q630 795 566 822 Q540 834 540 870 V912" />

  <script>
    (function () {
      const ID = "s03-quien-vino";
      const DUR = 5.94;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const VINO = 0.25;
      const OFERTAS = 1.43;
      const NO = 3.43;
      const PROXIMO = 4.71;
      const DESCUENTO = 5.06;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.6, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.8)" }, t);
      };

      // "¿Quién vino?": el signo se dibuja (arranca medio hecho) y se sacude
      dibujar([q(".s03-preg-dib")], 0, 0.55, 0.5);
      pop(q(".s03-preg-punto"), 0.3, "540 990");
      tl.fromTo(q(".s03-preg"), { rotation: 0, svgOrigin: "540 990" }, { rotation: -8, svgOrigin: "540 990", duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: 3 }, VINO + 0.3);
      tl.fromTo(q(".s03-preg"), { scale: 1, svgOrigin: "540 820" }, { scale: 1.06, svgOrigin: "540 820", duration: 0.5, ease: "sine.inOut" }, 0.85);
      // "busca ofertas": el signo se achica y en su lugar aparece la figurita con la lupa
      tl.to(q(".s03-preg"), { scale: 0.2, opacity: 0, svgOrigin: "540 900", duration: 0.22, ease: "power2.in" }, OFERTAS - 0.22);

      // figurita: aparece mirando a la izquierda, barre con la lupa
      gsap.set(q(".s03-flip"), { scaleX: -1, svgOrigin: "0 0" });
      gsap.set(q(".s03-pct"), { scaleX: -1, svgOrigin: "52 -94" });
      tl.to(q(".s03-pct"), { scaleX: 1, svgOrigin: "52 -94", duration: 0.22, ease: "power2.inOut" }, NO + 0.2);
      pop(q(".s03-fig"), OFERTAS - 0.04, "0 0");
      pop(q(".s03-lupa"), OFERTAS + 0.08, "22 -64");
      tl.fromTo(q(".s03-suelo"), { opacity: 0, scaleX: 0.3, svgOrigin: "540 1110" }, { opacity: 1, scaleX: 1, svgOrigin: "540 1110", duration: 0.5, ease: "power3.out" }, OFERTAS);
      tl.fromTo(q(".s03-lupa"), { rotation: 0, svgOrigin: "0 -70" }, { rotation: -14, svgOrigin: "0 -70", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, OFERTAS + 0.4);
      tl.fromTo(q(".s03-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, OFERTAS);

      // "no es tuyo": aparece tu local apagado; la figurita se achica y le da la espalda
      tl.to(q(".s03-fig"), { scale: 0.72, svgOrigin: "0 0", duration: 0.4, ease: "power3.out" }, NO - 0.15);
      dibujar(qa(".s03-dib-a"), NO - 0.1, 0.45);
      tl.to(qa(".s03-dib-a"), { opacity: 0.4, duration: 0.3 }, NO + 0.4);
      tl.to(q(".s03-flip"), { scaleX: 1, svgOrigin: "0 0", duration: 0.22, ease: "power2.inOut" }, NO + 0.2);
      tl.fromTo(q(".s03-fig"), { y: 0 }, { y: -10, duration: 0.12, ease: "sine.out", yoyo: true, repeat: 1, immediateRender: false }, NO + 0.2);
      tl.to(q(".s03-fig"), { rotation: 4, svgOrigin: "0 0", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1 }, NO + 0.6);

      // "próximo descuento": aparece el otro local con su -40%, la figurita camina hacia él
      dibujar(qa(".s03-dib-b"), PROXIMO - 0.2, 0.45);
      gsap.set(qa(".s03-luz-b"), { opacity: 0 });
      tl.to(qa(".s03-luz-b"), { opacity: 0.85, duration: 0.2, stagger: 0.08 }, PROXIMO + 0.25);
      tl.fromTo(q(".s03-tag"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.38, ease: "back.out(2)" }, PROXIMO);
      tl.fromTo(q(".s03-tag"), { rotation: -7, svgOrigin: "0 -146" }, { rotation: 7, svgOrigin: "0 -146", duration: 0.26, ease: "sine.inOut", yoyo: true, repeat: 3 }, PROXIMO + 0.3);
      tl.to(q(".s03-fig"), { x: 40, duration: 0.95, ease: "power1.inOut" }, DESCUENTO - 0.2);
      tl.fromTo(q(".s03-fig"), { y: 0 }, { y: -6, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, DESCUENTO - 0.2);
      tl.to(q(".s03-e1"), { opacity: 0, duration: 0.2 }, PROXIMO - 0.1);
      tl.fromTo(q(".s03-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, PROXIMO + 0.05);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      // escala de tiempo: la escena se armó con otra locución, se estira para calzar con la de Gemini
      tl.paused(false);
      tl.timeScale(0.9027);
      const tlx = gsap.timeline({ paused: true });
      tlx.add(tl, 0);
      window.__timelines[ID] = tlx;
    })();
  </script>
