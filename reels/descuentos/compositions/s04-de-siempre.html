<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s04-de-siempre"] .s04-capa { position: absolute; inset: 0; }
    [data-composition-id="s04-de-siempre"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s04-de-siempre"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s04-de-siempre"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s04-de-siempre"] .ln-f { stroke-width: 3; }
    [data-composition-id="s04-de-siempre"] .ln-ap { stroke: rgba(239, 238, 229, 0.4); }
    [data-composition-id="s04-de-siempre"] .tacha { stroke-width: 8; }
    [data-composition-id="s04-de-siempre"] .precio { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 72px; letter-spacing: -0.02em; fill: #efeee5; }
    [data-composition-id="s04-de-siempre"] .precio-ac { fill: #5ce611; }
    [data-composition-id="s04-de-siempre"] .moneda-txt { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; fill: #5ce611; }
    [data-composition-id="s04-de-siempre"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s04-de-siempre"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s04-de-siempre" data-width="1080" data-height="1920" data-duration="6.98">
    <div id="s04-escena" class="s04-capa clip" data-start="0" data-duration="6.98" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s04-suelo" x1="190" y1="1110" x2="530" y2="1110" />
        <!-- el cliente de siempre -->
        <g transform="translate(360 1110) scale(1.7)">
          <g class="s04-fig">
            <circle class="ln ln-f s04-fig-dib" cx="0" cy="-96" r="14" />
            <path class="ln ln-f s04-fig-dib" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" />
            <!-- flecha de "vuelve" sobre la cabeza -->
            <g class="s04-vuelta">
              <path class="ln-ac ln-f s04-vuelta-arco" d="M-24 -168 A24 24 0 1 1 -6 -145" />
              <path class="ln-ac ln-f s04-vuelta-punta" d="M-17 -153 L-6 -145 L-18 -136" />
            </g>
            <!-- globo: ya lo iba a comprar -->
            <g transform="translate(-22 -14)"><g class="s04-globo">
              <path class="ln ln-f s04-globo-dib" d="M-104 -246 H-44 Q-34 -246 -34 -236 V-200 Q-34 -190 -44 -190 H-56 L-30 -168 L-74 -190 H-104 Q-114 -190 -114 -200 V-236 Q-114 -246 -104 -246 Z" />
              <path class="ln-ac ln-f s04-tilde" d="M-92 -218 L-80 -206 L-56 -232" />
            </g></g>
          </g>
        </g>
        <!-- el ticket -->
        <g transform="translate(20 0)"><g class="s04-ticket">
          <path class="ln s04-tk-dib" d="M600 700 H860 V1060 l-20 20 l-20 -20 l-20 20 l-20 -20 l-20 20 l-20 -20 l-20 20 l-20 -20 l-20 20 l-20 -20 l-20 20 l-20 -20 l-20 20 l-20 -20 V700 Z" />
          <line class="ln ln-ap s04-tk-dib" x1="640" y1="752" x2="760" y2="752" />
          <line class="ln ln-ap s04-tk-dib" x1="640" y1="784" x2="820" y2="784" />
          <text class="precio s04-p400" x="730" y="910" text-anchor="middle">$ 400</text>
          <line class="ln-ac tacha s04-tacha" x1="618" y1="884" x2="842" y2="872" />
          <text class="precio precio-ac s04-p200" x="730" y="1022" text-anchor="middle">$ 200</text>
        </g></g>
        <!-- monedas que se caen del ticket -->
        <g class="s04-mon"><circle class="ln-ac" cx="0" cy="0" r="26" /><text class="moneda-txt" x="0" y="10" text-anchor="middle">$</text></g>
        <g class="s04-mon"><circle class="ln-ac" cx="0" cy="0" r="26" /><text class="moneda-txt" x="0" y="10" text-anchor="middle">$</text></g>
        <g class="s04-mon"><circle class="ln-ac" cx="0" cy="0" r="26" /><text class="moneda-txt" x="0" y="10" text-anchor="middle">$</text></g>
      </svg>
      <div class="etiqueta"><span class="s04-e1">Precio lleno</span><span class="s04-e2">Iba a comprar igual</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s04-de-siempre";
      const DUR = 6.05;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CLIENTE = 1.13;
      const SIEMPRE = 1.57;
      const PAGABA = 2.13;
      const PRECIO = 2.74;
      const COBRASTE = 3.71;
      const MENOS = 4.08;
      const IBA = 4.83;
      const IGUAL = 5.32;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.6, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.8)" }, t);
      };

      // la figurita arranca medio dibujada (el cuadro 0 no puede ser negro)
      dibujar(qa(".s04-fig-dib"), 0, 0.6, 0.45);
      tl.fromTo(q(".s04-suelo"), { scaleX: 0.3, svgOrigin: "360 1110" }, { scaleX: 1, svgOrigin: "360 1110", duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo(q(".s04-fig"), { y: 0 }, { y: -6, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.1);

      // "cliente de siempre": la flecha de vuelve se dibuja y da la vuelta
      const arco = q(".s04-vuelta-arco");
      dibujar([arco], CLIENTE, 0.4);
      tl.fromTo(q(".s04-vuelta-punta"), { opacity: 0 }, { opacity: 1, duration: 0.12 }, CLIENTE + 0.38);
      tl.to(q(".s04-vuelta"), { rotation: 360, svgOrigin: "0 -168", duration: 0.8, ease: "power2.inOut" }, SIEMPRE);

      // "el que pagaba precio lleno": el ticket con $ 400
      dibujar(qa(".s04-tk-dib"), PAGABA, 0.5);
      tl.fromTo(q(".s04-p400"), { opacity: 0, scale: 1.4, svgOrigin: "730 880" }, { opacity: 1, scale: 1, svgOrigin: "730 880", duration: 0.3, ease: "power3.out" }, PRECIO);
      tl.fromTo(q(".s04-ticket"), { rotation: 0, svgOrigin: "730 700" }, { rotation: 2, svgOrigin: "730 700", duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, PRECIO + 0.25);
      tl.fromTo(q(".s04-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, PRECIO);

      // "cobraste menos": se tacha el 400, aparece $ 200 y se caen monedas
      dibujar([q(".s04-tacha")], COBRASTE, 0.25);
      tl.to(q(".s04-p400"), { opacity: 0.4, duration: 0.25 }, COBRASTE + 0.2);
      tl.fromTo(q(".s04-p200"), { opacity: 0, scale: 1.4, svgOrigin: "730 992" }, { opacity: 1, scale: 1, svgOrigin: "730 992", duration: 0.3, ease: "power3.out" }, MENOS - 0.05);
      const xs = [700, 800, 750];
      qa(".s04-mon").forEach((m, i) => {
        const t0 = MENOS + 0.1 + i * 0.16;
        tl.fromTo(m, { x: xs[i], y: 1060, opacity: 0, rotation: 0 }, { y: 1080, opacity: 1, duration: 0.1, ease: "none" }, t0);
        tl.to(m, { y: 1220, rotation: (i % 2 ? 1 : -1) * 90, duration: 0.5, ease: "power2.in" }, t0 + 0.1);
        tl.to(m, { opacity: 0, duration: 0.18 }, t0 + 0.42);
      });

      // "iba a comprar igual": globo con tilde sobre la figurita
      pop(q(".s04-globo"), IBA - 0.05, "-30 -168");
      dibujar([q(".s04-tilde")], IBA + 0.15, 0.3);
      tl.to(q(".s04-fig"), { y: -10, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, IGUAL);
      tl.to(q(".s04-e1"), { opacity: 0, duration: 0.2 }, IBA - 0.1);
      tl.fromTo(q(".s04-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, IBA + 0.05);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      // escala de tiempo: la escena se armó con otra locución, se estira para calzar con la de Gemini
      tl.paused(false);
      tl.timeScale(0.8668);
      const tlx = gsap.timeline({ paused: true });
      tlx.add(tl, 0);
      window.__timelines[ID] = tlx;
    })();
  </script>
</template>
