  <div id="root" data-composition-id="s07-no-es-lo-mismo" data-width="1080" data-height="1920" data-duration="6.62">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="6.62" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <path class="ln-ac s07-divisor" d="M540 680 V1200" />

        <!-- izquierda: el descuento le regala plata a cualquiera -->
        <g class="s07-izq">
          <g class="s07-tag">
            <path class="ln s07-dib-tag" d="M180 820 L230 755 H390 Q400 755 400 765 V875 Q400 885 390 885 H230 Z" />
            <circle class="ln s07-dib-tag" cx="216" cy="820" r="9" />

            <text class="precio s07-precio" x="313" y="840" text-anchor="middle">-50<tspan class="precio-ac">%</tspan></text>
          </g>
          <g class="s07-mon"><circle class="ln-ac" cx="0" cy="0" r="20" /><text class="moneda-txt" data-layout-ignore x="0" y="9" text-anchor="middle">$</text></g>
          <g class="s07-mon"><circle class="ln-ac" cx="0" cy="0" r="20" /><text class="moneda-txt" data-layout-ignore x="0" y="9" text-anchor="middle">$</text></g>
          <g class="s07-mon"><circle class="ln-ac" cx="0" cy="0" r="20" /><text class="moneda-txt" data-layout-ignore x="0" y="9" text-anchor="middle">$</text></g>
          <g class="s07-mon"><circle class="ln-ac" cx="0" cy="0" r="20" /><text class="moneda-txt" data-layout-ignore x="0" y="9" text-anchor="middle">$</text></g>
          <!-- cuatro cualquiera -->
          <g class="s07-cq" data-x="110"><circle class="ln" cx="0" cy="-104" r="16" /><path class="ln" d="M0 -88 V-42 M0 -76 L-20 -56 M0 -76 L20 -56 M0 -42 L-15 0 M0 -42 L15 0" /><text class="duda s07-duda" x="0" y="-136" text-anchor="middle">?</text></g>
          <g class="s07-cq" data-x="215"><circle class="ln" cx="0" cy="-104" r="16" /><path class="ln" d="M0 -88 V-42 M0 -76 L-20 -56 M0 -76 L20 -56 M0 -42 L-15 0 M0 -42 L15 0" /><text class="duda s07-duda" x="0" y="-136" text-anchor="middle">?</text></g>
          <g class="s07-cq" data-x="320"><circle class="ln" cx="0" cy="-104" r="16" /><path class="ln" d="M0 -88 V-42 M0 -76 L-20 -56 M0 -76 L20 -56 M0 -42 L-15 0 M0 -42 L15 0" /><text class="duda s07-duda" x="0" y="-136" text-anchor="middle">?</text></g>
          <g class="s07-cq" data-x="425"><circle class="ln" cx="0" cy="-104" r="16" /><path class="ln" d="M0 -88 V-42 M0 -76 L-20 -56 M0 -76 L20 -56 M0 -42 L-15 0 M0 -42 L15 0" /><text class="duda s07-duda" x="0" y="-136" text-anchor="middle">?</text></g>
          <text class="rotulo rotulo-cr s07-rot-izq" x="270" y="1226" text-anchor="middle">DESCUENTO</text>

  <script>
    (function () {
      const ID = "s07-no-es-lo-mismo";
      const DUR = 5.49;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const MISMO = 0.41;
      const DESCUENTO = 1.3;
      const REGALA = 1.86;
      const CUALQUIERA = 2.63;
      const PREMIO = 3.68;
      const SOLO = 4.34;
      const VUELVE = 4.75;

      const SUELO = 1130;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };
      const pop = (el, t, dur) => tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: dur ?? 0.35, ease: "back.out(1.6)" }, t);

      // "No es lo mismo": la línea divide la pantalla (arranca ya medio dibujada)
      dibujar([q(".s07-divisor")], 0, 0.55, 0.5);
      tl.fromTo(q(".s07-divisor"), { scaleY: 0.96, svgOrigin: "540 940" }, { scaleY: 1, svgOrigin: "540 940", duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, MISMO);

      // los cuatro cualquiera ya están esperando (apagados)
      const cq = qa(".s07-cq");
      cq.forEach((g, i) => {
        gsap.set(g, { x: Number(g.dataset.x), y: SUELO });
        tl.fromTo(g, { opacity: 0 }, { opacity: 0.45, duration: 0.3 }, 0.5 + i * 0.08);
      });
      gsap.set(qa(".s07-duda"), { opacity: 0 });

      // "descuento": la etiqueta % de s01
      dibujar(qa(".s07-dib-tag"), DESCUENTO - 0.2, 0.45);
      tl.fromTo(q(".s07-precio"), { opacity: 0, scale: 1.4, svgOrigin: "313 820" }, { opacity: 1, scale: 1, svgOrigin: "313 820", duration: 0.3, ease: "power3.out" }, DESCUENTO);
      tl.fromTo(q(".s07-tag"), { rotation: 0, svgOrigin: "180 720" }, { rotation: 4, svgOrigin: "180 720", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, DESCUENTO + 0.1);
      tl.fromTo(q(".s07-rot-izq"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, DESCUENTO);

      // "regala plata": tira monedas a los cuatro
      qa(".s07-mon").forEach((m, i) => {
        const t0 = REGALA + i * 0.16;
        const xf = Number(cq[i].dataset.x) + 26;
        tl.fromTo(m, { x: 300, y: 885, opacity: 0, rotation: 0 }, { opacity: 1, duration: 0.06 }, t0);
        tl.fromTo(m, { x: 300 }, { x: xf, duration: 0.42, ease: "none", immediateRender: false }, t0);
        tl.fromTo(m, { y: 885 }, { y: 1066, duration: 0.42, ease: "back.in(2.2)", immediateRender: false }, t0);
        tl.to(m, { rotation: (i % 2 ? 1 : -1) * 180, duration: 0.42, ease: "none" }, t0);
        tl.to(m, { opacity: 0, duration: 0.12 }, t0 + 0.42);
        tl.to(cq[i], { opacity: 1, duration: 0.15 }, t0 + 0.38);
        tl.to(cq[i], { y: SUELO - 12, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, t0 + 0.42);
      });
      // "cualquiera": signos de pregunta sobre cada cabeza
      qa(".s07-duda").forEach((d, i) => pop(d, CUALQUIERA + i * 0.07, 0.3));
      tl.fromTo(qa(".s07-duda"), { rotation: -8, transformOrigin: "50% 100%" }, { rotation: 8, transformOrigin: "50% 100%", duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, CUALQUIERA + 0.35);
      // después del premio, la izquierda se apaga un poco
      tl.to(q(".s07-izq"), { opacity: 0.55, duration: 0.4 }, PREMIO);

      // "premio": caja de regalo con moño verde
      pop(q(".s07-regalo"), PREMIO, 0.4);
      tl.fromTo(q(".s07-regalo"), { rotation: -6, svgOrigin: "795 886" }, { rotation: 6, svgOrigin: "795 886", duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, PREMIO + 0.35);
      tl.fromTo(q(".s07-rot-der"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, PREMIO);

      // "solo al que vuelve": aparece uno solo y el regalo va hacia él
      dibujar(qa(".s07-dib-fiel"), SOLO - 0.1, 0.4);
      tl.to(q(".s07-regalo"), { x: 82, y: 236, scale: 0.55, svgOrigin: "795 886", duration: 0.4, ease: "power3.inOut" }, SOLO + 0.15);
      const arco = q(".s07-vuelta-arco");
      const La = arco.getTotalLength();
      gsap.set(arco, { strokeDasharray: La, strokeDashoffset: La, opacity: 0 });
      tl.to(arco, { opacity: 1, duration: 0.04 }, VUELVE - 0.1);
      tl.to(arco, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, VUELVE - 0.1);
      tl.fromTo(q(".s07-vuelta-punta"), { opacity: 0 }, { opacity: 1, duration: 0.12 }, VUELVE + 0.2);
      tl.to(q(".s07-vuelta"), { rotation: 360, svgOrigin: "760 880", duration: 0.7, ease: "power2.inOut" }, VUELVE + 0.3);
      tl.to(q(".s07-fiel"), { y: -12, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, VUELVE + 0.05);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      // escala de tiempo: la escena se armó con otra locución, se estira para calzar con la de Gemini
      tl.paused(false);
      tl.timeScale(0.8293);
      const tlx = gsap.timeline({ paused: true });
      tlx.add(tl, 0);
      window.__timelines[ID] = tlx;
    })();
  </script>
