<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s09-marca"] .s09-capa { position: absolute; inset: 0; }
    [data-composition-id="s09-marca"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s09-marca"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s09-marca"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s09-marca"] .s09-nombre { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 64px; letter-spacing: -0.01em; }
    [data-composition-id="s09-marca"] .s09-crema { fill: #efeee5; }
    [data-composition-id="s09-marca"] .s09-verde { fill: #5ce611; }
    [data-composition-id="s09-marca"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s09-marca"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s09-marca" data-width="1080" data-height="1920" data-duration="2.32">
    <div id="s09-escena" class="s09-capa clip" data-start="0" data-duration="2.32" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- caja de marca: geometría centrada en 540,900 -->
        <g class="s09-caja">
          <g transform="translate(540 900)">
            <rect class="ln s09-borde" x="-330" y="-70" width="660" height="140" rx="30" />
            <text class="s09-nombre s09-crema s09-w1" x="22" y="23" text-anchor="end">Scalerics</text>
            <text class="s09-nombre s09-verde s09-w2" x="40" y="23" text-anchor="start">Puntos</text>
            <!-- esquinitas verdes que marcan la caja en "Puntos" -->
            <path class="ln-ac s09-esq" d="M-366 -60 V-106 H-320" />
            <path class="ln-ac s09-esq" d="M366 60 V106 H320" />
          </g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s09-e1">Premios, no descuentos</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s09-marca";
      const DUR = 1.92;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SCALERICS = 0.62;
      const PUNTOS = 1.08;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };

      const O = "540 900";

      // "Por eso hicimos": la caja se dibuja (arranca ya empezada: el cuadro 0 no queda vacío)
      dibujar([q(".s09-borde")], 0, 0.55, 0.7);
      gsap.set(q(".s09-borde"), { opacity: 1 });
      tl.fromTo(q(".s09-caja"), { scale: 0.9, svgOrigin: O }, { scale: 1, svgOrigin: O, duration: 0.6, ease: "power3.out" }, 0);

      // "Scalerics": entra con golpe
      tl.fromTo(q(".s09-w1"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, SCALERICS);

      // "Puntos": pop + pulso de la caja + esquinas verdes
      tl.fromTo(q(".s09-w2"), { opacity: 0, scale: 0.8, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)" }, PUNTOS);
      tl.to(q(".s09-caja"), { scale: 1.07, svgOrigin: O, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, PUNTOS + 0.04);
      dibujar(qa(".s09-esq"), PUNTOS + 0.06, 0.3);
      tl.fromTo(q(".s09-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, SCALERICS + 0.12);
      // acercamiento leve hasta la salida (nada quieto)
      tl.to(q(".s09-caja"), { scale: 1.04, svgOrigin: O, duration: DUR - 0.3 - (PUNTOS + 0.3), ease: "sine.inOut" }, PUNTOS + 0.3);

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      // escala de tiempo: la escena se armó con otra locución, se estira para calzar con la de Gemini
      tl.paused(false);
      tl.timeScale(0.8276);
      const tlx = gsap.timeline({ paused: true });
      tlx.add(tl, 0);
      window.__timelines[ID] = tlx;
    })();
  </script>
</template>
