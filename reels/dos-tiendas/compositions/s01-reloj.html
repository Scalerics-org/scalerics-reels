    (function () {
      const ID = "s01-reloj";
      const DUR = 6.14;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, s0) => tl.fromTo(el, { opacity: 0, scale: s0 ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.6)" }, t);
      const punch = (el, t, s) => tl.to(el, { scale: s ?? 1.08, transformOrigin: "50% 50%", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const etq = (k, t) => {
        if (k > 1) tl.to(q(".s01-e" + (k - 1)), { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(q(".s01-e" + k), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      const aparecer = (el, t, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d ?? 0.3 }, t);
      // persiana: baja desde arriba (coordenadas locales de la tienda)
      const bajar = (el, t, d) => {
        tl.fromTo(el, { scaleY: 0, svgOrigin: "0 -196" }, { scaleY: 1, svgOrigin: "0 -196", duration: d ?? 0.5, ease: "power2.in" }, t);
        tl.to(el, { y: -6, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, t + (d ?? 0.5));
      };
      // los dos puntos del reloj titilan
      const titilar = (el, t0, t1) => { for (let t = t0; t < t1 - 0.5; t += 1) tl.to(el, { attr: { "fill-opacity": 0.15 }, duration: 0.12, yoyo: true, repeat: 1, repeatDelay: 0.26 }, t); };


      const TIENDAS = 0.38, IGUALES = 0.57, ONCE = 1.14, CUARENTA = 1.91, NOCHE = 2.57, CERRO = 3.43, OTRA = 4.38, VEND = 5.14;

      tl.fromTo(q(".s01-rl text"), { opacity: 0.35 }, { opacity: 1, duration: 0.3 }, 0.1);
      dibujar(qa(".s01-ta-d, .s01-ta-ropa path"), 0, 0.6, 0.4);
      tl.fromTo(q(".s01-ta-nom"), { opacity: 0.3 }, { opacity: 1, duration: 0.3 }, 0.15);

      punch(q(".s01-rl"), CUARENTA, 1.07);
      pop(q(".s01-luna"), NOCHE - 0.1, 0.6);

      etq(1, 0.2); etq(2, CERRO); etq(3, VEND - 0.35);
