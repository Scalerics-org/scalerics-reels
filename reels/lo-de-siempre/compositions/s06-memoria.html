        tl.fromTo(q(".e" + k), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
        etqN = k;
      };

      const MEMORIA = 0.84, LLEVA = 1.44, UNO = 1.74, AHORA = 2.65, TRABAJA = 3.24;
