    (function () {
      const ID = "s11-llena";
      const DUR = 3.45;

          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });

          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });

      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);

      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      tl.fromTo(qa(".s11-agenda .hora, .s11-agenda .ln-tenue, .s11-t, .s11-hueco, .s11-tij"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
      // seguís cortando
      for (let k = 0; k < 8; k++) {
        const t = 0.25 + k * 0.36;
        tl.to(qa(".s11-h1"), { rotation: -12, svgOrigin: "590 846", duration: 0.12, yoyo: true, repeat: 1 }, t);
        tl.to(qa(".s11-h2"), { rotation: 12, svgOrigin: "590 846", duration: 0.12, yoyo: true, repeat: 1 }, t);

        tl.fromTo(n, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, t);

      dibujar(qa(".s11-tic"), LLENA - 0.1, 0.25);
