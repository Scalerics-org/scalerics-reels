  <script>
    (function () {
      const ID = "s03-manos";
      const DUR = 3.73;

      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };


      const SABADO = 0.33, MANOS = 1.93, OCUPADAS = 2.23, CLIENTA = 3.63;
      tl.fromTo(q("svg"), { scale: 0.97, svgOrigin: "540 950" }, { scale: 1.02, svgOrigin: "540 950", duration: DUR, ease: "none" }, 0);
      dibujar(qa(".s03-dib"), 0, 0.6, 0.45);
      dibujar(qa(".s03-cli"), 0, 0.6, 0.5);
      dibujar(qa(".s03-vos"), 0.15, 0.6);
      tl.fromTo(qa(".s03-peine, .s03-tijera"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.6);
      dibujar([q(".s03-tel")], 0.5, 0.4);
      // "sábado"
      pop(q(".s03-taco"), SABADO - 0.05, "310 710");
      etq(".s03-e1", SABADO);
      // la tijera corta todo el tiempo, más fuerte en "manos ocupadas"
      for (let k = 0; k < 8; k++) {
        const t = 0.7 + k * 0.38;
        tl.to(qa(".s03-hoja1"), { rotation: -12, svgOrigin: "590 846", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
        tl.to(qa(".s03-hoja2"), { rotation: 12, svgOrigin: "590 846", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      }
      tl.to(q(".s03-peine"), { x: -16, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.8);
      gsap.set(qa(".s03-mano"), { opacity: 0 });
      dibujar(qa(".s03-mano"), MANOS - 0.1, 0.45);
      punch(q(".s03-tijera"), OCUPADAS, "596 850", 1.15);
      punch(q(".s03-mano"), OCUPADAS + 0.1, "600 826", 1.08);
      etq(".s03-e2", MANOS);
      // el celular, solo en el mostrador
      tl.to(q(".s03-tel"), { x: 3, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, 2.9);
      // "clienta": la clienta asiente
      tl.to(qa(".s03-cli")[0], { y: 6, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, CLIENTA - 0.4);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
