  <script>
    (function () {
      const ID = "s02-no-es";
      const DUR = 3.98;

      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };


      const CRISIS = 0.31, PRECIO = 1.41, INFORMAL = 2.81, NADA = 3.25;
      tl.fromTo(q(".s02-fila"), { x: 10 }, { x: -10, duration: DUR, ease: "none" }, 0);
      // 1: arranca medio dibujado
      dibujar(qa(".s02-d1"), 0, 0.5, 0.45);
      tl.fromTo(q(".s02-n1"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 0.1);
      pop(q(".s02-b1"), CRISIS + 0.25, "345 820");
      tl.to(qa(".s02-d1, .s02-n1"), { opacity: 0.4, duration: 0.3 }, CRISIS + 0.5);
      // 2
      dibujar(qa(".s02-d2"), PRECIO - 0.3, 0.45);
      tl.fromTo(q(".s02-pesos"), { opacity: 0, scale: 0.6, svgOrigin: "518 900" }, { opacity: 1, scale: 1, svgOrigin: "518 900", duration: 0.3, ease: "back.out(2)" }, PRECIO - 0.05);
      tl.fromTo(q(".s02-n2"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, PRECIO - 0.1);
      pop(q(".s02-b2"), PRECIO + 0.25, "625 840");
      tl.to(qa(".s02-d2, .s02-pesos, .s02-n2"), { opacity: 0.4, duration: 0.3 }, PRECIO + 0.5);
      // 3: el reloj corre (la gente que llega tarde o no avisa)
      dibujar(qa(".s02-d3"), INFORMAL - 0.75, 0.45);
      tl.fromTo(qa(".s02-aguja, .s02-aguja2"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, INFORMAL - 0.5);
      tl.fromTo(q(".s02-aguja"), { rotation: 0, svgOrigin: "820 900" }, { rotation: 300, svgOrigin: "820 900", duration: 1.0, ease: "power2.inOut" }, INFORMAL - 0.5);
      tl.fromTo(q(".s02-n3"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, INFORMAL - 0.4);
      pop(q(".s02-b3"), INFORMAL + 0.2, "895 830");
      tl.to(qa(".s02-d3, .s02-aguja, .s02-aguja2, .s02-n3"), { opacity: 0.4, duration: 0.3 }, INFORMAL + 0.45);
      // "nada de eso": los tres badges laten juntos
      etq(".s02-e1", NADA);
      tl.to(qa(".s02-b1, .s02-b2, .s02-b3"), { scale: 1.2, transformOrigin: "50% 50%", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, NADA);

      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
