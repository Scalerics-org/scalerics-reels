  <script>
    (function () {
      const ID = "s10-agenda";
      const DUR = 6.19;

      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };


      const LUGARES = 1.1, AGENDA = 1.9, TURNO = 2.4, Y = 4.03, CONSULTA = 4.3, TE = 5.1, PASA = 5.6;
      dibujar(qa(".s10-dib"), 0, 0.5, 0.45);
      dibujar(qa(".s10-dib2"), 0.05, 0.5, 0.45);
      tl.fromTo(qa(".s10-cab, .s10-agenda text:not(.s10-nueva)"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
      gsap.set(qa(".s10-libres, .s10-ok, .s10-cli2, .s10-vuela, .s10-nueva, .s10-tic, .s10-vos"), { opacity: 0 });
      // "lugares libres": la respuesta con los horarios
      pop(q(".s10-libres"), LUGARES - 0.3, "144 956");
      qa(".s10-chip").forEach((c, i) => tl.fromTo(c, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, LUGARES + i * 0.1));
      etq(".s10-e1", LUGARES);
      // "agenda": elige las 18:00
      tl.to(q(".s10-c18"), { fill: "#5ce611", stroke: "#5ce611", duration: 0.2 }, AGENDA);
      tl.to(q(".s10-t18"), { fill: "#0b1d35", duration: 0.2 }, AGENDA);
      punch(qa(".s10-chip")[2], AGENDA, "228 914", 1.12);
      // "turno": confirmación, flecha a la agenda, la fila se llena
      pop(q(".s10-ok"), TURNO - 0.1, "144 1036");
      dibujar([q(".s10-flecha")], TURNO, 0.4);
      tl.fromTo(q(".s10-punta"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, TURNO + 0.35);
      tl.to(q(".s10-hueco"), { opacity: 0, duration: 0.2 }, TURNO + 0.4);
      tl.fromTo(q(".s10-nueva"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, TURNO + 0.45);
      dibujar([q(".s10-tic")], TURNO + 0.6, 0.3);
      etq(".s10-e2", TURNO);
      punch(q(".s10-agenda"), 3.0, "750 930", 1.04);
      // después: la agenda se va, aparece vos
      tl.to(qa(".s10-agenda, .s10-flecha, .s10-punta"), { opacity: 0, filter: "blur(6px)", duration: 0.3 }, Y - 0.35);
      pop(q(".s10-vos"), Y, "750 920");
      // "consulta": una pregunta que es para vos
      pop(q(".s10-cli2"), CONSULTA - 0.1, "144 1116");
      // "te la pasa": la burbuja vuela hacia vos
      tl.set(q(".s10-vuela"), { opacity: 1 }, TE);
      tl.fromTo(q(".s10-vuela"), { x: 0, y: 0, scale: 1, svgOrigin: "290 1086" }, { x: 460, y: -150, scale: 0.7, svgOrigin: "290 1086", duration: 0.5, ease: "power3.inOut" }, TE);
      tl.to(q(".s10-vuela"), { opacity: 0, duration: 0.15 }, TE + 0.45);
      dibujar([q(".s10-aro")], PASA - 0.15, 0.45);
      punch(q(".s10-vos"), PASA, "750 920", 1.1);
      tl.to(q(".s10-cli2"), { opacity: 0.4, duration: 0.3 }, TE + 0.1);
      etq(".s10-e3", TE);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
