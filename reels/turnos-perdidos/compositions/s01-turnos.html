<template>

  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-turnos"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-turnos"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

    [data-composition-id="s01-turnos"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.3); stroke-width: 3; stroke-linecap: round; }
    [data-composition-id="s01-turnos"] .ln-hueco { fill: none; stroke: rgba(239, 238, 229, 0.45); stroke-width: 3; stroke-dasharray: 10 10; stroke-linecap: round; }
    [data-composition-id="s01-turnos"] .titulo { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 0.08em; fill: #efeee5; }
    [data-composition-id="s01-turnos"] .hora { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; fill: rgba(239, 238, 229, 0.6); }
    [data-composition-id="s01-turnos"] .nombre { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s01-turnos"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s01-turnos"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01-turnos" data-width="1080" data-height="1920" data-duration="3.89">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="3.89" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s01-agenda">
          <!-- la hoja -->
          <rect class="ln s01-dib" x="330" y="650" width="420" height="560" rx="18" />
          <path class="ln s01-dib" d="M400 668 V630 a12 12 0 0 1 24 0 V668" />
          <path class="ln s01-dib" d="M480 668 V630 a12 12 0 0 1 24 0 V668" />
          <path class="ln s01-dib" d="M576 668 V630 a12 12 0 0 1 24 0 V668" />
          <path class="ln s01-dib" d="M656 668 V630 a12 12 0 0 1 24 0 V668" />
          <text class="titulo s01-titulo" x="540" y="726" text-anchor="middle">SÁBADO</text>
          <line class="ln s01-dib" x1="360" y1="752" x2="720" y2="752" />
          <!-- filas: 13:00 a 18:00 -->
          <g class="s01-fila" data-y="800"><text class="hora" x="360" y="809">13:00</text><line class="ln-tenue" x1="360" y1="835" x2="720" y2="835" /><text class="nombre s01-nom" x="462" y="810">Carla</text></g>
          <g class="s01-fila" data-y="870"><text class="hora" x="360" y="879">14:00</text><line class="ln-tenue" x1="360" y1="905" x2="720" y2="905" /><text class="nombre s01-nom s01-nom-p" x="462" y="880">Martina</text></g>
          <g class="s01-fila" data-y="940"><text class="hora" x="360" y="949">15:00</text><line class="ln-tenue" x1="360" y1="975" x2="720" y2="975" /><text class="nombre s01-nom s01-nom-c" x="462" y="950">Lucía</text></g>
          <g class="s01-fila" data-y="1010"><text class="hora" x="360" y="1019">16:00</text><line class="ln-tenue" x1="360" y1="1045" x2="720" y2="1045" /><text class="nombre s01-nom s01-nom-p" x="462" y="1020">Sofía</text></g>
          <g class="s01-fila" data-y="1080"><text class="hora" x="360" y="1089">17:00</text><line class="ln-tenue" x1="360" y1="1115" x2="720" y2="1115" /><text class="nombre s01-nom" x="462" y="1090">Camila</text></g>
          <g class="s01-fila" data-y="1150"><text class="hora" x="360" y="1159">18:00</text><text class="nombre s01-nom s01-nom-p" x="462" y="1160">Valentina</text></g>
          <!-- huecos: turnos que nunca llegaron (sin contestar) -->
          <rect class="ln-hueco s01-hueco" x="452" y="850" width="210" height="42" rx="10" />
          <rect class="ln-hueco s01-hueco" x="452" y="990" width="210" height="42" rx="10" />
          <rect class="ln-hueco s01-hueco" x="452" y="1130" width="210" height="42" rx="10" />
          <!-- globito de chat sin contestar al lado de cada hueco -->
          <g class="s01-chat" data-cy="871"><path class="ln-ac" d="M682 857 h40 a8 8 0 0 1 8 8 v14 a8 8 0 0 1 -8 8 h-26 l-10 9 v-9 h-4 a8 8 0 0 1 -8 -8 v-14 a8 8 0 0 1 8 -8 z" /></g>
          <g class="s01-chat" data-cy="1011"><path class="ln-ac" d="M682 997 h40 a8 8 0 0 1 8 8 v14 a8 8 0 0 1 -8 8 h-26 l-10 9 v-9 h-4 a8 8 0 0 1 -8 -8 v-14 a8 8 0 0 1 8 -8 z" /></g>
          <g class="s01-chat" data-cy="1151"><path class="ln-ac" d="M682 1137 h40 a8 8 0 0 1 8 8 v14 a8 8 0 0 1 -8 8 h-26 l-10 9 v-9 h-4 a8 8 0 0 1 -8 -8 v-14 a8 8 0 0 1 8 -8 z" /></g>
          <!-- la única cancelación: tachada -->
          <line class="ln s01-tacha" x1="452" y1="941" x2="560" y2="941" />

      <div class="etiqueta"><span class="s01-e1">Turnos perdidos</span><span class="s01-e2">Más que cancelados</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-turnos";
      const DUR = 3.89;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const TURNOS = 0.8;
      const NO = 1.4;
      const CONTESTAR = 1.6;
      const CANCELACIONES = 2.5;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          // si arranca en el cuadro 0, se ve desde el principio (medio dibujado)
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // la agenda se acerca despacio todo el tiempo
      tl.fromTo(q(".s01-agenda"), { scale: 0.96, svgOrigin: "540 920" }, { scale: 1.03, svgOrigin: "540 920", duration: DUR, ease: "none" }, 0);

      // arranca medio dibujada (el cuadro 0 no puede ser negro)
      dibujar(qa(".s01-dib"), 0, 0.6, 0.45);
      tl.fromTo(q(".s01-titulo"), { opacity: 0.3, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(qa(".s01-fila .hora, .s01-fila .ln-tenue"), { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.03 }, 0.15);

      // "turnos": se escriben los nombres, uno tras otro
      tl.fromTo(qa(".s01-nom"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", stagger: 0.07 }, TURNOS - 0.12);
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, TURNOS);

      // "no contestar": tres nombres se borran y quedan huecos con el chat sin contestar
      tl.to(qa(".s01-nom-p"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in", stagger: 0.08 }, NO);
      gsap.set(qa(".s01-hueco"), { opacity: 0 });
      tl.to(qa(".s01-hueco"), { opacity: 1, duration: 0.25, stagger: 0.08 }, CONTESTAR);
      qa(".s01-chat").forEach((c, i) => pop(c, CONTESTAR + 0.1 + i * 0.08, "706 " + c.dataset.cy));

      // "cancelaciones": una sola fila tachada
      dibujar([q(".s01-tacha")], CANCELACIONES, 0.4);
      tl.to(q(".s01-nom-c"), { opacity: 0.45, duration: 0.3 }, CANCELACIONES + 0.2);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.2 }, CANCELACIONES - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CANCELACIONES + 0.1);
      // los huecos laten: los perdidos pesan más
      qa(".s01-chat").forEach((c, i) => tl.to(c, { scale: 1.18, svgOrigin: "706 " + c.dataset.cy, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, CANCELACIONES + 0.6 + i * 0.06));
      tl.to(qa(".s01-hueco"), { stroke: "rgba(92, 230, 17, 0.7)", duration: 0.3, stagger: 0.06 }, CANCELACIONES + 0.6);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
