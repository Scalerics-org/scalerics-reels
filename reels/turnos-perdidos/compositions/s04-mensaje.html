  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s04-mensaje"] .capa { position: absolute; inset: 0; }
    [data-composition-id="s04-mensaje"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s04-mensaje"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s04-mensaje"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s04-mensaje"] .ln-fino { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s04-mensaje"] .ln-fino-ac { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s04-mensaje"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.3); stroke-width: 3; stroke-linecap: round; }
    [data-composition-id="s04-mensaje"] .ln-hueco { fill: none; stroke: rgba(239, 238, 229, 0.45); stroke-width: 3; stroke-dasharray: 10 10; stroke-linecap: round; }
    [data-composition-id="s04-mensaje"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; }

    [data-composition-id="s04-mensaje"] .titulo { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 0.08em; fill: #efeee5; }
    [data-composition-id="s04-mensaje"] .hora { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; fill: rgba(239, 238, 229, 0.6); }
    [data-composition-id="s04-mensaje"] .nombre { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s04-mensaje"] .ui { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 26px; fill: #efeee5; }
    [data-composition-id="s04-mensaje"] .ui-b { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s04-mensaje"] .ui-ac { fill: #5ce611; }
    [data-composition-id="s04-mensaje"] .rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: #efeee5; }
    [data-composition-id="s04-mensaje"] .rotulo-ac { fill: #5ce611; }
    [data-composition-id="s04-mensaje"] .grande { font-family: "Lexend", sans-serif; font-weight: 600; fill: #5ce611; }
    [data-composition-id="s04-mensaje"] .navy { fill: #0b1d35; }
    [data-composition-id="s04-mensaje"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s04-mensaje"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s04-mensaje" data-width="1080" data-height="1920" data-duration="4.6">
    <div id="s04-escena" class="capa clip" data-start="0" data-duration="4.6" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">

        <g class="s04-tel">
          <rect class="ln s04-dib" x="350" y="620" width="380" height="600" rx="52" />
          <line class="ln s04-dib" x1="510" y1="648" x2="570" y2="648" />
          <circle class="ln-fino s04-dib" cx="402" cy="712" r="20" />
          <text class="ui-b s04-cab" x="436" y="722">Clienta nueva</text>
          <line class="ln-tenue s04-dib" x1="374" y1="756" x2="706" y2="756" />
          <g class="s04-burbuja">
            <rect class="ln-fino" x="378" y="880" width="300" height="104" rx="22" />
            <g class="s04-puntos"><circle class="relleno" cx="410" cy="932" r="6" /><circle class="relleno" cx="432" cy="932" r="6" /><circle class="relleno" cx="454" cy="932" r="6" /></g>
            <text class="ui s04-txt" x="398" y="922">¿Tenés lugar</text>
            <text class="ui s04-txt" x="398" y="962">hoy a las seis?</text>
          </g>
          <!-- campo para escribir, vacío -->
          <rect class="ln-tenue s04-dib" x="378" y="1136" width="324" height="54" rx="27" />
        </g>
        <!-- notificación -->
        <g class="s04-notif"><circle class="relleno" cx="722" cy="630" r="26" /><text class="ui-b navy" x="722" y="640" text-anchor="middle">1</text></g>
        <!-- vibración -->
        <path class="ln-fino-ac s04-vib" d="M322 860 q-14 30 0 60 M296 845 q-22 45 0 90" />
        <path class="ln-fino-ac s04-vib" d="M758 860 q14 30 0 60 M784 845 q22 45 0 90" />
        <!-- la tijera chica: seguís cortando -->
        <g class="s04-tijera">
          <path class="ln-fino s04-h1" d="M230 720 L180 694" />
          <path class="ln-fino s04-h2" d="M230 720 L180 746" />
          <circle class="ln-fino s04-h1" cx="246" cy="706" r="10" />
          <circle class="ln-fino s04-h2" cx="246" cy="734" r="10" />
        </g>

      </svg>
      <div class="etiqueta"><span class="s04-e1">Nuevo mensaje</span><span class="s04-e2">Quiere un turno</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s04-mensaje";
      const DUR = 4.6;

      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };


      const CELULAR = 1.1, ENTRA = 1.3, MENSAJE = 2.0, TENES = 2.97, SEIS = 3.9;
      tl.fromTo(q(".s04-tel"), { scale: 0.97, svgOrigin: "540 920" }, { scale: 1.02, svgOrigin: "540 920", duration: DUR, ease: "none" }, 0);
      dibujar(qa(".s04-dib"), 0, 0.6, 0.45);
      tl.fromTo(q(".s04-cab"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);
      // la tijera sigue (vos seguís ocupado)
      tl.fromTo(q(".s04-tijera"), { opacity: 0 }, { opacity: 0.8, duration: 0.3 }, 0.1);
      for (let k = 0; k < 11; k++) {
        const t = 0.3 + k * 0.38;
        tl.to(qa(".s04-h1"), { rotation: -12, svgOrigin: "230 720", duration: 0.12, yoyo: true, repeat: 1 }, t);
        tl.to(qa(".s04-h2"), { rotation: 12, svgOrigin: "230 720", duration: 0.12, yoyo: true, repeat: 1 }, t);
      }
      // "celular": vibra
      gsap.set(qa(".s04-vib"), { opacity: 0 });
      tl.to(qa(".s04-vib"), { opacity: 1, duration: 0.08 }, CELULAR);
      tl.to(q(".s04-tel"), { x: 6, duration: 0.05, ease: "none", yoyo: true, repeat: 9 }, CELULAR);
      tl.to(qa(".s04-vib"), { opacity: 0, duration: 0.2 }, CELULAR + 0.55);
      // "entra": notificación
      pop(q(".s04-notif"), ENTRA, "722 630");
      // "mensaje": la burbuja, con los puntitos
      gsap.set(qa(".s04-txt"), { opacity: 0 });
      pop(q(".s04-burbuja"), MENSAJE, "378 984");
      etq(".s04-e1", MENSAJE);
      qa(".s04-puntos circle").forEach((c, i) => tl.to(c, { y: -8, duration: 0.15, yoyo: true, repeat: 3 }, MENSAJE + 0.25 + i * 0.08));
      // "¿Tenés lugar hoy a las seis?"
      tl.to(q(".s04-puntos"), { opacity: 0, duration: 0.12 }, TENES - 0.1);
      tl.to(qa(".s04-txt"), { opacity: 1, duration: 0.25, stagger: 0.35 }, TENES - 0.05);
      etq(".s04-e2", TENES + 0.3);
      punch(q(".s04-burbuja"), SEIS, "528 932", 1.06);
      punch(q(".s04-notif"), SEIS + 0.1, "722 630", 1.2);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
