    (function () {
      const ID = "s06-no-lo-ves";
      const DUR = 5.41;

      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };


      const TURNO = 0.3, NO = 0.6, VES = 1.1, CANCELACION = 2.3, ALGUIEN = 3.3, LLEGO = 3.9, AGENDA = 4.4;
      dibujar(qa(".s06-dib"), 0, 0.5, 0.45);
      tl.fromTo(qa(".s06-txt"), { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.02 }, 0);
      gsap.set(q(".s06-hueco"), { opacity: 0 });
      // "turno": el hueco de las 18:00 se marca
      tl.to(q(".s06-hueco"), { opacity: 1, stroke: "#5ce611", duration: 0.2 }, TURNO);
      punch(q(".s06-hueco"), TURNO + 0.1, "557 1151", 1.1);
      // "no lo ves": se desvanece y aparece el ojo tachado
      tl.to(q(".s06-hueco"), { opacity: 0.12, duration: 0.5, ease: "power2.in" }, NO + 0.1);
      pop(q(".s06-ojo"), VES - 0.15, "850 1151");
      etq(".s06-e1", NO);
      tl.to(q(".s06-ojo"), { opacity: 0, duration: 0.25 }, CANCELACION - 0.4);
      // la agenda se corre; "cancelación": la tarjeta tachada, con X (no es esto)
      tl.to(q(".s06-agenda"), { x: -150, duration: 0.45, ease: "power3.inOut" }, CANCELACION - 0.45);
      pop(q(".s06-canc"), CANCELACION, "800 835");
      pop(q(".s06-b1"), CANCELACION + 0.35, "950 790");
      tl.to(qa(".s06-canc, .s06-b1"), { opacity: 0, duration: 0.25 }, ALGUIEN - 0.2);
      // "alguien que nunca llegó": camina hacia la agenda, se frena y se esfuma
      const p = q(".s06-p");
      tl.fromTo(p, { x: 960, y: 1190, opacity: 0 }, { x: 900, opacity: 1, duration: 0.2, ease: "none" }, ALGUIEN);
      tl.to(p, { x: 700, duration: LLEGO - ALGUIEN - 0.1, ease: "power1.out" }, ALGUIEN + 0.2);
      tl.fromTo(q(".s06-cuerpo"), { rotation: -4, svgOrigin: "0 -52" }, { rotation: 4, svgOrigin: "0 -52", duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 3 }, ALGUIEN);
      tl.to(p, { opacity: 0, filter: "blur(6px)", duration: 0.45, ease: "power2.in" }, LLEGO + 0.15);
      etq(".s06-e2", LLEGO);
      // "agenda": el hueco queda vacío, late
      tl.to(q(".s06-hueco"), { opacity: 1, duration: 0.2 }, AGENDA - 0.1);
      punch(q(".s06-hueco"), AGENDA, "407 1151", 1.12);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
