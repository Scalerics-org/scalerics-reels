  <script>
    (function () {
      const ID = "s08-sistema";
      const DUR = 5.47;

      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };


      const MANO = 1.84, ATENDES = 2.24, SE = 3.25, SISTEMA = 4.24;
      const CX = 540, CY = 910, RIN = 128, ROUT = 168, N = 9;
      const pt = (r, a) => (CX + r * Math.cos(a)).toFixed(1) + " " + (CY + r * Math.sin(a)).toFixed(1);
      let d = "";
      for (let i = 0; i < N; i++) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
        const p0 = pt(RIN, a - 0.2), p1 = pt(ROUT, a - 0.12), p2 = pt(ROUT, a + 0.12), p3 = pt(RIN, a + 0.2);
        const sig = pt(RIN, a + (2 * Math.PI) / N - 0.2);
        d += (i === 0 ? "M" + p0 : "") + " L" + p1 + " L" + p2 + " L" + p3 + " A" + RIN + " " + RIN + " 0 0 1 " + sig;
      }
      q(".s08-dientes").setAttribute("d", d + " Z");

      dibujar(qa(".s08-dib"), 0, 0.55, 0.45);
      tl.fromTo(qa(".s08-h1, .s08-h2"), { opacity: 0.3 }, { opacity: 1, duration: 0.3 }, 0);
      // malabar: el celular tiembla, la tijera corta
      tl.fromTo(q(".s08-tel"), { rotation: -5, svgOrigin: "390 1060" }, { rotation: 5, svgOrigin: "390 1060", duration: 0.32, ease: "sine.inOut", yoyo: true, repeat: 8 }, 0);
      for (let k = 0; k < 8; k++) {
        const t = 0.2 + k * 0.36;
        tl.to(qa(".s08-h1"), { rotation: -10, svgOrigin: "720 900", duration: 0.12, yoyo: true, repeat: 1 }, t);
        tl.to(qa(".s08-h2"), { rotation: 10, svgOrigin: "720 900", duration: 0.12, yoyo: true, repeat: 1 }, t);
      }
      // "mano": badge X
      pop(q(".s08-b1"), MANO, "490 756");
      punch(q(".s08-b1"), ATENDES + 0.1, "490 756", 1.2);
      etq(".s08-e1", MANO);
      // "se arregla": se va todo; "sistema": engranaje
      tl.to(q(".s08-manos"), { opacity: 0, scale: 0.8, filter: "blur(6px)", svgOrigin: "540 910", duration: 0.35, ease: "power2.in" }, SE - 0.1);
      dibujar([q(".s08-dientes")], SE + 0.2, 0.8);
      dibujar([q(".s08-eje")], SE + 0.35, 0.6);
      tl.fromTo(q(".s08-engranaje"), { rotation: -40, svgOrigin: "540 910" }, { rotation: 60, svgOrigin: "540 910", duration: DUR - SE - 0.2, ease: "none" }, SE + 0.2);
      punch(q(".s08-engranaje"), SISTEMA, "540 910", 1.1);
      etq(".s08-e2", SISTEMA);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
