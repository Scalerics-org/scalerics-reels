            <path class="s12-flecha" d="M888 1048 H922 M908 1034 L922 1048 L908 1062" style="fill:none;stroke:#07111f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round" />

  <script>
    (function () {
      const ID = "s12-cta";
      const DUR = 10.93;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const SCALERICS = 0.35, PUERTAS = 2.99, EQUIPO = 4.31, ETIQUETA = 5.05, LUNES = 7.23;
      const dibujar = (el, t, dur, desde) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1), opacity: t <= 0 ? 1 : 0 });
        if (t > 0) tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, Math.max(0, t));
      };
      const etiqueta = (sel, t, antes) => {
        if (antes) tl.to(q(antes), { opacity: 0, y: -10, duration: 0.18 }, t - 0.05);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

      // ---- A: caja de marca (arranca a medio dibujar)
      dibujar(q(".s12-caja-r"), 0, 0.6, 0.5);
      tl.fromTo(q(".marca"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, SCALERICS - 0.15);
      tl.fromTo(q(".bajada"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, SCALERICS + 0.9);
      tl.to(q(".s12-caja"), { scale: 1.04, svgOrigin: "540 715", duration: 0.15, yoyo: true, repeat: 1 }, SCALERICS + 0.9);
      tl.to(q(".s12-caja-r"), { stroke: "#5ce611", duration: 0.3 }, SCALERICS + 0.9);

      // puertas adentro: el local con Diego y el agente
      dibujar(q(".s12-puerta"), PUERTAS - 0.3, 0.6);
      tl.fromTo(q(".s12-diego-a"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, PUERTAS + 0.1);
      tl.fromTo(q(".s12-ag-a"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, PUERTAS + 0.25);
      etiqueta(".s12-e1", PUERTAS);
      // con tu equipo
      dibujar(q(".s12-llave"), EQUIPO - 0.2, 0.45);
      tl.fromTo(q(".s12-eq-t"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3 }, EQUIPO);
      tl.to(q(".s12-diego-a"), { x: 14, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, EQUIPO + 0.1);
      tl.to(q(".s12-ag-a"), { x: -14, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, EQUIPO + 0.1);

      // ---- transición a B
      tl.to(q(".s12-a"), { opacity: 0, y: -40, duration: 0.35, ease: "power2.in" }, ETIQUETA - 0.3);
      gsap.set(q(".s12-b"), { opacity: 0 });
      tl.to(q(".s12-b"), { opacity: 1, duration: 0.3 }, ETIQUETA);
      tl.fromTo(q(".s12-campo"), { scaleX: 0.85, svgOrigin: "540 1048" }, { scaleX: 1, svgOrigin: "540 1048", duration: 0.45, ease: "back.out(1.6)" }, ETIQUETA);
      tl.fromTo(q(".s12-diego-b"), { y: 30 }, { y: 0, duration: 0.45, ease: "back.out(1.6)" }, ETIQUETA);
      tl.to(q(".s12-saludo"), { rotation: 100, svgOrigin: "-72 -210", duration: 0.3, ease: "back.out(2)" }, ETIQUETA + 0.3);
      tl.to(q(".s12-saludo"), { rotation: 80, svgOrigin: "-72 -210", duration: 0.22, yoyo: true, repeat: 3, ease: "sine.inOut" }, ETIQUETA + 0.6);
      etiqueta(".s12-e2", ETIQUETA, ".s12-e1");

      // vapor verde hasta el final
      qa(".s12-v").forEach((v, i) => {
        const L = v.getTotalLength();
        gsap.set(v, { strokeDasharray: L * 0.6 + " " + L });
        tl.fromTo(v, { strokeDashoffset: L * 0.6 }, { strokeDashoffset: -L, duration: 1.0, ease: "none", repeat: 6 }, ETIQUETA + i * 0.45);
      });

      // tipeo de la mención
      const TXT = "@el_encargado";
      const txt = q(".s12-txt");
      const NS = "http://www.w3.org/2000/svg";
      const spans = TXT.split("").map((ch, i) => {
        const s = document.createElementNS(NS, "tspan");
        s.textContent = ch;
        if (i === 0) s.setAttribute("class", "arroba");
        txt.appendChild(s);
        return s;
      });
      const X0 = 170;
      const caret = q(".s12-caret");
      gsap.set(spans, { opacity: 0 });
      caret.setAttribute("x", X0);
      gsap.set(caret, { opacity: 0 });
      tl.set(caret, { opacity: 1 }, ETIQUETA + 0.35);
      const T0 = ETIQUETA + 0.6, PASO = 0.1;
      tl.set(q(".s12-ph"), { opacity: 0 }, T0);
      spans.forEach((s, i) => tl.set(s, { opacity: 1 }, T0 + i * PASO));
      // el cursor de texto sigue a lo tipeado (se mide al renderizar, con la fuente ya cargada)
      tl.to({ v: 0 }, { v: 1, duration: DUR, ease: "none", onUpdate: () => {
        const n = Math.max(0, Math.min(TXT.length, Math.floor((tl.time() - T0) / PASO + 1e-6) + 1));
        let w = 0;
        if (n > 0) { try { w = txt.getSubStringLength(0, n); } catch (e) { w = n * 27; } }
        caret.setAttribute("x", X0 + w + (n > 0 ? 6 : 0));
      } }, 0);
      // titila el cursor de texto antes y después de tipear
      tl.to(caret, { opacity: 0, duration: 0.01, yoyo: true, repeat: 1, repeatDelay: 0.25 }, ETIQUETA + 0.4);
      // "lunes": se manda
      gsap.set(q(".s12-ok"), { opacity: 0 });
      tl.to(q(".s12-enviar"), { scale: 0.85, svgOrigin: "906 1048", duration: 0.08, yoyo: true, repeat: 1 }, LUNES);
      tl.to(q(".s12-flecha"), { opacity: 0, x: 20, duration: 0.15 }, LUNES + 0.05);
      tl.fromTo(q(".s12-ok"), { scale: 0.3, svgOrigin: "906 1048" }, { scale: 1, svgOrigin: "906 1048", duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, LUNES + 0.15);
      tl.set(q(".s12-ok"), { opacity: 1 }, LUNES + 0.15);
      tl.to(q(".s12-campo"), { stroke: "#5ce611", duration: 0.3 }, LUNES + 0.1);
      tl.to(caret, { opacity: 0, duration: 0.1 }, LUNES + 0.1);
      // y queda vivo: el campo late suave
      tl.to(q(".s12-campo"), { scale: 1.02, svgOrigin: "540 1048", duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, LUNES + 0.6);
      tl.to(q(".s12-diego-b"), { y: -6, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, LUNES + 0.4);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
