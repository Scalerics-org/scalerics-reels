  <script>
    (function () {
      const ID = "s03-malabares";
      const DUR = 4.53;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const ANOTA = 0.3, SUMA = 0.92, LLAMA = 1.66, ATIENDE = 3.04;
      const CX = 540, CY = 715, R = 125;
      const etiqueta = (sel, t, antes) => {
        if (antes) tl.to(q(antes), { opacity: 0, y: -10, duration: 0.18 }, t - 0.05);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

      // Diego ya está (viene de s01): entra con un golpecito

      tl.fromTo(q(".s03-diego"), { opacity: 0.6, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0);
      tl.fromTo(q(".s03-ruta"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);

      // órbita: el grupo gira y cada objeto contra-gira para quedar derecho
      const GIRO = 400;
      tl.fromTo(q(".s03-orbita"), { rotation: 0, svgOrigin: CX + " " + CY }, { rotation: GIRO, svgOrigin: CX + " " + CY, duration: DUR, ease: "none" }, 0);
      const tiempos = [ANOTA, SUMA, LLAMA];
      qa(".s03-it").forEach((it, i) => {
        const a = (Number(it.dataset.a) * Math.PI) / 180;
        const x = CX + R * Math.cos(a), y = CY + R * Math.sin(a);
        it.setAttribute("transform", "translate(" + x + " " + y + ")");
        const pop = it.querySelector(".s03-pop");
        tl.fromTo(pop, { rotation: 0, svgOrigin: "0 0" }, { rotation: -GIRO, svgOrigin: "0 0", duration: DUR, ease: "none" }, 0);
        gsap.set(it, { opacity: 0 });
        tl.to(it, { opacity: 1, duration: 0.1 }, tiempos[i] - 0.1);
        tl.fromTo(pop, { scale: 0.4 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, tiempos[i] - 0.1);
      });
      tl.fromTo(q(".s03-onda"), { opacity: 0 }, { opacity: 1, duration: 0.1, yoyo: true, repeat: 7 }, LLAMA);

      // brazos que alternan (malabares)
      tl.fromTo(q(".s03-bi"), { rotation: 0, svgOrigin: "-72 -210" }, { rotation: 55, svgOrigin: "-72 -210", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 13 }, 0);
      tl.fromTo(q(".s03-bd"), { rotation: -55, svgOrigin: "72 -210" }, { rotation: 0, svgOrigin: "72 -210", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 13 }, 0);

      etiqueta(".s03-e1", ANOTA);
      etiqueta(".s03-e2", SUMA, ".s03-e1");
      etiqueta(".s03-e3", LLAMA, ".s03-e2");
      etiqueta(".s03-e4", ATIENDE, ".s03-e3");

      // "llama al de los lácteos"
      tl.fromTo(q(".s03-globo"), { opacity: 0, scale: 0.7, transformOrigin: "90% 100%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, LLAMA + 0.3);
      tl.to(q(".s03-globo"), { opacity: 0, duration: 0.25 }, ATIENDE - 0.1);

      // "atiende al de la puerta"
      qa(".s03-dib-p").forEach((el) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, ATIENDE - 0.2);
        tl.to(el, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, ATIENDE - 0.2);
      });
      tl.fromTo(q(".s03-cli"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, ATIENDE + 0.1);
      tl.fromTo(q(".s03-q"), { opacity: 0, scale: 0.5, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, ATIENDE + 0.45);
      tl.to(q(".s03-cara"), { x: 12, duration: 0.2, ease: "power2.out" }, ATIENDE + 0.3);

      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
