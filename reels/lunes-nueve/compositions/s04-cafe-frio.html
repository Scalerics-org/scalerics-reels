    (function () {
      const ID = "s04-cafe-frio";
      const DUR = 4.89;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);

      const CAFE = 0.96, NUEVE = 2.47, MEDIA = 2.78, FRIO = 3.79;
      const etiqueta = (sel, t, antes) => {

      // la taza arranca medio dibujada

        const L = el.getTotalLength();

      gsap.set(q(".s04-frio"), { opacity: 0 });

        const L = v.getTotalLength();
        gsap.set(v, { strokeDasharray: L * 0.45 + " " + L });

      const FORMAS = [
        '<rect class="ln4 apagado" x="-40" y="-26" width="80" height="52" rx="9" /><circle class="rojo" cx="28" cy="-14" r="5" />',

      const CX = 540, CY = 990, R = 250, GIRO = 300;
      tl.fromTo(ORB, { rotation: 0, svgOrigin: CX + " " + CY }, { rotation: GIRO, svgOrigin: CX + " " + CY, duration: 2.6, ease: "power1.inOut" }, 0);
      FORMAS.forEach((f, i) => {
        const a = (i / FORMAS.length) * Math.PI * 2 - Math.PI / 2;
        const g = document.createElementNS(NS, "g");
        g.setAttribute("transform", "translate(" + (CX + R * Math.cos(a)) + " " + (CY + R * Math.sin(a)) + ")");
        const inn = document.createElementNS(NS, "g");
        inn.innerHTML = f;
        g.appendChild(inn);
        ORB.appendChild(g);
        tl.fromTo(inn, { rotation: 0, scale: 0.4, opacity: 0, svgOrigin: "0 0" }, { rotation: -GIRO, scale: 1, opacity: 1, svgOrigin: "0 0", duration: 2.6, ease: "power1.inOut" }, 0);
