    [data-composition-id="s10-lista"] .chip-ap { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.1em; fill: rgba(239, 238, 229, 0.7); }
    [data-composition-id="s10-lista"] .ia { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 40px; fill: #5ce611; }
    [data-composition-id="s10-lista"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s10-lista"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s10-lista" data-width="1080" data-height="1920" data-duration="8.21">
    <div id="s10-escena" class="s10-capa clip" data-start="0" data-duration="8.21" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <rect class="ln s10-panel" x="150" y="630" width="780" height="590" rx="30" />
        <text class="cab s10-cab" x="196" y="694">LA LISTA DE DIEGO</text>

        <!-- agente chico en el encabezado -->

          <path class="ln" d="M0 -300 V-326" /><circle class="verde" cx="0" cy="-336" r="12" />

          <rect class="verde" x="-42" y="-258" width="18" height="34" rx="9" /><rect class="verde" x="24" y="-258" width="18" height="34" rx="9" />
          <path class="ln" d="M-20 -200 Q0 -188 20 -200" />
        </g></g>

        <!-- primero -->
        <g class="s10-fila s10-f1"><circle class="verde" cx="214" cy="778" r="22" /><text class="n" x="214" y="787" text-anchor="middle">1</text><text class="item" x="256" y="789">Aprobar los 3 pedidos</text></g>
        <g class="s10-fila s10-f2"><circle class="verde" cx="214" cy="846" r="22" /><text class="n" x="214" y="855" text-anchor="middle">2</text><text class="item" x="256" y="857">Confirmar la harina</text></g>
        <g class="s10-fila s10-f3"><circle class="verde" cx="214" cy="914" r="22" /><text class="n" x="214" y="923" text-anchor="middle">3</text><text class="item" x="256" y="925">Armar el pedido 9</text></g>
        <!-- puede esperar -->

          <text class="sec" x="196" y="990">PUEDE ESPERAR</text>

          <g><circle class="ln3" cx="214" cy="1040" r="20" /><text class="item-ap" x="256" y="1051">Revisar precios</text></g>
          <g><circle class="ln3" cx="214" cy="1102" r="20" /><text class="item-ap" x="256" y="1113">Ordenar el depósito</text></g>

        <!-- tildes de aprobado -->
        <g class="s10-ok" data-y="778"><circle class="ln-ac" cx="0" cy="0" r="22" /><path class="ln-ac" d="M-10 1 L-3 8 L11 -8" /></g>

        <circle class="s10-onda" cx="311" cy="1172" r="40" style="fill:none;stroke:#5ce611;stroke-width:4" />

      <div class="etiqueta"><span class="s10-e1">La lista del día</span><span class="s10-e2">Diego decide</span><span class="s10-e3">El agente, el resto</span></div>

  </div>
  <script>
    (function () {
      const ID = "s10-lista";
      const DUR = 8.21;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const LISTA = 1.14, PRIMERO = 2.17, ESPERA = 2.93, REVISA = 4.15, APRUEBA = 4.63, DECIDE = 5.63, AGENTE = 6.8, RESTO = 7.46;
      const etiqueta = (sel, t, antes) => {
        if (antes) tl.to(q(antes), { opacity: 0, y: -10, duration: 0.18 }, t - 0.05);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

      // el panel arranca medio dibujado y se completa
      const p = q(".s10-panel"), L = p.getTotalLength();
      tl.fromTo(p, { strokeDasharray: L, strokeDashoffset: L * 0.6 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 0);
      tl.fromTo(qa(".s10-cab"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, LISTA - 0.6);
      tl.to(p, { stroke: "#5ce611", duration: 0.3 }, LISTA);
      etiqueta(".s10-e1", LISTA);

      // primero: tres filas con número verde
      ["s10-f1", "s10-f2", "s10-f3"].forEach((c, i) => {
        tl.fromTo(q("." + c), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, (i === 0 ? 0.3 : PRIMERO - 0.25) + i * 0.12);
      });
      tl.fromTo(q(".s10-espera"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, ESPERA - 0.1);
      tl.fromTo(q(".s10-boton"), { opacity: 0, scale: 0.8, svgOrigin: "311 1172" }, { opacity: 1, scale: 1, svgOrigin: "311 1172", duration: 0.35, ease: "back.out(2)" }, ESPERA + 0.3);

      // el cursor de Diego: revisa, aprueba, decide
      const C = q(".s10-cursor");
      gsap.set(C, { x: 760, y: 1240, opacity: 0 });
      tl.to(C, { opacity: 1, duration: 0.15 }, REVISA - 0.5);
      tl.to(C, { x: 620, y: 790, duration: 0.35, ease: "power2.inOut" }, REVISA - 0.45);
      tl.to(C, { y: 925, duration: 0.4, ease: "sine.inOut" }, REVISA - 0.05);
      tl.to(C, { x: 330, y: 1172, duration: 0.3, ease: "power2.inOut" }, APRUEBA - 0.3);
      tl.to(C, { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, APRUEBA);
      tl.to(q(".s10-boton"), { scale: 0.93, svgOrigin: "311 1172", duration: 0.08, yoyo: true, repeat: 1 }, APRUEBA);
      gsap.set(q(".s10-onda"), { opacity: 0 });
      tl.set(q(".s10-onda"), { opacity: 0.9 }, APRUEBA);
      tl.fromTo(q(".s10-onda"), { scale: 0.6, svgOrigin: "311 1172" }, { scale: 1.6, svgOrigin: "311 1172", duration: 0.45, ease: "power2.out" }, APRUEBA);
      tl.to(q(".s10-onda"), { opacity: 0, duration: 0.45, ease: "power2.out" }, APRUEBA + 0.01);
      qa(".s10-ok").forEach((g, i) => {
        gsap.set(g, { x: 868, y: Number(g.dataset.y) });
        tl.fromTo(g, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)", transformOrigin: "50% 50%" }, APRUEBA + 0.15 + i * 0.12);
      });
      // decide: lo de abajo, para mañana
      tl.to(C, { x: 690, y: 1105, duration: 0.35, ease: "power2.inOut" }, DECIDE - 0.4);
      tl.to(C, { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, DECIDE);
      tl.fromTo(q(".s10-manana"), { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, DECIDE + 0.05);
      tl.to(C, { opacity: 0, duration: 0.3 }, DECIDE + 0.6);
      etiqueta(".s10-e2", REVISA, ".s10-e1");

      // el agente hace el resto
      tl.fromTo(q(".s10-agente"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, AGENTE - 0.1);
      tl.to(qa(".s10-ok"), { opacity: 0, duration: 0.2 }, RESTO - 0.3);
      qa(".s10-hecho").forEach((g, i) => {
        gsap.set(g, { x: 890, y: Number(g.dataset.y), opacity: 0 });
        tl.fromTo(g, { opacity: 0, x: 930 }, { opacity: 1, x: 890, duration: 0.3, ease: "power3.out", immediateRender: false }, RESTO - 0.25 + i * 0.12);
      });
      etiqueta(".s10-e3", AGENTE - 0.3, ".s10-e2");

      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
