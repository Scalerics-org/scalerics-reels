      <div class="tv-antes">
        <div class="tv-antes-fondo"></div>

          <svg class="s05-svg" viewBox="0 0 1080 1920" aria-hidden="true">

  <script>
    (function () {
      const ID = "s05-sopa";
      const DUR = 3.01;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      root.querySelector(".s05-duenio").innerHTML = TV.duenio();
      TV.llenar(root);
      const tl = gsap.timeline({ paused: true });
      const K = TV.kit(tl, root);
      const { q, qa } = K;
      const D = q(".s05-duenio");
      const brazo = D.querySelector(".tv-brazo-d");
      K.origen(brazo, 360, 440);

      const NO = 1.22, SOPA = 1.81;

      K.granular(q(".tv-grano"), DUR);
      tl.fromTo(q(".s05-escenario"), { scale: 1 }, { scale: 1.06, duration: DUR, ease: "none", transformOrigin: "40% 60%" }, 0);
      // el vapor sube
      qa(".s05-vapor path").forEach((p, i) => tl.fromTo(p, { y: 0, opacity: 0.8 }, { y: -40, opacity: 0.3, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, i * 0.15));
      tl.fromTo(D, { x: 60 }, { x: 0, duration: 0.35, ease: "power3.out" }, 0);
      // "Ahí te contesto": levanta el celular despacio, con pachorra
      tl.to(brazo, { rotation: -25, duration: 0.8, ease: "sine.inOut" }, 0.1);
      K.habla(D.querySelector(".tv-boca"), 0, 1.0);
      // "¡no!": se le resbala: el celular de la mano desaparece y vuela a la olla
      gsap.set(q(".s05-vuela"), { opacity: 0 });
      tl.set(brazo.querySelector(".tv-cel"), { opacity: 0 }, NO - 0.05);
      tl.set(q(".s05-vuela"), { opacity: 1 }, NO - 0.05);
      tl.fromTo(q(".s05-vuela"), { x: 760, y: 1020, rotation: -20 }, { x: 260, y: 1190, rotation: -380, duration: SOPA - NO + 0.05, ease: "power1.in", immediateRender: false }, NO - 0.05);
      tl.to(q(".s05-vuela"), { opacity: 0, duration: 0.05 }, SOPA);
      tl.to(brazo, { rotation: 30, duration: 0.15, ease: "back.out(2)" }, NO);
      tl.to(D.querySelector(".tv-ojos"), { scale: 1.4, transformOrigin: "50% 50%", duration: 0.12 }, NO);
      tl.to(D.querySelector(".tv-boca"), { scaleY: 2.2, scaleX: 1.3, transformOrigin: "50% 30%", duration: 0.12 }, NO);
      tl.to(D, { y: -30, duration: 0.1, yoyo: true, repeat: 1 }, NO);
      // "sopa": splash
      qa(".s05-g").forEach((g, i) => {
        const a = (-160 + i * 28) * (Math.PI / 180);
        gsap.set(g, { opacity: 0 });
        tl.set(g, { opacity: 1 }, SOPA);
        tl.fromTo(g, { x: 0, y: 0 }, { x: Math.cos(a) * 220, y: Math.sin(a) * 260 + 60, duration: 0.6, ease: "power1.out", immediateRender: false }, SOPA);
        tl.to(g, { opacity: 0, duration: 0.2 }, SOPA + 0.5);
      });
      K.golpe(q(".s05-plop"), SOPA + 0.05, -10);
      K.golpe(q(".s05-plop-t"), SOPA + 0.07, -10);
      K.sacudon(q(".s05-escenario"), SOPA + 0.05, 1.2);
      K.late(q(".s05-plop-t"), SOPA + 0.3, 0.8, 1.08);

      K.salida(q("#s05-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
