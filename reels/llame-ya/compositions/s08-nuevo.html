  <script>
    (function () {
      const ID = "s08-nuevo";
      const DUR = 4.93;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      root.querySelector(".s08-rolo").innerHTML = TV.rolo();
      root.querySelector(".s08-mesa").innerHTML = TV.mesa(150, 780);
      TV.llenar(root);
      const tl = gsap.timeline({ paused: true });
      const K = TV.kit(tl, root);
      const { q, qa } = K;
      const R = q(".s08-rolo");

      const NUEVO = 0.75, CONTESTA = 1.54, INST = 2.0, DIA = 2.67, NOCHE = 3.34, FERIADO = 4.0;

      // vuelve el color de golpe: flash blanco
      tl.fromTo(q(".s08-flash"), { opacity: 0.9 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo(q(".s08-escenario"), { scale: 1.12 }, { scale: 1, duration: 0.5, ease: "power3.out", transformOrigin: "50% 60%" }, 0);
      tl.fromTo(R, { y: 200 }, { y: 0, duration: 0.35, ease: "back.out(1.8)" }, 0);
      K.habla(R.querySelector(".tv-boca"), 0, 4.5);
      // "nuevo": la estrella
      K.golpe(q(".s08-est"), NUEVO, 0);
      K.golpe(q(".s08-est-t"), NUEVO + 0.03, -12);
      K.gira(q(".s08-est"), NUEVO, DUR - NUEVO, 40);
      K.late(q(".s08-est-t"), NUEVO + 0.2, DUR - NUEVO - 0.5, 1.1);
      const bi = R.querySelector(".tv-brazo-i");
      K.origen(bi, 68, 420);
      tl.to(bi, { rotation: 110, duration: 0.2, ease: "back.out(2)" }, NUEVO);
      // "contesta al instante": rayo
      gsap.set(q(".s08-rayo"), { opacity: 0 });
      tl.fromTo(q(".s08-rayo"), { opacity: 1, y: -200, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, CONTESTA);
      for (let i = 0; i < 4; i++) tl.set(q(".s08-rayo"), { opacity: i % 2 ? 1 : 0.3 }, CONTESTA + 0.2 + i * 0.08);
      tl.to(q(".s08-rayo"), { opacity: 0, duration: 0.15 }, DIA - 0.2);
      K.golpe(q(".s08-inst"), INST, -6);
      tl.to(q(".s08-inst"), { opacity: 0, duration: 0.15 }, DIA - 0.15);
      tl.to(bi, { rotation: 40, duration: 0.2 }, DIA - 0.2);
      // día, noche, feriado
      K.pop(q(".s08-sol"), DIA - 0.05);
      K.gira(q(".s08-sol"), DIA, DUR - DIA, 60);
      K.pop(q(".s08-luna"), NOCHE - 0.05);
      tl.to(q(".s08-luna"), { rotation: -12, transformOrigin: "50% 50%", duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, NOCHE + 0.3);
      K.golpe(q(".s08-feriado"), FERIADO, 3);
      K.sacudon(q(".s08-escenario"), FERIADO + 0.06, 0.6);

      K.salida(q("#s08-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
