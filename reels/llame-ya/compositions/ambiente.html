<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/momentos.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    /* líneas de barrido de tele vieja y viñeta */
    [data-composition-id="ambiente"] .amb-scan { position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(13, 6, 48, 0.16) 0px, rgba(13, 6, 48, 0.16) 2px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0) 6px); }
    [data-composition-id="ambiente"] .amb-vin { position: absolute; inset: 0; background: radial-gradient(ellipse 760px 1180px at 540px 960px, rgba(13, 6, 48, 0) 62%, rgba(13, 6, 48, 0.55) 100%); }
    [data-composition-id="ambiente"] .amb-franja { position: absolute; left: 0; width: 1080px; top: 0; height: 90px; background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.07) 50%, rgba(255, 255, 255, 0) 100%); }
    /* el bug del canal arriba */
    [data-composition-id="ambiente"] .amb-bug { position: absolute; left: 72px; top: 120px; height: 62px; display: flex; align-items: center; gap: 14px; }
    [data-composition-id="ambiente"] .amb-bug .amb-tv { background: #ff2e88; border: 5px solid #0d0630; box-shadow: 6px 6px 0 #0d0630; padding: 8px 18px; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 30px; color: #ffffff; letter-spacing: 0.02em; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-bug .amb-vivo { display: flex; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 28px; letter-spacing: 0.2em; color: #ffffff; white-space: nowrap; text-shadow: 2px 2px 0 #0d0630; }
    [data-composition-id="ambiente"] .amb-bug .amb-punto { width: 20px; height: 20px; border-radius: 50%; background: #ff2e88; border: 3px solid #ffffff; }
    /* la banda de LLAME YA abajo */
    [data-composition-id="ambiente"] .amb-banda { position: absolute; left: 0; top: 1532px; width: 1080px; height: 116px; background: #ffd400; border-top: 7px solid #0d0630; border-bottom: 7px solid #0d0630; overflow: hidden; }
    [data-composition-id="ambiente"] .amb-cinta { position: absolute; left: 0; top: 0; height: 102px; display: flex; align-items: center; white-space: nowrap; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 58px; color: #0d0630; text-transform: uppercase; }
    [data-composition-id="ambiente"] .amb-cinta span { margin-right: 46px; }
    [data-composition-id="ambiente"] .amb-cinta .amb-m { color: #ff2e88; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="73.72">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="73.72" data-track-index="0">
      <div class="amb-scan"></div>
      <div class="amb-franja"></div>
      <div class="amb-vin"></div>
      <div class="amb-bug"><div class="amb-tv">TELEVENTAS</div><div class="amb-vivo"><div class="amb-punto"></div>EN VIVO</div></div>
      <div class="amb-banda"><div class="amb-cinta"></div></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const M = window.TVM;
      const DUR = M.DUR;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // la franja de interferencia baja por la pantalla una y otra vez
      tl.fromTo(q(".amb-franja"), { y: -100 }, { y: 1960, duration: 3.2, ease: "none", repeat: Math.floor(DUR / 3.2) - 1 }, 0);
      // el punto de EN VIVO parpadea
      const P = q(".amb-punto");
      for (let t = 0.5; t < DUR - 0.5; t += 0.9) { tl.set(P, { opacity: 0.15 }, t); tl.set(P, { opacity: 1 }, t + 0.45); }
      // en el ANTES el bug dice otra cosa (la tele vieja): se apaga el color
      tl.to(q(".amb-bug"), { filter: "grayscale(1)", duration: 0.1 }, M.antes);
      tl.to(q(".amb-bug"), { filter: "grayscale(0)", duration: 0.1 }, M.color);

      // la cinta de LLAME YA entra con "¡Llame ya!" y corre hasta que entra Scalerics
      const frase = '<span>¡Llame ya!</span><span class="amb-m">•</span><span>Oferta por tiempo limitado</span><span class="amb-m">•</span>';
      q(".amb-cinta").innerHTML = frase.repeat(8);
      const banda = q(".amb-banda");
      gsap.set(banda, { y: 140, opacity: 0 });
      tl.to(banda, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, M.llame - 0.1);
      tl.fromTo(q(".amb-cinta"), { x: 0 }, { x: -1400, duration: M.orus - M.llame + 0.5, ease: "none" }, M.llame - 0.1);
      tl.to(banda, { y: 140, opacity: 0, duration: 0.3, ease: "power2.in" }, M.orus - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
