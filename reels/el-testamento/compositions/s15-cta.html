      const DUR = 6.20;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);

      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {

      const QUIEN = 0.45, DON = 1.36, ETIQUETALO = 2.18;
      tl.fromTo(q(".s15-retrato"), { y: -40, opacity: 0, scale: 0.9, svgOrigin: "540 850" }, { y: 0, opacity: 1, scale: 1, svgOrigin: "540 850", duration: 0.4, ease: "back.out(1.4)" }, 0);
