  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 72.74;
      const DRAMA = [2.87, 13.52, 39.09, 46.04]; // golpes de telenovela
      const SCALERICS = 54.45; // "En Scalerics": luz dorada
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // polvo que flota en la luz de la lámpara (determinista)
      root.querySelectorAll(".amb-mota").forEach((m, i) => {
        const dx = ((i * 37) % 60) - 30, dy = -60 - ((i * 53) % 80);
        tl.fromTo(m, { x: 0, y: 0 }, { x: dx, y: dy, duration: DUR, ease: "none" }, 0);
      });
      tl.fromTo(q(".amb-luz"), { opacity: 0.7 }, { opacity: 0.95, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: Math.floor(DUR / 2.4) - 1 }, 0);
      tl.to(q(".amb-grano"), { x: 90, y: -70, duration: DUR, ease: "steps(" + Math.round(DUR * 12) + ")" }, 0);

      DRAMA.forEach((t) => {
        tl.to(q(".amb-drama"), { opacity: 1, duration: 0.12, ease: "power2.out" }, t);
        tl.to(q(".amb-drama"), { opacity: 0, duration: 1.2, ease: "power2.in" }, t + 0.5);
      });
      tl.to(q(".amb-calma"), { opacity: 1, duration: 1.4, ease: "power2.out" }, SCALERICS);
      tl.to(q(".amb-r1"), { opacity: 0, duration: 0.3 }, SCALERICS);
      tl.to(q(".amb-r2"), { opacity: 0.7, duration: 0.3 }, SCALERICS + 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
