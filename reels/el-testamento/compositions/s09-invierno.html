  <script>
    (function () {
      const ID = "s09-invierno";
      const DUR = 3.87;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, Math.max(0, t + i * 0.04));
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, s) => tl.fromTo(el, { opacity: 0, scale: s ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      const sello = (el, t) => tl.fromTo(el, { opacity: 0, scale: 2.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in" }, t);
      const temblor = (el, t, f) => [[-12, 7], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(el, { x: x * (f ?? 1), y: y * (f ?? 1), duration: 0.04, ease: "none" }, t + i * 0.045));
      // escribir: revela un texto de izquierda a derecha con un clip
      const escribir = (el, t, d) => tl.fromTo(el, { clipPath: "inset(-20% 100% -20% 0%)", opacity: 1 }, { clipPath: "inset(-20% 0% -20% 0%)", duration: d, ease: "none" }, t);
      const parpadeo = (els, t) => tl.to(els, { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1 }, t);
      const etiqueta = (sel, t) => tl.fromTo(q(sel), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3 }, t);
      const quitar = (sel, t) => tl.to(q(sel), { opacity: 0, y: -12, duration: 0.2 }, t);
      const PAPA = 1.34, EN = 2.36, INVIERNO = 2.45;
      tl.fromTo(q(".s09-hija"), { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(q(".s09-hijo"), { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.05);
      pop(q(".s09-cal"), 0.15, 0.6);
      etiqueta(".s09-e1", 0.1);
      // las hojas del taco pasan
      const hojas = Array.from(qa(".s09-hoja")).reverse(); // ENERO primero (arriba de todo)
      hojas.forEach((h, i) => gsap.set(h, { opacity: i === 0 ? 1 : 0 }));
      hojas.forEach((h, i) => {
        if (i >= 6) return;
        tl.set(hojas[i + 1], { opacity: 1 }, 0.45 + i * 0.16);
        tl.to(h, { y: -260, rotation: -25 + (i % 3) * 20, opacity: 0, svgOrigin: "0 -70", duration: 0.22, ease: "power2.in" }, 0.45 + i * 0.16);
      });
      // los dos se miran
      tl.to(qa(".s09-hija-ojo"), { x: 10, duration: 0.15 }, PAPA);
      tl.to(qa(".s09-hijo-ojo"), { x: -10, duration: 0.15 }, PAPA + 0.1);
      pop(q(".s09-q1"), PAPA + 0.1, 0.4);
      pop(q(".s09-q2"), PAPA + 0.25, 0.4);
      tl.to(q(".s09-hija-cejas"), { y: -10, duration: 0.15 }, PAPA);
      // "¿en invierno?": se encoge de hombros, cae nieve
      tl.to(q(".s09-hijo-cuerpo"), { y: -24, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, INVIERNO);
      tl.to(q(".s09-hijo-cejas"), { y: -12, duration: 0.15 }, INVIERNO);
      gsap.set(qa(".s09-copo"), { opacity: 0 });
      qa(".s09-copo").forEach((c, i) => {
        tl.to(c, { opacity: 1, duration: 0.1 }, INVIERNO + i * 0.06);
        tl.to(c, { y: 140, rotation: 90, transformOrigin: "50% 50%", duration: DUR - INVIERNO, ease: "none" }, INVIERNO + i * 0.06);
      });
      tl.to(q(".s09-escenario"), { scale: 1.08, duration: 0.18, ease: "power3.out", transformOrigin: "810px 1000px" }, INVIERNO);
      quitar(".s09-e1", EN);
      etiqueta(".s09-e2", INVIERNO);


      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
