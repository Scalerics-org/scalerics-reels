      const q = (s) => root.querySelector(s);

      const tl = gsap.timeline({ paused: true });

      // haces de luz de los vitrales que respiran
      tl.fromTo(q(".am-h1"), { opacity: 0.04 }, { opacity: 0.1, duration: 2.4, yoyo: true, repeat: Math.floor(FIN / 2.4), ease: "sine.inOut" }, 0);

      tl.fromTo(q(".am-placa"), { scale: 1 }, { scale: 1.03, duration: 0.7, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.1);

      // pétalos que caen todo el casamiento (deterministas)
      const pet = q(".am-petalos");
      const COL = ["#eba5b3", "#fbf4e6", "#eba5b3", "#9b2445", "#e3b448"];
      for (let i = 0; i < 22; i++) {
        const p = document.createElementNS(NS, "path");
        const s = 0.8 + (i % 4) * 0.25;
        p.setAttribute("d", `M0 ${-14 * s} Q${12 * s} 0 0 ${14 * s} Q${-12 * s} 0 0 ${-14 * s} Z`);
        p.setAttribute("fill", COL[i % 5]); p.setAttribute("stroke", "#2a1220"); p.setAttribute("stroke-width", 2); p.setAttribute("opacity", 0.75);
        const g = document.createElementNS(NS, "g"); g.appendChild(p); pet.appendChild(g);
        const x = (i * 211 + 37) % 1080, caida = 6 + (i % 5) * 1.3, fr = ((i * 0.37) % 1);
        const dx = (i % 2) ? 120 : -120, r0 = (i * 53) % 360;
        // primer tramo: arranca ya a mitad de la caída (el cuadro 0 tiene pétalos)
        const resto = caida * (1 - fr);
        tl.fromTo(g, { x: x + dx * fr, y: -40 + 2000 * fr, rotation: r0 }, { x: x + dx, y: 1960, rotation: r0 + 420 * (1 - fr), duration: resto, ease: "none", immediateRender: true }, 0);
        const vueltas = Math.max(0, Math.floor((FIN - resto) / caida) - 1);
        tl.fromTo(g, { x, y: -40, rotation: r0 }, { x: x + dx, y: 1960, rotation: r0 + 420, duration: caida, ease: "none", repeat: vueltas, immediateRender: false }, resto);
      }

      // zócalo: quién habla

        [".am-zv", 46.03, 51.94], [".am-zc", 51.97, FIN - 0.05]];
      Z.forEach(([s, a, b], i) => {
        const el = q(s);
        if (i === 0) gsap.set(el, { opacity: 1 });
        else tl.fromTo(el, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, a);

      });

      // flash cuando se abren las puertas ("¡Yo me opongo!") y en el "¡un pulgar!"
      const flash = (t, o) => { tl.to(q(".am-flash"), { opacity: o, duration: 0.04 }, t); tl.to(q(".am-flash"), { opacity: 0, duration: 0.35 }, t + 0.06); };
      flash(11.55, 0.6); flash(29.9, 0.3); flash(37.15, 0.35);

      // arroz: "¡Tiren el arroz!" (53.8)
      const arr = q(".am-arroz");

        const e = document.createElementNS(NS, "ellipse");
        e.setAttribute("rx", 4); e.setAttribute("ry", 9); e.setAttribute("fill", "#fbf4e6"); e.setAttribute("stroke", "#2a1220"); e.setAttribute("stroke-width", 1.5);

        tl.to(g, { y: 1950, duration: 1.1, ease: "power2.in" }, t + 0.7);
        tl.to(g, { rotation: (i * 97) % 720, duration: 1.8, ease: "none" }, t);
        tl.set(g, { opacity: 0 }, t + 1.8);
      }
