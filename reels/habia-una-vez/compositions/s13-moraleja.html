  <script>
    (function () {
      const ID = "s13-moraleja";
      const DUR = 4.74;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // trazos de tinta que se dibujan (opacity 0 hasta que arrancan: sin puntitos de los caps)
      const dibujar = (els, t, dur, desde) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, Math.max(0, t + i * 0.03));
          tl.fromTo(el, { strokeDashoffset: (L + 2) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, Math.max(0, t + i * 0.03));
        });
      };
      // la acuarela se pinta: aparece la mancha
      const pintar = (els, t, dur) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const op = Number(el.style.opacity || 1);
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: op, duration: dur ?? 0.45, ease: "power1.out" }, Math.max(0, t + i * 0.03));
        });
      };
      // un dibujo entero (grupo con .tinta y .lav adentro): primero la tinta, después el color
      const ilustrar = (sel, t, dur, desde) => {
        const g = typeof sel === "string" ? q(sel) : sel;
        dibujar([...g.querySelectorAll(".tinta, .tinta-f")], t, dur ?? 0.6, desde);
        pintar([...g.querySelectorAll(".lav")], t + (dur ?? 0.6) * 0.45, 0.4);
        const resto = [...g.querySelectorAll(":scope > :not(.tinta):not(.tinta-f):not(.lav):not(g), :scope g > :not(.tinta):not(.tinta-f):not(.lav):not(g)")];
        resto.forEach((el) => { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.3 }, t + (dur ?? 0.6) * 0.6); });
      };
      const pop = (el, t, d) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: d ?? 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };
      const popSvg = (el, t, origen, d) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.6, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: d ?? 0.35, ease: "back.out(2)", immediateRender: false }, t);
      };
      const escribir = (el, t, dur) => {
        gsap.set(el, { clipPath: "inset(0 100% 0 0)" });
        tl.to(el, { clipPath: "inset(0 0% 0 0)", duration: dur, ease: "none" }, t);
      };
      const temblor = (el, t, f) => [[-12, 7], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(el, { x: x * (f ?? 1), y: y * (f ?? 1), duration: 0.04, ease: "none" }, t + i * 0.045));
      // vaivén suave mientras dura la escena (determinista)
      const vaiven = (el, t0, prop, per) => {
        const n = Math.max(1, Math.floor((DUR - 0.3 - t0) / per));
        tl.to(el, { ...prop, duration: per, ease: "sine.inOut", yoyo: true, repeat: n - 1 }, t0);
      };
      const etiquetas = (lista) => {
        lista.forEach(([txt, t], i) => {
          const el = document.createElement("div");
          el.className = "etq";
          el.innerHTML = txt;
          q(".capa").appendChild(el);
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
          if (i + 1 < lista.length) tl.to(el, { opacity: 0, y: 10, duration: 0.15 }, lista[i + 1][1] - 0.15);
        });
      };

      const LOBO = 1.23, MALO = 2.23, ERA = 3.01, UNICO = 3.31, VENDIO = 3.84;

      pintar(q(".s13-marco-l"), 0.05, 0.3);

      // el único que le vendió
      popSvg(q(".s13-medalla"), UNICO - 0.1, "540 1040");
      pop(q(".s13-unico"), UNICO);
      gsap.set(q(".s13-sello"), { opacity: 0 });
