  <script>
    (function () {
      const ID = "s04-paso-tres";
      const DUR = 5.54;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s04-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // pop: aparece entero con rebote (oculto hasta t)
      const pop = (el, t, o = {}) => {
        gsap.set(el, { opacity: 0 });
        const sv = o.svg ? { svgOrigin: o.svg } : {};
        tl.fromTo(el, { opacity: 0, scale: o.s ?? 0.4, rotation: o.r0 ?? 0, y: o.y ?? 0, x: o.x ?? 0, ...sv }, { opacity: 1, scale: 1, rotation: o.r ?? 0, y: 0, x: 0, duration: o.d ?? 0.32, ease: o.e ?? "back.out(2)", immediateRender: false, ...sv }, t);
      };
      // sello: cae grande y se clava
      const sello = (el, t, r = -10, f = 1.2) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.6, rotation: r - 18 }, { opacity: 1, scale: 1, rotation: r, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.12);
        sacudon(t + 0.04, f);
      };
      // vapor: hilos que suben y bajan (repeticiones finitas)
      const vapor = (els, t, hasta) => els.forEach((el, i) => {
        const p = 0.9 + (i % 3) * 0.15;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0.2, y: 30 }, { opacity: 0.95, y: -40, duration: p, ease: "sine.inOut", repeat: Math.max(0, Math.floor((hasta - t - i * 0.2) / p) - 1), yoyo: true, immediateRender: false }, t + i * 0.2);
      });
      // origen de giro SVG fijado antes de cualquier giro (si no, smoothOrigin corre el dibujo)
      const org = (el, o) => gsap.set(el, { svgOrigin: o, smoothOrigin: false });
      let NUMHASTA = DUR;

      const PASO = 0, AGREGALE = 0.99, CONSULTA = 1.39, PRIVADO = 2.27, AUNQUE = 4.0, PRIVADO2 = 4.7;
      org(q(".s04-bol"), "650 1340"); org(q(".s04-sig"), "900 1300");
      pop(q(".s04-bol"), 0.05, { s: 0.6, y: 60, svg: "650 1340" });
      // el frasco entra inclinado
      gsap.set(q(".s04-frasco"), { opacity: 0 });
      tl.fromTo(q(".s04-frasco"), { opacity: 1, x: 500, rotation: 40 }, { opacity: 1, x: 0, rotation: 8, duration: 0.4, ease: "back.out(1.4)", immediateRender: false }, AGREGALE - 0.2);
      // se da vuelta sobre el bol y caen granitos
      tl.to(q(".s04-frasco"), { rotation: -125, x: -70, y: 40, duration: 0.3, ease: "power2.inOut" }, CONSULTA - 0.1);
      tl.to(q(".s04-frasco"), { rotation: -115, duration: 0.08, yoyo: true, repeat: 5, ease: "none" }, CONSULTA + 0.25);
      const gs = qa(".s04-g");
      gsap.set(gs, { opacity: 0 });
      gs.forEach((g, i) => {
        tl.fromTo(g, { opacity: 1, y: -40 }, { opacity: 1, y: 230, duration: 0.35, ease: "power2.in", immediateRender: false }, CONSULTA + 0.2 + i * 0.1);
        tl.set(g, { opacity: 0 }, CONSULTA + 0.56 + i * 0.1);
        tl.fromTo(g, { opacity: 1, y: -40 }, { opacity: 1, y: 230, duration: 0.35, ease: "power2.in", immediateRender: false }, CONSULTA + 0.6 + i * 0.09);
        tl.set(g, { opacity: 0 }, CONSULTA + 0.96 + i * 0.09);
      });
      // vuelve derecho y la etiqueta se agranda
      tl.to(q(".s04-frasco"), { rotation: 6, x: 0, y: 0, duration: 0.3, ease: "back.out(1.6)" }, PRIVADO - 0.15);
      tl.fromTo(q(".s04-etiq"), { scale: 1 }, { scale: 1.18, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, PRIVADO);
      tl.to(q(".s04-bol"), { rotation: 4, duration: 0.15, yoyo: true, repeat: 5, ease: "sine.inOut" }, CONSULTA + 0.4);
      // "aunque ya estaba en privado": el frasco se va, aparece el chat con candado
      tl.to(q(".s04-frasco"), { x: 600, rotation: 50, duration: 0.3, ease: "power2.in" }, AUNQUE - 0.35);
      pop(q(".s04-candado"), AUNQUE - 0.05, { s: 0.3 });
      tl.to(q(".s04-candado"), { rotation: -3, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, AUNQUE + 0.3);
      gsap.set(q(".s04-nota"), { opacity: 0 });
      tl.fromTo(q(".s04-nota"), { opacity: 1, clipPath: "inset(0 100% 0 0)", rotation: -4 }, { opacity: 1, clipPath: "inset(0 0% 0 0)", rotation: -4, duration: 0.6, ease: "power1.inOut", immediateRender: false }, AUNQUE + 0.2);
      pop(q(".s04-sig"), PRIVADO2, { s: 0.2, svg: "900 1300", r: 8 });
      tl.to(q(".s04-sig"), { y: -16, duration: 0.12, yoyo: true, repeat: 3, ease: "power2.out" }, PRIVADO2 + 0.3);

      // número de paso gigante: cae con rebote en "Paso"
      gsap.set([q(".s04-num"), q(".s04-pasolbl")], { opacity: 0 });
      tl.fromTo(q(".s04-pasolbl"), { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, PASO);
      tl.fromTo(q(".s04-num"), { opacity: 1, y: -900, rotation: -14 }, { opacity: 1, y: 0, rotation: -4, duration: 0.32, ease: "bounce.out", immediateRender: false }, PASO);
      tl.to(q(".s04-num"), { rotation: 3, duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor((NUMHASTA - PASO - 0.6) / 0.6) - 1), ease: "sine.inOut" }, PASO + 0.4);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
