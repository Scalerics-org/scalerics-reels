    (function () {
      const ID = "s09-mil-ollas";
      const DUR = 4.9;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s09-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // pop: aparece entero con rebote (oculto hasta t)
      const pop = (el, t, o = {}) => {
        gsap.set(el, { opacity: 0 });
        const sv = o.svg ? { svgOrigin: o.svg } : {};
        tl.fromTo(el, { opacity: 0, scale: o.s ?? 0.4, rotation: o.r0 ?? 0, y: o.y ?? 0, x: o.x ?? 0, ...sv }, { opacity: 1, scale: 1, rotation: o.r ?? 0, y: 0, x: 0, duration: o.d ?? 0.32, ease: o.e ?? "back.out(2)", immediateRender: false, ...sv }, t);
      };
      // sello: cae grande y se clava
      const sello = (el, t, r = -10, f = 1.2) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.6, rotation: r - 18 }, { opacity: 1, scale: 1, rotation: r, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.12);
        sacudon(t + 0.04, f);
      };
      // vapor: hilos que suben y bajan (repeticiones finitas)
      const vapor = (els, t, hasta) => els.forEach((el, i) => {
        const p = 0.9 + (i % 3) * 0.15;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0.2, y: 30 }, { opacity: 0.95, y: -40, duration: p, ease: "sine.inOut", repeat: Math.max(0, Math.floor((hasta - t - i * 0.2) / p) - 1), yoyo: true, immediateRender: false }, t + i * 0.2);
      });
      // origen de giro SVG fijado antes de cualquier giro (si no, smoothOrigin corre el dibujo)
      const org = (el, o) => gsap.set(el, { svgOrigin: o, smoothOrigin: false });
      let NUMHASTA = DUR;

      const QUEMA = 0.45, ATENCION = 1.07, SOLO = 2.41, MIL = 3.30, FUEGO = 3.93;
      org(q(".s09-olla"), "540 1060"); org(q(".s09-duenio"), "540 1360");
      // la olla ya está al fuego
      pop(q(".s09-olla"), 0, { s: 0.7, y: 80, svg: "540 1060" });
      pop(q(".s09-etiq"), 0.1, { s: 0.6, y: 80 });
      tl.to([q(".s09-fuego"), q(".s09-fuego2")], { scaleY: 1.3, svgOrigin: "540 1060", duration: 0.12, yoyo: true, repeat: Math.floor(DUR / 0.12) - 3, ease: "sine.inOut" }, 0.1);
      // se quema: humo que crece y sube
      qa(".s09-h").forEach((h, i) => {
        gsap.set(h, { opacity: 0 });
        tl.fromTo(h, { opacity: 0, scale: 0.2, y: 120, transformOrigin: "50% 50%" }, { opacity: 0.85, scale: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, QUEMA + i * 0.1);
        tl.to(h, { y: -30, scale: 1.12, duration: 0.6, yoyo: true, repeat: 4, ease: "sine.inOut" }, QUEMA + 0.6 + i * 0.1);
      });
      tl.to(q(".s09-olla"), { x: 5, duration: 0.05, yoyo: true, repeat: 13, ease: "none" }, QUEMA + 0.1);
      // atención: la etiqueta parpadea
      tl.to(q(".s09-etiq"), { backgroundColor: "#ffc93c", scale: 1.12, duration: 0.12, yoyo: true, repeat: 5, ease: "steps(1)" }, ATENCION);
      // el dueño, solo
      pop(q(".s09-duenio"), SOLO - 0.1, { s: 0.3, y: 120, svg: "540 1360" });
      tl.to(q(".s09-duenio"), { rotation: 6, svgOrigin: "540 1360", duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, SOLO + 0.25);
      // mil ollas: ráfaga
      qa(".s09-oc").forEach((o, i) => {
        gsap.set(o, { opacity: 0 });
        tl.fromTo(o, { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.5)", immediateRender: false }, MIL - 0.05 + i * 0.07);
        tl.to(o, { y: -8, rotation: i % 2 ? 4 : -4, transformOrigin: "50% 100%", duration: 0.09, yoyo: true, repeat: 7, ease: "none" }, MIL + 0.3 + i * 0.03);
      });
      // el dueño corre de un lado al otro
      tl.to(q(".s09-duenio"), { x: -150, duration: 0.22, ease: "power2.inOut" }, FUEGO - 0.2);
      tl.to(q(".s09-duenio"), { x: 150, duration: 0.3, ease: "power2.inOut" }, FUEGO + 0.05);
      tl.to(q(".s09-duenio"), { x: -60, duration: 0.25, ease: "power2.inOut" }, FUEGO + 0.4);
      sacudon(MIL + 0.1, 0.8);

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
