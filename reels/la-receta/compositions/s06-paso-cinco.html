  <script>
    (function () {
      const ID = "s06-paso-cinco";
      const DUR = 6.95;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s06-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // pop: aparece entero con rebote (oculto hasta t)
      const pop = (el, t, o = {}) => {
        gsap.set(el, { opacity: 0 });
        const sv = o.svg ? { svgOrigin: o.svg } : {};
        tl.fromTo(el, { opacity: 0, scale: o.s ?? 0.4, rotation: o.r0 ?? 0, y: o.y ?? 0, x: o.x ?? 0, ...sv }, { opacity: 1, scale: 1, rotation: o.r ?? 0, y: 0, x: 0, duration: o.d ?? 0.32, ease: o.e ?? "back.out(2)", immediateRender: false, ...sv }, t);
      };
      // sello: cae grande y se clava
      const sello = (el, t, r = -10, f = 1.2) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.6, rotation: r - 18 }, { opacity: 1, scale: 1, rotation: r, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.12);
        sacudon(t + 0.04, f);
      };
      // vapor: hilos que suben y bajan (repeticiones finitas)
      const vapor = (els, t, hasta) => els.forEach((el, i) => {
        const p = 0.9 + (i % 3) * 0.15;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0.2, y: 30 }, { opacity: 0.95, y: -40, duration: p, ease: "sine.inOut", repeat: Math.max(0, Math.floor((hasta - t - i * 0.2) / p) - 1), yoyo: true, immediateRender: false }, t + i * 0.2);
      });
      // origen de giro SVG fijado antes de cualquier giro (si no, smoothOrigin corre el dibujo)
      const org = (el, o) => gsap.set(el, { svgOrigin: o, smoothOrigin: false });
      let NUMHASTA = DUR;

      const PASO = 0.13, HORNO = 1.30, CON = 1.83, CERRADO = 2.82, LISTO = 4.16, AVER = 4.67, PROBA1 = 5.36, PROBA2 = 5.88;
      NUMHASTA = LISTO;
      org(q(".s06-puerta"), "710 1214"); org(qa(".s06-perilla"), "550 810"); org(q(".s06-cerrado"), "710 1006"); org(q(".s06-campana"), "560 1296"); org(q(".s06-plato"), "560 1300");
      pop(q(".s06-horno"), 0, { s: 0.7, y: 100 });
      // la puerta se abre (baja) en "horno"
      tl.to(q(".s06-puerta"), { scaleY: 0.12, duration: 0.3, ease: "power2.inOut" }, HORNO - 0.1);
      // entra el localcito
      gsap.set(q(".s06-local"), { opacity: 0 });
      tl.fromTo(q(".s06-local"), { opacity: 1, y: 420 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.3)", immediateRender: false }, CON - 0.1);
      // CERRADO se cuelga y se hamaca
      gsap.set(q(".s06-cerrado"), { opacity: 0 });
      tl.fromTo(q(".s06-cerrado"), { opacity: 1, y: -120, rotation: 0 }, { opacity: 1, y: 0, rotation: 12, duration: 0.25, ease: "bounce.out", immediateRender: false }, CERRADO - 0.15);
      tl.to(q(".s06-cerrado"), { rotation: -12, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, CERRADO + 0.1);
      // cierra la puerta, perilla gira, luz amarilla
      tl.to(q(".s06-puerta"), { scaleY: 1, duration: 0.25, ease: "power3.in" }, CERRADO + 0.4);
      sacudon(CERRADO + 0.65, 0.8);
      tl.to(qa(".s06-perilla"), { rotation: 200, duration: 0.4, ease: "power2.inOut" }, CERRADO + 0.7);
      tl.to(q(".s06-luz"), { opacity: 0.75, duration: 0.25 }, CERRADO + 0.9);
      tl.to(q(".s06-horno"), { x: 4, duration: 0.05, yoyo: true, repeat: 7, ease: "none" }, CERRADO + 1.0);
      // ¡Listo!: el número y el horno se van, sale el plato con campana
      tl.to([q(".s06-num"), q(".s06-pasolbl")], { y: -60, opacity: 0, duration: 0.2, ease: "power2.in" }, LISTO - 0.1);
      tl.to(q(".s06-horno"), { x: 700, opacity: 0, duration: 0.3, ease: "power2.in" }, LISTO - 0.1);
      pop(q(".s06-plato"), LISTO + 0.05, { s: 0.3, y: 200, svg: "560 1300" });
      pop(q(".s06-listo"), LISTO, { s: 2.2, r0: -20, r: -5, d: 0.2, e: "power4.in" });
      sacudon(LISTO + 0.2, 1);
      tl.to(q(".s06-listo"), { y: -60, opacity: 0, duration: 0.25 }, PROBA1 - 0.4);
      tl.to(q(".s06-campana"), { y: -260, x: 270, rotation: 25, duration: 0.3, ease: "back.out(1.4)" }, AVER - 0.05);
      tl.to(q(".s06-campana"), { opacity: 0, duration: 0.2 }, AVER + 0.6);
      vapor(qa(".s06-humo"), AVER, DUR);
      // la cuchara se ofrece en cada "probá"
      gsap.set(q(".s06-cuchara"), { opacity: 0, x: -900 });
      tl.to(q(".s06-cuchara"), { opacity: 1, x: -260, duration: 0.3, ease: "power2.out" }, PROBA1 - 0.3);
      tl.to(q(".s06-cuchara"), { x: -60, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, PROBA1);
      tl.to(q(".s06-cuchara"), { x: -40, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, PROBA2);

      // número de paso gigante: cae con rebote en "Paso"

      tl.fromTo(q(".s06-num"), { opacity: 1, y: -900, rotation: -14 }, { opacity: 1, y: 0, rotation: -4, duration: 0.32, ease: "bounce.out", immediateRender: false }, PASO);
      tl.to(q(".s06-num"), { rotation: 3, duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor((NUMHASTA - PASO - 0.6) / 0.6) - 1), ease: "sine.inOut" }, PASO + 0.4);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
