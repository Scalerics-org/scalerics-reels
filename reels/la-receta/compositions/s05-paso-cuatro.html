  <style>

  <script>
    (function () {
      const ID = "s05-paso-cuatro";
      const DUR = 3.52;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s05-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // pop: aparece entero con rebote (oculto hasta t)
      const pop = (el, t, o = {}) => {
        gsap.set(el, { opacity: 0 });
        const sv = o.svg ? { svgOrigin: o.svg } : {};
        tl.fromTo(el, { opacity: 0, scale: o.s ?? 0.4, rotation: o.r0 ?? 0, y: o.y ?? 0, x: o.x ?? 0, ...sv }, { opacity: 1, scale: 1, rotation: o.r ?? 0, y: 0, x: 0, duration: o.d ?? 0.32, ease: o.e ?? "back.out(2)", immediateRender: false, ...sv }, t);
      };
      // sello: cae grande y se clava
      const sello = (el, t, r = -10, f = 1.2) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.6, rotation: r - 18 }, { opacity: 1, scale: 1, rotation: r, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.12);
        sacudon(t + 0.04, f);
      };
      // vapor: hilos que suben y bajan (repeticiones finitas)
      const vapor = (els, t, hasta) => els.forEach((el, i) => {
        const p = 0.9 + (i % 3) * 0.15;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0.2, y: 30 }, { opacity: 0.95, y: -40, duration: p, ease: "sine.inOut", repeat: Math.max(0, Math.floor((hasta - t - i * 0.2) / p) - 1), yoyo: true, immediateRender: false }, t + i * 0.2);
      });
      // origen de giro SVG fijado antes de cualquier giro (si no, smoothOrigin corre el dibujo)
      const org = (el, o) => gsap.set(el, { svgOrigin: o, smoothOrigin: false });
      let NUMHASTA = DUR;

      const PASO = 0, ESPOLVOREA = 1.25, PASA = 1.83, EL = 2.25, LUNES = 2.61;
      // el salero ya está, entra con rebote
      gsap.set(q(".s05-salero"), { opacity: 0 });
      tl.fromTo(q(".s05-salero"), { opacity: 1, y: -500, rotation: 20 }, { opacity: 1, y: 0, rotation: 0, duration: 0.4, ease: "bounce.out", immediateRender: false }, 0.1);
      // "Espolvoreá": se da vuelta y sacude
      tl.to(q(".s05-salero"), { rotation: 165, duration: 0.25, ease: "power2.inOut" }, ESPOLVOREA - 0.1);
      tl.to(q(".s05-salero"), { y: 40, duration: 0.09, yoyo: true, repeat: 9, ease: "power1.inOut" }, ESPOLVOREA + 0.15);
      const gs = qa(".s05-g");
      gsap.set(gs, { opacity: 0 });
      gs.forEach((g, i) => [0, 0.32, 0.64].forEach((d) => {
        tl.fromTo(g, { opacity: 1, y: 0 }, { opacity: 1, y: 160, duration: 0.3, ease: "power2.in", immediateRender: false }, ESPOLVOREA + 0.2 + d + i * 0.05);
        tl.set(g, { opacity: 0 }, ESPOLVOREA + 0.5 + d + i * 0.05);
      }));
      // caen las palabras
      [[".s05-w1", PASA, -6], [".s05-w2", EL, 5], [".s05-w3", LUNES, -3]].forEach(([s, t, r]) => {
        gsap.set(q(s), { opacity: 0 });
        tl.fromTo(q(s), { opacity: 1, y: -380, rotation: r * 4 }, { opacity: 1, y: 0, rotation: r, duration: 0.3, ease: "bounce.out", immediateRender: false }, t - 0.12);
      });
      sacudon(LUNES + 0.12, 1.4);
      tl.to(q(".s05-w3"), { scale: 1.06, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, LUNES + 0.3);

      // número de paso gigante: cae con rebote en "Paso"
      gsap.set([q(".s05-num"), q(".s05-pasolbl")], { opacity: 0 });
      tl.fromTo(q(".s05-pasolbl"), { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, PASO);
      tl.fromTo(q(".s05-num"), { opacity: 1, y: -900, rotation: -14 }, { opacity: 1, y: 0, rotation: -4, duration: 0.32, ease: "bounce.out", immediateRender: false }, PASO);
      tl.to(q(".s05-num"), { rotation: 3, duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor((NUMHASTA - PASO - 0.6) / 0.6) - 1), ease: "sine.inOut" }, PASO + 0.4);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
