  <script>
    (function () {
      const ID = "s03-paso-dos";
      const DUR = 5.31;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s03-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // pop: aparece entero con rebote (oculto hasta t)
      const pop = (el, t, o = {}) => {
        gsap.set(el, { opacity: 0 });
        const sv = o.svg ? { svgOrigin: o.svg } : {};
        tl.fromTo(el, { opacity: 0, scale: o.s ?? 0.4, rotation: o.r0 ?? 0, y: o.y ?? 0, x: o.x ?? 0, ...sv }, { opacity: 1, scale: 1, rotation: o.r ?? 0, y: 0, x: 0, duration: o.d ?? 0.32, ease: o.e ?? "back.out(2)", immediateRender: false, ...sv }, t);
      };
      // sello: cae grande y se clava
      const sello = (el, t, r = -10, f = 1.2) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.6, rotation: r - 18 }, { opacity: 1, scale: 1, rotation: r, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.12);
        sacudon(t + 0.04, f);
      };
      // vapor: hilos que suben y bajan (repeticiones finitas)
      const vapor = (els, t, hasta) => els.forEach((el, i) => {
        const p = 0.9 + (i % 3) * 0.15;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0.2, y: 30 }, { opacity: 0.95, y: -40, duration: p, ease: "sine.inOut", repeat: Math.max(0, Math.floor((hasta - t - i * 0.2) / p) - 1), yoyo: true, immediateRender: false }, t + i * 0.2);
      });
      // origen de giro SVG fijado antes de cualquier giro (si no, smoothOrigin corre el dibujo)
      const org = (el, o) => gsap.set(el, { svgOrigin: o, smoothOrigin: false });
      let NUMHASTA = DUR;

      const PASO = 0, DEJALO = 1.18, VISTO = 2.26, DOS = 3.17, TAPADITO = 4.07;
      org(q(".s03-olla"), "660 1340"); org(q(".s03-tapa"), "660 1060"); org(q(".s03-burbuja"), "660 960"); org(q(".s03-timer"), "907 1320"); org(q(".s03-aguja"), "907 1254");
      pop(q(".s03-olla"), 0, { s: 0.7, y: 80, svg: "660 1340" });
      // tapa colgando arriba, inclinada
      gsap.set(q(".s03-tapa"), { y: -320, x: 50, rotation: 24, opacity: 0 });
      tl.to(q(".s03-tapa"), { opacity: 1, duration: 0.2 }, 0.15);
      tl.to(q(".s03-tapa"), { y: -320, x: 50, rotation: 16, duration: 0.5, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.5);
      // la burbuja cae adentro
      gsap.set(q(".s03-burbuja"), { opacity: 0 });
      tl.fromTo(q(".s03-burbuja"), { opacity: 1, y: -320, rotation: -20, svgOrigin: "660 960" }, { opacity: 1, y: 40, rotation: 8, svgOrigin: "660 960", duration: 0.35, ease: "power2.in", immediateRender: false }, DEJALO - 0.1);
      tl.to(q(".s03-burbuja"), { y: 200, duration: 0.25, ease: "power2.in" }, DEJALO + 0.25);
      tl.to(q(".s03-olla"), { y: 8, duration: 0.06, yoyo: true, repeat: 3 }, DEJALO + 0.3);
      // VISTO
      pop(q(".s03-visto"), VISTO - 0.1, { s: 0.3, y: 120 });
      tl.fromTo(qa(".s03-visto path"), { strokeDasharray: 120, strokeDashoffset: 120 }, { strokeDashoffset: 0, duration: 0.25, stagger: 0.12, ease: "power2.out" }, VISTO);
      tl.to(q(".s03-visto"), { rotation: -4, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, VISTO + 0.4);
      // 2 DÍAS
      pop(q(".s03-timer"), DOS - 0.1, { s: 0.3, svg: "907 1320" });
      tl.fromTo(q(".s03-aguja"), { rotation: 0, svgOrigin: "907 1254" }, { rotation: 720, svgOrigin: "907 1254", duration: 1.6, ease: "power1.inOut" }, DOS);
      // tapadito: el visto se va, la tapa baja y cierra
      tl.to(q(".s03-visto"), { y: -60, opacity: 0, duration: 0.2 }, TAPADITO - 0.3);
      tl.to(q(".s03-tapa"), { y: 0, x: 0, rotation: 0, svgOrigin: "660 1060", duration: 0.28, ease: "power3.in" }, TAPADITO - 0.25);
      sacudon(TAPADITO + 0.04, 1.2);
      tl.to(q(".s03-tapa"), { y: -10, duration: 0.07, yoyo: true, repeat: 5, ease: "power1.inOut" }, TAPADITO + 0.15);
      vapor(qa(".s03-vapor"), TAPADITO + 0.05, DUR);

      // número de paso gigante: cae con rebote en "Paso"
      gsap.set([q(".s03-num"), q(".s03-pasolbl")], { opacity: 0 });
      tl.fromTo(q(".s03-pasolbl"), { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, PASO);
      tl.fromTo(q(".s03-num"), { opacity: 1, y: -900, rotation: -14 }, { opacity: 1, y: 0, rotation: -4, duration: 0.32, ease: "bounce.out", immediateRender: false }, PASO);
      tl.to(q(".s03-num"), { rotation: 3, duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor((NUMHASTA - PASO - 0.6) / 0.6) - 1), ease: "sine.inOut" }, PASO + 0.4);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
