      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));

        tl.set(el, { opacity: 1 }, t + i * st);

      });
      // aparece entero

        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.8, transformOrigin: origen }, { opacity: 1, scale: 1, transformOrigin: origen, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t + i * st);

        gsap.set(el, { opacity: 0 });

      pop(".s03-p", POST - 0.1, 0.07);

      pop(".s03-mes", MES - 0.1);
      // post-it gigante
      tl.to(qa(".s03-p"), { opacity: 0.35, duration: 0.2 }, LLAMAR - 0.15);
      fuera(".s03-mes", LLAMAR - 0.15);
      gsap.set(q(".s03-gpost"), { opacity: 0 });
      tl.fromTo(q(".s03-gpost"), { opacity: 0, scale: 2.2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.18, ease: "power4.in", immediateRender: false }, LLAMAR - 0.18);
      sacudon(LLAMAR, 1);
