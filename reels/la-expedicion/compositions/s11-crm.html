      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s11-esc");
      const lista = (e) => (typeof e === "string" ? qa(e) : Array.isArray(e) ? e : [e]);

        tl.set(el, { opacity: 1 }, t + i * st);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st);
      });
      // aparece entero

        gsap.set(el, { opacity: 0 });

        gsap.set(el, { opacity: 0 });

        const c = q(".cartel");

        tl.fromTo(c.querySelector(".c-capa"), { y: -80, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 0);

        tl.fromTo(c.querySelector(".c-cota"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, 0.3);

        tl.to(c, { y: -60, opacity: 0, scale: 0.9, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, fin - 0.25);

      const VENT = 0.83, CRM = 1.53, QUIEN = 2.81, COMP = 4.43, PROM = 5.83, VOLV = 7.73, TODO = 8.63, LUGAR = 9.53;

      tl.fromTo(q(".s11-der"), { x: 0 }, { x: 620, duration: 0.6, ease: "power3.inOut" }, 0.1);
      tl.fromTo(q(".s11-venta"), { y: 300, opacity: 0.4 }, { y: -80, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.3);
      tl.to(q(".s11-venta"), { scale: 1.15, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 1 }, VENT);
      cae(".s11-crm", CRM, 2.2);
      sacudon(CRM, 1);
      // la venta se vuelve ficha
      tl.to(q(".s11-venta"), { scale: 0.2, y: -260, x: -330, opacity: 0, transformOrigin: "50% 50%", duration: 0.35, ease: "power2.in" }, CRM + 0.4);
      gsap.set(q(".s11-card"), { opacity: 0 });
      tl.fromTo(q(".s11-card"), { opacity: 0, y: 120, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.5)", immediateRender: false }, CRM + 0.55);
      // quiénes son: nombre y avatar
      tl.fromTo(q(".s11-av"), { scale: 0.5 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, QUIEN - 0.1);
      tl.fromTo(q(".s11-nom"), { x: -20, color: "#8a5a36" }, { x: 0, color: "#170f09", duration: 0.25 }, QUIEN - 0.1);
      const rows = qa(".s11-row");

      });
