  <script>
    (function () {
      const ID = "s01-civilizacion";
      const DUR = 5.70;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s01-esc");
      const lista = (e) => (typeof e === "string" ? qa(e) : Array.isArray(e) ? e : [e]);
      // trazo que se dibuja (invisible hasta que arranca: sin puntitos de caps)
      const dibujar = (e, t, d = 0.6, st = 0) => lista(e).forEach((el, i) => {
        const L = el.getTotalLength ? el.getTotalLength() + 2 : 2000;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t + i * st);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st);
      });
      // aparece entero
      const pop = (e, t, st = 0, origen = "50% 50%") => lista(e).forEach((el, i) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.8, transformOrigin: origen }, { opacity: 1, scale: 1, transformOrigin: origen, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t + i * st);
      });
      // cae como sello / palabra gigante
      const cae = (e, t, desde = 2.6) => lista(e).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      });
      const sacudon = (t, f = 1) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x, y, duration: 0.04, ease: "none" }, t + 0.04 + i * 0.045));
      const fuera = (e, t, d = 0.2) => tl.to(lista(e), { opacity: 0, duration: d, ease: "power2.in" }, t);
      // cartel de CAPA: golpe de pico al entrar, se va en "fin"
      const cartel = (fin) => {
        const c = q(".cartel");
        tl.fromTo(c.querySelector(".c-num"), { scale: 1.7, opacity: 0.3 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power4.in" }, 0);
        tl.fromTo(c.querySelector(".c-capa"), { y: -80, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 0);
        gsap.set(c.querySelector(".c-cota"), { opacity: 0 });
        tl.fromTo(c.querySelector(".c-cota"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, 0.3);
        sacudon(0.12, 1.2);
        tl.to(c, { y: -60, opacity: 0, scale: 0.9, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, fin - 0.25);
      };
      const CAJA = 0.7, CIV = 2.2, PERD = 3.0, CLI = 4.4;
      // cuadro 0: tierra ya visible, la cámara baja despacio
      qa(".s01-e").forEach((e, i) => tl.fromTo(e, { opacity: 0.5, scaleY: 0.85, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, transformOrigin: "50% 0%", duration: 0.5, ease: "power2.out" }, i * 0.08));
      tl.fromTo(ESC, { scale: 1.08, y: 40 }, { scale: 1, y: 0, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);
      tl.fromTo(q(".s01-suelo"), { opacity: 0.4 }, { opacity: 1, duration: 0.3 }, 0);
      qa(".s01-caja").forEach((el, i) => { const L = el.getTotalLength() + 2; gsap.set(el, { strokeDasharray: L }); tl.fromTo(el, { strokeDashoffset: L * 0.55 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, i * 0.04); });
      pop(".s01-post", 0.45, 0.1);
      pop(".s01-rot", 0.3);
      // "caja": tiembla y baja la ruta del mapa
      [[-6, 0], [6, 0], [-4, 0], [0, 0]].forEach(([x], i) => tl.to(qa(".s01-caja, .s01-post"), { x, duration: 0.04 }, CAJA + i * 0.05));
      const ruta = q(".s01-ruta");
      gsap.set(ruta, { opacity: 0, clipPath: "inset(0 0 100% 0)" });
      tl.set(ruta, { opacity: 1 }, CAJA + 0.1);
      tl.to(ruta, { clipPath: "inset(0 0 0% 0)", duration: 1.0, ease: "power2.inOut" }, CAJA + 0.1);
      dibujar(".s01-x", CAJA + 1.05, 0.25, 0.12);
      // "civilización perdida"
      cae(".s01-t1", CIV);
      sacudon(CIV);
      cae(".s01-t2", PERD);
      sacudon(PERD, 1.3);
      // "clientes": fósiles con caras
      tl.to([q(".s01-t1"), q(".s01-t2")], { opacity: 0.18, duration: 0.25 }, CLI - 0.3);
      pop(".s01-fos", CLI - 0.1, 0.07);
      qa(".s01-fos").forEach((f, i) => tl.to(f, { scale: 1.15, transformOrigin: "50% 50%", duration: 0.18, yoyo: true, repeat: 1 }, CLI + 0.45 + i * 0.05));
      cae(".s01-hall", CLI + 0.35, 2);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
