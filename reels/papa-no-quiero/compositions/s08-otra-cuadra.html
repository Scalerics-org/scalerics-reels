  <script>
    (function () {
      const ID = "s08-otra-cuadra";
      const DUR = 4.83;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');

      const tl = gsap.timeline({ paused: true });
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const POSES = {"abajo":{"c":[205,200],"h":[185,345]},"amasar":{"c":[225,240],"h":[130,318]},"arriba":{"c":[285,70],"h":[255,-60]},"cabeza":{"c":[250,-10],"h":[92,-200]},"pecho":{"c":[170,260],"h":[30,140]},"frente":{"c":[220,160],"h":[150,250]}};

      const sacudon = (el, t, f = 1) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(el, { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      const golpe = (el, t, rot = 0, s0 = 2.6) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: s0, rotation: rot * 2 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.12); };
      const pop = (el, t, d = 0.35, from = 0.6) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.8)", immediateRender: false }, t); };
      const entra = (el, t, y = 40, d = 0.3) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out", immediateRender: false }, t); };
      const dibujar = (els, t, d = 0.6, st = 0) => [].concat(els).forEach((e, i) => { const L = e.getTotalLength(); gsap.set(e, { strokeDasharray: L + 2, strokeDashoffset: L + 2, opacity: 0 }); tl.set(e, { opacity: 1 }, t + i * st); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st); });
      const corte = (fuera, dentro, t) => { if (dentro) gsap.set(dentro, { opacity: 0 }); if (fuera) tl.set(fuera, { opacity: 0 }, t); if (dentro) tl.set(dentro, { opacity: 1 }, t); };
      // cambio de pose de un brazo: p = prefijo, lado "i"/"d"
      const pose = (p, lado, nombre, t, d = 0.22, sel = "") => { const s = lado === "d" ? 1 : -1; const P = POSES[nombre]; const dd = "M" + 150 * s + " 70 Q" + P.c[0] * s + " " + P.c[1] + " " + P.h[0] * s + " " + P.h[1];
        tl.to(qa(sel + " ." + p + "brazo-" + lado + " path"), { attr: { d: dd }, duration: d, ease: "back.out(1.6)" }, t);
        tl.to(qa(sel + " ." + p + "brazo-" + lado + " circle"), { attr: { cx: P.h[0] * s, cy: P.h[1] }, duration: d, ease: "back.out(1.6)" }, t); };
      // cámara en mano: deriva suave y continua
      const mano = (el, dur, a = 7) => { for (let i = 0, t = 0; t < dur; i++, t += 0.9) tl.to(el, { x: a * Math.sin(i * 1.7 + 0.4), y: a * 0.8 * Math.cos(i * 2.3), rotation: 0.35 * Math.sin(i * 1.1), duration: 0.9, ease: "sine.inOut" }, t); };


      const SABEN = 0.58, EXISTIS = 0.95, BUSCAN = 2.04, SALE = 3.29, OTRA = 3.76;
      mano(q(".s08-cam"), DUR, 7);
      // los amigos mirando el celular, sin idea
      tl.to(qa(".s08-celus rect"), { opacity: 0.6, duration: 0.2, yoyo: true, repeat: 5 }, 0);
      const P = qa(".s08-a .s08-preg");
      P.forEach((p, i) => pop(p, EXISTIS - 0.1 + i * 0.1, 0.3, 0.2));
      P.forEach((p, i) => tl.to(p, { rotation: i % 2 ? 12 : -12, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, EXISTIS + 0.3));
      ["s08-a", "s08-b", "s08-c"].forEach((p, i) => tl.to(q("." + p + "cabeza"), { y: -8, duration: 0.14, yoyo: true, repeat: 1 }, SABEN + i * 0.08));
      // corte al mapa: buscan pizza
      const B = q(".s08-b");
      gsap.set(B, { opacity: 0 });
      tl.set(q(".s08-a"), { opacity: 0 }, 1.96);
      tl.set(B, { opacity: 1 }, 1.96);
      const L = qa(".s08-l");
      gsap.set(L, { opacity: 0 });
      L.forEach((l, i) => tl.set(l, { opacity: 1 }, BUSCAN + i * 0.045));
      // "les sale": el pin cae en la otra
      gsap.set([q(".s08-pin"), q(".s08-onda"), q(".s08-rot-otra"), q(".s08-preg-mio")], { opacity: 0 });
      tl.fromTo(q(".s08-pin"), { opacity: 1, y: -300 }, { opacity: 1, y: 0, duration: 0.35, ease: "bounce.out", immediateRender: false }, SALE - 0.1);
      tl.fromTo(q(".s08-onda"), { opacity: 1, scale: 0.3, svgOrigin: "745 250" }, { opacity: 0, scale: 1.6, svgOrigin: "745 250", duration: 0.6, ease: "power2.out", immediateRender: false }, SALE + 0.25);
      tl.fromTo(q(".s08-onda"), { opacity: 1, scale: 0.3, svgOrigin: "745 250" }, { opacity: 0, scale: 1.6, svgOrigin: "745 250", duration: 0.6, ease: "power2.out", immediateRender: false }, SALE + 0.75);
      tl.to(q(".s08-mio"), { opacity: 0.3, duration: 0.3 }, SALE + 0.2);
      entra(q(".s08-rot-otra"), OTRA - 0.1, 20, 0.25);
      pop(q(".s08-preg-mio"), OTRA, 0.3, 0.3);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.15, ease: "power2.in" }, DUR - 0.15);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
