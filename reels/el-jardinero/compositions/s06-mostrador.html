  <div id="root" data-composition-id="s06-mostrador" data-width="1080" data-height="1920" data-duration="3.71">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="3.71" data-track-index="0">
      <div class="s06-escenario">
        <svg class="s06-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="ja-sello s06-mal">¡NO SOY MAL JARDINERO!</div>
        <div class="ja-globo s06-g s06-g1">¿Me cobrás?</div>
        <div class="ja-globo s06-g s06-g2">¿Tenés cambio?</div>
        <div class="ja-globo s06-g s06-g3">¿Me lo envolvés?</div>

  <script>
    (function () {
      const ID = "s06-mostrador";
      const DUR = 3.71;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = JA.INK;
      // siluetas de la cola de clientes
      const sil = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" opacity="0.85"><circle cx="0" cy="-250" r="62" fill="${JA.INV2}" stroke="${I}" stroke-width="6"/>

      root.querySelector(".s06-svg").innerHTML =
        `<g class="s06-cola">${sil(110, 1250, 1.1)}${sil(250, 1200, 0.9)}${sil(900, 1230, 1.05)}${sil(1030, 1180, 0.85)}</g>` +
        `<g class="s06-dueno">${JA.dueno(540, 1330, 1.2, { cara: "grita", gota: true })}</g>` +
        JA.mostrador(90, 1300, 900, 240) +
        // caja registradora y celular que vibra
        `<g class="s06-caja"><rect x="700" y="1170" width="230" height="130" rx="14" fill="${JA.SECO}" stroke="${I}" stroke-width="7"/>

      const tl = gsap.timeline({ paused: true });
      const K = JA.kit(tl, root);
      const { q } = K;

      const JARDINERO = 1.36, MOSTRADOR = 2.63;

      // "¡Pará, Tito!": el dueño irrumpe desde abajo con sacudón
      tl.fromTo(q(".s06-dueno"), { y: 160 }, { y: 0, duration: 0.28, ease: "back.out(2.4)" }, 0);
      K.sacudon(q(".s06-escenario"), 0.25, 1.2);
      K.hablar(".ja-d-boca", 0.05, 11, 0.12);
      tl.fromTo(q(".s06-cola"), { opacity: 0.4 }, { opacity: 1, duration: 0.3 }, 0);
      tl.fromTo(q(".s06-cel"), { rotation: -3 }, { rotation: 3, svgOrigin: "220 1200", duration: 0.05, yoyo: true, repeat: 47, ease: "none" }, 0.2);
      tl.fromTo(q(".ja-d-gota"), { y: 0 }, { y: 40, duration: 0.8, repeat: 3, ease: "power1.in" }, 0.3);
      // "jardinero": sello
      K.sello(q(".s06-mal"), JARDINERO, -3);
      // "mostrador": la cola reclama
      K.pop(q(".s06-g1"), MOSTRADOR - 0.25);
      K.pop(q(".s06-g2"), MOSTRADOR - 0.05);
      K.pop(q(".s06-g3"), MOSTRADOR + 0.15);
      tl.to(q(".s06-escenario"), { scale: 1.06, duration: 1.2, ease: "power2.out", transformOrigin: "50% 60%" }, MOSTRADOR - 0.3);

      K.salida(q("#s06-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
