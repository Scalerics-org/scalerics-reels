  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="68.87">
    <div id="am-escena" class="am-capa clip" data-start="0" data-duration="68.87" data-track-index="0">
      <div class="am-vineta"></div>
      <svg class="am-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      <div class="am-cartel"><b>JARDÍN DE LA TARDE</b><small class="am-sub">EN VIVO · CANAL DE LA TARDE<i></i></small><small class="am-ia" style="position:absolute"><span>CON AGENTE DE IA</span> · EN VIVO</small></div>
      <div class="am-chapas">
        <div class="am-ch am-chj" style="color:#8cc85a"><div class="am-pl"><b>TITO</b><small>EL JARDINERO DE LA TARDE</small></div></div>
        <div class="am-ch am-chp" style="color:#f08a5c"><div class="am-pl"><b>LA PREGUNTONA</b><small>CLIENTA DESDE AGOSTO</small></div></div>
        <div class="am-ch am-chd" style="color:#f2c14e"><div class="am-pl"><b>EL DUEÑO</b><small>DEL VIVERO, Y DEL MOSTRADOR</small></div></div>
        <div class="am-ch am-cho" style="color:#5ce611"><div class="am-pl"><b>SCALERICS</b><small>AGENTES DE IA</small></div></div>
      </div>
      <div class="am-hum"><small>HUMEDAD</small><em class="am-seco">SECO</em><em class="am-ok">AL DÍA</em>

      </div>
      <div class="am-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 68.87;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // segundos globales (los reescribe armar.mjs desde assets/voice/palabras.json)
      const TURNOS = [[0,"j"],[18.04,"p"],[19.8,"j"],[34.26,"d"],[37.97,"j"],[42.96,"o"],[54.53,"j"],[56.8,"p"],[59.74,"j"],[62.49,"o"]];
      const SCALERICS = 43.57;
      const FLORECE = 55.45;

      // enredaderas que cuelgan de las esquinas de arriba (hojas en verde hoja)
      const hoja = (x, y, r, c) => `<path d="M${x} ${y} C${x - 22} ${y + 14} ${x - 20} ${y + 44} ${x} ${y + 56} C${x + 20} ${y + 44} ${x + 22} ${y + 14} ${x} ${y} Z" transform="rotate(${r} ${x} ${y})" fill="${c}" stroke="#1c1712" stroke-width="4"/>`;
      function enredadera(x0, lado, largo, cls) {
        let s = `<g class="${cls}"><path d="M${x0} -10 C${x0 + lado * 30} ${largo * 0.3} ${x0 - lado * 20} ${largo * 0.6} ${x0 + lado * 10} ${largo}" fill="none" stroke="#2c6b2a" stroke-width="8" stroke-linecap="round"/>`;
        for (let k = 1; k <= 7; k++) {
          const t = k / 8, y = largo * t;
          const x = x0 + lado * (k % 2 ? 26 : -14) * Math.sin(t * 3);
          s += hoja(x + (k % 2 ? 10 : -10), y, k % 2 ? -50 : 50, k % 3 ? "#4f9a3a" : "#8cc85a");
        }
        return s + "</g>";
      }
      q(".am-svg").innerHTML = enredadera(40, 1, 520, "am-en1") + enredadera(110, -1, 330, "am-en2") + enredadera(1040, -1, 480, "am-en3") + enredadera(975, 1, 300, "am-en4");
      [["am-en1", 40], ["am-en2", 110], ["am-en3", 1040], ["am-en4", 975]].forEach(([c, x], i) => {
        const el = q("." + c);
        gsap.set(el, { svgOrigin: `${x} 0`, smoothOrigin: false });
        const n = Math.floor(DUR / 2.4);
        tl.fromTo(el, { rotation: i % 2 ? 2.5 : -2.5 }, { rotation: i % 2 ? -2.5 : 2.5, duration: 1.2, yoyo: true, repeat: n * 2 - 1, ease: "sine.inOut" }, i * 0.3);
      });

      tl.fromTo(q(".am-cartel"), { y: -30, rotation: -1 }, { y: 0, rotation: 0, duration: 0.4, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".am-cartel small i"), { opacity: 1 }, { opacity: 0.2, duration: 0.5, yoyo: true, repeat: Math.floor(DUR) * 2 - 1, ease: "steps(1)" }, 0);

      const CH = { j: ".am-chj", p: ".am-chp", d: ".am-chd", o: ".am-cho" };
      let ant = null;
      TURNOS.forEach(([t, quien]) => {
        const el = q(CH[quien]);
        if (ant && ant !== el) tl.to(ant, { opacity: 0, x: -30, duration: 0.12, ease: "power2.in" }, t - 0.12);
        if (ant !== el) tl.fromTo(el, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(2.2)", immediateRender: false }, Math.max(0, t));
        ant = el;
      });

      // medidor de humedad: arranca casi vacío (SECO) y titila; con el agente se llena verde
      gsap.set(q(".am-lleno"), { scaleX: 0.16 });
      gsap.set(q(".am-verde"), { scaleX: 0 });
      tl.fromTo(q(".am-lleno"), { scaleX: 0.18 }, { scaleX: 0.08, duration: 2.2, yoyo: true, repeat: Math.floor(SCALERICS / 4.4) * 2 - 1, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".am-seco"), { opacity: 1 }, { opacity: 0.3, duration: 0.6, yoyo: true, repeat: Math.floor(SCALERICS / 1.2) * 2 - 1, ease: "steps(1)" }, 0);
      tl.to(q(".am-seco"), { opacity: 0, duration: 0.15 }, SCALERICS + 0.2);
      tl.to(q(".am-verde"), { scaleX: 0.55, duration: 1.2, ease: "power2.out" }, SCALERICS + 0.2);
      tl.to(q(".am-verde"), { scaleX: 1, duration: 0.8, ease: "power2.out" }, FLORECE);
      tl.to(q(".am-ok"), { opacity: 1, duration: 0.2 }, FLORECE + 0.4);
      tl.to(q(".am-hum"), { borderColor: "#5ce611", duration: 0.2 }, SCALERICS + 0.2);

      [SCALERICS, FLORECE].forEach((t) => {
        tl.to(q(".am-flash"), { opacity: 0.45, duration: 0.03 }, t);
        tl.to(q(".am-flash"), { opacity: 0, duration: 0.4, ease: "power2.out" }, t + 0.04);
      });
      tl.to(q(".am-sub"), { opacity: 0, duration: 0.15 }, SCALERICS);
      tl.to(q(".am-ia"), { opacity: 1, duration: 0.2 }, SCALERICS + 0.1);
      tl.to(q(".am-cartel"), { borderColor: "#3f9e0b", duration: 0.2 }, SCALERICS);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
