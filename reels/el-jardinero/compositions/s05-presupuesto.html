<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/jardin.js"></script>
  <style>
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s05-presupuesto"] .s05-capa, [data-composition-id="s05-presupuesto"] .s05-escenario { position: absolute; inset: 0; }
    [data-composition-id="s05-presupuesto"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s05-presupuesto"] .s05-anio { left: 90px; top: 590px; font-size: 64px; }
  </style>
  <div id="root" data-composition-id="s05-presupuesto" data-width="1080" data-height="1920" data-duration="6.99">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="6.99" data-track-index="0">
      <div class="s05-escenario">
        <svg class="s05-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="ja-sello s05-anio">PASÓ UN AÑO</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-presupuesto";
      const DUR = 6.99;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const PX = 320, PY = 1460, PS = 1.5;
      const I = JA.INK;
      const vela = (n, cls) => `<g class="${cls}"><rect x="790" y="1130" width="140" height="96" rx="12" fill="${JA.CRE}" stroke="${I}" stroke-width="6"/>
        <text x="860" y="1206" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="74" fill="${JA.TERRA3}">${n}</text></g>`;
      root.querySelector(".s05-svg").innerHTML =
        JA.estante(0, PY, 1080, { patas: 120 }) +
        // papel del presupuesto pendiente
        `<g class="s05-papel" transform="rotate(4 830 760)"><rect x="660" y="590" width="340" height="320" rx="10" fill="${JA.CRE}" stroke="${I}" stroke-width="7"/>
          <text data-layout-ignore x="830" y="650" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="30" fill="${I}" letter-spacing="3">PRESUPUESTO</text>
          <path d="M690 700 L970 700 M690 750 L930 750 M690 800 L950 800" stroke="${JA.CRE2}" stroke-width="12" stroke-linecap="round"/>
          <text data-layout-ignore x="830" y="870" text-anchor="middle" font-family="Caveat" font-weight="700" font-size="46" fill="${JA.TERRA3}">cumple de 15</text>
          <g class="s05-pend"><rect x="690" y="710" width="280" height="76" rx="8" fill="none" stroke="${JA.TERRA}" stroke-width="7" transform="rotate(-10 830 748)"/>
          <text x="830" y="764" text-anchor="middle" font-family="Black Ops One" font-size="40" fill="${JA.TERRA}" transform="rotate(-10 830 748)">PENDIENTE</text></g></g>` +
        // torta de cumpleaños
        `<g class="s05-torta"><rect x="690" y="1300" width="340" height="150" rx="16" fill="${JA.TERRA2}" stroke="${I}" stroke-width="7"/>
          <path d="M690 1330 Q720 1370 750 1330 Q780 1370 810 1330 Q840 1370 870 1330 Q900 1370 930 1330 Q960 1370 990 1330 Q1010 1360 1030 1330" fill="${JA.CRE}" stroke="${I}" stroke-width="5"/>
          <rect x="672" y="1440" width="376" height="22" rx="8" fill="${JA.CRE2}" stroke="${I}" stroke-width="5"/>
          <path d="M860 1300 L860 1240" stroke="${I}" stroke-width="5"/>
          <path class="s05-llama" d="M860 1236 C846 1214 852 1196 860 1184 C868 1196 874 1214 860 1236 Z" fill="${JA.AMA}" stroke="${I}" stroke-width="4"/></g>` +
        vela("15", "s05-v15") + vela("16", "s05-v16") +
        `<g class="s05-planta">${JA.planta(PX, PY, PS, { cls: "s05-p", cartel: ["EJEMPLAR 3", "del presupuesto"], cartelAncho: 290, gorro: [-6, -345, -14] })}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = JA.kit(tl, root);
      const { q } = K;

      const PRESU = 1.5, QUINCE = 3.66, DIECISEIS = 5.58;

      tl.fromTo(q(".s05-planta"), { y: 60, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 0);
      K.popSvg(q(".s05-p .ja-p-cartel"), 0.4, "580 1000", 0.4, 0.4);
      K.menear(q(".s05-planta"), PX, PY, 0.4, 0.9, 1.2, 3);
      // "presupuesto": el papel, pendiente
      K.pop(q(".s05-papel"), PRESU - 0.1);
      K.popSvg(q(".s05-pend"), PRESU + 0.5, "830 748", 0.18, 1.8);
      // "quince": la torta con la vela 15
      K.pop(q(".s05-torta"), QUINCE - 0.25);
      K.popSvg(q(".s05-v15"), QUINCE, "860 1178", 0.3, 0.2);
      tl.fromTo(q(".s05-llama"), { scaleX: 1 }, { scaleX: 0.7, svgOrigin: "860 1236", duration: 0.15, yoyo: true, repeat: 15, ease: "sine.inOut" }, QUINCE);
      // "dieciséis": la vela da vuelta a 16, la planta se seca más
      gsap.set(q(".s05-v16"), { opacity: 0 });
      tl.to(q(".s05-v15"), { scaleY: 0, svgOrigin: "860 1178", duration: 0.12, ease: "power2.in" }, DIECISEIS - 0.05);
      tl.fromTo(q(".s05-v16"), { opacity: 1, scaleY: 0, svgOrigin: "860 1178" }, { scaleY: 1, svgOrigin: "860 1178", duration: 0.18, ease: "back.out(2)", immediateRender: false }, DIECISEIS + 0.07);
      K.marchitar(".s05-p", DIECISEIS);
      tl.to(q(".s05-papel"), { opacity: 0.5, duration: 0.3 }, DIECISEIS);
      K.sello(q(".s05-anio"), DIECISEIS + 0.3, -6);

      K.salida(q("#s05-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
