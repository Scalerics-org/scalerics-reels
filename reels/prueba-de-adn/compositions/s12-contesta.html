<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s12-contesta"] .s12-capa { position: absolute; inset: 0; }
    [data-composition-id="s12-contesta"] .s12-esc { position: absolute; inset: 0; }
    [data-composition-id="s12-contesta"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s12-contesta"] .lin { fill: none; stroke: #fff4dc; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s12-contesta"] .txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; }
    [data-composition-id="s12-contesta"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.12em; }
    [data-composition-id="s12-contesta"] .zoc { position: absolute; left: 50px; top: 1376px; display: flex; height: 104px; border: 4px solid #fff4dc; border-radius: 10px; overflow: hidden; box-shadow: 8px 8px 0 rgba(10, 18, 80, 0.75); }
    [data-composition-id="s12-contesta"] .zoc .tab { display: flex; align-items: center; padding: 0 18px; background: #e5262d; color: #fff4dc; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="s12-contesta"] .zoc .tab.verde { background: #5ce611; color: #0a1250; }
    [data-composition-id="s12-contesta"] .zoc .tit { display: flex; align-items: center; padding: 0 26px; background: #ffd21f; color: #0a1250; font-family: "Lexend", sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="s12-contesta"] .sello b { display: inline-block; padding: 10px 28px; border: 7px solid #e5262d; border-radius: 14px; color: #e5262d; background: rgba(10, 18, 80, 0.88); font-family: "Lexend", sans-serif; font-weight: 900; text-transform: uppercase; white-space: nowrap; }

    [data-composition-id="s12-contesta"] .s12-a { top: 610px; font-weight: 900; font-size: 92px; color: #fff4dc; }
    [data-composition-id="s12-contesta"] .s12-b { top: 720px; font-weight: 800; font-size: 60px; color: #fff4dc; }
    [data-composition-id="s12-contesta"] .s12-c { top: 795px; font-weight: 800; font-size: 60px; color: #fff4dc; }
    [data-composition-id="s12-contesta"] .s12-d { top: 960px; font-weight: 900; font-size: 96px; color: #ffd21f; }
    [data-composition-id="s12-contesta"] .s12-e { top: 1075px; font-weight: 900; font-size: 110px; color: #ffd21f; text-shadow: 8px 8px 0 #e5262d; }
  </style>
  <div id="root" data-composition-id="s12-contesta" data-width="1080" data-height="1920" data-duration="4.09">
    <div id="s12-escena" class="s12-capa clip" data-start="0" data-duration="4.09" data-track-index="0">
      <div class="s12-esc">

        <div class="txt s12-a">Un cliente</div>
        <div class="txt s12-b">no es del que</div>
        <div class="txt s12-c">lo conoció primero</div>
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <path class="s12-tacha" d="M180 790 L900 745" stroke="#e5262d" stroke-width="14" stroke-linecap="round" fill="none" />
          <path class="s12-sub" d="M150 1220 Q540 1250 930 1214" stroke="#fff4dc" stroke-width="8" stroke-linecap="round" fill="none" />
          <g class="s12-chk"><circle cx="540" cy="1300" r="42" fill="#ffd21f" stroke="#fff4dc" stroke-width="5" /><path d="M518 1300 l14 14 l26 -28" stroke="#0a1250" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g>
        </svg>
        <div class="txt s12-d">Es del que</div>
        <div class="txt s12-e">le contesta</div>
        <div class="zoc s12-z"><div class="tab">Norma</div><div class="tit">La moraleja de hoy</div></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s12-contesta";
      const DUR = 4.09;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const lista = (x) => (typeof x === "string" ? qa(x) : Array.isArray(x) ? x : [x]);
      // trazo que se dibuja solo (opacity 0 hasta que arranca: sin puntitos de los caps)
      const dibujar = (sel, t, d = 0.6) => lista(sel).forEach((el) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote
      const pop = (sel, t, d = 0.35, s = 0.8) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe, como un sello
      const golpe = (sel, t, s = 2.2) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      });
      const fuera = (sel, t, d = 0.25) => tl.to(lista(sel), { opacity: 0, duration: d }, t);
      const sacudon = (t, f = 1, sel = ".s12-esc") => [[-14, 8], [11, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(sel), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      // la boca se mueve mientras habla
      const hablar = (sel, t0, t1) => {
        const n = Math.max(1, Math.floor((t1 - t0) / 0.12));
        tl.fromTo(q(sel), { scaleY: 0.45, transformOrigin: "50% 50%" }, { scaleY: 1.25, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: n % 2 ? n : n + 1, immediateRender: false }, t0);
      };
      // zócalos: cada uno entra desde la izquierda y saca al anterior
      const zocalos = (pares) => pares.forEach(([sel, t], i) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, x: -1100 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, t);
        if (i > 0) tl.to(q(pares[i - 1][0]), { opacity: 0, y: 30, duration: 0.18 }, t);
      });


      const NO = 0.92, PRIMERO = 1.97, ES = 2.53, CONTESTA = 2.9;
      tl.fromTo(q(".s12-a"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);
      pop(".s12-b", NO - 0.05, 0.3);
      pop(".s12-c", 1.6, 0.3);
      zocalos([[".s12-z", 0.2]]);
      dibujar(".s12-tacha", PRIMERO + 0.2, 0.3);
      tl.to([q(".s12-a"), q(".s12-b"), q(".s12-c")], { opacity: 0.4, duration: 0.3 }, ES);
      golpe(".s12-d", ES + 0.05, 1.8);
      golpe(".s12-e", CONTESTA + 0.05, 2.2);
      sacudon(CONTESTA + 0.08, 1.2);
      dibujar(".s12-sub", CONTESTA + 0.25, 0.4);
      pop(".s12-chk", CONTESTA + 0.5, 0.3, 0.4);
      tl.to(q(".s12-e"), { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, CONTESTA + 0.4);

      // salida: blur
      tl.to(q("#s12-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
