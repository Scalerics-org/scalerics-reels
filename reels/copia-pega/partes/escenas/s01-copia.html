<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Shojumaru"; font-weight: 400; font-display: block; src: url("assets/fonts/Shojumaru.woff2") format("woff2"); }
    @font-face { font-family: "Kaushan Script"; font-weight: 400; font-display: block; src: url("assets/fonts/KaushanScript.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-copia"] .capa { position: absolute; inset: 0; }
    [data-composition-id="s01-copia"] .fig { position: absolute; width: 400px; height: 720px; }
    [data-composition-id="s01-copia"] .fig svg, [data-composition-id="s01-copia"] .obj svg { width: 100%; height: 100%; overflow: visible; }
    [data-composition-id="s01-copia"] .obj { position: absolute; }
    [data-composition-id="s01-copia"] .s01-mae { left: 40px; top: 676px; }
    [data-composition-id="s01-copia"] .pal { position: absolute; left: 470px; width: 580px; text-align: center; font-family: "Shojumaru", serif; font-size: 134px; line-height: 1; white-space: nowrap; }
    [data-composition-id="s01-copia"] .pal small { display: block; margin-top: 18px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.3em; color: #1b1712; opacity: 0.7; }
    [data-composition-id="s01-copia"] .s01-c { top: 640px; color: #1b1712; }
    [data-composition-id="s01-copia"] .s01-p { top: 900px; color: #c8102e; }
    [data-composition-id="s01-copia"] .s01-cont { position: absolute; left: 520px; top: 1150px; width: 480px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 34px; letter-spacing: 0.14em; color: #1b1712; }
    [data-composition-id="s01-copia"] .s01-cont b { color: #c8102e; font-weight: 500; }
    [data-composition-id="s01-copia"] .hanko { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; border: 9px solid #c8102e; border-radius: 18px; color: #c8102e; font-family: "Shojumaru", serif; line-height: 1.02; background: rgba(239, 228, 204, 0.9); }
    [data-composition-id="s01-copia"] .s01-vida { left: 520px; top: 740px; width: 470px; height: 470px; font-size: 92px; }
    [data-composition-id="s01-copia"] .s01-vida span { display: block; }
    [data-composition-id="s01-copia"] .s01-sm { left: 690px; top: 1250px; width: 260px; height: 156px; }
    [data-composition-id="s01-copia"] .s01-smtxt { position: absolute; left: 560px; top: 1426px; width: 480px; text-align: center; font-family: "Kaushan Script", cursive; font-size: 54px; line-height: 1; color: #1b1712; white-space: nowrap; }
    [data-composition-id="s01-copia"] .s01-flecha { left: 760px; top: 1180px; width: 120px; height: 80px; }
  </style>
  <div id="root" data-composition-id="s01-copia" data-width="1080" data-height="1920" data-duration="6.84">
    <div id="s01-escena" class="capa clip" data-start="0" data-duration="6.84" data-track-index="0">
      <div class="capa s01-esc">
        <div class="fig s01-mae"><svg viewBox="0 0 400 720" aria-hidden="true"><!--@MAESTRO--></svg></div>
        <div class="pal s01-c">COPIÁ<small class="s01-k">CTRL + C</small></div>
        <div class="pal s01-p">PEGÁ<small class="s01-k">CTRL + V</small></div>
        <div class="s01-cont">REPETICIÓN <b class="s01-n">1</b></div>
        <div class="hanko s01-vida"><div><span>DE POR</span><span>VIDA</span></div></div>
        <div class="obj s01-sm"><svg viewBox="0 0 200 120" aria-hidden="true"><!--@SALTAMONTES--></svg></div>
        <div class="s01-smtxt">pequeño saltamontes</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-copia";
      const DUR = 6.84;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const temblor = (t, f = 12) => [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // sello: cae grande y golpea
      const sello = (el, t, rot = 0) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 2.4, rotation: rot - 8 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.12); };

      const PALABRAS = [0, 0.83, 1.61, 2.42];
      const VIDA = 3.1, PEQUENO = 4.7, SALTA = 5.4;

      // cuadro 0: el maestro ya está, la cámara se acerca despacio
      tl.fromTo(q(".s01-esc"), { scale: 1.05 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 60%" }, 0);
      tl.fromTo(q(".s01-mae"), { y: 16 }, { y: 0, duration: 0.3, ease: "power3.out" }, 0);
      // el dedo marca el ritmo
      const brazo = q(".m-brazo-d");
      PALABRAS.forEach((t) => {
        tl.fromTo(brazo, { rotation: -14, svgOrigin: "266 290" }, { rotation: 6, svgOrigin: "266 290", duration: 0.14, ease: "power3.out", immediateRender: false }, t);
        tl.to(q(".m-cabeza"), { y: 6, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, t);
      });

      // COPIÁ / PEGÁ: golpe a golpe, se van alternando
      const c = q(".s01-c"), p = q(".s01-p"), n = q(".s01-n");
      gsap.set([c, p], { opacity: 0 });
      tl.fromTo(c, { opacity: 0.85, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in" }, 0);
      temblor(0.12);
      tl.to(c, { opacity: 0.25, duration: 0.1 }, PALABRAS[1] - 0.05);
      sello(p, PALABRAS[1]); temblor(PALABRAS[1] + 0.03);
      tl.to(p, { opacity: 0.25, duration: 0.1 }, PALABRAS[2] - 0.05);
      tl.fromTo(c, { opacity: 0.25, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, PALABRAS[2] - 0.12); temblor(PALABRAS[2] + 0.03);
      tl.to(c, { opacity: 0.25, duration: 0.1 }, PALABRAS[3] - 0.05);
      tl.fromTo(p, { opacity: 0.25, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, PALABRAS[3] - 0.12); temblor(PALABRAS[3] + 0.03);
      // contador de repeticiones: 1, 2, 3, 4 en cada golpe y en "el resto de tu vida" se dispara
      tl.fromTo(q(".s01-cont"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.2);
      PALABRAS.forEach((t) => tl.fromTo(n, { scale: 1.6 }, { scale: 1, duration: 0.2, ease: "back.out(3)", immediateRender: false }, t));
      const reloj = { t: 0 };
      tl.fromTo(reloj, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => {
        const t = reloj.t;
        let v = PALABRAS.filter((x) => x <= t).length || 1;
        if (t > VIDA) v = Math.round(4 + 9995 * Math.pow(Math.min(1, (t - VIDA) / 1.4), 2));
        n.textContent = String(v);
      } }, 0);
      tl.to([c, p], { opacity: 0, scale: 0.85, duration: 0.2, ease: "power2.in" }, VIDA + 0.5);
      tl.to(q(".s01-cont"), { y: -500, scale: 1.25, duration: 0.35, ease: "power3.inOut" }, VIDA + 0.4);
      sello(q(".s01-vida"), 4.6, -6); temblor(4.62, 16);
      tl.to(q(".m-sonrisa"), { opacity: 1, duration: 0.1 }, VIDA + 0.3);
      tl.to(q(".m-boca"), { opacity: 0, duration: 0.1 }, VIDA + 0.3);

      // "pequeño saltamontes": salta al tatami
      tl.to(q(".s01-vida"), { scale: 0.62, x: 60, y: -150, duration: 0.3, ease: "power3.inOut" }, PEQUENO + 0.15);
      tl.to(q(".s01-cont"), { opacity: 0, duration: 0.2 }, PEQUENO + 0.1);
      gsap.set(q(".s01-sm"), { opacity: 0 });
      tl.fromTo(q(".s01-sm"), { opacity: 1, x: 380, y: -220, rotation: 20 }, { x: 0, y: 0, rotation: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, PEQUENO + 0.05);
      tl.to(q(".s01-sm"), { y: -50, duration: 0.16, yoyo: true, repeat: 3, ease: "sine.out" }, PEQUENO + 0.55);
      gsap.set(q(".s01-smtxt"), { opacity: 0 });
      tl.fromTo(q(".s01-smtxt"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)", immediateRender: false }, SALTA - 0.1);
      tl.to(q(".m-cejas"), { y: -8, duration: 0.12, yoyo: true, repeat: 1 }, SALTA);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
