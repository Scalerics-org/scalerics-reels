      const DUR = 4.26;

      // "hace un año": los palitos de conteo en la pared se dibujan a toda velocidad
      const palos = qa(".s02-palo");
      palos.forEach((el) => { const L = el.getTotalLength(); gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 }); });

      gsap.set(q(".s02-dia"), { opacity: 0 });

      tl.fromTo(cnt, { v: 1 }, { v: 365, duration: 1.0, ease: "power2.out", immediateRender: false, onUpdate: () => (n.textContent = String(Math.round(cnt.v))) }, HACE + 0.2);

      tl.to(q(".a-ojos"), { opacity: 0, duration: 0.05 }, ACA);
