    (function () {
      const ID = "s03-cera";
      const DUR = 4.56;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const ESC = q(".esc");
      const temblor = (t, f = 12) => [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      // pop: aparece entero

      const COMO = 1.2, KID = 1.9, DAR = 2.74, PULIR = 3.3;

      tl.fromTo(q(".s03-ref"), { opacity: 0, y: 80, rotation: -6 }, { opacity: 1, y: 0, rotation: -2, duration: 0.3, ease: "back.out(2)", immediateRender: false }, COMO);
      tl.to(q(".s03-ref"), { rotation: 2, duration: 0.12, yoyo: true, repeat: 1 }, KID);

      // "dar cera, pulir cera": dos manos que giran
      const c1 = q(".s03-c1"), c2 = q(".s03-c2");
      dibujar([c1], DAR - 0.1, 0.6);
      dibujar([c2], PULIR - 0.1, 0.6);
      gsap.set([q(".s03-fl1"), q(".s03-fl2"), q(".s03-m1"), q(".s03-m2")], { opacity: 0 });
      tl.to(q(".s03-fl1"), { opacity: 1, duration: 0.1 }, DAR + 0.45);
      tl.to(q(".s03-fl2"), { opacity: 1, duration: 0.1 }, PULIR + 0.45);
      const gira = (mano, path, t) => {
        const L = path.getTotalLength(), p = { v: 0 };
        const pon = () => { const pt = path.getPointAtLength((p.v % 1) * L); gsap.set(mano, { x: pt.x, y: pt.y }); };

        tl.to(mano, { opacity: 1, duration: 0.1 }, t);
