  <script>
    (function () {
      const ID = "s04-planilla";
      const DUR = 5.6;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const ESC = q(".esc");
      const temblor = (t, f = 12) => [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // sello: cae grande y golpea en t
      const sello = (el, t, rot = 0, desde = 2.4) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: desde, rotation: rot - 8 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.12); };
      // pop: aparece entero
      const pop = (el, t, d = 0.3) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.8)", immediateRender: false }, t); };
      // entra desde abajo
      const sube = (el, t, d = 0.25) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: d, ease: "power3.out", immediateRender: false }, t); };
      // trazos que se dibujan
      const dibujar = (els, t, d = 0.5, st = 0.05) => [].concat(els).forEach((el, i) => { const L = el.getTotalLength(); gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 }); tl.set(el, { opacity: 1 }, t + i * st); tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t + i * st); });
      // ojos/boca del personaje: cambia de cara
      const cara = (t, on, off) => { if (on) tl.to(qa(on), { opacity: 1, duration: 0.05 }, t); if (off) tl.to(qa(off), { opacity: 0, duration: 0.05 }, t); };
      const salida = () => tl.to(q("#" + ID.slice(0, 3) + "-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      const COPIAR = 0.72, PEGAR = 1.44, DEL = 2.61, PLANILLA = 3.34, UNO = 4.4, UNO2 = 4.89;

      tl.fromTo(q(".s04-cel"), { x: -40, rotation: -3 }, { x: 0, rotation: -1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(q(".s04-hoja"), { x: 40, rotation: 3 }, { x: 0, rotation: 1, duration: 0.3, ease: "power3.out" }, 0);
      gsap.set(qa(".s04-f"), { opacity: 0 });
      // los mensajes van llegando
      qa(".s04-m").forEach((m, i) => { if (i > 0) pop(m, 0.05 + i * 0.12, 0.22); });

      // copiar: el mensaje se marca; pegar: vuela a la fila
      const marca = (m, t) => tl.fromTo(m, { backgroundColor: "#fbf6ea" }, { backgroundColor: "#c99a2e", duration: 0.1, immediateRender: false }, t);
      const vuela = (v, m, fila, t0, t1) => {
        gsap.set(v, { opacity: 0 });
        const cel = { x: 60 + 22, y: 620 + parseInt(m.style.top) };
        const fx = 500 + 70, fy = 620 + parseInt(fila.parentNode.style.top) + 14;
        tl.fromTo(v, { opacity: 1, x: cel.x, y: cel.y, scale: 1 }, { x: cel.x + 30, y: cel.y - 30, scale: 1.05, duration: 0.2, ease: "power2.out", immediateRender: false }, t0);
        tl.to(v, { x: fx, y: fy, scale: 0.8, duration: t1 - t0 - 0.2, ease: "power2.inOut" }, t0 + 0.2);
        tl.to(v, { opacity: 0, duration: 0.06 }, t1);
        tl.fromTo(fila, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.12, immediateRender: false }, t1);
      };
      marca(q(".s04-m1"), COPIAR);
      pop(q(".s04-tc"), COPIAR - 0.05, 0.2);
      vuela(q(".s04-v1"), q(".s04-m1"), q(".s04-f1"), COPIAR + 0.1, PEGAR + 0.15);
      pop(q(".s04-tv"), PEGAR, 0.2);
      temblor(PEGAR + 0.15, 6);
      marca(q(".s04-m2"), DEL);
      vuela(q(".s04-v2"), q(".s04-m2"), q(".s04-f2"), DEL + 0.05, PLANILLA + 0.1);
      temblor(PLANILLA + 0.1, 6);
      tl.fromTo([q(".s04-tc"), q(".s04-tv")], { scale: 1.2 }, { scale: 1, duration: 0.15, stagger: 0.35, immediateRender: false }, DEL);
      // uno por uno: las filas se llenan de a una, cada vez más rápido
      [[3, 3.75], [4, 4.1], [5, 4.42]].forEach(([n, t]) => { marca(q(".s04-m" + n), t - 0.2); tl.fromTo(q(".s04-f" + n), { opacity: 0 }, { opacity: 1, duration: 0.08, immediateRender: false }, t); });
      tl.to([q(".s04-cel"), q(".s04-hoja")], { opacity: 0.35, duration: 0.2 }, UNO);
      sello(q(".s04-uno"), UNO + 0.05, -4);
      temblor(UNO + 0.08, 14);
      tl.fromTo(q(".s04-uno"), { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, UNO2);

      salida();
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
