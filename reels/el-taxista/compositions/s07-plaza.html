    (function () {
      const ID = "s07-plaza";

      const entra = (el, t, desde = { x: -700 }, d = 0.35) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, Object.assign({ opacity: 1 }, desde), { opacity: 1, x: 0, y: 0, duration: d, ease: "back.out(1.3)", immediateRender: false }, t); };
      const sacudon = (t, f = 1) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.1, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);
      // respira / rebota suave
      const vaiven = (el, t, d, vars, per = 0.4) => tl.to(el, Object.assign({ duration: per, yoyo: true, repeat: Math.max(1, Math.floor(d / per)) | 1, ease: "sine.inOut" }, vars), t);

      const CONOZCO = 0.36, FRENTE = 1.55, PLAZA = 1.91, O = 2.97, OTRA = 3.36;
      tl.fromTo(q(".s07-mapa"), { scale: 1.15, svgOrigin: "560 1070", opacity: 0.6 }, { scale: 1, svgOrigin: "560 1070", opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

      tl.to(q(".s07-yo"), { opacity: 0, y: -40, duration: 0.2 }, FRENTE - 0.3);
      const T = q(".s07-taxi");
      gsap.set(T, { x: 560, y: 1520, rotation: 0 });
      const ruta = [[560, 850, 0, 0.3, 1.0], [320, 850, -90, 1.05, 0.5], [320, 750, 0, 1.6, 0.3], [320, 850, 180, 2.95, 0.2], [800, 850, 90, 3.1, 0.35], [800, 1165, 180, 3.45, 0.3]];
      ruta.forEach(([x, y, rot, t, d]) => { tl.to(T, { rotation: rot, duration: 0.1 }, t); tl.to(T, { x, y, duration: d, ease: "power1.inOut" }, t + 0.05); });
      pop(q(".s07-g1"), PLAZA, 0.3);
      tl.fromTo(q(".s07-p1"), { opacity: 1 }, { opacity: 0.5, duration: 0.15, yoyo: true, repeat: 5, immediateRender: false }, PLAZA);
