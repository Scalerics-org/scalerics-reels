  <style>

    [data-composition-id="s04-techo"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

  <div id="root" data-composition-id="s04-techo" data-width="1080" data-height="1920" data-duration="4.68">
    <div id="s04-escena" class="s04-capa clip" data-start="0" data-duration="4.68" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s04-suelo" x1="220" y1="1160" x2="860" y2="1160" />
        <!-- el techo -->
        <g class="s04-techo-g">
          <line class="ln-techo s04-techo" x1="220" y1="712" x2="860" y2="712" />
          <text class="rotulo rotulo-ac s04-rot-techo" x="860" y="686" text-anchor="end">TECHO</text>
        </g>
        <!-- la columna de horas (tu negocio) -->
        <g class="s04-col">
          <g class="s04-bloque"><rect class="ln" x="-70" y="-80" width="140" height="74" rx="10" /><circle class="ln-fino" cx="0" cy="-43" r="18" /><path class="ln-fino" d="M0 -43 V-54 M0 -43 L8 -38" /></g>
          <g class="s04-bloque"><rect class="ln" x="-70" y="-80" width="140" height="74" rx="10" /><circle class="ln-fino" cx="0" cy="-43" r="18" /><path class="ln-fino" d="M0 -43 V-54 M0 -43 L8 -38" /></g>
          <g class="s04-bloque"><rect class="ln" x="-70" y="-80" width="140" height="74" rx="10" /><circle class="ln-fino" cx="0" cy="-43" r="18" /><path class="ln-fino" d="M0 -43 V-54 M0 -43 L8 -38" /></g>
          <g class="s04-bloque"><rect class="ln" x="-70" y="-80" width="140" height="74" rx="10" /><circle class="ln-fino" cx="0" cy="-43" r="18" /><path class="ln-fino" d="M0 -43 V-54 M0 -43 L8 -38" /></g>
          <g class="s04-bloque"><rect class="ln" x="-70" y="-80" width="140" height="74" rx="10" /><circle class="ln-fino" cx="0" cy="-43" r="18" /><path class="ln-fino" d="M0 -43 V-54 M0 -43 L8 -38" /></g>

          <g class="s04-reloj-in">

  <script>
    (function () {
      const ID = "s04-techo";
      const DUR = 4.68;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const LLEGA = 0.59;
      const HASTA = 1.39;
      const LLEGAN = 1.89;
      const HORAS = 2.29;
      const Y = 3.2;
      const DIA = 3.39;
      const ESTIRA = 3.79;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, o) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // suelo ya dibujado a medias; el primer bloque ya está
      dibujar([q(".s04-suelo")], 0, 0.5, 0.5);
      gsap.set(q(".s04-col"), { x: 380, y: 1160 });
      const bloques = qa(".s04-bloque");
      const TS = [0, LLEGA, LLEGA + 0.4, LLEGA + 0.8, HORAS - 0.25];
      bloques.forEach((b, i) => {
        const yy = -i * 88;
        if (i === 0) {
          gsap.set(b, { y: yy });
          tl.fromTo(b, { scale: 0.9, svgOrigin: "0 -6" }, { scale: 1, svgOrigin: "0 -6", duration: 0.3, ease: "back.out(2)" }, 0);
        } else {
          tl.fromTo(b, { y: yy + 50, opacity: 0 }, { y: yy, opacity: 1, duration: 0.28, ease: "back.out(2)" }, TS[i]);
          tl.to(b, { y: yy + 4, duration: 0.06, ease: "power1.out", yoyo: true, repeat: 1 }, TS[i] + 0.28);
        }
        // las agujas de cada relojito giran
        tl.fromTo(b.querySelector("path"), { rotation: 0, svgOrigin: "0 -43" }, { rotation: 360, svgOrigin: "0 -43", duration: DUR, ease: "none" }, 0);
      });
      pop(q(".s04-rot-neg"), LLEGA, "380 1196");

      // "hasta": el techo verde
      dibujar([q(".s04-techo")], HASTA - 0.1, 0.45);
      pop(q(".s04-rot-techo"), HASTA + 0.2, "800 680");
      // "horas": el último bloque choca contra el techo y todo tiembla
      tl.to(q(".s04-techo-g"), { y: -10, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1 }, HORAS + 0.03);
      tl.to(q(".s04-col"), { x: 386, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, HORAS + 0.05);
      tl.to(q(".s04-col"), { y: 1166, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, HORAS + 0.4);

      // "el día": el reloj
      dibujar(qa(".s04-dib-r"), Y - 0.05, 0.4);
      pop(q(".s04-aguja-h"), DIA - 0.1, "720 960");
      pop(q(".s04-aguja-m"), DIA - 0.05, "720 960");
      pop(q(".s04-rot-dia"), DIA, "720 1100");
      pop(q(".s04-centro"), DIA - 0.1, "720 960");
      tl.to(q(".s04-aguja-m"), { rotation: 300, svgOrigin: "720 960", duration: 1.2, ease: "power1.inOut" }, DIA);
      // "estira": intenta estirarse y vuelve de golpe; aparecen los topes
      gsap.set(qa(".s04-tope-a, .s04-tope-b"), { opacity: 0 });
      tl.to(q(".s04-reloj-in"), { scaleX: 1.32, svgOrigin: "720 960", duration: 0.25, ease: "power2.out" }, ESTIRA - 0.1);
      tl.to(qa(".s04-tope-a, .s04-tope-b"), { opacity: 1, duration: 0.1 }, ESTIRA);
      tl.to(q(".s04-tope-a"), { x: -6, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, ESTIRA + 0.12);
      tl.to(q(".s04-tope-b"), { x: 6, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, ESTIRA + 0.12);
      tl.to(q(".s04-reloj-in"), { scaleX: 1, svgOrigin: "720 960", duration: 0.5, ease: "elastic.out(1.2, 0.4)" }, ESTIRA + 0.18);

      // etiquetas
      tl.fromTo(q(".s04-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, HASTA);
      tl.to(q(".s04-e1"), { opacity: 0, duration: 0.2 }, DIA - 0.2);
      tl.fromTo(q(".s04-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, DIA);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
