  <style>

    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s05-malabares"] .s05-capa { position: absolute; inset: 0; }
    [data-composition-id="s05-malabares"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s05-malabares"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-malabares"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

    [data-composition-id="s05-malabares"] .ln-fino { fill: none; stroke: rgba(239, 238, 229, 0.6); stroke-width: 4; stroke-linecap: round; }

    [data-composition-id="s05-malabares"] .signo { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 38px; fill: #5ce611; }

    [data-composition-id="s05-malabares"] .rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: #efeee5; }
    [data-composition-id="s05-malabares"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s05-malabares"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s05-malabares" data-width="1080" data-height="1920" data-duration="6.21">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="6.21" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s05-suelo" x1="120" y1="1180" x2="960" y2="1180" />
        <!-- el arco de los malabares -->
        <circle class="ln-tenue s05-arco" cx="640" cy="780" r="150" />
        <!-- el dueño -->
        <g class="s05-duenio">
          <circle class="ln s05-dib-d" cx="640" cy="1010" r="24" />
          <path class="ln s05-dib-d" d="M640 1034 V1112 M640 1112 L616 1180 M640 1112 L664 1180" />
          <path class="ln s05-dib-d" d="M640 1052 L590 1000 L578 950 M640 1052 L690 1000 L702 950" />
        </g>
        <!-- el mostrador con el cliente que espera -->
        <g class="s05-most">
          <circle class="ln s05-dib-m" cx="250" cy="1000" r="20" />
          <path class="ln s05-dib-m" d="M250 1020 V1090 M250 1040 L226 1076 M250 1040 L274 1076" />
          <rect class="ln s05-dib-m" x="140" y="1090" width="230" height="90" rx="6" />
          <text class="rotulo s05-rot-m" x="255" y="1146" text-anchor="middle">CAJA</text>
          <g class="s05-espera">
            <rect class="ln" x="196" y="900" width="108" height="56" rx="24" />
            <circle class="relleno-ac s05-pt" cx="226" cy="928" r="7" />
            <circle class="relleno-ac s05-pt" cx="250" cy="928" r="7" />
            <circle class="relleno-ac s05-pt" cx="274" cy="928" r="7" />
          </g>
        </g>
        <!-- las tres cosas que giran: cada una en su órbita, contra-rotada para quedar derecha -->
        <g class="s05-orb s05-orb1">
          <g class="s05-item s05-item1">
            <path class="ln" d="M586 604 H694 Q706 604 706 616 V664 Q706 676 694 676 H604 L586 694 V616 Q586 604 598 604 Z" />
            <text class="signo" x="646" y="654" text-anchor="middle">$</text>
          </g>

        <g class="s05-orb s05-orb2">
          <g class="s05-item s05-item2">
            <path class="ln" d="M600 586 H680 V674 L668 666 L656 674 L644 666 L632 674 L620 666 L608 674 L600 666 Z" />
            <path class="ln-fino" d="M614 608 H666 M614 628 H666 M614 648 H648" />

        <g class="s05-orb s05-orb3">
          <g class="s05-item s05-item3">

            <path class="ln-fino" d="M606 628 H684 M606 652 H660" />

      </svg>
      <div class="etiqueta"><span class="s05-e1">Todo a la vez</span><span class="s05-e2">Malabares</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-malabares";
      const DUR = 6.21;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const PRECIO = 0.91;
      const WHATSAPP = 1.71;
      const EL = 2.39;
      const MOSTRADOR = 2.61;
      const ESPERA = 2.91;
      const MIENTRAS = 3.89;
      const PEDIDO = 4.61;
      const ENTRA = 5.01;
      const OTRO = 5.51;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, o) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // el dueño ya está medio dibujado en el cuadro 0
      dibujar([q(".s05-suelo")], 0, 0.5, 0.5);
      dibujar(qa(".s05-dib-d"), 0, 0.5, 0.5);
      gsap.set(q(".s05-arco"), { opacity: 0 });
      tl.to(q(".s05-arco"), { opacity: 1, duration: 0.4 }, 0.3);
      tl.fromTo(q(".s05-arco"), { rotation: 0, svgOrigin: "640 780" }, { rotation: 90, svgOrigin: "640 780", duration: DUR, ease: "none" }, 0);

      // órbitas: misma velocidad, separadas 120°, el ritmo se acelera al final
      const C = "640 780";
      const orbs = [q(".s05-orb1"), q(".s05-orb2"), q(".s05-orb3")];
      const items = [q(".s05-item1"), q(".s05-item2"), q(".s05-item3")];
      const BASE = [0, -120, -240];
      orbs.forEach((o, i) => {
        tl.fromTo(o, { rotation: BASE[i], svgOrigin: C }, { rotation: BASE[i] + 640, svgOrigin: C, duration: DUR, ease: "power1.in" }, 0);
        tl.fromTo(items[i], { rotation: -BASE[i], svgOrigin: "646 640" }, { rotation: -BASE[i] - 640, svgOrigin: "646 640", duration: DUR, ease: "power1.in" }, 0);
      });
      const entra = (el, t) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t);
      entra(orbs[0], PRECIO - 0.1);
      gsap.set(orbs, { opacity: 0 });
      entra(orbs[1], PEDIDO - 0.05);
      entra(orbs[2], ENTRA);
      tl.to(q(".s05-item1 .signo"), { scale: 1.3, svgOrigin: "646 640", duration: 0.12, yoyo: true, repeat: 1 }, WHATSAPP);
      tl.to(q(".s05-item3 circle"), { scale: 1.35, svgOrigin: "704 606", duration: 0.12, yoyo: true, repeat: 1 }, OTRO);

      // el mostrador: el cliente que espera
      dibujar(qa(".s05-dib-m"), EL - 0.1, 0.4);
      pop(q(".s05-rot-m"), MOSTRADOR, "255 1140");
      pop(q(".s05-espera"), ESPERA - 0.1, "250 928");
      qa(".s05-pt").forEach((p, i) => {
        [0, 1, 2].forEach((k) => tl.to(p, { y: -8, duration: 0.12, ease: "sine.out", yoyo: true, repeat: 1 }, ESPERA + 0.2 + k * 0.7 + i * 0.12));
      });
      tl.to(qa(".s05-dib-m"), { x: -4, duration: 0.07, ease: "none", yoyo: true, repeat: 5 }, ESPERA + 0.2);
      tl.to(qa(".s05-most"), { opacity: 0.45, duration: 0.4 }, MIENTRAS);

      // al final el dueño tambalea
      tl.to(q(".s05-duenio"), { rotation: -5, svgOrigin: "640 1180", duration: 0.18, ease: "sine.inOut" }, OTRO - 0.1);
      tl.to(q(".s05-duenio"), { rotation: 5, svgOrigin: "640 1180", duration: 0.2, ease: "sine.inOut" }, OTRO + 0.08);
      tl.to(q(".s05-duenio"), { rotation: -3, svgOrigin: "640 1180", duration: 0.2, ease: "sine.inOut" }, OTRO + 0.28);

      // etiquetas
      tl.fromTo(q(".s05-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, PRECIO);
      tl.to(q(".s05-e1"), { opacity: 0, duration: 0.2 }, ENTRA - 0.2);
      tl.fromTo(q(".s05-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, ENTRA);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
