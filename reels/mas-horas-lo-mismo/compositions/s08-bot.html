    (function () {
      const ID = "s08-bot";
      const DUR = 6.76;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SCALERICS = 0.16;
      const ARMAMOS = 1.06;
      const COMERCIOS = 1.76;
      const UN = 3.11;
      const BOT = 3.16;
      const CONTESTA = 4.06;
      const INSTANTE = 4.66;
      const PRECIOS = 5.56;
      const TOMA = 6.26;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, o) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // A. la caja arranca medio dibujada; "Scalerics" entra con golpe
      dibujar([q(".s08-caja")], 0, 0.5, 0.45);
      tl.fromTo(q(".s08-marca"), { opacity: 0, scale: 0.8, svgOrigin: "540 840" }, { opacity: 1, scale: 1, svgOrigin: "540 840", duration: 0.4, ease: "back.out(1.8)" }, SCALERICS);
      tl.to(q(".s08-a"), { y: -8, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, ARMAMOS);
      // "comercios": tres locales chicos
      dibujar([q(".s08-suelo")], COMERCIOS - 0.3, 0.4);
      qa(".s08-loc").forEach((l, i) => {
        gsap.set(l, { x: 340 + i * 200, y: 1170 });
        tl.fromTo(l, { opacity: 0, y: 1200 }, { opacity: 1, y: 1170, duration: 0.3, ease: "back.out(2)" }, COMERCIOS - 0.1 + i * 0.12);
      });
      pop(q(".s08-para"), COMERCIOS, "540 960");
      tl.to(q(".s08-a"), { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, UN - 0.2);

      // B. el celular
      dibujar(qa(".s08-dib-t"), BOT - 0.1, 0.5);
      tl.fromTo(q(".s08-b"), { y: 40 }, { y: 0, duration: 0.5, ease: "power3.out" }, BOT - 0.1);
      tl.fromTo(q(".s08-cab"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, BOT + 0.2);
      pop(q(".s08-m1"), BOT + 0.35, "690 789");
      // escribiendo... y "contesta": la respuesta verde de golpe
      pop(q(".s08-escribe"), CONTESTA - 0.4, "435 864");
      qa(".s08-escribe circle").forEach((c, i) => tl.to(c, { y: -6, duration: 0.1, yoyo: true, repeat: 1 }, CONTESTA - 0.3 + i * 0.08));
      tl.to(q(".s08-escribe"), { opacity: 0, duration: 0.05 }, CONTESTA);
      pop(q(".s08-r1"), CONTESTA, "380 886");
      // "al instante": en línea
      pop(q(".s08-linea"), INSTANTE - 0.1, "650 694");
      tl.to(q(".s08-linea"), { opacity: 0.4, duration: 0.15, yoyo: true, repeat: 3 }, INSTANTE + 0.3);
      // "precios": el precio late
      tl.to(q(".s08-precio"), { scale: 1.25, svgOrigin: "398 904", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, PRECIOS);
      // "toma los pedidos"
      pop(q(".s08-m2"), PRECIOS + 0.3, "690 985");
      pop(q(".s08-r2"), TOMA, "380 1065");
      dibujar([q(".s08-tilde")], TOMA + 0.2, 0.25);

      // etiquetas
      tl.fromTo(q(".s08-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, ARMAMOS);
      tl.to(q(".s08-e1"), { opacity: 0, duration: 0.2 }, UN - 0.2);
      tl.fromTo(q(".s08-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, BOT + 0.2);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
