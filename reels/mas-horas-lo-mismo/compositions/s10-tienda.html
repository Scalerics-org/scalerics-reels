<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s10-tienda"] .s10-capa { position: absolute; inset: 0; }
    [data-composition-id="s10-tienda"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s10-tienda"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-tienda"] .ln-fino { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-tienda"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-tienda"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.35); stroke-width: 3; stroke-linecap: round; }
    [data-composition-id="s10-tienda"] .ui-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 26px; fill: #efeee5; }
    [data-composition-id="s10-tienda"] .precio { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 24px; fill: #5ce611; }
    [data-composition-id="s10-tienda"] .rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.2em; fill: #efeee5; }
    [data-composition-id="s10-tienda"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s10-tienda"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s10-tienda" data-width="1080" data-height="1920" data-duration="4.39">
    <div id="s10-escena" class="s10-capa clip" data-start="0" data-duration="4.39" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- la laptop con la tienda -->
        <g class="s10-lap">
          <rect class="ln s10-dib" x="320" y="620" width="440" height="280" rx="18" />
          <path class="ln s10-dib" d="M280 900 H800 L780 932 H300 Z" />
          <text class="ui-nombre s10-cab" x="348" y="664">Tu tienda</text>
          <line class="ln-tenue s10-dib" x1="340" y1="682" x2="740" y2="682" />
          <g class="s10-prod s10-p1"><rect class="ln-fino" x="348" y="702" width="116" height="170" rx="12" /><circle class="ln-tenue" cx="406" cy="756" r="28" /><text class="precio" x="406" y="852" text-anchor="middle">$ 390</text></g>
          <g class="s10-prod s10-p2"><rect class="ln-fino" x="482" y="702" width="116" height="170" rx="12" /><rect class="ln-tenue" x="514" y="730" width="52" height="52" rx="8" /><text class="precio" x="540" y="852" text-anchor="middle">$ 520</text></g>
          <g class="s10-prod s10-p3"><rect class="ln-fino" x="616" y="702" width="116" height="170" rx="12" /><path class="ln-tenue" d="M646 784 L674 730 L702 784 Z" /><text class="precio" x="674" y="852" text-anchor="middle">$ 280</text></g>
          <rect class="ln-ac s10-elegido" x="482" y="702" width="116" height="170" rx="12" />
        </g>
        <!-- 1. vende sola: la bolsa con tilde -->
        <g class="s10-i1">
          <path class="ln" d="M-44 -40 H44 L52 50 H-52 Z" />
          <path class="ln" d="M-22 -40 V-56 Q0 -80 22 -56 V-40" />
          <path class="ln-ac s10-tilde1" d="M-18 6 L-4 20 L22 -8" />
          <text class="rotulo" x="0" y="110" text-anchor="middle">VENTA</text>
        </g>
        <!-- 2. envíos: la camionetita -->
        <g class="s10-i2">
          <g class="s10-camion">
            <path class="ln" d="M-66 30 V-34 H22 V30 M22 -14 H50 L68 10 V30 H22" />
            <circle class="ln" cx="-38" cy="38" r="12" />
            <circle class="ln" cx="42" cy="38" r="12" />
            <path class="ln-tenue s10-velo" d="M-100 -14 H-80 M-108 6 H-80" />
          </g>
          <text class="rotulo" x="0" y="110" text-anchor="middle">ENVÍO</text>
        </g>
        <!-- 3. cobro: la tarjeta con tilde -->
        <g class="s10-i3">
          <rect class="ln" x="-60" y="-40" width="120" height="80" rx="12" />
          <path class="ln" d="M-60 -16 H60" />
          <path class="ln-tenue" d="M-42 18 H-6" />
          <circle class="ln-ac s10-ok" cx="50" cy="-40" r="20" />
          <path class="ln-ac s10-tilde3" d="M40 -40 L48 -32 L62 -48" />
          <text class="rotulo" x="0" y="110" text-anchor="middle">COBRO</text>
        </g>
      </svg>
      <div class="etiqueta"><span class="s10-e1">Tienda online</span><span class="s10-e2">Vende sola</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s10-tienda";
      const DUR = 4.39;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const TIENDA = 0.6;
      const VENDE = 1.4;
      const SOLA = 1.7;
      const ENVIOS = 2.5;
      const MERCADO = 3.2;
      const PAGO = 3.79;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, o) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // la laptop arranca medio dibujada
      qa(".s10-dib").forEach((el) => dibujar([el], 0, 0.5, 0.45));
      tl.fromTo(q(".s10-cab"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3);
      // "tienda": los productos aparecen uno tras otro
      qa(".s10-prod").forEach((p, i) => pop(p, TIENDA - 0.25 + i * 0.12, (406 + i * 134) + " 787"));
      gsap.set(q(".s10-elegido"), { opacity: 0 });

      // posiciones de los tres íconos
      const XS = [290, 540, 790];
      [".s10-i1", ".s10-i2", ".s10-i3"].forEach((s, i) => gsap.set(q(s), { x: XS[i], y: 1060 }));

      // "vende sola": el producto se elige solo y sale la bolsa
      tl.to(q(".s10-elegido"), { opacity: 1, duration: 0.1 }, VENDE);
      tl.to(q(".s10-p2"), { scale: 1.08, svgOrigin: "540 787", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, VENDE);
      tl.fromTo(q(".s10-i1"), { opacity: 0, y: 980 }, { opacity: 1, y: 1060, duration: 0.4, ease: "back.out(1.8)" }, VENDE + 0.1);
      dibujar([q(".s10-tilde1")], SOLA, 0.3);

      // "envíos": la camionetita entra y arranca
      tl.fromTo(q(".s10-i2"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, ENVIOS - 0.15);
      tl.fromTo(q(".s10-camion"), { x: -50 }, { x: 0, duration: 0.4, ease: "power3.out" }, ENVIOS - 0.15);
      tl.to(q(".s10-camion"), { y: -3, duration: 0.08, ease: "none", yoyo: true, repeat: 7 }, ENVIOS + 0.25);
      tl.to(q(".s10-camion"), { x: 16, duration: 1.2, ease: "power1.in" }, ENVIOS + 0.3);
      tl.to(q(".s10-elegido"), { opacity: 0.3, duration: 0.3 }, ENVIOS);

      // "Mercado Pago": la tarjeta y el tilde verde
      pop(q(".s10-i3"), MERCADO - 0.1, "790 1060");
      gsap.set(qa(".s10-ok"), { opacity: 0 });
      tl.to(q(".s10-ok"), { opacity: 1, duration: 0.1 }, PAGO - 0.1);
      dibujar([q(".s10-tilde3")], PAGO - 0.05, 0.25);
      tl.to(q(".s10-i3"), { scale: 1.08, svgOrigin: "790 1060", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, PAGO + 0.1);

      // etiquetas
      tl.fromTo(q(".s10-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, TIENDA);
      tl.to(q(".s10-e1"), { opacity: 0, duration: 0.2 }, SOLA - 0.2);
      tl.fromTo(q(".s10-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, SOLA);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
