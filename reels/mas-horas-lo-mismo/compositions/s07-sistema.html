<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s07-sistema"] .s07-capa { position: absolute; inset: 0; }
    [data-composition-id="s07-sistema"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s07-sistema"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s07-sistema"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s07-sistema"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; }
    [data-composition-id="s07-sistema"] .ln-techo { fill: none; stroke: #5ce611; stroke-width: 10; stroke-linecap: round; }
    [data-composition-id="s07-sistema"] .ln-fino { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s07-sistema"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s07-sistema"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s07-sistema" data-width="1080" data-height="1920" data-duration="3.12">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="3.12" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s07-suelo" x1="220" y1="1160" x2="860" y2="1160" />
        <!-- el techo, en dos mitades -->
        <line class="ln-techo s07-t1" x1="230" y1="760" x2="540" y2="760" />
        <line class="ln-techo s07-t2" x1="540" y1="760" x2="850" y2="760" />
        <!-- el dueño empujando el techo -->
        <g class="s07-duenio">
          <circle class="ln s07-dib-d" cx="540" cy="880" r="26" />
          <path class="ln s07-dib-d" d="M540 906 V1050 M540 1050 L510 1160 M540 1050 L570 1160" />
          <path class="ln s07-dib-d" d="M540 940 L490 860 L500 772 M540 940 L590 860 L580 772" />
          <path class="ln-fino s07-gota" d="M600 850 Q586 870 600 878 Q614 870 600 850 Z" />
          <path class="ln-fino s07-gota" d="M482 900 Q468 920 482 928 Q496 920 482 900 Z" />
        </g>
        <g class="s07-badge"><g class="s07-b-in"><circle class="ln-badge" cx="0" cy="0" r="18" /><path class="ln-badge" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
        <!-- el engranaje -->
        <g class="s07-engranaje">
          <path class="ln s07-dientes" d="" />
          <circle class="ln-ac s07-eje" cx="540" cy="980" r="52" />
        </g>
      </svg>
      <div class="etiqueta"><span class="s07-e1">No es esfuerzo</span><span class="s07-e2">Es un sistema</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s07-sistema";
      const DUR = 3.12;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const ESFUERZO = 0.78;
      const ES = 1.52;
      const SISTEMA = 2.28;

      // dientes del engranaje (geometría fija, determinista)
      const CX = 540, CY = 980, RIN = 124, ROUT = 162, N = 9;
      const pt = (r, a) => (CX + r * Math.cos(a)).toFixed(1) + " " + (CY + r * Math.sin(a)).toFixed(1);
      let d = "";
      for (let i = 0; i < N; i++) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
        const p0 = pt(RIN, a - 0.2), p1 = pt(ROUT, a - 0.12), p2 = pt(ROUT, a + 0.12), p3 = pt(RIN, a + 0.2);
        const sig = pt(RIN, a + (2 * Math.PI) / N - 0.2);
        d += (i === 0 ? "M" + p0 : "") + " L" + p1 + " L" + p2 + " L" + p3 + " A" + RIN + " " + RIN + " 0 0 1 " + sig;
      }
      q(".s07-dientes").setAttribute("d", d + " Z");

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // el techo y el dueño ya están (medio dibujados en el cuadro 0)
      [q(".s07-t1"), q(".s07-t2"), q(".s07-suelo")].concat(qa(".s07-dib-d")).forEach((el) => dibujar([el], 0, 0.4, 0.4));
      // empuja: el cuerpo se tensa contra el techo
      tl.to(q(".s07-duenio"), { scaleY: 0.97, svgOrigin: "540 1160", duration: 0.12, ease: "power2.inOut", yoyo: true, repeat: 5 }, 0.1);
      qa(".s07-gota").forEach((g, i) => {
        tl.fromTo(g, { opacity: 0, y: -6 }, { opacity: 1, y: 14, duration: 0.5, ease: "power1.in" }, 0.25 + i * 0.25);
      });
      // "esfuerzo": badge X
      gsap.set(q(".s07-badge"), { x: 660, y: 830 });
      tl.fromTo(q(".s07-b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, ESFUERZO + 0.05);
      tl.to(q(".s07-duenio"), { x: -6, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, ESFUERZO + 0.08);

      // "Es": el dueño se va, se dibuja el engranaje
      tl.to(qa(".s07-duenio, .s07-badge"), { opacity: 0, duration: 0.25, ease: "power2.in" }, ES - 0.1);
      dibujar([q(".s07-dientes"), q(".s07-eje")], ES, 0.55);
      tl.fromTo(q(".s07-engranaje"), { rotation: -40, svgOrigin: "540 980" }, { rotation: 0, svgOrigin: "540 980", duration: SISTEMA - ES, ease: "none" }, ES);
      // "sistema": gira con punch, sube y rompe el techo
      tl.to(q(".s07-engranaje"), { rotation: 160, svgOrigin: "540 980", duration: DUR - SISTEMA, ease: "power2.out" }, SISTEMA);
      tl.to(q(".s07-engranaje"), { y: -90, duration: 0.3, ease: "back.out(2)" }, SISTEMA);
      tl.to(q(".s07-t1"), { rotation: -28, y: -40, svgOrigin: "230 760", duration: 0.35, ease: "back.out(2)" }, SISTEMA + 0.08);
      tl.to(q(".s07-t2"), { rotation: 28, y: -40, svgOrigin: "850 760", duration: 0.35, ease: "back.out(2)" }, SISTEMA + 0.08);

      // etiquetas
      tl.fromTo(q(".s07-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, ESFUERZO);
      tl.to(q(".s07-e1"), { opacity: 0, duration: 0.2 }, ES - 0.2);
      tl.fromTo(q(".s07-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, ES);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
