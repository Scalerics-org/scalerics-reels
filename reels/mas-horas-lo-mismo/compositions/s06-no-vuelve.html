<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-no-vuelve"] .s06-capa { position: absolute; inset: 0; }
    [data-composition-id="s06-no-vuelve"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-no-vuelve"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-no-vuelve"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-no-vuelve"] .ln-punteada { fill: none; stroke: rgba(239, 238, 229, 0.5); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 12; }
    [data-composition-id="s06-no-vuelve"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.3); stroke-width: 4; stroke-linecap: round; }
    [data-composition-id="s06-no-vuelve"] .vidrio { fill: #5ce611; }
    [data-composition-id="s06-no-vuelve"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s06-no-vuelve"] .uno { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 30px; fill: #0b1d35; }
    [data-composition-id="s06-no-vuelve"] .preg { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 96px; fill: #5ce611; }
    [data-composition-id="s06-no-vuelve"] .rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: #efeee5; }
    [data-composition-id="s06-no-vuelve"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s06-no-vuelve"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s06-no-vuelve" data-width="1080" data-height="1920" data-duration="4.02">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="4.02" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s06-suelo" x1="80" y1="1160" x2="1000" y2="1160" />
        <!-- tu local -->
        <g class="s06-local">
          <path class="ln s06-dib" d="M-120 0 V-170 H120 V0" />
          <path class="ln s06-dib" d="M-140 -170 H140 L122 -222 H-122 Z" />
          <path class="ln s06-dib" d="M-140 -170 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0" />
          <rect class="ln s06-dib" x="-100" y="-122" width="58" height="52" rx="5" />
          <rect class="ln s06-dib" x="42" y="-122" width="58" height="52" rx="5" />
          <rect class="vidrio s06-luz" x="-92" y="-114" width="42" height="36" rx="3" />
          <rect class="vidrio s06-luz" x="50" y="-114" width="42" height="36" rx="3" />
          <path class="ln s06-dib" d="M-24 0 V-96 H24 V0" />
          <text class="cartel s06-txt" x="0" y="-240" text-anchor="middle">TU LOCAL</text>
        </g>
        <!-- el cliente -->
        <g class="s06-p">
          <g class="s06-p-in">
            <circle class="ln" cx="0" cy="-96" r="14" />
            <path class="ln s06-piernas" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" />
          </g>
        </g>
        <!-- una vez -->
        <g class="s06-uno">
          <circle class="vidrio" cx="0" cy="0" r="24" />
          <text class="uno" x="0" y="11" text-anchor="middle">1</text>
        </g>
        <!-- la ficha vacía: nadie se acordó -->
        <g class="s06-ficha">
          <rect class="ln" x="330" y="620" width="420" height="200" rx="18" />
          <circle class="ln-punteada" cx="410" cy="700" r="40" />
          <path class="ln-punteada" d="M362 790 Q410 740 458 790" />
          <path class="ln-tenue" d="M490 680 H700 M490 720 H660 M490 760 H690" />
          <text class="preg s06-preg" x="800" y="760" text-anchor="middle">?</text>
        </g>
      </svg>
      <div class="etiqueta"><span class="s06-e1">Vino una vez</span><span class="s06-e2">Nadie se acordó</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-no-vuelve";
      const DUR = 4.02;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const VINO = 0.8;
      const UNA = 1.0;
      const NO = 1.55;
      const PORQUE = 2.41;
      const NADIE = 2.6;
      const ACORDO = 3.0;

      const SUELO = 1160;
      const LX = 760;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, o) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const caminar = (t, n) => tl.fromTo(q(".s06-piernas"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: n }, t);

      // el local arranca medio dibujado, con luz
      gsap.set(q(".s06-local"), { x: LX, y: SUELO });
      dibujar([q(".s06-suelo")], 0, 0.5, 0.5);
      dibujar(qa(".s06-dib"), 0, 0.5, 0.45);
      tl.fromTo(q(".s06-txt"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.25);
      tl.fromTo(qa(".s06-luz"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 0.35);

      // "vino": el cliente llega caminando y entra
      tl.fromTo(q(".s06-p"), { x: 260, y: SUELO, opacity: 0 }, { x: 330, opacity: 1, duration: 0.2, ease: "none" }, 0.1);
      tl.to(q(".s06-p"), { x: LX, duration: 0.75, ease: "none" }, 0.3);
      caminar(0.1, 5);
      tl.to(q(".s06-p"), { opacity: 0, duration: 0.12 }, VINO + 0.15);
      // "una vez": el 1 verde arriba del local
      gsap.set(q(".s06-uno"), { x: LX + 130, y: SUELO - 300 });
      tl.fromTo(q(".s06-uno"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, UNA);

      // "no vuelve": sale y se va para la izquierda, apagándose
      tl.set(q(".s06-p-in"), { scaleX: -1, svgOrigin: "0 0" }, NO - 0.25);
      tl.to(q(".s06-p"), { opacity: 1, duration: 0.1 }, NO - 0.25);
      tl.to(q(".s06-p"), { x: 160, duration: 1.1, ease: "none" }, NO - 0.2);
      tl.to(q(".s06-p"), { opacity: 0, duration: 0.4 }, NO + 0.6);
      caminar(NO - 0.2, 7);
      tl.to(q(".s06-uno"), { opacity: 0.35, duration: 0.3 }, NO + 0.1);
      tl.to(qa(".s06-luz"), { opacity: 0, duration: 0.3 }, NO + 0.2);

      // "nadie se acordó": la ficha vacía
      tl.to(q(".s06-local"), { opacity: 0.4, duration: 0.3 }, PORQUE);
      pop(q(".s06-ficha"), NADIE - 0.15, "540 720");
      pop(q(".s06-preg"), ACORDO, "800 730");
      tl.to(q(".s06-preg"), { rotation: 12, svgOrigin: "800 760", duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 3 }, ACORDO + 0.3);

      // etiquetas
      tl.fromTo(q(".s06-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, UNA);
      tl.to(q(".s06-e1"), { opacity: 0, duration: 0.2 }, PORQUE - 0.2);
      tl.fromTo(q(".s06-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, PORQUE);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
