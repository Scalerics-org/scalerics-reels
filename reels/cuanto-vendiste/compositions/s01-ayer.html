  <div id="root" data-composition-id="s01-ayer" data-width="1080" data-height="1920" data-duration="4.62">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="4.62" data-track-index="0">

  <script>
    (function () {
      const ID = "s01-ayer";
      const DUR = 4.62;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const VENDISTE = 0.6;
      const AYER = 0.9;
      const SI = 1.86;
      const SEGUI = 2.8;

      // cuadro 0: "¿CUÁNTO" ya está, entrando de golpe
      tl.fromTo(q(".s01-cuanto"), { scale: 1.12, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, 0);
      tl.fromTo(q(".s01-etiqueta"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.1);
      gsap.set(q(".s01-vendiste"), { opacity: 0 });
      tl.fromTo(q(".s01-vendiste"), { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, VENDISTE - 0.06);
      gsap.set(q(".s01-ayer"), { opacity: 0 });
      tl.fromTo(q(".s01-ayer"), { opacity: 0, y: 110, scaleY: 1.3 }, { opacity: 1, y: 0, scaleY: 1, duration: 0.26, ease: "back.out(2)", immediateRender: false }, AYER - 0.06);
      [[-8, 4], [6, -3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, AYER + 0.16 + i * 0.045));
      tl.to(q(".s01-ayer span"), { scale: 1.15, duration: 0.22, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "50% 80%", display: "inline-block" }, AYER + 0.4);

      // "si tenés que calcularlo": la pregunta sube y el monto gris no para de cambiar
      tl.to(q(".s01-preg"), { scale: 0.6, y: -40, transformOrigin: "50% 480px", duration: 0.35, ease: "power3.inOut" }, SI - 0.15);
      gsap.set(q(".s01-si"), { opacity: 0 });
      tl.fromTo(q(".s01-si"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, SI + 0.05);
      const montos = qa(".s01-monto");
      gsap.set(montos, { opacity: 0 });
      tl.fromTo(montos[0], { scale: 0.85 }, { scale: 1, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, SI - 0.05);
      const ORDEN = [0, 3, 1, 6, 4, 2, 7, 5, 0, 3, 6, 1, 4, 7, 2, 5, 0, 6, 3, 1, 5, 2, 4, 7, 0, 3, 6, 1];
      ORDEN.forEach((k, i) => {
        const t = SI - 0.05 + i * 0.09;
        if (t > DUR - 0.2) return;
        montos.forEach((m, j) => tl.set(m, { opacity: j === k ? 1 : 0 }, t));
      });

      // "seguí mirando": cae en verde
      gsap.set(q(".s01-segui"), { opacity: 0 });
      tl.fromTo(q(".s01-segui"), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.out", immediateRender: false }, SEGUI - 0.05);
      gsap.set(q(".s01-raya"), { scaleX: 0 });
      tl.to(q(".s01-raya"), { scaleX: 1, duration: 0.35, ease: "power3.out" }, SEGUI + 0.15);
      tl.to(q(".s01-segui"), { scale: 1.05, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.5);

      // salida
      tl.to(q("#s01-escena"), { scale: 1.15, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 60%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
