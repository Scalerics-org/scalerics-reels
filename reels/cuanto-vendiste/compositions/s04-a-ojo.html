  <script>
    (function () {
      const ID = "s04-a-ojo";
      const DUR = 3.25;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {

          const L = el.getTotalLength();

      };
      const ONCE = 0.5, SUMAR = 1.15, DECIDE = 1.86, OJO = 2.3;

      // el reloj ya está a medio dibujar y las agujas corren hasta las once
      dibujar(qa(".s04-dr"), 0, 0.45, 0.5);
      tl.fromTo(q(".s04-min"), { rotation: -720, svgOrigin: "540 650" }, { rotation: 0, svgOrigin: "540 650", duration: 0.7, ease: "power3.out" }, 0);

      tl.fromTo(q(".s04-hora"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3 }, 0.2);
      gsap.set([q(".s04-once"), q(".s04-sumar"), q(".s04-decide"), q(".s04-ojo")], { opacity: 0 });
      tl.fromTo(q(".s04-once"), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, ONCE - 0.05);

      // "se decide a ojo": el reloj se va, se abre el ojo

      tl.to([q(".s04-reloj"), q(".s04-hora")], { opacity: 0, scale: 0.8, svgOrigin: "540 650", duration: 0.2 }, DECIDE - 0.1);
      tl.fromTo(q(".s04-decide"), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, DECIDE);
      dibujar(qa(".s04-de"), DECIDE, 0.4);
      gsap.set(q(".s04-pupila"), { opacity: 0 });
      tl.fromTo(q(".s04-pupila"), { opacity: 0, scale: 0.3, svgOrigin: "540 660" }, { opacity: 1, scale: 1, svgOrigin: "540 660", duration: 0.25, ease: "back.out(2)", immediateRender: false }, DECIDE + 0.3);
      tl.to(q(".s04-pupila"), { x: -36, duration: 0.25, ease: "power2.inOut" }, OJO + 0.05);
      tl.to(q(".s04-pupila"), { x: 36, duration: 0.3, ease: "power2.inOut" }, OJO + 0.35);
      tl.to(q(".s04-pupila"), { x: 0, y: -10, duration: 0.2, ease: "power2.inOut" }, OJO + 0.7);
      tl.fromTo(q(".s04-ojo"), { opacity: 0, y: 100, scaleY: 1.3 }, { opacity: 1, y: 0, scaleY: 1, duration: 0.26, ease: "back.out(2)", immediateRender: false }, OJO - 0.05);

      window.__timelines[ID] = tl;
