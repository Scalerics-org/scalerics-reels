  <script>
    (function () {
      const ID = "s10-embrujado";
      const DUR = 3.08;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const EMBRUJADO = 1.6;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };
      dibujar(qa(".s10-l"), 0, 0.5, 0.5);
      tl.fromTo(q(".s10-llama"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.1);
      tl.to(q(".s10-llama"), { opacity: 0.4, duration: 0.3, yoyo: true, repeat: 3, ease: "steps(1)" }, 0.4);
      tl.fromTo(q(".s10-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.1);
      // tiembla todo el rato
      tl.fromTo(q(".s10-duenio"), { x: -3 }, { x: 3, duration: 0.05, ease: "none", yoyo: true, repeat: 59 }, 0);
      tl.fromTo(q(".s10-g1"), { opacity: 0, y: 0 }, { opacity: 0.85, y: 40, duration: 0.9, ease: "power1.in" }, 0.4);

      // "embrujado": el fantasma aparece detrás y se le acerca
      gsap.set(q(".s10-fantasma"), { opacity: 0 });
      tl.fromTo(q(".s10-fantasma"), { opacity: 0, y: 40, scale: 0.8, svgOrigin: "810 860" }, { opacity: 1, y: 0, scale: 1, svgOrigin: "810 860", duration: 0.4, ease: "power2.out", immediateRender: false }, EMBRUJADO);
      tl.to(q(".s10-fantasma"), { y: -24, x: -30, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, EMBRUJADO + 0.4);
      tl.to(q(".s10-e1"), { opacity: 0, duration: 0.12 }, EMBRUJADO - 0.1);
      tl.fromTo(q(".s10-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, EMBRUJADO);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.15, ease: "power2.in" }, DUR - 0.15);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
