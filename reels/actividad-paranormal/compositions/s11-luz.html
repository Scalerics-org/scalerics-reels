    (function () {
      const ID = "s11-luz";
      const DUR = 4.84;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);

      const FANTASMA = 1.22, AGENTE = 2.45, CONTRATE = 3.77;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.025);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.025);
        });
      };
      // se prende la luz: todo aparece de golpe (a medio dibujar) y termina de dibujarse
      dibujar(qa(".s11-l"), 0, 0.5, 0.4);
      tl.fromTo(q(".s11-tecla"), { y: 0 }, { y: 18, duration: 0.08 }, 0);
      tl.fromTo(q(".s11-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.1);

      tl.to(q(".s11-colita"), { rotation: 8, svgOrigin: "370 624", duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.2);

      // "fantasma": saca la sábana y abajo estaba el celular

      gsap.set(q(".s11-tel"), { opacity: 0 });
      tl.fromTo(q(".s11-tel"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, FANTASMA + 0.1);
      // "agente de IA": la pantalla se prende
      tl.to(q(".s11-pant"), { opacity: 1, duration: 0.2 }, FANTASMA + 0.25);
      tl.fromTo(q(".s11-av"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" }, AGENTE - 0.1);
      tl.fromTo(q(".s11-nom"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, AGENTE);
      tl.fromTo(q(".s11-est"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, AGENTE + 0.3);
      tl.to(q(".s11-tel"), { scale: 1.08, duration: 0.3, yoyo: true, repeat: 1, ease: "power2.out" }, AGENTE);
      tl.to(q(".s11-e1"), { opacity: 0, duration: 0.12 }, AGENTE - 0.1);
      tl.fromTo(q(".s11-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, AGENTE);
      // "contraté": el agente guiña
      tl.to(qa(".s11-av i"), { scaleY: 0.15, duration: 0.08, yoyo: true, repeat: 1 }, CONTRATE);

      // salida

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
