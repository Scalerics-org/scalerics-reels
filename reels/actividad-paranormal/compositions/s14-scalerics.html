  <script>
    (function () {
      const ID = "s14-scalerics";
      const DUR = 7.33;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur) => {
        els.forEach((el, i) => {

        });
      };
      dibujar(qa(".s14-l"), 0, 0.6);
      dibujar(qa(".s14-v"), 0.7, 0.3);
      tl.fromTo(q(".s14-tel"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.5);
      tl.to(q(".s14-tel"), { opacity: 0.6, duration: 0.3, yoyo: true, repeat: 9, ease: "sine.inOut" }, 0.8);
      tl.fromTo(q(".s14-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.1);

      // "no duerme": luna que gira y se vuelve sol

      tl.to(qa(".s14-sol"), { opacity: 1, duration: 0.2 }, DUERME + 0.5);
      tl.to(q(".s14-astro"), { rotation: 360, svgOrigin: "880 690", duration: DUR - DUERME - 0.3, ease: "none" }, DUERME + 0.3);
      tl.to(q(".s14-e1"), { opacity: 0, duration: 0.12 }, DUERME - 0.1);
      tl.fromTo(q(".s14-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, DUERME);

      // "no se olvida de nadie": fichas con tilde

        tl.fromTo(f, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(1.8)" }, OLVIDA - 0.1 + i * 0.2);
      });

      // "trae de vuelta": flechas y vuelven sonriendo
      dibujar([q(".s14-f1"), q(".s14-f2")], TRAE - 0.1, 0.4);
      dibujar([q(".s14-f1b"), q(".s14-f2b")], TRAE + 0.25, 0.15);
      tl.fromTo(q(".s14-nel"), { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, TRAE);
      tl.fromTo(q(".s14-much"), { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, TRAE + 0.15);

      tl.fromTo(q(".s14-e3"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, TRAE);

      window.__timelines = window.__timelines || {};
