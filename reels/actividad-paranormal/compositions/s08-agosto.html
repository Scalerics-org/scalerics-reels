  <script>

      const ID = "s08-agosto";
      const DUR = 5.84;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const MUCHACHO = 1.01, PREGUNTO = 1.85, AGOSTO = 3.05, NUNCA = 3.98;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };

      // Nélida ya está; atrás se dibuja el muchacho
      dibujar(qa(".s08-n"), 0, 0.4, 0.4);
      tl.fromTo(q(".s08-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.1);
      dibujar(qa(".s08-l"), 0.3, 0.6);
      gsap.set(qa(".s08-ojo"), { opacity: 0 });
      tl.fromTo(qa(".s08-ojo"), { opacity: 0, scale: 0.2, svgOrigin: "700 800" }, { opacity: 1, scale: 1, svgOrigin: "700 800", duration: 0.2, ease: "back.out(3)" }, MUCHACHO);

      // "preguntó un precio"

      // "agosto": la etiqueta cuelga del manubrio y se balancea
      gsap.set(q(".s08-tag"), { opacity: 0 });
      tl.fromTo(q(".s08-tag"), { opacity: 0, y: -30, rotation: 0 }, { opacity: 1, y: 0, rotation: 12, duration: 0.3, ease: "back.out(2)", immediateRender: false }, AGOSTO);
      tl.to(q(".s08-tag"), { rotation: -8, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, AGOSTO + 0.3);
      tl.to(q(".s08-e1"), { opacity: 0, duration: 0.12 }, AGOSTO - 0.1);
      tl.fromTo(q(".s08-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, AGOSTO);
      // "nunca compró": sello

      [0, 0.04, 0.08].forEach((d, i) => tl.to(qa(".s08-much, .s08-nel"), { y: i % 2 ? -8 : 8, duration: 0.04, ease: "none" }, NUNCA + 0.18 + d));
      tl.to(qa(".s08-much, .s08-nel"), { y: 0, duration: 0.05 }, NUNCA + 0.32);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
