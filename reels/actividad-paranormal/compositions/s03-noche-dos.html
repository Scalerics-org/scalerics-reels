  <script>
    (function () {
      const ID = "s03-noche-dos";
      const DUR = 4.34;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const ABRO = 0.84, TURNOS = 2.82, AGENDADOS = 3.06;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      dibujar(qa(".s03-l"), 0, 0.6);

      // NOCHE 2
      tl.fromTo(q(".s03-noche"), { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power3.out" }, 0);
      tl.to(q(".s03-noche"), { opacity: 0.6, duration: 0.05, yoyo: true, repeat: 3 }, 0.35);
      tl.to(q(".s03-noche"), { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, ABRO - 0.1);

      // la persiana sube
      tl.fromTo(q(".s03-persiana"), { y: 0 }, { y: -560, duration: 1.1, ease: "power2.inOut" }, ABRO);
      tl.fromTo(q(".s03-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, ABRO);

      // la agenda se llena sola
      gsap.set(qa(".s03-t"), { opacity: 0 });
      gsap.set(q(".s03-dia"), { opacity: 0 });
      tl.to(q(".s03-dia"), { opacity: 1, duration: 0.2 }, ABRO + 0.9);
      qa(".s03-t").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, x: -30, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, TURNOS + i * 0.28);
      });
      tl.to(q(".s03-e1"), { opacity: 0, duration: 0.12 }, TURNOS - 0.1);
      tl.fromTo(q(".s03-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, TURNOS);
      tl.fromTo(q(".s03-tab"), { scale: 1 }, { scale: 1.05, duration: 0.6, ease: "power2.out" }, AGENDADOS);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
