  <script>
    (function () {
      const ID = "s05-noche-tres";
      const DUR = 3.78;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const CAMPANITA = 1.73, PUERTA = 2.59;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };
      dibujar(qa(".s05-l"), 0.1, 0.6);

      // NOCHE 3
      tl.fromTo(q(".s05-noche"), { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power3.out" }, 0);
      tl.to(q(".s05-noche"), { opacity: 0.6, duration: 0.05, yoyo: true, repeat: 3 }, 0.35);
      tl.to(q(".s05-noche"), { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 0.95);
      tl.fromTo(q(".s05-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.9);
      tl.fromTo(q(".s05-todo"), { scale: 1, svgOrigin: "540 940" }, { scale: 1.07, svgOrigin: "540 940", duration: DUR, ease: "none" }, 0);

      gsap.set(q(".s05-cartel"), { opacity: 0 });
      tl.to(q(".s05-cartel"), { opacity: 1, duration: 0.2 }, 1.1);
      // la sombra solo se ve cuando se abre la puerta
      gsap.set(q(".s05-quien"), { opacity: 0 });
      // "campanita": se sacude con ondas
      [0, 0.12, 0.24, 0.36, 0.48, 0.6].forEach((d, i) => tl.to(q(".s05-campana"), { rotation: i % 2 ? -16 : 16, svgOrigin: "540 640", duration: 0.12, ease: "sine.inOut" }, CAMPANITA + d));
      tl.to(q(".s05-campana"), { rotation: 0, svgOrigin: "540 640", duration: 0.3, ease: "elastic.out(1, 0.4)" }, CAMPANITA + 0.72);
      gsap.set(q(".s05-onda"), { opacity: 0 });
      tl.fromTo(q(".s05-onda"), { opacity: 1, scale: 0.8, svgOrigin: "540 680" }, { opacity: 0, scale: 1.4, svgOrigin: "540 680", duration: 0.45, ease: "power1.out", repeat: 1 }, CAMPANITA);
      tl.to(q(".s05-e1"), { opacity: 0, duration: 0.12 }, CAMPANITA - 0.1);
      tl.fromTo(q(".s05-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, CAMPANITA);

      // "puerta": se abre despacio y aparece la sombra con ojos
      tl.to(q(".s05-hoja"), { scaleX: 0.25, svgOrigin: "345 950", duration: 1.0, ease: "power2.inOut" }, PUERTA);
      tl.to(q(".s05-quien"), { opacity: 1, duration: 0.4 }, PUERTA + 0.1);
      tl.fromTo(qa(".s05-ojo"), { opacity: 0, scale: 0.2, svgOrigin: "541 935" }, { opacity: 1, scale: 1, svgOrigin: "541 935", duration: 0.2, ease: "back.out(3)" }, PUERTA + 0.6);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
