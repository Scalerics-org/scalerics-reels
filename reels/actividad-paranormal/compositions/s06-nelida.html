    (function () {
      const ID = "s06-nelida";
      const DUR = 3.93;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);

      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {

          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.025);
        });
      };
      // entra caminando desde la puerta (se acerca)
      dibujar(qa(".s06-l"), 0, 0.55, 0.6);
      tl.fromTo(q(".s06-nelida"), { scale: 0.85, svgOrigin: "400 1250" }, { scale: 1, svgOrigin: "400 1250", duration: 1.4, ease: "power2.out" }, 0);

      // saluda

      tl.fromTo(q(".s06-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, ESCRIBISTE);
