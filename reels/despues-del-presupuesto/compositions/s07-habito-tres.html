  <style>

    [data-composition-id="s07-habito-tres"] .relleno-ac { fill: #5ce611; }
    [data-composition-id="s07-habito-tres"] .relleno-rojo { fill: #c0564b; }

    [data-composition-id="s07-habito-tres"] .lex { font-family: "Lexend", sans-serif; font-weight: 600; fill: #efeee5; }
    [data-composition-id="s07-habito-tres"] .lex-ac { font-family: "Lexend", sans-serif; font-weight: 600; fill: #5ce611; }
    [data-composition-id="s07-habito-tres"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s07-habito-tres"] .mono-ac { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.16em; fill: #5ce611; }

    [data-composition-id="s07-habito-tres"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s07-habito-tres"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }

  </style>
  <div id="root" data-composition-id="s07-habito-tres" data-width="1080" data-height="1920" data-duration="4.52">

      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="cap"><g class="cap-in">
          <text class="mono cap-h" x="540" y="712" text-anchor="middle" font-size="40">HÁBITO</text>

        </g>
      </svg>
      <div class="etiqueta"><span class="s07-e1">Hábito 3</span><span class="s07-e2">Preguntan por qué</span><span class="s07-e3">Y lo anotan</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s07-habito-tres";
      const DUR = 4.52;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // dibuja trazos (stroke-dashoffset); opacity 0 hasta que arrancan (sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.04);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      // aparece entero con golpe
      const pop = (el, t, o) => tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: o ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      // texto que se escribe de izquierda a derecha
      const escribir = (el, t, d) => tl.fromTo(el, { opacity: 1, clipPath: "inset(-20% 100% -20% 0)" }, { opacity: 1, clipPath: "inset(-20% 0% -20% 0)", duration: d ?? 0.5, ease: "power1.inOut" }, t);

      // número de capítulo: golpe y después badge arriba a la izquierda
      const capitulo = (tAchica) => {
        tl.fromTo(q(".cap-in"), { opacity: 0, scale: 1.5, svgOrigin: "540 960" }, { opacity: 1, scale: 1, svgOrigin: "540 960", duration: 0.4, ease: "power4.out" }, 0);
        tl.fromTo(q(".cap-h"), { opacity: 0, y: 20 }, { opacity: 0.8, y: 0, duration: 0.3, ease: "power3.out" }, 0.12);
        tl.to(q(".cap-in"), { scale: 1.04, svgOrigin: "540 960", duration: Math.max(0.3, tAchica - 0.45), ease: "sine.inOut" }, 0.4);
        tl.to(q(".cap"), { scale: 0.3, x: -365, y: -205, svgOrigin: "540 960", duration: 0.45, ease: "power3.inOut" }, tAchica - 0.05);
        tl.to(q(".cap-in"), { scale: 1, svgOrigin: "540 960", duration: 0.45, ease: "power3.inOut" }, tAchica - 0.05);
      };

      capitulo(0.93);
      pop(q(".s07-no"), 1.6);
      pop(q(".s07-por"), 2.2);
      dibujar(qa(".s07-f"), 2.6, 0.45, 1, 0.08);
      tl.fromTo(q(".s07-mh"), { opacity: 0 }, { opacity: 0.7, duration: 0.3 }, 2.8);
      gsap.set(q(".s07-mot"), { opacity: 0 });
      escribir(q(".s07-mot"), 3.62, 0.55);
      tl.to(q(".s07-ficha"), { y: -6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.4);
      // etiqueta mono
      const ET = [0.15,2.25,3.66];
      ET.forEach((t, i) => {
        const el = q(".s07-e" + (i + 1));
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        if (i + 1 < ET.length) tl.to(el, { opacity: 0, y: -8, duration: 0.2 }, ET[i + 1] - 0.15);
      });
      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
