  <script>
    (function () {
      const ID = "s02-placard";
      const DUR = 3.35;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // dibuja trazos (stroke-dashoffset); opacity 0 hasta que arrancan (sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.04);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      // aparece entero con golpe
      const pop = (el, t, o) => tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: o ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      // texto que se escribe de izquierda a derecha
      const escribir = (el, t, d) => tl.fromTo(el, { opacity: 1, clipPath: "inset(-20% 100% -20% 0)" }, { opacity: 1, clipPath: "inset(-20% 0% -20% 0)", duration: d ?? 0.5, ease: "power1.inOut" }, t);


      tl.fromTo(q(".s02-pill"), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 0.12);
      dibujar(qa(".s02-pl"), 0, 0.6, 0.6, 0.04);
      pop(q(".s02-cartel"), 0.83);
      tl.to(q(".s02-plac"), { y: -8, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      dibujar(q(".s02-flecha"), 1.3, 0.4);
      tl.fromTo(q(".s02-doc"), { opacity: 0, x: -120, scale: 0.6, svgOrigin: "770 960" }, { opacity: 1, x: 0, scale: 1, svgOrigin: "770 960", duration: 0.45, ease: "power3.out" }, 1.33);
      gsap.set(qa(".s02-t1, .s02-t2"), { opacity: 0 });
      escribir(q(".s02-t1"), 2.5, 0.4);
      escribir(q(".s02-t2"), 2.75, 0.35);
      tl.set(q(".s02-t2"), { opacity: 0.7 }, 3.1);
      // etiqueta mono
      const ET = [0.15,1.33];
      ET.forEach((t, i) => {
        const el = q(".s02-e" + (i + 1));
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        if (i + 1 < ET.length) tl.to(el, { opacity: 0, y: -8, duration: 0.2 }, ET[i + 1] - 0.15);
      });
      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
