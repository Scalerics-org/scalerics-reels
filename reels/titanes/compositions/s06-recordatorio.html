<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/kit.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-recordatorio"] .esc-capa { position: absolute; inset: 0; }
    [data-composition-id="s06-recordatorio"] .esc-escenario { position: absolute; inset: 0; }
    [data-composition-id="s06-recordatorio"] svg.esc-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-recordatorio"] .txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; font-weight: 900; letter-spacing: -0.01em; }
    [data-composition-id="s06-recordatorio"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="s06-recordatorio"] .cartel { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; text-transform: uppercase; line-height: 0.95; white-space: nowrap; letter-spacing: -0.01em; color: #ffd23f; -webkit-text-stroke: 8px #0b0b12; paint-order: stroke fill; text-shadow: 10px 10px 0 #e8332a; }
    [data-composition-id="s06-recordatorio"] .cartel.rojo { color: #e8332a; text-shadow: 10px 10px 0 #0b0b12; }
    [data-composition-id="s06-recordatorio"] .cartel.azul { color: #f4efe2; text-shadow: 10px 10px 0 #2a5cff; }
    [data-composition-id="s06-recordatorio"] .cartel.verde { color: #5ce611; text-shadow: 10px 10px 0 #0b0b12; }
    [data-composition-id="s06-recordatorio"] .sello { position: absolute; padding: 8px 24px; border: 7px solid currentColor; border-radius: 12px; font-family: "Lexend", sans-serif; font-weight: 900; line-height: 1; white-space: nowrap; text-transform: uppercase; }
    [data-composition-id="s06-recordatorio"] .s06-nombre { top: 510px; font-size: 84px; }
    [data-composition-id="s06-recordatorio"] .s06-postit { position: absolute; width: 270px; padding: 18px 16px; background: #ffd23f; border: 5px solid #0b0b12; box-shadow: 8px 8px 0 #0b0b12; font-family: "Lexend", sans-serif; font-weight: 700; font-size: 30px; line-height: 1.15; color: #0b0b12; text-align: center; }
    [data-composition-id="s06-recordatorio"] .s06-p1 { left: 70px; top: 760px; transform: rotate(-7deg); }
    [data-composition-id="s06-recordatorio"] .s06-p2 { left: 120px; top: 1010px; transform: rotate(5deg); background: #f4efe2; }
    [data-composition-id="s06-recordatorio"] .s06-postit b { display: block; font-weight: 900; font-size: 38px; color: #e8332a; }
  </style>
  <div id="root" data-composition-id="s06-recordatorio" data-width="1080" data-height="1920" data-duration="8.12">
    <div id="s06-recordatorio-escena" class="esc-capa clip" data-start="0" data-duration="8.12" data-track-index="0">
      <div class="esc-escenario">

        <svg class="esc-svg" viewBox="0 0 1080 1920" aria-hidden="true">
          <g transform="translate(70 800) scale(0.78)"><g class="s06-du"></g></g>
          <g transform="translate(610 680) scale(0.86)"><g class="s06-rmov"><g class="s06-rival"></g></g></g>
          <g transform="translate(560 760) scale(0.62)"><g class="s06-reloj"></g></g>
          <g transform="translate(540 960)"><g class="s06-round"></g></g>
        </svg>
        <div class="cartel rojo s06-nombre">¡El Recordatorio!</div>
        <div class="s06-postit s06-p1"><b>10:00</b>turno sin confirmar</div>
        <div class="s06-postit s06-p2"><b>GÓMEZ</b>debe desde marzo</div>

      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-recordatorio";
      const DUR = 8.12;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const K = window.KIT;
      const esc = q(".esc-escenario");
      const tl = gsap.timeline({ paused: true });

      q(".s06-round").innerHTML = K.cartelRound(3, "#2a5cff", "#f4efe2");
      tl.fromTo(q(".s06-round"), { scale: 1.8, rotation: -12, svgOrigin: "0 0" }, { scale: 1, rotation: 0, svgOrigin: "0 0", duration: 0.25, ease: "back.out(1.8)" }, 0);
      tl.to(q(".s06-round"), { scale: 1.1, svgOrigin: "0 0", duration: 0.12, yoyo: true, repeat: 1 }, 0.77);
      K.sacudir(tl, esc, 0.77 + 0.02, 12);
      tl.to(q(".s06-round"), { opacity: 0, scale: 0.4, y: -300, svgOrigin: "0 0", duration: 0.3, ease: "power3.in" }, 1.4);

      q(".s06-du").innerHTML = K.duenio({ cara: "cansado" });
      q(".s06-rival").innerHTML = K.luchador({ color: "#e8332a", trim: "#f4efe2", emblema: "reloj", nombre: "RECORDATORIO", tamNombre: 17, boca: "burla" });
      q(".s06-reloj").innerHTML = K.reloj({ color: "#2a5cff" });
      const du = q(".s06-du"), rel = q(".s06-reloj");
      const EL = 1.68, NOMBRE = 1.92, DIEZ = 3.79, CONFIRMO = 4.46, GOMEZ = 5.62, MARZO = 6.96;
      gsap.set([du, rel], { opacity: 0 });
      gsap.set(q(".s06-rmov"), { x: 520 });
      tl.to(q(".s06-rmov"), { x: 0, duration: 0.4, ease: "power3.out" }, EL - 0.2);
      tl.to(du, { opacity: 1, duration: 0.2 }, EL);
      K.golpe(tl, q(".s06-nombre"), NOMBRE + 0.1);
      K.sacudir(tl, esc, NOMBRE + 0.12, 12);
      tl.to(q(".s06-nombre"), { opacity: 0, duration: 0.2 }, 3.05);
      // el despertador suena encima del dueño
      K.popSvg(tl, rel, 3.1);
      tl.to(q(".s06-reloj .k-rj-m"), { rotation: 360, svgOrigin: "0 0", duration: 4.8, ease: "none" }, 3.1);
      tl.to(q(".s06-reloj .k-rj-h"), { rotation: 60, svgOrigin: "0 0", duration: 4.8, ease: "none" }, 3.1);
      const sonar = (t) => tl.fromTo(rel, { rotation: -8 }, { rotation: 8, svgOrigin: "0 0", duration: 0.05, yoyo: true, repeat: 9, ease: "none", immediateRender: false }, t);
      sonar(DIEZ - 0.2); sonar(GOMEZ - 0.1);
      // los post-its que le pega en la frente
      const pega = (sel, t) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, scale: 2.2, x: 300 }, { scale: 1, x: 0, duration: 0.18, ease: "power4.in", immediateRender: false }, t - 0.18);
        tl.to(q(".s06-rival .k-l-brazoI"), { rotation: -60, svgOrigin: "118 262", duration: 0.1, yoyo: true, repeat: 1 }, t - 0.15);
        tl.fromTo(du, { x: 0 }, { x: -20, duration: 0.08, yoyo: true, repeat: 1, immediateRender: false }, t);
      };
      pega(".s06-p1", CONFIRMO);
      K.cara(tl, du, "dolor", CONFIRMO);
      pega(".s06-p2", MARZO);
      K.cara(tl, du, "grito", MARZO);
      K.cara(tl, q(".s06-rival"), "risa", MARZO + 0.15, "k-l-boca");
      tl.to(q(".s06-du .k-d-sudor"), { opacity: 1, duration: 0.1 }, 5.2);
      tl.fromTo(q(".s06-du .k-d-sudor"), { y: 0 }, { y: 50, duration: 1.4, ease: "power1.in", immediateRender: false }, 5.2);

      // salida
      tl.to(q("#s06-recordatorio-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
