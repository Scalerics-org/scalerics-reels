<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/kit.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s04-planilla"] .esc-capa { position: absolute; inset: 0; }
    [data-composition-id="s04-planilla"] .esc-escenario { position: absolute; inset: 0; }
    [data-composition-id="s04-planilla"] svg.esc-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s04-planilla"] .txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; font-weight: 900; letter-spacing: -0.01em; }
    [data-composition-id="s04-planilla"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="s04-planilla"] .cartel { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; text-transform: uppercase; line-height: 0.95; white-space: nowrap; letter-spacing: -0.01em; color: #ffd23f; -webkit-text-stroke: 8px #0b0b12; paint-order: stroke fill; text-shadow: 10px 10px 0 #e8332a; }
    [data-composition-id="s04-planilla"] .cartel.rojo { color: #e8332a; text-shadow: 10px 10px 0 #0b0b12; }
    [data-composition-id="s04-planilla"] .cartel.azul { color: #f4efe2; text-shadow: 10px 10px 0 #2a5cff; }
    [data-composition-id="s04-planilla"] .cartel.verde { color: #5ce611; text-shadow: 10px 10px 0 #0b0b12; }
    [data-composition-id="s04-planilla"] .sello { position: absolute; padding: 8px 24px; border: 7px solid currentColor; border-radius: 12px; font-family: "Lexend", sans-serif; font-weight: 900; line-height: 1; white-space: nowrap; text-transform: uppercase; }
    [data-composition-id="s04-planilla"] .s04-nombre { top: 500px; font-size: 128px; }
  </style>
  <div id="root" data-composition-id="s04-planilla" data-width="1080" data-height="1920" data-duration="8.61">
    <div id="s04-planilla-escena" class="esc-capa clip" data-start="0" data-duration="8.61" data-track-index="0">
      <div class="esc-escenario">

        <svg class="esc-svg" viewBox="0 0 1080 1920" aria-hidden="true">
          <g transform="translate(30 790) scale(0.8)"><g class="s04-du"></g></g>
          <g transform="translate(300 1010) scale(0.42)"><g class="s04-cel"></g></g>
          <g transform="translate(600 680) scale(0.88)"><g class="s04-rmov"><g class="s04-rival"></g></g></g>
          <g transform="translate(540 770) scale(0.75)"><g class="s04-hoja"></g></g>
          <g transform="translate(540 960)"><g class="s04-round"></g></g>
        </svg>
        <div class="cartel azul s04-nombre">¡La Planilla!</div>

      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s04-planilla";
      const DUR = 8.61;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const K = window.KIT;
      const esc = q(".esc-escenario");
      const tl = gsap.timeline({ paused: true });

      q(".s04-round").innerHTML = K.cartelRound(1, "#ffd23f", "#0b0b12");
      tl.fromTo(q(".s04-round"), { scale: 1.8, rotation: -12, svgOrigin: "0 0" }, { scale: 1, rotation: 0, svgOrigin: "0 0", duration: 0.25, ease: "back.out(1.8)" }, 0);
      tl.to(q(".s04-round"), { scale: 1.1, svgOrigin: "0 0", duration: 0.12, yoyo: true, repeat: 1 }, 0.38);
      K.sacudir(tl, esc, 0.38 + 0.02, 12);
      tl.to(q(".s04-round"), { opacity: 0, scale: 0.4, y: -300, svgOrigin: "0 0", duration: 0.3, ease: "power3.in" }, 1.0);

      q(".s04-du").innerHTML = K.duenio({ cara: "cansado" });
      q(".s04-cel").innerHTML = K.celular({ titulo: "Pedidos", colorBarra: "#2a5cff", globos: [["2 tortas", 0], ["1 pizza", 0], ["3 empanadas", 0], ["1 flan", 0], ["2 pizzas", 0]] });
      q(".s04-rival").innerHTML = K.luchador({ color: "#2a5cff", trim: "#ffd23f", emblema: "planilla", nombre: "LA PLANILLA", boca: "burla" });
      q(".s04-hoja").innerHTML = K.planilla();
      const du = q(".s04-du"), ri = q(".s04-rival");
      const DESDE = 1.2, LA = 3.04, PLANILLA = 3.59, PASAME = 4.84, FILAS = [6.3, 6.67, 7.0, 7.29, 7.59];
      // el dueño con el celular
      gsap.set([du, q(".s04-cel")], { opacity: 0 });
      tl.fromTo(du, { opacity: 1, y: 60 }, { y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, DESDE - 0.1);
      K.popSvg(tl, q(".s04-cel"), DESDE + 0.1);
      [0, 1, 2, 3, 4].forEach((i) => { gsap.set(q(".s04-cel .k-ce-g" + i), { opacity: 0 }); tl.to(q(".s04-cel .k-ce-g" + i), { opacity: 1, duration: 0.1 }, DESDE + 0.35 + i * 0.3); });
      // entra La Planilla
      gsap.set(q(".s04-rmov"), { x: 600 });
      tl.to(q(".s04-rmov"), { x: 0, duration: 0.45, ease: "power3.out" }, LA - 0.2);
      K.golpe(tl, q(".s04-nombre"), PLANILLA + 0.05);
      K.sacudir(tl, esc, PLANILLA + 0.06, 14);
      tl.to(q(".s04-rival .k-l-brazoD"), { rotation: -25, svgOrigin: "322 262", duration: 0.2, yoyo: true, repeat: 3 }, PLANILLA + 0.1);
      K.cara(tl, du, "dolor", PLANILLA);
      // "pasame los pedidos": la hoja, y él señala
      tl.to(q(".s04-nombre"), { opacity: 0, y: -30, duration: 0.2 }, PASAME - 0.3);
      K.popSvg(tl, q(".s04-hoja"), PASAME);
      for (let i = 1; i <= 5; i++) gsap.set(q(".s04-hoja .k-pl-f" + i), { opacity: 0 });
      tl.to(q(".s04-rival .k-l-brazoI"), { rotation: -40, svgOrigin: "118 262", duration: 0.25, ease: "back.out(2)" }, PASAME + 0.1);
      K.cara(tl, du, "cansado", PASAME + 0.3);
      K.cara(tl, ri, "risa", PASAME + 0.4, "k-l-boca");
      // uno por uno, fila por fila: cada fila es un golpe chiquito
      FILAS.forEach((t, i) => {
        tl.to(q(".s04-hoja .k-pl-f" + (i + 1)), { opacity: 1, duration: 0.06 }, t);
        tl.to(q(".s04-cel .k-ce-g" + i), { opacity: 0.25, duration: 0.1 }, t);
        tl.fromTo(du, { y: 0 }, { y: 14, duration: 0.08, yoyo: true, repeat: 1, immediateRender: false }, t);
        tl.fromTo(q(".s04-rival .k-l-brazoI"), { rotation: -40 }, { rotation: -55, svgOrigin: "118 262", duration: 0.08, yoyo: true, repeat: 1, immediateRender: false }, t);
      });
      tl.to(q(".s04-du .k-d-sudor"), { opacity: 1, duration: 0.1 }, 6.4);
      tl.fromTo(q(".s04-du .k-d-sudor"), { y: 0 }, { y: 50, duration: 1.4, ease: "power1.in", immediateRender: false }, 6.4);
      K.cara(tl, du, "dolor", FILAS[4]);

      // salida
      tl.to(q("#s04-planilla-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
