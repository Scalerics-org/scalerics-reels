<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-no-es"] .s02-capa { position: absolute; inset: 0; }
    [data-composition-id="s02-no-es"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s02-no-es"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-no-es"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-no-es"] .ojo { fill: #efeee5; }
    [data-composition-id="s02-no-es"] .s02-rip { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 0.06em; fill: #efeee5; }
    [data-composition-id="s02-no-es"] .s02-plata { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 44px; fill: rgba(239, 238, 229, 0.4); }
    [data-composition-id="s02-no-es"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s02-no-es"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s02-no-es" data-width="1080" data-height="1920" data-duration="3.30">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="3.30" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- fantasmita que mira la fila -->
        <g class="s02-fan"><g class="s02-flota"><g class="s02-ladea">
          <path class="ln" d="M-45 50 V-10 A45 45 0 0 1 45 -10 V50 l-15 -14 l-15 14 l-15 -14 l-15 14 l-15 -14 l-15 14 Z" />
          <ellipse class="ojo" cx="-15" cy="-8" rx="6" ry="9" /><ellipse class="ojo" cx="15" cy="-8" rx="6" ry="9" />
        </g></g></g>
        <g class="s02-fila">
          <!-- 1: lápida -->
          <g class="s02-ico s02-ico1">
            <g class="s02-dib">
              <path class="ln s02-d1" d="M-58 80 V-30 A58 58 0 0 1 58 -30 V80" />
              <path class="ln s02-d1" d="M-95 80 H95" />
              <path class="ln s02-d1" d="M-80 80 q6 -16 12 0 M66 80 q7 -18 14 0" />
              <text class="s02-rip s02-rip-t" x="0" y="12" text-anchor="middle">RIP</text>
            </g>
          </g>
          <!-- 2: caja de mudanza con flechita -->
          <g class="s02-ico s02-ico2">
            <g class="s02-dib">
              <rect class="ln s02-d2" x="-72" y="-40" width="144" height="118" rx="6" />
              <path class="ln s02-d2" d="M-72 -40 L-96 -72 M72 -40 L96 -72 M-30 -40 V-6 H30 V-40" />
              <path class="ln s02-d2 s02-flecha" d="M-34 40 H30 M12 22 L32 40 L12 58" />
            </g>
          </g>
          <!-- 3: billetera abierta y vacía -->
          <g class="s02-ico s02-ico3">
            <g class="s02-dib">
              <rect class="ln s02-d3" x="-80" y="-30" width="160" height="104" rx="14" />
              <path class="ln s02-d3" d="M-80 -24 L-58 -78 H80 V-30" />
              <path class="ln s02-d3" d="M80 6 H44 a16 16 0 0 0 0 32 H80" />
              <text class="s02-plata s02-plata-t" x="-14" y="40" text-anchor="middle">$</text>
            </g>
          </g>
        </g>
        <!-- badges de "no" -->
        <g class="s02-badge s02-b1"><g class="s02-b-in"><circle class="ln-ac" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
        <g class="s02-badge s02-b2"><g class="s02-b-in"><circle class="ln-ac" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
        <g class="s02-badge s02-b3"><g class="s02-b-in"><circle class="ln-ac" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
      </svg>
      <div class="etiqueta"><span class="s02-e1">No es eso</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-no-es";
      const DUR = 3.3;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const MURIERON = 0.6;
      const NI1 = 1.1;
      const MUDARON = 1.6;
      const NI2 = 2.43;
      const QUEDARON = 2.7;

      const Y = 960;
      const XS = [260, 540, 820];
      const BADGE = [[64, -92], [100, -82], [92, -88]];

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const badge = (el, t) => {
        tl.fromTo(el.querySelector(".s02-b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.3, ease: "back.out(2.2)" }, t);
      };
      const sacudir = (el, t) => {
        tl.to(el, { x: -6, duration: 0.05, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      };
      // el fantasmita se ladea en cada X
      const ladear = (t, lado) => {
        tl.to(q(".s02-ladea"), { rotation: 14 * lado, svgOrigin: "0 40", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };

      const icos = [q(".s02-ico1"), q(".s02-ico2"), q(".s02-ico3")];
      icos.forEach((g, i) => gsap.set(g, { x: XS[i], y: Y }));
      [q(".s02-b1"), q(".s02-b2"), q(".s02-b3")].forEach((b, i) => gsap.set(b, { x: XS[i] + BADGE[i][0], y: Y + BADGE[i][1] }));
      qa(".s02-b-in").forEach((b) => gsap.set(b, { opacity: 0 }));

      // la fila se acerca despacio (nunca queda quieta)
      tl.fromTo(q(".s02-fila"), { scale: 1.05, svgOrigin: "540 " + Y }, { scale: 1, svgOrigin: "540 " + Y, duration: DUR, ease: "none" }, 0);

      // fantasmita arriba al centro: ya está desde el cuadro 0, flotando
      gsap.set(q(".s02-fan"), { x: 540, y: 710, opacity: 0.55 });
      tl.fromTo(q(".s02-fan"), { scale: 0.55 }, { scale: 0.8, duration: 0.4, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s02-flota"), { y: 8 }, { y: -8, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);

      // 1. murieron: la lápida arranca medio dibujada
      dibujar(qa(".s02-d1"), 0, 0.5, 0.45);
      tl.fromTo(q(".s02-rip-t"), { opacity: 0, scale: 0.85, svgOrigin: "0 0" }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.3, ease: "back.out(1.6)" }, 0.15);
      badge(q(".s02-b1"), MURIERON);
      sacudir(q(".s02-ico1 .s02-dib"), MURIERON + 0.02);
      ladear(MURIERON, -1);
      tl.fromTo(q(".s02-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.25);

      // 2. mudaron: la caja cae en "Ni", la flechita empuja en "mudaron"
      tl.to(q(".s02-ico1"), { opacity: 0.4, duration: 0.3 }, NI1);
      dibujar(qa(".s02-d2"), NI1 - 0.05, 0.45);
      tl.fromTo(q(".s02-ico2 .s02-dib"), { y: -40 }, { y: 0, duration: 0.45, ease: "back.out(1.6)" }, NI1 - 0.05);
      tl.to(q(".s02-flecha"), { x: 12, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 3 }, MUDARON - 0.15);
      badge(q(".s02-b2"), MUDARON);
      sacudir(q(".s02-ico2 .s02-dib"), MUDARON + 0.02);
      ladear(MUDARON, 1);

      // 3. sin plata: la billetera se abre vacía en "quedaron"
      tl.to(q(".s02-ico2"), { opacity: 0.4, duration: 0.3 }, NI2);
      dibujar(qa(".s02-d3"), NI2, 0.4);
      tl.fromTo(q(".s02-ico3 .s02-dib"), { rotation: -14, svgOrigin: "0 40" }, { rotation: 0, svgOrigin: "0 40", duration: 0.45, ease: "back.out(1.8)" }, NI2);
      tl.fromTo(q(".s02-plata-t"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, QUEDARON - 0.05);
      badge(q(".s02-b3"), QUEDARON + 0.1);
      sacudir(q(".s02-ico3 .s02-dib"), QUEDARON + 0.12);
      ladear(QUEDARON + 0.1, -1);

      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
