<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-fantasmas"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-fantasmas"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-fantasmas"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-fantasmas"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-fantasmas"] .vidrio { fill: #5ce611; }
    [data-composition-id="s01-fantasmas"] .ojo { fill: #efeee5; }
    [data-composition-id="s01-fantasmas"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s01-fantasmas"] .num { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 34px; fill: #5ce611; }
    [data-composition-id="s01-fantasmas"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s01-fantasmas"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01-fantasmas" data-width="1080" data-height="1920" data-duration="4.70">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="4.70" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s01-suelo" x1="100" y1="1150" x2="980" y2="1150" />
        <!-- tu local (centro, escala 1.2) -->
        <g class="s01-local">
          <g class="s01-local-in">
            <path class="ln s01-dib" d="M-120 0 V-170 H120 V0" />
            <path class="ln s01-dib" d="M-140 -170 H140 L122 -222 H-122 Z" />
            <path class="ln s01-dib" d="M-140 -170 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0" />
            <rect class="ln s01-dib" x="-80" y="-290" width="160" height="50" rx="10" />
            <text class="cartel s01-txt" x="0" y="-257" text-anchor="middle">TU LOCAL</text>
            <rect class="ln s01-dib" x="-100" y="-122" width="58" height="52" rx="5" />
            <rect class="ln s01-dib" x="42" y="-122" width="58" height="52" rx="5" />
            <rect class="vidrio s01-luz" x="-92" y="-114" width="42" height="36" rx="3" />
            <rect class="vidrio s01-luz" x="50" y="-114" width="42" height="36" rx="3" />
            <path class="ln s01-dib" d="M-24 0 V-96 H24 V0" />
          </g>
        </g>
        <!-- los fantasmas: sábana con dos ojos (el mismo dibujo en todo el reel) -->
        <g class="s01-fan s01-fan-1"><g class="s01-flota">
          <path class="ln s01-sabana" d="M-45 50 V-10 A45 45 0 0 1 45 -10 V50 l-15 -14 l-15 14 l-15 -14 l-15 14 l-15 -14 l-15 14 Z" />
          <ellipse class="ojo s01-ojos" cx="-15" cy="-8" rx="6" ry="9" /><ellipse class="ojo s01-ojos" cx="15" cy="-8" rx="6" ry="9" />
        </g></g>
        <g class="s01-fan s01-fan-2"><g class="s01-flota">
          <path class="ln s01-sabana" d="M-45 50 V-10 A45 45 0 0 1 45 -10 V50 l-15 -14 l-15 14 l-15 -14 l-15 14 l-15 -14 l-15 14 Z" />
          <ellipse class="ojo s01-ojos" cx="-15" cy="-8" rx="6" ry="9" /><ellipse class="ojo s01-ojos" cx="15" cy="-8" rx="6" ry="9" />
        </g></g>
        <g class="s01-fan s01-fan-3"><g class="s01-flota">
          <path class="ln s01-sabana" d="M-45 50 V-10 A45 45 0 0 1 45 -10 V50 l-15 -14 l-15 14 l-15 -14 l-15 14 l-15 -14 l-15 14 Z" />
          <ellipse class="ojo s01-ojos" cx="-15" cy="-8" rx="6" ry="9" /><ellipse class="ojo s01-ojos" cx="15" cy="-8" rx="6" ry="9" />
        </g></g>
        <!-- el cliente: figurita sólida que entra una vez -->
        <g class="s01-p"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln s01-p-cuerpo" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
        <g class="s01-uno">
          <circle class="ln-ac" cx="700" cy="790" r="30" />
          <text class="num" x="700" y="802" text-anchor="middle">1</text>
        </g>
        <!-- el mismo cliente, ya fantasma, que se va -->
        <g class="s01-fan s01-fan-ida"><g class="s01-flota">
          <path class="ln" d="M-45 50 V-10 A45 45 0 0 1 45 -10 V50 l-15 -14 l-15 14 l-15 -14 l-15 14 l-15 -14 l-15 14 Z" />
          <ellipse class="ojo" cx="-15" cy="-8" rx="6" ry="9" /><ellipse class="ojo" cx="15" cy="-8" rx="6" ry="9" />
        </g></g>
      </svg>
      <div class="etiqueta"><span class="s01-e1">Lleno de fantasmas</span><span class="s01-e2">Vinieron una vez</span><span class="s01-e3">Nunca más</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-fantasmas";
      const DUR = 4.7;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const FANTASMAS = 1.2;
      const CLIENTES = 2.1;
      const UNA_VEZ = 3.0;
      const NUNCA = 3.8;

      const SUELO = 1150;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          // si arranca a medio dibujar (desde), se ve desde el cuadro 0
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // flotar: sube y baja lento, con repeat finito (nada de repeat -1)
      const flotar = (g, t, veces) => {
        tl.fromTo(g, { y: 8 }, { y: -8, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: veces }, t);
      };

      // el local arranca medio dibujado (el cuadro 0 no puede ser negro), con la luz prendida
      gsap.set(q(".s01-local"), { x: 540, y: SUELO, scale: 1.2 });
      dibujar(qa(".s01-dib"), 0, 0.6, 0.45);
      tl.fromTo(q(".s01-txt"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3);
      tl.fromTo(qa(".s01-luz"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 0.4);
      tl.fromTo(q(".s01-suelo"), { scaleX: 0.5, svgOrigin: "540 1150" }, { scaleX: 1, svgOrigin: "540 1150", duration: 0.7, ease: "power3.out" }, 0);

      // "fantasmas": aparecen tres alrededor del local, de a uno, flotando
      const lugares = [[250, 900], [835, 860], [540, 680]];
      qa(".s01-fan-1, .s01-fan-2, .s01-fan-3").forEach((g, i) => {
        const t0 = FANTASMAS - 0.1 + i * 0.16;
        gsap.set(g, { x: lugares[i][0], y: lugares[i][1], opacity: 0.55 });
        dibujar([g.querySelector(".s01-sabana")], t0, 0.5);
        tl.fromTo(g.querySelectorAll(".s01-ojos"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, t0 + 0.4);
        tl.fromTo(g, { scale: 0.7 }, { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t0);
        flotar(g.querySelector(".s01-flota"), t0, 4);
      });
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, FANTASMAS);

      // "clientes que vinieron una vez": una figurita entra por la puerta y aparece el "1"
      const p = q(".s01-p");
      tl.fromTo(p, { x: 140, y: SUELO, opacity: 0 }, { x: 200, opacity: 1, duration: 0.15, ease: "none" }, CLIENTES - 0.1);
      tl.to(p, { x: 540, duration: 0.85, ease: "none" }, CLIENTES + 0.05);
      tl.fromTo(q(".s01-p-cuerpo"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 5 }, CLIENTES);
      tl.to(p, { opacity: 0, duration: 0.15 }, CLIENTES + 0.85);
      tl.fromTo(q(".s01-uno"), { opacity: 0, scale: 0.5, svgOrigin: "700 790" }, { opacity: 1, scale: 1, svgOrigin: "700 790", duration: 0.35, ease: "back.out(2)" }, UNA_VEZ);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.2 }, CLIENTES - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CLIENTES);

      // "nunca más": sale por la puerta convertido en fantasma, sube y se va; el local se apaga
      const ida = q(".s01-fan-ida");
      gsap.set(ida, { opacity: 0 });
      tl.fromTo(ida, { x: 540, y: 1060, opacity: 0, scale: 0.6 }, { opacity: 0.6, scale: 1, duration: 0.3, ease: "power3.out" }, NUNCA - 0.1);
      tl.to(ida, { x: 380, y: 760, duration: 0.9, ease: "sine.inOut" }, NUNCA + 0.1);
      tl.to(ida, { opacity: 0, duration: 0.3 }, NUNCA + 0.6);
      tl.to(q(".s01-uno"), { opacity: 0, duration: 0.25 }, NUNCA);
      tl.to(qa(".s01-luz"), { opacity: 0, duration: 0.3 }, NUNCA + 0.2);
      tl.to(qa(".s01-dib, .s01-txt"), { opacity: 0.4, duration: 0.4 }, NUNCA + 0.2);
      tl.to(q(".s01-e2"), { opacity: 0, duration: 0.2 }, NUNCA - 0.1);
      tl.fromTo(q(".s01-e3"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, NUNCA);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
