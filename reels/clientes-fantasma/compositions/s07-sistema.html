<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s07-sistema"] .s07-capa { position: absolute; inset: 0; }
    [data-composition-id="s07-sistema"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s07-sistema"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s07-sistema"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
    [data-composition-id="s07-sistema"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s07-sistema"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s07-sistema"] .s07-ojo { fill: #5ce611; }
    [data-composition-id="s07-sistema"] .s07-pupila { fill: none; stroke: #0b1d35; stroke-width: 3; stroke-linecap: round; }
    [data-composition-id="s07-sistema"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s07-sistema"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s07-sistema" data-width="1080" data-height="1920" data-duration="2.51">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="2.51" data-track-index="0">
      <!-- gato negro de líneas, sentado -->
      <div id="s07-gato-capa" class="s07-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <line class="ln s07-dib s07-suelo" x1="380" y1="1130" x2="760" y2="1130" />
          <g class="s07-gato">
            <!-- cola en curva -->
            <g class="s07-cola"><path class="ln s07-dib" d="M600 1126 C680 1130 712 1070 690 1020 C676 988 692 960 722 966" /></g>
            <!-- cuerpo -->
            <path class="ln s07-dib" d="M508 878 C456 920 438 1030 456 1126 H612 C632 1030 620 920 572 878" />
            <!-- patas delanteras -->
            <path class="ln s07-dib" d="M508 1126 V1050 M556 1126 V1050" />
            <!-- cabeza con orejas -->
            <path class="ln s07-dib" d="M482 812 L490 732 L528 766 Q540 763 552 766 L590 732 L598 812 A60 60 0 1 1 482 812 Z" />
            <!-- ojos verdes -->
            <g class="s07-ojos">
              <ellipse class="s07-ojo" cx="518" cy="818" rx="11" ry="15" />
              <ellipse class="s07-ojo" cx="562" cy="818" rx="11" ry="15" />
              <path class="s07-pupila" d="M518 810 V826 M562 810 V826" />
            </g>
            <!-- nariz y bigotes -->
            <path class="ln-4 s07-bigote" d="M534 846 L540 852 L546 846 M528 852 L480 844 M528 858 L482 864 M552 852 L600 844 M552 858 L598 864" />
          </g>
          <!-- badge de "no" -->
          <g class="s07-badge">
            <circle class="ln-badge" cx="630" cy="740" r="18" />
            <path class="ln-badge" d="M622 732 L638 748 M638 732 L622 748" />
          </g>
        </svg>
      </div>
      <!-- engranaje -->
      <div id="s07-sistema-capa" class="s07-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g class="s07-engranaje">
            <path class="ln s07-dib-g s07-dientes" d="" />
            <circle class="ln-ac s07-dib-g" cx="540" cy="930" r="54" />
          </g>
        </svg>
      </div>
      <div class="etiqueta"><span class="s07-e1">No es mala suerte</span><span class="s07-e2">Es un sistema</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s07-sistema";
      const DUR = 2.51;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SUERTE = 0.27;
      const NO_TENER = 1.07;
      const SISTEMA = 1.67;

      // dientes del engranaje (geometría fija, determinista)
      const CX = 540, CY = 930, RIN = 128, ROUT = 168, N = 9;
      const pt = (r, a) => (CX + r * Math.cos(a)).toFixed(1) + " " + (CY + r * Math.sin(a)).toFixed(1);
      let d = "";
      for (let i = 0; i < N; i++) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
        const p0 = pt(RIN, a - 0.2), p1 = pt(ROUT, a - 0.12), p2 = pt(ROUT, a + 0.12), p3 = pt(RIN, a + 0.2);
        const sig = pt(RIN, a + (2 * Math.PI) / N - 0.2);
        d += (i === 0 ? "M" + p0 : "") + " L" + p1 + " L" + p2 + " L" + p3 + " A" + RIN + " " + RIN + " 0 0 1 " + sig;
      }
      q(".s07-dientes").setAttribute("d", d + " Z");

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };

      // ---------- gato: arranca medio dibujado, entrada rápida ----------
      dibujar(qa(".s07-dib"), 0, 0.3, 0.5);
      tl.fromTo(q(".s07-ojos"), { opacity: 0, scale: 0.4, svgOrigin: "540 818" }, { opacity: 1, scale: 1, svgOrigin: "540 818", duration: 0.25, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".s07-bigote"), { opacity: 0 }, { opacity: 0.6, duration: 0.2 }, 0.12);
      tl.fromTo(q(".s07-gato"), { scale: 0.92, svgOrigin: "540 1126" }, { scale: 1, svgOrigin: "540 1126", duration: 0.3, ease: "back.out(1.6)" }, 0);
      // la cola se mece todo el tramo
      tl.fromTo(q(".s07-cola"), { rotation: -6, svgOrigin: "600 1126" }, { rotation: 6, svgOrigin: "600 1126", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.05);
      // parpadeo verde
      tl.to(q(".s07-ojos"), { scaleY: 0.15, svgOrigin: "540 818", duration: 0.07, yoyo: true, repeat: 1 }, 0.62);
      tl.fromTo(q(".s07-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.05);

      // badge X en la entrada; "suerte": el gato se encoge
      tl.fromTo(q(".s07-badge"), { opacity: 0, scale: 0.5, svgOrigin: "630 740" }, { opacity: 1, scale: 1, svgOrigin: "630 740", duration: 0.25, ease: "back.out(2.2)" }, 0.1);
      tl.to(q(".s07-gato"), { scaleY: 0.94, svgOrigin: "540 1126", duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, SUERTE);
      tl.to(qa(".s07-dib"), { opacity: 0.45, duration: 0.3 }, SUERTE + 0.3);

      // "no tener": el gato se va y se dibuja el engranaje
      tl.to(q("#s07-gato-capa"), { opacity: 0, scale: 0.75, rotation: -25, filter: "blur(6px)", transformOrigin: "540px 930px", duration: 0.25, ease: "power2.in" }, NO_TENER - 0.08);
      tl.to(q(".s07-e1"), { opacity: 0, duration: 0.15 }, NO_TENER - 0.08);
      dibujar(qa(".s07-dib-g"), NO_TENER, 0.45);
      tl.fromTo(q(".s07-engranaje"), { rotation: -40, svgOrigin: "540 930" }, { rotation: 70, svgOrigin: "540 930", duration: DUR - NO_TENER, ease: "none" }, NO_TENER);
      tl.fromTo(q(".s07-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, NO_TENER + 0.05);
      // "sistema": punch
      tl.fromTo(q("#s07-sistema-capa"), { scale: 1 }, { scale: 1.14, transformOrigin: "540px 930px", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, SISTEMA);
      tl.to(q(".s07-e2"), { scale: 1.08, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, SISTEMA);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
