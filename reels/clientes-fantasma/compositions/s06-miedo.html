            <rect class="ln s06-dib-a" x="-100" y="-296" width="200" height="56" rx="10" />

        <g class="s06-p s06-p-3"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>

  <script>
    (function () {
      const ID = "s06-miedo";
      const DUR = 5.73;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const MIEDO = 0.5;
      const VAYAN = 1.9;
      const COMPETENCIA = 3.1;
      const ANOTADOS = 4.6;

      const SUELO = 1150;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // tu local: medio dibujado desde el cuadro 0, y se apaga a 0.4 en "miedo"
      gsap.set(q(".s06-local-a"), { x: 270, y: SUELO, scale: 0.9 });
      dibujar(qa(".s06-dib-a"), 0, 0.6, 0.45);
      tl.fromTo(q(".s06-txt-a"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.15);
      tl.fromTo(q(".s06-suelo"), { scaleX: 0.5, svgOrigin: "540 1150" }, { scaleX: 1, svgOrigin: "540 1150", duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo(q(".s06-apaga"), { opacity: 1 }, { opacity: 0.4, duration: 0.5 }, MIEDO);

      // "miedo": salen 3 fantasmas por la puerta; "se vayan": se van a la derecha
      const fans = qa(".s06-fan");
      const flotando = [[330, 760], [420, 690], [480, 800]];
      const medio = [[470, 860], [560, 790], [640, 880]];
      const llegada = [[580, 1090], [650, 1090], [810, 1090]];
      fans.forEach((g, i) => {
        const t0 = MIEDO + i * 0.18;
        gsap.set(g, { opacity: 0 });
        tl.fromTo(g, { x: 270, y: 1080, scale: 0.5, opacity: 0 }, { x: flotando[i][0], y: flotando[i][1], scale: 0.85, opacity: 0.55, duration: 0.7, ease: "power3.out" }, t0);
        tl.to(g, { x: medio[i][0], y: medio[i][1], duration: 1.1, ease: "sine.inOut" }, VAYAN + i * 0.1);
        tl.to(g, { x: llegada[i][0], y: llegada[i][1], scale: 0.7, duration: 0.55, ease: "power2.inOut" }, COMPETENCIA + 0.15 + i * 0.12);
        tl.fromTo(g.querySelector(".s06-flota"), { y: 8 }, { y: -8, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, t0);
      });
      tl.fromTo(q(".s06-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, MIEDO);

      // "competencia": se dibuja el de enfrente, con la luz prendida
      gsap.set(q(".s06-local-b"), { x: 810, y: SUELO, scale: 0.9 });
      dibujar(qa(".s06-dib-b"), COMPETENCIA - 0.05, 0.55);
      tl.fromTo(q(".s06-txt-b"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, COMPETENCIA + 0.3);
      tl.fromTo(qa(".s06-luz"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, COMPETENCIA + 0.4);

      // al llegar, cada fantasma se vuelve figurita sólida
      qa(".s06-p").forEach((p, i) => {
        const t1 = COMPETENCIA + 0.7 + i * 0.12;
        gsap.set(p, { x: llegada[i][0], y: SUELO, opacity: 0 });
        tl.to(fans[i], { opacity: 0, duration: 0.2 }, t1);
        tl.fromTo(p, { opacity: 0, scale: 0.85, svgOrigin: "0 0" }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.35, ease: "back.out(1.6)" }, t1);
        tl.to(p, { y: SUELO - 10, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, t1 + 0.35 + i * 0.05);
      });

      // "anotados": el anotador y los tres tildes, de a uno
      gsap.set(q(".s06-nota"), { opacity: 0 });
      pop(q(".s06-nota"), ANOTADOS - 0.25, "810 848");
      dibujar(qa(".s06-renglon"), ANOTADOS - 0.15, 0.3);
      qa(".s06-tilde").forEach((t, i) => dibujar([t], ANOTADOS + 0.05 + i * 0.22, 0.25));
      tl.to(q(".s06-e1"), { opacity: 0, duration: 0.2 }, COMPETENCIA - 0.1);
      tl.fromTo(q(".s06-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, COMPETENCIA + 0.9);
      tl.to(q(".s06-nota"), { rotation: -3, svgOrigin: "810 848", duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, ANOTADOS + 0.6);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
