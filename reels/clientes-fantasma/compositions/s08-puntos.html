    [data-composition-id="s08-puntos"] .s08-rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: rgba(239, 238, 229, 0.6); }
    [data-composition-id="s08-puntos"] .s08-total { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 84px; fill: #5ce611; }
    [data-composition-id="s08-puntos"] .s08-mas { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 44px; fill: #5ce611; }
    [data-composition-id="s08-puntos"] .s08-noti-fondo { fill: #5ce611; }
    [data-composition-id="s08-puntos"] .s08-noti-txt { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 26px; fill: #0b1d35; }

    [data-composition-id="s08-puntos"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s08-puntos"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s08-puntos" data-width="1080" data-height="1920" data-duration="7.40">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="7.40" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- caja de marca -->
        <g class="s08-caja">
          <rect class="ln s08-dib-caja" x="330" y="608" width="420" height="112" rx="28" />
          <text class="s08-nombre" x="540" y="685" text-anchor="middle">Scalerics</text>
        </g>

        <!-- izquierda: el cliente (fantasma / figurita) -->
        <line class="ln s08-suelo" x1="170" y1="1180" x2="440" y2="1180" />
        <g class="s08-fan"><g transform="scale(1.4)"><g class="s08-flota">
          <path class="ln" d="M-45 50 V-10 A45 45 0 0 1 45 -10 V50 l-15 -14 l-15 14 l-15 -14 l-15 14 l-15 -14 l-15 14 Z" />
          <ellipse class="ojo" cx="-15" cy="-8" rx="6" ry="9" /><ellipse class="ojo" cx="15" cy="-8" rx="6" ry="9" />
        </g></g></g>
        <g class="s08-p"><g class="s08-p-in" transform="scale(1.6)">
          <circle class="ln" cx="0" cy="-96" r="14" />
          <path class="ln s08-p-cuerpo" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" />
        </g></g>
        <!-- flecha circular verde: vuelve -->
        <g class="s08-vuelta"><g class="s08-vuelta-in">
          <path class="ln-ac s08-arco" d="M95 0 A95 95 0 1 1 0 -95" />
          <path class="ln-ac s08-arco-punta" d="M-16 -111 L0 -95 L-16 -79" />
        </g></g>

        <!-- derecha: celular con tarjeta de puntos -->
        <g class="s08-cel">
          <path class="ln s08-marco" d="M650 790 H880 A46 46 0 0 1 926 836 V1186 A46 46 0 0 1 880 1232 H650 A46 46 0 0 1 604 1186 V836 A46 46 0 0 1 650 790 Z" />
          <line class="ln s08-marco" x1="735" y1="816" x2="795" y2="816" />
          <g class="s08-head">
            <circle class="ln-ac" cx="644" cy="862" r="10" stroke-width="4" />
            <text class="s08-app" x="666" y="871">Mis puntos</text>
          </g>
          <line class="ln-tenue s08-div" x1="630" y1="898" x2="900" y2="898" />
          <!-- tarjeta -->
          <rect class="ln-4 s08-tarjeta" x="630" y="924" width="270" height="216" rx="18" />
          <text class="s08-rotulo s08-r" x="652" y="968">PUNTOS</text>
          <text class="s08-total s08-t40" x="652" y="1064">40</text>
          <text class="s08-total s08-t50" x="652" y="1064">50</text>
          <g class="s08-sellos">
            <rect class="s08-sello" x="652" y="1094" width="30" height="30" rx="7" />
            <rect class="s08-sello" x="696" y="1094" width="30" height="30" rx="7" />
            <rect class="s08-sello" x="740" y="1094" width="30" height="30" rx="7" />
            <rect class="s08-sello" x="784" y="1094" width="30" height="30" rx="7" />
            <rect class="s08-sello" x="828" y="1094" width="30" height="30" rx="7" />
            <rect class="s08-lleno s08-l1" x="652" y="1094" width="30" height="30" rx="7" />
            <rect class="s08-lleno s08-l2" x="696" y="1094" width="30" height="30" rx="7" />
            <rect class="s08-lleno s08-l3" x="740" y="1094" width="30" height="30" rx="7" />
            <rect class="s08-lleno s08-l4" x="784" y="1094" width="30" height="30" rx="7" />
            <rect class="s08-lleno s08-l5" x="828" y="1094" width="30" height="30" rx="7" />
          </g>
          <text class="s08-mas" x="800" y="1040">+10</text>
          <!-- notificación que cae -->
          <g class="s08-noti" data-layout-allow-overlap>
            <rect class="s08-noti-fondo" x="592" y="830" width="346" height="104" rx="20" />
            <path class="s08-noti-ic" d="M622 896 V872 A14 14 0 0 1 650 872 V896 Z M616 896 H656 M631 904 H641" />
            <text class="s08-noti-txt" x="672" y="872">Te extrañamos:</text>
            <text class="s08-noti-txt" x="672" y="910">café de regalo</text>
          </g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s08-e1">Hacemos que vuelvan</span><span class="s08-e2">Puntos en el celular</span><span class="s08-e3">Aviso automático</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-puntos";
      const DUR = 7.4;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SCALERICS = 0.36;
      const HACEMOS = 1.11;
      const VUELVAN = 1.56;
      const CADA = 2.39;
      const SUMA = 2.96;
      const PUNTOS = 3.26;
      const CELULAR = 3.86;
      const DEJA = 5.06;
      const LLEGA = 6.04;
      const AVISO = 6.56;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const etiqueta = (sale, entra, t) => {
        if (sale) tl.to(q(sale), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(entra), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      // ---------- caja Scalerics: arranca medio dibujada ----------
      dibujar([q(".s08-dib-caja")], 0, 0.45, 0.3);
      tl.fromTo(q(".s08-nombre"), { opacity: 0.5, scale: 0.9, svgOrigin: "540 665" }, { opacity: 1, scale: 1, svgOrigin: "540 665", duration: 0.35, ease: "back.out(1.6)" }, 0);
      tl.to(q(".s08-caja"), { scale: 1.07, svgOrigin: "540 664", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, SCALERICS);
      // la caja respira lento todo el tramo
      tl.to(q(".s08-caja"), { y: -6, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.7);

      // ---------- el fantasma aparece a la izquierda ----------
      const FX = 300, FY = 1080;
      const fan = q(".s08-fan"), p = q(".s08-p");
      gsap.set(fan, { x: FX, y: FY, opacity: 0 });
      gsap.set(p, { x: FX, y: 1180, opacity: 0 });
      gsap.set(q(".s08-vuelta"), { x: FX, y: 1088 });
      tl.fromTo(fan, { opacity: 0, scale: 0.75, transformOrigin: "50% 50%" }, { opacity: 0.55, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.15);
      tl.fromTo(q(".s08-flota"), { y: 6 }, { y: -8, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 11 }, 0.15);
      dibujar([q(".s08-suelo")], 0.1, 0.5);
      etiqueta(null, ".s08-e1", HACEMOS);

      // "vuelvan": fantasma -> figurita, con la flecha circular verde
      const aFigura = (t) => {
        tl.to(fan, { opacity: 0, y: FY - 30, duration: 0.3, ease: "power2.in" }, t);
        tl.fromTo(p, { opacity: 0, scale: 0.8, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t + 0.05);
      };
      const aFantasma = (t) => {
        tl.to(p, { opacity: 0, duration: 0.3, ease: "power2.in" }, t);
        tl.fromTo(fan, { opacity: 0, y: FY }, { opacity: 0.55, y: FY - 20, duration: 0.45, ease: "sine.out", immediateRender: false }, t + 0.05);
      };
      aFigura(VUELVAN);
      dibujar([q(".s08-arco")], VUELVAN, 0.45);
      tl.fromTo(q(".s08-arco-punta"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, VUELVAN + 0.4);
      tl.fromTo(q(".s08-vuelta-in"), { rotation: 0, svgOrigin: "0 0" }, { rotation: 360, svgOrigin: "0 0", duration: 0.9, ease: "power2.inOut" }, VUELVAN + 0.45);
      // la figurita se mece (está, viene)
      tl.fromTo(q(".s08-p-cuerpo"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 9, immediateRender: false }, VUELVAN + 0.3);

      // ---------- "cada compra": el celular con la tarjeta ----------
      dibujar(qa(".s08-marco"), CADA - 0.05, 0.5);
      tl.fromTo(q(".s08-head"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, CADA + 0.2);
      dibujar([q(".s08-div")], CADA + 0.25, 0.35);
      dibujar([q(".s08-tarjeta")], CADA + 0.15, 0.45);
      tl.fromTo(q(".s08-r"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, CADA + 0.35);
      gsap.set(qa(".s08-t50, .s08-mas, .s08-noti"), { opacity: 0 });
      pop(q(".s08-t40"), CADA + 0.35, "690 1040");
      qa(".s08-sello").forEach((s, i) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.15 }, CADA + 0.3 + i * 0.04));
      gsap.set(qa(".s08-lleno"), { opacity: 0 });
      qa(".s08-l1, .s08-l2, .s08-l3, .s08-l4").forEach((s, i) => tl.to(s, { opacity: 1, duration: 0.12 }, CADA + 0.4 + i * 0.05));
      etiqueta(".s08-e1", ".s08-e2", CADA);
      // la figurita salta al comprar
      tl.to(p, { y: 1160, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, CADA + 0.2);

      // "suma puntos": +10 sube y el total pasa de 40 a 50
      tl.fromTo(q(".s08-mas"), { opacity: 0, y: 30, scale: 0.7, svgOrigin: "840 1028" }, { opacity: 1, y: 0, scale: 1, svgOrigin: "840 1028", duration: 0.3, ease: "back.out(2)" }, SUMA);
      tl.to(q(".s08-mas"), { y: -60, opacity: 0, duration: 0.45, ease: "power2.in" }, PUNTOS + 0.15);
      tl.to(q(".s08-t40"), { opacity: 0, y: -18, duration: 0.12 }, PUNTOS);
      tl.fromTo(q(".s08-t50"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, PUNTOS + 0.08);
      tl.to(q(".s08-t50"), { scale: 1.12, svgOrigin: "690 1040", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, PUNTOS + 0.3);
      tl.fromTo(q(".s08-l5"), { opacity: 0, scale: 0.4, svgOrigin: "843 1109" }, { opacity: 1, scale: 1, svgOrigin: "843 1109", duration: 0.3, ease: "back.out(2)" }, PUNTOS + 0.1);
      // "celular": golpe del celular
      tl.to(q(".s08-cel"), { scale: 1.04, svgOrigin: "765 1011", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, CELULAR);
      tl.to(q(".s08-cel"), { y: -8, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, CELULAR + 0.35);

      // ---------- "deja de venir": vuelve a ser fantasma ----------
      tl.to(q(".s08-vuelta"), { opacity: 0, duration: 0.25 }, DEJA - 0.05);
      aFantasma(DEJA);
      tl.fromTo(q(".s08-flota"), { y: -8 }, { y: 8, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, DEJA + 0.1);
      tl.to(q(".s08-tarjeta, .s08-total, .s08-sellos"), { opacity: 0.55, duration: 0.3 }, DEJA + 0.2);

      // "le llega un aviso": cae la notificación al celular y el fantasma vuelve a ser figurita
      tl.fromTo(q(".s08-noti"), { opacity: 0, y: -70 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, LLEGA);
      tl.to(q(".s08-noti"), { scale: 1.05, svgOrigin: "765 882", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, AVISO);
      tl.to(q(".s08-noti-ic"), { rotation: 12, svgOrigin: "636 862", duration: 0.08, ease: "sine.inOut", yoyo: true, repeat: 5 }, LLEGA + 0.35);
      tl.to(q(".s08-tarjeta, .s08-total, .s08-sellos"), { opacity: 1, duration: 0.3 }, AVISO + 0.1);
      tl.to(q(".s08-head"), { opacity: 0, duration: 0.12 }, LLEGA - 0.1);
      etiqueta(".s08-e2", ".s08-e3", LLEGA);
      aFigura(AVISO);
      tl.to(q(".s08-vuelta"), { opacity: 1, duration: 0.2 }, AVISO + 0.05);
      tl.fromTo(q(".s08-vuelta-in"), { rotation: 0, svgOrigin: "0 0" }, { rotation: 360, svgOrigin: "0 0", duration: 0.7, ease: "power2.inOut", immediateRender: false }, AVISO + 0.1);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
