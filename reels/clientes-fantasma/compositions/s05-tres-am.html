    [data-composition-id="s05-tres-am"] .ui { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s05-tres-am"] .ui-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 26px; fill: #efeee5; }
    [data-composition-id="s05-tres-am"] .hora { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.08em; fill: rgba(239, 238, 229, 0.55); }
    [data-composition-id="s05-tres-am"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s05-tres-am"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s05-tres-am" data-width="1080" data-height="1920" data-duration="6.90">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="6.90" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- luna creciente arriba a la derecha -->
        <path class="ln s05-luna" d="M872 632 A46 46 0 1 0 916 694 A36 36 0 1 1 872 632 Z" />
        <!-- murciélagos de líneas -->
        <g class="s05-bat s05-bat-1"><g class="s05-ala">
          <path class="ln-fino" d="M0 -8 L-6 -20 L-10 -6 Q-30 -26 -60 -14 Q-48 -4 -46 10 Q-36 2 -28 12 Q-20 4 -12 14 Q-6 6 0 12 Q6 6 12 14 Q20 4 28 12 Q36 2 46 10 Q48 -4 60 -14 Q30 -26 10 -6 L6 -20 Z" />
        </g></g>
        <g class="s05-bat s05-bat-2"><g class="s05-ala">
          <path class="ln-fino" d="M0 -8 L-6 -20 L-10 -6 Q-30 -26 -60 -14 Q-48 -4 -46 10 Q-36 2 -28 12 Q-20 4 -12 14 Q-6 6 0 12 Q6 6 12 14 Q20 4 28 12 Q36 2 46 10 Q48 -4 60 -14 Q30 -26 10 -6 L6 -20 Z" />
        </g></g>

        <!-- 1) el reloj despertador digital -->
        <g class="s05-reloj">
          <rect class="ln s05-dib-r" x="300" y="820" width="480" height="200" rx="32" />
          <path class="ln s05-dib-r" d="M350 1020 L334 1052 M730 1020 L746 1052" />
          <path class="ln s05-dib-r" d="M480 820 V804 H600 V820" />
          <text class="reloj-viejo s05-259" x="510" y="968" text-anchor="middle">2:59</text>
          <text class="reloj-num s05-300" x="510" y="968" text-anchor="middle">3:00</text>
          <text class="am s05-am" x="672" y="966">AM</text>

        <!-- 2) el celular de noche -->
        <g class="s05-tel">
          <rect class="ln s05-dib-t" x="360" y="640" width="360" height="600" rx="52" />
          <line class="ln s05-dib-t" x1="505" y1="668" x2="575" y2="668" />
          <text class="estado s05-estado" x="540" y="716" text-anchor="middle">3:00</text>
          <circle class="ln s05-dib-t" cx="408" cy="768" r="20" />
          <text class="ui-nombre s05-cab" x="442" y="778">Número nuevo</text>
          <line class="ln-tenue s05-dib-t" x1="384" y1="808" x2="696" y2="808" />
          <!-- vos: tres puntitos que se apagan -->
          <g class="s05-escribe">
            <rect class="ln-fino" x="586" y="960" width="110" height="56" rx="22" />
            <circle class="punto s05-dot" cx="617" cy="988" r="6" />
            <circle class="punto s05-dot" cx="641" cy="988" r="6" />
            <circle class="punto s05-dot" cx="665" cy="988" r="6" />
          </g>
          <rect class="ln-tenue s05-dib-t" x="384" y="1164" width="312" height="52" rx="26" />
        </g>
        <!-- el mensaje del cliente (fuera del celular para que no se apague con él) -->
        <g class="s05-msg">
          <rect class="ln" x="384" y="838" width="180" height="66" rx="22" />

          <text class="hora" x="388" y="934" data-layout-ignore>3:00</text>
        </g>
        <!-- el mensaje, ya fantasma -->

          <path class="ln" d="M-45 50 V-10 A45 45 0 0 1 45 -10 V50 l-15 -14 l-15 14 l-15 -14 l-15 14 l-15 -14 l-15 14 Z" />
          <ellipse class="ojo" cx="-15" cy="-8" rx="6" ry="9" /><ellipse class="ojo" cx="15" cy="-8" rx="6" ry="9" />
        </g></g>
      </svg>
      <div class="etiqueta"><span class="s05-e1">3 de la mañana</span><span class="s05-e2">Sin respuesta</span><span class="s05-e3">Otro fantasma</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-tres-am";
      const DUR = 6.9;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const TRES = 1.0;
      const MANANA = 1.5;
      const ESCRIBIO = 2.4;
      const PREGUNTANDO = 2.8;
      const PRECIO = 3.3;
      const NADIE = 4.15;
      const CONTESTO = 4.6;
      const OTRO = 5.67;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // murciélago que cruza aleteando
      const cruzar = (b, t, x0, y0, x1, y1, dur, esc) => {
        tl.fromTo(b, { x: x0, y: y0, scale: esc, opacity: 0 }, { opacity: 0.9, duration: 0.15 }, t);
        tl.to(b, { x: x1, y: y1, duration: dur, ease: "sine.inOut" }, t);
        tl.fromTo(b.querySelector(".s05-ala"), { scaleY: 1 }, { scaleY: 0.55, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: Math.round(dur / 0.12) | 1 }, t);
        tl.to(b, { opacity: 0, duration: 0.15 }, t + dur - 0.15);
      };

      // luna: arranca medio dibujada (el cuadro 0 no puede estar vacío) y se mece
      dibujar([q(".s05-luna")], 0, 0.7, 0.45);
      tl.fromTo(q(".s05-luna"), { rotation: -14, svgOrigin: "880 676" }, { rotation: 6, svgOrigin: "880 676", duration: DUR, ease: "sine.inOut" }, 0);
      gsap.set(qa(".s05-bat"), { opacity: 0 });
      cruzar(q(".s05-bat-1"), 0.15, 120, 700, 820, 610, 1.9, 1);
      cruzar(q(".s05-bat-2"), 0.45, 200, 760, 960, 700, 1.7, 0.75);

      // el reloj: medio dibujado desde el cuadro 0, marcando 2:59 en apagado
      dibujar(qa(".s05-dib-r"), 0, 0.6, 0.45);
      tl.fromTo(q(".s05-259"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);
      gsap.set(qa(".s05-300, .s05-am"), { opacity: 0 });
      tl.fromTo(q(".s05-reloj"), { scale: 0.96, svgOrigin: "540 920" }, { scale: 1.02, svgOrigin: "540 920", duration: ESCRIBIO, ease: "none" }, 0);
      // "tres": cambia a 3:00 en verde, con golpe
      tl.to(q(".s05-259"), { opacity: 0, y: -24, duration: 0.15, ease: "power2.in" }, TRES - 0.05);
      tl.fromTo(q(".s05-300"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, TRES);
      tl.to(q(".s05-reloj"), { x: -6, duration: 0.05, ease: "power1.inOut", yoyo: true, repeat: 5 }, TRES + 0.05);
      // "mañana": AM
      tl.fromTo(q(".s05-am"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, MANANA);
      tl.fromTo(q(".s05-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, MANANA);
      tl.to(q(".s05-reloj"), { y: -6, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.95);

      // "escribió": el reloj se va y se dibuja el celular
      tl.to(q(".s05-reloj"), { opacity: 0, scale: 0.6, y: -120, svgOrigin: "540 920", duration: 0.3, ease: "power2.in" }, ESCRIBIO - 0.2);
      dibujar(qa(".s05-dib-t"), ESCRIBIO, 0.55);
      tl.fromTo(q(".s05-tel"), { scale: 0.95, svgOrigin: "540 940" }, { scale: 1.02, svgOrigin: "540 940", duration: DUR - ESCRIBIO, ease: "none" }, ESCRIBIO);
      pop(q(".s05-estado"), ESCRIBIO + 0.2, "540 708");
      tl.fromTo(q(".s05-cab"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, ESCRIBIO + 0.3);
      // "preguntando": el celular vibra
      tl.to(q(".s05-tel"), { x: -6, duration: 0.05, ease: "power1.inOut", yoyo: true, repeat: 5 }, PREGUNTANDO);

      // "precio": la burbuja del cliente
      gsap.set(q(".s05-msg"), { opacity: 0 });
      pop(q(".s05-msg"), PRECIO - 0.05, "384 904");
      tl.to(q(".s05-msg"), { scale: 1.06, svgOrigin: "384 904", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, PRECIO + 0.5);

      // "nadie le contestó": tres puntitos que aparecen y se apagan
      gsap.set(q(".s05-escribe"), { opacity: 0 });
      pop(q(".s05-escribe"), NADIE - 0.05, "696 1016");
      qa(".s05-dot").forEach((d, i) => {
        tl.fromTo(d, { y: 0 }, { y: -8, duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 1 }, NADIE + 0.05 + i * 0.08);
      });
      tl.to(q(".s05-escribe"), { opacity: 0, scale: 0.9, svgOrigin: "696 1016", duration: 0.3, ease: "power2.in" }, CONTESTO);
      tl.to(q(".s05-tel"), { opacity: 0.4, duration: 0.5 }, CONTESTO + 0.1);
      tl.to(q(".s05-e1"), { opacity: 0, duration: 0.2 }, NADIE - 0.1);
      tl.fromTo(q(".s05-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, NADIE);
      // espera: la burbuja queda sola y tiembla
      tl.to(q(".s05-msg"), { y: -4, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.0);

      // "otro fantasma": la burbuja se vuelve fantasma y sube flotando
      const fan = q(".s05-fan");
      gsap.set(fan, { x: 474, y: 872, opacity: 0 });
      tl.to(q(".s05-msg"), { opacity: 0, scale: 0.7, svgOrigin: "474 872", duration: 0.3, ease: "power2.in" }, OTRO - 0.05);
      tl.fromTo(fan, { opacity: 0, scale: 0.6 }, { opacity: 0.6, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, OTRO);
      tl.to(fan, { x: 870, y: 900, duration: 0.9, ease: "power2.out" }, OTRO + 0.1);
      tl.fromTo(q(".s05-flota"), { rotation: -6 }, { rotation: 6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 2 }, OTRO);
      tl.to(q(".s05-e2"), { opacity: 0, duration: 0.2 }, OTRO - 0.1);
      tl.fromTo(q(".s05-e3"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, OTRO);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
