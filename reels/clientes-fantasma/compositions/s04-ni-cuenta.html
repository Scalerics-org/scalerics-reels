  <script>
    (function () {
      const ID = "s04-ni-cuenta";
      const DUR = 7.1;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const PEOR = 0.8;
      const CUENTA = 2.1;
      const NO = 2.98;
      const LLAMAN = 3.8;
      const TELEFONO = 4.7;
      const CUANDO = 5.8;

      const SUELO = 1150;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // ---- parte 1: el local arranca medio dibujado, vos ya en la puerta
      gsap.set(q(".s04-local"), { x: 600, y: SUELO, scale: 1.1, svgOrigin: "0 0" });
      dibujar(qa(".s04-dib"), 0, 0.6, 0.45);
      tl.fromTo(q(".s04-txt"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.25);
      tl.fromTo(qa(".s04-luz"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 0.3);
      const vos = q(".s04-vos");
      gsap.set(vos, { x: 830, y: SUELO, scale: 1.4 });
      tl.fromTo(vos, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0);
      // mira para la derecha, se balancea despreocupado
      tl.fromTo(q(".s04-vos-in"), { rotation: -3, svgOrigin: "0 0" }, { rotation: 3, svgOrigin: "0 0", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0.1);
      tl.fromTo(q(".s04-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);

      // dos fantasmas pasan por detrás, lento (en "peor")
      const rutas = [[[100, 1010], [400, 730]], [[60, 860], [300, 640]]];
      qa(".s04-fan-1, .s04-fan-2").forEach((g, i) => {
        const t0 = 0.15 + i * 0.5;
        tl.fromTo(g, { x: rutas[i][0][0], y: rutas[i][0][1], opacity: 0 }, { x: rutas[i][1][0], y: rutas[i][1][1], duration: 2.6, ease: "sine.inOut" }, t0);
        tl.to(g, { opacity: 0.55, duration: 0.4 }, t0);
        tl.to(g, { opacity: 0, duration: 0.4 }, NO - 0.4 + i * 0.05);
        tl.fromTo(g.querySelector(".s04-flota"), { y: 8, rotation: -6, svgOrigin: "0 0" }, { y: -8, rotation: 6, svgOrigin: "0 0", duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, t0);
      });

      // "cuenta": un "?" sobre tu cabeza
      const qq = q(".s04-q");
      gsap.set(qq, { x: 830, y: 960 });
      pop(qq, CUENTA - 0.05, "0 -20");
      tl.to(qq, { rotation: 10, svgOrigin: "0 -20", duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, CUENTA + 0.3);

      // la parte 1 se va
      tl.to(q(".s04-parte1"), { opacity: 0, scale: 0.94, svgOrigin: "540 950", duration: 0.3, ease: "power2.in" }, NO - 0.2);

      // ---- parte 2: la ficha se dibuja en "No sabés"
      gsap.set(q(".s04-parte2"), { opacity: 1 });
      dibujar(qa(".s04-ficha"), NO - 0.05, 0.55);
      tl.fromTo(q(".s04-tit"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, NO + 0.3);
      dibujar(qa(".s04-sep"), NO + 0.3, 0.45);
      tl.fromTo(q(".s04-ficha"), { scale: 0.96, svgOrigin: "540 920" }, { scale: 1, svgOrigin: "540 920", duration: 0.6, ease: "power3.out" }, NO - 0.05);
      tl.fromTo(q(".s04-parte2"), { scale: 0.97, svgOrigin: "540 920" }, { scale: 1.02, svgOrigin: "540 920", duration: DUR - NO, ease: "none" }, NO);
      tl.to(q(".s04-e1"), { opacity: 0, duration: 0.2 }, NO - 0.1);
      tl.fromTo(q(".s04-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, NO);

      // el fantasmita asoma por la esquina de arriba a la derecha
      const as = q(".s04-asoma");
      gsap.set(as, { x: 850, y: 700, rotation: 18, opacity: 0 });
      tl.to(as, { opacity: 0.55, duration: 0.15 }, NO + 0.45);
      tl.fromTo(as, { x: 800, y: 740, scale: 0.5 }, { x: 860, y: 690, scale: 0.8, duration: 0.45, ease: "back.out(2)" }, NO + 0.45);
      tl.fromTo(q(".s04-asoma-in"), { y: 6 }, { y: -6, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 4 }, NO + 0.8);

      // renglones en su palabra; los "???" saltan
      [[".s04-f1", LLAMAN, 878], [".s04-f2", TELEFONO, 988], [".s04-f3", CUANDO, 1098]].forEach(([sel, t, y]) => {
        const f = q(sel);
        tl.fromTo(f.querySelector(".s04-campo"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, t - 0.1);
        tl.fromTo(f.querySelector(".s04-nada"), { opacity: 0, scale: 0.6, svgOrigin: "760 " + (y - 14) }, { opacity: 1, scale: 1, svgOrigin: "760 " + (y - 14), duration: 0.35, ease: "back.out(2.2)" }, t + 0.05);
        tl.to(f.querySelector(".s04-nada"), { x: 5, duration: 0.05, ease: "power1.inOut", yoyo: true, repeat: 3 }, t + 0.4);
      });
      // los tres "???" laten juntos al final
      tl.to(qa(".s04-nada"), { scale: 1.12, svgOrigin: "760 980", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 6.5);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
