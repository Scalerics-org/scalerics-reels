  <script>
    (function () {
      const ID = "s10-halloween";
      const DUR = 3.44;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const HALLOWEEN = 0.2;
      const FANTASMAS = 1.6;
      const DISFRACES = 2.4;

      const SUELO = 1110;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // calabaza: arranca medio dibujada (el primer cuadro no puede estar vacío)
      dibujar(qa(".s10-dib"), 0, 0.6, 0.5);
      tl.fromTo(q(".s10-suelo"), { scaleX: 0.5, svgOrigin: "540 1110" }, { scaleX: 1, svgOrigin: "540 1110", duration: 0.7, ease: "power3.out" }, 0);
      // "Halloween": se le prende la cara con golpe y se mece
      tl.fromTo(q(".s10-cara"), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, HALLOWEEN + 0.1);
      tl.fromTo(q(".s10-cala-in"), { rotation: -4, transformOrigin: "50% 100%" }, { rotation: 4, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
      tl.fromTo(q(".s10-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, HALLOWEEN);

      // dos murciélagos que cruzan aleteando
      const vuelos = [[[120, 700], [980, 640], 0.15, 1.9, 1.1]], v2 = [[[980, 780], [100, 690], 0.6, 2.0, 0.85]];
      [...vuelos, ...v2].forEach(([a, b, t0, d, s], i) => {
        const m = qa(".s10-mur")[i];
        tl.fromTo(m, { x: a[0], y: a[1], scale: s, opacity: 0 }, { x: b[0], y: b[1], duration: d, ease: "none" }, t0);
        tl.to(m, { opacity: 0.85, duration: 0.15 }, t0);
        tl.to(m, { opacity: 0, duration: 0.2 }, t0 + d - 0.2);
        tl.fromTo(m.querySelector(".s10-ala"), { scaleY: 1, transformOrigin: "50% 50%" }, { scaleY: 0.6, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 15 }, t0);
      });

      // "fantasmas": aparece uno a la derecha, flotando
      const fan = q(".s10-fan");
      gsap.set(fan, { opacity: 0.55, transformOrigin: "50% 50%" });
      dibujar([q(".s10-sabana")], FANTASMAS - 0.15, 0.45);
      tl.fromTo(qa(".s10-ojos"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, FANTASMAS + 0.2);
      tl.fromTo(fan, { scale: 0.75 }, { scale: 1, duration: 0.45, ease: "back.out(1.6)" }, FANTASMAS - 0.15);
      tl.fromTo(q(".s10-flota"), { y: 6 }, { y: -6, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, FANTASMAS);

      // "disfraces": la sábana sube y se desvanece; abajo queda el cliente con su bolsita
      tl.to(q(".s10-sabana-g"), { y: -110, duration: 0.6, ease: "power2.in" }, DISFRACES - 0.05);
      tl.to(fan, { opacity: 0, duration: 0.45 }, DISFRACES + 0.1);
      const p = q(".s10-p");
      gsap.set(p, { opacity: 0, transformOrigin: "50% 100%" });
      tl.fromTo(p, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, DISFRACES + 0.05);
      tl.fromTo(q(".s10-bolsa"), { rotation: -14, transformOrigin: "50% 0%" }, { rotation: 10, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 2 }, DISFRACES + 0.3);

      // salida

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
