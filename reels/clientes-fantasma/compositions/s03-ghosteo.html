  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-ghosteo"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-ghosteo"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-ghosteo"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-ghosteo"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-ghosteo"] .ln-tick { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-ghosteo"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.35); stroke-width: 3; stroke-linecap: round; }

    [data-composition-id="s03-ghosteo"] .ui { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 26px; fill: #efeee5; }
    [data-composition-id="s03-ghosteo"] .ui-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 27px; fill: #efeee5; }
    [data-composition-id="s03-ghosteo"] .visto { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.1em; fill: rgba(239, 238, 229, 0.7); }
    [data-composition-id="s03-ghosteo"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s03-ghosteo"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s03-ghosteo" data-width="1080" data-height="1920" data-duration="5.70">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="5.70" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s03-tel">
          <!-- fantasma que asoma por el costado del celular (queda detrás del borde) -->
          <g class="s03-asoma"><g class="s03-asoma-in">
            <path class="ln" d="M-45 50 V-10 A45 45 0 0 1 45 -10 V50 l-15 -14 l-15 14 l-15 -14 l-15 14 l-15 -14 l-15 14 Z" />
            <ellipse class="ojo" cx="-15" cy="-8" rx="6" ry="9" /><ellipse class="ojo" cx="15" cy="-8" rx="6" ry="9" />
          </g></g>
          <!-- celular -->
          <rect class="ln s03-dib" x="360" y="630" width="360" height="610" rx="52" />
          <line class="ln s03-dib" x1="505" y1="660" x2="575" y2="660" />
          <circle class="ln s03-dib" cx="412" cy="718" r="20" />
          <text class="ui-nombre s03-cab" x="446" y="728">Cliente</text>
          <line class="ln-tenue s03-dib" x1="382" y1="760" x2="698" y2="760" />
          <!-- tu mensaje -->
          <g class="s03-msg">
            <rect class="ln" x="460" y="800" width="236" height="64" rx="22" />
            <text class="ui" x="478" y="842">¿Volvés pronto?</text>
          </g>
          <path class="ln-tick s03-tick" d="M652 896 l7 7 l13 -15 M664 903 l2 2 l13 -15" />
          <text class="visto s03-visto" x="640" y="905" text-anchor="end">Visto</text>
          <rect class="ln-tenue s03-dib" x="382" y="1162" width="316" height="50" rx="25" />
        </g>
        <!-- la cita: figurita con corazón -->
        <g class="s03-cita">
          <g class="s03-p">
            <g class="s03-p-in">
              <circle class="ln" cx="0" cy="-96" r="14" />
              <path class="ln s03-p-cuerpo" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" />
            </g>
          </g>
          <g class="s03-fan"><g class="s03-fan-in">
            <path class="ln" d="M-45 50 V-10 A45 45 0 0 1 45 -10 V50 l-15 -14 l-15 14 l-15 -14 l-15 14 l-15 -14 l-15 14 Z" />
            <ellipse class="ojo" cx="-15" cy="-8" rx="6" ry="9" /><ellipse class="ojo" cx="15" cy="-8" rx="6" ry="9" />
          </g></g>
          <g class="s03-corazon">
            <path class="ln-ac s03-cor-v" d="M0 22 C-34 -4 -36 -32 -16 -36 C-6 -38 0 -30 0 -24 C0 -30 6 -38 16 -36 C36 -32 34 -4 0 22 Z" />
            <path class="ln s03-cor-c" d="M0 22 C-34 -4 -36 -32 -16 -36 C-6 -38 0 -30 0 -24 C0 -30 6 -38 16 -36 C36 -32 34 -4 0 22 Z" />
          </g>
          <line class="ln-tenue s03-suelo" x1="620" y1="1110" x2="960" y2="1110" />
        </g>
      </svg>
      <div class="etiqueta"><span class="s03-e1">Te ghostearon</span><span class="s03-e2">Como una cita</span><span class="s03-e3">Sin avisar</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-ghosteo";
      const DUR = 5.7;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const GHOSTEARON = 0.7;
      const CITA = 2.2;
      const VINIERON = 2.82;
      const GUSTO = 3.6;
      const DESAPARECIERON = 4.32;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const etiqueta = (sale, entra, t) => {
        if (sale) tl.to(q(sale), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(entra), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      // celular: arranca medio dibujado, con tu mensaje ya mandado
      dibujar(qa(".s03-dib"), 0, 0.6, 0.45);
      tl.fromTo(q(".s03-cab"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);
      pop(q(".s03-msg"), 0.1, "696 864");
      tl.fromTo(q(".s03-tel"), { scale: 0.97, svgOrigin: "540 935" }, { scale: 1.02, svgOrigin: "540 935", duration: CITA, ease: "none" }, 0);

      // "ghostearon": doble tilde verde, "Visto", y el fantasma asoma por el costado con punch
      const tick = q(".s03-tick");
      gsap.set(tick, { opacity: 0 });
      tl.fromTo(tick, { opacity: 0, scale: 0.5, svgOrigin: "666 896" }, { opacity: 1, scale: 1, svgOrigin: "666 896", duration: 0.3, ease: "back.out(2)" }, GHOSTEARON - 0.25);
      tl.fromTo(q(".s03-visto"), { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, GHOSTEARON);
      const asoma = q(".s03-asoma");
      gsap.set(asoma, { x: 700, y: 980, rotation: 20, opacity: 0 });
      tl.to(asoma, { opacity: 0.6, duration: 0.1 }, GHOSTEARON);
      tl.fromTo(asoma, { x: 690, scale: 0.6 }, { x: 760, scale: 1.1, duration: 0.4, ease: "back.out(2.4)" }, GHOSTEARON);
      tl.fromTo(q(".s03-asoma-in"), { y: 8 }, { y: -8, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 2 }, GHOSTEARON + 0.3);
      etiqueta(null, ".s03-e1", GHOSTEARON);

      // "cita": el celular se achica a la izquierda, el fantasma se esconde
      tl.to(asoma, { opacity: 0, x: 700, duration: 0.25, ease: "power2.in" }, CITA - 0.15);
      tl.to(q(".s03-tel"), { scale: 0.72, x: -230, svgOrigin: "540 935", duration: 0.5, ease: "power3.inOut" }, CITA);
      tl.to(q(".s03-tel"), { opacity: 0.55, duration: 0.4 }, CITA + 0.3);
      etiqueta(".s03-e1", ".s03-e2", CITA);
      tl.fromTo(q(".s03-suelo"), { opacity: 0, scaleX: 0.3, svgOrigin: "790 1110" }, { opacity: 1, scaleX: 1, svgOrigin: "790 1110", duration: 0.5, ease: "power3.out" }, CITA + 0.1);

      // "vinieron": entra la figurita por la derecha
      const p = q(".s03-p");
      gsap.set(p, { x: 790, y: 1110, scale: 1.7, svgOrigin: "0 0", opacity: 0 });
      tl.fromTo(p, { x: 900, opacity: 0 }, { x: 790, opacity: 1, duration: 0.45, ease: "power3.out" }, VINIERON - 0.2);
      tl.fromTo(q(".s03-p-cuerpo"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 3 }, VINIERON - 0.2);
      // el corazón se dibuja arriba de su cabeza
      const cor = q(".s03-corazon");
      gsap.set(cor, { x: 790, y: 870, scale: 1.3, svgOrigin: "0 0" });
      gsap.set(q(".s03-cor-c"), { opacity: 0 });
      dibujar([q(".s03-cor-v")], VINIERON + 0.2, 0.5);

      // "les gustó": el corazón late
      tl.fromTo(cor, { scale: 1.3 }, { scale: 1.65, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 3 }, GUSTO);

      // "desaparecieron": la figurita se vuelve fantasma y se va flotando para arriba
      const fan = q(".s03-fan");
      gsap.set(fan, { x: 790, y: 1030, scale: 1.2, opacity: 0, svgOrigin: "0 0" });
      tl.to(p, { opacity: 0, duration: 0.35 }, DESAPARECIERON);
      tl.to(fan, { opacity: 0.5, duration: 0.35 }, DESAPARECIERON);
      tl.to(fan, { y: 760, x: 830, duration: 1.1, ease: "sine.in" }, DESAPARECIERON + 0.25);
      tl.fromTo(q(".s03-fan-in"), { rotation: -6, svgOrigin: "0 0" }, { rotation: 6, svgOrigin: "0 0", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, DESAPARECIERON);
      tl.to(fan, { opacity: 0, duration: 0.4 }, DESAPARECIERON + 0.95);
      tl.to(q(".s03-cor-v"), { opacity: 0, duration: 0.3 }, DESAPARECIERON + 0.1);
      tl.to(q(".s03-cor-c"), { opacity: 0.3, duration: 0.3 }, DESAPARECIERON + 0.1);
      tl.to(cor, { y: 900, duration: 0.6, ease: "power2.in" }, DESAPARECIERON + 0.2);
      etiqueta(".s03-e2", ".s03-e3", DESAPARECIERON);
      tl.to(q(".s03-suelo"), { opacity: 0.5, duration: 0.4 }, DESAPARECIERON + 0.4);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
