<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/pasatiempos.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-facil"] .s02-capa, [data-composition-id="s02-facil"] .s02-cam { position: absolute; inset: 0; }
    [data-composition-id="s02-facil"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s02-facil"] .s02-facil { left: 620px; top: 560px; font-size: 64px; }
    [data-composition-id="s02-facil"] .s02-escribe { left: 300px; top: 838px; font-size: 76px; color: #1f4fbf; }
    [data-composition-id="s02-facil"] .s02-arme { left: 600px; top: 975px; }
  </style>
  <div id="root" data-composition-id="s02-facil" data-width="1080" data-height="1920" data-duration="2.84">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="2.84" data-track-index="0">
      <div class="s02-cam">
        <svg class="s02-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      </div>
      <div class="pa-sello azul s02-facil">¡FÁCIL!</div>
      <div class="pa-mano s02-escribe">son iguales</div>
      <div class="pa-tag s02-arme">LOS ARMÉ YO</div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-facil";
      const DUR = 2.84;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = PA.kit(tl, root);
      const { q, qa } = K;
      const A = { stock: 12, precio: "2.490", caja: "ok", pagos: 1, vip: true };
      const B = { stock: 3, precio: "2.990", caja: "mal", pagos: 2, vip: false };
      // hojita de revista con las dos láminas en miniatura
      q(".s02-svg").innerHTML =
        `<g class="s02-hoja"><rect x="70" y="600" width="860" height="330" fill="${PA.PAP2}" stroke="${PA.INK}" stroke-width="6" transform="rotate(-3 500 765)"/>
          <g transform="rotate(-3 500 765)"><g transform="translate(100 640) scale(0.36)">${PA.lamina(0, 0, A, { id: "a" })}</g>
          <g transform="translate(560 640) scale(0.36)">${PA.lamina(0, 0, B, { id: "b" })}</g></g></g>` +
        `<path class="s02-igual" d="M462 740 L528 736 M462 772 L528 768" stroke="${PA.AZUL}" stroke-width="12" stroke-linecap="round"/>` +
        `<g class="s02-d">${PA.dueno(470, 1530, 1.2, { cara: "sobrado", birome: true })}</g>`;
      const FACIL = 0.0, IGUALES = 0.94, ARME = 1.88;
      tl.fromTo(q(".s02-d"), { y: 60 }, { y: 0, duration: 0.4, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s02-hoja"), { opacity: 0.4, y: -30, rotation: -4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.4, ease: "back.out(1.6)" }, 0);
      K.hablar(".pa-d-boca", 0.05, 7, 0.12);
      K.sello(q(".s02-facil"), FACIL + 0.15, 6);
      // "iguales": escribe con la birome y el "=" entre las dos
      K.escribir(q(".s02-escribe"), IGUALES, 0.55);
      qa(".s02-igual").forEach((el) => K.dibujar(el, IGUALES - 0.1, 0.3));
      K.origen(q(".pa-d-brazo"), "-170 -190");
      tl.to(q(".pa-d-brazo"), { rotation: -8, duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut" }, IGUALES);
      // "los armé yo": se infla
      K.origen(q(".s02-d .pa-d"), "0 0");
      tl.to(q(".s02-d .pa-d"), { scaleY: 1.05, scaleX: 1.04, duration: 0.25, ease: "back.out(2)" }, ARME - 0.05);
      K.pop(q(".s02-arme"), ARME);

      K.salida(q("#s02-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
