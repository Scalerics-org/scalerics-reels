    (function () {

          const ti = t + i * (paso ?? 0.04);

      const punch = (el, t, s) => tl.to(el, { scale: s ?? 1.08, transformOrigin: "50% 50%", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const etq = (k, t) => {
        if (k > 1) tl.to(q(".s02-e" + (k - 1)), { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(q(".s02-e" + k), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      const aparecer = (el, t, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d ?? 0.3 }, t);

      tl.to(q(".s02-b"), { opacity: 1, duration: 0.05 }, 3.57 + 0.1);
      dibujar(qa(".s02-calle"), 3.57 + 0.1, 0.5, 1, 0.01);

      pinPop(q(".s02-pin1"), 3.57 + 0.2);

      tl.to(q(".s02-busg"), { opacity: 1, duration: 0.15 }, 4.98);

      tl.to(q(".s02-busg"), { x: 520, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.98 + 0.8);
      pop(q(".s02-avg"), 5.17, 0.5);
      tl.to(q(".s02-avg"), { y: -12, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 3 }, 5.57);
