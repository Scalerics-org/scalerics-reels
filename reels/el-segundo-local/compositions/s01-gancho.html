    (function () {

      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const ti = t + i * (paso ?? 0.04);
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti <= 0 ? 1 : 0 });

        });
      };
      const borrar = (els, t, dur) => els.forEach((el) => { const L = el.getTotalLength(); tl.to(el, { strokeDashoffset: -L, duration: dur, ease: "power2.inOut" }, t); });

      const punch = (el, t, s) => tl.to(el, { scale: s ?? 1.08, transformOrigin: "50% 50%", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const etq = (k, t) => {
        if (k > 1) tl.to(q(".s01-e" + (k - 1)), { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(q(".s01-e" + k), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      const aparecer = (el, t, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d ?? 0.3 }, t);
      const pinPop = (el, t) => tl.fromTo(el, { opacity: 0, scale: 0.3, svgOrigin: "0 0" }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.45, ease: "back.out(2)" }, t);
      const pinPunch = (el, t, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: "0 0", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);

        const ls = pts.slice(1).map((pt, i) => Math.hypot(pt[0] - pts[i][0], pt[1] - pts[i][1]));
        const L = ls.reduce((a, b) => a + b, 0);
        let tt = t;
        pts.slice(1).forEach((pt, i) => { const d = dur * ls[i] / L; tl.to(el, { x: pt[0], y: pt[1], duration: d, ease: ease ?? "none" }, tt); tt += d; });
