  <script>
    (function () {
      const ID = "s06-conozco";
      const DUR = 4.94;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });

      const YO = 0.74;
      const CONOZCO = 0.94;
      const COMER = 1.24;
      const ABREN = 2.6;
      const SIETE = 3.04;
      const DIEZ = 4.34;
      const CORRE = 3.5;

      // horas 7:00 a 22:00 (una por div, se prenden de a una)
      const horas = q(".s06-horas");
      for (let h = 7; h <= 22; h++) {
        const d = document.createElement("div");
        d.className = "s06-t s06-t" + h;
        d.textContent = h + ":00";
        horas.appendChild(d);
      }

      // cuadro 0: rebobinado. "AHORA..." partido en rojo/amarillo/hueso que se junta, barridos

      [24, -18, 12, -6, 0].forEach((x, i) => tl.to(q(".s06-escenario"), { x, duration: 0.035, ease: "none" }, 0.02 + i * 0.05));
      tl.to([q(".s06-ahora-r"), q(".s06-ahora-a")], { opacity: 0, duration: 0.1 }, 0.36);
      // barridos horizontales (rebobinado de cinta)
      const barras = [[700, 10], [980, 6], [1240, 14], [1420, 5]];
      barras.forEach(([y, h], i) => {
        const b = document.createElement("div");
        b.className = "s06-barrido";
        b.style.top = y + "px";
        b.style.height = h + "px";
        q(".s06-escenario").appendChild(b);
        gsap.set(b, { opacity: 0.35, xPercent: -100 + i * 30 });
        tl.to(b, { xPercent: 110, duration: 0.3, ease: "none" }, i * 0.04);
        tl.set(b, { opacity: 0 }, 0.4);
      });
      tl.to(q(".s06-ahora-h"), { scale: 1.08, rotation: -2, duration: 0.5, ease: "sine.inOut" }, 0.3);
      [14, -10, 0].forEach((x, i) => tl.to(q(".s06-ahora-h"), { x, duration: 0.03, ease: "none" }, 0.5 + i * 0.05));

      // "YO CONOZCO COMERCIANTES": más calmo, firme
      tl.to(q(".s06-ahora-h"), { opacity: 0, y: -120, scale: 0.6, duration: 0.18, ease: "power3.in" }, YO - 0.1);
      gsap.set([q(".s06-yo"), q(".s06-comer")], { opacity: 0 });
      tl.fromTo(q(".s06-yo"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, YO);
      tl.fromTo(q(".s06-comer"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in", immediateRender: false }, COMER - 0.12);
      tl.to(q(".s06-escenario"), { y: 8, duration: 0.05, yoyo: true, repeat: 1, ease: "none" }, COMER + 0.04);
      gsap.set(q(".s06-raya"), { scaleX: 0, transformOrigin: "0% 50%" });
      tl.to(q(".s06-raya"), { scaleX: 1, duration: 0.35, ease: "power3.out" }, COMER + 0.15);
      tl.to([q(".s06-yo"), q(".s06-comer")], { scale: 1.06, duration: 1.1, ease: "sine.inOut" }, COMER + 0.2);
      tl.fromTo(q(".s06-yo"), { x: 0 }, { x: -12, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, 1.5);

      // "ABREN...": se va la frase, entra el reloj y el sol
      tl.to([q(".s06-yo"), q(".s06-comer"), q(".s06-raya")], { opacity: 0, y: -80, duration: 0.15, ease: "power3.in" }, ABREN - 0.15);
      gsap.set(q(".s06-reloj"), { opacity: 0 });
      tl.fromTo(q(".s06-reloj"), { opacity: 0, scale: 0.4, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, ABREN);
      gsap.set(q(".s06-etiqueta"), { opacity: 0 });
      tl.fromTo(q(".s06-etiqueta"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, ABREN + 0.1);

      // agujas: 7:00 = hora 210°, min 0°. A las 22:00: hora 660°, min 15 vueltas.
      gsap.set(q(".s06-hora"), { transformOrigin: "50% 98%", rotation: 210 });
      gsap.set(q(".s06-min"), { transformOrigin: "50% 98%", rotation: 0 });
      tl.to(q(".s06-hora"), { rotation: 660, duration: DIEZ - CORRE, ease: "power1.in" }, CORRE);
      tl.to(q(".s06-min"), { rotation: 5400, duration: DIEZ - CORRE, ease: "power1.in" }, CORRE);
      tl.to(q(".s06-reloj"), { rotation: 6, duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, DIEZ);
      tl.to(q(".s06-reloj"), { scale: 1.06, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, DIEZ);
      [3.3, 3.6, 3.9].forEach((t) => tl.to(q(".s06-reloj"), { x: 6, duration: 0.03, yoyo: true, repeat: 1, ease: "none" }, t));

      // el sol cruza por arriba del reloj y se vuelve luna
      const astro = q(".s06-astro");

      gsap.set(q(".s06-sombra"), { opacity: 0, x: 60 });

      // hora en Plex Mono: 7:00 golpea en "siete", corre hasta 22:00 en "diez"

        const el = q(".s06-t" + h);
        gsap.set(el, { opacity: 0 });
        const t = h === 7 ? SIETE - 0.1 : CORRE + ((h - 8) / 14) * (DIEZ - CORRE);
        if (h === 7) {
          tl.fromTo(el, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power4.in", immediateRender: false }, t);
        } else {
          tl.set(el, { opacity: 1 }, t);

        if (h > 7) tl.set(q(".s06-t" + (h - 1)), { opacity: 0 }, t);
