  <script>
    (function () {
      const ID = "s12-cta";
      const DUR = 8.31;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });

      const SON = 1.02;
      const VAGOS = 1.18;
      const ONO = 2.19;
      const QUIEN = 2.68;
      const CONTESTE = 2.88;
      const TE = 3.38;
      const LEEMOS = 3.88;
      const COMENT = 4.58;

      const entra = (el, from, to, t) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0 }, from), Object.assign({ opacity: 1, immediateRender: false }, to), t);
      };
      const sacudon = (t, f) => [[-22 * f, 12 * f], [18 * f, -10 * f], [-12 * f, 6 * f], [8 * f, -4 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s12-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      // cuadro 0: "ENTONCES..." se tipea (las primeras letras ya están)
      const letras = qa(".s12-entonces span");
      letras.forEach((l, i) => {
        if (i < 2) return;
        gsap.set(l, { opacity: 0 });
        tl.set(l, { opacity: 1 }, i * 0.05);
      });
      tl.fromTo(q(".s12-entonces"), { scale: 1.15 }, { scale: 1, duration: 0.5, ease: "power3.out" }, 0);
      [[14, 0.62], [-10, 0.66], [0, 0.7]].forEach(([x, t]) => tl.to(q(".s12-entonces"), { x, duration: 0.04, ease: "none" }, t));
      tl.to(q(".s12-entonces"), { scale: 1.08, duration: 0.3, ease: "sine.inOut" }, 0.72);
      // se va hacia arriba cuando entra la pregunta
      tl.to(q(".s12-entonces"), { y: -230, scale: 0.5, opacity: 0, duration: 0.14, ease: "power3.in" }, SON - 0.1);

      // "¿SON VAGOS": vuelve s01

      entra(q(".s12-vagos"), { scale: 3.2, rotation: -10 }, { scale: 1, rotation: -4, duration: 0.14, ease: "power4.in" }, VAGOS - 0.12);
      sacudon(VAGOS + 0.03, 1);
      [[18, 0], [-14, 0.05], [10, 0.1], [0, 0.15]].forEach(([x, d]) => tl.to(q(".s12-vagos"), { x, duration: 0.04, ease: "none" }, VAGOS + 0.4 + d));
      tl.to(q(".s12-vagos"), { scale: 1.07, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, VAGOS + 0.55);
      tl.to(q(".s12-son"), { rotation: -3, duration: 0.6, ease: "sine.inOut" }, VAGOS + 0.2);

      // "O NO TIENEN QUIÉN LES CONTESTE?": "vagos" se apaga y se va
      tl.to([q(".s12-son"), q(".s12-vagos")], { opacity: 0, scale: 0.7, filter: "blur(6px)", duration: 0.14, ease: "power3.in" }, ONO - 0.08);
      entra(q(".s12-ono"), { x: -260, skewX: -14 }, { x: 0, skewX: 0, duration: 0.16, ease: "power4.out" }, ONO - 0.04);
      entra(q(".s12-quien"), { x: 260, skewX: 14 }, { x: 0, skewX: 0, duration: 0.16, ease: "power4.out" }, QUIEN - 0.06);
      entra(q(".s12-conteste"), { scale: 3, rotation: 8 }, { scale: 1, rotation: -2, duration: 0.14, ease: "power4.in" }, CONTESTE - 0.1);
      sacudon(CONTESTE + 0.05, 0.8);
      tl.to([q(".s12-ono"), q(".s12-quien")], { opacity: 0.55, duration: 0.15 }, CONTESTE + 0.05);

      // encuesta: dos botones
      entra(q(".s12-b-vagos"), { scale: 0.4, rotation: -10, y: 80 }, { scale: 1, rotation: -3, y: 0, duration: 0.24, ease: "back.out(2)" }, TE - 0.04);
      entra(q(".s12-b-ayuda"), { scale: 0.4, rotation: 10, y: 80 }, { scale: 1, rotation: 3, y: 0, duration: 0.24, ease: "back.out(2)" }, TE + 0.12);
      entra(q(".s12-etiqueta"), { y: 12 }, { y: 0, duration: 0.3, ease: "power3.out" }, TE + 0.1);
      tl.to(q(".s12-conteste"), { scale: 0.92, duration: 0.3, ease: "power2.out" }, TE);

      // cursor que no se decide: entra por abajo y va y viene
      const XV = 300, XA = 800, YC = 1170;
      gsap.set(q(".s12-cursor"), { x: 560, y: 1560, opacity: 0 });
      tl.to(q(".s12-cursor"), { opacity: 1, duration: 0.1 }, TE + 0.3);
      tl.to(q(".s12-cursor"), { x: XV, y: YC, duration: 0.35, ease: "power3.out" }, TE + 0.3);
      const idas = [];
      let t = TE + 0.7;
      let lado = 1;
      while (t < DUR - 0.3) {
        const x = lado ? XA : XV;
        tl.to(q(".s12-cursor"), { x, y: YC + (lado ? -14 : 14), duration: 0.42, ease: "power2.inOut" }, t);
        idas.push([t + 0.42, lado]);
        t += 0.62 + (idas.length % 2) * 0.1;
        lado = 1 - lado;
      }
      // el botón que toca el cursor se hincha
      tl.to(q(".s12-b-vagos"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, TE + 0.62);
      idas.forEach(([ti, l]) => {
        const b = l ? q(".s12-b-ayuda") : q(".s12-b-vagos");
        tl.to(b, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, ti);
        tl.to(q(".s12-cursor"), { scale: 0.85, duration: 0.07, yoyo: true, repeat: 1, ease: "none", transformOrigin: "10% 10%" }, ti);
      });

      // globo de comentario en "leemos"
      entra(q(".s12-globo"), { scale: 0.5, y: 60, transformOrigin: "15% 100%" }, { scale: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, LEEMOS - 0.1);

      sacudon(COMENT + 0.06, 0.5);

      // después de la voz: todo late suave hasta el final

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
