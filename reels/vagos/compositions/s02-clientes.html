<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-clientes"] .s02-capa { position: absolute; inset: 0; }
    [data-composition-id="s02-clientes"] .s02-escenario { position: absolute; inset: 0; }
    [data-composition-id="s02-clientes"] .s02-grupo { position: absolute; inset: 0; }
    [data-composition-id="s02-clientes"] .s02-linea { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; }
    [data-composition-id="s02-clientes"] .s02-eso { top: 640px; font-weight: 800; font-size: 84px; letter-spacing: -0.01em; color: #f4f1ea; }
    [data-composition-id="s02-clientes"] .s02-yo { top: 760px; font-weight: 900; font-size: 230px; letter-spacing: -0.03em; color: #f4f1ea; }
    [data-composition-id="s02-clientes"] .s02-dicen { top: 1030px; font-weight: 800; font-size: 120px; letter-spacing: -0.02em; color: #f4f1ea; }
    [data-composition-id="s02-clientes"] .s02-tus { top: 610px; font-weight: 800; font-size: 110px; letter-spacing: 0.02em; color: #f4f1ea; }
    [data-composition-id="s02-clientes"] .s02-clientes { top: 720px; font-weight: 900; font-size: 158px; letter-spacing: -0.035em; color: #ffd60a; }
    [data-composition-id="s02-clientes"] .s02-frases { top: 912px; font-weight: 800; font-size: 70px; letter-spacing: 0; color: #f4f1ea; }
    /* micrófono de streaming */
    [data-composition-id="s02-clientes"] .s02-mic { position: absolute; left: 820px; top: 780px; width: 140px; height: 300px; }
    [data-composition-id="s02-clientes"] .s02-mic-cab { position: absolute; left: 25px; top: 0; width: 90px; height: 130px; border-radius: 45px; background: #f4f1ea; }
    [data-composition-id="s02-clientes"] .s02-mic-reja { position: absolute; left: 25px; height: 6px; width: 90px; background: #09090a; }
    [data-composition-id="s02-clientes"] .s02-mic-palo { position: absolute; left: 62px; top: 130px; width: 16px; height: 130px; background: #f4f1ea; }
    [data-composition-id="s02-clientes"] .s02-mic-base { position: absolute; left: 10px; top: 256px; width: 120px; height: 18px; border-radius: 9px; background: #f4f1ea; }
    /* siluetas */
    [data-composition-id="s02-clientes"] .s02-sil { position: absolute; top: 1210px; width: 140px; height: 200px; }
    [data-composition-id="s02-clientes"] .s02-sil-cab { position: absolute; left: 35px; top: 0; width: 70px; height: 70px; border-radius: 50%; background: #8a8f98; }
    [data-composition-id="s02-clientes"] .s02-sil-cuerpo { position: absolute; left: 5px; top: 82px; width: 130px; height: 110px; border-radius: 65px 65px 10px 10px; background: #8a8f98; }
    /* globos */
    [data-composition-id="s02-clientes"] .s02-globo { position: absolute; top: 1066px; width: 132px; height: 92px; }
    [data-composition-id="s02-clientes"] .s02-globo-caja { position: absolute; left: 0; top: 0; width: 120px; height: 72px; border: 6px solid #f4f1ea; border-radius: 22px; background: #09090a; }
    [data-composition-id="s02-clientes"] .s02-globo-cola { position: absolute; left: 26px; top: 64px; width: 26px; height: 26px; background: #09090a; border-right: 6px solid #f4f1ea; border-bottom: 6px solid #f4f1ea; }
    [data-composition-id="s02-clientes"] .s02-punto { position: absolute; top: 33px; width: 14px; height: 14px; border-radius: 50%; background: #f4f1ea; }
    [data-composition-id="s02-clientes"] .s02-etiqueta { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.34em; color: #ffd60a; text-transform: uppercase; }
  </style>
  <div id="root" data-composition-id="s02-clientes" data-width="1080" data-height="1920" data-duration="4.81">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="4.81" data-track-index="0">
      <div class="s02-escenario">
        <div class="s02-grupo s02-a">
          <div class="s02-linea s02-eso">Eso no lo digo</div>
          <div class="s02-linea s02-yo">yo.</div>
          <div class="s02-mic">
            <div class="s02-mic-cab"></div>
            <div class="s02-mic-reja" style="top: 40px"></div>
            <div class="s02-mic-reja" style="top: 62px"></div>
            <div class="s02-mic-reja" style="top: 84px"></div>
            <div class="s02-mic-palo"></div>
            <div class="s02-mic-base"></div>
          </div>
          <div class="s02-linea s02-dicen">lo dicen</div>
        </div>
        <div class="s02-grupo s02-b">
          <div class="s02-linea s02-tus">tus</div>
          <div class="s02-linea s02-clientes">clientes</div>
          <div class="s02-linea s02-frases">con estas frases:</div>
        </div>
        <div class="s02-gente"></div>
        <div class="s02-etiqueta">Lo dicen ellos</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-clientes";
      const DUR = 4.81;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const YO = 0.49;
      const DICEN = 0.89;
      const CLIENTES = 1.79;
      const DICEN2 = 3.09;
      const FRASES = 3.89;

      // armar 6 siluetas con su globo
      const gente = q(".s02-gente");
      const XS = [60, 220, 380, 540, 700, 860];
      XS.forEach((x, i) => {
        const s = document.createElement("div");
        s.className = "s02-sil";
        s.style.left = x + "px";
        s.innerHTML = '<div class="s02-sil-cab"></div><div class="s02-sil-cuerpo"></div>';
        gente.appendChild(s);
        const g = document.createElement("div");
        g.className = "s02-globo";
        g.style.left = x + 14 + "px";
        g.innerHTML = '<div class="s02-globo-cola"></div><div class="s02-globo-caja"></div>' +
          '<div class="s02-punto" style="left: 32px"></div><div class="s02-punto" style="left: 59px"></div><div class="s02-punto" style="left: 86px"></div>';
        gente.appendChild(g);
      });
      gsap.set(qa(".s02-globo-cola"), { rotation: 45 });
      const sils = qa(".s02-sil");
      const globos = qa(".s02-globo");

      // cuadro 0: "ESO NO LO DIGO" ya está, con glitch de x
      tl.fromTo(q(".s02-eso"), { scale: 1.25, opacity: 0.7 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, 0);
      [[-18, 0], [14, 0], [-10, 0], [6, 0], [0, 0]].forEach(([x], i) => tl.to(q(".s02-eso"), { x, duration: 0.03, ease: "none" }, 0.04 + i * 0.05));
      tl.fromTo(q(".s02-etiqueta"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.1);
      // el micrófono ya está, al costado
      tl.fromTo(q(".s02-mic"), { opacity: 0.5, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, 0);

      // "yo.": golpe y el micrófono se aparta
      gsap.set(q(".s02-yo"), { opacity: 0 });
      tl.fromTo(q(".s02-yo"), { opacity: 0, scale: 3, x: -40 }, { opacity: 1, scale: 1, x: -60, duration: 0.14, ease: "power4.in", immediateRender: false }, YO - 0.1);
      tl.to(q(".s02-mic"), { x: 320, rotation: 38, opacity: 0, duration: 0.35, ease: "power3.in" }, YO + 0.05);
      tl.to(q(".s02-yo"), { x: 0, rotation: -3, duration: 0.3, ease: "power2.out" }, YO + 0.1);
      [[-14, 8], [12, -6], [-6, 4], [4, -2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x, y, duration: 0.04, ease: "none" }, YO + 0.04 + i * 0.045));

      // "lo dicen": sube desde abajo
      gsap.set(q(".s02-dicen"), { opacity: 0 });
      tl.fromTo(q(".s02-dicen"), { opacity: 0, y: 90, scaleY: 1.4 }, { opacity: 1, y: 0, scaleY: 1, duration: 0.22, ease: "back.out(2)", immediateRender: false }, DICEN - 0.05);
      tl.to([q(".s02-eso"), q(".s02-yo")], { opacity: 0.22, duration: 0.15 }, DICEN);
      tl.to(q(".s02-dicen"), { scale: 1.06, rotation: 2, duration: 0.5, ease: "sine.inOut" }, DICEN + 0.2);

      // fuera el grupo A
      tl.to(q(".s02-a"), { y: -90, opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power3.in" }, CLIENTES - 0.2);

      // "TUS CLIENTES": golpe gigante amarillo
      gsap.set([q(".s02-tus"), q(".s02-clientes")], { opacity: 0 });
      tl.fromTo(q(".s02-tus"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(2.5)", immediateRender: false }, CLIENTES - 0.2);
      tl.fromTo(q(".s02-clientes"), { opacity: 0, scale: 3, rotation: 6 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.15, ease: "power4.in", immediateRender: false }, CLIENTES - 0.12);
      [[-22, 12], [18, -10], [-12, 6], [8, -4], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x, y, duration: 0.04, ease: "none" }, CLIENTES + 0.04 + i * 0.045));
      // glitch de "clientes"
      [[16, 0.3], [-12, 0.3], [0, 0.3]].forEach(([x], i) => tl.to(q(".s02-clientes"), { x, duration: 0.03, ease: "none" }, CLIENTES + 0.55 + i * 0.05));
      tl.to(q(".s02-clientes"), { scale: 1.05, duration: 0.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, CLIENTES + 0.7);

      // siluetas: pop de a una
      gsap.set(sils, { opacity: 0 });
      sils.forEach((s, i) => {
        tl.fromTo(s, { opacity: 0, y: 80, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, transformOrigin: "50% 100%", duration: 0.22, ease: "back.out(2.2)", immediateRender: false }, CLIENTES + 0.02 + i * 0.05);
        // se balancean un poco
        tl.to(s, { rotation: i % 2 ? 3 : -3, duration: 0.45, yoyo: true, repeat: 3, ease: "sine.inOut", transformOrigin: "50% 100%" }, CLIENTES + 0.4 + i * 0.04);
      });

      // "CON ESTAS FRASES:"
      gsap.set(q(".s02-frases"), { opacity: 0 });
      tl.fromTo(q(".s02-frases"), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.16, ease: "power4.out", immediateRender: false }, DICEN2);
      [[12], [-8], [0]].forEach(([x], i) => tl.to(q(".s02-frases"), { x, duration: 0.03, ease: "none" }, DICEN2 + 0.2 + i * 0.04));
      tl.to(q(".s02-tus"), { opacity: 0.3, duration: 0.15 }, DICEN2);

      // globos que saltan sobre las cabezas
      gsap.set(globos, { opacity: 0 });
      globos.forEach((g, i) => {
        const t = DICEN2 + 0.08 + i * 0.07;
        tl.fromTo(g, { opacity: 0, y: 60, scale: 0.3 }, { opacity: 1, y: 0, scale: 1, transformOrigin: "30% 100%", duration: 0.24, ease: "back.out(2.6)", immediateRender: false }, t);
        tl.to(g, { y: -14, duration: 0.22, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 0.3);
      });
      // en "frases" todo se sacude
      [[-12, 6], [10, -6], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x, y, duration: 0.04, ease: "none" }, FRASES + i * 0.045));
      tl.to(q(".s02-frases"), { scale: 1.1, duration: 0.12, yoyo: true, repeat: 1, ease: "power3.out" }, FRASES);

      // salida: zoom hacia los globos
      tl.to(q("#s02-escena"), { scale: 1.3, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 60%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
