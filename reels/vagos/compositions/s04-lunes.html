<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s04-lunes"] .s04-capa { position: absolute; inset: 0; }
    [data-composition-id="s04-lunes"] .s04-escenario { position: absolute; inset: 0; }
    [data-composition-id="s04-lunes"] .s04-linea { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; }
    [data-composition-id="s04-lunes"] .s04-pasa { top: 600px; font-weight: 800; font-size: 76px; letter-spacing: 0.04em; color: #f4f1ea; }
    [data-composition-id="s04-lunes"] .s04-lunes { top: 690px; font-weight: 900; font-size: 205px; letter-spacing: -0.03em; color: #f4f1ea; }
    /* calendario de escritorio */
    [data-composition-id="s04-lunes"] .s04-cal { position: absolute; left: 110px; top: 990px; width: 360px; height: 380px; }
    [data-composition-id="s04-lunes"] .s04-cal-fondo { position: absolute; left: 0; top: 40px; width: 360px; height: 340px; border-radius: 22px; background: #8a8f98; }
    [data-composition-id="s04-lunes"] .s04-hoja { position: absolute; left: 10px; top: 50px; width: 340px; height: 320px; border-radius: 16px; background: #f4f1ea; overflow: hidden; }
    [data-composition-id="s04-lunes"] .s04-hoja-cab { position: absolute; left: 0; top: 0; width: 340px; height: 80px; background: #ff2d2d; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 34px; line-height: 92px; letter-spacing: 0.3em; color: #f4f1ea; }
    [data-composition-id="s04-lunes"] .s04-hoja-dia { position: absolute; left: 0; right: 0; top: 112px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 140px; line-height: 1; letter-spacing: -0.02em; color: #09090a; }
    [data-composition-id="s04-lunes"] .s04-anillo { position: absolute; top: 18px; width: 26px; height: 58px; border-radius: 13px; background: #09090a; border: 6px solid #f4f1ea; }
    /* texto de la excusa */
    [data-composition-id="s04-lunes"] .s04-mono { position: absolute; left: 520px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 54px; line-height: 1; letter-spacing: 0.04em; color: #ffd60a; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="s04-lunes"] .s04-m1 { top: 1010px; }
    [data-composition-id="s04-lunes"] .s04-m2 { top: 1080px; }
    /* cartelito colgado */
    [data-composition-id="s04-lunes"] .s04-colgado { position: absolute; left: 560px; top: 1160px; width: 400px; height: 260px; }
    [data-composition-id="s04-lunes"] .s04-clavo { position: absolute; left: 188px; top: 0; width: 24px; height: 24px; border-radius: 50%; background: #f4f1ea; }
    [data-composition-id="s04-lunes"] .s04-hilo { position: absolute; top: 14px; width: 6px; height: 124px; background: #f4f1ea; }
    [data-composition-id="s04-lunes"] .s04-tabla { position: absolute; left: 40px; top: 96px; width: 320px; height: 150px; border-radius: 14px; background: #ffd60a; border: 6px solid #09090a; text-align: center; font-family: "Lexend", sans-serif; font-weight: 800; font-size: 54px; line-height: 1.04; color: #09090a; text-transform: uppercase; padding-top: 14px; box-sizing: border-box; }
    [data-composition-id="s04-lunes"] .s04-etiqueta { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.34em; color: #ffd60a; text-transform: uppercase; }
  </style>
  <div id="root" data-composition-id="s04-lunes" data-width="1080" data-height="1920" data-duration="3.16">
    <div id="s04-escena" class="s04-capa clip" data-start="0" data-duration="3.16" data-track-index="0">
      <div class="s04-escenario">
        <div class="s04-linea s04-pasa">Pasá el</div>
        <div class="s04-linea s04-lunes">lunes</div>
        <div class="s04-cal">
          <div class="s04-cal-fondo"></div>
          <div class="s04-hoja s04-h4"><div class="s04-hoja-cab">OCT</div><div class="s04-hoja-dia">LUN</div></div>
          <div class="s04-hoja s04-h3"><div class="s04-hoja-cab">OCT</div><div class="s04-hoja-dia">DOM</div></div>
          <div class="s04-hoja s04-h2"><div class="s04-hoja-cab">OCT</div><div class="s04-hoja-dia">SÁB</div></div>
          <div class="s04-hoja s04-h1"><div class="s04-hoja-cab">OCT</div><div class="s04-hoja-dia">VIE</div></div>
          <div class="s04-anillo" style="left: 80px"></div>
          <div class="s04-anillo" style="left: 250px"></div>
        </div>
        <div class="s04-mono s04-m1">Hoy no vino</div>
        <div class="s04-mono s04-m2">el que sabe</div>
        <div class="s04-colgado">
          <div class="s04-hilo s04-hilo-a" style="left: 197px"></div>
          <div class="s04-hilo s04-hilo-b" style="left: 197px"></div>
          <div class="s04-clavo"></div>
          <div class="s04-tabla">Vuelva<br>pronto</div>
        </div>
        <div class="s04-etiqueta">Excusa Nº 5</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s04-lunes";
      const DUR = 3.16;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const LUNES = 0.43;
      const HOY = 1.13;
      const ELQUE = 1.63;
      const SABE = 1.93;

      // hilos del cartel, inclinados hacia el clavo
      gsap.set(q(".s04-hilo-a"), { rotation: 46, transformOrigin: "50% 0%" });
      gsap.set(q(".s04-hilo-b"), { rotation: -46, transformOrigin: "50% 0%" });

      // cuadro 0: "PASÁ EL" ya está
      tl.fromTo(q(".s04-pasa"), { scale: 1.4, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, 0);
      tl.fromTo(q(".s04-etiqueta"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.1);
      // el calendario sube desde abajo
      tl.fromTo(q(".s04-cal"), { y: 220, opacity: 0.4, rotation: -8 }, { y: 0, opacity: 1, rotation: -3, duration: 0.3, ease: "back.out(1.8)" }, 0);

      // "LUNES" entra girando
      gsap.set(q(".s04-lunes"), { opacity: 0 });
      tl.fromTo(q(".s04-lunes"), { opacity: 0, scale: 3, rotation: -200 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.18, ease: "power4.in", immediateRender: false }, LUNES - 0.14);
      [[-20, 10], [16, -8], [-10, 6], [6, -3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s04-escenario"), { x, y, duration: 0.04, ease: "none" }, LUNES + 0.06 + i * 0.045));
      tl.to(q(".s04-pasa"), { opacity: 0.3, duration: 0.15 }, LUNES);
      tl.to(q(".s04-lunes"), { rotation: 3, scale: 1.04, duration: 0.6, ease: "sine.inOut" }, LUNES + 0.3);

      // hojas que se arrancan: VIE, SÁB, DOM, queda LUN
      // solo se ve la hoja de arriba (las de abajo aparecen cuando se arranca la anterior)
      gsap.set([q(".s04-h2"), q(".s04-h3"), q(".s04-h4")], { opacity: 0 });
      const HOJAS = [".s04-h1", ".s04-h2", ".s04-h3", ".s04-h4"];
      [[".s04-h1", 0.55], [".s04-h2", 0.85], [".s04-h3", 1.15]].forEach(([s, t], i) => {
        tl.to(q(s), { scaleY: 0, y: -40, rotation: i % 2 ? 6 : -6, transformOrigin: "50% 0%", duration: 0.13, ease: "power2.in" }, t);
        tl.set(q(s), { opacity: 0 }, t + 0.13);
        tl.fromTo(q(HOJAS[i + 1]), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, t + 0.13);
        tl.to(q(".s04-cal"), { y: 8, duration: 0.05, yoyo: true, repeat: 1, ease: "none" }, t + 0.12);
      });
      // llega el lunes: el calendario golpea
      tl.to(q(".s04-cal"), { scale: 1.08, rotation: 2, duration: 0.1, ease: "power3.out" }, 1.3);
      tl.to(q(".s04-cal"), { scale: 1, rotation: -2, duration: 0.3, ease: "back.out(2)" }, 1.4);

      // "HOY NO VINO" / "EL QUE SABE" en mono, con glitch
      gsap.set([q(".s04-m1"), q(".s04-m2")], { opacity: 0 });
      tl.fromTo(q(".s04-m1"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.12, ease: "power4.out", immediateRender: false }, HOY);
      [[14], [-10], [0]].forEach(([x], i) => tl.to(q(".s04-m1"), { x, duration: 0.03, ease: "none" }, HOY + 0.18 + i * 0.05));
      tl.fromTo(q(".s04-m2"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.12, ease: "power4.out", immediateRender: false }, ELQUE);
      [[-14], [10], [0]].forEach(([x], i) => tl.to(q(".s04-m2"), { x, duration: 0.03, ease: "none" }, ELQUE + 0.16 + i * 0.05));
      tl.to(q(".s04-lunes"), { opacity: 0.35, duration: 0.15 }, HOY);

      // cartel "VUELVA PRONTO": cae y se balancea como péndulo
      gsap.set(q(".s04-colgado"), { opacity: 0, transformOrigin: "50% 12px" });
      tl.fromTo(q(".s04-colgado"), { opacity: 0, y: -260, rotation: 18 }, { opacity: 1, y: 0, rotation: 10, duration: 0.16, ease: "power4.in", immediateRender: false }, SABE - 0.1);
      [[-20, 8], [14, -6], [-8, 4], [0, 0]].forEach(([x, y], i) => tl.to(q(".s04-escenario"), { x, y, duration: 0.04, ease: "none" }, SABE + 0.06 + i * 0.045));
      [-10, 8, -6, 5].forEach((r, i) => tl.to(q(".s04-colgado"), { rotation: r, duration: 0.26, ease: "sine.inOut" }, SABE + 0.08 + i * 0.26));

      // salida
      tl.to(q("#s04-escena"), { scale: 1.3, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 55%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
