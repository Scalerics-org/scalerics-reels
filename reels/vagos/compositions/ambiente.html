<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    /* cinta de peligro arriba y abajo, corriendo */
    [data-composition-id="ambiente"] .amb-cinta { position: absolute; left: -200px; width: 1480px; height: 22px; opacity: 0.85;
      background: repeating-linear-gradient(-45deg, #ffd60a 0 26px, #09090a 26px 52px); }
    [data-composition-id="ambiente"] .amb-c1 { top: 0; }
    [data-composition-id="ambiente"] .amb-c2 { top: 1898px; }
    /* líneas de escaneo de pantalla vieja (sutiles) */
    [data-composition-id="ambiente"] .amb-scan { position: absolute; left: 0; top: -40px; width: 1080px; height: 2000px; opacity: 0.06;
      background: repeating-linear-gradient(0deg, #f4f1ea 0 2px, transparent 2px 6px); }
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 760px 1120px at 540px 920px, rgba(9, 9, 10, 0) 55%, rgba(9, 9, 10, 0.85) 100%); }
    [data-composition-id="ambiente"] .amb-flash { position: absolute; inset: 0; opacity: 0; }
    [data-composition-id="ambiente"] .amb-blanco { background: #f4f1ea; }
    [data-composition-id="ambiente"] .amb-rojo { background: #ff2d2d; mix-blend-mode: screen; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="56.53">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="56.53" data-track-index="0">
      <div class="amb-scan"></div>
      <div class="amb-vineta"></div>
      <div class="amb-cinta amb-c1"></div>
      <div class="amb-cinta amb-c2"></div>
      <div class="amb-flash amb-blanco"></div>
      <div class="amb-flash amb-rojo"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 56.53;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // las cintas corren en sentidos opuestos (73.5 px = un ciclo de rayas en diagonal)
      tl.fromTo(q(".amb-c1"), { x: 0 }, { x: 147, duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".amb-c2"), { x: 147 }, { x: 0, duration: DUR, ease: "none" }, 0);
      // el escaneo baja despacio
      tl.fromTo(q(".amb-scan"), { y: 0 }, { y: 36, duration: 1.2, ease: "none", repeat: Math.floor(DUR / 1.2) - 1 }, 0);

      // flashes (segundos globales): blanco en las bombas, rojo en los "vagos"
      const BLANCO = [8.12, 21.06, 33.1];
      const ROJO = [2.2, 32.3, 49.4];
      BLANCO.forEach((t) => {
        tl.to(q(".amb-blanco"), { opacity: 0.7, duration: 0.03 }, t);
        tl.to(q(".amb-blanco"), { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.04);
      });
      ROJO.forEach((t) => {
        tl.to(q(".amb-rojo"), { opacity: 0.55, duration: 0.03 }, t);
        tl.to(q(".amb-rojo"), { opacity: 0, duration: 0.35, ease: "power2.out" }, t + 0.04);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
