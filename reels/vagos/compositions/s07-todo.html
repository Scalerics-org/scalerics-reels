    (function () {
      const ID = "s07-todo";
      const DUR = 5.62;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const TODO = 4.11;
      const VEZ = 4.6;

      const sacudon = (t, f) => [[-18, 10], [14, -8], [-9, 5], [5, -3], [0, 0]].forEach(([x, y], i) =>
        tl.to(q(".s07-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

      // cuadro 0: "ATIENDEN" gigante, que sube a etiqueta
      gsap.set(q(".s07-etiqueta"), { opacity: 0 });
      tl.fromTo(q(".s07-atienden"), { scale: 1.4, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, 0);
      [14, -10, 0].forEach((x, i) => tl.to(q(".s07-atienden"), { x, duration: 0.03, ease: "none" }, 0.22 + i * 0.05));
      tl.to(q(".s07-atienden"), { scale: 1.08, duration: 0.25, ease: "sine.out" }, 0.3);
      tl.to(q(".s07-atienden"), { opacity: 0, y: -360, scale: 0.3, duration: 0.15, ease: "power3.in" }, 0.45);
      tl.to(q(".s07-etiqueta"), { opacity: 1, duration: 0.1 }, 0.58);

      // cada palabra: entra gigante al centro desde su lado, se queda un instante y va a su celda
      const CX = 540, CY = 1040;
      const items = [
        { c: ".s07-c1", t: 0.6, desde: { x: -1100, y: 0 }, cx: 295, cy: 950 },
        { c: ".s07-c2", t: 1.4, desde: { x: 0, y: -900 }, cx: 785, cy: 940 },
        { c: ".s07-c3", t: 2.2, desde: { x: 0, y: 900 }, cx: 295, cy: 1380 },
        { c: ".s07-c4", t: 3.2, desde: { x: 1100, y: 0 }, cx: 785, cy: 1370 },
      ];
      items.forEach((it, i) => {
        const pal = q(it.c + " .s07-palabra");
        const ico = q(it.c + " .s07-icono");
        const dx = CX - it.cx, dy = CY - it.cy;
        gsap.set([pal, ico], { opacity: 0 });
        tl.fromTo(pal, { opacity: 1, x: dx + it.desde.x, y: dy + it.desde.y, scale: 2, rotation: i % 2 ? 6 : -6 },
          { x: dx, y: dy, rotation: 0, duration: 0.15, ease: "power4.out", immediateRender: false }, it.t - 0.12);
        sacudon(it.t + 0.02, 0.8);
        tl.to(pal, { x: 0, y: 0, scale: 1, duration: 0.22, ease: "power3.inOut" }, it.t + 0.3);
        tl.fromTo(ico, { opacity: 0, scale: 0.4, rotation: i % 2 ? 20 : -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, it.t + 0.42);
        // las que ya están se apagan un poco cuando entra la siguiente al centro
        items.slice(0, i).forEach((p) => tl.to(q(p.c), { opacity: 0.2, duration: 0.1 }, it.t - 0.12));
        items.slice(0, i).forEach((p) => tl.to(q(p.c), { opacity: 1, duration: 0.15 }, it.t + 0.5));
      });
      // detalles vivos: la flecha de proveedores empuja, el celular vibra
      tl.to(q(".s07-flecha"), { x: 10, duration: 0.15, yoyo: true, repeat: 5, ease: "sine.inOut" }, 2.8);
      gsap.set(q(".s07-ondas"), { opacity: 0 });
      tl.to(q(".s07-ondas"), { opacity: 1, duration: 0.1 }, 3.62);
      tl.to(q(".s07-tel"), { x: 5, duration: 0.03, yoyo: true, repeat: 15, ease: "none" }, 3.62);
      tl.to(q(".s07-ondas"), { opacity: 0.3, duration: 0.12, yoyo: true, repeat: 3, ease: "none" }, 3.7);
      // mientras tanto la grilla respira
      tl.to(q(".s07-c1"), { rotation: -2, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.0);
      tl.to(q(".s07-c2"), { rotation: 2, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.8);

      // "TODO A LA VEZ": la grilla hace malabares, cada vez más rápido
      const celdas = [".s07-c1", ".s07-c2", ".s07-c3", ".s07-c4"].map(q);
      celdas.forEach((c, i) => gsap.set(c, { transformOrigin: "50% 50%" }));
      let t = TODO - 0.1;
      let d = 0.22;
      let k = 0;
      while (t < DUR - 0.25) {
        celdas.forEach((c, i) => tl.to(c, { rotation: ((i + k) % 2 ? 1 : -1) * (6 + k * 1.5), y: ((i + k) % 2 ? -1 : 1) * (10 + k * 3), duration: d, ease: "sine.inOut" }, t));
        t += d;
        d = Math.max(0.07, d * 0.78);
        k++;
      }
      tl.to(celdas, { opacity: 0.55, duration: 0.15 }, TODO);

      gsap.set([q(".s07-banda"), q(".s07-todo1"), q(".s07-todo2")], { opacity: 0 });
      gsap.set(q(".s07-banda"), { rotation: -4 });
      tl.fromTo(q(".s07-banda"), { opacity: 0, scaleY: 0 }, { opacity: 0.85, scaleY: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, TODO - 0.08);
      tl.fromTo(q(".s07-todo1"), { opacity: 0, scale: 3.2, rotation: -10 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.15, ease: "power4.in", immediateRender: false }, TODO - 0.12);
      sacudon(TODO + 0.03, 1.2);
      tl.fromTo(q(".s07-todo2"), { opacity: 0, scale: 2.6, rotation: 6 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.14, ease: "power4.in", immediateRender: false }, VEZ - 0.12);
      sacudon(VEZ + 0.03, 1);
      [16, -12, 8, 0].forEach((x, i) => tl.to(q(".s07-todo1"), { x, duration: 0.03, ease: "none" }, 4.95 + i * 0.05));
      tl.to([q(".s07-todo1"), q(".s07-todo2")], { scale: 1.07, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, 5.1);

      // salida
      tl.to(q("#s07-escena"), { scale: 1.25, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 55%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
