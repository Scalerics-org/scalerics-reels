    (function () {
      const ID = "s11-espera";
      const DUR = 3.02;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });

      const SEGUIS = 0.2;
      const TUYO = 0.6;
      const Y = 1.42;
      const CLIENTE = 1.5;
      const ESPERA = 2.0;

      const entra = (el, from, to, t) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0 }, from), Object.assign({ opacity: 1, immediateRender: false }, to), t);
      };
      const sacudon = (t, f) => [[-18 * f, 10 * f], [15 * f, -8 * f], [-10 * f, 5 * f], [6 * f, -3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s11-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      // cuadro 0: "VOS" cae de golpe, el dueño y el celular ya están entrando
      tl.fromTo(q(".s11-vos"), { scale: 2.6, opacity: 0.4, rotation: -6 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.14, ease: "power4.in" }, 0);
      tl.fromTo(q(".s11-dueno"), { y: 60, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(q(".s11-cel"), { y: 120, opacity: 0.5, rotation: 4 }, { y: 0, opacity: 1, rotation: 2, duration: 0.35, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s11-divisor"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power3.out" }, 0);
      sacudon(0.14, 0.7);

      // "seguís": golpe
      entra(q(".s11-seguis"), { scale: 2.8, rotation: 6 }, { scale: 1, rotation: 2, duration: 0.14, ease: "power4.in" }, SEGUIS - 0.06);
      // "con lo tuyo"
      entra(q(".s11-tuyo"), { y: 16 }, { y: 0, duration: 0.25, ease: "power3.out" }, TUYO);
      // el dueño atiende tranquilo: se balancea y marca en la caja
      tl.to(q(".s11-persona"), { rotation: -3, transformOrigin: "50% 100%", duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.3);
      tl.to(q(".s11-caja-reg"), { y: -10, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 7 }, 0.5);
      tl.to(q(".s11-vos"), { rotation: 2, duration: 0.6, ease: "sine.inOut" }, 0.4);
      tl.to(q(".s11-seguis"), { rotation: -2, duration: 0.6, ease: "sine.inOut" }, 0.6);

      // celular: cliente pregunta, el bot escribe y contesta al toque
      entra(q(".s11-cliente"), { scale: 0.7, transformOrigin: "0% 0%" }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, 0.25);
      entra(q(".s11-escribiendo"), { scale: 0.6, transformOrigin: "100% 0%" }, { scale: 1, duration: 0.15, ease: "back.out(2)" }, 0.5);
      qa(".s11-punto").forEach((p, i) => tl.to(p, { y: -10, duration: 0.1, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.58 + i * 0.07));
      tl.to(q(".s11-escribiendo"), { opacity: 0, duration: 0.06 }, 0.86);
      entra(q(".s11-bot"), { scale: 0.6, transformOrigin: "100% 0%" }, { scale: 1, duration: 0.25, ease: "back.out(2.2)" }, 0.88);
      entra(q(".s11-tildes"), { scale: 1.8, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.18, ease: "power4.in" }, 1.08);
      tl.to(q(".s11-tildes"), { scale: 1.2, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut", transformOrigin: "50% 50%" }, 1.3);

      // cronómetro 00:00 -> 00:03 (se frena cuando contesta)
      const cs = [".s11-c0", ".s11-c1", ".s11-c2", ".s11-c3"].map(q);
      gsap.set(cs.slice(1), { opacity: 0 });
      [0.3, 0.55, 0.88].forEach((t, i) => {
        tl.set(cs[i], { opacity: 0 }, t);
        tl.set(cs[i + 1], { opacity: 1 }, t);
        tl.fromTo(cs[i + 1], { scale: 1.35 }, { scale: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, t);
      });
      tl.to(q(".s11-crono"), { x: 12, duration: 0.04, yoyo: true, repeat: 5, ease: "none" }, 0.9);

      // "Y el cliente": la mitad del dueño se apaga, entra la banda

      gsap.set(q(".s11-banda"), { scaleY: 0 });
      tl.to(q(".s11-banda"), { scaleY: 1, transformOrigin: "50% 50%", duration: 0.14, ease: "power3.out" }, Y);
      entra(q(".s11-elcliente"), { x: -120, skewX: -12 }, { x: 0, skewX: 0, duration: 0.16, ease: "power4.out" }, CLIENTE);

      // "NO ESPERA": golpe amarillo gigante, sacudón y glitch

      sacudon(ESPERA + 0.06, 1.2);
      tl.to(q(".s11-elcliente"), { opacity: 0.5, duration: 0.12 }, ESPERA + 0.06);
      [[16, 0.04], [-12, 0.04], [0, 0.04]].forEach(([x, d], i) => tl.to(q(".s11-noespera"), { x, duration: d, ease: "none" }, ESPERA + 0.3 + i * 0.05));
      tl.to(q(".s11-noespera"), { scale: 1.06, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, ESPERA + 0.45);
      tl.to(q(".s11-cel"), { rotation: -2, duration: 0.3, ease: "sine.inOut" }, ESPERA + 0.1);
      entra(q(".s11-etiqueta"), { y: 12 }, { y: 0, duration: 0.25, ease: "power3.out" }, ESPERA + 0.2);

      // salida
