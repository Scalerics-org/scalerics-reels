<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-frases"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-frases"] .s03-escenario { position: absolute; inset: 0; }
    [data-composition-id="s03-frases"] .s03-local { position: absolute; inset: 0; }
    /* local: marco, cartel y persiana */
    [data-composition-id="s03-frases"] .s03-marco { position: absolute; left: 120px; top: 640px; width: 840px; height: 690px; background: #09090a; border: 8px solid #f4f1ea; border-bottom: none; border-radius: 6px 6px 0 0; }
    [data-composition-id="s03-frases"] .s03-cartel { position: absolute; left: 250px; top: 552px; width: 580px; height: 100px; background: #ffd60a; border: 6px solid #09090a; border-radius: 8px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 800; font-size: 70px; line-height: 88px; letter-spacing: 0.06em; color: #09090a; }
    [data-composition-id="s03-frases"] .s03-persiana { position: absolute; left: 140px; top: 660px; width: 800px; height: 660px; overflow: hidden; }
    [data-composition-id="s03-frases"] .s03-chapa { position: absolute; left: 0; top: 0; width: 800px; height: 660px; background: repeating-linear-gradient(180deg, #8a8f98 0 30px, #09090a 30px 34px); }
    [data-composition-id="s03-frases"] .s03-manija { position: absolute; left: 360px; top: 600px; width: 80px; height: 22px; border-radius: 6px; background: #09090a; }
    [data-composition-id="s03-frases"] .s03-piso { position: absolute; left: 100px; top: 1320px; width: 880px; height: 14px; background: #f4f1ea; }
    /* sellos */
    [data-composition-id="s03-frases"] .s03-sello { position: absolute; padding: 14px 30px 16px; border: 10px solid #ff2d2d; border-radius: 14px; background: #f4f1ea; font-family: "Lexend", sans-serif; font-weight: 800; font-size: 62px; line-height: 1.04; letter-spacing: -0.01em; text-align: center; text-transform: uppercase; color: #ff2d2d; white-space: nowrap; }
    [data-composition-id="s03-frases"] .s03-contador { position: absolute; left: 0; right: 0; top: 1440px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 40px; letter-spacing: 0.16em; color: #ffd60a; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="s03-frases"] .s03-num { display: inline-block; position: relative; width: 70px; height: 50px; vertical-align: top; }
    [data-composition-id="s03-frases"] .s03-n { position: absolute; left: 0; top: 0; width: 70px; text-align: center; font-size: 56px; line-height: 50px; color: #ff2d2d; text-shadow: 0 0 40px rgba(255, 45, 45, 0.45); }
  </style>
  <div id="root" data-composition-id="s03-frases" data-width="1080" data-height="1920" data-duration="5.15">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="5.15" data-track-index="0">
      <div class="s03-escenario">
        <div class="s03-local">
          <div class="s03-marco"></div>
          <div class="s03-persiana"><div class="s03-chapa"></div><div class="s03-manija"></div></div>
          <div class="s03-piso"></div>
          <div class="s03-cartel">ALMACÉN</div>
          <div class="s03-sello s03-s1">Cerrado<br>por almuerzo</div>
          <div class="s03-sello s03-s2">Te contesto<br>mañana</div>
          <div class="s03-sello s03-s3">Solo<br>efectivo</div>
          <div class="s03-sello s03-s4">No hay<br>cambio</div>
        </div>
        <div class="s03-contador">Clientes perdidos: <span class="s03-num"><span class="s03-n">0</span><span class="s03-n">1</span><span class="s03-n">2</span><span class="s03-n">3</span><span class="s03-n">4</span></span></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-frases";
      const DUR = 5.15;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // [selector, centro x, centro y, rotación, tiempo del golpe]
      const SELLOS = [
        [".s03-s1", 520, 780, -10, 0.0],
        [".s03-s2", 580, 965, 8, 1.08],
        [".s03-s3", 370, 1135, -6, 2.91],
        [".s03-s4", 730, 1240, 11, 3.48],
      ];
      const nums = qa(".s03-n");
      gsap.set(nums.slice(1), { opacity: 0 });

      // cuadro 0: el local ya está, la persiana baja terminando de caer
      tl.fromTo(q(".s03-chapa"), { y: -120 }, { y: 0, duration: 0.14, ease: "power4.in" }, 0);
      tl.fromTo(q(".s03-cartel"), { rotation: -4 }, { rotation: 0, duration: 0.5, ease: "elastic.out(1.4, 0.4)" }, 0.05);
      tl.fromTo(q(".s03-contador"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0.1);
      // cámara que empuja despacio todo el tiempo
      tl.fromTo(q(".s03-local"), { scale: 1 }, { scale: 1.05, transformOrigin: "50% 60%", duration: DUR - 0.2, ease: "none" }, 0);

      SELLOS.forEach(([sel, cx, cy, rot, t], i) => {
        const el = q(sel);
        gsap.set(el, { left: cx, top: cy, xPercent: -50, yPercent: -50 });
        const desde = { opacity: i === 0 ? 0.5 : 0, scale: 2.4, rotation: rot * 2.2 };
        if (i > 0) gsap.set(el, { opacity: 0 });
        tl.fromTo(el, desde, { opacity: 1, scale: 1, rotation: rot, duration: 0.14, ease: "power4.in", immediateRender: i === 0 }, Math.max(0, t - 0.1));
        // sacudón de persiana y pantalla al pegar
        const golpe = Math.max(t + 0.04, 0.14);
        [[-20, 12], [16, -10], [-10, 6], [6, -3], [0, 0]].forEach(([x, y], k) => tl.to(q(".s03-escenario"), { x, y, duration: 0.04, ease: "none" }, golpe + k * 0.045));
        tl.fromTo(q(".s03-chapa"), { y: 0 }, { y: 8, duration: 0.05, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, golpe);
        // el sello rebota un poco y queda vivo
        tl.to(el, { scale: 1.04, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut" }, golpe + 0.2);
        // glitch del sello recién pegado
        [[14], [-10], [0]].forEach(([x], k) => tl.to(el, { x, duration: 0.03, ease: "none" }, golpe + 0.5 + k * 0.05));
        // los anteriores se apagan un poco (siguen legibles)
        if (i > 0) tl.to(qa(".s03-sello").slice(0, i), { opacity: 0.55, duration: 0.12 }, golpe);
        // contador: sube el número
        tl.to(nums[i], { opacity: 0, duration: 0.05 }, golpe);
        tl.fromTo(nums[i + 1], { opacity: 0, scale: 2.2, y: -10 }, { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: "power4.in", immediateRender: false }, golpe);
      });

      // en el tramo largo entre "mañana" y "solo efectivo": la persiana tiembla y el contador parpadea
      tl.to(q(".s03-s2"), { rotation: 5, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.8);
      tl.to(q(".s03-contador"), { opacity: 0.4, duration: 0.06, yoyo: true, repeat: 3, ease: "none" }, 2.3);
      // "cambio": golpe extra al final de la frase
      tl.to(q(".s03-s4"), { scale: 1.1, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, 4.38);
      [[10, -6], [-8, 4], [0, 0]].forEach(([x, y], k) => tl.to(q(".s03-escenario"), { x, y, duration: 0.04, ease: "none" }, 4.4 + k * 0.045));
      tl.to(qa(".s03-sello"), { opacity: 1, duration: 0.15 }, 4.6);

      // salida
      tl.to(q("#s03-escena"), { scale: 1.3, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 55%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
