      [[-22, 12], [18, -10], [-12, 6], [8, -4], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, VAGOS + 0.04 + i * 0.045));

      tl.to(q(".s01-raya"), { scaleX: 1, duration: 0.3, ease: "power3.out" }, VAGOS + 0.2);
