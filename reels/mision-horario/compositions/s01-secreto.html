  <script>
    (function () {
      const ID = "s01-secreto";
      const DUR = 4.48;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s01-escenario");

      const golpe = (el, t, s = 2.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const pop = (el, t) => {
        gsap.set(el, { opacity: 0, transformOrigin: "50% 50%" });
        tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
      };

      const HORA = 0.73, CLIENTE = 1.64, AGENTE = 2.82, SECRETO = 3.18;
      const MIRA = q(".s01-mira");

      // cuadro 0: la mira ya está, buscando de lado a lado sobre el reloj

      tl.fromTo(MIRA, { x: -140, y: 30 }, { x: 60, y: -20, duration: 0.7, ease: "power2.inOut" }, 0);
      tl.to(MIRA, { x: 0, y: 0, duration: 0.3, ease: "back.out(2)" }, 0.7);
      tl.fromTo(q(".s01-reloj"), { opacity: 0.6 }, { opacity: 1, duration: 0.2 }, 0);
      tl.fromTo(q(".s01-abierto"), { opacity: 0 }, { opacity: 1, duration: 0.1, repeat: 4, yoyo: true, ease: "steps(1)" }, 0.15);

      // "hora": las agujas giran locas
      tl.to(q(".s01-hora"), { rotation: 720, svgOrigin: "540 930", duration: 1.8, ease: "power2.inOut" }, HORA - 0.1);
      tl.to(q(".s01-min"), { rotation: 2160, svgOrigin: "540 930", duration: 1.8, ease: "power2.inOut" }, HORA - 0.1);
      tl.to(MIRA, { scale: 0.86, svgOrigin: "540 930", duration: 0.15, yoyo: true, repeat: 1 }, HORA);

      // "cliente": el celular y la pregunta
      pop(q(".s01-cel"), CLIENTE - 0.15);
      gsap.set(q(".s01-globo"), { transformOrigin: "0% 100%" });
      pop(q(".s01-globo"), CLIENTE);
      tl.to(MIRA, { x: -100, y: 330, duration: 0.35, ease: "power3.inOut" }, CLIENTE + 0.1);

      // "agente": corte, la Agente Cero sube y la mira se le clava en el pecho

      gsap.set(q(".s01-cero"), { opacity: 0 });
      tl.fromTo(q(".s01-cero"), { opacity: 0, y: 420 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, AGENTE - 0.15);
      tl.to(MIRA, { x: 0, y: 290, scale: 0.7, svgOrigin: "540 930", duration: 0.3, ease: "power3.out" }, AGENTE - 0.1);
      tl.fromTo(q(".s01-brillo"), { opacity: 0 }, { opacity: 1, duration: 0.08, yoyo: true, repeat: 3 }, AGENTE + 0.3);

      // "secreto": el título cae y el sello
      golpe(q(".s01-agente"), AGENTE + 0.02, 2.4);
      golpe(q(".s01-secreto"), SECRETO, 2.8);
      sacudon(SECRETO + 0.05, 1.3);
      gsap.set(q(".s01-sello"), { rotation: -7 });
      golpe(q(".s01-sello"), SECRETO + 0.55, 2.2);
      sacudon(SECRETO + 0.6, 0.8);
      tl.to(MIRA, { rotation: 45, svgOrigin: "540 930", duration: 0.6, ease: "power2.out" }, SECRETO + 0.1);

      // salida: corrimiento con blur
      tl.to(q("#s01-escena"), { x: -260, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
