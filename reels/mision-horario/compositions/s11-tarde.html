      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s11-escenario");
      const golpe = (el, t, s = 2.6) => {
        gsap.set(el, { opacity: 0 });

      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));

        gsap.set(el, { opacity: 0, transformOrigin: o });
        tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
      };
      const aparece = (el, t, d = 0.2) => { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: d }, t); };

      // máquina de escribir: el texto se descubre de a saltos
      const tipear = (el, t, d = 0.5) => {
        const n = Math.max(4, el.textContent.length);
        gsap.set(el, { clipPath: "inset(0 100% 0 0)" });

      const sello = (el, t, rot = -8) => { gsap.set(el, { rotation: rot }); golpe(el, t, 2.4); sacudon(t + 0.04, 0.9); };

        tl.fromTo(q(".s11-fase-c"), { opacity: 0.4, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.out" }, 0);
        golpe(q(".s11-fase-n"), t, 3.2);
        sacudon(t + 0.04, 1.4);
        tl.to(q(".s11-fase-n"), { rotation: -4, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + 0.2);

      };

      const TARDE = 0.0, CERO2 = 0.78, ENFRENTE = 1.45, PAGINA = 2.0, HORARIO = 2.91, MAPA = 3.52, WA = 4.18, CLIENTA = 5.36, COMPRO = 5.64, HACE = 6.27;

      sello(q(".s11-fallida"), TARDE + 0.12, -12);
      sacudon(0.2, 1.6);
      gsap.set(q(".s11-tacha"), { scaleX: 0, transformOrigin: "0% 50%" });
      tl.to(q(".s11-tacha"), { scaleX: 1, duration: 0.2, ease: "power2.out" }, CERO2);
      tl.to(q(".s11-parte1"), { x: -1100, duration: 0.3, ease: "power3.in" }, ENFRENTE - 0.3);
      // "el de enfrente": paneo a la vereda de enfrente

      tl.fromTo(q(".s11-parte2"), { x: 1100 }, { x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, ENFRENTE - 0.05);
      tl.fromTo(qa(".s11-luz"), { opacity: 0.4 }, { opacity: 1, duration: 0.1, repeat: 3, yoyo: true, ease: "steps(1)" }, ENFRENTE + 0.3);

      tl.fromTo(q(".s11-cel"), { opacity: 0, y: 300 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, PAGINA - 0.2);
