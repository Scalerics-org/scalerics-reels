  <script>
    (function () {
      const ID = "s10-cortina";
      const DUR = 4.42;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s10-escenario");
      const golpe = (el, t, s = 2.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const pop = (el, t, o = "50% 50%") => {
        gsap.set(el, { opacity: 0, transformOrigin: o });
        tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
      };
      const aparece = (el, t, d = 0.2) => { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: d }, t); };
      const dibujar = (el, t, d = 0.5) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      // máquina de escribir: el texto se descubre de a saltos
      const tipear = (el, t, d = 0.5) => {
        const n = Math.max(4, el.textContent.length);
        gsap.set(el, { clipPath: "inset(0 100% 0 0)" });
        tl.to(el, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "steps(" + n + ")" }, t);
      };
      const sello = (el, t, rot = -8) => { gsap.set(el, { rotation: rot }); golpe(el, t, 2.4); sacudon(t + 0.04, 0.9); };
      // cartel de FASE: entra de golpe, tiembla y se va hacia arriba en "fuera"
      const fase = (t, fuera) => {
        tl.fromTo(q(".s10-fase-c"), { opacity: 0.4, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.out" }, 0);
        golpe(q(".s10-fase-n"), t, 3.2);
        sacudon(t + 0.04, 1.4);
        tl.to(q(".s10-fase-n"), { rotation: -4, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + 0.2);
        [[0, 18, 0.4], [0.05, -14, 1], [0.1, 8, 0.5], [0.15, 0, 1]].forEach(([d, x, o]) => tl.set(q(".s10-fase-n"), { x, opacity: o }, fuera - 0.3 + d));
        tl.to(q(".s10-fase-c"), { opacity: 0, y: -180, duration: 0.16, ease: "power3.in" }, fuera - 0.12);
      };

      const BAJA = 0.35, CARTEL = 1.22, VUELVO = 1.92, DESDE = 3.36;
      // la cortina BAJA de golpe
      gsap.set(q(".s10-cortina"), { scaleY: 0.06, transformOrigin: "50% 0%" });
      tl.to(q(".s10-cortina"), { scaleY: 1, duration: 0.3, ease: "bounce.out" }, 0.02);
      sacudon(0.3, 1.5);
      sacudon(BAJA + 0.05, 0.8);
      pop(q(".s10-reloj"), 0.6);
      tl.to(q(".s10-ag"), { rotation: 1440, svgOrigin: "0 0", duration: 3.6, ease: "power1.in" }, 0.7);
      tl.to(q(".s10-ag2"), { rotation: 360, svgOrigin: "0 0", duration: 3.6, ease: "power1.in" }, 0.7);
      // el cartel escrito a mano
      gsap.set(q(".s10-cartel"), { opacity: 0 });
      tl.fromTo(q(".s10-cartel"), { opacity: 0, scale: 1.6, rotation: -10 }, { opacity: 1, scale: 1, rotation: 3, duration: 0.22, ease: "power3.out", immediateRender: false }, CARTEL - 0.15);
      // "vuelvo en cinco minutos": la mira y zoom
      gsap.set(q(".s10-mira"), { opacity: 0 });
      tl.fromTo(q(".s10-mira"), { opacity: 0, scale: 2, svgOrigin: "545 1075" }, { opacity: 1, scale: 1, svgOrigin: "545 1075", duration: 0.3, ease: "power3.out", immediateRender: false }, VUELVO - 0.2);
      tl.to(q(".s10-zoom"), { scale: 1.12, transformOrigin: "545px 1075px", duration: 1.2, ease: "power2.out" }, VUELVO - 0.1);
      // "¿desde cuándo?"
      golpe(q(".s10-cuando"), DESDE, 2.4);
      sacudon(DESDE + 0.05, 1.3);
      tl.to(q(".s10-cartel"), { rotation: -4, duration: 0.1, yoyo: true, repeat: 3 }, DESDE + 0.1);

      // salida
      tl.to(q("#s10-escena"), { x: -260, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
