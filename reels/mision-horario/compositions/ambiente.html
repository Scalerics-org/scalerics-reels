<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    /* grano de película: rayitas finas que tiemblan */
    [data-composition-id="ambiente"] .amb-grano { position: absolute; left: -40px; top: -40px; width: 1160px; height: 2000px; opacity: 0.5;
      background-image: repeating-linear-gradient(0deg, rgba(241, 236, 225, 0.025) 0px, rgba(241, 236, 225, 0.025) 1px, rgba(0, 0, 0, 0) 1px, rgba(0, 0, 0, 0) 4px),
        repeating-linear-gradient(90deg, rgba(107, 115, 128, 0.03) 0px, rgba(107, 115, 128, 0.03) 1px, rgba(0, 0, 0, 0) 1px, rgba(0, 0, 0, 0) 7px); }
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 760px 1120px at 540px 920px, rgba(11, 11, 13, 0) 55%, rgba(11, 11, 13, 0.9) 100%); }
    /* rótulo del expediente abajo a la izquierda */
    [data-composition-id="ambiente"] .amb-rotulo { position: absolute; left: 60px; top: 1600px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.16em; color: #d9b77e; opacity: 0.65; line-height: 1.5; }
    [data-composition-id="ambiente"] .amb-rotulo b { color: #ff1f3d; font-weight: 500; }
    /* barrido de láser de lado a lado */
    [data-composition-id="ambiente"] .amb-laser { position: absolute; left: -100px; top: 0; width: 1280px; height: 6px; background: #ff1f3d; opacity: 0; box-shadow: 0 0 18px 4px rgba(255, 31, 61, 0.7); transform: rotate(-8deg); }
    /* alarma roja en las esquinas */
    [data-composition-id="ambiente"] .amb-alarma { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 620px 620px at 0% 0%, rgba(255, 31, 61, 0.38), rgba(255, 31, 61, 0) 70%), radial-gradient(ellipse 620px 620px at 100% 100%, rgba(255, 31, 61, 0.38), rgba(255, 31, 61, 0) 70%); }
    /* la luz de Scalerics (desde 57.95) */
    [data-composition-id="ambiente"] .amb-luz { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 640px 700px at 540px 930px, rgba(92, 230, 17, 0.13) 0%, rgba(92, 230, 17, 0.04) 50%, rgba(92, 230, 17, 0) 80%); }
    [data-composition-id="ambiente"] .amb-flash { position: absolute; inset: 0; background: #f1ece1; opacity: 0; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="73.46">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="73.46" data-track-index="0">
      <div class="amb-luz"></div>
      <div class="amb-grano"></div>
      <div class="amb-vineta"></div>
      <div class="amb-alarma"></div>
      <div class="amb-laser"></div>
      <div class="amb-rotulo" data-layout-ignore>EXP. 00-CERO<br /><b>ULTRA SECRETO</b></div>
      <div class="amb-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 73.46;
      const LUZ = 57.95;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // el grano tiembla a saltos (determinista: 4 posiciones que se repiten)
      const pos = [[0, 0], [-9, 6], [5, -11], [-3, 8]];
      for (let t = 0, k = 0; t < DUR; t += 0.12, k++) tl.set(q(".amb-grano"), { x: pos[k % 4][0], y: pos[k % 4][1] }, t);

      // barrido de láser (segundos globales): arranque, "Misión Imposible" (entrada de s08), "láseres"
      [[0.05, 0.7], [31.3, 0.6], [38.85, 0.55]].forEach(([t, d]) => {
        tl.set(q(".amb-laser"), { opacity: 0.9, y: 380 }, t);
        tl.to(q(".amb-laser"), { y: 1560, duration: d, ease: "power1.inOut" }, t);
        tl.set(q(".amb-laser"), { opacity: 0 }, t + d);
      });

      // alarma roja: "cerrado permanentemente", "siete números", "¿desde cuándo?", "tarde"
      [[16.17, 0.8], [30.14, 0.6], [43.55, 0.6], [44.61, 0.8]].forEach(([t, d]) => {
        tl.to(q(".amb-alarma"), { opacity: 1, duration: 0.1, yoyo: true, repeat: Math.max(1, Math.round(d / 0.2)) * 2 - 1, ease: "steps(1)" }, t);
      });

      // entra Scalerics: flash hueso, se va el rótulo secreto y se prende la luz verde
      tl.to(q(".amb-flash"), { opacity: 0.7, duration: 0.04 }, LUZ - 0.04);
      tl.to(q(".amb-flash"), { opacity: 0, duration: 0.5, ease: "power2.out" }, LUZ + 0.02);
      tl.to(q(".amb-rotulo"), { opacity: 0, duration: 0.2 }, LUZ);
      tl.to(q(".amb-luz"), { opacity: 1, duration: 0.6, ease: "power2.out" }, LUZ);
      tl.to(q(".amb-grano"), { opacity: 0.25, duration: 0.4 }, LUZ);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
