  <style>

  </style>
  <div id="root" data-composition-id="s14-cta" data-width="1080" data-height="1920" data-duration="6.0">
    <div id="s14-escena" class="s14-capa clip" data-start="0" data-duration="6.0" data-track-index="0">
      <div class="s14-escenario">
        <div class="txt s14-manda">Mandáselo</div>
        <div class="rot s14-dice">al que dice:</div>
        <div class="s14-tarjeta">
          <div class="maq s14-frase s14-f1" style="top:70px">«A mí me</div>
          <div class="maq s14-frase s14-f2" style="top:160px">encuentran igual»</div>
        </div>
        <div class="sello s14-perdido"><span>Caso perdido</span></div>
        <div class="rot s14-auto">Autodestrucción en</div>
        <div class="s14-n s14-n3">3</div><div class="s14-n s14-n2">2</div><div class="s14-n s14-n1">1</div>

      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s14-cta";
      const DUR = 6.0;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s14-escenario");
      const golpe = (el, t, s = 2.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const pop = (el, t, o = "50% 50%") => {
        gsap.set(el, { opacity: 0, transformOrigin: o });
        tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
      };
      const aparece = (el, t, d = 0.2) => { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: d }, t); };
      const dibujar = (el, t, d = 0.5) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      // máquina de escribir: el texto se descubre de a saltos
      const tipear = (el, t, d = 0.5) => {
        const n = Math.max(4, el.textContent.length);
        gsap.set(el, { clipPath: "inset(0 100% 0 0)" });
        tl.to(el, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "steps(" + n + ")" }, t);
      };
      const sello = (el, t, rot = -8) => { gsap.set(el, { rotation: rot }); golpe(el, t, 2.4); sacudon(t + 0.04, 0.9); };
      // cartel de FASE: entra de golpe, tiembla y se va hacia arriba en "fuera"
      const fase = (t, fuera) => {
        tl.fromTo(q(".s14-fase-c"), { opacity: 0.4, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.out" }, 0);
        golpe(q(".s14-fase-n"), t, 3.2);
        sacudon(t + 0.04, 1.4);
        tl.to(q(".s14-fase-n"), { rotation: -4, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + 0.2);
        [[0, 18, 0.4], [0.05, -14, 1], [0.1, 8, 0.5], [0.15, 0, 1]].forEach(([d, x, o]) => tl.set(q(".s14-fase-n"), { x, opacity: o }, fuera - 0.3 + d));
        tl.to(q(".s14-fase-c"), { opacity: 0, y: -180, duration: 0.16, ease: "power3.in" }, fuera - 0.12);
      };

      const DICE = 0.74, AMI = 1.58, IGUAL = 2.47;
      golpe(q(".s14-manda"), 0.1, 2.6);
      sacudon(0.12, 1.3);
      tipear(q(".s14-dice"), DICE - 0.15, 0.35);
      gsap.set(q(".s14-tarjeta"), { opacity: 0 });
      tl.fromTo(q(".s14-tarjeta"), { opacity: 0, y: 300, rotation: 10 }, { opacity: 1, y: 0, rotation: -2, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, AMI - 0.4);
      tipear(q(".s14-f1"), AMI - 0.05, 0.35);
      tipear(q(".s14-f2"), AMI + 0.35, 0.6);
      sello(q(".s14-perdido"), IGUAL + 0.45, -8);
      // autodestrucción: 3, 2, 1, la tarjeta tiembla y echa humo
      const T0 = 3.0;
      aparece(q(".s14-auto"), T0 - 0.2, 0.1);
      [".s14-n3", ".s14-n2", ".s14-n1"].forEach((c, i) => {
        gsap.set(q(c), { opacity: 0 });
        tl.fromTo(q(c), { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power4.in", immediateRender: false }, T0 + i * 0.6);
        if (i < 2) tl.set(q(c), { opacity: 0 }, T0 + (i + 1) * 0.6);
      });
      for (let k = 0; k < 24; k++) tl.set(q(".s14-tarjeta"), { x: k % 2 ? 5 + k * 0.3 : -5 - k * 0.3, rotation: k % 2 ? -1.4 : -2.6 }, T0 + 0.3 + k * 0.07);
      tl.to(q(".s14-tarjeta"), { boxShadow: "0 0 40px 6px rgba(255, 31, 61, 0.55)", duration: 0.3, yoyo: true, repeat: 3 }, T0 + 0.3);

      // salida
      

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
