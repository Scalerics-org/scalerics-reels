  <script>
    (function () {
      const ID = "s06-instagram";
      const DUR = 5.2;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s06-escenario");
      const golpe = (el, t, s = 2.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const pop = (el, t, o = "50% 50%") => {
        gsap.set(el, { opacity: 0, transformOrigin: o });
        tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
      };
      const aparece = (el, t, d = 0.2) => { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: d }, t); };
      const dibujar = (el, t, d = 0.5) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      // máquina de escribir: el texto se descubre de a saltos
      const tipear = (el, t, d = 0.5) => {
        const n = Math.max(4, el.textContent.length);
        gsap.set(el, { clipPath: "inset(0 100% 0 0)" });
        tl.to(el, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "steps(" + n + ")" }, t);
      };
      const sello = (el, t, rot = -8) => { gsap.set(el, { rotation: rot }); golpe(el, t, 2.4); sacudon(t + 0.04, 0.9); };
      // cartel de FASE: entra de golpe, tiembla y se va hacia arriba en "fuera"
      const fase = (t, fuera) => {
        tl.fromTo(q(".s06-fase-c"), { opacity: 0.4, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.out" }, 0);
        golpe(q(".s06-fase-n"), t, 3.2);
        sacudon(t + 0.04, 1.4);
        tl.to(q(".s06-fase-n"), { rotation: -4, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + 0.2);
        [[0, 18, 0.4], [0.05, -14, 1], [0.1, 8, 0.5], [0.15, 0, 1]].forEach(([d, x, o]) => tl.set(q(".s06-fase-n"), { x, opacity: o }, fuera - 0.3 + d));
        tl.to(q(".s06-fase-c"), { opacity: 0, y: -180, duration: 0.16, ease: "power3.in" }, fuera - 0.12);
      };

      const TRES = 0.26, INSTA = 0.90, ULTIMO = 1.74, TURISMO = 3.31, HACE = 4.01;
      fase(TRES, INSTA);
      gsap.set(q(".s06-pista"), { opacity: 0 });
      tl.set(q(".s06-pista"), { opacity: 1 }, INSTA - 0.05);
      tl.fromTo(q(".s06-pista"), { y: 300 }, { y: 0, duration: 0.3, ease: "power3.out" }, INSTA - 0.05);
      qa(".s06-cu").forEach((c, i) => { gsap.set(c, { opacity: 0 }); tl.to(c, { opacity: 1, duration: 0.1 }, INSTA + 0.15 + i * 0.05); });
      // "último posteo": la mira se clava en el primer cuadrito
      gsap.set(q(".s06-mira"), { opacity: 0 });
      tl.fromTo(q(".s06-mira"), { opacity: 0, x: 300, y: 200, scale: 1.6, svgOrigin: "407 932" }, { opacity: 1, x: 0, y: 0, scale: 1, svgOrigin: "407 932", duration: 0.4, ease: "power3.out", immediateRender: false }, ULTIMO - 0.1);
      tl.to(q(".s06-mira"), { scale: 0.85, svgOrigin: "407 932", duration: 0.12, yoyo: true, repeat: 3 }, ULTIMO + 0.4);
      // zoom al posteo
      gsap.set(q(".s06-post"), { opacity: 0 });
      tl.fromTo(q(".s06-post"), { opacity: 0, scale: 0.18, x: -240, y: -10, rotation: 0 }, { opacity: 1, scale: 1, x: 0, y: 0, rotation: -2, duration: 0.35, ease: "power3.out", immediateRender: false }, 2.75);
      tl.to(q(".s06-nombre"), { opacity: 0, duration: 0.1 }, 2.75);
      tl.to(q(".s06-sol"), { rotation: 45, svgOrigin: "560 300", duration: 2.4, ease: "none" }, 2.8);
      tl.to(q(".s06-feliz"), { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1 }, TURISMO);
      // "hace dos años": sello y telarañas
      sello(q(".s06-hace"), HACE + 0.15, -7);
      tl.to(q(".s06-post"), { filter: "grayscale(0.9) brightness(0.8)", duration: 0.4 }, HACE + 0.2);
      qa(".s06-tela").forEach((t, i) => dibujar(t, HACE + 0.3 + i * 0.12, 0.5));

      // salida
      tl.to(q("#s06-escena"), { x: -260, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
