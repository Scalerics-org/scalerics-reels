  <script>
    (function () {
      const ID = "s02-mision";
      const DUR = 7.92;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s02-escenario");
      const golpe = (el, t, s = 2.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const pop = (el, t, o = "50% 50%") => {
        gsap.set(el, { opacity: 0, transformOrigin: o });
        tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
      };
      const aparece = (el, t, d = 0.2) => { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: d }, t); };
      const dibujar = (el, t, d = 0.5) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      // máquina de escribir: el texto se descubre de a saltos
      const tipear = (el, t, d = 0.5) => {
        const n = Math.max(4, el.textContent.length);
        gsap.set(el, { clipPath: "inset(0 100% 0 0)" });
        tl.to(el, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "steps(" + n + ")" }, t);
      };
      const sello = (el, t, rot = -8) => { gsap.set(el, { rotation: rot }); golpe(el, t, 2.4); sacudon(t + 0.04, 0.9); };
      // cartel de FASE: entra de golpe, tiembla y se va hacia arriba en "fuera"
      const fase = (t, fuera) => {
        tl.fromTo(q(".s02-fase-c"), { opacity: 0.4, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.out" }, 0);
        golpe(q(".s02-fase-n"), t, 3.2);
        sacudon(t + 0.04, 1.4);
        tl.to(q(".s02-fase-n"), { rotation: -4, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + 0.2);
        [[0, 18, 0.4], [0.05, -14, 1], [0.1, 8, 0.5], [0.15, 0, 1]].forEach(([d, x, o]) => tl.set(q(".s02-fase-n"), { x, opacity: o }, fuera - 0.3 + d));
        tl.to(q(".s02-fase-c"), { opacity: 0, y: -180, duration: 0.16, ease: "power3.in" }, fuera - 0.12);
      };

      const CERO = 0.5, MISION = 1.59, ACEPTARLA = 2.95, AVERIGUAR = 3.94, HORA = 4.95, ROTI = 5.77, BETO = 6.59;
      // el Jefe en penumbra, la lámpara oscila
      tl.fromTo(q(".s02-jefe"), { opacity: 0.5, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0);
      tl.fromTo(q(".s02-lamp"), { rotation: -6 }, { rotation: 6, svgOrigin: "540 560", duration: 1.2, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0);
      tipear(q(".s02-para-t"), 0.05, 0.75);
      tl.to(q(".s02-para-t"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1 }, CERO);
      // "misión": la carpeta se desliza sobre la mesa y tapa al Jefe
      gsap.set(q(".s02-carpeta"), { opacity: 0 });
      tl.fromTo(q(".s02-carpeta"), { opacity: 0, y: 700, rotation: 8 }, { opacity: 1, y: 0, rotation: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, MISION - 0.3);
      tl.to([q(".s02-jefe"), q(".s02-lamp")], { opacity: 0.12, duration: 0.25 }, MISION - 0.1);
      tl.to(q(".s02-para"), { opacity: 0, y: -60, duration: 0.15 }, MISION - 0.2);
      tipear(q(".s02-titulo"), MISION + 0.05, 0.45);
      qa(".s02-raya").forEach((r, i) => { gsap.set(r, { scaleX: 0, transformOrigin: "0% 50%" }); tl.to(r, { scaleX: 1, duration: 0.18, ease: "steps(6)" }, MISION + 0.4 + i * 0.12); });
      // "aceptarla": sello
      sello(q(".s02-sello"), ACEPTARLA, -10);
      // "averiguar": cae la foto con el clip
      gsap.set(q(".s02-foto"), { opacity: 0 });
      tl.fromTo(q(".s02-foto"), { opacity: 0, y: -500, rotation: -20 }, { opacity: 1, y: 0, rotation: 4, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, AVERIGUAR - 0.15);
      pop(q(".s02-clip"), AVERIGUAR + 0.15);
      sacudon(AVERIGUAR + 0.15, 0.6);
      tipear(q(".s02-obj"), HORA - 0.25, 0.4);
      tipear(q(".s02-lug"), ROTI - 0.1, 0.7);
      // la mira se cierra sobre la foto
      gsap.set(q(".s02-mira"), { opacity: 0 });
      tl.fromTo(q(".s02-mira"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, svgOrigin: "760 925", duration: 0.35, ease: "power3.out", immediateRender: false }, ROTI);
      tl.to(q(".s02-mira"), { x: 18, y: -10, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, ROTI + 0.4);
      tl.to(q(".s02-mira"), { scale: 0.8, svgOrigin: "760 925", duration: 0.12, yoyo: true, repeat: 1 }, BETO);
      // este mensaje se autodestruye: 3, 2, 1 y la carpeta tiembla
      const T0 = 7.0;
      gsap.set(q(".s02-auto"), { opacity: 0 });
      tl.to(q(".s02-auto"), { opacity: 1, duration: 0.1 }, T0 - 0.15);
      [".s02-n3", ".s02-n2", ".s02-n1"].forEach((c, i) => {
        gsap.set(q(c), { display: "none" });
        tl.set(q(c), { display: "inline-block" }, T0 - 0.15 + i * 0.25);
        if (i < 2) tl.set(q(c), { display: "none" }, T0 - 0.15 + (i + 1) * 0.25);
      });
      [0, 1, 2, 3, 4, 5, 6, 7].forEach((k) => tl.set(q(".s02-carpeta"), { x: k % 2 ? 6 : -6, rotation: k % 2 ? 0.6 : -0.6 }, T0 + k * 0.08));

      // salida
      tl.to(q("#s02-escena"), { x: -260, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
