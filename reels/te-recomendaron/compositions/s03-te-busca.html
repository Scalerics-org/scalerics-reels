      const tl = gsap.timeline({ paused: true });

        });

      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);

      tl.to(q(".s03-cursor"), { opacity: 1, duration: 0.05 }, SACA + 0.4);
      const t0 = BUSCA - 0.35;
      ls.forEach((l, i) => {
      tl.to(l, { opacity: 1, duration: 0.03 }, t0 + i * 0.07);
      });
      // avance aproximado del cursor por letra (Lexend 28px)
      tl.to(q(".s03-cursor"), { x: 458 + 132, duration: ls.length * 0.07, ease: "none" }, t0);
      tl.to(q(".s03-cursor"), { opacity: 0, duration: 0.05 }, ENCUENTRA - 0.2);
      etiqueta(q(".s03-e1"), BUSCA);

      tl.fromTo(q(".s03-foto"), { opacity: 0, scale: 0.85, svgOrigin: "540 826" }, { opacity: 0.5, scale: 1, svgOrigin: "540 826", duration: 0.35, ease: "back.out(1.6)" }, FOTO - 0.05);
      tl.to(q(".s03-foto"), { rotation: -4, svgOrigin: "540 826", duration: 0.5, ease: "back.out(2)" }, FOTO + 0.3);
