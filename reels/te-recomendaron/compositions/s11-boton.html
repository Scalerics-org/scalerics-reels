    (function () {
      const ID = "s11-boton";
      const DUR = 5.99;

      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t <= 0.001) gsap.set(el, { opacity: 1 });

          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);

      const etiqueta = (el, t, antes) => {

        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      // camina: balanceo de una figurita (tweens finitos)

      const ASI = 2.48;

      // parte 2: el hilo entero, hasta tu mostrador
      tl.to(q(".s11-uno"), { opacity: 0, y: 20, filter: "blur(4px)", duration: 0.3, ease: "power2.in" }, ASI - 0.3);
      dibujar([q(".s11-suelo")], ASI - 0.05, 0.5);
      dibujar(qa(".s11-burb"), ASI, 0.4);
      tl.fromTo(q(".s11-burb-est"), { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2.4)" }, ASI + 0.3);
