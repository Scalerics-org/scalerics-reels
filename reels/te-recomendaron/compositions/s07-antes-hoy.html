      const ID = "s07-antes-hoy";

          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);

      tl.fromTo(q(".s07-la-in"), { scale: 1, svgOrigin: "0 -110" }, { scale: 1.1, svgOrigin: "0 -110", duration: 0.14, yoyo: true, repeat: 1 }, RECOMENDARAN);
