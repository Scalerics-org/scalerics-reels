<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    [data-composition-id="ambiente"] .amb-mono { position: absolute; top: 128px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.22em; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-modo { left: 104px; }
    [data-composition-id="ambiente"] .amb-modo span { position: absolute; left: 0; top: 0; }
    [data-composition-id="ambiente"] .amb-sin { color: rgba(239, 238, 229, 0.5); }
    [data-composition-id="ambiente"] .amb-con { color: #5ce611; opacity: 0; }
    [data-composition-id="ambiente"] .amb-punto { position: absolute; left: 72px; top: 137px; width: 14px; height: 14px; border-radius: 50%; }
    [data-composition-id="ambiente"] .amb-p-sin { background: #b8574e; opacity: 0.9; }
    [data-composition-id="ambiente"] .amb-p-con { background: #5ce611; opacity: 0; }
    [data-composition-id="ambiente"] .amb-reloj { right: 72px; color: #efeee5; text-align: right; }
    [data-composition-id="ambiente"] .amb-linea { position: absolute; left: 72px; right: 72px; top: 186px; height: 2px; background: rgba(239, 238, 229, 0.12); transform-origin: 0 50%; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="68.56">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="68.56" data-track-index="0">
      <div class="amb-punto amb-p-sin"></div>
      <div class="amb-punto amb-p-con"></div>
      <div class="amb-mono amb-modo"><span class="amb-sin">SIN SEGUIMIENTO</span><span class="amb-con">CON AGENTE DE IA</span></div>
      <div class="amb-mono amb-reloj">SEMANA · LUN</div>
      <div class="amb-linea"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 68.56;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // el día de la semana según el segundo del reel
      const DIAS = [[0, "LUN"], [9.0, "MAR"], [10.4, "MIÉ"], [11.9, "JUE"], [24.3, "VIE"], [34.5, "LUN"], [36.8, "MIÉ · +2 DÍAS"], [53.2, "VIE"]];
      const reloj = q(".amb-reloj");
      const pintar = () => {
        const t = tl.time();
        let d = DIAS[0][1];
        for (const [t0, n] of DIAS) if (t >= t0) d = n;
        const txt = "SEMANA · " + d;
        if (reloj.textContent !== txt) reloj.textContent = txt;
      };
      tl.to({ v: 0 }, { v: 1, duration: DUR, ease: "none", onUpdate: pintar }, 0);

      tl.fromTo(q(".amb-linea"), { scaleX: 0.3, opacity: 0.6 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(root.querySelectorAll(".amb-mono, .amb-p-sin"), { opacity: 0.5, y: -4 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      // cada cambio de día: un parpadeo chico
      for (const [t0] of DIAS.slice(1)) tl.fromTo(reloj, { opacity: 0.3, y: -6 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, t0);
      // el rebobinado
      tl.to(reloj, { opacity: 0.35, duration: 0.1, yoyo: true, repeat: 3 }, 34.0);
      // "Ahora": cambia el modo
      const AHORA = 33.58;
      tl.to(q(".amb-sin"), { opacity: 0, y: -10, duration: 0.25 }, AHORA);
      tl.to(q(".amb-p-sin"), { opacity: 0, duration: 0.2 }, AHORA);
      tl.fromTo(q(".amb-con"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, AHORA + 0.28);
      tl.fromTo(q(".amb-p-con"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, AHORA + 0.1);
      tl.to(q(".amb-linea"), { backgroundColor: "rgba(92, 230, 17, 0.35)", duration: 0.4 }, AHORA + 0.1);
      tl.to(reloj, { color: "#5ce611", duration: 0.3 }, 36.8);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
