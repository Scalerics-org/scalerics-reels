<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-torre"] .s06-capa { position: absolute; inset: 0; }
    [data-composition-id="s06-torre"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-torre"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-torre"] .ln4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-torre"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-torre"] .ln-ro { fill: none; stroke: #b8574e; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-torre"] .apagado { opacity: 0.45; }
    [data-composition-id="s06-torre"] .verde { fill: #5ce611; }
    [data-composition-id="s06-torre"] .crema { fill: #efeee5; }
    [data-composition-id="s06-torre"] .rojo { fill: #b8574e; }
    [data-composition-id="s06-torre"] .osc { fill: #07111f; }
    [data-composition-id="s06-torre"] .t-cr { fill: #efeee5; }
    [data-composition-id="s06-torre"] .t-ac { fill: #5ce611; }
    [data-composition-id="s06-torre"] .t-osc { fill: #07111f; }
    [data-composition-id="s06-torre"] .lex { font-family: "Lexend", sans-serif; font-weight: 600; }
    [data-composition-id="s06-torre"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.1em; }
    [data-composition-id="s06-torre"] .chapa { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.1em; fill: #5ce611; }
    [data-composition-id="s06-torre"] .ia { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 40px; fill: #5ce611; }
    [data-composition-id="s06-torre"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s06-torre"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
    
  </style>
  <div id="root" data-composition-id="s06-torre" data-width="1080" data-height="1920" data-duration="3.74">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="3.74" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
<path class="ln4 apagado" d="M220 1214 H860" />
        <g class="s06-torre"></g>
      </svg>
      <div class="etiqueta"><span class="s06-e1">Viernes</span><span class="s06-e2">Una torre</span><span class="s06-e3">Se va apagando</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-torre";
      const DUR = 3.74;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, Math.max(0, t) + i * 0.04);
        });
      };
      const pop = (el, t, s0, d) => tl.fromTo(el, { opacity: 0, scale: s0 ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d ?? 0.35, ease: "back.out(1.6)" }, t);
      const punch = (el, t, s) => tl.to(el, { scale: s ?? 1.08, transformOrigin: "50% 50%", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const aparecer = (el, t, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d ?? 0.3 }, t);
      const etq = (k, t) => {
        if (k > 1) tl.to(q(".s06-e" + (k - 1)), { opacity: 0, y: -10, duration: 0.18 }, t - 0.12);
        tl.fromTo(q(".s06-e" + k), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

const VIE = 0.05, TORRE = 1.55, APAGA = 2.75;
      const torre = q(".s06-torre");
      const C = [["S", "Lo pienso."], ["L"], ["M", "Después te confirmo."], ["R"], ["C"], ["G", "Lo hablo con mi marido."], ["P", "¿Me lo guardás?"],
        ["A", "Lo veo el finde."], ["F"], ["N", "Te escribo el lunes."], ["D"], ["V", "¿Hacen envío?"]];
      const cards = C.map(([ini, fr], i) => {
        const g = document.createElementNS(NS, "g");
        g.innerHTML = '<rect class="ln osc" x="-230" y="-30" width="460" height="60" rx="18" /><circle class="ln4" cx="-196" cy="0" r="18" />' +
          '<text class="lex t-cr" x="-196" y="8" font-size="20" text-anchor="middle" data-layout-ignore>' + ini + "</text>" +
          (fr ? '<text class="lex t-cr" x="-166" y="9" font-size="26">' + fr + "</text>" : '<path class="ln4 apagado" d="M-166 0 H60" />') +
          '<circle class="rojo s06-pto" cx="206" cy="-12" r="6" />';
        torre.appendChild(g);
        const y = 1180 - i * 54, x = 540 + Math.round(Math.sin(i * 1.7) * 26);
        gsap.set(g, { x, y, rotation: (i % 3 - 1) * 2.5 });
        if (i < 7) tl.fromTo(g, { opacity: 0.7 }, { opacity: 1, duration: 0.2 }, 0);
        else tl.fromTo(g, { y: y - 200, opacity: 0 }, { y, opacity: 1, duration: 0.35, ease: "back.out(1.3)" }, VIE + (i - 7) * 0.18);
        gsap.set(g.querySelector(".s06-pto"), { opacity: 0 });
        return g;
      });
      etq(1, VIE);
      // la torre se balancea
      tl.to(torre, { rotation: 2.5, svgOrigin: "540 1214", duration: 0.35, ease: "sine.inOut" }, TORRE - 0.3);
      tl.to(torre, { rotation: -2, svgOrigin: "540 1214", duration: 0.5, ease: "sine.inOut" }, TORRE + 0.05);
      tl.to(torre, { rotation: 0.5, svgOrigin: "540 1214", duration: 0.6, ease: "sine.inOut" }, TORRE + 0.55);
      etq(2, TORRE);
      // se va apagando de abajo para arriba
      cards.forEach((g, i) => {
        const t = APAGA - 0.4 + i * 0.07;
        tl.to(g, { opacity: 0.28, duration: 0.35 }, t);
        tl.to(g.querySelector(".s06-pto"), { opacity: 1, duration: 0.15 }, t + 0.1);
      });
      etq(3, APAGA - 0.3);

      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
