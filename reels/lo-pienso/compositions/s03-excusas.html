<path class="ln4 apagado s03-base" d="M200 1214 H880" />

  <script>
    (function () {
      const ID = "s03-excusas";
      const DUR = 5.31;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, Math.max(0, t) + i * 0.04);
        });
      };
      const pop = (el, t, s0, d) => tl.fromTo(el, { opacity: 0, scale: s0 ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d ?? 0.35, ease: "back.out(1.6)" }, t);
      const punch = (el, t, s) => tl.to(el, { scale: s ?? 1.08, transformOrigin: "50% 50%", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const aparecer = (el, t, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d ?? 0.3 }, t);
      const etq = (k, t) => {
        if (k > 1) tl.to(q(".s03-e" + (k - 1)), { opacity: 0, y: -10, duration: 0.18 }, t - 0.12);
        tl.fromTo(q(".s03-e" + k), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

const pila = q(".s03-pila");
      const tarjeta = (ini, frase, prod) => {
        const g = document.createElementNS(NS, "g");
        g.innerHTML = '<rect class="ln" x="-280" y="-42" width="560" height="84" rx="24" />' +
          '<circle class="ln4" cx="-232" cy="0" r="26" /><text class="lex t-cr" x="-232" y="10" font-size="26" text-anchor="middle">' + ini + "</text>" +
          (frase ? '<text class="mono t-cr" x="-190" y="-10" font-size="20" fill-opacity="0.55" data-layout-ignore>' + prod + '</text><text class="lex t-cr" x="-190" y="25" font-size="32">' + frase + "</text>"
                 : '<path class="ln4 apagado" d="M-190 -10 H90 M-190 16 H20" />') +
          '<circle class="rojo s03-pto" cx="252" cy="-22" r="7" />';
        pila.appendChild(g);
        return g;
      };
      // [inicial, frase, producto, t, y, rot]
      const T = [
        ["S", "Lo pienso.", "SOFÁ 3 CUERPOS", 0.12, 1168, -2],
        ["L", "", "", 0.7, 1074, 3],
        ["M", "Después te confirmo.", "MESA EXTENSIBLE", 1.32, 980, -3],
        ["R", "", "", 1.95, 886, 2],
        ["C", "", "", 2.25, 792, -2],
        ["G", "Lo hablo con mi marido.", "SOMMIER 2 PLAZAS", 3.02, 698, 3],
        ["P", "¿Me lo guardás?", "RACK DE TV", 4.12, 0, 0],
      ];
      dibujar([q(".s03-base")], 0, 0.4, 0.5);
      let k = 0;
      T.forEach(([ini, fr, pr, t, y, r], i) => {
        const g = tarjeta(ini, fr, pr);
        const x = 540 + (i % 2 ? 22 : -18);
        if (i === 6) {
          // Pablo: entra desde arriba y queda encima, la pila baja
          gsap.set(g, { x: 530, y: 604, rotation: -3, opacity: 0 });
          tl.fromTo(g, { y: 440, opacity: 0 }, { y: 604, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, t - 0.1);
        } else {
          gsap.set(g, { x, y, rotation: r, opacity: 0 });
          tl.fromTo(g, { y: y - 180, opacity: 0 }, { y, opacity: 1, duration: 0.38, ease: "back.out(1.4)" }, t - 0.1);
        }
        if (fr) { k++; }
        if (i === 0) tl.to(g, { opacity: 1 }, 0);
      });
      // la primera ya está al arrancar (el cuadro 0 no puede estar vacío)
      tl.set(pila.children[0], { opacity: 1, y: 1168 }, 0);
      // toda la pila se aprieta hacia abajo cuando cae la última
      tl.to(pila, { rotation: 1.2, svgOrigin: "540 1214", duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.3);
      // las de abajo se apagan de a poco
      [0, 1, 2].forEach((i) => tl.to(pila.children[i], { opacity: 0.6, duration: 0.5 }, 2.6 + i * 0.4));
      etq(1, 0.05); etq(2, 1.3); etq(3, 3.0); etq(4, 4.1);

      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
