  <style>

  </style>
  <div id="root" data-composition-id="s02-muebleria" data-width="1080" data-height="1920" data-duration="3.14">

      <svg viewBox="0 0 1080 1920" aria-hidden="true">
<g class="s02-local">

  <script>
    (function () {
      const ID = "s02-muebleria";
      const DUR = 3.14;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, Math.max(0, t) + i * 0.04);
        });
      };
      const pop = (el, t, s0, d) => tl.fromTo(el, { opacity: 0, scale: s0 ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: d ?? 0.35, ease: "back.out(1.6)" }, t);
      const punch = (el, t, s) => tl.to(el, { scale: s ?? 1.08, transformOrigin: "50% 50%", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const aparecer = (el, t, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d ?? 0.3 }, t);
      const etq = (k, t) => {
        if (k > 1) tl.to(q(".s02-e" + (k - 1)), { opacity: 0, y: -10, duration: 0.18 }, t - 0.12);
        tl.fromTo(q(".s02-e" + k), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

const MUEB = 0.16, SEMANA = 1.66;
      dibujar(qa(".s02-d"), 0, 0.6, 0.45);
      tl.fromTo(q(".s02-cartel"), { opacity: 0.3 }, { opacity: 1, duration: 0.3 }, 0.1);
      tl.fromTo(q(".s02-pomo"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.5);
      dibujar([q(".s02-sofa")], MUEB + 0.2, 0.7);
      dibujar([q(".s02-lampara")], MUEB + 0.5, 0.4);
      tl.to(q(".s02-lampara"), { rotation: 6, svgOrigin: "440 820", duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.0);
      etq(1, MUEB);
      // la semana
      const sem = q(".s02-sem");
      ["LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB"].forEach((d, i) => {
        const g = document.createElementNS(NS, "g");
        const x = 240 + i * 104;
        g.innerHTML = '<rect class="' + (i === 0 ? "ln-ac" : "ln4 apagado") + '" x="' + x + '" y="1176" width="92" height="56" rx="12" style="stroke-width:4" />' +
          '<text class="mono ' + (i === 0 ? "t-ac" : "t-cr") + '" x="' + (x + 46) + '" y="1213" font-size="24" text-anchor="middle"' + (i === 0 ? "" : ' fill-opacity="0.55"') + ">" + d + "</text>";
        sem.appendChild(g);
        pop(g, SEMANA + i * 0.06, 0.6);
      });
      punch(sem.children[0], SEMANA + 0.6, 1.12);
      etq(2, SEMANA);
      tl.to(q(".s02-local"), { y: -14, duration: 1.2, ease: "sine.inOut" }, 1.8);

      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
