  <script>
    (function () {
      const ID = "s10-puntos";
      const DUR = 4.98;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const PUNTOS = 0.7;
      const ACUERDA = 1.68;
      const CLIENTE = 2.48;
      const MANDA = 3.48;
      const AVISO = 3.88;
      const DEJA = 4.28;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      gsap.set(qa(".s10-cab, .s10-ficha, .s10-sellos, .s10-alerta, .s10-r2, .s10-aviso, .s10-flecha"), { opacity: 0 });
      gsap.set(qa(".s10-sello"), { opacity: 0 });

      // el celular del local (medio dibujado) y el título
      dibujar(qa(".s10-dt"), 0, 0.5, 0.45);
      tl.to(qa(".s10-cab"), { opacity: 1, duration: 0.25 }, 0.25);
      tl.fromTo(q(".s10-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, PUNTOS);
      // "se acuerda de cada cliente": la ficha y los sellos uno a uno
      pop(q(".s10-ficha"), ACUERDA - 0.3, "170 810");
      tl.to(q(".s10-sellos"), { opacity: 1, duration: 0.2 }, ACUERDA);
      qa(".s10-sello").forEach((s, i) => {
        const cx = s.getAttribute("cx");
        tl.fromTo(s, { opacity: 0, scale: 0.3, svgOrigin: cx + " 890" }, { opacity: 1, scale: 1, svgOrigin: cx + " 890", duration: 0.25, ease: "back.out(2.4)" }, ACUERDA + 0.1 + i * 0.16);
      });
      tl.to(q(".s10-ficha"), { x: 4, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, CLIENTE);

      // el celular de Marta se dibuja, apagado
      dibujar(qa(".s10-dt2"), CLIENTE + 0.1, 0.5);
      tl.to(q(".s10-r2"), { opacity: 1, duration: 0.25 }, CLIENTE + 0.4);
      // la alerta de "hace un mes"
      pop(q(".s10-alerta"), CLIENTE + 0.5, "170 992");

      // "le manda un aviso": la flecha y la notificación
      tl.to(q(".s10-flecha"), { opacity: 1, duration: 0.2 }, MANDA - 0.1);
      tl.fromTo(q(".s10-flecha"), { strokeDashoffset: 0 }, { strokeDashoffset: -48, duration: DUR - MANDA, ease: "none" }, MANDA - 0.1);
      pop(q(".s10-aviso"), AVISO - 0.1, "770 900");
      tl.to(q(".s10-tel2"), { y: -8, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, AVISO);
      tl.to(q(".s10-e1"), { opacity: 0, duration: 0.2 }, AVISO - 0.2);
      tl.fromTo(q(".s10-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, AVISO);
      // "si deja de venir": la alerta late
      tl.to(q(".s10-alerta"), { scale: 1.08, svgOrigin: "190 992", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, DEJA);
      tl.to(q(".s10-aviso"), { scale: 1.04, svgOrigin: "770 900", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, DEJA + 0.3);

      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
