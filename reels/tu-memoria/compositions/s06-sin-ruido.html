<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-sin-ruido"] .s06-capa { position: absolute; inset: 0; }
    [data-composition-id="s06-sin-ruido"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-sin-ruido"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-sin-ruido"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-sin-ruido"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-sin-ruido"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.4); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-sin-ruido"] .ui { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 24px; fill: #efeee5; }
    [data-composition-id="s06-sin-ruido"] .ui-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 26px; fill: #efeee5; }
    [data-composition-id="s06-sin-ruido"] .s06-sin { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.12em; fill: rgba(239, 238, 229, 0.55); }
    [data-composition-id="s06-sin-ruido"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s06-sin-ruido"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s06-sin-ruido" data-width="1080" data-height="1920" data-duration="6.80">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="6.80" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- la campana muda -->
        <g class="s06-campana">
          <g class="s06-campana-in">
            <path class="ln s06-dc" d="M-110 80 C-90 50 -80 20 -80 -30 C-80 -90 -40 -130 0 -130 C40 -130 80 -90 80 -30 C80 20 90 50 110 80 Z" />
            <path class="ln s06-dc" d="M0 -130 V-152" />
            <path class="ln s06-dc s06-badajo" d="M-22 92 Q0 118 22 92" />
            <path class="ln-tenue s06-onda" d="M-140 -60 Q-160 -20 -140 20 M140 -60 Q160 -20 140 20" />
            <path class="ln-ac s06-tacha" d="M-140 -150 L140 130" />
          </g>
        </g>
        <!-- el celular con el mensaje sin contestar -->
        <g class="s06-tel">
          <rect class="ln s06-dt" x="170" y="740" width="320" height="460" rx="48" />
          <line class="ln s06-dt" x1="300" y1="766" x2="360" y2="766" />
          <circle class="ln s06-dt" cx="222" cy="824" r="18" />
          <text class="ui-nombre s06-cab" x="252" y="833">Cliente</text>
          <line class="ln-tenue s06-dt" x1="194" y1="866" x2="466" y2="866" />
          <g class="s06-msg">
            <rect class="ln-4" x="194" y="894" width="224" height="58" rx="20" />

          </g>
          <text class="s06-sin" x="330" y="1140" text-anchor="middle">SIN RESPUESTA</text>
        </g>
        <!-- la puerta y el cliente que se va -->
        <g class="s06-puerta">
          <path class="ln s06-dp" d="M650 1200 V960 H790 V1200" />
          <circle class="ln s06-dp" cx="770" cy="1084" r="5" />
          <path class="ln s06-dp" d="M610 1200 H1000" />
        </g>
        <g class="s06-p"><g class="s06-p-in">
          <circle class="ln" cx="0" cy="-130" r="20" />
          <path class="ln s06-cuerpo" d="M0 -110 V-52 M0 -94 L-24 -70 M0 -94 L24 -70 M0 -52 L-18 0 M0 -52 L18 0" />
        </g></g>
      </svg>
      <div class="etiqueta"><span class="s06-e1">No hace ruido</span><span class="s06-e2">No te avisa</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-sin-ruido";
      const DUR = 6.8;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const OLVIDA = 1.1;
      const NO = 1.4;
      const RUIDO = 2.0;
      const MENSAJE = 2.9;
      const CONTESTAR = 3.5;
      const AVISA = 4.2;
      const CLIENTE = 5.2;
      const DEJO = 5.7;
      const TAMPOCO = 6.6;

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * (paso ?? 0.04));
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * (paso ?? 0.04));
        });
      };

      gsap.set(q(".s06-campana"), { x: 540, y: 900 });
      gsap.set(q(".s06-campana-in"), { scale: 1.5, svgOrigin: "0 0" });
      gsap.set(qa(".s06-onda, .s06-cab, .s06-msg, .s06-sin"), { opacity: 0 });

      // 1. la campana (arranca a medio dibujar)
      dibujar(qa(".s06-dc"), 0, 0.6, 0.5);
      // "olvida": intenta sonar, apenas unas ondas apagadas
      tl.to(q(".s06-campana-in"), { rotation: 10, svgOrigin: "0 -152", duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3 }, OLVIDA);
      tl.fromTo(q(".s06-onda"), { opacity: 0, scale: 0.8, svgOrigin: "0 -20" }, { opacity: 1, scale: 1, svgOrigin: "0 -20", duration: 0.25 }, OLVIDA + 0.1);
      tl.to(q(".s06-onda"), { opacity: 0, duration: 0.3 }, NO + 0.2);
      // "ruido": la tacha verde
      dibujar([q(".s06-tacha")], RUIDO - 0.2, 0.35);
      tl.to(q(".s06-campana-in"), { scale: 1.58, svgOrigin: "0 0", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, RUIDO + 0.15);
      tl.fromTo(q(".s06-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, RUIDO);

      // 2. "el mensaje": la campana sube chica, aparece el celular
      tl.to(q(".s06-campana"), { x: 540, y: 660, duration: 0.5, ease: "power3.inOut" }, MENSAJE - 0.25);
      tl.to(q(".s06-campana-in"), { scale: 0.42, svgOrigin: "0 0", duration: 0.5, ease: "power3.inOut" }, MENSAJE - 0.25);
      dibujar(qa(".s06-dt"), MENSAJE - 0.1, 0.5);
      tl.to(q(".s06-cab"), { opacity: 1, duration: 0.25 }, MENSAJE + 0.2);
      tl.fromTo(q(".s06-msg"), { opacity: 0, scale: 0.85, svgOrigin: "194 952" }, { opacity: 1, scale: 1, svgOrigin: "194 952", duration: 0.35, ease: "back.out(1.6)" }, MENSAJE + 0.3);
      // "sin contestar": no llega nada, sólo el rótulo apagado
      tl.fromTo(q(".s06-sin"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, CONTESTAR + 0.2);
      tl.to(q(".s06-msg"), { opacity: 0.5, duration: 0.4 }, AVISA);
      tl.to(q(".s06-e1"), { opacity: 0, duration: 0.2 }, AVISA - 0.2);
      tl.fromTo(q(".s06-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, AVISA);
      tl.to(q(".s06-campana-in"), { scale: 0.5, svgOrigin: "0 0", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, AVISA);

      // 3. "el cliente que dejó de venir": sale por la puerta y se va
      dibujar(qa(".s06-dp"), CLIENTE - 0.2, 0.45);
      gsap.set(q(".s06-p"), { opacity: 0 });
      gsap.set(q(".s06-p-in"), { scale: 1.4, svgOrigin: "0 0" });
      tl.fromTo(q(".s06-p"), { x: 720, y: 1200, opacity: 0 }, { opacity: 1, duration: 0.2 }, CLIENTE);
      tl.to(q(".s06-p"), { x: 990, duration: 1.3, ease: "none" }, DEJO - 0.2);
      tl.to(q(".s06-p"), { opacity: 0, duration: 0.5 }, DEJO + 0.6);
      tl.fromTo(q(".s06-cuerpo"), { rotation: -4, svgOrigin: "0 -52" }, { rotation: 4, svgOrigin: "0 -52", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 6 }, DEJO - 0.2);
      tl.to(q(".s06-tel"), { opacity: 0.45, duration: 0.4 }, CLIENTE);
      // "tampoco": la campana muda late otra vez
      tl.to(q(".s06-campana-in"), { scale: 0.5, svgOrigin: "0 0", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, TAMPOCO - 0.2);

      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
