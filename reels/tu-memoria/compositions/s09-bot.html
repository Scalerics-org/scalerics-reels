<template>

  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s09-bot"] .s09-capa { position: absolute; inset: 0; }
    [data-composition-id="s09-bot"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s09-bot"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s09-bot"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }

    [data-composition-id="s09-bot"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.35); stroke-width: 3; stroke-linecap: round; }

    [data-composition-id="s09-bot"] .s09-para { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.22em; fill: #5ce611; }
    [data-composition-id="s09-bot"] .ui { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 24px; fill: #efeee5; }
    [data-composition-id="s09-bot"] .ui-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 26px; fill: #efeee5; }
    [data-composition-id="s09-bot"] .ui-mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.1em; fill: #5ce611; }
    [data-composition-id="s09-bot"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s09-bot"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s09-bot" data-width="1080" data-height="1920" data-duration="6.11">
    <div id="s09-escena" class="s09-capa clip" data-start="0" data-duration="6.11" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- caja de marca -->
        <g class="s09-caja">
          <g class="s09-caja-in">
            <rect class="ln s09-dib-caja" x="-240" y="-78" width="480" height="156" rx="30" />
            <text class="s09-nombre" x="0" y="-4" text-anchor="middle">Scalerics</text>
            <text class="s09-para" x="0" y="46" text-anchor="middle">PARA COMERCIOS</text>
          </g>
        </g>
        <!-- celular con el bot -->
        <g class="s09-tel">
          <rect class="ln s09-dt" x="340" y="620" width="400" height="580" rx="52" />
          <line class="ln s09-dt" x1="510" y1="646" x2="570" y2="646" />
          <circle class="ln s09-dt" cx="392" cy="704" r="18" />
          <text class="ui-nombre s09-cab" x="422" y="713">Tu local</text>
          <circle class="relleno s09-cab" cx="700" cy="704" r="8" />
          <line class="ln-tenue s09-dt" x1="366" y1="742" x2="714" y2="742" />
          <g class="s09-preg">

            <text class="ui" x="456" y="914">¿Te lo agendo?</text>
          </g>

            <path class="ln-ac" d="M416 1096 L428 1108 L448 1082" />
            <text class="ui-mono" x="476" y="1088">AGENDADO</text>
            <text class="ui" x="476" y="1122">Mañana 10:30</text>

      </svg>
      <div class="etiqueta"><span class="s09-e1">Bot de WhatsApp</span><span class="s09-e2">Turno agendado</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s09-bot";
      const DUR = 6.11;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SCALERICS = 0.09;
      const ARMAMOS = 0.89;
      const COMERCIOS = 1.39;
      const UN = 2.5;
      const WHATSAPP = 2.89;
      const CONTESTA = 3.59;
      const INSTANTE = 4.09;
      const AGENDA = 4.59;
      const TURNOS = 5.19;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      gsap.set(q(".s09-caja"), { x: 540, y: 900 });
      gsap.set(qa(".s09-cab, .s09-preg, .s09-resp, .s09-si, .s09-turno"), { opacity: 0 });

      // "Scalerics": la caja (medio dibujada) y el nombre
      dibujar([q(".s09-dib-caja")], 0, 0.5, 0.5);
      tl.fromTo(q(".s09-nombre"), { opacity: 0, scale: 0.85, svgOrigin: "0 -24" }, { opacity: 1, scale: 1, svgOrigin: "0 -24", duration: 0.35, ease: "back.out(1.6)" }, SCALERICS);
      tl.to(q(".s09-caja-in"), { scale: 1.06, svgOrigin: "0 0", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, ARMAMOS);
      tl.fromTo(q(".s09-para"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, COMERCIOS);
      tl.fromTo(q(".s09-caja-in"), { scale: 1 }, { scale: 1.04, svgOrigin: "0 0", duration: 1.0, ease: "none" }, COMERCIOS + 0.1);
      // se va para arriba
      tl.to(q(".s09-caja"), { y: 760, opacity: 0, duration: 0.35, ease: "power2.in" }, UN - 0.3);

      // "un bot de WhatsApp": el celular y la pregunta
      dibujar(qa(".s09-dt"), UN, 0.5);
      tl.to(qa(".s09-cab"), { opacity: 1, duration: 0.25 }, UN + 0.3);
      pop(q(".s09-preg"), WHATSAPP, "366 824");
      tl.fromTo(q(".s09-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, WHATSAPP);

      // "contesta al instante"
      pop(q(".s09-resp"), CONTESTA, "714 938");
      tl.to(q(".s09-tel"), { y: -6, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, CONTESTA + 0.05);
      tl.to(q(".s09-resp"), { scale: 1.05, svgOrigin: "714 938", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, INSTANTE);
      pop(q(".s09-si"), INSTANTE + 0.25, "366 1010");

      // "agenda los turnos"
      pop(q(".s09-turno"), AGENDA, "540 1095");
      tl.to(q(".s09-e1"), { opacity: 0, duration: 0.2 }, AGENDA - 0.1);
      tl.fromTo(q(".s09-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, AGENDA + 0.05);
      tl.to(q(".s09-turno"), { scale: 1.06, svgOrigin: "540 1095", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, TURNOS);
      tl.fromTo(q(".s09-tel"), { scale: 1 }, { scale: 1.03, svgOrigin: "540 910", duration: DUR - UN, ease: "none" }, UN);

      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
