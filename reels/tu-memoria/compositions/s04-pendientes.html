<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s04-pendientes"] .s04-capa { position: absolute; inset: 0; }
    [data-composition-id="s04-pendientes"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s04-pendientes"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s04-pendientes"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s04-pendientes"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s04-pendientes"] .s04-txt { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.08em; fill: #efeee5; }
    [data-composition-id="s04-pendientes"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s04-pendientes"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s04-pendientes" data-width="1080" data-height="1920" data-duration="4.35">
    <div id="s04-escena" class="s04-capa clip" data-start="0" data-duration="4.35" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s04-cabeza">
          <g class="s04-cabeza-in">
            <path class="ln s04-perfil" d="M-110 280 C-110 210 -190 170 -200 60 C-215 -120 -100 -270 60 -270 C190 -270 270 -180 272 -70 L276 -40 L318 30 Q324 44 306 48 L282 52 L288 80 L278 92 L286 108 L278 122 Q284 160 250 168 L190 174 Q160 186 160 280" />
            <g transform="translate(24 -150)"><g class="s04-t s04-t1">
              <rect class="ln-4" x="-150" y="-34" width="324" height="68" rx="14" />
              <path class="ln-ac" d="M-126 -14 H-92 L-88 18 H-130 Z M-118 -14 V-20 Q-109 -30 -100 -20 V-14" />
              <text class="s04-txt" x="-66" y="9">PEDIDOS</text>
            </g></g>
            <g transform="translate(8 -66)"><g class="s04-t s04-t2">
              <rect class="ln-4" x="-150" y="-34" width="324" height="68" rx="14" />
              <path class="ln-ac" d="M-130 -16 H-86 V8 H-104 L-115 19 V8 H-130 Z" />
              <text class="s04-txt" x="-66" y="9">SIN RESPONDER</text>
            </g></g>
            <g transform="translate(28 18)"><g class="s04-t s04-t3">
              <rect class="ln-4" x="-150" y="-34" width="324" height="68" rx="14" />
              <rect class="ln-ac" x="-128" y="-17" width="40" height="36" rx="5" />
              <path class="ln-ac" d="M-128 -6 H-88" />
              <text class="s04-txt" x="-66" y="9">MAÑANA</text>
            </g></g>
          </g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s04-e1">Quién pidió qué</span><span class="s04-e2">A quién contestar</span><span class="s04-e3">Lo de mañana</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s04-pendientes";
      const DUR = 4.35;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const PIDIO = 0.13;
      const DEBES = 1.53;
      const PEDIDO = 3.03;
      const MANANA = 3.43;

      const CX = 460, CY = 930;
      gsap.set(q(".s04-cabeza"), { x: CX, y: CY });

      // la cabeza ya está (viene de la escena anterior): se dibuja rápido desde la mitad
      const perfil = q(".s04-perfil");
      const L = perfil.getTotalLength();
      gsap.set(perfil, { strokeDasharray: L });
      tl.fromTo(perfil, { strokeDashoffset: L * 0.4 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0);

      // la cabeza se va hinchando con cada pendiente
      const cabeza = q(".s04-cabeza-in");
      gsap.set(cabeza, { scale: 1, svgOrigin: "40 0" });
      const etiquetas = [q(".s04-e1"), q(".s04-e2"), q(".s04-e3")];
      const tarjetas = [q(".s04-t1"), q(".s04-t2"), q(".s04-t3")];
      gsap.set(tarjetas, { opacity: 0 });
      [PIDIO, DEBES, PEDIDO].forEach((t, i) => {
        tl.fromTo(tarjetas[i], { opacity: 0, y: -70, scale: 0.9, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, t);
        tl.to(cabeza, { scale: 1.04 + i * 0.035, svgOrigin: "40 0", duration: 0.25, ease: "back.out(2)" }, t + 0.25);
        if (i > 0) tl.to(etiquetas[i - 1], { opacity: 0, duration: 0.2 }, t - 0.05);
        tl.fromTo(etiquetas[i], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t + 0.1);
      });
      // "respuesta": la burbuja titila
      tl.to(q(".s04-t2 path"), { opacity: 0.3, duration: 0.12, yoyo: true, repeat: 3 }, DEBES + 0.45);
      // "mañana": el calendario late y todo tiembla de lleno
      tl.to(q(".s04-t3 rect.ln-ac"), { scale: 1.2, transformOrigin: "50% 50%", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, MANANA);
      tl.to(tarjetas, { x: 5, duration: 0.05, ease: "power1.inOut", yoyo: true, repeat: 5, stagger: 0.03 }, MANANA + 0.3);
      // deriva entre golpes
      tl.fromTo(q(".s04-cabeza"), { y: CY + 10 }, { y: CY - 10, duration: DUR, ease: "none" }, 0);

      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
