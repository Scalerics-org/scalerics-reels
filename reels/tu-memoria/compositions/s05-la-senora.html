  <div id="root" data-composition-id="s05-la-senora" data-width="1080" data-height="1920" data-duration="2.98">

  <script>
    (function () {
      const ID = "s05-la-senora";
      const DUR = 2.98;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SENORA = 0.08;
      const TODOS = 0.78;
      const HACE = 1.98;
      const APARECE = 2.58;

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * (paso ?? 0.04));
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * (paso ?? 0.04));
        });
      };

      gsap.set(q(".s05-senora"), { x: 290, y: 1110 });
      // la señora se dibuja (arranca a medio hacer) y la grilla aparece
      dibujar(qa(".s05-ds"), 0, 0.45, 0.5, 0.03);
      tl.fromTo(q(".s05-senora-in"), { y: 10 }, { y: 0, duration: 0.4, ease: "back.out(2)" }, SENORA);
      dibujar(qa(".s05-c1"), 0.15, 0.35, 1, 0.06);
      tl.fromTo(qa(".s05-cab"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.05, ease: "power3.out" }, 0.25);

      // "todos los sábados": tildes verdes uno tras otro, la señora camina en el lugar
      dibujar(qa(".s05-tic"), TODOS - 0.08, 0.18, 1, 0.15);
      tl.to(q(".s05-senora-in"), { y: -8, duration: 0.15, ease: "sine.out", yoyo: true, repeat: 3 }, TODOS);
      tl.fromTo(q(".s05-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, TODOS);

      // "hace un mes": la fila de abajo vacía
      dibujar(qa(".s05-c2"), HACE - 0.2, 0.3, 1, 0.06);
      tl.fromTo(q(".s05-guion"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, HACE + 0.15);
      tl.to(q(".s05-e1"), { opacity: 0, duration: 0.2 }, HACE - 0.1);
      tl.fromTo(q(".s05-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, HACE + 0.05);

      // "no aparece": la señora se apaga y se corre
      tl.to(q(".s05-senora"), { opacity: 0.25, x: 250, duration: 0.45, ease: "power2.out" }, APARECE - 0.25);

      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
