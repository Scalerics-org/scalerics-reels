<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-no-funciona"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-no-funciona"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-no-funciona"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-no-funciona"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-no-funciona"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-no-funciona"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.4); stroke-width: 4; stroke-linecap: round; }
    [data-composition-id="s01-no-funciona"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s01-no-funciona"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01-no-funciona" data-width="1080" data-height="1920" data-duration="5.30">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="5.30" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s01-cabeza">
          <g class="s01-cabeza-in">
            <!-- la cabeza de perfil, mirando a la derecha -->
            <path class="ln s01-perfil" d="M-110 280 C-110 210 -190 170 -200 60 C-215 -120 -100 -270 60 -270 C190 -270 270 -180 272 -70 L276 -40 L318 30 Q324 44 306 48 L282 52 L288 80 L278 92 L286 108 L278 122 Q284 160 250 168 L190 174 Q160 186 160 280" />
            <!-- la torre de cosas para acordarse -->
            <g class="s01-torre">
              <g transform="translate(30 92)"><g class="s01-caja s01-c1">
                <rect class="ln-4" x="-80" y="-30" width="160" height="60" rx="12" />
                <path class="ln-ac" d="M-56 -12 H-26 L-22 16 H-60 Z M-49 -12 V-17 Q-41 -26 -33 -17 V-12" />
                <path class="ln-tenue" d="M-6 -6 H52 M-6 10 H34" />
              </g></g>
              <g transform="translate(4 30)"><g class="s01-caja s01-c2">
                <rect class="ln-4" x="-80" y="-30" width="160" height="60" rx="12" />
                <rect class="ln-ac" x="-60" y="-15" width="36" height="32" rx="5" />
                <path class="ln-ac" d="M-60 -5 H-24" />
                <path class="ln-tenue" d="M-6 -6 H52 M-6 10 H40" />
              </g></g>
              <g transform="translate(46 -32)"><g class="s01-caja s01-c3">
                <rect class="ln-4" x="-80" y="-30" width="160" height="60" rx="12" />
                <path class="ln-ac" d="M-62 -14 H-22 V8 H-38 L-48 18 V8 H-62 Z" />
                <path class="ln-tenue" d="M-6 -6 H52 M-6 10 H30" />
              </g></g>
              <g transform="translate(14 -94)"><g class="s01-caja s01-c4">
                <rect class="ln-4" x="-80" y="-30" width="160" height="60" rx="12" />
                <circle class="ln-ac" cx="-42" cy="-6" r="9" />

          </g>
        </g>
        <!-- badge de "no" -->
        <g class="s01-badge"><g class="s01-b-in"><circle class="ln-ac" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
      </svg>
      <div class="etiqueta"><span class="s01-e1">Todo en tu cabeza</span><span class="s01-e2">De casualidad</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-no-funciona";
      const DUR = 5.3;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const PORQUE = 1.5;
      const VOS = 1.8;
      const ACORDAS = 2.3;
      const TODO = 2.7;
      const NO = 3.0;
      const FUNCIONA2 = 3.4;
      const FUNCIONA3 = 4.3;
      const CASUALIDAD = 4.7;

      // cabeza: centro de la torre en coordenadas globales
      const CX = 470, CY = 905;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      gsap.set(q(".s01-cabeza"), { x: CX, y: CY });
      gsap.set(q(".s01-badge"), { x: CX + 250, y: CY - 230 });
      gsap.set(q(".s01-b-in"), { opacity: 0 });

      // el cuadro 0 no puede ser negro: la cabeza ya está a medio dibujar y visible
      const perfil = q(".s01-perfil");
      const L = perfil.getTotalLength();
      gsap.set(perfil, { strokeDasharray: L });
      tl.fromTo(perfil, { strokeDashoffset: L * 0.5 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 0);
      // la cabeza se acerca despacio todo el tiempo
      tl.fromTo(q(".s01-cabeza-in"), { scale: 0.96, svgOrigin: "40 0" }, { scale: 1.03, svgOrigin: "40 0", duration: DUR, ease: "none" }, 0);

      // "porque vos te acordás de todo": se apilan las cosas en la cabeza
      const cajas = [q(".s01-c1"), q(".s01-c2"), q(".s01-c3"), q(".s01-c4")];
      gsap.set(cajas, { opacity: 0 });
      [PORQUE - 0.6, VOS - 0.1, ACORDAS, TODO].forEach((t, i) => {
        tl.fromTo(cajas[i], { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, t);
        tl.to(q(".s01-torre"), { y: 6, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, t + 0.26);
      });
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, ACORDAS);

      // "no funciona": badge de no y la cabeza se sacude
      tl.fromTo(q(".s01-b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, NO);
      tl.to(q(".s01-cabeza"), { x: CX - 8, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, FUNCIONA2);
      tl.to(q(".s01-b-in"), { scale: 1.25, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, FUNCIONA2 + 0.05);

      // "funciona de casualidad": la torre se tambalea
      const base = "30 122";
      tl.to(q(".s01-torre"), { rotation: -7, svgOrigin: base, duration: 0.28, ease: "sine.inOut" }, FUNCIONA3 - 0.1);
      tl.to(q(".s01-torre"), { rotation: 6, svgOrigin: base, duration: 0.3, ease: "sine.inOut" }, FUNCIONA3 + 0.18);
      tl.to(q(".s01-torre"), { rotation: -4, svgOrigin: base, duration: 0.28, ease: "sine.inOut" }, FUNCIONA3 + 0.48);
      tl.to(q(".s01-c4"), { x: 14, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, CASUALIDAD);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.2 }, FUNCIONA3 - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CASUALIDAD);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
