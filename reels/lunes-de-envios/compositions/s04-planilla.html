  <script>
    (function () {
      const ID = "s04-planilla";
      const DUR = 7.45;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // dibuja trazos (stroke-dashoffset); opacity 0 hasta que arrancan (sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.04);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      // aparece entero con golpe
      const pop = (el, t, o) => tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: o ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      // texto que se escribe de izquierda a derecha
      const escribir = (el, t, d) => tl.fromTo(el, { opacity: 1, clipPath: "inset(-20% 100% -20% 0)" }, { opacity: 1, clipPath: "inset(-20% 0% -20% 0)", duration: d ?? 0.5, ease: "power1.inOut" }, t);
      // golpecito (latido)
      const latir = (el, t, s) => tl.to(el, { scale: s ?? 1.08, transformOrigin: "50% 50%", duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, t);
      // contador numérico
      const contar = (el, t, d, a, b, fmt) => { const o = { v: a }; const pintar = () => { el.textContent = fmt ? fmt(Math.round(o.v)) : String(Math.round(o.v)); }; pintar(); tl.to(o, { v: b, duration: d, ease: "power1.inOut", onUpdate: pintar }, t); };

      dibujar(qa(".s04-pd"), 0, 0.5, 0.5, 0.03);
      tl.fromTo(qa(".s04-hd"), { opacity: 0 }, { opacity: 0.8, duration: 0.3 }, 0.1);
      tl.fromTo(q(".s04-pila"), { opacity: 0.4, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo(q(".s04-cnt"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
      const cur = q(".s04-cur");
      gsap.set(cur, { x: 250, y: 860, opacity: 0 });
      tl.to(cur, { opacity: 1, duration: 0.2 }, 0.5);
      const cnt = q(".s04-cnt");
      const setCnt = (t, n) => { tl.call(() => {}, null, t); tl.set(cnt, { textContent: n + "/32" }, t); latir(cnt, t, 1.2); };
      // filas 1-3: del montón a la planilla, cada vez una
      [[1.0, 1.65], [1.95, 2.29], [2.5, 2.74]].forEach(([ida, llega], i) => {
        tl.to(cur, { x: 250, y: 820, duration: 0.25, ease: "power2.inOut" }, ida - 0.3);
        tl.to(q(".s04-pila"), { x: 6, duration: 0.08, yoyo: true, repeat: 1 }, ida - 0.05);
        tl.to(cur, { x: 520, y: 735 + i * 76, duration: llega - ida, ease: "power2.inOut" }, ida);
        tl.fromTo(q(".s04-f" + i), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, llega);
        setCnt(llega, i + 1);
      });
      // la ficha de Sofía sube al montón
      tl.fromTo(q(".s04-ficha"), { opacity: 0, y: 40, scale: 0.9, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 3.2);
      tl.to(q(".s04-pila"), { opacity: 0.5, y: -40, duration: 0.35 }, 3.2);
      tl.fromTo(qa(".s04-tc"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.08 }, 3.4);
      gsap.set(q(".s04-celda"), { opacity: 0 });
      // copiar / pegar campo por campo
      const CAMPOS = [[3.9, 4.35, 446, 230, 865], [4.49, 5.45, 616, 270, 917], [5.55, 6.85, 846, 230, 969]];
      const FY = [858, 910, 962];
      CAMPOS.forEach(([copiar, pegar, cx], k) => {
        tl.to(cur, { x: 200, y: FY[k] - 10, duration: 0.22, ease: "power2.inOut" }, copiar - 0.2);
        dibujar(q(".s04-sub" + k), copiar, 0.25);
        tl.to(q(".s04-tcm0"), { y: 8, duration: 0.08, yoyo: true, repeat: 1 }, copiar + 0.05);
        tl.to(cur, { x: cx + 60, y: 960, duration: Math.min(0.5, pegar - copiar - 0.15), ease: "power2.inOut" }, copiar + 0.2);
        tl.to(q(".s04-celda"), { opacity: 1, x: [0, 170, 400][k], duration: 0.15 }, pegar - 0.25);
        tl.to(q(".s04-tcm1"), { y: 8, duration: 0.08, yoyo: true, repeat: 1 }, pegar - 0.05);
        tl.fromTo(q(".s04-c4" + k), { opacity: 0 }, { opacity: 1, duration: 0.15 }, pegar);
        tl.to(q(".s04-sub" + k), { opacity: 0, duration: 0.2 }, pegar + 0.2);
      });
      tl.to(q(".s04-celda"), { opacity: 0, duration: 0.2 }, 7.0);
      setCnt(6.9, 4);
      // etiqueta mono
      const ET = [0.3,1.65,3.9];
      ET.forEach((t, i) => {
        const el = q(".s04-e" + (i + 1));
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        if (i + 1 < ET.length) tl.to(el, { opacity: 0, y: -8, duration: 0.2 }, ET[i + 1] - 0.15);
      });
      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
