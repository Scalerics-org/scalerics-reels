    [data-composition-id="s05-etiquetas"] .lex-rojo { font-family: "Lexend", sans-serif; font-weight: 600; fill: #c0564b; }
    [data-composition-id="s05-etiquetas"] .grande { font-family: "Lexend", sans-serif; font-weight: 700; fill: #efeee5; letter-spacing: -0.02em; }
    [data-composition-id="s05-etiquetas"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.12em; fill: #efeee5; }
    [data-composition-id="s05-etiquetas"] .mono-ac { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.12em; fill: #5ce611; }

  </style>
  <div id="root" data-composition-id="s05-etiquetas" data-width="1080" data-height="1920" data-duration="2.6">

  <script>
    (function () {
      const ID = "s05-etiquetas";
      const DUR = 2.6;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // dibuja trazos (stroke-dashoffset); opacity 0 hasta que arrancan (sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.04);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      // aparece entero con golpe
      const pop = (el, t, o) => tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: o ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      // texto que se escribe de izquierda a derecha
      const escribir = (el, t, d) => tl.fromTo(el, { opacity: 1, clipPath: "inset(-20% 100% -20% 0)" }, { opacity: 1, clipPath: "inset(-20% 0% -20% 0)", duration: d ?? 0.5, ease: "power1.inOut" }, t);
      // golpecito (latido)
      const latir = (el, t, s) => tl.to(el, { scale: s ?? 1.08, transformOrigin: "50% 50%", duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, t);
      // contador numérico
      const contar = (el, t, d, a, b, fmt) => { const o = { v: a }; const pintar = () => { el.textContent = fmt ? fmt(Math.round(o.v)) : String(Math.round(o.v)); }; pintar(); tl.to(o, { v: b, duration: d, ease: "power1.inOut", onUpdate: pintar }, t); };

      dibujar(qa(".s05-cd"), 0, 0.5, 0.5, 0.04);
      dibujar(qa(".s05-lab, .s05-lab2"), 0.1, 0.4, 1, 0.1);
      gsap.set([q(".s05-w1"), q(".s05-w2")], { opacity: 0 });
      escribir(q(".s05-w1"), 0.55, 0.4);
      escribir(q(".s05-w2"), 0.95, 0.45);
      const pen = q(".s05-pen");
      gsap.set(pen, { x: 394, y: 1066, opacity: 0 });
      tl.to(pen, { opacity: 1, duration: 0.1 }, 0.45);
      tl.to(pen, { x: 600, duration: 0.4, ease: "none" }, 0.55);
      tl.to(pen, { x: 394, y: 1112, duration: 0.05 }, 0.95);
      tl.to(pen, { x: 600, duration: 0.45, ease: "none" }, 1.0);
      tl.to(pen, { rotation: -6, svgOrigin: "0 0", duration: 0.05, yoyo: true, repeat: 17, ease: "none" }, 0.55);
      tl.to(pen, { opacity: 0, x: 680, y: 1020, duration: 0.25 }, 1.5);
      gsap.set([q(".s05-dac"), q(".s05-cor")], { opacity: 0 });
      pop(q(".s05-dac"), 1.5);
      tl.to(q(".s05-dac"), { opacity: 0, y: -10, duration: 0.15 }, 2.0);
      pop(q(".s05-cor"), 2.1);
      tl.fromTo(q(".s05-pila"), { opacity: 0, x: 30 }, { opacity: 0.45, x: 0, duration: 0.3 }, 0.3);
      pop(q(".s05-cnt"), 0.9);
      latir(q(".s05-cnt"), 1.9, 1.15);
      // etiqueta mono
      const ET = [0.3];
      ET.forEach((t, i) => {
        const el = q(".s05-e" + (i + 1));
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        if (i + 1 < ET.length) tl.to(el, { opacity: 0, y: -8, duration: 0.2 }, ET[i + 1] - 0.15);
      });
      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
