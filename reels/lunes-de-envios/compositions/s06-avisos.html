    (function () {
      const ID = "s06-avisos";
      const DUR = 6.41;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // dibuja trazos (stroke-dashoffset); opacity 0 hasta que arrancan (sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.04);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      // aparece entero con golpe
      const pop = (el, t, o) => tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: o ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      // texto que se escribe de izquierda a derecha
      const escribir = (el, t, d) => tl.fromTo(el, { opacity: 1, clipPath: "inset(-20% 100% -20% 0)" }, { opacity: 1, clipPath: "inset(-20% 0% -20% 0)", duration: d ?? 0.5, ease: "power1.inOut" }, t);
      // golpecito (latido)

      // contador numérico
      const contar = (el, t, d, a, b, fmt) => { const o = { v: a }; const pintar = () => { el.textContent = fmt ? fmt(Math.round(o.v)) : String(Math.round(o.v)); }; pintar(); tl.to(o, { v: b, duration: d, ease: "power1.inOut", onUpdate: pintar }, t); };

      dibujar(qa(".s06-cel"), 0, 0.5, 0.4, 0.04);
      const noms = qa(".s06-nom");
      gsap.set(noms, { opacity: 0 });
      tl.to(noms[0], { opacity: 1, duration: 0.3 }, 0.1);
      gsap.set([q(".s06-o1"), q(".s06-o2")], { opacity: 0 });
      tl.fromTo(q(".s06-out"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, 0.75);

      // otro cliente, el mismo mensaje

      [[2.5, 1, "4/32"], [2.95, 2, "5/32"]].forEach(([t, i, c]) => {
        tl.to(noms[i - 1], { opacity: 0, duration: 0.1 }, t - 0.1);
        tl.to(noms[i], { opacity: 1, duration: 0.15 }, t);
        tl.fromTo(q(".s06-out"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(1.6)", immediateRender: false }, t + 0.05);
        tl.set(cnt, { textContent: c }, t);
        latir(cnt, t, 1.2);
      });
      tl.set(cnt, { textContent: "3/32" }, 0);
      // la pregunta de siempre
      const IN = [3.75,4.99,5.3,5.6];

      IN.forEach((t, i) => {

        latir(q(".s06-badge"), t, 1.2);
      });
      tl.set(bn, { textContent: "1" }, 0);
      tl.to(q(".s06-badge"), { opacity: 1, duration: 0.15 }, IN[0]);
      tl.to(q(".s06-out"), { opacity: 0.4, duration: 0.3 }, 4.99);
      // etiqueta mono
      const ET = [0.3,3.75];
