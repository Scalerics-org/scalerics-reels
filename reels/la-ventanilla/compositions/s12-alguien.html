<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/oficina.js"></script>
  <style>
    @font-face { font-family: "Special Elite"; font-display: block; src: url("assets/fonts/SpecialElite.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s12-alguien"] .s12-capa { position: absolute; inset: 0; }
    [data-composition-id="s12-alguien"] .s12-escenario { position: absolute; inset: 0; }
    [data-composition-id="s12-alguien"] svg.s12-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s12-alguien"] .s12-eco { position: absolute; left: 0; width: 1080px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 800; color: #2a2b30; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s12-alguien" data-width="1080" data-height="1920" data-duration="3.99">
    <div id="s12-escena" class="s12-capa clip" data-start="0" data-duration="3.99" data-track-index="0">
      <div class="s12-escenario">
        <svg class="s12-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="s12-eco s12-e1" style="top:600px;font-size:64px">¿ALGUIEN?</div>
        <div class="s12-eco s12-e2" style="top:680px;font-size:46px;opacity:0.6">¿alguien?</div>
        <div class="s12-eco s12-e3" style="top:740px;font-size:32px;opacity:0.35">¿alguien?</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s12-alguien";
      const DUR = 3.99;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const silla = (x) => `<g stroke="#2a2b30" stroke-width="5" stroke-linejoin="round">
          <path d="M${x - 60} 1330 H${x + 60} L${x + 52} 1356 H${x - 52} Z" fill="#5f9e8e"/>
          <path d="M${x - 52} 1236 Q${x} 1218 ${x + 52} 1236 L${x + 48} 1330 H${x - 48} Z" fill="#5f9e8e"/>
          <path d="M${x - 42} 1356 L${x - 52} 1440 M${x + 42} 1356 L${x + 52} 1440" fill="none" stroke-width="7"/></g>`;
      root.querySelector(".s12-svg").innerHTML =
        OF.numerador(90, 830, 250, 170) +
        OF.funcionario(680, 1100, 0.62) + OF.ventanilla(500, 860, 360, 240) +
        silla(160) + silla(330) + silla(500) + silla(670) + silla(840) +
        // el bollo de papel que cruza con el viento del ventilador
        `<g class="s12-bollo" stroke="#2a2b30" stroke-width="4" stroke-linejoin="round"><path d="M-30 0 L-18 -26 L8 -32 L30 -14 L28 14 L6 30 L-22 24 Z" fill="#f4ecd8"/><path d="M-14 -10 L10 4 M-4 16 L14 -16" fill="none"/></g>`;
      const tl = gsap.timeline({ paused: true });
      const K = OF.kit(tl, root);
      const { q, qa } = K;

      const OCHO = 1.75;
      const ALGUIEN = 2.38;
      const num = q(".of-num");

      OF.numero(null, num, 47);
      tl.fromTo(q(".s12-escenario"), { scale: 1.08 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "60% 55%" }, 0);
      K.bostezo(q(".of-f-cabeza"), 0.3);
      // "ocho": el numerador pasa a 48
      tl.to(q(".of-num-d"), { opacity: 0.2, duration: 0.05 }, OCHO - 0.1);
      OF.numero(tl, num, 48, OCHO - 0.04);
      tl.to(q(".of-num-d"), { opacity: 1, duration: 0.05 }, OCHO - 0.04);
      // el bollo de papel rueda por el piso
      tl.fromTo(q(".s12-bollo"), { x: -60, y: 1410, rotation: 0 }, { x: 1150, y: 1410, rotation: 720, duration: 2.6, ease: "none" }, 1.2);
      // "¿Alguien?": mira a un lado y al otro; el eco
      tl.to(q(".of-f-cabeza"), { x: -26, duration: 0.25, ease: "power2.inOut" }, ALGUIEN);
      tl.to(q(".of-f-cabeza"), { x: 26, duration: 0.35, ease: "power2.inOut" }, ALGUIEN + 0.4);
      tl.to(q(".of-f-cabeza"), { x: 0, duration: 0.25, ease: "power2.inOut" }, ALGUIEN + 0.9);
      gsap.set(qa(".s12-eco"), { opacity: 0 });
      [[".s12-e1", 1], [".s12-e2", 0.6], [".s12-e3", 0.35]].forEach(([s, o], i) => tl.fromTo(q(s), { opacity: 0, scale: 0.9 }, { opacity: o, scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, ALGUIEN + i * 0.25));

      K.salida(q("#s12-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
