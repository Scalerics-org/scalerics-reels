<template>

  <style>

    @font-face { font-family: "Black Ops One"; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }

    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s08-otra"] .s08-no { position: absolute; left: 380px; top: 880px; padding: 12px 30px; background: #f4ecd8; border: 5px solid #2a2b30; font-family: "Black Ops One", sans-serif; font-size: 58px; color: #d63a2f; white-space: nowrap; transform-origin: 50% -40px; }
    [data-composition-id="s08-otra"] .s08-c1 { left: 330px; top: 572px; width: 420px; font-size: 34px; }
    [data-composition-id="s08-otra"] .s08-c2 { left: 1270px; top: 600px; width: 680px; font-size: 34px; }
    [data-composition-id="s08-otra"] .s08-flecha { position: absolute; left: 820px; top: 1090px; font-family: "Black Ops One", sans-serif; font-size: 120px; color: #d63a2f; -webkit-text-stroke: 4px #2a2b30; }
    [data-composition-id="s08-otra"] .s08-fila { position: absolute; left: 1150px; top: 1050px; padding: 6px 18px; background: #f4ecd8; border: 4px solid #2a2b30; font-family: "Special Elite", monospace; font-size: 34px; color: #2a2b30; transform: rotate(-4deg); white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s08-otra" data-width="1080" data-height="1920" data-duration="4.99">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="4.99" data-track-index="0">
      <div class="s08-mundo">
        <svg class="s08-svg" viewBox="0 0 2200 1920" aria-hidden="true"></svg>
        <div class="of-cartel s08-c1">VENTANILLA 1</div>
        <div class="s08-no">NO TENEMOS</div>
        <div class="of-cartel s08-c2">VENTANILLA 2 · INSTAGRAM</div>
        <div class="s08-fila">la fila sigue afuera</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-otra";
      const DUR = 4.99;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      let cola = "";
      // la cola de la ventanilla 2 (de adelante para atrás, hacia la izquierda)
      const pos = [[1560, 1430, 0.95], [1430, 1420, 0.92], [1300, 1425, 0.97], [1180, 1418, 0.9], [1070, 1428, 0.95], [960, 1420, 0.9], [850, 1426, 0.93]];
      pos.forEach(([x, y, s], i) => { cola += OF.persona(x, y, s, i, i < 4 ? "s08-p s08-pa" : "s08-p s08-pb"); });
      root.querySelector(".s08-svg").innerHTML =
        OF.funcionario(540, 1000, 0.82) + OF.ventanilla(250, 640, 580, 360) +
        OF.funcionario(1610, 980, 0.62) + OF.ventanilla(1400, 700, 420, 280) + cola +
        `<path class="s08-flecha" d="M840 1100 H960 V1060 L1050 1130 L960 1200 V1160 H840 Z" fill="#d63a2f" stroke="#2a2b30" stroke-width="6" stroke-linejoin="round"/>`;
      const tl = gsap.timeline({ paused: true });
      const K = OF.kit(tl, root);
      const { q, qa } = K;

      const NO = 0.54;
      const OTRA = 2.27;
      const INSTAGRAM = 3.81;

      tl.fromTo(q(".s08-mundo"), { scale: 1.04 }, { scale: 1, duration: 1.8, ease: "none", transformOrigin: "540px 900px" }, 0);
      // "no tenemos": el cartelito cuelga del vidrio
      gsap.set(q(".s08-no"), { opacity: 0 });
      tl.fromTo(q(".s08-no"), { opacity: 1, y: -260, rotation: 0 }, { y: 0, duration: 0.25, ease: "power3.in", immediateRender: false }, NO - 0.25);
      tl.fromTo(q(".s08-no"), { rotation: -9 }, { rotation: 9, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, NO);
      K.bostezo(q(".of-f-cabeza"), 0.9);
      // "la otra ventanilla": él señala con el sello, flecha, y la cámara se va a la derecha
      tl.to(q(".of-f-brazo"), { rotation: -55, svgOrigin: "150 -160", duration: 0.3, ease: "back.out(2)" }, OTRA - 0.5);
      gsap.set(q(".s08-flecha"), { transformOrigin: "50% 50%" });
      K.pop(q(".s08-flecha"), OTRA - 0.4);
      tl.to(q(".s08-flecha"), { x: 30, duration: 0.15, yoyo: true, repeat: 3 }, OTRA - 0.1);
      tl.to(q(".s08-mundo"), { x: -1000, duration: 0.7, ease: "power3.inOut" }, OTRA + 0.1);
      qa(".s08-pa").forEach((p, i) => tl.fromTo(p, { y: 0 }, { y: -10, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, i * 0.15));
      // "Instagram": la cola se alarga hacia atrás
      qa(".s08-pb").forEach((p, i) => {
        gsap.set(p, { opacity: 0 });
        tl.fromTo(p, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)", immediateRender: false }, INSTAGRAM - 0.2 + i * 0.1);
      });
      K.pop(q(".s08-fila"), INSTAGRAM + 0.3);

      K.salida(q("#s08-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
