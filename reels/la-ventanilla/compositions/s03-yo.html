<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/oficina.js"></script>
  <style>
    @font-face { font-family: "Special Elite"; font-display: block; src: url("assets/fonts/SpecialElite.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-yo"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-yo"] .s03-escenario { position: absolute; inset: 0; }
    [data-composition-id="s03-yo"] svg.s03-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-yo"] .s03-ticket { position: absolute; left: 700px; top: 905px; width: 110px; height: 110px; box-sizing: border-box; background: #f4ecd8; border: 4px solid #2a2b30;
      font-family: "Black Ops One", sans-serif; font-size: 58px; line-height: 102px; text-align: center; color: #d63a2f; transform: rotate(10deg); }
    [data-composition-id="s03-yo"] .s03-yo { position: absolute; left: 110px; top: 640px; font-family: "Black Ops One", sans-serif; font-size: 150px; color: #d63a2f; -webkit-text-stroke: 5px #2a2b30; transform: rotate(-8deg); }
    [data-composition-id="s03-yo"] .s03-globo { left: 300px; top: 588px; font-size: 46px; }
  </style>
  <div id="root" data-composition-id="s03-yo" data-width="1080" data-height="1920" data-duration="3.00">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="3.00" data-track-index="0">
      <div class="s03-escenario">
        <svg class="s03-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="s03-ticket">47</div>
        <div class="s03-yo">¡YO!</div>
        <div class="of-globo s03-globo">¿ME MUESTRA<br />EL MENÚ?</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-yo";
      const DUR = 3.0;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const svg = root.querySelector(".s03-svg");
      const silla = (x) => `<g stroke="#2a2b30" stroke-width="5" stroke-linejoin="round">
          <path d="M${x - 70} 1290 H${x + 70} L${x + 60} 1320 H${x - 60} Z" fill="#5f9e8e"/>
          <path d="M${x - 60} 1180 Q${x} 1160 ${x + 60} 1180 L${x + 56} 1290 H${x - 56} Z" fill="#5f9e8e"/>
          <path d="M${x - 50} 1320 L${x - 60} 1440 M${x + 50} 1320 L${x + 60} 1440" fill="none" stroke-width="8"/></g>`;
      // gente esperando: siluetas grises genéricas sentadas
      const persona = (x, s) => `<g transform="translate(${x} 1300) scale(${s})" stroke="#2a2b30" stroke-width="5">
          <path d="M-70 0 V-110 Q-66 -160 0 -166 Q66 -160 70 -110 V0 Z" fill="#6f7378"/>
          <circle cx="0" cy="-220" r="52" fill="#9a9ea2"/></g>`;
      svg.innerHTML = silla(150) + persona(150, 1) + silla(930) + persona(930, 1.05) + silla(540) +
        OF.gabriela(540, 1420, 1.15, "hambre", true) +
        OF.butacas(1330) +
        // rugido de panza
        `<g class="s03-panza" fill="none" stroke="#2a2b30" stroke-width="6" stroke-linecap="round">
          <path d="M360 1280 q-20 -20 0 -40 q20 -20 0 -40"/><path d="M320 1290 q-24 -24 0 -48 q24 -24 0 -48"/>
          <path d="M720 1280 q20 -20 0 -40 q-20 -20 0 -40"/><path d="M760 1290 q24 -24 0 -48 q-24 -24 0 -48"/></g>` +
        // globo de pensamiento con el plato
        `<g class="s03-piensa" stroke="#2a2b30" stroke-width="5" transform="translate(-60 -330) scale(1.45)">
          <circle cx="300" cy="960" r="12" fill="#f4ecd8"/><circle cx="260" cy="910" r="20" fill="#f4ecd8"/>
          <ellipse cx="200" cy="820" rx="120" ry="88" fill="#f4ecd8"/>
          <ellipse cx="200" cy="824" rx="62" ry="40" fill="#e8dcc0"/><ellipse cx="200" cy="824" rx="36" ry="22" fill="#f4ecd8"/>
          <path d="M118 790 V860 M108 790 V815 M128 790 V815 M108 815 H128" fill="none" stroke-width="5"/>
          <path d="M282 790 Q296 820 282 836 V860" fill="none" stroke-width="6"/></g>`;
      const tl = gsap.timeline({ paused: true });
      const K = OF.kit(tl, root);
      const { q, qa } = K;

      const YO = 0.0;
      const HAMBRE = 1.15;
      const MENU = 2.02;

      // "¡Yo!": salta de la silla con el ticket en alto
      tl.fromTo(q(".of-g"), { y: 120 }, { y: 0, duration: 0.35, ease: "back.out(2)" }, YO);
      tl.fromTo(q(".s03-ticket"), { y: 130 }, { y: 0, duration: 0.35, ease: "back.out(2)" }, YO);
      tl.to(q(".of-g-brazo"), { rotation: 6, svgOrigin: "120 -150", duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.35);
      tl.to(q(".s03-ticket"), { x: 30, y: 8, rotation: 16, duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.35);
      K.golpe(q(".s03-yo"), YO + 0.1, -8);
      tl.to(q(".s03-yo"), { opacity: 0, scale: 0.8, duration: 0.25 }, 0.95);
      // "hambre": rugido de panza y piensa en un plato
      gsap.set(qa(".s03-panza path"), { opacity: 0 });
      qa(".s03-panza path").forEach((p, i) => tl.fromTo(p, { opacity: 0, x: 0 }, { opacity: 1, x: i < 2 ? -14 : 14, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, HAMBRE + (i % 2) * 0.08));
      K.sacudon(q(".of-g"), HAMBRE, 0.5);
      tl.fromTo(q(".s03-piensa"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, HAMBRE + 0.05);
      tl.to(q(".s03-piensa"), { opacity: 0.85, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, HAMBRE + 0.4);
      // "menú": el globo
      tl.to(q(".s03-piensa"), { opacity: 0, duration: 0.15 }, MENU - 0.4);
      K.pop(q(".s03-globo"), MENU - 0.35);

      K.salida(q("#s03-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
