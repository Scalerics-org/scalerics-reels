  <div id="root" data-composition-id="s09-manana" data-width="1080" data-height="1920" data-duration="2.87">
    <div id="s09-escena" class="s09-capa clip" data-start="0" data-duration="2.87" data-track-index="0">

        <svg class="s09-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>

  <script>
    (function () {
      const ID = "s09-manana";
      const DUR = 2.87;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      let tablillas = "";
      for (let i = 0; i < 9; i++) tablillas += `<rect x="220" y="${620 + i * 44}" width="640" height="44" fill="${i % 2 ? "#9a9ea2" : "#8a8e92"}" stroke="#2a2b30" stroke-width="4"/>`;
      root.querySelector(".s09-svg").innerHTML =
        OF.funcionario(540, 1010, 0.85) +
        `<defs><clipPath id="s09-clip"><rect x="220" y="620" width="640" height="400"/></clipPath></defs><g clip-path="url(#s09-clip)"><g class="s09-persiana">${tablillas}<rect x="220" y="1000" width="640" height="16" fill="#6f7378" stroke="#2a2b30" stroke-width="4"/></g></g>` +
        OF.ventanilla(220, 620, 640, 400) +
        // el teléfono fijo de disco
        `<g class="s09-tel" stroke="#2a2b30" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

          <path d="M580 1110 L540 1080"/><path d="M570 1160 L520 1160"/><path d="M960 1110 L1000 1080"/><path d="M970 1160 L1020 1160"/></g>`;
      const tl = gsap.timeline({ paused: true });
      const K = OF.kit(tl, root);
      const { q, qa } = K;

      const FIJO = 0.28;
      const VUELVA = 1.23;
      const MANANA = 1.55;

      // "Llame al fijo": el teléfono de disco aparece y suena
      tl.fromTo(q(".s09-tel"), { y: 60, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0);
      [0.1, 0.5].forEach((t) => {
        tl.to(q(".s09-tubo"), { y: -14, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, t);

      gsap.set(q(".s09-ring"), { opacity: 0 });
      K.pop(q(".s09-fijo"), FIJO);
      // "vuelva mañana": baja la persiana y cae el sello

      tl.to(q(".s09-persiana"), { y: 0, duration: 0.4, ease: "bounce.out" }, VUELVA - 0.3);
      K.sello(q(".s09-sello"), MANANA, -8);
      K.sacudon(q(".s09-escenario"), MANANA + 0.04, 1);

      K.salida(q("#s09-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
