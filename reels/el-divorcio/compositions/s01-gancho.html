  <script>
    (function () {
      const ID = "s01-gancho";
      const DUR = 4.75;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, Math.max(0, t + i * 0.04));
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, s) => tl.fromTo(el, { opacity: 0, scale: s ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      const golpe = (el, t) => tl.fromTo(el, { opacity: 0, scale: 2.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in" }, t - 0.16);
      const temblor = (el, t, f) => [[-12, 7], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(el, { x: x * (f ?? 1), y: y * (f ?? 1), duration: 0.04, ease: "none" }, t + i * 0.045));
      const parpadeo = (el, t) => tl.to(el, { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1 }, t);
      const etq = (i, t) => {
        const s = qa(".s01-etiqueta span");
        if (i > 0) tl.to(s[i - 1], { opacity: 0, y: -12, duration: 0.2 }, t - 0.12);
        tl.fromTo(s[i], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3 }, t);
      };

      const VENDEDOR = 0.37, ESTRELLA = 0.74, VA = 1.67, CLIENTES = 2.96, BOLSILLO = 3.52;
      tl.fromTo(q(".s01-cam"), { scale: 1.07, svgOrigin: "540 950" }, { scale: 1, svgOrigin: "540 950", duration: 2.7, ease: "none" }, 0);
      tl.fromTo(q(".s01-fotog"), { opacity: 0.5, y: -24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0);
      [".s01-dueno", ".s01-med", ".s01-ven"].forEach((s, i) => tl.fromTo(q(s), { opacity: 0.5, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.4)" }, i * 0.06));
      tl.fromTo(q(".s01-carpetas"), { opacity: 0.4 }, { opacity: 1, duration: 0.3 }, 0);
      tl.set(qa(".s01-cli"), { y: 70 }, 0);
      etq(0, 0.05);

      // "vendedor": salta; "estrella": la estrella
      tl.to(q(".s01-ven"), { y: -16, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, VENDEDOR);
      tl.fromTo(q(".s01-estrella"), { opacity: 0, scale: 0.2, rotation: -90, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, ESTRELLA - 0.05);
      tl.to(q(".s01-estrella"), { rotation: 20, duration: 0.9, yoyo: true, repeat: 3, ease: "sine.inOut", transformOrigin: "50% 50%" }, ESTRELLA + 0.4);

      // "se va": la foto se parte
      tl.to(q(".s01-foto-der"), { rotation: 16, x: 46, y: 70, duration: 0.45, ease: "power2.in", transformOrigin: "50% 0%" }, VA - 0.12);
      temblor(q(".s01-foto-izq"), VA + 0.3, 0.6);
      tl.to(q(".s01-ven"), { x: 26, duration: 0.4, ease: "power2.out" }, VA);
      tl.to(q(".s01-due-cejas"), { y: -6, duration: 0.15 }, VA + 0.1);
      parpadeo(q(".s01-due-ojos"), VA + 0.35);
      parpadeo(q(".s01-med-ojos"), 1.1);

      // "clientes": zoom al bolsillo, asoman los clientes
      tl.to(q(".s01-foto-der"), { y: 400, rotation: 40, opacity: 0, duration: 0.5, ease: "power2.in", transformOrigin: "50% 0%" }, 2.3);
      tl.to(q(".s01-cam"), { scale: 1.8, svgOrigin: "880 1060", duration: 0.5, ease: "power3.inOut" }, CLIENTES - 0.35);
      qa(".s01-cli").forEach((el, i) => tl.to(el, { y: 0, duration: 0.32, ease: "back.out(1.8)" }, CLIENTES + i * 0.1));
      // "bolsillo": palmadita y guiño
      tl.to(q(".s01-bolsillo-frente"), { scaleY: 0.9, transformOrigin: "50% 0%", duration: 0.08, yoyo: true, repeat: 1 }, BOLSILLO);
      parpadeo(q(".s01-ven-ojos"), BOLSILLO + 0.15);
      tl.to(q(".s01-ven-cejas"), { y: -5, duration: 0.15, yoyo: true, repeat: 1 }, BOLSILLO + 0.1);
      qa(".s01-cli").forEach((el, i) => tl.to(el, { rotation: i % 2 ? 6 : -6, transformOrigin: "50% 100%", duration: 0.3, yoyo: true, repeat: 2, ease: "sine.inOut" }, BOLSILLO + 0.3 + i * 0.05));
      etq(1, CLIENTES);
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
