  <script>
    (function () {
      const ID = "s15-cta";
      const DUR = 5.07;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = Math.max(0, t + i * (paso ?? 0.04));
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.02 }, t0);
          tl.to(el, { strokeDashoffset: 0, duration: dur ?? 0.6, ease: "power2.inOut" }, t0);
        });
      };
      const aMedias = (els, f) => (Array.isArray(els) ? els : [els]).forEach((el) => { const L = el.getTotalLength(); gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * f }); });
      const pop = (el, t, d, desde) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: desde ?? 0.85 }, { opacity: 1, scale: 1, duration: d ?? 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };
      const popSvg = (el, t, origen, d) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.5, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: d ?? 0.35, ease: "back.out(2)", immediateRender: false }, t);
      };
      const golpe = (el, t, desde) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: desde ?? 2.6 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const salir = (el, t, d) => tl.to(el, { opacity: 0, duration: d ?? 0.18, ease: "power2.in" }, t);
      const temblor = (el, t, f) => [[-14, 8], [11, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(el, { x: x * (f ?? 1), y: y * (f ?? 1), duration: 0.04, ease: "none" }, t + i * 0.045));
      const sello = (el, t, rot) => {
        gsap.set(el, { opacity: 0, rotation: rot ?? -10 });
        tl.fromTo(el, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.12);
        temblor(q(".escenario"), t + 0.03, 0.8);
      };
      const tipear = (el, t, cps) => {
        const txt = el.textContent;
        el.innerHTML = [...txt].map((c) => `<span class="k" style="opacity:0">${c === " " ? "&nbsp;" : c}</span>`).join("");
        el.querySelectorAll(".k").forEach((k, i) => tl.to(k, { opacity: 1, duration: 0.01 }, t + i / (cps ?? 30)));
      };
      const etiquetas = (lista) => {
        lista.forEach(([txt, t], i) => {
          const el = document.createElement("div");
          el.className = "etq";
          el.innerHTML = txt;
          q(".capa").appendChild(el);
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
          if (i + 1 < lista.length) tl.to(el, { opacity: 0, y: 10, duration: 0.15 }, lista[i + 1][1] - 0.15);
        });
      };
      const LENTO = 0.74, PUEBLO = 1.11;
      // el cartel se clava de golpe
      tl.fromTo(q(".s15-cartel"), { scale: 1.3, rotation: -5, opacity: 0.3 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.24, ease: "power4.in", transformOrigin: "50% 50%" }, 0);
      temblor(q(".escenario"), 0.25, 1);
      tl.fromTo(q(".s15-arroba"), { scale: 0.5, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, 0.3);
      tl.to(q(".s15-lento"), { scale: 1.12, color: "#c8452c", duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, LENTO);
      pop(q(".s15-et"), PUEBLO + 0.2);
      // respira mientras queda quieto
      tl.to(q(".s15-arroba"), { scale: 1.08, duration: 0.5, yoyo: true, repeat: 5, ease: "sine.inOut" }, 1.6);
      tl.to(q(".s15-et"), { y: -8, duration: 0.4, yoyo: true, repeat: 5, ease: "sine.inOut" }, 1.8);

      // salida
