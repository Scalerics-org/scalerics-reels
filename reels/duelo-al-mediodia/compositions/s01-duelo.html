  <script>
    (function () {
      const ID = "s01-duelo";
      const DUR = 6.11;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = Math.max(0, t + i * (paso ?? 0.04));
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.02 }, t0);
          tl.to(el, { strokeDashoffset: 0, duration: dur ?? 0.6, ease: "power2.inOut" }, t0);
        });
      };
      const aMedias = (els, f) => (Array.isArray(els) ? els : [els]).forEach((el) => { const L = el.getTotalLength(); gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * f }); });
      const pop = (el, t, d, desde) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: desde ?? 0.85 }, { opacity: 1, scale: 1, duration: d ?? 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };
      const popSvg = (el, t, origen, d) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.5, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: d ?? 0.35, ease: "back.out(2)", immediateRender: false }, t);
      };
      const golpe = (el, t, desde) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: desde ?? 2.6 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const salir = (el, t, d) => tl.to(el, { opacity: 0, duration: d ?? 0.18, ease: "power2.in" }, t);
      const temblor = (el, t, f) => [[-14, 8], [11, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(el, { x: x * (f ?? 1), y: y * (f ?? 1), duration: 0.04, ease: "none" }, t + i * 0.045));
      const sello = (el, t, rot) => {
        gsap.set(el, { opacity: 0, rotation: rot ?? -10 });
        tl.fromTo(el, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.12);
        temblor(q(".escenario"), t + 0.03, 0.8);
      };
      const tipear = (el, t, cps) => {
        const txt = el.textContent;
        el.innerHTML = [...txt].map((c) => `<span class="k" style="opacity:0">${c === " " ? "&nbsp;" : c}</span>`).join("");
        el.querySelectorAll(".k").forEach((k, i) => tl.to(k, { opacity: 1, duration: 0.01 }, t + i / (cps ?? 30)));
      };
      const etiquetas = (lista) => {
        lista.forEach(([txt, t], i) => {
          const el = document.createElement("div");
          el.className = "etq";
          el.innerHTML = txt;
          q(".capa").appendChild(el);
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
          if (i + 1 < lista.length) tl.to(el, { opacity: 0, y: 10, duration: 0.15 }, lista[i + 1][1] - 0.15);
        });
      };
      const ENFRENTE = 0.38, DESAFIO = 1.51, DUELO = 2.27, YVOS = 2.73, VOS = 3.46, NI = 4.19, ENTERASTE = 4.54;
      // plano 1: la calle ya a medio dibujar en el cuadro 0
      aMedias(qa(".s01-fach-l"), 0.45);
      tl.to(qa(".s01-fach-l"), { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0);
      dibujar(qa(".s01-calle-l"), 0, 0.5);
      tl.fromTo(q(".s01-calle"), { scale: 1.08, svgOrigin: "540 1100" }, { scale: 1, svgOrigin: "540 1100", duration: 0.5, ease: "power3.out" }, 0);
      pop(q(".s01-t-tu"), 0.05);
      pop(q(".s01-t-enf"), 0.15);
      // "enfrente": zoom a la fachada de enfrente, aparece el pistolero
      gsap.set(q(".s01-pis"), { opacity: 0 });
      tl.fromTo(q(".s01-pis"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, ENFRENTE);
      tl.to(q(".s01-calle"), { scale: 1.35, svgOrigin: "860 1130", duration: 0.9, ease: "power2.inOut" }, ENFRENTE);
      tl.to(q(".s01-t-enf"), { scale: 1.2, x: -40, y: -10, duration: 0.9, ease: "power2.inOut" }, ENFRENTE);
      tl.to(q(".s01-t-tu"), { opacity: 0, x: -120, duration: 0.5 }, ENFRENTE + 0.2);
      // "desafió": tira el guante al medio de la calle
      gsap.set(q(".s01-guante"), { opacity: 0, x: 860, y: 1120 });
      tl.to(q(".s01-guante"), { opacity: 1, duration: 0.05 }, DESAFIO - 0.1);
      tl.to(q(".s01-guante"), { x: 560, duration: 0.55, ease: "power1.out" }, DESAFIO - 0.1);
      tl.to(q(".s01-guante"), { y: 1000, duration: 0.25, ease: "power2.out" }, DESAFIO - 0.1);
      tl.to(q(".s01-guante"), { y: 1290, duration: 0.3, ease: "bounce.out" }, DESAFIO + 0.15);
      tl.fromTo(q(".s01-guante-r"), { rotation: 0, svgOrigin: "0 0" }, { rotation: -200, svgOrigin: "0 0", duration: 0.55, ease: "power1.out" }, DESAFIO - 0.1);
      // "duelo": primerísimo plano de los ojos + DUELO gigante
      gsap.set(q(".s01-ojos"), { opacity: 0 });
      tl.to(q(".s01-calle"), { opacity: 0.25, duration: 0.1 }, DUELO - 0.12);
      tl.to(q(".s01-t-enf"), { opacity: 0, duration: 0.1 }, DUELO - 0.12);
      tl.fromTo(q(".s01-ojos"), { opacity: 0, scaleY: 0.1, svgOrigin: "540 765" }, { opacity: 1, scaleY: 1, svgOrigin: "540 765", duration: 0.16, ease: "power3.out", immediateRender: false }, DUELO - 0.16);
      tl.fromTo(qa(".s01-pupila"), { x: -6 }, { x: 6, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, DUELO + 0.1);
      golpe(q(".s01-duelo"), DUELO);
      temblor(q(".escenario"), DUELO + 0.05, 1.1);
      // "y vos": corte a tu local, vos durmiendo
      gsap.set(q(".s01-vos"), { opacity: 0 });
      tl.to([q(".s01-calle"), q(".s01-ojos"), q(".s01-duelo")], { opacity: 0, duration: 0.12 }, YVOS - 0.08);
      tl.fromTo(q(".s01-vos"), { opacity: 0, scale: 1.12, svgOrigin: "400 1300" }, { opacity: 1, scale: 1, svgOrigin: "400 1300", duration: 0.35, ease: "power3.out", immediateRender: false }, YVOS - 0.04);
      tl.to(q(".s01-vos"), { scale: 1.12, svgOrigin: "400 1300", duration: 2.6, ease: "none" }, VOS);
      // la mecedora (y vos) se hamaca
      tl.fromTo(q(".s01-vos"), { rotation: 0, svgOrigin: "400 1300" }, { rotation: 1.5, svgOrigin: "400 1300", duration: 0.6, yoyo: true, repeat: 4, ease: "sine.inOut", immediateRender: false }, YVOS + 0.3);
      qa(".s01-z").forEach((z, i) => {
        gsap.set(z, { opacity: 0 });
        tl.fromTo(z, { opacity: 0, y: 30, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, VOS + 0.1 + i * 0.25);
        tl.to(z, { y: -25, x: 10, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, VOS + 0.4 + i * 0.25);
      });
      // "ni te enteraste": se da vuelta el cartel de CERRADO en la puerta
      gsap.set(q(".s01-cerrado"), { opacity: 0 });
      tl.fromTo(q(".s01-cerrado"), { opacity: 1, rotationY: 90 }, { opacity: 1, rotationY: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, NI);
      tl.to(q(".s01-cerrado"), { rotation: 6, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, NI + 0.3);
      tl.to(q(".s01-sombrero"), { y: -6, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, ENTERASTE);
      etiquetas([["DESAFÍO A DUELO", 0.1], ["VOS: DURMIENDO", YVOS + 0.1]]);

      // salida
      tl.to(q("#s01-duelo-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
