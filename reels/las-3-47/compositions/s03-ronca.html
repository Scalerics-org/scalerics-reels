<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-ronca"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-ronca"] .s03-escenario { position: absolute; inset: 0; }
    [data-composition-id="s03-ronca"] .s03-app { position: absolute; left: 90px; top: 570px; width: 900px; height: 830px; border-radius: 48px; background: rgba(20, 26, 70, 0.85); border: 2px solid rgba(167, 139, 250, 0.3); }
    [data-composition-id="s03-ronca"] .s03-tit { position: absolute; left: 50px; top: 44px; font-family: "Lexend", sans-serif; font-weight: 700; font-size: 46px; color: #e8f0ff; }
    [data-composition-id="s03-ronca"] .s03-rec { position: absolute; right: 50px; top: 52px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.12em; color: #ffb547; }
    [data-composition-id="s03-ronca"] .s03-punto { display: inline-block; width: 18px; height: 18px; border-radius: 9px; background: #ffb547; margin-right: 12px; vertical-align: 1px; }
    [data-composition-id="s03-ronca"] .s03-onda { position: absolute; left: 50px; top: 140px; width: 800px; height: 220px; }
    [data-composition-id="s03-ronca"] .s03-sub { position: absolute; left: 50px; top: 400px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.2em; color: #a78bfa; }
    [data-composition-id="s03-ronca"] .s03-linea { position: absolute; left: 50px; width: 800px; padding: 26px 34px; border-radius: 30px; background: #232a5e; font-family: "Lexend", sans-serif; font-weight: 500; font-size: 46px; color: #e8f0ff; font-style: italic; }
    [data-composition-id="s03-ronca"] .s03-l1 { top: 470px; }
    [data-composition-id="s03-ronca"] .s03-l2 { top: 640px; }
    [data-composition-id="s03-ronca"] .s03-hora { font-style: normal; font-family: "IBM Plex Mono", monospace; font-size: 26px; color: #b9c3f0; display: block; margin-bottom: 6px; }
    [data-composition-id="s03-ronca"] .s03-lunes { color: #ffb547; font-weight: 800; }
  </style>
  <div id="root" data-composition-id="s03-ronca" data-width="1080" data-height="1920" data-duration="4.99">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="4.99" data-track-index="0">
      <div class="s03-escenario">
        <div class="s03-app">
          <div class="s03-tit">Tu sueño</div>
          <div class="s03-rec"><span class="s03-punto"></span>GRABANDO</div>
          <svg class="s03-onda" viewBox="0 0 800 220" aria-hidden="true">
            <g class="s03-barras" fill="#a78bfa"></g>
          </svg>
          <div class="s03-sub">HABLÁS DORMIDO · TRANSCRIPCIÓN</div>
          <div class="s03-linea s03-l1"><span class="s03-hora">03:47:09</span>"Mmm... está cerrado..."</div>
          <div class="s03-linea s03-l2"><span class="s03-hora">03:47:12</span>"...pasá el <span class="s03-lunes">lunes</span>..."</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-ronca";
      const DUR = 4.99;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const CERRADO = 1.05, PASA = 2.88, LUNES = 3.24;

      // barras de la onda del ronquido (deterministas)
      const g = q(".s03-barras");
      const N = 40;
      const barras = [];
      for (let i = 0; i < N; i++) {
        const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        r.setAttribute("x", i * 20 + 3);
        r.setAttribute("y", 0);
        r.setAttribute("width", 12);
        r.setAttribute("height", 220);
        r.setAttribute("rx", 6);
        g.appendChild(r);
        barras.push(r);
      }
      // cada barra con su altura base; el ronquido sube y baja en olas
      barras.forEach((b, i) => {
        const base = 0.12 + 0.5 * Math.abs(Math.sin(i * 0.55)) * Math.abs(Math.sin(i * 0.17 + 1));
        gsap.set(b, { scaleY: 0.08, svgOrigin: `${i * 20 + 9} 110` });
        // tres ronquidos en la escena: 0, 1.7, 3.4
        [0, 1.7, 3.4].forEach((t0) => {
          tl.to(b, { scaleY: Math.min(1, base * 1.6 + 0.1), duration: 0.35, ease: "sine.out" }, t0 + i * 0.008);
          tl.to(b, { scaleY: 0.08 + base * 0.2, duration: 0.6, ease: "sine.in" }, t0 + 0.45 + i * 0.008);
        });
      });

      // entrada: la app sube
      tl.fromTo(q(".s03-app"), { y: 80, opacity: 0.4, scale: 0.97 }, { y: 0, opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo(q(".s03-punto"), { opacity: 1 }, { opacity: 0.2, duration: 0.3, yoyo: true, repeat: 15, ease: "steps(1)" }, 0);
      tl.fromTo(q(".s03-escenario"), { rotation: -0.6 }, { rotation: 0.6, duration: 1.2, yoyo: true, repeat: 3, ease: "sine.inOut", transformOrigin: "50% 50%" }, 0);

      // las frases dormidas aparecen como transcripción
      gsap.set([q(".s03-l1"), q(".s03-l2")], { opacity: 0 });
      tl.fromTo(q(".s03-l1"), { opacity: 0, x: -40, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "power2.out", immediateRender: false }, CERRADO - 0.2);
      tl.fromTo(q(".s03-l2"), { opacity: 0, x: -40, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "power2.out", immediateRender: false }, PASA - 0.2);
      tl.fromTo(q(".s03-lunes"), { textShadow: "0 0 0px rgba(255,181,71,0)" }, { textShadow: "0 0 30px rgba(255,181,71,0.9)", duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, LUNES);
      tl.to(q(".s03-l2"), { scale: 1.04, duration: 0.12, yoyo: true, repeat: 1, transformOrigin: "0% 50%" }, LUNES);

      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(8px)", y: -80, duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
