<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/tocador.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s07-fijador"] .s07-capa, [data-composition-id="s07-fijador"] .s07-escenario { position: absolute; inset: 0; }
    /* todo vive adentro del vidrio del espejo */
    [data-composition-id="s07-fijador"] #s07-escena { clip-path: inset(500px 100px 420px 100px round 40px); }
    [data-composition-id="s07-fijador"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

  </style>
  <div id="root" data-composition-id="s07-fijador" data-width="1080" data-height="1920" data-duration="5.21">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="5.21" data-track-index="0">
      <div class="s07-escenario">
        <svg class="s07-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="to-paso s07-paso"><small>PASO</small><b>4</b><i>fijador</i></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s07-fijador";
      const DUR = 5.21;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = TO.kit(tl, root);
      const { q, qa } = K;
      const I = TO.INK;
      const NX = 600, NY = 1540, NS = 1.42;
      const CX = 520, CY = 830, CW = 400, CH = 640;
      const [ge] = TO.globo(CX + 30, CY + 200, "¿estás?", "i", { fs: 60, hora: "04:00", cls: "s07-ge" });
      q(".s07-svg").innerHTML =
        `<g class="s07-n">${TO.nestor(NX, NY, NS, { cara: "dormido" })}</g>` +
        `<g class="s07-spray">${TO.spray(230, 1260, 0.75)}</g>` +
        `<g class="s07-niebla">${TO.niebla(285, 1125, 11)}</g>` +
        `<g class="s07-reloj">${TO.reloj(800, 650, "04:00")}</g>` +
        `<g class="s07-cel">${TO.celular(CX, CY, CW, CH, "s07-clip", TO.NUDE2)}
          <g clip-path="url(#s07-clip)">${TO.chatCabecera(CX, CY, CW, "Cliente", "en línea")}${ge}</g>
          ${TO.celularBorde(CX, CY, CW, CH)}</g>`;

      const FIJADOR = 1.14, PARA = 1.62, CUATRO = 2.56, ESTAS = 4.02;
      tl.set(q(".s07-n .to-n-base"), { opacity: 0.85 }, 0);
      tl.set(q(".s07-n .to-n-ojeras"), { opacity: 0.8 }, 0);
      tl.set(q(".s07-n .to-n-brillo"), { opacity: 1 }, 0);
      tl.fromTo(q(".s07-n"), { y: 30 }, { y: 0, duration: 0.4, ease: "power2.out" }, 0);
      K.paso(q(".s07-paso"), 0.02, 0.95);
      K.popSvg(q(".s07-spray"), FIJADOR, "230 1260");
      // "para": psss, la nube va a la cara
      K.origen(q(".s07-spray .to-prod"), "0 0");
      tl.to(q(".s07-spray"), { y: 14, duration: 0.08, yoyo: true, repeat: 5 }, PARA);
      qa(".s07-niebla .to-np").forEach((p, i) => {
        gsap.set(p, { opacity: 0 });
        tl.fromTo(p, { opacity: 0, x: -60, scale: 0.4 }, { opacity: 0.85, x: 40, scale: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, PARA + (i % 8) * 0.06);
        tl.to(p, { opacity: 0, x: 120, duration: 0.6, ease: "power1.in" }, PARA + 0.9 + (i % 5) * 0.08);
      });
      // "a las cuatro": el despertador
      K.popSvg(q(".s07-reloj"), CUATRO - 0.1, "800 650", 0.4, 0.3);
      tl.to(q(".s07-reloj"), { rotation: 6, svgOrigin: "800 700", duration: 0.07, yoyo: true, repeat: 9, ease: "none" }, CUATRO + 0.3);
      // "¿estás?": el celular entra a pantalla y vibra
      tl.fromTo(q(".s07-cel"), { y: 700 }, { y: 0, duration: 0.4, ease: "back.out(1.3)" }, ESTAS - 0.5);
      gsap.set(q(".s07-ge"), { opacity: 0 });
      K.popSvg(q(".s07-ge"), ESTAS, `${CX + 160} ${CY + 260}`);
      K.vibrar(q(".s07-cel"), ESTAS + 0.15, 0.8);
      K.sacudon(q(".s07-n"), ESTAS + 0.2, 0.6);
      K.salida(q("#s07-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
