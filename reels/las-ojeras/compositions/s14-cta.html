  <script>
    (function () {
      const ID = "s14-cta";
      const DUR = 6.45;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = TO.kit(tl, root);
      const { q, qa } = K;
      const I = TO.INK;
      const texto = "@el_que_contesta_a_las_2";
      q(".s14-tx").innerHTML = texto.split("").map((c, i) => `<span class="s14-ch${i === 0 ? " s14-arroba" : ""}">${c}</span>`).join("") + `<span class="s14-cur"></span>`;
      q(".s14-svg").innerHTML =
        `<g class="s14-n">${TO.nestor(790, 1600, 0.85, { cara: "feliz", antifaz: true, ojeras: 0 })}</g>` +
        `<g class="s14-z">${TO.zzz(890, 1210, 0.6)}</g>` +
        `<g class="s14-i">${TO.influencer(320, 1600, 0.95, { cara: "beso", brazo: "saludo" })}</g>` +
        `<path class="s14-cor" d="M0 18 C-30 -10 -30 -36 -10 -36 C-2 -36 0 -28 0 -24 C0 -28 2 -36 10 -36 C30 -36 30 -10 0 18 Z" fill="${TO.ROSA}" stroke="${I}" stroke-width="5" stroke-linejoin="round" transform="translate(330 1340)"/>` +

      const CONTESTO = 0.79, ALGUIEN = 2.53, AVISE = 2.87;
      // cuadro 0: el sticker ya golpea
      tl.fromTo(q(".s14-etqw"), { scale: 1.5, opacity: 0.5, transformOrigin: "540px 620px" }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0);
      tl.to(q(".s14-etqw"), { scale: 1.05, transformOrigin: "540px 620px", duration: 0.5, yoyo: true, repeat: 9, ease: "sine.inOut" }, 0.5);
      tl.fromTo(q(".s14-i"), { y: 80 }, { y: 0, duration: 0.45, ease: "back.out(1.5)" }, 0);
      tl.fromTo(q(".s14-n"), { y: 80 }, { y: 0, duration: 0.45, ease: "back.out(1.5)" }, 0.1);
      K.roncar(".s14-z", 0.5, 5.5);
      K.titilar(".s14-ds .to-ds", 0.3, 5.8);
      K.origen(q(".s14-i .to-i-brazo"), "150 -190");
      tl.to(q(".s14-i .to-i-brazo"), { rotation: 10, duration: 0.3, yoyo: true, repeat: 9, ease: "sine.inOut" }, 0.5);
      // el comentario se escribe
      K.pop(q(".s14-com"), CONTESTO - 0.3);
      qa(".s14-ch").forEach((c, i) => tl.set(c, { display: "inline" }, CONTESTO + i * 0.055));
      tl.fromTo(q(".s14-cur"), { opacity: 1 }, { opacity: 0, duration: 0.3, yoyo: true, repeat: 15, ease: "steps(1)", immediateRender: false }, CONTESTO);
      K.sello(q(".s14-avise"), ALGUIEN, -4);
      // beso que vuela
      gsap.set(q(".s14-cor"), { opacity: 0 });
      tl.fromTo(q(".s14-cor"), { opacity: 0, x: 0, y: 0, scale: 0.5 }, { opacity: 1, x: 200, y: -40, scale: 1.4, duration: 0.9, ease: "power1.out", immediateRender: false }, AVISE + 0.6);
      tl.to(q(".s14-cor"), { opacity: 0, duration: 0.3 }, AVISE + 1.6);
      K.salida(q("#s14-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
