<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/tocador.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-nestor"] .s02-capa, [data-composition-id="s02-nestor"] .s02-escenario { position: absolute; inset: 0; }
    /* todo vive adentro del vidrio del espejo */
    [data-composition-id="s02-nestor"] #s02-escena { clip-path: inset(500px 100px 420px 100px round 40px); }
    [data-composition-id="s02-nestor"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s02-nestor"] .s02-modelo { left: 130px; top: 570px; font-size: 32px; }
    [data-composition-id="s02-nestor"] .s02-preg { left: 250px; top: 760px; font-size: 150px; }
  </style>
  <div id="root" data-composition-id="s02-nestor" data-width="1080" data-height="1920" data-duration="6.80">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="6.80" data-track-index="0">
      <div class="s02-escenario">
        <svg class="s02-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="to-tag lila s02-modelo">EL MODELO: NÉSTOR</div>
        <div class="to-titulo s02-preg">?</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-nestor";
      const DUR = 6.80;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = TO.kit(tl, root);
      const { q, qa } = K;
      const I = TO.INK;
      const NX = 540, NY = 1530, NS = 1.5;
      const [g1] = TO.globo(960, 580, "Buenas...", "d", { fs: 40, hora: "02:13", ticks: "gris", cls: "s02-g1" });
      const [g2] = TO.globo(960, 690, "sí, hay stock...", "d", { fs: 40, hora: "02:13", ticks: "gris", cls: "s02-g2" });
      q(".s02-svg").innerHTML =
        `<g class="s02-n"><g class="s02-dorm">${TO.nestor(NX, NY, NS, { cara: "dormido", celular: true })}</g>
          <g class="s02-tuerto" opacity="0">${TO.nestor(NX, NY, NS, { cara: "tuerto", celular: true })}</g></g>` +
        `<g class="s02-z">${TO.zzz(250, 900, 1.1)}</g>` + g1 + g2;

      const MODELO = 0.34, NESTOR = 1.34, SALUDA = 2.13, BUENAS = 3.13, STOCK = 5.03, QUIEN = 5.85;

      // cuadro 0: Néstor ya está entrando (lo empujan en su silla)
      tl.fromTo(q(".s02-n"), { x: 300, opacity: 0.5 }, { x: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 0);
      tl.fromTo(q(".s02-escenario"), { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none", transformOrigin: "50% 65%" }, 0);
      K.pop(q(".s02-modelo"), NESTOR);
      tl.to(q(".s02-modelo"), { opacity: 0, duration: 0.2 }, BUENAS - 0.25);
      // la luz del celular le pega en la cara
      tl.fromTo(qa(".s02-n .to-n-luz"), { opacity: 0 }, { opacity: 0.4, duration: 0.3, immediateRender: false }, MODELO);
      tl.to(qa(".s02-n .to-n-luz"), { opacity: 0.2, duration: 0.4, yoyo: true, repeat: 7, ease: "sine.inOut" }, MODELO + 0.4);
      // "saludá": cabecea y ronca
      K.origen(q(".s02-dorm .to-n-cabeza"), "0 -260");
      tl.to(q(".s02-dorm .to-n-cabeza"), { rotation: 9, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, SALUDA - 0.2);
      K.roncar(".s02-z", SALUDA, 2.6);
      // contesta dormido
      K.popSvg(q(".s02-g1"), BUENAS, "780 625");
      K.hablar(".s02-dorm .to-n-boca", BUENAS, 2, 0.15);
      K.popSvg(q(".s02-g2"), STOCK - 0.3, "720 735");
      K.hablar(".s02-dorm .to-n-boca", STOCK - 0.3, 2, 0.15);
      // "¿Quién habla?": abre un ojo
      tl.to(q(".s02-z"), { opacity: 0, duration: 0.15 }, QUIEN - 0.1);
      tl.set(q(".s02-dorm"), { opacity: 0 }, QUIEN); tl.set(q(".s02-tuerto"), { opacity: 1 }, QUIEN);
      K.sello(q(".s02-preg"), QUIEN + 0.15, -10);
      K.salida(q("#s02-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
