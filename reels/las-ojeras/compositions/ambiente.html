  <script>
    (function () {
      const ID = "ambiente";

      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // segundos globales (de assets/voice/palabras.json; los escribe armar.mjs)

      const PASOS = [13.3, 18.33, 28.23, 32.27, 59.94];
      const ESTAS = 36.29;
      const GIRO = 40.44;
      const SCALERICS = 46.69;
      const DORMIR = 60.85;
      const CTA = 67.54;

      // marco dorado del espejo con bombitas
      let bombitas = "";
      const pos = [];
      for (let k = 0; k < 9; k++) pos.push([150 + k * 97.5, 487]);
      for (let k = 0; k < 9; k++) { pos.push([87, 590 + k * 104]); pos.push([993, 590 + k * 104]); }
      pos.forEach(([x, y], i) => {
        bombitas += `<g class="am-bomba am-b${i % 2}"><circle class="am-halo" cx="${x}" cy="${y}" r="38" fill="#f3cf7a" opacity="0.28"/>
          <circle cx="${x}" cy="${y}" r="22" fill="#a8782a" stroke="#2b1720" stroke-width="6"/>
          <circle class="am-luz" cx="${x}" cy="${y}" r="17" fill="#fff8f4"/>
          <circle cx="${x - 6}" cy="${y - 6}" r="5" fill="#ffffff" opacity="0.9"/></g>`;

      q(".am-svg").innerHTML =
        `<rect x="87" y="487" width="906" height="1026" rx="56" fill="none" stroke="#2b1720" stroke-width="44"/>
         <rect x="87" y="487" width="906" height="1026" rx="56" fill="none" stroke="#d9a441" stroke-width="28"/>

         <rect x="73" y="473" width="934" height="1054" rx="70" fill="none" stroke="#f3cf7a" stroke-width="4" opacity="0.7"/>` + bombitas;

      tl.fromTo(q(".am-cartel"), { y: -30 }, { y: 0, duration: 0.35, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".am-cartel small i"), { opacity: 1 }, { opacity: 0.2, duration: 0.5, yoyo: true, repeat: Math.floor(DUR) * 2 - 1, ease: "steps(1)" }, 0);
      // los halos de las bombitas respiran, alternados
      const veces = Math.floor(DUR / 1.2);
      tl.fromTo(qa(".am-b0 .am-halo"), { opacity: 0.32 }, { opacity: 0.12, duration: 0.6, yoyo: true, repeat: veces * 2 - 1, ease: "sine.inOut" }, 0);
      tl.fromTo(qa(".am-b1 .am-halo"), { opacity: 0.12 }, { opacity: 0.32, duration: 0.6, yoyo: true, repeat: veces * 2 - 1, ease: "sine.inOut" }, 0);

      const luces = qa(".am-luz"), halos = qa(".am-halo");
      // "¿estás?": cortocircuito
      [0, 0.08, 0.16, 0.3, 0.38].forEach((d, i) => tl.to(luces, { opacity: i % 2 ? 1 : 0.25, duration: 0.03 }, ESTAS + d));
      tl.to(luces, { opacity: 1, duration: 0.05 }, ESTAS + 0.5);
      // giro: luz cálida y tenue
      tl.to(luces, { opacity: 0.5, duration: 0.5 }, GIRO);
      tl.to(q(".am-calido"), { opacity: 1, duration: 0.6 }, GIRO);
      // Scalerics: flash y luz plena
      tl.to(q(".am-flash"), { opacity: 0.55, duration: 0.03 }, SCALERICS);
      tl.to(q(".am-flash"), { opacity: 0, duration: 0.45, ease: "power2.out" }, SCALERICS + 0.04);
      tl.to(luces, { opacity: 1, duration: 0.1 }, SCALERICS);
      tl.to(q(".am-calido"), { opacity: 0, duration: 0.1 }, SCALERICS);
      tl.to(q(".am-sub"), { opacity: 0, duration: 0.15 }, SCALERICS);
      tl.to(q(".am-ia"), { opacity: 1, duration: 0.2 }, SCALERICS + 0.1);
      tl.to(q(".am-cartel"), { borderColor: "#5ce611", duration: 0.2 }, SCALERICS);
      // paso cinco, dormir: luz de noche
      tl.to(luces, { opacity: 0.4, duration: 0.6 }, DORMIR);
      tl.to(q(".am-nocturno"), { opacity: 1, duration: 0.6 }, DORMIR);
      // CTA: vuelve la luz
      tl.to(luces, { opacity: 1, duration: 0.3 }, CTA);
      tl.to(q(".am-nocturno"), { opacity: 0, duration: 0.3 }, CTA);

      // chapa de quién habla
      const CH = { i: ".am-chi", d: ".am-chd", o: ".am-cho" };
      let ant = null;
      TURNOS.forEach(([t, quien]) => {
        const el = q(CH[quien]);
        if (ant && ant !== el) tl.to(ant, { opacity: 0, x: -30, duration: 0.12, ease: "power2.in" }, t - 0.12);
        if (ant !== el) tl.fromTo(el, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(2.2)", immediateRender: false }, Math.max(0, t));
        ant = el;

      // contador de pasos
