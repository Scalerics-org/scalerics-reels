<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-robar"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-robar"] .s01-escenario { position: absolute; inset: 0; }
    [data-composition-id="s01-robar"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-robar"] .plano { fill: none; stroke: #7fd4ff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-robar"] .plano-fino { fill: none; stroke: #7fd4ff; stroke-width: 3; opacity: 0.55; }
    [data-composition-id="s01-robar"] .ruta { fill: none; stroke: #ff3b30; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 2 18; }
    [data-composition-id="s01-robar"] .cliente { fill: #ffd23f; }
    [data-composition-id="s01-robar"] .rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.14em; fill: #7fd4ff; }
    [data-composition-id="s01-robar"] .s01-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; }
    [data-composition-id="s01-robar"] .s01-robo { top: 590px; font-weight: 900; font-size: 102px; letter-spacing: -0.02em; color: #f2f4f8; }
    [data-composition-id="s01-robar"] .s01-clientes { top: 712px; font-weight: 900; font-size: 124px; letter-spacing: -0.02em; color: #ffd23f; text-shadow: 0 0 36px rgba(255, 210, 63, 0.4); }
    [data-composition-id="s01-robar"] .s01-aviso { position: absolute; left: 600px; top: 1430px; padding: 10px 22px; border: 5px solid #ff3b30; border-radius: 10px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 34px; letter-spacing: 0.12em; color: #ff3b30; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="s01-robar"] .s01-pillo { top: 1180px; font-weight: 900; font-size: 210px; letter-spacing: -0.02em; color: #f2f4f8; }
    [data-composition-id="s01-robar"] .s01-mascara { position: absolute; left: 330px; top: 1020px; width: 420px; height: 160px; }
  </style>
  <div id="root" data-composition-id="s01-robar" data-width="1080" data-height="1920" data-duration="4.32">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="4.32" data-track-index="0">
      <div class="s01-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- EL PLANO de tu local, visto desde arriba -->
          <g class="s01-plano">
            <path class="plano s01-muro" d="M170 930 H910 V1410 H170 Z" />
            <path class="plano s01-mostrador" d="M230 1010 H560 V1070 H230 Z" />
            <path class="plano-fino s01-estantes" d="M650 990 H860 M650 1060 H860 M650 1130 H860 M650 1200 H860" />
            <path class="plano s01-caja" d="M300 1030 h60 v20 h-60 Z" />
            <!-- la puerta: hueco con arco de apertura -->
            <path class="plano s01-puerta" d="M470 1410 A80 80 0 0 1 550 1330" />
            <text class="rotulo" x="190" y="968">TU LOCAL · ESC 1:50</text>
            <text class="rotulo" x="250" y="1104">CAJA</text>
          </g>
          <!-- los clientes adentro (puntitos amarillos) -->
          <circle class="cliente s01-c1" cx="380" cy="1180" r="18" />
          <circle class="cliente s01-c2" cx="560" cy="1240" r="18" />
          <circle class="cliente s01-c3" cx="720" cy="1300" r="18" />
          <!-- la ruta del robo: sale por la puerta y se va de cuadro -->
          <path class="ruta s01-ruta" d="M380 1180 C460 1260 520 1320 510 1400 C500 1480 700 1500 1040 1480" />
        </svg>
        <div class="s01-txt s01-robo">Te voy a robar</div>
        <div class="s01-txt s01-clientes">los clientes</div>
        <div class="s01-aviso">Aviso previo</div>
        <svg class="s01-mascara" viewBox="0 0 420 160" aria-hidden="true">
          <!-- antifaz de ladrón -->
          <path d="M20 70 C60 10 170 20 210 60 C250 20 360 10 400 70 C380 140 280 150 230 110 C220 100 200 100 190 110 C140 150 40 140 20 70 Z" fill="#050b18" stroke="#7fd4ff" stroke-width="5" />
          <ellipse cx="120" cy="82" rx="46" ry="26" fill="#06142e" stroke="#7fd4ff" stroke-width="4" />
          <ellipse cx="300" cy="82" rx="46" ry="26" fill="#06142e" stroke="#7fd4ff" stroke-width="4" />
        </svg>
        <div class="s01-txt s01-pillo">Pillo.</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-robar";
      const DUR = 4.32;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const ROBAR = 0.32;
      const CLIENTES = 0.76;
      const AVISO = 2.06;
      const PILLO = 3.58;

      // cuadro 0: el plano ya está, la cámara se acerca despacio
      tl.fromTo(q(".s01-plano"), { opacity: 0.5 }, { opacity: 1, duration: 0.3 }, 0);
      tl.fromTo(q(".s01-escenario"), { scale: 1.06 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 60%" }, 0);
      ["s01-c1", "s01-c2", "s01-c3"].forEach((c, i) => tl.fromTo(q("." + c), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(3)" }, 0.05 + i * 0.07));

      // "te voy a robar": entra de golpe
      tl.fromTo(q(".s01-robo"), { opacity: 0.55, scale: 1.18 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 0);
      // "los clientes": amarillo, y los puntitos laten
      gsap.set(q(".s01-clientes"), { opacity: 0 });
      tl.fromTo(q(".s01-clientes"), { opacity: 0, scale: 2.6 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, CLIENTES - 0.1);
      [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, CLIENTES + 0.05 + i * 0.045));
      tl.to([q(".s01-c1"), q(".s01-c2"), q(".s01-c3")], { scale: 1.35, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 1, stagger: 0.06 }, CLIENTES + 0.1);

      // la ruta roja del robo se dibuja y el primer cliente se va por ella
      const ruta = q(".s01-ruta");
      const L = ruta.getTotalLength();
      gsap.set(ruta, { strokeDasharray: "2 18", strokeDashoffset: 0, opacity: 0 });
      gsap.set(ruta, { clipPath: "inset(0 100% 0 0)" });
      tl.to(ruta, { opacity: 1, duration: 0.05 }, 1.3);
      tl.to(ruta, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power2.inOut" }, 1.3);
      const prog = { p: 0 };
      tl.to(prog, { p: 1, duration: 1.4, ease: "power1.inOut", onUpdate: () => { const pt = ruta.getPointAtLength(prog.p * L); q(".s01-c1").setAttribute("cx", pt.x); q(".s01-c1").setAttribute("cy", pt.y); } }, 1.5);

      // "te aviso antes": sello rojo
      gsap.set(q(".s01-aviso"), { opacity: 0, rotation: -8 });
      tl.fromTo(q(".s01-aviso"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, AVISO - 0.1);

      // "pillo": cae el antifaz y la palabra; el resto se apaga (el flash lo pone ambiente)
      gsap.set(q(".s01-mascara"), { opacity: 0 });
      tl.fromTo(q(".s01-mascara"), { opacity: 0, y: -260, rotation: -20 }, { opacity: 1, y: 0, rotation: 0, duration: 0.25, ease: "back.out(2)", immediateRender: false }, PILLO - 0.2);
      gsap.set(q(".s01-pillo"), { opacity: 0 });
      tl.fromTo(q(".s01-pillo"), { opacity: 0, scale: 2.6 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, PILLO - 0.06);
      tl.to([q(".s01-robo"), q(".s01-clientes"), q(".s01-plano"), q(".s01-c2"), q(".s01-c3"), q(".s01-aviso"), q(".s01-ruta")], { opacity: 0.2, duration: 0.15 }, PILLO);
      [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, PILLO + 0.08 + i * 0.045));
      tl.to(q(".s01-mascara"), { rotation: 6, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, PILLO + 0.3);

      // salida: barrido hacia la izquierda, como pasar la hoja del plan
      tl.to(q("#s01-escena"), { x: -300, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
