  <script>
    (function () {
      const ID = "s02-banco";
      const DUR = 5.18;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s02-escenario");

      const golpe = (el, t, s = 2.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const dibujar = (el, t, d = 0.5) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };

      const UNO = 0.42, COMO = 0.82, CASA = 1.26, PAPEL = 1.66, ESTUDIAR = 2.34, BANCO = 3.14, OSEA = 3.86, VOS = 4.32;

      // cámara que se acerca todo el tiempo

      // ---- PASO 1 (cuadro 0 ya lleno) ----
      tl.fromTo(q(".s02-paso"), { opacity: 0.5, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.out" }, 0);
      tl.fromTo(q(".s02-marco"), { opacity: 0.4, scale: 1.1, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 0);
      golpe(q(".s02-num"), UNO, 3.2);
      sacudon(UNO + 0.04, 1.4);
      gsap.set(q(".s02-sello"), { rotation: -7 });
      golpe(q(".s02-sello"), 0.56, 2.4);
      sacudon(0.5, 0.8);
      tl.to(q(".s02-num"), { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.56);
      // se va el cartel
      tl.to(q(".s02-sello"), { y: 150, scale: 0.75, duration: 0.2, ease: "power3.out" }, COMO - 0.08);
      tl.to(q(".s02-sello"), { opacity: 0, y: 200, duration: 0.16, ease: "power3.in" }, ESTUDIAR - 0.2);
      tl.to([q(".s02-paso"), q(".s02-num"), q(".s02-marco")], { opacity: 0, y: -140, duration: 0.16, ease: "power3.in" }, COMO - 0.08);

      // ---- la máscara de teatro ----
      const masc = q(".s02-mascara");
      gsap.set(masc, { opacity: 0 });
      tl.fromTo(masc, { opacity: 0, y: -320, rotation: -28 }, { opacity: 1, y: 0, rotation: 0, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, COMO);
      tl.to(masc, { rotation: 7, duration: 0.42, ease: "sine.inOut" }, COMO + 0.3);
      tl.to(masc, { rotation: -6, duration: 0.5, ease: "sine.inOut" }, COMO + 0.72);
      tl.to(masc, { scale: 1.08, duration: 0.1, yoyo: true, repeat: 1 }, CASA);
      tl.fromTo(q(".s02-scan"), { y: 0 }, { y: 496, duration: 1.2, ease: "none" }, COMO + 0.1);
      sacudon(COMO + 0.26, 0.7);
      gsap.set(q(".s02-ref"), { opacity: 0 });
      tl.fromTo(q(".s02-ref"), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, CASA - 0.06);
      tl.to(q(".s02-ref"), { opacity: 0.4, duration: 0.05, yoyo: true, repeat: 3, ease: "steps(1)" }, PAPEL + 0.1);
      // la máscara se va a la esquina
      tl.to(masc, { opacity: 0, scale: 0.3, x: -340, y: -200, rotation: -40, duration: 0.22, ease: "power3.in" }, ESTUDIAR - 0.2);
      tl.to(q(".s02-ref"), { opacity: 0, y: 30, duration: 0.16 }, ESTUDIAR - 0.2);

      // ---- el banco se dibuja ----
      ["s02-b-fronton", "s02-b-viga", "s02-b-cols", "s02-b-capit", "s02-b-base"].forEach((c, i) => dibujar(q("." + c), ESTUDIAR + i * 0.1, 0.5));
      gsap.set(q(".s02-b-rot"), { opacity: 0 });
      tl.to(q(".s02-b-rot"), { opacity: 1, duration: 0.2 }, ESTUDIAR + 0.4);
      golpe(q(".s02-b-letrero"), BANCO, 2.4);
      gsap.set(q(".s02-b-letrero"), { transformOrigin: "50% 50%" });
      sacudon(BANCO + 0.04, 1);

      // la mira busca y encuentra
      const mira = q(".s02-mira");
      gsap.set(mira, { opacity: 0, transformOrigin: "50% 50%" });
      tl.fromTo(mira, { opacity: 0, x: 220, y: 150, scale: 0.7 }, { opacity: 1, x: 160, y: 120, scale: 0.7, duration: 0.15, immediateRender: false }, 2.9);
      tl.to(mira, { x: -180, y: -60, duration: 0.45, ease: "power2.inOut" }, 3.05);
      tl.to(mira, { x: 60, y: 30, duration: 0.35, ease: "power2.inOut" }, 3.5);
      tl.to(mira, { x: 0, y: 0, scale: 1, duration: 0.2, ease: "power3.out" }, 3.9);
      tl.to(mira, { rotation: 90, duration: 0.3, ease: "power3.out" }, VOS - 0.1);

      // ---- "o sea, vos": el banco se vuelve tu local (glitch) ----
      const banco = q(".s02-banco"), local = q(".s02-local");
      gsap.set(local, { opacity: 0 });
      [[0, -26, 0.3, 0.8, 18], [0.05, 20, 1, 0, 0], [0.1, -12, 0.2, 1, -14], [0.15, 30, 0.8, 0.3, 10], [0.2, 0, 0, 1, 0]].forEach(([d, x, ob, ol, xl]) => {
        tl.set(banco, { x, opacity: ob }, OSEA + d);
        tl.set(local, { x: xl, opacity: ol }, OSEA + d);
      });
      sacudon(OSEA, 0.8);
      tl.fromTo(local, { scale: 1.05, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, OSEA + 0.2);

      golpe(q(".s02-vos"), VOS, 2.8);
      sacudon(VOS + 0.04, 1.5);
      tl.to(local, { opacity: 0.55, duration: 0.15 }, VOS);
      tl.to(q(".s02-vos"), { scale: 1.05, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, VOS + 0.12);

      // salida
