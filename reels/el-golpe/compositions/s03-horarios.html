  <script>
    (function () {
      const ID = "s03-horarios";
      const DUR = 5.22;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s03-escenario");

      const golpe = (el, t, s = 2.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const pop = (el, t) => {
        gsap.set(el, { opacity: 0, transformOrigin: "50% 50%" });
        tl.fromTo(el, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
      };
      const dibujar = (el, t, d = 0.5) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      // la máquina de escribir: cada letra en su span
      const tipear = (el, t, paso = 0.04) => {
        const txt = el.textContent;
        el.textContent = "";
        const spans = [];
        for (const ch of txt) {
          const s = document.createElement("span");
          s.textContent = ch === " " ? " " : ch;
          el.appendChild(s);
          spans.push(s);
        }
        gsap.set(spans, { opacity: 0 });
        spans.forEach((s, i) => tl.fromTo(s, { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.06, ease: "power2.out", immediateRender: false }, t + i * paso));
      };

      const OCHO = 0.6, DOMINGOS = 1.38, EXISTIS = 1.94, WHATSAPP = 3.0, CONTESTAS = 3.44, CUANDO = 3.88, ACORDAS = 4.26, SELLO = 4.62;

      // cámara: se acerca y baja siguiendo los renglones

      tl.fromTo(q(".s03-ficha"), { y: 40 }, { y: -30, duration: DUR, ease: "none" }, 0);

      // cuadro 0: la ficha cae sobre la mesa

      dibujar(q(".s03-clip"), 0.05, 0.35);
      tl.fromTo(q(".s03-flash"), { opacity: 0 }, { opacity: 0.85, duration: 0.03, immediateRender: false }, 0.22);
      tl.to(q(".s03-flash"), { opacity: 0, duration: 0.25 }, 0.26);
      tl.fromTo(q(".s03-sujeto"), { opacity: 0.4, x: -30 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 0.1);

      // CIERRA: 20:00
      tipear(q(".s03-v1"), OCHO - 0.1, 0.05);
      tl.fromTo(q(".s03-min"), { rotation: 0 }, { rotation: 720, transformOrigin: "50% 100%", duration: 0.6, ease: "power2.out" }, OCHO - 0.1);
      tl.fromTo(q(".s03-hora"), { rotation: 0 }, { rotation: 240, transformOrigin: "50% 100%", duration: 0.6, ease: "power2.out" }, OCHO - 0.1);
      tl.to(q(".s03-reloj"), { scale: 1.15, transformOrigin: "50% 50%", duration: 0.1, yoyo: true, repeat: 1 }, OCHO + 0.5);
      sacudon(OCHO, 0.5);

      // DOMINGOS: NO EXISTE
      pop(q(".s03-cal"), DOMINGOS - 0.1);
      tipear(q(".s03-v2"), DOMINGOS, 0.045);
      dibujar(q(".s03-cal-x"), EXISTIS - 0.06, 0.2);
      sacudon(EXISTIS + 0.1, 0.8);
      tl.to(q(".s03-cal"), { rotation: -8, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1 }, EXISTIS + 0.1);

      // pausa: la ficha "respira" (el renglón de abajo late)
      tl.to(q(".s03-v2"), { scale: 1.06, transformOrigin: "0% 50%", duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.4);

      // WHATSAPP: el celular con tildes grises
      pop(q(".s03-cel"), WHATSAPP - 0.1);
      pop(q(".s03-b1"), CONTESTAS - 0.1);
      pop(q(".s03-b2"), CONTESTAS + 0.08);
      gsap.set(qa(".s03-visto"), { opacity: 0 });
      tl.fromTo(qa(".s03-visto"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.15, stagger: 0.08, immediateRender: false }, ACORDAS - 0.1);
      tipear(q(".s03-v3"), CUANDO - 0.1, 0.03);
      tl.to(q(".s03-cel"), { rotation: 6, transformOrigin: "50% 50%", duration: 0.1, yoyo: true, repeat: 3, ease: "sine.inOut" }, ACORDAS);

      // OBJETIVO FÁCIL: cae el sello
      gsap.set(q(".s03-sello"), { rotation: -11 });
      golpe(q(".s03-sello"), SELLO, 3.2);
      sacudon(SELLO + 0.04, 1.6);
      tl.to(q(".s03-ficha"), { opacity: 0.6, duration: 0.12 }, SELLO);

      // salida
      tl.to(q("#s03-escena"), { x: -300, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
