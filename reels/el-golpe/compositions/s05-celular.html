      const ID = "s05-celular";
      const DUR = 5.62;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s05-escenario");

      const golpe = (el, t, s = 2.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);

      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const pop = (el, t) => {
        gsap.set(el, { opacity: 0, transformOrigin: "50% 50%" });
        tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
      };

      const CELULAR = 0.74, ONCE = 1.54, NOCHE = 2.22, TU = 3.04, CLIENTE = 3.26, PREGUNTA = 3.7, NADIE = 4.6, CONTESTA = 5.06;

      // cámara
      tl.fromTo(ESC, { scale: 1.06 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);

      // ---- parte 1 (cuadro 0 lleno) ----
      tl.fromTo(q(".s05-plano"), { opacity: 0.5 }, { opacity: 1, duration: 0.3 }, 0);
      tl.fromTo(q(".s05-yo"), { opacity: 0.55, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, 0);
      ["s05-c1", "s05-c2", "s05-c3"].forEach((c, i) => tl.fromTo(q("." + c), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(3)" }, 0.05 + i * 0.07));
      golpe(q(".s05-porcel"), CELULAR, 2.4);
      sacudon(CELULAR + 0.04, 1.2);
      tl.fromTo(q(".s05-celpared"), { scale: 0.7, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(3)" }, 0);
      tl.to(q(".s05-celpared"), { scale: 1.35, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1 }, CELULAR - 0.04);
      // la ruta entra por el celular (se destapa desde la derecha)
      const r1 = q(".s05-ruta1");
      gsap.set(r1, { opacity: 0, clipPath: "inset(0 0 0 100%)" });
      tl.to(r1, { opacity: 1, duration: 0.05 }, 0.1);
      tl.to(r1, { clipPath: "inset(0 0 0 0%)", duration: 1.0, ease: "power2.inOut" }, 0.1);
      // el primer cliente se sobresalta
      tl.to(q(".s05-c1"), { scale: 1.5, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1 }, 1.1);

      // ---- 23:00, se hace de noche ----

      tl.to(q(".s05-plano"), { opacity: 0.3, duration: 0.2 }, ONCE - 0.12);
      tl.to(q(".s05-p1"), { scale: 0.9, transformOrigin: "50% 60%", duration: 1.4, ease: "power1.out" }, ONCE - 0.12);
      golpe(q(".s05-hora"), ONCE, 3);
      sacudon(ONCE + 0.04, 1.5);
      [0.3, 0.6, 0.9, 1.2].forEach((d, i) => tl.set(q(".s05-dos"), { opacity: i % 2 ? 1 : 0.15 }, ONCE + d));
      tl.to([q(".s05-yo"), q(".s05-porcel")], { opacity: 0, y: -60, duration: 0.15, ease: "power2.in" }, ONCE - 0.12);
      tl.to(q(".s05-hora"), { scale: 1.04, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, ONCE + 0.15);
      gsap.set(q(".s05-luna"), { opacity: 0 });
      tl.fromTo(q(".s05-luna"), { opacity: 0, y: -80, rotation: -40 }, { opacity: 1, y: 0, rotation: 0, duration: 0.4, ease: "back.out(2)", immediateRender: false }, ONCE + 0.1);
      tl.to(q(".s05-luna"), { rotation: 12, duration: 1.2, ease: "sine.inOut" }, ONCE + 0.5);
      gsap.set(q(".s05-dela"), { opacity: 0 });
      tl.fromTo(q(".s05-dela"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, NOCHE - 0.1);
      // se va el reloj, queda la noche
      tl.to([q(".s05-hora"), q(".s05-dela")], { opacity: 0, scale: 0.5, y: -300, duration: 0.2, ease: "power3.in" }, TU - 0.2);
      tl.to(q(".s05-p1"), { opacity: 0, duration: 0.2 }, TU - 0.2);

      // ---- el celular grande ----
      const p3 = q(".s05-p3");
      gsap.set(p3, { opacity: 0 });
      tl.set(p3, { opacity: 1 }, TU - 0.06);
      tl.fromTo(q(".s05-tel"), { y: 900 }, { y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, TU - 0.06);
      tl.to(q(".s05-cursor"), { opacity: 0, duration: 0.01, yoyo: true, repeat: 7, repeatDelay: 0.25, ease: "steps(1)" }, TU + 0.3);
      pop(q(".s05-av"), CLIENTE - 0.06);
      pop(q(".s05-b1"), PREGUNTA - 0.08);
      gsap.set(q(".s05-b1"), { transformOrigin: "0% 50%" });
      pop(q(".s05-b2"), NADIE - 0.12);
      gsap.set(q(".s05-b2"), { transformOrigin: "0% 50%" });
