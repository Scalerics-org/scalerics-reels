    (function () {
      const ID = "s06-heisenberg";
      const DUR = 5.56;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s06-escenario");

      const golpe = (el, t, s = 2.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);

      const dibujar = (el, t, d = 0.5) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };

      const DIJO = 0.58, HEIS = 0.9, YO = 1.98, NO = 2.08, SOY = 2.22, GOLPEA = 2.74, PUERTA = 3.28, SOY2 = 3.88, CONTESTA = 4.48;

      // cámara

      // ---- parte 1: el sombrero cae (ya está a la vista en el cuadro 0) ----

      sacudon(0.2, 0.6);
      gsap.set(q(".s06-lentes"), { opacity: 0 });
      tl.fromTo(q(".s06-lentes"), { opacity: 0, y: -320, rotation: 20 }, { opacity: 1, y: 0, rotation: 0, duration: 0.24, ease: "back.out(2)", immediateRender: false }, DIJO - 0.12);
      sacudon(DIJO + 0.1, 0.7);
      // Heisenberg: flash (lo pone ambiente), comillas gigantes y cita célebre
      golpe(q(".s06-c-izq"), HEIS, 3);
      golpe(q(".s06-c-der"), HEIS + 0.08, 3);
      sacudon(HEIS, 1.6);
      gsap.set(q(".s06-cita"), { opacity: 0 });
      tl.fromTo(q(".s06-cita"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, HEIS + 0.1);

      tl.to(q(".s06-sombrero"), { rotation: -6, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.2);
      tl.to(q(".s06-c-izq"), { y: -16, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.0);
      tl.to(q(".s06-c-der"), { y: 16, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.0);
      tl.to(q(".s06-p1"), { x: -400, opacity: 0, duration: 0.18, ease: "power3.in" }, YO - 0.16);

      // ---- parte 2: la puerta ----
      const p2 = q(".s06-p2");
      gsap.set(p2, { opacity: 0 });
      tl.fromTo(p2, { opacity: 0, x: 400 }, { opacity: 1, x: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, YO - 0.08);
      [[q(".s06-toc1"), NO], [q(".s06-toc2"), SOY + 0.06], [q(".s06-toc3"), GOLPEA]].forEach(([el, t]) => {
        golpe(el, t, 2);
        tl.to(q(".s06-hoja"), { x: 10, duration: 0.03, yoyo: true, repeat: 3, ease: "none" }, t);
        sacudon(t + 0.02, 0.6);
      });
      gsap.set(q(".s06-nosoy"), { opacity: 0 });
      tl.fromTo(q(".s06-nosoy"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.18, immediateRender: false }, NO);
      golpe(q(".s06-golpea"), GOLPEA, 2.4);
      dibujar(q(".s06-tachon-l"), 3.16, 0.16);
      sacudon(3.2, 1);
      tl.to([q(".s06-toc1"), q(".s06-toc2"), q(".s06-toc3")], { opacity: 0.25, duration: 0.2 }, PUERTA);
      tl.to(p2, { x: -400, opacity: 0, duration: 0.18, ease: "power3.in" }, SOY2 - 0.2);

      // ---- parte 3: soy el que contesta ----

      gsap.set(p3, { opacity: 0 });
      tl.set(p3, { opacity: 1 }, SOY2 - 0.1);
      golpe(q(".s06-soy"), SOY2, 2.4);
      tl.fromTo(q(".s06-tel"), { y: 700 }, { y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, SOY2 - 0.06);
      tl.to(q(".s06-tel"), { rotation: -3, transformOrigin: "50% 50%", duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.0);
