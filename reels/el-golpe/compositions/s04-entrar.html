    (function () {
      const ID = "s04-entrar";
      const DUR = 4.46;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s04-escenario");

      const golpe = (el, t, s = 2.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);

      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      const pop = (el, t) => {
        gsap.set(el, { opacity: 0, transformOrigin: "50% 50%" });
        tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
      };
      const dibujar = (el, t, d = 0.5) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };

      const DOS = 0.4, ENTRAR = 1.12, NO = 1.9, MIRAS = 2.08, VOS = 2.98, CUIDAS = 3.12, CAJA = 3.7;

      golpe(q(".s04-num"), DOS, 3.2);
      sacudon(DOS + 0.04, 1.4);
      tl.to(q(".s04-num"), { rotation: -5, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.65);
      gsap.set(q(".s04-sello"), { rotation: -6 });
      golpe(q(".s04-sello"), ENTRAR, 2.4);
      sacudon(ENTRAR + 0.02, 0.9);
      // "no mirás": el ojo aparece y lo tachan
      pop(q(".s04-ojo"), NO - 0.12);
      dibujar(q(".s04-ojo-x"), MIRAS - 0.04, 0.16);
      sacudon(MIRAS + 0.1, 0.7);
      // glitch del número antes de irse
      [[0, 18, 0.4], [0.05, -14, 1], [0.1, 8, 0.5], [0.15, 0, 1]].forEach(([d, x, o]) => tl.set(q(".s04-num"), { x, opacity: o }, 2.5 + d));
      tl.to(q(".s04-cartel"), { opacity: 0, y: -160, duration: 0.16, ease: "power3.in" }, VOS - 0.16);

      // ---- el plano: vos cuidás la caja ----
      const plano = q(".s04-planogrp");
      gsap.set(plano, { opacity: 0 });
      tl.set(plano, { opacity: 1 }, VOS - 0.06);
      tl.fromTo(plano, { scale: 1.15, transformOrigin: "50% 55%" }, { scale: 1, duration: 1.5, ease: "power2.out", immediateRender: false }, VOS - 0.06);
      dibujar(q(".s04-muro"), VOS - 0.06, 0.3);
      dibujar(q(".s04-mostrador"), VOS, 0.25);
      ["s04-c1", "s04-c2", "s04-c3"].forEach((c, i) => pop(q("." + c), VOS + 0.05 + i * 0.05));
      golpe(q(".s04-duenio"), VOS + 0.08, 2.2);
      gsap.set(q(".s04-duenio"), { transformOrigin: "50% 50%" });
      gsap.set(q(".s04-vos"), { opacity: 0 });
      tl.to(q(".s04-vos"), { opacity: 1, duration: 0.1 }, VOS + 0.1);
      sacudon(VOS + 0.1, 0.8);
      // el cono crece desde el dueño
      gsap.set(q(".s04-conosvg"), { opacity: 0 });
      tl.fromTo(q(".s04-conosvg"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, transformOrigin: "175px 280px", duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, CUIDAS);
      tl.to(q(".s04-conosvg"), { rotation: 8, transformOrigin: "175px 280px", duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, CUIDAS + 0.4);
