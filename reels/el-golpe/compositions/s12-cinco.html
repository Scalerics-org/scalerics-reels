      // "cinco?": el 5 cae de golpe

        tl.to(paso, { skewX: sx, duration: 0.01 }, NO + d);
      });
      tl.to(q(".s12-paso-a"), { x: -60, y: -30, rotation: -6, opacity: 0.35, duration: 0.3, ease: "power3.out" }, NO + 0.18);
      tl.to(q(".s12-paso-b"), { x: 70, y: 40, rotation: 5, opacity: 0.35, duration: 0.3, ease: "power3.out" }, NO + 0.18);
      tl.to(q(".s12-signo"), { opacity: 0, duration: 0.1 }, NO);
      tl.to(q(".s12-cinco"), { y: 250, rotation: 0, duration: 0.5, ease: "bounce.out" }, NO + 0.04);

      tl.to(q(".s12-cinco"), { opacity: 0.4, duration: 0.2 }, NO + 0.6);

      gsap.set(q(".s12-plan"), { opacity: 0 });
      gsap.set([q(".s12-x1"), q(".s12-x2")], { opacity: 0 });
