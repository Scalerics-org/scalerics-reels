  <script>
    (function () {
      const ID = "s14-cta";
      const DUR = 6.0;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s14-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (el, t) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.08);
      };

      const A = 1.52;
      const ROBA = 1.98;
      const NADIE = 2.3;

      // cuadro 0: el globo y la frase de arriba ya están
      tl.fromTo(q(".s14-globo"), { scale: 0.8, opacity: 0.4, transformOrigin: "20% 100%" }, { scale: 1, opacity: 1, transformOrigin: "20% 100%", duration: 0.3, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".s14-dice"), { opacity: 0.4, x: -40 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 0);
      tl.fromTo(q(".s14-escenario"), { scale: 1.05 }, { scale: 1, duration: 2.4, ease: "power1.out", transformOrigin: "50% 55%" }, 0);
      // alguien está escribiendo...
      [".s14-p1", ".s14-p2", ".s14-p3"].forEach((p, i) => tl.to(q(p), { y: -18, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.15 + i * 0.12));
      tl.to(q(".s14-puntos"), { opacity: 0, duration: 0.08 }, A - 0.1);

      // "a mí no me ... roba ... nadie": cae palabra por palabra
      golpe(q(".s14-l1"), A);
      sacudon(A + 0.04, 0.7);
      golpe(q(".s14-roba"), ROBA);
      golpe(q(".s14-nadie"), NADIE);
      sacudon(NADIE + 0.04, 1.3);

      // el antifaz se dibuja sobre el globo y le guiña
      const antifaz = q(".s14-antifaz");
      const L = antifaz.getTotalLength();
      gsap.set(antifaz, { strokeDasharray: L, strokeDashoffset: L, fillOpacity: 0 });
      gsap.set(q(".s14-mascara"), { opacity: 0, rotation: -6 });
      gsap.set([q(".s14-ojo-i"), q(".s14-ojo-d")], { opacity: 0 });
      tl.to(q(".s14-mascara"), { opacity: 1, duration: 0.02 }, 1.5);
      tl.to(antifaz, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 1.5);
      tl.to(antifaz, { fillOpacity: 1, duration: 0.2 }, 1.9);
      tl.to([q(".s14-ojo-i"), q(".s14-ojo-d")], { opacity: 1, duration: 0.15 }, 1.95);
      tl.to(q(".s14-mascara"), { rotation: 4, y: -8, duration: 0.3, ease: "back.out(2)" }, 2.1);
      const guino = (t) => tl.to(q(".s14-ojo-d"), { scaleY: 0.08, transformOrigin: "50% 50%", duration: 0.08, yoyo: true, repeat: 1, repeatDelay: 0.18, ease: "power2.in" }, t);
      guino(2.45);

      // sello: FAMOSAS ÚLTIMAS PALABRAS
      gsap.set(q(".s14-sello"), { opacity: 0, rotation: -5 });
      tl.fromTo(q(".s14-sello"), { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.13, ease: "power4.in", immediateRender: false }, 2.68);
      sacudon(2.83, 1);

      // la flecha de marcador al botón de compartir
      const flecha = q(".s14-flecha");
      const Lf = flecha.getTotalLength();
      gsap.set(flecha, { strokeDasharray: Lf, strokeDashoffset: Lf, opacity: 0 });
      gsap.set([q(".s14-punta"), q(".s14-boton")], { opacity: 0 });
      tl.to(flecha, { opacity: 1, duration: 0.02 }, 3.2);
      tl.to(flecha, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 3.2);
      tl.to(q(".s14-punta"), { opacity: 1, duration: 0.05 }, 3.62);
      tl.fromTo(q(".s14-boton"), { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(3)", immediateRender: false }, 3.6);

      // hasta el final: todo late suave, nada quieto (sin salida)
      tl.to(q(".s14-globo"), { scale: 1.02, transformOrigin: "50% 50%", duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.0);
      tl.to([q(".s14-l1"), q(".s14-l2")], { scale: 1.03, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.0);
      tl.to(q(".s14-nadie"), { color: "#ffd23f", duration: 0.2 }, 3.3);
      tl.to([q(".s14-flecha"), q(".s14-punta")], { x: 14, y: 12, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 3.9);
      tl.fromTo(q(".s14-anillo"), { scale: 1, opacity: 1, transformOrigin: "50% 50%" }, { scale: 1.8, opacity: 0, transformOrigin: "50% 50%", duration: 0.7, repeat: 2, ease: "power2.out", immediateRender: false }, 3.9);
      tl.to(q(".s14-sello"), { rotation: -3, scale: 1.03, duration: 0.45, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.2);
      tl.to(q(".s14-mascara"), { rotation: -2, y: 4, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.4);
      guino(4.7);
      tl.to(q(".s14-escenario"), { scale: 1.03, duration: DUR - 3.6, ease: "none", transformOrigin: "50% 55%" }, 3.6);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
