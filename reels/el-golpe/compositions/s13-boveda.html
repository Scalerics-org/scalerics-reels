  <script>
    (function () {
      const ID = "s13-boveda";
      const DUR = 7.86;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s13-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.08);
      };
      const pegar = (sel, t) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, t);
      };
      // ruta roja que llega, choca y se rompe contra lo que protege
      const choque = (ruta, chispa, prot, t0, t1, desde) => {
        const r = q(ruta), ch = q(chispa);
        gsap.set(r, { opacity: 0, clipPath: desde });
        gsap.set(ch, { opacity: 0 });
        // se destapa como en s01, con clip-path desde donde arranca
        tl.to(r, { opacity: 1, duration: 0.02 }, t0);
        tl.to(r, { clipPath: "inset(0% 0% 0% 0%)", duration: t1 - t0, ease: "power2.in" }, t0);
        tl.fromTo(ch, { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.2, transformOrigin: "50% 50%", duration: 0.12, ease: "power3.out", immediateRender: false }, t1);
        tl.to(ch, { opacity: 0, duration: 0.3 }, t1 + 0.18);
        tl.to(r, { opacity: 0.18, duration: 0.25 }, t1 + 0.05);
        tl.to(q(prot), { scale: 1.1, transformOrigin: "50% 50%", duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, t1);
      };

      const CONTESTA = 0.58;
      const PUNTOS = 1.48;
      const RETIENEN = 1.98;
      const WEB = 2.9;
      const MAPA = 4.12;
      const CERRALE = 5.12;
      const BOVEDA = 5.76;
      const LO = 6.52;
      const NOS = 6.88;

      // cuadro 0: el local ya está; la cámara baja despacio
      tl.fromTo(q(".s13-mundo"), { scale: 1.06, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 5.0, ease: "none" }, 0);
      tl.fromTo(q(".s13-local"), { opacity: 0.4, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);
      ["s13-c1", "s13-c2", "s13-c3"].forEach((c, i) => tl.fromTo(q("." + c), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(3)" }, 0.1 + i * 0.07));
      tl.fromTo(q(".s13-toldo"), { opacity: 0.3 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 3 }, 0.1);

      // "Bot que contesta"
      tl.fromTo(q(".s13-rot1"), { opacity: 0.5, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in" }, 0);
      pegar(".s13-bot", 0.02);
      gsap.set(q(".s13-burbuja"), { opacity: 0 });
      tl.fromTo(q(".s13-burbuja"), { opacity: 0, scale: 0.2, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, transformOrigin: "0% 100%", duration: 0.22, ease: "back.out(3)", immediateRender: false }, CONTESTA - 0.04);
      choque(".s13-r1", ".s13-ch1", ".s13-bot", 0.3, 0.9, "inset(100% 0% 0% 0%)");
      sacudon(0.92, 0.8);
      tl.to(q(".s13-rot1"), { opacity: 0, y: -30, duration: 0.12 }, PUNTOS - 0.12);

      // "Puntos que retienen": los clientes intentan salir y se quedan
      golpe(".s13-rot2", PUNTOS);
      pegar(".s13-puntos", PUNTOS - 0.04);
      gsap.set(root.querySelectorAll(".s13-s"), { opacity: 0 });
      tl.fromTo(root.querySelectorAll(".s13-s"), { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.14, stagger: 0.06, ease: "back.out(3)", immediateRender: false }, PUNTOS + 0.15);
      tl.to([q(".s13-c1"), q(".s13-c2"), q(".s13-c3")], { x: 70, duration: 0.18, ease: "power2.out", stagger: 0.04 }, RETIENEN - 0.25);
      tl.to([q(".s13-c1"), q(".s13-c2"), q(".s13-c3")], { x: 0, duration: 0.35, ease: "back.out(3)", stagger: 0.04 }, RETIENEN);
      choque(".s13-r2", ".s13-ch2", ".s13-puntos", 1.75, 2.3, "inset(100% 0% 0% 0%)");
      sacudon(2.32, 0.8);
      tl.to(q(".s13-rot2"), { opacity: 0, y: -30, duration: 0.12 }, WEB - 0.12);

      // "Web ... en el mapa": pin verde
      golpe(".s13-rot3", WEB);
      gsap.set(q(".s13-web"), { opacity: 0 });
      tl.fromTo(q(".s13-web"), { opacity: 0, y: -200 }, { opacity: 1, y: 0, duration: 0.3, ease: "bounce.out", immediateRender: false }, WEB - 0.04);
      tl.to(q(".s13-web"), { y: -14, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.3);
      choque(".s13-r3", ".s13-ch3", ".s13-web", 3.5, MAPA, "inset(0% 0% 0% 100%)");
      sacudon(MAPA + 0.02, 1);
      tl.to([q(".s13-bot"), q(".s13-puntos"), q(".s13-web")], { scale: 1.06, transformOrigin: "50% 50%", duration: 0.2, yoyo: true, repeat: 1, stagger: 0.1 }, 4.4);
      tl.to(q(".s13-rot3"), { opacity: 0, y: -30, duration: 0.15 }, CERRALE - 0.15);

      // "Cerrale la bóveda": la puerta llega girando y cierra en "bóveda" (flash del ambiente)
      gsap.set(q(".s13-boveda"), { opacity: 0 });
      tl.fromTo(q(".s13-boveda"), { opacity: 0, x: -900, rotation: -200, transformOrigin: "50% 50%" }, { opacity: 1, x: 0, rotation: 0, transformOrigin: "50% 50%", duration: BOVEDA - CERRALE, ease: "power3.in", immediateRender: false }, CERRALE);
      tl.fromTo(q(".s13-rueda"), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 270, transformOrigin: "50% 50%", duration: 0.6, ease: "back.out(1.6)", immediateRender: false }, BOVEDA);
      tl.to(q(".s13-mundo"), { opacity: 0.12, duration: 0.2 }, BOVEDA - 0.1);
      sacudon(BOVEDA + 0.02, 1.8);
      gsap.set(q(".s13-cerrada"), { opacity: 0 });
      tl.fromTo(q(".s13-cerrada"), { opacity: 0, scale: 2.2, rotation: -8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: -6, transformOrigin: "50% 50%", duration: 0.13, ease: "power4.in", immediateRender: false }, BOVEDA + 0.18);
      sacudon(BOVEDA + 0.32, 0.7);
      tl.to(q(".s13-boveda"), { filter: "drop-shadow(0 0 30px rgba(92,230,17,0.6))", duration: 0.25 }, BOVEDA + 0.05);

      // "lo hacemos nosotros": la bóveda sube y se achica
      tl.to(q(".s13-boveda"), { scale: 0.56, y: -220, duration: 0.3, ease: "power3.inOut" }, LO - 0.2);
      golpe(".s13-lo", LO);
      golpe(".s13-nos", NOS);
      sacudon(NOS + 0.04, 1.2);
      tl.to(q(".s13-rueda"), { rotation: 330, duration: 0.8, ease: "sine.inOut" }, 6.8);

      // salida: barrido hacia la izquierda, como pasar la hoja del plan
      tl.to(q("#s13-escena"), { x: -300, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
