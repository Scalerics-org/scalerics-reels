  <script>
    (function () {
      const ID = "s04-pedidos";
      const DUR = 3.99;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (palabras de la locución)
      const SIETE = 0.3;
      const PEDIDOS = 0.9;
      const TIENDA = 1.6;
      const COBRADOS = 2.8;

      const miles = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const etiqueta = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, t);

      // el panel se abre con corte (arranca ya visible, aplastado) y la cámara empuja hacia adentro
      tl.fromTo(q(".s04-panel"), { scaleY: 0.4, svgOrigin: "540 920" }, { scaleY: 1, svgOrigin: "540 920", duration: 0.2, ease: "expo.out" }, 0);
      tl.fromTo(q(".s04-zoom"), { scale: 0.96 }, { scale: 1.03, duration: COBRADOS, ease: "power1.inOut" }, 0);
      tl.to(q(".s04-zoom"), { scale: 1, duration: 0.3, ease: "back.out(3)" }, COBRADOS);
      tl.fromTo(q(".s04-mini-aro"), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 480, transformOrigin: "50% 50%", duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s04-mini-c"), { scale: 0.8, transformOrigin: "50% 50%" }, { scale: 1.5, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 31, ease: "sine.inOut" }, 0);

      // las siete filas entran de a una, muy rápido, con destello
      const filas = qa(".s04-fila");
      const flashes = qa(".s04-flash");
      const esperas = qa(".s04-espera");
      const sellos = qa(".s04-sello");
      const montos = qa(".s04-monto");
      gsap.set(filas, { opacity: 0, x: 80 });
      gsap.set(flashes, { opacity: 0 });
      gsap.set(sellos, { opacity: 0 });
      filas.forEach((f, i) => {
        const t = SIETE - 0.08 + i * 0.095;
        tl.to(f, { opacity: 1, x: 0, duration: 0.14, ease: "power3.out" }, t);
        tl.fromTo(flashes[i], { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
      });
      const cuenta = q(".s04-cuenta");
      const c = { v: 0 };
      tl.fromTo(c, { v: 0 }, { v: 7, duration: 7 * 0.095, ease: "none", onUpdate: () => { cuenta.textContent = String(Math.min(7, Math.floor(c.v + 0.001))); } }, SIETE - 0.08);
      tl.to(cuenta, { fill: "#5ce611", duration: 0.1 }, PEDIDOS);
      // glitch del bloque al completar
      [[12, 0], [-8, 0.03], [5, 0.06], [0, 0.09]].forEach(([x, d]) => tl.to(q(".s04-filas"), { x, duration: 0.03, ease: "none" }, PEDIDOS + d));

      // mientras tanto: los pagos se procesan (puntos que laten + barrido)
      esperas.forEach((e, i) => tl.fromTo(e, { opacity: 1 }, { opacity: 0.25, duration: 0.18, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, PEDIDOS + 0.1 + i * 0.05));
      const scan = q(".s04-scan");
      tl.fromTo(scan, { y: 712 }, { y: 1112, duration: 0.6, ease: "power1.inOut" }, PEDIDOS + 0.15);
      tl.to(scan, { opacity: 0.9, duration: 0.05 }, PEDIDOS + 0.15);
      tl.to(scan, { y: 712, duration: 0.6, ease: "power1.inOut" }, PEDIDOS + 0.75);
      tl.to(scan, { y: 1112, duration: 0.5, ease: "power1.inOut" }, PEDIDOS + 1.35);
      tl.to(scan, { opacity: 0, duration: 0.1 }, COBRADOS - 0.1);
      // "en la tienda": el título se prende
      tl.fromTo(q(".s04-titulo"), { opacity: 1 }, { opacity: 0.35, duration: 0.06, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, TIENDA);
      tl.to(q(".s04-titulo"), { fill: "#e8f6ff", duration: 0.15 }, TIENDA + 0.25);

      // "cobrados": sellos PAGADO en cascada
      sellos.forEach((s, i) => {
        const t = COBRADOS + i * 0.07;
        tl.to(esperas[i], { opacity: 0, duration: 0.04 }, t);
        tl.fromTo(s, { scale: 1.9, rotation: -10, transformOrigin: "50% 50%" }, { scale: 1, rotation: -3, transformOrigin: "50% 50%", duration: 0.18, ease: "back.out(2.5)", immediateRender: false }, t);
        tl.to(s, { opacity: 1, duration: 0.05 }, t);
        tl.to(montos[i], { fill: "#5ce611", duration: 0.1 }, t + 0.05);
      });

      // total que cuenta hacia arriba con brillo verde
      const total = q(".s04-total");
      const tot = { v: 0 };
      tl.fromTo(tot, { v: 0 }, { v: 18450, duration: 0.75, ease: "power2.out", onUpdate: () => { total.textContent = "$ " + miles(Math.round(tot.v / 10) * 10); } }, COBRADOS + 0.05);
      tl.to(total, { fill: "#5ce611", duration: 0.15 }, COBRADOS + 0.05);
      tl.fromTo(total, { filter: "drop-shadow(0 0 0px rgba(92, 230, 17, 0))" }, { filter: "drop-shadow(0 0 18px rgba(92, 230, 17, 0.95))", duration: 0.3, ease: "power2.out", immediateRender: false }, COBRADOS + 0.05);
      tl.fromTo(total, { scale: 1, transformOrigin: "100% 50%" }, { scale: 1.12, transformOrigin: "100% 50%", duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, COBRADOS + 0.8);

      // etiquetas
      etiqueta(q(".s04-e1"), PEDIDOS);
      tl.to(q(".s04-e1"), { opacity: 0, y: -10, duration: 0.15 }, COBRADOS - 0.1);
      etiqueta(q(".s04-e2"), COBRADOS + 0.05);

      // salida: corte
      tl.to(q("#s04-escena"), { opacity: 0, scaleY: 0.02, transformOrigin: "50% 47%", duration: 0.18, ease: "power3.in" }, DUR - 0.18);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
