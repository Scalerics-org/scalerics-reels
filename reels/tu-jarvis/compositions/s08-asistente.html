  <script>
    (function () {
      const ID = "s08-asistente";
      const DUR = 6.5;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (palabras)
      const ASISTENTE = 0.11, ATIENDE = 0.71, CUALQUIER = 1.61, HORA = 2.31;
      const ACUERDA = 2.87, CLIENTE = 3.71, AVISA = 4.61, SOLO = 4.91, IMPORTA = 5.51;

      // dibujar un trazo (invisible hasta que arranca)
      function dibujar(el, t, dur) {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.01 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: dur || 0.35, ease: "power2.inOut" }, t);
      }
      function glitch(el, t) {
        [[-16, 0], [12, 0.03], [-7, 0.06], [0, 0.09]].forEach(([x, d]) => tl.to(el, { x, duration: 0.03, ease: "none" }, t + d));
      }
      function etiqueta(sel, t, prev) {
        if (prev) tl.to(q(prev), { opacity: 0, y: -10, duration: 0.15 }, t - 0.05);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, t);
      }

      // ---- cámara: arranca cerca y se abre; después se corre hacia cada módulo ----
      const cam = q(".s08-cam");
      tl.fromTo(cam, { scale: 1.12, transformOrigin: "540px 900px" }, { scale: 1, transformOrigin: "540px 900px", duration: 0.6, ease: "expo.out" }, 0);
      tl.to(cam, { x: 16, y: 6, scale: 1.02, duration: 0.45, ease: "power3.out" }, ATIENDE);
      tl.to(cam, { x: -16, y: 6, scale: 1.02, duration: 0.45, ease: "power3.out" }, ACUERDA);
      tl.to(cam, { x: 0, y: -14, scale: 1.03, duration: 0.45, ease: "power3.out" }, AVISA);
      tl.to(cam, { x: 0, y: 0, scale: 1, duration: 0.6, ease: "power2.inOut" }, IMPORTA + 0.2);

      // ---- el núcleo: siempre girando, acelera en "a cualquier hora" ----
      const O = "540 850";
      [["a", 70, 330, 400], ["b", -50, -260, -310], ["c", 110, 470, 560]].forEach(([k, r1, r2, r3]) => {
        const el = q(".s08-anillo-" + k);
        tl.fromTo(el, { rotation: 0, svgOrigin: O }, { rotation: r1, svgOrigin: O, duration: CUALQUIER, ease: "none" }, 0);
        tl.to(el, { rotation: r2, svgOrigin: O, duration: HORA - CUALQUIER, ease: "power2.inOut" }, CUALQUIER);
        tl.to(el, { rotation: r3, svgOrigin: O, duration: DUR - HORA, ease: "none" }, HORA);
      });
      tl.fromTo(q(".s08-nucleo"), { scale: 0.75, opacity: 0.6, svgOrigin: O }, { scale: 1, opacity: 1, svgOrigin: O, duration: 0.45, ease: "back.out(1.7)" }, 0);
      // late con cada módulo que activa
      [ASISTENTE, ATIENDE, ACUERDA, AVISA, IMPORTA].forEach((t) => {
        tl.fromTo(q(".s08-centro"), { scale: 1.35, svgOrigin: O }, { scale: 1, svgOrigin: O, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(q(".s08-aro"), { scale: 0.8, opacity: 1, svgOrigin: O }, { scale: 3.4, opacity: 0, svgOrigin: O, duration: 0.6, ease: "power2.out", immediateRender: false }, t);
      });
      gsap.set(q(".s08-aro"), { opacity: 0 });

      // ---- MÓDULO A: WhatsApp 24/7 ----
      const A = q(".s08-mod-a");
      gsap.set(A, { x: -160, opacity: 0 });
      dibujar(q(".s08-con-a"), ATIENDE - 0.1, 0.25);
      tl.to(A, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, ATIENDE);
      glitch(A, ATIENDE + 0.4);
      gsap.set(q(".s08-247"), { opacity: 0 });
      tl.fromTo(q(".s08-247"), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)", immediateRender: false }, ATIENDE + 0.25);
      tl.to(q(".s08-ok-dot"), { opacity: 0.2, duration: 0.15, yoyo: true, repeat: 15, ease: "steps(1)" }, ATIENDE + 0.4);
      // reloj: gira normal y en "cualquier hora" da vueltas rapidísimo
      const H = q(".s08-aguja-h"), M = q(".s08-aguja-m");
      tl.fromTo(M, { rotation: 0, transformOrigin: "0% 50%" }, { rotation: 180, transformOrigin: "0% 50%", duration: CUALQUIER - ATIENDE, ease: "none" }, ATIENDE);
      tl.to(M, { rotation: 180 + 360 * 5, transformOrigin: "0% 50%", duration: HORA - CUALQUIER, ease: "power2.inOut" }, CUALQUIER);
      tl.to(M, { rotation: 180 + 360 * 5 + 90, transformOrigin: "0% 50%", duration: DUR - HORA, ease: "none" }, HORA);
      tl.fromTo(H, { rotation: 0, transformOrigin: "50% 100%" }, { rotation: 20, transformOrigin: "50% 100%", duration: CUALQUIER - ATIENDE, ease: "none" }, ATIENDE);
      tl.to(H, { rotation: 20 + 360 * 1.5, transformOrigin: "50% 100%", duration: HORA - CUALQUIER, ease: "power2.inOut" }, CUALQUIER);
      // la hora que se ve va pasando: 09:00 → … → 03:20
      const horas = qa(".s08-hora");
      gsap.set(horas.slice(1), { opacity: 0 });
      horas.forEach((h, i) => {
        if (i === 0) return;
        const t = CUALQUIER + 0.12 + (i - 1) * 0.15;
        tl.to(horas[i - 1], { opacity: 0, duration: 0.02 }, t);
        tl.to(h, { opacity: 1, duration: 0.02 }, t);
      });
      tl.fromTo(q(".s08-horas"), { scale: 1.25, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)", immediateRender: false }, HORA - 0.1);

      // ---- MÓDULO B: memoria de clientes ----
      const B = q(".s08-mod-b");
      gsap.set(B, { x: 160, opacity: 0 });
      tl.to(A, { opacity: 0.55, duration: 0.3 }, ACUERDA);
      dibujar(q(".s08-con-b"), ACUERDA - 0.1, 0.25);
      tl.to(B, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, ACUERDA);
      glitch(B, ACUERDA + 0.4);
      const filas = qa(".s08-fila");
      gsap.set(filas, { opacity: 0, x: 40 });
      tl.to(filas, { opacity: 1, x: 0, duration: 0.25, stagger: 0.06, ease: "power3.out" }, ACUERDA + 0.15);
      // contador de fichas
      const cnt = q(".s08-cnt");
      const num = { v: 0 };
      const fmt = (n) => { const s = String(Math.round(n)); return s.length > 3 ? s.slice(0, -3) + "." + s.slice(-3) : s; };
      tl.to(num, { v: 1284, duration: 0.9, ease: "power2.out", onUpdate: () => { cnt.textContent = fmt(num.v); } }, ACUERDA + 0.1);
      // "cliente": las fichas se barajan y caen en ROSA
      tl.to(q(".s08-lista"), { y: -216, duration: 0.65, ease: "expo.inOut" }, CLIENTE - 0.2);
      tl.to(q(".s08-rosa-rect"), { stroke: "#5ce611", fill: "rgba(92,230,17,0.10)", duration: 0.15 }, CLIENTE + 0.45);
      tl.to(q(".s08-rosa-txt"), { fill: "#5ce611", duration: 0.15 }, CLIENTE + 0.45);
      tl.fromTo(q(".s08-rosa"), { scale: 1.08, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)", immediateRender: false }, CLIENTE + 0.45);

      // ---- MÓDULO C: alertas ----
      const C = q(".s08-mod-c");
      gsap.set(C, { y: 90, opacity: 0 });
      tl.to(B, { opacity: 0.55, duration: 0.3 }, AVISA);
      dibujar(q(".s08-con-c"), AVISA - 0.1, 0.2);
      tl.to(C, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, AVISA);
      const minis = qa(".s08-mini");
      gsap.set(minis, { opacity: 0, x: -50 });
      tl.to(minis, { opacity: 1, x: 0, duration: 0.15, stagger: 0.04, ease: "power3.out" }, AVISA + 0.1);
      gsap.set(q(".s08-c-n2"), { opacity: 0 });
      // "solo": todas corren al filtro; pasa una sola
      tl.to(minis, { x: 54, duration: 0.25, stagger: 0.05, ease: "power2.in" }, SOLO);
      minis.forEach((m, i) => {
        if (m.classList.contains("s08-mini-ok")) return;
        tl.to(m, { scaleX: 0, opacity: 0, transformOrigin: "100% 50%", duration: 0.12, ease: "power2.in" }, SOLO + 0.25 + i * 0.05);
      });
      tl.to(q(".s08-filtro"), { opacity: 0.3, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, SOLO + 0.25);
      tl.to(q(".s08-mini-ok-r"), { stroke: "#ffb020", strokeOpacity: 1, duration: 0.1 }, SOLO + 0.3);
      tl.to(q(".s08-mini-ok"), { x: 170, opacity: 0, duration: 0.25, ease: "power2.in" }, SOLO + 0.4);
      tl.to(q(".s08-c-n1"), { opacity: 0, duration: 0.05 }, IMPORTA - 0.1);
      tl.to(q(".s08-c-n2"), { opacity: 1, duration: 0.05 }, IMPORTA - 0.1);
      const S = q(".s08-sobrevive");
      gsap.set(S, { opacity: 0 });
      tl.fromTo(S, { opacity: 0, scale: 0.7, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, transformOrigin: "0% 50%", duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, IMPORTA - 0.15);
