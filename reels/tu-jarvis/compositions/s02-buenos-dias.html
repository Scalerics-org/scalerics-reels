  <script>
    (function () {
      const ID = "s02-buenos-dias";
      const DUR = 1.59;
      const NS = "http://www.w3.org/2000/svg";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const DIAS = 0.25;
      const MARTIN = 0.55;

      // texto que se tipea letra por letra (tspans con opacity)
      function tipear(el, t0, dt) {
        const txt = el.textContent;
        el.textContent = "";
        const letras = Array.from(txt).map((ch) => {
          const s = document.createElementNS(NS, "tspan");
          s.textContent = ch;
          el.appendChild(s);
          return s;
        });
        gsap.set(letras, { opacity: 0 });
        letras.forEach((s, i) => tl.to(s, { opacity: 1, duration: 0.02, ease: "none" }, t0 + i * dt));
      }

      // el panel se abre con corte (arranca ya visible, aplastado)
      tl.fromTo(q(".s02-panel"), { scaleY: 0.4, svgOrigin: "540 920" }, { scaleY: 1, svgOrigin: "540 920", duration: 0.18, ease: "expo.out" }, 0);
      tl.fromTo(q(".s02-zoom"), { scale: 1.07 }, { scale: 1, duration: DUR, ease: "power2.out" }, 0);

      // núcleo: pop, anillos girando y centro que late con la voz
      tl.fromTo(q(".s02-nucleo"), { scale: 0.7, opacity: 0.6, svgOrigin: "250 770" }, { scale: 1, opacity: 1, svgOrigin: "250 770", duration: 0.3, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".s02-anillo-a"), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 160, transformOrigin: "50% 50%", duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s02-anillo-b"), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: -120, transformOrigin: "50% 50%", duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s02-anillo-c"), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 240, transformOrigin: "50% 50%", duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s02-centro"), { scale: 0.8, transformOrigin: "50% 50%" }, { scale: 1.45, transformOrigin: "50% 50%", duration: 0.09, yoyo: true, repeat: 13, ease: "sine.inOut" }, 0.02);

      // la hora: 06:59 salta a 07:00 con glitch
      gsap.set(q(".s02-h2"), { opacity: 0 });
      tl.fromTo(q(".s02-h1"), { x: 0 }, { x: 8, duration: 0.03, yoyo: true, repeat: 3, ease: "none" }, 0.1);
      tl.to(q(".s02-h1"), { opacity: 0, duration: 0.02 }, DIAS);
      tl.to(q(".s02-h2"), { opacity: 1, duration: 0.02 }, DIAS);
      [[-16, 0], [12, 0.04], [-6, 0.08], [0, 0.12]].forEach(([x, d]) => tl.to(q(".s02-h2"), { x, duration: 0.03, ease: "none" }, DIAS + d));

      // el saludo se tipea
      tipear(q(".s02-saludo"), 0.04, 0.04);

      // el sol se prende y gira
      gsap.set(q(".s02-sol"), { opacity: 0 });
      tl.fromTo(q(".s02-sol"), { scale: 0.4, svgOrigin: "830 770" }, { scale: 1, svgOrigin: "830 770", duration: 0.3, ease: "back.out(2.2)" }, 0.12);
      tl.to(q(".s02-sol"), { opacity: 1, duration: 0.1 }, 0.12);
      tl.fromTo(q(".s02-rayos"), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 90, transformOrigin: "50% 50%", duration: DUR, ease: "none" }, 0);

      // barrido de escaneo por el panel
      tl.fromTo(q(".s02-scan"), { y: 680 }, { y: 1200, duration: 0.6, ease: "power1.inOut" }, 0.35);
      tl.to(q(".s02-scan"), { opacity: 1, duration: 0.05 }, 0.35);
      tl.to(q(".s02-scan"), { opacity: 0, duration: 0.1 }, 0.9);

      // los sistemas que ya están andando
      const chips = qa(".s02-chip");
      gsap.set(chips, { opacity: 0, y: 10 });
      chips.forEach((c, i) => tl.to(c, { opacity: 1, y: 0, duration: 0.16, ease: "back.out(2)" }, 0.72 + i * 0.14));

      // etiqueta
      tl.fromTo(q(".s02-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, MARTIN);

      // salida: corte
      tl.to(q("#s02-escena"), { opacity: 0, scaleY: 0.02, transformOrigin: "50% 47%", duration: 0.15, ease: "power3.in" }, DUR - 0.15);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
