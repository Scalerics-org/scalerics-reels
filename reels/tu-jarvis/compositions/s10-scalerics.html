      <div class="s10-ident">// IDENTIFICANDO</div>
      <div class="s10-titulo">

      <div class="etiqueta">

  <script>
    (function () {
      const ID = "s10-scalerics";
      const DUR = 7.52;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (palabras, relativos a la escena)
      const SCALERICS = 0.44;
      const ARMAMOS = 1.4;
      const COMERCIOS = 1.8;
      const BOT = 3.0;
      const CONTESTA = 3.3;
      const PUNTOS = 4.3;
      const VOLVER = 4.9;
      const TIENDA = 5.8;
      const VENDE = 6.4;

      // estado inicial: lo de la fase 2 escondido (set, no fromTo)
      gsap.set([q(".s10-nucleo"), ...qa(".s10-card"), ...qa(".s10-con"), q(".s10-marca"), q(".s10-sub"), q(".s10-scan")], { opacity: 0 });
      gsap.set([q(".s10-tipeo"), q(".s10-bur-out"), q(".s10-bur-in"), ...qa(".s10-moneda"), ...qa(".activo")], { opacity: 0 });

      // ---- FASE 1: identificación ----
      // cuadro 0 ya tiene el marco y el texto tipeándose
      tl.fromTo(q(".s10-marco"), { scale: 1.12, opacity: 0.5, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 0);
      tl.fromTo(q(".s10-ident"), { clipPath: "inset(0 70% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "steps(10)" }, 0);
      tl.to(q(".s10-ident"), { opacity: 0.3, duration: 0.08, yoyo: true, repeat: 3, ease: "none" }, 0.4);
      // "Scalerics": entra con glitch
      const marca = q(".s10-marca");
      tl.to(marca, { opacity: 1, duration: 0.04 }, SCALERICS);
      [[-20, 0.0], [14, 0.04], [-8, 0.08], [0, 0.12]].forEach(([x, d]) => tl.to(marca, { x, duration: 0.03, ease: "none" }, SCALERICS + d));
      tl.fromTo(marca, { scale: 1.15 }, { scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, SCALERICS);
      tl.to(q(".s10-ident"), { opacity: 0, duration: 0.15 }, SCALERICS + 0.2);
      // línea de escaneo que cruza el nombre
      tl.to(q(".s10-scan"), { opacity: 1, duration: 0.05 }, SCALERICS + 0.15);
      tl.fromTo(q(".s10-scan"), { y: 800 }, { y: 950, duration: 0.45, ease: "power1.inOut", immediateRender: false }, SCALERICS + 0.15);
      tl.to(q(".s10-scan"), { y: 810, duration: 0.45, ease: "power1.inOut" }, SCALERICS + 0.6);
      tl.to(q(".s10-scan"), { opacity: 0, duration: 0.12 }, SCALERICS + 1.0);
      // "armamos": el marco late
      tl.to(q(".s10-marco"), { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, ARMAMOS);
      tl.to(marca, { opacity: 0.55, duration: 0.05, yoyo: true, repeat: 1, ease: "none" }, ARMAMOS + 0.05);
      // "comercios": la bajada se tipea
      tl.to(q(".s10-sub"), { opacity: 1, duration: 0.01 }, COMERCIOS - 0.35);
      tl.fromTo(q(".s10-sub"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "steps(14)", immediateRender: false }, COMERCIOS - 0.35);
      // zoom lento de la fase 1
      tl.fromTo(q(".s10-titulo"), { scale: 1 }, { scale: 1.04, transformOrigin: "540px 900px", duration: 2.3, ease: "none" }, 0.3);

      // ---- transición: el nombre sube a cabecera y aparece el núcleo ----
      const T = 2.55;
      tl.to(q(".s10-marco"), { scaleX: 0.02, opacity: 0, transformOrigin: "50% 50%", duration: 0.25, ease: "power3.in" }, T);
      tl.to(q(".s10-sub"), { opacity: 0, duration: 0.2 }, T);
      tl.to(q(".s10-titulo"), { y: -250, scale: 0.62, transformOrigin: "540px 900px", duration: 0.4, ease: "expo.inOut" }, T);
      const O = "540 870";
      tl.to(q(".s10-nucleo"), { opacity: 1, duration: 0.05 }, T + 0.2);
      tl.fromTo(q(".s10-nucleo"), { scale: 0.3, svgOrigin: O }, { scale: 1, svgOrigin: O, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, T + 0.2);
      tl.fromTo(q(".s10-centro-aro"), { scale: 0.6, opacity: 1, svgOrigin: O }, { scale: 4, opacity: 0, svgOrigin: O, duration: 0.6, ease: "power2.out", immediateRender: false }, T + 0.3);
      tl.fromTo(q(".s10-anillo-a"), { rotation: 0, svgOrigin: O }, { rotation: 240, svgOrigin: O, duration: DUR - T, ease: "none", immediateRender: false }, T);
      tl.fromTo(q(".s10-anillo-b"), { rotation: 0, svgOrigin: O }, { rotation: -180, svgOrigin: O, duration: DUR - T, ease: "none", immediateRender: false }, T);
      tl.fromTo(q(".s10-anillo-c"), { rotation: 0, svgOrigin: O }, { rotation: 320, svgOrigin: O, duration: DUR - T, ease: "none", immediateRender: false }, T);

      // helper: módulo que entra deslizándose, conector que se dibuja, y se activa en verde
      function modulo(letra, t, desde, tAct, etiqueta) {
        const card = q(".s10-card-" + letra);
        const con = q(".s10-con-" + letra);
        tl.to(card, { opacity: 1, duration: 0.08 }, t);
        tl.fromTo(card, desde, { x: 0, y: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, t);
        // glitch al llegar
        [[8, 0.4], [-6, 0.43], [0, 0.46]].forEach(([x, d]) => tl.to(card, { x, duration: 0.03, ease: "none" }, t + d));
        const L = con.getTotalLength();
        gsap.set(con, { strokeDasharray: L, strokeDashoffset: L });
        tl.to(con, { opacity: 1, duration: 0.01 }, t + 0.25);
        tl.to(con, { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, t + 0.25);
        // activación
        tl.fromTo(q(".s10-verde-" + letra), { opacity: 0 }, { opacity: 1, duration: 0.08, immediateRender: false }, tAct);
        tl.to(q(".s10-verde-" + letra), { opacity: 0.35, duration: 0.5, ease: "power2.out" }, tAct + 0.12);
        tl.to(q(".s10-act-" + letra), { opacity: 1, duration: 0.05 }, tAct);
        tl.to(q(".s10-centro"), { scale: 1.5, svgOrigin: O, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, tAct);
        // etiqueta
        const e = q(etiqueta);
        tl.fromTo(e, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, t + 0.1);
      }

      // BOT: entra desde la izquierda, la burbuja pregunta y contesta
      modulo("a", 2.85, { x: -380 }, CONTESTA + 0.3, ".s10-e1");
      tl.fromTo(q(".s10-bur-in"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, BOT);
      tl.to(q(".s10-tipeo"), { opacity: 1, duration: 0.05 }, BOT + 0.15);
      qa(".s10-tipeo circle").forEach((c, i) => tl.fromTo(c, { y: 0 }, { y: -6, duration: 0.1, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, BOT + 0.15 + i * 0.05));
      tl.to(q(".s10-tipeo"), { opacity: 0, duration: 0.05 }, CONTESTA + 0.05);
      tl.fromTo(q(".s10-bur-out"), { opacity: 0, scale: 0.7, transformOrigin: "100% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, CONTESTA + 0.05);

      // PUNTOS: entra desde la derecha, contador y la flecha gira en "volver"
      modulo("b", PUNTOS - 0.15, { x: 380 }, VOLVER, ".s10-e2");
      tl.to(q(".s10-e1"), { opacity: 0, duration: 0.1 }, PUNTOS - 0.05);
      const pts = { v: 0 };
      tl.to(pts, { v: 120, duration: 0.6, ease: "power2.out", onUpdate: () => (q(".s10-pts").textContent = "+" + Math.round(pts.v)) }, PUNTOS + 0.1);
      tl.fromTo(q(".s10-flecha"), { rotation: 0, svgOrigin: "815 870" }, { rotation: 360, svgOrigin: "815 870", duration: 0.6, ease: "power3.inOut", immediateRender: false }, VOLVER - 0.1);
      tl.fromTo(q(".s10-flecha"), { rotation: 360, svgOrigin: "815 870" }, { rotation: 450, svgOrigin: "815 870", duration: DUR - VOLVER - 0.5, ease: "none", immediateRender: false }, VOLVER + 0.5);

      // TIENDA: sube desde abajo, caen monedas al carrito
      modulo("c", TIENDA - 0.25, { y: 70 }, VENDE, ".s10-e3");
      tl.to(q(".s10-e2"), { opacity: 0, duration: 0.1 }, TIENDA - 0.15);
      qa(".s10-moneda").forEach((m, i) => {
        const t = VENDE - 0.1 + i * 0.12;
        tl.to(m, { opacity: 1, duration: 0.05 }, t);
        tl.fromTo(m, { y: -50 }, { y: 0, duration: 0.3, ease: "bounce.out", immediateRender: false }, t);
      });
      const ven = { v: 0 };
      tl.to(ven, { v: 7, duration: 0.6, ease: "steps(7)", onUpdate: () => (q(".s10-ventas").textContent = "+" + Math.round(ven.v)) }, VENDE);
      tl.to(q(".s10-carrito"), { y: 4, duration: 0.08, yoyo: true, repeat: 3, ease: "power2.out" }, VENDE + 0.1);

      // sin salida dura: s11 sigue con el mismo sistema en pantalla
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
