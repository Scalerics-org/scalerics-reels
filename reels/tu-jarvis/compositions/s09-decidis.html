  <script>
    (function () {
      const ID = "s09-decidis";
      const DUR = 1.91;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const DECIDIS = 0.21, EL = 1.1, HACE = 1.21, RESTO = 1.51;

      function dibujar(el, t, dur) {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.01 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t);
      }

      // entrada: los dos paneles chocan desde los costados (cuadro 0 ya a medio camino)
      tl.fromTo(q(".s09-vos"), { x: -110, opacity: 0.5 }, { x: 0, opacity: 1, duration: 0.22, ease: "expo.out" }, 0);
      tl.fromTo(q(".s09-el"), { x: 110, opacity: 0.5 }, { x: 0, opacity: 1, duration: 0.22, ease: "expo.out" }, 0);
      [[-10, 0.22], [8, 0.25], [0, 0.28]].forEach(([x, d]) => tl.to(q(".s09-el"), { x, duration: 0.03, ease: "none" }, d));

      // el mini núcleo de ÉL gira todo el tiempo
      tl.fromTo(q(".s09-mini-a"), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 260, transformOrigin: "50% 50%", duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s09-mini-b"), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: -320, transformOrigin: "50% 50%", duration: DUR, ease: "none" }, 0);

      // "decidís": el botón se aprieta y se pone verde
      const B = q(".s09-boton");
      tl.to(B, { scale: 0.9, transformOrigin: "50% 50%", duration: 0.07, ease: "power2.in" }, DECIDIS);
      tl.to(B, { scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(3)" }, DECIDIS + 0.07);
      tl.to(q(".s09-boton-fondo"), { fill: "#5ce611", stroke: "#5ce611", duration: 0.06 }, DECIDIS + 0.06);
      tl.to(q(".s09-boton-txt"), { fill: "#02121c", duration: 0.06 }, DECIDIS + 0.06);
      tl.fromTo(B, { filter: "drop-shadow(0 0 0px rgba(92,230,17,0))" }, { filter: "drop-shadow(0 0 22px rgba(92,230,17,0.9))", duration: 0.2, immediateRender: false }, DECIDIS + 0.06);
      gsap.set(q(".s09-onda"), { opacity: 0 });
      tl.fromTo(q(".s09-onda"), { opacity: 1, scale: 1, transformOrigin: "50% 50%" }, { opacity: 0, scale: 1.35, transformOrigin: "50% 50%", duration: 0.45, ease: "power2.out", immediateRender: false }, DECIDIS + 0.07);
      dibujar(q(".s09-check-grande"), DECIDIS + 0.15, 0.25);

      // la orden viaja hacia ÉL
      dibujar(q(".s09-con"), DECIDIS + 0.2, 0.25);
      gsap.set(q(".s09-pulso"), { opacity: 0 });
      tl.to(q(".s09-pulso"), { opacity: 1, duration: 0.02 }, DECIDIS + 0.2);
      tl.to(q(".s09-pulso"), { x: 156, duration: 0.3, ease: "power2.in" }, DECIDIS + 0.2);
      tl.to(q(".s09-pulso"), { opacity: 0, scale: 2, transformOrigin: "50% 50%", duration: 0.15 }, DECIDIS + 0.5);
      tl.fromTo(q(".s09-mini-c"), { scale: 1.7, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "power2.out", immediateRender: false }, DECIDIS + 0.5);

      // tareas en cola (grises), barra que arranca lenta
      const tareas = qa(".s09-tarea");
      gsap.set(tareas, { opacity: 0, x: 30 });
      tl.to(tareas, { opacity: 1, x: 0, duration: 0.15, stagger: 0.05, ease: "power3.out" }, DECIDIS + 0.45);
      qa(".s09-tick").forEach((t) => gsap.set(t, { opacity: 0 }));
      const barra = q(".s09-barra");
      gsap.set(barra, { scaleX: 0, transformOrigin: "0% 50%" });
      const pct = q(".s09-pct");
      const p = { v: 0 };
      const pinta = () => { pct.textContent = Math.round(p.v) + "%"; gsap.set(barra, { scaleX: p.v / 100 }); };
      tl.to(p, { v: 14, duration: HACE - (DECIDIS + 0.55), ease: "none", onUpdate: pinta }, DECIDIS + 0.55);
      // "hace el resto": a toda velocidad, checks en cascada
      tl.to(p, { v: 100, duration: RESTO + 0.12 - HACE, ease: "power3.in", onUpdate: pinta }, HACE);
      qa(".s09-tick").forEach((t, i) => dibujar(t, HACE + 0.04 + i * 0.07, 0.1));
      tl.to(qa(".s09-tarea text"), { fill: "#5ce611", duration: 0.05, stagger: 0.07 }, HACE + 0.08);
      tl.to(barra, { fill: "#5ce611", duration: 0.06 }, RESTO + 0.1);
      tl.to(pct, { fill: "#5ce611", duration: 0.06 }, RESTO + 0.1);
      tl.fromTo(q(".s09-el"), { scale: 1 }, { scale: 1.03, transformOrigin: "50% 50%", duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, RESTO + 0.1);

      // etiquetas
      tl.fromTo(q(".s09-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, DECIDIS);
      tl.to(q(".s09-e1"), { opacity: 0, y: -10, duration: 0.12 }, EL - 0.05);
      tl.fromTo(q(".s09-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, EL + 0.05);

      // salida: corte
      tl.to(q("#s09-escena"), { opacity: 0, scaleY: 0.02, transformOrigin: "50% 47%", duration: 0.15, ease: "power3.in" }, DUR - 0.15);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
