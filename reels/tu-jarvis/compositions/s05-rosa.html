    (function () {
      const ID = "s05-rosa";

      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // palabras
      const ROSA = 0.21, TRES = 0.81, SEMANAS = 1.11, NOVIENE = 1.71, AVISO = 3.11, PUNTOS = 3.91;
      const CONTESTO = 4.81, VIENE = 5.74, HOY = 6.01;

      // helpers
      const dibujar = (el, t, d = 0.5, ease = "power2.inOut") => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease }, t);
      };
      const tipear = (el, t, d) => {
        const txt = el.textContent;
        el.textContent = "";
        const spans = Array.from(txt).map((c) => { const s = document.createElement("span"); s.textContent = c; el.appendChild(s); return s; });
        gsap.set(spans, { opacity: 0 });
        tl.to(spans, { opacity: 1, duration: 0.01, stagger: d / spans.length, ease: "none" }, t);
      };
      const glitch = (el, t, amp = 14) => {
        [[-amp, 0], [amp * 0.7, 0.03], [-amp * 0.35, 0.06], [0, 0.09]].forEach(([x, d]) => tl.to(el, { x, duration: 0.03, ease: "none" }, t + d));
      };
      const aparece = (el, t, d = 0.25) => { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: d, ease: "power2.out" }, t); };
      const contar = (el, t, a, b, d) => {
        const o = { v: a };
        el.textContent = String(a);
        tl.to(o, { v: b, duration: d, ease: "power2.out", onUpdate: () => { el.textContent = String(Math.round(o.v)); } }, t);
      };

      // ---- estado inicial (lo que aparece después, escondido) ----
      qa(".s05-card-txt").forEach((el) => gsap.set(el, { opacity: 0 }));
      ["s05-activa", "s05-lbl-2", "s05-hoy", "s05-ok", "s05-alerta", "s05-barra-v", "s05-tecleo", "s05-resp", "s05-resp-txt", "s05-visto", "s05-card", "s05-card-tit", "s05-vuela", "s05-env", "s05-env-tilde", "s05-puntos", "s05-pct"].forEach((c) => gsap.set(q("." + c), { opacity: 0 }));

      // cámara: zoom lento todo el tiempo
      tl.fromTo(q(".s05-cam"), { scale: 1.06, transformOrigin: "540px 915px" }, { scale: 1, transformOrigin: "540px 915px", duration: 0.5, ease: "expo.out" }, 0);
      tl.to(q(".s05-cam"), { scale: 1.035, transformOrigin: "540px 915px", duration: 5.2, ease: "none" }, 0.5);

      // ---- entrada: ficha desde la izquierda, celular desde la derecha (cuadro 0 ya con algo) ----
      tl.fromTo(q(".s05-ficha"), { x: -110, opacity: 0.75 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 0);
      tl.fromTo(q(".s05-cel"), { x: 120, opacity: 0.7 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.05);
      tipear(q(".s05-tit"), 0.05, 0.3);
      tl.fromTo(q(".s05-rec"), { opacity: 1 }, { opacity: 0.2, duration: 0.25, yoyo: true, repeat: 13, ease: "steps(1)" }, 0);
      dibujar(q(".s05-av-aro"), 0.05, 0.45, "power3.out");
      qa(".s05-av").forEach((el, i) => dibujar(el, 0.15 + i * 0.08, 0.35));
      tipear(q(".s05-nombre"), ROSA, 0.32);
      tl.fromTo(q(".s05-inactiva"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, NOVIENE);
      gsap.set(q(".s05-inactiva"), { opacity: 0 });
      glitch(q(".s05-inactiva"), NOVIENE + 0.05, 10);

      // ---- "hace tres semanas": días en ámbar + alerta que parpadea ----
      gsap.set([q(".s05-lbl-1"), q(".s05-hace"), q(".s05-lbl-f")], { opacity: 0 });
      tl.to(q(".s05-lbl-1"), { opacity: 1, duration: 0.15 }, 0.55);
      tl.to(q(".s05-hace"), { opacity: 1, duration: 0.05 }, TRES);
      glitch(q(".s05-hace"), TRES, 16);
      contar(q(".s05-dias"), TRES, 0, 21, 0.35);
      tl.fromTo(q(".s05-alerta"), { opacity: 0, scale: 0.4, transformOrigin: "50% 60%" }, { opacity: 1, scale: 1, transformOrigin: "50% 60%", duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, SEMANAS);
      tl.to(q(".s05-alerta"), { opacity: 0.15, duration: 0.14, yoyo: true, repeat: 15, ease: "steps(1)" }, SEMANAS + 0.35);
      tl.to(q(".s05-lbl-f"), { opacity: 1, duration: 0.15 }, 0.9);
      // la frecuencia se desploma
      gsap.set(qa(".s05-barra"), { scaleX: 0.9, transformOrigin: "0% 50%" });
      tl.to(q(".s05-barra-a"), { opacity: 1, duration: 0.1 }, SEMANAS);
      tl.to(qa(".s05-barra"), { scaleX: 0.16, transformOrigin: "0% 50%", duration: 0.6, ease: "power3.inOut" }, SEMANAS);
      tl.to(q(".s05-pct"), { opacity: 1, duration: 0.1 }, SEMANAS + 0.4);
      glitch(q(".s05-pct"), SEMANAS + 0.4, 10);
      // la ficha tiembla un toque en "no viene"
      glitch(q(".s05-ficha"), NOVIENE + 0.1, 8);
      tl.fromTo(q(".s05-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, TRES);

      // ---- "le llegó un aviso con sus puntos" ----
      tl.fromTo(q(".s05-puntos"), { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out", immediateRender: false }, 2.45);
      contar(q(".s05-pts"), 2.6, 0, 120, 0.5);
      tl.fromTo(q(".s05-vuela"), { x: 400, y: 1130, scale: 0.6, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.15, ease: "back.out(2)", immediateRender: false }, AVISO - 0.05);
      tl.to(q(".s05-vuela"), { x: 855, duration: 0.42, ease: "power1.in" }, AVISO + 0.08);
      tl.to(q(".s05-vuela"), { y: 876, duration: 0.42, ease: "power2.in" }, AVISO + 0.08);
      tl.to(q(".s05-vuela"), { scale: 0.5, opacity: 0, duration: 0.1, ease: "power2.in" }, AVISO + 0.46);
      gsap.set(q(".s05-vuela"), { x: 400, y: 1130 });
      dibujar(q(".s05-trazo"), AVISO, 0.45, "power2.in");
      tl.to(q(".s05-trazo"), { opacity: 0, duration: 0.3 }, AVISO + 0.6);
      tl.to(q(".s05-e1"), { opacity: 0, y: -10, duration: 0.15 }, AVISO - 0.1);
      tl.fromTo(q(".s05-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, AVISO);
      tl.to(q(".s05-env-tilde"), { opacity: 1, duration: 0.01 }, AVISO + 0.1);
      dibujar(q(".s05-env-tilde"), AVISO + 0.1, 0.25);
      tl.to(q(".s05-env"), { opacity: 1, duration: 0.2 }, AVISO + 0.12);
      // en el celular: la hora sube y entra la notificación
      tl.to([q(".s05-hora"), q(".s05-fecha")], { y: -20, opacity: 0.45, duration: 0.3, ease: "power3.out" }, AVISO + 0.45);
      tl.fromTo(q(".s05-card"), { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, AVISO + 0.48);
      tl.to(q(".s05-card-tit"), { opacity: 1, duration: 0.15 }, AVISO + 0.55);
      qa(".s05-card-txt").forEach((el, i) => { tl.set(el, { opacity: 1 }, AVISO + 0.58); tipear(el, AVISO + 0.58 + i * 0.16, 0.16); });
      // "puntos": el 120 brilla
      tl.fromTo(q(".s05-120"), { filter: "drop-shadow(0 0 0px rgba(92,230,17,0))" }, { filter: "drop-shadow(0 0 16px rgba(92,230,17,1))", duration: 0.2, yoyo: true, repeat: 3, ease: "power1.inOut", immediateRender: false }, PUNTOS);
      tl.to(q(".s05-card"), { scale: 1.04, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1 }, PUNTOS);

      // ---- "Ya contestó": tecleando... y llega la respuesta ----
      tl.to(q(".s05-tecleo"), { opacity: 1, duration: 0.12 }, 4.3);
      qa(".s05-punto").forEach((p, i) => tl.to(p, { y: -8, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" }, 4.3 + i * 0.06));

      tl.fromTo(q(".s05-resp"), { opacity: 0, scale: 0.6, transformOrigin: "100% 50%" }, { opacity: 1, scale: 1, transformOrigin: "100% 50%", duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, CONTESTO);
      tl.fromTo(q(".s05-resp-txt"), { opacity: 0, scale: 0.6, transformOrigin: "100% 50%" }, { opacity: 1, scale: 1, transformOrigin: "100% 50%", duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, CONTESTO);
      tl.to(q(".s05-visto"), { opacity: 1, duration: 0.2 }, CONTESTO + 0.25);
      dibujar(q(".s05-trazo-v"), CONTESTO + 0.3, 0.4, "power2.out");
      tl.to(q(".s05-trazo-v"), { opacity: 0, duration: 0.3 }, VIENE + 0.3);

      // ---- "viene hoy": la ficha pasa de ámbar a verde ----
      tl.to([q(".s05-hace"), q(".s05-lbl-1"), q(".s05-inactiva"), q(".s05-pct")], { opacity: 0, duration: 0.08 }, VIENE);
      tl.to(q(".s05-alerta"), { opacity: 0, scale: 0.3, transformOrigin: "50% 60%", duration: 0.15, ease: "power2.in" }, VIENE);
      tl.to([q(".s05-hoy"), q(".s05-lbl-2"), q(".s05-activa")], { opacity: 1, duration: 0.06 }, VIENE + 0.06);
      glitch(q(".s05-hoy"), VIENE + 0.06, 18);
      tl.set(q(".s05-ok"), { opacity: 1 }, VIENE + 0.1);
      dibujar(q(".s05-ok-aro"), VIENE + 0.1, 0.3, "power3.out");
      dibujar(q(".s05-ok-tilde"), HOY, 0.25, "power3.out");
      tl.fromTo(q(".s05-ok"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.3, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, HOY + 0.2);
      tl.to(q(".s05-barra-a"), { opacity: 0, duration: 0.1 }, VIENE + 0.1);
