<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-hook"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-hook"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-hook"] .hud { fill: none; stroke: #38e1ff; stroke-width: 3; stroke-linecap: round; }
    [data-composition-id="s01-hook"] .hud-fino { fill: none; stroke: #38e1ff; stroke-width: 1.5; opacity: 0.6; }
    [data-composition-id="s01-hook"] .hud-grueso { fill: none; stroke: #38e1ff; stroke-width: 10; stroke-linecap: butt; }
    [data-composition-id="s01-hook"] .ln { fill: none; stroke: #e8f6ff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-hook"] .nucleo { fill: #38e1ff; }
    [data-composition-id="s01-hook"] .brillo { filter: drop-shadow(0 0 18px rgba(56, 225, 255, 0.85)); }
    [data-composition-id="s01-hook"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.22em; fill: #38e1ff; }
    [data-composition-id="s01-hook"] .titulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 64px; letter-spacing: 0.32em; fill: #e8f6ff; }
    [data-composition-id="s01-hook"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #38e1ff; }
    [data-composition-id="s01-hook"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01-hook" data-width="1080" data-height="1920" data-duration="3.25">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="3.25" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- EL NÚCLEO DEL ASISTENTE: anillos que giran (es el recurso de todo el reel, copialo) -->
        <g class="s01-nucleo">
          <circle class="hud-fino" cx="540" cy="900" r="300" />
          <circle class="hud s01-anillo-a" cx="540" cy="900" r="270" stroke-dasharray="120 30 20 30" />
          <circle class="hud-grueso s01-anillo-b" cx="540" cy="900" r="232" stroke-dasharray="60 24" opacity="0.55" />
          <circle class="hud s01-anillo-c" cx="540" cy="900" r="196" stroke-dasharray="300 80" />
          <g class="s01-ticks">
            <path class="hud-fino" d="M540 590 V615 M540 1185 V1210 M230 900 H255 M825 900 H850 M321 681 L339 699 M741 1101 L759 1119 M759 681 L741 699 M339 1101 L321 1119" />
          </g>
          <circle class="nucleo s01-centro brillo" cx="540" cy="900" r="44" />
          <circle class="hud s01-centro-aro" cx="540" cy="900" r="70" />
        </g>
        <!-- el comercio que escanea -->
        <g class="s01-local">
          <path class="ln" d="M470 960 V880 H610 V960" />
          <path class="ln" d="M458 880 H622 L610 846 H470 Z" />
          <path class="ln" d="M528 960 V918 H552 V960" />
        </g>
        <line class="hud s01-scan brillo" x1="380" y1="0" x2="700" y2="0" />
        <!-- el nombre -->
        <text class="titulo s01-nombre brillo" x="540" y="1290" text-anchor="middle">J.A.R.V.I.S.</text>
      </svg>
      <div class="etiqueta"><span class="s01-e1">Escaneando tu comercio</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-hook";
      const DUR = 3.25;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const COMERCIO = 0.3;
      const PROPIO = 1.6;
      const JARVIS = 1.8;

      // los anillos giran todo el tiempo, cada uno a su velocidad (svgOrigin en coordenadas globales:
      // sirve porque estos grupos no están dentro de otro grupo movido)
      const O = "540 900";
      tl.fromTo(q(".s01-anillo-a"), { rotation: 0, svgOrigin: O }, { rotation: 120, svgOrigin: O, duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s01-anillo-b"), { rotation: 0, svgOrigin: O }, { rotation: -90, svgOrigin: O, duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s01-anillo-c"), { rotation: 0, svgOrigin: O }, { rotation: 200, svgOrigin: O, duration: DUR, ease: "none" }, 0);
      // el núcleo arranca a medias (el cuadro 0 no puede estar vacío) y entra con golpe
      tl.fromTo(q(".s01-nucleo"), { scale: 0.7, opacity: 0.5, svgOrigin: O }, { scale: 1, opacity: 1, svgOrigin: O, duration: 0.5, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s01-centro"), { scale: 0.4, opacity: 0.4, svgOrigin: O }, { scale: 0.7, opacity: 0.6, svgOrigin: O, duration: 0.4 }, 0);

      // "tu comercio": aparece el local y una línea lo escanea de arriba abajo
      tl.fromTo(q(".s01-local"), { opacity: 0, scale: 0.8, svgOrigin: O }, { opacity: 1, scale: 1, svgOrigin: O, duration: 0.3, ease: "back.out(2)" }, COMERCIO);
      tl.fromTo(q(".s01-scan"), { y: 830, opacity: 0 }, { y: 980, opacity: 1, duration: 0.5, ease: "power1.inOut" }, COMERCIO + 0.1);
      tl.to(q(".s01-scan"), { y: 830, duration: 0.5, ease: "power1.inOut" }, COMERCIO + 0.6);
      tl.to(q(".s01-scan"), { opacity: 0, duration: 0.15 }, COMERCIO + 1.05);
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, COMERCIO);

      // "su propio JARVIS": el local se guarda en el núcleo, el núcleo se prende y sale el nombre
      tl.to(q(".s01-local"), { scale: 0.3, opacity: 0, svgOrigin: O, duration: 0.25, ease: "power2.in" }, PROPIO - 0.1);
      tl.to(q(".s01-centro"), { scale: 1.25, opacity: 1, svgOrigin: O, duration: 0.25, ease: "back.out(3)" }, JARVIS);
      tl.fromTo(q(".s01-centro-aro"), { scale: 0.6, opacity: 1, svgOrigin: O }, { scale: 4.6, opacity: 0, svgOrigin: O, duration: 0.7, ease: "power2.out" }, JARVIS);
      tl.to(q(".s01-nucleo"), { scale: 1.08, svgOrigin: O, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, JARVIS);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.15 }, JARVIS - 0.1);
      // el nombre entra con glitch: saltos secos de x (antes, invisible)
      gsap.set(q(".s01-nombre"), { opacity: 0 });
      tl.fromTo(q(".s01-nombre"), { opacity: 0 }, { opacity: 1, duration: 0.05 }, JARVIS + 0.05);
      [[-18, 0.05], [12, 0.09], [-6, 0.13], [0, 0.17]].forEach(([x, d]) => tl.to(q(".s01-nombre"), { x, duration: 0.03, ease: "none" }, JARVIS + d));
      tl.to(q(".s01-nombre"), { opacity: 0.4, duration: 0.06, yoyo: true, repeat: 3, ease: "none" }, JARVIS + 0.25);

      // salida: corte de pantalla rápido
      tl.to(q("#s01-escena"), { opacity: 0, scaleY: 0.02, transformOrigin: "50% 47%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
