  <script>
    (function () {
      const ID = "s10-funciones";
      const DUR = 4.68;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // dibuja trazos; si arranca en 0 queda visible desde el cuadro 0
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1) });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop
      const badge = (el, t) => {
        const inn = el.querySelector(".bdg-in");
        tl.fromTo(inn, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      qa(".bdg-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      const latir = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.1, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const sacudir = (el, t) => {
        tl.to(el, { x: "+=6", duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      };
      const etq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const fuera = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);


      const PEDIDOS = 0.26, AGENDA = 1.0, TURNOS = 1.36, CUANDO = 2.16, CONSULTA = 2.56, VOS = 3.06, PASA = 3.86;
      gsap.set(qa(".s10-ck, .s10-r1, .s10-r2, .s10-r3, .s10-dia, .s10-dia-p, .s10-pts, .s10-preg-g, .s10-vos"), { opacity: 0 });
      tl.fromTo(q(".s10-fila"), { scale: 1.06, svgOrigin: "540 900" }, { scale: 1.0, svgOrigin: "540 900", duration: DUR, ease: "none" }, 0);

      // pedidos: la planilla arranca dibujada a medias y se van tildando
      dibujar(qa(".s10-d1"), 0, 0.45, 0.4, 0);
      etq(q(".s10-r1"), PEDIDOS);
      etq(q(".s10-e1"), PEDIDOS - 0.1);
      qa(".s10-ck").forEach((c, i) => dibujar([c], PEDIDOS + 0.1 + i * 0.18, 0.2));
      tl.to(q(".s10-i1"), { opacity: 0.45, duration: 0.3 }, AGENDA + 0.6);

      // turnos: el calendario y un día marcado
      dibujar(qa(".s10-d2"), AGENDA - 0.15, 0.45);
      tl.to(q(".s10-pts"), { opacity: 1, duration: 0.25 }, AGENDA + 0.15);
      dibujar([q(".s10-dia")], TURNOS - 0.05, 0.3);
      tl.set(q(".s10-dia"), { opacity: 1 }, TURNOS - 0.05);
      tl.fromTo(q(".s10-dia-p"), { opacity: 0, scale: 0.2, svgOrigin: "17 32" }, { opacity: 1, scale: 1, svgOrigin: "17 32", duration: 0.3, ease: "back.out(2.4)" }, TURNOS + 0.1);
      etq(q(".s10-r2"), TURNOS);
      fuera(q(".s10-e1"), TURNOS - 0.2);
      etq(q(".s10-e2"), TURNOS - 0.05);
      tl.to(q(".s10-i2"), { opacity: 0.45, duration: 0.3 }, CUANDO + 0.2);

      // te la pasa: una consulta que no es para el bot pasa a vos
      dibujar([q(".s10-d3")], CUANDO - 0.15, 0.45);
      pop(q(".s10-preg-g"), CONSULTA - 0.1, "-62 -4");
      tl.to(q(".s10-preg-g"), { rotation: -8, svgOrigin: "-62 -4", duration: 0.12, yoyo: true, repeat: 1 }, CONSULTA + 0.3);
      pop(q(".s10-vos"), VOS - 0.1, "76 46");
      latir(q(".s10-vos"), VOS + 0.3, "76 46", 1.1);
      dibujar([q(".s10-flecha")], PASA - 0.25, 0.3);
      tl.to(q(".s10-preg-g"), { x: 150, y: -64, scale: 0.8, duration: 0.35, ease: "power2.inOut" }, PASA - 0.1);
      tl.to(q(".s10-preg-g"), { opacity: 0, duration: 0.12 }, PASA + 0.2);
      latir(q(".s10-vos"), PASA + 0.3, "76 46", 1.12);
      etq(q(".s10-r3"), PASA - 0.2);
      fuera(q(".s10-e2"), VOS - 0.2);
      etq(q(".s10-e3"), VOS);


      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
