  <script>
    (function () {
      const ID = "s04-quien-contesta";
      const DUR = 4.24;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // dibuja trazos; si arranca en 0 queda visible desde el cuadro 0
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1) });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop
      const badge = (el, t) => {
        const inn = el.querySelector(".bdg-in");
        tl.fromTo(inn, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      qa(".bdg-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      const latir = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.1, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const sacudir = (el, t) => {
        tl.to(el, { x: "+=6", duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      };
      const etq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const fuera = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);


      const CONTESTA = 0.14, MINUTO = 0.84, OTRO = 1.77, HORA = 2.24, VOS = 3.05, DIA = 4.04;
      tl.fromTo(q(".s04-todo"), { scale: 0.98, svgOrigin: "540 960" }, { scale: 1.03, svgOrigin: "540 960", duration: DUR, ease: "none" }, 0);
      gsap.set(qa(".vidrio, .s04-c1, .s04-c2, .s04-c3, .s04-t1, .s04-t2, .s04-t3, .s04-tilde"), { opacity: 0 });
      // los tres locales ya están (vienen de la escena anterior): arrancan casi dibujados
      dibujar(qa(".s04-dl"), 0, 0.4, 0.3, 0);
      tl.fromTo(qa(".s04-r"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);
      etq(q(".s04-e1"), 0.05);

      // uno: contesta en un minuto, se prende verde
      pop(q(".s04-c1"), CONTESTA, "230 975");
      tl.fromTo(q(".s04-aguja1"), { rotation: 0, svgOrigin: "230 975" }, { rotation: 60, svgOrigin: "230 975", duration: 0.5, ease: "power3.out" }, CONTESTA + 0.1);
      pop(q(".s04-t1"), MINUTO - 0.1, "230 1062");
      tl.to(qa(".s04-l1 .vidrio"), { opacity: 0.9, duration: 0.2 }, MINUTO);
      tl.fromTo(q(".s04-l1-in"), { y: 0 }, { y: -18, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, MINUTO);
      dibujar([q(".s04-tilde")], MINUTO + 0.2, 0.35);

      // otro: en una hora, la aguja da toda la vuelta
      pop(q(".s04-c2"), OTRO - 0.1, "540 975");
      tl.fromTo(q(".s04-aguja2"), { rotation: 0, svgOrigin: "540 975" }, { rotation: 360, svgOrigin: "540 975", duration: 0.8, ease: "power2.inOut" }, OTRO);
      pop(q(".s04-t2"), HORA - 0.05, "540 1062");

      // vos: al otro día, el calendario pasa de hoja y tu local queda apagado
      pop(q(".s04-c3"), VOS - 0.1, "850 975");
      tl.to(q(".s04-r3"), { scale: 1.2, svgOrigin: "850 878", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, VOS);
      tl.fromTo(q(".s04-hoja"), { scaleY: 1, svgOrigin: "850 974" }, { scaleY: 0, svgOrigin: "850 974", duration: 0.15, ease: "power2.in", yoyo: true, repeat: 1 }, 3.6);
      pop(q(".s04-t3"), DIA - 0.15, "850 1062");
      tl.to(qa(".s04-l3, .s04-c3, .s04-r3"), { opacity: 0.4, duration: 0.3 }, DIA);
      tl.to(q(".s04-t3"), { opacity: 0.4, duration: 0.3 }, DIA + 0.15);


      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
