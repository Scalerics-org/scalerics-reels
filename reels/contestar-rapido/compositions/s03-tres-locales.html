  <script>
    (function () {
      const ID = "s03-tres-locales";
      const DUR = 5.93;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // dibuja trazos; si arranca en 0 queda visible desde el cuadro 0
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1) });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop
      const badge = (el, t) => {
        const inn = el.querySelector(".bdg-in");
        tl.fromTo(inn, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      qa(".bdg-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      const latir = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.1, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const sacudir = (el, t) => {
        tl.to(el, { x: "+=6", duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      };
      const etq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const fuera = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);


      const COMPRA = 0.47, GENTE = 0.87, ESCRIBE = 2.17, TRES = 2.77, LOCALES = 3.07, A = 3.27, VEZ = 3.77, CUANTO = 4.69, SALE = 4.97;
      const XS = [230,540,850];
      tl.fromTo(q(".s03-todo"), { scale: 1.04, svgOrigin: "540 950" }, { scale: 0.98, svgOrigin: "540 950", duration: DUR, ease: "none" }, 0);
      gsap.set(qa(".cartel, .vidrio, .s03-r, .s03-puntos, .s03-fila, .s03-msg, .s03-viaje, .s03-x3"), { opacity: 0 });

      // el celular del cliente arranca a medio dibujar
      dibujar(qa(".s03-dt"), 0, 0.55, 0.4, 0);
      etq(q(".s03-e1"), 0.15);
      latir(q(".s03-tel"), COMPRA, "540 1085", 1.05);
      latir(q(".s03-tel"), GENTE + 0.3, "540 1085", 1.05);
      // "la gente": la lista de chats del cliente, tres locales
      qa(".s03-fila").forEach((f, i) => {
        tl.fromTo(f, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, GENTE + i * 0.15);
        tl.to(f, { opacity: 0.35, duration: 0.2 }, ESCRIBE - 0.1);
      });
      tl.to(qa(".s03-fila"), { opacity: 0, duration: 0.2 }, A);
      // "escribe": puntitos de escribiendo
      qa(".s03-puntos circle").forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, y: 0 }, { opacity: 1, duration: 0.1 }, ESCRIBE + i * 0.08);
        tl.to(c, { y: -8, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 3 }, ESCRIBE + i * 0.08);
      });
      tl.set(q(".s03-puntos"), { opacity: 1 }, ESCRIBE);
      tl.to(q(".s03-puntos"), { opacity: 0, duration: 0.15 }, CUANTO - 0.2);

      // "tres locales": aparecen los tres, uno por golpe
      [0, 1, 2].forEach((i) => {
        const t = TRES - 0.25 + i * 0.16;
        dibujar(qa(".s03-l" + (i + 1) + " .s03-dl"), t, 0.45, 1, 0.02);
        tl.fromTo(q(".s03-l" + (i + 1) + "-in"), { y: 30 }, { y: 0, duration: 0.45, ease: "back.out(1.6)" }, t);
        tl.fromTo(qa(".s03-r")[i], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3 }, LOCALES + i * 0.08);
      });

      // "a la vez": salen tres mensajes a la vez
      dibujar(qa(".s03-linea"), A - 0.05, 0.35, 1, 0);
      qa(".s03-viaje").forEach((v, i) => {
        tl.fromTo(v, { x: 540, y: 1000, opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15 }, A);
        tl.to(v, { x: XS[i], y: 805, duration: 0.55, ease: "power2.inOut" }, A + 0.05);
        tl.to(v, { scale: 1.25, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, VEZ - 0.05);
      });
      // el mensaje del medio queda arriba del celular, los de los costados en la vidriera
      fuera(q(".s03-e1"), A);
      etq(q(".s03-e2"), A + 0.15);
      tl.to(qa(".s03-l1-in, .s03-l2-in, .s03-l3-in"), { y: -8, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0 }, VEZ + 0.05);

      // "¿Cuánto sale?": el mensaje en el celular y x3
      pop(q(".s03-msg"), CUANTO - 0.05, "640 1174");
      tl.fromTo(q(".s03-x3"), { opacity: 0, scale: 0.4, svgOrigin: "715 1066" }, { opacity: 1, scale: 1, svgOrigin: "715 1066", duration: 0.3, ease: "back.out(2.4)" }, SALE);
      latir(q(".s03-msg"), SALE + 0.1, "540 1146", 1.06);


      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
