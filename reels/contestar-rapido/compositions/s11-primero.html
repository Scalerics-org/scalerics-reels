  <script>
    (function () {
      const ID = "s11-primero";
      const DUR = 4.53;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // dibuja trazos; si arranca en 0 queda visible desde el cuadro 0
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1) });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop
      const badge = (el, t) => {
        const inn = el.querySelector(".bdg-in");
        tl.fromTo(inn, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      qa(".bdg-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      const latir = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.1, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const sacudir = (el, t) => {
        tl.to(el, { x: "+=6", duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      };
      const etq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const fuera = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);


      const LLEGAS = 0.18, PRIMERO = 0.48, SIN = 0.78, BAJAR = 1.28, PESO = 2.01, AUNQUE = 2.44, ATENDIENDO = 2.78, MOSTRADOR = 3.38;
      gsap.set(qa(".vidrio, .s11-uno, .s11-tag, .s11-b, .s11-bb, .s11-bolsa"), { opacity: 0 });
      dibujar(qa(".s11-dl"), 0, 0.45, 0.3, 0);
      tl.fromTo(q(".s11-r3"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);

      // "primero": tu local se prende y salta, los otros se apagan
      tl.to(q(".s11-otros"), { opacity: 0.35, duration: 0.3 }, LLEGAS);
      tl.to(qa(".s11-l3 .vidrio"), { opacity: 0.9, duration: 0.2 }, PRIMERO - 0.1);
      tl.to(q(".s11-l3-in"), { y: -26, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, PRIMERO);
      tl.fromTo(q(".s11-uno"), { opacity: 0, scale: 0.3, svgOrigin: "850 970" }, { opacity: 1, scale: 1, svgOrigin: "850 970", duration: 0.35, ease: "back.out(2.4)" }, PRIMERO);
      etq(q(".s11-e1"), PRIMERO - 0.15);

      // "sin bajar un peso": la etiqueta queda igual
      pop(q(".s11-tag"), SIN, "540 1038");
      tl.fromTo(q(".s11-igual"), { opacity: 0, scaleX: 0, svgOrigin: "395 1038" }, { opacity: 1, scaleX: 1, svgOrigin: "395 1038", duration: 0.3, ease: "power3.out" }, BAJAR);
      latir(q(".s11-tag"), PESO, "540 1038", 1.08);
      fuera(q(".s11-e1"), BAJAR - 0.2);
      etq(q(".s11-e2"), BAJAR - 0.05);
      tl.to(q(".s11-a"), { opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, AUNQUE - 0.1);

      // "atendiendo el mostrador": vos atendés y el celular contesta solo
      tl.set(q(".s11-b"), { opacity: 1 }, AUNQUE);
      dibujar(qa(".s11-db"), AUNQUE, 0.45, 1, 0.02);
      tl.fromTo(q(".s11-bolsa"), { x: 470, y: 960, opacity: 0 }, { opacity: 1, duration: 0.15 }, ATENDIENDO);
      tl.to(q(".s11-bolsa"), { x: 300, y: 950, duration: 0.5, ease: "power2.inOut" }, ATENDIENDO + 0.05);
      [ATENDIENDO + 0.1, MOSTRADOR, MOSTRADOR + 0.5].forEach((t, i) => {
        tl.fromTo(q(".s11-bb" + (i + 1)), { opacity: 0, scale: 0.4, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, t);
      });
      fuera(q(".s11-e2"), ATENDIENDO - 0.2);
      etq(q(".s11-e3"), ATENDIENDO);


      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
