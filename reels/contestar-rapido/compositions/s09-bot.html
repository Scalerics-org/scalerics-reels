  <script>
    (function () {
      const ID = "s09-bot";
      const DUR = 6.52;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // dibuja trazos; si arranca en 0 queda visible desde el cuadro 0
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1) });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop
      const badge = (el, t) => {
        const inn = el.querySelector(".bdg-in");
        tl.fromTo(inn, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      qa(".bdg-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      const latir = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.1, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const sacudir = (el, t) => {
        tl.to(el, { x: "+=6", duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      };
      const etq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const fuera = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);


      const HACEMOS = 0.18, BOTS = 0.38, WHATSAPP = 0.98, COMERCIOS = 1.58, CONTESTA = 2.73, INSTANTE = 3.18, CUALQUIER = 3.98, HORA = 4.38, PRECIOS = 4.98, HORARIOS = 5.58;
      gsap.set(qa(".s09-b, .s09-marca, .s09-com, .s09-ant, .s09-ojo, .s09-hora, .s09-m0, .s09-m1, .s09-m2, .s09-m3, .s09-tilde"), { opacity: 0 });

      // la caja de Scalerics arranca dibujándose
      dibujar(qa(".s09-da"), 0, 0.5, 0.4, 0);
      tl.fromTo(q(".s09-marca"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, HACEMOS);
      tl.fromTo(q(".s09-a"), { scale: 1, svgOrigin: "540 880" }, { scale: 1.04, svgOrigin: "540 880", duration: 2.6, ease: "none" }, 0);
      // "bots": el robot se dibuja y se le prenden los ojos
      dibujar(qa(".s09-db"), BOTS - 0.15, 0.45, 1, 0.03);
      tl.fromTo(qa(".s09-ojo, .s09-ant"), { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)", stagger: 0.06 }, BOTS + 0.3);
      etq(q(".s09-e1"), BOTS);
      // "WhatsApp": la antena late, los ojos parpadean
      latir(q(".s09-ant"), WHATSAPP, "540 840", 1.4);
      tl.to(qa(".s09-ojo"), { scaleY: 0.15, transformOrigin: "50% 50%", duration: 0.08, yoyo: true, repeat: 1 }, WHATSAPP + 0.3);
      etq(q(".s09-com"), COMERCIOS);
      tl.to(q(".s09-a"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, CONTESTA - 0.4);

      // el chat del bot
      tl.set(q(".s09-b"), { opacity: 1 }, CONTESTA - 0.2);
      tl.fromTo(q(".s09-tel"), { opacity: 0, scale: 0.9, svgOrigin: "540 910" }, { opacity: 1, scale: 1, svgOrigin: "540 910", duration: 0.35, ease: "back.out(1.6)" }, CONTESTA - 0.2);
      pop(q(".s09-m0"), CONTESTA, "730 810");
      // "instante": la respuesta sale ya
      tl.to(q(".s09-tilde"), { opacity: 1, duration: 0.08 }, INSTANTE - 0.12);
      pop(q(".s09-m1"), INSTANTE - 0.05, "350 890");
      fuera(q(".s09-e1"), INSTANTE - 0.15);
      etq(q(".s09-e2"), INSTANTE);
      // "a cualquier hora": la luna y la hora
      pop(q(".s09-hora"), CUALQUIER, "660 690");
      latir(q(".s09-hora"), HORA, "660 690", 1.15);

      pop(q(".s09-m3"), HORARIOS - 0.05, "350 1038");
      fuera(q(".s09-e3"), PRECIOS - 0.15);
      etq(q(".s09-e4"), PRECIOS);
      tl.fromTo(q(".s09-tel"), { y: 0 }, { y: -8, duration: DUR - CONTESTA, ease: "none", immediateRender: false }, CONTESTA + 0.2);


      // salida
