    (function () {
      const ID = "s08-sistema";
      const DUR = 4.29;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // dibuja trazos; si arranca en 0 queda visible desde el cuadro 0
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1) });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop
      const badge = (el, t) => {
        const inn = el.querySelector(".bdg-in");
        tl.fromTo(inn, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      qa(".bdg-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      const latir = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.1, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const sacudir = (el, t) => {
        tl.to(el, { x: "+=6", duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      };
      const etq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const fuera = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);


      const PRIMERO = 0.27, VIVIR = 0.97, PEGADO = 1.17, CELULAR = 1.67, ES = 2.59, SISTEMA = 3.07;
      gsap.set(qa(".s08-n, .s08-gota"), { opacity: 0 });
      dibujar(qa(".s08-dp"), 0, 0.55, 0.4, 0);
      tl.fromTo(q(".s08-a"), { scale: 1, svgOrigin: "520 900" }, { scale: 1.05, svgOrigin: "520 900", duration: ES, ease: "none" }, 0);
      etq(q(".s08-e1"), VIVIR - 0.1);
      // le llueven mensajes
      [0.35, VIVIR, PEGADO + 0.1, PEGADO + 0.35].forEach((t, i) => {
        const n = q(".s08-n" + (i + 1));
        tl.fromTo(n, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, t);
      });
      // "pegado": la cabeza se encorva sobre el celular
      tl.to(q(".s08-persona"), { rotation: 6, svgOrigin: "476 1090", duration: 0.35, ease: "power2.out" }, PEGADO);
      tl.fromTo(q(".s08-gota"), { opacity: 0, y: -10 }, { opacity: 1, y: 14, duration: 0.5, ease: "power1.in" }, PEGADO + 0.1);
      // "celular": badge de no
      badge(q(".s08-b"), CELULAR - 0.05);
      sacudir(q(".s08-persona"), CELULAR);
      tl.to(q(".s08-a"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, ES - 0.25);
      fuera(q(".s08-e1"), ES - 0.25);

      // "es tener un sistema": el engranaje se dibuja y gira
      dibujar(qa(".s08-dg"), ES - 0.05, 0.6);
      tl.fromTo(q(".s08-engranaje"), { rotation: -30, svgOrigin: "540 910" }, { rotation: 70, svgOrigin: "540 910", duration: DUR - ES + 0.05, ease: "none" }, ES - 0.05);
      tl.fromTo(q(".s08-sist"), { scale: 1, svgOrigin: "540 910" }, { scale: 1.12, svgOrigin: "540 910", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, SISTEMA);
      etq(q(".s08-e2"), ES + 0.05);
      tl.to(q(".s08-e2"), { scale: 1.08, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, SISTEMA);


      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
