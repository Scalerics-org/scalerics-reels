  <script>
    (function () {
      const ID = "s06-tarde-noche";
      const DUR = 5.88;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan (opacity 0 hasta que arrancan: sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.03);
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const centro = (el) => { const b = el.getBBox(); return (b.x + b.width / 2) + " " + (b.y + b.height / 2); };
      // aparece entero con golpe
      const pop = (els, t, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const o = centro(el);
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.35, ease: "back.out(1.6)" }, t + i * (paso ?? 0.08));
        });
      };
      const latir = (el, t, s) => { const o = centro(el); tl.to(el, { scale: s ?? 1.08, svgOrigin: o, duration: 0.13, yoyo: true, repeat: 1, ease: "power2.out" }, t); };
      // etiqueta: muestra la i (1..n) en t y saca la anterior
      let etAnt = null;
      const etq = (i, t) => {
        const el = q(".s06-e" + i);
        if (etAnt) tl.to(etAnt, { opacity: 0, duration: 0.2 }, t - 0.2);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
        etAnt = el;
      };

      dibujar(qa(".s06-d"), 0, 0.5, 0.45);
      pop(q(".s06-sol"), 0.05);
      tl.to(q(".s06-sol"), { rotation: 30, svgOrigin: "180 900", duration: 3, ease: "none" }, 0);
      etq(1, 0.2);
      [0.86, 1.15, 1.45, 1.75].forEach((t, i) => pop(q(".s06-b" + (i + 1)), t));
      latir(q(".s06-b4"), 2.45, 1.06);
      etq(2, 1.1);
      // noche: baja el sol, sale la luna, se va el celular
      tl.to(q(".s06-sol"), { y: 120, opacity: 0, duration: 0.5, ease: "power2.in" }, 3.0);
      dibujar([q(".s06-luna")], 3.3, 0.6);
      tl.to(q(".s06-cel"), { opacity: 0, x: -60, duration: 0.35, ease: "power2.in" }, 3.0);
      etq(3, 3.35);
      // las hojas del día llegan al reporte
      const hojas = qa(".s06-hoja");
      hojas.forEach((h, i) => {
        gsap.set(h, { x: 140 + i * 40, y: 960 + i * 50, opacity: 0, rotation: -8 + i * 8, svgOrigin: "60 75" });
        tl.to(h, { opacity: 1, duration: 0.2 }, 3.6 + i * 0.12);
        tl.to(h, { x: 680, y: 990, rotation: 0, svgOrigin: "60 75", duration: 0.45, ease: "power2.inOut" }, 4.3 + i * 0.22);
        tl.to(h, { opacity: 0, duration: 0.12 }, 4.7 + i * 0.22);
      });
      pop(q(".s06-rep"), 3.9);
      dibujar(qa(".s06-rl"), 4.6, 0.3, 1, 0.2);
      etq(4, 4.6);

      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
