  <script>
    (function () {
      const ID = "s03-planilla";
      const DUR = 3.19;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan (opacity 0 hasta que arrancan: sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.03);
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const centro = (el) => { const b = el.getBBox(); return (b.x + b.width / 2) + " " + (b.y + b.height / 2); };
      // aparece entero con golpe
      const pop = (els, t, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const o = centro(el);
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.35, ease: "back.out(1.6)" }, t + i * (paso ?? 0.08));
        });
      };
      const latir = (el, t, s) => { const o = centro(el); tl.to(el, { scale: s ?? 1.08, svgOrigin: o, duration: 0.13, yoyo: true, repeat: 1, ease: "power2.out" }, t); };
      // etiqueta: muestra la i (1..n) en t y saca la anterior
      let etAnt = null;
      const etq = (i, t) => {
        const el = q(".s03-e" + i);
        if (etAnt) tl.to(etAnt, { opacity: 0, duration: 0.2 }, t - 0.2);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
        etAnt = el;
      };

      dibujar(qa(".s03-d"), 0, 0.5, 0.45);
      pop(q(".s03-wa"), 0.15);
      pop(q(".s03-pl"), 0.3);
      pop(q(".s03-msj"), 0.7);
      latir(q(".s03-msj"), 1.0, 1.06);
      pop(q(".s03-sofia"), 1.4);
      // Sofía mira el celular, después la planilla
      tl.to(q(".s03-sofia"), { rotation: -5, svgOrigin: "0 0", duration: 0.25 }, 1.5);
      tl.to(q(".s03-sofia"), { rotation: 5, svgOrigin: "0 0", duration: 0.3 }, 2.1);
      dibujar([q(".s03-flecha")], 1.85, 0.45);
      const v = q(".s03-vuela");
      gsap.set(v, { x: 240, y: 970, opacity: 0 });
      tl.to(v, { opacity: 1, duration: 0.1 }, 1.9);
      tl.to(v, { x: 825, duration: 0.55, ease: "power2.inOut" }, 1.9);
      tl.to(v, { y: 860, duration: 0.275, ease: "sine.out", yoyo: true, repeat: 1 }, 1.9);
      tl.to(v, { y: 1010, opacity: 0, duration: 0.2 }, 2.45);
      pop(q(".s03-fila"), 2.45);
      etq(1, 1.9);

      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
