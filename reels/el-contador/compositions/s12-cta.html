  <script>
    (function () {
      const ID = "s12-cta";
      const DUR = 6.65;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan (opacity 0 hasta que arrancan: sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.03);
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const centro = (el) => { const b = el.getBBox(); return (b.x + b.width / 2) + " " + (b.y + b.height / 2); };
      // aparece entero con golpe
      const pop = (els, t, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const o = centro(el);
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.35, ease: "back.out(1.6)" }, t + i * (paso ?? 0.08));
        });
      };
      const latir = (el, t, s) => { const o = centro(el); tl.to(el, { scale: s ?? 1.08, svgOrigin: o, duration: 0.13, yoyo: true, repeat: 1, ease: "power2.out" }, t); };
      // etiqueta: muestra la i (1..n) en t y saca la anterior
      let etAnt = null;
      const etq = (i, t) => {
        const el = q(".s12-e" + i);
        if (etAnt) tl.to(etAnt, { opacity: 0, duration: 0.2 }, t - 0.2);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
        etAnt = el;
      };

      dibujar(qa(".s12-d"), 0, 0.5, 0.4);
      pop(q(".s12-ph"), 0.15);
      pop(q(".s12-env"), 0.3);
      etq(1, 0.3);
      qa(".s12-rv").forEach((r) => gsap.set(r, { opacity: 0 }));
      pop(qa(".s12-chip"), 1.45, 0.16);
      // el cursor elige la primera y la escribe en el comentario
      const c = q(".s12-cur");
      gsap.set(c, { x: 900, y: 1000, opacity: 0 });
      tl.to(c, { opacity: 1, duration: 0.2 }, 2.4);
      tl.to(c, { x: 480, y: 668, duration: 0.7, ease: "power2.inOut" }, 2.5);

      tl.to(q(".s12-chip1 .s12-r"), { opacity: 0, duration: 0.2 }, 3.3);
      tl.to(q(".s12-chip1 .s12-rv"), { opacity: 1, duration: 0.2 }, 3.3);
      latir(q(".s12-chip1"), 3.3, 1.05);

      gsap.set(q(".s12-esc"), { opacity: 1 });
      tl.fromTo(q(".s12-mask"), { scaleX: 0, svgOrigin: "215 1120" }, { scaleX: 1, svgOrigin: "215 1120", duration: 1.0, ease: "none" }, 3.5);

      latir(q(".s12-env"), 4.9, 1.15);
      tl.to(qa(".s12-chip:not(.s12-chip1)"), { opacity: 0.55, duration: 0.3 }, 3.4);
      tl.to(qa(".s12-chip:not(.s12-chip1)"), { opacity: 1, duration: 0.3, stagger: 0.12 }, 5.3);

      tl.to(q("#s12-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
