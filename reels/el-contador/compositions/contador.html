<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="contador"] .cnt-capa { position: absolute; inset: 0; }
    [data-composition-id="contador"] .cnt-bloque { position: absolute; left: 90px; width: 900px; top: 690px; height: 300px; }
    [data-composition-id="contador"] .cnt-lbl { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 34px; letter-spacing: 0.3em; color: rgba(239, 238, 229, 0.62); }
    [data-composition-id="contador"] .cnt-caja { position: absolute; left: 30px; right: 30px; top: 58px; height: 176px; border: 5px solid rgba(239, 238, 229, 0.85); border-radius: 26px; }
    [data-composition-id="contador"] .cnt-dig { position: absolute; left: 0; right: 0; top: 66px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 150px; line-height: 160px; letter-spacing: 0.02em; color: #efeee5; font-variant-numeric: tabular-nums; }
    [data-composition-id="contador"] .cnt-estado { position: absolute; left: 0; right: 0; top: 252px; height: 48px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 42px; letter-spacing: 0.16em; }
    [data-composition-id="contador"] .cnt-estado span { position: absolute; left: 0; right: 0; }
    [data-composition-id="contador"] .cnt-man { color: #c7655b; }
    [data-composition-id="contador"] .cnt-auto { color: #5ce611; opacity: 0; }
  </style>
  <div id="root" data-composition-id="contador" data-width="1080" data-height="1920" data-duration="45.9">
    <div id="cnt-escena" class="cnt-capa clip" data-start="0" data-duration="45.9" data-track-index="0">
      <div class="cnt-bloque">
        <div class="cnt-lbl">HORAS COPIANDO DATOS</div>
        <div class="cnt-caja"></div>
        <div class="cnt-dig">00:00:00</div>
        <div class="cnt-estado"><span class="cnt-man">SUMANDO · UN MARTES</span><span class="cnt-auto">FRENADO</span></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "contador";
      const DUR = 45.9;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // tiempos globales (la capa arranca en 0)
      const MARTES = 4.95;
      const MIRA = 23.73;
      const AHORA = 28.36;
      const FRENA_Y = 40.95;
      const FRENA = 41.8;

      // valor del contador (segundos de un martes de ejemplo) según el tiempo del video
      const K = [
        [0, 0], [4.95, 600], [7.3, 900], [10.49, 2100], [13.42, 3300], [17.85, 4800],
        [20.95, 6600], [23.73, 8100], [25.2, 9700], [28.36, 10200], [31.6, 10500],
        [35.4, 10680], [38.09, 10770], [40.95, 10812], [41.8, 10834], [DUR, 10834],
      ];
      const valor = (t) => {
        for (let i = 1; i < K.length; i++) {
          if (t <= K[i][0]) {
            const [t0, v0] = K[i - 1];
            const [t1, v1] = K[i];
            return v0 + ((v1 - v0) * (t - t0)) / (t1 - t0);
          }
        }
        return K.at(-1)[1];
      };
      const dos = (n) => String(n).padStart(2, "0");
      const dig = q(".cnt-dig");
      const reloj = { t: 0 };
      const pintar = () => {
        const s = Math.floor(valor(reloj.t));
        dig.textContent = dos(Math.floor(s / 3600)) + ":" + dos(Math.floor((s % 3600) / 60)) + ":" + dos(s % 60);
      };
      pintar();
      tl.to(reloj, { t: DUR, duration: DUR, ease: "none", onUpdate: pintar }, 0);

      const bloque = q(".cnt-bloque");
      // grande al centro (gancho), con golpe de entrada (el cuadro 0 ya lo muestra)
      gsap.set(bloque, { transformOrigin: "50% 50%" });
      tl.fromTo(bloque, { scale: 1.08 }, { scale: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(q(".cnt-caja"), { opacity: 0.5 }, { opacity: 1, duration: 0.4 }, 0);
      tl.to(bloque, { scale: 1.04, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, 0.7);
      tl.to(bloque, { scale: 1.04, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, 1.5);
      // la lucecita del estado titila mientras suma (mano)
      tl.fromTo(q(".cnt-man"), { opacity: 1 }, { opacity: 0.45, duration: 0.5, yoyo: true, repeat: 40, ease: "sine.inOut" }, 0.4);

      // "un martes": sube y se achica (y = centro 840 -> 665)
      const CHICO = { y: -168, scale: 0.68 };
      tl.to(bloque, { ...CHICO, duration: 0.55, ease: "power3.inOut" }, MARTES - 0.25);
      tl.to(q(".cnt-lbl"), { opacity: 0, duration: 0.3 }, MARTES - 0.25);

      // "mirá cómo sube": baja un poco y crece
      tl.to(bloque, { y: -120, scale: 0.85, duration: 0.4, ease: "back.out(1.6)" }, MIRA);
      tl.to(bloque, { x: -6, duration: 0.05, yoyo: true, repeat: 9, ease: "none" }, MIRA + 0.45);
      tl.to(bloque, { ...CHICO, duration: 0.5, ease: "power3.inOut" }, MIRA + 1.3);

      // "ahora, con automatizaciones": la luz deja de titilar fuerte
      tl.to(q(".cnt-man"), { opacity: 0.7, duration: 0.3 }, AHORA);

      // "se frena": crece, tiembla, se pone verde
      tl.to(bloque, { y: -120, scale: 0.85, duration: 0.45, ease: "power3.out" }, FRENA_Y + 0.2);
      tl.to(bloque, { x: 5, duration: 0.04, yoyo: true, repeat: 7, ease: "none" }, FRENA_Y + 0.55);
      tl.to(dig, { color: "#5ce611", duration: 0.25 }, FRENA - 0.05);
      tl.to(q(".cnt-caja"), { borderColor: "#5ce611", duration: 0.25 }, FRENA - 0.05);
      tl.to(bloque, { scale: 0.92, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, FRENA);
      tl.to(q(".cnt-man"), { opacity: 0, duration: 0.15 }, FRENA - 0.25);
      tl.fromTo(q(".cnt-auto"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, FRENA);
      tl.to(bloque, { ...CHICO, duration: 0.5, ease: "power3.inOut" }, FRENA + 0.9);

      // salida
      tl.to(q("#cnt-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
