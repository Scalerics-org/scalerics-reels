  <script>
    (function () {
      const ID = "s03-tu-dia";
      const DUR = 3.77;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop (geometría centrada en 0,0 dentro del grupo)
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, y: -26, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const rotulo = (el, t) => {
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      const etq = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      const DIA = 0.35;
      const ABREN = 0.55;
      const CUANTO = 1.83;
      const ENVIOS = 2.71;

      dibujar(qa(".s03-dib"), 0, 0.5, 0.4, 0.03);
      tl.fromTo(q(".s03-cab"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);
      tl.fromTo(q(".s03-tel"), { scale: 0.97, svgOrigin: "540 920" }, { scale: 1.02, svgOrigin: "540 920", duration: DUR, ease: "none" }, 0);
      dibujar([q(".s03-rel")], 0.1, 0.5);
      tl.fromTo([q(".s03-aguja-h"), q(".s03-aguja-m")], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.4);
      // el reloj avanza el día: la aguja corta va de las 9 a las 21
      tl.fromTo(q(".s03-aguja-h"), { rotation: 270, svgOrigin: "850 680" }, { rotation: 270 + 360, svgOrigin: "850 680", duration: ENVIOS + 0.4, ease: "none" }, 0.2);
      tl.fromTo(q(".s03-aguja-m"), { rotation: 0, svgOrigin: "850 680" }, { rotation: 360 * 4, svgOrigin: "850 680", duration: ENVIOS + 0.4, ease: "none" }, 0.2);

      pop(q(".s03-m1"), ABREN, "708 828");
      pop(q(".s03-m2"), CUANTO, "708 962");
      pop(q(".s03-m3"), ENVIOS, "708 1096");
      [ABREN, CUANTO, ENVIOS].forEach((t) => {
        tl.to(q(".s03-reloj"), { scale: 1.12, svgOrigin: "850 680", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      });
      etq(q(".s03-e1"), DIA);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
