  <script>
    (function () {
      const ID = "s04-misma";
      const DUR = 4.08;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop (geometría centrada en 0,0 dentro del grupo)
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, y: -26, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const rotulo = (el, t) => {
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      const etq = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      const MISMA = 0.08;
      const TODO = 0.78;
      const DIA = 1.58;
      const Y_VOS = 1.88;
      const CELULAR = 2.68;
      const MANO = 3.28;

      // las copias de la misma pregunta caen una tras otra
      const copias = qa(".s04-copia");
      copias.forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, scale: 0.7, svgOrigin: "115 31" }, { opacity: 1, scale: 1, svgOrigin: "115 31", duration: 0.3, ease: "back.out(1.8)" }, i === 0 ? 0 : MISMA + i * 0.1);
      });
      gsap.set(copias[0], { opacity: 0.6 });
      tl.fromTo(q(".s04-copias"), { y: 10 }, { y: -10, duration: Y_VOS, ease: "none" }, 0);

      // "todo el día": el reloj y sus agujas dan la vuelta
      dibujar([q(".s04-rel")], 0.2, 0.5);
      tl.fromTo([q(".s04-ag-h"), q(".s04-ag-m")], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.5);
      tl.fromTo(q(".s04-ag-m"), { rotation: 0, svgOrigin: "880 760" }, { rotation: 360 * 3, svgOrigin: "880 760", duration: DIA - TODO + 0.3, ease: "power1.inOut" }, TODO);
      tl.fromTo(q(".s04-ag-h"), { rotation: 0, svgOrigin: "880 760" }, { rotation: 360, svgOrigin: "880 760", duration: DIA - TODO + 0.3, ease: "power1.inOut" }, TODO);
      dibujar([q(".s04-vuelta")], TODO, DIA - TODO);
      tl.fromTo(q(".s04-vuelta-p"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, DIA - 0.05);
      etq(q(".s04-e1"), MISMA + 0.2);

      // "Y vos": todo se va y vuelve la mano con el celular
      tl.to([q(".s04-copias"), q(".s04-reloj")], { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, Y_VOS - 0.15);
      gsap.set(q(".s04-mano-g"), { opacity: 0 });
      tl.set(q(".s04-mano-g"), { opacity: 1 }, Y_VOS);
      dibujar(qa(".s04-dib"), Y_VOS, 0.45, 1, 0.02);
      dibujar(qa(".s04-mano"), Y_VOS + 0.15, 0.5, 1, 0.03);
      tl.fromTo(q(".s04-tit"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, Y_VOS + 0.3);
      qa(".s04-fila").forEach((f, i) => {
        tl.fromTo(f, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, Y_VOS + 0.3 + i * 0.12);
      });
      const nums = qa(".s04-n");
      nums.forEach((n, i) => gsap.set(n, { opacity: i === 0 ? 1 : 0 }));
      pop(q(".s04-cont"), Y_VOS + 0.4, "168 -262");
      [CELULAR, MANO].forEach((t, k) => {
        tl.set(nums[k], { opacity: 0 }, t);
        tl.set(nums[k + 1], { opacity: 1 }, t);
        tl.fromTo(q(".s04-cont"), { scale: 1.25, svgOrigin: "168 -262" }, { scale: 1, svgOrigin: "168 -262", duration: 0.25, ease: "back.out(2)" }, t);
      });
      tl.fromTo(q(".s04-tiembla"), { x: 0 }, { x: -5, duration: 0.04, ease: "none", yoyo: true, repeat: 5 }, CELULAR);
      // "mano": la mano aprieta
      tl.to(q(".s04-mano-g"), { scale: 0.95, svgOrigin: "0 0", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, MANO);
      etq(q(".s04-e2"), Y_VOS + 0.1, q(".s04-e1"));

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
