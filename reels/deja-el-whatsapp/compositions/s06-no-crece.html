  <script>
    (function () {
      const ID = "s06-no-crece";
      const DUR = 5.2;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop (geometría centrada en 0,0 dentro del grupo)
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, y: -26, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const rotulo = (el, t) => {
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      const etq = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      const CONTESTAS = 0.8;
      const MISMO = 1.5;
      const SIEMPRE = 1.9;
      const NO = 2.3;
      const HACIENDO = 3.1;
      const CRECER = 3.8;
      const NEGOCIO = 4.3;

      // la mano con el celular, ya dibujándose
      dibujar(qa(".s06-dib"), 0, 0.45, 0.5, 0.02);
      dibujar(qa(".s06-mano"), 0.05, 0.5, 0.6, 0.03);
      tl.fromTo(q(".s06-tit"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.2);
      qa(".s06-fila").forEach((f, i) => {
        tl.fromTo(f, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0.15 + i * 0.1);
      });
      const nums = qa(".s06-n");
      nums.forEach((n, i) => gsap.set(n, { opacity: i === 0 ? 1 : 0 }));
      pop(q(".s06-cont"), 0.3, "168 -262");
      [CONTESTAS, MISMO, SIEMPRE + 0.2].forEach((t, k) => {
        tl.set(nums[k], { opacity: 0 }, t);
        tl.set(nums[k + 1], { opacity: 1 }, t);
        tl.fromTo(q(".s06-cont"), { scale: 1.25, svgOrigin: "168 -262" }, { scale: 1, svgOrigin: "168 -262", duration: 0.25, ease: "back.out(2)" }, t);
        tl.fromTo(q(".s06-tiembla"), { x: 0 }, { x: -6, duration: 0.04, ease: "none", yoyo: true, repeat: 5 }, t);
      });
      etq(q(".s06-e1"), MISMO);

      // la plantita del negocio
      dibujar(qa(".s06-pl"), NO, 0.5, 1, 0.08);
      tl.fromTo(q(".s06-planta"), { rotation: -4, svgOrigin: "0 110" }, { rotation: 3, svgOrigin: "0 110", duration: 1.6, ease: "sine.inOut" }, HACIENDO - 0.4);
      // "crecer": la flecha de lo que podría crecer
      dibujar(qa(".s06-flecha"), CRECER - 0.15, 0.14, 1, 0.1);
      tl.fromTo(q(".s06-punta"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, CRECER + 0.3);
      // "negocio": no pasa, se apaga
      badge(q(".s06-b"), NEGOCIO);
      tl.to([q(".s06-planta"), ...qa(".s06-flecha"), q(".s06-punta")], { opacity: 0.4, duration: 0.35 }, NEGOCIO + 0.1);
      tl.to(q(".s06-mano-g"), { opacity: 0.5, duration: 0.35 }, NEGOCIO + 0.1);
      etq(q(".s06-e2"), CRECER + 0.1, q(".s06-e1"));

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
