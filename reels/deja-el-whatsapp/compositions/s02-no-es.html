  <script>
    (function () {
      const ID = "s02-no-es";
      const DUR = 6.65;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop (geometría centrada en 0,0 dentro del grupo)

        tl.fromTo(el, { opacity: 0, scale: 0.4, y: -26, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const rotulo = (el, t) => {
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      const etq = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      const PRECIOS = 2.0;
      const NI1 = 2.6;
      const HABLAR = 3.6;
      const NI2 = 4.6;
      const TRABAJO = 5.7;

      qa(".s02-n1, .s02-n2, .s02-n3").forEach((n) => gsap.set(n, { opacity: 0 }));
      // la fila se acerca muy despacio
      tl.fromTo(q(".s02-fila"), { scale: 1.05, svgOrigin: "540 880" }, { scale: 1, svgOrigin: "540 880", duration: DUR, ease: "none" }, 0);

      // 1. precios: la etiqueta se dibuja de entrada y se balancea
      dibujar(qa(".s02-d1"), 0, 0.6, 0.6);
      pop(q(".s02-signo"), 0.5, "-26 0");
      tl.fromTo(q(".s02-ico1"), { rotation: -10, svgOrigin: "44 0" }, { rotation: 6, svgOrigin: "44 0", duration: 1.4, ease: "sine.inOut" }, 0.2);
      rotulo(q(".s02-n1"), 1.2);
      tl.to(q(".s02-signo"), { scale: 1.25, svgOrigin: "-26 0", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, PRECIOS - 0.3);
      badge(q(".s02-b1"), PRECIOS);
      tl.to(q(".s02-ico1"), { rotation: 0, x: -6, svgOrigin: "44 0", duration: 0.06, yoyo: true, repeat: 3 }, PRECIOS + 0.05);

      // 2. hablar con vos
      tl.to(q(".s02-ico1"), { opacity: 0.4, duration: 0.3 }, NI1);
      dibujar(qa(".s02-d2"), NI1 - 0.1, 0.5);
      qa(".s02-punto").forEach((d, i) => {
        tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.1 }, NI1 + 0.5 + i * 0.08);
        tl.fromTo(d, { y: 0 }, { y: -8, duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 3 }, NI1 + 0.7 + i * 0.1);
      });
      rotulo(q(".s02-n2"), HABLAR - 0.3);
      badge(q(".s02-b2"), HABLAR + 0.3);
      tl.to(q(".s02-ico2"), { x: -6, duration: 0.06, yoyo: true, repeat: 3 }, HABLAR + 0.35);

      // 3. el trabajo
      tl.to(q(".s02-ico2"), { opacity: 0.4, duration: 0.3 }, NI2);
      dibujar(qa(".s02-d3"), NI2 - 0.1, 0.5);
      pop(q(".s02-cierre"), NI2 + 0.4, "0 4");
      tl.fromTo(q(".s02-ico3"), { rotation: -6, svgOrigin: "0 66" }, { rotation: 0, svgOrigin: "0 66", duration: 0.7, ease: "back.out(2)" }, NI2);
      rotulo(q(".s02-n3"), TRABAJO - 0.3);
      badge(q(".s02-b3"), TRABAJO);
      tl.to(q(".s02-ico3"), { x: -6, duration: 0.06, yoyo: true, repeat: 3 }, TRABAJO + 0.05);

      // etiqueta y los tres badges laten juntos
      etq(q(".s02-e1"), PRECIOS);
      tl.to([q(".s02-b1"), q(".s02-b2"), q(".s02-b3")], { scale: 1.22, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, TRABAJO + 0.5);

      // salida

      window.__timelines = window.__timelines || {};
