    [data-composition-id="s01-gancho"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01-gancho" data-width="1080" data-height="1920" data-duration="3.30">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="3.30" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- la mano con el celular: geometría centrada en 0,0 (centro del celular) -->
        <g transform="translate(540 850) scale(0.92)">
          <g class="s01-todo">
            <g class="s01-tiembla">
              <!-- celular -->
              <rect class="ln s01-dib" x="-160" y="-280" width="320" height="560" rx="46" />
              <line class="ln s01-dib" x1="-34" y1="-252" x2="34" y2="-252" />
              <text class="ui-titulo s01-tit" x="-128" y="-192">Chats</text>
              <line class="ln-tenue s01-dib" x1="-134" y1="-168" x2="134" y2="-168" />
              <!-- filas de chats -->
              <g class="s01-fila"><circle class="ln" cx="-104" cy="-118" r="22" /><line class="ln" x1="-66" y1="-128" x2="50" y2="-128" /><line class="ln-tenue" x1="-66" y1="-104" x2="20" y2="-104" /><circle class="ln-ac" cx="112" cy="-116" r="17" /><text data-layout-ignore class="badge-num" x="112" y="-109" text-anchor="middle">4</text></g>
              <g class="s01-fila"><circle class="ln" cx="-104" cy="-40" r="22" /><line class="ln" x1="-66" y1="-50" x2="34" y2="-50" /><line class="ln-tenue" x1="-66" y1="-26" x2="40" y2="-26" /><circle class="ln-ac" cx="112" cy="-38" r="17" /><text data-layout-ignore class="badge-num" x="112" y="-31" text-anchor="middle">2</text></g>
              <g class="s01-fila"><circle class="ln" cx="-104" cy="38" r="22" /><line class="ln" x1="-66" y1="28" x2="60" y2="28" /><line class="ln-tenue" x1="-66" y1="52" x2="10" y2="52" /><circle class="ln-ac" cx="112" cy="40" r="17" /><text data-layout-ignore class="badge-num" x="112" y="47" text-anchor="middle">7</text></g>
              <g class="s01-fila"><circle class="ln" cx="-104" cy="116" r="22" /><line class="ln" x1="-66" y1="106" x2="40" y2="106" /><line class="ln-tenue" x1="-66" y1="130" x2="30" y2="130" /><circle class="ln-ac" cx="112" cy="118" r="17" /><text data-layout-ignore class="badge-num" x="112" y="125" text-anchor="middle">3</text></g>
              <g class="s01-fila"><circle class="ln" cx="-104" cy="194" r="22" /><line class="ln" x1="-66" y1="184" x2="56" y2="184" /><line class="ln-tenue" x1="-66" y1="208" x2="16" y2="208" /><circle class="ln-ac" cx="112" cy="196" r="17" /><text data-layout-ignore class="badge-num" x="112" y="203" text-anchor="middle">5</text></g>
              <!-- la mano -->
              <path class="ln s01-mano" d="M152 -40 C198 -46 206 -4 156 -2" />
              <path class="ln s01-mano" d="M152 22 C202 16 210 60 156 62" />
              <path class="ln s01-mano" d="M152 86 C200 80 208 124 156 126" />
              <path class="ln s01-mano" d="M154 150 C196 146 202 184 158 188" />
              <path class="ln s01-mano" d="M-206 236 C-216 170 -200 120 -170 92 C-152 76 -130 88 -140 112" />
              <path class="ln s01-mano" d="M-206 236 C-200 300 -150 340 -84 352 L-76 420" />

              <!-- contador de sin leer -->
              <g class="s01-cont">

                <text class="contador s01-n" x="168" y="-251" text-anchor="middle">22</text>
                <text class="contador s01-n" x="168" y="-251" text-anchor="middle">31</text>

            <!-- vibración -->
            <g class="s01-vib">
              <path class="ln s01-vib-l" d="M-236 -70 Q-252 -20 -236 30" />

            <!-- cartelito DUEÑO colgado de la muñeca -->
            <g class="s01-tag">
              <path class="ln" d="M110 390 L176 398" />
              <rect class="ln" x="176" y="372" width="170" height="54" rx="12" />

      <div class="etiqueta"><span class="s01-e1">Dejá de atender</span><span class="s01-e2">Sí, vos</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-gancho";
      const DUR = 3.3;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const ATENDER = 0.5;
      const WHATSAPP = 1.0;
      const VOS = 1.4;
      const SI_VOS = 2.18;
      const DUENO = 3.0;

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (ti > 0 ? 1 : desde ?? 1) });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // celular y mano: arrancan medio dibujados (el cuadro 0 no puede ser negro)
      dibujar(qa(".s01-dib"), 0, 0.6, 0.45, 0);
      dibujar(qa(".s01-mano"), 0, 0.7, 0.5, 0);
      tl.fromTo(q(".s01-tit"), { opacity: 0.4 }, { opacity: 1, duration: 0.3 }, 0);
      // se acerca despacio todo el tiempo
      tl.fromTo(q(".s01-todo"), { scale: 0.95, svgOrigin: "0 0" }, { scale: 1.02, svgOrigin: "0 0", duration: DUR, ease: "none" }, 0);

      // los chats entran uno tras otro, desde arriba
      const filas = qa(".s01-fila");
      const TF = [0, 0.55, 0.95, 1.35, 1.75];
      filas.forEach((f, i) => {
        tl.fromTo(f, { opacity: i === 0 ? 0.5 : 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, TF[i]);
      });

      // el contador sube con cada chat
      const nums = qa(".s01-n");
      tl.fromTo(q(".s01-cont"), { opacity: 0.6, scale: 0.85, svgOrigin: "168 -262" }, { opacity: 1, scale: 1, svgOrigin: "168 -262", duration: 0.35, ease: "back.out(1.6)" }, 0);
      nums.forEach((n, i) => gsap.set(n, { opacity: i === 0 ? 1 : 0 }));
      const TN = [0, 0.6, 1.0, VOS, 1.8];
      nums.forEach((n, i) => {
        if (i === 0) return;
        tl.set(nums[i - 1], { opacity: 0 }, TN[i]);
        tl.set(n, { opacity: 1 }, TN[i]);
        tl.fromTo(q(".s01-cont"), { scale: 1.25, svgOrigin: "168 -262" }, { scale: 1, svgOrigin: "168 -262", duration: 0.25, ease: "back.out(2)" }, TN[i]);
      });

      // "WhatsApp": vibra
      const vib = qa(".s01-vib-l");
      gsap.set(vib, { opacity: 0 });
      [WHATSAPP, VOS, 1.9, SI_VOS + 0.1].forEach((t, k) => {
        tl.fromTo(vib, { opacity: 0, scale: 0.8, svgOrigin: "0 0" }, { opacity: 1, scale: 1.05, svgOrigin: "0 0", duration: 0.12, ease: "power2.out" }, t);
        tl.to(vib, { opacity: 0, duration: 0.2 }, t + 0.22);
        tl.fromTo(q(".s01-tiembla"), { x: 0 }, { x: k === 1 ? -9 : -5, duration: 0.04, ease: "none", yoyo: true, repeat: 5 }, t);
      });

      // etiquetas
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, ATENDER);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.2 }, SI_VOS - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, SI_VOS);

      // "Sí, vos": punch hacia la cámara
      tl.to(q(".s01-todo"), { scale: 1.08, svgOrigin: "0 0", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, SI_VOS);

      // "dueño": el cartelito cae colgado de la muñeca
      tl.fromTo(q(".s01-tag"), { opacity: 0, rotation: -16, y: -20, svgOrigin: "110 390" }, { opacity: 1, rotation: 0, y: 0, svgOrigin: "110 390", duration: 0.4, ease: "back.out(2)" }, DUENO - 0.25);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
