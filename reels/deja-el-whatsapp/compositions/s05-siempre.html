<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s05-siempre"] .cap { position: absolute; inset: 0; }
    [data-composition-id="s05-siempre"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s05-siempre"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-siempre"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-siempre"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.4); stroke-width: 4; stroke-linecap: round; }
    [data-composition-id="s05-siempre"] .relleno-ac { fill: #5ce611; }
    [data-composition-id="s05-siempre"] .relleno { fill: #efeee5; }
    [data-composition-id="s05-siempre"] .ui { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 26px; fill: #efeee5; }
    [data-composition-id="s05-siempre"] .ui-b { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s05-siempre"] .ui-ac { fill: #5ce611; }
    [data-composition-id="s05-siempre"] .grande { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 56px; fill: #5ce611; }
    [data-composition-id="s05-siempre"] .hora { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.08em; fill: rgba(239, 238, 229, 0.55); }
    [data-composition-id="s05-siempre"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.14em; fill: #efeee5; }
    [data-composition-id="s05-siempre"] .mono-ac { fill: #5ce611; }
    [data-composition-id="s05-siempre"] .contador { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 32px; fill: #0b1d35; }
    [data-composition-id="s05-siempre"] .badge-num { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 19px; fill: #5ce611; }
    [data-composition-id="s05-siempre"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s05-siempre"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s05-siempre" data-width="1080" data-height="1920" data-duration="2.70">
    <div id="s05-escena" class="cap clip" data-start="0" data-duration="2.70" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s05-fila">
          <g transform="translate(250 960)"><g class="s05-v1">
            <rect class="ln s05-d1" x="-110" y="30" width="220" height="80" rx="8" />
            <rect class="ln s05-d1" x="-72" y="-50" width="96" height="80" rx="10" />
            <path class="ln s05-d1" d="M-56 -30 H8" />
            <g transform="translate(70 -150)"><g class="s05-mini s05-mini1"><rect class="ln" x="-30" y="-50" width="60" height="100" rx="12" /><rect class="relleno-ac" x="-18" y="-26" width="30" height="16" rx="6" /><rect class="relleno-ac" x="-18" y="0" width="22" height="16" rx="6" /></g></g>
          </g><text class="mono s05-n1" x="0" y="170" text-anchor="middle">MOSTRADOR</text></g>
          <g transform="translate(540 960)"><g class="s05-v2">
            <circle class="ln s05-d2" cx="0" cy="40" r="70" />
            <circle class="ln-tenue s05-d2" cx="0" cy="40" r="44" />
            <path class="ln s05-d2" d="M-104 -20 V110 M-116 -20 V8 Q-104 22 -92 8 V-20" />
            <path class="ln s05-d2" d="M104 110 V-20 Q124 10 104 40" />
            <g transform="translate(70 -150)"><g class="s05-mini s05-mini2"><rect class="ln" x="-30" y="-50" width="60" height="100" rx="12" /><rect class="relleno-ac" x="-18" y="-26" width="30" height="16" rx="6" /><rect class="relleno-ac" x="-18" y="0" width="22" height="16" rx="6" /></g></g>
          </g><text class="mono s05-n2" x="0" y="170" text-anchor="middle">CENA</text></g>
          <g transform="translate(830 960)"><g class="s05-v3">
            <rect class="ln s05-d3" x="-72" y="-26" width="144" height="136" rx="14" />
            <path class="ln s05-d3" d="M-72 14 H72" />
            <path class="ln s05-d3" d="M-36 -42 V-12 M36 -42 V-12" />
            <text class="ui-b s05-dom" x="0" y="78" text-anchor="middle">DOM</text>
            <g transform="translate(70 -150)"><g class="s05-mini s05-mini3"><rect class="ln" x="-30" y="-50" width="60" height="100" rx="12" /><rect class="relleno-ac" x="-18" y="-26" width="30" height="16" rx="6" /><rect class="relleno-ac" x="-18" y="0" width="22" height="16" rx="6" /></g></g>
          </g><text class="mono s05-n3" x="0" y="170" text-anchor="middle">DOMINGO</text></g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s05-e1">Siempre contestando</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-siempre";
      const DUR = 2.7;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop (geometría centrada en 0,0 dentro del grupo)
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, y: -26, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const rotulo = (el, t) => {
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      const etq = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      const MOSTRADOR = 0.6;
      const CENA = 1.6;
      const DOMINGO = 2.2;

      qa(".s05-n1, .s05-n2, .s05-n3, .s05-dom").forEach((n) => gsap.set(n, { opacity: 0 }));
      tl.fromTo(q(".s05-fila"), { scale: 1.04, svgOrigin: "540 960" }, { scale: 1, svgOrigin: "540 960", duration: DUR, ease: "none" }, 0);
      const vineta = (k, t0, tw) => {
        dibujar(qa(".s05-d" + k), t0, 0.45, t0 === 0 ? 0.5 : 1, 0.05);
        pop(q(".s05-mini" + k), tw - 0.15, "0 50");
        tl.to(q(".s05-mini" + k), { rotation: -8, svgOrigin: "0 50", duration: 0.05, yoyo: true, repeat: 5 }, tw + 0.2);
        rotulo(q(".s05-n" + k), tw);
      };
      vineta(1, 0, MOSTRADOR);
      vineta(2, CENA - 0.45, CENA);
      tl.fromTo(q(".s05-dom"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, DOMINGO - 0.15);
      vineta(3, DOMINGO - 0.4, DOMINGO);
      tl.to(q(".s05-v1"), { opacity: 0.45, duration: 0.3 }, CENA);
      tl.to(q(".s05-v2"), { opacity: 0.45, duration: 0.3 }, DOMINGO);
      etq(q(".s05-e1"), 0.3);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
