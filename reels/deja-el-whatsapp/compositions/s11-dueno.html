  <style>

  <div id="root" data-composition-id="s11-dueno" data-width="1080" data-height="1920" data-duration="2.24">

  <script>
    (function () {
      const ID = "s11-dueno";
      const DUR = 2.24;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.04);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // badge de "no": cae desde arriba con pop (geometría centrada en 0,0 dentro del grupo)
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, y: -26, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const rotulo = (el, t) => {
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      const etq = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      const VOLVES = 0.56;
      const DUENO = 1.36;

      dibujar(qa(".s11-d"), 0, 0.45, 0.5, 0.04);
      dibujar(qa(".s11-p"), 0.1, 0.45, 0.6, 0.05);
      tl.fromTo(q(".s11-todo"), { scale: 0.97, svgOrigin: "540 1000" }, { scale: 1.02, svgOrigin: "540 1000", duration: DUR, ease: "none" }, 0);
      // el celular contesta solo, apoyado en el mostrador
      qa(".s11-bu").forEach((b, i) => {
        tl.fromTo(b, { opacity: 0, x: i % 2 ? 10 : -10 }, { opacity: i % 2 ? 0.6 : 1, x: 0, duration: 0.2, ease: "power3.out" }, 0.25 + i * 0.35);
      });
      // "volvés": el dueño se estira, con las manos libres
      tl.fromTo(q(".s11-duenio"), { y: 0 }, { y: -12, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, VOLVES);
      etq(q(".s11-e1"), VOLVES);
      // "dueño": vuelve el cartelito, ahora con tilde
      tl.fromTo(q(".s11-tag"), { opacity: 0, rotation: -14, y: -16, svgOrigin: "700 868" }, { opacity: 1, rotation: 0, y: 0, svgOrigin: "700 868", duration: 0.4, ease: "back.out(2)" }, DUENO - 0.3);
      tl.fromTo(q(".s11-tilde"), { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, DUENO);

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
