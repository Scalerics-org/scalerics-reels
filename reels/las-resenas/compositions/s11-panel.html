<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s11-panel"] .s11-capa, [data-composition-id="s11-panel"] .s11-esc, [data-composition-id="s11-panel"] .s11-svg { position: absolute; inset: 0; }
    [data-composition-id="s11-panel"] .s11-l { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; letter-spacing: -0.02em; font-weight: 800; color: #ffffff; }
    [data-composition-id="s11-panel"] .s11-et { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.34em; color: #5ce611; text-transform: uppercase; }
    [data-composition-id="s11-panel"] .s11-d { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s11-panel"] .s11-g { fill: none; stroke: #7c8698; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s11-panel"] .s11-v { fill: none; stroke: #5ce611; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s11-panel"] .s11-r { fill: none; stroke: #b25b57; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s11-panel"] .s11-card { position: absolute; border: 4px solid rgba(239, 238, 229, 0.85); border-radius: 30px; background: #0b1828; padding: 30px 34px; box-sizing: border-box; }
    [data-composition-id="s11-panel"] .s11-cn { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 38px; color: #ffffff; }
    [data-composition-id="s11-panel"] .s11-ct { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 36px; line-height: 1.3; color: #efeee5; }
    [data-composition-id="s11-panel"] .s11-cm { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.06em; color: #7c8698; }
    [data-composition-id="s11-panel"] .s11-ava { position: absolute; width: 78px; height: 78px; border-radius: 50%; border: 4px solid #efeee5; box-sizing: border-box; }
    [data-composition-id="s11-panel"] .s11-mini { display: block; }
    [data-composition-id="s11-panel"] .s11-ves { top: 450px; font-size: 96px; }
    [data-composition-id="s11-panel"] .s11-llegaron { top: 560px; font-size: 140px; color: #5ce611; font-weight: 900; }
    [data-composition-id="s11-panel"] .s11-panel { position: absolute; left: 130px; top: 750px; width: 820px; height: 600px; border: 4px solid #efeee5; border-radius: 34px; box-sizing: border-box; background: #0b1828; }
    [data-composition-id="s11-panel"] .s11-ph { position: absolute; left: 36px; top: 26px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.16em; color: #5ce611; text-transform: uppercase; }
    [data-composition-id="s11-panel"] .s11-fila { position: absolute; left: 30px; width: 756px; height: 150px; border-top: 3px solid rgba(239, 238, 229, 0.25); }
    [data-composition-id="s11-panel"] .s11-fila .s11-ava { left: 10px; top: 36px; }
    [data-composition-id="s11-panel"] .s11-fila .s11-cn { position: absolute; left: 110px; top: 32px; font-size: 36px; }
    [data-composition-id="s11-panel"] .s11-fila .s11-mini { position: absolute; left: 110px; top: 82px; }
    [data-composition-id="s11-panel"] .s11-tag { position: absolute; right: 8px; top: 50px; padding: 0 20px; height: 54px; border-radius: 27px; border: 3px solid #5ce611; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.08em; line-height: 48px; color: #5ce611; text-transform: uppercase; box-sizing: border-box; }
    [data-composition-id="s11-panel"] .s11-contestas { top: 1410px; font-size: 92px; }
  </style>
  <div id="root" data-composition-id="s11-panel" data-width="1080" data-height="1920" data-duration="2.36">
    <div id="s11-escena" class="s11-capa clip" data-start="0" data-duration="2.36" data-track-index="0">
      <div class="s11-esc">
        <div class="s11-et">Tu panel</div>
        <div class="s11-l s11-ves">Vos ves cuáles</div>
        <div class="s11-l s11-llegaron">llegaron</div>
        <div class="s11-panel">
        <div class="s11-ph">Reseñas nuevas</div>
        <div class="s11-fila" style="top: 90px"><div class="s11-ava"></div><div class="s11-cn">Laura P.</div><svg class="s11-mini" viewBox="0 0 270 50" width="270" height="50"></svg><div class="s11-tag">✓ Contestada</div></div>
        <div class="s11-fila" style="top: 250px"><div class="s11-ava"></div><div class="s11-cn">Diego M.</div><svg class="s11-mini" viewBox="0 0 270 50" width="270" height="50"></svg><div class="s11-tag">✓ Contestada</div></div>
        <div class="s11-fila" style="top: 410px"><div class="s11-ava"></div><div class="s11-cn">Ana S.</div><svg class="s11-mini" viewBox="0 0 270 50" width="270" height="50"></svg><div class="s11-tag">✓ Contestada</div></div>
        </div>
        <div class="s11-l s11-contestas">y las contestás.</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s11-panel";
      const DUR = 2.36;
      const P = "s11-";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s.replace(/__/g, P));
      const qa = (s) => Array.from(root.querySelectorAll(s.replace(/__/g, P)));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const estrella = (cx, cy, R) => {
        let d = "";
        for (let k = 0; k < 10; k++) {
          const r = k % 2 ? R * 0.46 : R;
          const a = -Math.PI / 2 + (k * Math.PI) / 5;
          d += (k ? " L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1);
        }
        return d + " Z";
      };
      // path de estrella dentro de un <svg>/<g>; devuelve el elemento
      const ponerEstrella = (padre, cx, cy, R, estilo) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", estrella(cx, cy, R));
        for (const [k, v] of Object.entries(estilo)) p.setAttribute(k, v);
        padre.appendChild(p);
        return p;
      };
      // fila de 5 estrellas chicas en un svg .mini: llenas = cuántas, color = de las llenas
      const fila = (svg, llenas, color) => {
        const out = [];
        for (let k = 0; k < 5; k++) {
          const lleno = k < llenas;
          out.push(ponerEstrella(svg, 24 + k * 52, 24, 20, lleno ? { fill: color, stroke: color, "stroke-width": 3, "stroke-linejoin": "round" } : { fill: "none", stroke: "#7c8698", "stroke-width": 3, "stroke-linejoin": "round" }));
        }
        return out;
      };
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1), opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // golpe de escala (entra grande y cae)
      const golpe = (el, t, s) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: s ?? 1.45 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, t - 0.05); };
      // entra desde abajo
      const sube = (el, t, dy) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, y: dy ?? 70 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.8)", immediateRender: false }, t - 0.04); };
      // pop (scale 0.85 → 1)
      const pop = (el, t) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t); };
      const sacudon = (t) => [[-7, 3], [5, -2], [0, 0]].forEach(([x, y], i) => tl.to(q(".__esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // tipeo: muestra el texto letra por letra (determinista)
      const tipear = (el, t, dur) => {
        const txt = el.textContent; el.textContent = "";
        const spans = [...txt].map((c) => { const s = document.createElement("span"); s.textContent = c; s.style.opacity = 0; el.appendChild(s); return s; });
        spans.forEach((s, i) => tl.set(s, { opacity: 1 }, t + (dur * i) / spans.length));
      };
      const LLEGARON = 0.63, CONTESTAS = 1.25;
      tl.fromTo(q(".__ves"), { opacity: 0.5, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, 0);
      tl.fromTo(q(".__et"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.05);
      pop(q(".__panel"), 0.0);
      golpe(q(".__llegaron"), LLEGARON);
      const filas = qa(".__fila");
      filas.forEach((f, i) => {
        gsap.set(f, { opacity: 0 });
        tl.fromTo(f, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, 0.25 + i * 0.15);
        const est = fila(f.querySelector("svg"), 5, "#5ce611");
        est.forEach((e, k) => { gsap.set(e, { opacity: 0, scale: 0, svgOrigin: (24 + k * 52) + " 24" }); tl.to(e, { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(2)" }, 0.45 + i * 0.15 + k * 0.04); });
      });
      golpe(q(".__contestas"), CONTESTAS);
      qa(".__tag").forEach((t, i) => pop(t, CONTESTAS + 0.08 + i * 0.12));
      tl.to(q(".__panel"), { scale: 1.02, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.7);

      // salida
      tl.to(q("#__escena"), { scale: 1.1, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 55%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
