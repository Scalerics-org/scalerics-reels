  </style>
  <div id="root" data-composition-id="s05-uno" data-width="1080" data-height="1920" data-duration="6.56">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="6.56" data-track-index="0">
      <div class="s05-esc">
        <div class="s05-et s05-et1">Paso uno</div>
        <div class="s05-a">
        <div class="s05-l s05-tres">Tres cosas</div>
        <div class="s05-l s05-cambiar">para cambiarlo.</div>
        <div class="s05-caja" style="left: 210px">1</div>
        <div class="s05-caja" style="left: 450px">2</div>
        <div class="s05-caja" style="left: 690px">3</div>
        </div>
        <div class="s05-b">
        <div class="s05-uno">1</div>

        <div class="s05-r s05-momento">en el momento</div>

        <svg class="s05-svg" viewBox="0 0 1080 1920" width="1080" height="1920">
        <path class="s05-d s05-globo" d="M240 990 L840 990 Q880 990 880 1030 L880 1150 Q880 1190 840 1190 L430 1190 L360 1250 L372 1190 L240 1190 Q200 1190 200 1150 L200 1030 Q200 990 240 990 Z" />
        <rect class="s05-v s05-marco" x="170" y="960" width="740" height="262" rx="54" />

  </div>
  <script>
    (function () {
      const ID = "s05-uno";
      const DUR = 6.56;
      const P = "s05-";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s.replace(/__/g, P));
      const qa = (s) => Array.from(root.querySelectorAll(s.replace(/__/g, P)));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const estrella = (cx, cy, R) => {
        let d = "";
        for (let k = 0; k < 10; k++) {
          const r = k % 2 ? R * 0.46 : R;
          const a = -Math.PI / 2 + (k * Math.PI) / 5;
          d += (k ? " L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1);
        }
        return d + " Z";
      };
      // path de estrella dentro de un <svg>/<g>; devuelve el elemento
      const ponerEstrella = (padre, cx, cy, R, estilo) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", estrella(cx, cy, R));
        for (const [k, v] of Object.entries(estilo)) p.setAttribute(k, v);
        padre.appendChild(p);
        return p;
      };
      // fila de 5 estrellas chicas en un svg .mini: llenas = cuántas, color = de las llenas
      const fila = (svg, llenas, color) => {
        const out = [];
        for (let k = 0; k < 5; k++) {
          const lleno = k < llenas;
          out.push(ponerEstrella(svg, 24 + k * 52, 24, 20, lleno ? { fill: color, stroke: color, "stroke-width": 3, "stroke-linejoin": "round" } : { fill: "none", stroke: "#7c8698", "stroke-width": 3, "stroke-linejoin": "round" }));
        }
        return out;
      };
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1), opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // golpe de escala (entra grande y cae)
      const golpe = (el, t, s) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: s ?? 1.45 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, t - 0.05); };
      // entra desde abajo
      const sube = (el, t, dy) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, y: dy ?? 70 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.8)", immediateRender: false }, t - 0.04); };
      // pop (scale 0.85 → 1)
      const pop = (el, t) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t); };
      const sacudon = (t) => [[-7, 3], [5, -2], [0, 0]].forEach(([x, y], i) => tl.to(q(".__esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // tipeo: muestra el texto letra por letra (determinista)
      const tipear = (el, t, dur) => {
        const txt = el.textContent; el.textContent = "";
        const spans = [...txt].map((c) => { const s = document.createElement("span"); s.textContent = c; s.style.opacity = 0; el.appendChild(s); return s; });
        spans.forEach((s, i) => tl.set(s, { opacity: 1 }, t + (dur * i) / spans.length));
      };
      const CAMBIAR = 0.6, UNO = 1.72, PEDILA = 2.36, MOMENTO = 2.83, JUSTO = 3.23, CUANDO = 3.91, QUEDO = 4.8, AHI = 5.53;
      tl.fromTo(q(".__tres"), { opacity: 0.5, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, 0);
      sube(q(".__cambiar"), CAMBIAR, 40);
      const cajas = qa(".__caja");
      cajas.forEach((c, i) => pop(c, 0.15 + i * 0.12));
      gsap.set(q(".__et1"), { opacity: 0 });
      // "uno": se van la 2 y la 3, la 1 se vuelve gigante
      tl.to([cajas[1], cajas[2], q(".__tres"), q(".__cambiar")], { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, UNO - 0.2);
      tl.to(cajas[0], { scale: 2.2, x: -60, y: -280, opacity: 0, duration: 0.25, ease: "power3.in" }, UNO - 0.15);
      golpe(q(".__uno"), UNO + 0.05, 1.3);
      tl.to(q(".__et1"), { opacity: 1, duration: 0.25 }, UNO);
      golpe(q(".__pedila"), PEDILA);
      sube(q(".__momento"), MOMENTO, 40);
      golpe(q(".__justo"), JUSTO);
      sacudon(JUSTO + 0.12);
      sube(q(".__cuando"), CUANDO, 40);
      dibujar([q(".__globo")], CUANDO + 0.1, 0.6);
      golpe(q(".__dicho"), QUEDO, 1.25);
      tl.to(q(".__dicho"), { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, QUEDO + 0.35);
      // "ahí": el momento justo
      dibujar([q(".__marco")], AHI - 0.1, 0.4);
      golpe(q(".__ahi"), AHI, 1.6);
      tl.to(q(".__uno"), { scale: 1.06, transformOrigin: "50% 60%", duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, AHI + 0.1);
      tl.to(q(".__marco"), { scale: 1.03, svgOrigin: "540 1090", duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, AHI + 0.5);

      // salida
      tl.to(q("#__escena"), { scale: 1.1, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 55%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
