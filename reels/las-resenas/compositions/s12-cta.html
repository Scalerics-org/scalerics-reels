<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s12-cta"] .s12-capa, [data-composition-id="s12-cta"] .s12-esc, [data-composition-id="s12-cta"] .s12-svg { position: absolute; inset: 0; }
    [data-composition-id="s12-cta"] .s12-l { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; letter-spacing: -0.02em; font-weight: 800; color: #ffffff; }
    [data-composition-id="s12-cta"] .s12-et { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.34em; color: #5ce611; text-transform: uppercase; }
    [data-composition-id="s12-cta"] .s12-d { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s12-cta"] .s12-g { fill: none; stroke: #7c8698; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s12-cta"] .s12-v { fill: none; stroke: #5ce611; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s12-cta"] .s12-r { fill: none; stroke: #b25b57; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s12-cta"] .s12-card { position: absolute; border: 4px solid rgba(239, 238, 229, 0.85); border-radius: 30px; background: #0b1828; padding: 30px 34px; box-sizing: border-box; }
    [data-composition-id="s12-cta"] .s12-cn { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 38px; color: #ffffff; }
    [data-composition-id="s12-cta"] .s12-ct { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 36px; line-height: 1.3; color: #efeee5; }
    [data-composition-id="s12-cta"] .s12-cm { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.06em; color: #7c8698; }
    [data-composition-id="s12-cta"] .s12-ava { position: absolute; width: 78px; height: 78px; border-radius: 50%; border: 4px solid #efeee5; box-sizing: border-box; }
    [data-composition-id="s12-cta"] .s12-mini { display: block; }
    [data-composition-id="s12-cta"] .s12-manda { top: 620px; font-size: 136px; }
    [data-composition-id="s12-cta"] .s12-al { top: 790px; font-size: 92px; color: #efeee5; }
    [data-composition-id="s12-cta"] .s12-barbaro { top: 900px; font-size: 156px; color: #5ce611; font-weight: 900; }
    [data-composition-id="s12-cta"] .s12-ytiene { top: 1090px; font-size: 92px; color: #efeee5; }
    [data-composition-id="s12-cta"] .s12-tres { top: 1200px; font-size: 104px; color: #7c8698; font-weight: 900; }
  </style>
  <div id="root" data-composition-id="s12-cta" data-width="1080" data-height="1920" data-duration="6.52">
    <div id="s12-escena" class="s12-capa clip" data-start="0" data-duration="6.52" data-track-index="0">
      <div class="s12-esc">
        <div class="s12-et">Pasalo</div>
        <svg class="s12-svg" viewBox="0 0 1080 1920" width="1080" height="1920"><g class="s12-estrellas"></g></svg>
        <div class="s12-l s12-manda">Mandáselo</div>
        <div class="s12-l s12-al">al que atiende</div>
        <div class="s12-l s12-barbaro">bárbaro</div>
        <div class="s12-l s12-ytiene">y tiene</div>
        <div class="s12-l s12-tres">tres reseñas.</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s12-cta";
      const DUR = 6.52;
      const P = "s12-";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s.replace(/__/g, P));
      const qa = (s) => Array.from(root.querySelectorAll(s.replace(/__/g, P)));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const estrella = (cx, cy, R) => {
        let d = "";
        for (let k = 0; k < 10; k++) {
          const r = k % 2 ? R * 0.46 : R;
          const a = -Math.PI / 2 + (k * Math.PI) / 5;
          d += (k ? " L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1);
        }
        return d + " Z";
      };
      // path de estrella dentro de un <svg>/<g>; devuelve el elemento
      const ponerEstrella = (padre, cx, cy, R, estilo) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", estrella(cx, cy, R));
        for (const [k, v] of Object.entries(estilo)) p.setAttribute(k, v);
        padre.appendChild(p);
        return p;
      };
      // fila de 5 estrellas chicas en un svg .mini: llenas = cuántas, color = de las llenas
      const fila = (svg, llenas, color) => {
        const out = [];
        for (let k = 0; k < 5; k++) {
          const lleno = k < llenas;
          out.push(ponerEstrella(svg, 24 + k * 52, 24, 20, lleno ? { fill: color, stroke: color, "stroke-width": 3, "stroke-linejoin": "round" } : { fill: "none", stroke: "#7c8698", "stroke-width": 3, "stroke-linejoin": "round" }));
        }
        return out;
      };
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1), opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // golpe de escala (entra grande y cae)
      const golpe = (el, t, s) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: s ?? 1.45 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, t - 0.05); };
      // entra desde abajo
      const sube = (el, t, dy) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, y: dy ?? 70 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.8)", immediateRender: false }, t - 0.04); };
      // pop (scale 0.85 → 1)
      const pop = (el, t) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t); };
      const sacudon = (t) => [[-7, 3], [5, -2], [0, 0]].forEach(([x, y], i) => tl.to(q(".__esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // tipeo: muestra el texto letra por letra (determinista)
      const tipear = (el, t, dur) => {
        const txt = el.textContent; el.textContent = "";
        const spans = [...txt].map((c) => { const s = document.createElement("span"); s.textContent = c; s.style.opacity = 0; el.appendChild(s); return s; });
        spans.forEach((s, i) => tl.set(s, { opacity: 1 }, t + (dur * i) / spans.length));
      };
      const AL = 0.77, BARBARO = 1.07, Y = 1.67, TRES = 2.27, LLENA = 3.3;
      const g = q(".__estrellas");
      const CX = [300, 420, 540, 660, 780];
      const tr = [], rl = [];
      CX.forEach((cx) => {
        tr.push(ponerEstrella(g, cx, 520, 46, { class: P + "d" }));
        rl.push([ponerEstrella(g, cx, 520, 46, { fill: "#5ce611", stroke: "#5ce611", "stroke-width": 5, "stroke-linejoin": "round" }), cx]);
      });
      dibujar(tr, 0, 0.5, 0.5);
      tl.to(tr, { opacity: 0.45, duration: 0.3 }, 0.6);
      tl.fromTo(q(".__manda"), { opacity: 0.5, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, 0);
      tl.fromTo(q(".__et"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.05);
      sube(q(".__al"), AL, 40);
      golpe(q(".__barbaro"), BARBARO);
      sube(q(".__ytiene"), Y, 40);
      golpe(q(".__tres"), TRES, 1.4);
      sacudon(TRES + 0.12);
      // al final, las estrellas se llenan: lo que se merece
      rl.forEach(([f, cx], i) => {
        gsap.set(f, { opacity: 0, scale: 0, svgOrigin: cx + " 520" });
        tl.to(f, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.2)" }, LLENA + i * 0.14);
      });
      tl.to(tr, { opacity: 1, stroke: "#5ce611", duration: 0.2, stagger: 0.14 }, LLENA);
      tl.to(q(".__estrellas"), { scale: 1.06, svgOrigin: "540 520", duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 4.3);
      tl.to(q(".__barbaro"), { scale: 1.04, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 4.5);

      // salida
      tl.to(q("#__escena"), { scale: 1.1, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 55%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
