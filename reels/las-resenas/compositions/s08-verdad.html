<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s08-verdad"] .s08-capa, [data-composition-id="s08-verdad"] .s08-esc, [data-composition-id="s08-verdad"] .s08-svg { position: absolute; inset: 0; }
    [data-composition-id="s08-verdad"] .s08-l { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; letter-spacing: -0.02em; font-weight: 800; color: #ffffff; }
    [data-composition-id="s08-verdad"] .s08-et { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.34em; color: #5ce611; text-transform: uppercase; }

    [data-composition-id="s08-verdad"] .s08-cm { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.06em; color: #7c8698; }
    [data-composition-id="s08-verdad"] .s08-ava { position: absolute; width: 78px; height: 78px; border-radius: 50%; border: 4px solid #efeee5; box-sizing: border-box; }
    [data-composition-id="s08-verdad"] .s08-mini { display: block; }
    [data-composition-id="s08-verdad"] .s08-resenas { top: 460px; font-size: 130px; }
    [data-composition-id="s08-verdad"] .s08-verdad1 { top: 600px; font-size: 130px; color: #5ce611; font-weight: 900; }
    [data-composition-id="s08-verdad"] .s08-clientes { top: 770px; font-size: 92px; color: #efeee5; }
    [data-composition-id="s08-verdad"] .s08-verdad2 { top: 870px; font-size: 92px; color: #5ce611; font-weight: 900; }
    [data-composition-id="s08-verdad"] .s08-tag { position: absolute; left: 330px; top: 1090px; }
    [data-composition-id="s08-verdad"] .s08-tagt { position: absolute; left: 330px; top: 1160px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 36px; letter-spacing: 0.14em; color: #7c8698; text-transform: uppercase; }
    [data-composition-id="s08-verdad"] .s08-comprar { top: 1340px; font-size: 72px; }
  </style>
  <div id="root" data-composition-id="s08-verdad" data-width="1080" data-height="1920" data-duration="4.09">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="4.09" data-track-index="0">
      <div class="s08-esc">
        <div class="s08-et">Sin trucos</div>
        <div class="s08-l s08-resenas">Reseñas</div>
        <div class="s08-l s08-verdad1">de verdad,</div>
        <div class="s08-l s08-clientes">de clientes</div>
        <div class="s08-l s08-verdad2">de verdad.</div>
        <svg class="s08-svg" viewBox="0 0 1080 1920" width="1080" height="1920">
        <path class="s08-g s08-tg" d="M330 1060 L700 1060 L790 1150 L700 1240 L330 1240 Q300 1240 300 1210 L300 1090 Q300 1060 330 1060 Z" />
        <circle class="s08-g s08-tg" cx="728" cy="1150" r="14" />
        <path class="s08-r s08-x" d="M270 1040 L820 1260" />
        <path class="s08-r s08-x" d="M820 1040 L270 1260" />
        </svg>
        <svg class="s08-mini s08-tag" viewBox="0 0 270 50" width="270" height="50"></svg>
        <div class="s08-tagt">$ en oferta</div>
        <div class="s08-l s08-comprar">Nada de comprarlas.</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-verdad";
      const DUR = 4.09;
      const P = "s08-";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s.replace(/__/g, P));
      const qa = (s) => Array.from(root.querySelectorAll(s.replace(/__/g, P)));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const estrella = (cx, cy, R) => {
        let d = "";
        for (let k = 0; k < 10; k++) {
          const r = k % 2 ? R * 0.46 : R;
          const a = -Math.PI / 2 + (k * Math.PI) / 5;
          d += (k ? " L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1);
        }
        return d + " Z";
      };
      // path de estrella dentro de un <svg>/<g>; devuelve el elemento
      const ponerEstrella = (padre, cx, cy, R, estilo) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", estrella(cx, cy, R));
        for (const [k, v] of Object.entries(estilo)) p.setAttribute(k, v);
        padre.appendChild(p);
        return p;
      };
      // fila de 5 estrellas chicas en un svg .mini: llenas = cuántas, color = de las llenas
      const fila = (svg, llenas, color) => {
        const out = [];
        for (let k = 0; k < 5; k++) {
          const lleno = k < llenas;
          out.push(ponerEstrella(svg, 24 + k * 52, 24, 20, lleno ? { fill: color, stroke: color, "stroke-width": 3, "stroke-linejoin": "round" } : { fill: "none", stroke: "#7c8698", "stroke-width": 3, "stroke-linejoin": "round" }));
        }
        return out;
      };
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1), opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // golpe de escala (entra grande y cae)
      const golpe = (el, t, s) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: s ?? 1.45 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, t - 0.05); };
      // entra desde abajo
      const sube = (el, t, dy) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, y: dy ?? 70 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.8)", immediateRender: false }, t - 0.04); };
      // pop (scale 0.85 → 1)
      const pop = (el, t) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t); };
      const sacudon = (t) => [[-7, 3], [5, -2], [0, 0]].forEach(([x, y], i) => tl.to(q(".__esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // tipeo: muestra el texto letra por letra (determinista)
      const tipear = (el, t, dur) => {
        const txt = el.textContent; el.textContent = "";
        const spans = [...txt].map((c) => { const s = document.createElement("span"); s.textContent = c; s.style.opacity = 0; el.appendChild(s); return s; });
        spans.forEach((s, i) => tl.set(s, { opacity: 1 }, t + (dur * i) / spans.length));
      };
      const VERDAD = 0.62, CLIENTES = 1.3, VERDAD2 = 1.92, NADA = 2.54, COMPRAR = 2.92;
      tl.fromTo(q(".__resenas"), { opacity: 0.5, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, 0);
      tl.fromTo(q(".__et"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.05);
      golpe(q(".__verdad1"), VERDAD);
      sube(q(".__clientes"), CLIENTES, 40);
      golpe(q(".__verdad2"), VERDAD2);
      tl.to([q(".__verdad1"), q(".__verdad2")], { scale: 1.04, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, VERDAD2 + 0.3);
      dibujar(qa(".__tg"), NADA - 0.2, 0.4);
      fila(q(".__tag"), 5, "#7c8698");
      pop(q(".__tag"), NADA);
      pop(q(".__tagt"), NADA + 0.1);
      golpe(q(".__comprar"), COMPRAR);
      dibujar(qa(".__x"), COMPRAR + 0.05, 0.22);
      sacudon(COMPRAR + 0.2);
      tl.to([q(".__tag"), q(".__tagt")], { opacity: 0.4, duration: 0.3 }, COMPRAR + 0.3);
      tl.to(q(".__comprar"), { scale: 1.03, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.5);

      // salida
      tl.to(q("#__escena"), { scale: 1.1, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 55%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
