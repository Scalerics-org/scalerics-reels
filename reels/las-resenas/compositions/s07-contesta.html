  <style>

    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s07-contesta"] .s07-cm { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.06em; color: #7c8698; }
    [data-composition-id="s07-contesta"] .s07-ava { position: absolute; width: 78px; height: 78px; border-radius: 50%; border: 4px solid #efeee5; box-sizing: border-box; }

    [data-composition-id="s07-contesta"] .s07-rr { position: absolute; left: 400px; text-align: left; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; letter-spacing: -0.02em; font-weight: 800; color: #ffffff; }

    [data-composition-id="s07-contesta"] .s07-card { left: 120px; top: 980px; width: 840px; height: 230px; }
    [data-composition-id="s07-contesta"] .s07-ava { left: 34px; top: 30px; }
    [data-composition-id="s07-contesta"] .s07-cn { position: absolute; left: 134px; top: 34px; }
    [data-composition-id="s07-contesta"] .s07-mini { position: absolute; left: 134px; top: 88px; }
    [data-composition-id="s07-contesta"] .s07-ct { position: absolute; left: 34px; top: 150px; width: 772px; font-size: 40px; white-space: nowrap; }
    [data-composition-id="s07-contesta"] .s07-resp { position: absolute; left: 220px; top: 1240px; width: 740px; height: 210px; border: 4px solid #5ce611; border-radius: 30px; background: #0b1828; box-sizing: border-box; }
    [data-composition-id="s07-contesta"] .s07-rl { position: absolute; left: 32px; top: 24px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.14em; color: #5ce611; text-transform: uppercase; }
    [data-composition-id="s07-contesta"] .s07-rt { position: absolute; left: 32px; top: 72px; width: 680px; font-family: "Lexend", sans-serif; font-weight: 500; font-size: 38px; line-height: 1.3; color: #ffffff; }
    [data-composition-id="s07-contesta"] .s07-hilo { position: absolute; left: 160px; top: 1210px; width: 4px; height: 110px; background: rgba(239, 238, 229, 0.5); }
    [data-composition-id="s07-contesta"] .s07-calma { top: 1490px; font-size: 92px; color: #5ce611; font-weight: 900; }
  </style>
  <div id="root" data-composition-id="s07-contesta" data-width="1080" data-height="1920" data-duration="4.3">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="4.3" data-track-index="0">
      <div class="s07-esc">
        <div class="s07-et">Paso tres</div>
        <div class="s07-num">3</div>
        <div class="s07-rr s07-contesta">Contestá</div>
        <div class="s07-rr s07-todas">todas.</div>
        <div class="s07-l s07-malas">También las malas,</div>
        <div class="s07-card">
        <div class="s07-ava"></div>
        <div class="s07-cn">Sofía R.</div>
        <svg class="s07-mini" viewBox="0 0 270 50" width="270" height="50"></svg>
        <div class="s07-ct">Tardaron bastante con mi pedido.</div>
        </div>
        <div class="s07-hilo"></div>
        <div class="s07-resp">
        <div class="s07-rl">Respuesta del local</div>
        <div class="s07-rt s07-rtt">¡Gracias por avisarnos, Sofía! Ya lo estamos mejorando.</div>
        </div>
        <div class="s07-l s07-calma">con calma.</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s07-contesta";
      const DUR = 4.3;
      const P = "s07-";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s.replace(/__/g, P));
      const qa = (s) => Array.from(root.querySelectorAll(s.replace(/__/g, P)));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const estrella = (cx, cy, R) => {
        let d = "";
        for (let k = 0; k < 10; k++) {
          const r = k % 2 ? R * 0.46 : R;
          const a = -Math.PI / 2 + (k * Math.PI) / 5;
          d += (k ? " L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1);
        }
        return d + " Z";
      };
      // path de estrella dentro de un <svg>/<g>; devuelve el elemento
      const ponerEstrella = (padre, cx, cy, R, estilo) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", estrella(cx, cy, R));
        for (const [k, v] of Object.entries(estilo)) p.setAttribute(k, v);
        padre.appendChild(p);
        return p;
      };
      // fila de 5 estrellas chicas en un svg .mini: llenas = cuántas, color = de las llenas
      const fila = (svg, llenas, color) => {
        const out = [];
        for (let k = 0; k < 5; k++) {
          const lleno = k < llenas;
          out.push(ponerEstrella(svg, 24 + k * 52, 24, 20, lleno ? { fill: color, stroke: color, "stroke-width": 3, "stroke-linejoin": "round" } : { fill: "none", stroke: "#7c8698", "stroke-width": 3, "stroke-linejoin": "round" }));
        }
        return out;
      };
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1), opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // golpe de escala (entra grande y cae)
      const golpe = (el, t, s) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: s ?? 1.45 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, t - 0.05); };
      // entra desde abajo
      const sube = (el, t, dy) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, y: dy ?? 70 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.8)", immediateRender: false }, t - 0.04); };
      // pop (scale 0.85 → 1)
      const pop = (el, t) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t); };
      const sacudon = (t) => [[-7, 3], [5, -2], [0, 0]].forEach(([x, y], i) => tl.to(q(".__esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // tipeo: muestra el texto letra por letra (determinista)
      const tipear = (el, t, dur) => {
        const txt = el.textContent; el.textContent = "";
        const spans = [...txt].map((c) => { const s = document.createElement("span"); s.textContent = c; s.style.opacity = 0; el.appendChild(s); return s; });
        spans.forEach((s, i) => tl.set(s, { opacity: 1 }, t + (dur * i) / spans.length));
      };
      const CONTESTA = 0.59, TODAS = 1.33, TAMBIEN = 1.95, MALAS = 2.42, CON = 3.11;
      tl.fromTo(q(".__num"), { opacity: 0.6, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, 0);
      tl.fromTo(q(".__et"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.05);
      golpe(q(".__contesta"), CONTESTA);
      golpe(q(".__todas"), TODAS);
      sacudon(TODAS + 0.12);
      sube(q(".__malas"), TAMBIEN, 40);
      pop(q(".__card"), MALAS - 0.1);
      fila(q(".__mini"), 2, "#b25b57");
      gsap.set(q(".__hilo"), { scaleY: 0, transformOrigin: "50% 0%" });
      tl.to(q(".__hilo"), { scaleY: 1, duration: 0.25, ease: "power2.out" }, CON - 0.25);
      pop(q(".__resp"), CON - 0.05);
      tipear(q(".__rtt"), CON + 0.1, 0.9);
      golpe(q(".__calma"), CON + 0.15);
      tl.to(q(".__resp"), { scale: 1.03, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.75);

      // salida
      tl.to(q("#__escena"), { scale: 1.1, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 55%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
