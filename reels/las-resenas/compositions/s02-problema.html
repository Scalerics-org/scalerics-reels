  <script>
    (function () {
      const ID = "s02-problema";
      const DUR = 5.18;
      const P = "s02-";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s.replace(/__/g, P));
      const qa = (s) => Array.from(root.querySelectorAll(s.replace(/__/g, P)));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const estrella = (cx, cy, R) => {
        let d = "";
        for (let k = 0; k < 10; k++) {
          const r = k % 2 ? R * 0.46 : R;
          const a = -Math.PI / 2 + (k * Math.PI) / 5;
          d += (k ? " L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1);
        }
        return d + " Z";
      };
      // path de estrella dentro de un <svg>/<g>; devuelve el elemento
      const ponerEstrella = (padre, cx, cy, R, estilo) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", estrella(cx, cy, R));
        for (const [k, v] of Object.entries(estilo)) p.setAttribute(k, v);
        padre.appendChild(p);
        return p;
      };
      // fila de 5 estrellas chicas en un svg .mini: llenas = cuántas, color = de las llenas
      const fila = (svg, llenas, color) => {
        const out = [];
        for (let k = 0; k < 5; k++) {
          const lleno = k < llenas;
          out.push(ponerEstrella(svg, 24 + k * 52, 24, 20, lleno ? { fill: color, stroke: color, "stroke-width": 3, "stroke-linejoin": "round" } : { fill: "none", stroke: "#7c8698", "stroke-width": 3, "stroke-linejoin": "round" }));
        }
        return out;
      };
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1), opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // golpe de escala (entra grande y cae)
      const golpe = (el, t, s) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: s ?? 1.45 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, t - 0.05); };
      // entra desde abajo
      const sube = (el, t, dy) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, y: dy ?? 70 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.8)", immediateRender: false }, t - 0.04); };
      // pop (scale 0.85 → 1)
      const pop = (el, t) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t); };
      const sacudon = (t) => [[-7, 3], [5, -2], [0, 0]].forEach(([x, y], i) => tl.to(q(".__esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // tipeo: muestra el texto letra por letra (determinista)
      const tipear = (el, t, dur) => {
        const txt = el.textContent; el.textContent = "";
        const spans = [...txt].map((c) => { const s = document.createElement("span"); s.textContent = c; s.style.opacity = 0; el.appendChild(s); return s; });
        spans.forEach((s, i) => tl.set(s, { opacity: 1 }, t + (dur * i) / spans.length));
      };
      const RUBROS = 0.91, EL = 1.75, PROBLEMA = 2.21, ESCRIBE = 2.6, ESA = 3.84;
      // íconos de rubros: taza, tijera, llave, bolsa
      const ic = q(".__iconos");
      const Y = 1075;
      const dd = [];
      const add = (d) => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); p.setAttribute("class", P + "d"); ic.appendChild(p); dd.push(p); return p; };
      let c = 255;
      add(`M${c-45} ${Y-40} L${c-38} ${Y+40} Q${c-36} ${Y+50} ${c-26} ${Y+50} L${c+26} ${Y+50} Q${c+36} ${Y+50} ${c+38} ${Y+40} L${c+45} ${Y-40} Z`);
      add(`M${c+43} ${Y-20} Q${c+78} ${Y-20} ${c+72} ${Y+4} Q${c+66} ${Y+24} ${c+40} ${Y+24}`);
      add(`M${c-12} ${Y-62} Q${c-24} ${Y-78} ${c-12} ${Y-94}`);
      add(`M${c+12} ${Y-62} Q${c} ${Y-78} ${c+12} ${Y-94}`);
      c = 445;
      add(`M${c-28} ${Y+52} m-20 0 a20 20 0 1 0 40 0 a20 20 0 1 0 -40 0`);
      add(`M${c+28} ${Y+52} m-20 0 a20 20 0 1 0 40 0 a20 20 0 1 0 -40 0`);
      add(`M${c-16} ${Y+36} L${c+34} ${Y-80}`);
      add(`M${c+16} ${Y+36} L${c-34} ${Y-80}`);
      c = 635;
      add(`M${c-40} ${Y+58} L${c+14} ${Y-14}`);
      add(`M${c-52} ${Y+48} L${c+2} ${Y-24}`);
      add(`M${c+2} ${Y-24} A40 40 0 1 1 ${c+48} ${Y+6} L${c+30} ${Y-14} L${c+40} ${Y-38} L${c+24} ${Y-48} L${c+16} ${Y-26}`);
      c = 825;
      add(`M${c-48} ${Y-34} L${c+48} ${Y-34} L${c+56} ${Y+58} L${c-56} ${Y+58} Z`);
      add(`M${c-24} ${Y-34} Q${c-24} ${Y-86} ${c} ${Y-86} Q${c+24} ${Y-86} ${c+24} ${Y-34}`);
      dibujar(dd, 0, 0.5, 0.6);
      tl.fromTo(q(".__pasa"), { opacity: 0.5, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 0);
      golpe(q(".__rubros"), RUBROS - 0.2);
      tl.to(ic, { y: -12, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.0);
      tl.to(q(".__a"), { opacity: 0, y: -60, duration: 0.22, ease: "power2.in" }, EL - 0.2);
      // la queja
      gsap.set(q(".__et"), { opacity: 0 });
      tl.fromTo(q(".__et"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3 }, EL);
      sube(q(".__tuvo"), EL);
      golpe(q(".__problema"), PROBLEMA);
      golpe(q(".__escribe"), ESCRIBE);
      pop(q(".__card"), ESCRIBE + 0.1);
      const est = fila(q(".__mini"), 1, "#b25b57");
      est.forEach((e, i) => { gsap.set(e, { opacity: 0 }); tl.to(e, { opacity: 1, duration: 0.1 }, ESCRIBE + 0.35 + i * 0.07); });
      tipear(q(".__texto"), ESCRIBE + 0.5, 1.3);
      sacudon(ESCRIBE + 0.15);
      // esa misma noche
      gsap.set([q(".__luna"), q(".__hora")], { opacity: 0 });
      dibujar([q(".__lunap")], ESA - 0.05, 0.4);
      tl.to(q(".__luna"), { opacity: 1, duration: 0.05 }, ESA - 0.05);
      pop(q(".__hora"), ESA);
      sube(q(".__noche"), ESA, 40);
      tl.to(q(".__card"), { y: -8, duration: 0.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.3);

      // salida
      tl.to(q("#__escena"), { scale: 1.1, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 55%", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
