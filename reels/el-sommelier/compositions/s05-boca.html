  <script>
    (function () {
      const ID = "s05-boca";
      const DUR = 6.01;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const pop = (el, t, s) => tl.fromTo(el, { opacity: 0, scale: s ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      const dibujar = (sel, t, d) => (typeof sel === "string" ? qa(sel) : [sel]).forEach((el) => {
        const L = el.getTotalLength();
        tl.fromTo(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d ?? 0.6, ease: "power2.inOut" }, t);
      });
      const temblor = (el, t, f) => [[-12, 7], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(el, { x: x * (f ?? 1), y: y * (f ?? 1), duration: 0.04, ease: "none" }, t + i * 0.045));
      const etiq = (de, a, t) => {
        if (de) tl.to(q(".s05-e" + de), { opacity: 0, y: -12, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s05-e" + a), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3 }, t);
      };
      qa(".s05-etiqueta span").forEach((e) => gsap.set(e, { opacity: 0 }));

      const BOCA = 0.41, TRANS = 1.38, MANDAME = 2.42, CAPTURA = 3.0, ASPERO = 4.02, MUY = 5.0;
      tl.fromTo(q(".s05-som"), { opacity: 0.5, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(q(".s05-ficha"), { opacity: 0.3, x: 80 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0);
      etiq(0, 1, 0.1);
      // "boca": buches (cachetes inflados, la cabeza se mueve)
      tl.set(q(".s05-som-boca"), { opacity: 0 }, BOCA);
      tl.set(q(".s05-som-cachete"), { opacity: 1 }, BOCA);
      tl.fromTo(q(".s05-som-cachete"), { scaleX: 0.85, transformOrigin: "50% 50%" }, { scaleX: 1.12, duration: 0.18, yoyo: true, repeat: 13, ease: "sine.inOut" }, BOCA);
      tl.to(q(".s05-som-cabeza"), { rotation: 5, transformOrigin: "50% 90%", duration: 0.25, yoyo: true, repeat: 11, ease: "sine.inOut" }, BOCA);
      // la frase se escribe en la ficha
      [[".s05-l1", TRANS], [".s05-l2", MANDAME], [".s05-l3", CAPTURA]].forEach(([s, t]) => tl.fromTo(q(s), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, t - 0.05));
      // "captura": el comprobante con flash
      pop(q(".s05-capt"), CAPTURA - 0.05);
      tl.fromTo(q(".s05-flash"), { opacity: 0.95 }, { opacity: 0, duration: 0.35 }, CAPTURA + 0.15);
      // "áspero"
      gsap.set(q(".s05-sello"), { opacity: 0 });
      tl.fromTo(q(".s05-sello"), { opacity: 0, scale: 1.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.in" }, ASPERO - 0.15);
      temblor(q(".s05-ficha"), ASPERO + 0.08, 0.7);
      tl.set(q(".s05-som-cachete"), { opacity: 0 }, ASPERO);
      tl.set(q(".s05-som-asco"), { opacity: 1 }, ASPERO);
      tl.set(q(".s05-som-ojos-snob"), { opacity: 0 }, ASPERO);
      tl.set(q(".s05-som-ojos-ab"), { opacity: 1 }, ASPERO);
      tl.to(q(".s05-som-ceja-i"), { y: -10, rotation: 10, transformOrigin: "50% 50%", duration: 0.15 }, ASPERO);
      etiq(1, 2, ASPERO);
      // "muy áspero": se tuerce entero
      tl.to(q(".s05-sello"), { scale: 1.18, duration: 0.15, yoyo: true, repeat: 1 }, MUY + 0.1);
      temblor(q(".s05-som"), MUY + 0.15, 1);
      tl.to(q(".s05-som-cabeza"), { rotation: -9, duration: 0.2 }, MUY + 0.2);
    
      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
