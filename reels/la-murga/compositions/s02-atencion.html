<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-atencion"] .s02-capa { position: absolute; inset: 0; }
    [data-composition-id="s02-atencion"] .s02-escenario { position: absolute; inset: 0; }
    [data-composition-id="s02-atencion"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s02-atencion"] .s02-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; }
    [data-composition-id="s02-atencion"] .s02-senor { top: 1186px; font-weight: 900; font-size: 74px; letter-spacing: -0.01em; color: #f7f1e3; }
    [data-composition-id="s02-atencion"] .s02-aten { top: 1290px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 36px; letter-spacing: 0.3em; color: #f2b632; }
    [data-composition-id="s02-atencion"] .s02-renglon { top: 1330px; font-weight: 900; font-size: 92px; letter-spacing: -0.02em; color: #ff5a5f; text-shadow: 0 0 30px rgba(255, 90, 95, 0.4); }
    [data-composition-id="s02-atencion"] .s02-ui { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 30px; fill: #070d26; }
    [data-composition-id="s02-atencion"] .s02-ui-c { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #f7f1e3; }
  </style>
  <div id="root" data-composition-id="s02-atencion" data-width="1080" data-height="1920" data-duration="5.90">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="5.90" data-track-index="0">
      <div class="s02-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g class="s02-coro"></g>
          <!-- el celular del comerciante -->
          <g class="s02-cel">
            <rect x="340" y="820" width="400" height="600" rx="48" fill="#0d1a47" stroke="#f7f1e3" stroke-width="5" />
            <path d="M500 846 H580" stroke="#f7f1e3" stroke-width="5" stroke-linecap="round" />
            <text class="s02-ui-c" x="380" y="912">Cliente</text>
            <path d="M380 930 H700" stroke="#f7f1e3" stroke-width="2" opacity="0.35" />
            <g class="s02-burbuja">
              <rect x="372" y="960" width="300" height="104" rx="22" fill="#f7f1e3" />
              <text class="s02-ui" x="396" y="1004">Hola, ¿tienen</text>
              <text class="s02-ui" x="396" y="1044">para hoy?</text>
            </g>
            <text class="s02-ui-c s02-tilde" x="606" y="1094" opacity="0.6">visto 20:14</text>
            <!-- la respuesta que nunca llega: caja vacía con cursor -->
            <rect x="372" y="1330" width="336" height="60" rx="30" fill="none" stroke="#f7f1e3" stroke-width="3" opacity="0.5" />
            <path class="s02-cursor" d="M398 1344 V1376" stroke="#f2b632" stroke-width="4" stroke-linecap="round" />
          </g>
        </svg>
        <div class="s02-txt s02-senor">Señor comerciante</div>
        <div class="s02-txt s02-aten">Prestá atención</div>
        <div class="s02-txt s02-renglon">Ni un renglón</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-atencion";
      const DUR = 5.90;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      const SENOR = 0.0, ATENCION = 1.67, ESCRIBEN = 2.76, WHATSAPP = 3.31, VOS = 4.13, NI = 4.59;

      // EL CORO: tres murguistas de cara pintada (misma familia que el director de s01)
      const murguista = (cx, cy, k, pint) => `
        <g class="s02-m" transform="translate(${cx} ${cy}) scale(${k})">
          <path d="M-210 190 L-160 260 L-120 200 L-70 270 L-30 205 L0 275 L30 205 L70 270 L120 200 L160 260 L210 190" fill="${pint}" stroke="#f2b632" stroke-width="6" stroke-linejoin="round" />
          <ellipse cx="0" cy="0" rx="172" ry="206" fill="#f7f1e3" />
          <path d="M-78 -130 L-34 -50 L-78 40 L-122 -50 Z" fill="${pint}" />
          <path d="M78 -130 L122 -50 L78 40 L34 -50 Z" fill="${pint}" />
          <path d="M-118 -140 Q-78 -172 -40 -146 M40 -150 Q78 -180 120 -140" fill="none" stroke="#070d26" stroke-width="10" stroke-linecap="round" />
          <ellipse cx="-78" cy="-48" rx="20" ry="24" fill="#f7f1e3" /><circle cx="-76" cy="-44" r="12" fill="#070d26" />
          <ellipse cx="78" cy="-48" rx="20" ry="24" fill="#f7f1e3" /><circle cx="80" cy="-44" r="12" fill="#070d26" />
          <g class="s02-boca">
            <path d="M-80 90 Q0 100 80 90 Q60 190 0 192 Q-60 190 -80 90 Z" fill="#070d26" />
            <path d="M-90 88 Q-40 72 0 84 Q40 72 90 88 Q40 106 0 102 Q-40 106 -90 88 Z" fill="#e63946" />
          </g>
          <g transform="translate(0 -186)">
            <path d="M-222 0 Q0 -48 222 0 Q220 24 0 18 Q-220 24 -222 0 Z" fill="#0d1a47" stroke="#f2b632" stroke-width="6" stroke-linejoin="round" />
            <path d="M-132 2 L-120 -150 Q0 -166 120 -150 L132 2 Z" fill="#0d1a47" stroke="#f2b632" stroke-width="6" stroke-linejoin="round" />
            <path d="M-126 -44 Q0 -60 126 -44 L128 -16 Q0 -32 -128 -16 Z" fill="${pint}" />
          </g>
        </g>`;
      q(".s02-coro").innerHTML = murguista(250, 930, 0.62, "#e63946") + murguista(830, 930, 0.62, "#f2b632") + murguista(540, 880, 0.72, "#5ce611");
      const ms = qa(".s02-m");
      const bocas = qa(".s02-boca");

      // cuadro 0: el coro ya está entrando
      gsap.set(q(".s02-coro"), { opacity: 1 });
      ms.forEach((m, i) => tl.from(m, { y: 160, opacity: 0.3, duration: 0.4, ease: "back.out(1.6)" }, i * 0.06));
      // se balancean juntos con la marcha y cantan (las bocas se abren en cada palabra)
      for (let t = 0.4, k = 0; t < ESCRIBEN; t += 0.54, k++) tl.to(q(".s02-coro"), { rotation: k % 2 ? 3 : -3, svgOrigin: "540 1200", duration: 0.27, ease: "sine.inOut" }, t);
      [0, 0.4, 0.9, 1.41, 1.67, 2.1, 2.49, 2.76].forEach((t) => {
        tl.to(bocas, { scaleY: 1.45, svgOrigin: "0 88", duration: 0.08 }, t);
        tl.to(bocas, { scaleY: 0.85, svgOrigin: "0 88", duration: 0.14 }, t + 0.12);
      });

      // "señor comerciante": cartel blanco; "prestá atención": rótulo dorado
      tl.fromTo(q(".s02-senor"), { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in" }, SENOR + 0.02);
      gsap.set(q(".s02-aten"), { opacity: 0 });
      tl.fromTo(q(".s02-aten"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, ATENCION);
      // el coro señala: todos se inclinan hacia adelante
      tl.to(ms, { scale: "+=0.06", duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.04 }, ATENCION);

      // "te escriben al WhatsApp": el coro sube y se achica, entra el celular
      tl.to([q(".s02-senor"), q(".s02-aten")], { opacity: 0, y: -20, duration: 0.2 }, ESCRIBEN - 0.25);
      tl.to(q(".s02-coro"), { y: -150, scale: 0.62, rotation: 0, svgOrigin: "540 640", opacity: 0.55, duration: 0.4, ease: "power3.inOut" }, ESCRIBEN - 0.2);
      gsap.set(q(".s02-cel"), { opacity: 0 });
      tl.fromTo(q(".s02-cel"), { opacity: 0, y: 380 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)", immediateRender: false }, ESCRIBEN - 0.1);
      gsap.set(q(".s02-burbuja"), { opacity: 0 });
      tl.fromTo(q(".s02-burbuja"), { opacity: 0, scale: 0.6, svgOrigin: "372 1064" }, { opacity: 1, scale: 1, svgOrigin: "372 1064", duration: 0.3, ease: "back.out(2)", immediateRender: false }, WHATSAPP);
      gsap.set(q(".s02-tilde"), { opacity: 0 });
      tl.to(q(".s02-tilde"), { opacity: 0.6, duration: 0.15 }, WHATSAPP + 0.4);
      // cursor que titila esperando la respuesta
      tl.fromTo(q(".s02-cursor"), { opacity: 1 }, { opacity: 0, duration: 0.2, yoyo: true, repeat: 7, ease: "steps(1)" }, WHATSAPP);

      // "y vos": el celular tiembla, nadie escribe. "ni un renglón": golpe rojo
      tl.to(q(".s02-cel"), { rotation: -3, svgOrigin: "540 1120", duration: 0.08, yoyo: true, repeat: 3 }, VOS);
      gsap.set(q(".s02-renglon"), { opacity: 0 });
      tl.fromTo(q(".s02-renglon"), { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.15, ease: "power4.in", immediateRender: false }, NI - 0.08);
      [[-12, 7], [9, -5], [-4, 2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x, y, duration: 0.04, ease: "none" }, NI + 0.08 + i * 0.045));
      tl.to(q(".s02-coro"), { opacity: 1, duration: 0.15 }, NI);
      tl.to(bocas, { scaleY: 1.6, svgOrigin: "0 88", duration: 0.12 }, NI);

      tl.to(q("#s02-escena"), { x: -300, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
