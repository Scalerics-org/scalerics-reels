        tl.fromTo(d, { opacity: 1, x: 0, y: 0, rotation: 0 }, { x: Math.cos(ang) * v * 1.4, y: Math.sin(ang) * v * 0.6, rotation: 180 + i * 40, duration: 0.6, ease: "power3.out", immediateRender: false }, CARNAVAL + (i % 5) * 0.02);
