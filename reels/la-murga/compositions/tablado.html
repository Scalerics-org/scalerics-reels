  <script>
    (function () {
      const ID = "tablado";
      const DUR = 73.44;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";

      // lamparitas a lo largo de las dos curvas (punto en una bezier cuadrática)
      const COLORES = ["#f2b632", "#ff5a5f", "#f7f1e3", "#f2b632", "#5ce611"];
      const g = q(".tb-lamparas");
      const lamps = [];
      const tramo = (p0, p1, p2, n, desde) => {
        for (let k = 0; k < n; k++) {
          const t = (k + 0.5) / n;
          const x = (1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * p1[0] + t * t * p2[0];
          const y = (1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * p1[1] + t * t * p2[1];
          const i = desde + k;
          const c = COLORES[i % COLORES.length];
          const cab = document.createElementNS(NS, "path");
          cab.setAttribute("d", `M${x - 7} ${y + 2} h14 v10 h-14 Z`);
          cab.setAttribute("fill", "#0d1a47"); cab.setAttribute("stroke", "#f7f1e3"); cab.setAttribute("stroke-width", "2"); cab.setAttribute("opacity", "0.5");
          const bulbo = document.createElementNS(NS, "ellipse");
          bulbo.setAttribute("cx", x); bulbo.setAttribute("cy", y + 26); bulbo.setAttribute("rx", 11); bulbo.setAttribute("ry", 15);
          bulbo.setAttribute("fill", c);
          bulbo.setAttribute("style", `filter: drop-shadow(0 0 10px ${c})`);
          g.appendChild(cab); g.appendChild(bulbo);
          lamps.push(bulbo);
        }
      };
      tramo([60, 118], [300, 222], [540, 128], 9, 0);
      tramo([540, 128], [780, 222], [1020, 118], 9, 9);

      // titilan por turnos (determinista): cada lamparita baja y sube en su compás
      lamps.forEach((el, i) => {
        const fase = (i * 0.37) % 1.1;
        tl.fromTo(el, { opacity: 1 }, { opacity: 0.35, duration: 0.18, yoyo: true, repeat: Math.max(0, Math.floor((DUR - fase) / 0.9) * 2 - 1), repeatDelay: 0.54, ease: "steps(1)" }, fase);
      });
      // el cono de luz respira despacio
      tl.fromTo(q(".tb-cono"), { opacity: 0.45 }, { opacity: 0.7, duration: 3.5, yoyo: true, repeat: Math.max(0, Math.floor(DUR / 3.5) - 1), ease: "sine.inOut" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
