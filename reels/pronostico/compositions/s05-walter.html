          <g class="s05-reb s05-reb1"><g transform="translate(470 860)"><path d="M-24 -16 H24 Q30 -16 30 -10 V8 Q30 14 24 14 H-6 L-18 26 L-16 14 H-24 Q-30 14 -30 8 V-10 Q-30 -16 -24 -16 Z" fill="#5ec8ff" stroke="#f4f6fb" stroke-width="4" stroke-linejoin="round" /><circle cx="-12" cy="-1" r="4" fill="#061428" /><circle cx="0" cy="-1" r="4" fill="#061428" /><circle cx="12" cy="-1" r="4" fill="#061428" /></g></g>
          <g class="s05-reb s05-reb2"><g transform="translate(560 870) scale(1.3)"><path d="M-24 -16 H24 Q30 -16 30 -10 V8 Q30 14 24 14 H-6 L-18 26 L-16 14 H-24 Q-30 14 -30 8 V-10 Q-30 -16 -24 -16 Z" fill="#5ec8ff" stroke="#f4f6fb" stroke-width="4" stroke-linejoin="round" /><circle cx="-12" cy="-1" r="4" fill="#061428" /><circle cx="0" cy="-1" r="4" fill="#061428" /><circle cx="12" cy="-1" r="4" fill="#061428" /></g></g>

      </div>

  </div>
  <script>
    (function () {
      const ID = "s05-walter";
      const DUR = 3.74;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = ".s05-escenario";
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(ESC), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, desde = 2.4) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const pop = (sel, t, extra = {}) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 0.7, ...extra }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      const entra = (sel, t, desde = { x: -600 }) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, t);
      };
      const dibujar = (sel, t, d = 0.5) => qa(sel).forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // lluvia: cada .gota baja v px/s en un ciclo de alto h (con desfase o), de t0 a t1, sin saltos juntos
      const lluvia = (sel, t0, t1) => qa(sel + " .gota").forEach((g) => {
        const v = Number(g.dataset.v), o = Number(g.dataset.o), h = Number(g.dataset.h);
        tl.fromTo(g, { y: o % h }, { y: o + v * (t1 - t0), duration: t1 - t0, ease: "none", immediateRender: true, modifiers: { y: (y) => (parseFloat(y) % h) + "px" } }, t0);
      });
      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.4, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);

      const MOSTRADOR = 0.57, CONTESTO = 1.90, PARA = 2.57;
      lluvia(".s05-lluvia", 0, DUR);
      habla(".s05-boca", 0.0, 3.2, "180 300");
      tl.to(q(".s05-bigote"), { y: -5, duration: 0.11, yoyo: true, repeat: 27, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s05-gotas"), { y: 0, opacity: 1 }, { y: 40, opacity: 0, duration: 0.45, repeat: 7, ease: "power1.in" }, 0);
      // globitos que le rebotan en la cabeza
      [[".s05-reb1", 0.05, -160], [".s05-reb2", 1.2, 180]].forEach(([s, t, dx]) => {
        tl.fromTo(q(s), { y: -360, x: 0, rotation: 0, opacity: 1 }, { y: 0, duration: 0.3, ease: "power2.in", immediateRender: true }, t);
        tl.to(q(s), { x: dx, y: -140, rotation: dx / 4, duration: 0.3, ease: "power2.out" }, t + 0.3);
        tl.to(q(s), { y: 300, opacity: 0, duration: 0.35, ease: "power2.in" }, t + 0.6);
      });
      // manotea y golpea el mostrador
      gsap.set(q(".s05-brazo-d"), { rotation: -40, svgOrigin: "290 430" });
      tl.to(q(".s05-brazo-d"), { rotation: 60, svgOrigin: "290 430", duration: 0.14, ease: "power4.in" }, MOSTRADOR - 0.14);
      tl.to(q(".s05-brazo-d"), { rotation: -30, svgOrigin: "290 430", duration: 0.3, ease: "power2.out" }, MOSTRADOR + 0.2);
      tl.fromTo(q(".s05-brazo-i"), { rotation: 20, svgOrigin: "70 430" }, { rotation: -30, svgOrigin: "70 430", duration: 0.25, yoyo: true, repeat: 9, ease: "sine.inOut" }, 0);
      sacudon(MOSTRADOR, 1.3);
      // el celular vibra y el contador sube
      tl.fromTo(q(".s05-cel"), { x: -4 }, { x: 4, duration: 0.04, yoyo: true, repeat: 70, ease: "none" }, 0.3);
      tl.fromTo(q(".s05-ondas"), { opacity: 0.2 }, { opacity: 1, duration: 0.12, yoyo: true, repeat: 23, ease: "steps(1)" }, 0.3);
      const badge = q(".s05-badge"), c = { v: 12 };
      tl.fromTo(c, { v: 12 }, { v: 99, duration: 2.2, ease: "power1.in", onUpdate: () => { badge.textContent = c.v >= 98.5 ? "99+" : String(Math.round(c.v)); } }, 0.3);
      tl.fromTo(badge, { scale: 1 }, { scale: 1.25, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, 2.5);
      // ¡cuando para!
      golpe(".s05-para", CONTESTO + 0.3, 2.2);
      tl.to(q(".s05-para"), { rotation: -2, duration: 0.15, yoyo: true, repeat: 5, ease: "sine.inOut" }, PARA);

      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
