  <script>
    (function () {
      const ID = "s10-agente";
      const DUR = 5.01;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = ".s10-escenario";
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(ESC), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, desde = 2.4) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const pop = (sel, t, extra = {}) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 0.7, ...extra }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      const entra = (sel, t, desde = { x: -600 }) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, t);
      };
      const dibujar = (sel, t, d = 0.5) => qa(sel).forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // lluvia: cada .gota baja v px/s en un ciclo de alto h (con desfase o), de t0 a t1, sin saltos juntos
      const lluvia = (sel, t0, t1) => qa(sel + " .gota").forEach((g) => {
        const v = Number(g.dataset.v), o = Number(g.dataset.o), h = Number(g.dataset.h);
        tl.fromTo(g, { y: o % h }, { y: o + v * (t1 - t0), duration: t1 - t0, ease: "none", immediateRender: true, modifiers: { y: (y) => (parseFloat(y) % h) + "px" } }, t0);
      });
      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.4, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);

      const PRECIOS = 0.55, PEDIDOS = 1.55, TURNOS = 2.55, DOMINGO = 3.64;
      lluvia(".s10-lluvia", 0, DUR);
      tl.fromTo(q(".s10-par"), { rotation: -3, svgOrigin: "540 1070" }, { rotation: 3, svgOrigin: "540 1070", duration: 0.5, yoyo: true, repeat: 9, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s10-tel"), { y: 200 }, { y: 0, duration: 0.35, ease: "back.out(1.4)" }, 0);
      [[0.05, PRECIOS], [PEDIDOS - 0.4, PEDIDOS], [TURNOS - 0.4, TURNOS]].forEach(([a, b], i) => {
        pop(".s10-a" + i, a, { transformOrigin: "0% 100%" });
        pop(".s10-b" + i, b - 0.05, { transformOrigin: "100% 100%" });
        tl.fromTo(q(".s10-b" + i), { boxShadow: "0 0 0 rgba(92,230,17,0)" }, { boxShadow: "0 0 24px rgba(92,230,17,0.7)", duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, b + 0.2);
      });
      tl.fromTo(q(".s10-ojos"), { scaleY: 1, svgOrigin: "0 -130" }, { scaleY: 0.1, svgOrigin: "0 -130", duration: 0.08, yoyo: true, repeat: 1, immediateRender: false }, 2.0);
      // domingo a la noche
      gsap.set(q(".s10-luna"), { opacity: 0 });
      tl.fromTo(q(".s10-luna"), { opacity: 1, scale: 0, svgOrigin: "170 660" }, { opacity: 1, scale: 1, svgOrigin: "170 660", duration: 0.35, ease: "back.out(2)", immediateRender: false }, DOMINGO - 0.1);
      golpe(".s10-reloj", DOMINGO, 2);
      tl.to(q(".s10-luna"), { rotation: 10, svgOrigin: "170 660", duration: 0.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, DOMINGO + 0.3);

      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
