  <script>
    (function () {
      const ID = "s04-movil";
      const DUR = 4.51;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = ".s04-escenario";
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(ESC), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, desde = 2.4) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const pop = (sel, t, extra = {}) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 0.7, ...extra }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      const entra = (sel, t, desde = { x: -600 }) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, t);
      };
      const dibujar = (sel, t, d = 0.5) => qa(sel).forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // lluvia: cada .gota baja v px/s en un ciclo de alto h (con desfase o), de t0 a t1, sin saltos juntos
      const lluvia = (sel, t0, t1) => qa(sel + " .gota").forEach((g) => {
        const v = Number(g.dataset.v), o = Number(g.dataset.o), h = Number(g.dataset.h);
        tl.fromTo(g, { y: o % h }, { y: o + v * (t1 - t0), duration: t1 - t0, ease: "none", immediateRender: true, modifiers: { y: (y) => (parseFloat(y) % h) + "px" } }, t0);
      });
      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.4, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);

      const OJO = 1.09, WALTER = 2.43, CONTESTA = 3.45;
      lluvia(".s04-lluvia", 0, DUR);
      // el movilero contra el viento
      tl.fromTo(q(".s04-mov"), { rotation: -4, svgOrigin: "220 1420" }, { rotation: 3, svgOrigin: "220 1420", duration: 0.35, yoyo: true, repeat: 11, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s04-capucha"), { y: 0 }, { y: -8, duration: 0.12, yoyo: true, repeat: 17, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s04-chorro"), { y: 0, opacity: 1 }, { y: 30, opacity: 0, duration: 0.4, repeat: 10, ease: "power1.in" }, 0);
      habla(".s04-mov-boca", 0.05, 3.9, "180 280");
      tl.fromTo(q(".s04-mic"), { rotation: -4, svgOrigin: "400 1130" }, { rotation: 4, svgOrigin: "400 1130", duration: 0.3, yoyo: true, repeat: 7, ease: "sine.inOut" }, 0);
      // ojo de la tormenta
      gsap.set(q(".s04-espiral"), { opacity: 0 });
      tl.fromTo(q(".s04-espiral"), { opacity: 1, scale: 0.2, rotation: 0, svgOrigin: "820 640" }, { opacity: 1, scale: 1, rotation: -400, svgOrigin: "820 640", duration: 1.2, ease: "power2.out", immediateRender: false }, OJO - 0.1);
      tl.to(q(".s04-espiral"), { rotation: -900, svgOrigin: "820 640", duration: 2.3, ease: "none" }, OJO + 1.1);
      // Don Walter
      tl.fromTo(q(".s04-local"), { opacity: 0.45 }, { opacity: 1, duration: 0.2 }, WALTER - 0.1);
      gsap.set(q(".s04-walter"), { opacity: 0 });
      tl.fromTo(q(".s04-walter"), { opacity: 1, y: 220 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, WALTER);
      tl.fromTo(q(".s04-nombre"), { opacity: 0, x: 400 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, WALTER + 0.1);
      tl.to(q(".s04-mic"), { x: 120, y: -40, duration: 0.3, ease: "power2.out" }, WALTER + 0.1);
      golpe(".s04-preg", CONTESTA, 2.4);
      sacudon(CONTESTA + 0.05);

      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
