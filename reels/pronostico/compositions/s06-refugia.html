        <div class="cartela s06-nopara">¡NO PARA!</div>
        <div class="cartela s06-refugio">SE REFUGIÓ ENFRENTE</div>

      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-refugia";
      const DUR = 5.0;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = ".s06-escenario";
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(ESC), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, desde = 2.4) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const pop = (sel, t, extra = {}) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 0.7, ...extra }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      const entra = (sel, t, desde = { x: -600 }) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, t);
      };
      const dibujar = (sel, t, d = 0.5) => qa(sel).forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // lluvia: cada .gota baja v px/s en un ciclo de alto h (con desfase o), de t0 a t1, sin saltos juntos
      const lluvia = (sel, t0, t1) => qa(sel + " .gota").forEach((g) => {
        const v = Number(g.dataset.v), o = Number(g.dataset.o), h = Number(g.dataset.h);
        tl.fromTo(g, { y: o % h }, { y: o + v * (t1 - t0), duration: t1 - t0, ease: "none", immediateRender: true, modifiers: { y: (y) => (parseFloat(y) % h) + "px" } }, t0);
      });
      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.4, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);

      const NOPARA = 0.09, CLIENTA = 1.81, EN = 3.00, ENFRENTE = 4.00;
      lluvia(".s06-lluvia", 0, DUR);
      tl.fromTo(q(".s06-calle"), { x: 60 }, { x: 0, duration: 1.2, ease: "power2.out" }, 0);
      golpe(".s06-nopara", NOPARA + 0.1, 2.2);
      sacudon(NOPARA + 0.12);
      tl.to(q(".s06-nopara"), { opacity: 0, y: -40, duration: 0.2 }, CLIENTA - 0.3);
      // la clienta cruza corriendo con la campera en la cabeza
      gsap.set(q(".s06-cli"), { opacity: 0 });
      tl.set(q(".s06-cli"), { opacity: 1 }, CLIENTA - 0.2);
      tl.fromTo(q(".s06-cli"), { x: 0 }, { x: 560, duration: 1.2, ease: "power1.inOut", immediateRender: false }, CLIENTA - 0.2);
      tl.fromTo(q(".s06-cli"), { y: 0 }, { y: -22, duration: 0.13, yoyo: true, repeat: 25, ease: "sine.inOut" }, CLIENTA - 0.2);
      // la cámara panea al de enfrente y ella entra bajo el toldo
      tl.to(q(".s06-calle"), { x: -1120, duration: 1.3, ease: "power2.inOut" }, EN - 0.1);
      tl.to(q(".s06-cli"), { x: 760, duration: 1.3, ease: "power2.inOut" }, EN - 0.1);
      tl.fromTo(q(".s06-otro"), { opacity: 0.7 }, { opacity: 1, duration: 0.12, yoyo: true, repeat: 3, immediateRender: false }, ENFRENTE - 0.3);
      golpe(".s06-refugio", ENFRENTE, 2);
      sacudon(ENFRENTE + 0.05);

      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
