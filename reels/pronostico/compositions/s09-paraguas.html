        <div class="cartela s09-igual">¡LLUEVE IGUAL!</div>

  </div>
  <script>
    (function () {
      const ID = "s09-paraguas";
      const DUR = 3.81;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = ".s09-escenario";
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(ESC), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, desde = 2.4) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const pop = (sel, t, extra = {}) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 0.7, ...extra }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      const entra = (sel, t, desde = { x: -600 }) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, t);
      };
      const dibujar = (sel, t, d = 0.5) => qa(sel).forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // lluvia: cada .gota baja v px/s en un ciclo de alto h (con desfase o), de t0 a t1, sin saltos juntos
      const lluvia = (sel, t0, t1) => qa(sel + " .gota").forEach((g) => {
        const v = Number(g.dataset.v), o = Number(g.dataset.o), h = Number(g.dataset.h);
        tl.fromTo(g, { y: o % h }, { y: o + v * (t1 - t0), duration: t1 - t0, ease: "none", immediateRender: true, modifiers: { y: (y) => (parseFloat(y) % h) + "px" } }, t0);
      });
      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.4, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);

      const LLUEVE = 0.63, PARAGUAS = 2.18, AGENTE = 2.99;
      lluvia(".s09-lluvia", 0, DUR);
      tl.fromTo(q(".s09-escenario"), { scale: 1.05, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: "power2.out" }, 0);
      golpe(".s09-igual", LLUEVE, 2.2);
      sacudon(LLUEVE + 0.05);
      tl.to(q(".s09-igual"), { opacity: 0, y: -30, duration: 0.2 }, PARAGUAS - 0.2);
      // el paraguas se abre de golpe
      gsap.set(q(".s09-par"), { opacity: 0 });
      gsap.set(q(".s09-seco"), { scaleX: 0, scaleY: 0, svgOrigin: "540 1000" });
      tl.fromTo(q(".s09-par"), { opacity: 1, scaleX: 0.08, scaleY: 0.6, svgOrigin: "540 1000" }, { opacity: 1, scaleX: 1, scaleY: 1, svgOrigin: "540 1000", duration: 0.28, ease: "back.out(2.2)", immediateRender: false }, PARAGUAS - 0.1);
      tl.to(q(".s09-seco"), { scaleX: 1, scaleY: 1, svgOrigin: "540 1000", duration: 0.28, ease: "back.out(2.2)" }, PARAGUAS - 0.1);
      sacudon(PARAGUAS + 0.1, 1.2);
      tl.to(q(".s09-par"), { rotation: 3, svgOrigin: "540 1260", duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, PARAGUAS + 0.3);
      // abre los ojos
      tl.fromTo(q(".s09-ojos"), { scaleY: 0.08, svgOrigin: "0 -130" }, { scaleY: 1, svgOrigin: "0 -130", duration: 0.2, ease: "back.out(3)" }, AGENTE);
      tl.to(q(".s09-ojos"), { x: 14, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, AGENTE + 0.35);
      golpe(".s09-ia", AGENTE + 0.1, 2);
      tl.fromTo(q(".s09-par"), { filter: "drop-shadow(0 0 0 rgba(92,230,17,0))" }, { filter: "drop-shadow(0 0 26px rgba(92,230,17,0.6))", duration: 0.4, immediateRender: false }, AGENTE);

      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
