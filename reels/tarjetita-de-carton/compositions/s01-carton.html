  <script>
    (function () {
      const ID = "s01-carton";
      const DUR = 3.66;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const nuevo = (padre, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); padre.appendChild(e); return e; };

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * (paso ?? 0.04) : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      const ETQ = qa(".etiqueta span");
      const etiqueta = (k, t) => {
        if (k > 0) tl.to(ETQ[k - 1], { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(ETQ[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      // badge de "no": círculo verde con una X, centrado en (x, y)
      const badge = (padre, x, y, r) => {
        const g = nuevo(padre, "g", {});
        r = r || 18;
        const k = r * 0.42;
        nuevo(g, "circle", { class: "ln-badge", cx: x, cy: y, r: r });
        nuevo(g, "path", { class: "ln-badge", d: "M" + (x - k) + " " + (y - k) + " L" + (x + k) + " " + (y + k) + " M" + (x + k) + " " + (y - k) + " L" + (x - k) + " " + (y + k) });
        return g;
      };
      // figurita de palo: pies en (x, y)
      const FIG = (x, y) => '<circle class="ln" cx="' + x + '" cy="' + (y - 96) + '" r="14" /><path class="ln" d="M' + x + ' ' + (y - 82) + ' V' + (y - 40) + ' M' + x + ' ' + (y - 70) + ' L' + (x - 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 70) + ' L' + (x + 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 40) + ' L' + (x - 14) + ' ' + y + ' M' + x + ' ' + (y - 40) + ' L' + (x + 14) + ' ' + y + '" />';
      const caminar = (g, t, pasos, origen) => tl.fromTo(g, { rotation: -4, svgOrigin: origen || "0 0" }, { rotation: 4, svgOrigin: origen || "0 0", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: pasos }, t);

      const TARJETITA = 0.3, CARTON = 1.0, SELLOS = 1.7, NO = 2.0, FIDELIZA = 2.2, NADIE = 2.8;
      const T = q(".s01-tarjeta");
      gsap.set(T, { rotation: -4, svgOrigin: "540 890" });
      gsap.set(qa(".s01-tit, .s01-nom, .s01-sello, .s01-vacio"), { opacity: 0 });
      // arranca medio dibujada (el cuadro 0 no puede ser negro)
      dibujar(qa(".s01-dk, .s01-raya"), 0, 0.6, 0.45);
      gsap.set(q(".s01-oreja"), { opacity: 0 });
      tl.fromTo(T, { y: 24 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0);
      // "tarjetita": título y casilleros vacíos
      tl.fromTo(qa(".s01-tit, .s01-nom"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.08 }, TARJETITA);
      qa(".s01-vacio").forEach((c, i) => tl.to(c, { opacity: 1, duration: 0.12 }, TARJETITA + 0.1 + i * 0.03));
      etiqueta(0, TARJETITA);
      // "cartón": la oreja doblada y un saltito
      pop(q(".s01-oreja"), CARTON, "760 760");
      tl.to(T, { y: -12, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, CARTON);
      // "sellos": seis sellos de goma en cascada
      qa(".s01-sello").forEach((s, i) => {
        const t = SELLOS - 0.1 + i * 0.09;
        tl.fromTo(s, { opacity: 0, scale: 1.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.18, ease: "power3.in" }, t);
      });
      tl.to(T, { y: 6, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 5 }, SELLOS + 0.05);
      // "no fideliza": badge X grande y la tarjeta se apaga
      const B = badge(q(".s01-badge"), 790, 720, 44);
      pop(B, NO, "790 720");
      tl.to(T, { opacity: 0.45, duration: 0.35 }, FIDELIZA);
      etiqueta(1, FIDELIZA);
      // "nadie": cae y se tuerce
      tl.to(T, { y: 26, rotation: -9, svgOrigin: "540 890", duration: 0.3, ease: "back.out(2)" }, NADIE - 0.05);
      tl.to(B, { scale: 1.12, svgOrigin: "790 720", duration: 0.12, yoyo: true, repeat: 1 }, NADIE);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
