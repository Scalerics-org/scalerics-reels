<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s09-puntos"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s09-puntos"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s09-puntos"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }

    [data-composition-id="s09-puntos"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s09-puntos"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s09-puntos"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
    [data-composition-id="s09-puntos"] .ln-sello { fill: none; stroke: rgba(239, 238, 229, 0.55); stroke-width: 3; }
    [data-composition-id="s09-puntos"] .s09-marca { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 30px; fill: #efeee5; }
    [data-composition-id="s09-puntos"] .s09-ac { fill: #5ce611; }
    [data-composition-id="s09-puntos"] .s09-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 30px; fill: #efeee5; }
    [data-composition-id="s09-puntos"] .s09-num { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 96px; fill: #5ce611; }
    [data-composition-id="s09-puntos"] .s09-pts { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: rgba(239, 238, 229, 0.62); }
    [data-composition-id="s09-puntos"] .s09-mas { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 34px; fill: #5ce611; }
  </style>
  <div id="root" data-composition-id="s09-puntos" data-width="1080" data-height="1920" data-duration="6.03">
    <div id="s09-escena" class="s09-capa clip" data-start="0" data-duration="6.03" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">

        <g class="s09-cel">
          <rect class="ln s09-dc" x="350" y="610" width="380" height="620" rx="52" />
          <path class="ln s09-dc" d="M500 638 H580" />
          <text class="s09-marca s09-header" x="540" y="704" text-anchor="middle">Scalerics <tspan class="s09-ac">Puntos</tspan></text>
          <path class="ln-4 s09-div" d="M350 736 H730" />
          <g class="s09-tarjeta">
            <rect class="ln-4 s09-dk" x="380" y="766" width="320" height="330" rx="24" />
            <circle class="ln-4 s09-dk" cx="424" cy="812" r="22" />
            <path class="ln-4 s09-dk" d="M412 822 Q424 808 436 822" />
            <circle class="ln-4 s09-dk" cx="424" cy="804" r="6" />
            <text class="s09-nombre s09-quien" x="460" y="823">Sofía</text>
            <text class="s09-num s09-n s09-n1" x="540" y="950" text-anchor="middle">40</text>
            <text class="s09-num s09-n s09-n2" x="540" y="950" text-anchor="middle">50</text>
            <text class="s09-num s09-n s09-n3" x="540" y="950" text-anchor="middle">60</text>
            <text class="s09-pts" x="540" y="990" text-anchor="middle">PUNTOS</text>
            <g class="s09-sellos"></g>
          </g>
          <text class="s09-mas" x="660" y="890" text-anchor="middle">+10</text>
        </g>
      </svg>
      <div class="etiqueta"><span class="s09-e1">Scalerics Puntos</span><span class="s09-e2">Suma con cada compra</span><span class="s09-e3">En el celular</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s09-puntos";
      const DUR = 6.03;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const nuevo = (padre, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); padre.appendChild(e); return e; };

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * (paso ?? 0.04) : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      const ETQ = qa(".etiqueta span");
      const etiqueta = (k, t) => {
        if (k > 0) tl.to(ETQ[k - 1], { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(ETQ[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      // figurita de palo: pies en (x, y)
      const FIG = (x, y) => '<circle class="ln" cx="' + x + '" cy="' + (y - 96) + '" r="14" /><path class="ln" d="M' + x + ' ' + (y - 82) + ' V' + (y - 40) + ' M' + x + ' ' + (y - 70) + ' L' + (x - 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 70) + ' L' + (x + 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 40) + ' L' + (x - 14) + ' ' + y + ' M' + x + ' ' + (y - 40) + ' L' + (x + 14) + ' ' + y + '" />';
      const caminar = (g, t, pasos) => tl.fromTo(g, { rotation: -4, svgOrigin: "0 0" }, { rotation: 4, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: pasos }, t);


      const SCALERICS = 0.8, PUNTOS = 1.3, CLIENTE = 2.2, SUMA = 2.6, COMPRA = 3.5, LLEVA = 4.4, CELULAR = 5.2;
      const capa = q(".s09-sellos"), llenos = [], vacios = [];
      for (let i = 0; i < 10; i++) {
        const cx = 405 + i * 30;
        vacios.push(nuevo(capa, "circle", { class: "ln-sello", cx, cy: 1045, r: 11 }));
        llenos.push(nuevo(capa, "circle", { class: "relleno", cx, cy: 1045, r: 11 }));
      }
      gsap.set(qa(".s09-header, .s09-quien, .s09-n, .s09-pts, .s09-mas").concat(llenos, vacios), { opacity: 0 });
      dibujar(qa(".s09-dc"), 0, 0.5, 0.35);
      tl.fromTo(q(".s09-cel"), { scale: 0.97, svgOrigin: "540 920" }, { scale: 1.02, svgOrigin: "540 920", duration: DUR - 0.3, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s09-cel"), { y: 30 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0);
      // "Scalerics Puntos"
      tl.fromTo(q(".s09-header"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, SCALERICS - 0.1);
      dibujar([q(".s09-div")], SCALERICS, 0.4);
      tl.to(q(".s09-ac"), { opacity: 0.4, duration: 0.1, yoyo: true, repeat: 1 }, PUNTOS);
      etiqueta(0, SCALERICS - 0.1);
      // "tu cliente": la tarjeta de Lucía, con 40 puntos y 4 sellos
      dibujar(qa(".s09-dk"), PUNTOS + 0.3, 0.5);
      tl.to(q(".s09-quien"), { opacity: 1, duration: 0.3 }, CLIENTE - 0.15);
      pop(q(".s09-n1"), CLIENTE - 0.1, "540 920");
      tl.to(q(".s09-pts"), { opacity: 1, duration: 0.3 }, CLIENTE);
      vacios.forEach((c, i) => tl.to(c, { opacity: 1, duration: 0.1 }, CLIENTE - 0.1 + i * 0.02));
      llenos.slice(0, 4).forEach((c, i) => tl.to(c, { opacity: 1, duration: 0.1 }, CLIENTE + i * 0.04));
      // "suma con cada compra"
      const subir = (de, a, sello, t) => {
        tl.to(de, { opacity: 0, y: -18, duration: 0.15 }, t);
        tl.fromTo(a, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, t + 0.1);
        tl.fromTo(sello, { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t + 0.1);
        tl.to(q(".s09-tarjeta"), { scale: 1.04, svgOrigin: "540 930", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t + 0.12);
        tl.fromTo(q(".s09-mas"), { opacity: 0, y: 10 }, { opacity: 1, y: -14, duration: 0.3, ease: "power2.out" }, t);
        tl.to(q(".s09-mas"), { opacity: 0, duration: 0.2 }, t + 0.5);
      };
      subir(q(".s09-n1"), q(".s09-n2"), llenos[4], SUMA);
      subir(q(".s09-n2"), q(".s09-n3"), llenos[5], COMPRA);
      etiqueta(1, SUMA);
      // "lleva la tarjeta en el celular"
      tl.to(q(".s09-cel"), { y: -14, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, LLEVA);
      tl.to(q(".s09-cel"), { rotation: -3, svgOrigin: "540 1230", duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, CELULAR);
      etiqueta(2, LLEVA);


      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
