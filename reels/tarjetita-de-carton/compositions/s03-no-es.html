<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-no-es"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-no-es"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-no-es"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-no-es"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-no-es"] .ln-t { fill: none; stroke: rgba(239, 238, 229, 0.55); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-no-es"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-no-es"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-no-es"] .relleno { fill: #5ce611; }
    [data-composition-id="s03-no-es"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s03-no-es"] .signo { font-family: "Lexend", sans-serif; font-weight: 700; fill: #5ce611; }
    [data-composition-id="s03-no-es"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s03-no-es"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }

  </style>
  <div id="root" data-composition-id="s03-no-es" data-width="1080" data-height="1920" data-duration="3.69">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="3.69" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s03-todo">
        <g class="s03-i s03-i0">
        <rect class="ln s03-d0" x="210" y="880" width="140" height="110" rx="8" />
        <path class="ln s03-d0" d="M196 850 H364 V880 H196 Z" />
        <path class="ln s03-d0" d="M280 850 V990" />
        <path class="ln s03-d0" d="M280 850 Q240 800 230 830 Q240 850 280 850 Q320 800 330 830 Q320 850 280 850" />
        </g>
        <g class="s03-i s03-i1">
        <g class="s03-fig"></g>
        </g>
        <g class="s03-i s03-i2">
        <path class="ln s03-d2" d="M520 800 Q540 780 560 800 V860 H520 Z" />
        <path class="ln s03-d2" d="M490 860 H590 V900 H490 Z" />
        <path class="ln s03-d2" d="M478 900 H602 V930 H478 Z" />
        <path class="ln-4 s03-d2" d="M480 980 H600 M500 960 H580" />
        </g>
        <g class="s03-b"></g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s03-e1">No es el premio</span><span class="s03-e2">Ni el cliente</span><span class="s03-e3">Ni la imprenta</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-no-es";
      const DUR = 3.69;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const nuevo = (padre, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); padre.appendChild(e); return e; };

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * (paso ?? 0.04) : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      const ETQ = qa(".etiqueta span");
      const etiqueta = (k, t) => {
        if (k > 0) tl.to(ETQ[k - 1], { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(ETQ[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      // badge de "no": círculo verde con una X, centrado en (x, y)
      const badge = (padre, x, y, r) => {
        const g = nuevo(padre, "g", {});
        r = r || 18;
        const k = r * 0.42;
        nuevo(g, "circle", { class: "ln-badge", cx: x, cy: y, r: r });
        nuevo(g, "path", { class: "ln-badge", d: "M" + (x - k) + " " + (y - k) + " L" + (x + k) + " " + (y + k) + " M" + (x + k) + " " + (y - k) + " L" + (x - k) + " " + (y + k) });
        return g;
      };
      // figurita de palo: pies en (x, y)
      const FIG = (x, y) => '<circle class="ln" cx="' + x + '" cy="' + (y - 96) + '" r="14" /><path class="ln" d="M' + x + ' ' + (y - 82) + ' V' + (y - 40) + ' M' + x + ' ' + (y - 70) + ' L' + (x - 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 70) + ' L' + (x + 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 40) + ' L' + (x - 14) + ' ' + y + ' M' + x + ' ' + (y - 40) + ' L' + (x + 14) + ' ' + y + '" />';
      const caminar = (g, t, pasos, origen) => tl.fromTo(g, { rotation: -4, svgOrigin: origen || "0 0" }, { rotation: 4, svgOrigin: origen || "0 0", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: pasos }, t);

      gsap.set(q(".s03-todo"), { scale: 1.3, svgOrigin: "540 900" });
      const PREMIO = 0.69, CLIENTE = 1.69, IMPRENTA = 2.79;
      // el sello va a la derecha (x 800), la figurita al centro
      gsap.set(q(".s03-i2"), { x: 260 });
      const fig = q(".s03-fig");
      fig.innerHTML = FIG(540, 1000);
      fig.querySelectorAll("circle, path").forEach((e) => e.classList.add("s03-d1"));
      gsap.set(fig, { scale: 1.25, svgOrigin: "540 1000" });
      const items = [
        [".s03-d0", PREMIO, 362, 828, ".s03-i0"],
        [".s03-d1", CLIENTE, 600, 846, ".s03-i1"],
        [".s03-d2", IMPRENTA, 870, 790, ".s03-i2"],
      ];
      items.forEach(([sel, t, bx, by, grupo], k) => {
        const t0 = k === 0 ? 0 : t - 0.45;
        dibujar(qa(sel), t0, 0.45, k === 0 ? 0.5 : 1, 0.04);
        tl.fromTo(q(grupo), { y: 20 }, { y: 0, duration: 0.4, ease: "power3.out" }, t0);
        const b = badge(q(".s03-b"), bx, by, 24);
        pop(b, t, bx + " " + by);
        tl.to(q(grupo), { opacity: 0.4, duration: 0.3 }, t + 0.2);
        etiqueta(k, k === 0 ? 0.1 : t - 0.2);
      });

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
