  <script>
    (function () {
      const ID = "s11-aviso";
      const DUR = 5;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const nuevo = (padre, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); padre.appendChild(e); return e; };

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * (paso ?? 0.04) : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      const ETQ = qa(".etiqueta span");
      const etiqueta = (k, t) => {
        if (k > 0) tl.to(ETQ[k - 1], { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(ETQ[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      // figurita de palo: pies en (x, y)
      const FIG = (x, y) => '<circle class="ln" cx="' + x + '" cy="' + (y - 96) + '" r="14" /><path class="ln" d="M' + x + ' ' + (y - 82) + ' V' + (y - 40) + ' M' + x + ' ' + (y - 70) + ' L' + (x - 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 70) + ' L' + (x + 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 40) + ' L' + (x - 14) + ' ' + y + ' M' + x + ' ' + (y - 40) + ' L' + (x + 14) + ' ' + y + '" />';
      const caminar = (g, t, pasos) => tl.fromTo(g, { rotation: -4, svgOrigin: "0 0" }, { rotation: 4, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: pasos }, t);


      const SI = 0.0, VENIR = 0.8, LLEGA = 1.5, OLVIDE = 2.1, Y = 2.64, VOS = 2.9, QUIENES = 3.1, CADA = 3.9, VIENEN = 4.6;
      gsap.set(qa(".s11-gris, .s11-aviso, .s11-titulo, .s11-fila, .s11-c"), { opacity: 0 });
      dibujar(qa(".s11-dc"), 0, 0.45, 0.35);
      tl.fromTo(q(".s11-tarjeta"), { opacity: 0.4, scale: 0.92, svgOrigin: "540 905" }, { opacity: 1, scale: 1, svgOrigin: "540 905", duration: 0.35, ease: "back.out(1.6)" }, 0.05);
      // "si deja de venir": la tarjeta se apaga
      tl.to(q(".s11-tarjeta"), { opacity: 0.4, duration: 0.35 }, VENIR);
      tl.fromTo(q(".s11-gris"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, VENIR - 0.1);
      // "le llega un aviso"
      tl.fromTo(q(".s11-aviso"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, LLEGA - 0.15);
      tl.to(q(".s11-cel"), { rotation: -2, svgOrigin: "540 1230", duration: 0.07, ease: "sine.inOut", yoyo: true, repeat: 5 }, LLEGA + 0.1);
      etiqueta(0, LLEGA - 0.1);
      // "antes de que se olvide": late y la tarjeta se vuelve a prender
      tl.to(q(".s11-aviso"), { scale: 1.07, svgOrigin: "540 707", duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, OLVIDE);
      tl.to(q(".s11-tarjeta"), { opacity: 1, duration: 0.3 }, OLVIDE);
      tl.to(q(".s11-gris"), { opacity: 0, duration: 0.3 }, OLVIDE);
      // "Y vos ves": el celular se va y entra el panel
      tl.to(q(".s11-cel"), { x: -160, opacity: 0, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, Y - 0.1);
      dibujar(qa(".s11-dp"), Y + 0.15, 0.5, 1, 0.05);
      tl.fromTo(q(".s11-titulo"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, Y + 0.4);
      etiqueta(1, VOS);

      qa(".s11-fila").forEach((f, i) => tl.fromTo(f, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, QUIENES - 0.2 + i * 0.12));
      // "cada cuánto": los tiempos

      // salida
