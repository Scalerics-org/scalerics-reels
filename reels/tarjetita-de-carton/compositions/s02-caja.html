<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-caja"] .s02-capa { position: absolute; inset: 0; }
    [data-composition-id="s02-caja"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s02-caja"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-caja"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-caja"] .ln-t { fill: none; stroke: rgba(239, 238, 229, 0.55); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-caja"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-caja"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-caja"] .relleno { fill: #5ce611; }
    [data-composition-id="s02-caja"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s02-caja"] .signo { font-family: "Lexend", sans-serif; font-weight: 700; fill: #5ce611; }
    [data-composition-id="s02-caja"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s02-caja"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }

  </style>
  <div id="root" data-composition-id="s02-caja" data-width="1080" data-height="1920" data-duration="2.95">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="2.95" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s02-todo">
        <path class="ln s02-dm" d="M160 1120 H920" />
        <path class="ln-4 s02-dm" d="M190 1120 V1200 M890 1120 V1200" />
        <g class="s02-caja">
        <path class="ln s02-dc" d="M600 1120 V960 H860 V1120" />
        <path class="ln s02-dc" d="M640 960 L620 860 H800 L820 960" />
        <path class="ln-4 s02-dc" d="M650 890 H760" />
        <path class="ln-4 s02-dc" d="M640 1000 H680 M700 1000 H740 M760 1000 H800 M640 1040 H680 M700 1040 H740 M760 1040 H800 M640 1080 H820" />
        </g>
        <g class="s02-pila">
        <rect class="ln-4 s02-dp" x="236" y="1046" width="240" height="64" rx="10" />
        <rect class="ln-4 s02-dp" x="246" y="1032" width="240" height="64" rx="10" />
        <rect class="ln-4 s02-dp" x="230" y="1018" width="240" height="64" rx="10" />
        <rect class="ln s02-dp" x="240" y="1000" width="240" height="70" rx="10" />
        <path class="ln-ac s02-goma" d="M330 994 V1114" />
        </g>
        <g class="s02-tela">
        <path class="ln-t" d="M250 960 q12 -10 24 0 t24 0" />
        <path class="ln-t" d="M330 935 q12 -10 24 0 t24 0" />
        <path class="ln-t" d="M410 965 q12 -10 24 0 t24 0" />
        </g>
        <g class="s02-flecha">
        <path class="ln-ac" d="M360 780 V940" />
        <path class="ln-ac" d="M330 910 L360 944 L390 910" />
        </g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s02-e1">Al lado de la caja</span><span class="s02-e2">Hace años</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-caja";
      const DUR = 2.95;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const nuevo = (padre, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); padre.appendChild(e); return e; };

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * (paso ?? 0.04) : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      const ETQ = qa(".etiqueta span");
      const etiqueta = (k, t) => {
        if (k > 0) tl.to(ETQ[k - 1], { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(ETQ[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      // badge de "no": círculo verde con una X, centrado en (x, y)
      const badge = (padre, x, y, r) => {
        const g = nuevo(padre, "g", {});
        r = r || 18;
        const k = r * 0.42;
        nuevo(g, "circle", { class: "ln-badge", cx: x, cy: y, r: r });
        nuevo(g, "path", { class: "ln-badge", d: "M" + (x - k) + " " + (y - k) + " L" + (x + k) + " " + (y + k) + " M" + (x + k) + " " + (y - k) + " L" + (x - k) + " " + (y + k) });
        return g;
      };
      // figurita de palo: pies en (x, y)
      const FIG = (x, y) => '<circle class="ln" cx="' + x + '" cy="' + (y - 96) + '" r="14" /><path class="ln" d="M' + x + ' ' + (y - 82) + ' V' + (y - 40) + ' M' + x + ' ' + (y - 70) + ' L' + (x - 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 70) + ' L' + (x + 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 40) + ' L' + (x - 14) + ' ' + y + ' M' + x + ' ' + (y - 40) + ' L' + (x + 14) + ' ' + y + '" />';
      const caminar = (g, t, pasos, origen) => tl.fromTo(g, { rotation: -4, svgOrigin: origen || "0 0" }, { rotation: 4, svgOrigin: origen || "0 0", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: pasos }, t);

      const ESA = 0.14, TENES = 0.64, CAJA = 1.44, HACE = 1.64, ANIOS = 1.94;
      gsap.set(qa(".s02-goma, .s02-flecha, .s02-caja"), { opacity: 0 });
      // el mostrador ya está (medio dibujado en el corte)
      dibujar(qa(".s02-dm"), 0, 0.4, 0.5);
      // "esa": la pila de tarjetas
      dibujar(qa(".s02-dp"), ESA, 0.4, 1, 0.06);
      tl.to(qa(".s02-goma"), { opacity: 1, duration: 0.25 }, ESA + 0.3);
      // "tenés": la flecha la señala
      tl.fromTo(q(".s02-flecha"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.8)" }, TENES);
      tl.to(q(".s02-flecha"), { y: 16, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 5 }, TENES + 0.35);
      etiqueta(0, TENES);
      // "caja": la registradora
      gsap.set(q(".s02-caja"), { opacity: 1 });
      dibujar(qa(".s02-dc"), CAJA - 0.2, 0.4, 1, 0.04);
      tl.to(q(".s02-caja"), { y: -10, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, CAJA + 0.2);
      // "hace años": telaraña y la pila se apaga
      dibujar(qa(".s02-tela path"), HACE, 0.5, 1, 0.08);
      tl.to(q(".s02-pila"), { opacity: 0.45, duration: 0.4 }, ANIOS);
      tl.to(q(".s02-flecha"), { opacity: 0, duration: 0.25 }, ANIOS);
      etiqueta(1, HACE);
      tl.fromTo(q(".s02-todo"), { scale: 1.15, svgOrigin: "540 1000" }, { scale: 1.2, svgOrigin: "540 1000", duration: DUR, ease: "none" }, 0);

      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
