  <script>
    (function () {
      const ID = "s07-avisar";
      const DUR = 5.1;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const nuevo = (padre, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); padre.appendChild(e); return e; };

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * (paso ?? 0.04) : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      const ETQ = qa(".etiqueta span");
      const etiqueta = (k, t) => {
        if (k > 0) tl.to(ETQ[k - 1], { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(ETQ[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      // badge de "no": círculo verde con una X, centrado en (x, y)
      const badge = (padre, x, y, r) => {
        const g = nuevo(padre, "g", {});
        r = r || 18;
        const k = r * 0.42;
        nuevo(g, "circle", { class: "ln-badge", cx: x, cy: y, r: r });
        nuevo(g, "path", { class: "ln-badge", d: "M" + (x - k) + " " + (y - k) + " L" + (x + k) + " " + (y + k) + " M" + (x + k) + " " + (y - k) + " L" + (x - k) + " " + (y + k) });
        return g;
      };
      // figurita de palo: pies en (x, y)
      const FIG = (x, y) => '<circle class="ln" cx="' + x + '" cy="' + (y - 96) + '" r="14" /><path class="ln" d="M' + x + ' ' + (y - 82) + ' V' + (y - 40) + ' M' + x + ' ' + (y - 70) + ' L' + (x - 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 70) + ' L' + (x + 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 40) + ' L' + (x - 14) + ' ' + y + ' M' + x + ' ' + (y - 40) + ' L' + (x + 14) + ' ' + y + '" />';
      const caminar = (g, t, pasos, origen) => tl.fromTo(g, { rotation: -4, svgOrigin: origen || "0 0" }, { rotation: 4, svgOrigin: origen || "0 0", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: pasos }, t);

      const SUPIERAS = 0.9, AVISARLE = 2.2, NADIE = 2.7, EL = 3.54, MANDA = 4.1, MENSAJES = 4.5;
      const T = q(".s07-tarjeta");
      q(".s07-fig").innerHTML = FIG(820, 1000);
      gsap.set(q(".s07-fig"), { scale: 1.3, svgOrigin: "820 1000" });
      gsap.set(T, { scale: 0.62, svgOrigin: "540 890", x: -230, y: 20 });
      gsap.set(qa(".s07-arco, .s07-viaja, .s07-arriba, .s07-tacha"), { opacity: 0 });
      dibujar(qa(".s07-dk, .s07-raya"), 0, 0.4, 0.4);
      dibujar(qa(".s07-fig circle, .s07-fig path"), 0.05, 0.4, 0.5);
      tl.fromTo(qa(".s07-sello, .s07-tit, .s07-nom, .s07-vacio"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.1);
      tl.to(q(".s07-fig"), { y: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.4);
      // "supieras": el camino entre los dos
      tl.fromTo(q(".s07-arco"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, SUPIERAS);
      tl.fromTo(q(".s07-arco"), { strokeDashoffset: 0 }, { strokeDashoffset: -60, duration: 2.6, ease: "none" }, SUPIERAS);
      // "avisarle": el mensaje sale, se frena a la mitad y se cae
      const B = q(".s07-viaja");
      tl.fromTo(B, { opacity: 0, x: 400, y: 760, scale: 0.6, svgOrigin: "0 0" }, { opacity: 1, x: 480, y: 690, scale: 0.8, svgOrigin: "0 0", duration: 0.3, ease: "power2.out" }, AVISARLE - 0.3);
      tl.to(B, { x: 560, y: 660, duration: 0.3, ease: "power1.out" }, AVISARLE);
      tl.to(B, { y: 1000, rotation: 50, svgOrigin: "0 0", opacity: 0, duration: 0.55, ease: "power2.in" }, AVISARLE + 0.35);
      etiqueta(0, 1.77);
      // "nadie": badge en el medio del camino
      const X = badge(q(".s07-badge"), 590, 680, 30);
      pop(X, NADIE, "590 680");
      // "El cartón": la tarjeta pasa al centro
      tl.to(qa(".s07-fig, .s07-arco, .s07-badge"), { opacity: 0, filter: "blur(6px)", duration: 0.3 }, EL - 0.1);
      tl.to(T, { scale: 0.85, x: 0, y: 70, svgOrigin: "540 890", duration: 0.45, ease: "power3.out" }, EL);
      etiqueta(1, EL + 0.16);
      // "manda mensajes": globito arriba, tachado
      gsap.set(q(".s07-arriba"), { x: 540, y: 700 });
      tl.fromTo(q(".s07-arriba"), { opacity: 0, scale: 0.6, svgOrigin: "0 0" }, { opacity: 1, scale: 1.1, svgOrigin: "0 0", duration: 0.35, ease: "back.out(1.8)" }, MANDA - 0.1);
      dibujar([q(".s07-tacha")], MENSAJES, 0.25);
      tl.to(q(".s07-arriba"), { opacity: 0.45, duration: 0.2 }, MENSAJES + 0.2);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
