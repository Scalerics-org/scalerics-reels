  <script>
    (function () {
      const ID = "s10-no-se-pierde";
      const DUR = 3.47;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const nuevo = (padre, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); padre.appendChild(e); return e; };

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * (paso ?? 0.04) : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      const ETQ = qa(".etiqueta span");
      const etiqueta = (k, t) => {
        if (k > 0) tl.to(ETQ[k - 1], { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(ETQ[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      // badge de "no": círculo verde con una X, centrado en (x, y)
      const badge = (padre, x, y, r) => {
        const g = nuevo(padre, "g", {});
        r = r || 18;
        const k = r * 0.42;
        nuevo(g, "circle", { class: "ln-badge", cx: x, cy: y, r: r });
        nuevo(g, "path", { class: "ln-badge", d: "M" + (x - k) + " " + (y - k) + " L" + (x + k) + " " + (y + k) + " M" + (x + k) + " " + (y - k) + " L" + (x - k) + " " + (y + k) });
        return g;
      };
      // figurita de palo: pies en (x, y)
      const FIG = (x, y) => '<circle class="ln" cx="' + x + '" cy="' + (y - 96) + '" r="14" /><path class="ln" d="M' + x + ' ' + (y - 82) + ' V' + (y - 40) + ' M' + x + ' ' + (y - 70) + ' L' + (x - 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 70) + ' L' + (x + 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 40) + ' L' + (x - 14) + ' ' + y + ' M' + x + ' ' + (y - 40) + ' L' + (x + 14) + ' ' + y + '" />';
      const caminar = (g, t, pasos, origen) => tl.fromTo(g, { rotation: -4, svgOrigin: origen || "0 0" }, { rotation: 4, svgOrigin: origen || "0 0", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: pasos }, t);

      const NO = 0.17, PIERDE = 0.57, JUNTA = 0.67, SELLOS = 1.63, CANJEA = 2.59, PREMIOS = 2.97;
      gsap.set(qa(".s10-ok, .s10-regalo"), { opacity: 0 });
      qa(".s10-s").forEach((s, i) => gsap.set(s, { opacity: i < 6 ? 1 : 0 }));
      dibujar(qa(".s10-dc"), 0, 0.4, 0.35, 0.02);
      tl.fromTo(q(".s10-cel"), { y: 20 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
      // la de cartón, apagada, se cae y se va
      tl.fromTo(q(".s10-viejo"), { opacity: 0.8, y: 0, rotation: -6, svgOrigin: "195 913" }, { opacity: 0, y: 260, rotation: 30, svgOrigin: "195 913", duration: 0.7, ease: "power2.in" }, NO);
      // "no se pierde": tilde verde
      pop(q(".s10-ok"), PIERDE - 0.15, "730 626");
      etiqueta(0, NO);
      // "junta sellos": se llenan los que faltan
      qa(".s10-s").slice(6).forEach((s, i) => {
        const cx = s.getAttribute("cx"), cy = s.getAttribute("cy");
        tl.fromTo(s, { opacity: 0, scale: 0.2, svgOrigin: cx + " " + cy }, { opacity: 1, scale: 1, svgOrigin: cx + " " + cy, duration: 0.3, ease: "back.out(2.4)" }, JUNTA + 0.15 + i * 0.26);
      });
      tl.to(q(".s10-cel"), { scale: 1.03, svgOrigin: "540 920", duration: 0.12, yoyo: true, repeat: 1 }, SELLOS);
      etiqueta(1, JUNTA + 0.2);
      // "canjea premios": el regalo
      pop(q(".s10-regalo"), CANJEA - 0.1, "871 960");
      tl.to(q(".s10-regalo"), { y: -18, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, PREMIOS);
      tl.to(qa(".s10-s"), { opacity: 0.4, duration: 0.2 }, CANJEA + 0.1);
      etiqueta(2, CANJEA);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
