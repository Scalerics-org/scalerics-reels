<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s08-sistema"] .s08-capa { position: absolute; inset: 0; }
    [data-composition-id="s08-sistema"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s08-sistema"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sistema"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sistema"] .ln-t { fill: none; stroke: rgba(239, 238, 229, 0.55); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sistema"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sistema"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sistema"] .relleno { fill: #5ce611; }
    [data-composition-id="s08-sistema"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s08-sistema"] .signo { font-family: "Lexend", sans-serif; font-weight: 700; fill: #5ce611; }
    [data-composition-id="s08-sistema"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s08-sistema"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
    [data-composition-id="s08-sistema"] .s08-signo { fill: #efeee5; }
  </style>
  <div id="root" data-composition-id="s08-sistema" data-width="1080" data-height="1920" data-duration="3.1">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="3.1" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s08-cubo">
        <rect class="ln s08-dr" x="430" y="880" width="220" height="190" rx="10" />
        <path class="ln s08-dr" d="M410 830 H670 V880 H410 Z" />
        <path class="ln s08-dr" d="M540 830 V1070" />
        <path class="ln-ac s08-dr" d="M540 830 Q480 760 466 794 Q478 826 540 830 Q600 760 614 794 Q602 826 540 830" />
        <g class="s08-fig"></g>
        <g class="s08-plata">
        <circle class="ln" cx="820" cy="720" r="44" />
        <text class="signo s08-signo" x="820" y="738" text-anchor="middle" font-size="48">$</text>
        <path class="ln-ac s08-tacha" d="M768 772 L872 668" />
        </g>
        </g>
        <g class="s08-engranaje">
        <path class="ln s08-dg s08-dientes" d="" />
        <circle class="ln-ac s08-dg" cx="540" cy="920" r="54" />
        </g>
      </svg>
      <div class="etiqueta"><span class="s08-e1">Premiar al que vuelve</span><span class="s08-e2">Es un sistema</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-sistema";
      const DUR = 3.1;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const nuevo = (padre, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); padre.appendChild(e); return e; };

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * (paso ?? 0.04) : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      const ETQ = qa(".etiqueta span");
      const etiqueta = (k, t) => {
        if (k > 0) tl.to(ETQ[k - 1], { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(ETQ[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      // badge de "no": círculo verde con una X, centrado en (x, y)
      const badge = (padre, x, y, r) => {
        const g = nuevo(padre, "g", {});
        r = r || 18;
        const k = r * 0.42;
        nuevo(g, "circle", { class: "ln-badge", cx: x, cy: y, r: r });
        nuevo(g, "path", { class: "ln-badge", d: "M" + (x - k) + " " + (y - k) + " L" + (x + k) + " " + (y + k) + " M" + (x + k) + " " + (y - k) + " L" + (x - k) + " " + (y + k) });
        return g;
      };
      // figurita de palo: pies en (x, y)
      const FIG = (x, y) => '<circle class="ln" cx="' + x + '" cy="' + (y - 96) + '" r="14" /><path class="ln" d="M' + x + ' ' + (y - 82) + ' V' + (y - 40) + ' M' + x + ' ' + (y - 70) + ' L' + (x - 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 70) + ' L' + (x + 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 40) + ' L' + (x - 14) + ' ' + y + ' M' + x + ' ' + (y - 40) + ' L' + (x + 14) + ' ' + y + '" />';
      const caminar = (g, t, pasos, origen) => tl.fromTo(g, { rotation: -4, svgOrigin: origen || "0 0" }, { rotation: 4, svgOrigin: origen || "0 0", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: pasos }, t);

      const AL = 0.6, VUELVE = 1.1, CARO = 1.82, ES = 2.41, SISTEMA = 2.65;
      const CX = 540, CY = 920, RIN = 128, ROUT = 168, N = 9;
      const pt = (r, a) => (CX + r * Math.cos(a)).toFixed(1) + " " + (CY + r * Math.sin(a)).toFixed(1);
      let d = "";
      for (let i = 0; i < N; i++) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
        d += (i === 0 ? "M" + pt(RIN, a - 0.2) : "") + " L" + pt(ROUT, a - 0.12) + " L" + pt(ROUT, a + 0.12) + " L" + pt(RIN, a + 0.2) + " A" + RIN + " " + RIN + " 0 0 1 " + pt(RIN, a + (2 * Math.PI) / N - 0.2);
      }
      q(".s08-dientes").setAttribute("d", d + " Z");
      q(".s08-fig").innerHTML = FIG(780, 1070);
      gsap.set(qa(".s08-plata, .s08-fig"), { opacity: 0 });
      // el regalo
      dibujar(qa(".s08-dr"), 0, 0.5, 0.45, 0.05);
      tl.fromTo(q(".s08-cubo"), { scale: 0.95, svgOrigin: "540 950" }, { scale: 1, svgOrigin: "540 950", duration: 0.6, ease: "power3.out" }, 0);
      etiqueta(0, AL);
      // "vuelve": entra la figurita
      tl.fromTo(q(".s08-fig"), { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, VUELVE - 0.2);
      caminar(q(".s08-fig"), VUELVE - 0.2, 3, "780 1070");
      // "caro": $ tachado
      pop(q(".s08-plata"), CARO - 0.3, "820 720");
      gsap.set(q(".s08-tacha"), { opacity: 0 });
      dibujar([q(".s08-tacha")], CARO, 0.25);
      // "Es": se va todo y se dibuja el engranaje
      tl.to(q(".s08-cubo"), { opacity: 0, scale: 0.8, filter: "blur(6px)", svgOrigin: "540 920", duration: 0.3, ease: "power2.in" }, ES - 0.25);
      dibujar(qa(".s08-dg"), ES - 0.05, 0.4);
      tl.fromTo(q(".s08-engranaje"), { rotation: -30, svgOrigin: "540 920" }, { rotation: 30, svgOrigin: "540 920", duration: DUR - ES, ease: "none" }, ES - 0.05);
      tl.to(q(".s08-engranaje"), { scale: 1.12, svgOrigin: "540 920", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, SISTEMA);
      etiqueta(1, ES);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
