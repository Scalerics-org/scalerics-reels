    (function () {
      const ID = "s06-queres";
      const DUR = 7.05;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s06-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);

      const PODES = 0.37, QUERES = 1.96, SIN = 3.11, CAPAZ = 3.9, DESP = 4.97, TRES = 5.76, UUUH = 6.07;

      tl.to(q(".s06-vos"), { y: 8, duration: 0.333, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.3);

      tl.to(q(".s06-vos"), { opacity: 0.25, scale: 0.85, filter: "blur(2px)", duration: 0.25 }, QUERES - 0.2);

      // "sin corazón, capaz": el corazón se dibuja y aparece la pregunta

      const c = q(".s06-cor-t"), L = c.getTotalLength();
      gsap.set(c, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
      tl.to(c, { opacity: 1, duration: 0.02 }, SIN);
      tl.to(c, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, SIN);
      gsap.set(q(".s06-preg"), { opacity: 0 });
      tl.fromTo(q(".s06-preg"), { opacity: 0, scale: 0.4, svgOrigin: "820 740" }, { opacity: 1, scale: 1, svgOrigin: "820 740", duration: 0.3, ease: "back.out(3)", immediateRender: false }, CAPAZ - 0.1);
      tl.to(q(".s06-preg"), { rotation: 12, svgOrigin: "820 740", duration: 0.15, yoyo: true, repeat: 3 }, CAPAZ + 0.2);

      golpe(".s06-reloj", DESP - 0.25, 1.8);
      tl.to(q(".s06-reloj"), { opacity: 0.35, duration: 0.08, yoyo: true, repeat: 5, ease: "steps(1)" }, DESP + 0.2);
      golpe(".s06-desp", DESP, 2.8);
      sacudon(DESP + 0.05, 1.3);
