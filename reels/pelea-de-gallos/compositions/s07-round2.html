  <script>
    (function () {
      const ID = "s07-round2";
      const DUR = 2.88;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s07-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const PICO = 0.2, ROUND = 1.28;

      // cuadro 0: "se picó" ya cayendo
      tl.fromTo(q(".s07-pico"), { opacity: 0.5, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.in" }, 0);
      sacudon(PICO, 1.5);
      // las llamas se dibujan y titilan
      qa(".s07-ll").forEach((el, i) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.02 }, 0.1 + i * 0.05);
        tl.to(el, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 0.1 + i * 0.05);
        tl.fromTo(el, { scaleY: 1, transformOrigin: "50% 100%" }, { scaleY: 1.2, transformOrigin: "50% 100%", duration: 0.12, yoyo: true, repeat: 9, ease: "sine.inOut" }, 0.4 + i * 0.03);
      });
      tl.to(q(".s07-pico"), { scale: 1.08, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.35);

      // ROUND 2
      tl.to(q(".s07-pico"), { opacity: 0, y: -260, scale: 0.7, duration: 0.18, ease: "power2.in" }, ROUND - 0.2);
      gsap.set(q(".s07-round"), { opacity: 0 });
      tl.fromTo(q(".s07-round"), { opacity: 0, scale: 2.8 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power4.in", immediateRender: false }, ROUND - 0.1);
      sacudon(ROUND + 0.05, 1.6);
      tl.to(q(".s07-round"), { rotation: 3, duration: 0.15, ease: "back.out(3)" }, 1.8);
      tl.to(q(".s07-round"), { scale: 1.06, duration: 0.167, yoyo: true, repeat: 3, ease: "sine.inOut" }, 2.0);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
