  <style>

    [data-composition-id="ambiente"] .am-luz { position: absolute; top: -120px; width: 520px; height: 2100px; mix-blend-mode: screen; transform-origin: 50% 0%; clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); }
    [data-composition-id="ambiente"] .am-luz-m { left: -10px; background: linear-gradient(180deg, rgba(255, 43, 214, 0.32) 0%, rgba(255, 43, 214, 0.06) 70%, rgba(255, 43, 214, 0) 100%); }
    [data-composition-id="ambiente"] .am-luz-c { left: 570px; background: linear-gradient(180deg, rgba(25, 227, 255, 0.3) 0%, rgba(25, 227, 255, 0.05) 70%, rgba(25, 227, 255, 0) 100%); }
    [data-composition-id="ambiente"] .am-luz-a { left: 280px; background: linear-gradient(180deg, rgba(255, 232, 61, 0.22) 0%, rgba(255, 232, 61, 0.04) 70%, rgba(255, 232, 61, 0) 100%); opacity: 0; }
    /* barra de arriba: quién habla y el round */
    [data-composition-id="ambiente"] .am-chapa { position: absolute; left: 60px; top: 104px; padding: 12px 24px 10px; border-radius: 10px; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 36px; letter-spacing: 0.02em; text-transform: uppercase; color: #07060b; white-space: nowrap; transform: rotate(-3deg); opacity: 0; }
    [data-composition-id="ambiente"] .am-ch-p { background: #ffe83d; box-shadow: 6px 6px 0 #ff2bd6; }
    [data-composition-id="ambiente"] .am-ch-d { background: #ff2bd6; box-shadow: 6px 6px 0 #ffe83d; }
    [data-composition-id="ambiente"] .am-ch-a { background: #19e3ff; box-shadow: 6px 6px 0 #ff2bd6; }

    [data-composition-id="ambiente"] .am-round-n { font-family: "Lexend", sans-serif; font-weight: 900; font-size: 36px; color: #ffe83d; text-transform: uppercase; white-space: nowrap; }
    [data-composition-id="ambiente"] .am-reloj { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 42px; color: #07060b; background: #ffe83d; padding: 4px 14px; border-radius: 8px; min-width: 132px; text-align: center; }
    /* aplausómetro */
    [data-composition-id="ambiente"] .am-metro { position: absolute; left: 90px; top: 1440px; width: 900px; height: 120px; }
    [data-composition-id="ambiente"] .am-metro-tit { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.3em; color: #ffe83d; }
    [data-composition-id="ambiente"] .am-metro-gan { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.3em; color: #5ce611; opacity: 0; }
    [data-composition-id="ambiente"] .am-lado { position: absolute; top: 0; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 28px; text-transform: uppercase; }
    [data-composition-id="ambiente"] .am-lado-d { left: 0; color: #ff2bd6; }
    [data-composition-id="ambiente"] .am-lado-a { right: 0; color: #19e3ff; }
    [data-composition-id="ambiente"] .am-barra { position: absolute; left: 0; top: 48px; width: 900px; height: 40px; border-radius: 8px; border: 4px solid #f5f1ea; overflow: hidden; background: #07060b; }
    [data-composition-id="ambiente"] .am-fill { position: absolute; top: 0; height: 100%; width: 100%; }
    [data-composition-id="ambiente"] .am-fill-d { left: 0; background: #ff2bd6; transform-origin: 0% 50%; }
    [data-composition-id="ambiente"] .am-fill-a { left: 0; background: #19e3ff; transform-origin: 100% 50%; }
    [data-composition-id="ambiente"] .am-fill-v { left: 0; background: #5ce611; transform-origin: 0% 50%; transform: scaleX(0); }
    [data-composition-id="ambiente"] .am-marca { position: absolute; left: 0; top: 36px; width: 10px; height: 64px; margin-left: -5px; background: #ffe83d; border-radius: 4px; }
    /* público */
    [data-composition-id="ambiente"] .am-publico { position: absolute; left: 0; top: 1560px; width: 1080px; height: 360px; }
    [data-composition-id="ambiente"] .am-publico svg { position: absolute; left: 0; top: 0; width: 1080px; height: 360px; overflow: visible; }
    [data-composition-id="ambiente"] .am-flash { position: absolute; inset: 0; background: #f5f1ea; opacity: 0; }
    [data-composition-id="ambiente"] .am-flash-m { position: absolute; inset: 0; background: #ff2bd6; opacity: 0; mix-blend-mode: screen; }
    [data-composition-id="ambiente"] .am-flash-c { position: absolute; inset: 0; background: #19e3ff; opacity: 0; mix-blend-mode: screen; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="75.35">
    <div id="am-escena" class="am-capa clip" data-start="0" data-duration="75.35" data-track-index="0">
      <div class="am-luz am-luz-m"></div>
      <div class="am-luz am-luz-c"></div>
      <div class="am-luz am-luz-a"></div>

      <div class="am-chapa am-ch-p am-ch-p1">Presentador</div>
      <div class="am-chapa am-ch-d am-ch-d1">MC Dueño</div>
      <div class="am-chapa am-ch-a am-ch-a1">MC Agente de IA</div>
      <div class="am-chapa am-ch-p am-ch-p2">Presentador</div>
      <div class="am-chapa am-ch-d am-ch-d2">MC Dueño</div>
      <div class="am-chapa am-ch-a am-ch-a2">MC Agente de IA</div>
      <div class="am-chapa am-ch-j">El jurado</div>

      <div class="am-round"><span class="am-round-n">Round 1</span><span class="am-reloj">0:30</span></div>

      <div class="am-publico">
        <svg viewBox="0 0 1080 360" aria-hidden="true">
          <!-- manos (suben en cada uuuh) -->
          <g class="am-manos" fill="#050408" stroke="#2a2036" stroke-width="3">
            <path d="M80 200 L60 60 L48 30 M60 60 L74 26 M60 60 L88 34" fill="none" stroke="#050408" stroke-width="22" stroke-linecap="round" />
            <path d="M250 200 L270 50 L262 18 M270 50 L284 16 M270 50 L298 26" fill="none" stroke="#050408" stroke-width="22" stroke-linecap="round" />
            <path d="M420 210 L400 70 L388 38 M400 70 L412 34 M400 70 L430 44" fill="none" stroke="#050408" stroke-width="22" stroke-linecap="round" />
            <path d="M640 210 L660 60 L650 28 M660 60 L674 24 M660 60 L690 36" fill="none" stroke="#050408" stroke-width="22" stroke-linecap="round" />
            <path d="M820 200 L800 64 L788 32 M800 64 L812 28 M800 64 L830 38" fill="none" stroke="#050408" stroke-width="22" stroke-linecap="round" />
            <path d="M1000 210 L1020 70 L1010 38 M1020 70 L1034 34 M1020 70 L1050 46" fill="none" stroke="#050408" stroke-width="22" stroke-linecap="round" />
          </g>
          <!-- cabezas y hombros -->
          <g fill="#050408">
            <circle cx="40" cy="190" r="56" /><circle cx="170" cy="170" r="60" /><circle cx="310" cy="200" r="54" />
            <circle cx="450" cy="176" r="62" /><circle cx="590" cy="196" r="56" /><circle cx="730" cy="172" r="60" />
            <circle cx="870" cy="194" r="56" /><circle cx="1010" cy="172" r="60" />
            <path d="M-40 260 C0 220 80 220 120 260 C160 230 220 220 260 250 C300 230 380 230 420 250 C470 225 540 230 580 255 C630 230 700 225 760 250 C800 230 880 230 920 255 C960 225 1040 225 1120 250 V360 H-40 Z" />
          </g>
          <!-- borde de luz sobre las cabezas -->
          <g fill="none" stroke-width="4" stroke-linecap="round" opacity="0.7">
            <path d="M-2 150 A56 56 0 0 1 60 136" stroke="#ff2bd6" /><path d="M130 124 A60 60 0 0 1 200 114" stroke="#ff2bd6" />
            <path d="M410 128 A62 62 0 0 1 480 116" stroke="#ffe83d" /><path d="M700 122 A60 60 0 0 1 770 116" stroke="#19e3ff" />
            <path d="M970 126 A60 60 0 0 1 1040 116" stroke="#19e3ff" />
          </g>
        </svg>
      </div>

      <div class="am-metro">
        <div class="am-metro-tit" data-layout-ignore>Aplausómetro</div>
        <div class="am-metro-gan" data-layout-ignore>Ganan los dos</div>
        <div class="am-lado am-lado-d">Dueño</div>
        <div class="am-lado am-lado-a">Agente</div>
        <div class="am-barra">
          <div class="am-fill am-fill-a"></div>
          <div class="am-fill am-fill-d"></div>
          <div class="am-fill am-fill-v"></div>
        </div>
        <div class="am-marca"></div>
      </div>

      <div class="am-flash-m"></div>
      <div class="am-flash-c"></div>
      <div class="am-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 75.35;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // ---- luces que barren (finitas, nada de repeat -1) ----
      tl.fromTo(q(".am-luz-m"), { rotation: -28 }, { rotation: 22, duration: 2.667, ease: "sine.inOut", yoyo: true, repeat: Math.floor(DUR / 2.667) }, 0);
      tl.fromTo(q(".am-luz-c"), { rotation: 26 }, { rotation: -24, duration: 2.667, ease: "sine.inOut", yoyo: true, repeat: Math.floor(DUR / 2.667) }, 0);
      tl.fromTo(q(".am-luz-a"), { rotation: -12 }, { rotation: 12, duration: 1.333, ease: "sine.inOut", yoyo: true, repeat: Math.floor(DUR / 1.333) }, 0);
      // la luz amarilla solo en los momentos del presentador y del jurado
      [[0, 7.2], [31.6, 34.4], [61.2, 66.0]].forEach(([a, b]) => {
        tl.to(q(".am-luz-a"), { opacity: 1, duration: 0.2 }, a);
        tl.to(q(".am-luz-a"), { opacity: 0, duration: 0.4 }, b);
      });
      // con el dueño se apaga un poco la cian, con la agente la magenta
      [[7.49, 19.4, ".am-luz-c"], [19.5, 31.6, ".am-luz-m"], [34.55, 46.7, ".am-luz-c"], [46.78, 61.2, ".am-luz-m"]].forEach(([a, b, s]) => {
        tl.to(q(s), { opacity: 0.35, duration: 0.3 }, a);
        tl.to(q(s), { opacity: 1, duration: 0.3 }, b);
      });

      // ---- chapa de quién habla ----
      const CHAPAS = [[".am-ch-p1", 0, 7.4], [".am-ch-d1", 7.4, 19.45], [".am-ch-a1", 19.45, 31.6], [".am-ch-p2", 31.6, 34.5], [".am-ch-d2", 34.5, 46.7], [".am-ch-a2", 46.7, 61.2], [".am-ch-j", 61.2, 67.0]];
      CHAPAS.forEach(([s, a, b], i) => {
        if (i === 0) tl.fromTo(q(s), { opacity: 1, x: 0, scale: 1 }, { opacity: 1, scale: 1, duration: 0.01 }, 0);
        else tl.fromTo(q(s), { opacity: 0, x: -120, scale: 1.3 }, { opacity: 1, x: 0, scale: 1, duration: 0.22, ease: "back.out(2)", immediateRender: false }, a);
        tl.to(q(s), { opacity: 0, x: 60, duration: 0.15, ease: "power2.in" }, b - 0.15);
      });

      // ---- round y reloj ----
      const reloj = q(".am-reloj"), rn = q(".am-round-n");
      const pad = (v) => "0:" + String(Math.max(0, Math.ceil(v))).padStart(2, "0");
      tl.fromTo(q(".am-round"), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)", immediateRender: false }, 5.33);
      const r1 = { v: 30 };
      tl.fromTo(r1, { v: 30 }, { v: 5, duration: 31.6 - 6.41, ease: "none", immediateRender: false, onUpdate: () => { reloj.textContent = pad(r1.v); rn.textContent = "Round 1"; } }, 6.41);
      const r2 = { v: 30 };
      tl.fromTo(r2, { v: 30 }, { v: 30, duration: 34.4 - 32.95, ease: "none", immediateRender: false, onUpdate: () => { reloj.textContent = pad(30); rn.textContent = "Round 2"; } }, 32.95);
      tl.fromTo(r2, { v: 30 }, { v: 3, duration: 61.2 - 34.4, ease: "none", immediateRender: false, onUpdate: () => { reloj.textContent = pad(r2.v); rn.textContent = "Round 2"; } }, 34.4);
      const r3 = { v: 0 };
      tl.fromTo(r3, { v: 0 }, { v: 1, duration: 0.1, immediateRender: false, onUpdate: () => { reloj.textContent = "0:00"; rn.textContent = "Veredicto"; } }, 61.28);
      // el reloj late en los segundos finales y en los cambios
      [6.41, 32.95, 34.4, 61.28].forEach((t) => tl.fromTo(q(".am-reloj"), { scale: 1.5 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t));
      tl.to(q(".am-round"), { opacity: 0, duration: 0.3 }, 66.8);

      // ---- aplausómetro: p = parte del dueño ----
      const metro = [[18.6, 0.66], [30.75, 0.38], [46.0, 0.28], [60.1, 0.12], [63.85, 0.04]];
      gsap.set(q(".am-fill-d"), { scaleX: 0.5 });
      gsap.set(q(".am-fill-a"), { scaleX: 1 });
      gsap.set(q(".am-marca"), { x: 450 });
      metro.forEach(([t, p]) => {
        tl.to(q(".am-fill-d"), { scaleX: p, duration: 0.9, ease: "elastic.out(1, 0.5)" }, t);
        tl.to(q(".am-marca"), { x: 900 * p, duration: 0.9, ease: "elastic.out(1, 0.5)" }, t);
        tl.fromTo(q(".am-metro"), { scale: 1.06 }, { scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, t);
      });
      // la agente gana: su lado late
      tl.to(q(".am-lado-a"), { scale: 1.4, duration: 0.15, yoyo: true, repeat: 5, transformOrigin: "100% 50%" }, 63.85);
      // giro: ganan los dos (verde)
      tl.to(q(".am-fill-v"), { scaleX: 1, duration: 0.6, ease: "power3.out" }, 64.4);
      tl.to(q(".am-marca"), { opacity: 0, duration: 0.2 }, 64.4);
      tl.to(q(".am-metro-tit"), { opacity: 0, duration: 0.15 }, 64.4);
      tl.fromTo(q(".am-metro-gan"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, 64.5);
      tl.to(q(".am-metro"), { opacity: 0, y: 30, duration: 0.4 }, 67.0);

      // ---- público: manos arriba ----
      gsap.set(q(".am-manos"), { y: 170 });
      [[0.0, 1.8], [18.55, 1.5], [30.69, 2.0], [45.97, 1.5], [60.05, 2.4], [63.8, 2.6]].forEach(([t, d]) => {
        tl.to(q(".am-manos"), { y: 0, duration: 0.25, ease: "back.out(2)" }, t);
        tl.to(q(".am-manos"), { y: -14, duration: 0.17, yoyo: true, repeat: Math.max(1, Math.round(d / 0.34)) * 2 - 1, ease: "sine.inOut" }, t + 0.25);
        tl.to(q(".am-manos"), { y: 170, duration: 0.4, ease: "power2.in" }, t + d);
      });
      // el público siempre se mueve un poco al beat
      tl.fromTo(q(".am-publico"), { y: 0 }, { y: 8, duration: 0.333, yoyo: true, repeat: Math.floor((DUR - 0.5) / 0.333), ease: "sine.inOut" }, 0);

      // ---- flashes ----
      const strobo = (t, n, sel = ".am-flash", o = 0.55) => {
        for (let k = 0; k < n; k++) {
          tl.to(q(sel), { opacity: o, duration: 0.02 }, t + k * 0.12);
          tl.to(q(sel), { opacity: 0, duration: 0.08 }, t + k * 0.12 + 0.04);
        }
      };
      strobo(0.0, 2, ".am-flash", 0.35);
      strobo(6.41, 1);
      strobo(18.55, 2, ".am-flash-m", 0.45);
      strobo(30.69, 4, ".am-flash-c", 0.5);
      strobo(34.4, 1);
      strobo(45.97, 2, ".am-flash-m", 0.4);
      strobo(60.05, 5, ".am-flash-c", 0.55);
      strobo(63.8, 4, ".am-flash", 0.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
