  <script>
    (function () {
      const ID = "s12-jurado";
      const DUR = 2.91;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s12-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, desde = 2.6) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const GANA = 1.56, AGENTE = 2.06, BOCINA = 2.52;

      // cuadro 0: las tarjetas ya entrando, suspenso
      tl.fromTo(q(".s12-tit"), { opacity: 0.5, y: -20 }, { opacity: 1, y: 0, duration: 0.2 }, 0);
      const tarj = qa(".s12-tarj");
      tl.fromTo(tarj, { opacity: 0.5, y: 120 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)", stagger: 0.06 }, 0);
      tl.to(tarj, { rotation: 3, duration: 0.08, yoyo: true, repeat: 5, stagger: 0.03 }, 0.3);
      // se dan vuelta, una por una
      tarj.forEach((t, i) => {
        const at = 0.55 + i * 0.28;
        tl.to(t, { scaleX: 0, duration: 0.09, ease: "power2.in" }, at);
        tl.set(t.querySelector(".s12-dorso"), { opacity: 0 }, at + 0.09);
        tl.set(t.querySelector(".s12-frente"), { opacity: 1 }, at + 0.09);
        tl.to(t, { scaleX: 1, duration: 0.12, ease: "back.out(2)" }, at + 0.09);
      });
      sacudon(1.2, 0.7);
      golpe(".s12-gana", GANA, 2.4);
      sacudon(GANA + 0.05);
      golpe(".s12-agente", AGENTE, 2.8);
      sacudon(AGENTE + 0.05, 1.4);
      // bocina: confeti
      gsap.set(q(".s12-confeti"), { opacity: 0 });
      tl.fromTo(q(".s12-confeti"), { opacity: 1, scale: 0.4, svgOrigin: "540 1000" }, { opacity: 1, scale: 1, svgOrigin: "540 1000", duration: 0.3, ease: "power3.out", immediateRender: false }, BOCINA - 0.1);
      tl.to(q(".s12-confeti"), { y: 40, duration: 0.3, ease: "none" }, BOCINA + 0.2);
      tl.to(q(".s12-agente"), { scale: 1.1, duration: 0.1, yoyo: true, repeat: 1 }, BOCINA);

      tl.to(q("#s12-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.15, ease: "power3.in" }, DUR - 0.15);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
