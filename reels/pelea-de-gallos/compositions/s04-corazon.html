  <script>
    (function () {
      const ID = "s04-corazon";
      const DUR = 6.07;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s04-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);

      const cae = (sel, t) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, y: -420, rotation: -14 }, { opacity: 1, y: 0, rotation: 0, duration: 0.25, ease: "bounce.out", immediateRender: false }, t - 0.12);

      const LIBRETA = 0.08, MATE = 0.96, LLAVE = 1.85, GANA = 3.62, MAQUINA = 3.97, CORAZON = 4.59, UUUH = 5.12;
      const rot = qa(".s04-rot");

      // cuadro 0: el "tengo" y la libreta ya cayendo

      cae(".s04-llave", LLAVE);
      gsap.set(rot[2], { opacity: 0 });
      tl.fromTo(rot[2], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, immediateRender: false }, LLAVE + 0.15);
      sacudon(LIBRETA + 0.15, 0.7); sacudon(MATE + 0.15, 0.7); sacudon(LLAVE + 0.15, 0.7);
      // los tres objetos laten al beat
      tl.to([q(".s04-libreta"), q(".s04-mate"), q(".s04-llave")], { y: -12, duration: 0.167, yoyo: true, repeat: 5, stagger: 0.1, ease: "sine.inOut" }, LLAVE + 0.3);

      golpe(".s04-sin", CORAZON, 2.8);
      sacudon(CORAZON + 0.05, 1.3);

      tl.fromTo([q(".s04-cor-izq"), q(".s04-cor-der")], { opacity: 1, scale: 0.4, svgOrigin: "540 1200" }, { opacity: 1, scale: 1, svgOrigin: "540 1200", duration: 0.25, ease: "back.out(2)", immediateRender: false }, CORAZON - 0.1);
