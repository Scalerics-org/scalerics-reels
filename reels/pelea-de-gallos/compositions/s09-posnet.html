    (function () {
      const ID = "s09-posnet";
      const DUR = 6.25;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s09-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, desde = 2.6) => {
        const el = typeof sel === "string" ? q(sel) : sel;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const PANT = 0.39, SONRISA = 1.72, POSNET = 3.22, PASA = 3.92, PRISA = 4.91, UUUH = 5.44;

      // cuadro 0: la pantalla ya entrando

      golpe(".s09-lab-p", PANT, 2.2);
      sacudon(PANT + 0.05, 0.8);
      tl.to([q(".s09-pant"), q(".s09-lab-p")], { opacity: 0.3, duration: 0.2 }, SONRISA - 0.1);
      // la sonrisa se dibuja enorme
      qa(".s09-son path").forEach((el, i) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.02 }, SONRISA - 0.25 + i * 0.05);
        tl.to(el, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, SONRISA - 0.25 + i * 0.05);
      });
      golpe(".s09-lab-s", SONRISA, 2.4);
      sacudon(SONRISA + 0.05);
      tl.to(q(".s09-son"), { scale: 1.08, svgOrigin: "790 820", duration: 0.167, yoyo: true, repeat: 3, ease: "sine.inOut" }, SONRISA + 0.15);

      // el posnet que no anda

      gsap.set(q(".s09-posnet"), { opacity: 0 });
      tl.fromTo(q(".s09-posnet"), { opacity: 1, y: 700 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.3)", immediateRender: false }, POSNET - 0.3);
      gsap.set(q(".s09-error"), { opacity: 0 });
      tl.fromTo(q(".s09-error"), { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, POSNET);
      tl.to(q(".s09-error"), { opacity: 0.15, duration: 0.1, yoyo: true, repeat: 9, ease: "steps(1)" }, POSNET + 0.1);
      tl.fromTo(q(".s09-error"), { x: 0 }, { x: 14, duration: 0.04, yoyo: true, repeat: 5, immediateRender: false }, POSNET);
      // "pasá el lunes": cartel colgado
      gsap.set([q(".s09-cartel"), q(".s09-hilo")], { opacity: 0 });
      tl.fromTo(q(".s09-hilo"), { opacity: 0 }, { opacity: 1, duration: 0.05, immediateRender: false }, PASA - 0.15);
      tl.fromTo(q(".s09-cartel"), { opacity: 1, y: -400 }, { opacity: 1, y: 0, duration: 0.25, ease: "bounce.out", immediateRender: false }, PASA - 0.15);
      tl.fromTo(q(".s09-cartel"), { rotation: 8 }, { rotation: -5, duration: 0.33, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, PASA + 0.1);
      sacudon(PASA + 0.1);
      tl.fromTo(q(".s09-cartel small"), { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, PRISA - 0.1);
      gsap.set(q(".s09-cartel small"), { opacity: 0 });
      // la gotita de sudor: se dio cuenta
      gsap.set(q(".s09-gota"), { opacity: 0 });
      tl.fromTo(q(".s09-gota"), { opacity: 1, y: -20 }, { opacity: 1, y: 40, duration: 0.6, ease: "power1.in", immediateRender: false }, PRISA);

      // el público: UUUH y JAJA

      golpe(".s09-uuuh", UUUH, 3);
