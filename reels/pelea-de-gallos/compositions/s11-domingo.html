    (function () {
      const ID = "s11-domingo";
      const DUR = 7.32;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const PASO = 0.96, TRANQ = 1.84, NO = 2.85, ROBAR = 3.35, PUESTO = 3.79, DEVOLVER = 4.94, DOMINGO = 5.56, UUUH = 6.09;

      tl.to(burb, { opacity: 1, duration: 0.05 }, PASO - 0.2);
      tl.fromTo(p, { v: 0 }, { v: 1, duration: 0.7, ease: "power2.inOut", onUpdate: mover, immediateRender: false }, PASO - 0.2);
      tl.fromTo(q(".tel-m"), { scale: 1, svgOrigin: "850 895" }, { scale: 1.08, svgOrigin: "850 895", duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, PASO + 0.5);
