  <script>
    (function () {
      const ID = "s01-gancho";
      const DUR = 4.65;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan (opacity 0 hasta que arrancan: sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.03);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0.001 ? 1 : 0 });
          if (t0 > 0.001) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const centro = (el) => { const b = el.getBBox(); return (b.x + b.width / 2) + " " + (b.y + b.height / 2); };
      // aparece entero con golpe
      const pop = (els, t, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const o = centro(el);
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.35, ease: "back.out(1.6)" }, t + i * (paso ?? 0.08));
        });
      };
      // globo que vuela desde (sx,sy) a su lugar (x,y): x/y en el g de afuera, escala en el de adentro
      const volar = (g, x, y, sx, sy, t, dur) => {
        const inn = g.querySelector(".gin");
        gsap.set(g, { opacity: 0 });
        tl.fromTo(g, { x: sx - x, y: sy - y, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: dur ?? 0.45, ease: "power3.out" }, t);
        tl.fromTo(inn, { scale: 0.3, svgOrigin: x + " " + y }, { scale: 1, svgOrigin: x + " " + y, duration: dur ?? 0.45, ease: "back.out(1.6)" }, t);
      };
      const latir = (el, t, s) => { const o = centro(el); tl.to(el, { scale: s ?? 1.08, svgOrigin: o, duration: 0.13, yoyo: true, repeat: 1, ease: "power2.out" }, t); };
      // etiqueta: muestra la i (1..n) en t y saca la anterior
      let etAnt = null;
      const etq = (i, t) => {
        const el = q(".s01-e" + i);
        if (etAnt) tl.to(etAnt, { opacity: 0, duration: 0.2 }, t - 0.2);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
        etAnt = el;
      };


      const B = [[330,905,0,0.12],[752,890,1,0.55],[405,770,0,1.4],[680,760,1,1.75],[545,690,0,2.3]];
      const ORDENAR = 3.2, PRIMERO = 3.5;
      dibujar(qa(".s01-d"), 0, 0.6, 0.45, 0);
      const quien = [q(".s01-caj"), q(".s01-dep")];
      const origen = [[250, 1050], [830, 1050]];
      B.forEach(([x, y, w, t], i) => {
        const b = q(".s01-b" + (i + 1));
        const [sx, sy] = origen[w];
        volar(b, x, y, sx, sy, t);
        tl.to(quien[w], { y: -12, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, t);
        tl.to(q(".s01-due"), { rotation: w ? 6 : -6, svgOrigin: "0 -60", duration: 0.25, ease: "power2.out" }, t + 0.05);
        // flotan un poco mientras esperan
        tl.to(b.querySelector(".gin"), { y: -6, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + 0.5);
      });
      tl.to(q(".s01-due"), { rotation: 0, svgOrigin: "0 -60", duration: 0.3, ease: "power2.inOut" }, ORDENAR - 0.3);
      // "ordenar": se alinean en fila
      const fila = [300, 420, 540, 660, 780];
      const ordenados = [0, 2, 4, 3, 1];
      ordenados.forEach((k, j) => {
        const [x, y] = B[k];
        tl.to(q(".s01-b" + (k + 1)), { x: fila[j] - x, y: 690 - y, duration: 0.4, ease: "power3.inOut", overwrite: false }, ORDENAR + j * 0.03);
      });
      // "primero": el primero se pone verde y late
      tl.to(q(".s01-b1"), { opacity: 0, duration: 0.15 }, PRIMERO + 0.12);
      pop(q(".s01-verde"), PRIMERO + 0.1);
      tl.to(q(".s01-verde .gin"), { scale: 1.18, svgOrigin: "300 690", duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, PRIMERO + 0.5);
      qa(".s01-b").forEach((b, i) => { if (i) tl.to(b, { opacity: 0.45, duration: 0.3 }, PRIMERO + 0.2); });
      etq(1, 0.9);
      etq(2, ORDENAR);


      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
