  <script>
    (function () {
      const ID = "anotador";
      const DUR = 23.59;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan (opacity 0 hasta que arrancan: sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.03);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0.001 ? 1 : 0 });
          if (t0 > 0.001) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const centro = (el) => { const b = el.getBBox(); return (b.x + b.width / 2) + " " + (b.y + b.height / 2); };
      // aparece entero con golpe
      const pop = (els, t, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const o = centro(el);
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.35, ease: "back.out(1.6)" }, t + i * (paso ?? 0.08));
        });
      };
      // globo que vuela desde (sx,sy) a su lugar (x,y): x/y en el g de afuera, escala en el de adentro
      const volar = (g, x, y, sx, sy, t, dur) => {
        const inn = g.querySelector(".gin");
        gsap.set(g, { opacity: 0 });
        tl.fromTo(g, { x: sx - x, y: sy - y, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: dur ?? 0.45, ease: "power3.out" }, t);
        tl.fromTo(inn, { scale: 0.3, svgOrigin: x + " " + y }, { scale: 1, svgOrigin: x + " " + y, duration: dur ?? 0.45, ease: "back.out(1.6)" }, t);
      };
      const latir = (el, t, s) => { const o = centro(el); tl.to(el, { scale: s ?? 1.08, svgOrigin: o, duration: 0.13, yoyo: true, repeat: 1, ease: "power2.out" }, t); };
      // etiqueta: muestra la i (1..n) en t y saca la anterior
      let etAnt = null;
      const etq = (i, t) => {
        const el = q(".anotador-e" + i);
        if (etAnt) tl.to(etAnt, { opacity: 0, duration: 0.2 }, t - 0.2);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
        etAnt = el;
      };


      const T0 = 4.65;
      const G = (t) => t - T0;
      const yc = (i) => 660 + 68 * i + 34;
      // la hoja se dibuja en "Probá"
      dibujar(qa(".an-d"), 0, 0.6, 1, 0.02);
      pop(qa(".an-dia"), G(5.75), 0.06);
      tl.fromTo(q(".an-tit"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.4);
      qa(".an-ring").forEach((r) => gsap.set(r, { opacity: 0 }));
      qa(".an-lbl").forEach((r) => gsap.set(r, { opacity: 0 }));
      gsap.set(q(".an-recuadro"), { opacity: 0 });
      latir(q(".an-hoja"), G(9.8), 1.03);
      // días: el que corre en verde, los anteriores apagados
      const DIAS = [10.87, 14.94, 15.9, 22.15, 22.55, 22.96];
      DIAS.forEach((t, i) => {
        pop(q(".an-ring" + i), G(t));
        tl.to(q(".an-dia" + i), { fill: "#5ce611", duration: 0.2 }, G(t));
        if (i) tl.to(q(".an-ring" + (i - 1)), { opacity: 0, duration: 0.25 }, G(t));
      });
      // las preguntas se escriben cuando alguien las dice
      const LBL = [11.8, 13.31, 18.75, 20.73, 22.35, 23.55];
      LBL.forEach((t, i) => tl.fromTo(q(".an-lbl" + i), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, G(t)));
      // palotes: [renglón, tiempo global]
      const M = [];
      const add = (r, ts) => ts.forEach((t) => M.push([r, t]));
      add(0, [12.55, 12.9, 15.1, 15.35, 16.1, 17.2, 17.5, 17.8, 22.2, 22.38, 22.62]);
      add(1, [13.95, 15.55, 16.3, 16.5, 17.35, 17.65, 22.28, 22.47]);
      add(2, [19.35, 19.65, 19.95, 22.52, 22.72]);
      add(3, [21.6, 21.85, 22.1, 22.66, 22.82]);
      add(4, [22.88]);
      // ráfaga del sábado
      const TOT = [17, 14, 12, 11, 2, 1];
      const cuenta = [0, 0, 0, 0, 0, 0];
      M.forEach(([r]) => cuenta[r]++);
      let tb = 23.15, falta = true;
      while (falta) {
        falta = false;
        for (const r of [0, 1, 2, 3, 0, 4, 1, 2, 5, 3]) {
          if (cuenta[r] < TOT[r]) { M.push([r, tb]); cuenta[r]++; tb += 0.05; falta = true; }
        }
      }
      M.sort((a, b) => a[1] - b[1]);
      const hechos = [0, 0, 0, 0, 0, 0];
      const t0Fin = G(24.7);
      const lapiz = q(".an-lapiz");
      gsap.set(lapiz, { x: 900, y: 1010, opacity: 0 });
      tl.to(lapiz, { opacity: 1, duration: 0.25 }, G(8.9));
      tl.fromTo(q(".an-lapiz-in"), { rotation: -12, svgOrigin: "0 0" }, { rotation: 8, svgOrigin: "0 0", duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, G(8.95));
      let tAnt = G(9.8);
      M.forEach(([r, tg], j) => {
        const tSig = j + 1 < M.length ? G(M[j + 1][1]) : t0Fin;
        const k = hechos[r]++;
        const el = q(".an-m" + r + "-" + k);
        const t = G(tg);
        const b = el.getBBox();
        const dd = Math.min(0.16, Math.max(0.02, t - tAnt - 0.005));
        tl.to(lapiz, { x: b.x + b.width, y: b.y + 2, duration: dd, ease: "power2.out" }, t - dd);
        dibujar([el], t, k % 5 === 4 ? 0.14 : 0.1, 1);
        const pr = Math.max(0.02, Math.min(0.1, tSig - t - 0.06));
        tl.to(lapiz, { y: b.y + b.height, duration: pr, ease: "power1.in" }, t);
        tAnt = t + pr;
      });
      tl.to(lapiz, { x: 960, y: 1060, opacity: 0, duration: 0.4, ease: "power2.in" }, Math.max(tAnt + 0.1, G(24.7)));
      // "sábado": la hoja baja y crece
      tl.to(q(".an-mov"), { y: 60, duration: 0.6, ease: "power3.inOut" }, G(22.96));
      tl.to(q(".an-hoja"), { scale: 1.1, svgOrigin: "540 833", duration: 0.6, ease: "power3.inOut" }, G(22.96));
      // "amontonan": los poco repetidos se apagan
      tl.to(qa(".an-r4, .an-r5, .an-lbl4, .an-lbl5"), { opacity: 0.28, duration: 0.4 }, G(25.4));
      // "pocas": recuadro verde
      tl.set(q(".an-recuadro"), { opacity: 1 }, G(26.55));
      dibujar([q(".an-recuadro")], G(26.6), 0.6, 1);
      tl.to(qa(".an-lbl0, .an-lbl1, .an-lbl2, .an-lbl3"), { fill: "#5ce611", duration: 0.3, stagger: 0.08 }, G(26.9));
      latir(q(".an-hoja"), G(27.4), 1.02);


      tl.to(q("#anotador-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
