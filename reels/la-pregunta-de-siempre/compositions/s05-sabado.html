<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s05-sabado"] .s05-capa { position: absolute; inset: 0; }
    [data-composition-id="s05-sabado"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s05-sabado"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-sabado"] .ln-f { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-sabado"] .ln-ap { fill: none; stroke: rgba(239, 238, 229, 0.4); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-sabado"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-sabado"] .ln-rojo { fill: none; stroke: #c0625a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s05-sabado"] .rel-ac { fill: #5ce611; }
    [data-composition-id="s05-sabado"] .rel-cr { fill: #efeee5; }
    [data-composition-id="s05-sabado"] .rel-fondo { fill: #07111f; }
    [data-composition-id="s05-sabado"] .tx { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s05-sabado"] .tx-ac { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #5ce611; }
    [data-composition-id="s05-sabado"] .tx-rojo { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #c0625a; }
    [data-composition-id="s05-sabado"] .tx-ap { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: rgba(239, 238, 229, 0.45); }
    [data-composition-id="s05-sabado"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.14em; fill: #efeee5; }
    [data-composition-id="s05-sabado"] .mono-ac { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.14em; fill: #5ce611; }
    [data-composition-id="s05-sabado"] .mono-ap { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.14em; fill: rgba(239, 238, 229, 0.55); }
    [data-composition-id="s05-sabado"] .mono-rojo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.14em; fill: #c0625a; }
    [data-composition-id="s05-sabado"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s05-sabado"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
    [data-composition-id="s05-sabado"] .etiqueta .rojo { color: #c0625a; }
    [data-composition-id="s05-sabado"] .etiqueta .crema { color: #efeee5; }

  </style>
  <div id="root" data-composition-id="s05-sabado" data-width="1080" data-height="1920" data-duration="5.28">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="5.28" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">

      </svg>
      <div class="etiqueta"><span class="s05-e1">Sábado</span><span class="s05-e2 crema">Las que más se repiten</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-sabado";
      const DUR = 5.28;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan (opacity 0 hasta que arrancan: sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.03);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0.001 ? 1 : 0 });
          if (t0 > 0.001) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const centro = (el) => { const b = el.getBBox(); return (b.x + b.width / 2) + " " + (b.y + b.height / 2); };
      // aparece entero con golpe
      const pop = (els, t, paso) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const o = centro(el);
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: o }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.35, ease: "back.out(1.6)" }, t + i * (paso ?? 0.08));
        });
      };
      // globo que vuela desde (sx,sy) a su lugar (x,y): x/y en el g de afuera, escala en el de adentro
      const volar = (g, x, y, sx, sy, t, dur) => {
        const inn = g.querySelector(".gin");
        gsap.set(g, { opacity: 0 });
        tl.fromTo(g, { x: sx - x, y: sy - y, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: dur ?? 0.45, ease: "power3.out" }, t);
        tl.fromTo(inn, { scale: 0.3, svgOrigin: x + " " + y }, { scale: 1, svgOrigin: x + " " + y, duration: dur ?? 0.45, ease: "back.out(1.6)" }, t);
      };
      const latir = (el, t, s) => { const o = centro(el); tl.to(el, { scale: s ?? 1.08, svgOrigin: o, duration: 0.13, yoyo: true, repeat: 1, ease: "power2.out" }, t); };
      // etiqueta: muestra la i (1..n) en t y saca la anterior
      let etAnt = null;
      const etq = (i, t) => {
        const el = q(".s05-e" + i);
        if (etAnt) tl.to(etAnt, { opacity: 0, duration: 0.2 }, t - 0.2);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
        etAnt = el;
      };


      etq(1, 0.05);
      etq(2, 1.9);


      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
