  <script>
    (function () {
      const ID = "s08-desmayo";
      const DUR = 3.98;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const E = EP;
      const carta = `<g class="s08-carta" transform="translate(760 1090) rotate(12)">
          <rect x="0" y="0" width="170" height="220" rx="4" fill="${E.BLA}" stroke="${E.TINTA}" stroke-width="5"/>

          ${E.lacre(120, 180, 24)}</g>`;
      root.querySelector(".s08-svg").innerHTML = `<g class="s08-cl">${E.clara(500, 1380, 1.05, { brazo: "frente", izq: "frente-alta" })}${carta}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = E.kit(tl, root);
      const { q } = K;

      const PRIVADO = 0.39;
      const PERO = 1.22;
      const PRIVADO2 = 2.26;

      tl.fromTo(q(".s08-cl"), { y: 30, opacity: 0.7 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      K.caraC(0, "sonrisa");
      // "privado?": cara de O y el globo
      K.caraC(PRIVADO - 0.05, "o");
      K.pop(q(".s08-q"), PRIVADO - 0.1, 0.3);
      tl.fromTo(q(".s08-carta"), { rotation: 0 }, { rotation: -6, duration: 0.08, yoyo: true, repeat: 7, ease: "none", immediateRender: false }, PRIVADO);

      K.caraC(PERO, "enojo");
      tl.to(q(".ep-c-cejas"), { y: 10, duration: 0.12 }, PERO);
      tl.to(q(".s08-q"), { opacity: 0, duration: 0.15 }, PERO + 0.3);
      K.sacudon(q(".s08-cl"), PERO + 0.05, 0.8);
      // "privado!": grito y desmayo hacia atrás
      K.pop(q(".s08-grito"), PRIVADO2 - 0.3, 0.25);
      K.caraC(PRIVADO2 + 0.25, "o");
      tl.to(q(".ep-c-ojos"), { scaleY: 0.15, svgOrigin: "0 -366", smoothOrigin: false, duration: 0.15 }, PRIVADO2 + 0.4);
      tl.to(q(".s08-cl"), { rotation: -22, svgOrigin: "500 1420", smoothOrigin: false, duration: 0.7, ease: "back.in(1.4)" }, PRIVADO2 + 0.3);
      tl.to(q(".s08-carta"), { y: 200, rotation: 60, opacity: 0, duration: 0.6, ease: "power2.in" }, PRIVADO2 + 0.4);
      K.sacudon(q(".s08-escenario"), PRIVADO2 + 1.0, 0.8);

      K.salida(q("#s08-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
