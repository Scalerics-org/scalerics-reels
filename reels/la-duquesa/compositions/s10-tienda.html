      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const E = EP;
      const W = 420, H = 740;
      const tilde = (x, y, s) => `<path d="M${x - 14 * s} ${y} L${x - 4 * s} ${y + 11 * s} L${x + 16 * s} ${y - 12 * s}" fill="none" stroke="${E.TINTA}" stroke-width="${6 * s}" stroke-linecap="round" stroke-linejoin="round"/>`;
