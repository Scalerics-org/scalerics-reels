<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/epoca.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "Cinzel"; font-weight: 400 900; font-display: block; src: url("assets/fonts/Cinzel-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s15-scalerics"] .s15-capa, [data-composition-id="s15-scalerics"] .s15-escenario { position: absolute; inset: 0; }
    [data-composition-id="s15-scalerics"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s15-scalerics"] .s15-chip { position: absolute; left: 610px; height: 84px; padding: 0 28px; display: flex; align-items: center; gap: 16px; box-sizing: border-box;
      background: #fffaf0; border: 5px solid #3b2f3a; border-radius: 42px; box-shadow: 7px 7px 0 rgba(59, 47, 58, 0.16);
      font-family: "Lexend", sans-serif; font-weight: 800; font-size: 36px; color: #3b2f3a; white-space: nowrap; }
    [data-composition-id="s15-scalerics"] .s15-chip i { display: block; width: 22px; height: 22px; border-radius: 50%; background: #5ce611; border: 4px solid #3b2f3a; }
    [data-composition-id="s15-scalerics"] .s15-c1 { top: 640px; }
    [data-composition-id="s15-scalerics"] .s15-c2 { top: 760px; }
    [data-composition-id="s15-scalerics"] .s15-c3 { top: 880px; }
    [data-composition-id="s15-scalerics"] .s15-c4 { top: 1000px; }
    [data-composition-id="s15-scalerics"] .s15-c5 { top: 1120px; background: #5ce611; }
    [data-composition-id="s15-scalerics"] .s15-c5 i { background: #fffaf0; }
  </style>
  <div id="root" data-composition-id="s15-scalerics" data-width="1080" data-height="1920" data-duration="9.5">
    <div id="s15-escena" class="s15-capa clip" data-start="0" data-duration="9.5" data-track-index="0">
      <div class="s15-escenario">
        <svg class="s15-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="s15-chip s15-c1"><i></i>03:00 · abierta</div>
        <div class="s15-chip s15-c2"><i></i>DAC</div>
        <div class="s15-chip s15-c3"><i></i>Correo</div>
        <div class="s15-chip s15-c4"><i></i>PedidosYa</div>
        <div class="s15-chip s15-c5"><i></i>Mercado Pago</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s15-scalerics";
      const DUR = 9.5;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const E = EP;
      const W = 420, H = 740;
      const tienda = `
        <rect x="25" y="42" width="370" height="86" fill="${E.SCA}"/>
        <text x="210" y="82" text-anchor="middle" font-family="Cinzel" font-weight="900" font-size="30" fill="${E.TINTA}">CALZADOS ERNESTO</text>
        <text x="210" y="114" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="22" fill="${E.TINTA}">tienda online</text>
        <rect x="45" y="146" width="330" height="250" rx="14" fill="${E.ROSA}" opacity="0.5"/>
        ${E.bota(110, 370, 0.85)}
        <text x="45" y="440" font-family="Lexend" font-weight="700" font-size="28" fill="${E.TINTA}">Botas de cuero</text>
        <text x="45" y="488" font-family="Lexend" font-weight="900" font-size="40" fill="${E.TINTA}">$ 3.490</text>
        <rect x="45" y="512" width="330" height="72" rx="36" fill="${E.SCA}" stroke="${E.TINTA}" stroke-width="4"/>
        <text x="210" y="559" text-anchor="middle" font-family="Lexend" font-weight="800" font-size="30" fill="${E.TINTA}">COMPRAR</text>
        ${[0, 1, 2].map((i) => `<g class="s15-ped s15-ped${i}"><rect x="40" y="${606 + i * 0}" width="340" height="90" rx="18" fill="${E.TINTA}"/>
          <circle cx="78" cy="${651}" r="14" fill="${E.SCA}"/>
          <text x="104" y="${642}" font-family="Lexend" font-weight="800" font-size="25" fill="${E.BLA}">Nuevo pedido</text>
          <text x="104" y="${676}" font-family="IBM Plex Mono" font-weight="500" font-size="21" fill="${E.CREMA2}">${["Botas 38 · 23:41", "Botas 36 · 03:12", "Botas 40 · 07:55"][i]}</text></g>`).join("")}`;
      root.querySelector(".s15-svg").innerHTML = `<g class="s15-cel">${E.celular(130, 600, W, H, tienda)}</g>` +
        `<g class="s15-ern">${E.ernesto(905, 1440, 0.46, { brazo: "arriba" })}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = E.kit(tl, root);
      const { q, qa } = K;

      const SCALERICS = 0.52;
      const VENDE = 2.66;
      const HORA = 3.65;
      const DAC = 5.39;
      const CORREO = 6.04;
      const PEDIDOSYA = 6.69;
      const MERCADO = 8.17;

      tl.fromTo(q(".s15-cel"), { y: 160, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 0);
      tl.fromTo(q(".s15-cel"), { rotation: -4, svgOrigin: "340 970", smoothOrigin: false }, { rotation: 0, svgOrigin: "340 970", duration: 0.4, ease: "back.out(2)", immediateRender: false }, SCALERICS);
      // "vende sola": los pedidos entran solos, uno tras otro
      qa(".s15-ped").forEach((el, i) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, VENDE + i * 0.55);
        if (i < 2) tl.to(el, { opacity: 0, y: 30, duration: 0.2 }, VENDE + i * 0.55 + 0.45);
      });
      // "cualquier hora", envíos y pago: chips
      [[".s15-c1", HORA], [".s15-c2", DAC], [".s15-c3", CORREO], [".s15-c4", PEDIDOSYA], [".s15-c5", MERCADO]].forEach(([s, t]) => {
        gsap.set(q(s), { opacity: 0 });
        tl.fromTo(q(s), { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, t - 0.1);
      });
      // Ernesto chiquito festeja
      gsap.set(q(".s15-ern"), { opacity: 0 });
      tl.fromTo(q(".s15-ern"), { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, VENDE + 0.3);
      K.caraE(VENDE + 0.3, "sonrisa");
      tl.fromTo(q(".ep-e-brazo"), { rotation: -10, svgOrigin: "150 -190", smoothOrigin: false }, { rotation: 10, svgOrigin: "150 -190", duration: 0.3, yoyo: true, repeat: 15, ease: "sine.inOut", immediateRender: false }, VENDE + 0.5);
      K.caraE(MERCADO + 0.1, "grito");
      K.caraE(MERCADO + 0.5, "sonrisa");
      tl.fromTo(q(".s15-escenario"), { scale: 1 }, { scale: 1.04, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);

      K.salida(q("#s15-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
