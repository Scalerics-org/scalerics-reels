<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/epoca.js"></script>
  <style>
    @font-face { font-family: "Cinzel"; font-weight: 400 900; font-display: block; src: url("assets/fonts/Cinzel-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s05-jueves"] .s05-capa, [data-composition-id="s05-jueves"] .s05-escenario { position: absolute; inset: 0; }
    [data-composition-id="s05-jueves"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s05-jueves"] .s05-alm { position: absolute; left: 560px; top: 700px; width: 380px; height: 400px; }
    [data-composition-id="s05-jueves"] .s05-alm-top { position: absolute; left: 0; top: 0; width: 380px; height: 80px; background: #b3262e; border: 6px solid #3b2f3a; border-radius: 12px 12px 0 0; box-sizing: border-box; }
    [data-composition-id="s05-jueves"] .s05-alm-top i { position: absolute; top: -26px; width: 20px; height: 48px; border-radius: 10px; background: #c9a046; border: 4px solid #3b2f3a; }
    [data-composition-id="s05-jueves"] .s05-hoja { position: absolute; left: 0; top: 74px; width: 380px; height: 326px; background: #fffaf0; border: 6px solid #3b2f3a; border-top: 0; box-sizing: border-box; text-align: center; transform-origin: 50% 0%; }
    [data-composition-id="s05-jueves"] .s05-hoja b { display: block; margin-top: 40px; font-family: "Cinzel", serif; font-weight: 900; font-size: 150px; line-height: 1; color: #3b2f3a; }
    [data-composition-id="s05-jueves"] .s05-hoja small { display: block; margin-top: 22px; font-family: "Cinzel", serif; font-weight: 800; font-size: 44px; letter-spacing: 0.08em; color: #b3262e; }
    [data-composition-id="s05-jueves"] .s05-hora { left: 140px; top: 1220px; font-size: 30px; }
    [data-composition-id="s05-jueves"] .s05-lacrada { top: 600px; font-size: 96px; }
  </style>
  <div id="root" data-composition-id="s05-jueves" data-width="1080" data-height="1920" data-duration="6.22">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="6.22" data-track-index="0">
      <div class="s05-escenario">
        <div class="s05-fondo">
          <svg class="s05-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
          <div class="s05-alm">
            <div class="s05-hoja s05-h3" data-layout-ignore><b>26</b><small>JUEVES</small></div>
            <div class="s05-hoja s05-h2" data-layout-ignore><b>25</b><small>MIÉRCOLES</small></div>
            <div class="s05-hoja s05-h1"><b>24</b><small>MARTES</small></div>
            <div class="s05-alm-top"><i style="left:80px"></i><i style="left:280px"></i></div>
          </div>
          <div class="ep-rotulo s05-hora">23:00 · SIN RESPUESTA</div>
        </div>
        <div class="ep-titulo lacre s05-lacrada">¡LACRADA!</div>
        <svg class="s05-svg2" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-jueves";
      const DUR = 6.22;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const E = EP;
      // reloj de péndulo: caja dorada/salvia, esfera, agujas, péndulo
      const nums = Array.from({ length: 12 }, (_, i) => { const a = (i + 1) * 30 * Math.PI / 180; return `<circle cx="${300 + 82 * Math.sin(a)}" cy="${790 - 82 * Math.cos(a)}" r="${(i + 1) % 3 ? 5 : 9}" fill="${E.TINTA}"/>`; }).join("");
      root.querySelector(".s05-svg").innerHTML = `<g class="s05-reloj">
          <path d="M190 700 C190 640 240 610 300 610 C360 610 410 640 410 700 L410 1180 L190 1180 Z" fill="${E.SALVIA2}" stroke="${E.TINTA}" stroke-width="7" stroke-linejoin="round"/>
          <rect x="170" y="1180" width="260" height="40" rx="6" fill="${E.ORO}" stroke="${E.TINTA}" stroke-width="6"/>
          <circle cx="300" cy="790" r="112" fill="${E.ORO}" stroke="${E.TINTA}" stroke-width="7"/>
          <circle cx="300" cy="790" r="98" fill="${E.BLA}" stroke="${E.ORO2}" stroke-width="4"/>
          ${nums}
          <rect x="230" y="930" width="140" height="220" rx="70" fill="${E.CELESTE}" stroke="${E.TINTA}" stroke-width="6"/>
          <g class="s05-pend"><path d="M300 900 L300 1080" stroke="${E.ORO2}" stroke-width="7"/><circle cx="300" cy="1090" r="30" fill="${E.ORO}" stroke="${E.TINTA}" stroke-width="6"/></g>
          <path class="s05-hh" d="M300 790 L300 735" stroke="${E.TINTA}" stroke-width="12" stroke-linecap="round"/>
          <path class="s05-mm" d="M300 790 L300 712" stroke="${E.TINTA}" stroke-width="7" stroke-linecap="round"/>
          <circle cx="300" cy="790" r="12" fill="${E.LACRE}" stroke="${E.TINTA}" stroke-width="4"/>
        </g>`;
      root.querySelector(".s05-svg2").innerHTML = `<g class="s05-sobre">${E.sobre(260, 780, 560, 380, { texto: "Srta. Clara" })}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = E.kit(tl, root);
      const { q } = K;

      const MARTES = 0.99;
      const ONCE = 1.89;
      const RESPUESTA = 3.04;
      const JUEVES = 4.43;
      const LACRADA = 5.18;

      tl.fromTo(q(".s05-reloj"), { opacity: 0.6, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo(q(".s05-alm"), { opacity: 0.6, x: 40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0);
      // el péndulo va y viene todo el rato
      tl.fromTo(q(".s05-pend"), { rotation: -12, svgOrigin: "300 900", smoothOrigin: false }, { rotation: 12, svgOrigin: "300 900", duration: 0.5, yoyo: true, repeat: 11, ease: "sine.inOut" }, 0);
      // las agujas corren hasta las once
      gsap.set(q(".s05-hh"), { rotation: 240, svgOrigin: "300 790", smoothOrigin: false });
      gsap.set(q(".s05-mm"), { rotation: 0, svgOrigin: "300 790", smoothOrigin: false });
      tl.to(q(".s05-mm"), { rotation: 1080, svgOrigin: "300 790", duration: ONCE, ease: "power2.inOut" }, 0);
      tl.to(q(".s05-hh"), { rotation: 330, svgOrigin: "300 790", duration: ONCE, ease: "power2.inOut" }, 0);
      tl.fromTo(q(".s05-alm"), { rotation: 0 }, { rotation: -3, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, MARTES);
      K.pop(q(".s05-hora"), ONCE);
      // las hojas del almanaque vuelan: martes -> miércoles -> jueves
      tl.to(q(".s05-h1"), { rotationX: -100, y: -40, opacity: 0, duration: 0.35, ease: "power2.in" }, RESPUESTA);
      tl.to(q(".s05-h2"), { rotationX: -100, y: -40, opacity: 0, duration: 0.35, ease: "power2.in" }, JUEVES - 0.3);
      tl.fromTo(q(".s05-h3"), { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, JUEVES + 0.05);
      tl.to(q(".s05-mm"), { rotation: 1080 + 720, svgOrigin: "300 790", duration: JUEVES - RESPUESTA + 0.4, ease: "none" }, RESPUESTA);
      // "Lacrada": cae el sobre con el lacre, golpe
      gsap.set(q(".s05-sobre"), { opacity: 0 });
      tl.fromTo(q(".s05-sobre"), { opacity: 0, y: -700, rotation: -18, svgOrigin: "540 970", smoothOrigin: false }, { opacity: 1, y: 0, rotation: -4, svgOrigin: "540 970", duration: 0.3, ease: "power3.in", immediateRender: false }, LACRADA - 0.3);
      tl.to(q(".s05-fondo"), { opacity: 0.25, filter: "blur(4px)", duration: 0.2 }, LACRADA - 0.1);
      K.sacudon(q(".s05-escenario"), LACRADA);
      K.popS(q(".ep-sobre-lacre"), LACRADA + 0.05, "540 993", 0.3);
      gsap.set(q(".s05-lacrada"), { opacity: 0 });
      tl.fromTo(q(".s05-lacrada"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, LACRADA + 0.1);

      K.salida(q("#s05-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
