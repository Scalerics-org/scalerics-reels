<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/epoca.js"></script>
  <style>
    @font-face { font-family: "Cinzel"; font-weight: 400 900; font-display: block; src: url("assets/fonts/Cinzel-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s11-sabado"] .s11-capa, [data-composition-id="s11-sabado"] .s11-escenario { position: absolute; inset: 0; }
    [data-composition-id="s11-sabado"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s11-sabado"] .s11-rot { left: 0; right: 0; margin: 0 auto; width: max-content; top: 590px; font-size: 30px; }
  </style>
  <div id="root" data-composition-id="s11-sabado" data-width="1080" data-height="1920" data-duration="2.35">
    <div id="s11-escena" class="s11-capa clip" data-start="0" data-duration="2.35" data-track-index="0">
      <div class="s11-escenario">
        <svg class="s11-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="ep-rotulo rosa s11-rot">BAILE DEL SÁBADO</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s11-sabado";
      const DUR = 2.35;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const E = EP;
      const brillo = (x, y, r) => `<path d="M${x} ${y - r} L${x + r * 0.25} ${y - r * 0.25} L${x + r} ${y} L${x + r * 0.25} ${y + r * 0.25} L${x} ${y + r} L${x - r * 0.25} ${y + r * 0.25} L${x - r} ${y} L${x - r * 0.25} ${y - r * 0.25} Z" fill="${E.ORO3}" stroke="${E.ORO2}" stroke-width="3"/>`;
      root.querySelector(".s11-svg").innerHTML =
        `<g class="s11-ara">${E.arana(180, 540, 0.7, 60)}</g><g class="s11-ara2">${E.arana(900, 540, 0.7, 60)}</g>` +
        `<g class="s11-p">${E.pareja(560, 1300, 1.8, { falda: E.ROSA, color: E.TINTA })}</g>` +
        `<g class="s11-botas">${E.bota(380, 1350, 0.36)}${E.bota(460, 1350, 0.36)}</g>` +
        `<g class="s11-br">${brillo(360, 1250, 34)}${brillo(560, 1290, 26)}${brillo(300, 1340, 20)}${brillo(620, 1210, 18)}</g>` +
        `<g class="s11-p2">${E.pareja(130, 1380, 0.9, { falda: E.CELESTE })}</g><g class="s11-p3">${E.pareja(950, 1380, 0.9, { espejo: true, falda: E.SALVIA })}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = E.kit(tl, root);
      const { q, qa } = K;

      const ESTRENE = 0.27;
      const SABADO = 1.4;

      tl.fromTo(q(".s11-p"), { rotation: -6, svgOrigin: "540 1330", smoothOrigin: false }, { rotation: 6, svgOrigin: "540 1330", duration: 0.45, yoyo: true, repeat: 4, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s11-botas"), { rotation: -6, svgOrigin: "540 1330", smoothOrigin: false }, { rotation: 6, svgOrigin: "540 1330", duration: 0.45, yoyo: true, repeat: 4, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s11-p2"), { x: -20 }, { x: 20, duration: 0.45, yoyo: true, repeat: 4, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s11-p3"), { x: 20 }, { x: -20, duration: 0.45, yoyo: true, repeat: 4, ease: "sine.inOut" }, 0);
      tl.fromTo([q(".s11-ara"), q(".s11-ara2")], { y: -60 }, { y: 0, duration: 0.4, ease: "back.out(1.6)" }, 0);
      // "estrené": las botas brillan
      qa(".s11-br path").forEach((el, i) => {
        const bb = [[360, 1250], [560, 1290], [300, 1340], [620, 1210]][i];
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.2, svgOrigin: bb.join(" "), smoothOrigin: false }, { opacity: 1, scale: 1, svgOrigin: bb.join(" "), duration: 0.25, ease: "back.out(3)", immediateRender: false }, ESTRENE + i * 0.12);
        tl.to(el, { rotation: 90, svgOrigin: bb.join(" "), duration: 0.8, ease: "none" }, ESTRENE + i * 0.12 + 0.25);
      });
      K.pop(q(".s11-rot"), SABADO - 0.1);

      K.salida(q("#s11-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
