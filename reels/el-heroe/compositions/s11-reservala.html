    (function () {

      const ESC = ".s11-escenario";

      const entra = (sel, t, desde = { x: -600 }, d = 0.3) => {

        tl.fromTo(qa(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, rotation: 0, duration: d, ease: "back.out(1.4)", immediateRender: false }, t);
