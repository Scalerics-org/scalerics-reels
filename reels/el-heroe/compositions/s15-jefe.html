    (function () {
      const ID = "s15-jefe";
      const DUR = 7.17;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = ".s15-escenario";
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(ESC), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

        gsap.set(qa(sel), { opacity: 0 });

      const pop = (sel, t, extra = {}) => {
        gsap.set(qa(sel), { opacity: 0 });
        tl.fromTo(qa(sel), { opacity: 0, scale: 0.6, ...extra }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false, ...extra }, t);

      const entra = (sel, t, desde = { x: -600 }, d = 0.3) => {
        gsap.set(qa(sel), { opacity: 0 });
        tl.fromTo(qa(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, rotation: 0, duration: d, ease: "back.out(1.4)", immediateRender: false }, t);

      const sale = (sel, t, a = { opacity: 0, scale: 0.8 }, d = 0.2) => tl.to(qa(sel), { ...a, duration: d, ease: "power2.in" }, t);
      const dibujar = (sel, t, d = 0.5) => qa(sel).forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // vaivén suave de t a t+d
      const respira = (sel, t, d, dy = 8, per = 0.5) => tl.fromTo(qa(sel), { y: 0 }, { y: dy, duration: per, yoyo: true, repeat: Math.max(1, Math.round(d / per) | 1), ease: "sine.inOut", immediateRender: false }, t);
      const habla = (sel, t, d, origin) => tl.fromTo(qa(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.2, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);

      // zoom lento de cámara sobre la viñeta
      const camara = (sel, t, d, desde, hasta, origen = "50% 50%") => tl.fromTo(qa(sel), { scale: desde, transformOrigin: origen }, { scale: hasta, transformOrigin: origen, duration: d, ease: "none", immediateRender: false }, t);

      const YO = 0.0, VOS = 1.80, MEJORES = 2.67, LO = 4.42, SOLO = 6.15;
      gsap.set(q(".s15-feliz"), { opacity: 0 });
      entra(".s15-due", 0, { x: -300 }, 0.3);
      gsap.set(q(".s15-g"), { opacity: 0 });
      tl.fromTo(q(".s15-g"), { opacity: 0, scale: 0.4, transformOrigin: "15% 100%" }, { opacity: 1, scale: 1, transformOrigin: "15% 100%", duration: 0.25, ease: "back.out(2)", immediateRender: false }, 0.1);
      habla(".s15t-boca", 0.05, 1.0, "181 306");
      tl.to(q(".s15-due"), { rotation: -3, svgOrigin: "330 1560", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.3);
      // entra el agente: vos hacés las mejores tortas
      tl.to(q(".s15-g"), { opacity: 0, scale: 0.8, duration: 0.15 }, VOS - 0.2);
      entra(".s15-ag", VOS - 0.15, { x: 400 }, 0.35);
      habla(".s15-boca", VOS, 4.4, "130 255");
      entra(".s15-torta", MEJORES - 0.3, { y: 400 }, 0.35);
      tl.to(q(".s15-torta"), { y: 400, opacity: 0, duration: 0.3, ease: "power2.in" }, LO - 0.1);
      tl.to(q(".s15-mej"), { opacity: 0, duration: 0.2 }, LO - 0.1);
      golpe(".s15-mej", MEJORES, 2.0, { rotation: 10 });
      tl.to(q(".s15-triste"), { opacity: 0, duration: 0.05 }, MEJORES + 0.2);
      tl.to(q(".s15-feliz"), { opacity: 1, duration: 0.05 }, MEJORES + 0.2);
      tl.fromTo(q(".s15-due"), { y: 0 }, { y: -30, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, MEJORES + 0.2);
      // lo que no podías era con todo solo: se juntan
      tl.to(q(".s15-ag"), { x: -120, duration: 0.4, ease: "back.out(1.4)" }, LO);
      tl.to(q(".s15-due"), { x: 40, duration: 0.4, ease: "back.out(1.4)" }, LO);
      tl.to(q(".s15-rayos"), { opacity: 0.5, duration: 0.3 }, LO);
      tl.fromTo(q(".s15-rayos"), { rotation: 0, svgOrigin: "380 1100" }, { rotation: 12, svgOrigin: "380 1100", duration: 2.7, ease: "none", immediateRender: false }, LO);
      golpe(".s15-equipo", SOLO - 0.2, 2.2);
      sacudon(SOLO - 0.15, 1.0);

      tl.to(q("#s15-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
