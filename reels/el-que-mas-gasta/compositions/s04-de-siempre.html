  <script>
    (function () {
      const ID = "s04-de-siempre";
      const DUR = 6.14;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const SUELO = 1120;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && desde < 1 && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, svgOrigin) => {
        const o = svgOrigin ? { svgOrigin } : { transformOrigin: "50% 50%" };
        tl.fromTo(el, { opacity: 0, scale: 0.85, ...o }, { opacity: 1, scale: 1, ...o, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const etq = (n, t, fuera) => {
        if (fuera !== undefined) tl.to(q(".s04-e" + fuera), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s04-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      const caminar = (g, t0, n) => {
        const p = g.querySelector("path");
        tl.fromTo(p, { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
      };

      const VISTA = 0.45, DECIS = 1.25, SIEMPRE = 2.25, PERO = 3.29, CUANTO = 3.85, COMPRO = 4.55, ANO = 5.05;
      gsap.set(q(".s04-cli"), { x: 330, y: SUELO });
      gsap.set(q(".s04-cli-in"), { scale: 1.8, svgOrigin: "0 0" });
      dibujar(qa(".s04-d"), 0, 0.6, 0.45);
      tl.fromTo(q(".s04-cli"), { opacity: 0.3 }, { opacity: 1, duration: 0.3 }, 0);

      // "de vista": el ojo se abre y mira al cliente
      dibujar(qa(".s04-ojo-l"), 0.1, 0.4);
      tl.fromTo(q(".s04-pupila"), { opacity: 0, scale: 0.4, svgOrigin: "540 690" }, { opacity: 1, scale: 1, svgOrigin: "540 690", duration: 0.25, ease: "back.out(2)" }, VISTA);

      etq(1, VISTA);

      // "¿lo de siempre?": burbuja desde el mostrador, y la tacita
      tl.to(q(".s04-ojo"), { opacity: 0, y: -10, duration: 0.25 }, DECIS - 0.15);
      pop(q(".s04-burbuja"), DECIS, "600 924");
      pop(q(".s04-taza"), SIEMPRE, "670 988");
      tl.to(q(".s04-cli-in"), { y: -10, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, SIEMPRE + 0.2);

      // "pero no sabés cuánto te compró este año"
      tl.to(q(".s04-f1"), { opacity: 0, x: -40, filter: "blur(4px)", duration: 0.3, ease: "power2.in" }, PERO - 0.1);
      dibujar(qa(".s04-df"), PERO + 0.15, 0.5);
      tl.fromTo(qa(".s04-ft"), { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.1 }, PERO + 0.35);
      pop(q(".s04-peso"), CUANTO - 0.15, "370 930");
      const QT = [CUANTO, COMPRO - 0.15, ANO];
      qa(".s04-q").forEach((t, i) => tl.fromTo(t, { opacity: 0, y: -70 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, QT[i]));
      tl.to(q(".s04-q:last-of-type"), { rotation: 10, svgOrigin: "660 930", duration: 0.2, yoyo: true, repeat: 1 }, ANO + 0.45);
      etq(2, CUANTO, 1);


      // salida
