  <div id="root" data-composition-id="s11-el-mejor" data-width="1080" data-height="1920" data-duration="3.26">

      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s11-cli"><g class="s11-cli-in">
            <circle class="ln" cx="0" cy="-96" r="14" />
            <path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" />

  </div>
  <script>
    (function () {
      const ID = "s11-el-mejor";
      const DUR = 3.26;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const SUELO = 1120;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && desde < 1 && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, svgOrigin) => {
        const o = svgOrigin ? { svgOrigin } : { transformOrigin: "50% 50%" };
        tl.fromTo(el, { opacity: 0, scale: 0.85, ...o }, { opacity: 1, scale: 1, ...o, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const etq = (n, t, fuera) => {
        if (fuera !== undefined) tl.to(q(".s11-e" + fuera), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s11-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      const caminar = (g, t0, n) => {
        const p = g.querySelector("path");
        tl.fromTo(p, { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
      };

      const TU = 0.7, MEJOR = 0.8, CLIENTE = 1.1, ENTERE = 1.7, MEJOR2 = 2.5;
      gsap.set(q(".s11-cli"), { x: 520, y: 1150 });
      gsap.set(q(".s11-cli-in"), { scale: 2.3, svgOrigin: "0 0" });
      // el cliente arranca medio dibujado
      dibujar(qa(".s11-cli-in .ln"), 0, 0.6, 0.45);
      tl.to(q(".s11-cli-in"), { y: -6, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, CLIENTE);
      // "se entere": le llega el mensaje
      pop(q(".s11-notif"), ENTERE - 0.15, "540 790");
      etq(1, ENTERE - 0.1);
      // "es el mejor": la estrella verde en el pecho, con rayitas
      tl.fromTo(q(".s11-estrella"), { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.5, duration: 0.45, ease: "back.out(3)" }, MEJOR2 - 0.1);
      qa(".s11-rayo").forEach((r) => {
        tl.fromTo(r, { opacity: 0, scale: 0.6, svgOrigin: "0 0" }, { opacity: 1, scale: 1.15, svgOrigin: "0 0", duration: 0.3, ease: "power3.out" }, MEJOR2);
        tl.to(r, { opacity: 0, duration: 0.25 }, MEJOR2 + 0.4);
      });
      tl.to(q(".s11-cli-in"), { y: -16, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, MEJOR2 + 0.05);



      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
