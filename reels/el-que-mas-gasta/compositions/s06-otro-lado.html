  <script>
    (function () {
      const ID = "s06-otro-lado";
      const DUR = 4.22;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const SUELO = 1120;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && desde < 1 && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, svgOrigin) => {
        const o = svgOrigin ? { svgOrigin } : { transformOrigin: "50% 50%" };
        tl.fromTo(el, { opacity: 0, scale: 0.85, ...o }, { opacity: 1, scale: 1, ...o, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const etq = (n, t, fuera) => {
        if (fuera !== undefined) tl.to(q(".s06-e" + fuera), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s06-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      const caminar = (g, t0, n) => {
        const p = g.querySelector("path");
        tl.fromTo(p, { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
      };

      const NUNCA = 0.18, NADA = 0.98, DISTINTO = 1.28, UNDIA = 2.18, PRUEBA = 2.85, OTRO = 3.18, LADO = 3.28;
      gsap.set(q(".s06-tuyo"), { x: 220, y: SUELO });
      gsap.set(q(".s06-tuyo-in"), { scale: 0.75, svgOrigin: "0 0" });
      gsap.set(q(".s06-otro"), { x: 860, y: SUELO });
      gsap.set(q(".s06-otro-in"), { scale: 0.75, svgOrigin: "0 0" });
      gsap.set(q(".s06-cli"), { x: 420, y: SUELO });
      gsap.set(q(".s06-cli-in"), { scale: 1.6, svgOrigin: "0 0" });
      tl.fromTo(q(".s06-suelo"), { scaleX: 0.6, svgOrigin: "540 1120" }, { scaleX: 1, svgOrigin: "540 1120", duration: 0.6, ease: "power3.out" }, 0);
      // tu local, apagado, arranca medio dibujado; el cliente al lado
      dibujar(qa(".s06-da"), 0, 0.5, 0.45);
      gsap.set(qa(".s06-da-luz"), { opacity: 0 });
      tl.fromTo(q(".s06-tuyo-in"), { opacity: 1 }, { opacity: 0.45, duration: 0.4 }, 0.3);
      tl.fromTo(q(".s06-cli"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.05);

      // "nunca recibe nada distinto": un regalo vacío, punteado, con badge
      gsap.set(q(".s06-regalo"), { x: 600, y: 820 });
      pop(q(".s06-regalo"), NUNCA + 0.2, "600 820");
      gsap.set(q(".s06-badge"), { x: 676, y: 760, opacity: 0 });
      tl.set(q(".s06-badge"), { opacity: 1 }, NADA);
      tl.fromTo(q(".s06-badge-in"), { scale: 0.3, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, NADA);
      tl.to(q(".s06-regalo"), { x: "+=8", duration: 0.06, yoyo: true, repeat: 3 }, DISTINTO);
      etq(1, NADA);

      // "un día": el calendario pasa de hoja
      tl.to(qa(".s06-regalo, .s06-badge"), { opacity: 0, duration: 0.2 }, UNDIA - 0.2);
      gsap.set(q(".s06-cal"), { x: 600, y: 810 });
      pop(q(".s06-cal"), UNDIA - 0.1, "600 810");
      tl.fromTo(q(".s06-hoja"), { scaleY: 1, svgOrigin: "0 -22" }, { scaleY: 0, svgOrigin: "0 -22", duration: 0.15, ease: "power2.in", yoyo: true, repeat: 1 }, UNDIA + 0.15);

      // "prueba en otro lado": aparece otro local, prendido, y el cliente camina hacia allá
      dibujar(qa(".s06-db"), PRUEBA - 0.45, 0.45);
      tl.fromTo(q(".s06-db-t"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, PRUEBA - 0.1);
      tl.fromTo(qa(".s06-db-luz"), { opacity: 0 }, { opacity: 0.85, duration: 0.2 }, OTRO);
      tl.to(q(".s06-cal"), { opacity: 0, duration: 0.2 }, PRUEBA - 0.1);
      tl.to(q(".s06-cli"), { x: 700, duration: 1.0, ease: "power1.inOut" }, PRUEBA);
      caminar(q(".s06-cli"), PRUEBA, 5);
      etq(2, PRUEBA, 1);


      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
