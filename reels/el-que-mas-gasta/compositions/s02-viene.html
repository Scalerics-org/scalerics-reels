        <g class="s02-tk s02-tk2"><rect class="ln" x="-90" y="-34" width="180" height="68" rx="12" /><text class="mono" x="0" y="9" text-anchor="middle">GRACIAS</text></g>

  <script>
    (function () {
      const ID = "s02-viene";
      const DUR = 5.36;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const SUELO = 1120;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && desde < 1 && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, svgOrigin) => {
        const o = svgOrigin ? { svgOrigin } : { transformOrigin: "50% 50%" };
        tl.fromTo(el, { opacity: 0, scale: 0.85, ...o }, { opacity: 1, scale: 1, ...o, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const etq = (n, t, fuera) => {
        if (fuera !== undefined) tl.to(q(".s02-e" + fuera), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s02-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      const caminar = (g, t0, n) => {
        const p = g.querySelector("path");
        tl.fromTo(p, { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
      };

      const TODAS = 0.26, SEMANAS = 1.07, DEJA = 1.47, NADIE = 2.06, RECIBE = 2.86, MISMO = 3.36, VEZ = 4.36, VOLVIO = 4.87;
      gsap.set(q(".s02-cli"), { x: 320, y: SUELO });
      gsap.set(q(".s02-cli-in"), { scale: 1.6, svgOrigin: "0 0" });
      gsap.set(q(".s02-otro"), { x: 760, y: SUELO, opacity: 0 });
      gsap.set(q(".s02-otro-in"), { scale: 1.6, svgOrigin: "0 0" });
      tl.fromTo(q(".s02-suelo"), { scaleX: 0.6, svgOrigin: "540 1120" }, { scaleX: 1, svgOrigin: "540 1120", duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(q(".s02-cli"), { opacity: 0, x: 280 }, { opacity: 1, x: 320, duration: 0.35, ease: "power3.out" }, 0);
      caminar(q(".s02-cli"), 0, 1);

      // "todas las semanas": cuatro semanas que se tildan
      qa(".s02-dia").forEach((d, i) => pop(d, 0.05 + i * 0.08, (350 + i * 130) + " 670"));
      qa(".s02-tick").forEach((t, i) => dibujar([t], TODAS + i * 0.24, 0.25));
      etq(1, TODAS);

      // "deja más que nadie": su barra crece alta y verde, las otras bajitas
      qa(".s02-barra").forEach((b, i) => {
        const cx = [472, 592, 712, 832][i];
        tl.fromTo(b, { scaleY: 0, svgOrigin: cx + " 1120" }, { scaleY: 1, svgOrigin: cx + " 1120", duration: i === 0 ? 0.7 : 0.35, ease: i === 0 ? "back.out(1.4)" : "power2.out" }, (i === 0 ? DEJA : NADIE - 0.2 + i * 0.06));
      });
      tl.to(q(".s02-b0"), { scaleY: 1.06, svgOrigin: "472 1120", duration: 0.12, yoyo: true, repeat: 1 }, NADIE + 0.1);

      // "recibe lo mismo": se va todo, aparece el que vino una vez, los dos reciben lo mismo
      tl.to(qa(".s02-dia, .s02-barra"), { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" }, RECIBE - 0.25);
      tl.to(q(".s02-cli"), { x: 360, duration: 0.4, ease: "power2.inOut" }, RECIBE - 0.2);
      tl.fromTo(q(".s02-otro"), { opacity: 0, x: 820 }, { opacity: 1, x: 760, duration: 0.4, ease: "power3.out" }, RECIBE - 0.2);
      caminar(q(".s02-otro"), RECIBE - 0.2, 1);
      gsap.set(q(".s02-tk1"), { x: 360, y: 860 });
      gsap.set(q(".s02-tk2"), { x: 760, y: 860 });
      tl.fromTo(qa(".s02-tk"), { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", stagger: 0.12 }, RECIBE);
      dibujar([q(".s02-igual")], MISMO, 0.3);
      etq(2, RECIBE, 1);

      // "una vez y no volvió": el de la derecha se va
      tl.to(q(".s02-tk2"), { opacity: 0.35, duration: 0.3 }, VEZ);
      tl.to(q(".s02-otro"), { x: 1000, duration: 0.6, ease: "power1.in" }, VOLVIO - 0.2);
      tl.to(q(".s02-otro"), { opacity: 0, duration: 0.3 }, VOLVIO + 0.1);
      caminar(q(".s02-otro"), VOLVIO - 0.2, 3);


      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
