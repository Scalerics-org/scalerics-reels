  <script>
    (function () {
      const ID = "s08-puntos";
      const DUR = 5.75;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const SUELO = 1120;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && desde < 1 && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, svgOrigin) => {
        const o = svgOrigin ? { svgOrigin } : { transformOrigin: "50% 50%" };
        tl.fromTo(el, { opacity: 0, scale: 0.85, ...o }, { opacity: 1, scale: 1, ...o, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const etq = (n, t, fuera) => {
        if (fuera !== undefined) tl.to(q(".s08-e" + fuera), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s08-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };
      const caminar = (g, t0, n) => {
        const p = g.querySelector("path");
        tl.fromTo(p, { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
      };

      const SCALERICS = 0.87, PUNTOS = 1.91, CADA = 2.83, SUMA = 3.37, VIENE = 4.37, MAS = 4.77, SUMA2 = 4.97;
      // la caja de marca arranca medio dibujada
      dibujar(qa(".s08-dc"), 0, 0.7, 0.5);
      tl.fromTo(q(".s08-nom"), { opacity: 0, filter: "blur(8px)", y: 10 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.45, ease: "power3.out" }, SCALERICS - 0.1);
      tl.fromTo(q(".s08-pts"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, PUNTOS);
      tl.to(q(".s08-marca"), { scale: 1.04, svgOrigin: "540 865", duration: 0.14, yoyo: true, repeat: 1 }, PUNTOS);

      // "cada compra suma": la marca sube, aparecen dos clientes con sus monedas
      tl.to(q(".s08-marca"), { y: -200, scale: 0.7, svgOrigin: "540 865", duration: 0.45, ease: "power3.inOut" }, CADA - 0.2);
      tl.fromTo(q(".s08-suelo"), { opacity: 0, scaleX: 0.6, svgOrigin: "540 1120" }, { opacity: 1, scaleX: 1, svgOrigin: "540 1120", duration: 0.4, ease: "power3.out" }, CADA - 0.1);
      gsap.set(q(".s08-c1"), { x: 330, y: SUELO }); gsap.set(q(".s08-c1-in"), { scale: 1.4, svgOrigin: "0 0" });
      gsap.set(q(".s08-c2"), { x: 710, y: SUELO }); gsap.set(q(".s08-c2-in"), { scale: 1.4, svgOrigin: "0 0" });
      tl.fromTo(qa(".s08-c1, .s08-c2"), { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.08 }, CADA);
      const MA = qa(".s08-ma");
      gsap.set(MA, { opacity: 0 });
      gsap.set(q(".s08-mb"), { opacity: 0 });
      // "suma": +10 cae en cada pila
      qa(".s08-mas").forEach((m, i) => {
        tl.fromTo(m, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, SUMA - 0.1 + i * 0.1);
        tl.to(m, { opacity: 0, y: 60, duration: 0.25, ease: "power2.in" }, SUMA + 0.3 + i * 0.1);
      });
      tl.fromTo(MA[0], { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.25, ease: "bounce.out" }, SUMA + 0.45);
      tl.fromTo(q(".s08-mb"), { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.25, ease: "bounce.out" }, SUMA + 0.55);
      etq(1, CADA);
      // "el que más viene": salta el de la bolsa; "más suma": su pila crece
      tl.to(q(".s08-c1-in"), { y: -14, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, VIENE);
      MA.slice(1).forEach((m, i) => tl.fromTo(m, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, MAS + i * 0.1));
      tl.to(q(".s08-c2-in"), { opacity: 0.45, duration: 0.4 }, SUMA2);
      etq(2, MAS, 1);


      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
