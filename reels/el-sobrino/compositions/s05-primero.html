  <script>
    (function () {
      const ID = "s05-primero";
      const DUR = 7.08;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const badge = (el, t) => {
        tl.fromTo(el.firstElementChild, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const etiqueta = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, y: -10, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      const CLIENTE = 0.74, CONOCE = 1.04, LOCAL = 1.74, ANTES = 2.25, Y = 3.14, PRIMERO = 3.64, NO = 4.54, VIDRIERA = 5.29, PAGINA = 5.84;
      // A: el cliente con su celular, el local lejos
      dibujar(qa(".s05-dc"), 0, 0.5, 0.4);
      dibujar(qa(".s05-dl"), 0, 0.5, 0.4);
      gsap.set(q(".s05-loc"), { opacity: 0.45 });
      gsap.set(qa(".s05-dl-luz"), { opacity: 0 });
      tl.fromTo(q(".s05-suelo"), { scaleX: 0.6, svgOrigin: "540 1130" }, { scaleX: 1, svgOrigin: "540 1130", duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(q(".s05-cli"), { scale: 1 }, { scale: 1.08, svgOrigin: "0 0", duration: 0.14, yoyo: true, repeat: 1 }, CLIENTE);
      // "conoce": ondas y el globo con tu local
      qa(".s05-onda").forEach((o, i) => dibujar([o], CONOCE + i * 0.1, 0.3));
      tl.to(qa(".s05-onda"), { opacity: 0.3, duration: 0.3 }, CONOCE + 0.6);
      tl.fromTo(q(".s05-globo"), { opacity: 0, scale: 0.6, svgOrigin: "320 880" }, { opacity: 1, scale: 1, svgOrigin: "320 880", duration: 0.4, ease: "back.out(1.8)" }, CONOCE + 0.1);
      tl.fromTo(q(".s05-globo g"), { scale: 0.5 }, { scale: 0.56, svgOrigin: "0 -100", duration: 0.14, yoyo: true, repeat: 1 }, LOCAL);
      // "antes de pisarlo": los pasos aparecen pero el cliente no se mueve
      tl.fromTo(qa(".s05-paso"), { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 0.8, scale: 1, transformOrigin: "50% 50%", duration: 0.2, stagger: 0.08, ease: "back.out(2)" }, ANTES - 0.1);
      tl.to(qa(".s05-paso"), { opacity: 0.25, duration: 0.3 }, ANTES + 0.6);
      etiqueta(q(".s05-e1"), ANTES);
      tl.to(q(".s05-a"), { opacity: 0, y: 20, duration: 0.3, ease: "power2.in" }, Y - 0.15);
      // B: el ojo, la vidriera y la página
      dibujar(qa(".s05-ojo-l"), PRIMERO - 0.3, 0.4);
      tl.fromTo(q(".s05-pupila"), { opacity: 0, scale: 0.3, svgOrigin: "540 690" }, { opacity: 1, scale: 1, svgOrigin: "540 690", duration: 0.25, ease: "back.out(2)" }, PRIMERO);
      tl.fromTo(q(".s05-uno"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "back.out(2)" }, PRIMERO + 0.1);
      dibujar(qa(".s05-dv"), Y + 0.05, 0.5);
      tl.fromTo(q(".s05-dv-txt"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, Y + 0.4);
      gsap.set(qa(".s05-dv-luz"), { opacity: 0 });
      tl.to(qa(".s05-dv-luz"), { opacity: 0.8, duration: 0.2 }, Y + 0.5);
      dibujar(qa(".s05-dt"), Y + 0.15, 0.5);
      gsap.set(q(".s05-aro"), { opacity: 0 });
      ["f0", "f1", "f2", "f3", "f4"].forEach((f, i) => tl.fromTo(q(".s05-" + f), { opacity: 0 }, { opacity: 1, duration: 0.25 }, Y + 0.4 + i * 0.08));
      etiqueta(q(".s05-e2"), PRIMERO, q(".s05-e1"));
      // "no es tu vidriera": el ojo la mira y se tacha
      tl.to(q(".s05-pupila"), { x: -18, y: 6, duration: 0.25, ease: "power2.inOut" }, NO);
      badge(q(".s05-x"), VIDRIERA);
      tl.to(q(".s05-vid"), { opacity: 0.35, duration: 0.3 }, VIDRIERA + 0.1);
      // "es tu página": mira al celular, que se agranda con aro verde
      tl.to(q(".s05-pupila"), { x: 18, y: 8, duration: 0.25, ease: "power2.inOut" }, PAGINA - 0.15);
      tl.fromTo(q(".s05-tel"), { scale: 1 }, { scale: 1.15, svgOrigin: "0 0", duration: 0.35, ease: "back.out(2)" }, PAGINA);
      dibujar([q(".s05-aro")], PAGINA + 0.05, 0.4);
      tl.to(q(".s05-uno"), { x: 30, y: 30, duration: 0.3, ease: "power2.out" }, PAGINA);

      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
