      const DUR = 3.22;

      const badge = (el, t) => {
        tl.fromTo(el.firstElementChild, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);

      gsap.set(qa(".s02-dl-luz"), { opacity: 0 });
      // "cartel"
      dibujar([q(".s02-cartel-ac")], CARTEL - 0.1, 0.4);
      tl.fromTo(q(".s02-g"), { scale: 1 }, { scale: 1.03, svgOrigin: "0 -265", duration: 0.12, yoyo: true, repeat: 1 }, CARTEL);

      etiqueta(q(".s02-e1"), CARTEL);
