    (function () {
      const ID = "s01-sobrino";

      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {

          if (t <= 0.001) gsap.set(el, { opacity: 1 });

        });

      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);

      const badge = (el, t) => {
        tl.fromTo(el.firstElementChild, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);

      const etiqueta = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, y: -10, duration: 0.2 }, t - 0.15);
