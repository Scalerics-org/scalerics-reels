    (function () {
      const ID = "ambiente";
      const DUR = 73.79;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // TIEMPOS (segundos globales, de la locución)
      const COPIAR = 7.87, CRITICA = 22.78, VELOCIDAD = 30.16, FAMILIA = 37.03, AUTOMATIZAR = 52.47, SCALERICS = 54.65, DUERME = 65.13, FAMILIA2 = 66.63;

      // ---- reloj: minutos desde las 00:00 (23:00 = 1380); pasa de medianoche
      const hora = q(".amb-hora");
      const reloj = { m: 1380 };
      const pinta = () => { const m = Math.round(reloj.m) % 1440; hora.textContent = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
      tl.to(reloj, { m: 1404, duration: VELOCIDAD - 0.5, ease: "none", onUpdate: pinta }, 0);
      tl.to(reloj, { m: 1710, duration: 5.6, ease: "power1.in", onUpdate: pinta }, VELOCIDAD);
      tl.to(reloj, { m: 1785, duration: AUTOMATIZAR - VELOCIDAD - 5.7, ease: "none", onUpdate: pinta }, VELOCIDAD + 5.6);
      // el código de trucos rebobina el reloj a las 21:30
      tl.to(reloj, { m: 1290, duration: 0.6, ease: "power3.inOut", onUpdate: pinta }, AUTOMATIZAR);
      tl.to(reloj, { m: 1320, duration: DUERME - AUTOMATIZAR - 0.6, ease: "none", onUpdate: pinta }, AUTOMATIZAR + 0.6);
      tl.to(reloj, { m: 1335, duration: DUR - DUERME, ease: "none", onUpdate: pinta }, DUERME);
      pinta();

      // ---- velocidades: 1 hasta "velocidad tres", 3 hasta los trucos, 1 después
      gsap.set(q(".amb-v1 .amb-on"), { opacity: 1 });
      tl.to(q(".amb-v1 .amb-on"), { opacity: 0, duration: 0.1 }, VELOCIDAD - 0.05);
      tl.to(q(".amb-v3 .amb-on"), { opacity: 1, duration: 0.1 }, VELOCIDAD - 0.05);
      tl.fromTo(q(".amb-v3"), { scale: 1 }, { scale: 1.35, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, VELOCIDAD - 0.05);
      tl.to(q(".amb-v3 .amb-on"), { opacity: 0.5, duration: 0.25, yoyo: true, repeat: 41, ease: "steps(1)" }, VELOCIDAD + 0.4);
      tl.to(q(".amb-v3 .amb-on"), { opacity: 0, duration: 0.1 }, AUTOMATIZAR);
      tl.to(q(".amb-v1 .amb-on"), { opacity: 1, duration: 0.1 }, AUTOMATIZAR);

      // ---- barras: sueño, diversión, familia, paciencia
      const nec = qa(".amb-nec");
      const verde = nec.map((n) => n.querySelector(".amb-fill:not(.amb-fill-r)"));
      const roja = nec.map((n) => n.querySelector(".amb-fill-r"));
      const ini = [0.72, 0.66, 0.86, 0.7];
      ini.forEach((v, i) => gsap.set([verde[i], roja[i]], { scaleX: v }));
      const barra = (i, v, t, d = 1) => {
        tl.to([verde[i], roja[i]], { scaleX: v, duration: d, ease: "power2.inOut" }, t);
        tl.to(roja[i], { opacity: v < 0.26 ? 1 : 0, duration: 0.25 }, t + d * 0.5);
      };
      const titila = (i, t, n = 5) => tl.to(nec[i], { opacity: 0.35, duration: 0.12, yoyo: true, repeat: n, ease: "steps(1)" }, t);
      // copiar y pegar
      barra(0, 0.45, COPIAR + 1, 7); barra(1, 0.3, COPIAR + 1, 7); barra(3, 0.48, COPIAR + 2, 6);
      barra(0, 0.32, 17, 4); barra(3, 0.24, 17.5, 3.5); barra(2, 0.72, 17, 4);
      // necesidad crítica: sueño
      barra(0, 0.06, CRITICA - 0.1, 0.35); titila(0, CRITICA + 0.2, 9);
      // velocidad tres: todo se vacía
      barra(1, 0.05, VELOCIDAD + 0.2, 2.5); barra(3, 0.08, VELOCIDAD + 0.4, 2.5); barra(2, 0.36, VELOCIDAD + 0.4, 3);
      // la familia se fue
      barra(2, 0, FAMILIA, 0.5); titila(2, FAMILIA + 0.3, 9);
      // Scalerics: se recuperan; Hugo duerme y cena con la familia
      barra(1, 0.55, SCALERICS + 2, 8); barra(3, 0.75, SCALERICS + 2, 8);
      barra(0, 1, DUERME - 0.1, 0.9); barra(2, 1, FAMILIA2 - 0.3, 0.9); barra(1, 1, FAMILIA2, 0.9); barra(3, 1, FAMILIA2 + 0.2, 0.9);

      // ---- diamante del panel, alarma y trucos
      tl.to(q(".amb-diam-r"), { opacity: 1, duration: 0.15 }, CRITICA - 0.1);
      tl.to(q(".amb-diam-r"), { opacity: 0, duration: 0.3 }, DUERME);
      tl.fromTo(q(".amb-diam"), { rotation: 0 }, { rotation: 360, duration: 6, ease: "none", repeat: Math.floor(DUR / 6), transformOrigin: "50% 50%" }, 0);
      [CRITICA, FAMILIA].forEach((t) => tl.to(q(".amb-alarma"), { opacity: 1, duration: 0.18, yoyo: true, repeat: 5, ease: "steps(1)" }, t - 0.05));
      tl.to(q(".amb-truco"), { opacity: 1, duration: 0.2 }, AUTOMATIZAR - 0.05);
      tl.to(q(".amb-truco"), { opacity: 0, duration: 1.4, ease: "power2.out" }, AUTOMATIZAR + 0.3);
      tl.to(q(".amb-modo"), { opacity: 0, duration: 0.2 }, AUTOMATIZAR);
      tl.fromTo(q(".amb-modo-f"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, AUTOMATIZAR);
      tl.to(q(".amb-punto"), { opacity: 0.2, duration: 0.5, yoyo: true, repeat: Math.floor(DUR / 0.5) - 1, ease: "steps(1)" }, 0);
      tl.fromTo(q(".amb-grilla"), { y: 0 }, { y: -92, duration: 8, ease: "none", repeat: Math.floor(DUR / 8) }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
