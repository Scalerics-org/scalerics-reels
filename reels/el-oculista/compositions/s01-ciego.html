<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/consultorio.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-ciego"] .s01-capa, [data-composition-id="s01-ciego"] .s01-escenario { position: absolute; inset: 0; }
    [data-composition-id="s01-ciego"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-ciego"] svg.s01-svg { top: -130px; }
    [data-composition-id="s01-ciego"] .s01-ciego { left: 110px; top: 560px; font-size: 96px; }
    [data-composition-id="s01-ciego"] .s01-fav { left: 540px; top: 1230px; }
  </style>
  <div id="root" data-composition-id="s01-ciego" data-width="1080" data-height="1920" data-duration="5.14">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="5.14" data-track-index="0">
      <div class="s01-escenario">
        <svg class="s01-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="oc-sello s01-ciego">¿CIEGO?</div>
        <div class="oc-tag rojo s01-fav">MI PIZZERÍA FAVORITA</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-ciego";
      const DUR = 5.14;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = OC.INK;
      // página borrosa con letritas: barras grises
      let renglones = "";
      for (let k = 0; k < 16; k++) {
        const y = 830 + k * 24, w = 190 + ((k * 53) % 90);
        renglones += `<rect x="700" y="${y}" width="${w}" height="9" rx="4" fill="#8cc4d8"/>`;
      }
      root.querySelector(".s01-svg").innerHTML =
        // sillón rojo de examen
        `<g class="s01-sillon">
          <rect x="130" y="800" width="400" height="720" rx="70" fill="#c62f3b" stroke="${I}" stroke-width="8"/>
          <rect x="175" y="840" width="310" height="230" rx="50" fill="${OC.ROJO}" stroke="${I}" stroke-width="6"/>
          <rect x="90" y="1300" width="120" height="70" rx="20" fill="#c62f3b" stroke="${I}" stroke-width="7"/>
          <rect x="450" y="1300" width="120" height="70" rx="20" fill="#c62f3b" stroke="${I}" stroke-width="7"/>
        </g>` +
        OC.martin(300, 1500, 1.2, { celular: true, squint: true }) +
        // el celular grande con la página ilegible
        `<g class="s01-cel">
          ${OC.celular(670, 660, 340, 620, "s01-clip")}
          <g clip-path="url(#s01-clip)">
            <rect x="670" y="660" width="340" height="110" fill="${OC.ROJO}" opacity="0.9"/>
            <g class="s01-borroso" style="filter: blur(2.5px)">
              <text x="700" y="726" font-family="Lexend" font-weight="800" font-size="16" fill="${OC.BLA}" data-layout-ignore>PIZZERÍA DON CARMELO · LA MEJOR DEL BARRIO · DESDE 1987</text>
              <rect x="700" y="790" width="300" height="12" rx="5" fill="${I}" opacity="0.6"/>
              ${renglones}
              <rect x="700" y="1230" width="140" height="22" rx="6" fill="${OC.ROJO}" opacity="0.6"/>
            </g>
          </g>
          ${OC.celularBorde(670, 660, 340, 620)}
        </g>
        <g class="s01-corazon"><path d="M600 795 C520 735 490 685 520 650 C545 623 585 633 600 665 C615 633 655 623 680 650 C710 685 680 735 600 795 Z" fill="${OC.ROJO}" stroke="${I}" stroke-width="7" stroke-linejoin="round"/></g>
        <g class="s01-signos" stroke="${I}" stroke-width="7" stroke-linecap="round" fill="none">
          <path d="M520 860 l30 -24 M540 900 l40 -6 M510 820 l12 -36" />
        </g>`;
      const tl = gsap.timeline({ paused: true });
      const K = OC.kit(tl, root);
      const { q, qa } = K;

      const CIEGO = 1.44;
      const PAGINA = 2.97;
      const FAV = 3.81;

      // cuadro 0: Martín ya está, con el celular pegado a la cara
      tl.fromTo(q(".oc-m"), { y: 50 }, { y: 0, duration: 0.5, ease: "back.out(1.4)" }, 0);
      tl.fromTo(q(".s01-sillon"), { opacity: 0.6, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0);
      tl.fromTo(q(".s01-escenario"), { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none", transformOrigin: "40% 60%" }, 0);
      // acerca y aleja el celular de la cara (no ve)
      tl.fromTo(q(".oc-m-cel"), { x: 0, y: 0 }, { x: -20, y: -18, duration: 0.35, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.1);
      qa(".s01-signos path").forEach((p, i) => K.dibujar(p, 0.5 + i * 0.1, 0.25));
      // "ciego": sello y la cabeza tiembla
      K.sello(q(".s01-ciego"), CIEGO, -6);
      K.sacudon(q(".oc-m-cabeza"), CIEGO + 0.05, 0.9);
      tl.to(q(".oc-m-cejas"), { y: -10, duration: 0.15, ease: "back.out(3)" }, CIEGO);
      // "página": el celular grande aparece
      gsap.set(q(".s01-cel"), { opacity: 0, svgOrigin: "840 970", smoothOrigin: false });
      gsap.set(q(".s01-corazon"), { svgOrigin: "600 720", smoothOrigin: false });
      tl.fromTo(q(".s01-cel"), { opacity: 0, scale: 0.4, x: -200, y: 200, svgOrigin: "840 970" }, { opacity: 1, scale: 1, x: 0, y: 0, svgOrigin: "840 970", duration: 0.4, ease: "back.out(1.4)", immediateRender: false }, PAGINA - 0.25);
      tl.fromTo(q(".s01-borroso"), { filter: "blur(1px)" }, { filter: "blur(3.5px)", duration: 0.5, yoyo: true, repeat: 2, ease: "sine.inOut", immediateRender: false }, PAGINA + 0.2);
      tl.to(q(".s01-ciego"), { opacity: 0.0, duration: 0.25 }, PAGINA);
      // "favorita": corazón que late y etiqueta
      gsap.set(q(".s01-corazon"), { opacity: 0 });
      tl.fromTo(q(".s01-corazon"), { opacity: 0, scale: 0.3, svgOrigin: "600 720" }, { opacity: 1, scale: 1, svgOrigin: "600 720", duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, FAV - 0.05);
      tl.to(q(".s01-corazon"), { scale: 1.15, svgOrigin: "600 720", duration: 0.18, yoyo: true, repeat: 3, ease: "power2.out" }, FAV + 0.3);
      K.pop(q(".s01-fav"), FAV + 0.1);

      K.salida(q("#s01-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
