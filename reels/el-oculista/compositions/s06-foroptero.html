<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/consultorio.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-foroptero"] .s06-capa, [data-composition-id="s06-foroptero"] .s06-escenario { position: absolute; inset: 0; }
    [data-composition-id="s06-foroptero"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-foroptero"] .s06-tag { left: 50%; top: 1290px; width: 520px; margin-left: -260px; }
    [data-composition-id="s06-foroptero"] .s06-t { display: block; }
    [data-composition-id="s06-foroptero"] .s06-t2 { position: absolute; left: 0; right: 0; top: 10px; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s06-foroptero" data-width="1080" data-height="1920" data-duration="2.43">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="2.43" data-track-index="0">
      <div class="s06-escenario">
        <svg class="s06-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="oc-tag s06-tag"><span class="s06-t s06-t1">PARPADEE</span><span class="s06-t s06-t2">LENTE: OTRO MÁS</span></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-foroptero";
      const DUR = 2.43;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = OC.INK;
      const S = 1.1, FX = 540, FY = 960;
      const LX = FX - 210 * S, RX = FX + 210 * S;
      const ojoEn = (cx) => `<circle cx="${cx}" cy="${FY}" r="${100 * S}" fill="${OC.PIEL}"/>` + OC.ojo(cx, FY, 70, "s06-ojo");
      root.querySelector(".s06-svg").innerHTML =
        OC.foroptero(FX, FY, S) +
        ojoEn(LX) + ojoEn(RX) +
        `<g class="s06-vidrios">
          <circle class="s06-v" cx="${LX}" cy="${FY}" r="${100 * S}" fill="${OC.CEL}" fill-opacity="0.35" stroke="${OC.BLA}" stroke-width="7"/>
          <circle class="s06-v" cx="${RX}" cy="${FY}" r="${100 * S}" fill="${OC.CEL}" fill-opacity="0.35" stroke="${OC.BLA}" stroke-width="7"/>
          <path d="M${LX - 60} ${FY - 50} Q${LX - 30} ${FY - 85} ${LX + 10} ${FY - 90} M${RX - 60} ${FY - 50} Q${RX - 30} ${FY - 85} ${RX + 10} ${FY - 90}" fill="none" stroke="${OC.BLA}" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
        </g>
        <g class="s06-cruces" stroke="${OC.ROJO}" stroke-width="5" opacity="0">
          <path d="M${LX - 100} ${FY} H${LX + 100} M${LX} ${FY - 100} V${FY + 100} M${RX - 100} ${FY} H${RX + 100} M${RX} ${FY - 100} V${FY + 100}"/>
        </g>`;
      const tl = gsap.timeline({ paused: true });
      const K = OC.kit(tl, root);
      const { q, qa } = K;

      const PARPADEE = 0.0;
      const DESCANSE = 1.02;

      // cuadro 0: el foróptero llega de arriba
      tl.fromTo(q(".s06-escenario"), { y: -60, scale: 1.08 }, { y: 0, scale: 1, duration: 0.35, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, 0);
      tl.to(q(".s06-escenario"), { scale: 1.05, duration: DUR - 0.4, ease: "none", transformOrigin: "50% 50%" }, 0.35);
      // "parpadee": los ojos parpadean dos veces
      qa(".s06-ojo").forEach((o) => { K.parpadeo(o, PARPADEE + 0.2); K.parpadeo(o, PARPADEE + 0.55); });
      // los ojos miran a un lado y al otro
      tl.to(qa(".s06-ojo circle"), { x: 14, duration: 0.2, ease: "power2.inOut" }, 0.8);
      tl.to(qa(".s06-ojo circle"), { x: -10, duration: 0.2, ease: "power2.inOut" }, 1.5);
      // "descanse": las perillas giran y cambian los lentes
      qa(".oc-f-dial").forEach((d, i) => {
        K.origen(d, `${d.dataset.cx} ${d.dataset.cy}`);
        tl.to(d, { rotation: (i % 2 ? -1 : 1) * (90 + i * 30), duration: 0.35, ease: "back.out(2)" }, DESCANSE + i * 0.05);
      });
      tl.to(qa(".s06-v"), { fillOpacity: 0.7, duration: 0.06, yoyo: true, repeat: 1 }, DESCANSE + 0.1);
      tl.to(q(".s06-cruces"), { opacity: 0.7, duration: 0.1 }, DESCANSE + 0.1);
      qa(".s06-ojo").forEach((o) => K.parpadeo(o, DESCANSE + 0.6));
      tl.set(q(".s06-t1"), { opacity: 0 }, DESCANSE);
      tl.set(q(".s06-t2"), { opacity: 1 }, DESCANSE);
      K.pop(q(".s06-tag"), 0.15);
      tl.fromTo(q(".s06-tag"), { scale: 1 }, { scale: 1.1, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, DESCANSE);

      K.salida(q("#s06-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
