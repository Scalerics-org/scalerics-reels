<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/consultorio.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-carta"] .s02-capa, [data-composition-id="s02-carta"] .s02-escenario { position: absolute; inset: 0; }
    [data-composition-id="s02-carta"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s02-carta"] .s02-tag { left: 96px; top: 515px; }
  </style>
  <div id="root" data-composition-id="s02-carta" data-width="1080" data-height="1920" data-duration="2.61">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="2.61" data-track-index="0">
      <div class="s02-escenario">
        <svg class="s02-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="oc-tag s02-tag">CARTA DE AGUDEZA</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-carta";
      const DUR = 2.61;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      root.querySelector(".s02-svg").innerHTML =
        OC.carta(90, 600, 420, 700, [["E", 160], ["F P", 104], ["T O Z", 78], ["L P E D", 58], ["P E C F D", 44], ["E D F C Z P", 32], ["F E L O P Z D", 24]], 4) +
        OC.oculista(720, 1540, 1.18, { espejo: true, mano: true });
      const tl = gsap.timeline({ paused: true });
      const K = OC.kit(tl, root);
      const { q, qa } = K;

      const TRANQUILO = 0.0;
      const LEA = 1.34;
      const CARTA = 1.74;

      // cuadro 0: el oculista entra desde la derecha
      tl.fromTo(q(".oc-o"), { x: -260, opacity: 0.4 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo(q(".s02-escenario"), { scale: 1 }, { scale: 1.04, duration: DUR, ease: "none", transformOrigin: "50% 60%" }, 0);
      // "tranquilo": la mano en alto se mece (calma)
      K.origen(q(".oc-o-mano"), "-150 -200");
      tl.fromTo(q(".oc-o-mano"), { rotation: 8 }, { rotation: -6, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, TRANQUILO + 0.1);
      tl.to(q(".oc-o-mano"), { rotation: 40, opacity: 0, duration: 0.25, ease: "power2.in" }, LEA - 0.1);
      // el espejo frontal brilla
      tl.fromTo(q(".oc-o-brillo"), { opacity: 0.3 }, { opacity: 1, duration: 0.2, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.2);
      K.hablar(".oc-o-boca", 0.05, 3);
      // "lea": el puntero gira hacia la carta
      K.apuntar(0, 30, 0.01);
      K.apuntar(LEA, -8, 0.3);
      // "carta": la carta aparece con pop y sus filas caen en cascada
      K.origen(q(".oc-carta"), "300 950");
      tl.fromTo(q(".oc-carta"), { opacity: 0, scale: 0.9 }, { opacity: 0.55, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.1);
      tl.to(q(".oc-carta"), { opacity: 1, duration: 0.08 }, CARTA - 0.08);
      tl.fromTo(q(".oc-carta"), { scale: 1 }, { scale: 1.04, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, CARTA);
      qa(".oc-fila").forEach((f, i) => { gsap.set(f, { opacity: 0 }); tl.to(f, { opacity: 1, duration: 0.1 }, CARTA - 0.05 + i * 0.05); });
      K.pop(q(".s02-tag"), CARTA + 0.2);

      K.salida(q("#s02-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
