  <script>
    (function () {
      const ID = "s07-cartel";
      const DUR = 4.12;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = OC.INK, X = 290, Y = 600, W = 500, H = 820;
      let filas = "";
      for (let k = 0; k < 12; k++) filas += `<rect x="320" y="${760 + k * 44}" width="${260 + ((k * 41) % 120)}" height="14" rx="7" fill="${I}" opacity="0.4"/>`;
      root.querySelector(".s07-svg").innerHTML =
        OC.celular(X, Y, W, H, "s07-clip") +
        `<g clip-path="url(#s07-clip)">
          <rect x="${X}" y="${Y}" width="${W}" height="120" fill="${OC.ROJO}"/>
          <text x="320" y="680" font-family="Lexend" font-weight="800" font-size="36" fill="${OC.BLA}">DON CARMELO</text>
          ${filas}
          <rect class="s07-sombra" x="${X}" y="${Y}" width="${W}" height="${H}" fill="${I}" opacity="0"/>
        </g>` +
        OC.celularBorde(X, Y, W, H);
      // la lupa: va al rincón de la X diminuta (la X está en ~ (858, 800))
      root.querySelector(".s07-lupa-svg").innerHTML =
        `<g class="s07-lupa">
          <path d="M925 870 L1010 960" stroke="${I}" stroke-width="30" stroke-linecap="round"/>
          <circle cx="860" cy="805" r="88" fill="${OC.BLA}" stroke="${OC.ROJO}" stroke-width="16"/>

      const K = OC.kit(tl, root);
      const { q, qa } = K;

      const CARTEL = 0.34;
      const TODO = 1.36;
      const SUSCRIBITE = 2.11;
      const BOLETIN = 3.22;

      // cuadro 0: el celular con la página
      tl.fromTo(q(".s07-escenario"), { scale: 0.96 }, { scale: 1.03, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);
      tl.fromTo(q(".oc-cel"), { opacity: 0.6 }, { opacity: 1, duration: 0.2 }, 0);
      // "cartel": cae el cartel emergente y tapa todo
      gsap.set(q(".s07-main"), { opacity: 0 });
      tl.fromTo(q(".s07-main"), { opacity: 0, y: -700, rotation: -8 }, { opacity: 1, y: 0, rotation: -2, duration: 0.35, ease: "back.out(1.3)", immediateRender: false }, CARTEL - 0.15);
      tl.to(q(".s07-sombra"), { opacity: 0.45, duration: 0.2 }, CARTEL);
      K.sacudon(q(".s07-svg"), CARTEL + 0.2, 0.7);

      gsap.set([q(".s07-cook"), q(".s07-mail")], { opacity: 0 });
      tl.fromTo(q(".s07-cook"), { opacity: 0, y: 260 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.5)", immediateRender: false }, TODO - 0.1);
      tl.fromTo(q(".s07-mail"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, TODO + 0.15);
      // "suscribite": el principal se sacude
      tl.to(q(".s07-main"), { rotation: 3, duration: 0.07, yoyo: true, repeat: 5, ease: "sine.inOut" }, SUSCRIBITE);
      tl.fromTo(q(".s07-btn"), { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 3, immediateRender: false }, SUSCRIBITE + 0.1);
      // "boletín": la lupa busca la X diminuta
      gsap.set(q(".s07-lupa"), { opacity: 0 });
      tl.fromTo(q(".s07-lupa"), { opacity: 0, x: 120, y: 500 }, { opacity: 1, x: 0, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, BOLETIN - 0.3);
      tl.to(q(".s07-lupa"), { x: -12, y: 8, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, BOLETIN + 0.15);

      K.salida(q("#s07-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
