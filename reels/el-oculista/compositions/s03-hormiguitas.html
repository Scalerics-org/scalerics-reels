<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/consultorio.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-hormiguitas"] .s03-capa, [data-composition-id="s03-hormiguitas"] .s03-escenario { position: absolute; inset: 0; }
    [data-composition-id="s03-hormiguitas"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-hormiguitas"] .s03-tag { left: 50%; top: 1468px; transform: translateX(-50%); }
  </style>
  <div id="root" data-composition-id="s03-hormiguitas" data-width="1080" data-height="1920" data-duration="3.95">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="3.95" data-track-index="0">
      <div class="s03-escenario">
        <svg class="s03-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="oc-tag rojo s03-tag">LETRA: MICROSCÓPICA</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-hormiguitas";
      const DUR = 3.95;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = OC.INK;
      const hormiga = (x, y, s) => `<g class="s03-h" transform="translate(${x} ${y}) scale(${s})">
          <path d="M-14 -8 L-22 -18 M-14 8 L-22 18 M0 -8 L0 -20 M0 8 L0 20 M12 -8 L20 -18 M12 8 L20 18" stroke="${I}" stroke-width="3.5" stroke-linecap="round"/>
          <ellipse cx="-16" cy="0" rx="10" ry="8" fill="${I}"/><ellipse cx="0" cy="0" rx="7" ry="6" fill="${I}"/><ellipse cx="16" cy="0" rx="9" ry="8" fill="${I}"/>
          <path d="M22 -4 L32 -14 M22 4 L32 14" stroke="${I}" stroke-width="3" stroke-linecap="round"/>
        </g>`;
      // filas diminutas (las que se vuelven hormigas)
      const CHICAS = [
        ["LA MEJOR MUZZARELLA DEL BARRIO DESDE 1987 · PEDIDOS", 16, 1090],
        ["HORARIOS: VER CARTEL EN LA PUERTA DEL LOCAL · TEL", 13, 1135],
        ["CONSULTE NUESTRA CARTA COMPLETA EN EL LOCAL · ESPECIALIDADES", 11, 1175],
        ["FAINÁ · FUGAZZETA · NAPOLITANA · CALABRESA · MUZZA · PORCIONES", 9, 1210],
        ["TODOS LOS DERECHOS RESERVADOS · DISEÑO WEB: MI SOBRINO · 2016", 8, 1240],
      ];
      let chicas = "", hormigas = "";
      CHICAS.forEach(([t, sz, y], i) => {
        chicas += `<text class="s03-chica" x="540" y="${y}" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="${sz}" fill="${I}" data-layout-ignore>${t}</text>`;
        const n = 9 - i, sc = 0.7 - i * 0.1, w = 560 - i * 40;
        for (let k = 0; k < n; k++) hormigas += hormiga(540 - w / 2 + (k + 0.5) * (w / n), y - sz * 0.35, sc);
      });
      root.querySelector(".s03-svg").innerHTML =
        `<g class="s03-carta">
          <rect x="106" y="586" width="868" height="868" rx="16" fill="${I}"/>
          <rect x="120" y="600" width="840" height="840" rx="8" fill="${OC.BLA}"/>
          <text class="s03-f0" x="540" y="770" text-anchor="middle" font-family="Lexend" font-weight="800" font-size="112" letter-spacing="6" fill="${I}">PIZZERÍA</text>
          <text class="s03-f1" x="540" y="900" text-anchor="middle" font-family="Lexend" font-weight="800" font-size="72" letter-spacing="5" fill="${I}">DON CARMELO</text>
          <path class="s03-roja" d="M180 980 H900" stroke="${OC.ROJO}" stroke-width="8" stroke-linecap="round"/>
          <rect class="s03-marca" x="150" y="790" width="780" height="10" rx="5" fill="${OC.ROJO}" opacity="0.8"/>
          <g class="s03-chicas">${chicas}</g>
          <g class="s03-hormigas">${hormigas}</g>
          <rect x="300" y="1300" width="480" height="70" rx="12" fill="${OC.ROJO}" opacity="0.15"/>
          <text x="540" y="1346" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="9" fill="${I}" data-layout-ignore>PEDIDOS AL 2 9 0 0 . . .</text>
        </g>
        <g class="s03-puntero"><path d="M1140 560 L870 760" stroke="${I}" stroke-width="14" stroke-linecap="round"/><circle cx="870" cy="760" r="13" fill="${OC.ROJO}" stroke="${I}" stroke-width="5"/></g>`;
      const tl = gsap.timeline({ paused: true });
      const K = OC.kit(tl, root);
      const { q, qa } = K;

      const DON = 0.51;
      const ABAJO = 1.89;
      const HORMIGAS = 2.82;

      // cuadro 0: la carta ya está, acercándose (primer plano)
      K.origen(q(".s03-carta"), "540 1000");
      tl.fromTo(q(".s03-carta"), { scale: 0.86 }, { scale: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.to(q(".s03-carta"), { scale: 1.04, duration: DUR - 0.45, ease: "none" }, 0.45);
      // Martín lee: la marca roja subraya cada fila
      tl.fromTo(q(".s03-f0"), { opacity: 0.5 }, { opacity: 1, duration: 0.15 }, 0);
      K.origen(q(".s03-marca"), "150 795");
      tl.fromTo(q(".s03-marca"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.05);
      tl.to(q(".s03-marca"), { y: 125, duration: 0.2, ease: "power2.inOut" }, DON);
      tl.fromTo(q(".s03-marca"), { scaleX: 0.2 }, { scaleX: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, DON + 0.1);
      // el puntero acompaña
      tl.fromTo(q(".s03-puntero"), { x: 120, y: -40 }, { x: 0, y: 0, duration: 0.35, ease: "power2.out" }, 0);
      tl.to(q(".s03-puntero"), { y: 130, duration: 0.3, ease: "power2.inOut" }, DON);
      // "abajo": el puntero baja a las filas diminutas
      tl.to(q(".s03-marca"), { opacity: 0, duration: 0.2 }, ABAJO - 0.2);
      tl.to(q(".s03-puntero"), { x: -60, y: 400, duration: 0.4, ease: "power2.inOut" }, ABAJO - 0.15);
      tl.to(q(".s03-puntero"), { x: -20, y: 420, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, ABAJO + 0.3);
      // "hormiguitas": las letritas se vuelven hormigas que caminan
      gsap.set(q(".s03-hormigas"), { opacity: 0 });
      tl.to(q(".s03-chicas"), { opacity: 0, filter: "blur(3px)", duration: 0.2 }, HORMIGAS - 0.1);
      tl.to(q(".s03-hormigas"), { opacity: 1, duration: 0.15 }, HORMIGAS - 0.05);
      qa(".s03-h").forEach((h, i) => {
        tl.to(h, { x: "+=" + (i % 2 ? 46 : -46), duration: DUR - HORMIGAS, ease: "none" }, HORMIGAS);
      });
      tl.fromTo(q(".s03-hormigas"), { y: 0 }, { y: -4, duration: 0.08, yoyo: true, repeat: 12, ease: "steps(1)", immediateRender: false }, HORMIGAS);
      K.golpe(q(".s03-tag"), HORMIGAS + 0.1, -3);

      K.salida(q("#s03-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
