<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/consultorio.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s05-cargando"] .s05-capa, [data-composition-id="s05-cargando"] .s05-escenario { position: absolute; inset: 0; }
    [data-composition-id="s05-cargando"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s05-cargando"] .s05-tag { left: 636px; top: 880px; }
  </style>
  <div id="root" data-composition-id="s05-cargando" data-width="1080" data-height="1920" data-duration="5.58">
    <div id="s05-escena" class="s05-capa clip" data-start="0" data-duration="5.58" data-track-index="0">
      <div class="s05-escenario">
        <svg class="s05-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="oc-tag rojo s05-tag">PASA EL TIEMPO</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-cargando";
      const DUR = 5.58;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = OC.INK, X = 120, Y = 620, W = 440, H = 780;
      const CX = X + W / 2, CY = 940;
      const pct = ["1%", "2%", "3%", "4%"].map((t, i) => `<text class="s05-p s05-p${i}" x="${CX}" y="1190" text-anchor="middle" font-family="Lexend" font-weight="800" font-size="64" fill="${I}" opacity="${i ? 0 : 1}">${t}</text>`).join("");
      let marcas = "";
      for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; marcas += `<path d="M${850 + Math.cos(a) * 92} ${720 + Math.sin(a) * 92} L${850 + Math.cos(a) * 108} ${720 + Math.sin(a) * 108}" stroke="${I}" stroke-width="6" stroke-linecap="round"/>`; }
      root.querySelector(".s05-svg").innerHTML =
        OC.celular(X, Y, W, H, "s05-clip") +
        `<g clip-path="url(#s05-clip)">
          <rect x="${X}" y="${Y}" width="${W}" height="90" fill="${OC.ROJO}" opacity="0.25"/>
          <circle cx="${CX}" cy="${CY}" r="90" fill="none" stroke="#dceef5" stroke-width="22"/>
          <circle class="s05-rueda" cx="${CX}" cy="${CY}" r="90" fill="none" stroke="${OC.ROJO}" stroke-width="22" stroke-linecap="round" stroke-dasharray="150 420"/>
          <text x="${CX}" y="1110" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="30" letter-spacing="6" fill="#2c5a7a">CARGANDO</text>
          ${pct}
          <rect x="${X + 50}" y="1240" width="${W - 100}" height="26" rx="13" fill="#dceef5" stroke="${I}" stroke-width="4"/>
          <rect class="s05-barra" x="${X + 50}" y="1240" width="${W - 100}" height="26" rx="13" fill="${OC.ROJO}"/>
        </g>` +
        OC.celularBorde(X, Y, W, H) +
        // reloj del consultorio
        `<g class="s05-reloj">
          <circle cx="850" cy="720" r="120" fill="${OC.BLA}" stroke="${I}" stroke-width="10"/>
          ${marcas}
          <path class="s05-hora" d="M850 720 L850 660" stroke="${I}" stroke-width="12" stroke-linecap="round"/>
          <path class="s05-min" d="M850 720 L850 625" stroke="${OC.ROJO}" stroke-width="8" stroke-linecap="round"/>
          <circle cx="850" cy="720" r="12" fill="${I}"/>
        </g>` +
        OC.martin(850, 1540, 0.78, { squint: true }) +
        `<g class="s05-puntero"><path d="M1140 1000 L560 960" stroke="${I}" stroke-width="14" stroke-linecap="round"/><circle cx="560" cy="960" r="13" fill="${OC.ROJO}" stroke="${I}" stroke-width="5"/></g>`;
      const tl = gsap.timeline({ paused: true });
      const K = OC.kit(tl, root);
      const { q, qa } = K;

      const LINEA = 0.61;
      const CARGAS = [1.39, 2.47];
      const SIGUE = 4.02;

      // cuadro 0: el celular está; el puntero toca "siguiente línea"
      tl.fromTo(q(".s05-escenario"), { scale: 1.03 }, { scale: 1, duration: 0.4, ease: "power2.out", transformOrigin: "50% 55%" }, 0);
      tl.fromTo(q(".s05-puntero"), { x: 200 }, { x: 0, duration: 0.3, ease: "power2.out" }, 0);
      tl.to(q(".s05-puntero"), { x: 25, duration: 0.1, yoyo: true, repeat: 1 }, LINEA - 0.1);
      tl.to(q(".s05-puntero"), { x: 600, duration: 0.35, ease: "power2.in" }, LINEA + 0.3);
      // la ruedita gira toda la escena
      K.origen(q(".s05-rueda"), `${CX} ${CY}`);
      tl.fromTo(q(".s05-rueda"), { rotation: 0 }, { rotation: 360 * 5, duration: DUR, ease: "none" }, 0);
      // la barra apenas avanza
      K.origen(q(".s05-barra"), `${X + 50} 1253`);
      tl.fromTo(q(".s05-barra"), { scaleX: 0.04 }, { scaleX: 0.07, duration: 0.3 }, 0.2);
      // cada "carga": salta el porcentaje y la ruedita late
      const PS = qa(".s05-p");
      const salto = (t, i) => {
        tl.set(PS[i - 1], { opacity: 0 }, t);
        tl.set(PS[i], { opacity: 1 }, t);
        K.origen(PS[i], `${CX} 1170`);
        tl.fromTo(PS[i], { scale: 1.4 }, { scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, t);
        tl.to(q(".s05-barra"), { scaleX: 0.07 + i * 0.025, duration: 0.25 }, t);
      };
      salto(CARGAS[0], 1); salto(CARGAS[1], 2); salto(SIGUE, 3);
      // el reloj gira rápido: pasa el tiempo
      K.origen(q(".s05-min"), "850 720"); K.origen(q(".s05-hora"), "850 720");
      tl.fromTo(q(".s05-min"), { rotation: 0 }, { rotation: 360 * 6, duration: DUR - 0.8, ease: "power1.in" }, 0.8);
      tl.fromTo(q(".s05-hora"), { rotation: 0 }, { rotation: 180, duration: DUR - 0.8, ease: "power1.in" }, 0.8);
      K.pop(q(".s05-tag"), CARGAS[0] + 0.1);
      // Martín espera; en "sigue cargando" le crece la barba
      tl.fromTo(q(".oc-m"), { y: 40 }, { y: 0, duration: 0.4, ease: "back.out(1.4)" }, 0.1);
      K.origen(q(".oc-m-cabeza"), "0 -260");
      tl.to(q(".oc-m-cabeza"), { rotation: -6, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.6);
      K.origen(q(".oc-m-barba"), "0 -260");
      tl.fromTo(q(".oc-m-barba"), { opacity: 0, scaleY: 0.3 }, { opacity: 1, scaleY: 1, duration: 0.6, ease: "power2.out" }, SIGUE);
      tl.to(q(".s05-tag"), { opacity: 0, duration: 0.2 }, SIGUE - 0.2);

      K.salida(q("#s05-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
