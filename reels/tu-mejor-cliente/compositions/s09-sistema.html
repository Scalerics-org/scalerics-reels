<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s09-sistema"] .s09-capa { position: absolute; inset: 0; }
    [data-composition-id="s09-sistema"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s09-sistema"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s09-sistema"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s09-sistema"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s09-sistema"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s09-sistema"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s09-sistema" data-width="1080" data-height="1920" data-duration="2.68">
    <div id="s09-escena" class="s09-capa clip" data-start="0" data-duration="2.68" data-track-index="0">
      <!-- trébol -->
      <div id="s09-trebol" class="s09-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g class="s09-trebol-g">
            <g class="s09-hojas">
              <path class="ln s09-dib-t" d="M540 900 C470 900 420 860 420 812 C420 776 448 752 480 752 C512 752 540 776 540 812 Z" />
              <path class="ln s09-dib-t" d="M540 900 C540 830 580 780 628 780 C664 780 688 808 688 840 C688 872 664 900 628 900 Z" />
              <path class="ln s09-dib-t" d="M540 900 C610 900 660 940 660 988 C660 1024 632 1048 600 1048 C568 1048 540 1024 540 988 Z" />
              <path class="ln s09-dib-t" d="M540 900 C540 970 500 1020 452 1020 C416 1020 392 992 392 960 C392 928 416 900 452 900 Z" />
            </g>
            <path class="ln s09-dib-t s09-tallo" d="M560 920 C590 990 630 1050 700 1080" />
          </g>
          <!-- badge de "no" -->
          <g class="s09-badge">
            <circle class="ln-badge" cx="700" cy="740" r="26" />
            <path class="ln-badge" d="M689 729 L711 751 M711 729 L689 751" />
          </g>
        </svg>
      </div>
      <!-- engranaje -->
      <div id="s09-sistema-capa" class="s09-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g class="s09-engranaje">
            <path class="ln s09-dib-g s09-dientes" d="" />
            <circle class="ln-ac s09-dib-g" cx="540" cy="900" r="54" />
          </g>
        </svg>
      </div>
      <div class="etiqueta"><span class="s09-e1">No es suerte</span><span class="s09-e2">Es un sistema</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s09-sistema";
      const DUR = 2.68;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const NO = 0.0;
      const SUERTE = 0.39;
      const ES = 1.02;
      const SISTEMA = 1.79;

      // dientes del engranaje (geometría fija, determinista)
      const CX = 540, CY = 900, RIN = 128, ROUT = 168, N = 9;
      const pt = (r, a) => (CX + r * Math.cos(a)).toFixed(1) + " " + (CY + r * Math.sin(a)).toFixed(1);
      let d = "";
      for (let i = 0; i < N; i++) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
        const p0 = pt(RIN, a - 0.2), p1 = pt(ROUT, a - 0.12), p2 = pt(ROUT, a + 0.12), p3 = pt(RIN, a + 0.2);
        const sig = pt(RIN, a + (2 * Math.PI) / N - 0.2);
        d += (i === 0 ? "M" + p0 : "") + " L" + p1 + " L" + p2 + " L" + p3 + " A" + RIN + " " + RIN + " 0 0 1 " + sig;
      }
      q(".s09-dientes").setAttribute("d", d + " Z");

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.05);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };

      // ---------- trébol: arranca medio dibujado ----------
      // las hojas entran con pop (dibujadas a medias formaban una figura que no queremos); el tallo se dibuja
      tl.fromTo(q(".s09-hojas"), { opacity: 0.45, scale: 0.82, svgOrigin: "540 900" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0);
      dibujar([q(".s09-tallo")], 0.15, 0.5);
      // se mece mientras se dice "fidelizar no es tener"
      tl.fromTo(q(".s09-trebol-g"), { rotation: -5, svgOrigin: "540 1000" }, { rotation: 4, duration: SUERTE, ease: "sine.inOut" }, 0);
      tl.to(q(".s09-hojas"), { scale: 1.04, svgOrigin: "540 900", duration: 0.5, ease: "sine.inOut" }, 0.45);
      tl.fromTo(q(".s09-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, NO);

      // "suerte": cae el badge y el trébol se apaga
      tl.fromTo(q(".s09-badge"), { opacity: 0, scale: 0.6, svgOrigin: "700 740" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, SUERTE);
      tl.to(q(".s09-trebol-g"), { rotation: -3, svgOrigin: "540 1000", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, SUERTE);
      tl.to(qa(".s09-dib-t"), { opacity: 0.4, duration: 0.4, ease: "power2.out" }, SUERTE + 0.2);
      tl.to(q(".s09-trebol-g"), { rotation: 2, svgOrigin: "540 1000", duration: 0.5, ease: "sine.inOut" }, SUERTE + 0.24);

      // "Es": el trébol se va girando y achicándose; el engranaje se dibuja encima
      tl.to(q("#s09-trebol"), { opacity: 0, scale: 0.7, rotation: -40, filter: "blur(6px)", transformOrigin: "540px 900px", duration: 0.45, ease: "power2.in" }, ES - 0.15);
      tl.to(q(".s09-e1"), { opacity: 0, duration: 0.2 }, ES - 0.15);
      dibujar(qa(".s09-dib-g"), ES, 0.6);
      // gira despacio hasta el final
      tl.fromTo(q(".s09-engranaje"), { rotation: -30, svgOrigin: "540 900" }, { rotation: 60, duration: DUR - ES, ease: "none" }, ES);
      // "sistema": punch
      tl.fromTo(q("#s09-sistema-capa"), { scale: 1 }, { scale: 1.12, transformOrigin: "540px 900px", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, SISTEMA);
      tl.fromTo(q(".s09-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, ES + 0.05);
      // en "sistema" la etiqueta acompaña el punch
      tl.to(q(".s09-e2"), { scale: 1.08, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, SISTEMA);

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
