<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s04-no-es"] .s04-capa { position: absolute; inset: 0; }
    [data-composition-id="s04-no-es"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s04-no-es"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s04-no-es"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s04-no-es"] .s04-plata { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 50px; fill: #efeee5; }
    [data-composition-id="s04-no-es"] .s04-ojo { fill: #efeee5; }
    [data-composition-id="s04-no-es"] .s04-nombre { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.2em; fill: rgba(239, 238, 229, 0.7); }
    [data-composition-id="s04-no-es"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s04-no-es"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s04-no-es" data-width="1080" data-height="1920" data-duration="4.21">
    <div id="s04-escena" class="s04-capa clip" data-start="0" data-duration="4.21" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s04-fila">
          <!-- 1: etiqueta de precio -->
          <g class="s04-ico s04-ico1">
            <g class="s04-dib">
              <path class="ln s04-d1" d="M-80 -44 H36 L80 0 L36 44 H-80 Z" />
              <circle class="ln s04-d1" cx="44" cy="0" r="8" />
              <text class="s04-plata s04-t1" x="-26" y="18" text-anchor="middle">$</text>
            </g>
            <text class="s04-nombre s04-n1" x="0" y="140" text-anchor="middle">PRECIO</text>
          </g>
          <!-- 2: gráfico en baja -->
          <g class="s04-ico s04-ico2">
            <g class="s04-dib">
              <path class="ln s04-d2" d="M-76 -66 V60 H80" />
              <path class="ln s04-d2" d="M-60 -40 L-24 -8 L6 -30 L64 34" />
              <path class="ln s04-d2" d="M40 32 L66 36 L64 10" />
            </g>
            <text class="s04-nombre s04-n2" x="0" y="140" text-anchor="middle">CRISIS</text>
          </g>
          <!-- 3: cara de queja -->
          <g class="s04-ico s04-ico3">
            <g class="s04-dib">
              <circle class="ln s04-d3" cx="0" cy="0" r="64" />
              <path class="ln s04-d3" d="M-28 34 Q0 12 28 34" />
              <circle class="s04-ojo s04-ojos" cx="-22" cy="-16" r="7" />
              <circle class="s04-ojo s04-ojos" cx="22" cy="-16" r="7" />
            </g>
            <text class="s04-nombre s04-n3" x="0" y="140" text-anchor="middle">UN ERROR</text>
          </g>
        </g>
        <g class="s04-badge s04-b1"><g class="s04-b-in"><circle class="ln-ac" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
        <g class="s04-badge s04-b2"><g class="s04-b-in"><circle class="ln-ac" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
        <g class="s04-badge s04-b3"><g class="s04-b-in"><circle class="ln-ac" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
      </svg>
      <div class="etiqueta"><span class="s04-e1">Nada de eso</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s04-no-es";
      const DUR = 4.21;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const PRECIO = 0.6;
      const NI1 = 1.24;
      const CRISIS = 1.5;
      const NI2 = 1.8;
      const ALGO = 2.7;
      const MAL = 3.2;

      const Y = 900;
      const XS = [260, 540, 820];
      const BADGE = [[86, -70], [84, -84], [70, -78]];

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * 0.05 : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const nombre = (el, t) => tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      const badge = (el, t) => {
        const inn = el.querySelector(".s04-b-in");
        tl.fromTo(inn, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const sacudir = (el, t) => tl.to(el, { x: -6, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);

      const icos = [q(".s04-ico1"), q(".s04-ico2"), q(".s04-ico3")];
      icos.forEach((g, i) => gsap.set(g, { x: XS[i], y: Y }));
      [q(".s04-b1"), q(".s04-b2"), q(".s04-b3")].forEach((b, i) => gsap.set(b, { x: XS[i] + BADGE[i][0], y: Y + BADGE[i][1] }));
      qa(".s04-b-in, .s04-nombre, .s04-ojos").forEach((b) => gsap.set(b, { opacity: 0 }));

      tl.fromTo(q(".s04-fila"), { scale: 1.06, svgOrigin: "540 " + Y }, { scale: 1, svgOrigin: "540 " + Y, duration: DUR, ease: "none" }, 0);

      // 1. precio: arranca medio dibujado
      dibujar(qa(".s04-d1"), 0, 0.5, 0.3);
      tl.fromTo(q(".s04-t1"), { opacity: 0, scale: 0.6, svgOrigin: "-26 0" }, { opacity: 1, scale: 1, svgOrigin: "-26 0", duration: 0.3, ease: "back.out(2)" }, 0.15);
      tl.fromTo(q(".s04-ico1 .s04-dib"), { rotation: -10, svgOrigin: "0 0" }, { rotation: 0, svgOrigin: "0 0", duration: 0.6, ease: "back.out(1.8)" }, 0);
      nombre(q(".s04-n1"), PRECIO - 0.1);
      badge(q(".s04-b1"), PRECIO + 0.08);
      sacudir(q(".s04-ico1 .s04-dib"), PRECIO + 0.1);

      // 2. crisis: el gráfico se dibuja en "Ni"
      tl.to(q(".s04-ico1"), { opacity: 0.4, duration: 0.3 }, NI1);
      dibujar(qa(".s04-d2"), NI1 - 0.1, 0.4);
      nombre(q(".s04-n2"), CRISIS - 0.05);
      badge(q(".s04-b2"), CRISIS + 0.12);
      sacudir(q(".s04-ico2 .s04-dib"), CRISIS + 0.14);

      // 3. algo que hiciste mal: la cara se dibuja y pestañea
      tl.to(q(".s04-ico2"), { opacity: 0.4, duration: 0.3 }, NI2 + 0.1);
      dibujar(qa(".s04-d3"), NI2 + 0.1, 0.5);
      tl.to(qa(".s04-ojos"), { opacity: 1, duration: 0.1 }, NI2 + 0.5);
      tl.to(qa(".s04-ojos"), { scaleY: 0.15, transformOrigin: "50% 50%", duration: 0.08, yoyo: true, repeat: 1 }, ALGO);
      tl.fromTo(q(".s04-ico3 .s04-dib"), { rotation: -6, svgOrigin: "0 0" }, { rotation: 6, svgOrigin: "0 0", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, NI2 + 0.5);
      nombre(q(".s04-n3"), ALGO - 0.2);
      badge(q(".s04-b3"), MAL + 0.05);
      sacudir(q(".s04-ico3 .s04-dib"), MAL + 0.07);

      // "nada de eso": los tres badges laten juntos
      tl.fromTo(q(".s04-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, MAL);
      tl.to(qa(".s04-b-in"), { scale: 1.22, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, MAL + 0.45);
      tl.to(qa(".s04-ico1, .s04-ico2"), { opacity: 1, duration: 0.25 }, MAL + 0.4);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
