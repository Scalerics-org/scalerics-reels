<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s10-puntos"] .s10-capa { position: absolute; inset: 0; }
    [data-composition-id="s10-puntos"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s10-puntos"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-puntos"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-puntos"] .ln-sello { fill: none; stroke: rgba(239, 238, 229, 0.55); stroke-width: 3; }
    [data-composition-id="s10-puntos"] .relleno { fill: #5ce611; }
    [data-composition-id="s10-puntos"] .estrella { fill: #5ce611; }
    [data-composition-id="s10-puntos"] .s10-aviso-caja { fill: #0b1d35; stroke: #5ce611; stroke-width: 4; }
    [data-composition-id="s10-puntos"] .s10-marca { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 30px; fill: #efeee5; }
    [data-composition-id="s10-puntos"] .s10-marca-ac { fill: #5ce611; }
    [data-composition-id="s10-puntos"] .s10-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 30px; fill: #efeee5; }
    [data-composition-id="s10-puntos"] .s10-num { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 96px; fill: #5ce611; }
    [data-composition-id="s10-puntos"] .s10-pts { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: rgba(239, 238, 229, 0.62); }
    [data-composition-id="s10-puntos"] .s10-gris { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 28px; fill: rgba(239, 238, 229, 0.6); }
    [data-composition-id="s10-puntos"] .s10-aviso-1 { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s10-puntos"] .s10-aviso-2 { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #5ce611; }
    [data-composition-id="s10-puntos"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s10-puntos"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s10-puntos" data-width="1080" data-height="1920" data-duration="9.31">
    <div id="s10-escena" class="s10-capa clip" data-start="0" data-duration="9.31" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s10-cel">
          <rect class="ln s10-d-cel" x="350" y="610" width="380" height="620" rx="52" />
          <path class="ln s10-d-cel" d="M500 638 H580" />
          <text class="s10-marca s10-header" x="540" y="704" text-anchor="middle">Scalerics <tspan class="s10-marca-ac">Puntos</tspan></text>
          <path class="ln-4 s10-d-div" d="M350 736 H730" />
          <!-- la tarjeta de Martín -->
          <g class="s10-tarjeta">
            <rect class="ln-4 s10-d-card" x="380" y="766" width="320" height="320" rx="24" />
            <circle class="ln-4 s10-d-card" cx="424" cy="812" r="22" />
            <path class="estrella s10-est" d="" transform="translate(444 790) scale(0.55)" />
            <text class="s10-nombre s10-quien" x="460" y="823">Martín</text>
            <text class="s10-num s10-n s10-n1" x="540" y="945" text-anchor="middle">80</text>
            <text class="s10-num s10-n s10-n2" x="540" y="945" text-anchor="middle">90</text>
            <text class="s10-num s10-n s10-n3" x="540" y="945" text-anchor="middle">100</text>
            <text class="s10-pts" x="540" y="985" text-anchor="middle">PUNTOS</text>
            <g class="s10-sellos"></g>
          </g>
          <text class="s10-gris s10-dias" x="540" y="1150" text-anchor="middle">7 días sin venir</text>
          <!-- el aviso -->
          <g class="s10-aviso">
            <rect class="s10-aviso-caja" x="368" y="632" width="344" height="110" rx="22" />
            <text class="s10-aviso-1" x="540" y="678" text-anchor="middle">Tenés 100 puntos</text>
            <text class="s10-aviso-2" x="540" y="716" text-anchor="middle">esperándote</text>
          </g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s10-e1">Scalerics Puntos</span><span class="s10-e2">Suma con cada compra</span><span class="s10-e3">En el celular</span><span class="s10-e4">Si deja de venir</span><span class="s10-e5">Le llega un aviso</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s10-puntos";
      const DUR = 9.31;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SCALERICS = 0.41;
      const PUNTOS = 1.01;
      const CLIENTE = 1.91;
      const SUMA = 2.41;
      const COMPRA = 3.31;
      const LLEVA = 4.11;
      const CELULAR = 5.01;
      const SI = 5.66;
      const VENIR = 6.31;
      const AVISO = 7.41;
      const ESPERANDOTE = 8.61;

      let d = "";
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? 19 : 8;
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        d += (i === 0 ? "M" : "L") + (r * Math.cos(a)).toFixed(1) + " " + (r * Math.sin(a)).toFixed(1) + " ";
      }
      q(".s10-est").setAttribute("d", d + "Z");

      // fila de 10 sellos (8 llenos al arrancar)
      const NS = "http://www.w3.org/2000/svg";
      const capa = q(".s10-sellos");
      const llenos = [];
      for (let i = 0; i < 10; i++) {
        const cx = 405 + i * 30;
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("class", "ln-sello"); c.setAttribute("cx", cx); c.setAttribute("cy", 1040); c.setAttribute("r", 11);
        capa.appendChild(c);
        const f = document.createElementNS(NS, "circle");
        f.setAttribute("class", "relleno"); f.setAttribute("cx", cx); f.setAttribute("cy", 1040); f.setAttribute("r", 11);
        capa.appendChild(f);
        llenos.push(f);
      }

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * 0.05 : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => tl.fromTo(el, { opacity: 0, scale: 0.6, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(2)" }, t);
      const ETQ = qa(".etiqueta span");
      const etiqueta = (k, t) => {
        if (k > 0) tl.to(ETQ[k - 1], { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(ETQ[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      gsap.set(qa(".s10-header, .s10-quien, .s10-est, .s10-n, .s10-pts, .s10-dias, .s10-aviso"), { opacity: 0 });
      gsap.set(qa(".s10-sellos circle"), { opacity: 0 });

      // el celular arranca medio dibujado y se acerca despacio
      dibujar(qa(".s10-d-cel"), 0, 0.5, 0.35);
      tl.fromTo(q(".s10-cel"), { scale: 0.97, svgOrigin: "540 920" }, { scale: 1.02, svgOrigin: "540 920", duration: DUR - 0.3, ease: "sine.inOut" }, 0);

      // "Scalerics Puntos"
      tl.fromTo(q(".s10-header"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, SCALERICS);
      dibujar([q(".s10-d-div")], SCALERICS + 0.1, 0.4);
      tl.to(q(".s10-marca-ac"), { opacity: 0.4, duration: 0.1, yoyo: true, repeat: 1 }, PUNTOS);
      etiqueta(0, SCALERICS);

      // "tu cliente": la tarjeta de Martín, con 80 puntos y 8 sellos
      dibujar(qa(".s10-d-card"), CLIENTE - 0.4, 0.45);
      tl.to(qa(".s10-quien, .s10-est"), { opacity: 1, duration: 0.3 }, CLIENTE - 0.05);
      pop(q(".s10-n1"), CLIENTE + 0.05, "540 915");
      tl.to(q(".s10-pts"), { opacity: 1, duration: 0.3 }, CLIENTE + 0.1);
      qa(".s10-sellos .ln-sello").forEach((c, i) => tl.to(c, { opacity: 1, duration: 0.1 }, CLIENTE + 0.05 + i * 0.02));
      llenos.slice(0, 8).forEach((c, i) => tl.to(c, { opacity: 1, duration: 0.1 }, CLIENTE + 0.15 + i * 0.03));

      // "suma con cada compra": 90, 100 y se llenan los sellos
      const subir = (de, a, sello, t) => {
        tl.to(de, { opacity: 0, y: -18, duration: 0.15 }, t);
        tl.fromTo(a, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, t + 0.1);
        tl.fromTo(sello, { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t + 0.1);
        tl.to(q(".s10-tarjeta"), { scale: 1.04, svgOrigin: "540 926", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t + 0.12);
      };
      subir(q(".s10-n1"), q(".s10-n2"), llenos[8], SUMA);
      subir(q(".s10-n2"), q(".s10-n3"), llenos[9], COMPRA);
      etiqueta(1, SUMA);

      // "lleva la tarjeta en el celular": punch del celular
      tl.to(q(".s10-cel"), { y: -14, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, LLEVA);
      tl.to(q(".s10-tarjeta"), { scale: 1.07, svgOrigin: "540 926", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, CELULAR);
      etiqueta(2, LLEVA + 0.2);

      // "si deja de venir": la tarjeta se apaga
      tl.to(q(".s10-tarjeta"), { opacity: 0.4, duration: 0.4 }, SI + 0.1);
      tl.fromTo(q(".s10-dias"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, VENIR - 0.2);
      etiqueta(3, SI);

      // "le llega un aviso": baja la notificación
      tl.to(q(".s10-header"), { opacity: 0, duration: 0.15 }, AVISO - 0.3);
      tl.fromTo(q(".s10-aviso"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, AVISO - 0.25);
      tl.to(q(".s10-cel"), { rotation: -2, svgOrigin: "540 1230", duration: 0.07, ease: "sine.inOut", yoyo: true, repeat: 5 }, AVISO);
      etiqueta(4, AVISO - 0.2);
      // "esperándote": la tarjeta vuelve a prenderse y el aviso late
      tl.to(q(".s10-aviso"), { scale: 1.06, svgOrigin: "540 687", duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, ESPERANDOTE);
      tl.to(q(".s10-tarjeta"), { opacity: 1, duration: 0.3 }, ESPERANDOTE);
      tl.to(q(".s10-dias"), { opacity: 0, duration: 0.3 }, ESPERANDOTE);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
