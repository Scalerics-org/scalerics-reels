        <g class="s05-p s05-p1"><g transform="scale(1.4)"><g class="s05-cuerpo"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g></g></g>
        <g class="s05-p s05-p2"><g transform="scale(1.4)"><g class="s05-cuerpo"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g></g></g>

  <script>
    (function () {
      const ID = "s05-nadie-noto";
      const DUR = 2.95;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const FUE = 0.09;
      const NADIE = 0.89;
      const NOTO = 1.49;
      const FALTABA = 1.89;

      let d = "";
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? 19 : 8;
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        d += (i === 0 ? "M" : "L") + (r * Math.cos(a)).toFixed(1) + " " + (r * Math.sin(a)).toFixed(1) + " ";
      }
      qa(".s05-est").forEach((p) => p.setAttribute("d", d + "Z"));

      const SUELO = 1110;
      const XS = { ".s05-p1": 220, ".s05-p2": 380, ".s05-medio": 540, ".s05-p4": 700, ".s05-p5": 860 };
      for (const k in XS) gsap.set(q(k), { x: XS[k], y: SUELO });

      // todo arranca visible con un pop rápido (el cuadro 0 no puede estar vacío)
      tl.fromTo(qa(".s05-p, .s05-medio"), { opacity: 0.5, y: SUELO + 16 }, { opacity: 1, y: SUELO, duration: 0.3, ease: "power3.out", stagger: 0.03 }, 0);
      tl.fromTo(q(".s05-suelo"), { scaleX: 0.6, svgOrigin: "540 1110" }, { scaleX: 1, svgOrigin: "540 1110", duration: 0.6, ease: "power3.out" }, 0);

      // "se fue": el del medio se vuelve silueta punteada
      gsap.set(qa(".s05-hueco, .s05-est-hueca"), { opacity: 0 });
      tl.to(q(".s05-solido"), { opacity: 0, filter: "blur(3px)", duration: 0.45, ease: "power2.in" }, FUE + 0.15);
      tl.to(q(".s05-est-llena"), { opacity: 0, duration: 0.45 }, FUE + 0.15);
      tl.to(qa(".s05-hueco, .s05-est-hueca"), { opacity: 1, duration: 0.45 }, FUE + 0.3);

      // "nadie notó": los otros cuatro se balancean como si nada
      qa(".s05-p .s05-cuerpo").forEach((c, i) => {
        tl.fromTo(c, { rotation: 0, svgOrigin: "0 0" }, { rotation: i % 2 ? 5 : -5, svgOrigin: "0 0", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, NADIE + i * 0.06);
      });
      tl.fromTo(q(".s05-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, NADIE);

      // "faltaba": el hueco se señala con un anillo verde y late
      const L = 2 * Math.PI * 122;
      gsap.set(q(".s05-anillo"), { opacity: 0 });
      tl.fromTo(q(".s05-anillo"), { opacity: 0, scale: 1.4, rotation: -30, svgOrigin: "540 1000" }, { opacity: 1, scale: 1, rotation: 0, svgOrigin: "540 1000", duration: 0.45, ease: "back.out(1.6)" }, NOTO + 0.1);
      tl.to(q(".s05-anillo"), { rotation: 40, svgOrigin: "540 1000", duration: DUR - NOTO - 0.5, ease: "none" }, NOTO + 0.55);
      tl.to(q(".s05-medio"), { scale: 1.1, transformOrigin: "50% 100%", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, FALTABA);
      tl.to(q(".s05-est-hueca"), { opacity: 0.2, duration: 0.1, yoyo: true, repeat: 3 }, FALTABA + 0.2);
      tl.to(qa(".s05-p"), { opacity: 0.45, duration: 0.4 }, FALTABA);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
