<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-nadie-escribio"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-nadie-escribio"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-nadie-escribio"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-nadie-escribio"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-nadie-escribio"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-nadie-escribio"] .estrella { fill: #5ce611; }
    [data-composition-id="s03-nadie-escribio"] .s03-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 32px; fill: #efeee5; }
    [data-composition-id="s03-nadie-escribio"] .s03-gris { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 28px; fill: rgba(239, 238, 229, 0.5); }
    [data-composition-id="s03-nadie-escribio"] .s03-gris-chico { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 26px; fill: rgba(239, 238, 229, 0.42); }
    [data-composition-id="s03-nadie-escribio"] .s03-cero { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 190px; fill: #5ce611; }
    [data-composition-id="s03-nadie-escribio"] .s03-rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.22em; fill: rgba(239, 238, 229, 0.62); }
    [data-composition-id="s03-nadie-escribio"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s03-nadie-escribio"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s03-nadie-escribio" data-width="1080" data-height="1920" data-duration="3.29">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="3.29" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s03-cel">
          <rect class="ln s03-dib-cel" x="290" y="640" width="360" height="600" rx="52" />
          <path class="ln s03-dib-cel" d="M430 668 H510" />
          <path class="ln-4 s03-dib-cel" d="M290 790 H650" />
          <g class="s03-cab">
            <circle class="ln-4" cx="350" cy="736" r="26" />
            <path class="estrella s03-est" d="" transform="translate(372 708) scale(0.62)" />
            <text class="s03-nombre" x="394" y="747">Martín</text>
          </g>
          <text class="s03-gris s03-sin" x="470" y="955" text-anchor="middle">Sin mensajes</text>
          <text class="s03-gris-chico s03-ult" x="470" y="1000" text-anchor="middle">Último: hace 2 meses</text>
          <rect class="ln-4 s03-dib-cel" x="318" y="1150" width="304" height="56" rx="28" />
          <path class="ln-ac s03-cursor" d="M346 1164 V1192" />
        </g>
        <g class="s03-contador">
          <text class="s03-cero" x="830" y="1010" text-anchor="middle">0</text>
          <text class="s03-rotulo" x="830" y="1064" text-anchor="middle">MENSAJES</text>
        </g>
        <g class="s03-badge"><g class="s03-b-in"><circle class="ln-ac" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
      </svg>
      <div class="etiqueta"><span class="s03-e1">Nadie le escribió</span><span class="s03-e2">Ni un mensaje</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-nadie-escribio";
      const DUR = 3.29;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const NADIE = 0.39;
      const ESCRIBIO = 0.89;
      const NI = 1.87;
      const MENSAJE = 2.09;

      let d = "";
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? 19 : 8;
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        d += (i === 0 ? "M" : "L") + (r * Math.cos(a)).toFixed(1) + " " + (r * Math.sin(a)).toFixed(1) + " ";
      }
      q(".s03-est").setAttribute("d", d + "Z");

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * 0.04 : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const etiqueta = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      // el celular arranca medio dibujado
      dibujar(qa(".s03-dib-cel"), 0, 0.5, 0.35);
      tl.fromTo(q(".s03-cab"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.08);
      tl.fromTo(q(".s03-cel"), { y: 20 }, { y: -10, duration: DUR, ease: "sine.out" }, 0);
      // el cursor titila (tweens finitos)
      gsap.set(q(".s03-cursor"), { opacity: 0 });
      for (let k = 0; k < 6; k++) {
        tl.to(q(".s03-cursor"), { opacity: 1, duration: 0.02 }, 0.2 + k * 0.5);
        tl.to(q(".s03-cursor"), { opacity: 0, duration: 0.02 }, 0.45 + k * 0.5);
      }

      // "nadie le escribió": chat vacío
      gsap.set(qa(".s03-sin, .s03-ult"), { opacity: 0 });
      tl.fromTo(q(".s03-sin"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, NADIE);
      tl.fromTo(q(".s03-ult"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, ESCRIBIO);
      etiqueta(q(".s03-e1"), NADIE);

      // "ni un mensaje": un cero grande verde con badge
      gsap.set(q(".s03-contador"), { opacity: 0 });
      tl.fromTo(q(".s03-contador"), { opacity: 0, scale: 0.6, svgOrigin: "830 960" }, { opacity: 1, scale: 1, svgOrigin: "830 960", duration: 0.4, ease: "back.out(2)" }, NI);
      gsap.set(q(".s03-badge"), { x: 900, y: 840 });
      gsap.set(q(".s03-b-in"), { opacity: 0 });
      tl.fromTo(q(".s03-b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, MENSAJE + 0.1);
      tl.to(q(".s03-cel"), { x: -6, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, MENSAJE + 0.12);
      tl.to(q(".s03-cel"), { opacity: 0.55, duration: 0.4 }, MENSAJE + 0.3);
      tl.to(q(".s03-e1"), { opacity: 0, duration: 0.15 }, NI - 0.3);
      etiqueta(q(".s03-e2"), NI);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
