<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s08-sin-ruido"] .s08-capa { position: absolute; inset: 0; }
    [data-composition-id="s08-sin-ruido"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s08-sin-ruido"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sin-ruido"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sin-ruido"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sin-ruido"] .punteada { fill: none; stroke: rgba(239, 238, 229, 0.45); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 11; }
    [data-composition-id="s08-sin-ruido"] .relleno { fill: #efeee5; }
    [data-composition-id="s08-sin-ruido"] .estrella { fill: #5ce611; }
    [data-composition-id="s08-sin-ruido"] .estrella-hueca { fill: none; stroke: rgba(92, 230, 17, 0.6); stroke-width: 3; stroke-linejoin: round; }
    [data-composition-id="s08-sin-ruido"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s08-sin-ruido"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s08-sin-ruido" data-width="1080" data-height="1920" data-duration="5.26">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="5.26" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s08-suelo" x1="110" y1="1150" x2="970" y2="1150" />
        <!-- la puerta del local -->
        <g class="s08-puerta">
          <path class="ln s08-d-puerta" d="M150 1150 V870 H330 V1150" />
          <path class="ln s08-d-puerta" d="M178 1150 V898 H302 V1150" />
          <circle class="ln-4 s08-d-puerta" cx="284" cy="1030" r="6" />
        </g>
        <!-- parlante: no hace ruido -->
        <g class="s08-parlante">
          <path class="ln s08-d-parl" d="M-56 -22 H-24 L18 -58 V58 L-24 22 H-56 Z" />
          <path class="ln s08-onda" d="M42 -30 Q62 0 42 30" />
          <path class="ln s08-onda" d="M66 -52 Q100 0 66 52" />
          <g class="s08-badge"><g class="s08-b-in"><circle class="ln-ac" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g></g>
        </g>
        <!-- el cliente que se va -->
        <g class="s08-cliente">
          <g transform="scale(1.35)">
            <g class="s08-solido">
              <circle class="ln" cx="0" cy="-96" r="14" />
              <path class="ln s08-piernas" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" />
              <path class="estrella s08-est" d="" transform="translate(0 -132)" />
            </g>
            <g class="s08-hueco">
              <circle class="punteada" cx="0" cy="-96" r="14" />
              <path class="punteada" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" />
              <path class="estrella-hueca s08-est" d="" transform="translate(0 -132)" />
            </g>
          </g>
        </g>
        <!-- burbuja vacía: no se queja -->
        <g class="s08-burbuja">
          <path class="ln-4" d="M-66 -40 H66 Q84 -40 84 -22 V18 Q84 36 66 36 H-20 L-44 58 L-40 36 H-66 Q-84 36 -84 18 V-22 Q-84 -40 -66 -40 Z" />
          <circle class="relleno" cx="-28" cy="-2" r="6" opacity="0.5" />
          <circle class="relleno" cx="0" cy="-2" r="6" opacity="0.5" />
          <circle class="relleno" cx="28" cy="-2" r="6" opacity="0.5" />
        </g>
      </svg>
      <div class="etiqueta"><span class="s08-e1">Sin hacer ruido</span><span class="s08-e2">Deja de venir</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-sin-ruido";
      const DUR = 5.26;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const RUIDO = 1.45;
      const NO2 = 1.75;
      const QUEJA = 2.45;
      const SIMPLEMENTE = 3.14;
      const DEJA = 3.95;

      let d = "";
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? 19 : 8;
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        d += (i === 0 ? "M" : "L") + (r * Math.cos(a)).toFixed(1) + " " + (r * Math.sin(a)).toFixed(1) + " ";
      }
      qa(".s08-est").forEach((p) => p.setAttribute("d", d + "Z"));

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * 0.05 : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const etiqueta = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      const SUELO = 1150;
      // el cliente camina de la puerta hacia la derecha durante toda la escena
      const X0 = 330, X1 = 820, TCAM = 4.2;
      const xEn = (t) => X0 + ((X1 - X0) * t) / TCAM;
      gsap.set(q(".s08-cliente"), { x: X0, y: SUELO });
      gsap.set(q(".s08-parlante"), { x: 520, y: 720 });
      gsap.set(q(".s08-badge"), { x: 96, y: -62 });

      dibujar(qa(".s08-d-puerta"), 0, 0.5, 0.35);
      tl.fromTo(q(".s08-suelo"), { scaleX: 0.6, svgOrigin: "540 1150" }, { scaleX: 1, svgOrigin: "540 1150", duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(q(".s08-cliente"), { x: X0 }, { x: X1, duration: TCAM, ease: "none" }, 0);
      tl.fromTo(q(".s08-piernas"), { rotation: -5, svgOrigin: "0 -40" }, { rotation: 5, svgOrigin: "0 -40", duration: 0.21, ease: "sine.inOut", yoyo: true, repeat: 19 }, 0);
      gsap.set(q(".s08-hueco"), { opacity: 0 });

      // "no hace ruido": el parlante, las ondas se apagan, badge X
      dibujar(qa(".s08-d-parl"), 0.3, 0.45);
      dibujar(qa(".s08-onda"), 0.6, 0.3);
      tl.to(qa(".s08-onda"), { opacity: 0, scale: 0.6, svgOrigin: "30 0", duration: 0.3, ease: "power2.in", stagger: 0.08 }, RUIDO - 0.15);
      gsap.set(q(".s08-b-in"), { opacity: 0 });
      tl.fromTo(q(".s08-b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, RUIDO + 0.05);
      etiqueta(q(".s08-e1"), RUIDO - 0.2);

      // "no se queja": una burbuja vacía que se desinfla
      tl.to(q(".s08-parlante"), { opacity: 0.4, duration: 0.3 }, NO2);
      const bx = xEn(QUEJA) + 110, by = 900;
      gsap.set(q(".s08-burbuja"), { x: bx, y: by, opacity: 0 });
      tl.fromTo(q(".s08-burbuja"), { opacity: 0, scale: 0.5, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, QUEJA - 0.2);
      tl.to(q(".s08-burbuja"), { x: bx + 70, duration: 0.6, ease: "none" }, QUEJA + 0.15);
      tl.to(q(".s08-burbuja"), { scale: 0.2, opacity: 0, duration: 0.3, ease: "power2.in" }, SIMPLEMENTE - 0.15);

      // "deja de venir": el cliente se vuelve punteado y se va
      tl.to(q(".s08-solido"), { opacity: 0, duration: 0.35 }, DEJA - 0.1);
      tl.to(q(".s08-hueco"), { opacity: 1, duration: 0.3 }, DEJA - 0.1);
      tl.to(q(".s08-hueco"), { opacity: 0, filter: "blur(3px)", duration: 0.5, ease: "power2.in" }, DEJA + 0.45);
      tl.to(q(".s08-puerta"), { opacity: 0.5, duration: 0.5 }, DEJA + 0.2);
      tl.to(q(".s08-e1"), { opacity: 0, duration: 0.2 }, SIMPLEMENTE);
      etiqueta(q(".s08-e2"), SIMPLEMENTE + 0.1);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
