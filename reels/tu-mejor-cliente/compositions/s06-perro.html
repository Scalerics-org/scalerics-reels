    [data-composition-id="s06-perro"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }

  </style>
  <div id="root" data-composition-id="s06-perro" data-width="1080" data-height="1920" data-duration="3.53">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="3.53" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- el perro (mirando a la derecha) -->
        <g class="s06-perro">
          <g class="s06-perro-in">
            <rect class="ln s06-d-perro" x="-110" y="-50" width="170" height="74" rx="36" />

            <circle class="ln s06-d-perro" cx="92" cy="-100" r="42" />

          <rect class="ln s06-d-ficha" x="610" y="830" width="330" height="250" rx="26" />

    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-perro";
      const DUR = 3.53;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SABES = 0.44;
      const PERRO = 1.44;
      const PERO = 1.99;
      const TENES = 2.14;
      const TELEFONO = 2.54;

      let d = "";
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? 19 : 8;
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        d += (i === 0 ? "M" : "L") + (r * Math.cos(a)).toFixed(1) + " " + (r * Math.sin(a)).toFixed(1) + " ";
      }
      q(".s06-est").setAttribute("d", d + "Z");

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * 0.04 : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const etiqueta = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      gsap.set(q(".s06-perro"), { x: 330, y: 950 });

      // el perro arranca medio dibujado y mueve la cola
      dibujar(qa(".s06-d-perro"), 0, 0.5, 0.35);
      tl.fromTo(q(".s06-ojo"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.2);
      dibujar([q(".s06-collar")], 0.25, 0.3);
      gsap.set(q(".s06-chapa"), { opacity: 0 });
      tl.fromTo(q(".s06-chapa"), { opacity: 0, scale: 0.4, svgOrigin: "78 -44" }, { opacity: 1, scale: 1, svgOrigin: "78 -44", duration: 0.3, ease: "back.out(2.4)" }, SABES);
      tl.fromTo(q(".s06-cola"), { rotation: -14, svgOrigin: "-108 -30" }, { rotation: 14, svgOrigin: "-108 -30", duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.1);
      tl.fromTo(q(".s06-perro-in"), { y: 0 }, { y: -6, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.2);
      etiqueta(q(".s06-e1"), SABES);

      // "perro": la placa con su nombre
      gsap.set(q(".s06-placa"), { opacity: 0 });
      tl.fromTo(q(".s06-placa"), { opacity: 0, scale: 0.85, svgOrigin: "0 160" }, { opacity: 1, scale: 1, svgOrigin: "0 160", duration: 0.35, ease: "back.out(1.6)" }, PERRO - 0.1);
      dibujar([q(".s06-tilde")], PERRO + 0.2, 0.25);

      // "pero no tenés su teléfono": la ficha, vacía
      dibujar(qa(".s06-d-ficha"), PERO - 0.15, 0.45);
      gsap.set(qa(".s06-est, .s06-nombre, .s06-tel, .s06-punto"), { opacity: 0 });
      tl.to(qa(".s06-est, .s06-nombre"), { opacity: 1, duration: 0.25 }, PERO + 0.1);
      tl.to(q(".s06-tel"), { opacity: 1, duration: 0.25 }, TENES + 0.1);
      qa(".s06-punto").forEach((p, i) => {
        tl.to(p, { opacity: 1, duration: 0.1 }, TENES + 0.2 + i * 0.08);
        tl.to(p, { y: -8, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, TELEFONO + i * 0.08);
      });
      tl.to(q(".s06-perro"), { opacity: 0.5, duration: 0.35 }, PERO);
      gsap.set(q(".s06-badge"), { x: 932, y: 834 });
      gsap.set(q(".s06-b-in"), { opacity: 0 });
      tl.fromTo(q(".s06-b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, TELEFONO + 0.15);
      tl.to(q(".s06-ficha"), { x: -6, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, TELEFONO + 0.17);
      tl.to(q(".s06-e1"), { opacity: 0, duration: 0.2 }, PERO - 0.1);
      etiqueta(q(".s06-e2"), PERO);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
