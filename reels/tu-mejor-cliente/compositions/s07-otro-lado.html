  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s07-otro-lado"] .s07-capa { position: absolute; inset: 0; }

    [data-composition-id="s07-otro-lado"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s07-otro-lado"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s07-otro-lado"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s07-otro-lado"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.4); stroke-width: 4; stroke-linecap: round; }
    [data-composition-id="s07-otro-lado"] .relleno { fill: #5ce611; }
    [data-composition-id="s07-otro-lado"] .estrella { fill: #5ce611; }
    [data-composition-id="s07-otro-lado"] .s07-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s07-otro-lado"] .s07-num { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 50px; fill: #5ce611; }
    [data-composition-id="s07-otro-lado"] .s07-gris { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 26px; fill: rgba(239, 238, 229, 0.55); }
    [data-composition-id="s07-otro-lado"] .s07-burbuja-txt { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 29px; fill: #0b1d35; }
    [data-composition-id="s07-otro-lado"] .s07-rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: rgba(239, 238, 229, 0.62); }
    [data-composition-id="s07-otro-lado"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s07-otro-lado"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s07-otro-lado" data-width="1080" data-height="1920" data-duration="5.66">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="5.66" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s07-todo">
          <!-- 1: libreta, lo anotaron -->
          <g class="s07-libreta">
            <g class="s07-libreta-in">
              <rect class="ln s07-d1" x="-92" y="-112" width="184" height="224" rx="16" />
              <path class="ln s07-d1" d="M-48 -126 V-98 M0 -126 V-98 M48 -126 V-98" />
            </g>
            <g class="s07-anotado">
              <circle class="ln-4" cx="-52" cy="-46" r="18" />
              <path class="estrella s07-est" d="" transform="translate(-36 -70) scale(0.5)" />
              <text class="s07-nombre" x="-24" y="-36">Martín</text>
              <path class="ln-tenue s07-renglon" d="M-62 12 H62" />
              <path class="ln-tenue s07-renglon" d="M-62 52 H30" />
            </g>
            <text class="s07-rotulo s07-r1" x="0" y="190" text-anchor="middle">ANOTADO</text>
          </g>
          <!-- 2: tarjeta de puntos -->
          <g class="s07-tarjeta">
            <g class="s07-tarjeta-in">
              <rect class="ln s07-d2" x="-104" y="-66" width="208" height="132" rx="16" />
              <path class="ln s07-d2" d="M-104 -30 H104" />
              <text class="s07-num s07-n1" x="0" y="42" text-anchor="middle">+10</text>
              <text class="s07-num s07-n2" x="0" y="42" text-anchor="middle">+20</text>
            </g>
            <text class="s07-rotulo s07-r2" x="0" y="190" text-anchor="middle">PUNTOS</text>
          </g>
          <!-- 3: celular, le escribieron -->
          <g class="s07-cel">
            <g class="s07-cel-in">
              <rect class="ln s07-d3" x="-96" y="-150" width="192" height="300" rx="34" />
              <path class="ln s07-d3" d="M-22 -128 H22" />
              <text class="s07-gris s07-dias" x="0" y="-62" text-anchor="middle">7 días</text>
              <g class="s07-burbuja">
                <rect class="relleno" x="-80" y="-22" width="160" height="64" rx="18" />
                <path class="relleno" d="M44 36 L66 56 L64 30 Z" />
                <text class="s07-burbuja-txt" x="0" y="19" text-anchor="middle">¿Volvés?</text>
              </g>
            </g>
            <text class="s07-rotulo s07-r3" x="0" y="190" text-anchor="middle">MENSAJE</text>
          </g>
          <!-- flechas -->
          <path class="ln-ac s07-f1" d="M336 930 H414" />
          <path class="ln-ac s07-p1" d="M400 914 L418 930 L400 946" />
          <path class="ln-ac s07-f2" d="M654 930 H734" />
          <path class="ln-ac s07-p2" d="M720 914 L738 930 L720 946" />
        </g>
      </svg>
      <div class="etiqueta"><span class="s07-e1">En otro lado</span><span class="s07-e2">Le escribieron</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s07-otro-lado";
      const DUR = 5.66;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const OTRO = 0.11;
      const ANOTARON = 0.91;
      const SUMARON = 1.81;
      const PUNTOS = 2.11;
      const CUANDO = 3.11;
      const SEMANA = 3.71;
      const ESCRIBIERON = 4.41;

      let d = "";
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? 19 : 8;
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        d += (i === 0 ? "M" : "L") + (r * Math.cos(a)).toFixed(1) + " " + (r * Math.sin(a)).toFixed(1) + " ";
      }
      q(".s07-est").setAttribute("d", d + "Z");

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const ti = t > 0 ? t + i * 0.05 : 0;
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const etiqueta = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const rotulo = (el, t) => tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
      const golpe = (el, t) => tl.to(el, { scale: 1.08, transformOrigin: "50% 50%", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);

      const Y = 930;
      gsap.set(q(".s07-libreta"), { x: 230, y: Y });
      gsap.set(q(".s07-tarjeta"), { x: 540, y: Y });
      gsap.set(q(".s07-cel"), { x: 850, y: Y });
      gsap.set(qa(".s07-anotado, .s07-num, .s07-dias, .s07-burbuja, .s07-rotulo"), { opacity: 0 });
      tl.fromTo(q(".s07-todo"), { scale: 1.04, svgOrigin: "540 930" }, { scale: 1, svgOrigin: "540 930", duration: DUR, ease: "none" }, 0);

      // "en otro lado": la libreta arranca medio dibujada
      dibujar(qa(".s07-d1"), 0, 0.5, 0.35);
      etiqueta(q(".s07-e1"), OTRO);

      // "lo anotaron": aparece Martín en la libreta
      tl.fromTo(q(".s07-anotado"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, ANOTARON - 0.1);
      golpe(q(".s07-libreta-in"), ANOTARON + 0.1);
      rotulo(q(".s07-r1"), ANOTARON);
      dibujar([q(".s07-f1")], ANOTARON + 0.45, 0.3);
      tl.fromTo(q(".s07-p1"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, ANOTARON + 0.7);

      // "le sumaron puntos": la tarjeta, +10 y +20
      dibujar(qa(".s07-d2"), SUMARON - 0.2, 0.45);
      tl.fromTo(q(".s07-n1"), { opacity: 0, scale: 0.6, svgOrigin: "0 24" }, { opacity: 1, scale: 1, svgOrigin: "0 24", duration: 0.3, ease: "back.out(2)" }, PUNTOS);
      tl.to(q(".s07-n1"), { opacity: 0, y: -16, duration: 0.15 }, PUNTOS + 0.5);
      tl.fromTo(q(".s07-n2"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, PUNTOS + 0.6);
      golpe(q(".s07-tarjeta-in"), PUNTOS + 0.62);
      rotulo(q(".s07-r2"), PUNTOS);
      dibujar([q(".s07-f2")], PUNTOS + 0.8, 0.3);
      tl.fromTo(q(".s07-p2"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, PUNTOS + 1.05);

      // "cuando faltó una semana": el celular; "7 días"
      dibujar(qa(".s07-d3"), CUANDO - 0.05, 0.5);
      tl.fromTo(q(".s07-dias"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, SEMANA - 0.1);
      rotulo(q(".s07-r3"), SEMANA);

      // "le escribieron": entra la burbuja verde
      tl.fromTo(q(".s07-burbuja"), { opacity: 0, scale: 0.5, svgOrigin: "0 10" }, { opacity: 1, scale: 1, svgOrigin: "0 10", duration: 0.4, ease: "back.out(2)" }, ESCRIBIERON);
      golpe(q(".s07-cel-in"), ESCRIBIERON + 0.25);
      tl.to(qa(".s07-libreta, .s07-tarjeta, .s07-f1, .s07-p1, .s07-f2, .s07-p2"), { opacity: 0.45, duration: 0.4 }, ESCRIBIERON + 0.2);
      tl.to(q(".s07-e1"), { opacity: 0, duration: 0.2 }, ESCRIBIERON - 0.1);
      etiqueta(q(".s07-e2"), ESCRIBIERON);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
