  <script>
    (function () {
      const ID = "s10-genia";
      const DUR = 7.6;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const pop = (el, t, s) => tl.fromTo(el, { opacity: 0, scale: s ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      const etiq = (a, b, t) => { if (a) tl.to(q(a), { opacity: 0, y: -12, duration: 0.2 }, t); tl.fromTo(q(b), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3 }, t + 0.1); };

      const MARTA = 0.5, GENIA = 1.21, PROBLEMA = 1.91, NEGOCIO = 2.69, VIVE = 3.56, CABEZA = 4.26, PLAYA = 6.25;

      tl.fromTo(q(".s10-escenario"), { scale: 1.06 }, { scale: 1, duration: 3, ease: "power1.out", transformOrigin: "50% 50%" }, 0);
      tl.fromTo(q(".s10-marta"), { y: 60, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
      gsap.set([q(".s10-medalla"), q(".s10-sello"), q(".s10-corte"), q(".s10-sombrero"), q(".s10-playa")], { opacity: 0 });
      // "Marta ... genia": medalla y sello
      tl.fromTo(q(".s10-medalla"), { opacity: 0, y: -80 }, { opacity: 1, y: 0, duration: 0.4, ease: "bounce.out" }, MARTA);
      tl.fromTo(q(".s10-sello"), { opacity: 0, scale: 2.2, svgOrigin: "800 720" }, { opacity: 1, scale: 1, svgOrigin: "800 720", duration: 0.14, ease: "power4.in" }, GENIA);
      etiq(null, ".s10-e1", GENIA);
      // "El problema": se abre la cabeza como una radiografía
      tl.to(q(".s10-sello"), { opacity: 0, duration: 0.2 }, PROBLEMA - 0.2);
      tl.to(q(".s10-cara"), { opacity: 0, duration: 0.2 }, PROBLEMA - 0.1);
      tl.fromTo(q(".s10-corte"), { opacity: 0, scale: 0.2, svgOrigin: "540 850" }, { opacity: 1, scale: 1, svgOrigin: "540 850", duration: 0.4, ease: "back.out(1.4)" }, PROBLEMA - 0.1);
      tl.fromTo(q(".s10-local"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, NEGOCIO - 0.1);
      ["k1", "k2", "k3", "k4", "k5"].forEach((k, i) => pop(q(".s10-" + k), NEGOCIO + 0.25 + i * 0.15, 0.3));
      // "vive": las cosas se arremolinan
      tl.to(q(".s10-cosas"), { rotation: 360, svgOrigin: "540 850", duration: 2.4, ease: "power1.inOut" }, VIVE);
      etiq(".s10-e1", ".s10-e2", VIVE);
      tl.to(q(".s10-corte"), { scale: 1.05, svgOrigin: "540 850", duration: 0.15, yoyo: true, repeat: 3 }, CABEZA);
      // "playa": sombrero, sol, arena y olas
      tl.to(q(".s10-corte"), { opacity: 0, scale: 0.7, svgOrigin: "540 850", duration: 0.3 }, PLAYA - 0.5);
      tl.to(q(".s10-cara"), { opacity: 1, duration: 0.2 }, PLAYA - 0.4);
      tl.fromTo(q(".s10-sombrero"), { opacity: 0, y: -300 }, { opacity: 1, y: 0, duration: 0.4, ease: "bounce.out" }, PLAYA - 0.3);
      tl.fromTo(q(".s10-playa"), { opacity: 0 }, { opacity: 1, duration: 0.35 }, PLAYA - 0.2);
      tl.fromTo(q(".s10-ola"), { x: 0 }, { x: -200, duration: 1.5, ease: "none" }, PLAYA - 0.2);
      tl.to(q(".s10-marta"), { rotation: -3, svgOrigin: "540 1330", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, PLAYA + 0.1);
      etiq(".s10-e2", ".s10-e3", PLAYA - 0.2);

      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
