    (function () {
      const ID = "s03-debemos";
      const DUR = 3.62;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);

      const CUANTO = 0, NADIE = 1.25, MARTA = 2.82;

      tl.fromTo(q(".s03-escenario"), { scale: 1.05 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);

        tl.to(op.querySelector(".s03-hombros"), { y: -26, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, repeatDelay: 0.35 }, NADIE + i * 0.08);
