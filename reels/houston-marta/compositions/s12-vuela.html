      const ID = "s12-vuela";

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(pos, { a: Math.PI * 0.9 }, { a: Math.PI * 3.2, duration: DUR, ease: "none", onUpdate: ubicar }, 0);

      // "Marta vuelve": entra desde abajo, la pantalla se achica de fondo
