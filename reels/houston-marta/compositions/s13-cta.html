          <g class="s13-polaroid"><g transform="translate(540 940) rotate(-4)">

  <script>
    (function () {
      const ID = "s13-cta";
      const DUR = 5.31;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, Math.max(0, t + i * 0.04));
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      const MARTA = 0.74, NEGOCIO = 1.2;

      tl.fromTo(q(".s13-escenario"), { scale: 1.05 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);
      tl.fromTo(q(".s13-polaroid"), { opacity: 0, y: 200, rotation: 10, svgOrigin: "540 940" }, { opacity: 1, y: 0, rotation: 0, svgOrigin: "540 940", duration: 0.5, ease: "back.out(1.3)" }, 0);
      tl.fromTo(q(".s13-arroba"), { opacity: 0, scale: 0.2, svgOrigin: "800 700" }, { opacity: 1, scale: 1, svgOrigin: "800 700", duration: 0.4, ease: "back.out(2.2)" }, 0.15);
      tl.fromTo(q(".s13-etiqueta"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3 }, 0.2);
      dibujar([q(".s13-flecha"), q(".s13-punta")], MARTA - 0.1, 0.35);
      tl.fromTo(q(".s13-preg"), { scale: 0.4, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, MARTA);
      // queda latiendo hasta el final
      tl.to(q(".s13-arroba"), { scale: 1.1, svgOrigin: "800 700", duration: 0.45, yoyo: true, repeat: 7, ease: "sine.inOut" }, NEGOCIO);
      tl.to(q(".s13-preg"), { rotation: 10, transformOrigin: "50% 50%", duration: 0.5, yoyo: true, repeat: 6, ease: "sine.inOut" }, NEGOCIO + 0.2);
      tl.to(q(".s13-polaroid"), { y: -10, duration: 1, yoyo: true, repeat: 3, ease: "sine.inOut" }, NEGOCIO);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
