<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    /* luces de alarma rojas que giran (dos balizas arriba) */
    [data-composition-id="ambiente"] .amb-baliza { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; opacity: 0;
      background: radial-gradient(circle, rgba(215, 38, 61, 0.34) 0%, rgba(215, 38, 61, 0.12) 40%, rgba(215, 38, 61, 0) 70%); }
    /* luz cálida de la calma */
    [data-composition-id="ambiente"] .amb-calma { position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(ellipse 780px 900px at 540px 900px, rgba(255, 176, 0, 0.12) 0%, rgba(255, 176, 0, 0.04) 50%, rgba(255, 176, 0, 0) 80%); }
    /* líneas de barrido de monitor de fósforo */
    [data-composition-id="ambiente"] .amb-lineas { position: absolute; left: 0; top: -40px; width: 1080px; height: 2000px; opacity: 0.16;
      background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 3px, rgba(0, 0, 0, 0.55) 3px, rgba(0, 0, 0, 0.55) 5px); }
    [data-composition-id="ambiente"] .amb-barrido { position: absolute; left: 0; top: -300px; width: 1080px; height: 260px; opacity: 0.5;
      background: linear-gradient(180deg, rgba(255, 244, 224, 0) 0%, rgba(255, 244, 224, 0.035) 60%, rgba(255, 244, 224, 0) 100%); }
    [data-composition-id="ambiente"] .amb-ruido { position: absolute; left: -100px; top: -100px; width: 1280px; height: 2120px; opacity: 0; }
    [data-composition-id="ambiente"] .amb-grano { position: absolute; left: -100px; top: -100px; width: 1280px; height: 2120px; opacity: 0.07; mix-blend-mode: screen; }
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 700px 1060px at 540px 930px, rgba(7, 21, 30, 0) 55%, rgba(7, 21, 30, 0.88) 100%); }
    [data-composition-id="ambiente"] .amb-rotulo { position: absolute; left: 60px; top: 1610px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 24px; letter-spacing: 0.2em; color: #e8dcc0; opacity: 0.6; line-height: 1.5; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-rojo { color: #d7263d; }
    [data-composition-id="ambiente"] .amb-ambar { color: #ffb000; }
    [data-composition-id="ambiente"] .amb-r2 { opacity: 0; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="71.39">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="71.39" data-track-index="0">
      <div class="amb-baliza amb-b1" style="left: -560px; top: -520px"></div>
      <div class="amb-baliza amb-b2" style="left: 540px; top: -520px"></div>
      <div class="amb-calma"></div>
      <svg class="amb-ruido" viewBox="0 0 1280 2120" aria-hidden="true">
        <filter id="amb-f-ruido"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="1280" height="2120" filter="url(#amb-f-ruido)" />
      </svg>
      <svg class="amb-grano" viewBox="0 0 1280 2120" aria-hidden="true">
        <filter id="amb-f-grano"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="21" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="1280" height="2120" filter="url(#amb-f-grano)" />
      </svg>
      <div class="amb-lineas"></div>
      <div class="amb-barrido"></div>
      <div class="amb-vineta"></div>
      <div class="amb-rotulo amb-r1" data-layout-ignore>CONTROL DE MISIÓN · LOCAL 1<br /><span class="amb-rojo">●</span> ALERTA</div>
      <div class="amb-rotulo amb-r2" data-layout-ignore>CONTROL DE MISIÓN · LOCAL 1<br /><span class="amb-ambar">●</span> TODO EN ORDEN</div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 71.39;
      const CALMA = 42.27; // "Ojo: Marta es una genia": se apagan las alarmas
      const SCALERICS = 49.87; // "En Scalerics": luz cálida
      const SENAL = [36.24]; // "Perdimos la señal": ruido de pantalla
      const RADIO = [13.95, 23.3, 32.15]; // conexiones de radio con Marta: ruido corto
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // balizas: laten alternadas mientras dura la crisis
      const P = 0.9;
      const N = Math.floor(CALMA / P);
      tl.fromTo(q(".amb-b1"), { opacity: 0.15 }, { opacity: 0.9, duration: P / 2, ease: "sine.inOut", yoyo: true, repeat: N * 2 - 1 }, 0);
      tl.fromTo(q(".amb-b2"), { opacity: 0.9 }, { opacity: 0.15, duration: P / 2, ease: "sine.inOut", yoyo: true, repeat: N * 2 - 1 }, 0);
      tl.to([q(".amb-b1"), q(".amb-b2")], { opacity: 0, duration: 0.8, ease: "power2.out", overwrite: false }, CALMA);
      tl.to(q(".amb-calma"), { opacity: 1, duration: 1.4, ease: "power2.out" }, SCALERICS);
      tl.to(q(".amb-r1"), { opacity: 0, duration: 0.3 }, SCALERICS);
      tl.to(q(".amb-r2"), { opacity: 0.6, duration: 0.3 }, SCALERICS + 0.3);

      // barrido de monitor que baja en loop
      const V = 2.6;
      tl.fromTo(q(".amb-barrido"), { y: 0 }, { y: 2300, duration: V, ease: "none", repeat: Math.floor(DUR / V) - 1 }, 0);
      tl.fromTo(q(".amb-lineas"), { y: 0 }, { y: 40, duration: DUR, ease: "none" }, 0);
      tl.to(q(".amb-grano"), { x: 90, y: -70, duration: DUR, ease: "steps(" + Math.round(DUR * 12) + ")" }, 0);

      // ruido de radio
      const ruido = (t, d, o) => {
        tl.set(q(".amb-ruido"), { opacity: o }, t);
        tl.to(q(".amb-ruido"), { x: 60, y: -40, duration: d, ease: "steps(" + Math.round(d * 20) + ")" }, t);
        tl.set(q(".amb-ruido"), { opacity: 0, x: 0, y: 0 }, t + d);
      };
      RADIO.forEach((t) => ruido(t, 0.3, 0.22));
      SENAL.forEach((t) => ruido(t, 0.9, 0.45));

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
