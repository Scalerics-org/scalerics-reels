    (function () {
      const ID = "s04-piriapolis";
      const DUR = 7.43;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, Math.max(0, t + i * 0.04));
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, s) => tl.fromTo(el, { opacity: 0, scale: s ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);

      const PIRIAPOLIS = 0.81, HOLA = 2.13, TRANQUILOS = 3.89, AZUL = 6.05;

      tl.fromTo(q(".s04-escenario"), { scale: 1.04 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);

      dibujar([q(".s04-costa")], 0, 0.6, 0.5);
      dibujar([q(".s04-enlace")], 0.2, PIRIAPOLIS);
      tl.set(q(".s04-enlace"), { strokeDasharray: "14 12", strokeDashoffset: 0 }, PIRIAPOLIS + 0.25);
      tl.to(q(".s04-enlace"), { strokeDashoffset: -104, duration: 1.0, ease: "none" }, PIRIAPOLIS + 0.25);
      tl.fromTo(q(".s04-ondas"), { scale: 0.4, opacity: 1, svgOrigin: "800 1010" }, { scale: 1.6, opacity: 0, svgOrigin: "800 1010", duration: 0.6, repeat: 2, ease: "power1.out" }, PIRIAPOLIS);
      for (let k = 0; k < 6; k++) tl.set(q(".s04-conectando"), { opacity: k % 2 ? 1 : 0.2 }, 0.2 + k * 0.25);

      // "Hola": se abre la cámara de la playa

      tl.to(q(".s04-mapa"), { opacity: 0, duration: 0.15 }, HOLA - 0.25);
      tl.fromTo(q(".s04-playa"), { opacity: 0, scaleY: 0.02, svgOrigin: "540 960" }, { opacity: 1, scaleY: 1, svgOrigin: "540 960", duration: 0.3, ease: "power3.out" }, HOLA - 0.2);
      tl.to(q(".s04-e1"), { opacity: 0, y: -12, duration: 0.2 }, HOLA);
      tl.fromTo(q(".s04-e2"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3 }, HOLA + 0.1);
      // olas y sol, todo el tiempo

      tl.fromTo(q(".s04-ola2"), { x: -200 }, { x: 0, duration: 5, ease: "none" }, HOLA - 0.2);
      tl.fromTo(q(".s04-mar"), { y: 0 }, { y: 8, duration: 0.9, yoyo: true, repeat: 5, ease: "sine.inOut" }, HOLA - 0.2);
      tl.fromTo(q(".s04-sol"), { scale: 1, svgOrigin: "820 720" }, { scale: 1.08, svgOrigin: "820 720", duration: 1.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, HOLA);
      tl.fromTo(q(".s04-sombrilla"), { rotation: -2, svgOrigin: "390 760" }, { rotation: 2, svgOrigin: "390 760", duration: 1.1, yoyo: true, repeat: 4, ease: "sine.inOut" }, HOLA);
      tl.fromTo(q(".s04-senal"), { opacity: 0, x: 10 }, { opacity: 1, x: -20, duration: 0.5, repeat: 8, ease: "power1.out" }, HOLA);
      // "Tranquilos": Marta se acomoda y toma mate

      // "azul": el cuaderno azul, como si estuviera ahí nomás
