      const DUR = 9.32;

      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      const dibujar = (sel, t, d) => { const p = q(sel); const L = p.getTotalLength(); gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 }); tl.to(p, { opacity: 1, duration: 0.01 }, t); tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t); };

        tl.to(q(".s10-meca"), { rotation: r, svgOrigin: "540 1460", duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 0.1);

      tl.to(q(".s10-brazos"), { y: -6, duration: 0.12, yoyo: true, repeat: 17, ease: "sine.inOut" }, MOSTRADOR);
