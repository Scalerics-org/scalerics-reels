  <script>
    (function () {
      const ID = "s04-tu-box";
      const DUR = 3.32;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s04-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, s = 2.4) => { gsap.set(q(sel), { opacity: 0 }); tl.fromTo(q(sel), { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1); };
      const dibujar = (sel, t, d) => { const p = q(sel); const L = p.getTotalLength(); gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 }); tl.to(p, { opacity: 1, duration: 0.01 }, t); tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t); };

      const BOX = 0.36;
      const MECANICO = 0.99;
      const LLAVE = 2.41;

      // cuadro 0: el marco a medio dibujar, el auto ya está
      const m = q(".s04-marco"); const Lm = m.getTotalLength();
      tl.fromTo(m, { strokeDasharray: Lm, strokeDashoffset: Lm * 0.5 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 0);
      tl.fromTo(q(".s04-auto"), { x: -60, opacity: 0.6 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      golpe(".s04-cartelg", BOX, 1.6);
      // el auto sube al gato
      dibujar(".s04-gato", BOX, 0.3);
      tl.to(q(".s04-auto"), { y: -18, rotation: -1.5, svgOrigin: "560 1272", duration: 0.25, ease: "power2.out" }, BOX + 0.25);

      // "mecánico": aparece revolviendo la caja
      dibujar(".s04-caja", MECANICO - 0.35, 0.35);
      gsap.set(q(".s04-meca"), { opacity: 0 });
      tl.fromTo(q(".s04-meca"), { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, MECANICO - 0.15);
      tl.to(q(".s04-brazos"), { x: -8, y: 10, duration: 0.09, yoyo: true, repeat: 15, ease: "sine.inOut" }, MECANICO + 0.1);
      gsap.set(q(".s04-etiqueta"), { opacity: 0 });
      tl.fromTo(q(".s04-etiqueta"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22, immediateRender: false }, MECANICO);

      // "llave": signos de pregunta y el cartel
      [".s04-p1", ".s04-p2", ".s04-p3"].forEach((s, i) => {
        gsap.set(q(s), { opacity: 0 });
        tl.fromTo(q(s), { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)", immediateRender: false }, LLAVE - 0.6 + i * 0.12);
      });
      golpe(".s04-llave", LLAVE, 2.4);
      sacudon(LLAVE + 0.04, 1.1);

      tl.to(q("#s04-escena"), { x: 300, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
