    (function () {
      const ID = "s05-llave";
      const DUR = 5.56;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s05-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

        tl.to(el, { opacity: 1, duration: 0.05 }, t);
        tl.to(el, { x, y, rotation: r, duration: 0.45, ease: "power2.out" }, t);
        tl.to(el, { y: y + 30, rotation: r + 15, duration: 1.2, ease: "sine.inOut" }, t + 0.45);

      // "Decile": sube la pit board, el texto de arriba se va

      tl.to(q(".s05-cosa"), { opacity: 0.35, duration: 0.3 }, DECILE);
