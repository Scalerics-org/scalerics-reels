<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-radio"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-radio"] .s03-escenario { position: absolute; inset: 0; }
    [data-composition-id="s03-radio"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-radio"] .linea { fill: none; stroke: #f4f4f1; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-radio"] .s03-cab { position: absolute; left: 150px; top: 610px; height: 84px; display: flex; transform: skewX(-10deg); box-shadow: 0 8px 0 rgba(0, 0, 0, 0.45); }
    [data-composition-id="s03-radio"] .s03-cab > div { display: flex; align-items: center; padding: 0 26px; }
    [data-composition-id="s03-radio"] .s03-cab span { display: block; transform: skewX(10deg); white-space: nowrap; line-height: 1; font-family: "Lexend", sans-serif; font-weight: 900; font-size: 44px; text-transform: uppercase; }
    [data-composition-id="s03-radio"] .s03-r { background: #ffd100; color: #0b0c0f; }
    [data-composition-id="s03-radio"] .s03-q { background: #16181d; color: #f4f4f1; border-right: 10px solid #ffd100; }
    [data-composition-id="s03-radio"] .s03-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; line-height: 1; white-space: nowrap; }
    [data-composition-id="s03-radio"] .s03-box { top: 1150px; font-weight: 900; font-size: 110px; color: #ffd100; text-transform: uppercase; transform: skewX(-10deg); letter-spacing: -0.01em; }
    [data-composition-id="s03-radio"] .s03-p1 { top: 1300px; font-weight: 700; font-size: 58px; color: #f4f4f1; }
    [data-composition-id="s03-radio"] .s03-p2 { top: 1386px; font-weight: 700; font-size: 58px; color: #f4f4f1; }
  </style>
  <div id="root" data-composition-id="s03-radio" data-width="1080" data-height="1920" data-duration="3.74">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="3.74" data-track-index="0">
      <div class="s03-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- casco del piloto (el cliente) -->
          <g class="s03-casco">
            <path class="linea s03-casco-c" d="M420 900 C420 800 480 750 560 750 C640 750 690 810 690 880 V930 H470 C440 930 420 920 420 900 Z" />
            <path class="s03-visor" d="M520 820 H680 V870 H520 Z" fill="#ffd100" />
            <path class="linea s03-casco-l" d="M440 900 H690" />
          </g>
          <!-- la onda de la radio -->
          <g class="s03-onda"></g>
          <path class="linea s03-base" d="M180 1060 H900" opacity="0.25" />
        </svg>
        <div class="s03-cab"><div class="s03-r"><span>Radio</span></div><div class="s03-q"><span>Tu cliente</span></div></div>
        <div class="s03-txt s03-box">“Box, box.”</div>
        <div class="s03-txt s03-p1">“Hola, ¿cuánto sale?”</div>
        <div class="s03-txt s03-p2">“¿Tenés turno para mañana?”</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-radio";
      const DUR = 3.74;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const golpe = (sel, t, s = 2.4) => { gsap.set(q(sel), { opacity: 0 }); tl.fromTo(q(sel), { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1); };

      const BOX = 0.0;
      const HOLA = 0.83;
      const TENES = 2.05;

      // la onda: 25 barras que laten con la voz (determinista: función del tiempo)
      const NS = "http://www.w3.org/2000/svg";
      const g = q(".s03-onda");
      const barras = [];
      for (let i = 0; i < 25; i++) {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", 186 + i * 28.5); r.setAttribute("width", 16); r.setAttribute("rx", 8); r.setAttribute("fill", "#ffd100");
        g.appendChild(r); barras.push(r);
      }
      const HABLA = [[0, 0.6], [0.8, 1.85], [2.0, 3.15]];
      const env = (t) => { for (const [a, b] of HABLA) if (t >= a && t <= b) return Math.min(1, (t - a) / 0.08, (b - t) / 0.12); return 0; };
      const pinta = (t) => {
        const e = env(t);
        barras.forEach((r, i) => {
          const c = 1 - Math.abs(i - 12) / 14;
          const v = 6 + e * c * 90 * (0.35 + 0.65 * Math.abs(Math.sin(i * 1.7 + t * 23) * Math.cos(i * 0.6 + t * 11)));
          r.setAttribute("y", 1060 - v); r.setAttribute("height", v * 2);
        });
      };
      const P = { t: 0 };
      pinta(0.1);
      tl.to(P, { t: DUR, duration: DUR, ease: "none", onUpdate: () => pinta(P.t) }, 0);

      // cuadro 0: cabecera y casco ya entrando
      tl.fromTo(q(".s03-cab"), { x: -200, opacity: 0.5 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 0);
      tl.fromTo(q(".s03-casco"), { opacity: 0.5, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)", svgOrigin: "555 840" }, 0);
      tl.to(q(".s03-casco"), { rotation: -4, svgOrigin: "555 840", duration: 0.25, yoyo: true, repeat: 11, ease: "sine.inOut" }, 0.3);

      golpe(".s03-box", BOX + 0.12, 1.8);
      tl.to(q(".s03-box"), { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1 }, 0.3);
      gsap.set([q(".s03-p1"), q(".s03-p2")], { opacity: 0 });
      tl.fromTo(q(".s03-p1"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, HOLA - 0.1);
      tl.fromTo(q(".s03-p2"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, TENES - 0.1);
      tl.to(q(".s03-box"), { opacity: 0.45, duration: 0.2 }, TENES);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
