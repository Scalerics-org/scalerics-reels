      const C = [];
      for (let f = 0; f < 4; f++) for (let c = 0; c < 8; c++) {

      const ondea = (t) => {
        for (const [r, f, c] of C) {
          const y = 606 + f * 56 + Math.sin(c * 0.8 - t * 7) * (6 + c * 2.2);
          r.setAttribute("x", 305 + c * 56); r.setAttribute("y", y.toFixed(1));
        }
      };
      const P = { t: 0 };
      ondea(0);
      tl.to(P, { t: DUR, duration: DUR, ease: "none", onUpdate: () => ondea(P.t) }, 0);
      tl.fromTo(g, { opacity: 0.6, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0);

      golpe(".s14-etiq", 0.12, 2.4);
      sacudon(0.15, 1.2);
