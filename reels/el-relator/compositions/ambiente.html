<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    /* césped cortado en franjas, como se ve en la tele */
    [data-composition-id="ambiente"] .amb-cesped { position: absolute; left: -80px; top: -300px; width: 1240px; height: 2520px; opacity: 0.55;
      background-image: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.045) 0px, rgba(255, 255, 255, 0.045) 150px, rgba(0, 0, 0, 0.06) 150px, rgba(0, 0, 0, 0.06) 300px); }
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 760px 1120px at 540px 920px, rgba(7, 32, 15, 0) 52%, rgba(4, 18, 8, 0.9) 100%); }
    [data-composition-id="ambiente"] .amb-alarma { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 600px 600px at 0% 0%, rgba(255, 59, 48, 0.38), rgba(255, 59, 48, 0) 70%), radial-gradient(ellipse 600px 600px at 100% 100%, rgba(255, 59, 48, 0.38), rgba(255, 59, 48, 0) 70%); }
    [data-composition-id="ambiente"] .amb-flash { position: absolute; inset: 0; background: #f4f6f0; opacity: 0; }
    [data-composition-id="ambiente"] .amb-flash-am { position: absolute; inset: 0; background: #ffd23f; opacity: 0; }
    /* el marcador de la transmisión (arriba, sobre los subtítulos) */
    [data-composition-id="ambiente"] .amb-marcador { position: absolute; left: 60px; top: 112px; height: 84px; display: flex; align-items: stretch; font-family: "Lexend", sans-serif; font-weight: 800; text-transform: uppercase; white-space: nowrap; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35); }
    [data-composition-id="ambiente"] .amb-vivo { display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #ff3b30; color: #f4f6f0; font-size: 28px; letter-spacing: 0.06em; }
    [data-composition-id="ambiente"] .amb-punto { width: 14px; height: 14px; border-radius: 50%; background: #f4f6f0; }
    [data-composition-id="ambiente"] .amb-equipo { display: flex; align-items: center; padding: 0 18px; background: #f4f6f0; color: #07200f; font-size: 30px; letter-spacing: 0.01em; }
    [data-composition-id="ambiente"] .amb-goles { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 18px; background: #ffd23f; color: #07200f; font-size: 44px; font-weight: 900; min-width: 150px; }
    [data-composition-id="ambiente"] .amb-g2 { position: relative; display: inline-block; width: 30px; height: 50px; }
    [data-composition-id="ambiente"] .amb-g2 span { position: absolute; left: 0; top: 0; width: 30px; text-align: center; line-height: 50px; }
    [data-composition-id="ambiente"] .amb-reloj { display: flex; align-items: center; padding: 0 18px; background: #07200f; color: #f4f6f0; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 32px; letter-spacing: 0.04em; border: 3px solid #f4f6f0; border-left: none; border-radius: 0 10px 10px 0; }
    [data-composition-id="ambiente"] .amb-rotulo { position: absolute; right: 60px; top: 1610px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.16em; color: #f4f6f0; opacity: 0.55; text-align: right; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="73.76">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="73.76" data-track-index="0">
      <div class="amb-cesped"></div>
      <div class="amb-vineta"></div>
      <div class="amb-alarma"></div>
      <div class="amb-marcador">
        <div class="amb-vivo"><div class="amb-punto"></div>Vivo</div>
        <div class="amb-equipo">Tu local</div>
        <div class="amb-goles"><span>0</span><span>·</span><span class="amb-g2"><span class="amb-g2a">0</span><span class="amb-g2b">1</span></span></div>
        <div class="amb-equipo">El de enfrente</div>
        <div class="amb-reloj"><span class="amb-min">88:46</span></div>
      </div>
      <div class="amb-rotulo" data-layout-ignore>CÁMARA 1 · TRIBUNA</div>
      <div class="amb-flash"></div>
      <div class="amb-flash-am"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 73.76;
      const GOL = 40.62;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // el césped se desliza despacio (la cámara sigue la jugada)
      tl.fromTo(q(".amb-cesped"), { y: 0 }, { y: 300, duration: DUR, ease: "none" }, 0);

      // el reloj del partido corre: 88:46 al arrancar, 90:00 al final
      const reloj = q(".amb-min");
      const r = { s: 88 * 60 + 46 };
      const pinta = () => { const s = Math.floor(r.s); reloj.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
      tl.to(r, { s: 88 * 60 + 46 + DUR, duration: DUR, ease: "none", onUpdate: pinta }, 0);

      // el punto rojo de EN VIVO late
      tl.to(q(".amb-punto"), { opacity: 0.2, duration: 0.5, yoyo: true, repeat: Math.floor(DUR / 0.5) - 1, ease: "steps(1)" }, 0);

      // el marcador entra en el cuadro 0 ya puesto, con un leve barrido
      tl.fromTo(q(".amb-marcador"), { x: -30, opacity: 0.6 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);

      // GOL del de enfrente: el 0 cae y entra el 1, el marcador salta
      gsap.set(q(".amb-g2b"), { yPercent: -100, opacity: 0 });
      tl.to(q(".amb-g2a"), { yPercent: 100, opacity: 0, duration: 0.25, ease: "power3.in" }, GOL + 0.1);
      tl.fromTo(q(".amb-g2b"), { yPercent: -100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, GOL + 0.3);
      tl.to(q(".amb-marcador"), { scale: 1.08, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 5, ease: "sine.inOut" }, GOL + 0.3);
      tl.to(q(".amb-goles"), { backgroundColor: "#ff3b30", duration: 0.12, yoyo: true, repeat: 7, ease: "steps(1)" }, GOL + 0.3);

      // alarma roja en las esquinas: "visto", "error", "banda"
      [[17.71, 0.8], [18.7, 0.6], [33.4, 0.6]].forEach(([t, d]) => {
        tl.to(q(".amb-alarma"), { opacity: 1, duration: 0.1, yoyo: true, repeat: Math.max(1, Math.round(d / 0.2)) * 2 - 1, ease: "steps(1)" }, t);
      });

      // flashes: "VAR", el gol (dos), "Scalerics"
      [25.36, 40.62, 43.14, 58.65].forEach((t) => {
        tl.to(q(".amb-flash"), { opacity: 0.55, duration: 0.03 }, t);
        tl.to(q(".amb-flash"), { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.04);
      });
      // destellos amarillos de festejo durante el GOOOL
      [41.2, 41.8, 42.4].forEach((t) => {
        tl.to(q(".amb-flash-am"), { opacity: 0.22, duration: 0.03 }, t);
        tl.to(q(".amb-flash-am"), { opacity: 0, duration: 0.25, ease: "power2.out" }, t + 0.04);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
