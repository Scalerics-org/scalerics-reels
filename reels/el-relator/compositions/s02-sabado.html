<template>

  <style>

    [data-composition-id="s02-sabado"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

  <script>
    (function () {
      const ID = "s02-sabado";
      const DUR = 6.26;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      const ONCE = 0.54;
      const NOCHE = 1.24;
      const ARRANCA = 1.5;
      const IZQ = 3.15;
      const CELULAR = 3.33;
      const TIRA = 4.63;
      const CENTRO = 5.06;

      // cuadro 0: la placa entra con barrido de TV
      tl.fromTo(q(".s02-placa"), { x: -200, opacity: 0.4 }, { x: 0, opacity: 1, duration: 0.25, ease: "power4.out" }, 0);
      gsap.set(q(".s02-hora"), { opacity: 0 });
      tl.fromTo(q(".s02-hora"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, ONCE - 0.1);
      sacudon(ONCE + 0.04, 0.8);
      gsap.set(q(".s02-noche"), { opacity: 0 });
      tl.fromTo(q(".s02-noche"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, NOCHE - 0.1);

      // la cancha se dibuja
      ["s02-borde", "s02-area", "s02-arco", "s02-medio"].forEach((c, i) => {
        const p = q("." + c); const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L * 0.6 });
        tl.to(p, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 0.05 + i * 0.08);
      });
      tl.fromTo(q(".s02-r1"), { opacity: 0 }, { opacity: 0.8, duration: 0.3 }, 0.6);
      tl.fromTo(q(".s02-escenario"), { scale: 1.05 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 60%" }, 0);

      // "arranca la clienta": aparece el puntito y corre por la izquierda
      const corrida = q(".s02-corrida"), pase = q(".s02-pase");
      const Lc = corrida.getTotalLength(), Lp = pase.getTotalLength();
      const ubicar = (el, p) => el.setAttribute("transform", "translate(" + p.x + " " + p.y + ")");
      const p0 = corrida.getPointAtLength(0);
      ubicar(q(".s02-clienta"), p0);
      ubicar(q(".s02-cel"), { x: p0.x + 70, y: p0.y - 70 });
      gsap.set(q(".s02-clienta"), { opacity: 0 });
      gsap.set(q(".s02-cel"), { opacity: 0 });
      gsap.set(q(".s02-pelota"), { opacity: 0 });
      tl.to(q(".s02-clienta"), { opacity: 1, duration: 0.15 }, ARRANCA);
      tl.fromTo(q(".s02-dot"), { scale: 0, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.3, ease: "back.out(3)" }, ARRANCA);
      gsap.set(corrida, { clipPath: "inset(100% 0 0 0)", opacity: 0 });
      tl.to(corrida, { opacity: 1, duration: 0.01 }, ARRANCA + 0.4);
      tl.to(corrida, { clipPath: "inset(0% 0 0 0)", duration: 2.2, ease: "power1.inOut" }, ARRANCA + 0.4);
      const run = { p: 0 };
      tl.to(run, { p: 1, duration: 2.3, ease: "power1.inOut", onUpdate: () => { const pt = corrida.getPointAtLength(run.p * Lc); ubicar(q(".s02-clienta"), pt); ubicar(q(".s02-cel"), { x: pt.x + 70, y: pt.y - 70 }); } }, ARRANCA + 0.4);
      // "por la izquierda": la cámara acompaña
      tl.to(q(".s02-escenario"), { x: 30, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, IZQ - 0.2);
      // "celular en mano"
      tl.to(q(".s02-cel"), { opacity: 1, duration: 0.01 }, CELULAR);
      tl.fromTo(q(".s02-cel-i"), { scale: 0.2, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.3, ease: "back.out(3)" }, CELULAR);
      tl.to(q(".s02-cel-i"), { rotation: 10, svgOrigin: "0 0", duration: 0.07, yoyo: true, repeat: 5, ease: "sine.inOut" }, CELULAR + 0.4);

      // "tira el centro": la pelota (el mensaje) vuela al área
      gsap.set(pase, { clipPath: "inset(0 100% 0 0)", opacity: 0 });
      tl.to(pase, { opacity: 1, duration: 0.01 }, TIRA);
      tl.to(pase, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power2.out" }, TIRA);
      tl.to(q(".s02-pelota"), { opacity: 1, duration: 0.01 }, TIRA);
      const pv = { p: 0 };
      tl.to(pv, { p: 1, duration: 0.7, ease: "power2.out", onUpdate: () => { const pt = pase.getPointAtLength(pv.p * Lp); q(".s02-pelota").setAttribute("cx", pt.x); q(".s02-pelota").setAttribute("cy", pt.y); } }, TIRA);
      gsap.set(q(".s02-centro"), { opacity: 0, rotation: -6 });
      tl.fromTo(q(".s02-centro"), { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, CENTRO - 0.1);
      sacudon(CENTRO + 0.04, 1.2);
      tl.to(q(".s02-centro"), { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, CENTRO + 0.3);

      tl.to(q("#s02-escena"), { x: -300, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
