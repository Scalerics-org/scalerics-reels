<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-var"] .s06-capa { position: absolute; inset: 0; }
    [data-composition-id="s06-var"] .s06-escenario { position: absolute; inset: 0; }
    [data-composition-id="s06-var"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-var"] .gesto { fill: none; stroke: #f4f6f0; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 26; }
    [data-composition-id="s06-var"] .s06-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; text-transform: uppercase; line-height: 1; white-space: nowrap; }
    [data-composition-id="s06-var"] .s06-momento { top: 600px; font-weight: 900; font-size: 120px; letter-spacing: -0.02em; color: #f4f6f0; }
    [data-composition-id="s06-var"] .s06-momento2 { top: 730px; font-weight: 900; font-size: 120px; letter-spacing: -0.02em; color: #ffd23f; }
    [data-composition-id="s06-var"] .s06-var { top: 960px; font-weight: 900; font-size: 300px; letter-spacing: 0.02em; color: #f4f6f0; text-shadow: 0 0 40px rgba(244, 246, 240, 0.35); }
    [data-composition-id="s06-var"] .s06-rev { top: 1290px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 36px; letter-spacing: 0.3em; color: #ff3b30; }
    [data-composition-id="s06-var"] .s06-scan { position: absolute; left: 190px; top: 930px; width: 700px; height: 8px; background: rgba(244, 246, 240, 0.5); }
  </style>
  <div id="root" data-composition-id="s06-var" data-width="1080" data-height="1920" data-duration="3.1">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="3.1" data-track-index="0">
      <div class="s06-escenario">
        <div class="s06-txt s06-momento">¡Momento!</div>
        <div class="s06-txt s06-momento2">¡Momento!</div>
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- el rectángulo que dibuja el árbitro en el aire: la pantalla del VAR -->
          <path class="gesto s06-gesto" d="M190 920 H890 V1360 H190 Z" />
          <circle class="s06-rec" cx="850" cy="960" r="14" fill="#ff3b30" />
        </svg>
        <div class="s06-scan"></div>
        <div class="s06-txt s06-var">VAR</div>
        <div class="s06-txt s06-rev">Revisando...</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-var";
      const DUR = 3.1;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s06-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      const MOMENTO2 = 0.69;
      const REVISA = 1.73;
      const VAR = 2.17;

      tl.fromTo(q(".s06-momento"), { opacity: 0.5, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in" }, 0);
      sacudon(0.16, 1);
      gsap.set(q(".s06-momento2"), { opacity: 0 });
      tl.fromTo(q(".s06-momento2"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, MOMENTO2 - 0.1);
      sacudon(MOMENTO2 + 0.04, 1);

      // el gesto del árbitro: se dibuja el rectángulo
      const g = q(".s06-gesto");
      gsap.set(g, { clipPath: "inset(0 100% 0 0)" });
      tl.to(g, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power2.inOut" }, 0.9);
      gsap.set(q(".s06-rec"), { opacity: 0 });
      tl.to(q(".s06-rec"), { opacity: 1, duration: 0.15, yoyo: true, repeat: 5, ease: "steps(1)" }, REVISA);

      // "VAR"
      gsap.set(q(".s06-var"), { opacity: 0 });
      tl.fromTo(q(".s06-var"), { opacity: 0, scale: 2.8 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, VAR - 0.1);
      sacudon(VAR + 0.04, 1.6);
      tl.to([q(".s06-momento"), q(".s06-momento2")], { opacity: 0.25, duration: 0.15 }, VAR);
      // la línea de escaneo baja por la pantalla
      gsap.set(q(".s06-scan"), { opacity: 0 });
      tl.fromTo(q(".s06-scan"), { opacity: 0.8, y: 0 }, { opacity: 0.8, y: 420, duration: 0.7, ease: "none", immediateRender: false }, REVISA);
      tl.to(q(".s06-scan"), { opacity: 0, duration: 0.1 }, REVISA + 0.7);
      gsap.set(q(".s06-rev"), { opacity: 0 });
      tl.to(q(".s06-rev"), { opacity: 1, duration: 0.15, yoyo: true, repeat: 3, ease: "steps(1)" }, VAR + 0.2);
      tl.to(q(".s06-rev"), { opacity: 1, duration: 0.01 }, VAR + 0.81);

      tl.to(q("#s06-escena"), { x: -300, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
