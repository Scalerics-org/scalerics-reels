  <script>
    (function () {
      const ID = "s07-repe";
      const DUR = 5.63;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s07-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      const LEYO = 0.19;
      const DOS = 1.71;
      const PENSABA = 2.18;
      const LUNES = 3.24;
      const VISTO = 4.38;

      // cuadro 0: el monitor ya está, zoom lento de tele
      tl.fromTo(q(".s07-mon"), { scale: 1.06, opacity: 0.6 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(q(".s07-escenario"), { scale: 1 }, { scale: 1.04, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);
      tl.to(q(".s07-rec"), { opacity: 0.2, duration: 0.25, yoyo: true, repeat: 15, ease: "steps(1)" }, 0);
      // la hora corre como un timecode hasta 23:02
      gsap.set(q(".s07-leido"), { opacity: 0 });
      const mm = q(".s07-mm");
      const cuenta = { v: 0 };
      tl.to(cuenta, { v: 2, duration: DOS - 0.3, ease: "power1.in", onUpdate: () => { mm.textContent = String(Math.floor(cuenta.v + 0.001)); } }, LEYO);
      tl.fromTo(q(".s07-hora"), { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, DOS - 0.1);
      sacudon(DOS - 0.05, 0.8);
      tl.fromTo(q(".s07-leido"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, immediateRender: false }, DOS);

      // "pensaba contestar el lunes": los días; la flecha salta de sábado a lunes
      const dias = root.querySelectorAll(".s07-dia");
      gsap.set(dias, { opacity: 0 });
      tl.fromTo(dias, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.12, ease: "back.out(2)", immediateRender: false }, PENSABA);
      const fl = q(".s07-flecha");
      gsap.set(fl, { clipPath: "inset(0 100% 0 0)" });
      gsap.set(q(".s07-punta"), { opacity: 0 });
      tl.to(fl, { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power2.inOut" }, PENSABA + 0.4);
      tl.to(q(".s07-punta"), { opacity: 1, duration: 0.05 }, PENSABA + 1.05);
      tl.fromTo(q(".s07-lun"), { scale: 1 }, { scale: 1.15, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, LUNES);
      sacudon(LUNES + 0.04, 0.7);

      // "Es visto, nomás": la decisión del VAR
      gsap.set(q(".s07-decision"), { opacity: 0 });
      tl.fromTo(q(".s07-decision"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, VISTO - 0.18);
      sacudon(VISTO, 1.4);
      tl.to(q(".s07-mon"), { opacity: 0.45, duration: 0.15 }, VISTO);
      tl.to(q(".s07-decision"), { rotation: -2, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, VISTO + 0.4);

      tl.to(q("#s07-escena"), { x: -300, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
