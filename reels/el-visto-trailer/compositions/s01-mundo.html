  <script>
    (function () {
      const ID = "s01-mundo";
      const DUR = 8.01;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CLIENTES = 1.55, ONCE = 2.85, NOCHE = 3.45, HOMBRE = 4.17, ATREVIO = 5.17, CONTESTAR = 6.49, JUEVES = 6.72;

      // aparece de golpe (sin dejar el cuadro negro: el estado inicial ya es visible a medias)
      const golpe = (el, t, desde = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in", immediateRender: false }, t);
      };
      const placa = (el, t, d) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, t);
        tl.fromTo(el, { scale: 1 }, { scale: 1.06, duration: d, ease: "none", immediateRender: false }, t);
        tl.to(el, { opacity: 0, filter: "blur(6px)", duration: 0.2 }, t + d - 0.2);
      };
      const sacudon = (t, f = 1) => [[-14, 8], [11, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

      // cámara: grúa lenta que baja sobre la ciudad
      tl.fromTo(q(".s01-escenario"), { scale: 1.08, y: -30 }, { scale: 1, y: 0, duration: HOMBRE, ease: "sine.inOut", transformOrigin: "50% 70%" }, 0);
      tl.fromTo(q(".s01-ciudad"), { opacity: 0.55 }, { opacity: 1, duration: 0.6 }, 0);
      // ventanas que se prenden
      qa(".ventana").forEach((v, i) => tl.fromTo(v, { opacity: 0.12 }, { opacity: 0.95, duration: 0.08, ease: "steps(1)" }, 0.1 + ((i * 7) % 13) * 0.12));

      // "clientes escriben": suben burbujitas de las ventanas
      for (let i = 1; i <= 8; i++) {
        const b = q(".s01-b" + i);
        gsap.set(b, { opacity: 0 });
        const t = CLIENTES + ((i * 3) % 8) * 0.12;
        tl.fromTo(b, { opacity: 0, y: 40, scale: 0.6, svgOrigin: "540 1100" }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, t);
        tl.to(b, { y: -60 - i * 6, duration: HOMBRE - t, ease: "none" }, t + 0.3);
        tl.to(b, { opacity: 0.25, duration: 0.3 }, HOMBRE);
      }
      // los puntitos de "escribiendo" laten
      tl.to(qa(".burbuja circle"), { opacity: 0.25, duration: 0.18, yoyo: true, repeat: 7, stagger: { each: 0.02 } }, CLIENTES + 0.4);

      // "once": la hora
      golpe(q(".s01-hora"), ONCE - 0.1, 1.8);
      tl.to(q(".s01-hora"), { scale: 1.06, duration: 1.1, ease: "none" }, ONCE + 0.1);
      tl.to(q(".s01-hora"), { opacity: 0, filter: "blur(6px)", duration: 0.2 }, HOMBRE - 0.15);
      tl.to(qa(".ventana"), { opacity: 1, duration: 0.15, yoyo: true, repeat: 1 }, NOCHE);

      // "un solo hombre": la silueta de espaldas sube a cuadro, la ciudad se apaga
      gsap.set(q(".s01-hombre"), { opacity: 0 });
      tl.fromTo(q(".s01-hombre"), { opacity: 0, y: 220 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, HOMBRE - 0.1);
      tl.fromTo(q(".s01-hombre"), { scale: 1 }, { scale: 1.07, svgOrigin: "540 1440", duration: DUR - HOMBRE, ease: "none", immediateRender: false }, HOMBRE + 0.6);
      tl.to(q(".s01-ciudad"), { opacity: 0.45, duration: 0.5 }, HOMBRE);
      placa(q(".s01-solo"), HOMBRE + 0.05, ATREVIO - HOMBRE - 0.05);
      placa(q(".s01-atrevio"), ATREVIO, CONTESTAR - ATREVIO - 0.05);
      tl.fromTo(q(".borde-n"), { opacity: 0.5 }, { opacity: 1, duration: 0.25, yoyo: true, repeat: 3 }, ATREVIO);

      // "a contestar… el jueves": título de oro con braaam
      gsap.set(q(".s01-contestar"), { opacity: 0 });
      tl.fromTo(q(".s01-contestar"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, immediateRender: false }, CONTESTAR - 0.1);
      golpe(q(".s01-titulo"), JUEVES - 0.12, 2.6);
      sacudon(JUEVES + 0.05, 1.2);
      tl.to(q(".s01-titulo"), { scale: 1.05, duration: DUR - JUEVES - 0.3, ease: "none" }, JUEVES + 0.1);
      // brillo que barre el oro (banda diagonal recortada con clip-path)
      gsap.set(q(".s01-brillo"), { opacity: 0.9, clipPath: "polygon(-20% 0%, -12% 0%, -22% 100%, -30% 100%)" });
      tl.to(q(".s01-brillo"), { clipPath: "polygon(120% 0%, 128% 0%, 118% 100%, 110% 100%)", duration: 0.9, ease: "power2.inOut" }, JUEVES + 0.25);

      // salida: blur y fundido
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(8px)", scale: 1.04, duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
