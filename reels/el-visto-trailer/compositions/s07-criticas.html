<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Outfit"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Outfit-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s07-criticas"] .s07-capa { position: absolute; inset: 0; }
    [data-composition-id="s07-criticas"] .s07-placa { position: absolute; left: 0; top: 480px; width: 1080px; height: 960px; background: #030405; }
    [data-composition-id="s07-criticas"] .s07-escenario { position: absolute; inset: 0; }
    [data-composition-id="s07-criticas"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s07-criticas"] .hoja { fill: #f2c45a; }
    [data-composition-id="s07-criticas"] .tallo { fill: none; stroke: #f2c45a; stroke-width: 4; stroke-linecap: round; }
    [data-composition-id="s07-criticas"] .tilde { fill: none; stroke: #f3ead8; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.25; }
    [data-composition-id="s07-criticas"] .tilde.azul { stroke: #34b7f1; opacity: 1; filter: drop-shadow(0 0 10px rgba(52, 183, 241, 0.9)); }
    [data-composition-id="s07-criticas"] .s07-txt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Outfit", sans-serif; text-transform: uppercase; white-space: nowrap; line-height: 1.05; }
    [data-composition-id="s07-criticas"] .oro { font-weight: 800; background: linear-gradient(180deg, #fff3c8 0%, #f2c45a 38%, #b07a1f 62%, #f7d98a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(242, 196, 90, 0.4)); }
    [data-composition-id="s07-criticas"] .s07-dos { top: 600px; font-size: 64px; letter-spacing: 0.04em; }
    [data-composition-id="s07-criticas"] .s07-cinco { top: 680px; font-weight: 600; font-size: 40px; letter-spacing: 0.3em; color: #f3ead8; }
    [data-composition-id="s07-criticas"] .s07-visto { top: 1040px; font-size: 58px; letter-spacing: 0.03em; }
    [data-composition-id="s07-criticas"] .s07-firma { position: absolute; left: 0; right: 0; top: 1220px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.26em; color: #f3ead8; opacity: 0.7; }
  </style>
  <div id="root" data-composition-id="s07-criticas" data-width="1080" data-height="1920" data-duration="5.4">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="5.4" data-track-index="0">
      <div class="s07-placa"></div>
      <div class="s07-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g class="s07-laurel1"></g>
          <g class="s07-laurel2"></g>
          <g class="s07-tildes"></g>
        </svg>
        <div class="s07-txt oro s07-dos">Dos tildes azules</div>
        <div class="s07-txt s07-cinco">de cinco</div>
        <div class="s07-txt oro s07-visto">«Te deja en visto<br />de principio a fin»</div>
        <div class="s07-firma">LA CRÍTICA ESPECIALIZADA</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s07-criticas";
      const DUR = 5.4;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const TILDES = 0.46, AZULES = 0.75, TE = 2.31, VISTO = 3.25;

      // laureles genéricos: dos ramas curvas con hojas
      const laurel = (g, cx, cy, h, w) => {
        [-1, 1].forEach((lado) => {
          const P0 = [cx + lado * w, cy + h / 2], P1 = [cx + lado * (w + 70), cy], P2 = [cx + lado * (w + 10), cy - h / 2];
          const tallo = document.createElementNS(NS, "path");
          tallo.setAttribute("d", `M${P0[0]} ${P0[1]} Q${P1[0]} ${P1[1]} ${P2[0]} ${P2[1]}`);
          tallo.setAttribute("class", "tallo");
          g.appendChild(tallo);
          const pt = (t) => [(1 - t) ** 2 * P0[0] + 2 * (1 - t) * t * P1[0] + t * t * P2[0], (1 - t) ** 2 * P0[1] + 2 * (1 - t) * t * P1[1] + t * t * P2[1]];
          for (let k = 0; k < 7; k++) {
            const t = 0.1 + k * 0.14;
            const [x, y] = pt(t), [x2, y2] = pt(t + 0.01);
            const ang = (Math.atan2(y2 - y, x2 - x) * 180) / Math.PI;
            [-1, 1].forEach((s2) => {
              const hoja = document.createElementNS(NS, "ellipse");
              hoja.setAttribute("cx", x); hoja.setAttribute("cy", y - 16);
              hoja.setAttribute("rx", 9); hoja.setAttribute("ry", 22);
              hoja.setAttribute("transform", `rotate(${ang + 90 + s2 * 40} ${x} ${y}) translate(0 0)`);
              hoja.setAttribute("class", "hoja");
              g.appendChild(hoja);
            });
          }
        });
      };
      laurel(q(".s07-laurel1"), 540, 720, 240, 390);
      laurel(q(".s07-laurel2"), 540, 1130, 230, 390);

      // cinco tildes dobles: dos se prenden en azul
      const tg = q(".s07-tildes");
      const tildes = [];
      for (let i = 0; i < 5; i++) {
        const x = 330 + i * 110, y = 790;
        const g = document.createElementNS(NS, "g");
        g.innerHTML = `<path class="tilde" d="M${x} ${y + 20} l16 16 l30 -36" /><path class="tilde" d="M${x + 30} ${y + 30} l6 6 l30 -36" />`;
        tg.appendChild(g);
        tildes.push(g);
      }

      tl.fromTo(q(".s07-escenario"), { scale: 1 }, { scale: 1.06, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);
      // crítica 1
      tl.fromTo(q(".s07-laurel1"), { opacity: 0.2 }, { opacity: 1, duration: 0.3 }, 0);
      tl.fromTo([q(".s07-dos"), q(".s07-cinco")], { opacity: 0.2, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", stagger: 0.1 }, 0);
      tl.fromTo(tg, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.2);
      [TILDES, AZULES].forEach((t, i) => {
        tl.add(() => {}, t);
        tl.set(tildes[i].querySelectorAll(".tilde"), { attr: { class: "tilde azul" } }, t);
        tl.fromTo(tildes[i], { scale: 1.6 }, { scale: 1, svgOrigin: `${355 + i * 110} 810`, duration: 0.25, ease: "back.out(3)", immediateRender: false }, t);
      });
      // las otras tres quedan apagadas y tiemblan, avergonzadas
      tl.to(tildes.slice(2), { x: 4, duration: 0.05, yoyo: true, repeat: 5 }, 1.75);

      // crítica 2
      gsap.set([q(".s07-laurel2"), q(".s07-visto"), q(".s07-firma")], { opacity: 0 });
      tl.to([q(".s07-dos"), q(".s07-cinco"), q(".s07-laurel1"), tg], { opacity: 0.5, duration: 0.3 }, TE - 0.1);
      tl.fromTo(q(".s07-laurel2"), { opacity: 0 }, { opacity: 1, duration: 0.35, immediateRender: false }, TE - 0.1);
      tl.fromTo(q(".s07-visto"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in", immediateRender: false }, TE - 0.1);
      [[-10, 6], [8, -5], [-4, 2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s07-escenario"), { x, y, duration: 0.04, ease: "none" }, TE + 0.08 + i * 0.045));
      tl.fromTo(q(".s07-firma"), { opacity: 0, y: 10 }, { opacity: 0.7, y: 0, duration: 0.3, immediateRender: false }, VISTO);

      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, DUR - 0.22);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
