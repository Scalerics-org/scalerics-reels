  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s08-sistema"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

    [data-composition-id="s08-sistema"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }

    [data-composition-id="s08-sistema"] .s08-num { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 26px; fill: #5ce611; }
    [data-composition-id="s08-sistema"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s08-sistema"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s08-sistema" data-width="1080" data-height="1920" data-duration="4.98">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="4.98" data-track-index="0">
      <!-- figurita atada al celular -->
      <div id="s08-pegado" class="s08-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
         <g transform="translate(-90 0)">
          <g class="s08-apagar">
            <!-- figurita: mira el celular -->
            <g class="s08-figura">
              <circle class="ln s08-dib-f" cx="400" cy="770" r="44" />
              <path class="ln s08-dib-f" d="M400 816 V990" />
              <path class="ln s08-dib-f" d="M400 990 L352 1130" />
              <path class="ln s08-dib-f" d="M400 990 L448 1130" />
              <path class="ln s08-dib-f" d="M400 866 L344 956" />
              <path class="ln s08-dib-f" d="M400 866 L470 930 L506 944" />
              <!-- esposa en la muñeca -->
              <circle class="ln-cadena s08-dib-f" cx="512" cy="946" r="13" />
            </g>
            <!-- cadena: eslabones generados por JS sobre una curva -->
            <g class="s08-cadena"></g>
            <!-- celular -->
            <g class="s08-tel">
              <rect class="ln s08-dib-t" x="620" y="770" width="128" height="220" rx="24" />

              <path class="ln-tenue s08-dib-t" d="M640 830 H700" />
              <path class="ln-tenue s08-dib-t" d="M668 856 H728" />
              <path class="ln-tenue s08-dib-t" d="M640 882 H712" />
              <path class="ln-tenue s08-dib-t" d="M668 908 H728" />
              <circle class="ln-cadena s08-dib-t" cx="640" cy="972" r="9" />
              <!-- contador de mensajes sin leer -->
              <g class="s08-cont">
                <circle class="ln-badge" cx="596" cy="746" r="24" />
                <text class="s08-num s08-n" x="596" y="755" text-anchor="middle">3</text>
                <text class="s08-num s08-n" x="596" y="755" text-anchor="middle">9</text>
                <text class="s08-num s08-n" x="596" y="755" text-anchor="middle">17</text>
                <text class="s08-num s08-n" x="596" y="755" text-anchor="middle">28</text>
              </g>
              <!-- vibración -->
              <path class="ln-tenue s08-vib" d="M770 840 Q782 870 770 900" />
              <path class="ln-tenue s08-vib" d="M790 826 Q808 870 790 914" />
            </g>
            <!-- burbujas que no paran de llegar -->
            <g class="s08-burbujas">
              <g class="s08-b"><rect class="ln" x="800" y="650" width="132" height="58" rx="22" /><path class="ln-tenue" d="M822 679 H906" /></g>
              <g class="s08-b"><rect class="ln" x="846" y="760" width="120" height="58" rx="22" /><path class="ln-tenue" d="M868 789 H940" /></g>
              <g class="s08-b"><rect class="ln" x="560" y="640" width="120" height="58" rx="22" /><path class="ln-tenue" d="M582 669 H656" /></g>
              <g class="s08-b"><rect class="ln" x="832" y="1000" width="132" height="58" rx="22" /><path class="ln-tenue" d="M854 1029 H940" /></g>
              <g class="s08-b"><rect class="ln" x="836" y="880" width="104" height="58" rx="22" /><path class="ln-tenue" d="M858 909 H916" /></g>
              <g class="s08-b"><rect class="ln" x="700" y="1080" width="120" height="58" rx="22" /><path class="ln-tenue" d="M722 1109 H796" /></g>
            </g>
          </g>
          <!-- badge de "no" -->
          <g class="s08-badge">

         </g>
        </svg>
      </div>
      <!-- engranaje -->
      <div id="s08-sistema-capa" class="s08-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g class="s08-engranaje">
            <path class="ln s08-dib-g s08-dientes" d="" />
            <circle class="ln-ac s08-dib-g" cx="540" cy="900" r="54" />

  <script>
    (function () {
      const ID = "s08-sistema";
      const DUR = 4.98;
      const NS = "http://www.w3.org/2000/svg";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const WHATSAPP = 0.52;
      const NO = 1.05;
      const PEGADO = 1.8;
      const CELULAR = 2.37;
      const ES = 3.37;
      const SISTEMA = 3.94;

      // cadena: eslabones alternados (de frente / de canto) sobre una curva de la muñeca al celular
      const P0 = [524, 950], P1 = [580, 1040], P2 = [632, 978];
      const bez = (t) => [
        (1 - t) * (1 - t) * P0[0] + 2 * (1 - t) * t * P1[0] + t * t * P2[0],
        (1 - t) * (1 - t) * P0[1] + 2 * (1 - t) * t * P1[1] + t * t * P2[1],
      ];
      const cadena = q(".s08-cadena");
      const N = 7;
      for (let i = 0; i < N; i++) {
        const t = (i + 0.5) / N;
        const [x, y] = bez(t);
        const [xa, ya] = bez(Math.max(0, t - 0.02));
        const [xb, yb] = bez(Math.min(1, t + 0.02));
        const ang = (Math.atan2(yb - ya, xb - xa) * 180) / Math.PI;
        const p = document.createElementNS(NS, "path");
        p.setAttribute("class", "ln-cadena s08-eslabon");
        // de frente: óvalo; de canto: barrita
        p.setAttribute("d", i % 2 === 0 ? "M-11 -7 H11 A7 7 0 0 1 11 7 H-11 A7 7 0 0 1 -11 -7 Z" : "M-11 0 H11");
        p.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
        cadena.appendChild(p);
      }

      // dientes del engranaje (geometría fija, determinista)
      const CX = 540, CY = 900, RIN = 128, ROUT = 168, NG = 9;
      const pt = (r, a) => (CX + r * Math.cos(a)).toFixed(1) + " " + (CY + r * Math.sin(a)).toFixed(1);
      let d = "";
      for (let i = 0; i < NG; i++) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / NG;
        const p0 = pt(RIN, a - 0.2), p1 = pt(ROUT, a - 0.12), p2 = pt(ROUT, a + 0.12), p3 = pt(RIN, a + 0.2);
        const sig = pt(RIN, a + (2 * Math.PI) / NG - 0.2);
        d += (i === 0 ? "M" + p0 : "") + " L" + p1 + " L" + p2 + " L" + p3 + " A" + RIN + " " + RIN + " 0 0 1 " + sig;
      }
      q(".s08-dientes").setAttribute("d", d + " Z");

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.05);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // ---------- figurita y celular: arrancan medio dibujados ----------
      dibujar(qa(".s08-dib-f"), 0, 0.6, 0.5, 0.012);
      dibujar(qa(".s08-dib-t"), 0, 0.6, 0.5, 0.012);
      // la figurita se inclina hacia el celular (mirando la pantalla)
      tl.fromTo(q(".s08-figura"), { rotation: 0, svgOrigin: "400 1130" }, { rotation: 4, svgOrigin: "400 1130", duration: CELULAR, ease: "sine.inOut" }, 0);

      // burbujas: llegan una tras otra y suben un poco
      const bs = qa(".s08-b");
      const llegadas = [0.25, 0.6, 0.95, 1.3, 1.6, 2.0];
      const origenes = ["800 708", "846 818", "680 698", "832 1058", "836 938", "820 1138"];
      bs.forEach((b, i) => {
        pop(b, llegadas[i], origenes[i]);
        tl.to(b, { y: -14, duration: DUR - llegadas[i], ease: "none" }, llegadas[i]);
      });

      // contador: 3 → 9 → 17 → 28
      const ns = qa(".s08-n");
      gsap.set(ns, { opacity: 0 });
      pop(q(".s08-cont"), 0.3, "596 746");
      tl.set(ns[0], { opacity: 1 }, 0.3);
      [WHATSAPP + 0.1, NO + 0.1, PEGADO].forEach((t, i) => {
        tl.set(ns[i], { opacity: 0 }, t);
        tl.set(ns[i + 1], { opacity: 1 }, t);
        tl.fromTo(q(".s08-cont"), { scale: 1, svgOrigin: "596 746" }, { scale: 1.25, svgOrigin: "596 746", duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t);
      });

      // el celular vibra
      gsap.set(qa(".s08-vib"), { opacity: 0 });
      [0.3, 1.0, 1.65].forEach((t) => {
        tl.fromTo(qa(".s08-vib"), { opacity: 0 }, { opacity: 1, duration: 0.08, yoyo: true, repeat: 3 }, t);
        tl.fromTo(q(".s08-tel"), { x: 0 }, { x: 4, duration: 0.05, ease: "none", yoyo: true, repeat: 5, immediateRender: false }, t);
      });

      // "pegado": la cadena se dibuja eslabón por eslabón
      dibujar(qa(".s08-eslabon"), PEGADO - 0.1, 0.25, 1, 0.06);
      tl.fromTo(q(".s08-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, PEGADO);
      // tirón de la cadena
      tl.to(q(".s08-cadena"), { y: 6, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, PEGADO + 0.45);

      // "celular": badge X y todo se apaga
      tl.fromTo(q(".s08-badge"), { opacity: 0, scale: 0.6, svgOrigin: "770 760" }, { opacity: 1, scale: 1, svgOrigin: "770 760", duration: 0.35, ease: "back.out(2.2)" }, CELULAR);
      tl.to(q(".s08-apagar"), { opacity: 0.35, duration: 0.4, ease: "power2.out" }, CELULAR + 0.15);
      tl.to(q(".s08-figura"), { rotation: -2, svgOrigin: "400 1130", duration: ES - CELULAR - 0.15, ease: "sine.inOut" }, CELULAR + 0.15);

      // "Es": todo se va girando y achicándose; el engranaje se dibuja encima
      tl.to(q("#s08-pegado"), { opacity: 0, scale: 0.7, rotation: -30, filter: "blur(6px)", transformOrigin: "470px 900px", duration: 0.45, ease: "power2.in" }, ES - 0.15);
      tl.to(q(".s08-e1"), { opacity: 0, duration: 0.2 }, ES - 0.15);
      dibujar(qa(".s08-dib-g"), ES, 0.6);
      tl.fromTo(q(".s08-engranaje"), { rotation: -30, svgOrigin: "540 900" }, { rotation: 60, svgOrigin: "540 900", duration: DUR - ES, ease: "none" }, ES);
      // "sistema": punch
      tl.fromTo(q("#s08-sistema-capa"), { scale: 1 }, { scale: 1.12, transformOrigin: "540px 900px", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, SISTEMA);
      tl.fromTo(q(".s08-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, ES + 0.05);
      tl.to(q(".s08-e2"), { scale: 1.08, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, SISTEMA);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
