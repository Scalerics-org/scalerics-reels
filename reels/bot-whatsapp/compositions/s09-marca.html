<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s09-marca"] .s09-capa { position: absolute; inset: 0; }
    [data-composition-id="s09-marca"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s09-marca"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s09-marca"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s09-marca"] .s09-nombre { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 64px; letter-spacing: -0.01em; }
    [data-composition-id="s09-marca"] .s09-crema { fill: #efeee5; }
    [data-composition-id="s09-marca"] .s09-verde { fill: #5ce611; }
    [data-composition-id="s09-marca"] .s09-para { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.34em; fill: rgba(239, 238, 229, 0.6); }
  </style>
  <div id="root" data-composition-id="s09-marca" data-width="1080" data-height="1920" data-duration="2.84">
    <div id="s09-escena" class="s09-capa clip" data-start="0" data-duration="2.84" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- caja de marca: geometría centrada en 0,0; el grupo la ubica en 540,900 -->
        <g class="s09-caja">
          <g class="s09-caja-in">
            <g transform="translate(540 900)">
              <rect class="ln s09-borde" x="-360" y="-74" width="720" height="148" rx="32" />
              <!-- colita de burbuja de chat abajo a la izquierda -->
              <path class="ln s09-cola" d="M-300 74 L-326 112 L-262 74" />
              <text class="s09-nombre s09-crema s09-w1" x="-40" y="23" text-anchor="end">Bots de</text>
              <text class="s09-nombre s09-verde s09-w2" x="-22" y="23" text-anchor="start">WhatsApp</text>
            </g>
          </g>
          <text class="s09-para s09-linea" x="540" y="1066" text-anchor="middle">PARA COMERCIOS</text>
        </g>
      </svg>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s09-marca";
      const DUR = 2.84;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const BOTS = 0.71;
      const WHATSAPP = 1.14;
      const COMERCIOS = 1.85;
      const SUBE = 2.3;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };

      const O = "540 900";

      // la caja se dibuja (arranca ya empezada para que el cuadro 0 no quede vacío)
      dibujar([q(".s09-borde")], 0, 0.75, 0.7);
      dibujar([q(".s09-cola")], 0.55, 0.3);
      tl.fromTo(q(".s09-caja-in"), { scale: 0.9, svgOrigin: O }, { scale: 1, svgOrigin: O, duration: 0.8, ease: "power3.out" }, 0);
      // respira despacio hasta que sube
      tl.to(q(".s09-caja-in"), { scale: 1.03, svgOrigin: O, duration: SUBE - 0.8, ease: "sine.inOut" }, 0.8);

      // "bots"
      tl.fromTo(q(".s09-w1"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, BOTS);

      // "WhatsApp": pop + pulso
      tl.fromTo(q(".s09-w2"), { opacity: 0, scale: 0.85, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, WHATSAPP);
      tl.to(q(".s09-w2"), { scale: 1.1, transformOrigin: "50% 50%", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, WHATSAPP + 0.36);

      // "comercios"
      tl.fromTo(q(".s09-linea"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, COMERCIOS);

      // sube hacia y 680, se encoge y sale con blur
      tl.to(q(".s09-caja"), { y: -220, scale: 0.72, svgOrigin: O, duration: DUR - SUBE, ease: "power3.inOut" }, SUBE);
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
