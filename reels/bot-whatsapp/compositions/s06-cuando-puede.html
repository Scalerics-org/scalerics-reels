  <script>
    (function () {
      const ID = "s06-cuando-puede";
      const DUR = 3.23;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const UNO = 0.45;
      const COMERCIO = 1.14;
      const CONTESTA = 1.85;
      const CUANDO = 2.33;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.02);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.02);
        });
      };

      // el local arranca medio dibujado y se acerca despacio
      dibujar(qa(".s06-dib"), 0, 0.55, 0.45);
      tl.fromTo(q(".s06-todo"), { scale: 0.97, svgOrigin: "540 900" }, { scale: 1.03, svgOrigin: "540 900", duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s06-cartel"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.25);
      qa(".s06-cli").forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.05 + i * 0.1);
        tl.fromTo(c, { y: 0 }, { y: -3, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 0.5 + i * 0.17);
      });

      // atiende: el brazo va y viene hacia el primer cliente
      tl.fromTo(q(".s06-brazo"), { rotation: 0, svgOrigin: "500 886" }, { rotation: -8, svgOrigin: "500 886", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0.5);

      // el celular vibra y el contador sube sin que nadie lo agarre
      const vibra = (t) => {
        tl.fromTo(q(".s06-cel"), { x: 0 }, { x: 3, duration: 0.04, ease: "none", yoyo: true, repeat: 7 }, t);
        tl.fromTo(q(".s06-vibra"), { opacity: 0 }, { opacity: 1, duration: 0.06, yoyo: true, repeat: 3, repeatDelay: 0.08 }, t);
      };
      gsap.set(q(".s06-vibra"), { opacity: 0 });
      gsap.set(qa(".s06-n"), { opacity: 0 });
      tl.fromTo(q(".s06-badge"), { opacity: 0, scale: 0.5, svgOrigin: "384 880" }, { opacity: 1, scale: 1, svgOrigin: "384 880", duration: 0.35, ease: "back.out(2)" }, UNO);
      tl.set(q(".s06-n1"), { opacity: 1 }, UNO);
      vibra(UNO);
      [[COMERCIO, ".s06-n1", ".s06-n3"], [CONTESTA, ".s06-n3", ".s06-n7"]].forEach(([t, a, b]) => {
        tl.set(q(a), { opacity: 0 }, t);
        tl.set(q(b), { opacity: 1 }, t);
        tl.fromTo(q(".s06-badge"), { scale: 1, svgOrigin: "384 880" }, { scale: 1.3, svgOrigin: "384 880", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t);
        vibra(t);
      });
      vibra(2.6);

      // "cuando puede": mira un segundo el celular y vuelve a atender
      tl.to(q(".s06-cabeza"), { x: -8, rotation: -14, svgOrigin: "500 860", duration: 0.2, ease: "power2.out" }, CUANDO);
      tl.fromTo(q(".s06-mira"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, CUANDO + 0.1);
      tl.to(q(".s06-mira"), { opacity: 0, duration: 0.15 }, CUANDO + 0.5);
      tl.to(q(".s06-cabeza"), { x: 0, rotation: 0, svgOrigin: "500 860", duration: 0.25, ease: "power2.inOut" }, CUANDO + 0.6);

      tl.fromTo(q(".s06-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, CONTESTA);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
