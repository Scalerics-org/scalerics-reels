  <script>
    (function () {
      const ID = "s10-como-anda";
      const DUR = 10.22;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const INSTANTE = 0.81;
      const CUALQUIER = 1.81;
      const PRECIOS = 3.28;
      const HORARIOS = 4.18;
      const AGENDA = 5.1;
      const TURNOS = 5.53;
      const TOMA = 6.29;
      const PEDIDOS = 6.52;
      const CUANDO = 7.47;
      const CONSULTA = 7.8;
      const VOS = 8.61;
      const TE = 9.04;
      const PASA = 9.27;

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.05);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const etiqueta = (sale, entra, t) => {
        if (sale) tl.to(q(sale), { opacity: 0, y: -8, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(entra), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, t);
      };
      const subir = (y, t) => tl.to(q(".s10-conv"), { y: y, duration: 0.5, ease: "power3.inOut" }, t);

      // ---------- celular: arranca medio dibujado y se acerca despacio ----------
      dibujar(qa(".s10-dib"), 0, 0.6, 0.45, 0.03);
      tl.fromTo(q(".s10-tel"), { scale: 0.97, svgOrigin: "450 915" }, { scale: 1.02, svgOrigin: "450 915", duration: DUR, ease: "none" }, 0);
      // arranca centrado y se corre a la izquierda justo antes de los chips
      tl.fromTo(q(".s10-tel"), { x: 90 }, { x: 0, duration: 0.6, ease: "power3.inOut", immediateRender: true }, PRECIOS - 0.55);
      tl.fromTo(q(".s10-cab"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.1);
      tl.fromTo(q(".s10-enlinea"), { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.25);
      tl.fromTo(q(".s10-estado"), { opacity: 0 }, { opacity: 0.6, duration: 0.3 }, 0.2);
      // el puntito "en línea" late suave toda la escena (tweens finitos)
      for (let t = 0.6; t < DUR - 0.6; t += 1.1) {
        tl.fromTo(q(".s10-dot-linea"), { scale: 1, svgOrigin: "339 726" }, { scale: 1.5, svgOrigin: "339 726", duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, t);
      }

      // ---------- "Contesta al instante" ----------
      pop(q(".s10-m1"), 0.12, "618 880");
      pop(q(".s10-r1"), 0.62, "282 1028");
      etiqueta(null, ".s10-e1", INSTANTE);

      // ---------- "a cualquier hora": la hora hace punch y sale la luna ----------
      tl.to(q(".s10-estado"), { opacity: 1, duration: 0.15 }, CUALQUIER);
      tl.fromTo(q(".s10-estado"), { scale: 1, svgOrigin: "450 652" }, { scale: 1.28, svgOrigin: "450 652", duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, CUALQUIER);
      qa(".s10-h").forEach((h, i) => {
        const o = i === 0 ? "616 904" : "286 1052";
        tl.to(h, { scale: 1.4, svgOrigin: o, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, CUALQUIER + 0.04);
      });
      tl.to(qa(".s10-h"), { fill: "#5ce611", duration: 0.2 }, CUALQUIER + 0.04);
      dibujar([q(".s10-luna")], CUALQUIER - 0.05, 0.6);
      tl.fromTo(q(".s10-luna"), { rotation: -20, svgOrigin: "870 650" }, { rotation: 0, svgOrigin: "870 650", duration: 0.9, ease: "power2.out" }, CUALQUIER - 0.05);
      pop(q(".s10-estrella"), CUALQUIER + 0.45, "954 652");
      tl.to(q(".s10-estrella"), { rotation: 90, svgOrigin: "954 652", duration: 1.6, ease: "sine.inOut" }, CUALQUIER + 0.8);
      etiqueta(".s10-e1", ".s10-e2", CUALQUIER);

      // ---------- "con tus precios y tus horarios" ----------
      pop(q(".s10-chip1"), PRECIOS, "844 822");
      dibujar([q(".s10-hilo1")], PRECIOS + 0.12, 0.45);
      pop(q(".s10-nodo1"), PRECIOS + 0.5, "546 958");
      pop(q(".s10-chip2"), HORARIOS, "844 942");
      dibujar([q(".s10-hilo2")], HORARIOS + 0.12, 0.45);
      pop(q(".s10-nodo2"), HORARIOS + 0.5, "546 992");
      tl.fromTo(q(".s10-aguja"), { rotation: 0, svgOrigin: "756 942" }, { rotation: 360, svgOrigin: "756 942", duration: 1.2, ease: "power2.inOut" }, HORARIOS + 0.1);
      // la respuesta "se carga" con los datos: dos pulsos
      tl.to(q(".s10-r1"), { scale: 1.05, svgOrigin: "282 1028", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, PRECIOS + 0.55);
      tl.to(q(".s10-r1"), { scale: 1.05, svgOrigin: "282 1028", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, HORARIOS + 0.55);
      // la luna se apaga cuando entran los datos
      tl.to(qa(".s10-luna, .s10-estrella"), { opacity: 0.35, duration: 0.4 }, PRECIOS);

      // ---------- "Agenda turnos": el costado se apaga, la charla sube, tarjeta de turno ----------
      tl.to(qa(".s10-hilo1, .s10-hilo2, .s10-nodo1, .s10-nodo2"), { opacity: 0, duration: 0.25 }, AGENDA - 0.25);
      tl.to(q(".s10-costado"), { opacity: 0.35, duration: 0.4 }, AGENDA - 0.2);
      subir(-126, AGENDA - 0.05);
      pop(q(".s10-turno"), AGENDA + 0.2, "282 1200");
      dibujar([q(".s10-tilde1")], TURNOS, 0.35);
      tl.to(q(".s10-turno"), { scale: 1.04, svgOrigin: "282 1200", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, TURNOS + 0.3);
      etiqueta(".s10-e2", ".s10-e3", AGENDA);

      // ---------- "toma pedidos" ----------
      subir(-300, TOMA - 0.1);
      pop(q(".s10-pedido"), TOMA + 0.12, "282 1332");
      dibujar([q(".s10-tilde2")], PEDIDOS + 0.05, 0.35);
      tl.to(q(".s10-pedido"), { scale: 1.04, svgOrigin: "282 1332", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, PEDIDOS + 0.35);

      // ---------- "cuando la consulta es para vos" ----------
      tl.to(q(".s10-costado"), { opacity: 0, x: 30, duration: 0.4, ease: "power2.in" }, CUANDO - 0.1);
      subir(-446, CONSULTA - 0.15);
      pop(q(".s10-m2"), CONSULTA, "618 1418");
      // escribiendo... mientras aparece la dueña
      pop(q(".s10-escribe"), CONSULTA + 0.35, "282 1496");
      // (un solo scroll en "consulta": ninguna tarjeta queda cortada a la mitad)
      qa(".s10-pt").forEach((d, i) => {
        tl.fromTo(d, { y: 0 }, { y: -8, duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 3 }, CONSULTA + 0.45 + i * 0.09);
      });
      dibujar(qa(".s10-dib-d"), VOS - 0.1, 0.5, 1, 0.04);
      gsap.set(q(".s10-ana"), { opacity: 0 });
      tl.fromTo(q(".s10-ana"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, VOS + 0.3);

      // ---------- "te la pasa" ----------
      tl.to(q(".s10-escribe"), { opacity: 0, duration: 0.1 }, TE - 0.05);
      pop(q(".s10-r2"), TE - 0.05, "282 1504");
      dibujar([q(".s10-flecha")], TE + 0.1, 0.55);
      pop(q(".s10-punta"), PASA + 0.35, "820 1000");
      etiqueta(".s10-e3", ".s10-e4", TE);
      // a la dueña le llega: punch y avisito
      tl.to(q(".s10-duena"), { scale: 1.08, svgOrigin: "880 1176", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, PASA + 0.45);
      gsap.set(qa(".s10-aviso"), { opacity: 0 });
      tl.fromTo(qa(".s10-aviso"), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: 0.2, stagger: 0.08, ease: "power2.out" }, PASA + 0.5);
      tl.to(qa(".s10-aviso"), { opacity: 0.4, duration: 0.15, yoyo: true, repeat: 1 }, PASA + 0.8);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
