    [data-composition-id="ambiente"] .amb-titulo { position: absolute; right: 60px; top: 66px; font-family: "Outfit", sans-serif; font-weight: 900; font-size: 38px; letter-spacing: 0.06em; color: #f5b82e; }

      <div class="amb-vineta"></div>
      <div class="amb-cabecera">
        <div class="amb-vivo"><div class="amb-punto"></div><div class="amb-vivo-txt">EN VIVO</div></div>

      </div>
      <div class="amb-flash"></div>

  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 70.61;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(q(".amb-punto"), { opacity: 1 }, { opacity: 0.25, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 0.6) }, 0);
      // la cabecera del seminario se va cuando entra Orus
      tl.to(q(".amb-cabecera"), { opacity: 0, duration: 0.4, ease: "power2.in" }, 50.3);
      // flashes cálidos en cada explosión de pirotecnia
      [[2.04, 0.3], [6.43, 0.22], [17.96, 0.24], [21.64, 0.32], [40.0, 0.0]].forEach(([t, v]) => {
        if (!v) return;
        tl.to(q(".amb-flash"), { opacity: v, duration: 0.03 }, t);
        tl.to(q(".amb-flash"), { opacity: 0, duration: 0.4, ease: "power2.out" }, t + 0.04);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
