  <script>
    (function () {
      const ID = "s01-imposible";
      const DUR = 3.81;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      PX.llenar(root);
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      const DIFICIL = 0.83, ULTIMO = 1.94, VIDEOJUEGO = 2.69;

      // la barra de dificultad: segmentos que se llenan de amarillo a rosa
      const barra = q(".s01-barra");
      for (let i = 0; i < 11; i++) {
        const s = document.createElement("div");
        s.className = "s01-seg";
        s.style.left = 8 + i * 80 + "px";
        s.style.background = i < 5 ? "#ffd23f" : i < 9 ? "#ff3d8b" : "#f4f1e6";
        barra.appendChild(s);
      }
      const segs = qa(".s01-seg");

      // cuadro 0: el título ya está a medio caer
      tl.fromTo(q(".s01-titulo"), { y: -60, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.25, ease: "steps(4)" }, 0);

      tl.fromTo([q(".s01-rot"), barra], { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "steps(2)" }, 0.25);
      gsap.set(segs, { opacity: 0 });
      segs.forEach((s, i) => tl.to(s, { opacity: 1, duration: 0.02 }, DIFICIL - 0.3 + i * 0.12));
      // se pasa de rosca: la barra tiembla y revienta
      tl.to(barra, { x: 10, duration: 0.04, yoyo: true, repeat: 13, ease: "none" }, ULTIMO - 0.2);
      gsap.set(q(".s01-sello"), { opacity: 0 });
      tl.fromTo(q(".s01-sello"), { opacity: 0, scale: 2.6, rotation: -12 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.15, ease: "power4.in", immediateRender: false }, ULTIMO + 0.15);
      sacudon(ULTIMO + 0.3, 1.4);
      tl.to(q(".s01-sello"), { scale: 1.06, duration: 0.2, yoyo: true, repeat: 4, ease: "steps(2)" }, ULTIMO + 0.5);

      // la escalera hasta el último nivel se arma de a bloques
      const bl = qa(".s01-bloque");
      gsap.set(bl, { opacity: 0 });
      bl.forEach((b, i) => tl.fromTo(b, { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.12, ease: "steps(3)", immediateRender: false }, 0.15 + i * 0.07));
      gsap.set([q(".s01-cala"), q(".s01-meta")], { opacity: 0 });
      tl.fromTo(q(".s01-cala"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2, ease: "steps(3)", immediateRender: false }, ULTIMO);

      const jug = q(".s01-jug");
      tl.fromTo(jug, { x: -180 }, { x: 0, duration: 0.6, ease: "steps(6)" }, 0);
