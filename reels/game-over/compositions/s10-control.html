  <script>
    (function () {
      const ID = "s10-control";
      const DUR = 6.11;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      PX.llenar(root);
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // A: ella se va con la campera del de enfrente pero mira para atrás a la tuya
      tl.fromTo(q(".s10-jug"), { x: -60 }, { x: 0, duration: 0.3, ease: "steps(4)" }, 0);
      tl.to(q(".s10-jug"), { scaleX: -1, duration: 0.05, ease: "steps(1)" }, CAMPERA - 0.1);

      gsap.set([q(".s10-cor"), q(".s10-mas")], { opacity: 0 });
      tl.fromTo(q(".s10-cor"), { opacity: 1, y: 0 }, { opacity: 1, y: -120, duration: 0.6, ease: "steps(6)", immediateRender: false }, LINDA);
      tl.fromTo(q(".s10-mas"), { opacity: 1, y: 0 }, { opacity: 1, y: -120, duration: 0.6, ease: "steps(6)", immediateRender: false }, LINDA + 0.05);

      tl.fromTo(q(".s10-cartel"), { opacity: 0, scaleY: 0.1 }, { opacity: 1, scaleY: 1, duration: 0.15, ease: "steps(3)", immediateRender: false }, MEJOR - 0.1);
      tl.to(q(".s10-cartel"), { scale: 1.05, duration: 0.1, yoyo: true, repeat: 1, ease: "steps(2)" }, JUEGO);
      tl.to(q(".s10-camp"), { scale: 1.12, transformOrigin: "50% 100%", duration: 0.15, ease: "steps(2)" }, MEJOR);

      // C: el control roto
      gsap.set(q(".s10-joy"), { opacity: 0 });
      tl.fromTo(q(".s10-joy"), { opacity: 1, y: 600 }, { opacity: 1, y: 0, duration: 0.25, ease: "steps(5)", immediateRender: false }, LO - 0.1);
      tl.to([q(".s10-palo"), q(".s10-bola")], { rotation: -14, transformOrigin: "50% 100%", duration: 0.08, yoyo: true, repeat: 3, ease: "steps(1)" }, LO + 0.2);
      // se parte
      tl.to(q(".s10-bola"), { x: 260, y: 420, rotation: 200, duration: 0.5, ease: "power2.in" }, ROTO);
      tl.to(q(".s10-palo"), { rotation: 58, transformOrigin: "50% 100%", duration: 0.12, ease: "steps(2)" }, ROTO);
      sacudon(ROTO, 1.5);
      const ch = qa(".s10-chispa");
      gsap.set(ch, { opacity: 0 });
      [[-120, -80], [130, -110], [-60, -160], [90, -40]].forEach(([x, y], i) => {
        tl.fromTo(ch[i], { opacity: 1, x: 0, y: 0 }, { opacity: 1, x, y, duration: 0.35, ease: "steps(5)", immediateRender: false }, ROTO + 0.02);
        tl.set(ch[i], { opacity: 0 }, ROTO + 0.4);
      });
      gsap.set(q(".s10-roto"), { opacity: 0 });
      tl.fromTo(q(".s10-roto"), { opacity: 0, scale: 2.4, rotation: 14 }, { opacity: 1, scale: 1, rotation: 6, duration: 0.14, ease: "power4.in", immediateRender: false }, CONTROL - 0.1);
      sacudon(CONTROL + 0.05, 1);
      tl.to(q(".s10-roto"), { scale: 1.06, duration: 0.12, yoyo: true, repeat: 2, ease: "steps(2)" }, CONTROL + 0.2);

      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
