<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/ascensor.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-trancado"] .s01-capa, [data-composition-id="s01-trancado"] .s01-escenario { position: absolute; inset: 0; }
    [data-composition-id="s01-trancado"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-trancado"] .s01-sello { left: 140px; top: 640px; font-size: 76px; }
    [data-composition-id="s01-trancado"] .s01-mus { left: 300px; top: 830px; }
  </style>
  <div id="root" data-composition-id="s01-trancado" data-width="1080" data-height="1920" data-duration="4.91">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="4.91" data-track-index="0">
      <div class="s01-escenario">
        <svg class="s01-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="as-sello s01-sello">NUNCA LA LLAMÉ</div>
        <div class="as-tag s01-mus">MÚSICA DE ASCENSOR</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-trancado";
      const DUR = 4.91;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const svg = root.querySelector(".s01-svg");
      svg.innerHTML =
        `<g class="s01-val">${AS.valeria(800, 1540, 1.22, { cara: "seria" })}</g>` +
        `<g class="s01-r1">${AS.ruben(300, 1540, 1.27, { cara: "nervioso", sudor: true })}</g>` +
        `<g class="s01-r2">${AS.ruben(300, 1540, 1.27, { cara: "culpa", sudor: true })}</g>` +
        `<g class="s01-notas">${AS.nota(200, 760, 1.2, AS.NAR, "s01-n")}${AS.nota(560, 700, 1, AS.AMBAR, "s01-n")}${AS.nota(880, 780, 1.3, AS.NAR, "s01-n")}${AS.nota(400, 640, 0.9, AS.AMBAR, "s01-n")}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = AS.kit(tl, root);
      const { q, qa } = K;

      const TRANCA = 0.33, CLIENTA = 1.75, NUNCA = 2.5, LLAME = 3.0, MUSICA = 3.25;

      // cuadro 0: primer plano de Rubén; el ascensor frena en seco y se abre el plano: está con ella
      const esc = q(".s01-escenario");
      gsap.set(esc, { transformOrigin: "28% 62%" });
      tl.fromTo(esc, { scale: 1.45 }, { scale: 1.38, duration: CLIENTA - 0.1, ease: "none" }, 0);
      K.sacudon(esc, TRANCA, 1.8);
      tl.to(esc, { scale: 1, duration: 0.45, ease: "power3.inOut" }, CLIENTA - 0.1);
      tl.to(esc, { scale: 1.04, duration: DUR - CLIENTA - 0.4, ease: "none" }, CLIENTA + 0.35);
      K.respirar(q(".s01-r1"), 0, DUR, 5);
      K.respirar(q(".s01-r2"), 0, DUR, 5);
      K.respirar(q(".s01-val"), 0.3, DUR - 0.3, 3);
      K.sudar(0.4, DUR - 0.4);
      // ella ya está ahí, inmóvil, mirándolo
      gsap.set(q(".s01-r2"), { opacity: 0 });
      tl.set(q(".s01-r1"), { opacity: 0 }, NUNCA);
      tl.set(q(".s01-r2"), { opacity: 1 }, NUNCA);
      K.parpadear(".s01-val .as-v-ojos", [1.2, 3.6]);
      K.hablar(".s01-r1 .as-r-boca", 0.05, 4, 0.1);
      K.hablar(".s01-r2 .as-r-boca", NUNCA, 2, 0.1);
      K.sello(q(".s01-sello"), LLAME, -4);
      tl.to(q(".s01-sello"), { opacity: 0, y: -20, duration: 0.2 }, MUSICA + 0.6);
      // silencio incómodo: música de ascensor
      K.pop(q(".s01-mus"), MUSICA);
      K.flotarNotas(".s01-n", MUSICA, DUR - MUSICA);

      K.salida(q("#s01-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
