<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/ascensor.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-justo"] .s03-capa, [data-composition-id="s03-justo"] .s03-escenario { position: absolute; inset: 0; }
    [data-composition-id="s03-justo"] svg.s03-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

  </style>
  <div id="root" data-composition-id="s03-justo" data-width="1080" data-height="1920" data-duration="4.63">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="4.63" data-track-index="0">
      <div class="s03-escenario">
        <svg class="s03-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>

      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-justo";
      const DUR = 4.63;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const svg = root.querySelector(".s03-svg");
      svg.innerHTML = ['NOVIEMBRE','OCTUBRE','SETIEMBRE','AGOSTO','JULIO','JUNIO','MAYO','ABRIL'].map((m, i) => `<g class="s03-hoja s03-h${i}">${AS.calendario(540, 820, 1.05, m, { fsMes: m.length > 7 ? 36 : 44 })}</g>`).join('') + `<g class="s03-v1">${AS.valeria(800, 1540, 1.22, {"cara":"seria"})}</g>` + `<g class="s03-v2">${AS.valeria(800, 1540, 1.22, {"cara":"ceja"})}</g>` + `<g class="s03-r1">${AS.ruben(300, 1540, 1.27, {"cara":"nervioso","brazo":"celular","sudor":true})}</g>` + `<g class="s03-r2">${AS.ruben(300, 1540, 1.27, {"cara":"triste","sudor":true})}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = AS.kit(tl, root);
      const { q, qa } = K;
      
      const JUSTO = 0.85, LLAMAR = 2.25, ESTAMOS = 2.98, NOV = 3.42, RUBEN = 3.85;
      K.respirar(q(".s03-r1"), 0, DUR, 6);
      K.respirar(q(".s03-r2"), 0, DUR, 4);
      K.respirar(q(".s03-v1"), 0, DUR, 3);
      K.sudar(0.1, DUR - 0.1);
      gsap.set(qa(".s03-r2, .s03-v2"), { opacity: 0 });
      // el celular aparece en "justo": hace que llama
      const cel = q(".s03-r1 .as-r-brazo");
      K.popSvg(cel, JUSTO - 0.1, "300 1290", 0.35, 0.5);
      K.hablar(".s03-r1 .as-r-boca", 0.05, 8, 0.1);
      tl.fromTo(q(".s03-r1 .as-cel"), { rotation: -8 }, { rotation: 8, duration: 0.08, yoyo: true, repeat: 9, ease: "none", svgOrigin: "10 -250", immediateRender: false }, LLAMAR);
      // el calendario: aparece en abril y vuelan las hojas hasta noviembre
      const hojas = qa(".s03-hoja");
      gsap.set(hojas, { opacity: 0 });
      hojas.forEach((h) => tl.set(h, { opacity: 1 }, ESTAMOS - 0.3));
      K.popSvg(q(".s03-h7"), ESTAMOS - 0.3, "540 820", 0.3, 0.6);
      [7, 6, 5, 4, 3, 2, 1].forEach((i, k) => {
        const t = ESTAMOS + 0.05 + k * ((NOV - ESTAMOS - 0.05) / 7);
        tl.to(q(".s03-h" + i), { y: -380, x: k % 2 ? 160 : -160, rotation: k % 2 ? 25 : -25, opacity: 0, duration: 0.3, ease: "power2.in", svgOrigin: "540 650" }, t);
      });
      K.sacudon(q(".s03-h0"), NOV, 1);
      tl.set(q(".s03-v1"), { opacity: 0 }, ESTAMOS);
      tl.set(q(".s03-v2"), { opacity: 1 }, ESTAMOS);
      K.hablar(".s03-v2 .as-v-boca", ESTAMOS, 6, 0.1);
      tl.set(q(".s03-r1"), { opacity: 0 }, RUBEN);
      tl.set(q(".s03-r2"), { opacity: 1 }, RUBEN);
      tl.fromTo(q(".s03-r2"), { scale: 1 }, { scale: 0.94, svgOrigin: "300 1540", duration: 0.5, ease: "power2.out", immediateRender: false }, RUBEN);
      
      K.salida(q("#s03-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
