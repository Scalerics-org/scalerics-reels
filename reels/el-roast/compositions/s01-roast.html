      const ID = "s01-roast";

      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);

      tl.fromTo(q(".s01-mic"), { opacity: 0.6, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);

      tl.fromTo(q(".s01-comico"), { opacity: 0.7, x: 220 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo(q(".s01-brasas").children, { opacity: 0.4 }, { opacity: 1, duration: 0.25, stagger: { each: 0.06, yoyo: true, repeat: 15 } }, 0.1);
      // "buenas noches": saluda

      tl.to(q(".s01-brazo"), { rotation: -8, svgOrigin: "778 1040", duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, NOCHES + 0.2);

      // "hoy rosteamos": cae de golpe

      tl.fromTo(q(".s01-hoy"), { opacity: 0, scale: 2.6 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, ROSTEAMOS - 0.12);
      sacudon(ROSTEAMOS + 0.04, 1);
      // el local cae arriba de la parrilla
      gsap.set(q(".s01-local"), { opacity: 0 });
      tl.fromTo(q(".s01-local"), { opacity: 1, y: -700 }, { opacity: 1, y: 0, duration: 0.3, ease: "bounce.out", immediateRender: false }, ROSTEAMOS + 0.1);
      // "a tu negocio": rosa neón
      tl.fromTo(q(".s01-negocio"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, NEGOCIO - 0.14);
      tl.to(q(".s01-negocio"), { opacity: 0.75, duration: 0.05, yoyo: true, repeat: 3 }, NEGOCIO + 0.1);
      // el brazo señala al local
      tl.to(q(".s01-brazo"), { rotation: -50, svgOrigin: "778 1040", duration: 0.2, ease: "power3.out" }, NEGOCIO);

      // "Y": el local traga saliva
      gsap.set(q(".s01-gota"), { opacity: 0 });

        tl.to(l, { scaleY: 0.82, scaleX: 1.08, svgOrigin: "370 1225", duration: 0.12, yoyo: true, repeat: 9, ease: "sine.inOut" }, NO + 0.35 + i * 0.03);
