  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 68.76;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // nubes que pasan sin parar por la ventanilla (cuatro vueltas)

        tl.to(q(".amb-luz"), { opacity: 1, duration: 0.05 }, t);
        tl.to(q(".amb-icono"), { fill: "#16313a", stroke: "#16313a", duration: 0.05 }, t);
        tl.fromTo(q(".amb-cartel"), { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t);
        tl.to(q(".amb-luz"), { opacity: 0.75, duration: 0.3 }, t + sostener);

      [[0.05, 1.2], [10.55, 1.0], [15.72, 1.0], [21.76, 1.0], [28.26, 1.0], [37.85, 0.0], [38.15, 1.0]].forEach(([t, s]) => ding(t, s));
