  <script>
    (function () {
      const ID = "s01-bienvenidos";
      const DUR = 2.93;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      golpe(q(".s01-compra"), COMPRA);

      // "tu local": se pinta en el fuselaje

      tl.fromTo(q(".s01-local"), { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.2, ease: "back.out(2)", immediateRender: false }, LOCAL - 0.1);

      tl.fromTo(q(".s01-tablero"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 1.6);
