  <script>
    (function () {
      const ID = "s12-tienda";
      const DUR = 3.97;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s12-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      const ARMAMOS = 0.55;
      const TIENDA = 1.62;
      const VE = 3.27;

      // cuadro 0: el celular sube (entra Scalerics: todo se ordena)
      tl.fromTo(q(".s12-cel"), { y: 260, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 0);
      tl.fromTo(q(".s12-escenario"), { scale: 1.04 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);
      // los productos aparecen de a uno ("te armamos")
      [".s12-p1", ".s12-p2", ".s12-p3", ".s12-p4"].forEach((p, i) => {
        gsap.set(q(p), { opacity: 0 });
        tl.fromTo(q(p), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)", immediateRender: false }, ARMAMOS - 0.2 + i * 0.12);
      });
      // "tienda online": el título late
      tl.fromTo(q(".s12-tt"), { scale: 1 }, { scale: 1.15, svgOrigin: "540 708", duration: 0.14, yoyo: true, repeat: 1, immediateRender: false }, TIENDA);
      gsap.set([q(".s12-sticker"), q(".s12-ok")], { opacity: 0 });
      tl.fromTo(q(".s12-sticker"), { opacity: 0, scale: 2.2, rotation: 8 }, { opacity: 1, scale: 1, rotation: 6, duration: 0.14, ease: "power4.in", immediateRender: false }, 1.92 - 0.08);
      sacudon(1.98, 0.7);
      tl.fromTo(q(".s12-ok"), { opacity: 0, scale: 0.3, svgOrigin: "250 760" }, { opacity: 1, scale: 1, svgOrigin: "250 760", duration: 0.3, ease: "back.out(3)", immediateRender: false }, 2.2);

      // "ve el precio": los precios hacen pop en naranja
      const precios = root.querySelectorAll(".s12-pr");
      precios.forEach((p, i) => {
        tl.to(p, { fill: "#f26b1d", duration: 0.08 }, VE + 0.04 * i);
        tl.fromTo(p, { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.3, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, VE + 0.04 * i);
      });

      // salida
      tl.to(q("#s12-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
