  <script>
    (function () {
      const ID = "s10-me-bajo";
      const DUR = 3.95;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      const BAJO = 0.3;
      const ENFRENTE = 1.9;
      const DESPEGA = 2.5;
      const SOLO = 2.8;

      // cuadro 0: tu avión y la puerta que se abre
      tl.fromTo(q(".s10-tuyo"), { x: -60, opacity: 0.6 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.to(q(".s10-puerta"), { x: -96, duration: 0.2, ease: "power2.in" }, 0.05);
      // "me bajo": el tobogán se infla de golpe
      gsap.set(q(".s10-tobogan"), { opacity: 0, clipPath: "inset(0 100% 100% 0)" });
      tl.to(q(".s10-tobogan"), { opacity: 1, duration: 0.02 }, BAJO - 0.1);
      tl.to(q(".s10-tobogan"), { clipPath: "inset(0 0% 0% 0)", duration: 0.25, ease: "back.out(1.4)" }, BAJO - 0.1);
      gsap.set(q(".s10-bajo"), { opacity: 0 });
      tl.fromTo(q(".s10-bajo"), { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, BAJO - 0.08);
      sacudon(BAJO + 0.06, 1);
      // se tira por el tobogán
      tl.fromTo(q(".s10-pasajero"), { x: 0, y: 0, rotation: 0 }, { x: 290, y: 300, rotation: -20, svgOrigin: "320 990", duration: 0.7, ease: "power2.in" }, 0.45);
      // y se va caminando para el otro lado
      tl.to(q(".s10-pasajero"), { x: 400, y: 280, rotation: 0, duration: 0.5, ease: "power1.out" }, 1.15);
      tl.to(q(".s10-pasajero"), { opacity: 0, duration: 0.2 }, 1.55);

      // "vuelo de enfrente"
      gsap.set([q(".s10-otro"), q(".s10-enfrente")], { opacity: 0 });
      tl.fromTo(q(".s10-otro"), { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.5);
      tl.fromTo(q(".s10-enfrente"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, immediateRender: false }, ENFRENTE);
      tl.to(q(".s10-bajo"), { opacity: 0.25, duration: 0.2 }, 1.6);

      // "despega solo": el otro se va al cielo
      const est = q(".s10-estela");
      gsap.set(est, { opacity: 0, clipPath: "inset(100% 0 0 0)" });
      tl.to(est, { opacity: 1, duration: 0.02 }, DESPEGA);
      tl.to(est, { clipPath: "inset(0% 0 0 0)", duration: 0.7, ease: "power2.in" }, DESPEGA);
      tl.to(q(".s10-otro"), { x: 240, y: -420, rotation: -32, svgOrigin: "860 1240", duration: 0.9, ease: "power2.in" }, DESPEGA);
      gsap.set(q(".s10-solo"), { opacity: 0, rotation: -4 });
      tl.fromTo(q(".s10-solo"), { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, SOLO - 0.08);
      sacudon(SOLO + 0.05, 0.8);
      tl.to(q(".s10-solo"), { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1 }, SOLO + 0.3);

      // salida

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
