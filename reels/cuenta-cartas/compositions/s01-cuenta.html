<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/casino.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-cuenta"] .s01-capa, [data-composition-id="s01-cuenta"] .s01-escenario { position: absolute; inset: 0; }
    [data-composition-id="s01-cuenta"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-cuenta"] .s01-cuenta { right: 50px; top: 560px; }
    [data-composition-id="s01-cuenta"] .s01-memoria { left: 50px; top: 560px; }
    [data-composition-id="s01-cuenta"] .s01-cliente { left: 540px; top: 1250px; transform: translateX(-50%); font-size: 64px; }
  </style>
  <div id="root" data-composition-id="s01-cuenta" data-width="1080" data-height="1920" data-duration="5.69">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="5.69" data-track-index="0">
      <div class="s01-escenario">
        <svg class="s01-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="cc-tag mag s01-cuenta" style="border-color:#6fe3ec;color:#6fe3ec">CUENTA CARTAS</div>
        <div class="cc-tag s01-memoria">JUEGA DE MEMORIA</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-cuenta";
      const DUR = 5.69;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const C = CC;
      const cartas = [[220, "senora", "c", "Q"], [420, "muchacho", "p", "J"], [660, "nadie", "t", "?"], [860, "gonzalo", "d", "K"]];
      root.querySelector(".s01-svg").innerHTML =
        `<g class="s01-k">${C.crupier(540, 1220, 0.95, { carta: true, cara: "ceja" })}</g>` +
        `<g class="s01-d">${C.dueno(200, 1250, 0.85, { cara: "confiado" })}</g>` +
        `<g class="s01-f">${C.enfrente(880, 1250, 0.85, { cara: "sobrador" })}</g>` +
        C.mesa(1130) +
        `<g class="s01-fichas">${C.pila(130, 1500, 4, 90, C.ORO)}${C.pila(960, 1500, 7, 90, C.MAG)}${C.pila(1000, 1530, 5, 90, C.PANO4)}</g>` +
        cartas.map(([x, cara, p, v], i) => `<g class="s01-c s01-c${i}">${C.naipe(x, 1400, 150, { doble: true, cara, palo: p, valor: v, rot: (i - 1.5) * 4 })}</g>`).join("") +
        // el de enfrente cuenta: +1 -1 +1
        `<g class="s01-cuenta-n">${["+1", "-1", "+1"].map((t, i) => `<text class="s01-n s01-n${i}" x="${790 + i * 80}" y="${760 - i * 40}" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="54" fill="#6fe3ec" stroke="${C.INK}" stroke-width="10" paint-order="stroke">${t}</text>`).join("")}</g>` +
        C.nube(250, 700, 330, 190, 210, 810, { cls: "s01-nube" }) +
        `<g class="s01-garabato"><path d="M140 690 C170 650 200 740 230 690 S290 650 320 700 S360 730 350 670" fill="none" stroke="${C.INK}" stroke-width="7" stroke-linecap="round"/>
          <text x="250" y="770" text-anchor="middle" font-family="Lexend" font-weight="900" font-size="44" fill="${C.INK}">¿...?</text></g>`;
      const tl = gsap.timeline({ paused: true });
      const K = C.kit(tl, root);
      const { q, qa } = K;

      const CUENTA = 0.39, VOS = 1.55, MEMORIA = 2.08, MESA = 2.86, CARTA = 4.09, CLIENTE = 4.93;

      // cuadro 0: la mesa ya está armada
      tl.fromTo(q(".s01-escenario"), { scale: 1.06 }, { scale: 1, duration: 1.2, ease: "power2.out", transformOrigin: "50% 60%" }, 0);
      K.respirar(q(".s01-k"), 0, 5, 6);
      // "cuenta cartas": tag sobre el de enfrente y la cuenta
      K.sello(q(".s01-cuenta"), CUENTA, 3);
      qa(".s01-n").forEach((n, i) => {
        gsap.set(n, { opacity: 0 });
        tl.fromTo(n, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)", immediateRender: false }, CUENTA + 0.1 + i * 0.3);
      });
      tl.to(q(".cc-f-ojos"), { x: 8, duration: 0.15, yoyo: true, repeat: 3, ease: "power1.inOut" }, CUENTA);
      // "vos jugás de memoria": nube vacía arriba del dueño
      K.popSvg(q(".s01-nube"), VOS, "250 700", 0.35, 0.4);
      K.popSvg(q(".s01-garabato"), VOS + 0.15, "250 710", 0.3, 0.4);
      K.dibujar(q(".s01-garabato path"), VOS + 0.15, 0.5);
      K.sello(q(".s01-memoria"), MEMORIA, -3);
      tl.to(q(".s01-d .cc-d-cabeza"), { rotation: -6, svgOrigin: "0 -260", duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, MEMORIA);
      // "en esta mesa": se van los tags, la crupier reparte
      tl.to([q(".s01-cuenta"), q(".s01-memoria"), q(".s01-nube"), q(".s01-garabato"), q(".s01-cuenta-n")], { opacity: 0, y: -20, duration: 0.25 }, MESA - 0.1);
      tl.to(q(".cc-k-brazo"), { rotation: 14, svgOrigin: "150 -190", duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, MESA);
      cartas.forEach((c, i) => K.repartir(q(".s01-c" + i), MESA + 0.1 + i * 0.2, 780 - c[0], -330, 160, 0.38));
      // "carta... cliente": se dan vuelta y son caras de clientes
      cartas.forEach((c, i) => K.voltear(q(".s01-c" + i + " .cc-naipe"), CARTA + 0.1 + i * 0.18));
      tl.to(q(".s01-escenario"), { scale: 1.1, duration: 1.2, ease: "power2.inOut", transformOrigin: "50% 72%" }, CARTA);

      K.salida(q("#s01-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
