  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 75.67;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const TURNOS = [[0,"k"],[8.83,"c"],[12.21,"f"],[15.12,"k"],[19.7,"c"],[22.93,"f"],[23.95,"k"],[28.59,"c"],[30.18,"f"],[33.24,"k"],[53.75,"f"],[56.02,"o"],[65.31,"k"],[68.93,"o"]];
      const MANOS = [12.21, 22.93, 30.18]; // "Marisa", "Ya le escribí", "Gonzalo": mano para el de enfrente
      const FLASHES = [37.81, 56.32];
      const SCALERICS = 56.32;
      const CASA = 67.04;

      // bokeh de la sala (posiciones fijas)
      const BK = [[90, 470, 70, "#ff2e88", 0.18], [990, 560, 90, "#f2c14e", 0.14], [180, 1180, 60, "#f2c14e", 0.12], [930, 1250, 80, "#ff2e88", 0.14], [60, 860, 40, "#6fe3ec", 0.12], [1030, 920, 50, "#ff2e88", 0.12], [520, 470, 40, "#f2c14e", 0.08]];
      q(".am-bokeh").innerHTML = BK.map(([x, y, r, c, o], i) => `<div class="am-bk am-bk${i}" style="left:${x - r}px;top:${y - r}px;width:${r * 2}px;height:${r * 2}px;background:${c};opacity:${o}"></div>`).join("");
      BK.forEach((b, i) => tl.fromTo(q(".am-bk" + i), { y: 0, x: 0 }, { y: -40 - (i % 3) * 20, x: (i % 2 ? 1 : -1) * 20, duration: DUR, ease: "none" }, 0));

      // el neón del cartel titila de vez en cuando
            [[0.1, 0.35], [9.4, 0.5], [26.3, 0.4], [44.2, 0.5], [61.5, 0.4]].forEach(([t]) => {
        tl.to(q(".am-cartel b"), { opacity: 0.25, duration: 0.03 }, t);
        tl.to(q(".am-cartel b"), { opacity: 1, duration: 0.03 }, t + 0.07);
        tl.to(q(".am-cartel b"), { opacity: 0.4, duration: 0.03 }, t + 0.16);
        tl.to(q(".am-cartel b"), { opacity: 1, duration: 0.04 }, t + 0.21);

      const CH = { k: ".am-chk", c: ".am-chc", f: ".am-chf", o: ".am-cho" };
      let ant = null;

        const el = q(CH[quien]);

        tl.fromTo(q(".am-e" + (i + 1)), { opacity: 0, scale: 1.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, t);
