<template>

  <style>

    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s11-tuyas"] .s11-capa, [data-composition-id="s11-tuyas"] .s11-escenario { position: absolute; inset: 0; }
    [data-composition-id="s11-tuyas"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s11-tuyas"] .s11-tuyas { left: 540px; top: 520px; transform: translateX(-50%); font-size: 66px; }
    [data-composition-id="s11-tuyas"] .s11-gracias { right: 40px; top: 920px; }
  </style>
  <div id="root" data-composition-id="s11-tuyas" data-width="1080" data-height="1920" data-duration="6.29">
    <div id="s11-escena" class="s11-capa clip" data-start="0" data-duration="6.29" data-track-index="0">
      <div class="s11-escenario">
        <svg class="s11-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="cc-sello oro s11-tuyas">ERAN TUYAS</div>
        <div class="cc-globo pet s11-gracias">¡Gracias, vecino!</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s11-tuyas";
      const DUR = 6.29;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const C = CC;
      const svg = (h) => { root.querySelector(".s11-svg").innerHTML = h; };
      const tl = gsap.timeline({ paused: true });
      const K = C.kit(tl, root);
      const { q, qa } = K;
      const I = C.INK;
      const XS = [165, 395, 625, 855], Y = 880, W = 200, H = Math.round(W * 1.42);
      const caras = ["senora", "muchacho", "nadie", "gonzalo"], palos = ["c", "p", "t", "d"], vals = ["Q", "J", "?", "K"];
      svg(`<g class="s11-d">${C.dueno(220, 1480, 0.85, { cara: "culpa" })}</g>` +
        `<g class="s11-f">${C.enfrente(860, 1480, 0.85, { cara: "guino" })}</g>` +
        C.mesa(1330, { texto: false }) +
        `<g class="s11-fichas">${C.pila(330, 1520, 6, 110, C.ORO)}${C.pila(450, 1540, 4, 110, C.MAG)}</g>` +
        XS.map((x, k) => `<g class="s11-c s11-c${k}">${C.naipe(x, Y, W, { cara: caras[k], palo: palos[k], valor: vals[k], id: "s11" + k })}
          <rect class="s11-oro" x="${x - W / 2 - 8}" y="${Y - H / 2 - 8}" width="${W + 16}" height="${H + 16}" rx="22" fill="none" stroke="${C.ORO}" stroke-width="10"/>
          <g class="s11-sello" transform="translate(${x} ${Y + H / 2 + 6}) rotate(-6)"><rect x="-78" y="-22" width="156" height="44" rx="8" fill="${C.ORO}" stroke="${I}" stroke-width="5"/>
            <text x="0" y="10" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="24" fill="${I}">TU LOCAL</text></g>
          <g class="s11-cor">${C.palo("c", x, Y - H / 2 - 40, 34, C.ORO)}</g></g>`).join(""));
      const PEOR = 0.07, TUYAS = 1.3, CLIENTES = 2.3, ELEGIDO = 3.15, GRACIAS = 4.02, VECINO = 5.03;
      // cuadro 0: las cuatro cartas en fila
      qa(".s11-c").forEach((c, k) => tl.fromTo(c, { y: 40 + k * 10, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, k * 0.06));
      tl.fromTo([q(".s11-d"), q(".s11-f")], { y: 30 }, { y: 0, duration: 0.4, ease: "power2.out" }, 0);
      // "tuyas": borde dorado y sello TU LOCAL
      K.sello(q(".s11-tuyas"), TUYAS, -3);
      qa(".s11-oro").forEach((r, k) => K.dibujar(r, TUYAS - 0.1 + k * 0.08, 0.4));
      qa(".s11-sello").forEach((s, k) => { const x = XS[k]; K.popSvg(s, TUYAS + 0.15 + k * 0.08, `${x} ${Y + H / 2 + 6}`, 0.3, 1.8); });
      // "clientes ya te habían elegido": corazón dorado sobre cada una
      qa(".s11-cor").forEach((s, k) => K.popSvg(s, ELEGIDO - 0.3 + k * 0.1, `${XS[k]} ${Y - H / 2 - 40}`, 0.35, 0.2));
      tl.to(qa(".s11-cor"), { y: -10, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, ELEGIDO + 0.2);
      // "gracias, vecino": se las lleva el de enfrente
      tl.to(q(".s11-tuyas"), { opacity: 0, duration: 0.2 }, GRACIAS - 0.2);
      K.pop(q(".s11-gracias"), GRACIAS);
      qa(".s11-c").forEach((c, k) => {
        const x = XS[k];
        K.origen(c, `${x} ${Y}`);
        tl.to(c, { x: 880 - x, y: 420, scale: 0.35, rotation: 20, opacity: 0.0, duration: 0.55, ease: "power3.in" }, GRACIAS + 0.3 + k * 0.12);
      });
      tl.to(q(".s11-fichas"), { x: 520, duration: 0.5, ease: "power3.inOut" }, VECINO - 0.1);
      tl.to(q(".s11-d .cc-d-cabeza"), { rotation: 6, svgOrigin: "0 -260", duration: 0.3, ease: "power2.out" }, VECINO);

      K.salida(q("#s11-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
