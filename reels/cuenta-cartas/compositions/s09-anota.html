<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/casino.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s09-anota"] .s09-capa, [data-composition-id="s09-anota"] .s09-escenario { position: absolute; inset: 0; }
    [data-composition-id="s09-anota"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s09-anota"] .s09-tag { right: 50px; top: 600px; font-size: 40px; }
  </style>
  <div id="root" data-composition-id="s09-anota" data-width="1080" data-height="1920" data-duration="4.96">
    <div id="s09-escena" class="s09-capa clip" data-start="0" data-duration="4.96" data-track-index="0">
      <div class="s09-escenario">
        <svg class="s09-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="cc-sello s09-tag">EL SECRETO</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s09-anota";
      const DUR = 4.96;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const C = CC;
      const svg = (h) => { root.querySelector(".s09-svg").innerHTML = h; };
      const tl = gsap.timeline({ paused: true });
      const K = C.kit(tl, root);
      const { q, qa } = K;
      const I = C.INK;
      const LX = 70, LY = 640, LW = 560, LH = 600;
      const renglon = (y, txt, col, cls) => `<g class="${cls}"><text x="${LX + 90}" y="${y}" font-family="Caveat" font-weight="700" font-size="72" fill="${col}">${txt}</text>
        <path class="${cls}-ok" d="M${LX + 34} ${y - 22} l14 16 l26 -32" fill="none" stroke="${C.MAG}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>`;
      svg(`<g class="s09-f">${C.enfrente(800, 1460, 1.0, { cara: "guino", libreta: true })}</g>` +
        C.mesa(1310, { texto: false }) +
        `<g class="s09-lib"><g transform="rotate(-4 ${LX + LW / 2} ${LY + LH / 2})">
          <rect x="${LX + 12}" y="${LY + 14}" width="${LW}" height="${LH}" rx="18" fill="#000" opacity="0.4"/>
          <rect x="${LX}" y="${LY}" width="${LW}" height="${LH}" rx="18" fill="${C.CRE}" stroke="${I}" stroke-width="9"/>
          <rect x="${LX}" y="${LY}" width="${LW}" height="96" rx="16" fill="${C.MAG}" stroke="${I}" stroke-width="8"/>
          ${[0, 1, 2, 3, 4, 5].map((k) => `<circle cx="${LX + 70 + k * 84}" cy="${LY}" r="14" fill="${C.CRE2}" stroke="${I}" stroke-width="6"/>`).join("")}
          <text x="${LX + LW / 2}" y="${LY + 64}" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="34" fill="#fff" letter-spacing="6">MIS CLIENTES</text>
          ${[250, 380, 510].map((y) => `<path d="M${LX + 30} ${LY + y + 18} L${LX + LW - 30} ${LY + y + 18}" stroke="${C.PANO4}" stroke-width="3" opacity="0.5"/>`).join("")}
          ${renglon(LY + 250, "quién es", I, "s09-r1")}
          ${renglon(LY + 380, "qué compró", C.PANO, "s09-r2")}
          ${renglon(LY + 510, "qué le prometí", C.ROJO, "s09-r3")}
          <g class="s09-mini">${["senora", "muchacho", "nadie", "gonzalo"].map((c, k) => `<g class="s09-m">` + C.naipe(LX + LW - 60 - k * 16, LY + 150 + k * 8, 70, { cara: c, palo: ["c", "p", "t", "d"][k], valor: ["Q", "J", "?", "K"][k], rot: 10 - k * 7, id: "s09m" + k }) + `</g>`).join("")}</g>
        </g></g>`);
      const ANOTA = 0.69, CARTA = 1.39, QUIEN = 2.24, COMPRO = 3.0, PROMETIO = 4.08;
      // cuadro 0: el de enfrente guiña (flash del ambiente)
      tl.fromTo(q(".s09-f"), { x: 60 }, { x: 0, duration: 0.4, ease: "power3.out" }, 0);
      K.sello(q(".s09-tag"), 0.15, 4);
      // "anota": la libretita al frente
      K.popSvg(q(".s09-lib"), ANOTA - 0.1, "350 940", 0.45, 0.3);
      tl.to(q(".s09-tag"), { opacity: 0, y: -20, duration: 0.2 }, ANOTA + 0.4);
      gsap.set(qa(".s09-m"), { opacity: 0 });
      qa(".s09-m").forEach((n, k) => tl.fromTo(n, { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, CARTA - 0.15 + k * 0.1));
      [[".s09-r1", QUIEN], [".s09-r2", COMPRO], [".s09-r3", PROMETIO]].forEach(([s, t]) => {
        gsap.set(q(s + " text"), { opacity: 0 });
        tl.fromTo(q(s + " text"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
        K.dibujar(q(s + "-ok"), t + 0.25, 0.25);
      });
      tl.to(q(".s09-f .cc-f-lapiz"), { x: 12, y: -8, duration: 0.1, yoyo: true, repeat: 23, ease: "sine.inOut" }, QUIEN - 0.1);
      tl.to(q(".s09-escenario"), { scale: 1.04, duration: DUR, ease: "none", transformOrigin: "40% 50%" }, 0);

      K.salida(q("#s09-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
