      const DUR = 3.81;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);

      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {

      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);

      const latir = (el, t, origen, k) => tl.to(el, { scale: k ?? 1.06, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);

      // tiempos (relativos a la escena = palabras de la locución)
      const CONTRATAR = 0.64;
      const MAS = 1.24;
      const ES = 2.15;
      const SISTEMA = 2.64;

      const GX = 540, GY = 1010;
      const TS = [[210, 1010], [870, 1010], [540, 710]];
      gsap.set(q(".s08-rueda"), { x: GX, y: GY });
      qa(".s08-t").forEach((t, i) => gsap.set(t, { x: TS[i][0], y: TS[i][1], opacity: 0 }));

      dibujar(qa(".s08-dp2"), CONTRATAR + 0.1, 0.4);

      tl.to(qa(".s08-p"), { opacity: 0.35, duration: 0.3 }, MAS + 0.2);
      tl.to(q(".s08-fila"), { x: -8, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, MAS + 0.2);

      tl.fromTo(q(".s08-rueda-in"), { rotation: 0, svgOrigin: "0 0" }, { rotation: 120, svgOrigin: "0 0", duration: DUR - ES, ease: "none" }, ES);
