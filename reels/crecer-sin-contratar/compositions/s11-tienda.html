  </style>

  <script>
    (function () {
      const ID = "s11-tienda";
      const DUR = 4.36;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          // si arranca a medio dibujar (cuadro 0) se ve desde el principio; si no, opacity 0 hasta que arranca
          if (desde != null && desde < 1 && t <= 0) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const latir = (el, t, origen, k) => tl.to(el, { scale: k ?? 1.06, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const sacudir = (el, t) => tl.to(el, { x: "-=6", duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      const badge = (el, t) => tl.fromTo(el.querySelector(".b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      qa(".b-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      const etiqueta = (sel, t, antes) => {
        if (antes) tl.to(q(antes), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

      // tiempos (relativos a la escena = palabras de la locución)
      const TIENDA = 0.9;
      const VENDE = 1.6;
      const SOLA = 1.9;
      const ENVIOS = 2.7;
      const MERCADO = 3.3;
      const PAGO = 3.83;

      gsap.set(q(".s11-camion"), { x: 840, y: 1140 });
      gsap.set(q(".s11-pago"), { x: 800, y: 760 });
      gsap.set(qa(".s11-cab, .s11-prod, .s11-boton, .s11-vendido, .s11-paquete, .s11-pago"), { opacity: 0 });

      // el celular (medio dibujado en el cuadro 0)
      dibujar(qa(".s11-dt"), 0, 0.5, 0.5);
      tl.to(qa(".s11-cab"), { opacity: 1, duration: 0.25 }, 0.3);
      pop(q(".s11-prod"), TIENDA - 0.3, "400 850");
      pop(q(".s11-boton"), TIENDA + 0.1, "400 992");
      etiqueta(".s11-e1", TIENDA);
      // "vende sola"
      latir(q(".s11-boton"), VENDE - 0.1, "400 992", 0.94);
      pop(q(".s11-vendido"), VENDE + 0.05, "400 1110");
      latir(q(".s11-vendido"), SOLA + 0.1, "400 1110");
      // "envíos": sale el paquete al camión
      dibujar(qa(".s11-dc"), ENVIOS - 0.5, 0.4);
      tl.fromTo(q(".s11-paquete"), { opacity: 0, x: 520, y: 1000 }, { opacity: 1, x: 640, y: 960, duration: 0.25, ease: "power2.out" }, ENVIOS - 0.15);
      tl.to(q(".s11-paquete"), { x: 800, y: 1080, duration: 0.35, ease: "power2.in" }, ENVIOS + 0.1);
      tl.to(q(".s11-paquete"), { opacity: 0, duration: 0.1 }, ENVIOS + 0.45);
      tl.to(q(".s11-camion"), { x: 880, duration: 0.6, ease: "power2.in" }, ENVIOS + 0.5);
      tl.to(q(".s11-camion"), { opacity: 0.4, duration: 0.3 }, ENVIOS + 0.9);
      // "Mercado Pago": cobro
      pop(q(".s11-pago"), MERCADO, "800 760");
      etiqueta(".s11-e2", MERCADO, ".s11-e1");
      latir(q(".s11-pago"), PAGO, "800 760");
      tl.fromTo(q(".s11-tel"), { scale: 1 }, { scale: 1.03, svgOrigin: "400 915", duration: DUR, ease: "none" }, 0);
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
