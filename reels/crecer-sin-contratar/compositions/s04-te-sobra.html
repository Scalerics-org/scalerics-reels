  <script>
    (function () {
      const ID = "s04-te-sobra";
      const DUR = 3.02;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          // si arranca a medio dibujar (cuadro 0) se ve desde el principio; si no, opacity 0 hasta que arranca
          if (desde != null && desde < 1 && t <= 0) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const latir = (el, t, origen, k) => tl.to(el, { scale: k ?? 1.06, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const sacudir = (el, t) => tl.to(el, { x: "-=6", duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      const badge = (el, t) => tl.fromTo(el.querySelector(".b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      qa(".b-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      const etiqueta = (sel, t, antes) => {
        if (antes) tl.to(q(antes), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

      // tiempos (relativos a la escena = palabras de la locución)
      const SOBRA = 0.07;
      const TRABAJO = 0.47;
      const TENDRIA = 1.27;
      const NADIE = 2.07;

      const PX = 450, BASE = 1180;
      const ROT = [-2, 3, -4, 2, -3, 5, -2];
      const DX = [0, 10, -8, 14, -4, 18, 6];
      gsap.set(q(".s04-persona"), { x: 800, y: 1184, opacity: 0.0 });
      gsap.set(q(".s04-x"), { x: 868, y: 990 });
      qa(".s04-card").forEach((c, i) => {
        const y = BASE - 36 - i * 72;
        gsap.set(c, { x: PX + DX[i], y });
        gsap.set(c.querySelector(".s04-card-in"), { rotation: ROT[i], svgOrigin: "0 0" });
        if (i === 0) return;
        const t = SOBRA + (i - 1) * 0.15;
        tl.fromTo(c, { opacity: 0, y: y - 260 }, { opacity: 1, y, duration: 0.3, ease: "power2.in" }, t);
        tl.to(qa(".s04-card").slice(0, i).map((e) => e.querySelector(".s04-card-in")), { y: 3, duration: 0.06, ease: "power1.out", yoyo: true, repeat: 1 }, t + 0.3);
      });
      // la primera tarjeta y el piso, medio dibujados en el cuadro 0
      dibujar([q(".s04-suelo")], 0, 0.5, 0.5);
      tl.fromTo(q(".s04-c0"), { opacity: 0.6 }, { opacity: 1, duration: 0.2 }, 0);
      etiqueta(".s04-e1", TRABAJO);
      // la pila se tambalea
      tl.to(q(".s04-pila"), { rotation: 2, svgOrigin: PX + " " + BASE, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.1);
      // "tendría": aparece una persona al lado
      tl.to(q(".s04-persona"), { opacity: 1, duration: 0.05 }, TENDRIA - 0.05);
      dibujar(qa(".s04-df"), TENDRIA - 0.05, 0.45);
      // "nadie": X a la persona, la pila tiembla
      badge(q(".s04-x"), NADIE);
      tl.to(q(".s04-persona"), { opacity: 0.35, duration: 0.3 }, NADIE + 0.15);
      tl.to(q(".s04-pila"), { x: -5, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, NADIE);
      etiqueta(".s04-e2", NADIE - 0.2, ".s04-e1");
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
