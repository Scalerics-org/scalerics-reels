    (function () {
      const ID = "s05-tareas";
      const DUR = 6.06;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          // si arranca a medio dibujar (cuadro 0) se ve desde el principio; si no, opacity 0 hasta que arranca
          if (desde != null && desde < 1 && t <= 0) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const latir = (el, t, origen, k) => tl.to(el, { scale: k ?? 1.06, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const sacudir = (el, t) => tl.to(el, { x: "-=6", duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      const badge = (el, t) => tl.fromTo(el.querySelector(".b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      qa(".b-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      const etiqueta = (sel, t, antes) => {
        if (antes) tl.to(q(antes), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

      // tiempos (relativos a la escena = palabras de la locución)
      const CONTESTAR = 0.0;
      const PRECIO = 0.75;
      const WHATSAPP = 1.25;
      const ANOTAR = 2.0;
      const PEDIDOS = 2.45;
      const CUADERNO = 3.05;
      const ACORDARTE = 3.89;
      const DEJO = 4.85;
      const VENIR = 5.15;

      const Y = 900;
      const XS = [205, 540, 870];
      qa(".s05-col").forEach((c, i) => gsap.set(c, { x: XS[i], y: Y }));
      gsap.set(q(".s05-col3"), { y: Y + 20 });
      gsap.set(qa(".s05-m, .s05-n, .s05-lapiz, .s05-preg"), { opacity: 0 });
      gsap.set(qa(".s05-col2, .s05-col3"), { opacity: 0.4 });
      const nombre = (el, t) => tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);

      // 1. el celular (medio dibujado en el cuadro 0) y la misma pregunta tres veces
      dibujar(qa(".s05-d1"), 0, 0.5, 0.5);
      nombre(q(".s05-col1 .s05-n"), 0.2);
      ["q1", "r1", "q2", "r2", "q3", "r3"].forEach((k, i) => {
        const el = q(".s05-" + k);
        tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.22, ease: "back.out(2)" }, 0.15 + i * 0.25);
      });
      etiqueta(".s05-e1", PRECIO);
      latir(q(".s05-col1"), WHATSAPP + 0.2, XS[0] + " " + Y, 1.04);

      // 2. el cuaderno
      tl.to(q(".s05-col1"), { opacity: 0.4, duration: 0.3 }, ANOTAR - 0.2);
      tl.to(q(".s05-col2"), { opacity: 1, duration: 0.2 }, ANOTAR - 0.3);
      dibujar(qa(".s05-d2"), ANOTAR - 0.3, 0.45);
      nombre(q(".s05-col2 .s05-n"), ANOTAR);
      tl.fromTo(q(".s05-lapiz"), { opacity: 0, x: 100, y: -40 }, { opacity: 1, x: -90, y: -92, duration: 0.25, ease: "power2.out" }, ANOTAR + 0.05);
      const renglon = (sel, y0, x1, t, d) => {
        const el = q(sel);
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(el, { opacity: 1, duration: 0.02 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "none" }, t);
        tl.fromTo(q(".s05-lapiz"), { x: -90, y: y0 }, { x: x1, y: y0, duration: d, ease: "none" }, t);

      renglon(".s05-esc1", -92, 70, PEDIDOS - 0.15, 0.4);

      renglon(".s05-esc4", 88, -10, CUADERNO + 0.1, 0.25);
      tl.to(q(".s05-lapiz"), { opacity: 0, duration: 0.2 }, ACORDARTE - 0.3);
