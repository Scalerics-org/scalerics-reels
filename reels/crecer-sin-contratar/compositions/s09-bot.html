  <script>
    (function () {
      const ID = "s09-bot";
      const DUR = 6.6;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          // si arranca a medio dibujar (cuadro 0) se ve desde el principio; si no, opacity 0 hasta que arranca
          if (desde != null && desde < 1 && t <= 0) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const latir = (el, t, origen, k) => tl.to(el, { scale: k ?? 1.06, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const sacudir = (el, t) => tl.to(el, { x: "-=6", duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 3 }, t);
      const badge = (el, t) => tl.fromTo(el.querySelector(".b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      qa(".b-in").forEach((b) => gsap.set(b, { opacity: 0 }));
      const etiqueta = (sel, t, antes) => {
        if (antes) tl.to(q(antes), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      };

      // tiempos (relativos a la escena = palabras de la locución)
      const SCALERICS = 0.13;
      const ARMAMOS = 0.93;
      const COMERCIOS = 1.53;
      const UN = 2.63;
      const WHATSAPP = 3.03;
      const CONTESTA = 3.73;
      const INSTANTE = 4.23;
      const TOMA = 5.23;
      const PEDIDOS = 5.63;

      gsap.set(q(".s09-caja"), { x: 540, y: 900 });
      gsap.set(qa(".s09-cab, .s09-preg, .s09-resp, .s09-si, .s09-pedido"), { opacity: 0 });

      // "Scalerics": la caja (medio dibujada en el cuadro 0) y el nombre
      dibujar([q(".s09-dib-caja")], 0, 0.5, 0.5);
      tl.fromTo(q(".s09-nombre"), { opacity: 0.3, scale: 0.85, svgOrigin: "0 -24" }, { opacity: 1, scale: 1, svgOrigin: "0 -24", duration: 0.35, ease: "back.out(1.6)" }, SCALERICS - 0.1);
      latir(q(".s09-caja-in"), ARMAMOS, "0 0");
      tl.fromTo(q(".s09-para"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, COMERCIOS - 0.1);
      tl.fromTo(q(".s09-caja-in"), { scale: 1 }, { scale: 1.04, svgOrigin: "0 0", duration: 0.9, ease: "none" }, COMERCIOS + 0.2);
      tl.to(q(".s09-caja"), { y: 760, opacity: 0, duration: 0.35, ease: "power2.in" }, UN - 0.3);

      // "un bot de WhatsApp": el celular y la pregunta
      dibujar(qa(".s09-dt"), UN, 0.5);
      tl.to(qa(".s09-cab"), { opacity: 1, duration: 0.25 }, UN + 0.3);
      pop(q(".s09-preg"), WHATSAPP, "356 824");
      etiqueta(".s09-e1", WHATSAPP);
      // "contesta al instante"
      pop(q(".s09-resp"), CONTESTA, "724 938");
      tl.to(q(".s09-tel"), { y: -6, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, CONTESTA + 0.05);
      latir(q(".s09-resp"), INSTANTE, "724 938", 1.05);
      pop(q(".s09-si"), INSTANTE + 0.45, "356 1010");
      // "toma los pedidos"
      pop(q(".s09-pedido"), TOMA, "540 1100");
      etiqueta(".s09-e2", TOMA + 0.05, ".s09-e1");
      latir(q(".s09-pedido"), PEDIDOS, "540 1100");
      tl.fromTo(q(".s09-tel"), { scale: 1 }, { scale: 1.03, svgOrigin: "540 915", duration: DUR - UN, ease: "none" }, UN);
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
