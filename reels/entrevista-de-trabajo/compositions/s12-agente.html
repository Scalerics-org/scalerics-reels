          <svg class="ab s12-cinta" viewBox="0 0 400 260" aria-hidden="true" overflow="visible"><path d="M60 0 L200 250 L340 0" fill="none" stroke="#2f6fe0" stroke-width="18" /></svg>

  <script>
    (function () {
      const ID = "s12-agente";
      const DUR = 5.33;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const els = (s) => (typeof s === "string" ? qa(s) : [].concat(s));
      const tl = gsap.timeline({ paused: true });
      // un trazo que se dibuja (opacity 0 hasta que arranca: nada de puntitos de los caps)
      const dibujar = (s, t, d, desde) => els(s).forEach((el) => {
        const L = el.getTotalLength() + 2;
        const f = desde || 0;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - f), opacity: f > 0 ? 1 : 0 });
        if (!f) tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d || 0.6, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote (para divs)
      const pop = (s, t, de) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0, scale: 0.8 }, de || {}), { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe como un sello o una palabra gigante
      const golpe = (s, t, esc, rot) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0, rotation: rot || 0 });
        tl.fromTo(el, { opacity: 0, scale: esc || 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.08);
      });
      const sacudon = (t, f) => {
        f = f || 1;
        [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s12-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      // se escribe de izquierda a derecha (letra a mano, tipeo)
      const escribir = (s, t, d) => els(s).forEach((el) => {
        gsap.set(el, { clipPath: "inset(-30% 100% -30% 0%)" });
        tl.to(el, { clipPath: "inset(-30% 0% -30% 0%)", duration: d || 0.5, ease: "none" }, t);
      });
      // cambia la cara del candidato o los ojos del dueño
      const cara = (raiz, de, a, t) => {
        tl.to(q(raiz + " " + de), { opacity: 0, duration: 0.06 }, t);
        tl.to(q(raiz + " " + a), { opacity: 1, duration: 0.06 }, t);
      };
      const parpadeo = (raiz, t) => tl.to(qa(raiz + " .c-ojos"), { scaleY: 0.12, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t);
      const salida = () => tl.to(q("#s12-escena"), { y: -70, opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      const TRAMPA = 0.32, ES = 0.6, AGENTE = 1.3, TRABAJA = 2.3, COMERCIO = 3.1, EMPLEADO = 4.0;
      // "no hay trampa": se tacha
      tl.fromTo(q(".s12-trampa"), { opacity: 0.6, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 0);
      dibujar(".s12-raya", TRAMPA - 0.1, 0.22);
      tl.to(qa(".s12-trampa, .s12-tacha"), { y: -120, opacity: 0, duration: 0.25, ease: "power2.in" }, ES);
      // la credencial baja colgando de la cinta y se hamaca
      gsap.set(q(".s12-todo"), { opacity: 0 });
      tl.fromTo(q(".s12-todo"), { opacity: 1, y: -900 }, { y: 0, duration: 0.5, ease: "back.out(1.4)", immediateRender: false }, ES + 0.05);
      tl.fromTo(q(".s12-todo"), { rotation: 6 }, { rotation: -4, transformOrigin: "540px 560px", duration: 0.6, yoyo: true, repeat: 6, ease: "sine.inOut" }, ES + 0.4);
      escribir(".s12-nombre", AGENTE, 0.55);
      tl.fromTo(q(".s12-nombre"), { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1 }, AGENTE + 0.6);
      [[".s12-d1", TRABAJA], [".s12-d2", COMERCIO], [".s12-d3", EMPLEADO]].forEach(([s, t]) => pop(s, t - 0.05, { x: -30, scale: 1 }));
      parpadeo(".s12-foto", 2.0);
      cara(".s12-foto", ".c-ok", ".c-feliz", 4.4);

      salida();
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
