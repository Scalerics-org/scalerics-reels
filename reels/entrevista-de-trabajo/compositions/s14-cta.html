  <script>
    (function () {
      const ID = "s14-cta";
      const DUR = 8.48;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const els = (s) => (typeof s === "string" ? qa(s) : [].concat(s));
      const tl = gsap.timeline({ paused: true });
      // un trazo que se dibuja (opacity 0 hasta que arranca: nada de puntitos de los caps)
      const dibujar = (s, t, d, desde) => els(s).forEach((el) => {
        const L = el.getTotalLength() + 2;
        const f = desde || 0;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - f), opacity: f > 0 ? 1 : 0 });
        if (!f) tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d || 0.6, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote (para divs)
      const pop = (s, t, de) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0, scale: 0.8 }, de || {}), { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe como un sello o una palabra gigante
      const golpe = (s, t, esc, rot) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0, rotation: rot || 0 });
        tl.fromTo(el, { opacity: 0, scale: esc || 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.08);
      });
      const sacudon = (t, f) => {
        f = f || 1;
        [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s14-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      // se escribe de izquierda a derecha (letra a mano, tipeo)
      const escribir = (s, t, d) => els(s).forEach((el) => {
        gsap.set(el, { clipPath: "inset(-30% 100% -30% 0%)" });
        tl.to(el, { clipPath: "inset(-30% 0% -30% 0%)", duration: d || 0.5, ease: "none" }, t);
      });
      // cambia la cara del candidato o los ojos del dueño
      const cara = (raiz, de, a, t) => {
        tl.to(q(raiz + " " + de), { opacity: 0, duration: 0.06 }, t);
        tl.to(q(raiz + " " + a), { opacity: 1, duration: 0.06 }, t);
      };
      const parpadeo = (raiz, t) => tl.to(qa(raiz + " .c-ojos"), { scaleY: 0.12, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t);
      const salida = () => tl.to(q("#s14-escena"), { y: -70, opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      const SCALERICS = 1.4, CONTRATAS = 2.87, COMENTA = 3.96, SI = 4.27, NO = 4.87;
      // cuadro 0: vuelve la ficha
      tl.fromTo(q(".s14-ficha"), { y: 160, rotation: 6, opacity: 0.5 }, { y: 0, rotation: -2, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
      escribir(".s14-scal", SCALERICS - 0.2, 0.5);
      tl.fromTo(q(".s14-scal"), { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, transformOrigin: "0% 50%" }, SCALERICS + 0.35);
      parpadeo(".s14-foto", 1.9);
      // "¿lo contratás?": la pregunta y el sello que no termina de bajar
      golpe(".s14-pregunta", CONTRATAS, 2.2);
      sacudon(CONTRATAS + 0.05, 1);
      gsap.set(q(".s14-sello"), { opacity: 0 });
      tl.fromTo(q(".s14-sello"), { opacity: 0, scale: 2.2, rotation: -24 }, { opacity: 0.92, scale: 1.25, rotation: -10, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, CONTRATAS + 0.2);
      tl.to(q(".s14-sello"), { scale: 1.12, y: 14, duration: 0.35, yoyo: true, repeat: Math.max(1, Math.floor((DUR - CONTRATAS - 0.5) / 0.35) - 1), ease: "sine.inOut" }, CONTRATAS + 0.5);
      tl.to(q(".s14-sello"), { x: -150, duration: 0.7, yoyo: true, repeat: 3, ease: "sine.inOut" }, SI);
      // "comentá sí o no"
      pop(".s14-coment", COMENTA - 0.05, { scale: 0.3 });
      tl.to(q(".s14-coment"), { y: -10, duration: 0.3, yoyo: true, repeat: 7, ease: "sine.inOut" }, COMENTA + 0.35);
      pop(".s14-si", SI - 0.05, { scale: 0.3, y: 60 });
      pop(".s14-no", NO - 0.05, { scale: 0.3, y: 60 });
      tl.to(q(".s14-si"), { scale: 1.07, duration: 0.35, yoyo: true, repeat: 5, ease: "sine.inOut" }, NO + 0.3);
      tl.to(q(".s14-no"), { scale: 1.07, duration: 0.35, yoyo: true, repeat: 5, ease: "sine.inOut" }, NO + 0.65);
      cara(".s14-foto", ".c-ok", ".c-feliz", NO + 0.6);
      tl.to(q(".s14-escenario"), { scale: 1.03, duration: DUR - NO, ease: "none", transformOrigin: "50% 55%" }, NO);


      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
