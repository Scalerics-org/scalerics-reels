  <script>
    (function () {
      const ID = "s08-visto";
      const DUR = 5.85;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const els = (s) => (typeof s === "string" ? qa(s) : [].concat(s));
      const tl = gsap.timeline({ paused: true });
      // un trazo que se dibuja (opacity 0 hasta que arranca: nada de puntitos de los caps)
      const dibujar = (s, t, d, desde) => els(s).forEach((el) => {
        const L = el.getTotalLength() + 2;
        const f = desde || 0;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - f), opacity: f > 0 ? 1 : 0 });
        if (!f) tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d || 0.6, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote (para divs)
      const pop = (s, t, de) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0, scale: 0.8 }, de || {}), { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe como un sello o una palabra gigante
      const golpe = (s, t, esc, rot) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0, rotation: rot || 0 });
        tl.fromTo(el, { opacity: 0, scale: esc || 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.08);
      });
      const sacudon = (t, f) => {
        f = f || 1;
        [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s08-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      // se escribe de izquierda a derecha (letra a mano, tipeo)
      const escribir = (s, t, d) => els(s).forEach((el) => {
        gsap.set(el, { clipPath: "inset(-30% 100% -30% 0%)" });
        tl.to(el, { clipPath: "inset(-30% 0% -30% 0%)", duration: d || 0.5, ease: "none" }, t);
      });
      // cambia la cara del candidato o los ojos del dueño
      const cara = (raiz, de, a, t) => {
        tl.to(q(raiz + " " + de), { opacity: 0, duration: 0.06 }, t);
        tl.to(q(raiz + " " + a), { opacity: 1, duration: 0.06 }, t);
      };
      const parpadeo = (raiz, t) => tl.to(qa(raiz + " .c-ojos"), { scaleY: 0.12, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t);
      const salida = () => tl.to(q("#s08-escena"), { y: -70, opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      const AJA = 0.0, DEJAS = 0.9, VISTO = 1.5, QUE = 2.94, DEJAR = 3.54, VISTO2 = 4.29;
      tl.fromTo(q(".s08-chat"), { y: 80, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      pop(".s08-duen", AJA + 0.05, { scale: 0.5, x: -80 });
      tl.to(q(".s08-duen .d-ceja-d"), { rotation: -16, svgOrigin: "43 51", y: -8, duration: 0.18, ease: "back.out(3)" }, AJA + 0.3);
      // "¿dejás en visto?": los tilde se ponen azules y nadie contesta
      tl.to(q(".s08-tic"), { stroke: "#2f6fe0", duration: 0.1 }, VISTO);
      tl.fromTo(q(".s08-tics"), { scale: 1 }, { scale: 1.5, duration: 0.12, yoyo: true, repeat: 1 }, VISTO);
      pop(".s08-visto", VISTO + 0.1, { y: 20 });
      golpe(".s08-acusa", VISTO + 0.2, 2.4, -6);
      sacudon(VISTO + 0.25, 0.7);
      // "¿qué es dejar en visto?": el candidato no tiene idea
      tl.to(qa(".s08-chat, .s08-duen, .s08-acusa"), { opacity: 0, x: -200, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, QUE - 0.2);
      gsap.set(q(".s08-cand"), { opacity: 0 });
      tl.fromTo(q(".s08-cand"), { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: 8, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, QUE);
      cara(".s08-cand", ".c-ok", ".c-duda", QUE + 0.25);
      tl.to(q(".s08-cand"), { rotation: -8, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, QUE + 0.45);
      escribir(".s08-def", DEJAR, 0.6);
      // "visto": glitch de pantalla
      [[14, 0.4], [-18, 1], [8, 0.5], [0, 1]].forEach(([x, o], i) => tl.to(q(".s08-cand"), { x, opacity: o, duration: 0.04, ease: "none" }, VISTO2 + i * 0.05));
      tl.to(q(".s08-cand .c-luz"), { fill: "#e23a2e", duration: 0.05, yoyo: true, repeat: 5 }, VISTO2);

      salida();
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
