  <script>
    (function () {
      const ID = "s03-tres";
      const DUR = 2.86;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const els = (s) => (typeof s === "string" ? qa(s) : [].concat(s));
      const tl = gsap.timeline({ paused: true });
      // un trazo que se dibuja (opacity 0 hasta que arranca: nada de puntitos de los caps)
      const dibujar = (s, t, d, desde) => els(s).forEach((el) => {
        const L = el.getTotalLength() + 2;
        const f = desde || 0;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - f), opacity: f > 0 ? 1 : 0 });
        if (!f) tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d || 0.6, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote (para divs)
      const pop = (s, t, de) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0, scale: 0.8 }, de || {}), { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe como un sello o una palabra gigante
      const golpe = (s, t, esc, rot) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0, rotation: rot || 0 });
        tl.fromTo(el, { opacity: 0, scale: esc || 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.08);
      });
      const sacudon = (t, f) => {
        f = f || 1;
        [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s03-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      // se escribe de izquierda a derecha (letra a mano, tipeo)
      const escribir = (s, t, d) => els(s).forEach((el) => {
        gsap.set(el, { clipPath: "inset(-30% 100% -30% 0%)" });
        tl.to(el, { clipPath: "inset(-30% 0% -30% 0%)", duration: d || 0.5, ease: "none" }, t);
      });
      // cambia la cara del candidato o los ojos del dueño
      const cara = (raiz, de, a, t) => {
        tl.to(q(raiz + " " + de), { opacity: 0, duration: 0.06 }, t);
        tl.to(q(raiz + " " + a), { opacity: 1, duration: 0.06 }, t);
      };
      const parpadeo = (raiz, t) => tl.to(qa(raiz + " .c-ojos"), { scaleY: 0.12, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t);
      const salida = () => tl.to(q("#s03-escena"), { y: -70, opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      const TRES = 0.5, MANANA = 1.2, SI = 2.14;
      tl.fromTo(q(".s03-escenario"), { scale: 0.92, opacity: 0.5 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out", transformOrigin: "50% 52%" }, 0);
      // las agujas giran a lo loco y frenan en las tres
      tl.fromTo(q(".s03-mm"), { rotation: -200, svgOrigin: "540 990" }, { rotation: 720, svgOrigin: "540 990", duration: TRES + 0.15, ease: "power2.out" }, 0);
      tl.fromTo(q(".s03-hh"), { rotation: -60, svgOrigin: "540 990" }, { rotation: 90, svgOrigin: "540 990", duration: TRES + 0.15, ease: "power2.out" }, 0);
      tl.to(q(".s03-mm"), { rotation: 726, svgOrigin: "540 990", duration: 0.08, yoyo: true, repeat: 1 }, TRES + 0.15);
      golpe(".s03-hora", TRES + 0.05, 1.8);
      // "de la mañana": se hace de noche
      gsap.set([q(".s03-luna"), ...qa(".s03-est")], { opacity: 0 });
      tl.fromTo(q(".s03-luna"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)", immediateRender: false }, MANANA);
      qa(".s03-est").forEach((s, i) => tl.to(s, { opacity: 1, duration: 0.1 }, MANANA + 0.1 + i * 0.08));
      qa(".s03-est").forEach((s, i) => tl.to(s, { opacity: 0.3, duration: 0.25, yoyo: true, repeat: 2, ease: "sine.inOut" }, MANANA + 0.6 + i * 0.1));
      // "Sí.": el candidato, sin dudar
      pop(".s03-mini", SI - 0.15, { scale: 0.4, x: 120 });
      pop(".s03-si", SI, { scale: 0.3 });
      cara(".s03-mini", ".c-ok", ".c-feliz", SI + 0.1);
      sacudon(SI + 0.05, 0.6);

      salida();
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
