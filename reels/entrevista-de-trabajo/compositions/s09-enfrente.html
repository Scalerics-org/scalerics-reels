  <script>
    (function () {
      const ID = "s09-enfrente";
      const DUR = 6.29;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const els = (s) => (typeof s === "string" ? qa(s) : [].concat(s));
      const tl = gsap.timeline({ paused: true });
      // un trazo que se dibuja (opacity 0 hasta que arranca: nada de puntitos de los caps)
      const dibujar = (s, t, d, desde) => els(s).forEach((el) => {
        const L = el.getTotalLength() + 2;
        const f = desde || 0;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - f), opacity: f > 0 ? 1 : 0 });
        if (!f) tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d || 0.6, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote (para divs)
      const pop = (s, t, de) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0, scale: 0.8 }, de || {}), { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe como un sello o una palabra gigante
      const golpe = (s, t, esc, rot) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0, rotation: rot || 0 });
        tl.fromTo(el, { opacity: 0, scale: esc || 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.08);
      });
      const sacudon = (t, f) => {
        f = f || 1;
        [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s09-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      // se escribe de izquierda a derecha (letra a mano, tipeo)
      const escribir = (s, t, d) => els(s).forEach((el) => {
        gsap.set(el, { clipPath: "inset(-30% 100% -30% 0%)" });
        tl.to(el, { clipPath: "inset(-30% 0% -30% 0%)", duration: d || 0.5, ease: "none" }, t);
      });
      // cambia la cara del candidato o los ojos del dueño
      const cara = (raiz, de, a, t) => {
        tl.to(q(raiz + " " + de), { opacity: 0, duration: 0.06 }, t);
        tl.to(q(raiz + " " + a), { opacity: 1, duration: 0.06 }, t);
      };
      const parpadeo = (raiz, t) => tl.to(qa(raiz + " .c-ojos"), { scaleY: 0.12, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t);
      const salida = () => tl.to(q("#s09-escena"), { y: -70, opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      const RARO = 0.7, YSI = 1.87, ENFRENTE = 2.8, SOLO = 3.87, EL = 4.97;
      // "esto es muy raro": primer plano del dueño, que entrecierra los ojos
      tl.fromTo(q(".s09-cara"), { scale: 0.85, opacity: 0.5 }, { scale: 1.05, opacity: 1, duration: 1.8, ease: "power1.out" }, 0);
      tl.to(q(".s09-cara .d-ceja-i"), { rotation: 14, svgOrigin: "-43 51", y: 6, duration: 0.2 }, 0.3);
      tl.to(q(".s09-cara .d-ceja-d"), { rotation: -20, svgOrigin: "43 51", y: -10, duration: 0.2 }, 0.4);
      gsap.set(q(".s09-raro"), { rotation: -8 });
      escribir(".s09-raro", RARO, 0.5);
      // "¿y si te vas con el de enfrente?": la ventana
      tl.to(qa(".s09-cara, .s09-raro"), { opacity: 0, scale: 0.6, duration: 0.2, ease: "power2.in" }, YSI - 0.2);
      gsap.set(q(".s09-ventana"), { opacity: 0 });
      tl.fromTo(q(".s09-ventana"), { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, YSI);
      tl.fromTo(q(".s09-pers"), { y: 0 }, { y: -190, duration: 0.6, ease: "power2.inOut" }, YSI + 0.15);
      pop(".s09-cartel", ENFRENTE, { scale: 0.3, rotation: -20 });
      tl.to(q(".s09-cartel"), { rotation: 5, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, ENFRENTE + 0.35);
      // "solo si me contrata él primero"
      pop(".s09-mini", SOLO - 0.1, { scale: 0.4, x: 100 });
      cara(".s09-mini", ".c-ok", ".c-feliz", SOLO + 0.3);
      golpe(".s09-primero", EL, 2.6, -3);
      sacudon(EL + 0.06, 1.3);
      tl.to(q(".s09-ventana"), { opacity: 0.45, duration: 0.15 }, EL);

      salida();
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
