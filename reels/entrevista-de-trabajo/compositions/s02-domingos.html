  <script>
    (function () {
      const ID = "s02-domingos";
      const DUR = 3.43;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const els = (s) => (typeof s === "string" ? qa(s) : [].concat(s));
      const tl = gsap.timeline({ paused: true });
      // un trazo que se dibuja (opacity 0 hasta que arranca: nada de puntitos de los caps)
      const dibujar = (s, t, d, desde) => els(s).forEach((el) => {
        const L = el.getTotalLength() + 2;
        const f = desde || 0;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (1 - f), opacity: f > 0 ? 1 : 0 });
        if (!f) tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d || 0.6, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote (para divs)
      const pop = (s, t, de) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0, scale: 0.8 }, de || {}), { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe como un sello o una palabra gigante
      const golpe = (s, t, esc, rot) => els(s).forEach((el) => {
        gsap.set(el, { opacity: 0, rotation: rot || 0 });
        tl.fromTo(el, { opacity: 0, scale: esc || 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.08);
      });
      const sacudon = (t, f) => {
        f = f || 1;
        [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      // se escribe de izquierda a derecha (letra a mano, tipeo)
      const escribir = (s, t, d) => els(s).forEach((el) => {
        gsap.set(el, { clipPath: "inset(-30% 100% -30% 0%)" });
        tl.to(el, { clipPath: "inset(-30% 0% -30% 0%)", duration: d || 0.5, ease: "none" }, t);
      });
      // cambia la cara del candidato o los ojos del dueño
      const cara = (raiz, de, a, t) => {
        tl.to(q(raiz + " " + de), { opacity: 0, duration: 0.06 }, t);
        tl.to(q(raiz + " " + a), { opacity: 1, duration: 0.06 }, t);
      };
      const parpadeo = (raiz, t) => tl.to(qa(raiz + " .c-ojos"), { scaleY: 0.12, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, t);
      const salida = () => tl.to(q("#s02-escena"), { y: -70, opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      if (q(".s02-min")) tl.fromTo(q(".s02-min"), { rotation: 0, svgOrigin: "540 700" }, { rotation: 360, svgOrigin: "540 700", duration: DUR, ease: "none" }, 0);
      if (q(".s02-hora")) tl.fromTo(q(".s02-hora"), { rotation: 60, svgOrigin: "540 700" }, { rotation: 90, svgOrigin: "540 700", duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s02-humo"), { y: 0, opacity: 0.6 }, { y: -16, opacity: 0.2, duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s02-duen"), { y: 0 }, { y: -6, duration: 0.9, yoyo: true, repeat: Math.max(1, Math.floor(DUR / 0.9) - 1), ease: "sine.inOut" }, 0);
      tl.fromTo(q(".s02-cand"), { y: 0 }, { y: -8, duration: 0.7, yoyo: true, repeat: Math.max(1, Math.floor(DUR / 0.7) - 1), ease: "sine.inOut" }, 0.2);
      tl.fromTo(q(".s02-escenario"), { scale: 1.05, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out", transformOrigin: "50% 60%" }, 0);

      const FLACO = 0.3, DOMINGOS = 1.8, SI = 2.66;
      // "a ver, flaco": la ceja del dueño se levanta
      tl.to(q(".s02-duen .d-ceja-d"), { rotation: -18, svgOrigin: "43 51", y: -10, duration: 0.18, ease: "back.out(3)" }, FLACO);
      tl.to(q(".s02-duen .d-ceja-i"), { rotation: 8, svgOrigin: "-43 51", duration: 0.18 }, FLACO);
      pop(".s02-cal", DOMINGOS - 0.1, { scale: 0.4, rotation: -12 });
      tl.to(q(".s02-cal"), { rotation: 3, duration: 0.3, ease: "sine.inOut" }, DOMINGOS + 0.3);
      dibujar(".s02-tilde", SI, 0.25);
      pop(".s02-si", SI - 0.05, { scale: 0.3, y: 40 });
      cara(".s02-cand", ".c-ok", ".c-feliz", SI);
      tl.to(q(".s02-cand"), { rotation: 4, duration: 0.15, yoyo: true, repeat: 1, transformOrigin: "50% 100%" }, SI);

      salida();
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
