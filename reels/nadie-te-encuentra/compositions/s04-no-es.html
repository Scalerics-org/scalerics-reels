    (function () {
      const ID = "s04-no-es";
      const DUR = 5.16;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const badge = (el, t) => {
        tl.fromTo(el.firstElementChild, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const etiqueta = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, y: -10, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      const PIZZA = 0.27;
      const PEOR = 0.87;
      const NI1 = 1.56;
      const LEJOS = 1.97;
      const NI2 = 2.17;
      const CARO = 3.07;
      const ES = 3.67;

      const XS = [270, 540, 810];
      const Y = 860;

      [".s04-b1", ".s04-b2", ".s04-b3"].forEach((s, i) => gsap.set(q(s), { x: XS[i] + 96, y: Y - 104 }));

      // pizza: arranca medio dibujada
      dibujar(qa(".s04-d1"), 0, 0.5, 0.5);
      tl.fromTo(q(".s04-i1"), { scale: 0.9, svgOrigin: XS[0] + " " + Y }, { scale: 1, svgOrigin: XS[0] + " " + Y, duration: 0.4, ease: "back.out(1.8)" }, PIZZA);
      badge(q(".s04-b1"), PEOR + 0.1);
      tl.to(q(".s04-i1"), { opacity: 0.4, duration: 0.3 }, PEOR + 0.25);

      // lejos: el pin cae y aparecen los puntos de distancia
      dibujar(qa(".s04-d2"), NI1 - 0.1, 0.45);
      tl.fromTo(q(".s04-i2"), { y: Y - 40 }, { y: Y, duration: 0.4, ease: "bounce.out" }, NI1 - 0.1);
      tl.fromTo(qa(".s04-dist circle"), { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.2, stagger: 0.06, ease: "back.out(2)" }, LEJOS - 0.2);
      badge(q(".s04-b2"), LEJOS + 0.12);
      tl.to(q(".s04-i2"), { opacity: 0.4, duration: 0.3 }, LEJOS + 0.3);

      // caro: la etiqueta de precio
      dibujar(qa(".s04-d3"), NI2 + 0.2, 0.45);
      tl.fromTo(q(".s04-d3t"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, NI2 + 0.5);
      tl.fromTo(q(".s04-i3"), { rotation: -8, svgOrigin: XS[2] + " " + Y }, { rotation: 0, svgOrigin: XS[2] + " " + Y, duration: 0.5, ease: "elastic.out(1, 0.5)" }, CARO - 0.1);
      badge(q(".s04-b3"), CARO + 0.12);
      tl.to(q(".s04-i3"), { opacity: 0.4, duration: 0.3 }, CARO + 0.3);
      etiqueta(q(".s04-e1"), CARO + 0.2);

      // "es que no te encontró": todo se va, cae la lupa vacía
      tl.to(qa(".s04-fila, .s04-badge"), { opacity: 0, y: "+=30", duration: 0.25, ease: "power2.in" }, ES - 0.1);
      gsap.set(q(".s04-lupa"), { x: 540, y: 860 });
      dibujar(qa(".s04-lupa-l"), ES + 0.05, 0.45);
      tl.fromTo(q(".s04-lupa"), { scale: 0.8, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(1.6)" }, ES + 0.05);

      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
