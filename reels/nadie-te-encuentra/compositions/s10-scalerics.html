  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s10-scalerics"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }

    [data-composition-id="s10-scalerics"] .s10-marca { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 62px; letter-spacing: -0.01em; fill: #efeee5; }
    [data-composition-id="s10-scalerics"] .s10-bajada { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.22em; fill: #efeee5; }
    [data-composition-id="s10-scalerics"] .s10-wf { fill: none; stroke: #efeee5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-scalerics"] .s10-wf-ac { fill: none; stroke: #5ce611; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

    <div id="s10-escena" class="s10-capa clip" data-start="0" data-duration="6.70" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- caja de marca -->
        <g class="s10-caja">
          <rect class="ln s10-caja-l" x="310" y="612" width="460" height="112" rx="28" />
          <text class="s10-marca" x="540" y="690" text-anchor="middle">Scalerics</text>
        </g>
        <text class="s10-bajada" x="540" y="784" text-anchor="middle">SITIOS WEB PARA COMERCIOS</text>
        <!-- laptop con un sitio -->
        <g class="s10-lap">
          <rect class="ln s10-lap-l" x="300" y="840" width="480" height="280" rx="16" />
          <path class="ln s10-lap-l" d="M250 1120 H830 L806 1150 H274 Z" />
          <g class="s10-sitio">
            <rect class="s10-wf" x="330" y="864" width="34" height="24" rx="5" />
            <path class="s10-wf" d="M620 876 H660 M680 876 H720 M736 876 H752" />
            <line class="ln-tenue" x1="330" y1="906" x2="752" y2="906" />
            <rect class="s10-wf" x="330" y="922" width="220" height="126" rx="10" />
            <path class="s10-wf" d="M344 1034 L404 974 L444 1014 L470 990 L536 1034" />
            <circle class="s10-wf" cx="500" cy="952" r="12" />
            <path class="s10-wf s10-renglon" d="M576 936 H752" />
            <path class="s10-wf s10-renglon" d="M576 964 H720" />
            <path class="s10-wf s10-renglon" d="M576 992 H740" />
            <rect class="s10-wf-ac" x="576" y="1012" width="120" height="36" rx="18" />
            <path class="ln-tenue" d="M330 1074 H752 M330 1096 H640" />
          </g>
        </g>
        <!-- claros: tilde -->
        <g class="s10-tilde">
          <circle class="ln-ac" cx="0" cy="0" r="26" />
          <path class="ln-ac" d="M-11 1 L-3 9 L12 -8" />
        </g>
        <!-- rápidos: rayo y líneas de velocidad -->
        <g class="s10-rayo">
          <path class="ln-ac" d="M216 900 L180 980 H214 L196 1050 L250 960 H216 L236 900 Z" />
          <path class="ln-fino-ac s10-vel" d="M118 950 H160 M100 990 H158 M126 1030 H170" />
        </g>
        <!-- el celular con el mismo sitio -->
        <g class="s10-tel">
          <rect class="ln s10-tel-l" x="690" y="820" width="210" height="370" rx="34" />
          <line class="ln s10-tel-l" x1="770" y1="840" x2="820" y2="840" />
          <g class="s10-tel-sitio">
            <rect class="s10-wf" x="712" y="862" width="24" height="18" rx="4" />

            <path class="s10-wf" d="M722 980 L766 936 L796 966 L816 948 L868 980" />

      <div class="etiqueta"><span class="s10-e1">Claros</span><span class="s10-e2">Rápidos</span><span class="s10-e3">Para el celular</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s10-scalerics";
      const DUR = 6.7;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const badge = (el, t) => {
        tl.fromTo(el.firstElementChild, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const etiqueta = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, y: -10, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      const SCALERICS = 0.7;
      const HACEMOS = 1.3;
      const SITIOS = 1.8;
      const COMERCIOS = 2.4;
      const CLAROS = 3.35;
      const RAPIDOS = 3.97;
      const HECHOS = 4.6;
      const BIEN = 5.4;
      const CELULAR = 5.9;

      // la caja arranca medio dibujada; el nombre entra en "Scalerics"
      dibujar([q(".s10-caja-l")], 0, 0.6, 0.5);
      tl.fromTo(q(".s10-marca"), { opacity: 0, y: 10, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, SCALERICS - 0.05);
      tl.to(q(".s10-caja"), { scale: 1.05, svgOrigin: "540 668", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, HACEMOS);
      tl.fromTo(q(".s10-bajada"), { opacity: 0, y: 12 }, { opacity: 0.85, y: 0, duration: 0.35, ease: "power3.out" }, SITIOS);
      tl.to(q(".s10-bajada"), { opacity: 1, duration: 0.15, yoyo: true, repeat: 1 }, COMERCIOS);

      // "sitios web": la laptop se dibuja con el sitio adentro
      dibujar(qa(".s10-lap-l"), SITIOS - 0.15, 0.5);
      tl.fromTo(q(".s10-sitio"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, SITIOS + 0.3);
      // los renglones se ordenan en "claros"
      tl.fromTo(qa(".s10-renglon"), { x: (i) => [18, -14, 22][i] }, { x: 0, duration: 0.4, stagger: 0.06, ease: "back.out(2)", immediateRender: false }, CLAROS - 0.1);
      gsap.set(qa(".s10-renglon"), { x: (i) => [18, -14, 22][i] });
      gsap.set(q(".s10-tilde"), { x: 790, y: 846, opacity: 0 });
      tl.fromTo(q(".s10-tilde"), { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(3)", immediateRender: false }, CLAROS + 0.1);
      etiqueta(q(".s10-e1"), CLAROS);

      // "rápidos": rayo
      gsap.set(q(".s10-rayo"), { opacity: 0 });
      tl.fromTo(q(".s10-rayo"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.25, ease: "power4.out", immediateRender: false }, RAPIDOS - 0.05);
      tl.fromTo(q(".s10-vel"), { x: 30 }, { x: -20, duration: 0.6, ease: "power2.out" }, RAPIDOS);
      tl.to(q(".s10-lap"), { x: 8, duration: 0.05, yoyo: true, repeat: 3 }, RAPIDOS + 0.05);
      etiqueta(q(".s10-e2"), RAPIDOS, q(".s10-e1"));

      // "hechos para verse bien en el celular": la laptop se corre, entra el celular
      tl.to(qa(".s10-rayo, .s10-tilde"), { opacity: 0, duration: 0.25 }, HECHOS - 0.1);
      tl.to(q(".s10-lap"), { x: -160, y: 40, scale: 0.72, svgOrigin: "540 1000", duration: 0.55, ease: "power3.inOut" }, HECHOS);
      dibujar(qa(".s10-tel-l"), HECHOS + 0.3, 0.5);
      tl.fromTo(q(".s10-tel"), { x: 40 }, { x: 0, duration: 0.5, ease: "power3.out" }, HECHOS + 0.3);
      tl.fromTo(q(".s10-tel-sitio"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, BIEN - 0.2);
      tl.to(q(".s10-tel"), { scale: 1.06, svgOrigin: "795 1005", duration: 0.14, yoyo: true, repeat: 1 }, CELULAR);
      etiqueta(q(".s10-e3"), BIEN, q(".s10-e2"));

      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
