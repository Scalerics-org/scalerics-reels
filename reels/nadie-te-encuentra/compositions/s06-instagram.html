<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-instagram"] .s06-capa { position: absolute; inset: 0; }
    [data-composition-id="s06-instagram"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-instagram"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

    [data-composition-id="s06-instagram"] .vidrio { fill: #5ce611; }

    [data-composition-id="s06-instagram"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s06-instagram"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s06-instagram"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }

    [data-composition-id="s06-instagram"] .s06-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 30px; fill: #efeee5; }
    [data-composition-id="s06-instagram"] .s06-preg { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 84px; fill: #5ce611; }
    [data-composition-id="s06-instagram"] .s06-preg-ch { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 30px; fill: #5ce611; }

  </style>
  <div id="root" data-composition-id="s06-instagram" data-width="1080" data-height="1920" data-duration="4.70">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="4.70" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- tu celular, apagado -->
        <g class="s06-tel">
          <rect class="ln s06-marco" x="330" y="600" width="420" height="630" rx="52" />
          <line class="ln s06-marco" x1="500" y1="628" x2="580" y2="628" />
          <g class="s06-cab">
            <circle class="ln-fino" cx="392" cy="704" r="34" />

            <line class="ln-tenue" x1="444" y1="724" x2="520" y2="724" />
            <line class="ln-tenue" x1="540" y1="724" x2="616" y2="724" />
          </g>
          <g class="s06-bio">
            <text class="ui" x="362" y="790">Horario:</text>
            <line class="ln-tenue" x1="362" y1="816" x2="610" y2="816" />
          </g>
          <g class="s06-grilla"></g>
        </g>
        <text class="s06-preg-ch s06-p0" x="488" y="792">?</text>
        <!-- la pregunta del cliente, sin respuesta -->
        <g class="s06-msg">
          <rect class="ln-fino" x="580" y="1100" width="320" height="70" rx="24" />
          <text class="ui" x="604" y="1145">¿A qué hora abren?</text>
          <path class="ln-tenue" d="M842 1194 L850 1202 L864 1186 M856 1200 L858 1202 L872 1186" />
        </g>
        <!-- los signos -->
        <text class="s06-preg s06-p1" x="240" y="800" text-anchor="middle">?</text>
        <text class="s06-preg s06-p2" x="850" y="860" text-anchor="middle">?</text>
        <text class="s06-preg s06-p3" x="230" y="1080" text-anchor="middle">?</text>
      </svg>
      <div class="etiqueta"><span class="s06-e1">Sin horario</span><span class="s06-e2">No va a adivinar</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-instagram";
      const DUR = 4.7;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const badge = (el, t) => {
        tl.fromTo(el.firstElementChild, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const etiqueta = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, y: -10, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      const INSTAGRAM = 0.82;
      const NO = 1.42;
      const QUE = 2.02;
      const ABRIS = 2.32;
      const NOVA = 3.52;

      // grilla 3x2 de publicaciones (generada, determinista)
      const NS = "http://www.w3.org/2000/svg";
      const g = q(".s06-grilla");
      const cuads = [];
      for (let f = 0; f < 2; f++) for (let c = 0; c < 3; c++) {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", 360 + c * 124); r.setAttribute("y", 850 + f * 124); r.setAttribute("width", 112); r.setAttribute("height", 112); r.setAttribute("rx", 10);
        r.setAttribute("class", "s06-cuad");
        g.appendChild(r);
        cuads.push(r);
      }

      // el celular arranca medio dibujado y apagado
      gsap.set(q(".s06-tel"), { opacity: 0.5 });
      dibujar(qa(".s06-marco"), 0, 0.5, 0.5);
      tl.fromTo(q(".s06-cab"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.25);
      // "Instagram": se arma la grilla
      cuads.forEach((r, i) => tl.fromTo(r, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, INSTAGRAM - 0.1 + i * 0.06));

      // "no dice ni a qué hora abrís"
      tl.fromTo(q(".s06-bio"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, NO);
      tl.fromTo(q(".s06-p0"), { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, QUE);
      etiqueta(q(".s06-e1"), QUE);
      tl.fromTo(q(".s06-msg"), { opacity: 0, y: 30, scale: 0.9, svgOrigin: "740 1135" }, { opacity: 1, y: 0, scale: 1, svgOrigin: "740 1135", duration: 0.35, ease: "back.out(1.8)" }, ABRIS);
      tl.to(q(".s06-msg"), { x: -6, duration: 0.07, yoyo: true, repeat: 3 }, ABRIS + 0.9);

      // "no va a adivinar": saltan los signos
      [".s06-p1", ".s06-p2", ".s06-p3"].forEach((s, i) => {
        tl.fromTo(q(s), { opacity: 0, scale: 0.3, rotation: -30, transformOrigin: "50% 60%" }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.4)" }, NOVA - 0.2 + i * 0.12);
        tl.to(q(s), { rotation: i % 2 ? 10 : -10, transformOrigin: "50% 60%", duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, NOVA + 0.3 + i * 0.1);
      });
      etiqueta(q(".s06-e2"), NOVA, q(".s06-e1"));

      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
