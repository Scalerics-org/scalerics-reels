<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-busca"] .s02-capa { position: absolute; inset: 0; }
    [data-composition-id="s02-busca"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s02-busca"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-busca"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-busca"] .ln-fino { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-busca"] .ln-fino-ac { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-busca"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.35); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s02-busca"] .vidrio { fill: #5ce611; }
    [data-composition-id="s02-busca"] .relleno-ac { fill: #5ce611; }
    [data-composition-id="s02-busca"] .ui { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 26px; fill: #efeee5; }
    [data-composition-id="s02-busca"] .ui-b { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s02-busca"] .ui-ac { fill: #5ce611; }
    [data-composition-id="s02-busca"] .rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: #efeee5; }
    [data-composition-id="s02-busca"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s02-busca"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s02-busca"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }

    [data-composition-id="s02-busca"] .s02-fig .ln { stroke-width: 3.2; }
    [data-composition-id="s02-busca"] .s02-preg { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 64px; fill: #efeee5; }
    [data-composition-id="s02-busca"] .s02-busq { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 27px; fill: #efeee5; }
    [data-composition-id="s02-busca"] .s02-tecla { fill: none; stroke: rgba(239, 238, 229, 0.4); stroke-width: 3; }
    [data-composition-id="s02-busca"] .s02-luz { fill: #5ce611; }
  </style>
  <div id="root" data-composition-id="s02-busca" data-width="1080" data-height="1920" data-duration="5.50">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="5.50" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- parte A: no pregunta en el barrio -->
        <g class="s02-a">
          <line class="ln s02-suelo" x1="200" y1="1110" x2="880" y2="1110" />
          <g class="s02-fig s02-cli"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
          <g class="s02-fig s02-vec"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
          <g class="s02-burb">
            <path class="ln" d="M470 800 H650 Q680 800 680 830 V880 Q680 910 650 910 H520 L480 945 L490 910 H470 Q440 910 440 880 V830 Q440 800 470 800 Z" />
            <text class="s02-preg" x="560" y="878" text-anchor="middle">?</text>
          </g>
          <path class="ln-ac s02-tacha" d="M445 915 L675 795" />
          <g class="s02-badge"><g><circle class="ln-ac" cx="0" cy="0" r="18" style="stroke-width:4" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" style="stroke-width:4" /></g></g>
        </g>
        <!-- parte B: el celular y la búsqueda -->
        <g class="s02-b">
          <rect class="ln s02-tel" x="310" y="600" width="460" height="630" rx="52" />
          <line class="ln s02-tel" x1="500" y1="628" x2="580" y2="628" />
          <rect class="ln-fino s02-barra" x="340" y="664" width="400" height="76" rx="38" />
          <circle class="ln-fino s02-barra" cx="380" cy="700" r="12" />
          <path class="ln-fino s02-barra" d="M389 709 L399 719" />
          <text class="s02-busq" x="414" y="712"><tspan class="s02-w1">pizzería </tspan><tspan class="s02-w2">abierta </tspan><tspan class="s02-w3">cerca</tspan></text>
          <line class="ln-fino-ac s02-cursor" x1="0" y1="684" x2="0" y2="720" />
          <line class="ln-tenue s02-sep" x1="340" y1="770" x2="740" y2="770" />
          <g class="s02-teclado"></g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s02-e1">No pregunta</span><span class="s02-e2">Busca en el celular</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-busca";
      const DUR = 5.5;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const badge = (el, t) => {
        tl.fromTo(el.firstElementChild, { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, t);
      };
      const etiqueta = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, y: -10, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      const CLIENTE = 1.1;
      const PREGUNTA = 1.7;
      const BARRIO = 2.4;
      const AGARRA = 2.96;
      const ESCRIBE = 3.9;
      const PIZZERIA = 4.2;
      const ABIERTA = 4.8;
      const CERCA = 5.4;

      // parte A
      const SUELO = 1110;
      gsap.set(q(".s02-cli"), { x: 400, y: SUELO, scale: 1.6, svgOrigin: "0 0" });
      gsap.set(q(".s02-vec"), { x: 720, y: SUELO, scale: 1.6, svgOrigin: "0 0" });
      // arranca con el suelo y el vecino medio dibujados (cuadro 0 no negro)
      dibujar([q(".s02-suelo")], 0, 0.5, 0.4);
      dibujar(qa(".s02-vec .ln"), 0, 0.5, 0.5);
      tl.fromTo(q(".s02-vec"), { opacity: 0.45 }, { opacity: 0.45, duration: 0.01 }, 0);
      dibujar(qa(".s02-cli .ln"), CLIENTE - 0.5, 0.45);
      tl.fromTo(q(".s02-cli"), { y: SUELO + 20 }, { y: SUELO, duration: 0.4, ease: "back.out(2)" }, CLIENTE - 0.4);
      // la cabeza del cliente gira hacia el vecino
      tl.to(q(".s02-cli"), { rotation: 4, transformOrigin: "50% 100%", duration: 0.2, yoyo: true, repeat: 1 }, CLIENTE + 0.1);
      gsap.set(q(".s02-burb"), { opacity: 0 });
      tl.fromTo(q(".s02-burb"), { opacity: 0, scale: 0.6, svgOrigin: "480 940" }, { opacity: 1, scale: 1, svgOrigin: "480 940", duration: 0.4, ease: "back.out(1.8)" }, PREGUNTA - 0.1);
      tl.to(q(".s02-preg"), { rotation: -10, svgOrigin: "560 860", duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, PREGUNTA + 0.25);
      etiqueta(q(".s02-e1"), PREGUNTA);
      dibujar([q(".s02-tacha")], BARRIO - 0.1, 0.3);
      gsap.set(q(".s02-badge"), { x: 690, y: 790 });
      badge(q(".s02-badge"), BARRIO + 0.12);
      tl.to(q(".s02-burb"), { opacity: 0.35, duration: 0.25 }, BARRIO + 0.15);
      tl.to(q(".s02-a"), { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, AGARRA - 0.25);

      // parte B: se dibuja el celular
      dibujar(qa(".s02-tel"), AGARRA - 0.05, 0.5);
      tl.fromTo(q(".s02-b"), { scale: 0.92, svgOrigin: "540 915" }, { scale: 1, svgOrigin: "540 915", duration: 0.5, ease: "power3.out" }, AGARRA);
      dibujar(qa(".s02-barra"), AGARRA + 0.3, 0.4);
      dibujar([q(".s02-sep")], AGARRA + 0.4, 0.4);
      etiqueta(q(".s02-e2"), AGARRA + 0.35, q(".s02-e1"));

      // teclado de líneas
      const NS = "http://www.w3.org/2000/svg";
      const tecl = q(".s02-teclado");
      const filas = [[10, 340], [9, 360], [7, 400]];
      const teclas = [];
      filas.forEach(([n, x0], f) => {
        for (let k = 0; k < n; k++) {
          const r = document.createElementNS(NS, "rect");
          r.setAttribute("x", x0 + k * 40 + 3); r.setAttribute("y", 1000 + f * 58); r.setAttribute("width", 34); r.setAttribute("height", 46); r.setAttribute("rx", 7);
          r.setAttribute("class", "s02-tecla");
          tecl.appendChild(r);
          const l = document.createElementNS(NS, "rect");
          l.setAttribute("x", x0 + k * 40 + 3); l.setAttribute("y", 1000 + f * 58); l.setAttribute("width", 34); l.setAttribute("height", 46); l.setAttribute("rx", 7);
          l.setAttribute("class", "s02-luz");
          l.setAttribute("opacity", "0");
          tecl.appendChild(l);
          teclas.push(l);
        }
      });
      const esp = document.createElementNS(NS, "rect");
      esp.setAttribute("x", 440); esp.setAttribute("y", 1174); esp.setAttribute("width", 200); esp.setAttribute("height", 40); esp.setAttribute("rx", 7); esp.setAttribute("class", "s02-tecla");
      tecl.appendChild(esp);
      tl.fromTo(tecl, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, AGARRA + 0.45);

      // cursor y texto que se escribe por palabras
      const CX = [414, 530, 632, 716];
      gsap.set(q(".s02-cursor"), { x: CX[0], opacity: 0 });
      tl.to(q(".s02-cursor"), { opacity: 1, duration: 0.05 }, ESCRIBE - 0.2);
      [ESCRIBE + 0.05, ESCRIBE + 0.15].forEach((t) => tl.to(q(".s02-cursor"), { opacity: 0.2, duration: 0.08, yoyo: true, repeat: 1 }, t));
      const PAL = [[".s02-w1", PIZZERIA], [".s02-w2", ABIERTA], [".s02-w3", CERCA - 0.25]];
      PAL.forEach(([s, t], i) => {
        tl.fromTo(q(s), { opacity: 0 }, { opacity: 1, duration: 0.18 }, t);
        tl.to(q(".s02-cursor"), { x: CX[i + 1], duration: 0.22, ease: "steps(4)" }, t);
        // teclas que se iluminan (orden fijo, determinista)
        [3, 12, 7, 21, 15].forEach((k, j) => {
          const key = teclas[(k + i * 5) % teclas.length];
          tl.fromTo(key, { opacity: 0 }, { opacity: 0.85, duration: 0.03, yoyo: true, repeat: 1 }, t + j * 0.05);
        });
      });

      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
