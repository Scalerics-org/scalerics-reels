<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-no-existe"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-no-existe"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-no-existe"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-no-existe"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-no-existe"] .s01-local .ln { stroke-width: 3.5; }
    [data-composition-id="s01-no-existe"] .vidrio { fill: #5ce611; }
    [data-composition-id="s01-no-existe"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; fill: #efeee5; }
    [data-composition-id="s01-no-existe"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s01-no-existe"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01-no-existe" data-width="1080" data-height="1920" data-duration="3.30">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="3.30" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s01-suelo" x1="120" y1="1110" x2="960" y2="1110" />
        <!-- tu local, grande y centrado (escala 1.45) -->
        <g class="s01-local">
          <g class="s01-local-in">
            <path class="ln s01-dib" d="M-120 0 V-170 H120 V0" />
            <path class="ln s01-dib" d="M-140 -170 H140 L122 -222 H-122 Z" />
            <path class="ln s01-dib" d="M-140 -170 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0 q17.5 28 35 0" />
            <rect class="ln s01-dib" x="-80" y="-290" width="160" height="50" rx="10" />
            <rect class="ln s01-dib" x="-100" y="-122" width="58" height="52" rx="5" />
            <rect class="ln s01-dib" x="42" y="-122" width="58" height="52" rx="5" />
            <rect class="vidrio s01-luz" x="-92" y="-114" width="42" height="36" rx="3" />
            <rect class="vidrio s01-luz" x="50" y="-114" width="42" height="36" rx="3" />
            <path class="ln s01-dib" d="M-24 0 V-96 H24 V0" />
          </g>
        </g>
        <text class="cartel s01-txt" x="540" y="737" text-anchor="middle">TU LOCAL</text>
        <!-- la lupa que busca -->
        <g class="s01-lupa">
          <circle class="ln s01-lupa-l" cx="0" cy="0" r="92" />
          <path class="ln s01-lupa-l" d="M66 66 L132 132" />
          <path class="ln s01-lupa-l" d="M-52 -34 Q-40 -60 -12 -68" />
        </g>
        <!-- badge de "no" -->
        <g class="s01-badge"><g class="s01-b-in"><circle class="ln-ac" cx="0" cy="0" r="18" style="stroke-width:4" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" style="stroke-width:4" /></g></g>
      </svg>
      <div class="etiqueta"><span class="s01-e1">No aparece</span><span class="s01-e2">No existe</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-no-existe";
      const DUR = 3.3;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const APARECE = 0.9;
      const GOOGLE = 1.5;
      const BUSCA = 2.4;
      const NO = 2.7;
      const EXISTE = 2.9;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          // si arranca en 0 se ve desde el cuadro 0 (no puede ser negro)
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // el local arranca medio dibujado (el cuadro 0 no puede ser negro), con la luz prendida
      gsap.set(q(".s01-local"), { x: 540, y: 1110, scale: 1.45, svgOrigin: "0 0" });
      dibujar(qa(".s01-dib"), 0, 0.6, 0.45);
      gsap.set(qa(".s01-dib"), { opacity: 1 });
      tl.fromTo(q(".s01-txt"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3);
      tl.fromTo(qa(".s01-luz"), { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 0.35);
      tl.fromTo(q(".s01-suelo"), { scaleX: 0.5, svgOrigin: "540 1110" }, { scaleX: 1, svgOrigin: "540 1110", duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo(q(".s01-local-in"), { scale: 0.96, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 1.2, ease: "power2.out" }, 0);

      // "aparece en Google": la lupa entra desde la izquierda y barre el local sin verlo
      gsap.set(q(".s01-lupa"), { x: 210, y: 880 });
      dibujar(qa(".s01-lupa-l"), APARECE - 0.15, 0.4);
      tl.to(q(".s01-lupa"), { x: 430, y: 860, duration: 0.6, ease: "power2.out" }, APARECE);
      tl.to(q(".s01-lupa"), { x: 650, y: 900, duration: 0.6, ease: "sine.inOut" }, GOOGLE);
      tl.to(q(".s01-lupa"), { x: 870, y: 850, duration: 0.5, ease: "power2.inOut" }, BUSCA - 0.3);
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, APARECE);

      // "no existe": el local se vuelve fantasma y salta la X
      tl.to(qa(".s01-luz"), { opacity: 0, duration: 0.25 }, NO);
      tl.to(qa(".s01-dib, .s01-txt"), { opacity: 0.2, duration: 0.35, ease: "power2.out" }, NO);
      tl.to(q(".s01-lupa"), { opacity: 0.5, duration: 0.3 }, NO);
      gsap.set(q(".s01-badge"), { x: 770, y: 690 });
      tl.fromTo(q(".s01-b-in"), { scale: 0.4, opacity: 0, y: -26, transformOrigin: "50% 50%" }, { scale: 1.4, opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, EXISTE);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.15 }, NO - 0.12);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, NO);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
