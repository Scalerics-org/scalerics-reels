      const ID = "s11-tu-sitio";
      const DUR = 6.34;

      const tl = gsap.timeline({ paused: true });

          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });

        });
      };
      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);

      const TRAE = 3.7;

      dibujar(qa(".s11-marco-a"), 0, 0.5, 0.5);
      tl.fromTo(q(".s11-cab"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.05);
      etiqueta(q(".s11-e1"), 0.1);
      const fila = (s, t) => tl.fromTo(q(s), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, t);
      fila(".s11-f1", HORARIOS - 0.05);
      tl.fromTo(q(".s11-aguja"), { rotation: -90, svgOrigin: "158 786" }, { rotation: 0, svgOrigin: "158 786", duration: 0.5, ease: "back.out(2)" }, HORARIOS);

        tl.to(c, { x: 640, y: YM[i], duration: 0.18, ease: "power1.in" }, t0 + 0.18);
