<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    /* pared verde hospital: media pared pintada y una línea de zócalo */
    [data-composition-id="ambiente"] .amb-pared { position: absolute; left: 0; right: 0; top: 980px; height: 500px; background: rgba(143, 179, 155, 0.07); border-top: 5px solid rgba(143, 179, 155, 0.16); }
    /* piso de baldosas en damero, en perspectiva */
    [data-composition-id="ambiente"] .amb-piso-wrap { position: absolute; left: 0; right: 0; top: 1480px; height: 440px; overflow: hidden; perspective: 520px; perspective-origin: 540px -200px; }
    [data-composition-id="ambiente"] .amb-piso { position: absolute; left: -900px; top: 0; width: 2880px; height: 1400px; transform-origin: 50% 0; transform: rotateX(62deg); opacity: 0.11;
      background-color: rgba(236, 226, 198, 0.0);
      background-image: conic-gradient(#ece2c6 25%, transparent 0 50%, #ece2c6 0 75%, transparent 0);
      background-size: 180px 180px; }
    [data-composition-id="ambiente"] .amb-zocalo { position: absolute; left: 0; right: 0; top: 1474px; height: 12px; background: rgba(154, 100, 56, 0.55); }
    /* el tubo fluorescente y su resplandor */
    [data-composition-id="ambiente"] .amb-artefacto { position: absolute; left: 210px; top: 48px; width: 660px; height: 34px; border-radius: 8px; background: #22302a; border: 4px solid rgba(236, 226, 198, 0.5); }
    [data-composition-id="ambiente"] .amb-tubo { position: absolute; left: 236px; top: 86px; width: 608px; height: 22px; border-radius: 11px; background: #ece2c6; box-shadow: 0 0 22px 6px rgba(216, 240, 222, 0.55); }
    [data-composition-id="ambiente"] .amb-cable { position: absolute; top: 0; width: 4px; height: 50px; background: rgba(236, 226, 198, 0.45); }
    [data-composition-id="ambiente"] .amb-halo { position: absolute; inset: 0; background: radial-gradient(ellipse 820px 640px at 540px 100px, rgba(216, 240, 222, 0.2), rgba(216, 240, 222, 0) 78%); }
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 820px 1150px at 540px 900px, rgba(20, 28, 25, 0) 55%, rgba(20, 28, 25, 0.85) 100%); }
    /* apagón del tubo: oscurece todo menos los subtítulos (van arriba) */
    [data-composition-id="ambiente"] .amb-apagon { position: absolute; inset: 0; background: #0b100e; opacity: 0; }
    [data-composition-id="ambiente"] .amb-flash { position: absolute; inset: 0; background: #d8f0de; opacity: 0; }
    [data-composition-id="ambiente"] .amb-rotulo { position: absolute; left: 60px; top: 1610px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.16em; color: #ece2c6; opacity: 0.5; line-height: 1.5; }
    [data-composition-id="ambiente"] .amb-punto { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #f2a541; margin-right: 12px; vertical-align: 1px; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="75.44">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="75.44" data-track-index="0">
      <div class="amb-pared"></div>
      <div class="amb-piso-wrap"><div class="amb-piso"></div></div>
      <div class="amb-zocalo"></div>
      <div class="amb-vineta"></div>
      <div class="amb-halo"></div>
      <div class="amb-cable" style="left: 290px"></div>
      <div class="amb-cable" style="left: 786px"></div>
      <div class="amb-artefacto"></div>
      <div class="amb-tubo"></div>
      <div class="amb-rotulo" data-layout-ignore><span class="amb-punto"></span>VISTO ANÓNIMOS<br />JUEVES · 20 H · SALÓN</div>
      <div class="amb-apagon"></div>
      <div class="amb-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 75.44;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const tubo = [q(".amb-tubo"), q(".amb-halo")];

      // el halo respira apenas
      tl.fromTo(q(".amb-halo"), { opacity: 0.75 }, { opacity: 1, duration: 1.7, yoyo: true, repeat: Math.max(0, Math.floor(DUR / 1.7) - 1), ease: "sine.inOut" }, 0);
      tl.to(q(".amb-punto"), { opacity: 0.2, duration: 0.6, yoyo: true, repeat: Math.max(0, Math.floor(DUR / 0.6) - 1), ease: "steps(1)" }, 0);

      // parpadeos del tubo (segundos globales): un tubo viejo que titila solo
      const titila = (t, n, apagon) => {
        for (let i = 0; i < n; i++) {
          tl.to(tubo, { opacity: 0.15, duration: 0.02 }, t + i * 0.12);
          tl.to(tubo, { opacity: 1, duration: 0.02 }, t + i * 0.12 + 0.06);
          if (apagon) {
            tl.to(q(".amb-apagon"), { opacity: apagon, duration: 0.02 }, t + i * 0.12);
            tl.to(q(".amb-apagon"), { opacity: 0, duration: 0.02 }, t + i * 0.12 + 0.06);
          }
        }
      };
      titila(0.05, 2, 0.25);     // se prende
      titila(10.4, 2, 0.2);      // "Y pienso"
      titila(23.3, 3, 0.25);     // "Se escucha el partido"
      titila(35.7, 2, 0.35);     // "¿Y vos?"
      titila(46.4, 3, 0.4);      // "Sos uno solo"
      titila(62.7, 2, 0.3);      // "Duermo."
      // flashes de golpe: "visto", "nunca", "¡etiquetá!"
      [3.8, 14.25, 67.1].forEach((t) => {
        tl.to(q(".amb-flash"), { opacity: 0.22, duration: 0.03 }, t);
        tl.to(q(".amb-flash"), { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.04);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
