          tl.fromTo(w, { opacity: 0, y: 10, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, t);
        }
        const q = el.querySelector(".quien");
        if (q) tl.fromTo(q, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.18, ease: "power3.out" }, Math.max(0, ini - 0.02));
        tl.to(el.children, { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, ini + dur - 0.2);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
