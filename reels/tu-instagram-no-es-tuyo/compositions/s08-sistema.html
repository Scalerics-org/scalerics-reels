<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s08-sistema"] .s08-capa { position: absolute; inset: 0; }
    [data-composition-id="s08-sistema"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s08-sistema"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sistema"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sistema"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-sistema"] .precio { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 120px; fill: #efeee5; }
    [data-composition-id="s08-sistema"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s08-sistema"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s08-sistema" data-width="1080" data-height="1920" data-duration="2.25">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="2.25" data-track-index="0">
      <!-- etiqueta de precio -->
      <div id="s08-tag-capa" class="s08-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g class="s08-tag">
            <path class="ln s08-dib-t s08-cuerpo" d="M390 920 L470 820 H690 Q710 820 710 840 V1000 Q710 1020 690 1020 H470 Z" />
            <circle class="ln s08-dib-t s08-cuerpo" cx="452" cy="920" r="14" />
            <path class="ln s08-dib-t s08-piolin" d="M440 911 C 400 870 370 800 400 730" />
            <text class="precio s08-precio" x="600" y="962" text-anchor="middle">$</text>
          </g>
          <g class="s08-badge"><circle class="ln-badge" cx="710" cy="820" r="18" /><path class="ln-badge" d="M703 813 L717 827 M717 813 L703 827" /></g>
        </svg>
      </div>
      <!-- engranaje -->
      <div id="s08-sis-capa" class="s08-capa">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g class="s08-engranaje">
            <path class="ln s08-dib-g s08-dientes" d="" />
            <circle class="ln-ac s08-dib-g" cx="540" cy="910" r="54" />
          </g>
        </svg>
      </div>
      <div class="etiqueta"><span class="s08-e1">No es caro</span><span class="s08-e2">Es un sistema</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-sistema";
      const DUR = 2.25;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const NADA = 0.21;
      const CARO = 0.41;
      const ES = 0.97;
      const SISTEMA = 1.51;

      // dientes del engranaje (geometría fija, determinista)
      const CX = 540, CY = 910, RIN = 128, ROUT = 168, N = 9;
      const pt = (r, a) => (CX + r * Math.cos(a)).toFixed(1) + " " + (CY + r * Math.sin(a)).toFixed(1);
      let d = "";
      for (let i = 0; i < N; i++) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
        const p0 = pt(RIN, a - 0.2), p1 = pt(ROUT, a - 0.12), p2 = pt(ROUT, a + 0.12), p3 = pt(RIN, a + 0.2);
        const sig = pt(RIN, a + (2 * Math.PI) / N - 0.2);
        d += (i === 0 ? "M" + p0 : "") + " L" + p1 + " L" + p2 + " L" + p3 + " A" + RIN + " " + RIN + " 0 0 1 " + sig;
      }
      q(".s08-dientes").setAttribute("d", d + " Z");

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };

      // la etiqueta arranca medio dibujada (cuadro 0 no negro) y se balancea del piolín
      // el cuerpo entra con pop (dibujado a medias queda una forma rara); el piolín se dibuja
      tl.fromTo(qa(".s08-cuerpo"), { opacity: 0.45, scale: 0.82, svgOrigin: "550 920" }, { opacity: 1, scale: 1, svgOrigin: "550 920", duration: 0.4, ease: "back.out(1.6)" }, 0);
      dibujar([q(".s08-piolin")], 0.1, 0.45);
      tl.fromTo(q(".s08-precio"), { opacity: 0, scale: 1.4, svgOrigin: "600 920" }, { opacity: 1, scale: 1, svgOrigin: "600 920", duration: 0.32, ease: "power3.out" }, 0.2);
      tl.fromTo(q(".s08-tag"), { rotation: -4, svgOrigin: "400 730" }, { rotation: 4, svgOrigin: "400 730", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);

      // "nada de eso": entra la etiqueta mono; "caro": badge, tiembla y se apaga
      tl.fromTo(q(".s08-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, NADA);
      tl.fromTo(q(".s08-precio"), { scale: 1 }, { scale: 1.12, svgOrigin: "600 920", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, NADA);
      tl.fromTo(q(".s08-badge"), { opacity: 0, scale: 0.5, svgOrigin: "710 820" }, { opacity: 1, scale: 1, svgOrigin: "710 820", duration: 0.35, ease: "back.out(2.2)" }, CARO);
      tl.to(q(".s08-precio"), { x: 6, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, CARO + 0.05);
      tl.to(qa(".s08-dib-t, .s08-precio"), { opacity: 0.4, duration: 0.35 }, CARO + 0.25);
      tl.to(q(".s08-tag"), { rotation: -2, svgOrigin: "400 730", duration: 0.45, ease: "sine.inOut" }, CARO + 0.2);

      // "Es": la etiqueta se va girando; el engranaje se dibuja en su lugar
      tl.to(q("#s08-tag-capa"), { opacity: 0, scale: 0.7, rotation: -40, filter: "blur(6px)", transformOrigin: "540px 910px", duration: 0.4, ease: "power2.in" }, ES - 0.15);
      tl.to(q(".s08-e1"), { opacity: 0, duration: 0.2 }, ES - 0.15);
      dibujar(qa(".s08-dib-g"), ES, 0.55);
      tl.fromTo(q(".s08-engranaje"), { rotation: -30, svgOrigin: "540 910" }, { rotation: 70, svgOrigin: "540 910", duration: DUR - ES, ease: "none" }, ES);
      tl.fromTo(q(".s08-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, ES + 0.05);
      // "sistema": punch
      tl.fromTo(q("#s08-sis-capa"), { scale: 1 }, { scale: 1.12, transformOrigin: "540px 910px", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, SISTEMA);
      tl.to(q(".s08-e2"), { scale: 1.08, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, SISTEMA);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
