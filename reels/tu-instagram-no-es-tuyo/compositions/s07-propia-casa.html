    (function () {
      const ID = "s07-propia-casa";
      const DUR = 5.16;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CRECE = 0.77;
      const INSTAGRAM = 1.47;
      const CONOZCAN = 2.37;
      const PERO = 3.22;
      const VENDE = 3.37;
      const PROPIA = 3.87;
      const CASA = 4.17;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, extra) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, Object.assign({ opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, extra || {}), t);
      };

      gsap.set(q(".s07-cel"), { x: 260, y: 930 });
      gsap.set(q(".s07-tienda"), { x: 790, y: 1130 });
      gsap.set(qa(".s07-luz, .s07-txt, .s07-r1, .s07-punta, .s07-p, .s07-llave"), { opacity: 0 });

      // "El comercio": el celular se dibuja de entrada
      dibujar([q(".s07-suelo")], 0, 0.5);
      dibujar(qa(".s07-dc"), 0, 0.45);
      dibujar(qa(".s07-dl"), 0.3, 0.3);
      // "crece": flechita verde que sube y golpe
      dibujar([q(".s07-crece")], CRECE - 0.1, 0.3);
      tl.to(q(".s07-cel-in"), { scale: 1.07, svgOrigin: "0 0", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, CRECE + 0.1);
      // "Instagram": la cámara
      pop(q(".s07-cam"), INSTAGRAM - 0.1);
      tl.fromTo(q(".s07-r1"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, INSTAGRAM + 0.1);
      tl.fromTo(q(".s07-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, INSTAGRAM);
      // "para que lo conozcan": el ojo mira el celular
      dibujar(qa(".s07-ojo-l"), 1.95, 0.35);
      tl.fromTo(q(".s07-pupila"), { opacity: 0, scale: 0.4, svgOrigin: "260 660" }, { opacity: 1, scale: 1, svgOrigin: "260 660", duration: 0.25, ease: "back.out(2)" }, 2.2);
      tl.to(q(".s07-pupila"), { y: 8, duration: 0.25, ease: "power2.inOut" }, CONOZCAN);
      tl.to(q(".s07-pupila"), { x: 10, duration: 0.25, ease: "power2.inOut" }, CONOZCAN + 0.4);

      // "pero vende": flecha a tu tienda y el cliente cruza
      dibujar(qa(".s07-dt"), PERO - 0.45, 0.45);
      dibujar([q(".s07-flecha")], PERO, 0.35);
      tl.to(q(".s07-punta"), { opacity: 1, duration: 0.1 }, PERO + 0.32);
      tl.fromTo(q(".s07-p"), { x: 400, y: 1130, opacity: 0 }, { x: 460, opacity: 1, duration: 0.15, ease: "none" }, VENDE);
      tl.to(q(".s07-p"), { x: 790, duration: 0.6, ease: "none" }, VENDE + 0.15);
      tl.to(q(".s07-p"), { opacity: 0, duration: 0.12 }, VENDE + 0.7);
      tl.fromTo(q(".s07-p-c"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 4 }, VENDE);
      tl.to(qa(".s07-cel, .s07-ojo"), { opacity: 0.45, duration: 0.3 }, VENDE);
      tl.to(qa(".s07-flecha, .s07-punta"), { opacity: 0.3, duration: 0.3 }, VENDE + 0.6);

      // "propia": entra la llave y gira en la puerta
      tl.fromTo(q(".s07-llave"), { x: 860, y: 860, opacity: 0 }, { x: 734, y: 1080, opacity: 1, duration: 0.35, ease: "power3.out" }, PROPIA - 0.2);
      gsap.set(q(".s07-llave-in"), { rotation: -40, svgOrigin: "0 0" });
      tl.to(q(".s07-llave-in"), { rotation: 0, svgOrigin: "0 0", duration: 0.25, ease: "back.out(2)" }, PROPIA + 0.15);
      tl.to(q(".s07-e1"), { opacity: 0, duration: 0.2 }, PROPIA - 0.1);
      tl.fromTo(q(".s07-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, PROPIA);
      // "casa": golpe, se prenden las luces y el cartel
      tl.to(qa(".s07-luz"), { opacity: 0.85, duration: 0.2 }, CASA);
      tl.fromTo(q(".s07-txt"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, CASA);
      tl.to(q(".s07-tienda-in"), { scale: 1.07, svgOrigin: "0 0", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, CASA);
      tl.to(q(".s07-llave"), { scale: 1.15, svgOrigin: "734 1080", duration: 0.12, yoyo: true, repeat: 1 }, CASA + 0.3);

      // salida

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
