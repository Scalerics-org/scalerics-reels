      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- el celular que se cae -->
        <g class="s06-cel">
          <g class="s06-cel-in">
            <rect class="ln" x="-120" y="-230" width="240" height="460" rx="44" />

            <g class="s06-grilla">
              <rect class="ln-4" x="-90" y="-160" width="54" height="54" rx="6" />

  <script>
    (function () {
      const ID = "s06-se-cae";
      const DUR = 3.58;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CAE = 0.55;
      const CUENTA = 0.85;
      const NO = 1.51;
      const QUIEN = 2.15;
      const AVISARLE = 2.35;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      gsap.set(q(".s06-cel"), { x: 290, y: 920 });
      gsap.set(q(".s06-mega"), { x: 590, y: 930 });
      const SX = [850, 930, 1010];
      qa(".s06-sil").forEach((s, i) => gsap.set(s, { x: SX[i] - 40, y: 960 + (i === 1 ? -20 : 0) }));
      gsap.set(qa(".s06-caida, .s06-preg"), { opacity: 0 });

      // entra el celular
      tl.fromTo(q(".s06-cel-in"), { opacity: 0, scale: 0.9, svgOrigin: "0 0" }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.3, ease: "back.out(1.6)" }, 0);
      // "se cae": se ladea y baja, la pantalla se vacía
      tl.to(q(".s06-cel-in"), { rotation: -10, y: 26, svgOrigin: "0 230", duration: 0.25, ease: "power3.in" }, CAE - 0.1);
      tl.to(q(".s06-cel-in"), { rotation: -7, svgOrigin: "0 230", duration: 0.2, ease: "power2.out" }, CAE + 0.15);
      tl.to(q(".s06-grilla"), { opacity: 0, duration: 0.15 }, CAE);
      tl.fromTo(q(".s06-caida"), { opacity: 0, scale: 0.7, svgOrigin: "0 0" }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.3, ease: "back.out(2)" }, CUENTA - 0.15);
      tl.fromTo(q(".s06-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CAE);

      // "no tenés a quién": megáfono, ondas que salen y siluetas que se borran
      dibujar(qa(".s06-dm"), NO - 0.3, 0.35);
      tl.to(q(".s06-mega-in"), { scale: 1.08, svgOrigin: "-20 0", duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, NO + 0.1);
      qa(".s06-onda").forEach((o, i) => {
        tl.fromTo(o, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.15 }, NO + 0.1 + i * 0.12);
        tl.to(o, { opacity: 0.25, duration: 0.3 }, NO + 0.5 + i * 0.12);
        tl.fromTo(o, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.15, immediateRender: false }, NO + 1.0 + i * 0.12);
        tl.to(o, { opacity: 0.2, duration: 0.3 }, NO + 1.4 + i * 0.12);
      });
      qa(".s06-sil").forEach((s, i) => {
        tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.2 }, NO + 0.1 + i * 0.06);
        tl.to(s, { opacity: 0, y: "+=10", duration: 0.3, ease: "power2.in" }, QUIEN + i * 0.1);
      });
      tl.fromTo(q(".s06-preg"), { opacity: 0, scale: 0.5, svgOrigin: "900 940" }, { opacity: 1, scale: 1, svgOrigin: "900 940", duration: 0.35, ease: "back.out(2.2)" }, AVISARLE + 0.2);
      tl.to(q(".s06-preg"), { rotation: 10, svgOrigin: "900 970", duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, AVISARLE + 0.6);
      tl.to(q(".s06-e1"), { opacity: 0, duration: 0.2 }, QUIEN - 0.1);
      tl.fromTo(q(".s06-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, QUIEN + 0.1);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
