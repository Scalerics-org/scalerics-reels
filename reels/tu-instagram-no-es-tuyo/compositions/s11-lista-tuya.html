  <script>
    (function () {
      const ID = "s11-lista-tuya";
      const DUR = 5.22;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const COMPRA = 0.48;
      const CONTACTO = 1.48;
      const CLIENTE = 2.18;
      const LISTA = 2.88;
      const TUYA = 3.65;
      const PASE = 4.03;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, extra) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, Object.assign({ opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, extra || {}), t);
      };

      gsap.set(qa(".s11-fila, .s11-tit, .s11-vuela, .s11-llave, .s11-insta, .s11-dt-txt"), { opacity: 0 });

      // "cada compra": el ticket se imprime
      dibujar(qa(".s11-dt"), 0, 0.45);
      pop(q(".s11-dt-txt"), COMPRA - 0.1);
      dibujar([q(".s11-dt-tilde")], COMPRA + 0.15, 0.25);
      tl.fromTo(q(".s11-ticket"), { y: -20 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(q(".s11-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, COMPRA);
      // la lista se dibuja vacía
      dibujar(qa(".s11-dl"), 0.6, 0.45);
      tl.fromTo(q(".s11-tit"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.9);

      // "contacto": sale la tarjeta del ticket y vuela a la primera fila
      tl.fromTo(q(".s11-vuela"), { x: 240, y: 860, opacity: 0 }, { x: 240, y: 680, opacity: 1, duration: 0.3, ease: "power3.out" }, CONTACTO - 0.15);
      tl.to(q(".s11-vuela"), { x: 650, y: 780, duration: 0.45, ease: "power2.inOut" }, CONTACTO + 0.2);
      tl.to(q(".s11-vuela"), { opacity: 0, duration: 0.12 }, CONTACTO + 0.62);
      tl.fromTo(q(".s11-f0"), { opacity: 0 }, { opacity: 1, duration: 0.12 }, CONTACTO + 0.6);
      tl.to(q(".s11-f0"), { x: 8, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, CLIENTE - 0.05);

      // "lista": se llenan las demás filas
      [".s11-f1", ".s11-f2", ".s11-f3"].forEach((f, i) => {
        tl.fromTo(q(f), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out" }, LISTA - 0.2 + i * 0.13);
      });

      // "tuya": la llave verde y golpe de la lista
      tl.fromTo(q(".s11-llave"), { x: 1010, y: 560, opacity: 0 }, { x: 900, y: 640, opacity: 1, duration: 0.3, ease: "power3.out" }, TUYA - 0.2);
      gsap.set(q(".s11-llave-in"), { rotation: -50, svgOrigin: "0 0" });
      tl.to(q(".s11-llave-in"), { rotation: -20, svgOrigin: "0 0", duration: 0.25, ease: "back.out(2)" }, TUYA + 0.1);
      tl.to(q(".s11-lista"), { scale: 1.04, svgOrigin: "690 885", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, TUYA);
      tl.to(qa(".s11-ini"), { scale: 1.2, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1 }, TUYA + 0.05);
      tl.to(q(".s11-e1"), { opacity: 0, duration: 0.2 }, TUYA - 0.15);
      tl.fromTo(q(".s11-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, TUYA);

      // "pase lo que pase": el ticket se va, aparece Instagram y se candadea; la lista sigue
      tl.to(q(".s11-ticket"), { opacity: 0, y: 20, duration: 0.2, ease: "power2.in" }, PASE - 0.25);
      tl.fromTo(q(".s11-insta"), { opacity: 0, scale: 0.9, svgOrigin: "240 905" }, { opacity: 1, scale: 1, svgOrigin: "240 905", duration: 0.3, ease: "back.out(1.6)" }, PASE - 0.05);
      tl.fromTo(q(".s11-aro"), { y: -20 }, { y: 0, duration: 0.12, ease: "power4.in" }, PASE + 0.3);
      tl.to(q(".s11-insta"), { opacity: 0.45, duration: 0.3 }, PASE + 0.5);
      tl.to(q(".s11-lista"), { y: -6, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, PASE + 0.5);

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
