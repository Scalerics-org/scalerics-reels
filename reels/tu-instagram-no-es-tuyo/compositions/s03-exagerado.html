<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-exagerado"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-exagerado"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-exagerado"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-exagerado"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-exagerado"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-exagerado"] .ln-badge { fill: #0b1d35; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; }
    [data-composition-id="s03-exagerado"] .s03-preg { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 300px; fill: #5ce611; }
    [data-composition-id="s03-exagerado"] .s03-rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: rgba(239, 238, 229, 0.7); }
    [data-composition-id="s03-exagerado"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s03-exagerado"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s03-exagerado" data-width="1080" data-height="1920" data-duration="5.89">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="5.89" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- el signo de pregunta -->
        <g class="s03-q"><text class="s03-preg" x="540" y="1010" text-anchor="middle">?</text></g>

        <!-- 1: ojo con espiral (paranoia) -->
        <g class="s03-ico s03-i1">
          <g class="s03-dib1">
            <path class="ln s03-d1" d="M-96 0 Q0 -84 96 0 Q0 84 -96 0 Z" />
            <path class="ln-4 s03-d1" d="M0 0 m-4 0 a4 4 0 1 1 8 0 a10 10 0 1 1 -20 0 a16 16 0 1 1 32 0 a22 22 0 1 1 -44 0" />
          </g>
          <text class="s03-rotulo s03-r1" x="0" y="150" text-anchor="middle">PARANOIA</text>
        </g>
        <!-- 2: tres figuritas (le pasa a otros) -->
        <g class="s03-ico s03-i2">
          <g class="s03-dib2">
            <circle class="ln s03-d2" cx="-64" cy="-30" r="18" />
            <path class="ln s03-d2" d="M-92 40 a28 28 0 0 1 56 0" />
            <circle class="ln s03-d2" cx="64" cy="-30" r="18" />
            <path class="ln s03-d2" d="M36 40 a28 28 0 0 1 56 0" />
            <circle class="ln s03-d2" cx="0" cy="-46" r="24" />
            <path class="ln s03-d2" d="M-36 40 a36 36 0 0 1 72 0" />
          </g>
          <text class="s03-rotulo s03-r2" x="0" y="150" text-anchor="middle">A OTROS</text>
        </g>
        <!-- 3: formulario de reclamo con reloj de arena -->
        <g class="s03-ico s03-i3">
          <g class="s03-dib3">
            <rect class="ln s03-d3" x="-56" y="-74" width="112" height="140" rx="10" />
            <path class="ln-4 s03-d3" d="M-34 -40 H34 M-34 -14 H34 M-34 12 H10" />
            <g class="s03-reloj">
              <path class="ln s03-d3" d="M38 30 H82 M38 86 H82 M42 30 Q42 52 60 58 Q78 52 78 30 M42 86 Q42 64 60 58 Q78 64 78 86" />
            </g>
          </g>
          <text class="s03-rotulo s03-r3" x="0" y="150" text-anchor="middle">RECLAMO</text>
        </g>

        <!-- badges de "no" -->
        <g class="s03-badge s03-b1"><circle class="ln-badge" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g>
        <g class="s03-badge s03-b2"><circle class="ln-badge" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g>
        <g class="s03-badge s03-b3"><circle class="ln-badge" cx="0" cy="0" r="18" /><path class="ln-ac" d="M-7 -7 L7 7 M7 -7 L-7 7" /></g>
      </svg>
      <div class="etiqueta"><span class="s03-e1">¿Exagerado?</span><span class="s03-e2">Nada de eso</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-exagerado";
      const DUR = 5.89;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const NO = 1.32;
      const PARANOIA = 1.5;
      const OTROS = 3.3;
      const ARREGLA = 4.1;
      const RECLAMO = 4.9;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const rotulo = (el, t) => tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
      const badge = (el, t) => tl.fromTo(el, { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t);

      const X = [210, 540, 870];
      const Y = 960;
      ["s03-i1", "s03-i2", "s03-i3"].forEach((c, i) => gsap.set(q("." + c), { x: X[i], y: Y }));
      qa(".s03-dib1, .s03-dib2, .s03-dib3").forEach((d) => gsap.set(d, { scale: 1.3, svgOrigin: "0 0" }));
      [[".s03-b1", 116, -72], [".s03-b2", 118, -96], [".s03-b3", 92, -112]].forEach(([c, dx, dy], i) => gsap.set(q(c), { x: X[i] + dx, y: Y + dy }));

      // "¿Exagerado?": el signo entra con golpe y se balancea
      tl.fromTo(q(".s03-q"), { opacity: 0, scale: 0.6, svgOrigin: "540 920" }, { opacity: 1, scale: 1, svgOrigin: "540 920", duration: 0.4, ease: "back.out(2)" }, 0);
      tl.to(q(".s03-q"), { rotation: 8, svgOrigin: "540 1000", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0.4);
      tl.fromTo(q(".s03-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.1);
      // "No": se va
      tl.to(q(".s03-q"), { opacity: 0, scale: 0.4, svgOrigin: "540 920", duration: 0.25, ease: "power2.in" }, NO - 0.2);
      tl.to(q(".s03-e1"), { opacity: 0, duration: 0.2 }, NO);

      // "paranoia"
      dibujar(qa(".s03-d1"), PARANOIA - 0.25, 0.45);
      tl.fromTo(q(".s03-dib1 path:nth-of-type(2)"), { rotation: 0, svgOrigin: "0 0" }, { rotation: 360, svgOrigin: "0 0", duration: 1.6, ease: "none" }, PARANOIA);
      rotulo(q(".s03-r1"), PARANOIA);
      badge(q(".s03-b1"), PARANOIA + 0.45);

      // "le pasa solo a otros"
      dibujar(qa(".s03-d2"), 2.6, 0.4);
      rotulo(q(".s03-r2"), 2.9);
      tl.to(q(".s03-i2"), { y: Y - 12, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, OTROS);
      badge(q(".s03-b2"), OTROS + 0.2);

      // "Ni se arregla con un reclamo": el formulario y el reloj que gira
      dibujar(qa(".s03-d3"), ARREGLA - 0.1, 0.4);
      rotulo(q(".s03-r3"), ARREGLA + 0.2);
      tl.fromTo(q(".s03-reloj"), { rotation: 0, svgOrigin: "60 58" }, { rotation: 180, svgOrigin: "60 58", duration: 0.4, ease: "power2.inOut" }, RECLAMO - 0.2);
      badge(q(".s03-b3"), RECLAMO + 0.15);

      // cierre: los tres juntos
      [".s03-i1", ".s03-i2", ".s03-i3"].forEach((c, i) => tl.to(q(c), { opacity: 0.45, duration: 0.3 }, RECLAMO + 0.4 + i * 0.05));
      tl.fromTo(q(".s03-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, RECLAMO + 0.3);
      qa(".s03-badge").forEach((b, i) => tl.to(b, { scale: 1.25, transformOrigin: "50% 50%", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, RECLAMO + 0.5 + i * 0.08));

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
