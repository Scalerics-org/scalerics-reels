  <script>
    (function () {
      const ID = "s02-desaparece";
      const DUR = 4.56;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const BLOQUEADA = 0.46;
      const HACKEO = 1.36;
      const REGLAS = 2.76;
      const NEGOCIO = 3.46;
      const DESAPARECE = 3.66;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, extra) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, Object.assign({ opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, extra || {}), t);
      };
      const rotulo = (el, t) => tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
      // cada golpe sacude el celular
      const sacudir = (t) => tl.fromTo(q(".s02-cel-in"), { x: 0 }, { x: 8, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, t);

      gsap.set(q(".s02-cel"), { scale: 0.8, svgOrigin: "540 910" });
      gsap.set(q(".s02-i1"), { x: 196, y: 760 });
      gsap.set(q(".s02-i2"), { x: 884, y: 930 });
      gsap.set(q(".s02-i3"), { x: 196, y: 1080 });

      // entra el celular (pop) mientras arranca la frase
      tl.fromTo(q(".s02-cel-in"), { opacity: 0, scale: 0.9, svgOrigin: "540 910" }, { opacity: 1, scale: 1, svgOrigin: "540 910", duration: 0.35, ease: "back.out(1.6)" }, 0);
      gsap.set(q(".s02-vacio"), { opacity: 0 });
      tl.fromTo(q(".s02-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.1);

      // "bloqueada": candado
      dibujar(qa(".s02-d1"), BLOQUEADA - 0.25, 0.4);
      pop(q(".s02-ojo1"), BLOQUEADA + 0.1);
      tl.fromTo(q(".s02-i1 path"), { y: -14 }, { y: 0, duration: 0.14, ease: "power4.in" }, BLOQUEADA + 0.15);
      rotulo(q(".s02-r1"), BLOQUEADA);
      sacudir(BLOQUEADA + 0.3);

      // "hackeo": campo de contraseña y el gancho que baja y se lleva un puntito
      dibujar([q(".s02-d2")], HACKEO - 0.3, 0.4);
      qa(".s02-pt").forEach((p, i) => pop(p, HACKEO - 0.15 + i * 0.05));
      dibujar([q(".s02-gancho")], HACKEO, 0.35);
      rotulo(q(".s02-r2"), HACKEO);
      tl.to(qa(".s02-gancho, .s02-pt:nth-of-type(4)"), { y: -70, duration: 0.3, ease: "power3.in" }, HACKEO + 0.4);
      tl.to(qa(".s02-pt"), { opacity: 0.3, duration: 0.2 }, HACKEO + 0.55);
      sacudir(HACKEO + 0.6);

      // "cambio de reglas": la hoja se tacha
      dibujar(qa(".s02-d3"), 1.95, 0.4);
      dibujar(qa(".s02-renglon"), 2.15, 0.3);
      dibujar(qa(".s02-tacha"), REGLAS - 0.05, 0.2);
      tl.to(qa(".s02-renglon"), { opacity: 0.35, duration: 0.2 }, REGLAS + 0.1);
      rotulo(q(".s02-r3"), 2.2);
      tl.fromTo(q(".s02-i3"), { rotation: 0, svgOrigin: "196 1080" }, { rotation: -6, svgOrigin: "196 1080", duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, REGLAS + 0.2);
      sacudir(REGLAS + 0.25);

      // "tu negocio desaparece": las fotos se van una por una y queda vacío
      tl.to(q(".s02-cel-in"), { scale: 1.05, svgOrigin: "540 910", duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, NEGOCIO);
      qa(".s02-foto").forEach((f, i) => {
        tl.to(f, { opacity: 0, scale: 0.3, transformOrigin: "50% 50%", duration: 0.2, ease: "power2.in" }, DESAPARECE + i * 0.04);
      });
      tl.to(qa(".s02-perfil, .s02-boton"), { opacity: 0.25, duration: 0.3 }, DESAPARECE + 0.1);
      tl.to(qa(".s02-dib-cel"), { opacity: 0.45, duration: 0.3 }, DESAPARECE + 0.1);
      tl.to(qa(".s02-ico"), { opacity: 0.35, duration: 0.3 }, DESAPARECE + 0.1);
      tl.to(q(".s02-vacio"), { opacity: 1, duration: 0.05 }, DESAPARECE + 0.35);
      tl.fromTo(q(".s02-vacio-c"), { scale: 0.5, svgOrigin: "540 914", opacity: 0 }, { scale: 1, svgOrigin: "540 914", opacity: 1, duration: 0.3, ease: "back.out(2)" }, DESAPARECE + 0.38);
      tl.fromTo(q(".s02-vacio-x"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, DESAPARECE + 0.5);
      tl.fromTo(q(".s02-vacio rect"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, DESAPARECE + 0.35);
      tl.to(q(".s02-e1"), { opacity: 0, duration: 0.2 }, DESAPARECE - 0.2);
      tl.fromTo(q(".s02-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, DESAPARECE);

      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
