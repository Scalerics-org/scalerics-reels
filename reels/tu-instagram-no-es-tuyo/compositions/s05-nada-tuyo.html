      const VENTAS = 1.86;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const entra = (el, t) => tl.fromTo(el, { opacity: 0, x: "-=16" }, { opacity: 1, x: "+=16", duration: 0.35, ease: "power3.out" }, t);
      const badge = (el, t) => tl.fromTo(el, { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t);

      const FY = [712, 912, 1112];

      dibujar(qa(".s05-div"), 0, 0.6);

      entra(q(".s05-n1"), SEGUIDORES);
      entra(q(".s05-s1"), INSTAGRAM);
      badge(q(".s05-b1"), INSTAGRAM + 0.2);
      tl.to(q(".s05-ico1"), { x: 10, duration: 0.08, ease: "none", yoyo: true, repeat: 3 }, INSTAGRAM + 0.2);
      tl.to(qa(".s05-d1"), { opacity: 0.4, duration: 0.3 }, INSTAGRAM + 0.45);

      // fila 2: "ventas" → "mensajes" → "no controlás"
      entra(q(".s05-n2"), VENTAS);
      dibujar(qa(".s05-d2"), MENSAJES - 0.35, 0.4);
      tl.to(q(".s05-ico2"), { y: -8, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3 }, MENSAJES + 0.1);
      entra(q(".s05-s2"), CONTROLAS);

      entra(q(".s05-n3"), LISTA);

      // salida
