  <script>
    (function () {
      const ID = "s01-no-es-tuyo";
      const DUR = 4.14;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const INSTAGRAM = 0.2;
      const TUYO = 0.9;
      const META = 1.7;
      const CERRAR = 2.8;
      const MANANA = 2.9;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t + i * 0.04 <= 0 ? 1 : 0 });
          if (t + i * 0.04 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, extra) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, Object.assign({ opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, extra || {}), t);
      };

      // acercamiento lento (nunca queda quieto)
      tl.fromTo(q(".s01-todo"), { scale: 0.97, svgOrigin: "540 910" }, { scale: 1.03, svgOrigin: "540 910", duration: DUR, ease: "sine.inOut" }, 0);

      // el celular arranca medio dibujado (el cuadro 0 no puede ser negro)
      dibujar(qa(".s01-dib-cel"), 0, 0.5, 0.45);
      // "Instagram": aparece el perfil
      pop(q(".s01-cam"), INSTAGRAM - 0.1);
      tl.fromTo(q(".s01-txt-u"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, INSTAGRAM + 0.05);
      dibujar([q(".s01-dib-stats")], INSTAGRAM + 0.1, 0.35);
      qa(".s01-foto").forEach((f, i) => tl.fromTo(f, { opacity: 0.5, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, i * 0.05));
      dibujar(qa(".s01-dib-boton"), 0.5, 0.4);

      // la etiqueta "TUYO" cuelga del celular
      dibujar([q(".s01-hilo")], 0.3, 0.3);
      dibujar(qa(".s01-dib-tag"), 0.4, 0.4);
      gsap.set(q(".s01-cara-b"), { opacity: 0 });
      tl.fromTo(q(".s01-cara-a text"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.62);
      tl.fromTo(q(".s01-tag-in"), { rotation: 8, svgOrigin: "772 696" }, { rotation: 0, svgOrigin: "772 696", duration: 0.9, ease: "elastic.out(1, 0.5)" }, 0.4);
      // "no es tuyo": se tacha
      dibujar([q(".s01-tacha")], TUYO + 0.05, 0.3);
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, TUYO);

      // "Meta": la etiqueta gira y dice DE META
      tl.to(q(".s01-tag-in"), { scaleY: 0, svgOrigin: "872 696", duration: 0.12, ease: "power2.in" }, META - 0.1);
      tl.set(q(".s01-cara-a"), { opacity: 0 }, META + 0.02);
      tl.set(q(".s01-cara-b"), { opacity: 1 }, META + 0.02);
      tl.to(q(".s01-tag-in"), { scaleY: 1, svgOrigin: "872 696", duration: 0.25, ease: "back.out(2)" }, META + 0.02);
      tl.to(q(".s01-tag-in"), { rotation: 6, svgOrigin: "772 696", duration: 0.2, ease: "sine.out", yoyo: true, repeat: 3 }, META + 0.25);

      // "cerrar": el candado se cierra sobre el celular y lo apaga
      gsap.set(q(".s01-candado"), { opacity: 0 });
      tl.to(q(".s01-candado"), { opacity: 1, duration: 0.05 }, CERRAR - 0.45);
      pop(q(".s01-cuerpo"), CERRAR - 0.45);
      dibujar([q(".s01-aro")], CERRAR - 0.4, 0.3);
      gsap.set(q(".s01-aro"), { y: -36 });
      tl.to(q(".s01-aro"), { y: 0, duration: 0.14, ease: "power4.in" }, CERRAR);
      tl.to(q(".s01-candado"), { scale: 1.08, svgOrigin: "540 1000", duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, CERRAR + 0.14);
      tl.to(qa(".s01-cel, .s01-hilo, .s01-tag"), { opacity: 0.35, duration: 0.35 }, CERRAR + 0.14);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.2 }, CERRAR - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, MANANA);
      tl.to(q(".s01-candado"), { rotation: -4, svgOrigin: "540 1070", duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3 }, MANANA + 0.35);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
