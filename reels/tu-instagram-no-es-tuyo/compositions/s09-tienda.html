  <script>
    (function () {
      const ID = "s09-tienda";
      const DUR = 6.06;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SCALERICS = 0.26;
      const HACEMOS = 1.13;
      const TIENDA = 1.56;
      const VENDE = 2.64;
      const SOLA = 2.96;
      const CUALQUIER = 3.54;
      const COBRA = 4.36;
      const MERCADO = 4.96;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, extra) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, Object.assign({ opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, extra || {}), t);
      };
      const etiqueta = (sale, entra, t) => {
        if (sale) tl.to(q(sale), { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(q(entra), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      gsap.set(qa(".s09-ui, .s09-boton, .s09-venta, .s09-pago-card, .s09-r-hora"), { opacity: 0 });

      // "Scalerics": la caja se dibuja y el nombre hace pop
      dibujar([q(".s09-dib-caja")], 0, 0.45);
      pop(q(".s09-nombre"), SCALERICS);
      // "hacemos": golpe de la caja y baja la línea
      tl.to(q(".s09-caja"), { scale: 1.06, svgOrigin: "540 655", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, HACEMOS);
      dibujar([q(".s09-baja")], HACEMOS, 0.2);
      // "tienda online": el celular con la tienda
      dibujar(qa(".s09-dc"), TIENDA - 0.35, 0.4);
      pop(q(".s09-ui"), TIENDA);
      pop(q(".s09-boton"), TIENDA + 0.2);
      etiqueta(null, ".s09-e1", TIENDA);

      // "vende sola": el botón se aprieta solo, dos veces, y sube "+1 venta"
      [[VENDE, ".s09-v1"], [SOLA + 0.15, ".s09-v2"]].forEach(([t, v]) => {
        tl.to(q(".s09-boton"), { scale: 0.9, svgOrigin: "480 1112", duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, t);
        tl.fromTo(q(v), { opacity: 0, y: 0 }, { opacity: 1, y: -40, duration: 0.3, ease: "power3.out" }, t + 0.1);
        tl.to(q(v), { opacity: 0, y: -90, duration: 0.35, ease: "power2.in" }, t + 0.5);
      });
      etiqueta(".s09-e1", ".s09-e2", VENDE);

      // "a cualquier hora": el reloj y las agujas que vuelan
      dibujar(qa(".s09-dr"), CUALQUIER - 0.4, 0.4);
      dibujar([q(".s09-aguja-h"), q(".s09-aguja-m")], CUALQUIER - 0.1, 0.2);
      tl.fromTo(q(".s09-aguja-m"), { rotation: 0, svgOrigin: "840 860" }, { rotation: 1080, svgOrigin: "840 860", duration: 1.6, ease: "power1.inOut" }, CUALQUIER);
      tl.fromTo(q(".s09-aguja-h"), { rotation: 0, svgOrigin: "840 860" }, { rotation: 90, svgOrigin: "840 860", duration: 1.6, ease: "power1.inOut" }, CUALQUIER);
      tl.fromTo(q(".s09-r-hora"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, CUALQUIER + 0.2);

      // "cobra con Mercado Pago": aprieta otra vez y llega el pago aprobado
      tl.to(q(".s09-boton"), { scale: 0.9, svgOrigin: "480 1112", duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, COBRA);
      tl.fromTo(q(".s09-pago-card"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(1.6)" }, MERCADO - 0.2);
      dibujar([q(".s09-tilde")], MERCADO + 0.1, 0.25);
      tl.to(q(".s09-pago-card"), { scale: 1.06, svgOrigin: "840 1115", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, MERCADO + 0.35);
      etiqueta(".s09-e2", ".s09-e3", MERCADO);

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
