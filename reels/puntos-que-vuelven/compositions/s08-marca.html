<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s08-marca"] .s08-capa { position: absolute; inset: 0; }
    [data-composition-id="s08-marca"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s08-marca"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-marca"] .ln-fina { fill: none; stroke: rgba(239, 238, 229, 0.35); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 14; }
    [data-composition-id="s08-marca"] .s08-nombre { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 64px; letter-spacing: -0.01em; }
    [data-composition-id="s08-marca"] .s08-crema { fill: #efeee5; }
    [data-composition-id="s08-marca"] .s08-verde { fill: #5ce611; }
    [data-composition-id="s08-marca"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s08-marca"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s08-marca" data-width="1080" data-height="1920" data-duration="2.25">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="2.25" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- caja de marca: geometría centrada en 0,0; el grupo la ubica (s09 arranca con el mismo transform final) -->
        <g class="s08-caja">
          <g class="s08-caja-in">
           <g transform="translate(540 900)">
            <rect class="ln s08-borde" x="-330" y="-70" width="660" height="140" rx="30" />
            <text class="s08-nombre s08-crema s08-w1" x="22" y="23" text-anchor="end">Scalerics</text>
            <text class="s08-nombre s08-verde s08-w2" x="40" y="23" text-anchor="start">Puntos</text>
           </g>
          </g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s08-e1">Fidelización</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-marca";
      const DUR = 2.25;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SCALERICS = 0.71;
      const PUNTOS = 1.32;
      const SUBE = 1.72; // la caja sube y se encoge; termina justo en DUR

      // posición final = la que usa s09 en su cuadro 0
      const FIN_Y = 680;
      const FIN_S = 0.72;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };

      // la geometría vive centrada en (540, 900); todo escala alrededor de ese punto (svgOrigin, no el bbox)
      const O = "540 900";

      // la caja se dibuja (arranca ya empezada para que el cuadro 0 no quede vacío)
      dibujar([q(".s08-borde")], 0, 0.75, 0.7);
      gsap.set(q(".s08-borde"), { opacity: 1 }); // cuadro 0 con el trazo ya empezado
      // ya dibujada, se le saca el dasharray para que el trazo sea idéntico al de s09 (sin costura)
      tl.set(q(".s08-borde"), { strokeDasharray: "none" }, 0.8);
      tl.fromTo(q(".s08-caja-in"), { scale: 0.92, svgOrigin: O }, { scale: 1, svgOrigin: O, duration: 0.75, ease: "power3.out" }, 0);

      // "Scalerics"
      tl.fromTo(q(".s08-w1"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, SCALERICS);

      // "Puntos": pop + pulso de la caja
      tl.fromTo(q(".s08-w2"), { opacity: 0, scale: 0.85, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, PUNTOS);
      tl.to(q(".s08-caja-in"), { scale: 1.07, svgOrigin: O, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, PUNTOS + 0.04);
      tl.fromTo(q(".s08-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, PUNTOS + 0.1);

      // sube a y 680 (y: -220) y se encoge: queda quieta en el último cuadro, sin salida
      tl.to(q(".s08-caja"), { y: FIN_Y - 900, scale: FIN_S, svgOrigin: O, duration: DUR - SUBE, ease: "power3.inOut" }, SUBE);
      tl.to(q(".s08-e1"), { opacity: 0, y: -8, duration: 0.3, ease: "power2.in" }, SUBE + 0.05);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
