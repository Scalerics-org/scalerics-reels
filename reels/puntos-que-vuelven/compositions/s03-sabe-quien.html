  <div id="root" data-composition-id="s03-sabe-quien" data-width="1080" data-height="1920" data-duration="5.36">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="5.36" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s03-cel">
          <!-- carcasa -->
          <path class="ln s03-marco" d="M402 600 H678 A52 52 0 0 1 730 652 V1180 A52 52 0 0 1 678 1232 H402 A52 52 0 0 1 350 1180 V652 A52 52 0 0 1 402 600 Z" />
          <line class="ln s03-marco" x1="506" y1="630" x2="574" y2="630" />

            <text data-layout-ignore class="s03-rotulo" x="378" y="1036">ÚLTIMA VISITA</text>

  </div>
  <script>
    (function () {
      const ID = "s03-sabe-quien";
      const DUR = 5.36;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SABE = 0.81; // "sabe"
      const QUIEN = 1.04; // "quién sos"
      const PEDISTE = 2.13; // "pediste"
      const ULTIMA = 2.66; // "la última vez"
      const CUANTO = 3.6; // "cuánto hace"
      const HACE = 4.03;
      const NOVAS = 4.36; // "no vas"

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };
      // fila que entra como en la referencia: sube un poco y se enfoca
      const fila = (el, t) => {
        tl.fromTo(el, { opacity: 0, y: 16, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, t);
      };

      // celular: arranca ya medio dibujado y se acerca despacio
      dibujar(qa(".s03-marco"), 0, 0.7, 0.45);
      tl.fromTo(q(".s03-cel"), { scale: 0.94, svgOrigin: "540 916" }, { scale: 1, duration: 1.2, ease: "power3.out" }, 0);
      fila(q(".s03-head"), 0.4);
      dibujar([q(".s03-div")], 0.5, 0.45);
      tl.fromTo(q(".s03-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, SABE);

      // "quién sos": Lucía
      fila(q(".s03-f1"), QUIEN);
      tl.fromTo(q(".s03-f1"), { scale: 1 }, { scale: 1.06, svgOrigin: "400 790", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, QUIEN + 0.4);

      // "pediste": el pedido; "la última vez": se subraya
      fila(q(".s03-f2"), PEDISTE);
      dibujar([q(".s03-subraya")], ULTIMA, 0.5);
      tl.to(q(".s03-subraya"), { opacity: 0, duration: 0.3 }, CUANTO - 0.1);

      // "cuánto hace": la última visita, en verde
      fila(q(".s03-f3"), CUANTO);
      // los 12 días se van sumando en "hace que no"
      const dias = qa(".s03-dia");
      dias.forEach((d, i) => {
        tl.fromTo(d, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(1.6)" }, HACE - 0.1 + i * 0.04);
      });
      // la última visita (verde) queda en el día 1 y las demás se apagan un poco
      tl.fromTo(q(".s03-hoy"), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)" }, HACE - 0.1);
      // "no vas": punch al dato
      tl.fromTo(q(".s03-hace"), { scale: 1 }, { scale: 1.12, svgOrigin: "378 1076", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, NOVAS + 0.05);
      tl.to(dias, { opacity: 0.55, duration: 0.3 }, NOVAS + 0.2);
      tl.to(q(".s03-cel"), { y: -10, duration: 0.6, ease: "sine.inOut" }, NOVAS + 0.2);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
