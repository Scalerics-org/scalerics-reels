          <g class="s09-ticket">

  <script>
    (function () {
      const ID = "s09-como-anda";
      const DUR = 8.67;
      const NS = "http://www.w3.org/2000/svg";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const SUMA = 0.47;
      const CADA = 0.95;
      const COMPRA = 1.19;
      const TARJETA = 2.28;
      const CELULAR = 2.8;
      const Y = 3.51;
      const PASAN = 3.89;
      const SEMANAS = 4.41;
      const LLEGA = 5.64;
      const AVISO = 6.07;
      const TENES = 6.78;
      const PUNTOS = 7.06;
      const ESPERANDOTE = 7.49;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };
      const pop = (el, t, extra) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, Object.assign({ opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, extra || {}), t);
      };
      const rotulo = (el, t) => tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);

      // caja: arranca exactamente donde la dejó s08 (geometría en 540,900; escala 0.72 alrededor de ese punto y sube 220 → centro en y 680)
      gsap.set(q(".s09-caja"), { y: -220, scale: 0.72, svgOrigin: "540 900" });

      // tronco y rama de SUMA arrancan ya
      dibujar([q(".s09-tronco")], 0, 0.3);
      dibujar([q(".s09-rama-1")], 0.12, 0.4);

      // SUMA: ticket + contador +40 / +80 / +120
      gsap.set(q(".s09-ticket"), { x: 300, y: 942 });
      dibujar([q(".s09-dib-ticket")], SUMA - 0.05, 0.55);
      tl.fromTo(q(".s09-perfo"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, SUMA + 0.3);
      gsap.set(qa(".s09-num"), { opacity: 0 });
      pop(q(".s09-n1"), SUMA + 0.08);
      tl.to(q(".s09-n1"), { opacity: 0, y: -14, duration: 0.1 }, CADA - 0.04);
      tl.fromTo(q(".s09-n2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, CADA + 0.06);
      tl.to(q(".s09-n2"), { opacity: 0, y: -14, duration: 0.1 }, COMPRA - 0.04);
      tl.fromTo(q(".s09-n3"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, COMPRA + 0.06);
      tl.to(q(".s09-ticket-in"), { scale: 1.12, svgOrigin: "0 0", duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, COMPRA + 0.04);
      rotulo(q(".s09-r1"), SUMA + 0.25);

      // TARJETA: rama del centro, tarjeta de sellos; en "celular" la envuelve un teléfono
      dibujar([q(".s09-rama-2")], TARJETA - 0.45, 0.4);
      gsap.set(q(".s09-tarjeta"), { x: 540, y: 970 });
      dibujar(qa(".s09-dib-card"), TARJETA - 0.05, 0.5);
      gsap.set(qa(".s09-sello, .s09-sello-3b"), { opacity: 0 });
      qa(".s09-sello").forEach((s, i) => pop(s, TARJETA + 0.3 + i * 0.07));
      rotulo(q(".s09-r2"), TARJETA + 0.2);
      tl.to(q(".s09-card"), { scale: 0.56, y: 6, svgOrigin: "0 0", duration: 0.5, ease: "power3.inOut" }, CELULAR - 0.05);
      dibujar(qa(".s09-dib-cel"), CELULAR + 0.05, 0.55);
      // el tercer sello se llena: una compra más
      pop(q(".s09-sello-3b"), CELULAR + 0.75);
      tl.to(q(".s09-tarjeta"), { y: 960, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, CELULAR + 0.75);

      // AVISOS: rama derecha; primero calendario con días tachados
      dibujar([q(".s09-rama-3")], Y + 0.05, 0.4);
      gsap.set(q(".s09-avisos"), { x: 780, y: 962 });
      dibujar(qa(".s09-dib-cal"), PASAN - 0.05, 0.5);
      const celdas = q(".s09-celdas");
      const cruces = q(".s09-cruces");
      const xs = [-58, -26, 6, 38];
      const ys = [-18, 8, 34];
      const lineasX = [];
      ys.forEach((cy) =>
        xs.forEach((cx) => {
          const r = document.createElementNS(NS, "rect");
          r.setAttribute("class", "ln-celda");
          r.setAttribute("x", cx);
          r.setAttribute("y", cy);
          r.setAttribute("width", 20);
          r.setAttribute("height", 18);
          r.setAttribute("rx", 4);
          celdas.appendChild(r);
          const p = document.createElementNS(NS, "path");
          p.setAttribute("class", "ln-x");
          p.setAttribute("d", `M${cx - 2} ${cy - 2} L${cx + 22} ${cy + 20} M${cx + 22} ${cy - 2} L${cx - 2} ${cy + 20}`);
          cruces.appendChild(p);
          lineasX.push(p);
        }),
      );
      tl.fromTo(celdas, { opacity: 0 }, { opacity: 1, duration: 0.3 }, PASAN + 0.25);
      rotulo(q(".s09-r3a"), PASAN + 0.3);
      // tacha 10 de 12 días, de "semanas" a "verlo"
      lineasX.slice(0, 10).forEach((p, i) => dibujar([p], SEMANAS + i * 0.11, 0.16));
      gsap.set(lineasX.slice(10), { opacity: 0 });

      // "llega un aviso": el calendario se va, cae la campana
      tl.to(q(".s09-cal"), { opacity: 0, scale: 0.8, svgOrigin: "0 0", duration: 0.3, ease: "power2.in" }, LLEGA + 0.1);
      tl.to(q(".s09-r3a"), { opacity: 0, y: -8, duration: 0.2 }, AVISO - 0.12);
      dibujar(qa(".s09-dib-camp"), AVISO - 0.08, 0.4);
      tl.fromTo(q(".s09-campana"), { y: -30 }, { y: 0, duration: 0.4, ease: "back.out(1.6)" }, AVISO - 0.08);
      gsap.set(q(".s09-badge"), { opacity: 0 });
      pop(q(".s09-badge"), AVISO + 0.2);
      tl.fromTo(q(".s09-campana-in"), { rotation: 0, transformOrigin: "50% 0%" }, { rotation: 14, duration: 0.07, ease: "sine.inOut", yoyo: true, repeat: 5 }, AVISO + 0.25);
      rotulo(q(".s09-r3b"), AVISO + 0.05);

      // "tenés": todo se va, queda el celular bloqueado
      tl.to(q(".s09-arbol"), { opacity: 0, scale: 0.92, svgOrigin: "540 900", filter: "blur(4px)", duration: 0.28, ease: "power2.in" }, TENES - 0.22);
      dibujar(qa(".s09-dib-tel"), TENES - 0.08, 0.5, 0.6);
      gsap.set(qa(".s09-reloj, .s09-dia"), { opacity: 0 });
      pop(q(".s09-reloj"), TENES + 0.05);
      tl.fromTo(q(".s09-dia"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, TENES + 0.15);
      // la notificación cae en "puntos"
      tl.fromTo(q(".s09-noti"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, PUNTOS);
      // "esperándote": punch de la notificación y etiqueta
      tl.to(q(".s09-noti"), { scale: 1.05, svgOrigin: "540 937", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, ESPERANDOTE);
      tl.fromTo(q(".s09-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, ESPERANDOTE);
      // que nunca quede quieto: acercamiento lento del celular y pulso del punto verde
      tl.fromTo(q(".s09-tel"), { scale: 1 }, { scale: 1.04, svgOrigin: "540 920", duration: DUR - 0.3 - PUNTOS, ease: "sine.inOut" }, PUNTOS);
      tl.to(q(".s09-noti-dot"), { scale: 1.45, transformOrigin: "50% 50%", duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 7.95);

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
