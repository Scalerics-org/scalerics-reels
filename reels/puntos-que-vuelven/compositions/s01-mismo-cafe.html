  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-mismo-cafe"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-mismo-cafe"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

    [data-composition-id="s01-mismo-cafe"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

    [data-composition-id="s01-mismo-cafe"] .cartel { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.18em; fill: #efeee5; }
    [data-composition-id="s01-mismo-cafe"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s01-mismo-cafe"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }

  </style>
  <div id="root" data-composition-id="s01-mismo-cafe" data-width="1080" data-height="1920" data-duration="6.16">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="6.16" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- suelo -->
        <line class="ln s01-suelo" x1="40" y1="1060" x2="1040" y2="1060" />
        <!-- café del que vuelven (A) -->
        <g class="s01-cafe-a">
          <g class="s01-cafe-a-in">
            <path class="ln s01-dib-a" d="M-170 0 V-190 H170 V0" />
            <path class="ln s01-dib-a" d="M-200 -190 H200 L180 -250 H-180 Z" />
            <path class="ln s01-dib-a" d="M-200 -190 q25 34 50 0 q25 34 50 0 q25 34 50 0 q25 34 50 0 q25 34 50 0 q25 34 50 0 q25 34 50 0 q25 34 50 0" />
            <rect class="ln s01-dib-a" x="-90" y="-310" width="180" height="56" rx="10" />
            <text class="cartel s01-txt-a" x="0" y="-274" text-anchor="middle">CAFÉ</text>
            <rect class="ln s01-dib-a" x="-140" y="-130" width="100" height="72" rx="6" />
            <rect class="ln s01-dib-a" x="40" y="-130" width="100" height="72" rx="6" />
            <rect class="vidrio s01-luz-a" x="-130" y="-120" width="80" height="52" rx="3" />
            <rect class="vidrio s01-luz-a" x="50" y="-120" width="80" height="52" rx="3" />
            <path class="ln s01-dib-a" d="M-28 0 V-112 H28 V0" />
          </g>
        </g>
        <!-- café de enfrente (B), igual pero vacío -->
        <g class="s01-cafe-b">
          <path class="ln s01-dib-b" d="M-170 0 V-190 H170 V0" />
          <path class="ln s01-dib-b" d="M-200 -190 H200 L180 -250 H-180 Z" />
          <path class="ln s01-dib-b" d="M-200 -190 q25 34 50 0 q25 34 50 0 q25 34 50 0 q25 34 50 0 q25 34 50 0 q25 34 50 0 q25 34 50 0 q25 34 50 0" />
          <rect class="ln s01-dib-b" x="-90" y="-310" width="180" height="56" rx="10" />
          <text class="cartel s01-txt-b" x="0" y="-274" text-anchor="middle">CAFÉ</text>
          <rect class="ln s01-dib-b" x="-140" y="-130" width="100" height="72" rx="6" />
          <rect class="ln s01-dib-b" x="40" y="-130" width="100" height="72" rx="6" />
          <path class="ln s01-dib-b" d="M-28 0 V-112 H28 V0" />
        </g>
        <!-- distancia entre los dos -->
        <g class="s01-dist">
          <line class="ln-fina" x1="430" y1="1110" x2="650" y2="1110" />
          <text class="cuadras" x="540" y="1156" text-anchor="middle">2 CUADRAS</text>
        </g>
        <!-- gente que entra al café A -->
        <g class="s01-p s01-p1"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
        <g class="s01-p s01-p2"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
        <g class="s01-p s01-p3"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
        <g class="s01-p s01-p4"><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
        <!-- flecha de vuelta sobre el café A -->
        <g class="s01-vuelta">
          <path class="ln-ac s01-vuelta-arco" d="M-46 -400 A46 46 0 1 1 -10 -354" />
          <path class="ln-ac s01-vuelta-punta" d="M-30 -370 L-10 -354 L-32 -338" />
        </g>
      </svg>
      <div class="etiqueta"><span class="s01-e1">Siempre el mismo</span><span class="s01-e2">Otro igual, vacío</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-mismo-cafe";
      const DUR = 6.16;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const GENTE = 1.8; // "gente vuelve siempre"
      const MISMO = 2.89; // "mismo café"
      const AUNQUE = 3.7; // "aunque a dos cuadras"
      const OTRO = 4.98; // "otro igual"

      const SUELO = 1060;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.05);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.05);
        });
      };

      // café A: arranca ya medio dibujado (el cuadro 0 no puede ser negro)
      gsap.set(q(".s01-cafe-a"), { x: 540, y: SUELO });
      gsap.set(q(".s01-cafe-a-in"), { scale: 1.12, transformOrigin: "0px -150px" });
      dibujar(qa(".s01-dib-a"), 0, 0.7, 0.45);
      tl.fromTo(q(".s01-txt-a"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.35);
      gsap.set(qa(".s01-luz-a"), { opacity: 0 });
      tl.fromTo(q(".s01-suelo"), { scaleX: 0.5, transformOrigin: "540px 1060px" }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0);

      // gente entrando, uno atrás del otro; al entrar se prende la luz
      const gente = qa(".s01-p").slice(0, 3);
      gente.forEach((p, i) => {
        const t0 = GENTE + i * 0.62;
        tl.fromTo(p, { x: 60, y: SUELO, opacity: 0 }, { x: 140, opacity: 1, duration: 0.25, ease: "none" }, t0);
        tl.to(p, { x: 520, duration: 0.95, ease: "none" }, t0 + 0.25);
        tl.to(p, { opacity: 0, duration: 0.12 }, t0 + 1.08);
      });
      // vaivén al caminar
      gente.forEach((p, i) => {
        const t0 = GENTE + i * 0.62;
        tl.fromTo(p.querySelector("path"), { rotation: -4, transformOrigin: "0px -40px" }, { rotation: 4, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 5 }, t0);
      });
      tl.to(qa(".s01-luz-a"), { opacity: 0.85, duration: 0.25, ease: "power2.out" }, GENTE + 1.1);
      tl.to(q(".s01-cafe-a-in"), { scale: 1.16, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, GENTE + 1.1);

      // flecha de "vuelve"
      const arco = q(".s01-vuelta-arco");
      const La = arco.getTotalLength();
      gsap.set(arco, { strokeDasharray: La, strokeDashoffset: La, opacity: 0 });
      tl.to(arco, { opacity: 1, duration: 0.04 }, 2.09);
      gsap.set(q(".s01-vuelta"), { x: 540, y: SUELO });
      tl.to(arco, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 2.09);
      tl.fromTo(q(".s01-vuelta-punta"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, 2.5);
      tl.to(q(".s01-vuelta"), { rotation: 360, svgOrigin: "540 " + (SUELO - 400), duration: 0.9, ease: "power2.inOut" }, MISMO);

      // etiqueta 1
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, MISMO);

      // "aunque a dos cuadras": la cámara se abre, A va a la izquierda, aparece B
      tl.to(q(".s01-cafe-a"), { x: 300, duration: 0.8, ease: "power3.inOut" }, AUNQUE);
      tl.to(q(".s01-cafe-a-in"), { scale: 0.78, duration: 0.8, ease: "power3.inOut" }, AUNQUE);
      tl.to(q(".s01-vuelta"), { opacity: 0, duration: 0.25 }, AUNQUE);
      gsap.set(q(".s01-cafe-b"), { x: 790, y: SUELO, scale: 0.78, transformOrigin: "0px 0px" });
      dibujar(qa(".s01-dib-b"), AUNQUE + 0.35, 0.7);
      tl.fromTo(q(".s01-txt-b"), { opacity: 0 }, { opacity: 0.55, duration: 0.3 }, AUNQUE + 0.8);
      tl.fromTo(q(".s01-dist"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, AUNQUE + 0.6);

      // "otro igual": B queda apagado, la etiqueta cambia; sigue entrando gente a A
      tl.to(qa(".s01-dib-b"), { opacity: 0.4, duration: 0.4 }, OTRO);
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.2 }, OTRO - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, OTRO + 0.05);
      const p4 = q(".s01-p4");
      tl.fromTo(p4, { x: 40, opacity: 0 }, { x: 120, opacity: 1, duration: 0.2, ease: "none", immediateRender: false }, OTRO);
      tl.to(p4, { x: 290, duration: 0.7, ease: "none" }, OTRO + 0.2);
      tl.to(p4, { opacity: 0, duration: 0.1 }, OTRO + 0.85);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
