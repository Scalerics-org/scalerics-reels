    (function () {
      const ID = "s06-cuesta";
      const DUR = 5.82;

      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const PORQUE = 1.74;
      const CLIENTE = 2.17;

      const TE = 3.12;

      const MENOS = 4.4;
      const UNO = 4.87;
      const NUEVO = 5.06;

      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const ti = t + i * (paso ?? 0.05);
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });
          if (ti > 0) tl.to(el, { opacity: 1, duration: 0.04 }, ti);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, dur) => tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: dur ?? 0.35, ease: "back.out(1.6)" }, t);

      // ---------- 1) balanza ----------
      // arranca medio dibujada: el cuadro 0 no puede estar vacío

      qa(".s06-cosa-bal").forEach((c, i) => pop(c, 0.25 + i * 0.12, 0.35));
      // un vaivén chiquito mientras se dibuja, y en "pesa" se va para la derecha
      const ANG = 13;
      const BAJA = 240 * Math.sin((ANG * Math.PI) / 180);
      tl.fromTo(q(".s06-brazo"), { rotation: -3, svgOrigin: "540 800" }, { rotation: 2, duration: PESA - 0.1, ease: "sine.inOut" }, 0.1);

      tl.fromTo(q(".s06-plato-der"), { y: 240 * Math.sin((-3 * Math.PI) / 180) }, { y: 240 * Math.sin((2 * Math.PI) / 180), duration: PESA - 0.1, ease: "sine.inOut" }, 0.1);
      tl.to(q(".s06-brazo"), { rotation: ANG, svgOrigin: "540 800", duration: 0.85, ease: "elastic.out(1, 0.45)" }, PESA);
      tl.to(q(".s06-plato-izq"), { y: -BAJA, duration: 0.85, ease: "elastic.out(1, 0.45)" }, PESA);
      tl.to(q(".s06-plato-der"), { y: BAJA, duration: 0.85, ease: "elastic.out(1, 0.45)" }, PESA);
      tl.fromTo(q(".s06-e0"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, PESA);

      // ---------- 2) pantalla partida ----------

      // flecha de vuelta

      const La = arco.getTotalLength();
      gsap.set(arco, { strokeDasharray: La, strokeDashoffset: La, opacity: 0 });
      tl.to(arco, { opacity: 1, duration: 0.04 }, VUELVE);
      tl.to(arco, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, VUELVE);
      tl.fromTo(q(".s06-vuelta-punta"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, VUELVE + 0.38);
      tl.to(q(".s06-vuelta"), { rotation: 360, svgOrigin: "250 880", duration: 1.0, ease: "power2.inOut" }, VUELVE + 0.6);
      // una sola moneda
      gsap.set(q(".s06-moneda-luz"), { opacity: 0 });
      pop(q(".s06-moneda"), TE);
      // "mucho menos": la moneda pulsa verde
      tl.to(q(".s06-moneda-luz"), { opacity: 0.22, duration: 0.2, ease: "power2.out" }, MUCHO);
      tl.to(q(".s06-moneda-borde"), { stroke: "#5ce611", duration: 0.2 }, MUCHO);
      tl.to(q(".s06-moneda-txt"), { fill: "#5ce611", duration: 0.2 }, MUCHO);
      tl.to(q(".s06-moneda"), { scale: 1.25, svgOrigin: "400 1094", duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, MUCHO);
      tl.to(q(".s06-moneda"), { scale: 1.2, svgOrigin: "400 1094", duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, MENOS);
