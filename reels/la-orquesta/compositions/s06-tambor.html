<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/orquesta.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "Cinzel"; font-weight: 400 900; font-display: block; src: url("assets/fonts/Cinzel-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-tambor"] .s06-capa, [data-composition-id="s06-tambor"] .s06-escenario { position: absolute; inset: 0; }
    [data-composition-id="s06-tambor"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-tambor"] .s06-tag { left: 600px; top: 700px; font-size: 34px; }
  </style>
  <div id="root" data-composition-id="s06-tambor" data-width="1080" data-height="1920" data-duration="3.03">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="3.03" data-track-index="0">
      <div class="s06-escenario">
        <svg class="s06-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="or-tag s06-tag">PERCUSIÓN</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-tambor";
      const DUR = 3.03;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      root.querySelector(".s06-svg").innerHTML =
        OR.cuaderno(500, 1540, 1.12, { num: '' }) + `<g class="s06-golpes" stroke="${OR.BRON2}" stroke-width="8" stroke-linecap="round"><path d="M250 1300 l-60 -30"/><path d="M250 1340 l-70 0"/><path d="M750 1300 l60 -30"/><path d="M750 1340 l70 0"/></g>`;
      const tl = gsap.timeline({ paused: true });
      const K = OR.kit(tl, root);
      const { q, qa } = K;

      const PERC = 0.16, CUADERNO = 1.2, CAJA = 2.24;
      // cuadro 0: el cuaderno sube al escenario con su tambor
      tl.fromTo(q(".or-c"), { y: 80, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 0);
      K.pop(q(".s06-tag"), PERC);
      K.vaiven(q(".or-c-baq1"), "-130 -330", PERC, -20, 5, 0.07);
      K.vaiven(q(".or-c-baq2"), "130 -330", PERC + 0.07, 20, 5, 0.07);
      qa(".s06-golpes path").forEach((p, i) => K.dibujar(p, PERC + 0.1 + i * 0.05, 0.15));
      tl.fromTo(q(".or-c-tambor"), { y: 0 }, { y: 6, duration: 0.07, yoyo: true, repeat: 9, immediateRender: false }, PERC);
      // "cuaderno": se le abren los ojos, salta
      tl.fromTo(q(".or-c-cuerpo"), { y: 0 }, { y: -40, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, CUADERNO);
      tl.fromTo(qa(".or-c .or-pupila"), { scale: 1 }, { scale: 1.5, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 1, immediateRender: false }, CUADERNO);
      // "caja": un golpe seco
      K.vaiven(q(".or-c-baq2"), "130 -330", CAJA, 26, 1, 0.08);
      K.sacudon(q(".or-c"), CAJA + 0.1, 0.6);

      K.salida(q("#s06-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
