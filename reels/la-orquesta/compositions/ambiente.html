      const tl = gsap.timeline({ paused: true });

      const SCALERICS = 59.15;

      tl.fromTo(q(".am-bug"), { y: -30, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0);
