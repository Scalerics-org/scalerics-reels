      <svg viewBox="0 0 1080 1920" aria-hidden="true">

          <path class="hilo s11-hilo1" d="M267 594 Q570 520 833 669" />

          <!-- 1. BOT -->

              <circle class="oro s11-ojo" cx="24" cy="-90" r="9" />
              <path class="ln-oro" d="M-18 -66 Q0 -56 18 -66" />
              <path class="ln-oro" d="M0 -128 V-140" />
              <circle class="oro s11-antena" cx="0" cy="-146" r="7" />
            </g>
            <!-- escribiendo... -->
            <g class="s11-tipeo">
              <rect class="crema" x="-50" y="-30" width="100" height="46" rx="23" opacity="0.25" />
              <circle class="crema s11-pt" cx="-22" cy="-7" r="7" />
              <circle class="crema s11-pt" cx="0" cy="-7" r="7" />
              <circle class="crema s11-pt" cx="22" cy="-7" r="7" />
            </g>
            <!-- la respuesta, al toque -->
            <g class="s11-burbuja">
              <rect class="oro" x="-118" y="-34" width="236" height="56" rx="24" />
              <text class="burbuja-txt" x="0" y="2" text-anchor="middle">¡Sí, lo tenemos!</text>
            </g>
            <text class="mono-oro s11-inst" x="0" y="72" text-anchor="middle">AL INSTANTE</text>
            <text class="pie" x="0" y="158" text-anchor="middle">BOT</text>
            <path class="corazon s11-c1" d="M118 -170 C110 -181 94 -178 94 -164 C94 -150 110 -142 118 -134 C126 -142 142 -150 142 -164 C142 -178 126 -181 118 -170 Z" />
          </g></g>

          <!-- 2. PUNTOS -->
          <g class="s11-p2"><g class="s11-p2-in sombra">
            <rect class="papel" x="-150" y="-180" width="300" height="360" rx="5" />
            <rect class="foto" x="-130" y="-160" width="260" height="260" />
            <rect class="ln-oro" x="-105" y="-140" width="210" height="122" rx="16" />
            <g class="brillo-oro">
              <text class="puntos-txt s11-n1" x="0" y="-54" text-anchor="middle">+10</text>

            <path class="corazon s11-c2" d="M118 -170 C110 -181 94 -178 94 -164 C94 -150 110 -142 118 -134 C126 -142 142 -150 142 -164 C142 -178 126 -181 118 -170 Z" />

          <!-- 3. TIENDA -->
          <g class="s11-p3"><g class="s11-p3-in sombra">
            <rect class="papel" x="-150" y="-180" width="300" height="360" rx="5" />

            <g class="s11-letrero brillo-oro">
              <rect class="oro" x="-104" y="-136" width="208" height="44" rx="8" />
              <text class="mono-osc" x="0" y="-106" text-anchor="middle">ABIERTO 24 H</text>
            </g>
            <rect class="oro s11-vent" x="-66" y="-12" width="38" height="34" rx="3" opacity="0.85" />
            <rect class="oro s11-vent" x="28" y="-12" width="38" height="34" rx="3" opacity="0.85" />
            <path class="oro" d="M-18 80 V28 H18 V80 Z" opacity="0.4" />
            <path class="ln-oro s11-puerta" d="M-18 80 V28 H18 V80" />
            <!-- tu cliente, que te busca y te encuentra -->
            <g class="s11-cliente">
              <circle class="ln" cx="0" cy="-58" r="9" stroke-width="4" />
              <path class="ln" d="M0 -49 V-22 M0 -42 L-11 -31 M0 -42 L11 -31 M0 -22 L-9 0 M0 -22 L9 0" stroke-width="4" />
              <path class="corazon s11-cc" d="M0 -78 C-4 -84 -12 -82 -12 -76 C-12 -70 -4 -66 0 -62 C4 -66 12 -70 12 -76 C12 -82 4 -84 0 -78 Z" />
            </g>
            <text class="pie" x="0" y="158" text-anchor="middle">TIENDA</text>
            <path class="corazon s11-c3" d="M118 -170 C110 -181 94 -178 94 -164 C94 -150 110 -142 118 -134 C126 -142 142 -150 142 -164 C142 -178 126 -181 118 -170 Z" />
          </g></g>

          <!-- chinches encima -->
          <circle class="corazon s11-chinche brillo-rosa" cx="267" cy="594" r="12" />
          <circle class="corazon s11-chinche brillo-rosa" cx="833" cy="669" r="12" />

      </svg>

  <script>
    (function () {
      const ID = "s11-tres";
      const DUR = 7.17;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const BOT = 0.1, CONTESTA = 0.6, INSTANTE = 1.2;
      const PUNTOS = 2.27, RECUERDAN = 2.9, VOLVER = 3.5;
      const TIENDA = 4.6, ABIERTA = 4.9, BUSCA = 6.0;

      const dibujar = (els, t, dur) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.03 }, t + i * 0.04);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const late = (el, t, n) => tl.to(el, { scale: 1.3, transformOrigin: "50% 50%", duration: 0.14, yoyo: true, repeat: n * 2 - 1, ease: "sine.inOut" }, t);

      // posiciones del tablero
      const S = 1.12;
      const SLOTS = [[".s11-p1", 285, 795, -5], [".s11-p2", 815, 870, 5], [".s11-p3", 520, 1118, -3]];
      SLOTS.forEach(([s, x, y]) => gsap.set(q(s), { x, y }));
      const chinches = qa(".s11-chinche");
      gsap.set(chinches, { opacity: 0 });
      gsap.set([q(".s11-p2-in"), q(".s11-p3-in")], { opacity: 0 });

      // una polaroid cae girando y golpea el tablero
      const caer = (sel, rot, t, desde) => {
        tl.fromTo(q(sel), { opacity: 1, y: desde, rotation: rot * -5, scale: S * 1.35, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, rotation: rot, scale: S, transformOrigin: "50% 50%", duration: 0.32, ease: "power3.in", immediateRender: false }, t);
        tl.to(q(sel), { scale: S * 1.04, transformOrigin: "50% 50%", duration: 0.07, yoyo: true, repeat: 1, ease: "power1.out" }, t + 0.32);
      };
      // la cámara viaja por el tablero: acerca y lleva cada prueba hacia el centro (k = cuánto la centra)
      const tab = q(".s11-tablero");
      gsap.set(tab, { svgOrigin: "540 960" });
      const empujar = (px, py, s, t, d, k = 0.8) => tl.to(tab, { scale: s, x: -k * s * (px - 540), y: -k * s * (py - 960), duration: d, ease: "power3.inOut" }, t);
      // el tablero tiembla cuando cae algo
      const temblar = (t) => [[-10, 6], [9, -5], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q("#s11-escena"), { x, y, duration: 0.035, ease: "none" }, t + i * 0.035));

      // ---- 1. BOT (ya cayendo en el cuadro 0)
      gsap.set(tab, { scale: 1.15, x: -0.8 * 1.15 * (285 - 540), y: -0.8 * 1.15 * (795 - 960) });
      caer(".s11-p1-in", -5, 0, -150);
      temblar(0.32);
      tl.fromTo(chinches[0], { opacity: 0, scale: 2.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.2, ease: "back.out(3)", immediateRender: false }, 0.36);
      empujar(285, 795, 1.22, 0.34, 0.6);
      tl.fromTo(q(".s11-antena"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.6, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.3);
      // escribiendo... y responde al instante
      gsap.set(q(".s11-burbuja"), { opacity: 0 });
      gsap.set(q(".s11-inst"), { opacity: 0 });
      gsap.set(q(".s11-tipeo"), { opacity: 0 });
      tl.to(q(".s11-tipeo"), { opacity: 1, duration: 0.05 }, 0.3);
      qa(".s11-pt").forEach((p, i) => tl.fromTo(p, { y: 0 }, { y: -8, duration: 0.1, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.32 + i * 0.07));
      tl.to(q(".s11-tipeo"), { opacity: 0, duration: 0.05 }, CONTESTA - 0.02);
      tl.fromTo(q(".s11-burbuja"), { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, CONTESTA);
      tl.fromTo(q(".s11-inst"), { opacity: 0, scale: 1.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.2, ease: "power4.in", immediateRender: false }, INSTANTE - 0.1);
      qa(".s11-ojo").forEach((o) => tl.to(o, { scaleY: 0.15, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1 }, 1.6));
      late(q(".s11-c1"), 0.5, 5);

      // ---- 2. PUNTOS
      empujar(815, 870, 1.15, PUNTOS - 0.35, 0.4);
      caer(".s11-p2-in", 5, PUNTOS - 0.2, -700);
      temblar(PUNTOS + 0.12);
      tl.fromTo(chinches[1], { opacity: 0, scale: 2.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.2, ease: "back.out(3)", immediateRender: false }, PUNTOS + 0.15);
      dibujar([q(".s11-hilo1")], PUNTOS + 0.15, 0.45);
      empujar(815, 870, 1.22, PUNTOS + 0.14, 0.6);
      const ns = [q(".s11-n1"), q(".s11-n2"), q(".s11-n3")];
      gsap.set(ns, { opacity: 0 });
      [PUNTOS + 0.3, RECUERDAN, RECUERDAN + 0.35].forEach((t, i) => {
        if (i > 0) tl.set(ns[i - 1], { opacity: 0 }, t);
        tl.fromTo(ns[i], { opacity: 0, scale: 1.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.2, ease: "back.out(2.5)", immediateRender: false }, t);
      });
      dibujar([q(".s11-flecha")], VOLVER - 0.3, 0.35);
      tl.fromTo(q(".s11-vuelta"), { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 360, transformOrigin: "50% 50%", duration: 0.7, ease: "power2.inOut" }, VOLVER);
      late(q(".s11-c2"), PUNTOS + 0.4, 5);

      // ---- 3. TIENDA
      empujar(520, 1118, 1.15, TIENDA - 0.35, 0.4);
      caer(".s11-p3-in", -3, TIENDA - 0.2, -900);
      temblar(TIENDA + 0.12);
      tl.fromTo(chinches[2], { opacity: 0, scale: 2.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.2, ease: "back.out(3)", immediateRender: false }, TIENDA + 0.15);
      dibujar([q(".s11-hilo2")], TIENDA + 0.15, 0.45);
      empujar(520, 1118, 1.22, TIENDA + 0.14, 0.6);
      // "abierta": el letrero se prende como neón que arranca
      gsap.set(q(".s11-letrero"), { opacity: 0.2 });
      [[1, 0], [0.3, 0.07], [1, 0.12], [0.4, 0.18], [1, 0.24]].forEach(([o, d]) => tl.to(q(".s11-letrero"), { opacity: o, duration: 0.03 }, ABIERTA + d));
      tl.fromTo(q(".s11-letrero"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.08, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 1, ease: "sine.out", immediateRender: false }, ABIERTA + 0.3);
      qa(".s11-vent").forEach((v, i) => tl.fromTo(v, { opacity: 0.2 }, { opacity: 0.9, duration: 0.1, immediateRender: false }, ABIERTA + 0.1 + i * 0.1));
      // "te busca": el cliente llega a la puerta (con su corazón) y entra
      gsap.set(q(".s11-cliente"), { x: -112, y: 80, opacity: 0 });
      tl.to(q(".s11-cliente"), { opacity: 1, duration: 0.1 }, 5.3);
      tl.to(q(".s11-cliente"), { x: 0, duration: 0.8, ease: "power1.inOut" }, 5.3);
      [0, 0.2, 0.4, 0.6].forEach((d) => tl.to(q(".s11-cliente"), { y: 74, duration: 0.1, yoyo: true, repeat: 1, ease: "sine.out" }, 5.3 + d));
      late(q(".s11-cc"), BUSCA, 3);
      tl.to(q(".s11-cliente"), { scale: 0.7, opacity: 0, transformOrigin: "50% 100%", duration: 0.3, ease: "power2.in" }, BUSCA + 0.45);
      late(q(".s11-c3"), TIENDA + 0.4, 4);
      // final: los tres corazones laten juntos y la cámara se abre
      empujar(540, 960, 1, BUSCA + 0.25, 0.5, 0);
      [q(".s11-c1"), q(".s11-c2"), q(".s11-c3")].forEach((c) => late(c, BUSCA + 0.4, 2));

      // salida: zoom de golpe hacia adentro + fundido
      tl.to(q("#s11-escena"), { scale: 1.25, opacity: 0, transformOrigin: "50% 48%", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
