              <text class="mes" x="270" y="901" text-anchor="middle">AÑOS</text>
              <g class="s08-anios">
                <text class="anio" x="270" y="1004" text-anchor="middle">2019</text>
                <text class="anio" x="270" y="1004" text-anchor="middle">2020</text>

            <path class="rosa s08-cz s08-cz2" d="M790 870 C786 864 776 864 776 873 C776 881 786 885 790 890 C794 885 804 881 804 873 C804 864 794 864 790 870 Z" />
            <path class="rosa s08-cz s08-cz3" d="M860 880 C856 874 846 874 846 883 C846 891 856 895 860 900 C864 895 874 891 874 883 C874 874 864 874 860 880 Z" />

          <circle class="papel" cx="540" cy="700" r="12" />

          <g class="s08-chispas">

      <div class="etiqueta"><span class="s08-e1">Años de atención</span><span class="s08-e2">Él está siempre</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-anios";
      const DUR = 6.11;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (palabras)
      const LE_DISTE = 0.4;
      const ANIOS = 1.07;
      const ATENCION = 1.9;
      const EL_OTRO = 3.25;
      const ATENCION2 = 4.2;
      const CUALQUIER = 4.9;
      const HORA = 5.3;

      const dibujar = (els, t, dur) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.03 }, t + i * 0.04);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // la balanza: la viga gira sobre el pivote y los platos cuelgan siguiendo las puntas
      const R = 270;
      const inclinar = (deg, t, dur, ease) => {
        const a = (deg * Math.PI) / 180;
        const dx = R * (1 - Math.cos(a));
        const dy = R * Math.sin(a);
        tl.to(q(".s08-viga"), { rotation: deg, transformOrigin: "50% 50%", duration: dur, ease }, t);
        tl.to(q(".s08-platoL"), { x: dx, y: -dy, duration: dur, ease }, t);
        tl.to(q(".s08-platoR"), { x: -dx, y: dy, duration: dur, ease }, t);
      };
      gsap.set(q(".s08-viga"), { rotation: 0, transformOrigin: "50% 50%" });

      // cuadro 0: la balanza ya está, cae a la mesa
      tl.fromTo(q(".s08-cam"), { y: -50, scale: 1.06, transformOrigin: "50% 50%" }, { y: 0, scale: 1, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s08-vos"), { scale: 0.6, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(2)" }, 0.05);

      // "le diste": el calendario cae al plato de VOS y la balanza se va para tu lado
      gsap.set(q(".s08-cal"), { opacity: 0 });
      tl.fromTo(q(".s08-cal"), { opacity: 0, y: -260, rotation: -16, transformOrigin: "50% 100%" }, { opacity: 1, y: 0, rotation: 0, transformOrigin: "50% 100%", duration: 0.35, ease: "power3.in", immediateRender: false }, LE_DISTE - 0.15);
      inclinar(-8, LE_DISTE + 0.2, 0.6, "back.out(2.2)");
      gsap.set(q(".s08-hoja"), { opacity: 0 });

      // "años": los años pasan volando (hojas arrancadas)
      const anios = qa(".s08-anios text");
      anios.forEach((el, i) => gsap.set(el, { opacity: i === 0 ? 1 : 0 }));
      const paso = 0.14;
      anios.forEach((el, i) => {
        if (i === 0) return;
        const t = ANIOS + (i - 1) * paso;
        tl.set(anios[i - 1], { opacity: 0 }, t);
        tl.set(el, { opacity: 1 }, t);
      });
      // la hoja que vuela, una por año
      for (let i = 0; i < 4; i++) {
        const t = ANIOS + i * paso * 1.5;
        tl.fromTo(q(".s08-hoja"), { opacity: 1, x: 0, y: 0, rotation: 0, transformOrigin: "50% 0%" }, { opacity: 0, x: -90 - i * 10, y: -110, rotation: -40, transformOrigin: "50% 0%", duration: paso * 1.5, ease: "power2.out", immediateRender: false }, t);
      }
      tl.fromTo(q(".s08-cal"), { scale: 1, transformOrigin: "50% 100%" }, { scale: 1.08, transformOrigin: "50% 100%", duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, ANIOS);
      tl.fromTo(q(".s08-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, ANIOS);
      // corazoncito crema-rosa del calendario late con "buena atención"
      tl.fromTo(q(".s08-corazonL"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(3)" }, 1.6);
      tl.to(q(".s08-corazonL"), { scale: 1.35, transformOrigin: "50% 50%", duration: 0.14, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.95);

      // "atención": cae el cartel de horario, y a las 19... da vuelta a CERRADO
      gsap.set(q(".s08-cartel"), { opacity: 0 });
      tl.fromTo(q(".s08-cartel"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, ATENCION - 0.1);
      tl.fromTo(q(".s08-cartel"), { rotation: 0, transformOrigin: "50% 0%" }, { rotation: 6, transformOrigin: "50% 0%", duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, ATENCION + 0.2);
      gsap.set(q(".s08-cartel-b"), { opacity: 0 });
      tl.to(q(".s08-cartel-a"), { scaleY: 0, transformOrigin: "50% 50%", duration: 0.12, ease: "power2.in" }, 2.95);
      tl.set(q(".s08-cartel-a"), { opacity: 0 }, 3.07);
      tl.fromTo(q(".s08-cartel-b"), { opacity: 1, scaleY: 0, transformOrigin: "50% 50%" }, { opacity: 1, scaleY: 1, transformOrigin: "50% 50%", duration: 0.16, ease: "back.out(2)", immediateRender: false }, 3.07);
      // y la balanza ya no está tan segura (titubea)
      inclinar(-4, 2.9, 0.35, "power2.inOut");

      // "el otro": aparece EL OTRO y su reloj dorado cae del cielo
      gsap.set(q(".s08-otro"), { opacity: 0 });
      tl.fromTo(q(".s08-otro"), { opacity: 0, scale: 1.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "power4.in", immediateRender: false }, EL_OTRO);
      gsap.set(q(".s08-reloj"), { opacity: 0 });
      tl.fromTo(q(".s08-reloj"), { opacity: 0, y: -300, rotation: 30, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, rotation: 0, transformOrigin: "50% 50%", duration: 0.32, ease: "power3.in", immediateRender: false }, EL_OTRO + 0.05);
      inclinar(3, EL_OTRO + 0.35, 0.5, "back.out(2.5)");
      tl.to(q(".s08-e1"), { opacity: 0, y: -10, duration: 0.2 }, EL_OTRO);

      // las agujas: tranquilas al llegar, a toda velocidad desde "atención"
      tl.fromTo(q(".s08-aguja-m"), { rotation: 0, transformOrigin: "50% 100%" }, { rotation: 180, transformOrigin: "50% 100%", duration: 0.9, ease: "none", immediateRender: false }, EL_OTRO + 0.4);
      tl.to(q(".s08-aguja-m"), { rotation: 180 + 360 * 7, transformOrigin: "50% 100%", duration: DUR - ATENCION2, ease: "power2.in" }, ATENCION2 - 0.1);
      tl.fromTo(q(".s08-aguja-h"), { rotation: 30, transformOrigin: "50% 100%" }, { rotation: 30 + 360 * 2, transformOrigin: "50% 100%", duration: DUR - ATENCION2 + 0.1, ease: "power2.in", immediateRender: false }, ATENCION2 - 0.1);
      tl.fromTo(q(".s08-reloj"), { x: 0 }, { x: 4, duration: 0.05, yoyo: true, repeat: 15, ease: "none", immediateRender: false }, ATENCION2 + 0.2);

      // "a cualquier hora": 24H, la balanza se desploma hacia el otro, zoom de golpe
      gsap.set(q(".s08-badge"), { opacity: 0 });
      tl.fromTo(q(".s08-badge"), { opacity: 0, scale: 2.6, rotation: -40, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 8, transformOrigin: "50% 50%", duration: 0.2, ease: "power4.in", immediateRender: false }, CUALQUIER - 0.12);
      tl.to(q(".s08-badge"), { rotation: -6, scale: 1.12, transformOrigin: "50% 50%", duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, CUALQUIER + 0.1);
      inclinar(11, CUALQUIER, 0.55, "back.out(3)");
      // VOS sale volando para arriba un poco y se apaga
      tl.to(q(".s08-vos"), { opacity: 0.35, duration: 0.3 }, CUALQUIER);
      tl.fromTo(q(".s08-cam"), { scale: 1, transformOrigin: "60% 75%" }, { scale: 1.06, transformOrigin: "60% 75%", duration: 0.16, ease: "power3.out", immediateRender: false }, CUALQUIER);
      [[-12, 7], [10, -6], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s08-cam"), { x, y, duration: 0.04, ease: "none" }, CUALQUIER + 0.16 + i * 0.045));
      gsap.set(q(".s08-chispas"), { opacity: 0 });
      tl.fromTo(q(".s08-chispas"), { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(3)", immediateRender: false }, CUALQUIER + 0.05);
      tl.to(q(".s08-chispas"), { rotation: 8, transformOrigin: "50% 50%", opacity: 0.4, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, CUALQUIER + 0.4);
      // corazoncitos que suben del reloj
      qa(".s08-cz").forEach((c, i) => {
        gsap.set(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 1, y: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 0, y: -170 - i * 30, scale: 1.2, transformOrigin: "50% 50%", duration: 0.9, ease: "power1.out", immediateRender: false }, CUALQUIER + 0.1 + i * 0.12);
      });
      // "hora": círculo de marcador al 24H
      dibujar([q(".s08-circulo")], HORA - 0.05, 0.4);
      tl.fromTo(q(".s08-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, CUALQUIER);

      // salida: zoom de golpe + fundido
      tl.to(q("#s08-escena"), { scale: 1.2, opacity: 0, filter: "blur(6px)", transformOrigin: "60% 50%", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
