  <script>
    (function () {
      const ID = "s04-chat";
      const DUR = 4.86;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const VOS = 0.57;
      const TENES = 1.49;
      const CUARENTA = 2.17;
      const NADIE = 3.29;
      const CONTESTA = 3.77;

      const dibujar = (els, t, dur, gap) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.03 }, t + i * (gap ?? 0.04));
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * (gap ?? 0.04));
        });
      };
      const pop = (el, t, from) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from ?? 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)", immediateRender: false }, t);
      };

      // el celular cae girando (visible desde el cuadro 0)
      tl.fromTo(q(".s04-cel"), { y: -120, rotation: -9, scale: 1.12, transformOrigin: "50% 50%" }, { y: 0, rotation: 0, scale: 1, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(1.4)" }, 0);
      // cámara: se acerca de a poco
      tl.fromTo(q(".s04-camara"), { scale: 1, svgOrigin: "540 935" }, { scale: 1.04, svgOrigin: "540 935", duration: NADIE, ease: "none" }, 0);

      // "a vos": la flecha señala TU LOCAL
      dibujar([q(".s04-flecha")], VOS - 0.1, 0.35);
      pop(q(".s04-avos"), VOS);
      tl.to([q(".s04-flecha"), q(".s04-avos")], { opacity: 0, duration: 0.2 }, TENES - 0.1);

      // "¿tenés talle cuarenta?": burbuja que entra y se tipea
      pop(q(".s04-burbuja"), TENES - 0.05, 0.5);
      gsap.set(q(".s04-tipeo-r"), { scaleX: 0, transformOrigin: "0% 50%" });
      tl.to(q(".s04-tipeo-r"), { scaleX: 1, duration: CUARENTA + 0.2 - TENES, ease: "steps(16)" }, TENES);
      gsap.set(q(".s04-tilde"), { opacity: 0 });
      tl.to(q(".s04-tilde"), { opacity: 1, duration: 0.05 }, CUARENTA + 0.25);
      // el corazoncito del cliente late esperando
      pop(q(".s04-cora"), CUARENTA + 0.1);
      tl.to(q(".s04-cora"), { scale: 1.3, transformOrigin: "50% 50%", duration: 0.14, yoyo: true, repeat: 3, ease: "sine.inOut" }, CUARENTA + 0.4);

      // la esperanza: "escribiendo..." aparece y se va, dos veces
      gsap.set(q(".s04-puntos"), { opacity: 0 });
      tl.to(q(".s04-puntos"), { opacity: 1, duration: 0.08 }, 2.45);
      tl.to(q(".s04-puntos"), { opacity: 0, duration: 0.08 }, 2.85);
      tl.to(q(".s04-puntos"), { opacity: 1, duration: 0.08 }, 3.0);
      tl.to(q(".s04-puntos"), { opacity: 0, duration: 0.06 }, 3.2);
      qa(".s04-p").forEach((p, i) => tl.to(p, { y: -8, duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut" }, 2.45 + i * 0.07));

      // el tiempo pasa: la hora salta 23:00 → 23:47 → 00:30
      tl.set(q(".s04-st1"), { opacity: 0 }, 2.6);
      tl.set(q(".s04-st2"), { opacity: 1 }, 2.6);
      tl.set(q(".s04-st2"), { opacity: 0 }, 3.0);
      tl.set(q(".s04-st3"), { opacity: 1 }, 3.0);
      dibujar([q(".s04-relojito")], 2.5, 0.3);
      tl.to(q(".s04-relojito"), { rotation: 720, transformOrigin: "50% 50%", duration: 0.9, ease: "power1.in" }, 2.6);
      pop(q(".s04-g1"), 2.6, 1.8);
      tl.to(q(".s04-g1"), { opacity: 0, y: -30, duration: 0.1 }, 2.98);
      pop(q(".s04-g2"), 3.0, 1.8);

      // el silencio: telaraña en la barra de escribir y el grillo
      dibujar(qa(".s04-hebra"), 2.55, 0.25, 0.05);
      gsap.set(q(".s04-arana"), { opacity: 0 });
      tl.to(q(".s04-arana"), { opacity: 1, duration: 0.05 }, 2.95);
      tl.fromTo(q(".s04-arana"), { y: -40 }, { y: 0, duration: 0.3, ease: "bounce.out", immediateRender: false }, 2.95);
      gsap.set(q(".s04-grillo"), { opacity: 0 });
      tl.fromTo(q(".s04-grillo"), { opacity: 0, x: -200 }, { opacity: 0.85, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 2.5);
      tl.to(q(".s04-grillo"), { y: -10, duration: 0.08, yoyo: true, repeat: 7, ease: "sine.inOut" }, 2.8);
      pop(q(".s04-cri1"), 2.75);
      pop(q(".s04-cri2"), 3.05);

      // "nadie": cae el sello, zoom de golpe y tiemble
      gsap.set(q(".s04-sello"), { opacity: 0 });
      tl.fromTo(q(".s04-sello"), { opacity: 0, scale: 2.4, rotation: 10, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: -6, transformOrigin: "50% 50%", duration: 0.16, ease: "power4.in", immediateRender: false }, NADIE - 0.1);
      tl.to(q(".s04-camara"), { scale: 1.1, svgOrigin: "540 935", duration: 0.16, ease: "power3.out" }, NADIE + 0.05);
      [[-16, 10], [13, -8], [-8, 5], [4, -2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s04-tiembla"), { x, y, duration: 0.04, ease: "none" }, NADIE + 0.06 + i * 0.045));
      tl.to(q(".s04-camara"), { scale: 1.06, svgOrigin: "540 935", duration: 1.2, ease: "sine.out" }, NADIE + 0.3);

      // "contesta": el celular parpadea y se apaga a 0.4; el corazón se parte
      [0.15, 0.8, 0.25, 0.4].forEach((o, i) => tl.to(q(".s04-cel"), { opacity: o, duration: 0.05, ease: "none" }, CONTESTA + i * 0.06));
      tl.to(q(".s04-mitad-a"), { x: -14, y: 18, rotation: -25, transformOrigin: "50% 50%", duration: 0.35, ease: "power2.in" }, CONTESTA + 0.1);
      tl.to(q(".s04-mitad-b"), { x: 14, y: 22, rotation: 25, transformOrigin: "50% 50%", duration: 0.35, ease: "power2.in" }, CONTESTA + 0.1);
      tl.to(q(".s04-cora"), { opacity: 0.5, duration: 0.3 }, CONTESTA + 0.3);
      tl.to(q(".s04-sello"), { scale: 1.05, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut" }, CONTESTA);

      // etiquetas
      tl.fromTo(q(".s04-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 0.1);
      tl.to(q(".s04-e1"), { opacity: 0, y: -10, duration: 0.12 }, NADIE - 0.15);
      tl.fromTo(q(".s04-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, NADIE + 0.05);

      // salida: zoom de golpe hacia adentro + fundido
      tl.to(q("#s04-escena"), { scale: 1.25, opacity: 0, transformOrigin: "50% 48%", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
