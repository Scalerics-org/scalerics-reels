      const TE = 2.93;
      const DEJO = 2.99;
      const PORQUE = 3.29;
      const ESTABA = 4.53;

      const dibujar = (els, t, dur) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.03 }, t + i * 0.04);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // ACTO 1: la etiqueta ya está en el cuadro 0, entra colgando y se hamaca
      tl.fromTo(q(".s09-tag-in"), { rotation: -22, y: -80, transformOrigin: "50% 0%" }, { rotation: 0, y: 0, transformOrigin: "50% 0%", duration: 0.55, ease: "back.out(2)" }, 0);
      tl.to(q(".s09-tag-in"), { rotation: 4, transformOrigin: "50% 0%", duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.55);
      // "no": la etiqueta dice que no (se sacude), etiqueta mono
      [[-8], [8], [-6], [5], [0]].forEach(([r], i) => tl.to(q(".s09-tag-in"), { rotation: r, transformOrigin: "50% 0%", duration: 0.07, ease: "sine.inOut" }, NO + 0.1 + i * 0.07));
      tl.fromTo(q(".s09-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, NO);
      // "más barato": la X de marcador
      dibujar([q(".s09-x1")], MAS, 0.2);
      dibujar([q(".s09-x2")], MAS + 0.22, 0.2);
      tl.fromTo(q(".s09-tag"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.12, transformOrigin: "50% 50%", duration: 0.12, ease: "power3.out", immediateRender: false }, BARATO);
      gsap.set(q(".s09-sello"), { opacity: 0 });
      tl.fromTo(q(".s09-sello"), { opacity: 0, scale: 2.4, rotation: 12, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: -6, transformOrigin: "50% 50%", duration: 0.16, ease: "power4.in", immediateRender: false }, BARATO + 0.02);
      [[-10, 6], [9, -5], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s09-tag"), { x, y, duration: 0.04, ease: "none" }, BARATO + 0.18 + i * 0.045));
      // se va: la etiqueta cae y el sello se barre
      tl.to(q(".s09-tag"), { y: 700, rotation: 25, opacity: 0, transformOrigin: "50% 50%", duration: 0.4, ease: "power3.in" }, 2.45);
      tl.to(q(".s09-sello"), { x: -700, opacity: 0, duration: 0.35, ease: "power3.in" }, 2.5);

      // ACTO 2: "te dejó" el corazón entra latiendo y se parte
      const cora = q(".s09-cora");
      gsap.set(cora, { opacity: 0 });
      gsap.set([q(".s09-mitadL"), q(".s09-mitadR")], { opacity: 0 });
      tl.fromTo(cora, { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.05, transformOrigin: "50% 50%", duration: 0.28, ease: "back.out(2.5)", immediateRender: false }, 2.62);
      tl.to(cora, { scale: 1.15, transformOrigin: "50% 50%", duration: 0.09, yoyo: true, repeat: 1, ease: "sine.inOut" }, TE - 0.05);
      // la grieta
      dibujar([q(".s09-grieta")], DEJO, 0.16);
      [[-12, 0], [12, 0], [-8, 0], [8, 0], [0, 0]].forEach(([x], i) => tl.to(cora, { x, duration: 0.035, ease: "none" }, DEJO + 0.1 + i * 0.035));
      // se separa en dos mitades
      const PARTE = DEJO + 0.3;
      tl.set(q(".s09-cora-entero"), { opacity: 0 }, PARTE);
      tl.set([q(".s09-mitadL"), q(".s09-mitadR")], { opacity: 1 }, PARTE);
      tl.set(q(".s09-grieta"), { opacity: 0 }, PARTE);
      tl.to(q(".s09-mitadL"), { x: -70, y: 40, rotation: -18, transformOrigin: "100% 100%", duration: 0.3, ease: "power3.out" }, PARTE);
      tl.to(q(".s09-mitadR"), { x: 70, y: 40, rotation: 18, transformOrigin: "0% 100%", duration: 0.3, ease: "power3.out" }, PARTE);
      tl.to(q(".s09-mitadL"), { y: 420, x: -160, rotation: -60, opacity: 0, duration: 0.32, ease: "power2.in" }, PARTE + 0.25);
      tl.to(q(".s09-mitadR"), { y: 420, x: 160, rotation: 60, opacity: 0, duration: 0.32, ease: "power2.in" }, PARTE + 0.28);
      qa(".s09-ast").forEach((a, i) => {
        gsap.set(a, { opacity: 0 });
        const dx = [80, -90, 70, -60][i];
        const dy = [-90, 30, 80, -120][i];

      });
      tl.to(q(".s09-e1"), { opacity: 0, y: -10, duration: 0.2 }, DEJO);

      // ACTO 3: de noche. tu local apagado con la persiana bajando; el otro a oscuras... hasta "estaba"
      const noche = q(".s09-noche");

      // el otro empieza apagado (solo líneas tenues)
      tl.fromTo(q(".s09-otro"), { opacity: 0.35 }, { opacity: 0.35, duration: 0.01, immediateRender: false }, PORQUE + 0.4);

      tl.fromTo(q(".s09-chispas"), { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(3)", immediateRender: false }, ESTABA + 0.05);
      tl.to(q(".s09-chispas"), { opacity: 0.35, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, ESTABA + 0.4);
      tl.to(q(".s09-luz"), { opacity: 0.32, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, ESTABA + 0.2);
      // el corazón del cliente se rearma (con el otro)
      tl.to(q(".s09-cora-nuevo"), { scale: 1.6, opacity: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(3)" }, ESTABA + 0.05);
      tl.to(q(".s09-cora-nuevo"), { scale: 1.25, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, ESTABA + 0.3);
      tl.to(q(".s09-cliente"), { x: 830, duration: 0.9, ease: "power1.in" }, ESTABA + 0.3);
      // tu local: todavía más apagado
      tl.to(q(".s09-tuyo"), { opacity: 0.28, duration: 0.3 }, ESTABA);
      tl.fromTo(noche, { scale: 1, transformOrigin: "75% 55%" }, { scale: 1.15, transformOrigin: "75% 55%", duration: 0.18, ease: "power3.out", immediateRender: false }, ESTABA);
      [[-12, 8], [10, -6], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(noche, { x, y, duration: 0.04, ease: "none" }, ESTABA + 0.18 + i * 0.045));
      tl.to(noche, { scale: 1.22, transformOrigin: "75% 55%", duration: DUR - ESTABA - 0.45, ease: "none" }, ESTABA + 0.4);
      tl.fromTo(q(".s09-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, ESTABA);

      // salida: zoom hacia la puerta del otro + fundido
      tl.to(q("#s09-escena"), { scale: 1.25, opacity: 0, filter: "blur(6px)", transformOrigin: "75% 55%", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
