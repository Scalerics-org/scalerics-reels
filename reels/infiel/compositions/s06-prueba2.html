  <script>
    (function () {
      const ID = "s06-prueba2";
      const DUR = 7.9;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const DOS = 0.88;
      const OTRO = 1.88;
      const ACUERDA = 2.38;
      const NOMBRE = 3.08;
      const PIDE = 4.78;
      const NOVA = 6.68;

      const dibujar = (els, t, dur) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.03 }, t + i * 0.04);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const tiemble = (el, t, f) => [[-14, 9], [12, -7], [-7, 4], [0, 0]].forEach(([x, y], i) => tl.to(el, { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      // texto que se tipea letra por letra
      const tipear = (el, t, dur) => {
        const txt = el.textContent;
        el.textContent = "";
        const spans = Array.from(txt).map((c) => { const s = document.createElement("span"); s.textContent = c; el.appendChild(s); return s; });
        spans.forEach((s, i) => tl.set(s, { opacity: 1 }, t + (i * dur) / spans.length));
      };
      // círculo de marcador a mano alrededor de un valor de la libreta
      const lazo = (el, cx, cy, rx, ry) => el.setAttribute("d",
        `M${cx} ${cy + ry} C${cx - rx * 1.05} ${cy + ry * 1.05} ${cx - rx * 1.08} ${cy - ry} ${cx - rx * 0.2} ${cy - ry * 1.08} ` +
        `C${cx + rx * 0.6} ${cy - ry * 1.15} ${cx + rx * 1.1} ${cy - ry * 0.6} ${cx + rx * 1.02} ${cy + ry * 0.1} ` +
        `C${cx + rx * 0.95} ${cy + ry * 0.9} ${cx + rx * 0.3} ${cy + ry * 1.1} ${cx - rx * 0.3} ${cy + ry * 0.92}`);
      lazo(q(".s06-c1"), 376, 114, 100, 34);
      lazo(q(".s06-c2"), 464, 184, 214, 34);
      lazo(q(".s06-c3"), 452, 254, 202, 34);

      // ===== TARJETA: entra con zoom de golpe (cuadro 0; flash global 17.65) =====
      tl.fromTo(q(".s06-tarjeta"), { scale: 2.6, rotation: -6, transformOrigin: "50% 50%" }, { scale: 1, rotation: 3, transformOrigin: "50% 50%", duration: 0.14, ease: "power4.in" }, 0);
      tiemble(q(".s06-tiembla"), 0.15, 1.2);
      tl.fromTo(q(".s06-cam"), { scale: 1, transformOrigin: "50% 45%" }, { scale: 1.12, transformOrigin: "50% 45%", duration: 0.22, ease: "power3.out" }, 0.2);
      tl.to(q(".s06-cam"), { scale: 1.04, transformOrigin: "50% 45%", duration: 0.6, ease: "sine.inOut" }, 0.45);
      // "dos": el Nº2 late
      tl.to(q(".s06-tarjeta-in"), { scale: 1.07, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut" }, DOS);
      qa(".s06-foco").forEach((f, i) => {
        tl.fromTo(f, { opacity: i % 2 ? 1 : 0.25 }, { opacity: i % 2 ? 0.25 : 1, duration: 0.14, ease: "none", yoyo: true, repeat: 9 }, 0.15);
      });
      // barrido de salida de la tarjeta
      tl.to(q(".s06-tarjeta"), { x: -1150, rotation: -10, opacity: 0.4, transformOrigin: "50% 50%", duration: 0.24, ease: "power3.in" }, 1.6);
      tl.to(q(".s06-cam"), { scale: 1, transformOrigin: "50% 45%", duration: 0.3, ease: "power2.out" }, 1.75);

      // ===== "el otro": cae la libreta del otro =====
      gsap.set(q(".s06-ficha"), { opacity: 0 });
      tl.fromTo(q(".s06-ficha"), { opacity: 1, y: -520, rotation: -14, scale: 1.15 }, { opacity: 1, y: 0, rotation: -1.5, scale: 1, duration: 0.36, ease: "back.out(1.3)", immediateRender: false }, 1.72);
      tiemble(q(".s06-tiembla"), 2.08, 0.6);
      // "se acuerda": la libreta late y el corazoncito de la banda también
      tl.to(q(".s06-ficha"), { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut" }, ACUERDA);
      tl.fromTo(q(".s06-banda-cora"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.4, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 9, ease: "sine.inOut", immediateRender: false }, ACUERDA);
      // cámara: empuje lento sobre el tablero
      tl.fromTo(q(".s06-cam"), { scale: 1 }, { scale: 1.05, transformOrigin: "50% 60%", duration: DUR - 2.1, ease: "none", immediateRender: false }, 2.05);

      // cada prueba: polaroid que cae, chinche, hilo, se tipea en la libreta y se marca
      const prueba = (pol, pin, val, circ, t, rot, hilo) => {
        gsap.set(q(pol), { opacity: 0 });
        gsap.set(q(pin), { opacity: 0 });
        tl.fromTo(q(pol), { opacity: 1, y: -260, rotation: rot * -4, scale: 1.3 }, { opacity: 1, y: 0, rotation: rot, scale: 1, duration: 0.22, ease: "power4.in", immediateRender: false }, t - 0.12);
        tl.fromTo(q(pin), { opacity: 1, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.2, ease: "back.out(3)", immediateRender: false }, t + 0.1);
        if (hilo) dibujar([q(hilo)], t + 0.12, 0.35);
        tiemble(q(".s06-tiembla"), t + 0.1, 0.7);
        tipear(q(val), t + 0.05, 0.35);
        dibujar([q(circ)], t + 0.4, 0.45);
      };
      prueba(".s06-p1", ".s06-pin1", ".s06-v1", ".s06-c1", NOMBRE, -5, null);
      prueba(".s06-p2", ".s06-pin2", ".s06-v2", ".s06-c2", PIDE, 3, ".s06-hilo1");
      prueba(".s06-p3", ".s06-pin3", ".s06-v3", ".s06-c3", NOVA, -4, ".s06-hilo2");
      // el vapor del café se mueve (lo de siempre, recién hecho)
      // "no va": zoom de golpe y flecha de marcador a la última visita
      tl.to(q(".s06-cam"), { scale: 1.12, transformOrigin: "50% 60%", duration: 0.12, ease: "power3.out", yoyo: true, repeat: 1 }, NOVA + 0.1);
      dibujar([q(".s06-flecha"), q(".s06-punta")], NOVA + 0.75, 0.3);

      // etiquetas
      tl.fromTo(q(".s06-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 0.12);
      tl.to(q(".s06-e1"), { opacity: 0, y: -10, duration: 0.15 }, 1.65);
      tl.fromTo(q(".s06-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, OTRO);

      // salida: zoom de golpe hacia adentro + fundido
      tl.to(q("#s06-escena"), { scale: 1.25, opacity: 0, filter: "blur(6px)", transformOrigin: "50% 50%", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
