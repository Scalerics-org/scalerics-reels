  <script>
    (function () {
      const ID = "s02-pruebas";
      const DUR = 2.28;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const PRUEBAS = 0.81;

      const dibujar = (els, t, dur) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.03 }, t + i * 0.04);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // cámara de telenovela: zoom lento durante toda la escena
      tl.fromTo(q(".s02-camara"), { scale: 1, transformOrigin: "50% 60%" }, { scale: 1.07, transformOrigin: "50% 60%", duration: DUR, ease: "none" }, 0);

      // la carpeta cae sobre la mesa (se ve desde el cuadro 0)
      const carpeta = [q(".s02-carpeta"), q(".s02-tapa")];
      tl.fromTo(carpeta, { y: -260, rotation: -12, scale: 1.15, transformOrigin: "50% 50%" }, { y: 0, rotation: -2, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "power3.in" }, 0);
      // rebote al aterrizar
      [[0, 10], [0, -4], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-tiembla"), { x, y, duration: 0.04, ease: "none" }, 0.3 + i * 0.04));
      // la tapa se abre (pliega hacia nosotros)
      tl.to(q(".s02-tapa"), { scaleY: 0.32, skewX: -6, transformOrigin: "50% 100%", duration: 0.2, ease: "power2.in" }, 0.36);

      // las pruebas salen disparadas en abanico desde adentro de la carpeta
      const POS = [[302, 760, -14], [540, 740, 3], [778, 760, 13]];
      qa(".s02-pol").forEach((p, i) => {
        gsap.set(p, { x: 540, y: 1100, scale: 0.3, rotation: 0, opacity: 0, transformOrigin: "50% 50%" });
        tl.to(p, { opacity: 1, duration: 0.02 }, 0.42 + i * 0.07);
        tl.to(p, { x: POS[i][0], y: POS[i][1], scale: 1, rotation: POS[i][2], duration: 0.34, ease: "back.out(1.5)" }, 0.42 + i * 0.07);
      });
      // los clips dorados se enganchan arriba de cada una
      const CLIPS = [[290, 618, -14], [528, 598, 3], [766, 618, 13]];
      qa(".s02-clip").forEach((c, i) => {
        gsap.set(c, { x: CLIPS[i][0], y: CLIPS[i][1], rotation: CLIPS[i][2], transformOrigin: "50% 100%" });
      });
      dibujar(qa(".s02-clip"), 0.68, 0.18);
      tl.fromTo(q(".s02-chispa"), { scale: 0, rotation: 0, transformOrigin: "50% 50%" }, { scale: 1.3, rotation: 180, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(2)" }, 0.75);

      // "pruebas": cae el sello y todo tiembla (flash global 3.8)
      gsap.set(q(".s02-sello"), { opacity: 0 });
      tl.fromTo(q(".s02-sello"), { opacity: 0, scale: 2.5, rotation: 12, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: -7, transformOrigin: "50% 50%", duration: 0.16, ease: "power4.in", immediateRender: false }, PRUEBAS - 0.12);
      [[-16, 10], [13, -8], [-8, 5], [4, -2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-tiembla"), { x, y, duration: 0.04, ease: "none" }, PRUEBAS + 0.05 + i * 0.045));
      // zoom de golpe en la revelación
      tl.to(q(".s02-sello"), { scale: 1.06, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut" }, PRUEBAS + 0.1);

      // hilo rojo con chinches uniendo las pruebas
      qa(".s02-chinche").forEach((c, i) => {
        gsap.set(c, { scale: 0, transformOrigin: "50% 50%" });
        tl.to(c, { scale: 1, duration: 0.18, ease: "back.out(3)" }, 1.1 + i * 0.12);
      });
      dibujar([q(".s02-hilo")], 1.15, 0.45);
      // el marcador marca la del otro
      dibujar([q(".s02-circulo")], 1.6, 0.4);
      tl.to(q(".s02-pol3"), { scale: 1.08, duration: 0.14, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.95);

      // etiquetas
      tl.fromTo(q(".s02-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 0.12);
      tl.to(q(".s02-e1"), { opacity: 0, y: -10, duration: 0.15 }, 1.15);
      tl.fromTo(q(".s02-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 1.25);

      // salida: zoom de golpe hacia adentro + fundido
      tl.to(q("#s02-escena"), { scale: 1.25, opacity: 0, transformOrigin: "50% 48%", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
