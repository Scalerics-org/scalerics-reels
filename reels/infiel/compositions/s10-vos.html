  <script>
    (function () {
      const ID = "s10-vos";
      const DUR = 3.78;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const SCALERICS = 0.08;
      const HACEMOS = 1.24;
      const EL_OTRO = 1.78;
      const GIRO = 1.98;
      const SEAS = 2.66;
      const VOS = 2.88;

      const dibujar = (els, t, dur) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.03 }, t + i * 0.04);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // la carta del otro ya está en el cuadro 0, cayendo
      tl.fromTo(q(".s10-polaroid"), { rotation: 14, scale: 1.2, y: -50, transformOrigin: "50% 50%" }, { rotation: 3, scale: 1, y: 0, transformOrigin: "50% 50%", duration: 0.42, ease: "back.out(1.4)" }, 0);
      gsap.set(q(".s10-dorso"), { opacity: 0 });
      gsap.set(q(".s10-rayos"), { opacity: 0 });

      // "Scalerics": las letras caen una a una con brillo dorado
      const letras = qa(".s10-marca span");
      gsap.set(letras, { opacity: 0 });
      letras.forEach((l, i) => {
        tl.fromTo(l, { opacity: 0, y: -40, rotation: i % 2 ? 12 : -12, scale: 1.5 }, { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, SCALERICS + i * 0.045);
      });
      tl.fromTo(q(".s10-marca"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.06, duration: 1.6, ease: "none" }, 0.5);
      tl.fromTo(q(".s10-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.2);

      // "hacemos": la flecha de marcador va de la marca a la carta, y se marca EL OTRO
      dibujar([q(".s10-flecha")], HACEMOS, 0.4);
      dibujar([q(".s10-circulo")], HACEMOS + 0.2, 0.45);
      // "el otro": la carta tiembla (está por pasar algo)
      [[-8, 4], [8, -4], [-6, 3], [6, -2], [0, 0]].forEach(([x, r], i) => tl.to(q(".s10-polaroid"), { x, rotation: 3 + r, transformOrigin: "50% 50%", duration: 0.04, ease: "none" }, EL_OTRO + i * 0.04));
      tl.to(q(".s10-flecha"), { opacity: 0, duration: 0.15 }, GIRO - 0.1);

      // EL GIRO: la carta se da vuelta como un naipe
      tl.to(q(".s10-carta"), { scaleX: 0, transformOrigin: "50% 50%", duration: 0.16, ease: "power2.in" }, GIRO);
      tl.set(q(".s10-frente"), { opacity: 0 }, GIRO + 0.16);
      tl.set(q(".s10-dorso"), { opacity: 1 }, GIRO + 0.16);
      tl.to(q(".s10-carta"), { scaleX: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)" }, GIRO + 0.16);
      tl.to(q(".s10-polaroid"), { rotation: -3, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)" }, GIRO + 0.16);
      tl.fromTo(q(".s10-cora"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(3)", immediateRender: false }, GIRO + 0.3);
      tl.to(q(".s10-cora"), { scale: 1.25, transformOrigin: "50% 50%", duration: 0.13, yoyo: true, repeat: 5, ease: "sine.inOut" }, GIRO + 0.65);
      qa(".s10-b").forEach((b, i) => {
        tl.fromTo(b, { scale: 0, rotation: 0, transformOrigin: "50% 50%" }, { scale: 1.2, rotation: 90, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(2.5)", immediateRender: false }, GIRO + 0.3 + i * 0.07);
        tl.to(b, { scale: 0.6, rotation: 180, transformOrigin: "50% 50%", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, GIRO + 0.7 + i * 0.07);
      });
      tl.to(q(".s10-e1"), { opacity: 0, y: -10, duration: 0.15 }, GIRO);
      tl.fromTo(q(".s10-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, GIRO + 0.2);

      // "seas": zoom de golpe y los rayos dorados explotan
      tl.to(q(".s10-polaroid"), { scale: 1.15, transformOrigin: "50% 50%", duration: 0.12, ease: "power3.out" }, SEAS);
      tl.to(q(".s10-polaroid"), { scale: 1.05, transformOrigin: "50% 50%", duration: 0.3, ease: "power2.out" }, SEAS + 0.12);
      tl.fromTo(q(".s10-rayos"), { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.1, transformOrigin: "50% 50%", duration: 0.25, ease: "power3.out", immediateRender: false }, SEAS);
      tl.to(q(".s10-rayos"), { rotation: 12, transformOrigin: "50% 50%", duration: DUR - SEAS, ease: "none" }, SEAS);

      // "vos": cae el sello y todo tiembla
      gsap.set(q(".s10-sello"), { opacity: 0 });
      tl.fromTo(q(".s10-sello"), { opacity: 0, scale: 2.4, rotation: -16, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: -9, transformOrigin: "50% 50%", duration: 0.18, ease: "power4.in", immediateRender: false }, VOS - 0.1);
      [[-14, 9], [12, -7], [-7, 4], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-polaroid"), { x, y, duration: 0.04, ease: "none" }, VOS + 0.08 + i * 0.045));
      tl.to(q(".s10-pie2"), { opacity: 0, duration: 0.05 }, VOS);
      tl.to(q(".s10-marca"), { scale: 1.12, transformOrigin: "50% 50%", duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, VOS + 0.08);

      // salida: zoom de golpe hacia adentro + fundido
      tl.to(q("#s10-escena"), { scale: 1.25, opacity: 0, transformOrigin: "50% 48%", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
