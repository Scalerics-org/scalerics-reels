<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/radio.js"></script>
  <style>

    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-medianoche"] .s02-capa { position: absolute; inset: 0; }
    [data-composition-id="s02-medianoche"] svg.s02-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

  </style>
  <div id="root" data-composition-id="s02-medianoche" data-width="1080" data-height="1920" data-duration="4.93">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="4.93" data-track-index="0">
      <svg class="s02-svg" viewBox="0 0 1080 1920" aria-hidden="true">
        <defs><clipPath id="s02-recorte"><rect x="0" y="560" width="1080" height="776" /></clipPath></defs>
        <g clip-path="url(#s02-recorte)">
          <!-- la radio capilla de la mesa de luz -->
          <g class="s02-radio">
            <path d="M330 1250 V1020 Q330 820 540 810 Q750 820 750 1020 V1250 Z" fill="#3a2018" stroke="#140b09" stroke-width="8" stroke-linejoin="round" />
            <path d="M370 1080 V1010 Q370 860 540 852 Q710 860 710 1010 V1080 Z" fill="#7d1f2b" stroke="#140b09" stroke-width="6" />
            <path d="M420 1080 V900 M480 1080 V866 M540 1080 V856 M600 1080 V866 M660 1080 V900" stroke="#c97a1c" stroke-width="10" stroke-linecap="round" />
            <rect class="s02-dialr" x="380" y="1110" width="320" height="56" rx="10" fill="#ffb03b" stroke="#140b09" stroke-width="6" />
            <path d="M400 1120 V1136 M440 1120 V1132 M480 1120 V1136 M520 1120 V1132 M560 1120 V1136 M600 1120 V1132 M640 1120 V1136 M680 1120 V1132" stroke="#3a1a08" stroke-width="3" />
            <path class="s02-ag" d="M600 1114 V1162" stroke="#ff3b2f" stroke-width="6" />
            <circle cx="420" cy="1210" r="22" fill="#cbbba5" stroke="#140b09" stroke-width="5" /><circle cx="660" cy="1210" r="22" fill="#cbbba5" stroke="#140b09" stroke-width="5" />
            <path d="M300 1250 H780" stroke="#140b09" stroke-width="10" stroke-linecap="round" />

          <!-- corazones que suben de la radio -->
          <g class="s02-corazones">
            <g class="s02-c1" transform="translate(300 900)"></g>
            <g class="s02-c2" transform="translate(800 940)"></g>
            <g class="s02-c3" transform="translate(220 1080)"></g>
            <g class="s02-c4" transform="translate(870 1100)"></g>
          </g>
          <!-- el corazón grande que late -->
          <g class="s02-corazon" transform="translate(540 1010)"></g>

      </svg>
      <div class="rd-grueso s02-titulo">Corazones<br />de <b>medianoche</b></div>
      <div class="rd-etiqueta"><span class="s02-et"></span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-medianoche";
      const DUR = 4.93;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q0 = (s) => root.querySelector(s);
      q0(".s02-c1").innerHTML = RD.corazon(34, "#ff7a6b");
      q0(".s02-c2").innerHTML = RD.corazon(28, "#ffb03b");
      q0(".s02-c3").innerHTML = RD.corazon(24, "#ffb03b");
      q0(".s02-c4").innerHTML = RD.corazon(32, "#ff7a6b");
      q0(".s02-corazon").innerHTML = RD.corazon(70, "#ff3b2f");
      const tl = gsap.timeline({ paused: true });
      const K = RD.kit(tl, root);
      const { q, qa } = K;
      const CORAZONES = 0.88, SOLITARIOS = 1.39, TITULO = 3.11, MEDIANOCHE = 3.77;

      // cuadro 0: la radio ya está entrando
      tl.fromTo(q(".s02-radio"), { y: 80, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.5)" }, 0);
      tl.fromTo(q(".s02-ag"), { x: -160 }, { x: 0, duration: 0.8, ease: "power2.out" }, 0.1);
      K.prende(q(".s02-dialr"), 0.15);
      // "corazones": el corazón grande aparece y late
      K.pop(q(".s02-corazon"), CORAZONES - 0.1, 0.4);
      K.late(q(".s02-corazon"), CORAZONES + 0.3, 2.0, 1.12, 0.5);
      // "solitarios": corazoncitos sueltos que suben de a uno
      qa(".s02-corazones > g").forEach((c, i) => {
        gsap.set(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 0, y: 40 }, { opacity: 0.9, y: -60, duration: 1.4, ease: "sine.out", immediateRender: false }, SOLITARIOS + i * 0.2);
        tl.to(c, { opacity: 0, duration: 0.3 }, SOLITARIOS + i * 0.2 + 1.4);
      });
      // "Corazones de Medianoche": el corazón se hace chico y entra el título
      tl.to(q(".s02-corazon"), { scale: 0.5, y: -60, opacity: 0, duration: 0.35, ease: "power2.inOut" }, TITULO - 0.3);
      tl.to(q(".s02-radio"), { y: 40, duration: 0.35, ease: "power2.inOut" }, TITULO - 0.3);
      K.golpe(q(".s02-titulo"), TITULO, 0);
      tl.fromTo(q(".s02-titulo b"), { opacity: 0.3 }, { opacity: 1, duration: 0.1, immediateRender: false }, MEDIANOCHE);
      K.late(q(".s02-titulo"), MEDIANOCHE + 0.2, 0.8, 1.04, 0.4);

      K.etiqueta(q(".s02-et"), [[0.15, "AM 1270 · <b>DE MADRUGADA</b>"], [TITULO, "PARA <b>CORAZONES ROTOS</b>"]]);
      K.salida(q("#s02-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
