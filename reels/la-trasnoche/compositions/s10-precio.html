    (function () {
      const ID = "s10-precio";
      const DUR = 6.97;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      root.querySelector(".s10-raul").innerHTML = RD.raul({ tubo: true, mirada: 5 });
      root.querySelector(".s10-carmen").innerHTML = RD.carmen({ mirada: -5 });

      const K = RD.kit(tl, root);
      const { q, qa } = K;
      const PRECIO = 2.13, POR = 3.06, PRECIO2 = 3.45, ME = 4.38, NADIE = 4.95, EXTRANO = 5.44, RAUL = 5.85;

      K.sacudon(q(".s10-rw"), 0.1, 0.6);
      K.habla(q(".s10-raul .rd-boca"), 0.02, 2.7);
      tl.to(q(".s10-raul .rd-cejas"), { y: -12, duration: 0.15 }, 0.05);
      tl.to(q(".s10-pd"), { opacity: 0.55, duration: 0.2 }, 0.6);
      // "por el precio": la etiqueta de precio aparece del lado de Raúl
      K.pop(q(".s10-tag"), PRECIO - 0.2, 0.35);
      gsap.set([q(".s10-x1"), q(".s10-x2")], { opacity: 0 });
      tl.fromTo(q(".s10-tag"), { rotation: -6 }, { rotation: 6, svgOrigin: "480 1080", duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, PRECIO + 0.15);

      tl.to(q(".s10-pd"), { opacity: 1, duration: 0.15 }, POR - 0.15);
      tl.to(q(".s10-pi"), { opacity: 0.55, duration: 0.2 }, POR);
      K.habla(q(".s10-carmen .rd-boca"), POR, 6.6);
      tl.to(q(".s10-carmen .rd-cejas"), { y: -12, duration: 0.15 }, POR);
      K.dibujar(q(".s10-x1"), PRECIO2, 0.18);
      K.dibujar(q(".s10-x2"), PRECIO2 + 0.15, 0.18);
      K.sacudon(q(".s10-tag"), PRECIO2 + 0.3, 0.7);
      tl.to(q(".s10-tag"), { opacity: 0, y: 40, duration: 0.3 }, ME);
      // "nadie me extrañó": corazón en el medio, se parte
      tl.to(q(".s10-carmen .rd-cejas"), { y: 6, duration: 0.2 }, ME);
      K.pop(q(".s10-cor"), NADIE - 0.2, 0.35);
      tl.to(q(".s10-mi"), { x: -34, rotation: -14, svgOrigin: "540 1140", duration: 0.3, ease: "power3.out" }, EXTRANO);
      tl.to(q(".s10-md"), { x: 34, rotation: 14, svgOrigin: "540 1140", duration: 0.3, ease: "power3.out" }, EXTRANO);

      tl.to(q(".s10-pi"), { opacity: 1, duration: 0.2 }, RAUL - 0.1);
      tl.to(q(".s10-raul .rd-cejas"), { y: 8, duration: 0.2 }, RAUL);
      tl.to(q(".s10-raul .rd-boca"), { scaleY: 0.5, transformOrigin: "50% 15%", duration: 0.2 }, RAUL + 0.3);

      K.salida(q("#s10-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
