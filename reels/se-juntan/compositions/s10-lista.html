  </style>

  <script>
    (function () {
      const ID = "s10-lista";
      const DUR = 2.8;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // dibuja trazos (stroke-dashoffset); opacity 0 hasta que arrancan (sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.04);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      // aparece entero con golpe
      const pop = (el, t, o) => tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: o ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      // texto que se escribe de izquierda a derecha
      const escribir = (el, t, d) => tl.fromTo(el, { clipPath: "inset(-20% 100% -20% 0)" }, { clipPath: "inset(-20% 0% -20% 0)", duration: d ?? 0.5, ease: "power1.inOut" }, t);

      const LISTA = 0.66, ESCRIBIRLE = 1.86;
      dibujar(qa(".s10-dib"), 0, 0.45, 0.4);
      tl.fromTo(q(".s10-cab"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.15);
      qa(".s10-fila").forEach((f, i) => tl.fromTo(f, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.5)" }, LISTA - 0.1 + i * 0.12));
      tl.fromTo(q(".s10-cursor"), { x: 700, y: 1200, opacity: 0 }, { x: 272, y: 812, opacity: 1, duration: 0.6, ease: "power2.inOut" }, ESCRIBIRLE - 0.7);
      tl.to(q(".s10-cursor"), { scale: 0.85, transformOrigin: "0 0", duration: 0.08, yoyo: true, repeat: 1 }, ESCRIBIRLE - 0.05);
      tl.to(q(".s10-box0"), { stroke: "#5ce611", duration: 0.1 }, ESCRIBIRLE);
      dibujar([q(".s10-tick")], ESCRIBIRLE, 0.25);
      tl.to(q(".s10-n0"), { fill: "#5ce611", duration: 0.15 }, ESCRIBIRLE + 0.05);
      tl.to(q(".s10-cursor"), { x: 660, y: 1120, duration: 0.5, ease: "power2.inOut" }, ESCRIBIRLE + 0.3);

      // etiqueta mono
      const ET = [0.16];
      ET.forEach((t, i) => {
        const el = q(".s10-e" + (i + 1));
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        if (i + 1 < ET.length) tl.to(el, { opacity: 0, y: -8, duration: 0.2 }, ET[i + 1] - 0.15);
      });
      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
