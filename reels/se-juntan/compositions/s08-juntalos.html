    (function () {
      const ID = "s08-juntalos";

        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.04);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      // aparece entero con golpe

      dibujar(qa(".s08-o2-dib"), 0, 0.4, 0.5, 0.01);
      dibujar(qa(".s08-o3-dib"), 0, 0.4, 0.5, 0.01);
      [[290,790],[790,770],[300,1080],[785,1085]].forEach(([x, y], i) => {
        tl.fromTo(q(".s08-obj" + i), { y: 0 }, { y: i % 2 ? 10 : -10, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        // "juntalos": vuelan al centro, se enderezan y se funden
