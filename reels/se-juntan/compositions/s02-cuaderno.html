  <script>
    (function () {
      const ID = "s02-cuaderno";
      const DUR = 5.93;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // dibuja trazos (stroke-dashoffset); opacity 0 hasta que arrancan (sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.04);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      // aparece entero con golpe
      const pop = (el, t, o) => tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: o ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      // texto que se escribe de izquierda a derecha
      const escribir = (el, t, d) => tl.fromTo(el, { clipPath: "inset(-20% 100% -20% 0)" }, { clipPath: "inset(-20% 0% -20% 0)", duration: d ?? 0.5, ease: "power1.inOut" }, t);

      const ASI = 0.7, CUADERNO = 2.12, PRESUPUESTO = 2.82, MARISA = 3.82, QUEDASTE = 4.48, LUNES = 5.32;

      dibujar(qa(".s02-c2-dib"), 0.29, 0.45, 1, 0.02);
      dibujar(qa(".s02-c3-dib"), 0.41, 0.45, 1, 0.02);
      qa(".s02-chico").forEach((g, i) => {
        tl.fromTo(g, { y: 0 }, { y: i % 2 ? 10 : -10, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.1);
        tl.to(g, { rotation: i % 2 ? 4 : -4, svgOrigin: "0 0", duration: 0.1, yoyo: true, repeat: 3, ease: "sine.inOut" }, ASI + i * 0.06);
        if (i > 0) tl.to(g, { y: 60, opacity: 0, duration: 0.35, ease: "power2.in" }, CUADERNO - 0.3 + i * 0.04);
      });
      tl.to(q(".s02-chico0"), { opacity: 0, scale: 1.6, duration: 0.35, ease: "power2.in" }, CUADERNO - 0.2);
      // el cuaderno abierto
      dibujar(qa(".s02-dib"), CUADERNO - 0.1, 0.55, 1, 0.02);
      tl.fromTo(q(".s02-libro"), { scale: 0.9, svgOrigin: "540 910" }, { scale: 1, svgOrigin: "540 910", duration: 0.6, ease: "power3.out" }, CUADERNO - 0.1);
      escribir(q(".s02-t1"), PRESUPUESTO, 0.55);
      escribir(q(".s02-t2"), MARISA - 0.05, 0.6);
      escribir(q(".s02-t3"), QUEDASTE, 0.7);
      pop(q(".s02-pend"), QUEDASTE + 0.45);
      tl.fromTo(q(".s02-pend-t"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25 }, QUEDASTE + 0.5);
      tl.to(q(".s02-pend"), { scale: 1.4, transformOrigin: "50% 50%", duration: 0.18, yoyo: true, repeat: 1 }, LUNES + 0.3);
      tl.to(q(".s02-libro"), { scale: 1.03, svgOrigin: "540 910", duration: 3, ease: "none" }, CUADERNO + 0.6);

      // etiqueta mono

        if (i + 1 < ET.length) tl.to(el, { opacity: 0, y: -8, duration: 0.2 }, ET[i + 1] - 0.15);

      // salida
