    (function () {
      const ID = "s03-excel";
      const DUR = 4.55;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // dibuja trazos (stroke-dashoffset); opacity 0 hasta que arrancan (sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.04);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      // aparece entero con golpe
      const pop = (el, t, o) => tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: o ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);

      const escribir = (el, t, d) => tl.fromTo(el, { clipPath: "inset(-20% 100% -20% 0)" }, { clipPath: "inset(-20% 0% -20% 0)", duration: d ?? 0.5, ease: "power1.inOut" }, t);

      tl.fromTo(qa(".s03-cab"), { opacity: 0 }, { opacity: 0.8, duration: 0.3, stagger: 0.08 }, 0.25);
      dibujar(qa(".s03-celda"), COMPRO - 0.1, 0.3, 1, 0.04);
      qa(".s03-mes").forEach((el, i) => tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: i === 1 || i === 2 ? 1 : 0.6, y: 0, duration: 0.25 }, MARZO + i * 0.05));
      // tres versiones: hojas atrás corridas + pestañas
      dibujar([q(".s03-a1")], TRES - 0.05, 0.4);
      dibujar([q(".s03-a2")], TRES + 0.25, 0.4);
      tl.fromTo(q(".s03-atras1"), { x: 0, y: 0 }, { x: 22, y: -22, duration: 0.4, ease: "power3.out" }, TRES);
      tl.fromTo(q(".s03-atras2"), { x: 0, y: 0 }, { x: 44, y: -44, duration: 0.4, ease: "power3.out" }, TRES + 0.3);
      pop(q(".s03-tab0"), 0.4);
      pop(q(".s03-tab1"), TRES + 0.1);
      pop(q(".s03-tab2"), VERSIONES);

      tl.to(q(".s03-hoja"), { x: -6, duration: 0.05, yoyo: true, repeat: 3 }, NINGUNA + 0.25);

      // etiqueta mono
