  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 76.87;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // segundos globales (los reemplaza armar.mjs desde reel.json "ambiente" y "voces")
      const TURNOS = [[0,"c"],[11.26,"k"],[13.3,"c"],[17.62,"k"],[18.29,"c"],[19.17,"k"],[24.01,"c"],[28.3,"k"],[39.93,"c"],[42.96,"k"],[47.56,"c"],[49.36,"k"],[54.81,"c"],[57.26,"o"],[67.98,"c"],[69.98,"o"]];
      const RAYOS = [5.84,52.82];
      const VIVO = 6.56;
      const DIA3 = 34.38;
      const SCALERICS = 57.26;

      // película vieja: el grano salta, la imagen parpadea, rayas que aparecen y se van
      const pasos = Math.floor(DUR / 0.08);
      const XY = [[0, 0], [-31, 17], [22, -40], [-12, -23], [37, 29], [-44, 8], [9, 41], [28, -11]];
      const grano = q(".am-grano");
      for (let k = 0; k < pasos; k++) {
        const [x, y] = XY[k % XY.length];
        tl.set(grano, { x, y }, r(k * 0.08));
      }
      function r(n) { return Math.round(n * 100) / 100; }
      const rnd = (function () { let a = 11; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; })();
      for (let t = 0.3; t < DUR; t += 0.9 + rnd() * 1.4) {
        if (t > SCALERICS - 0.2 && t < DUR - 6) continue;
        tl.to(q(".am-parpadeo"), { opacity: 0.05 + rnd() * 0.05, duration: 0.04, yoyo: true, repeat: 1, ease: "steps(1)" }, r(t));
      }
      ["am-r1", "am-r2", "am-r3"].forEach((c, i) => {
        for (let t = 0.6 + i * 1.7; t < SCALERICS - 0.3; t += 4.1 + i * 0.9) {
          tl.fromTo(q("." + c), { opacity: 0, x: 0 }, { opacity: 1, x: 6 - i * 5, duration: 0.33, ease: "steps(3)", immediateRender: false }, r(t));
          tl.to(q("." + c), { opacity: 0, duration: 0.05 }, r(t + 0.36));
        }
      });
      tl.fromTo(q(".am-cartel"), { opacity: 0.4, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0);

      const CH = { c: ".am-chc", k: ".am-chk", o: ".am-cho" };
      let ant = null;
      TURNOS.forEach(([t, quien]) => {
        const el = q(CH[quien]);
        if (ant && ant !== el) tl.to(ant, { opacity: 0, x: -30, duration: 0.12, ease: "power2.in" }, Math.max(0, t - 0.12));
        if (ant !== el) tl.fromTo(el, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(2.2)", immediateRender: false }, Math.max(0, t));
        ant = el;
      });

      // rayos: flash blanco con un golpe verde
      function flash(t, f) {
        tl.to(q(".am-flash"), { opacity: 0.75 * (f || 1), duration: 0.03 }, t);
        tl.to(q(".am-flash"), { opacity: 0.1, duration: 0.06 }, t + 0.05);
        tl.to(q(".am-flash"), { opacity: 0.5 * (f || 1), duration: 0.03 }, t + 0.13);
        tl.to(q(".am-flash"), { opacity: 0, duration: 0.45, ease: "power2.out" }, t + 0.17);
        tl.to(q(".am-flashv"), { opacity: 0.22 * (f || 1), duration: 0.04 }, t + 0.05);
        tl.to(q(".am-flashv"), { opacity: 0, duration: 0.5 }, t + 0.12);
      }
      RAYOS.forEach((t) => flash(t, 1));
      flash(VIVO, 0.6);

      // el contador de días
      tl.to(q(".am-d1"), { opacity: 0, duration: 0.1 }, DIA3);
      tl.fromTo(q(".am-d3"), { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, DIA3);
      tl.to(q(".am-dia"), { opacity: 0, y: 30, duration: 0.25 }, SCALERICS);

      // entra Scalerics: se prende la luz (flash largo), el cartel cambia y la película deja de rayarse
      tl.to(q(".am-flash"), { opacity: 0.9, duration: 0.05 }, SCALERICS);
      tl.to(q(".am-flash"), { opacity: 0, duration: 0.8, ease: "power2.out" }, SCALERICS + 0.08);
      tl.to(q(".am-sub"), { opacity: 0, duration: 0.15 }, SCALERICS);
      tl.to(q(".am-ia"), { opacity: 1, duration: 0.2 }, SCALERICS + 0.1);
      tl.to(q(".am-cartel"), { borderColor: "#5ce611", duration: 0.2 }, SCALERICS);
      tl.to(qa(".am-orn"), { borderColor: "#5ce611", duration: 0.2 }, SCALERICS);
      tl.to(q(".am-vineta"), { opacity: 0.45, duration: 0.6 }, SCALERICS);
      tl.to(grano, { opacity: 0.06, duration: 0.6 }, SCALERICS);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
