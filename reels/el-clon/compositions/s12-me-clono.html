<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/lab.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Cinzel"; font-weight: 400 900; font-display: block; src: url("assets/fonts/Cinzel-var.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s12-me-clono"] .s12-capa, [data-composition-id="s12-me-clono"] .s12-escenario { position: absolute; inset: 0; }
    [data-composition-id="s12-me-clono"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s12-me-clono"] .s12-cont { left: 310px; top: 560px; font-size: 40px; }
    [data-composition-id="s12-me-clono"] .s12-dos { left: 0; right: 0; top: 700px; font-size: 76px; }
  </style>
  <div id="root" data-composition-id="s12-me-clono" data-width="1080" data-height="1920" data-duration="7.90">
    <div id="s12-escena" class="s12-capa clip" data-start="0" data-duration="7.90" data-track-index="0">
      <div class="s12-escenario">
        <svg class="s12-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="lab-tag s12-cont"><span class="s12-n">CLONES: 1</span></div>
        <div class="lab-titulo rojo s12-dos">¡DOS COMO YO, NO!</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s12-me-clono";
      const DUR = 7.90;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const L = LAB, I = L.INK;
      const sil = [[190, 1300, 0.55], [890, 1300, 0.55], [360, 1180, 0.45], [720, 1180, 0.45], [100, 1080, 0.38], [540, 1060, 0.38], [980, 1080, 0.38]]
        .map(([x, y, s], i) => `<g class="s12-sil s12-sil${i}" opacity="0.75">${L.criatura(x, y, s, { cara: "malvada" })}</g>`).join("");
      root.querySelector(".s12-svg").innerHTML = `<g class="s12-ejercito">${sil}</g>` +
`<g class="s12-k">${L.criatura(470, 1580, 1.0, { cara: "malvada" })}</g>` +
`<g class="s12-pal">${L.palanca(900, 1330, { txt: "CLONAR" })}</g>` +
L.rayo(900, 1140, 540, 650, { seed: 31, n: 9, amp: 60, cls: "s12-rayo" }) +
`<g class="s12-cie">${L.cientifico(540, 1620, 1.1, { cara: "grito", brazos: "cabeza" })}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = L.kit(tl, root);
      const { q, qa } = K;
      const CANS = 1.95, CLONO = 3.46, TAMBIEN = 4.49, NO = 5.45, DOS = 6.14;
      tl.fromTo(q(".s12-k"), { y: 40 }, { y: 0, duration: 0.4, ease: "back.out(1.6)" }, 0);
      K.hablar(".s12-k .lab-k-boca", 0.05, 16, 0.12);
      K.origen(q(".s12-k .lab-k-cabeza"), "0 -230");
      tl.to(q(".s12-k .lab-k-cabeza"), { rotation: -10, duration: 0.4, ease: "sine.inOut" }, CANS + 0.5);
      gsap.set(q(".s12-cont"), { opacity: 0 });
      // tira de la palanca
      K.origen(q(".lab-pal-man"), "900 1310");
      tl.to(q(".lab-pal-man"), { rotation: 70, duration: 0.25, ease: "back.in(2)" }, CLONO - 0.2);
      K.chispazo(q(".s12-rayo"), CLONO, 0.7);
      K.sacudon(q(".s12-escenario"), CLONO + 0.05, 1.3);
      const sils = qa(".s12-sil");
      sils.forEach((s) => gsap.set(s, { opacity: 0 }));
      [[0, 1], [2, 3], [4, 5, 6]].forEach((grupo, k) => grupo.forEach((i) => tl.fromTo(sils[i], { opacity: 0, y: 40 }, { opacity: 0.75, y: 0, duration: 0.2, ease: "back.out(2)", immediateRender: false }, CLONO + 0.15 + k * 0.45)));
      K.pop(q(".s12-cont"), CLONO + 0.1);
      const N = q(".s12-n");
      [[CLONO + 0.15, "CLONES: 2"], [CLONO + 0.6, "CLONES: 4"], [CLONO + 1.05, "CLONES: 8"], [TAMBIEN + 0.4, "CLONES: 16"]].forEach(([t, s]) => tl.call(() => { N.textContent = s; }, null, t));
      tl.call(() => { N.textContent = "CLONES: 1"; }, null, CLONO + 0.05);
      // "¡No!": entra el científico desesperado
      gsap.set(q(".s12-cie"), { opacity: 0 });
      tl.to([q(".s12-k"), q(".s12-pal")], { opacity: 0, duration: 0.12 }, NO - 0.1);
      tl.fromTo(q(".s12-cie"), { opacity: 0, y: 260 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, NO - 0.1);
      K.hablar(".s12-cie .lab-c-boca", NO, 8, 0.1);
      K.sacudon(q(".s12-cie"), NO + 0.6, 1.2);
      tl.to(q(".s12-cont"), { opacity: 0, duration: 0.12 }, DOS - 0.1);
      K.sello(q(".s12-dos"), DOS, -3);

      K.salida(q("#s12-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
