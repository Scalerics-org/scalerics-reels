    (function () {
      const ID = "s12-solo";
      const DUR = 5.77;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // escribir con birome = destapar de izquierda a derecha
      const escribir = (el, t, dur, desde = 100) => {
        gsap.set(el, { clipPath: "inset(-20% " + desde + "% -20% -4%)" });
        tl.to(el, { clipPath: "inset(-20% -8% -20% -4%)", duration: dur, ease: "none" }, t);
      };
      // dibujar trazos de birome (queda en opacity 0 hasta que arranca: sin puntitos)
      const dibujar = (els, t, dur = 0.6, stagger = 0) => {
        (Array.isArray(els) ? els : [els]).forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1, opacity: 0 });
          tl.set(el, { opacity: 1 }, t + i * stagger);
          tl.to(el, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * stagger);
        });
      };
      // sticker o papel que aparece entero
      const pop = (el, t, rot = 0, dur = 0.35) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.6, rotation: rot - 12 }, { opacity: 1, scale: 1, rotation: rot, duration: dur, ease: "back.out(2)", immediateRender: false }, t);
      };
      // hoja que cae sobre el acolchado
      const caer = (el, t, rot = -2) => tl.fromTo(el, { rotation: rot - 7, scale: 1.08, y: -50 }, { rotation: rot, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.5)" }, t);
      const sacudir = (el, t) => [[-12, 6], [10, -5], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(el, { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const etiqueta = (t) => tl.fromTo(q(".s12-etiq span"), { opacity: 0, y: 16, rotation: -6 }, { opacity: 1, y: 0, rotation: -2, duration: 0.32, ease: "back.out(1.8)" }, t);
  
      const PEDIDO = 0.05, SOLO = 0.75, AVISO = 1.96, SALE = 2.75, REPORTE = 3.96, CELULAR = 4.92;
      const hoja = q(".s12-hoja");

      pop(q(".s12-pl"), 0.1, 0);
      // 1: el pedido vuela solo a la planilla
      pop(q(".s12-g1"), PEDIDO, -2, 0.25);
      tl.to(q(".s12-g1"), { x: 420, y: 60, scale: 0.5, opacity: 0, duration: 0.4, ease: "power2.in" }, SOLO - 0.2);
      tl.to(q(".s12-pl .s12-fila0"), { backgroundColor: "#ffe14d", duration: 0.1 }, SOLO + 0.2);
      escribir(q(".s12-s1"), SOLO + 0.1, 0.35);
      dibujar(q(".s12-k1"), SOLO + 0.45, 0.25);
      // 2: el aviso sale solo en avioncito
      pop(q(".s12-g2"), AVISO - 0.1, 2, 0.25);
      dibujar(q(".s12-avion"), AVISO + 0.1, 0.35);
      tl.to([q(".s12-avion"), q(".s12-g2")], { x: 360, y: -60, opacity: 0, duration: 0.45, ease: "power2.in", stagger: 0.05 }, SALE);
      escribir(q(".s12-s2"), SALE + 0.1, 0.45);
      dibujar(q(".s12-k2"), SALE + 0.55, 0.25);
      // 3: el reporte llega solo al celular
      gsap.set(q(".s12-cel"), { opacity: 0 });
      tl.fromTo(q(".s12-cel"), { opacity: 0, y: 200, rotation: 10 }, { opacity: 1, y: 0, rotation: 4, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, REPORTE - 0.1);
      sacudir(q(".s12-cel"), CELULAR);
      escribir(q(".s12-s3"), REPORTE + 0.4, 0.45);
      dibujar(q(".s12-k3"), CELULAR + 0.1, 0.25);
      etiqueta(SOLO);
      tl.to(q("#s12-escena"), { x: 160, rotation: 6, opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, DUR - 0.25);
  
      window.__timelines = window.__timelines || {};
