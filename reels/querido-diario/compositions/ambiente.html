    (function () {
      const ID = "ambiente";
      const DUR = 76.05;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // lucecitas de la guirnalda (posiciones sobre el cable)
      const L = [[40, 92], [125, 122], [215, 113], [305, 82], [395, 66], [480, 84], [570, 115], [660, 132], [750, 110], [840, 80], [930, 62], [1020, 76]];

        const per = 1.1 + (i % 4) * 0.35;
        tl.fromTo([halo, b], { opacity: 1 }, { opacity: 0.45, duration: per, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor((DUR - 0.5) / per) - 1) }, (i * 0.37) % 1.3);
      });

      tl.fromTo(q(".amb-luz"), { opacity: 0.75, scale: 0.96 }, { opacity: 1, scale: 1.04, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(DUR / 2.6) - 1) }, 0);

        tl.to(q(".amb-flash"), { opacity: 0, duration: 0.32, ease: "power2.out" }, t + 0.04);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
