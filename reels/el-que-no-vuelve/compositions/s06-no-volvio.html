      const nuevo = (padre, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); padre.appendChild(e); return e; };

          const L = el.getTotalLength();

          gsap.set(el, { opacity: ti > 0 ? 0 : 1 });

          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, ti);
        });
      };
      const pop = (el, t, origen) => tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      const ETQ = qa(".etiqueta span");
      const etiqueta = (k, t) => {
        if (k > 0) tl.to(ETQ[k - 1], { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(ETQ[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);

      // figurita de palo: pies en (x, y)
      const FIG = (x, y) => '<circle class="ln" cx="' + x + '" cy="' + (y - 96) + '" r="14" /><path class="ln" d="M' + x + ' ' + (y - 82) + ' V' + (y - 40) + ' M' + x + ' ' + (y - 70) + ' L' + (x - 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 70) + ' L' + (x + 18) + ' ' + (y - 52) + ' M' + x + ' ' + (y - 40) + ' L' + (x - 14) + ' ' + y + ' M' + x + ' ' + (y - 40) + ' L' + (x + 14) + ' ' + y + '" />';
      const caminar = (g, t, pasos) => tl.fromTo(g, { rotation: -4, svgOrigin: "0 0" }, { rotation: 4, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: pasos }, t);


      const VINO = 0.6, GUSTO = 1.6, NO = 2.5, ATENDIERAS = 4.0, NADIE = 5.5, MOTIVO = 6.5;

      fig.innerHTML = FIG(0, 1100);
      gsap.set(qa(".s06-globo, .s06-bien, .s06-regalo, .s06-preg"), { opacity: 0 });
      dibujar(qa(".s06-d"), 0, 0.5, 0.45, 0.03);
      dibujar([q(".s06-puerta")], 0, 0.4, 0.4);
      // la puerta se abre (se angosta) y entra uno
      tl.to(q(".s06-puerta"), { scaleX: 0.2, svgOrigin: "200 960", duration: 0.25, ease: "power2.out" }, 0.05);
      tl.fromTo(fig, { x: 260, opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.1);
      tl.to(fig, { x: 520, duration: VINO + 0.5, ease: "power1.out" }, 0.1);
      tl.fromTo(fig.querySelector("path"), { rotation: -5, svgOrigin: "0 1060" }, { rotation: 5, svgOrigin: "0 1060", duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0.1);

      // "no volvió": se da vuelta, se va y la puerta se cierra

      tl.to(q(".s06-puerta"), { scaleX: 0.2, svgOrigin: "200 960", duration: 0.25, ease: "power2.out" }, NO);
      tl.to(fig, { x: 260, duration: 0.75, ease: "power1.in" }, NO);
      tl.fromTo(fig.querySelector("path"), { rotation: 5, svgOrigin: "0 1060" }, { rotation: -5, svgOrigin: "0 1060", duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, NO);
