  <script>
    (function () {
      const ID = "s08-miedo";
      const DUR = 4.43;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const MIEDO = 1.1;     // rayo global 31.75 = 1.05 relativo
      const NO = 1.4;
      const CERRAR = 1.7;
      const ES = 2.1;
      const DIEZ = 2.8;
      const ANIOS = 3.2;

      const SUELO = 1180;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // ---------- arranque: local y cartel ya en el cuadro 0 ----------
      gsap.set(q(".s08-local"), { x: 540, y: SUELO });
      tl.fromTo(q(".s08-local-in"), { scaleY: 0.86, transformOrigin: "50% 100%" }, { scaleY: 1, transformOrigin: "50% 100%", duration: 0.45, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".s08-suelo"), { scaleX: 0.6, svgOrigin: "540 1180" }, { scaleX: 1, svgOrigin: "540 1180", duration: 0.5, ease: "power3.out" }, 0);
      // el cartel entra cayendo y se hamaca
      tl.fromTo(q(".s08-colgante"), { y: -40, rotation: 14, svgOrigin: "540 620" }, { y: 0, rotation: -8, svgOrigin: "540 620", duration: 0.45, ease: "back.out(2)" }, 0);
      tl.to(q(".s08-colgante"), { rotation: 6, svgOrigin: "540 620", duration: 0.32, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.45);
      // los brazos se mecen y las pupilas miran a los costados
      tl.fromTo(qa(".s08-brazo"), { y: -6 }, { y: 8, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.1);
      tl.fromTo(qa(".s08-pupila"), { x: -6 }, { x: 6, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.1);
      qa(".s08-x").forEach((el) => gsap.set(el, { opacity: 0 }));
      gsap.set(qa(".s08-tela"), { opacity: 1 });
      gsap.set(q(".s08-arana"), { opacity: 0 });
      gsap.set(q(".s08-cal"), { opacity: 0 });

      // ---------- "miedo": rayo, la pantalla tiembla, las pupilas se achican ----------
      const tem = q(".s08-temblor");
      [[-18, 8], [16, -10], [-12, 6], [10, -4], [-6, 2]].forEach(([x, y], i) => tl.to(tem, { x, y, duration: 0.04, ease: "none" }, MIEDO - 0.05 + i * 0.045));
      tl.to(tem, { x: 0, y: 0, duration: 0.06, ease: "power2.out" }, MIEDO + 0.18);
      tl.to(qa(".s08-pupila"), { scale: 0.45, x: 0, transformOrigin: "50% 50%", duration: 0.12, ease: "power3.out" }, MIEDO);
      tl.to(q(".s08-colgante"), { rotation: -16, svgOrigin: "540 620", duration: 0.18, ease: "power3.out" }, MIEDO);
      tl.to(q(".s08-colgante"), { rotation: 10, svgOrigin: "540 620", duration: 0.3, ease: "sine.inOut" }, MIEDO + 0.18);
      tl.to(q(".s08-local-in"), { scaleX: 0.94, scaleY: 1.06, transformOrigin: "50% 100%", duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, MIEDO);
      tl.fromTo(q(".s08-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, NO);

      // ---------- "cerrar": X naranja y el cartel se corta y cae ----------
      dibujar(qa(".s08-x"), CERRAR - 0.08, 0.18);
      tl.to(q(".s08-colgante"), { rotation: 0, svgOrigin: "540 620", duration: 0.12, ease: "power2.out" }, CERRAR - 0.1);
      tl.to(q(".s08-hilo"), { opacity: 0, duration: 0.05 }, ES - 0.15);
      tl.to(q(".s08-colgante"), { y: 520, rotation: 28, svgOrigin: "540 760", opacity: 0, duration: 0.42, ease: "power3.in" }, ES - 0.12);

      // ---------- "pasar diez años": el calendario corre 2026 -> 2036 ----------
      tl.fromTo(q(".s08-cal"), { opacity: 0, scale: 0.6, svgOrigin: "540 712" }, { opacity: 1, scale: 1, svgOrigin: "540 712", duration: 0.35, ease: "back.out(2)" }, ES + 0.2);
      const anios = qa(".s08-anio");
      tl.set(anios[0], { opacity: 1 }, ES + 0.2);
      // arranca lento y se acelera hasta "años"
      const T = [2.62, 2.8, 2.92, 3.0, 3.06, 3.11, 3.15, 3.19, 3.23, 3.28];
      T.forEach((t, k) => {
        tl.set(anios[k], { opacity: 0 }, t);
        tl.set(anios[k + 1], { opacity: 1 }, t);
        tl.fromTo(anios[k + 1], { y: -14 }, { y: 0, duration: 0.05, ease: "none", immediateRender: false }, t);
      });
      // la hoja tiembla mientras corre
      tl.to(q(".s08-cal"), { rotation: 3, svgOrigin: "540 618", duration: 0.06, ease: "none", yoyo: true, repeat: 7 }, 2.8);
      // 2036: golpe naranja con brillo
      tl.fromTo(q(".s08-cal"), { scale: 1.18, rotation: 0, svgOrigin: "540 712" }, { scale: 1, rotation: -4, svgOrigin: "540 712", duration: 0.4, ease: "back.out(2.5)", immediateRender: false }, 3.28);
      tl.fromTo(anios[10], { filter: "drop-shadow(0 0 0px #ff7a1a)" }, { filter: "drop-shadow(0 0 14px #ff7a1a)", duration: 0.3, ease: "power2.out", immediateRender: false }, 3.28);

      // ---------- el local envejece ----------
      // se le cae el cartel "TU LOCAL"
      tl.to(q(".s08-cartel"), { rotation: 18, transformOrigin: "100% 50%", duration: 0.25, ease: "power2.in" }, DIEZ);
      tl.to(q(".s08-cartel"), { y: 260, rotation: 70, opacity: 0, transformOrigin: "100% 50%", duration: 0.5, ease: "power3.in" }, DIEZ + 0.3);
      // telarañas en las esquinas y una araña que baja
      dibujar(qa(".s08-tela-l"), DIEZ + 0.05, 0.4);
      dibujar(qa(".s08-tela-r"), DIEZ + 0.15, 0.4);
      tl.to(q(".s08-arana"), { opacity: 1, duration: 0.05 }, ANIOS);
      tl.fromTo(q(".s08-arana"), { y: -50, scaleY: 1 }, { y: 0, duration: 0.5, ease: "bounce.out" }, ANIOS);
      // se encorva, los brazos se caen, los ojos se apagan
      tl.to(q(".s08-local-in"), { rotation: 4, scaleY: 0.93, transformOrigin: "50% 100%", duration: 0.6, ease: "power2.inOut" }, DIEZ + 0.1);
      tl.to(qa(".s08-brazo"), { y: 30, opacity: 0.5, duration: 0.6, ease: "power2.inOut" }, DIEZ + 0.1);
      tl.to(qa(".s08-ojo"), { opacity: 0.45, duration: 0.5 }, DIEZ + 0.2);
      tl.to(qa(".s08-pupila"), { scale: 1, y: 6, transformOrigin: "50% 50%", duration: 0.4 }, DIEZ + 0.2);
      dibujar(qa(".s08-grieta"), ANIOS - 0.1, 0.35);
      // sigue hundiéndose despacio hasta el final (nada quieto)
      tl.to(q(".s08-local-in"), { rotation: 6, scaleY: 0.9, transformOrigin: "50% 100%", duration: DUR - 3.4, ease: "sine.inOut" }, 3.4);
      tl.to(q(".s08-cal"), { y: 10, duration: DUR - 3.7, ease: "sine.inOut" }, 3.7);

      tl.to(q(".s08-e1"), { opacity: 0, duration: 0.15 }, DIEZ - 0.15);
      tl.fromTo(q(".s08-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, DIEZ);
      tl.to(q(".s08-e2"), { scale: 1.1, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 3.28);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
