  <script>
    (function () {
      const ID = "s12-halloween";
      const DUR = 3.08;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const HALLOWEEN = 0.25;
      const RAYO = 1.2; // 51.15 global
      const ZOMBIS = 1.25;
      const DISFRACES = 2.05;

      const SUELO = 1110;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // calabaza: arranca medio dibujada (el primer cuadro no puede estar vacío)
      gsap.set(q(".s12-cala"), { x: 540, y: SUELO - 176 });
      dibujar(qa(".s12-dib"), 0, 0.4, 0.5);
      tl.fromTo(q(".s12-suelo"), { scaleX: 0.5, svgOrigin: "540 1110" }, { scaleX: 1, svgOrigin: "540 1110", duration: 0.6, ease: "power3.out" }, 0);

      // "Halloween": se enciende con golpe (relleno naranja + cara verde que parpadea como vela)
      const rel = q(".s12-relleno"), cara = q(".s12-cara");
      gsap.set([rel, cara], { opacity: 0 });
      tl.to(rel, { opacity: 1, duration: 0.08 }, HALLOWEEN);
      tl.to(cara, { opacity: 1, duration: 0.03 }, HALLOWEEN + 0.04);
      tl.to(cara, { opacity: 0.2, duration: 0.03 }, HALLOWEEN + 0.1);
      tl.to(cara, { opacity: 1, duration: 0.03 }, HALLOWEEN + 0.16);
      tl.to(cara, { opacity: 0.4, duration: 0.03 }, HALLOWEEN + 0.24);
      tl.to(cara, { opacity: 1, duration: 0.04 }, HALLOWEEN + 0.3);
      tl.fromTo(q(".s12-cala-in"), { scale: 0.88, transformOrigin: "50% 100%" }, { scale: 1, transformOrigin: "50% 100%", duration: 0.45, ease: "back.out(2.6)", immediateRender: false }, HALLOWEEN);
      tl.fromTo(q(".s12-cala-in"), { rotation: -3, transformOrigin: "50% 100%" }, { rotation: 3, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, HALLOWEEN + 0.45);
      tl.fromTo(q(".s12-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, HALLOWEEN);

      // murciélagos: salen de atrás de la calabaza y se abren hacia los costados
      const VUELOS = [
        [[180, 650], 0.35, 1.0], [[900, 630], 0.42, 1.1], [[120, 860], 0.5, 0.85],
        [[960, 830], 0.58, 0.9], [[560, 610], 0.66, 0.75],
      ];
      qa(".s12-mur").forEach((m, i) => {
        const [b, t0, s] = VUELOS[i];
        gsap.set(m, { opacity: 0 });
        tl.fromTo(m, { x: 540, y: 900, scale: 0.2, opacity: 1 }, { x: b[0], y: b[1], scale: s, duration: 0.7, ease: "power2.out", immediateRender: false }, t0);
        tl.to(m, { x: b[0] + (b[0] < 540 ? 50 : -50), y: b[1] - 30, duration: 1.4, ease: "sine.inOut" }, t0 + 0.7);
        tl.fromTo(m.querySelector(".s12-ala"), { scaleY: 1, transformOrigin: "50% 50%" }, { scaleY: 0.45, duration: 0.1, ease: "sine.inOut", yoyo: true, repeat: 19 }, t0);
      });

      // "zombis": sacudón por el rayo, la calabaza se corre y aparece la figurita disfrazada
      [0, 1, 2, 3].forEach((k) => tl.to(q("#s12-escena"), { x: k % 2 ? -14 : 16, duration: 0.03, ease: "none" }, RAYO + k * 0.035));
      tl.to(q("#s12-escena"), { x: 0, duration: 0.04, ease: "none" }, RAYO + 0.15);
      tl.to(q(".s12-cala"), { x: 330, duration: 0.4, ease: "power3.inOut" }, ZOMBIS - 0.1);
      tl.to(q(".s12-cala-mov"), { scale: 0.72, transformOrigin: "50% 100%", duration: 0.4, ease: "power3.inOut" }, ZOMBIS - 0.1);

      const p = q(".s12-p");
      gsap.set(p, { x: 790, y: SUELO, opacity: 0 });
      tl.to(p, { opacity: 1, duration: 0.04 }, ZOMBIS);
      tl.fromTo(q(".s12-p-in"), { y: 70, scaleY: 0.4, transformOrigin: "50% 100%" }, { y: 0, scaleY: 1, transformOrigin: "50% 100%", duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, ZOMBIS);
      // glitch del zombi
      [0.05, 0.1, 0.15].forEach((d, i) => tl.to(p, { x: 790 + (i % 2 ? -14 : 18), duration: 0.03, ease: "none" }, ZOMBIS + 0.4 + d));
      tl.to(p, { x: 790, duration: 0.03, ease: "none" }, ZOMBIS + 0.6);
      // se mece arrastrando, brazos estirados
      tl.fromTo(q(".s12-p-in"), { rotation: -4, transformOrigin: "50% 100%" }, { rotation: 4, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 2, immediateRender: false }, ZOMBIS + 0.4);
      tl.fromTo(q(".s12-bz"), { scaleX: 0.3, transformOrigin: "100% 50%" }, { scaleX: 1, transformOrigin: "100% 50%", duration: 0.3, ease: "back.out(2)", immediateRender: false }, ZOMBIS + 0.1);
      gsap.set([q(".s12-bf"), q(".s12-bolsa"), q(".s12-sonrisa")], { opacity: 0 });

      // "disfraces": se saca la máscara y es una persona feliz con su bolsa de compras
      tl.to(q(".s12-mascara"), { y: -40, x: 22, rotation: 50, opacity: 0, transformOrigin: "50% 50%", duration: 0.45, ease: "power2.out" }, DISFRACES);
      tl.to(q(".s12-bz"), { opacity: 0, duration: 0.1 }, DISFRACES + 0.05);
      tl.to([q(".s12-bf"), q(".s12-sonrisa")], { opacity: 1, duration: 0.1 }, DISFRACES + 0.08);
      tl.fromTo(q(".s12-bolsa"), { opacity: 0, scale: 0.4, transformOrigin: "50% 0%" }, { opacity: 1, scale: 1, transformOrigin: "50% 0%", duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, DISFRACES + 0.12);
      tl.to(q(".s12-p-in"), { rotation: 0, duration: 0.1 }, DISFRACES);
      tl.to(q(".s12-p-in"), { y: -18, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, DISFRACES + 0.12);
      tl.fromTo(q(".s12-bolsa"), { rotation: -14 }, { rotation: 12, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 2, transformOrigin: "50% 0%", immediateRender: false }, DISFRACES + 0.45);

      // salida
      tl.to(q("#s12-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
