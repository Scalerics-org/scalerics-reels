  <script>
    (function () {
      const ID = "s06-once";
      const DUR = 3.68;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const ONCE = 0.28;
      const CLIENTE = 1.58;
      const QUIERE = 1.68;
      const COMPRAR = 2.18;
      const ESTA = 3.02;
      const CERRADO = 3.18;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // cuadro 0: la luna ya está y sube, el local dormido emerge, el celular se dibuja
      tl.fromTo(q(".s06-luna"), { y: 50, scale: 0.8, svgOrigin: "840 700" }, { y: 0, scale: 1, svgOrigin: "840 700", duration: 0.6, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s06-luna"), { rotation: -8 }, { rotation: 6, svgOrigin: "840 700", duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s06-nube1"), { x: -40, opacity: 0.4 }, { x: 60, opacity: 1, duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s06-nube2"), { x: 40, opacity: 0.4 }, { x: -50, opacity: 1, duration: DUR, ease: "none" }, 0);
      dibujar(qa(".s06-dib"), 0, 0.5, 0.4);
      tl.fromTo(q(".s06-txt"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.2);
      tl.fromTo(q(".s06-btn"), { opacity: 0, scale: 0.85, svgOrigin: "305 1118" }, { opacity: 1, scale: 1, svgOrigin: "305 1118", duration: 0.35, ease: "back.out(1.6)" }, 0.15);
      gsap.set(q(".s06-btn-g"), { opacity: 0 });
      gsap.set(q(".s06-nodisp"), { opacity: 0 });

      gsap.set(q(".s06-local"), { x: 780, y: 1180 });
      tl.fromTo(q(".s06-local-in"), { y: 120, scaleY: 0.7, opacity: 0.4, transformOrigin: "50% 100%" }, { y: 0, scaleY: 1, opacity: 1, transformOrigin: "50% 100%", duration: 0.45, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s06-suelo"), { scaleX: 0.5, svgOrigin: "780 1180" }, { scaleX: 1, svgOrigin: "780 1180", duration: 0.5, ease: "power3.out" }, 0);
      // respira dormido
      tl.to(q(".s06-local-in"), { scaleY: 0.96, transformOrigin: "50% 100%", duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0.5);
      tl.fromTo(qa(".s06-brazo"), { rotation: -3, transformOrigin: "50% 0%" }, { rotation: 3, transformOrigin: "50% 0%", duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0.5);

      // Zzz que suben en olas (finitas)
      qa(".s06-z").forEach((z, i) => {
        gsap.set(z, { opacity: 0 });
        [0.7, 1.9, 3.0].forEach((t0) => {
          tl.fromTo(z, { opacity: 0, y: 20, x: 0 }, { opacity: 1, y: -10, x: 8, duration: 0.35, ease: "power2.out" }, t0 + i * 0.12);
          tl.to(z, { opacity: 0, y: -40, duration: 0.35, ease: "power2.in" }, t0 + 0.55 + i * 0.12);
        });
      });

      // "once": 22:59 salta a 23:00 con glitch
      const h1 = q(".s06-h1"), h2 = q(".s06-h2");
      tl.fromTo(h1, { opacity: 0, y: 20 }, { opacity: 0.55, y: 0, duration: 0.2, ease: "power3.out" }, 0);
      gsap.set(h2, { opacity: 0 });
      tl.set(h1, { opacity: 0 }, ONCE);
      tl.set(h2, { opacity: 1 }, ONCE);
      tl.fromTo(q(".s06-reloj"), { scale: 1.35, svgOrigin: "300 680" }, { scale: 1, svgOrigin: "300 680", duration: 0.35, ease: "back.out(3)" }, ONCE);
      [0.05, 0.09, 0.13].forEach((d, i) => tl.to(q(".s06-reloj"), { x: i % 2 ? -16 : 18, duration: 0.03, ease: "none" }, ONCE + 0.3 + d));
      tl.to(q(".s06-reloj"), { x: 0, duration: 0.03, ease: "none" }, ONCE + 0.46);
      tl.to(h2, { opacity: 0.6, duration: 0.1, yoyo: true, repeat: 3 }, 1.0);
      tl.fromTo(q(".s06-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, ONCE);

      // el cliente quiere comprar: el dedo entra y toca
      const dedo = q(".s06-dedo");
      gsap.set(dedo, { opacity: 0 });
      gsap.set(q(".s06-onda"), { opacity: 0 });
      tl.fromTo(dedo, { opacity: 0, x: 150, y: 120 }, { opacity: 1, x: 0, y: 0, duration: 0.35, ease: "power3.out" }, CLIENTE);
      tl.to(dedo, { x: -8, y: -8, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 1 }, QUIERE + 0.2);
      // toque en "comprar"
      tl.fromTo(q(".s06-btn"), { scale: 1, svgOrigin: "305 1118" }, { scale: 0.9, svgOrigin: "305 1118", duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, COMPRAR);
      tl.fromTo(q(".s06-onda"), { opacity: 1, scale: 0.6, svgOrigin: "305 1118" }, { opacity: 0, scale: 2.6, svgOrigin: "305 1118", duration: 0.45, ease: "power2.out" }, COMPRAR);
      // y no pasa nada: el botón se apaga, glitch
      tl.to(q(".s06-btn-g"), { opacity: 1, duration: 0.06 }, COMPRAR + 0.25);
      tl.to(q(".s06-btn-v"), { opacity: 0, duration: 0.06 }, COMPRAR + 0.25);
      [0.27, 0.31, 0.35].forEach((d, i) => tl.to(q(".s06-tel"), { x: i % 2 ? -14 : 16, duration: 0.03, ease: "none" }, COMPRAR + d));
      tl.to(q(".s06-tel"), { x: 0, duration: 0.03, ease: "none" }, COMPRAR + 0.39);
      tl.to(q(".s06-nodisp"), { opacity: 1, duration: 0.2 }, COMPRAR + 0.3);
      tl.to(dedo, { y: 30, x: 30, opacity: 0.0, duration: 0.4, ease: "power2.in" }, COMPRAR + 0.45);
      // el dedo insiste
      tl.to(q(".s06-tel"), { rotation: -2, svgOrigin: "305 1200", duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3 }, COMPRAR + 0.5);

      // "cerrado": cae el cartel y se balancea
      const cartel = q(".s06-cerrado");
      gsap.set(cartel, { opacity: 0 });
      tl.to(cartel, { opacity: 1, duration: 0.04 }, ESTA - 0.12);
      tl.fromTo(cartel, { y: -320 }, { y: 0, duration: 0.3, ease: "bounce.out" }, ESTA - 0.12);
      tl.fromTo(cartel, { rotation: 14, svgOrigin: "780 1040" }, { rotation: -10, svgOrigin: "780 1040", duration: 0.16, ease: "sine.inOut" }, CERRADO);
      tl.to(cartel, { rotation: 6, svgOrigin: "780 1040", duration: 0.16, ease: "sine.inOut" }, CERRADO + 0.16);
      tl.to(cartel, { rotation: -3, svgOrigin: "780 1040", duration: 0.16, ease: "sine.inOut" }, CERRADO + 0.32);
      tl.fromTo(q(".s06-local"), { x: 780 }, { x: 788, duration: 0.04, ease: "none", yoyo: true, repeat: 3 }, CERRADO);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
