<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 760px 1150px at 540px 900px, rgba(6, 4, 11, 0) 55%, rgba(6, 4, 11, 0.75) 100%); }
    [data-composition-id="ambiente"] .amb-niebla { position: absolute; border-radius: 50%; filter: blur(60px); }
    [data-composition-id="ambiente"] .amb-chispa { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #ff7a1a; }
    [data-composition-id="ambiente"] .amb-rayo { position: absolute; inset: 0; background: #e6dcff; opacity: 0; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="59.21">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="59.21" data-track-index="0">
      <!-- niebla violeta que se arrastra por abajo -->
      <div class="amb-niebla amb-n1" style="left:-200px; top:1380px; width:900px; height:360px; background:rgba(155,92,255,0.22);"></div>
      <div class="amb-niebla amb-n2" style="left:420px; top:1450px; width:900px; height:320px; background:rgba(155,92,255,0.16);"></div>
      <div class="amb-niebla amb-n3" style="left:100px; top:1600px; width:1000px; height:300px; background:rgba(120,70,220,0.20);"></div>
      <!-- chispas naranjas que suben -->
      <div class="amb-chispa"></div><div class="amb-chispa"></div><div class="amb-chispa"></div><div class="amb-chispa"></div>
      <div class="amb-chispa"></div><div class="amb-chispa"></div><div class="amb-chispa"></div><div class="amb-chispa"></div>
      <div class="amb-chispa"></div><div class="amb-chispa"></div><div class="amb-chispa"></div><div class="amb-chispa"></div>
      <div class="amb-vineta"></div>
      <!-- rayos: un flash en los golpes del guion -->
      <div class="amb-rayo"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 59.21;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // la niebla va y viene despacio todo el video
      [[".amb-n1", 160, 9], [".amb-n2", -180, 11], [".amb-n3", 120, 13]].forEach(([s, dx, per]) => {
        tl.fromTo(q(s), { x: 0 }, { x: dx, duration: per, ease: "sine.inOut", yoyo: true, repeat: Math.floor(DUR / per) - 1 }, 0);
      });

      // chispas: posiciones fijas (nada de Math.random), cada una sube y se apaga en su ciclo
      const X = [90, 210, 330, 470, 600, 720, 860, 980, 150, 540, 790, 930];
      qa(".amb-chispa").forEach((c, i) => {
        const per = 5 + (i % 4) * 1.3;
        const t0 = (i * 0.83) % per;
        gsap.set(c, { x: X[i], y: 1900, opacity: 0, scale: 0.6 + (i % 3) * 0.25 });
        tl.fromTo(c, { y: 1900 }, { y: 1100 - (i % 5) * 60, duration: per, ease: "none", repeat: Math.floor((DUR - t0) / per) - 1 }, t0);
        tl.fromTo(c, { opacity: 0 }, { opacity: 0.7, duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: Math.floor((DUR - t0) / (per / 2)) - 1 }, t0);
        tl.fromTo(c, { xPercent: -120 }, { xPercent: 120, duration: per / 3, ease: "sine.inOut", yoyo: true, repeat: Math.floor((DUR - t0) / (per / 3)) - 1 }, t0);
      });

      // rayos (segundos globales): "muerto", "zombi", "miedo", "pulso", "zombis"
      const RAYOS = [0.95, 2.95, 31.75, 41.35, 51.15];
      const rayo = q(".amb-rayo");
      RAYOS.forEach((t) => {
        tl.to(rayo, { opacity: 0.5, duration: 0.04 }, t);
        tl.to(rayo, { opacity: 0.05, duration: 0.08 }, t + 0.05);
        tl.to(rayo, { opacity: 0.32, duration: 0.04 }, t + 0.15);
        tl.to(rayo, { opacity: 0, duration: 0.35, ease: "power2.out" }, t + 0.2);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
