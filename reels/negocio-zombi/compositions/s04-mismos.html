    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s04-mismos"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

    [data-composition-id="s04-mismos"] .s04-z { font-family: "Lexend", sans-serif; font-weight: 700; fill: #9b5cff; }

    [data-composition-id="s04-mismos"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s04-mismos" data-width="1080" data-height="1920" data-duration="6.26">
    <div id="s04-escena" class="s04-capa clip" data-start="0" data-duration="6.26" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <line class="ln s04-suelo" x1="80" y1="1190" x2="1000" y2="1190" />
        <!-- la ronda: la pista donde dan vueltas los de siempre -->
        <ellipse class="ln-tenue s04-pista" cx="790" cy="1112" rx="185" ry="58" />
        <path class="ln-nar s04-flecha" d="M815 1172 H763 M779 1158 L763 1172 L779 1186" />
        <path class="ln-nar s04-flecha" d="M765 1054 H817 M801 1040 L817 1054 L801 1068" />

        <!-- los mismos clientes de siempre -->
        <g class="s04-fig"><g class="s04-fig-pop"><g class="s04-fig-cam">
          <circle class="cabeza" cx="0" cy="-98" r="17" />
          <path class="ln" d="M0 -78 V-34 M0 -34 L-16 0 M0 -34 L16 0 M-22 -66 L0 -58 L22 -66" />
        </g></g></g>
        <g class="s04-fig"><g class="s04-fig-pop"><g class="s04-fig-cam">
          <circle class="cabeza" cx="0" cy="-98" r="17" />
          <path class="ln" d="M0 -78 V-34 M0 -34 L-16 0 M0 -34 L16 0 M-22 -66 L0 -58 L22 -66" />
        </g></g></g>
        <g class="s04-fig"><g class="s04-fig-pop"><g class="s04-fig-cam">
          <circle class="cabeza" cx="0" cy="-98" r="17" />
          <path class="ln" d="M0 -78 V-34 M0 -34 L-16 0 M0 -34 L16 0 M-22 -66 L0 -58 L22 -66" />
        </g></g></g>
        <g class="s04-fig"><g class="s04-fig-pop"><g class="s04-fig-cam">
          <circle class="cabeza" cx="0" cy="-98" r="17" />
          <path class="ln" d="M0 -78 V-34 M0 -34 L-16 0 M0 -34 L16 0 M-22 -66 L0 -58 L22 -66" />
        </g></g></g>

        <!-- EL LOCAL ZOMBI -->
        <g class="s04-local">
          <g class="s04-local-in"><g transform="scale(0.9)">
            <path class="ln-ver s04-brazo" d="M-120 -100 H-250 M-250 -100 l-22 -14 M-250 -100 l-26 0 M-250 -100 l-22 14" />
            <path class="ln-ver s04-brazo" d="M120 -100 H250 M250 -100 l22 -14 M250 -100 l26 0 M250 -100 l22 14" />
            <path class="ln" d="M-120 0 V-170 H120 V0" />
            <path class="ln" d="M-142 -166 L138 -178 L118 -228 L-124 -218 Z" />
            <path class="ln" d="M-142 -166 q17.5 26 35 -1 q17.5 26 35 -2 q17.5 26 35 -1 q17.5 26 35 -2 q17.5 26 35 -1 q17.5 26 35 -2 q17.5 26 35 -1 q17.5 26 35 -2" />
            <rect class="ln" x="-80" y="-296" width="160" height="50" rx="10" transform="rotate(-6 0 -271)" />
            <text class="cartel" data-layout-ignore x="0" y="-263" text-anchor="middle" transform="rotate(-6 0 -271)">TU LOCAL</text>
            <rect class="ln" x="-100" y="-130" width="62" height="56" rx="6" />
            <rect class="ln" x="38" y="-124" width="62" height="50" rx="6" />
            <rect class="ojo" x="-92" y="-122" width="46" height="40" rx="4" />
            <rect class="ojo" x="46" y="-116" width="46" height="34" rx="4" />
            <circle class="pupila s04-pupila" cx="-66" cy="-100" r="9" />
            <circle class="pupila s04-pupila" cx="72" cy="-98" r="9" />
            <path class="ln" d="M-30 0 V-60 L-18 -48 L-6 -60 L6 -48 L18 -60 L30 -48 V0" />
          </g></g>

        <!-- "ni se entera": Zzz violeta sobre el zombi -->
        <g class="s04-zzz" style="filter: drop-shadow(0 0 14px #9b5cff);">
          <text class="s04-z s04-z1" x="0" y="0" font-size="44">Z</text>
          <text class="s04-z s04-z2" x="40" y="-46" font-size="58">Z</text>
          <text class="s04-z s04-z3" x="92" y="-104" font-size="72">Z</text>

      <div class="etiqueta"><span class="s04-e1">Los mismos de siempre</span><span class="s04-e2">Ni se entera</span></div>

  </div>
  <script>
    (function () {
      const ID = "s04-mismos";
      const DUR = 6.26;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const ZOMBI = 0.52;
      const MISMOS = 1.72;
      const SIEMPRE = 2.62;
      const SE_VA = 4.12;
      const NI = 4.81;
      const ENTERA = 5.12;

      const SUELO = 1190;
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // ---- el local zombi, a la izquierda ----
      const XL = 270;
      gsap.set(q(".s04-local"), { x: XL, y: SUELO });
      tl.fromTo(q(".s04-local-in"), { y: 40, scaleY: 0.85, transformOrigin: "50% 100%" }, { y: 0, scaleY: 1, transformOrigin: "50% 100%", duration: 0.4, ease: "back.out(1.7)" }, 0);
      dibujar([q(".s04-suelo")], 0, 0.5, 0.45);
      // "zombi": glitch seco
      [0.0, 0.05, 0.1].forEach((d, i) => tl.to(q(".s04-local"), { x: XL + (i % 2 ? -14 : 16), duration: 0.03, ease: "none" }, ZOMBI + d));
      tl.to(q(".s04-local"), { x: XL, duration: 0.03, ease: "none" }, ZOMBI + 0.14);
      // se balancea como zombi todo el rato (finito)
      tl.fromTo(q(".s04-local-in"), { rotation: -2.5, transformOrigin: "50% 100%" }, { rotation: 2.5, transformOrigin: "50% 100%", duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0.4);
      tl.fromTo(qa(".s04-brazo"), { y: -6 }, { y: 6, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 16 }, 0);
      // las pupilas siguen la ronda mientras la ronda gira
      tl.fromTo(qa(".s04-pupila"), { x: 2 }, { x: 9, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.3);

      // ---- la ronda de los mismos de siempre ----
      const CX = 790, CY = 1112, R = 185, r = 58;
      const Q = SE_VA / 7; // un cuarto de vuelta; en "se va" todos caen justo en un cuadrante
      const punto = (k) => {
        const a = ((k % 4) + 4) % 4;
        return [CX + R * [1, 0, -1, 0][a], CY + r * [0, 1, 0, -1][a]];
      };
      const escala = (y) => 1.0 + 0.3 * ((y - (CY - r)) / (2 * r)); // atrás más chicos
      dibujar([q(".s04-pista")], 0.05, 0.6);
      dibujar(qa(".s04-flecha"), 0.4, 0.3);
      tl.fromTo(qa(".s04-flecha"), { opacity: 1 }, { opacity: 0.45, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.8);

      const figs = qa(".s04-fig");
      const SALE_IDX = 1; // la que en "se va" está a la derecha: (1 + 7) % 4 = 0
      figs.forEach((f, i) => {
        const [x0, y0] = punto(i);
        gsap.set(f, { x: x0, y: y0, scale: escala(y0), transformOrigin: "50% 100%" });
        // entran con pop de a una
        tl.fromTo(f.querySelector(".s04-fig-pop"), { opacity: 0, scale: 0.4, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, transformOrigin: "50% 100%", duration: 0.35, ease: "back.out(2)" }, 0.12 + i * 0.12);
        // caminan: se bambolean
        tl.fromTo(f.querySelector(".s04-fig-cam"), { rotation: -6, transformOrigin: "50% 100%" }, { rotation: 6, transformOrigin: "50% 100%", duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 29 }, 0);
        // vueltas: cuartos con eases seno = movimiento circular exacto
        const vueltas = i === SALE_IDX ? 7 : 11;
        for (let n = 0; n < vueltas; n++) {
          const k = i + n;
          const [xa, ya] = punto(k);
          const [xb, yb] = punto(k + 1);
          const enX = k % 2 === 0; // en x extremo: x arranca lento
          const ex = enX ? "sine.in" : "sine.out";
          const ey = enX ? "sine.out" : "sine.in";
          const t = n * Q;
          tl.fromTo(f, { x: xa }, { x: xb, duration: Q, ease: ex, immediateRender: false }, t);
          tl.fromTo(f, { y: ya, scale: escala(ya) }, { y: yb, scale: escala(yb), transformOrigin: "50% 100%", duration: Q, ease: ey, immediateRender: false }, t);
        }
      });
      // "mismos" y "siempre": la ronda da un saltito todos juntos
      [MISMOS, SIEMPRE].forEach((t) => {
        tl.to(qa(".s04-fig-pop"), { y: -22, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.04 }, t);
      });

      // "se va": una se separa, se va a la derecha y se desvanece
      const sale = figs[SALE_IDX];
      const [xs, ys] = punto(0);
      tl.fromTo(sale, { x: xs, y: ys }, { x: 1070, y: ys + 30, scale: 1.3, transformOrigin: "50% 100%", duration: 1.0, ease: "power1.in", immediateRender: false }, SE_VA);
      tl.to(sale, { opacity: 0, duration: 0.5, ease: "power1.in" }, SE_VA + 0.45);
      // el hueco: la pista se apaga un poco
      tl.to(q(".s04-pista"), { opacity: 0.5, duration: 0.4 }, SE_VA + 0.2);

      // el zombi ni la mira: las pupilas se van arriba a la izquierda y se quedan ahí
      tl.to(qa(".s04-pupila"), { x: -11, y: -9, duration: 0.25, ease: "power2.out", overwrite: false }, SE_VA - 0.1);
      // "ni se entera": Zzz violeta que sube
      const zs = qa(".s04-z");
      gsap.set(q(".s04-zzz"), { x: XL + 50, y: 860 });
      zs.forEach((z, i) => {
        gsap.set(z, { opacity: 0 });
        tl.fromTo(z, { opacity: 0, scale: 0.4, y: 20, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, y: 0, transformOrigin: "50% 100%", duration: 0.3, ease: "back.out(2.2)" }, NI + i * 0.14);
        tl.to(z, { y: -14, rotation: i % 2 ? 8 : -8, transformOrigin: "50% 100%", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 2 }, NI + 0.32 + i * 0.14);
      });
      tl.to(q(".s04-local-in"), { scaleY: 0.94, transformOrigin: "50% 100%", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, ENTERA);

      // etiquetas
      tl.fromTo(q(".s04-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.to(q(".s04-e1"), { opacity: 0, duration: 0.12 }, NI - 0.08);
      tl.fromTo(q(".s04-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, NI);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
