  <script>
    (function () {
      const ID = "s05-whatsapp";
      const DUR = 3.68;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CUANDO = 0.56;
      const ANOTA = 1.46;
      const PEDIDOS = 2.16;
      const CUADERNO = 2.76;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // celular: arranca medio dibujado (cuadro 0 no vacío) con un golpe
      dibujar(qa(".s05-dib"), 0, 0.5, 0.45);
      tl.fromTo(q(".s05-tel-in"), { scale: 0.9, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.45, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".s05-cab"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.1);

      // las burbujas entran volando de a una, apiladas
      qa(".s05-msg").forEach((m, i) => {
        tl.fromTo(m, { opacity: 0, x: -60, rotation: -6, transformOrigin: "0% 50%" }, { opacity: 1, x: 0, rotation: 0, transformOrigin: "0% 50%", duration: 0.3, ease: "back.out(2)" }, 0.08 + i * 0.12);
      });

      // badge: pop y el número que sube con punch
      const nums = qa(".s05-n");
      pop(q(".s05-badge"), 0.05, "700 640");
      const CAMBIOS = [0, 0.55, 1.05, 1.7, 2.25];
      nums.forEach((n, i) => {
        gsap.set(n, { opacity: i === 0 ? 1 : 0 });
        if (i > 0) {
          tl.set(nums[i - 1], { opacity: 0 }, CAMBIOS[i]);
          tl.set(n, { opacity: 1 }, CAMBIOS[i]);
          tl.fromTo(q(".s05-badge"), { scale: 1.3, svgOrigin: "700 640" }, { scale: 1, svgOrigin: "700 640", duration: 0.3, ease: "back.out(3)" }, CAMBIOS[i]);
        }
      });
      // el celular vibra con cada mensaje
      [0.55, 1.05, 1.7, 2.25].forEach((t) => {
        [0, 1, 2, 3].forEach((k) => tl.to(q(".s05-tel"), { x: k === 3 ? 0 : (k % 2 ? -8 : 8), rotation: k === 3 ? 0 : (k % 2 ? -1.2 : 1.2), svgOrigin: "540 910", duration: 0.03, ease: "none" }, t + k * 0.03));
      });

      // la mano zombi entra lenta y a los tirones (cuando puede)
      const mano = q(".s05-mano");
      gsap.set(mano, { opacity: 0, x: 170, y: 170 });
      tl.to(mano, { opacity: 1, duration: 0.15 }, CUANDO - 0.2);
      [[120, 130], [100, 100], [70, 80], [55, 55], [25, 30], [10, 8], [0, 0]].forEach(([x, y], i) => {
        tl.to(mano, { x, y, rotation: i % 2 ? 3 : -3, svgOrigin: "880 1230", duration: 0.12, ease: "power3.out" }, CUANDO - 0.2 + i * 0.13);
      });
      // toca, torpe, y no le pega (el celular sigue sumando)
      tl.to(mano, { x: -12, y: -14, rotation: 0, duration: 0.1, ease: "power2.in" }, ANOTA - 0.05);
      tl.to(mano, { x: 0, y: 0, duration: 0.25, ease: "back.out(2)" }, ANOTA + 0.05);
      tl.to(mano, { x: -10, y: -10, duration: 0.1, ease: "power2.in" }, ANOTA + 0.4);
      tl.to(mano, { x: 6, y: 4, rotation: -4, svgOrigin: "880 1230", duration: 0.3, ease: "sine.inOut" }, ANOTA + 0.5);
      tl.fromTo(q(".s05-manga"), { rotation: -4, svgOrigin: "900 1220" }, { rotation: 4, svgOrigin: "900 1220", duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 7 }, CUANDO);

      tl.fromTo(q(".s05-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, CUANDO);

      // "pedidos": el celular y la mano se van volando a la izquierda
      tl.to(q(".s05-tel"), { x: -560, rotation: -18, svgOrigin: "540 910", opacity: 0, duration: 0.4, ease: "power3.in" }, PEDIDOS + 0.3);
      tl.to(mano, { x: 260, y: 260, opacity: 0, duration: 0.35, ease: "power3.in" }, PEDIDOS + 0.3);

      // "cuaderno": entra volando de la derecha con golpe
      const cuad = q(".s05-cuad");
      gsap.set(cuad, { opacity: 0 });
      tl.to(cuad, { opacity: 1, duration: 0.05 }, CUADERNO - 0.22);
      tl.fromTo(q(".s05-cuad-in"), { x: 620, rotation: 14, transformOrigin: "50% 50%" }, { x: 0, rotation: -3, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(1.5)" }, CUADERNO - 0.22);
      dibujar(qa(".s05-cd"), CUADERNO - 0.22, 0.3, 0.5);
      tl.fromTo(q(".s05-tit"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, CUADERNO - 0.05);
      dibujar(qa(".s05-gar"), CUADERNO, 0.25);
      dibujar(qa(".s05-tach"), CUADERNO + 0.3, 0.2);
      tl.fromTo(q(".s05-mancha"), { opacity: 0, scale: 0.2, svgOrigin: "690 1080" }, { opacity: 0.85, scale: 1, svgOrigin: "690 1080", duration: 0.3, ease: "back.out(2.5)" }, CUADERNO + 0.2);

      // el lápiz entra y tiembla
      const lapiz = q(".s05-lapiz");
      gsap.set(lapiz, { opacity: 0 });
      tl.to(lapiz, { opacity: 1, duration: 0.05 }, CUADERNO - 0.1);
      tl.fromTo(lapiz, { x: 160, y: -120 }, { x: 0, y: 0, duration: 0.3, ease: "back.out(1.6)" }, CUADERNO - 0.1);
      tl.to(lapiz, { x: -50, duration: 0.07, ease: "sine.inOut", yoyo: true, repeat: 7 }, CUADERNO + 0.2);
      tl.to(lapiz, { rotation: 3, svgOrigin: "770 1120", duration: 0.04, ease: "none", yoyo: true, repeat: 11 }, CUADERNO + 0.2);

      tl.to(q(".s05-e1"), { opacity: 0, duration: 0.15 }, CUADERNO - 0.15);
      tl.fromTo(q(".s05-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, CUADERNO);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
