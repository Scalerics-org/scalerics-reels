<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-no-es"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-no-es"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-no-es"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-no-es"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.4); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-no-es"] .ln-nar { fill: none; stroke: #ff7a1a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s03-no-es"] .s03-x { fill: none; stroke: #ff7a1a; stroke-width: 12; stroke-linecap: round; }
    [data-composition-id="s03-no-es"] .s03-murc { fill: #9b5cff; }
    [data-composition-id="s03-no-es"] .s03-tierra { fill: #0d0819; }
    [data-composition-id="s03-no-es"] .s03-palabra { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 38px; letter-spacing: 0.04em; fill: #ff7a1a; }
    [data-composition-id="s03-no-es"] .s03-palabra-ch { font-size: 28px; letter-spacing: 0.02em; }
    [data-composition-id="s03-no-es"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #ff7a1a; }
    [data-composition-id="s03-no-es"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s03-no-es" data-width="1080" data-height="1920" data-duration="3.34">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="3.34" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <defs>
          <!-- todo lo que está bajo tierra no se ve -->
          <clipPath id="s03-sobre-tierra"><rect x="0" y="0" width="1080" height="1180" /></clipPath>
        </defs>
        <!-- murciélagos violetas -->
        <g class="s03-bat"><g class="s03-ala"><path class="s03-murc" d="M0 -8 L-6 -20 L-10 -6 Q-30 -26 -60 -14 Q-48 -4 -46 10 Q-36 2 -28 12 Q-20 4 -12 14 Q-6 6 0 12 Q6 6 12 14 Q20 4 28 12 Q36 2 46 10 Q48 -4 60 -14 Q30 -26 10 -6 L6 -20 Z" /></g></g>
        <g class="s03-bat"><g class="s03-ala"><path class="s03-murc" d="M0 -8 L-6 -20 L-10 -6 Q-30 -26 -60 -14 Q-48 -4 -46 10 Q-36 2 -28 12 Q-20 4 -12 14 Q-6 6 0 12 Q6 6 12 14 Q20 4 28 12 Q36 2 46 10 Q48 -4 60 -14 Q30 -26 10 -6 L6 -20 Z" /></g></g>
        <g class="s03-bat"><g class="s03-ala"><path class="s03-murc" d="M0 -8 L-6 -20 L-10 -6 Q-30 -26 -60 -14 Q-48 -4 -46 10 Q-36 2 -28 12 Q-20 4 -12 14 Q-6 6 0 12 Q6 6 12 14 Q20 4 28 12 Q36 2 46 10 Q48 -4 60 -14 Q30 -26 10 -6 L6 -20 Z" /></g></g>

        <!-- las tres lápidas, recortadas por el suelo -->
        <g clip-path="url(#s03-sobre-tierra)">
          <g class="s03-lap s03-lap1"><g class="s03-lap-in">
            <path class="ln" d="M-105 0 V-190 A105 105 0 0 1 105 -190 V0" />
            <path class="ln-tenue" d="M-60 -70 H60 M-60 -42 H34" />
            <text class="s03-palabra" x="0" y="-150" text-anchor="middle">CRISIS</text>
            <path class="s03-x" d="M-80 -250 L80 -40 M80 -250 L-80 -40" />
          </g></g>
          <g class="s03-lap s03-lap2"><g class="s03-lap-in">
            <path class="ln" d="M-105 0 V-190 A105 105 0 0 1 105 -190 V0" />
            <path class="ln-tenue" d="M-60 -70 H60 M-60 -42 H34" />
            <text class="s03-palabra" x="0" y="-150" text-anchor="middle">BARRIO</text>
            <path class="s03-x" d="M-80 -250 L80 -40 M80 -250 L-80 -40" />
          </g></g>
          <g class="s03-lap s03-lap3"><g class="s03-lap-in">
            <path class="ln" d="M-125 0 V-190 A125 125 0 0 1 125 -190 V0" />
            <path class="ln-tenue" d="M-70 -70 H70 M-70 -42 H40" />
            <text class="s03-palabra s03-palabra-ch" x="0" y="-150" text-anchor="middle">COMPETENCIA</text>
            <path class="s03-x" d="M-95 -260 L95 -40 M95 -260 L-95 -40" />
          </g></g>
        </g>

        <!-- suelo con montículos de tierra -->
        <line class="ln s03-suelo" x1="70" y1="1180" x2="1010" y2="1180" />
        <path class="ln s03-mont" d="M90 1180 q130 -34 260 0" />
        <path class="ln s03-mont" d="M410 1180 q130 -34 260 0" />
        <path class="ln s03-mont" d="M720 1180 q140 -34 280 0" />
        <!-- grietas naranjas cuando se hunden -->
        <path class="ln-nar s03-grieta" d="M220 1180 l-18 20 l12 14 l-16 20" />
        <path class="ln-nar s03-grieta" d="M540 1180 l18 18 l-10 16 l20 20" />
        <path class="ln-nar s03-grieta" d="M860 1180 l-16 18 l14 16 l-18 22" />
        <!-- terrones que saltan -->
        <g class="s03-terrones"></g>
      </svg>
      <div class="etiqueta"><span class="s03-e1">No es eso</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-no-es";
      const DUR = 3.34;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";

      // tiempos (relativos a la escena = palabras de la locución)
      const CRISIS = 0.26;
      const BARRIO = 1.16;
      const COMPETENCIA = 1.86;

      const SUELO = 1180;
      const XS = [220, 540, 860];
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: desde ? 1 : 0 });
          if (!desde) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };

      // el suelo ya está a medio dibujar en el cuadro 0
      dibujar([q(".s03-suelo")], 0, 0.4, 0.5);
      dibujar(qa(".s03-mont"), 0, 0.35, 0.6);
      tl.fromTo(q(".s03-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.1);

      // terrones: piedritas que saltan cuando sale cada lápida (posiciones fijas)
      const terr = q(".s03-terrones");
      const SALTOS = [[-90, -70], [-50, -110], [60, -95], [100, -60], [10, -130]];
      const terrones = XS.map(() => SALTOS.map(() => {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("r", "7"); c.setAttribute("cx", "0"); c.setAttribute("cy", "0");
        c.setAttribute("fill", "#efeee5");
        terr.appendChild(c); gsap.set(c, { opacity: 0 });
        return c;
      }));

      const laps = qa(".s03-lap");
      const xs = qa(".s03-x");
      const grietas = qa(".s03-grieta");
      const SALE = [0, BARRIO - 0.08, COMPETENCIA - 0.08];
      const TACHA = [CRISIS + 0.38, BARRIO + 0.34, COMPETENCIA + 0.42];
      const HUNDE = [BARRIO - 0.2, COMPETENCIA - 0.12, 2.82];

      laps.forEach((g, i) => {
        gsap.set(g, { x: XS[i], y: SUELO + (i === 0 ? 170 : 340) });
        const inn = g.querySelector(".s03-lap-in");
        // emerge de la tierra con rebote y un poco torcida
        tl.to(g, { y: SUELO, duration: 0.42, ease: "back.out(2.2)" }, SALE[i]);
        tl.fromTo(inn, { rotation: i % 2 ? 9 : -9, transformOrigin: "50% 100%" }, { rotation: i === 1 ? 3 : -3, transformOrigin: "50% 100%", duration: 0.5, ease: "elastic.out(1, 0.5)" }, SALE[i] + 0.05);
        terrones[i].forEach((c, k) => {
          const [dx, dy] = SALTOS[k];
          tl.fromTo(c, { x: XS[i], y: SUELO - 4, opacity: 1 }, { x: XS[i] + dx, y: SUELO + dy, duration: 0.22, ease: "power2.out", immediateRender: false }, SALE[i] + 0.02);
          tl.to(c, { y: SUELO - 4, opacity: 0, duration: 0.2, ease: "power2.in" }, SALE[i] + 0.24);
        });
        // X naranja que se tacha encima, con sacudón
        dibujar([xs[i]], TACHA[i], 0.18);
        tl.to(inn, { x: 10, duration: 0.04, ease: "none", yoyo: true, repeat: 5 }, TACHA[i] + 0.18);
        tl.set(xs[i], { filter: "drop-shadow(0 0 12px #ff7a1a)" }, TACHA[i] + 0.18);
        // grieta y se hunde de nuevo
        dibujar([grietas[i]], HUNDE[i] - 0.12, 0.15);
        tl.to(g, { y: SUELO + 360, duration: 0.32, ease: "power3.in" }, HUNDE[i]);
        tl.to(grietas[i], { opacity: 0, duration: 0.25 }, HUNDE[i] + 0.35);
      });
      // los montículos se sacuden cuando sale cada una
      SALE.forEach((t, i) => tl.to(qa(".s03-mont")[i], { y: -10, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, t));
      // al final, la etiqueta da un golpe
      tl.to(q(".s03-e1"), { scale: 1.08, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, 2.82);

      // murciélagos que cruzan aleteando (y entre 640 y 800)
      const VUELOS = [
        [[80, 700], [1160, 640], 0.0, 1.6, 1.0],
        [[1160, 790], [-80, 690], 0.9, 1.7, 0.75],
        [[-80, 660], [1160, 760], 1.9, 1.4, 0.9],
      ];
      qa(".s03-bat").forEach((b, i) => {
        const [a, z, t0, d, s] = VUELOS[i];
        gsap.set(b, { x: a[0], y: a[1], scale: s, opacity: 0 });
        if (i === 0) gsap.set(b, { opacity: 1 }); else tl.to(b, { opacity: 1, duration: 0.05 }, t0);
        tl.fromTo(b, { x: a[0], y: a[1] }, { x: z[0], y: z[1], duration: d, ease: "none" }, t0);
        tl.fromTo(b.querySelector(".s03-ala"), { scaleY: 1, transformOrigin: "50% 30%" }, { scaleY: 0.4, transformOrigin: "50% 30%", duration: 0.1, ease: "sine.inOut", yoyo: true, repeat: Math.round(d / 0.1) | 1 }, t0);
      });

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
