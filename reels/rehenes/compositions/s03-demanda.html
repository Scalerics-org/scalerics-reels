    (function () {
      const ID = "s03-demanda";
      const DUR = 7.44;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // golpe: la palabra cae de grande a su lugar, EN la palabra
      const golpe = (el, t, s = 2.6) => {
        el = typeof el === "string" ? q(el) : el;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      // pop: aparece con rebote
      const pop = (el, t, d = 0.32, extra = {}) => {
        el = typeof el === "string" ? qa(el) : el;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      // entra desde un lado (dx, dy)
      const entra = (el, t, dx = 0, dy = 120, d = 0.35) => {
        el = typeof el === "string" ? qa(el) : el;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, x: dx, y: dy }, { opacity: 1, x: 0, y: 0, duration: d, ease: "power3.out", immediateRender: false }, t);
      };
      const sale = (el, t, d = 0.2) => tl.to(typeof el === "string" ? qa(el) : el, { opacity: 0, duration: d }, t);
      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      // dibujar: el trazo se dibuja solo (opacity 0 hasta que arranca: sin puntitos de los caps)
      const dibujar = (el, t, d = 0.5) => {
        for (const e of typeof el === "string" ? qa(el) : [].concat(el)) {
          const L = e.getTotalLength();
          gsap.set(e, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
          tl.set(e, { opacity: 1 }, t);
          tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
        }
      };
      // hablar: la boca se abre y cierra entre t0 y t1 (sin repeat infinito)
      const hablar = (el, t0, t1, min = 0.25, paso = 0.13) => {
        el = typeof el === "string" ? q(el) : el;
        const n = Math.max(1, Math.round((t1 - t0) / (paso * 2)));
        tl.fromTo(el, { scaleY: 1 }, { scaleY: min, duration: paso, yoyo: true, repeat: n * 2 - 1, ease: "sine.inOut", transformOrigin: "50% 50%", immediateRender: false }, t0);

      // parpadeo de ojos
      const parpadeo = (el, t) => tl.to(typeof el === "string" ? qa(el) : el, { scaleY: 0.1, duration: 0.06, yoyo: true, repeat: 1, ease: "none", transformOrigin: "50% 50%" }, t);

const MEDIA = 1.9, PASAME = 3.0, CUARENTA = 3.6, UNO = 5.86, POR = 6.43, UNO2 = 6.6;
      tl.fromTo(ESC, { scale: 1.05 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 45%" }, 0);
      // la planilla aparece de golpe, como pantalla que se enciende

      hablar(".s03-pl-boca", 0.05, 2.7, 0.2);
      hablar(".s03-pl-boca", 3.0, 5.3, 0.2);
      hablar(".s03-pl-boca", 5.86, 7.0, 0.15, 0.2);
      tl.to(qa(".s03-pl-pupila"), { x: 22, duration: 0.3, ease: "power2.inOut" }, 0.8);
      tl.to(qa(".s03-pl-pupila"), { x: -22, duration: 0.3, ease: "power2.inOut" }, 3.1);
      tl.to(qa(".s03-pl-pupila"), { x: 0, duration: 0.3, ease: "power2.inOut" }, 5.6);
      parpadeo(".s03-pl-ojo", 2.6);
      tl.to(qa(".s03-pl-ceja"), { y: -10, duration: 0.12, yoyo: true, repeat: 1 }, MEDIA);
      // medianoche: reloj rojo
      pop(".s03-reloj", MEDIA - 0.05, 0.3);
      tl.to(q(".s03-reloj"), { opacity: 0.35, duration: 0.12, yoyo: true, repeat: 3, ease: "steps(1)" }, MEDIA + 0.4);
      tl.to(q(".s03-reloj"), { opacity: 0, y: -40, duration: 0.2 }, PASAME + 0.4);
      // pasame los cuarenta pedidos: burbujas que vuelan a la planilla
      qa(".s03-b").forEach((b, i) => {
        const t = PASAME + i * 0.22;
        tl.fromTo(b, { opacity: 0, x: (i % 2 ? 200 : -200), y: 0, scale: 1, transformOrigin: "50% 50%" }, { opacity: 1, x: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, t);
        tl.to(b, { x: (i % 2 ? -220 : 220), y: -280, scale: 0.25, opacity: 0, duration: 0.4, ease: "power2.in" }, t + 0.25);
      });
      gsap.set(qa(".s03-b"), { opacity: 0 });
      golpe(".s03-cuarenta", CUARENTA, 2.4);
      sacudon(CUARENTA + 0.05);
      // uno por uno: las celdas se llenan de a una
      golpe(".s03-u1", UNO, 2);
      golpe(".s03-u2", POR, 2);
      golpe(".s03-u3", UNO2 + 0.05, 2);
      qa(".s03-llena").forEach((c, i) => tl.to(c, { opacity: 0.85, duration: 0.05 }, [UNO, POR, UNO2 + 0.05][i]));
      tl.to(qa(".s03-u3"), { color: "#ffd60a", duration: 0.1 }, UNO2 + 0.3);

      // salida: barrido con blur
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
