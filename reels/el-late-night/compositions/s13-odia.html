    (function () {
      const ID = "s13-odia";
      const DUR = 7.09;

      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = ".s13-escenario";
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(ESC), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const pop = (sel, t, extra = {}) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 0.7, ...extra }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      const entra = (sel, t, desde = { x: -600 }) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, t);
      };
      const dibujar = (sel, t, d = 0.5) => qa(sel).forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // vaivén suave (respira) de t a t+d
      const respira = (sel, t, d, dy = 8, per = 0.5) => tl.fromTo(q(sel), { y: 0 }, { y: dy, duration: per, yoyo: true, repeat: Math.max(1, Math.round(d / per) | 1), ease: "sine.inOut", immediateRender: false }, t);
      // X roja gigante que cae (dos trazos que se dibujan + golpe)
      const equis = (sel, t) => { golpe(sel, t, 2.2); sacudon(t + 0.04, 1.1); };
      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.4, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);
      // zoom de cámara sobre el escenario (punch-in)
      const zoom = (t, s, d = 0.35, ox = "50%", oy = "50%") => tl.to(q(ESC), { scale: s, transformOrigin: ox + " " + oy, duration: d, ease: "power3.out" }, t);

      const EMPLEADO = 0.80, ODIA = 1.52, ME = 2.50, AHORA = 3.64, TRANQUILO = 4.22, CELULAR = 5.59, YO = 6.31;

      tl.fromTo(q(".s13-mano"), { rotation: 0, svgOrigin: "300 470" }, { rotation: -10, svgOrigin: "300 470", duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, 0.1);
      pop(".s13-emp", EMPLEADO - 0.1, { transformOrigin: "50% 50%" });
      golpe(".s13-odia", ODIA, 2.2);
      sacudon(ODIA + 0.04, 0.9);
      // el agente: "me odiaba"
      tl.set(q(".s13-uno"), { opacity: 0 }, ME - 0.15);
      gsap.set([q(".s13-dos"), q(".s13-tres")], { opacity: 0 });
      tl.set(q(".s13-dos"), { opacity: 1 }, ME - 0.15);
      habla(".s13-ag-boca", ME, 0.6, "180 260");
      tl.fromTo(q(".s13-ag"), { y: 0 }, { y: -16, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, ME + 0.1);
      tl.fromTo([q(".s13-ag-bi"), q(".s13-ag-bd")], { scaleY: 1, svgOrigin: "180 372" }, { scaleY: -0.4, svgOrigin: "180 372", duration: 0.2, ease: "back.out(2)", immediateRender: false }, ME + 0.1);
      pop(".s13-odiaba", ME + 0.1, { rotation: -4 });
      // el local: el empleado atiende tranquilo, el agente el celular
      tl.set(q(".s13-dos"), { opacity: 0 }, AHORA - 0.15);
      tl.set(q(".s13-tres"), { opacity: 1 }, AHORA - 0.15);
      tl.fromTo(q(".s13-tres"), { scale: 1.1, transformOrigin: "50% 60%" }, { scale: 1, transformOrigin: "50% 60%", duration: 0.5, ease: "power3.out", immediateRender: false }, AHORA - 0.15);
      habla(".s13f-boca", AHORA + 0.2, 1.6, "180 294");
      habla(".s13c-boca", AHORA + 0.4, 1.2, "180 294");
      golpe(".s13-l1", TRANQUILO, 1.8);
      tl.fromTo(q(".s13-cel"), { scale: 1, transformOrigin: "50% 100%" }, { scale: 1.25, transformOrigin: "50% 100%", duration: 0.2, yoyo: true, repeat: 1, ease: "back.out(2)", immediateRender: false }, CELULAR - 0.1);
      golpe(".s13-l2", CELULAR, 1.8);
      pop(".s13-bu", CELULAR + 0.1, { y: 20 });
      pop(".s13-bu2", CELULAR + 0.35, { y: 20 });
      pop(".s13-bu3", YO, { y: 20 });

      tl.to(q("#s13-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
