    (function () {
      const ID = "s15-cta";
      const DUR = 12.76;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = ".s15-escenario";
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(ESC), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      const golpe = (sel, t, desde = 2.4) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const pop = (sel, t, extra = {}) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 0.7, ...extra }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      const entra = (sel, t, desde = { x: -600 }) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, t);
      };
      const dibujar = (sel, t, d = 0.5) => qa(sel).forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // vaivén suave (respira) de t a t+d
      const respira = (sel, t, d, dy = 8, per = 0.5) => tl.fromTo(q(sel), { y: 0 }, { y: dy, duration: per, yoyo: true, repeat: Math.max(1, Math.round(d / per) | 1), ease: "sine.inOut", immediateRender: false }, t);
      // X roja gigante que cae (dos trazos que se dibujan + golpe)
      const equis = (sel, t) => { golpe(sel, t, 2.2); sacudon(t + 0.04, 1.1); };
      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.4, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);
      // zoom de cámara sobre el escenario (punch-in)
      const zoom = (t, s, d = 0.35, ox = "50%", oy = "50%") => tl.to(q(ESC), { scale: s, transformOrigin: ox + " " + oy, duration: d, ease: "power3.out" }, t);

      const SCALERICS = 1.63, AGENTE = 2.63, WHATSAPP = 4.27, ETIQUETA = 6.16, TRES = 7.54, VEA = 8.54;

      tl.fromTo(q(".s15-tv"), { scale: 0.8, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)", immediateRender: false, transformOrigin: "50% 50%" }, 0.05);
      gsap.set(q(".s15-tv"), { opacity: 0 });
      pop(".s15-tag", 0.4);
      tl.fromTo(q(".s15-tag"), { opacity: 1 }, { opacity: 0.4, duration: 0.5, ease: "steps(1)", yoyo: true, repeat: 23, immediateRender: false }, 0.8);
      tl.fromTo(q(".s15-ag-bd"), { rotation: 0, svgOrigin: "276 372" }, { rotation: -70, svgOrigin: "276 372", duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, SCALERICS - 0.2);
      tl.fromTo(q(".s15-ag-ant"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.6, transformOrigin: "50% 50%", duration: 0.25, yoyo: true, repeat: 15, ease: "sine.inOut", immediateRender: false }, 0.5);
      golpe(".s15-card", AGENTE, 2);
      sacudon(AGENTE + 0.04, 0.6);
      tl.fromTo(q(".s15-card small"), { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, WHATSAPP - 0.1);
      gsap.set(q(".s15-card small"), { opacity: 0 });
      tl.to(q(".s15-card"), { opacity: 0, y: -30, duration: 0.2 }, ETIQUETA - 0.25);
      golpe(".s15-et", ETIQUETA, 2.4);
      sacudon(ETIQUETA + 0.04, 0.9);
      pop(".s15-al", TRES - 0.6, { y: 20 });
      pop(".s15-ve", VEA, { y: 20 });
      // guiño del agente al final
      tl.to(q(".s15-ag-ojos"), { scaleY: 0.12, svgOrigin: "180 189", duration: 0.08, yoyo: true, repeat: 1 }, 9.8);
      tl.fromTo(q(".s15-et"), { scale: 1 }, { scale: 1.06, duration: 0.5, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, 9.6);

      tl.to(q("#s15-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
