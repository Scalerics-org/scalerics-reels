    (function () {
      const ID = "s10-gobierno-solo";
      const DUR = 7.14;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const lista = (x) => (typeof x === "string" ? qa(x) : Array.isArray(x) ? x : [x]);
      // trazo que se dibuja solo (opacity 0 hasta que arranca: sin puntitos de los caps)
      const dibujar = (sel, t, d = 0.6) => lista(sel).forEach((el) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: L + 1, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // aparece entero con rebote
      const pop = (sel, t, d = 0.35, s = 0.8) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.8)", immediateRender: false }, t);
      });
      // cae de golpe, como un sello
      const golpe = (sel, t, s = 2.2) => lista(sel).forEach((el) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      });
      const fuera = (sel, t, d = 0.25) => tl.to(lista(sel), { opacity: 0, duration: d }, t);
      const sacudon = (t, f = 1, sel = ".s10-esc") => [[-14, 8], [11, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(sel), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      // la boca se mueve mientras habla
      const hablar = (sel, t0, t1) => {
        const n = Math.max(1, Math.floor((t1 - t0) / 0.12));
        tl.fromTo(q(sel), { scaleY: 0.45, transformOrigin: "50% 50%" }, { scaleY: 1.25, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: n % 2 ? n : n + 1, immediateRender: false }, t0);
      };
      // zócalos: cada uno entra desde la izquierda y saca al anterior
      const zocalos = (pares) => pares.forEach(([sel, t], i) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, x: -1100 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, t);
        if (i > 0) tl.to(q(pares[i - 1][0]), { opacity: 0, y: 30, duration: 0.18 }, t);
      });
      // la bandera flamea
      const flamear = (sel, t0, t1) => lista(sel).forEach((el, i) => {
        const n = Math.max(1, Math.floor((t1 - t0) / 0.6));
        tl.fromTo(el, { skewY: -3 }, { skewY: 3, duration: 0.6, yoyo: true, repeat: n, ease: "sine.inOut", svgOrigin: "0 50" }, t0 + i * 0.15);
      });
      // confeti que cae
      const llover = (sel, t) => qa(sel).forEach((k, i) => tl.fromTo(k, { y: 0, rotation: 0, opacity: 0 }, { opacity: 1, y: 900 + (i % 3) * 80, rotation: 360 + i * 40, transformOrigin: "50% 50%", duration: 2.2 + (i % 4) * 0.2, ease: "none", immediateRender: false }, t + (i % 5) * 0.08));


      const VERDAD = 0.08, GOBIERNO = 1.02, SOLO = 1.53, ATIENDO = 2.26, COBRO = 3.19, REPONGO = 3.98, CONTESTO = 5.0, ABASTO = 6.21;
      tl.fromTo(q(".s10-pre"), { y: 30, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.4 }, 0);
      hablar(".s10p-boca", 0, 1.9);
      // se le cae la solemnidad: cejas tristes, gotas, se achica
      tl.to(q(".s10p-ci"), { rotation: -14, svgOrigin: "-30 -32", duration: 0.25 }, VERDAD + 0.3);
      tl.to(q(".s10p-cd"), { rotation: 14, svgOrigin: "30 -32", duration: 0.25 }, VERDAD + 0.3);
      tl.to(q(".s10p-gotas"), { opacity: 1, duration: 0.2 }, GOBIERNO);
      tl.fromTo(q(".s10p-gotas"), { y: 0 }, { y: 24, duration: 0.5, repeat: 1, ease: "power1.in", immediateRender: false }, GOBIERNO);
      tl.to(q(".s10-pre"), { scale: 0.8, svgOrigin: "0 330", duration: 0.6, ease: "power2.out" }, SOLO);
      zocalos([[".s10-z", GOBIERNO - 0.2]]);
      pop(".s10-solo", SOLO, 0.3);
      // cuatro trabajos a la vez
      tl.to([q(".s10-sala"), q(".s10-solo")], { opacity: 0, duration: 0.2 }, ATIENDO - 0.2);
      [[".s10-atiende", ".s10-i1", ".s10-l1", ATIENDO], [".s10-cobra", ".s10-i2", ".s10-l2", COBRO], [".s10-repone", ".s10-i3", ".s10-l3", REPONGO], [".s10-contesta", ".s10-i4", ".s10-l4", CONTESTO]]

      tl.to(q(".s10a-boca"), { scaleY: 1.4, transformOrigin: "50% 50%", duration: 0.1, yoyo: true, repeat: 9 }, ATIENDO + 0.2);
      tl.to(q(".s10-cajon"), { y: 26, duration: 0.15, yoyo: true, repeat: 3 }, COBRO + 0.2);
      tl.fromTo(q(".s10-caja"), { y: 0 }, { y: -80, x: -20, duration: 0.3, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, REPONGO + 0.2);
      tl.to(q(".s10-i4"), { rotation: 6, svgOrigin: "780 1100", duration: 0.05, yoyo: true, repeat: 15 }, CONTESTO + 0.1);
      // todo a la vez: no doy abasto
      qa(".s10-pan, .s10-ic > g").forEach((g, i) => tl.to(g, { y: i % 2 ? -10 : 10, duration: 0.08, yoyo: true, repeat: 7 }, ABASTO - 0.3));
      golpe(".s10-sello", ABASTO, 2.2);
      sacudon(ABASTO + 0.03, 1.4);

      // salida: blur
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
