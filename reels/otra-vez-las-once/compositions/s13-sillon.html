      };
      const sale = (el, t, d = 0.2) => tl.to(typeof el === "string" ? qa(el) : el, { opacity: 0, duration: d }, t);
      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      // dibujar: el trazo se dibuja solo (opacity 0 hasta que arranca: sin puntitos de los caps)
      const dibujar = (el, t, d = 0.5) => {
        for (const e of typeof el === "string" ? qa(el) : [].concat(el)) {
          const L = e.getTotalLength();
          gsap.set(e, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
          tl.set(e, { opacity: 1 }, t);
          tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
        }
      };
      // hablar: la boca se abre y cierra entre t0 y t1 (sin repeat infinito)
      const hablar = (el, t0, t1, min = 0.25, paso = 0.13) => {
        el = typeof el === "string" ? q(el) : el;
        const n = Math.max(1, Math.round((t1 - t0) / (paso * 2)));
        tl.fromTo(el, { scaleY: 1 }, { scaleY: min, duration: paso, yoyo: true, repeat: n * 2 - 1, ease: "sine.inOut", transformOrigin: "50% 50%", immediateRender: false }, t0);
      };
      // parpadeo de ojos
      const parpadeo = (el, t) => tl.to(typeof el === "string" ? qa(el) : el, { scaleY: 0.1, duration: 0.06, yoyo: true, repeat: 1, ease: "none", transformOrigin: "50% 50%" }, t);

const YO = 2.71, SILLON = 3.21, MANANA = 4.05, DIA = 4.61;
      tl.fromTo(ESC, { scale: 1.08 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);
      tl.fromTo(q(".s13-radio"), { rotation: -3, svgOrigin: "410 200" }, { rotation: 3, svgOrigin: "410 200", duration: 0.06, yoyo: true, repeat: 17, ease: "none", immediateRender: false }, 0);
      golpe(".s13-once", 0.08, 2.2);
      sacudon(0.06, 1.2);
      // esta vez no rebobina: se va el radio grande y aparece Néstor en el sillón
      tl.to([q(".s13-r"), q(".s13-once")], { opacity: 0, y: -120, duration: 0.3, ease: "power2.in" }, YO - 0.4);
      gsap.set(q(".s13-sillon"), { opacity: 0 });
      tl.fromTo(q(".s13-sillon"), { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, YO - 0.15);
      pop(".s13-mini", SILLON, 0.3);
      pop(".s13-cal", SILLON + 0.2, 0.3);
      tl.to(q(".s13-mate"), { rotation: -10, svgOrigin: "870 1110", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, SILLON + 0.3);
      // mañana: la hoja del 30 se arranca
      tl.to(q(".s13-d30"), { y: 260, rotation: 25, opacity: 0, duration: 0.45, ease: "power2.in" }, MANANA);
      golpe(".s13-man", DIA - 0.3, 1.8);

      // salida: barrido con blur
      tl.to(q("#s13-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
