    (function () {
      const ID = "s04-noche1";
      const DUR = 5.11;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = q(".s04-escenario");
      // golpe: la palabra cae de grande a su lugar, EN la palabra
      const golpe = (el, t, s = 2.6) => {
        el = typeof el === "string" ? q(el) : el;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      // pop: aparece con rebote
      const pop = (el, t, d = 0.32, extra = {}) => {
        el = typeof el === "string" ? qa(el) : el;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      // entra desde un lado (dx, dy)
      const entra = (el, t, dx = 0, dy = 120, d = 0.35) => {
        el = typeof el === "string" ? qa(el) : el;
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, x: dx, y: dy }, { opacity: 1, x: 0, y: 0, duration: d, ease: "power3.out", immediateRender: false }, t);
      };
      const sale = (el, t, d = 0.2) => tl.to(typeof el === "string" ? qa(el) : el, { opacity: 0, duration: d }, t);
      const sacudon = (t, k = 1) => [[-14, 8], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(ESC, { x: x * k, y: y * k, duration: 0.04, ease: "none" }, t + i * 0.045));
      // dibujar: el trazo se dibuja solo (opacity 0 hasta que arranca: sin puntitos de los caps)
      const dibujar = (el, t, d = 0.5) => {
        for (const e of typeof el === "string" ? qa(el) : [].concat(el)) {
          const L = e.getTotalLength();
          gsap.set(e, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 0 });
          tl.set(e, { opacity: 1 }, t);
          tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
        }
      };
      // hablar: la boca se abre y cierra entre t0 y t1 (sin repeat infinito)
      const hablar = (el, t0, t1, min = 0.25, paso = 0.13) => {
        el = typeof el === "string" ? q(el) : el;
        const n = Math.max(1, Math.round((t1 - t0) / (paso * 2)));
        tl.fromTo(el, { scaleY: 1 }, { scaleY: min, duration: paso, yoyo: true, repeat: n * 2 - 1, ease: "sine.inOut", transformOrigin: "50% 50%", immediateRender: false }, t0);
      };
      // parpadeo de ojos
      const parpadeo = (el, t) => tl.to(typeof el === "string" ? qa(el) : el, { scaleY: 0.1, duration: 0.06, yoyo: true, repeat: 1, ease: "none", transformOrigin: "50% 50%" }, t);

const PASO = 1.21, PEDIDOS = 1.6, WAPP = 2.1, PLANILLA = 2.7, UNO = 3.1, POR = 4.0, UNO2 = 4.2;
      tl.fromTo(ESC, { scale: 1.06 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);

      tl.fromTo(q(".s04-num"), { opacity: 0.3, scale: 1.5, svgOrigin: "540 1000" }, { opacity: 1, scale: 1, svgOrigin: "540 1000", duration: 0.18, ease: "power4.out", immediateRender: false }, 0);
      gsap.set(q(".s04-num"), { opacity: 1 });
      gsap.set(q(".s04-noche-t"), { opacity: 1 });
      tl.fromTo(q(".s04-noche-t"), { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.2, immediateRender: false }, 0 + 0.02);
      sacudon(0 + 0.05, 1.3);
      tl.to(q(".s04-num"), { opacity: 0, scale: 0.42, y: -330, svgOrigin: "540 1000", duration: 0.3, ease: "power3.in" }, PASO - 0.3);
      tl.to(q(".s04-noche-t"), { opacity: 0, duration: 0.2 }, PASO - 0.3);
      entra(".s04-tel", PASO - 0.05, -200, 0, 0.35);
      qa(".s04-msg").forEach((m, i) => entra(m, PEDIDOS + i * 0.1, -40, 0, 0.2));
      entra([q(".s04-plan"), q(".s04-cab")], PLANILLA - 0.3, 200, 0, 0.35);
      // un mensaje por vez vuela a la planilla y llena una celda
      gsap.set(q(".s04-vuela"), { opacity: 0 });
      const VUELOS = [2.9, 3.3, 3.75, 4.15, 4.5];
      VUELOS.forEach((t, i) => {
        tl.fromTo(q(".s04-vuela"), { opacity: 1, x: 0, y: i * 80, scale: 1 }, { x: 570, y: 20 + i * 62, scale: 0.6, opacity: 0.2, duration: 0.3, ease: "power2.in", immediateRender: false }, t);
        tl.to(q(".s04-m" + i), { opacity: 0.25, duration: 0.1 }, t);
        tl.set(qa(".s04-cel")[i], { opacity: 0.55 }, t + 0.3);
        tl.to(qa(".s04-cel")[i], { opacity: 0.18, duration: 0.3 }, t + 0.32);
      });
      dibujar(".s04-flecha", PLANILLA, 0.4);
      const sp = qa(".s04-uno span");
      [UNO, POR, UNO2].forEach((t, i) => { tl.fromTo(sp[i], { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.08); });
      sacudon(UNO2 + 0.05, 0.6);

      // salida: barrido con blur
