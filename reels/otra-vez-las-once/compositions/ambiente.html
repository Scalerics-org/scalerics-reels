<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    /* luz de luna que entra por la persiana, arriba a la derecha */
    [data-composition-id="ambiente"] .amb-persiana { position: absolute; left: 520px; top: 560px; width: 900px; height: 1100px; transform: rotate(-24deg); transform-origin: 0 0; opacity: 0.07;
      background: repeating-linear-gradient(180deg, #7fb4ff 0px, #7fb4ff 34px, rgba(127, 180, 255, 0) 34px, rgba(127, 180, 255, 0) 70px);
      -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0%, #000 30%, #000 60%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0%, #000 30%, #000 60%, rgba(0,0,0,0) 100%); }
    [data-composition-id="ambiente"] .amb-rojo { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 760px 900px at 540px 960px, rgba(255, 45, 45, 0.30), rgba(255, 45, 45, 0) 70%); }
    [data-composition-id="ambiente"] .amb-verde { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 900px 1000px at 50% 50%, rgba(92, 230, 17, 0.14), rgba(92, 230, 17, 0) 72%); }
    [data-composition-id="ambiente"] .amb-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 760px 1120px at 540px 920px, rgba(5, 11, 24, 0) 55%, rgba(5, 11, 24, 0.85) 100%); }
    /* HUD: contador de noches */
    [data-composition-id="ambiente"] .amb-hud { position: absolute; left: 72px; top: 150px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.14em; color: #f4efe4; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-punto { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: #ff2d2d; margin-right: 14px; vertical-align: 1px; }
    [data-composition-id="ambiente"] .amb-n { position: absolute; left: 330px; top: 0; color: #ff2d2d; opacity: 0; }
    [data-composition-id="ambiente"] .amb-libre { position: absolute; left: 72px; top: 150px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.14em; color: #5ce611; white-space: nowrap; opacity: 0; }
    /* rebobinado: líneas de VHS, banda de ruido, tinte y cartel */
    [data-composition-id="ambiente"] .amb-rew { position: absolute; inset: 0; opacity: 0; }
    [data-composition-id="ambiente"] .amb-lineas { position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(244, 239, 228, 0.10) 0px, rgba(244, 239, 228, 0.10) 3px, rgba(0,0,0,0) 3px, rgba(0,0,0,0) 9px); }
    [data-composition-id="ambiente"] .amb-tinte { position: absolute; inset: 0; background: rgba(127, 180, 255, 0.10); }
    [data-composition-id="ambiente"] .amb-banda { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(180deg, rgba(244,239,228,0) 0%, rgba(244,239,228,0.35) 45%, rgba(255,45,45,0.25) 55%, rgba(244,239,228,0) 100%); }
    [data-composition-id="ambiente"] .amb-rewtxt { position: absolute; right: 72px; top: 146px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.14em; color: #f4efe4; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-rewtxt svg { display: inline-block; vertical-align: -4px; margin-right: 12px; }
    [data-composition-id="ambiente"] .amb-flash { position: absolute; inset: 0; background: #ff2d2d; opacity: 0; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="72.89">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="72.89" data-track-index="0">
      <div class="amb-persiana"></div>
      <div class="amb-rojo"></div>
      <div class="amb-verde"></div>
      <div class="amb-vineta"></div>
      <div class="amb-hud" data-layout-ignore><span class="amb-punto"></span>BUCLE · NOCHE <span class="amb-n amb-n1" style="opacity:1">001</span><span class="amb-n amb-n2">002</span><span class="amb-n amb-n3">047</span><span class="amb-n amb-n4">312</span></div>
      <div class="amb-libre" data-layout-ignore>BUCLE ROTO · NOCHE 313</div>
      <div class="amb-rew">
        <div class="amb-tinte"></div>
        <div class="amb-lineas"></div>
        <div class="amb-banda"></div>
        <div class="amb-rewtxt" data-layout-ignore><svg width="56" height="30" viewBox="0 0 56 30"><path d="M28 2 L2 15 L28 28 Z M54 2 L28 15 L54 28 Z" fill="#f4efe4" /></svg>REBOBINANDO</div>
      </div>
      <div class="amb-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 72.89;
      const LIBRE = 49.51; // entra Scalerics: "se rompe automatizándolo"
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // el punto rojo titila como un reloj
      tl.to(q(".amb-punto"), { opacity: 0.2, duration: 0.5, yoyo: true, repeat: Math.max(0, Math.floor(LIBRE / 0.5) - 1), ease: "steps(1)" }, 0);
      // la luz de la persiana respira
      tl.fromTo(q(".amb-persiana"), { x: 0 }, { x: -40, duration: DUR, ease: "none" }, 0);

      // rebobinar antes de cada "¡Once en punto!" (el día vuelve a empezar)
      const REW = [5.70, 19.41, 34.72];
      REW.forEach((t) => {
        tl.set(q(".amb-rew"), { opacity: 1 }, t - 0.5);
        tl.fromTo(q(".amb-banda"), { y: 1900 }, { y: -160, duration: 0.25, ease: "none", immediateRender: false }, t - 0.5);
        tl.fromTo(q(".amb-banda"), { y: 1900 }, { y: -160, duration: 0.25, ease: "none", immediateRender: false }, t - 0.25);
        tl.fromTo(q(".amb-lineas"), { y: 0 }, { y: -36, duration: 0.5, ease: "none", immediateRender: false }, t - 0.5);
        tl.set(q(".amb-rew"), { opacity: 0 }, t + 0.06);
        // el despertador: flash rojo y pulso
        tl.to(q(".amb-flash"), { opacity: 0.32, duration: 0.03 }, t);
        tl.to(q(".amb-flash"), { opacity: 0, duration: 0.35, ease: "power2.out" }, t + 0.04);
        tl.fromTo(q(".amb-rojo"), { opacity: 1 }, { opacity: 0, duration: 1.4, ease: "power2.out", immediateRender: false }, t);
      });

      // el contador de noches
      const NOCHES = [[".amb-n1", 0], [".amb-n2", 20.84], [".amb-n3", 26.25], [".amb-n4", 40.31]];
      NOCHES.forEach(([s, t], i) => {
        if (i) {
          tl.set(q(NOCHES[i - 1][0]), { opacity: 0 }, t);
          tl.fromTo(q(s), { opacity: 1, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, t);
        }
      });

      // entra Scalerics: el bucle se rompe, luz verde, HUD verde
      tl.to(q(".amb-flash"), { backgroundColor: "#5ce611", opacity: 0.4, duration: 0.03 }, LIBRE + 0.4);
      tl.to(q(".amb-flash"), { opacity: 0, duration: 0.4, ease: "power2.out" }, LIBRE + 0.44);
      tl.to(q(".amb-hud"), { opacity: 0, duration: 0.15 }, LIBRE + 0.4);
      tl.to(q(".amb-libre"), { opacity: 1, duration: 0.3 }, LIBRE + 0.5);
      tl.to(q(".amb-verde"), { opacity: 1, duration: 0.5 }, LIBRE + 0.4);
      tl.to(q(".amb-persiana"), { opacity: 0.12, duration: 0.6 }, LIBRE + 0.4);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
