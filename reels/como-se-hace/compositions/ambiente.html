  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 73.67;
      const ESTACIONES = [5.95,11.77,20.02,27.67,30.05];
      const ONCE = 37.78;
      const SCALERICS = 52.05;
      const DORMIR = 67.74;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // balizas a los costados del cartel: titilan mientras la planta trabaja
      const bal = (x, cls) => `<g class="${cls}">
        <path class="am-luz" d="M${x} 112 L${x - 70} 70 L${x - 70} 160 Z M${x} 112 L${x + 70} 70 L${x + 70} 160 Z" fill="#f5c518" opacity="0"/>
        <rect x="${x - 30}" y="140" width="60" height="18" rx="4" fill="#4a525c" stroke="#121417" stroke-width="5"/>
        <path class="am-cup" d="M${x - 22} 140 L${x - 22} 104 Q${x} 80 ${x + 22} 104 L${x + 22} 140 Z" fill="#f5c518" stroke="#121417" stroke-width="5" stroke-linejoin="round"/>
      </g>`;
      q(".am-svg").innerHTML = bal(110, "am-b1") + bal(970, "am-b2");

      // titilan en tandas (sin repeat infinito)
      for (let t = 0.2; t < ONCE; t += 1.6) {
        tl.fromTo(qa(".am-luz"), { opacity: 0 }, { opacity: 0.45, duration: 0.4, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t);
      }
      for (let t = SCALERICS + 0.3; t < DUR - 1; t += 1.6) {
        tl.fromTo(qa(".am-luz"), { opacity: 0 }, { opacity: 0.4, duration: 0.4, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t);
      }
      // a las once la planta se apaga; con Scalerics se prende en verde
      tl.to(q(".am-oscuro"), { opacity: 0.38, duration: 0.5, ease: "power2.out" }, ONCE);
      tl.to(qa(".am-cup"), { fill: "#4a525c", duration: 0.3 }, ONCE);
      tl.to(q(".am-oscuro"), { opacity: 0, duration: 0.5, ease: "power2.out" }, SCALERICS);
      tl.to(q(".am-verde"), { opacity: 1, duration: 0.6 }, SCALERICS);
      tl.to(qa(".am-cup"), { fill: "#5ce611", duration: 0.3 }, SCALERICS);
      tl.set(qa(".am-luz"), { fill: "#5ce611" }, SCALERICS);
      tl.to(q(".am-cartel"), { borderColor: "#5ce611", duration: 0.3 }, SCALERICS);
      tl.to(q(".am-cartel b"), { color: "#5ce611", duration: 0.3 }, SCALERICS);
      tl.to(q(".am-ep"), { opacity: 0, duration: 0.2 }, SCALERICS);
      tl.to(q(".am-auto"), { opacity: 1, duration: 0.3 }, SCALERICS + 0.1);
      tl.to(q(".am-est"), { borderLeftColor: "#5ce611", duration: 0.3 }, SCALERICS);

      // placa de estación: cambia en cada cartel
      const cambios = [[0, ".am-e0"], ...ESTACIONES.map((t, i) => [t, ".am-e" + (i + 1)]), [ONCE, ".am-e6"], [SCALERICS, ".am-e7"]];
      cambios.forEach(([t, sel], i) => {
        if (i > 0) tl.fromTo(q(sel), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
        if (i + 1 < cambios.length) tl.to(q(sel), { opacity: 0, y: -18, duration: 0.2, ease: "power2.in" }, cambios[i + 1][0] - 0.05);
      });
      gsap.set(q(".am-e0"), { opacity: 1 });
      // operarios: 1 toda la noche, 0 cuando Gustavo se va a dormir
      gsap.set(q(".am-o1"), { opacity: 1 });
      tl.to(q(".am-o1"), { opacity: 0, y: -20, duration: 0.2 }, DORMIR);
      tl.fromTo(q(".am-o0"), { opacity: 0, y: 20, scale: 1.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, DORMIR + 0.1);
      tl.to(q(".am-ops"), { borderColor: "#5ce611", duration: 0.3 }, DORMIR);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
