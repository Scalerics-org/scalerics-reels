      const t = (x, y, s, sz, col, fam, w) => `<text x="${x}" y="${y}" text-anchor="middle" font-family="${fam || "Lexend"}" font-weight="${w || 800}" font-size="${sz}" fill="${col}">${s}</text>`;

      root.querySelector(".s09-svg").innerHTML =
