<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/aduana.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-valija"] .s01-capa, [data-composition-id="s01-valija"] .s01-escenario { position: absolute; inset: 0; }
    [data-composition-id="s01-valija"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-valija"] .s01-no { left: 470px; top: 600px; font-size: 44px; }
    [data-composition-id="s01-valija"] .s01-abra { left: 620px; top: 790px; font-size: 64px; }
  </style>
  <div id="root" data-composition-id="s01-valija" data-width="1080" data-height="1920" data-duration="3.54">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="3.54" data-track-index="0">
      <div class="s01-escenario">
        <svg class="s01-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="ad-cartel s01-no">INTERNET · NO PASA</div>
        <div class="ad-sello ama s01-abra">¡ABRA!</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-valija";
      const DUR = 3.54;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const A = AD;
      root.querySelector(".s01-svg").innerHTML =
        // barrera de control atrás a la derecha
        `<g class="s01-barrera">
          <rect x="930" y="700" width="40" height="680" fill="${A.GRIS3}" stroke="${A.INK}" stroke-width="7"/>
          <circle cx="950" cy="690" r="34" fill="${A.ROJO}" stroke="${A.INK}" stroke-width="7"/>
        </g>` +
        A.oficial(360, 1240, 1.12, { brazo: "frente" }) +
        A.mostrador(40, 1040, 1150, 1380, { texto: "ADUANA · INTERNET" }) +
        `<g class="s01-val">${A.valija(600, 950, 330, 200, { etiqueta: "BAZAR ÓSCAR" })}
          <rect class="s01-tr1" x="660" y="940" width="40" height="22" rx="5" fill="${A.AMA}" stroke="${A.INK}" stroke-width="5"/>
          <rect class="s01-tr2" x="830" y="940" width="40" height="22" rx="5" fill="${A.AMA}" stroke="${A.INK}" stroke-width="5"/>
        </g>` +
        `<g class="s01-golpe" stroke="${A.INK}" stroke-width="8" stroke-linecap="round" fill="none"><path d="M600 900 l-30 -40 M640 880 l-6 -50 M570 940 l-46 -14"/></g>`;
      const tl = gsap.timeline({ paused: true });
      const K = A.kit(tl, root);
      const { q, qa } = K;

      const LOCAL = 0.51;
      const INTERNET = 1.44;
      const ABRA = 2.15;
      const VALIJA = 2.37;

      // cuadro 0: la oficial ya está detrás del mostrador mirando el pasaporte
      tl.fromTo(q(".s01-escenario"), { scale: 1.06 }, { scale: 1, duration: DUR, ease: "power1.out", transformOrigin: "40% 55%" }, 0);
      tl.fromTo(q(".ad-o"), { y: 30 }, { y: 0, duration: 0.45, ease: "back.out(1.4)" }, 0);
      K.origen(q(".ad-o-cabeza"), "0 -300");
      tl.fromTo(q(".ad-o-cabeza"), { rotation: -6 }, { rotation: 0, duration: 0.3, ease: "power2.out" }, LOCAL);
      tl.to(q(".ad-o-cejas"), { y: 6, duration: 0.15, ease: "power2.out" }, LOCAL);
      // la boca habla
      K.hablar(".ad-o-boca", 0.05, 3, 0.11);
      // "internet": cartel con la barrera que baja
      K.pop(q(".s01-no"), INTERNET - 0.05);
      tl.fromTo(q(".s01-barrera"), { y: -40, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, INTERNET);
      // "abra": golpe en el mostrador con la mano, la valija salta
      K.origen(q(".ad-o-brazo"), "150 -200");
      tl.fromTo(q(".ad-o-brazo"), { rotation: -18 }, { rotation: 6, duration: 0.14, ease: "power4.in", immediateRender: false }, ABRA - 0.12);
      tl.to(q(".ad-o-brazo"), { rotation: 0, duration: 0.2, ease: "power2.out" }, ABRA + 0.05);
      tl.fromTo(q(".s01-val"), { y: 0 }, { y: -40, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, ABRA);
      qa(".s01-golpe path").forEach((p, i) => K.dibujar(p, ABRA + i * 0.04, 0.15));
      tl.to(q(".s01-golpe"), { opacity: 0, duration: 0.2 }, ABRA + 0.5);
      // "valija": las trabas saltan y el sello amarillo
      gsap.set(q(".s01-tr1"), { svgOrigin: "680 951", smoothOrigin: false });
      gsap.set(q(".s01-tr2"), { svgOrigin: "850 951", smoothOrigin: false });
      tl.to(q(".s01-tr1"), { y: -50, x: -30, rotation: -40, svgOrigin: "680 951", duration: 0.3, ease: "power2.out" }, VALIJA);
      tl.to(q(".s01-tr2"), { y: -60, x: 30, rotation: 40, svgOrigin: "850 951", duration: 0.3, ease: "power2.out" }, VALIJA);
      K.sello(q(".s01-abra"), VALIJA + 0.1, -5);
      K.sacudon(q(".s01-val"), VALIJA + 0.15, 0.8);

      K.salida(q("#s01-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
