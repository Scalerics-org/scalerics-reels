<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Cormorant"; font-weight: 600; font-display: block; src: url("assets/fonts/CormorantGaramond-600.woff2") format("woff2"); }
    @font-face { font-family: "Cormorant"; font-style: italic; font-weight: 500; font-display: block; src: url("assets/fonts/CormorantGaramond-Italic-500.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .am-capa { position: absolute; inset: 0; }
    [data-composition-id="ambiente"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* cabecera de revista */
    [data-composition-id="ambiente"] .am-top { position: absolute; left: 56px; right: 56px; top: 56px; height: 130px; border-bottom: 3px solid #d8b25c; }
    [data-composition-id="ambiente"] .am-mast { position: absolute; left: 0; top: -6px; font-family: "Cormorant", serif; font-weight: 600; font-size: 112px; line-height: 1; letter-spacing: 0.04em; color: #f6f1ea; white-space: nowrap; }
    [data-composition-id="ambiente"] .am-mast i { font-style: italic; font-weight: 500; color: #ff2e88; }
    [data-composition-id="ambiente"] .am-sub { position: absolute; right: 0; top: 18px; text-align: right; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 28px; line-height: 1.4; letter-spacing: 0.16em; color: #d8b25c; white-space: nowrap; }
    [data-composition-id="ambiente"] .am-vivo { color: #f6f1ea; }
    [data-composition-id="ambiente"] .am-rec { display: inline-block; width: 16px; height: 16px; margin-right: 12px; border-radius: 50%; background: #ff2e88; vertical-align: 1px; }
    /* zócalo */
    [data-composition-id="ambiente"] .am-zocalo { position: absolute; left: 56px; top: 1572px; width: 800px; height: 130px; }
    [data-composition-id="ambiente"] .am-z { position: absolute; left: 0; top: 0; opacity: 0; padding-left: 26px; border-left: 10px solid #ff2e88; }
    [data-composition-id="ambiente"] .am-z b { display: block; font-family: "Cormorant", serif; font-style: italic; font-weight: 500; font-size: 58px; line-height: 1; color: #f6f1ea; white-space: nowrap; }
    [data-composition-id="ambiente"] .am-z small { display: block; margin-top: 8px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 24px; letter-spacing: 0.2em; text-transform: uppercase; color: #d8b25c; white-space: nowrap; }
    [data-composition-id="ambiente"] .am-flash { position: absolute; inset: 0; background: #f6f1ea; opacity: 0; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="72.67">
    <div id="am-escena" class="am-capa clip" data-start="0" data-duration="72.67" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="am-pasarela">
          <path d="M470 820 L610 820 L1000 1920 L80 1920 Z" fill="#1d1920" />
          <path d="M540 820 L540 1920" stroke="#ff2e88" stroke-width="6" opacity="0.35" stroke-dasharray="30 40" />
          <path d="M470 820 L80 1920 M610 820 L1000 1920" stroke="#d8b25c" stroke-width="5" opacity="0.7" />
          <g class="am-luces"></g>
        </g>
        <g class="am-publico" data-layout-allow-overflow></g>
        <g class="am-flashes" data-layout-allow-overflow></g>
      </svg>
      <div class="am-top">
        <div class="am-mast">LAM<i>É</i></div>
        <div class="am-sub"><span class="am-vivo"><span class="am-rec"></span>EN VIVO</span><br />ALFOMBRA ROJA<br />DEL COMERCIO</div>
      </div>
      <div class="am-zocalo">
        <div class="am-z am-zk"><b>Bárbara Lamé</b><small>crítica de moda</small></div>
        <div class="am-z am-zp" style="border-color:#d8b25c"><b>Tito Lentejuela</b><small>presentador</small></div>
        <div class="am-z am-zd" style="border-color:#8d8892"><b>Don Hugo</b><small>ferretería · talle único</small></div>
        <div class="am-z am-zt" style="border-color:#8d8892"><b>Laura</b><small>tienda · dos locales</small></div>
      </div>
      <div class="am-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const FIN = 55.89; // entra Scalerics: se apaga el desfile
      const DUR = 72.67;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

      // luces del borde de la pasarela (puntitos dorados que corren hacia el fondo)
      const luces = q(".am-luces");
      const dots = [];
      for (let i = 0; i < 9; i++) {
        const f = i / 8; // 0 fondo, 1 frente
        const y = 840 + f * f * 1040, w = 4 + f * 10;
        const xl = 470 - (470 - 80) * ((y - 820) / 1100), xr = 610 + (1000 - 610) * ((y - 820) / 1100);
        dots.push(el("circle", { cx: xl, cy: y, r: w, fill: "#d8b25c" }, luces), el("circle", { cx: xr, cy: y, r: w, fill: "#d8b25c" }, luces));
      }
      dots.forEach((d, i) => tl.fromTo(d, { opacity: 0.25 }, { opacity: 1, duration: 0.3, yoyo: true, repeat: Math.floor(FIN / 0.3), ease: "steps(1)", immediateRender: false }, (i % 6) * 0.1));

      // público: siluetas en los costados, con cámaras
      const pub = q(".am-publico");
      const cams = [];
      [[30, 1180], [150, 1260], [40, 1400], [170, 1470], [20, 1580], [930, 1200], [1040, 1280], [910, 1410], [1050, 1490], [940, 1600]].forEach(([x, y], i) => {
        const g = el("g", {}, pub);
        el("circle", { cx: x, cy: y, r: 46, fill: "#050407" }, g);
        el("path", { d: `M${x - 80} ${y + 160} Q${x - 80} ${y + 50} ${x} ${y + 50} Q${x + 80} ${y + 50} ${x + 80} ${y + 160} Z`, fill: "#050407" }, g);
        const lado = x < 540 ? 1 : -1;
        const c = el("rect", { x: x + lado * 20 - 26, y: y - 24, width: 52, height: 38, rx: 6, fill: "#2a2530", stroke: "#8d8892", "stroke-width": 3 }, g);
        cams.push([x + lado * 20, y - 6]);
      });

      // flashes de cámaras (deterministas)
      const fl = q(".am-flashes");
      const estrella = (x, y, r) => `M${x} ${y - r} L${x + r * 0.16} ${y - r * 0.16} L${x + r} ${y} L${x + r * 0.16} ${y + r * 0.16} L${x} ${y + r} L${x - r * 0.16} ${y + r * 0.16} L${x - r} ${y} L${x - r * 0.16} ${y - r * 0.16} Z`;
      for (let i = 0; i * 0.47 < FIN - 0.5; i++) {
        const [x, y] = cams[(i * 7) % cams.length];
        const t = 0.15 + i * 0.47 + ((i * 13) % 5) * 0.05;
        const g = el("g", {}, fl);
        el("circle", { cx: x, cy: y, r: 70, fill: "#f6f1ea", opacity: 0.25 }, g);
        el("path", { d: estrella(x, y, 90), fill: "#f6f1ea" }, g);
        gsap.set(g, { opacity: 0 });
        tl.fromTo(g, { opacity: 1, scale: 0.4, svgOrigin: `${x} ${y}` }, { opacity: 0, scale: 1.1, svgOrigin: `${x} ${y}`, duration: 0.22, ease: "power2.out", immediateRender: false }, t);
      }

      // EN VIVO titila
      tl.fromTo(q(".am-rec"), { opacity: 1 }, { opacity: 0.15, duration: 0.5, ease: "steps(1)", yoyo: true, repeat: Math.floor(FIN / 0.5), immediateRender: false }, 0);
      tl.fromTo(q(".am-mast"), { y: -30, opacity: 0.3 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);

      // zócalo: quién habla
      const Z = [[".am-zk", 0, 5.5], [".am-zp", 5.57, 17.75], [".am-zk", 17.83, 24.0], [".am-zd", 24.06, 25.68], [".am-zk", 25.73, 26.66],
        [".am-zp", 26.71, 30.18], [".am-zk", 30.23, 35.72], [".am-zp", 35.78, 37.98], [".am-zk", 38.03, 41.7], [".am-zt", 41.76, 45.38],
        [".am-zk", 45.43, FIN - 0.05], [".am-zk", 64.52, 66.8]];
      Z.forEach(([s, a, b], i) => {
        const e = q(s);
        if (i === 0) gsap.set(e, { opacity: 1 });
        else tl.fromTo(e, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, a);
        tl.to(e, { opacity: 0, x: -40, duration: 0.12, ease: "power2.in" }, b - 0.1);
      });

      // flash grande en los golpes
      const flash = (t, o) => { tl.to(q(".am-flash"), { opacity: o, duration: 0.04 }, t); tl.to(q(".am-flash"), { opacity: 0, duration: 0.3 }, t + 0.06); };
      flash(4.3, 0.55); flash(25.72, 0.45); flash(54.6, 0.4); flash(65.37, 0.5);

      // Scalerics: se apaga el desfile
      tl.to(q(".am-top"), { opacity: 0, y: -40, duration: 0.3 }, FIN);
      tl.to([q(".am-publico"), q(".am-flashes")], { opacity: 0, duration: 0.4 }, FIN);
      tl.to(q(".am-pasarela"), { opacity: 0.45, duration: 0.5 }, FIN);
      tl.to(luces, { opacity: 0, duration: 0.3 }, FIN);
      tl.set(q(".am-pasarela"), { opacity: 0.45 }, DUR - 0.01);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
