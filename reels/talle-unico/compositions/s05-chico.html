        <div class="sello s05-chico">Chico</div>
        <div class="obj s05-cont"><b>40.000</b><small>tornillos sueltos</small></div>
        <div class="rev it s05-bol">¿en el bolsillo?</div>

      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s05-chico";
      const DUR = 6.23;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // golpe: algo que cae de grande en su palabra
      const golpe = (el, t, rot = -4, sc = 2.6) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: sc, rotation: rot * 3 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.12); };
      const pop = (el, t, d = 0.35, extra = {}) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, { opacity: 0, scale: 0.6 }, Object.assign({ opacity: 1, scale: 1, duration: d, ease: "back.out(2)", immediateRender: false }, extra), t); };
      const fuera = (el, t, d = 0.18) => tl.to(el, { opacity: 0, scale: 0.85, duration: d, ease: "power2.in" }, t);
      const entra = (el, t, desde = { x: -700 }, d = 0.35) => { gsap.set(el, { opacity: 0 }); tl.fromTo(el, Object.assign({ opacity: 1 }, desde), { opacity: 1, x: 0, y: 0, duration: d, ease: "back.out(1.3)", immediateRender: false }, t); };
      const sacudon = (t, f = 1) => [[-14 * f, 8 * f], [10 * f, -6 * f], [-5 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      // boca que habla de t a t+d
      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 1.9, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);
      // respira / rebota suave
      const vaiven = (el, t, d, vars, per = 0.4) => tl.to(el, Object.assign({ duration: per, yoyo: true, repeat: Math.max(1, Math.floor(d / per)) | 1, ease: "sine.inOut" }, vars), t);
      // desfila: camina por la pasarela (balanceo + paso)
      const desfila = (el, t, d, per = 0.32) => { tl.to(el, { rotation: 3, duration: per, yoyo: true, repeat: Math.max(1, Math.floor(d / per)) | 1, ease: "sine.inOut", transformOrigin: "50% 100%" }, t); tl.to(el, { y: -10, duration: per / 2, yoyo: true, repeat: Math.max(1, Math.floor(d / (per / 2))) | 1, ease: "sine.inOut" }, t); };
      // dibujar un trazo (stroke-dashoffset)
      const dibujar = (el, t, d = 0.6) => { const L = el.getTotalLength(); gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 }); tl.set(el, { opacity: 1 }, t); tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t); };


      const CHICO = 0.34, CUAR = 1.61, TOR = 2.20, DONDE = 2.79, METE = 3.73, BOL = 4.49;
      const h = q(".s05-hugo");
      // cuadro 0: Don Hugo de frente, el buzo le aprieta
      gsap.set(h, { scale: 1.1, transformOrigin: "50% 100%" });
      tl.fromTo(h, { y: 40 }, { y: 0, duration: 0.3, ease: "power2.out" }, 0);
      tl.to(q(".s05h-panza"), { scale: 1.08, svgOrigin: "200 440", duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.1);
      golpe(q(".s05-chico"), CHICO, -10, 2.6);
      sacudon(CHICO + 0.04, 1.3);
      tl.fromTo(q(".s05h-costura"), { opacity: 1 }, { opacity: 0.1, duration: 0.08, yoyo: true, repeat: 9, immediateRender: false }, CHICO);
      tl.to(q(".s05h-ceja"), { y: 8, duration: 0.2 }, CHICO + 0.3);
      // cuarenta mil tornillos
      tl.to(q(".s05-chico"), { y: -40, opacity: 0, duration: 0.25 }, CUAR - 0.3);
      pop(q(".s05-cont"), CUAR, 0.3);
      tl.to(q(".s05-cont b"), { scale: 1.08, transformOrigin: "0% 50%", duration: 0.12, yoyo: true, repeat: 3 }, TOR);
      const ts = qa(".s05-t");
      ts.forEach((t, i) => { gsap.set(t, { opacity: 0 }); tl.fromTo(t, { opacity: 1, y: -900 - (i % 7) * 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "bounce.out", immediateRender: false }, TOR + (i % 14) * 0.05); });
      tl.to(h, { rotation: -4, duration: 0.15, yoyo: true, repeat: 5 }, DONDE);
      tl.to(q(".s05h-bi"), { rotation: 35, svgOrigin: "148 300", duration: 0.3, ease: "back.out(2)" }, DONDE);
      tl.to(q(".s05h-bd"), { rotation: -35, svgOrigin: "252 300", duration: 0.3, ease: "back.out(2)" }, DONDE);
      // ¿en el bolsillo?
      tl.to(q(".s05-cont"), { y: -30, opacity: 0, duration: 0.25 }, METE + 0.1);
      gsap.set(q(".s05-bols"), { opacity: 0 });
      tl.to(q(".s05-bols"), { opacity: 1, duration: 0.1 }, BOL - 0.4);
      tl.to(ts, { x: (i) => 385 - Number(ts[i].dataset.x), y: (i) => 1250 - Number(ts[i].dataset.y), scale: 0.5, duration: 0.45, stagger: 0.008, ease: "power3.in" }, BOL - 0.35);
      tl.to(q(".s05-bols"), { scaleY: 1.5, svgOrigin: "385 1300", duration: 0.12, yoyo: true, repeat: 5 }, BOL + 0.15);
      pop(q(".s05-bol"), BOL, 0.3, { rotation: -3 });

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
