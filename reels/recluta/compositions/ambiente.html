        <g class="am-camu" data-layout-allow-overflow>

        <div class="am-ch am-cho"><div class="am-placa" style="background:#5ce611"><b>SCALERICS</b><small style="color:#121410">EQUIPAMOS TU TIENDA</small></div></div>

      <div class="am-flash"></div>

  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 70.5;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      // segundos globales (de assets/voice/palabras.json)
      const CUENTA = [1.83, 60.14];
      const TURNOS = [[0.0, "s"], [5.92, "r"], [7.8, "s"], [10.54, "r"], [13.9, "s"], [16.64, "r"], [19.95, "s"], [21.4, "r"], [25.36, "s"], [42.84, "r"], [45.59, "s"], [50.32, "o"], [62.09, "s"], [65.64, "r"]];
      const ALERTAS = [[0.05, 1.0], [8.15, 0.8], [28.93, 0.8]];
      const FLASHES = [50.32, 61.08];

      // el camuflaje respira despacio
      tl.fromTo(q(".am-camu"), { x: 0, y: 0 }, { x: -14, y: 30, duration: DUR, ease: "none" }, 0);
      // el cartel entra de entrada
      tl.fromTo(q(".am-cartel"), { y: -30, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".am-cuenta"), { scale: 1.4, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, 0.1);
      // la cuenta late con el redoble en "cuatro semanas"
      CUENTA.forEach((t) => tl.to(q(".am-cuenta"), { scale: 1.15, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, t));

      // chapitas: quién habla (segundos globales)
      const CH = { s: ".am-chs", r: ".am-chr", o: ".am-cho" };
      let ant = null;
      TURNOS.forEach(([t, quien]) => {
        const el = q(CH[quien]);
        if (ant && ant !== el) tl.to(ant, { opacity: 0, x: -30, duration: 0.12, ease: "power2.in" }, t - 0.12);
        if (ant !== el) tl.fromTo(el, { opacity: 0, x: -40, rotation: -6 }, { opacity: 1, x: 0, rotation: 0, duration: 0.25, ease: "back.out(2.2)", immediateRender: false }, t);
        ant = el;
      });

      // alerta naranja en las esquinas y flashes (segundos globales)
      ALERTAS.forEach(([t, d]) => tl.to(q(".am-alerta"), { opacity: 1, duration: 0.1, yoyo: true, repeat: Math.max(1, Math.round(d / 0.2)) * 2 - 1, ease: "steps(1)" }, t));
      FLASHES.forEach((t) => {
        tl.to(q(".am-flash"), { opacity: 0.55, duration: 0.03 }, t);
        tl.to(q(".am-flash"), { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.04);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
