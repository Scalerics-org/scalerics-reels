  <div id="root" data-composition-id="s01-atencion" data-width="1080" data-height="1920" data-duration="5.92">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="5.92" data-track-index="0">
      <div class="s01-escenario">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <!-- EL SARGENTO, de frente, gritando -->

        <svg class="s01-arma" viewBox="0 0 380 200" aria-hidden="true">
          <!-- el cuaderno: el arma del recluta -->

            <rect x="60" y="30" width="260" height="160" rx="10" fill="#f1ecdc" stroke="#121410" stroke-width="7" />

            <circle cx="72" cy="55" r="7" fill="#121410" /><circle cx="72" cy="100" r="7" fill="#121410" /><circle cx="72" cy="145" r="7" fill="#121410" />

  <script>
    (function () {
      const ID = "s01-atencion";
      const DUR = 5.92;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const ATENCION = 0.0;
      const SOLDADO = 0.61;
      const SEMANAS = 1.83;
      const BLACK = 2.78;
      const GUERRA = 4.17;
      const CUADERNO = 4.78;

      const golpe = (t, f = 1) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const sello = (sel, t, rot) => {
        gsap.set(q(sel), { opacity: 0, rotation: rot });
        tl.fromTo(q(sel), { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
        golpe(t + 0.04, 0.7);
      };
      // la boca "habla": se abre y se cierra
      const hablar = (desde, hasta, paso = 0.16) => { for (let t = desde; t < hasta; t += paso * 2) tl.to(q(".s01-boca"), { scaleY: 0.55, svgOrigin: "0 90", duration: paso, yoyo: true, repeat: 1, ease: "sine.inOut" }, t); };

      // cuadro 0: el sargento ya está, a medio entrar desde abajo
      tl.fromTo(q(".s01-sarg"), { y: 160, scale: 0.9, svgOrigin: "0 290" }, { y: 0, scale: 1, svgOrigin: "0 290", duration: 0.35, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s01-sombrero"), { y: -120, rotation: -14, svgOrigin: "0 -160" }, { y: 0, rotation: 0, svgOrigin: "0 -160", duration: 0.4, ease: "back.out(2)" }, 0.05);
      // "¡ATENCIÓN!" golpea
      tl.fromTo(q(".s01-aten"), { opacity: 0.6, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in" }, Math.max(0, ATENCION - 0.12));
      golpe(ATENCION + 0.08, 1.3);
      gsap.set(q(".s01-grito"), { opacity: 0 });
      tl.fromTo(q(".s01-grito"), { opacity: 0, scale: 0.6, svgOrigin: "0 150" }, { opacity: 1, scale: 1.1, svgOrigin: "0 150", duration: 0.2, ease: "power3.out", immediateRender: false }, ATENCION);
      tl.to(q(".s01-grito"), { opacity: 0, duration: 0.25 }, SOLDADO + 0.5);
      tl.fromTo(q(".s01-vena"), { scale: 0.6, svgOrigin: "120 -130" }, { scale: 1.3, svgOrigin: "120 -130", duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut" }, ATENCION);
      tl.fromTo(qa(".s01-ceja"), { y: 0 }, { y: 10, duration: 0.15, ease: "power2.out" }, SOLDADO);
      hablar(0.05, CUADERNO + 0.6);
      // el sargento se acerca a cámara durante toda la escena
      tl.to(q(".s01-sarg"), { scale: 1.08, svgOrigin: "0 290", duration: DUR - 0.4, ease: "none" }, 0.4);

      // "faltan cuatro semanas" y "black friday": sellos
      sello(".s01-semanas", SEMANAS, -6);
      sello(".s01-bf", BLACK, 5);
      // "la guerra": el ¡ATENCIÓN! se apaga, alerta
      tl.to([q(".s01-aten")], { opacity: 0.25, duration: 0.2 }, GUERRA);
      // "con un cuaderno": cae el cuaderno, el sargento lo mira con asco (las cejas suben)
      gsap.set([q(".s01-arma"), q(".s01-rotulo")], { opacity: 0 });
      tl.fromTo(q(".s01-rotulo"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.2, immediateRender: false }, CUADERNO - 0.4);
      tl.fromTo(q(".s01-arma"), { opacity: 0, y: -300, rotation: -30 }, { opacity: 1, y: 0, rotation: 0, duration: 0.3, ease: "bounce.out", immediateRender: false }, CUADERNO - 0.2);
      tl.to(qa(".s01-ceja"), { y: -18, duration: 0.15, ease: "back.out(3)" }, CUADERNO + 0.1);
      tl.to(q(".s01-arma"), { rotation: 6, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, CUADERNO + 0.3);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
