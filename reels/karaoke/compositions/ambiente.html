<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .am-capa { position: absolute; inset: 0; }
    [data-composition-id="ambiente"] .am-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 760px 1100px at 540px 900px, rgba(18, 8, 31, 0) 55%, rgba(18, 8, 31, 0.5) 100%); }
    [data-composition-id="ambiente"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="ambiente"] .am-neon { position: absolute; left: 50px; top: 58px; padding: 10px 26px 12px; border: 5px solid #ff2fa0; border-radius: 18px;
      box-shadow: 0 0 22px rgba(255, 47, 160, 0.8), inset 0 0 18px rgba(255, 47, 160, 0.5); background: rgba(18, 8, 31, 0.6); }
    [data-composition-id="ambiente"] .am-neon b { display: block; font-family: "Caveat", cursive; font-weight: 700; font-size: 82px; line-height: 0.9; color: #ffe1f2;
      text-shadow: 0 0 8px #ff2fa0, 0 0 22px #ff2fa0, 0 0 40px #ff2fa0; white-space: nowrap; }
    [data-composition-id="ambiente"] .am-neon small { display: block; margin-top: 4px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 20px; letter-spacing: 0.26em; color: #4fd8ff;
      text-shadow: 0 0 10px rgba(79, 216, 255, 0.9); white-space: nowrap; }
    [data-composition-id="ambiente"] .am-chapas { position: absolute; left: 50px; top: 1560px; width: 760px; height: 100px; }
    [data-composition-id="ambiente"] .am-ch { position: absolute; left: 0; top: 0; opacity: 0; }
    [data-composition-id="ambiente"] .am-ch .am-pl { display: inline-block; padding: 12px 26px 10px; background: #12081f; border-left: 14px solid currentColor; border-radius: 8px; box-shadow: 0 0 22px rgba(0, 0, 0, 0.5); }
    [data-composition-id="ambiente"] .am-ch b { display: block; font-family: "Lexend", sans-serif; font-weight: 800; font-size: 36px; line-height: 1; white-space: nowrap; }
    [data-composition-id="ambiente"] .am-ch small { display: block; margin-top: 6px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 20px; letter-spacing: 0.16em; color: #fff6e8; white-space: nowrap; }
    [data-composition-id="ambiente"] .am-flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="67.63">
    <div id="am-escena" class="am-capa clip" data-start="0" data-duration="67.63" data-track-index="0">
      <svg class="am-luces" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      <div class="am-vineta"></div>
      <svg class="am-bola-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      <div class="am-neon"><b>Karaoke</b><small>JUEVES DE DESPECHO</small></div>
      <div class="am-chapas">
        <div class="am-ch am-chv" style="color:#ff2fa0"><div class="am-pl"><b>VALE</b><small>LA CLIENTA · AL MICRÓFONO</small></div></div>
        <div class="am-ch am-chp" style="color:#ffd81a"><div class="am-pl"><b>LA MESA DEL FONDO</b><small>EL PÚBLICO</small></div></div>
        <div class="am-ch am-cha" style="color:#4fd8ff"><div class="am-pl"><b>EL ANIMADOR</b><small>KARAOKE</small></div></div>
        <div class="am-ch am-chd" style="color:#ff8a3d"><div class="am-pl"><b>EL DUEÑO</b><small>DESDE LA BARRA</small></div></div>
        <div class="am-ch am-cho" style="color:#5ce611"><div class="am-pl"><b>SCALERICS</b><small>AGENTES DE IA</small></div></div>
      </div>
      <div class="am-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 67.63;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      // bola de espejos arriba a la derecha, colgando
      const BX = 940, BY = 150, R = 62;
      let facetas = "";
      for (let f = -4; f <= 4; f++) for (let c = -4; c <= 4; c++) {
        const x = BX + c * 15, y = BY + f * 15;
        if ((x - BX) ** 2 + (y - BY) ** 2 > (R - 6) ** 2) continue;
        const tono = ["#c9c3d8", "#8a84a0", "#fff6e8", "#4fd8ff", "#ff8ad0"][(f * 3 + c * 7 + 20) % 5];
        facetas += `<rect class="am-fac" x="${x - 6}" y="${y - 6}" width="12" height="12" fill="${tono}"/>`;
      }
      q(".am-bola-svg").innerHTML = `<path d="M${BX} 0 V${BY - R}" stroke="#8a84a0" stroke-width="5"/>
        <g class="am-bola"><circle cx="${BX}" cy="${BY}" r="${R}" fill="#5a5470" stroke="#12081f" stroke-width="6"/>${facetas}
        <circle cx="${BX}" cy="${BY}" r="${R}" fill="none" stroke="#12081f" stroke-width="6"/>
        <path class="am-destello" d="M${BX - 28} ${BY - 30} l10 -22 l10 22 l22 10 l-22 10 l-10 22 l-10 -22 l-22 -10 Z" fill="#ffffff"/></g>`;
      // manchitas de luz que barren la sala (poca opacidad)
      const COLS = ["#fff6e8", "#4fd8ff", "#ff8ad0", "#ffd81a"];
      let manchas = "";
      for (let k = 0; k < 16; k++) {
        const x = 80 + ((k * 263) % 920), y = 520 + ((k * 397) % 1100);
        manchas += `<ellipse class="am-m" cx="${x}" cy="${y}" rx="${16 + (k % 3) * 6}" ry="${10 + (k % 3) * 4}" fill="${COLS[k % 4]}" opacity="0.16"/>`;
      }
      q(".am-luces").innerHTML = `<g class="am-haces">
          <path class="am-haz am-haz1" d="M160 0 L-80 1500 L360 1500 Z" fill="#ff2fa0" opacity="0.06"/>
          <path class="am-haz am-haz2" d="M920 0 L700 1500 L1140 1500 Z" fill="#4fd8ff" opacity="0.06"/>
        </g><g class="am-manchas">${manchas}</g>`;

      const tl = gsap.timeline({ paused: true });
      // segundos globales (de assets/voice/palabras.json)
      const TURNOS = [[0, "v"], [4.42, "p"], [7.3, "v"], [28.54, "a"], [33.46, "d"], [41.75, "o"]];
      const FLASHES = [32.1, 42.84];

      // el neón titila al arrancar
      tl.fromTo(q(".am-neon"), { opacity: 0.35 }, { opacity: 1, duration: 0.06, repeat: 5, yoyo: true, ease: "steps(1)" }, 0);
      tl.set(q(".am-neon"), { opacity: 1 }, 0.4);
      // la bola gira (las facetas titilan) y destella
      qa(".am-fac").forEach((f, i) => tl.fromTo(f, { opacity: 1 }, { opacity: 0.45, duration: 0.4, yoyo: true, repeat: Math.floor(DUR / 0.8), ease: "steps(1)" }, (i % 4) * 0.2));
      gsap.set(q(".am-destello"), { svgOrigin: `${BX - 18} ${BY - 20}`, smoothOrigin: false });
      tl.fromTo(q(".am-destello"), { scale: 0.2, opacity: 0 }, { scale: 1.2, opacity: 1, duration: 0.5, yoyo: true, repeat: Math.floor(DUR / 1.3), repeatDelay: 0.3, ease: "sine.inOut" }, 0.2);
      gsap.set(q(".am-bola"), { svgOrigin: `${BX} 0`, smoothOrigin: false });
      tl.fromTo(q(".am-bola"), { rotation: -3 }, { rotation: 3, duration: 2.2, yoyo: true, repeat: Math.floor(DUR / 2.2), ease: "sine.inOut" }, 0);
      // las manchitas giran alrededor de la bola
      gsap.set(q(".am-manchas"), { svgOrigin: `${BX} ${BY}`, smoothOrigin: false });
      tl.fromTo(q(".am-manchas"), { rotation: 0 }, { rotation: 40, duration: DUR, ease: "none" }, 0);
      gsap.set(q(".am-haz1"), { svgOrigin: "160 0", smoothOrigin: false });
      gsap.set(q(".am-haz2"), { svgOrigin: "920 0", smoothOrigin: false });
      tl.fromTo(q(".am-haz1"), { rotation: -8 }, { rotation: 10, duration: 3.1, yoyo: true, repeat: Math.floor(DUR / 3.1), ease: "sine.inOut" }, 0);
      tl.fromTo(q(".am-haz2"), { rotation: 8 }, { rotation: -10, duration: 3.7, yoyo: true, repeat: Math.floor(DUR / 3.7), ease: "sine.inOut" }, 0);

      // chapa de quién habla
      const CH = { v: ".am-chv", p: ".am-chp", a: ".am-cha", d: ".am-chd", o: ".am-cho" };
      let ant = null;
      TURNOS.forEach(([t, quien]) => {
        const el = q(CH[quien]);
        if (ant && ant !== el) tl.to(ant, { opacity: 0, x: -30, duration: 0.12, ease: "power2.in" }, t - 0.12);
        if (ant !== el) tl.fromTo(el, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(2.2)", immediateRender: false }, Math.max(0, t));
        ant = el;
      });
      FLASHES.forEach((t) => {
        tl.to(q(".am-flash"), { opacity: 0.5, duration: 0.03 }, t);
        tl.to(q(".am-flash"), { opacity: 0, duration: 0.4, ease: "power2.out" }, t + 0.04);
      });
      // Scalerics: el neón se pone verde
      tl.to(q(".am-neon"), { borderColor: "#5ce611", boxShadow: "0 0 22px rgba(92, 230, 17, 0.8), inset 0 0 18px rgba(92, 230, 17, 0.5)", duration: 0.2 }, 42.84);
      tl.to(q(".am-neon b"), { textShadow: "0 0 8px #5ce611, 0 0 22px #5ce611, 0 0 40px #5ce611", color: "#eaffdc", duration: 0.2 }, 42.84);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
