      const ID = "s12-cancion";
      const DUR = 3.24;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = KR.INK;
      root.querySelector(".s12-tv").outerHTML = KR.pantalla("s12", "s12-pan", 40, 560, 1000, 520, 0, "");
      const pan = root.querySelector(".s12-pan");
      pan.insertAdjacentHTML("beforeend",

      root.querySelector(".s12-svg").innerHTML =
        `<g class="s12-vale">${KR.vale(330, 1550, 0.72, { feliz: true, sinMic: true })}</g>` +
        `<g class="s12-ag">${KR.agente(760, 1550, 0.78)}</g>` +
        `<g class="s12-cor"><path d="M545 1260 C505 1230 491 1206 505 1188 C517 1174 537 1180 545 1196 C553 1180 573 1174 585 1188 C599 1206 585 1230 545 1260 Z" fill="${KR.MAG}" stroke="${I}" stroke-width="6"/></g>` +

      const tl = gsap.timeline({ paused: true });
      const K = KR.kit(tl, root);
      const { q, qa } = K;

      const NINGUNA = 0.51;
      const CLIENTA = 0.93;
      const CANCION = 2.09;

      tl.fromTo(q(".s12-escenario"), { scale: 1.04 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);

      Array.from(pan.querySelectorAll(".s12-est span")).forEach((s, i) => {
        gsap.set(s, { opacity: 0.2 });
        tl.fromTo(s, { opacity: 0.2, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(3)", immediateRender: false }, NINGUNA + i * 0.12);

      // "ninguna clienta": Vale feliz, abrazada con el agente
      tl.fromTo(q(".s12-vale .kr-v"), { x: -60 }, { x: 0, duration: 0.35, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s12-ag .kr-ag"), { x: 60 }, { x: 0, duration: 0.35, ease: "back.out(1.6)" }, 0);
      K.origen(q(".s12-vale .kr-v"), "0 0");
      tl.to(q(".s12-vale .kr-v"), { rotation: 4, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.4);
      K.origen(q(".s12-ag .kr-ag"), "0 0");
      tl.to(q(".s12-ag .kr-ag"), { rotation: -4, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.4);
      K.origen(q(".s12-cor"), "545 1220");
      K.pop(q(".s12-cor"), CLIENTA);
      tl.to(q(".s12-cor"), { scale: 1.2, duration: 0.15, yoyo: true, repeat: 5, ease: "power2.out" }, CLIENTA + 0.35);
      qa(".s12-c").forEach((c, i) => tl.fromTo(c, { y: -200, opacity: 0 }, { y: 120, opacity: 1, duration: 1.6, ease: "power1.in", immediateRender: false }, 0.2 + i * 0.1));
      // "canción": el tema se tacha
      const tach = pan.querySelector(".s12-tachado");
      gsap.set(tach, { scaleX: 0 });
      tl.to(tach, { scaleX: 1, duration: 0.25, ease: "power2.out" }, CANCION);
