<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/karaoke.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "Outfit"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Outfit-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-publico"] .s02-capa, [data-composition-id="s02-publico"] .s02-escenario { position: absolute; inset: 0; }
    [data-composition-id="s02-publico"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s02-publico"] .s02-uuh { left: 70px; top: 590px; font-size: 80px; color: #12081f; background: #ffd81a; }
    [data-composition-id="s02-publico"] .s02-dale { left: 520px; top: 800px; font-size: 62px; background: #ff2fa0; color: #fff6e8; }
  </style>
  <div id="root" data-composition-id="s02-publico" data-width="1080" data-height="1920" data-duration="2.88">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="2.88" data-track-index="0">
      <div class="s02-escenario">
        <svg class="s02-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="kr-globo s02-uuh">¡UUUH!</div>
        <div class="kr-globo s02-dale">¡DALE, VALE!</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-publico";
      const DUR = 2.88;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      root.querySelector(".s02-svg").innerHTML =
        `<path class="s02-cono" d="M640 0 L420 1250 L860 1250 Z" fill="#fff6e8" opacity="0.1"/>
         <ellipse cx="640" cy="1240" rx="200" ry="30" fill="#fff6e8" opacity="0.12"/>` +
        `<g class="s02-vale">${KR.vale(640, 1250, 0.62, { cerrados: true, lagrima: true })}</g>` +
        `<g class="s02-pub">${KR.publico(-30, 1600, 5, 228, { chopp: [1, 3] })}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = KR.kit(tl, root);
      const { q, qa } = K;

      const DALE = 1.07;
      const VALE = 1.57;

      tl.fromTo(q(".s02-escenario"), { scale: 1.06 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "50% 60%" }, 0);
      tl.fromTo(q(".s02-pub"), { y: 60 }, { y: 0, duration: 0.35, ease: "back.out(1.5)" }, 0);
      // "¡Uuuh!": las cabezas se mecen
      qa(".kr-pub-k").forEach((k, i) => {
        tl.fromTo(k, { y: 0 }, { y: -18, duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, 0.05 + i * 0.06);
      });
      K.golpe(q(".s02-uuh"), 0.1, -5);
      tl.to(q(".s02-uuh"), { scale: 1.08, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.3);
      // "¡Dale!": los chopps arriba
      qa(".kr-pub-chopp").forEach((c, i) => {
        tl.fromTo(c, { y: 0 }, { y: -50, duration: 0.18, ease: "back.out(2)", immediateRender: false }, DALE + i * 0.05);
        tl.to(c, { y: -30, duration: 0.15, yoyo: true, repeat: 4, ease: "sine.inOut" }, DALE + 0.25);
      });
      K.pop(q(".s02-dale"), DALE);
      tl.fromTo(q(".s02-dale"), { rotation: 0 }, { rotation: 4, duration: 0.1, yoyo: true, repeat: 3, immediateRender: false }, VALE);
      // Vale al fondo se balancea
      K.origen(q(".s02-vale .kr-v"), "0 0");
      tl.fromTo(q(".s02-vale .kr-v"), { rotation: -3 }, { rotation: 3, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);

      K.salida(q("#s02-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
