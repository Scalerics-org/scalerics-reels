      // aparece entero con golpe

        if (i + 1 < ET.length) tl.to(el, { opacity: 0, y: -8, duration: 0.2 }, ET[i + 1] - 0.15);

      const ENTRE = 0.7, APRETAR = 1.3, ALGO = 2.1, CORTA = 2.8;

      gsap.set(PR, { scale: 0.9, svgOrigin: "0 0" });
      gsap.set(q(".s06-m"), { x: 540, y: 960 });
      gsap.set(qa(".s06-fl, .s06-ct"), { opacity: 0 });
      gsap.set(q(".s06-partes"), { opacity: 0 });
      tl.fromTo(q(".s06-p"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0);
      // el molde baja desde arriba, grande

      tl.fromTo(MR, { scale: 1.2, svgOrigin: "0 0" }, { scale: 1.2, svgOrigin: "0 0", duration: 0.01 }, 0);

      qa(".s06-fl").forEach((el, i) => pop(el, ENTRE + 0.2 + i * 0.06));
      // "apretar": se cierra a presión
      tl.to(MR, { scale: 0.9, svgOrigin: "0 0", duration: 0.3, ease: "power3.in" }, APRETAR);
