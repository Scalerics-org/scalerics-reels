  <script>
    (function () {
      const ID = "s08-equipo";
      const DUR = 3.25;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // dibuja trazos (stroke-dashoffset); opacity 0 hasta que arrancan (sin puntitos de los caps)
      const dibujar = (els, t, dur, desde, paso) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * (paso ?? 0.04);
          gsap.set(el, { strokeDasharray: L + 1, strokeDashoffset: (L + 1) * (desde ?? 1), opacity: t0 <= 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: (L + 1) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      // aparece entero con golpe
      const pop = (el, t, o) => tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: o ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      // texto que se escribe de izquierda a derecha
      const escribir = (el, t, d) => tl.fromTo(el, { clipPath: "inset(-20% 100% -20% 0)" }, { clipPath: "inset(-20% 0% -20% 0)", duration: d ?? 0.5, ease: "power1.inOut" }, t);
      // aparece suave desde abajo
      const subir = (el, t, o) => tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: o ?? 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
      // late una vez
      const latir = (el, t, s, org) => tl.to(el, { scale: s ?? 1.1, svgOrigin: org ?? "0 0", duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const etiquetas = (ET) => ET.forEach((t, i) => {
        const el = q(".e" + (i + 1));
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        if (i + 1 < ET.length) tl.to(el, { opacity: 0, y: -8, duration: 0.2 }, ET[i + 1] - 0.15);
      });

      const PUNTA = 0.11, TRABAJO = 1.31, MANO = 1.81, EQUIPO = 2.41;
      dibujar([q(".s08-card")], 0, 0.5, 0.6);
      subir(q(".s08-head"), 0.1);
      for (let i = 0; i < 4; i++) {
        pop(q(".s08-pt" + i), PUNTA + i * 0.12);
        pop(q(".s08-box" + i), PUNTA + 0.05 + i * 0.12);
        escribir(q(".s08-tx" + i), TRABAJO - 0.15 + i * 0.13, 0.4);
      }
      // "mano": los casilleros siguen vacíos, laten
      tl.to(qa("[class*='s08-box']"), { opacity: 0.4, duration: 0.12, yoyo: true, repeat: 3 }, MANO);
      // "equipo": tres personas, con todo eso encima
      qa(".s08-per").forEach((el, i) => pop(el, EQUIPO - 0.1 + i * 0.1));
      tl.to(qa(".s08-per"), { y: 6, duration: 0.25, ease: "power2.in", yoyo: true, repeat: 1 }, EQUIPO + 0.4);
      etiquetas([TRABAJO, EQUIPO]);
      tl.to(q("#s08-equipo-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
