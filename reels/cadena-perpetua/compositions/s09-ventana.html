  <script>
    (function () {
      const ID = "s09-ventana";
      const DUR = 6.95;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena)

      const VENTANA = 1.25;
      const CONTRATO = 2.57;
      const SOBRINO = 3.18;
      const COPIAR = 3.96;
      const PRESOS = 5.27;

      const golpe = (t, f = 1) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s09-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      // A: la leyenda (cuadro 0 a medio entrar)
      tl.fromTo(q(".s09-leyenda"), { opacity: 0.4, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 0);
      tl.fromTo(q(".s09-a svg"), { opacity: 0.4, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);
      // las piernas patalean y se van por la ventana
      tl.to(q(".s09-piernas"), { rotation: 6, svgOrigin: "545 955", duration: 0.1, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.2);
      tl.to(q(".s09-piernas"), { y: -260, opacity: 0, duration: 0.35, ease: "power3.in" }, VENTANA + 0.2);
      tl.fromTo(q(".s09-bano"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, VENTANA - 0.1);
      tl.to(q(".s09-a"), { opacity: 0, x: -200, duration: 0.25, ease: "power2.in" }, CONTRATO - 0.25);

      // B: el pibe y el sobrino copiando
      gsap.set(q(".s09-b"), { opacity: 0 });
      tl.fromTo(q(".s09-b"), { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, CONTRATO - 0.05);
      gsap.set(q(".s09-sob"), { opacity: 0 });
      tl.fromTo(q(".s09-sob"), { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, SOBRINO - 0.1);
      const rots = qa(".s09-rot");
      gsap.set(rots, { opacity: 0 });
      tl.fromTo(rots[0], { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, CONTRATO + 0.2);
      tl.fromTo(rots[1], { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, SOBRINO + 0.1);
      // los dos tipean a la par
      tl.to([q(".s09-pibe"), q(".s09-sob")], { y: 8, duration: 0.08, yoyo: true, repeat: 15, ease: "none" }, COPIAR - 0.2);
      // "presos": caen las rejas sobre los dos y sello
      gsap.set([q(".s09-rejas"), q(".s09-sello")], { opacity: 0 });
      tl.fromTo(q(".s09-rejas"), { opacity: 0, y: -900 }, { opacity: 1, y: 0, duration: 0.25, ease: "power4.in", immediateRender: false }, PRESOS - 0.2);
      golpe(PRESOS + 0.05, 1.4);
      tl.fromTo(q(".s09-sello"), { opacity: 0, scale: 2.2, rotation: -12 }, { opacity: 1, scale: 1, rotation: -5, duration: 0.15, ease: "power4.in", immediateRender: false }, PRESOS + 0.25);
      golpe(PRESOS + 0.4, 0.8);

      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
