  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 75.11;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      // segundos globales (de assets/voice/palabras.json)
      const DIAS = [0, 4.88, 9.65, 20.53, 29.77, 63.57];
      const TURNOS = [[0, "v"], [4.88, "d"], [16.85, "g"], [20.53, "d"], [25.68, "v"], [29.77, "d"], [34.83, "v"], [39.34, "d"], [41.91, "v"], [50.67, "o"], [60.62, "g"], [63.57, "d"], [68.22, "o"]];
      const PARPADEO = [16.85, 60.62];
      const LLAVE = 51.45;
      const FLASHES = [49.42, 51.89];

      // las sombras de las rejas se corren despacio (la lamparita se hamaca)
      tl.fromTo(q(".am-sombras"), { x: -20 }, { x: 30, duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".am-cartel"), { y: -30, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".am-dia"), { scale: 1.3, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, 0.1);

      // contador de días: cada "Día" cambia el número (se borra y se escribe en tiza)
      const NS = [".am-n0", ".am-n1", ".am-n2", ".am-n3", ".am-n4", ".am-n5"];
      gsap.set(q(NS[0]), { opacity: 1 });
      DIAS.forEach((t, i) => {
        if (i === 0) return;
        tl.to(q(NS[i - 1]), { opacity: 0, filter: "blur(4px)", duration: 0.12 }, t - 0.05);
        tl.fromTo(q(NS[i]), { opacity: 0, scale: 1.6, rotation: -6 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.22, ease: "back.out(2)", immediateRender: false }, t);
        tl.to(q(".am-dia"), { scale: 1.12, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, t);
      });

      // chapitas: quién habla
      const CH = { d: ".am-chd", v: ".am-chv", g: ".am-chg", o: ".am-cho" };
      let ant = null;
      TURNOS.forEach(([t, quien]) => {
        const el = q(CH[quien]);
        if (ant && ant !== el) tl.to(ant, { opacity: 0, x: -30, duration: 0.12, ease: "power2.in" }, t - 0.12);
        if (ant !== el) tl.fromTo(el, { opacity: 0, x: -40, rotation: -5 }, { opacity: 1, x: 0, rotation: 0, duration: 0.25, ease: "back.out(2.2)", immediateRender: false }, Math.max(0, t));
        ant = el;
      });

      // la lamparita parpadea (la luz se baja un instante)
      PARPADEO.forEach((t) => tl.to(q(".am-luz"), { opacity: 0.35, duration: 0.06, yoyo: true, repeat: 3, ease: "steps(1)" }, t));

      // la llave: las rejas de los costados se abren y entra luz
      tl.to(q(".am-rejas-i"), { x: -80, duration: 0.6, ease: "power3.in" }, LLAVE);
      tl.to(q(".am-rejas-d"), { x: 80, duration: 0.6, ease: "power3.in" }, LLAVE);
      tl.to(q(".am-sombras"), { opacity: 0, duration: 0.8 }, LLAVE);
      FLASHES.forEach((t) => {
        tl.to(q(".am-flash"), { opacity: 0.45, duration: 0.03 }, t);
        tl.to(q(".am-flash"), { opacity: 0, duration: 0.35, ease: "power2.out" }, t + 0.04);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
