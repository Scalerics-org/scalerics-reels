      const DUR = 3.47;

      tl.to(q(".s11-rayos"), { rotation: 15, svgOrigin: "540 980", duration: 2, ease: "none" }, SCALERICS);
      const ti = q(".s11-tilde");
      const L = ti.getTotalLength();
      gsap.set(ti, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
      tl.set(ti, { opacity: 1 }, SCALERICS + 0.35);
      tl.to(q(".s11-llave"), { opacity: 0, duration: 0.15 }, SCALERICS + 0.3);
