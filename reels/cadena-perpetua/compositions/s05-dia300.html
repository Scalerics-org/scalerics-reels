  <script>
    (function () {
      const ID = "s05-dia300";
      const DUR = 5.15;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena)
      const DIA = 0.0;
      const ONCE = 1.42;
      const UNO = 1.75;
      const TU = 2.33;
      const DEBES = 3.83;

      const golpe = (t, f = 1) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s05-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      tl.fromTo(q(".s05-cap"), { opacity: 0.5, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in" }, DIA);
      golpe(DIA + 0.18, 1.2);
      tl.fromTo(q(".s05-tel"), { y: 500, rotation: 6 }, { y: 0, rotation: -2, duration: 0.45, ease: "back.out(1.4)" }, 0.15);
      tl.fromTo(q(".s05-ventana"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.3);

      // "a las once": el reloj
      gsap.set([q(".s05-reloj"), q(".s05-uxu")], { opacity: 0 });
      tl.fromTo(q(".s05-reloj"), { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in", immediateRender: false }, ONCE - 0.1);
      golpe(ONCE + 0.06, 0.6);
      tl.fromTo(q(".s05-uxu"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.2, immediateRender: false }, UNO);
      // el reloj parpadea
      tl.to(q(".s05-reloj"), { opacity: 0.4, duration: 0.25, yoyo: true, repeat: 5, ease: "steps(1)" }, ONCE + 0.5);

      // "tu pedido está listo" una y otra vez, y "me debés el de marzo"
      const ms = qa(".s05-m");
      gsap.set(ms, { opacity: 0 });
      [0, 1, 2, 3, 4].forEach((i) => tl.fromTo(ms[i], { opacity: 0, scale: 0.6, transformOrigin: "100% 100%" }, { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(2.4)", immediateRender: false }, TU + i * 0.24));
      tl.fromTo(ms[5], { opacity: 0, scale: 0.6, transformOrigin: "100% 100%" }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2.4)", immediateRender: false }, DEBES - 0.1);
      tl.fromTo(ms[6], { opacity: 0, scale: 0.6, transformOrigin: "100% 100%" }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2.4)", immediateRender: false }, DEBES + 0.35);
      golpe(DEBES, 0.5);

      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
