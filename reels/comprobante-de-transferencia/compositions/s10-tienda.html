  <style>

    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s10-tienda"] .s10-capa { position: absolute; inset: 0; }
    [data-composition-id="s10-tienda"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

    [data-composition-id="s10-tienda"] .pesos { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 28px; fill: #5ce611; }

    [data-composition-id="s10-tienda"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s10-tienda"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }

  </style>
  <div id="root" data-composition-id="s10-tienda" data-width="1080" data-height="1920" data-duration="5.7">
    <div id="s10-escena" class="s10-capa clip" data-start="0" data-duration="5.7" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <text class="s10-marca" x="540" y="660" text-anchor="middle">Scalerics</text>
        <g class="s10-cel">
        <rect class="ln s10-dc" x="350" y="700" width="380" height="520" rx="48" />
        <line class="ln s10-dc" x1="510" y1="726" x2="570" y2="726" />

        <path class="ln-4 s10-dp" d="M600 800 V856 Q600 870 614 870 H636 Q650 870 650 856 V800 Z M650 814 Q672 814 672 832 Q672 848 650 848" />

        <g class="s10-boton"><rect class="boton" x="380" y="1030" width="320" height="76" rx="38" /><text class="boton-tx" x="540" y="1079" text-anchor="middle">Pagar</text></g>
        <text class="ui-tenue s10-mp" x="540" y="1150" text-anchor="middle">con Mercado Pago</text>
        <g class="s10-ok"><circle class="ln-ac" cx="540" cy="1068" r="36" /><path class="ln-ac" d="M522 1068 L536 1082 L560 1054" /></g>
        </g>
        <g class="s10-dedo"><rect class="tapa" x="444" y="850" width="34" height="140" rx="17" /><path class="ln" d="M444 990 V867 Q444 850 461 850 Q478 850 478 867 V990" /></g>
      </svg>
      <div class="etiqueta"><span class="s10-e1">Tu tienda online</span><span class="s10-e2">Elige y paga</span><span class="s10-e3">Listo</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s10-tienda";
      const DUR = 5.7;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const aparecer = (els, t, d) => { gsap.set(els, { opacity: 0 }); tl.to(els, { opacity: 1, duration: d ?? 0.3 }, t); };
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s10-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const SCALERICS = 0.8, TIENDA = 2.1, ELIGE = 3.4, PAGA = 4.26, MP = 4.6, LISTO = 5.0;
      gsap.set(q(".s10-marca"), { opacity: 0 });
      tl.fromTo(q(".s10-marca"), { opacity: 0, y: 12, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, SCALERICS - 0.1);
      dibujar(qa(".s10-dc"), 0, 0.6, 0.45);
      dibujar(qa(".s10-dp"), 1.5, 0.6);
      aparecer(qa(".s10-tx"), TIENDA + 0.2);
      et(1, TIENDA);
      // "elige": el dedo toca la remera
      gsap.set(q(".s10-dedo"), { y: 300, opacity: 0 });
      tl.to(q(".s10-dedo"), { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, ELIGE - 0.35);
      tl.to(q(".s10-dedo"), { y: 140, opacity: 0, duration: 0.25, ease: "power2.in" }, ELIGE + 0.2);
      dibujar([q(".s10-elegida")], ELIGE, 0.35);
      aparecer(qa(".s10-nombre"), ELIGE + 0.1);
      et(2, ELIGE);
      // "paga con Mercado Pago"
      pop(q(".s10-boton"), PAGA - 0.1, 540, 1068);
      punch(q(".s10-boton"), PAGA + 0.3, 540, 1068, 0.94);
      aparecer(q(".s10-mp"), MP);
      // "y listo"
      tl.to(q(".s10-boton"), { opacity: 0, scale: 0.6, svgOrigin: "540 1068", duration: 0.2 }, LISTO - 0.1);
      pop(q(".s10-ok"), LISTO, 540, 1068);
      et(3, LISTO);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
