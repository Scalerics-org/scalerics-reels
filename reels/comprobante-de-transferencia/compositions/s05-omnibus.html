  <script>
    (function () {
      const ID = "s05-omnibus";
      const DUR = 3.05;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const aparecer = (els, t, d) => { gsap.set(els, { opacity: 0 }); tl.to(els, { opacity: 1, duration: d ?? 0.3 }, t); };
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s05-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const CELULAR = 0.37, MANO = 1.07, OMNIBUS = 1.77, FRENANDO = 1.97;
      dibujar(qa(".s05-db"), 0, 0.55, 0.45);
      dibujar([q(".s05-ds")], 0, 0.5, 0.5);
      dibujar(qa(".s05-dv"), 0.1, 0.4);
      dibujar(qa(".s05-dp"), 0.15, 0.4);
      // el ómnibus anda: vibra y las ruedas giran
      tl.to(q(".s05-bus"), { y: -4, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
      tl.to(qa(".s05-velo line"), { x: -20, duration: 0.5, ease: "none", yoyo: true, repeat: 3 }, 0);
      pop(q(".s05-cel"), CELULAR, 546, 876);
      dibujar([q(".s05-pasa")], MANO - 0.3, 0.4);
      dibujar([q(".s05-mano")], MANO - 0.1, 0.35);
      et(1, CELULAR);
      // "frenando": tirón
      tl.to(q(".s05-bus"), { rotation: 2.5, svgOrigin: "800 1106", duration: 0.18, ease: "power2.out" }, FRENANDO);
      tl.to(q(".s05-bus"), { rotation: 0, svgOrigin: "800 1106", duration: 0.45, ease: "back.out(2)" }, FRENANDO + 0.2);
      tl.to(q(".s05-persona"), { rotation: 12, svgOrigin: "490 942", duration: 0.2, ease: "power2.out" }, FRENANDO + 0.02);
      tl.to(q(".s05-persona"), { rotation: 0, svgOrigin: "490 942", duration: 0.5, ease: "back.out(2)" }, FRENANDO + 0.24);
      tl.to(q(".s05-cel"), { rotation: 25, svgOrigin: "546 876", duration: 0.1, yoyo: true, repeat: 3, ease: "sine.inOut" }, FRENANDO + 0.05);
      tl.to(qa(".s05-velo line"), { opacity: 0, duration: 0.2 }, FRENANDO);
      dibujar(qa(".s05-df"), FRENANDO, 0.3);
      et(2, FRENANDO);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
