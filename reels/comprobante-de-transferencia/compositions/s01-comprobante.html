  <script>
    (function () {
      const ID = "s01-comprobante";
      const DUR = 4.85;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const aparecer = (els, t, d) => { gsap.set(els, { opacity: 0 }); tl.to(els, { opacity: 1, duration: d ?? 0.3 }, t); };
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s01-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const COMPRARTE = 0.5, MANDARTE = 1.4, COMPROBANTE = 2.0, TRANSF = 2.8, NO = 3.78, COMPRAN = 4.1;
      tl.fromTo(q(".s01-todo"), { scale: 0.97, svgOrigin: "600 910" }, { scale: 1.02, svgOrigin: "600 910", duration: DUR, ease: "none" }, 0);
      // el celular arranca medio dibujado
      dibujar(qa(".s01-dc"), 0, 0.6, 0.45);
      aparecer(qa(".s01-txt"), 0.2);
      pop(q(".s01-pide"), 0.25, 286, 838);
      // el cliente, con la plata en la mano
      gsap.set(q(".s01-cliente"), { x: 860, y: 1180 });
      dibujar(qa(".s01-df"), 0.05, 0.55, 0.4);
      dibujar([q(".s01-suelo")], 0, 0.5, 0.5);
      pop(q(".s01-billete"), COMPRARTE, -73, -107);
      punch(q(".s01-billete"), COMPRARTE + 0.45, -73, -107, 1.15);
      et(1, MANDARTE);
      punch(q(".s01-pide"), MANDARTE, 438, 782, 1.05);
      // "comprobante": el ticket de la transferencia
      pop(q(".s01-tk"), COMPROBANTE - 0.1, 484, 1000);
      dibujar(qa(".s01-dt"), COMPROBANTE, 0.6);
      aparecer(qa(".s01-tt"), COMPROBANTE + 0.3);
      // "transferencia": el relojito de espera
      pop(q(".s01-reloj"), TRANSF, 310, 1100);
      tl.fromTo(q(".s01-aguja"), { rotation: 0, svgOrigin: "310 1100" }, { rotation: 540, svgOrigin: "310 1100", duration: 1.6, ease: "none" }, TRANSF);
      // el cliente espera: la plata baja
      tl.to(q(".s01-billete"), { y: 8, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, TRANSF + 0.2);
      // "no te compran": se da vuelta y se va
      tl.to(q(".s01-cliente-in"), { scaleX: -1, svgOrigin: "0 -90", duration: 0.18, ease: "power2.inOut" }, NO - 0.1);
      tl.to(q(".s01-billete text"), { scaleX: -1, svgOrigin: "-73 -107", duration: 0.18, ease: "power2.inOut" }, NO - 0.1);
      tl.to(q(".s01-cliente"), { x: 1120, duration: 0.6, ease: "power2.in" }, NO + 0.1);
      tl.to(q(".s01-ticket"), { opacity: 0.4, duration: 0.3 }, COMPRAN - 0.1);
      pop(q(".s01-badge"), COMPRAN, 600, 856);
      et(2, NO);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
