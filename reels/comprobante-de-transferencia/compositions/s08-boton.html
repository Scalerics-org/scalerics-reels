  <script>
    (function () {
      const ID = "s08-boton";
      const DUR = 4.45;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const aparecer = (els, t, d) => { gsap.set(els, { opacity: 0 }); tl.to(els, { opacity: 1, duration: d ?? 0.3 }, t); };
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s08-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const OTRO = 1.21, COBRA = 2.28, BOTON = 2.71, SE = 3.41, DORMIR = 3.61;
      dibujar(qa(".s08-dc"), 0, 0.6, 0.45);
      aparecer(q(".s08-tx"), 0.2);
      pop(q(".s08-boton"), 0.4, 740, 1038);
      dibujar(qa(".s08-dl"), OTRO - 0.4, 0.55);
      gsap.set(q(".s08-pers"), { scaleY: 0, svgOrigin: "325 884" });
      gsap.set(q(".s08-luna"), { opacity: 0 });
      et(1, OTRO);
      // "cobra con un botón": el dedo toca
      gsap.set(q(".s08-dedo"), { y: 260, opacity: 0 });
      tl.to(q(".s08-dedo"), { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, COBRA - 0.4);
      punch(q(".s08-boton"), COBRA + 0.05, 740, 1038, 0.94);
      tl.to(q(".s08-dedo"), { y: 120, opacity: 0, duration: 0.25, ease: "power2.in" }, COBRA + 0.25);
      dibujar([q(".s08-tick")], BOTON - 0.1, 0.3);
      et(2, BOTON);
      // "se va a dormir": baja la persiana, sale la luna, llega la plata igual
      tl.to(q(".s08-pers"), { scaleY: 1, svgOrigin: "325 884", duration: 0.45, ease: "power2.inOut" }, SE - 0.1);
      pop(q(".s08-luna"), DORMIR, 440, 745);
      gsap.set(q(".s08-aviso"), { opacity: 0 });
      tl.fromTo(q(".s08-aviso"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, DORMIR + 0.05);
      et(3, SE);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
