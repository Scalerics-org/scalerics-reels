  <style>

    [data-composition-id="s06-despues"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

    [data-composition-id="s06-despues"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-despues"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-despues"] .ln-ac4 { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-despues"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.4); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s06-despues"] .tapa { fill: #07111f; }
    [data-composition-id="s06-despues"] .punto { fill: #efeee5; }

    [data-composition-id="s06-despues"] .ui { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 26px; fill: #efeee5; }
    [data-composition-id="s06-despues"] .ui-b { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s06-despues"] .ui-tenue { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 24px; fill: rgba(239, 238, 229, 0.5); }
    [data-composition-id="s06-despues"] .pesos { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 28px; fill: #5ce611; }
    [data-composition-id="s06-despues"] .boton { fill: #5ce611; }
    [data-composition-id="s06-despues"] .boton-tx { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 30px; fill: #0b1d35; }
    [data-composition-id="s06-despues"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s06-despues"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
    [data-composition-id="s06-despues"] .s06-grande { font-size: 40px; }
  </style>
  <div id="root" data-composition-id="s06-despues" data-width="1080" data-height="1920" data-duration="5.71">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="5.71" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s06-cel">
        <rect class="ln s06-dc" x="330" y="610" width="420" height="600" rx="52" />
        <line class="ln s06-dc" x1="510" y1="638" x2="570" y2="638" />
        <text class="ui-b s06-tx s06-titulo" x="370" y="710">Transferir</text>
        <text class="ui-tenue s06-tx" x="370" y="780">Monto</text>
        <rect class="ln-4 s06-dc" x="366" y="800" width="348" height="74" rx="14" />
        <text class="pesos s06-grande s06-monto" x="392" y="852">$</text>
        <line class="ln-4 s06-cursor" x1="428" y1="816" x2="428" y2="858" />
        <text class="ui-tenue s06-tx" x="370" y="940">Cuenta</text>
        <rect class="ln-4 s06-dc" x="366" y="960" width="348" height="74" rx="14" />
        <line class="ln-tenue s06-dc" x1="390" y1="997" x2="560" y2="997" />
        <rect class="ln-4 s06-dc" x="366" y="1100" width="348" height="68" rx="34" />
        <text class="ui-b s06-tx" x="540" y="1144" text-anchor="middle">Continuar</text>
        <g class="s06-badge"><circle class="ln-ac4" cx="750" cy="640" r="22" /><path class="ln-ac4" d="M740 630 L760 650 M760 630 L740 650" /></g>
        </g>
        <g class="s06-aviso">
        <rect class="tapa" x="346" y="650" width="388" height="88" rx="24" />
        <rect class="ln-4" x="346" y="650" width="388" height="88" rx="24" />
        <circle class="punto-ac" cx="384" cy="694" r="10" />
        <text class="ui-b" x="410" y="704">Nuevo mensaje</text>
        </g>
        <g class="s06-reloj">
        <circle class="ln" cx="820" cy="900" r="86" />
        <line class="ln-4" x1="820" y1="826" x2="820" y2="838" />
        <line class="ln-4" x1="820" y1="962" x2="820" y2="974" />
        <line class="ln-4" x1="746" y1="900" x2="758" y2="900" />
        <line class="ln-4" x1="882" y1="900" x2="894" y2="900" />
        <line class="ln-ac s06-min" x1="820" y1="900" x2="820" y2="838" />
        <line class="ln s06-hora" x1="820" y1="900" x2="856" y2="900" />
        </g>
      </svg>
      <div class="etiqueta"><span class="s06-e1">Un mensaje</span><span class="s06-e2">Para después</span><span class="s06-e3">No llega</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-despues";
      const DUR = 5.71;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const aparecer = (els, t, d) => { gsap.set(els, { opacity: 0 }); tl.to(els, { opacity: 1, duration: d ?? 0.3 }, t); };
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s06-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const ENTRA = 0.92, MENSAJE = 1.32, DEJA = 2.32, DESPUES = 2.82, ESE = 3.72, LLEGA = 4.82;
      dibujar(qa(".s06-dc"), 0, 0.6, 0.45);
      aparecer(qa(".s06-tx"), 0.1);
      // el cursor parpadea esperando el monto
      gsap.set(q(".s06-cursor"), { opacity: 0 });
      for (let k = 0; k < 4; k++) tl.to(q(".s06-cursor"), { opacity: 1, duration: 0.05, yoyo: true, repeat: 1, repeatDelay: 0.22 }, 0.2 + k * 0.6);
      // "entra un mensaje": cae el aviso
      gsap.set(q(".s06-aviso"), { opacity: 0 });
      tl.fromTo(q(".s06-aviso"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, ENTRA);
      punch(q(".s06-aviso"), MENSAJE, 540, 694, 1.06);
      tl.to(q(".s06-titulo"), { opacity: 0, duration: 0.15 }, ENTRA - 0.05);
      tl.to(q(".s06-titulo"), { opacity: 1, duration: 0.3 }, DEJA + 0.15);
      et(1, ENTRA);
      // "lo deja para después": se guarda el celular
      tl.to(q(".s06-aviso"), { opacity: 0, y: -30, duration: 0.3 }, DEJA);
      tl.to(q(".s06-cel"), { scale: 0.78, x: -110, y: 40, opacity: 0.4, svgOrigin: "540 910", duration: 0.6, ease: "power2.inOut" }, DEJA);
      et(2, DEJA);
      // "ese después no llega": el reloj corre
      pop(q(".s06-reloj"), ESE - 0.4, 820, 900);
      tl.to(q(".s06-reloj"), { x: 30, duration: 0.6, ease: "power2.out" }, DEJA + 0.2);
      tl.fromTo(q(".s06-min"), { rotation: 0, svgOrigin: "820 900" }, { rotation: 1440, svgOrigin: "820 900", duration: 1.9, ease: "power1.inOut" }, ESE - 0.3);
      tl.fromTo(q(".s06-hora"), { rotation: 0, svgOrigin: "820 900" }, { rotation: 120, svgOrigin: "820 900", duration: 1.9, ease: "power1.inOut" }, ESE - 0.3);
      tl.to(qa(".s06-monto, .s06-cursor"), { opacity: 0, duration: 0.3 }, LLEGA - 0.2);
      pop(q(".s06-badge"), LLEGA, 750, 640);
      tl.to(q(".s06-reloj"), { opacity: 0.45, duration: 0.3 }, LLEGA + 0.1);
      et(3, LLEGA);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
