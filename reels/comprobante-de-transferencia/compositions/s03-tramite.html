      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s03-todo">

        <g class="s03-cliente">
        <g transform="scale(1.4)">

        <rect class="ln-4 s03-df" x="520" y="1050" width="40" height="40" rx="8" /><line class="ln-tenue s03-df" x1="590" y1="1070" x2="700" y2="1070" />

  <script>
    (function () {
      const ID = "s03-tramite";
      const DUR = 3.64;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const aparecer = (els, t, d) => { gsap.set(els, { opacity: 0 }); tl.to(els, { opacity: 1, duration: d ?? 0.3 }, t); };
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s03-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const TRAMITE = 1.32, DARTE = 2.42, PLATA = 2.82;
      tl.fromTo(q(".s03-todo"), { scale: 0.97, svgOrigin: "540 900" }, { scale: 1.02, svgOrigin: "540 900", duration: DUR, ease: "none" }, 0);
      gsap.set(q(".s03-cliente"), { x: 280, y: 1150 });
      dibujar(qa(".s03-dp"), 0, 0.5, 0.45);
      dibujar([q(".s03-suelo")], 0, 0.5, 0.5);
      aparecer(q(".s03-billete"), 0.1);
      dibujar(qa(".s03-db"), 0.45, 0.6);
      dibujar(qa(".s03-df"), TRAMITE - 0.2, 0.4);
      punch(q(".s03-form"), TRAMITE + 0.5, 630, 910, 1.04);
      et(1, TRAMITE);
      // "darte la plata": la plata quiere pasar y choca contra el formulario
      punch(q(".s03-billete"), DARTE, -73, -107, 1.2);
      qa(".s03-pt").forEach((p, i) => pop(p, DARTE + 0.1 + i * 0.12, 412 + i * 24, 1000));
      tl.to(q(".s03-form"), { x: 10, duration: 0.07, yoyo: true, repeat: 3, ease: "sine.inOut" }, PLATA);
      tl.to(qa(".s03-pt"), { opacity: 0.3, duration: 0.2 }, PLATA + 0.2);
      et(2, DARTE);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
