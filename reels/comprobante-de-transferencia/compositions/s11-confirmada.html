  <script>
    (function () {
      const ID = "s11-confirmada";
      const DUR = 7.75;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      const aparecer = (els, t, d) => { gsap.set(els, { opacity: 0 }); tl.to(els, { opacity: 1, duration: d ?? 0.3 }, t); };
      // etiqueta: et(n, t) muestra la n (1, 2, ...) y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s11-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      const LLEGA = 1.0, CONFIRMADA = 1.3, COBRADA = 2.2, SIN = 3.08, CAPTURAS = 3.3, COMPROBANTES = 3.6, ENVIO = 5.0, DAC = 5.7, CORREO = 6.2, PYA = 6.6;
      dibujar(qa(".s11-dc"), 0, 0.6, 0.45);
      tl.fromTo(q(".s11-cel"), { y: 10 }, { y: -6, duration: ENVIO, ease: "sine.inOut" }, 0);
      gsap.set(q(".s11-aviso"), { opacity: 0 });
      tl.fromTo(q(".s11-aviso"), { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, LLEGA - 0.3);
      punch(q(".s11-aviso"), CONFIRMADA, 540, 750, 1.05);
      et(1, CONFIRMADA);
      pop(q(".s11-ok"), COBRADA - 0.1, 540, 960);
      aparecer(q(".s11-cobrado"), COBRADA + 0.1);
      punch(q(".s11-ok"), COBRADA + 0.4, 540, 960, 1.1);
      // "sin capturas ni comprobantes": aparecen tenues y se tachan
      pop(q(".s11-cap"), SIN - 0.1, 860, 920);
      pop(q(".s11-tk"), SIN, 230, 920);
      const tachas = qa(".s11-tacha");
      dibujar([tachas[1]], CAPTURAS, 0.3);
      dibujar([tachas[0]], COMPROBANTES, 0.3);
      et(2, CAPTURAS);
      // "envío": todo se corre y entra la caja
      tl.to(qa(".s11-tk, .s11-cap"), { opacity: 0, duration: 0.25 }, ENVIO - 0.3);
      tl.to(q(".s11-a"), { scale: 0.72, x: -170, svgOrigin: "540 920", duration: 0.5, ease: "power2.inOut" }, ENVIO - 0.2);
      dibujar(qa(".s11-dcaja"), ENVIO, 0.5);
      tl.fromTo(q(".s11-envios"), { y: 0 }, { y: -8, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, ENVIO + 0.6);
      pop(q(".s11-t1"), DAC, 790, 990);
      pop(q(".s11-t2"), CORREO, 790, 1066);
      pop(q(".s11-t3"), PYA, 790, 1142);
      et(3, ENVIO);

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
