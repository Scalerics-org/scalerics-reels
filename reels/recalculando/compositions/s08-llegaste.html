    (function () {

      const DUR = 5.66;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(q(".s08-dest"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, DESTINO - 0.1);
      tl.to(q(".s08-ticket"), { opacity: 0.35, scale: 0.92, duration: 0.4 }, LLEGASTE);

      // "bah.": se tacha "tu destino"; "al de enfrente"
