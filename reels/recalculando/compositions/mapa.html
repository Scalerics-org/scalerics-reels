<template>

  <style>

    [data-composition-id="mapa"] .map-avance { position: absolute; inset: 0; }
    [data-composition-id="mapa"] .map-svg { position: absolute; left: 0; top: -400px; width: 3600px; height: 4400px; }
    [data-composition-id="mapa"] .map-ruta { position: absolute; inset: 0; width: 3600px; height: 3600px; }
    /* la flecha del auto, fija en pantalla */
    [data-composition-id="mapa"] .map-auto { position: absolute; left: 470px; top: 1430px; width: 140px; height: 150px; }
    [data-composition-id="mapa"] .map-halo { position: absolute; left: 400px; top: 1380px; width: 280px; height: 250px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(34, 227, 255, 0.28) 0%, rgba(34, 227, 255, 0) 70%); }
    [data-composition-id="mapa"] .map-oscuro { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5, 8, 15, 1) 0px, rgba(5, 8, 15, 0.9) 420px, rgba(5, 8, 15, 0.35) 760px, rgba(5, 8, 15, 0.2) 1400px, rgba(5, 8, 15, 0.55) 1920px); }
    [data-composition-id="mapa"] .map-rojo { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 900px 1300px at 540px 1100px, rgba(255, 59, 78, 0) 40%, rgba(255, 59, 78, 0.28) 100%); }
  </style>
  <div id="root" data-composition-id="mapa" data-width="1080" data-height="1920" data-duration="77.03">
    <div id="map-escena" class="map-capa clip" data-start="0" data-duration="77.03" data-track-index="0">
      <div class="map-persp" data-layout-allow-overflow>
        <div class="map-tilt" data-layout-allow-overflow>
          <div class="map-giro">
            <div class="map-avance">
              <svg class="map-svg" viewBox="0 0 3600 4400" aria-hidden="true">
                <defs>
                  <pattern id="map-cuadra" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
                    <rect width="400" height="400" fill="#0b1220" />
                    <rect x="46" y="46" width="308" height="308" rx="10" fill="#16203a" />
                    <rect x="70" y="70" width="120" height="110" rx="6" fill="#1a2540" />
                    <rect x="210" y="70" width="120" height="160" rx="6" fill="#1a2540" />
                    <rect x="70" y="200" width="120" height="130" rx="6" fill="#1a2540" />
                    <line x1="0" y1="0" x2="400" y2="0" stroke="#2a3a58" stroke-width="10" />
                    <line x1="0" y1="0" x2="0" y2="400" stroke="#2a3a58" stroke-width="10" />

                  <radialGradient id="map-luz">
                    <stop offset="0" stop-color="#ffc35a" stop-opacity="0.95" />
                    <stop offset="0.25" stop-color="#ffc35a" stop-opacity="0.45" />
                    <stop offset="1" stop-color="#ffc35a" stop-opacity="0" />
                  </radialGradient>

                <!-- la avenida por donde va el auto (x 1800) -->

                <!-- faroles a los costados -->
                <g class="map-faroles">
                  <circle cx="1715" cy="200" r="60" fill="url(#map-luz)" /><circle cx="1885" cy="400" r="60" fill="url(#map-luz)" />
                  <circle cx="1715" cy="600" r="60" fill="url(#map-luz)" /><circle cx="1885" cy="800" r="60" fill="url(#map-luz)" />
                  <circle cx="1715" cy="1000" r="60" fill="url(#map-luz)" /><circle cx="1885" cy="1200" r="60" fill="url(#map-luz)" />
                  <circle cx="1715" cy="1400" r="60" fill="url(#map-luz)" /><circle cx="1885" cy="1600" r="60" fill="url(#map-luz)" />

                </g>

            </div>
          </div>
          <!-- la ruta: no avanza con el mapa, va del auto hacia adelante y dobla a la derecha -->
            <svg class="map-ruta" viewBox="0 0 3600 3600" aria-hidden="true">
              <path class="map-ruta-glow" d="M1800 2600 L1800 2150 Q1800 2000 1950 2000 L3000 2000" fill="none" stroke="#22e3ff" stroke-opacity="0.25" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" />
              <path class="map-ruta-linea" d="M1800 2600 L1800 2150 Q1800 2000 1950 2000 L3000 2000" fill="none" stroke="#22e3ff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />

      <div class="map-oscuro"></div>

  </div>
  <script>
    (function () {
      const ID = "mapa";
      const DUR = 77.03;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });

      // el auto avanza: el mapa (periódico cada 400) corre hacia la cámara, en loop sin costura
      const VUELTA = 2.6;
      tl.fromTo(q(".map-avance"), { y: 0 }, { y: 400, duration: VUELTA, ease: "none", repeat: Math.ceil(DUR / VUELTA) }, 0);

      // las ruta se dibuja y se recalcula: cada vez que el GPS recalcula, se borra, parpadea en rojo y se redibuja
      const rutas = qa(".map-ruta-linea, .map-ruta-glow");
      const L = 1800;
      rutas.forEach((r) => { r.style.strokeDasharray = L; });
      tl.fromTo(rutas, { strokeDashoffset: L * 0.55 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 0);

      // cada doblada: el mundo gira 90 grados alrededor del auto
      const giros = [[4.55, -90], [30.0, -180], [44.8, -270], [52.2, -360]];
      const recalc = [0.0, 39.27];
      for (const [t, rot] of giros) {
        tl.to(q(".map-giro"), { rotation: rot, duration: 1.1, ease: "power2.inOut" }, t);
        tl.to(rutas, { strokeDashoffset: L, duration: 0.4, ease: "power2.in" }, t - 0.1);
        tl.to(rutas, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, t + 1.0);
      }
      for (const t of recalc) {
        tl.fromTo(q(".map-rojo"), { opacity: 0 }, { opacity: 1, duration: 0.18, yoyo: true, repeat: 5, ease: "steps(1)", immediateRender: false }, t);
        tl.to(rutas, { stroke: "#ff3b4e", duration: 0.05, yoyo: true, repeat: 5, ease: "steps(1)" }, t);
      }
      // la flecha del auto respira
      tl.fromTo(q(".map-halo"), { opacity: 0.6, scale: 0.9 }, { opacity: 1, scale: 1.08, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 1.3) }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
