  <style>

    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s04-foto-vieja"] .s04-tit { position: absolute; left: 90px; top: 570px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.24em; color: rgba(234, 242, 255, 0.7); text-transform: uppercase; }
    [data-composition-id="s04-foto-vieja"] .s04-foto { position: absolute; left: 90px; top: 630px; width: 900px; height: 660px; border-radius: 30px; background: #1a2540; border: 3px solid rgba(234, 242, 255, 0.2); overflow: hidden; }

  </style>
  <div id="root" data-composition-id="s04-foto-vieja" data-width="1080" data-height="1920" data-duration="3.81">
    <div id="s04-escena" class="s04-capa clip" data-start="0" data-duration="3.81" data-track-index="0">
      <div class="s04-tit">Última foto</div>
      <div class="s04-foto">
        <svg class="s04-svg" viewBox="0 0 900 660" aria-hidden="true">
          <g class="s04-local" fill="none" stroke="#ffc35a" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
            <path class="s04-tr" d="M140 600 L140 150 L760 150 L760 600" />
            <path class="s04-tr" d="M120 150 L780 150 M120 110 L780 110 L780 150 M120 110 L120 150" />
            <path class="s04-tr" d="M170 300 L380 300 L380 600 M170 300 L170 600" />
            <path class="s04-tr" d="M480 300 L720 300 L720 480 L480 480 Z" />
            <path class="s04-tr" d="M0 600 L900 600" />
          </g>
          <!-- el toldo viejo: rayado, roto, caído de un lado -->
          <g class="s04-toldo">
            <path d="M150 190 L740 190 L760 280 L690 262 L620 282 L550 262 L480 282 L410 262 L340 282 L270 262 L200 282 L130 262 Z" fill="#ffc35a" fill-opacity="0.18" stroke="#ffc35a" stroke-opacity="0.7" stroke-width="6" stroke-linejoin="round" />

  <script>
    (function () {
      const ID = "s04-foto-vieja";
      const DUR = 3.81;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };

      const HACE = 1.03, ANIOS = 1.59, TOLDO = 2.49, VIEJO = 2.79;

      // la foto entra como un flash de cámara vieja
      tl.fromTo(q(".s04-foto"), { opacity: 0, scale: 0.9, rotation: -3 }, { opacity: 1, scale: 1, rotation: -1.5, duration: 0.35, ease: "back.out(1.5)" }, 0);
      tl.fromTo(q(".s04-tit"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3 }, 0.05);
      qa(".s04-tr").forEach((p, i) => dibujar(p, 0.1 + i * 0.1, 0.55));
      tl.fromTo(q(".s04-toldo"), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.4);
      // "de hace años": la fecha titila, la foto se pone más amarilla
      gsap.set(q(".s04-fecha"), { opacity: 0 });
      tl.fromTo(q(".s04-fecha"), { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, HACE);
      tl.to(q(".s04-fecha"), { opacity: 0.3, duration: 0.12, yoyo: true, repeat: 3, ease: "steps(1)" }, ANIOS);
      tl.to(q(".s04-foto"), { scale: 1.03, duration: DUR - 0.4, ease: "none" }, 0.4);
      // "toldo viejo": círculo rojo, el toldo se cae un poco más
      dibujar(q(".s04-marca"), TOLDO - 0.2, 0.45);
      tl.to(q(".s04-toldo"), { rotation: 4, svgOrigin: "150 190", duration: 0.4, ease: "bounce.out" }, VIEJO);
      gsap.set(q(".s04-grande"), { opacity: 0 });
      tl.fromTo(q(".s04-grande"), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, VIEJO - 0.05);

      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
