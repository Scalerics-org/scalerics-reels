        });

        let actual = null;
        return (n, t) => {
          if (actual) tl.to(q(actual), { opacity: 0, y: -10, duration: 0.18 }, t - 0.05);
          actual = "." + pref + n;
          tl.fromTo(q(actual), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);

      tl.to(q(".s03-piso"), { opacity: 0, duration: 0.2 }, CUARTO);
