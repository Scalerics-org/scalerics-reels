  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 74.32;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      // segundos globales (los reescribe armar.mjs desde assets/voice/palabras.json y reel.marcas)
      const TURNOS = [[0,"m"],[3.33,"a"],[9.4,"m"],[12.4,"c"],[15.73,"d"],[18.57,"m"],[21.41,"a"],[22.52,"d"],[23.75,"m"],[26.09,"a"],[29.3,"m"],[32.05,"a"],[34.7,"m"],[38.11,"d"],[40.64,"m"],[42.12,"a"],[43.3,"m"],[53.65,"o"],[60.3,"k"],[62.63,"c"],[64.28,"a"],[65.72,"m"],[66.9,"o"]];
      const M = {"RELOJ":20.7,"DIAS":25.15,"MUEVE":26.09,"JAQUE":37.24,"MATE":40.64,"SCALERICS":55.01,"REVANCHA":65.72};

      // ---- reloj de ajedrez: TU LOCAL corre (y se va a 72 horas), ENFRENTE casi no gasta tiempo
      const fmt = (min) => { const h = Math.floor(min / 60), m = Math.floor(min % 60); return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0"); };
      const izq = q(".am-izq"), der = q(".am-der");
      const pintar = (el, x, min, col) => { el.innerHTML = AJ.seg(fmt(min), x, 30, 52, col, true); };
      pintar(izq, 34, 0, "#ff8a8a");
      pintar(der, 226, 0, "#f3e6c8");
      const reloj1 = { v: 0 };
      tl.to(reloj1, { v: 3, duration: M.RELOJ, ease: "none", onUpdate: () => pintar(izq, 34, reloj1.v, "#ff8a8a") }, 0);
      const reloj2 = { v: 3 };
      tl.to(reloj2, { v: 72 * 60, duration: M.DIAS - M.RELOJ + 0.3, ease: "power3.in", onUpdate: () => pintar(izq, 34, reloj2.v, "#ff8a8a") }, M.RELOJ);
      const reloj3 = { v: 72 * 60 };
      tl.to(reloj3, { v: 72 * 60 + (M.SCALERICS - M.DIAS) * 1.5, duration: M.SCALERICS - M.DIAS - 0.3, ease: "none", onUpdate: () => pintar(izq, 34, reloj3.v, "#ff8a8a") }, M.DIAS + 0.3);
      // el de enfrente mueve al toque: 1 minuto y vuelve a apretar el botón
      const rd = { v: 0 };
      tl.to(rd, { v: 1, duration: 0.6, ease: "steps(1)", onUpdate: () => pintar(der, 226, rd.v, "#f3e6c8") }, M.MUEVE);
      tl.to(q(".am-turno-d"), { opacity: 1, duration: 0.05 }, M.MUEVE - 0.1);
      tl.to(q(".am-turno-d"), { opacity: 0, duration: 0.05 }, M.MUEVE + 0.6);
      tl.to(q(".am-reloj"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "75% 50%" }, M.MUEVE);
      // en "días" el reloj del local tiembla en rojo
      tl.to(q(".am-reloj"), { x: -8, duration: 0.05, yoyo: true, repeat: 7, ease: "none" }, M.DIAS);
      // con Scalerics: el reloj del local vuelve a cero, en verde, y el agente mueve
      const rv = { v: 0 };
      tl.to(rv, { v: 1, duration: M.REVANCHA - M.SCALERICS, ease: "steps(1)", onUpdate: () => pintar(izq, 34, rv.v, "#5ce611") }, M.SCALERICS);
      tl.to(q(".am-lbl-i"), { color: "#5ce611", duration: 0.2 }, M.SCALERICS);
      tl.to(q(".am-turno-i"), { fill: "#5ce611", duration: 0.2 }, M.SCALERICS);

      // ---- bug del torneo
      tl.fromTo(q(".am-bug"), { x: -40, opacity: 0.3 }, { x: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".am-reloj"), { y: 40, opacity: 0.3 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      tl.fromTo(q(".am-bug small i"), { opacity: 1 }, { opacity: 0.2, duration: 0.5, yoyo: true, repeat: Math.max(0, Math.floor(DUR) * 2 - 1), ease: "steps(1)" }, 0);
      tl.to(q(".am-bug"), { borderColor: "#5ce611", duration: 0.3 }, M.SCALERICS);
      tl.to(q(".am-bug .am-sub"), { opacity: 0, duration: 0.2 }, M.SCALERICS);
      tl.to(q(".am-bug .am-ia"), { opacity: 1, duration: 0.3 }, M.SCALERICS + 0.1);

      // ---- chapa de quién habla
      const CH = { m: ".am-chm", a: ".am-cha", d: ".am-chd", c: ".am-chc", k: ".am-chk", o: ".am-cho" };
      TURNOS.forEach(([t, v], i) => {
        const fin = i + 1 < TURNOS.length ? TURNOS[i + 1][0] : DUR;
        const el = q(CH[v]);
        tl.fromTo(el, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, Math.max(0, t - 0.05));
        tl.to(el, { opacity: 0, duration: 0.12, ease: "power1.in" }, Math.max(0, fin - 0.14));
      });

      // ---- borde rojo en los jaques; flash en Scalerics
      const rojo = q(".am-rojo");
      [[0, 1.4], [M.JAQUE, 0.9], [M.MATE, 1.6]].forEach(([t, d]) => {
        tl.fromTo(rojo, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none", immediateRender: false }, t);
        tl.to(rojo, { opacity: 0.55, duration: 0.15, yoyo: true, repeat: 3, ease: "steps(1)" }, t + 0.1);
        tl.to(rojo, { opacity: 0, duration: 0.3, ease: "power2.in" }, t + d);
      });
      tl.fromTo(q(".am-flash"), { opacity: 0 }, { opacity: 0.6, duration: 0.06, ease: "none", immediateRender: false }, M.SCALERICS);
      tl.to(q(".am-flash"), { opacity: 0, duration: 0.4, ease: "power2.out" }, M.SCALERICS + 0.06);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
