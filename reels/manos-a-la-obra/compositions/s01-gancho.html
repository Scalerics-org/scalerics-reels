  <script>
    (function () {
      const ID = "s01-gancho";
      const DUR = 6.68;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, at, padre) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); padre.appendChild(e); return e; };
      // letras recortadas: cada letra en su papelito de color, torcida
      const COL = ["#ffd23f", "#ef4b3c", "#7ccf3a", "#fbf8f0"];
      const ROT = [-7, 5, -3, 8, -5, 4, -8, 3, 6, -4, 7, -6];
      const recorte = (padre, txt, cx, cy, s, k0) => {
        const out = [], paso = s * 0.92, letras = [...txt];
        const ancho = letras.reduce((a, c, i) => a + (i ? (c === " " || letras[i - 1] === " " ? paso * 0.85 : paso) : 0), 0);
        let x = cx - ancho / 2;
        letras.forEach((c, i) => {
          if (c !== " ") {
            const k = (k0 + i) % COL.length;
            const g = mk("g", { transform: `translate(${x.toFixed(1)} ${cy}) rotate(${ROT[(k0 + i) % ROT.length]})` }, padre);
            const h = mk("g", {}, g);
            mk("rect", { x: -s * 0.42, y: -s * 0.5, width: s * 0.84, height: s, fill: COL[k], class: "t", "stroke-width": 4 }, h);
            mk("text", { x: 0, y: s * 0.02, "font-size": s * 0.72, fill: COL[k] === "#ef4b3c" ? "#fbf8f0" : "#141a3c", "text-anchor": "middle", "dominant-baseline": "central", class: "fr" }, h).textContent = c;
            out.push(h);
          }
          x += c === " " || letras[i + 1] === " " ? paso * 0.85 : paso;
        });
        return out;
      };
      const t1 = recorte(q(".s01-titulo"), "MANOS A LA", 540, 650, 82, 0);
      const t2 = recorte(q(".s01-titulo"), "OBRA", 540, 748, 98, 2);

      const tl = gsap.timeline({ paused: true });
      const pop = (el, t, s) => tl.fromTo(el, { opacity: 0, scale: s ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      const dibujar = (el, t, d) => { const L = el.getTotalLength(); gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 }); tl.set(el, { opacity: 1 }, t); tl.to(el, { strokeDashoffset: 0, duration: d ?? 0.5, ease: "power2.inOut" }, t); };
      const temblor = (el, t, f) => [[-12, 7], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(el, { x: x * (f ?? 1), y: y * (f ?? 1), duration: 0.04, ease: "none" }, t + i * 0.045));

      const HOLA = 0, NEGOCIO = 2.5, JARDIN = 3.42, MANO = 4.58, PLASTICOLA = 5.42;

      // cuadro 0: el título ya a medio pegar, la Seño y la mesa entrando
      [...t1, ...t2].forEach((h, i) => tl.fromTo(h, { opacity: i < 4 ? 1 : 0, scale: i < 4 ? 1 : 1.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, i < 4 ? 0 : 0.05 + (i - 4) * 0.07));
      tl.fromTo(q(".s01-mesa"), { y: 50 }, { y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(q(".s01-seno"), { y: 90, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, 0);
      pop(q(".s01-tijera"), 0.3);
      pop(q(".s01-brilla"), 0.4);
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 0.2);
      pop(q(".s01-etiqueta path"), 0.1, 0.9);
      // "¡Hola, amiguitos!": saluda
      const BR = "330 1010";
      gsap.set(q(".s01-brazo"), { svgOrigin: "120 80" });
      for (let i = 0; i < 6; i++) tl.to(q(".s01-brazo"), { rotation: i % 2 ? -10 : 12, duration: 0.18, ease: "sine.inOut" }, 0.05 + i * 0.18);
      tl.to(q(".s01-brazo"), { rotation: 0, duration: 0.2 }, 1.15);
      tl.to(q(".s01-seno"), { rotation: -3, svgOrigin: "330 1300", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.4);
      tl.to([...t1, ...t2], { y: -6, duration: 0.4, ease: "sine.inOut", stagger: 0.05, yoyo: true, repeat: 1 }, 1.4);

      // "negocio": el dibujito del jardín
      pop(q(".s01-dibujo"), NEGOCIO - 0.1, 0.5);
      qa(".s01-cray").forEach((p, i) => dibujar(p, JARDIN - 0.7 + i * 0.12, 0.4));
      pop(q(".s01-sol"), JARDIN - 0.1, 0.3);
      pop(q(".s01-cabecita"), JARDIN + 0.1, 0.3);
      tl.fromTo(q(".s01-cartel"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, NEGOCIO + 0.1);

      // "mano": la manito se estampa
      tl.fromTo(q(".s01-manito"), { opacity: 0, scale: 1.8, svgOrigin: "690 1040" }, { opacity: 0.95, scale: 1, svgOrigin: "690 1040", duration: 0.18, ease: "power3.in" }, MANO - 0.1);
      temblor(q(".s01-dibujo"), MANO + 0.08, 0.6);
      tl.to(q(".s01-e1"), { opacity: 0, y: -10, duration: 0.2 }, MANO - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, MANO);

      // "plasticola": aparece la gigante y chorrea
      tl.fromTo(q(".s01-cola"), { y: 260, opacity: 0, rotation: -20, svgOrigin: "985 1200" }, { y: 0, opacity: 1, rotation: 0, svgOrigin: "985 1200", duration: 0.4, ease: "back.out(1.7)" }, PLASTICOLA - 0.25);
      tl.fromTo(q(".s01-gota"), { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.1 }, PLASTICOLA + 0.25);
      tl.to(q(".s01-gota"), { y: 250, duration: 0.45, ease: "power2.in" }, PLASTICOLA + 0.3);
      tl.to(q(".s01-gota"), { opacity: 0, duration: 0.05 }, PLASTICOLA + 0.75);
      tl.fromTo(q(".s01-charco"), { opacity: 0, scale: 0.2, svgOrigin: "905 1200" }, { opacity: 1, scale: 1, svgOrigin: "905 1200", duration: 0.3, ease: "back.out(2)" }, PLASTICOLA + 0.75);
      tl.to(q(".s01-boca"), { scaleY: 1.25, svgOrigin: "0 -24", duration: 0.15, yoyo: true, repeat: 1 }, PLASTICOLA);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
