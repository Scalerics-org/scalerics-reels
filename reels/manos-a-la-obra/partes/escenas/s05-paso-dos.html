  <script>
    (function () {
{{helpers}}
      const DOS = 0.25, PEGAMOS = 0.91, PLANILLA = 1.5, BIEN = 2.46, DERECHITO = 2.75, CORRIO = 3.98, FILA = 4.58;

      tl.fromTo(q(".raul"), { x: 100, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.1);

      tl.to(q(".s05-cola"), { opacity: 0, y: -140, duration: 0.25 }, PEGAMOS + 0.3);
      tl.fromTo(q(".s05-tira"), { opacity: 0, y: -200, rotation: -14, scale: 1.3, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, rotation: 0, scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "power3.in" }, PLANILLA - 0.2);
      tl.to(q(".s05-gota"), { opacity: 0, duration: 0.05 }, PLANILLA + 0.05);
      temblor(q(".s05-planilla"), PLANILLA + 0.06, 0.5);

      // "¡Bien derechito!": la regla pasa y tilde verde

      tl.to(q(".s05-regla"), { x: 60, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, BIEN + 0.3);
      tl.to(q(".s05-regla"), { opacity: 0, y: 80, duration: 0.25 }, CORRIO - 0.45);
      dibujar(q(".s05-ok"), DERECHITO + 0.1, 0.3);

      // "Se me corrió una fila.": las filas de abajo se van torcidas
      tl.to(q(".s05-ok"), { opacity: 0, duration: 0.15 }, CORRIO - 0.1);
      tl.to(q(".s05-filas"), { rotation: 4, x: 46, y: 18, svgOrigin: "110 960", duration: 0.5, ease: "back.out(2)" }, CORRIO - 0.05);
      tl.to(q(".s05-tira"), { rotation: -7, x: 30, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2)" }, CORRIO + 0.1);
      dibujar(q(".s05-circ"), FILA - 0.15, 0.5);
      pop(q(".s05-uy"), FILA, 0.4);
      tl.to(q(".raul-parpado"), { scaleY: 1.7, svgOrigin: "0 -96", duration: 0.25, ease: "sine.inOut" }, CORRIO + 0.2);
      tl.to(q(".raul-cabeza"), { rotation: -8, svgOrigin: "0 0", duration: 0.5, ease: "sine.inOut" }, CORRIO);
