  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="ambiente"] .am-vineta { position: absolute; inset: 0; background: radial-gradient(ellipse 700px 1000px at 540px 960px, rgba(11, 8, 5, 0) 50%, rgba(11, 8, 5, 0.62) 100%); }

    [data-composition-id="ambiente"] .am-ch b { display: block; font-family: "Cinzel", serif; font-weight: 900; font-size: 36px; line-height: 1; white-space: nowrap; letter-spacing: 0.04em; }
    [data-composition-id="ambiente"] .am-ch small { display: block; margin-top: 7px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 20px; letter-spacing: 0.16em; color: #ece0c4; white-space: nowrap; }
    [data-composition-id="ambiente"] .am-fecha { position: absolute; right: 40px; top: 1576px; width: 330px; height: 96px; background: #150f0b; border: 3px solid #b86e14; border-radius: 6px; box-shadow: 0 0 0 5px #150f0b, 0 0 0 7px #f2a93b; text-align: center; }
    [data-composition-id="ambiente"] .am-fecha small { position: absolute; left: 0; right: 0; top: 12px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 18px; letter-spacing: 0.3em; color: #f2a93b; }
    [data-composition-id="ambiente"] .am-fecha b { position: absolute; left: 0; right: 0; top: 42px; font-family: "Cinzel", serif; font-weight: 900; font-size: 29px; color: #ffd27a; letter-spacing: 0.04em; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="71.21">
    <div id="am-escena" class="am-capa clip" data-start="0" data-duration="71.21" data-track-index="0">
      <div class="am-vela"></div>
      <div class="am-vineta"></div>
      <div class="am-oscuro"></div>
      <div class="am-luz"></div>
      <div class="am-chapas">
        <div class="am-ch am-chm" style="color:#f2a93b"><div class="am-pl"><b>MADAME ESTHER</b><small>MÉDIUM · VIDENTE</small></div></div>
        <div class="am-ch am-chc" style="color:#e0697a"><div class="am-pl"><b>LA CLIENTA</b><small>NO SABE A QUÉ HORA ABRÍS</small></div></div>
        <div class="am-ch am-che" style="color:#bfe3cf"><div class="am-pl"><b>EL ESPÍRITU</b><small>DE TU LOCAL</small></div></div>
        <div class="am-ch am-cho" style="color:#5ce611"><div class="am-pl"><b>SCALERICS</b><small>SITIOS WEB</small></div></div>

      <div class="am-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 71.21;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      // segundos globales (de assets/voice/palabras.json, los escribe armar.mjs)
      const TURNOS = [[0,"m"],[6.32,"c"],[11.69,"m"],[19.17,"e"],[22.13,"m"],[26.57,"c"],[28.48,"m"],[32.03,"e"],[36.32,"m"],[41.28,"c"],[44.3,"m"],[51.48,"o"],[59.99,"c"],[62.72,"m"],[65.18,"o"]];
      const MARCAS = {"golpe":16.96,"muerto":41.28,"vivito":46.14,"scalerics":52.23};

      // la luz de la vela titila todo el tiempo (determinista)
      const veces = Math.floor(DUR / 0.46);
      tl.fromTo(q(".am-vela"), { opacity: 0.7 }, { opacity: 1, duration: 0.23, yoyo: true, repeat: veces * 2 - 1, ease: "sine.inOut" }, 0);
      const HASTA = MARCAS.scalerics || DUR;
      tl.fromTo(q(".am-vineta"), { opacity: 1 }, { opacity: 0.86, duration: 0.37, yoyo: true, repeat: Math.max(1, Math.floor(HASTA / 0.74)) * 2 - 1, ease: "sine.inOut" }, 0);
      tl.fromTo(q(".am-fecha"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.1);

      const CH = { m: ".am-chm", c: ".am-chc", e: ".am-che", o: ".am-cho" };
      let ant = null;
      TURNOS.forEach(([t, quien]) => {
        const el = q(CH[quien]);
        if (ant && ant !== el) tl.to(ant, { opacity: 0, x: -30, duration: 0.12, ease: "power2.in" }, t - 0.12);
        if (ant !== el) tl.fromTo(el, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(2.2)", immediateRender: false }, Math.max(0, t));
        ant = el;
      });

      // el golpe en la mesa: relámpago
      if (MARCAS.golpe) {
        tl.to(q(".am-flash"), { opacity: 0.55, duration: 0.03 }, MARCAS.golpe);
        tl.to(q(".am-flash"), { opacity: 0, duration: 0.45, ease: "power2.out" }, MARCAS.golpe + 0.05);
      }
      // "¡está muerto!": se apagan las velas; vuelve la luz con "vivito"
      if (MARCAS.muerto) {
        tl.to(q(".am-oscuro"), { opacity: 0.45, duration: 0.15 }, MARCAS.muerto);
        tl.to(q(".am-oscuro"), { opacity: 0, duration: 0.6, ease: "power2.out" }, MARCAS.vivito);
      }
      // entra Scalerics: se prende la luz del salón
      if (MARCAS.scalerics) {
        tl.to(q(".am-flash"), { opacity: 0.45, duration: 0.03 }, MARCAS.scalerics);
        tl.to(q(".am-flash"), { opacity: 0, duration: 0.5, ease: "power2.out" }, MARCAS.scalerics + 0.05);
        tl.to(q(".am-luz"), { opacity: 1, duration: 0.6 }, MARCAS.scalerics);
        tl.to(q(".am-vineta"), { opacity: 0.45, duration: 0.6 }, Math.max(MARCAS.scalerics + 0.1, Math.floor(HASTA / 0.74) * 0.74 + 0.02));
      }

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
