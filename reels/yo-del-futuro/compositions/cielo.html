  <script>
    (function () {

      const DUR = 74.04;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      const el = (tag, at, padre) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); padre.appendChild(e); return e; };

      for (let i = 0; i < 34; i++) {
        const x = (i * 317 + 61) % 1080, y = 180 + ((i * 191) % 1080), r = 2 + (i % 3) * 1.5;

      // horizontales en progresión geométrica: escalar el grupo por Q desde el horizonte = loop perfecto
      const hor = q(".ci-horizontales");
      const Q = 1.35;
      for (let k = 0, d = 3; k < 22; k++, d *= Q) el("path", { d: `M0 ${1460 + d} H1080`, stroke: "#7b2ff7", "stroke-width": 3, "vector-effect": "non-scaling-stroke" }, hor);
      const P = 0.9;
      tl.fromTo(hor, { scaleY: 1, svgOrigin: "540 1460" }, { scaleY: Q, svgOrigin: "540 1460", duration: P, ease: "none", repeat: Math.max(0, Math.floor(DUR / P) - 1) }, 0);
