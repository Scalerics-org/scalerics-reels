    (function () {
      const ID = "s07-tres-x";
      const DUR = 7.19;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const ESC = ".s07-escenario";
      const sacudon = (t, f = 1) => [[-16, 9], [12, -7], [-6, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(ESC), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: desde }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const pop = (sel, t, extra = {}) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, scale: 0.7, ...extra }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false, ...extra }, t);
      };
      const entra = (sel, t, desde = { x: -600 }) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 1, ...desde }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, t);
      };
      const dibujar = (sel, t, d = 0.5) => qa(sel).forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.to(p, { opacity: 1, duration: 0.01 }, t);
        tl.to(p, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      });
      // vaivén suave (respira) de t a t+d
      const respira = (sel, t, d, dy = 8, per = 0.5) => tl.fromTo(q(sel), { y: 0 }, { y: dy, duration: per, yoyo: true, repeat: Math.max(1, Math.round(d / per) | 1), ease: "sine.inOut", immediateRender: false }, t);
      // X roja gigante que cae (dos trazos que se dibujan + golpe)
      const equis = (sel, t) => { golpe(sel, t, 2.2); sacudon(t + 0.04, 1.1); };
      const habla = (sel, t, d, origin) => tl.fromTo(q(sel), { scaleY: 1, svgOrigin: origin }, { scaleY: 2.4, svgOrigin: origin, duration: 0.11, yoyo: true, repeat: Math.max(1, Math.round(d / 0.11)) | 1, ease: "sine.inOut", immediateRender: false }, t);

      const MAXI = 0.64, QUIERO = 1.42, NO = 2.90, TRES = 3.50, X = 4.37, UNAS = 5.24;
      // jueza: "No."
      equis(".s07-x1", 0.02);
      tl.fromTo(q(".s07-ceja"), { y: 0 }, { y: -12, duration: 0.15, immediateRender: false }, 0);
      tl.to([q(".s07-jueza"), q(".s07-x1")], { x: -900, duration: 0.3, ease: "power3.in" }, MAXI - 0.2);
      // juez bueno
      entra(".s07-simp", MAXI, { x: 900 });
      habla(".s07-boca", MAXI, 2.4, "180 302");
      pop(".s07-cor", QUIERO);
      tl.to(q(".s07-cor"), { scale: 1.12, svgOrigin: "678 534", duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, QUIERO + 0.2);
      gsap.set(q(".s07-raja"), { opacity: 0 });
      dibujar(".s07-raja path", NO - 0.3, 0.15);
      tl.to(q(".s07-cor"), { y: 120, rotation: 25, opacity: 0, svgOrigin: "678 534", duration: 0.4, ease: "power2.in" }, NO - 0.1);
      tl.to(q(".s07-raja"), { y: 120, opacity: 0, duration: 0.4, ease: "power2.in" }, NO - 0.1);
      equis(".s07-x2", NO);
      tl.to([q(".s07-simp"), q(".s07-x2")], { opacity: 0, duration: 0.2 }, TRES - 0.2);
      // ¡tres X!
      equis(".s07-a", TRES); equis(".s07-b", TRES + 0.4); equis(".s07-c", X);
      golpe(".s07-tres", X + 0.05, 2);
      tl.to([q(".s07-a"), q(".s07-b"), q(".s07-c")], { scale: 1.08, svgOrigin: "540 940", duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, X + 0.3);
      tl.to(q(".s07-tres"), { opacity: 0, duration: 0.2 }, UNAS - 0.2);
      tl.to(q(".s07-mesa"), { opacity: 0, duration: 0.2 }, TRES - 0.2);
      // el presentador le acerca el micrófono
      entra(".s07-pre", UNAS - 0.1, { x: 500 });
      habla(".s07-boca", UNAS, 1.0, "180 290");
      tl.to(q(".s07-pre .s07-brazo"), { rotation: -30, svgOrigin: "300 460", duration: 0.3, ease: "back.out(2)" }, UNAS + 0.3);

      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
