<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/momentos.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="ambiente"] .amb-capa { position: absolute; inset: 0; }
    [data-composition-id="ambiente"] .amb-vin { position: absolute; inset: 0; background: radial-gradient(ellipse 760px 1150px at 540px 940px, rgba(14, 13, 16, 0) 60%, rgba(14, 13, 16, 0.6) 100%); }
    /* barra de arriba: EN VIVO, el nombre del podcast y los oyentes */
    [data-composition-id="ambiente"] .amb-bar { position: absolute; left: 72px; top: 96px; width: 936px; height: 60px; display: flex; align-items: center; gap: 18px; }
    [data-composition-id="ambiente"] .amb-vivo { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 22px 0 18px; border-radius: 28px; background: #ff2d55; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.18em; color: #f4ead6; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-punto { width: 18px; height: 18px; border-radius: 50%; background: #f4ead6; }
    [data-composition-id="ambiente"] .amb-nombre { font-family: "Lexend", sans-serif; font-weight: 800; font-size: 30px; color: #f4ead6; letter-spacing: 0.01em; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-nombre b { color: #ff6a13; font-weight: 800; }
    [data-composition-id="ambiente"] .amb-oyentes { margin-left: auto; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px; border-radius: 28px; border: 3px solid #4a4450; background: rgba(14, 13, 16, 0.7); font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 26px; color: #f4ead6; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-oyentes svg { width: 30px; height: 30px; }
    [data-composition-id="ambiente"] .amb-num { color: #ffc53d; }
    /* las ondas de audio de quien habla */
    [data-composition-id="ambiente"] .amb-ondas { position: absolute; left: 90px; top: 1388px; width: 900px; height: 120px; }
    [data-composition-id="ambiente"] .amb-ondas .amb-b { position: absolute; bottom: 0; width: 10px; height: 120px; border-radius: 5px; transform-origin: 50% 50%; top: 0; }
    [data-composition-id="ambiente"] .amb-prog { position: absolute; left: 90px; top: 1530px; width: 900px; height: 6px; border-radius: 3px; background: #2a262d; overflow: hidden; }
    [data-composition-id="ambiente"] .amb-prog div { position: absolute; left: 0; top: 0; width: 900px; height: 6px; background: #ff6a13; transform-origin: 0 50%; }
    /* el chat del vivo: un comentario por vez */
    [data-composition-id="ambiente"] .amb-chat { position: absolute; right: 90px; top: 1574px; height: 74px; display: flex; align-items: center; gap: 14px; padding: 0 26px 0 14px; border-radius: 37px; background: #1f1b21; border: 3px solid #4a4450; font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; color: #f4ead6; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-chat i { font-style: normal; width: 46px; height: 46px; border-radius: 50%; }
    [data-composition-id="ambiente"] .amb-chat b { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 24px; color: #ffc53d; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="75.14">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="75.14" data-track-index="0">
      <div class="amb-vin"></div>
      <div class="amb-bar">
        <div class="amb-vivo"><div class="amb-punto"></div>EN VIVO</div>
        <div class="amb-nombre">Desde la <b>Cama</b></div>
        <div class="amb-oyentes"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M5 18 V15 Q5 5 15 5 Q25 5 25 15 V18" fill="none" stroke="#f4ead6" stroke-width="3" stroke-linecap="round"/><rect x="3" y="16" width="6" height="10" rx="2" fill="#ff6a13"/><rect x="21" y="16" width="6" height="10" rx="2" fill="#ff6a13"/></svg><span class="amb-num">1.204</span></div>
      </div>
      <div class="amb-ondas"></div>
      <div class="amb-prog"><div></div></div>
      <div class="amb-chats"></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const M = window.PODM;
      const DUR = M.DUR;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const COLOR = { s: "#ff6a13", n: "#ffc53d", d: "#ff2d55", o: "#f4ead6" };

      // el punto de EN VIVO late
      const P = q(".amb-punto");
      for (let t = 0.4; t < DUR - 0.5; t += 1) { tl.to(P, { opacity: 0.2, duration: 0.25, ease: "sine.inOut" }, t); tl.to(P, { opacity: 1, duration: 0.25, ease: "sine.inOut" }, t + 0.5); }

      // los oyentes suben de a poco; con el audio del oyente pegan un salto
      const num = q(".amb-num");
      const fmt = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const o = { v: 1204 };
      num.textContent = fmt(1204);
      const tramos = [[0, M.oyente, 1204, 1873], [M.oyente, M.oyente + 1.2, 1873, 2650], [M.oyente + 1.2, DUR, 2650, 3418]];
      for (const [a, b, x, y] of tramos) tl.fromTo(o, { v: x }, { v: y, duration: b - a, ease: "none", immediateRender: false, onUpdate: () => { num.textContent = fmt(o.v); } }, a);
      tl.fromTo(q(".amb-oyentes"), { scale: 1 }, { scale: 1.12, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, M.oyente);

      // ondas: 60 barras; se mueven con el color de quien habla
      const ondas = q(".amb-ondas");
      const N = 60;
      const barras = [];
      for (let i = 0; i < N; i++) {
        const b = document.createElement("div");
        b.className = "amb-b";
        b.style.left = (i * 15) + "px";
        ondas.appendChild(b);
        barras.push(b);
      }
      gsap.set(barras, { scaleY: 0.06, backgroundColor: COLOR.s });
      const hasta = M.cta + 6.4;
      barras.forEach((b, i) => {
        const c = Math.abs(i - N / 2) / (N / 2);
        const alto = Math.max(0.12, (0.45 + 0.55 * (((i * 7919) % 97) / 97)) * (1 - 0.7 * c));
        const d = 0.16 + ((i * 37) % 11) * 0.018;
        const n = Math.floor(hasta / d);
        tl.fromTo(b, { scaleY: 0.08 }, { scaleY: alto, duration: d, ease: "sine.inOut", yoyo: true, repeat: n - 1, immediateRender: false }, ((i * 13) % 7) * 0.03);
      });
      tl.to(barras, { scaleY: 0.06, duration: 0.3 }, hasta);
      for (const [t, v] of M.voces) tl.to(barras, { backgroundColor: COLOR[v], duration: 0.15, ease: "none" }, Math.max(0, t));

      // la barra de progreso del episodio
      tl.fromTo(q(".amb-prog div"), { scaleX: 0 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);

      // el chat del vivo
      const CHATS = [
        [1.6, "#ff6a13", "luchi_92", "arrancaron picante"],
        [9.4, "#ffc53d", "fede.uy", "precio por privado = caro"],
        [16.0, "#ff2d55", "cami.mvd", "la historia que dura un día"],
        [23.0, "#ff6a13", "martin_r", "de 9 a 6 trabaja todo el mundo"],
        [27.6, "#ffc53d", "ro.bel", "literal compro todo de noche"],
        [33.0, "#ff2d55", "tito_almacen", "¡eso, decíselo!"],
        [41.6, "#ff6a13", "vale.c", "¿¿qué local??"],
        [47.0, "#ffc53d", "juli_p", "pasen el nombre del local"],
        [53.0, "#ff6a13", "agus", "el barrio en el celular"],
        [61.0, "#ffc53d", "nico.uy", "yo compré anoche a las 23"],
        [67.4, "#ff2d55", "mica", "ya se lo mandé a mi tío"]
      ];
      const caja = q(".amb-chats");
      CHATS.forEach(([t, c, u, txt], i) => {
        const el = document.createElement("div");
        el.className = "amb-chat";
        el.innerHTML = '<i style="background:' + c + '"></i><b>' + u + '</b>' + txt;
        caja.appendChild(el);
        gsap.set(el, { opacity: 0 });
        const fin = i + 1 < CHATS.length ? CHATS[i + 1][0] - 0.2 : Math.min(t + 4.5, DUR - 0.4);
        tl.fromTo(el, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, t);
        tl.to(el, { opacity: 0, y: -24, duration: 0.2, ease: "power2.in" }, Math.min(fin, t + 4.2));
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
