  <script>
    (function () {
      const ID = "s08-audio";
      const DUR = 7.39;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      root.querySelector(".s08-nacho").innerHTML = PD.nacho({ mirada: -6, brazoD: "M372 452 Q452 380 432 252", manoD: [432, 240] });
      root.querySelector(".s08-don").innerHTML = PD.don({});
      const ondas = root.querySelector(".s08-ondas");
      for (let i = 0; i < 40; i++) ondas.appendChild(document.createElement("i"));
      const tl = gsap.timeline({ paused: true });
      const K = PD.kit(tl, root);
      const { q, qa } = K;
      const AUDIO = 0.68, ESC = 1.87, CAMA = 4.16, AMI = 4.69, BARRIO = 6.21;

      // "Pará": Nacho con la mano en alto
      tl.fromTo(q(".s08-nacho .pd-nacho"), { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 0);
      K.habla(q(".s08-nacho .pd-boca"), 0.02, 1.1);
      tl.to(q(".s08-nacho .pd-nacho"), { y: 400, opacity: 0, duration: 0.3, ease: "power2.in" }, ESC - 0.35);
      // "entró un audio": la notificación baja
      K.entra(q(".s08-msg"), 0.15, { y: -80 }, 0.4);
      K.entra(q(".s08-de"), 0.25, { y: -30 }, 0.3);
      const barras = qa(".s08-ondas i");
      barras.forEach((b, i) => gsap.set(b, { scaleY: 0.25 + 0.75 * (((i * 7919) % 97) / 97) }));
      // play: la onda se pone roja y se va pintando mientras habla Don
      tl.to(q(".s08-play"), { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, ESC - 0.2);
      barras.forEach((b, i) => tl.to(b, { backgroundColor: "#ff2d55", duration: 0.05 }, ESC + (i / barras.length) * (BARRIO + 0.5 - ESC)));
      K.contar(q(".s08-dur"), ESC, BARRIO + 0.5 - ESC, 47, 41, (v) => "0:" + String(Math.round(v)).padStart(2, "0"));
      // "¡Escuchame!": entra la ventana con Don gritando
      tl.fromTo(q(".s08-panel"), { scale: 0.6, opacity: 0, svgOrigin: "540 1040" }, { scale: 1, opacity: 1, svgOrigin: "540 1040", duration: 0.35, ease: "back.out(1.6)" }, ESC - 0.2);
      K.habla(q(".s08-don .pd-boca"), ESC, BARRIO + 0.5);
      // el puño en alto se sacude
      const pu = q(".s08-don .pd-brazo-d");
      for (let t = ESC + 0.1; t < BARRIO; t += 0.5) tl.fromTo(pu, { rotation: 0 }, { rotation: -12, svgOrigin: "647 1205", duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t);
      gsap.set(q(".s08-barrio"), { opacity: 0 });
      // "cama": rayitas de enojo y sacudón
      gsap.set(q(".s08-rayas"), { opacity: 0 });
      tl.to(q(".s08-rayas"), { opacity: 1, duration: 0.05 }, CAMA - 0.05);
      K.titila(q(".s08-rayas"), CAMA, 1.0, 0.2);
      tl.to(q(".s08-rayas"), { opacity: 0, duration: 0.1 }, CAMA + 1.1);
      K.sacudon(q(".s08-panel"), CAMA, 1.3);
      // "A mí me conoce todo el barrio": el toldo y los vecinos saludando
      tl.to(q(".s08-barrio"), { opacity: 1, duration: 0.2 }, AMI);
      [".s08-v1", ".s08-v2", ".s08-v3"].forEach((s, i) => tl.fromTo(q(s), { y: 200 }, { y: 0, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, AMI + 0.1 + i * 0.3));
      tl.fromTo(q(".s08-v1"), { rotation: 0 }, { rotation: 4, svgOrigin: "250 1290", duration: 0.2, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, AMI + 0.6);
      tl.fromTo(q(".s08-v2"), { rotation: 0 }, { rotation: -4, svgOrigin: "830 1290", duration: 0.2, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, AMI + 0.7);
      // Don se golpea el pecho, orgulloso, en "barrio"
      tl.to(q(".s08-don .pd-don"), { scale: 1.05, svgOrigin: "540 1400", duration: 0.15, yoyo: true, repeat: 1 }, BARRIO);

      K.etiqueta(q(".s08-et"), [[0.2, "<b>AUDIO</b> DE UN OYENTE"], [AMI, "DON · <b>TODO EL BARRIO LO CONOCE</b>"]]);
      K.salida(q("#s08-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
