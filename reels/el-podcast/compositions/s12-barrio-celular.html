<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/pod.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s12-barrio-celular"] .s12-capa { position: absolute; inset: 0; }
    [data-composition-id="s12-barrio-celular"] svg.s12-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s12-barrio-celular"] .s12-cartel { font-family: "Lexend", sans-serif; font-weight: 900; font-size: 26px; letter-spacing: 0.03em; }
    [data-composition-id="s12-barrio-celular"] .s12-btn { font-family: "Lexend", sans-serif; font-weight: 800; font-size: 30px; }
    [data-composition-id="s12-barrio-celular"] .s12-cab { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 24px; letter-spacing: 0.12em; }
  </style>
  <div id="root" data-composition-id="s12-barrio-celular" data-width="1080" data-height="1920" data-duration="4.2">
    <div id="s12-escena" class="s12-capa clip" data-start="0" data-duration="4.2" data-track-index="0">
      <svg class="s12-svg" viewBox="0 0 1080 1920" aria-hidden="true">
        <rect class="s12-pant" x="350" y="620" width="380" height="630" rx="40" fill="#1f1b21" />
        <g class="s12-cuadra"></g>
        <g class="s12-corazones" fill="#ff2d55" stroke="#0e0d10" stroke-width="5"></g>
        <g class="s12-ui">
          <text class="s12-cab" x="540" y="730" text-anchor="middle" fill="#ffc53d">TU BARRIO · ONLINE</text>
          <rect x="400" y="1060" width="280" height="70" rx="35" fill="#ff6a13" stroke="#0e0d10" stroke-width="5" />
          <text class="s12-btn" x="540" y="1106" text-anchor="middle" fill="#0e0d10">COMPRAR</text>
          <text class="s12-cab" x="540" y="1180" text-anchor="middle" fill="#f4ead6" opacity="0.7">ABIERTO SIEMPRE</text>
        </g>
        <rect class="s12-cel" x="340" y="610" width="400" height="650" rx="50" fill="none" stroke="#f4ead6" stroke-width="8" />
        <rect class="s12-cel2" x="340" y="610" width="400" height="650" rx="50" fill="none" stroke="#ff6a13" stroke-width="8" />
        <rect class="s12-isla" x="490" y="632" width="100" height="24" rx="12" fill="#4a4450" />
      </svg>
      <div class="pd-etiqueta"><span class="s12-et"></span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s12-barrio-celular";
      const DUR = 4.2;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const LOC = [["ZAPATERÍA", "#ff6a13"], ["ALMACÉN", "#ffc53d"], ["ROPA", "#ff2d55"], ["LIBRERÍA", "#ff6a13"]];
      let h = "";
      LOC.forEach(([n, c], i) => {
        const x = 70 + i * 240;
        let rayas = "";
        for (let k = 0; k < 5; k++) rayas += `<path d="M${x + 4 + k * 44} 880 L${x - 6 + k * 44} 940 H${x + 16 + k * 44} L${x + 26 + k * 44} 880 Z" fill="${c}"/>`;
        h += `<g class="s12-loc">
          <rect x="${x}" y="940" width="220" height="200" fill="#2a262d" stroke="#f4ead6" stroke-width="6"/>
          <rect x="${x + 20}" y="975" width="110" height="90" fill="#ffc53d" opacity="0.8" stroke="#0e0d10" stroke-width="4"/>
          <rect x="${x + 148}" y="990" width="56" height="150" fill="#4a4450" stroke="#0e0d10" stroke-width="4"/>
          <path d="M${x - 8} 880 H${x + 228} L${x + 236} 940 H${x - 16} Z" fill="#f4ead6" stroke="#0e0d10" stroke-width="5"/>${rayas}
          <path d="M${x - 8} 880 H${x + 228} L${x + 236} 940 H${x - 16} Z" fill="none" stroke="#0e0d10" stroke-width="5"/>
          <rect x="${x + 10}" y="826" width="200" height="48" rx="8" fill="#0e0d10" stroke="#f4ead6" stroke-width="4"/>
          <text class="s12-cartel" x="${x + 110}" y="860" text-anchor="middle" fill="#f4ead6">${n}</text></g>`;
      });
      h += `<path d="M40 1140 H1040" stroke="#f4ead6" stroke-width="6" stroke-linecap="round"/>`;
      root.querySelector(".s12-cuadra").innerHTML = h;
      const cor = (x, y) => `<path class="s12-cor" d="M${x} ${y + 18} C${x - 30} ${y - 6} ${x - 18} ${y - 34} ${x} ${y - 16} C${x + 18} ${y - 34} ${x + 30} ${y - 6} ${x} ${y + 18} Z"/>`;
      root.querySelector(".s12-corazones").innerHTML = cor(180, 800) + cor(420, 790) + cor(660, 800) + cor(900, 790);
      const tl = gsap.timeline({ paused: true });
      const K = PD.kit(tl, root);
      const { q, qa } = K;
      const QUERAMOS = 0.85, QUEREMOS = 2.18, CELULAR = 3.05;

      qa(".s12-loc").forEach((l, i) => tl.fromTo(l, { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, i * 0.08));
      qa(".s12-cor").forEach((c, i) => {
        gsap.set(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 1, scale: 0.3, svgOrigin: `${180 + i * 240} 800` }, { scale: 1.2, svgOrigin: `${180 + i * 240} 800`, duration: 0.3, ease: "back.out(2)", immediateRender: false }, QUERAMOS + i * 0.12);
        tl.to(c, { y: -60, opacity: 0, duration: 0.5, ease: "power1.in" }, QUERAMOS + 0.6 + i * 0.12);
      });
      // "Queremos": el celular se dibuja y la cuadra se mete adentro
      gsap.set([q(".s12-pant"), q(".s12-isla"), q(".s12-ui"), q(".s12-cel2")], { opacity: 0 });
      K.dibujar(q(".s12-cel"), QUEREMOS - 0.1, 0.5);
      tl.to(q(".s12-pant"), { opacity: 1, duration: 0.3 }, QUEREMOS + 0.2);
      tl.to(q(".s12-isla"), { opacity: 1, duration: 0.2 }, QUEREMOS + 0.3);
      tl.to(q(".s12-cuadra"), { scale: 0.36, x: 0, svgOrigin: "540 1000", y: -60, duration: 0.6, ease: "power3.inOut" }, QUEREMOS + 0.05);
      // "celular": pop con borde naranja y la interfaz
      tl.fromTo(q(".s12-capa svg"), { scale: 1 }, { scale: 1.06, svgOrigin: "540 935", duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, CELULAR);
      tl.to(q(".s12-cel2"), { opacity: 1, duration: 0.15 }, CELULAR);
      tl.fromTo(q(".s12-ui"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, CELULAR + 0.05);
      K.late(q(".s12-ui"), CELULAR + 0.4, 0.6, 1.03);

      K.etiqueta(q(".s12-et"), [[0.1, "<b>EL BARRIO</b>"], [QUEREMOS, "EL BARRIO · <b>EN EL CELULAR</b>"]]);
      K.salida(q("#s12-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
