  <script>
    (function () {
      const ID = "s06-nueve-a-seis";
      const DUR = 5.44;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const m = root.querySelector(".s06-marcas");
      let d = "";
      for (let i = 0; i < 12; i++) { if (i % 3 === 0) continue; const a = (i * Math.PI) / 6; d += `M${(770 + Math.sin(a) * 186).toFixed(1)} ${(900 - Math.cos(a) * 186).toFixed(1)} L${(770 + Math.sin(a) * 166).toFixed(1)} ${(900 - Math.cos(a) * 166).toFixed(1)} `; }
      m.innerHTML = `<path d="${d}"/>`;
      const tl = gsap.timeline({ paused: true });
      const K = PD.kit(tl, root);
      const { q, qa } = K;
      const PASA = 1.19, NUEVE = 2.63, SEIS = 3.22, A = 3.95, TRAB = 4.54;

      tl.fromTo(q(".s06-puerta"), { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(q(".s06-reloj"), { scale: 0.85, opacity: 0, svgOrigin: "770 900" }, { scale: 1, opacity: 1, svgOrigin: "770 900", duration: 0.4, ease: "back.out(1.6)" }, 0.1);
      gsap.set(q(".s06-aguja"), { rotation: 0, svgOrigin: "770 900" });
      tl.to(q(".s06-aguja"), { rotation: 90, svgOrigin: "770 900", duration: 1.6, ease: "none" }, 0.3);
      // "pasá a buscarlo": el cartel cae colgado y se hamaca
      gsap.set(q(".s06-cartel"), { opacity: 0 });
      tl.fromTo(q(".s06-cartel"), { opacity: 1, y: -200, rotation: 0, svgOrigin: "280 712" }, { y: 0, svgOrigin: "280 712", duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, PASA - 0.05);
      [[8, 0.3], [-6, 0.3], [4, 0.3], [-2, 0.3], [0, 0.4]].forEach(([r, dd], i) => tl.to(q(".s06-cartel"), { rotation: r, svgOrigin: "280 712", duration: dd, ease: "sine.inOut" }, PASA + 0.3 + i * 0.3));
      // "nueve": la aguja salta a las 9; "seis": gira hasta las 6 y se pinta el horario del local
      tl.to(q(".s06-aguja"), { rotation: 270, svgOrigin: "770 900", duration: 0.25, ease: "back.out(2)" }, NUEVE - 0.1);
      tl.to(q(".s06-aguja"), { rotation: 540, svgOrigin: "770 900", duration: 0.55, ease: "power2.inOut" }, SEIS - 0.1);
      K.dibujar(q(".s06-arco1"), SEIS - 0.1, 0.55);
      // "¡A esa hora estoy trabajando!": el horario de trabajo encima, igualito
      K.dibujar(q(".s06-arco2"), A, 0.5);
      K.golpe(q(".s06-pastilla"), TRAB, -4);
      K.sacudon(q(".s06-reloj"), TRAB, 1);
      K.late(q(".s06-pastilla"), TRAB + 0.2, 0.6, 1.06);

      K.etiqueta(q(".s06-et"), [[0.1, "TEMA · <b>PASÁ A BUSCARLO</b>"]]);
      K.salida(q("#s06-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
