  <script>
    (function () {
      const ID = "s07-cama";
      const DUR = 2.44;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      root.querySelector(".s07-sofi").innerHTML = PD.sofi({ mirada: 0 });
      const carro = (x, y) => `<g class="s07-carro" transform="translate(${x} ${y})"><path d="M0 0 H12 L22 34 H54 L62 10 H16"/><circle cx="26" cy="46" r="5"/><circle cx="50" cy="46" r="5"/></g>`;
      root.querySelector(".s07-carros").innerHTML = carro(380, 880) + carro(640, 860) + carro(520, 800);
      const tl = gsap.timeline({ paused: true });
      const K = PD.kit(tl, root);
      const { q, qa } = K;
      const ONCE = 0.59, NOCHE = 1.01, CAMA = 1.69;

      // Sofi mira para abajo, al celular
      gsap.set(q(".s07-sofi .pd-pupila"), { y: 6 });
      gsap.set(q(".s07-sofi .pd-brazo-d"), { opacity: 0 });
      gsap.set(q(".s07-sofi .pd-brazo-i"), { opacity: 0 });
      tl.fromTo(q(".s07-capa svg"), { scale: 1.08, svgOrigin: "540 960" }, { scale: 1, svgOrigin: "540 960", duration: 0.5, ease: "power3.out" }, 0);
      K.habla(q(".s07-sofi .pd-boca"), 0.02, 2.0);
      K.late(q(".s07-brillo"), 0, 2.4, 1.1, 0.6);
      // carritos que salen del celular
      qa(".s07-carro").forEach((c, i) => {
        gsap.set(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 0, y: 150, scale: 0.5 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, 0.15 + i * 0.35);
        tl.to(c, { y: -40, opacity: 0, duration: 0.4, ease: "power1.in" }, 0.9 + i * 0.35);
      });
      // "once": el reloj late; "noche": la luna
      K.pop(q(".s07-reloj"), ONCE - 0.1);
      K.late(q(".s07-mesita"), ONCE, 0.6, 1.04);
      tl.fromTo(q(".s07-luna"), { rotation: -30, svgOrigin: "140 690" }, { rotation: 0, svgOrigin: "140 690", duration: 0.5, ease: "back.out(2)" }, NOCHE - 0.1);
      qa(".s07-est").forEach((e, i) => K.pop(e, NOCHE + i * 0.1, 0.2));
      // "cama": ¡comprado!
      K.golpe(q(".s07-ok"), CAMA, -5);
      K.sacudon(q(".s07-cel"), CAMA, 0.6);

      K.etiqueta(q(".s07-et"), [[0.1, "<b>23:00</b> · HORA DE COMPRAR"]]);
      K.salida(q("#s07-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
