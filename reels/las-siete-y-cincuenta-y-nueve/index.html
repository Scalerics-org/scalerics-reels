<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
      @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1220; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b1220; }
      #fondo { position: absolute; inset: 0; background: #0b1220; z-index: 0; }
      #capa3d { position: absolute; inset: 0; width: 1080px; height: 1920px; z-index: 2; transform-origin: 540px 960px; }
      #tres { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      .firma { position: absolute; left: 50%; top: 1800px; height: 36px; width: auto; transform: translateX(-50%); opacity: 0.8; z-index: 4; }
      #precarga { position: absolute; left: -9999px; font: 400 40px "Caveat"; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.4" data-width="1080" data-height="1920">
      <div id="fondo" class="clip" data-start="0" data-duration="30.4" data-track-index="0"></div>
      <div id="el-cartel" class="scene" style="z-index:1" data-composition-id="cartel" data-composition-src="compositions/cartel.html" data-start="14.6" data-duration="3.2" data-track-index="12" data-track-kind="graphics"></div>
      <div id="capa3d" class="clip" data-start="0" data-duration="30.4" data-track-index="1"><canvas id="tres" width="1080" height="1920"></canvas></div>
      <div id="el-s01-linea" class="scene" style="z-index:3" data-composition-id="s01-linea" data-composition-src="compositions/s01-linea.html" data-start="11.45" data-duration="2.28" data-track-index="2" data-track-kind="graphics"></div>
      <div id="el-s02-linea" class="scene" style="z-index:3" data-composition-id="s02-linea" data-composition-src="compositions/s02-linea.html" data-start="24.1" data-duration="2.13" data-track-index="3" data-track-kind="graphics"></div>
      <div id="el-s03-cierre" class="scene" style="z-index:3" data-composition-id="s03-cierre" data-composition-src="compositions/s03-cierre.html" data-start="28.5" data-duration="1.9" data-track-index="4" data-track-kind="graphics"></div>
      <img id="firma1" class="firma clip" src="assets/logo-blanco.png" alt="Scalerics" data-start="0" data-duration="14.6" data-track-index="9" />
      <img id="firma2" class="firma clip" src="assets/logo-blanco.png" alt="Scalerics" data-start="17.8" data-duration="12.6" data-track-index="9" />
      <div id="precarga">Yerba ATRÁS</div>
      <audio id="mezcla" src="assets/audio/mezcla.wav" data-start="0" data-duration="30.4" data-track-index="30" data-volume="1"></audio>
    </div>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["tres"] = new Promise((ok) => { window.__tresListo = ok; });
    </script>
    <script type="module" src="assets/tres.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#fondo", { opacity: 1, duration: 30.4 }, 0);
      // el último cuadro de la parte 1 se va girando 540° y achicándose (el giro clásico del cartel)
      tl.fromTo("#capa3d", { scale: 1, rotation: 0 }, { scale: 0.001, rotation: 540, duration: 0.42, ease: "power2.in", immediateRender: false }, 14.6);
      // la parte 2 entra por un iris que se abre desde el centro
      tl.set("#capa3d", { scale: 1, rotation: 0, clipPath: "circle(0px at 540px 960px)" }, 15.03);
      tl.fromTo("#capa3d", { clipPath: "circle(0px at 540px 960px)" }, { clipPath: "circle(1150px at 540px 960px)", duration: 0.42, ease: "power2.in", immediateRender: false }, 17.36);
      tl.set("#capa3d", { clipPath: "none" }, 17.81);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
