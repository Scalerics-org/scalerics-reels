      const cae = (el, t, rot) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, y: -260, rotation: rot * 3, scale: 1.15 }, { opacity: 1, y: 0, rotation: rot, scale: 1, duration: 0.3, ease: "back.out(1.7)", immediateRender: false }, t);

      gsap.set(q(".s05-barra"), { opacity: 0 });
      tl.fromTo(q(".s05-barra"), { opacity: 0, y: -120, rotation: -4, scale: 1.08 }, { opacity: 1, y: 0, rotation: -1, scale: 1, duration: 0.3, ease: "back.out(1.7)", immediateRender: false }, BUSQUE - 0.2);
      escribir(q(".s05-busca"), BUSQUE + 0.1, 1.0, 100, "steps(21)");
      gsap.set(q(".s05-cursor"), { x: -510 });
      tl.to(q(".s05-cursor"), { x: 0, duration: 1.0, ease: "steps(21)" }, BUSQUE + 0.1);
