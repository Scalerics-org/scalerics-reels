  <script>
    (function () {
      const ID = "s02-ruben";
      const DUR = 5.6;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const RUBEN = 0.81;
      const TODA = 1.21;
      const VIDA = 2.41;
      const DUELE = 3.31;
      const QUIERO = 4.21;

      const escribir = (el, t, dur, desde = 100) => {
        gsap.set(el, { clipPath: "inset(0 " + desde + "% 0 0)" });
        tl.to(el, { clipPath: "inset(0 0% 0 0)", duration: dur, ease: "none" }, t);
      };
      const sacudir = (el, t, f = 1) => {
        [[-12, 6], [10, -5], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(el, { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const entra = (el, t, desde, hasta, dur = 0.32) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0 }, desde), Object.assign({ opacity: 1, duration: dur, ease: "back.out(1.7)", immediateRender: false }, hasta), t);
      };

      // cuadro 0: el almacén grande ya cae sobre la mesa
      tl.fromTo(q(".s02-local"), { y: -60, rotation: -6, scale: 1.08 }, { y: 0, rotation: -1.5, scale: 1, duration: 0.42, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s02-cartel"), { rotation: -5 }, { rotation: 4, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.2);
      // "Rubén": sube desde atrás del almacén
      gsap.set(q(".s02-rubenwrap"), { y: 400 });
      tl.to(q(".s02-rubenwrap"), { y: 0, duration: 0.38, ease: "back.out(1.5)" }, RUBEN - 0.12);
      tl.to(q(".s02-rubenwrap"), { rotation: 3, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, RUBEN + 0.3);
      gsap.set(q(".s02-nombre"), { rotation: 7 });
      entra(q(".s02-nombre"), RUBEN + 0.12, { scale: 1.5, rotation: 18 }, { scale: 1, rotation: 7, duration: 0.28 });
      escribir(q(".s02-nombre .s02-mano"), RUBEN + 0.25, 0.4);
      // "toda la vida": la foto vieja se pega al costado
      gsap.set(q(".s02-foto"), { rotation: -7 });
      entra(q(".s02-foto"), TODA, { y: -300, x: -120, rotation: -30, scale: 1.2 }, { y: 0, x: 0, rotation: -7, scale: 1, duration: 0.36 });
      sacudir(q(".s02-local"), TODA + 0.3, 0.8);
      escribir(q(".s02-fototxt"), TODA + 0.5, 0.75);
      tl.to(q(".s02-foto"), { rotation: -4, y: -8, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, VIDA);
      // "me duele": el vecino entra y se agarra el pecho
      entra(q(".s02-vecino"), DUELE - 0.35, { x: 300, rotation: 14 }, { x: 0, rotation: 2, duration: 0.3 });
      gsap.set(q(".vc-mano"), { x: 90, rotation: 30 });
      tl.to(q(".vc-mano"), { x: 0, rotation: -6, duration: 0.18, ease: "power3.out" }, DUELE);
      tl.to(q(".s02-vecino"), { scaleY: 0.94, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "50% 100%" }, DUELE + 0.05);
      // corazón rojo con curita
      gsap.set(q(".s02-corazon"), { rotation: -8 });
      entra(q(".s02-corazon"), DUELE + 0.12, { scale: 2.2, rotation: -40 }, { scale: 1, rotation: -8, duration: 0.3, ease: "back.out(2.2)" });
      gsap.set(q(".s02-corazon .s02-cinta"), { rotation: -32, scaleX: 0 });
      tl.to(q(".s02-corazon .s02-cinta"), { scaleX: 1, duration: 0.16, ease: "power3.out" }, DUELE + 0.5);
      sacudir(q("#s02-escena"), DUELE + 0.14, 1.2);
      // "lo quiero": el corazón late
      tl.to(q(".s02-corazon"), { scale: 1.18, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 3 }, QUIERO);
      tl.to(q(".s02-local"), { rotation: 1, duration: 0.6, ease: "sine.inOut" }, QUIERO);
      tl.fromTo(q(".s02-etiqueta"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.3);

      tl.to(q("#s02-escena"), { y: -120, opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
