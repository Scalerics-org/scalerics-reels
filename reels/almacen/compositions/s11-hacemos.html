  <script>
    (function () {
      const ID = "s11-hacemos";
      const DUR = 6.99;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });

      const BOTS = 0.35;
      const CONTESTAN = 0.95;
      const VOS = 1.65;
      const PUNTOS = 2.45;
      const VUELVAN = 3.55;
      const WEB = 4.85;
      const ENCUENTREN = 5.75;

      const escribir = (el, t, dur) => {
        gsap.set(el, { clipPath: "inset(0 100% 0 0)" });
        tl.to(el, { clipPath: "inset(0 0% 0 0)", duration: dur, ease: "none" }, t);
      };
      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, t);
      };
      const sacudon = (el, t) => [[-12, 6], [10, -5], [-5, 2], [0, 0]].forEach(([x, y], i) => tl.to(el, { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));

      // un papel cae y se pega; su título se estampa en la palabra
      const p = [q(".s11-p1"), q(".s11-p2"), q(".s11-p3")];
      const cae = (el, t, rot, golpe) => {
        tl.fromTo(el, { opacity: 1, y: -760, rotation: rot * 3, scale: 1.05 }, { opacity: 1, y: 0, rotation: rot, scale: 1, duration: 0.32, ease: "back.out(1.3)", immediateRender: false }, t);
        const tit = el.querySelector(".s11-titulo");
        gsap.set(tit, { opacity: 0 });
        tl.fromTo(tit, { opacity: 0, scale: 1.9 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.out", immediateRender: false }, golpe - 0.1);
        const marca = el.querySelector(".s11-marca");
        gsap.set(marca, { scaleX: 0, rotation: -2 });
        tl.to(marca, { scaleX: 1, duration: 0.2, ease: "power2.out" }, golpe + 0.05);
      };
      // a dónde va cada papel: primero una fila chica abajo, al final la fila del medio
      const fila = (el, t, cx, cy, s, rot, dur = 0.34) =>
        tl.to(el, { x: cx - 540, y: cy - 880, scale: s, rotation: rot, duration: dur, ease: "power3.inOut" }, t);

      // cuadro 0: BOTS ya viene cayendo
      gsap.set(p[1], { y: -760, opacity: 0 });
      gsap.set(p[2], { y: -760, opacity: 0 });
      tl.fromTo(p[0], { y: -420, rotation: -12, scale: 1.05 }, { y: 0, rotation: -3, scale: 1, duration: 0.3, ease: "back.out(1.3)" }, 0);
      const t0 = q(".s11-p1 .s11-titulo");
      gsap.set(t0, { opacity: 0 });
      tl.fromTo(t0, { opacity: 0, scale: 1.9 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.out", immediateRender: false }, BOTS - 0.1);
      gsap.set(q(".s11-p1 .s11-marca"), { scaleX: 0, rotation: -2 });
      tl.to(q(".s11-p1 .s11-marca"), { scaleX: 1, duration: 0.2, ease: "power2.out" }, BOTS + 0.05);
      sacudon(q(".s11-capa"), BOTS);

      // el chat que se contesta solo
      pop(q(".s11-b-yo"), 0.55);
      pop(q(".s11-esc"), CONTESTAN);
      tl.to(q(".s11-esc"), { opacity: 0.35, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 1 }, CONTESTAN + 0.2);
      tl.set(q(".s11-esc"), { opacity: 0 }, VOS - 0.23);
      pop(q(".s11-b-bot"), VOS - 0.22, 0.4);
      tl.fromTo(q(".s11-cel"), { rotation: 0 }, { rotation: 3, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, VOS - 0.2);

      // BOTS se achica a su lugar, cae PUNTOS
      fila(p[0], PUNTOS - 0.38, 230, 1300, 0.4, -4);
      cae(p[1], PUNTOS - 0.3, 3, PUNTOS);
      sacudon(q(".s11-capa"), PUNTOS);
      // los sellos, uno tras otro
      const sellos = qa(".s11-sello");
      gsap.set(sellos, { opacity: 0 });
      sellos.forEach((s, i) => {
        const t = 2.75 + i * 0.2;
        tl.fromTo(s, { opacity: 0, scale: 1.8, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.12, ease: "power4.out", immediateRender: false }, t);
        tl.to(q(".s11-tarjeta"), { y: 6, duration: 0.05, ease: "none", yoyo: true, repeat: 1 }, t + 0.1);
      });
      gsap.set(q(".s11-tpie"), { opacity: 0 });
      tl.fromTo(q(".s11-tpie"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, 3.7);
      escribir(q(".s11-vuelven"), VUELVAN + 0.1, 0.5);
      tl.fromTo(q(".s11-tarjeta"), { rotation: 0 }, { rotation: -3, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 3.9);

      // PUNTOS a su lugar, cae WEB
      fila(p[1], WEB - 0.38, 540, 1300, 0.4, 3);
      cae(p[2], WEB - 0.3, -2, WEB);
      sacudon(q(".s11-capa"), WEB);
      // la lupa busca y encuentra
      gsap.set(q(".s11-lupa"), { x: 330, y: 230, rotation: 0 });
      tl.to(q(".s11-lupa"), { x: 360, y: 90, duration: 0.3, ease: "sine.inOut" }, WEB + 0.2);
      tl.to(q(".s11-lupa"), { x: 70, y: 150, duration: 0.4, ease: "power2.inOut" }, WEB + 0.5);
      tl.to(q(".s11-lupa"), { x: 400, y: 260, duration: 0.25, ease: "power2.in" }, ENCUENTREN);
      gsap.set(q(".s11-pin"), { rotation: -45, opacity: 0 });
      tl.fromTo(q(".s11-pin"), { opacity: 0, y: -80 }, { opacity: 1, y: 0, duration: 0.25, ease: "bounce.out", immediateRender: false }, WEB + 0.3);
      gsap.set(q(".s11-elipse"), { opacity: 0 }); tl.set(q(".s11-elipse"), { opacity: 1 }, ENCUENTREN - 0.05); tl.to(q(".s11-elipse"), { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, ENCUENTREN - 0.05);
      escribir(q(".s11-aca"), ENCUENTREN + 0.05, 0.35);

      // final: los tres en fila al medio, sin parar
      fila(p[0], 6.18, 205, 1000, 0.5, -3, 0.38);
      fila(p[1], 6.18, 540, 1000, 0.5, 2, 0.38);
      fila(p[2], 6.18, 875, 1000, 0.5, -2, 0.38);
      tl.to(p, { y: "-=10", duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.05 }, 6.56);

      tl.fromTo(q(".s11-etiqueta"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.2);

      // salida
      tl.to(q("#s11-escena"), { y: -120, opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
