  <script>
    (function () {
      const ID = "s07-caso";
      const DUR = 4.51;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const NO = 1.1;
      const RUBEN = 1.9;
      const PERO = 2.9;
      const CASO = 3.3;
      const BRAZO = 350; // distancia del eje a cada plato

      const entra = (el, t, from, to, dur = 0.32, ease = "back.out(1.8)") => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, Object.assign({ opacity: 0 }, from), Object.assign({ opacity: 1, duration: dur, ease, immediateRender: false }, to), t);
      };
      const sacudon = (el, t, a = 10) => {
        [[-a, a * 0.5], [a * 0.8, -a * 0.4], [-a * 0.4, a * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(el, { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      // inclinar la balanza: la cruz gira y los platos suben o bajan sin girar
      const inclinar = (t, grados, dur, ease) => {
        const dy = BRAZO * Math.sin((grados * Math.PI) / 180);
        tl.to(q(".s07-cruz"), { rotation: grados, duration: dur, ease }, t);
        tl.to(q(".s07-aguja"), { rotation: grados, duration: dur, ease }, t);
        tl.to(q(".s07-izq"), { y: -dy, duration: dur, ease }, t);
        tl.to(q(".s07-der"), { y: dy, duration: dur, ease }, t);
      };

      // cuadro 0: la balanza cae entera sobre la mesa
      tl.fromTo(q(".s07-balanza"), { y: -80, scale: 1.06, rotation: -3 }, { y: 0, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s07-etiqueta"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.2);
      gsap.set(q(".s07-cel"), { opacity: 0 });
      gsap.set(q(".s07-corazon"), { opacity: 0 });
      // hamaca suave al principio
      inclinar(0.35, -3, 0.4, "sine.inOut");
      inclinar(0.75, 3, 0.4, "sine.inOut");

      // "no es mejor que Rubén": un cartelito "es mejor?" tachado, y la balanza va para Rubén
      entra(q(".s07-mejor"), NO - 0.1, { scale: 1.4, rotation: 14 }, { scale: 1, rotation: 4, duration: 0.25 });
      gsap.set(q(".s07-tacha"), { scaleX: 0 });
      tl.to(q(".s07-tacha"), { scaleX: 1, duration: 0.25, ease: "power2.out" }, NO + 0.2);
      inclinar(1.2, 9, 0.7, "back.out(1.6)");
      entra(q(".s07-corazon"), RUBEN - 0.05, { scale: 0.2, rotation: -30 }, { scale: 1, rotation: 10, duration: 0.3, ease: "back.out(2.6)" });
      tl.to(q(".s07-corazon"), { scale: 1.18, duration: 0.14, yoyo: true, repeat: 5, ease: "sine.inOut" }, RUBEN + 0.3);
      tl.to(q(".s07-ruben"), { y: -10, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, RUBEN + 0.1);
      tl.to(q(".s07-mejor"), { y: -16, rotation: 1, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.9);

      // "Pero me hace caso": cae el celular sobre el súper y la balanza se va de golpe
      tl.to(q(".s07-mejor"), { x: 600, rotation: 30, opacity: 0, duration: 0.25, ease: "power3.in" }, PERO - 0.3);
      entra(q(".s07-cel"), PERO - 0.05, { y: -700, rotation: -30 }, { y: 0, rotation: -6, duration: 0.25, ease: "power3.in" }, 0.25, "power3.in");
      inclinar(PERO + 0.2, -14, 0.5, "back.out(2.4)");
      sacudon(q("#s07-escena"), PERO + 0.2, 14);
      entra(q(".s07-globo"), PERO + 0.12, { scale: 0.3, x: -60, y: 60 }, { scale: 1, x: 0, y: 0, duration: 0.3, ease: "back.out(2)" });
      gsap.set(q(".s07-globo"), { transformOrigin: "10% 100%" });
      tl.to(q(".s07-corazon"), { scale: 0.6, opacity: 0.4, duration: 0.3 }, PERO + 0.3);
      entra(q(".s07-cartel"), CASO - 0.05, { scale: 1.8, rotation: -14 }, { scale: 1, rotation: -3, duration: 0.24, ease: "power4.in" }, 0.24, "power4.in");
      sacudon(q("#s07-escena"), CASO + 0.2, 16);
      tl.to(q(".s07-cartel"), { scale: 1.05, rotation: -1, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, CASO + 0.4);
      tl.to(q(".s07-globo"), { y: -8, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, CASO + 0.4);

      // salida
      tl.to(q("#s07-escena"), { y: -120, opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power3.in" }, DUR - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
