  <script>
    (function () {
      const ID = "s09-dormir";
      const DUR = 7.6;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const dibujar = (el, t, d = 0.6, desde = 1) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * desde, opacity: desde >= 1 ? 0 : 1 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const pop = (el, t, o = "50% 50%") => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: o }, { opacity: 1, scale: 1, transformOrigin: o, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t);

      const golpe = (el, t, s = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const sacudon = (t, f = 1) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s09-escenario"), { x, y, duration: 0.04, ease: "none" }, t + 0.06 + i * 0.045));

      // el celular vibra todo el tiempo con mensajes
      for (let t = 0.4; t < DUR - 0.4; t += 0.9) tl.to(q(".s09-cel"), { x: 4, duration: 0.04, yoyo: true, repeat: 5, ease: "none" }, t);
      tl.fromTo(q(".s09-vib"), { opacity: 0 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 13, ease: "steps(1)" }, 0.4);
      qa(".s09-estrellas path").forEach((e, i) => pop(e, BUENISIMO - 0.1 + i * 0.12));

      tl.fromTo(q(".s09-cartel"), { opacity: 0, rotation: -20, svgOrigin: "700 640" }, { opacity: 1, rotation: 0, svgOrigin: "700 640", duration: 0.7, ease: "elastic.out(1, 0.4)", immediateRender: false }, NUEVE - 0.15);
      tl.to(q(".s09-cartel"), { rotation: 4, svgOrigin: "700 640", duration: 0.25, yoyo: true, repeat: 1 }, OCHO);
      tl.to(q(".s09-estrellas"), { opacity: 0.3, duration: 0.2 }, NO - 0.1);
      pop(q(".s09-malo"), NO);
      dibujar(q(".s09-tacha"), MALO, 0.25);
      tl.to([q(".s09-malo"), q(".s09-tacha")], { opacity: 0, y: 40, duration: 0.15 }, DORMIR - 0.25);
      golpe(q(".s09-dormir"), DORMIR, 2.2);
      sacudon(DORMIR, 1.3);
