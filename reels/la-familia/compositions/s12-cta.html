    (function () {
      const ID = "s12-cta";
      const DUR = 8.14;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      const dibujar = (el, t, d = 0.6, desde = 1) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * desde, opacity: desde >= 1 ? 0 : 1 });

        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const pop = (el, t, o = "50% 50%") => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: o }, { opacity: 1, scale: 1, transformOrigin: o, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };
      const golpe = (el, t, s = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const sacudon = (t, f = 1) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s12-escenario"), { x, y, duration: 0.04, ease: "none" }, t + 0.06 + i * 0.045));
      const fuera = (els, t, d = 0.2) => tl.to(els, { opacity: 0, duration: d }, t);
      const ACEPTAS = 0.2, ENFRENTE = 2.3, CONT = 3.55;

      tl.fromTo(q(".s12-btn1"), { opacity: 0.4, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 0);
      tl.to(q(".s12-btn1"), { scale: 1.06, duration: 0.15, yoyo: true, repeat: 1 }, ACEPTAS + 0.4);
      pop(q(".s12-o"), 1.2);
      golpe(q(".s12-btn2"), ENFRENTE, 1.6);
      sacudon(ENFRENTE, 0.8);
      pop(q(".s12-icono"), CONT - 0.1);
      pop(q(".s12-com"), CONT + 0.1);
      qa(".s12-p").forEach((p, i) => tl.to(p, { y: -14, duration: 0.2, yoyo: true, repeat: 7, ease: "sine.inOut" }, CONT + 0.3 + i * 0.1));
      tl.to(q(".s12-icono"), { scale: 1.08, transformOrigin: "50% 50%", duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, CONT + 0.4);

      // salida
      tl.to(q("#s12-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
