    (function () {
      const ID = "s07-uno";
      const DUR = 5.69;

      const q = (s) => root.querySelector(s);

      const golpe = (el, t, s = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);

      const sacudon = (t, f = 1) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s07-escenario"), { x, y, duration: 0.04, ease: "none" }, t + 0.06 + i * 0.045));

      tl.set(qa(".s07-m"), { opacity: 1 }, 0.01);
      qa(".s07-q").forEach((m, i) => pop(m, CUANTOS + 0.4 + i * 0.15));
      tl.to(qa(".s07-q"), { y: -16, duration: 0.25, yoyo: true, repeat: 3, stagger: 0.07, ease: "sine.inOut" }, 1.2);

      golpe(q(".s07-uno"), UNO + 0.05, 2);
      sacudon(UNO + 0.05, 1.5);
      tl.to(q(".s07-uno"), { scale: 0.62, y: -150, duration: 0.35, ease: "power3.inOut" }, DUERME - 0.45);

      // "no tenemos un ejército": la tropa vuelve y la tachan

      tl.fromTo(q(".s07-ejercito"), { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, NO);
      tl.to([q(".s07-ojo"), q(".s07-rot1")], { y: -60, duration: 0.3 }, NO);
      dibujar(q(".s07-tacha"), EJ - 0.15, 0.3);
      pop(q(".s07-rot2"), EJ);
      tl.to(q(".s07-ejercito"), { opacity: 0.35, duration: 0.2 }, EJ + 0.1);
