  <script>
    (function () {
      const ID = "s01-duenio";
      const DUR = 5.43;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      const tl = gsap.timeline({ paused: true });
      // helpers (copialos en cada escena)
      const dibujar = (el, t, d = 0.6, desde = 1) => {
        const L = el.getTotalLength();
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * desde, opacity: desde >= 1 ? 0 : 1 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const pop = (el, t, o = "50% 50%") => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: o }, { opacity: 1, scale: 1, transformOrigin: o, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };
      const golpe = (el, t, s = 2.4) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: s }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const sacudon = (t, f = 1) => [[-16 * f, 9 * f], [12 * f, -7 * f], [-6 * f, 3 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, t + 0.06 + i * 0.045));

      const BARRIO = 0.4, CLIENTES = 1.45, TIENEN = 2.1, DUENIO = 2.3, NO = 3.75, VOS = 4.1;

      // cuadro 0: el capo ya está, la cámara se acerca despacio
      tl.fromTo(q(".s01-escenario"), { scale: 1.08 }, { scale: 1, duration: 3.4, ease: "power1.out", transformOrigin: "50% 55%" }, 0);
      tl.fromTo(q(".s01-capo"), { opacity: 0.55 }, { opacity: 1, duration: 0.4 }, 0);
      tl.fromTo(q(".s01-cono"), { opacity: 0.4 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 3, ease: "steps(1)" }, 0.05);
      tl.to(q(".s01-brasa"), { scale: 1.5, transformOrigin: "50% 50%", duration: 0.4, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0);
      dibujar(q(".s01-humo"), 0, 1.4, 0.6);
      tl.to(q(".s01-humo"), { y: -40, opacity: 0, duration: 1.6, ease: "none" }, 1.4);

      // "barrio": el mapa se arma
      tl.fromTo(q(".s01-mapa"), { opacity: 0.25 }, { opacity: 1, duration: 0.3 }, BARRIO - 0.1);
      dibujar(q(".s01-calles"), BARRIO - 0.2, 0.6, 0.5);
      // "clientes": los puntitos aparecen uno tras otro
      qa(".s01-clientes circle").forEach((c, i) => pop(c, CLIENTES - 0.15 + i * 0.06));

      // "tienen dueño"
      golpe(q(".s01-tienen"), TIENEN, 1.8);
      golpe(q(".s01-duenio-t"), DUENIO + 0.05);
      sacudon(DUENIO, 1);
      tl.to(q(".s01-mapa"), { opacity: 0.35, duration: 0.2 }, DUENIO);
      tl.to(q(".s01-clientes"), { fill: "#c9a24a", duration: 0.1 }, DUENIO + 0.1);

      // "y no sos vos": zoom a la cara, brillan los ojos, cae el sello
      tl.to(q(".s01-escenario"), { scale: 1.12, duration: 0.5, ease: "power3.out", transformOrigin: "50% 52%" }, NO - 0.3);
      tl.to(qa(".s01-ojo"), { scale: 1.8, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1 }, NO);
      tl.to([q(".s01-tienen"), q(".s01-duenio-t")], { opacity: 0.25, duration: 0.2 }, NO);
      gsap.set(q(".s01-sello"), { opacity: 0, rotation: -9 });
      tl.fromTo(q(".s01-sello"), { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, VOS - 0.12);
      sacudon(VOS, 1.3);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
