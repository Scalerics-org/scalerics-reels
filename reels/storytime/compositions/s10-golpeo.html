  <script>
    (function () {
      const ID = "s10-golpeo";
      const DUR = 3.95;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // trazo que se dibuja solo (invisible hasta que arranca: sin puntitos de los caps)
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength ? el.getTotalLength() : 600;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      // aparece con rebote; o.svg = svgOrigin para grupos SVG
      const pop = (el, t, o = {}) => {
        const og = o.svg ? { svgOrigin: o.svg } : {};
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: o.s ?? 0.5, rotation: o.r0 ?? 0, x: o.x0 ?? 0, y: o.y0 ?? 0, ...og }, { opacity: 1, scale: 1, rotation: o.r ?? 0, x: 0, y: 0, duration: o.d ?? 0.35, ease: o.ease ?? "back.out(2)", immediateRender: false, ...og }, t);
      };
      // texto gigante que cae de golpe
      const golpe = (el, t, r = -4) => pop(el, t - 0.1, { s: 2.4, r0: r * 4, r, d: 0.15, ease: "power4.in" });
      const fuera = (el, t, d = 0.25) => tl.to(el, { opacity: 0, scale: 0.85, duration: d, ease: "power2.in" }, t);
      const sacudon = (t, f = 1) => [[-12 * f, 6 * f], [9 * f, -5 * f], [-4 * f, 2 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const bambolea = (el, t, a = 3, d = 0.4, n = 5, og = {}) => tl.to(el, { rotation: a, duration: d, yoyo: true, repeat: n, ease: "sine.inOut", ...og }, t);

      const ABREN = 0.9, CHICOS = 1.74, MILANESA = 2.75;
      tl.fromTo(q(".s10-hoja"), { scale: 0.92, opacity: 0.6, svgOrigin: "540 980" }, { scale: 1, opacity: 1, svgOrigin: "540 980", duration: 0.25, ease: "back.out(2)" }, 0);
      pop(q(".s10-toc"), 0.05, { r0: -14, r: -5 });
      [0.05, 0.25, 0.45].forEach((t) => tl.to(q(".s10-hoja"), { x: 10, duration: 0.04, yoyo: true, repeat: 3, ease: "none" }, t));
      tl.to(q(".s10-toc"), { opacity: 0, duration: 0.2 }, ABREN - 0.1);
      // abren: la puerta gira y sale la luz dorada
      gsap.set([q(".s10-rayos"), q(".s10-mila")], { opacity: 0 });
      tl.to(q(".s10-hoja"), { scaleX: 0.08, svgOrigin: "340 980", duration: 0.45, ease: "power3.inOut" }, ABREN);
      tl.fromTo(q(".s10-rayos"), { opacity: 0, scale: 0.4, svgOrigin: "540 980" }, { opacity: 1, scale: 1, svgOrigin: "540 980", duration: 0.5, ease: "power2.out", immediateRender: false }, ABREN + 0.15);
      tl.to(q(".s10-rayos"), { rotation: 24, svgOrigin: "540 980", duration: DUR - ABREN, ease: "none" }, ABREN + 0.15);
      qa(".s10-chispas path").forEach((p) => dibujar(p, CHICOS - 0.1, 0.4));
      tl.to(q(".s10-chispas"), { opacity: 0.3, duration: 0.15, yoyo: true, repeat: 5 }, CHICOS + 0.4);
      pop(q(".s10-chicos"), CHICOS, { r0: 10, r: 3 });
      // la milanesa sale de la luz
      tl.fromTo(q(".s10-mila"), { opacity: 0, scale: 0.8, svgOrigin: "0 0" }, { opacity: 1, scale: 2.5, svgOrigin: "0 0", duration: 0.5, ease: "back.out(1.8)", immediateRender: false }, MILANESA - 0.25);
      tl.to(q(".s10-mila"), { scale: 2.7, svgOrigin: "0 0", duration: DUR - MILANESA - 0.3, ease: "sine.inOut" }, MILANESA + 0.3);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
