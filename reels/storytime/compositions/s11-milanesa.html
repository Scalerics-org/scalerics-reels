  <script>
    (function () {
      const ID = "s11-milanesa";
      const DUR = 5.05;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // trazo que se dibuja solo (invisible hasta que arranca: sin puntitos de los caps)
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength ? el.getTotalLength() : 600;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      // aparece con rebote; o.svg = svgOrigin para grupos SVG
      const pop = (el, t, o = {}) => {
        const og = o.svg ? { svgOrigin: o.svg } : {};
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: o.s ?? 0.5, rotation: o.r0 ?? 0, x: o.x0 ?? 0, y: o.y0 ?? 0, ...og }, { opacity: 1, scale: 1, rotation: o.r ?? 0, x: 0, y: 0, duration: o.d ?? 0.35, ease: o.ease ?? "back.out(2)", immediateRender: false, ...og }, t);
      };
      // texto gigante que cae de golpe
      const golpe = (el, t, r = -4) => pop(el, t - 0.1, { s: 2.4, r0: r * 4, r, d: 0.15, ease: "power4.in" });
      const fuera = (el, t, d = 0.25) => tl.to(el, { opacity: 0, scale: 0.85, duration: d, ease: "power2.in" }, t);
      const sacudon = (t, f = 1) => [[-12 * f, 6 * f], [9 * f, -5 * f], [-4 * f, 2 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s11-esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const bambolea = (el, t, a = 3, d = 0.4, n = 5, og = {}) => tl.to(el, { rotation: a, duration: d, yoyo: true, repeat: n, ease: "sine.inOut", ...og }, t);

      const LOCOS = 0.71, DORADA = 1.55, TAMANO = 2.3, PLATO = 2.96, LLORO = 3.96;
      // cuadro 0: el platazo entra grande
      tl.fromTo([q(".s11-plato"), q(".s11-limon")], { scale: 0.7, opacity: 0.6, svgOrigin: "540 1020" }, { scale: 1, opacity: 1, svgOrigin: "540 1020", duration: 0.4, ease: "back.out(1.7)" }, 0);
      tl.to([q(".s11-plato"), q(".s11-limon")], { scale: 1.04, svgOrigin: "540 1020", duration: 0.6, yoyo: true, repeat: 6, ease: "sine.inOut" }, 0.45);
      tl.fromTo(q(".s11-mila"), { scale: 0.7, opacity: 0.6, svgOrigin: "0 9" }, { scale: 1, opacity: 1, svgOrigin: "0 9", duration: 0.4, ease: "back.out(1.7)" }, 0);
      tl.to(q(".s11-mila"), { scale: 1.04, svgOrigin: "0 9", duration: 0.6, yoyo: true, repeat: 6, ease: "sine.inOut" }, 0.45);
      golpe(q(".s11-locos"), LOCOS, -3);
      sacudon(LOCOS + 0.05, 1);
      tl.to(q(".s11-locos"), { scale: 1.05, duration: 0.2, yoyo: true, repeat: 7, ease: "sine.inOut" }, LOCOS + 0.2);
      // dorada: brillos
      qa(".s11-chispas path").forEach((p) => dibujar(p, DORADA - 0.1, 0.35));
      tl.to(q(".s11-chispas"), { opacity: 0.25, duration: 0.12, yoyo: true, repeat: 9 }, DORADA + 0.3);
      tl.fromTo(q(".s11-brillo"), { opacity: 0.2 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 5, immediateRender: false }, DORADA);
      // del tamaño del plato
      dibujar(q(".s11-m1"), TAMANO - 0.1, 0.45);
      dibujar(q(".s11-m2"), TAMANO + 0.3, 0.25);
      gsap.set(qa(".s11-medida rect, .s11-medida text"), { opacity: 0 });
      tl.to(qa(".s11-medida rect, .s11-medida text"), { opacity: 1, duration: 0.15 }, PLATO - 0.05);
      tl.fromTo(qa(".s11-medida rect, .s11-medida text"), { scale: 1.5, svgOrigin: "540 1290" }, { scale: 1, svgOrigin: "540 1290", duration: 0.3, ease: "back.out(2)", immediateRender: false }, PLATO - 0.05);
      // casi lloro
      tl.to(q(".s11-medida"), { opacity: 0, duration: 0.2 }, LLORO - 0.35);
      pop(q(".s11-lloro"), LLORO - 0.2, { r0: -12, r: -3 });
      pop(q(".s11-lagrima"), LLORO, { svg: "960 776", s: 0.2 });
      tl.to(q(".s11-lagrima"), { y: 60, duration: 0.6, ease: "power1.in", yoyo: true, repeat: 1 }, LLORO + 0.3);

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
