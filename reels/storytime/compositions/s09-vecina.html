  <script>
    (function () {
      const ID = "s09-vecina";
      const DUR = 4.98;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // trazo que se dibuja solo (invisible hasta que arranca: sin puntitos de los caps)
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength ? el.getTotalLength() : 600;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      // aparece con rebote; o.svg = svgOrigin para grupos SVG
      const pop = (el, t, o = {}) => {
        const og = o.svg ? { svgOrigin: o.svg } : {};
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: o.s ?? 0.5, rotation: o.r0 ?? 0, x: o.x0 ?? 0, y: o.y0 ?? 0, ...og }, { opacity: 1, scale: 1, rotation: o.r ?? 0, x: 0, y: 0, duration: o.d ?? 0.35, ease: o.ease ?? "back.out(2)", immediateRender: false, ...og }, t);
      };
      // texto gigante que cae de golpe
      const golpe = (el, t, r = -4) => pop(el, t - 0.1, { s: 2.4, r0: r * 4, r, d: 0.15, ease: "power4.in" });
      const fuera = (el, t, d = 0.25) => tl.to(el, { opacity: 0, scale: 0.85, duration: d, ease: "power2.in" }, t);
      const sacudon = (t, f = 1) => [[-12 * f, 6 * f], [9 * f, -5 * f], [-4 * f, 2 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s09-esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const bambolea = (el, t, a = 3, d = 0.4, n = 5, og = {}) => tl.to(el, { rotation: a, duration: d, yoyo: true, repeat: n, ease: "sine.inOut", ...og }, t);

      const BODEGON = 0.46, MIJA = 1.02, GOLPEA = 2.06, FUERTE = 2.41, ATRAS = 3.06, FRITANDO = 3.52;
      tl.fromTo(q(".s09-ventana"), { x: -200, opacity: 0.5 }, { x: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".s09-vecina"), { y: 200 }, { y: 0, duration: 0.4, ease: "back.out(1.8)" }, 0.05);
      tl.fromTo(q(".s09-brazo"), { rotation: 20, svgOrigin: "380 1060" }, { rotation: -6, svgOrigin: "380 1060", duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, BODEGON);
      pop(q(".s09-puerta"), BODEGON, { svg: "780 1320", s: 0.4 });
      pop(q(".s09-gps"), MIJA, { r0: -14, r: -4 });
      bambolea(q(".s09-vecina"), MIJA + 0.2, 3, 0.3, 3, { svgOrigin: "280 1140" });
      // golpeá fuerte
      golpe(q(".s09-toc"), FUERTE, 6);
      [GOLPEA, FUERTE, FUERTE + 0.2].forEach((t) => tl.to(q(".s09-puerta"), { x: 10, duration: 0.04, yoyo: true, repeat: 3, ease: "none" }, t));
      sacudon(FUERTE, 0.9);
      // atrás, fritando
      dibujar(q(".s09-fl"), ATRAS - 0.1, 0.35);
      pop(q(".s09-atras"), ATRAS, { r0: 10, r: 4 });
      tl.to(q(".s09-toc"), { opacity: 0, y: -30, duration: 0.25 }, ATRAS + 0.2);
      qa(".s09-humo path").forEach((p, i) => dibujar(p, FRITANDO - 0.3 + i * 0.12, 0.6));
      tl.to(q(".s09-humo"), { y: -20, duration: 0.5, yoyo: true, repeat: 2, ease: "sine.inOut" }, FRITANDO + 0.3);
      pop(q(".s09-sarten"), FRITANDO - 0.2, { svg: "800 1290", s: 0.3 });
      tl.to(qa(".s09-sarten circle"), { y: -10, duration: 0.15, yoyo: true, repeat: 7, stagger: 0.07, ease: "sine.inOut" }, FRITANDO + 0.1);

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
