  <style>

    [data-composition-id="ambiente"] .amb-llena { position: absolute; inset: 0; background: #2b1d2e; border-radius: 4px; transform-origin: 0% 50%; }

    [data-composition-id="ambiente"] .amb-ojo { position: absolute; left: 722px; top: 30px; height: 60px; width: 186px; border-radius: 14px; background: rgba(43, 29, 46, 0.78); }

    [data-composition-id="ambiente"] .amb-num { position: absolute; left: 66px; top: 0; font-family: "Lexend", sans-serif; font-weight: 700; font-size: 30px; line-height: 60px; color: #fff3e6; white-space: nowrap; }
    [data-composition-id="ambiente"] .amb-x { position: absolute; right: 0; top: 34px; width: 52px; height: 52px; }
    /* chat */
    [data-composition-id="ambiente"] .amb-chat { position: absolute; left: 56px; top: 0; width: 780px; height: 1920px; }
    [data-composition-id="ambiente"] .amb-msg { position: absolute; left: 0; top: 1640px; height: 58px; padding: 0 22px 0 66px; border-radius: 29px; background: rgba(255, 255, 255, 0.86); box-shadow: 0 3px 0 rgba(43, 29, 46, 0.12); white-space: nowrap; font-family: "Lexend", sans-serif; font-size: 28px; line-height: 58px; color: #2b1d2e; }

    [data-composition-id="ambiente"] .amb-cor svg { width: 72px; height: 66px; overflow: visible; }
    [data-composition-id="ambiente"] .amb-btn { position: absolute; left: 924px; top: 1640px; width: 84px; height: 84px; border-radius: 50%; background: rgba(255, 255, 255, 0.86); box-shadow: 0 3px 0 rgba(43, 29, 46, 0.12); }
    [data-composition-id="ambiente"] .amb-btn svg { position: absolute; left: 16px; top: 18px; width: 52px; height: 48px; }
  </style>
  <div id="root" data-composition-id="ambiente" data-width="1080" data-height="1920" data-duration="75">
    <div id="amb-escena" class="amb-capa clip" data-start="0" data-duration="75" data-track-index="0">
      <div class="amb-marco"></div>
      <div class="amb-barras">
        <div class="amb-barra"><div class="amb-llena"></div></div>
        <div class="amb-barra"><div class="amb-llena amb-l2"></div></div>
        <div class="amb-barra"><div class="amb-llena amb-l3" style="opacity: 0"></div></div>
      </div>
      <div class="amb-cab">
        <div class="amb-avatar">
          <svg viewBox="0 0 88 88" aria-hidden="true">
            <path d="M14 88 Q16 60 44 58 Q72 60 74 88 Z" fill="#2b1d2e" />
            <circle cx="44" cy="38" r="17" fill="#2b1d2e" />
            <circle cx="44" cy="17" r="10" fill="#2b1d2e" />
            <circle cx="27" cy="46" r="4" fill="#f5b83d" /><circle cx="61" cy="46" r="4" fill="#f5b83d" />
          </svg>
        </div>
        <div class="amb-handle">@vale.comilona</div>
        <div class="amb-sub" data-layout-ignore>Montevideo</div>
        <div class="amb-vivo">EN VIVO</div>
        <div class="amb-ojo">
          <svg viewBox="0 0 44 32" aria-hidden="true"><path d="M2 16 Q22 -6 42 16 Q22 38 2 16 Z" fill="none" stroke="#fff3e6" stroke-width="4" stroke-linejoin="round" /><circle cx="22" cy="16" r="6" fill="#fff3e6" /></svg>
          <div class="amb-num">1.204</div>
        </div>
        <svg class="amb-x" viewBox="0 0 52 52" aria-hidden="true"><path d="M12 12 L40 40 M40 12 L12 40" stroke="#2b1d2e" stroke-width="6" stroke-linecap="round" /></svg>
      </div>
      <div class="amb-chat"></div>
      <div class="amb-cors"></div>
      <div class="amb-btn"><svg viewBox="0 0 52 48" aria-hidden="true"><path d="M26 46 C8 32 2 24 2 14 C2 6 8 2 14 2 C20 2 24 6 26 10 C28 6 32 2 38 2 C44 2 50 6 50 14 C50 24 44 32 26 46 Z" fill="#ff3b5c" stroke="#2b1d2e" stroke-width="3.5" stroke-linejoin="round" /></svg></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "ambiente";
      const DUR = 75;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // ---------- barritas de story: la del medio se llena en todo el reel ----------
      tl.fromTo(q(".amb-l2"), { scaleX: 0 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);

      // ---------- EN VIVO late ----------
      tl.fromTo(q(".amb-vivo"), { scale: 1 }, { scale: 1.07, duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor(DUR / 0.6) - 1), ease: "sine.inOut" }, 0);
      tl.fromTo(q(".amb-avatar"), { rotation: -3 }, { rotation: 3, duration: 1.4, yoyo: true, repeat: Math.max(1, Math.floor(DUR / 1.4) - 1), ease: "sine.inOut" }, 0);

      // ---------- contador de espectadores (sube a saltos; el vivo explota con la milanesa) ----------
      const num = q(".amb-num");
      const SALTOS = [[0, 1204], [3, 1388], [7, 1652], [12, 1590], [17, 1533], [24, 1720], [31, 2015], [36, 2340], [40.8, 3180], [43, 4912], [46.4, 6230], [50, 6987], [55, 7450], [61, 7810], [67, 8396], [71, 9104]];
      const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      for (let i = 1; i < SALTOS.length; i++) {
        const [t0, a] = SALTOS[i - 1], [t1, b] = SALTOS[i];
        const o = { v: a };
        tl.to(o, { v: b, duration: Math.min(1.2, t1 - t0), ease: "power2.out", onUpdate: () => { num.textContent = fmt(o.v); } }, t1);
      }
      tl.call(() => { num.textContent = "1.204"; }, null, 0);

      // ---------- chat ----------
      const CHAT = [
        [1.2, "flor.pocitos", "¡¿storytime?! contá todo", "#ff9a78"],
        [6.6, "mati_uy", "holaaa vale", "#a78bfa"],
        [9.3, "nacho.cordon", "¿qué bodegón?", "#f5b83d"],
        [13.2, "sofi", "en mi celu tampoco carga", "#ff3b5c"],
        [16.9, "el_tano", "se te lava el mate", "#7c5ce0"],
        [21.4, "abuela_nelly", "hola nena, ¿me ves?", "#ff9a78"],
        [25.5, "cami.r", "noooo la cortina", "#a78bfa"],
        [30.3, "pablo", "jajaja la gomería", "#f5b83d"],
        [32.3, "sofi", "amiga, volvete", "#ff3b5c"],
        [35.2, "mati_uy", "las vecinas son el GPS", "#a78bfa"],
        [40.9, "nacho.cordon", "QUÉ MILANESA", "#f5b83d"],
        [43.6, "flor.pocitos", "ya estoy yendo", "#ff9a78"],
        [46.0, "el_tano", "pasá la dire", "#7c5ce0"],
        [49.4, "cami.r", "¿y no tiene página?", "#a78bfa"],
        [53.6, "abuela_nelly", "el barrio sabe", "#ff9a78"],
        [56.6, "pablo", "le pasa a medio Montevideo", "#f5b83d"],
        [68.5, "sofi", "a mí con una heladería", "#ff3b5c"],
        [71.2, "mati_uy", "una pizzería, te juro", "#a78bfa"],
      ];
      const chat = q(".amb-chat");
      const PASO = 68, VISIBLES = 4;
      const msgs = CHAT.map(([t, u, txt, c]) => {
        const el = document.createElement("div");
        el.className = "amb-msg";
        el.innerHTML = `<i style="background:${c}"></i><b>@${u}</b>${txt}`;
        chat.appendChild(el);
        gsap.set(el, { opacity: 0 });
        return el;
      });
      CHAT.forEach(([t], i) => {
        const el = msgs[i];
        tl.fromTo(el, { opacity: 0, y: 40, scale: 0.9, transformOrigin: "0% 50%" }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, t);
        // cada mensaje nuevo empuja a los anteriores para arriba
        for (let j = i + 1; j < CHAT.length; j++) {
          const k = j - i;
          const tj = CHAT[j][0];
          tl.to(el, { y: -PASO * k, duration: 0.25, ease: "power2.out" }, tj);
          if (k === VISIBLES) { tl.to(el, { opacity: 0, duration: 0.2 }, tj); break; }
          if (k === VISIBLES - 1) tl.to(el, { opacity: 0.55, duration: 0.25 }, tj);
        }
      });
      // con Orus (Scalerics) el chat se aparta un poco y vuelve en el cierre
      tl.to(chat, { opacity: 0.35, duration: 0.4 }, 57.6);
      tl.to(chat, { opacity: 1, duration: 0.4 }, 67.0);

      // ---------- corazones flotando (deterministas) ----------
      const cors = q(".amb-cors");
      const COLS = ["#ff3b5c", "#ff9a78", "#a78bfa", "#f5b83d", "#ff3b5c"];
      const RAFAGAS = [[2.5, 4], [7.0, 2], [11.5, 1], [20, 1], [27, 1], [36.5, 2], [41.0, 7], [42.8, 6], [45.9, 8], [53.5, 2], [59.8, 3], [66.5, 3], [70.5, 8], [72.5, 5]];
      let n = 0;
      RAFAGAS.forEach(([t, cant]) => {
        for (let k = 0; k < cant; k++, n++) {
          const el = document.createElement("div");
          el.className = "amb-cor";
          const c = COLS[n % COLS.length];
          el.innerHTML = `<svg viewBox="0 0 72 66" aria-hidden="true"><path d="M36 62 C12 44 4 34 4 20 C4 10 12 4 20 4 C28 4 33 9 36 15 C39 9 44 4 52 4 C60 4 68 10 68 20 C68 34 60 44 36 62 Z" fill="${c}" stroke="#2b1d2e" stroke-width="4" stroke-linejoin="round" /></svg>`;
          cors.appendChild(el);
          gsap.set(el, { opacity: 0 });
          const t0 = t + k * 0.16;
          const dx = ((n * 37) % 60) - 30;
          const s = 0.7 + ((n * 53) % 40) / 100;
          tl.fromTo(el, { opacity: 0, y: 0, x: 0, scale: 0.3 }, { opacity: 1, y: -90, scale: s, duration: 0.3, ease: "back.out(2)", immediateRender: false }, t0);
          tl.to(el, { y: -330, duration: 1.5, ease: "power1.out" }, t0 + 0.3);
          tl.to(el, { x: dx, rotation: dx / 3, duration: 0.5, yoyo: true, repeat: 2, ease: "sine.inOut" }, t0 + 0.15);
          tl.to(el, { opacity: 0, duration: 0.4 }, t0 + 1.4);
        }
      });
      // el botón de corazón late con cada ráfaga
      RAFAGAS.forEach(([t]) => tl.fromTo(q(".amb-btn"), { scale: 1 }, { scale: 1.2, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t));

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
