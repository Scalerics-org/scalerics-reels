<template>

  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s08-telefono"] .s08-capa { position: absolute; inset: 0; }
    [data-composition-id="s08-telefono"] .s08-esc { position: absolute; inset: 0; }
    [data-composition-id="s08-telefono"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s08-telefono"] .trazo { fill: none; stroke: #2b1d2e; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-telefono"] .s08-stk { position: absolute; padding: 10px 26px; background: #fff; border: 5px solid #2b1d2e; border-radius: 20px; box-shadow: 7px 7px 0 #2b1d2e; font-family: "Lexend", sans-serif; font-weight: 900; line-height: 1; color: #2b1d2e; white-space: nowrap; }
    [data-composition-id="s08-telefono"] .s08-big { position: absolute; font-family: "Lexend", sans-serif; font-weight: 900; line-height: 1; white-space: nowrap; letter-spacing: -0.02em; -webkit-text-stroke: 12px #2b1d2e; paint-order: stroke fill; }
    [data-composition-id="s08-telefono"] .s08-rot { font-family: "Lexend", sans-serif; font-weight: 800; fill: #2b1d2e; }
    [data-composition-id="s08-telefono"] .s08-mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; fill: #2b1d2e; }

    [data-composition-id="s08-telefono"] .s08-no { left: 140px; top: 1000px; font-size: 64px; color: #fff3e6; background: #ff3b5c; border-width: 7px; padding: 16px 30px; }

  </style>
  <div id="root" data-composition-id="s08-telefono" data-width="1080" data-height="1920" data-duration="2.12">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="2.12" data-track-index="0">
      <div class="s08-esc">

        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <g class="s08-cel">
            <rect x="330" y="600" width="420" height="760" rx="56" fill="#2b1d2e" stroke="#2b1d2e" stroke-width="7" />
            <rect x="350" y="620" width="380" height="720" rx="44" fill="#3d2b41" />
            <circle cx="540" cy="780" r="70" fill="#a78bfa" stroke="#fff3e6" stroke-width="5" />
            <text class="s08-rot" x="540" y="800" text-anchor="middle" font-size="56" style="fill:#fff3e6">B</text>
            <text class="s08-rot" x="540" y="910" text-anchor="middle" font-size="40" style="fill:#fff3e6">Bodegón</text>
            <text class="s08-mono s08-llam" x="540" y="960" text-anchor="middle" font-size="28" style="fill:#fff3e6">llamando...</text>
            <g class="s08-ondas"><circle cx="540" cy="1230" r="60" fill="none" stroke="#fff3e6" stroke-width="4" /><circle cx="540" cy="1230" r="60" fill="none" stroke="#fff3e6" stroke-width="4" /></g>
            <circle cx="540" cy="1230" r="56" fill="#ff3b5c" stroke="#fff3e6" stroke-width="5" />
            <path d="M512 1222 Q540 1200 568 1222 L562 1236 L548 1230 V1222 H532 V1230 L518 1236 Z" fill="#fff3e6" />
          </g>
        </svg>
        <div class="s08-stk s08-no">NÚMERO INEXISTENTE</div>

      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-telefono";
      const DUR = 2.12;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      // trazo que se dibuja solo (invisible hasta que arranca: sin puntitos de los caps)
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength ? el.getTotalLength() : 600;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      // aparece con rebote; o.svg = svgOrigin para grupos SVG
      const pop = (el, t, o = {}) => {
        const og = o.svg ? { svgOrigin: o.svg } : {};
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: o.s ?? 0.5, rotation: o.r0 ?? 0, x: o.x0 ?? 0, y: o.y0 ?? 0, ...og }, { opacity: 1, scale: 1, rotation: o.r ?? 0, x: 0, y: 0, duration: o.d ?? 0.35, ease: o.ease ?? "back.out(2)", immediateRender: false, ...og }, t);
      };
      // texto gigante que cae de golpe
      const golpe = (el, t, r = -4) => pop(el, t - 0.1, { s: 2.4, r0: r * 4, r, d: 0.15, ease: "power4.in" });
      const fuera = (el, t, d = 0.25) => tl.to(el, { opacity: 0, scale: 0.85, duration: d, ease: "power2.in" }, t);
      const sacudon = (t, f = 1) => [[-12 * f, 6 * f], [9 * f, -5 * f], [-4 * f, 2 * f], [0, 0]].forEach(([x, y], i) => tl.to(q(".s08-esc"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      const bambolea = (el, t, a = 3, d = 0.4, n = 5, og = {}) => tl.to(el, { rotation: a, duration: d, yoyo: true, repeat: n, ease: "sine.inOut", ...og }, t);

      const TEL = 0.11, NO = 0.61, EXISTE = 0.94;
      tl.fromTo(q(".s08-cel"), { y: 220, rotation: 8, opacity: 0.5, svgOrigin: "540 980" }, { y: 0, rotation: 0, opacity: 1, svgOrigin: "540 980", duration: 0.3, ease: "back.out(1.6)" }, 0);
      qa(".s08-ondas circle").forEach((c, i) => tl.fromTo(c, { scale: 1, opacity: 0.8, svgOrigin: "540 1230" }, { scale: 2, opacity: 0, svgOrigin: "540 1230", duration: 0.5, repeat: 1, ease: "power1.out" }, TEL + i * 0.25));
      tl.to(q(".s08-cel"), { x: 6, duration: 0.04, yoyo: true, repeat: 9, ease: "none" }, TEL);
      golpe(q(".s08-no"), EXISTE, -6);
      sacudon(EXISTE + 0.02, 1.2);
      tl.to(q(".s08-llam"), { opacity: 0, duration: 0.05 }, NO);
      tl.to(q(".s08-cel"), { rotation: -4, svgOrigin: "540 980", duration: 0.3, ease: "back.out(2)" }, EXISTE + 0.1);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
