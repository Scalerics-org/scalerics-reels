<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/hipnosis.js"></script>
  <style>
    @font-face { font-family: "Luckiest Guy"; font-display: block; src: url("assets/fonts/LuckiestGuy.woff2") format("woff2"); }
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Cormorant"; font-style: italic; font-weight: 500; font-display: block; src: url("assets/fonts/CormorantGaramond-Italic-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s13-cta"] .s13-capa, [data-composition-id="s13-cta"] .s13-escenario { position: absolute; inset: 0; }
    [data-composition-id="s13-cta"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s13-cta"] .s13-cartel { position: absolute; left: 110px; top: 560px; width: 860px; height: 250px; background: #6e0a1b; border: 8px solid #5ce611; border-radius: 26px; box-shadow: 0 10px 0 #120a0e; }
    [data-composition-id="s13-cta"] .s13-t { position: absolute; left: 0; right: 0; text-align: center; font-family: "Luckiest Guy", sans-serif; line-height: 1; white-space: nowrap; color: #ffd36b; text-shadow: 0 6px 0 #120a0e; }
    [data-composition-id="s13-cta"] .s13-t1 { top: 34px; font-size: 96px; }
    [data-composition-id="s13-cta"] .s13-t2 { top: 134px; font-size: 82px; color: #f6ecd6; }
    [data-composition-id="s13-cta"] .s13-b { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #5ce611; box-shadow: 0 0 0 3px #120a0e; }
    [data-composition-id="s13-cta"] .s13-chas { left: 560px; top: 812px; font-size: 80px; }
    [data-composition-id="s13-cta"] .s13-tag { left: 470px; top: 1212px; width: 540px; font-size: 28px; }
  </style>
  <div id="root" data-composition-id="s13-cta" data-width="1080" data-height="1920" data-duration="6.10">
    <div id="s13-escena" class="s13-capa clip" data-start="0" data-duration="6.10" data-track-index="0">
      <div class="s13-escenario">
        <svg class="s13-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="s13-cartel"><div class="s13-bombs"></div><div class="s13-t s13-t1">CHASQUEALE</div><div class="s13-t s13-t2">LOS DEDOS</div></div>
        <div class="hp-cartel rojo s13-chas">¡CHAS!</div>
        <div class="hp-tag negro s13-tag">AL QUE SIGUE COPIANDO</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s13-cta";
      const DUR = 6.1;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = HP.INK, G = HP.VERDE, GD = HP.VERDED, C = HP.CREMA;
      let b = "";
      for (let x = 14; x <= 830; x += 41) b += `<i class="s13-b" style="left:${x}px;top:-4px"></i><i class="s13-b" style="left:${x}px;top:220px"></i>`;
      root.querySelector(".s13-bombs").innerHTML = b;
      root.querySelector(".s13-svg").innerHTML =
        `<g class="s13-cel">${HP.celular(110, 880, 300, 400, "s13-clip")}
          <g clip-path="url(#s13-clip)"><rect x="110" y="880" width="300" height="76" fill="${GD}"/>
            <text x="260" y="930" text-anchor="middle" font-family="Lexend" font-weight="800" font-size="26" fill="${C}">COMPARTIR</text>
            <rect x="140" y="990" width="240" height="120" rx="16" fill="#e9dcc0" stroke="${I}" stroke-width="5"/>
            ${HP.espiral(260, 1050, 46, "s13-mini", { vueltas: 3 })}
            <g class="s13-btn"><rect x="150" y="1150" width="220" height="80" rx="40" fill="${G}" stroke="${I}" stroke-width="6"/>
            <text x="260" y="1203" text-anchor="middle" font-family="Luckiest Guy" font-size="40" fill="${I}">ENVIAR</text></g>
          </g>${HP.celularBorde(110, 880, 300, 400)}</g>` +
        `<path class="s13-flecha" d="M430 1060 C520 980 600 980 660 1010" fill="none" stroke="${G}" stroke-width="14" stroke-linecap="round"/>` +
        `<path class="s13-punta" d="M640 980 L680 1016 L630 1040" fill="none" stroke="${G}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>` +
        `<g class="s13-osv">${HP.osvaldo(830, 1180, 0.5, { trance: true, brazos: "tipea" })}</g>` +
        HP.tecla(150, 1290, 340, 130, "CTRL + C", "s13-tc", 56) +
        HP.tecla(590, 1290, 340, 130, "CTRL + V", "s13-tv", 56) +
        `<path class="s13-x1" d="M150 1290 L490 1434" stroke="${HP.ROJOC}" stroke-width="16" stroke-linecap="round"/>` +
        `<path class="s13-x2" d="M590 1290 L930 1434" stroke="${HP.ROJOC}" stroke-width="16" stroke-linecap="round"/>`;
      const tl = gsap.timeline({ paused: true });
      const K = HP.kit(tl, root);
      const { q, qa } = K;
      const DEDOS = 0.42, MANDA = 1.08, COPIA = 1.86, PEGA = 2.29;

      // cuadro 0: el cartel ya está
      tl.fromTo(q(".s13-cartel"), { scale: 0.9, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0);
      tl.fromTo(qa(".s13-b"), { opacity: 1 }, { opacity: 0.25, duration: 0.25, yoyo: true, repeat: 23, stagger: { each: 0.012, from: "start" }, ease: "steps(1)" }, 0);
      K.golpe(q(".s13-chas"), DEDOS, 8);
      tl.to(q(".s13-chas"), { scale: 1.1, duration: 0.2, yoyo: true, repeat: 9, ease: "sine.inOut" }, DEDOS + 0.3);
      K.sacudon(q(".s13-cartel"), DEDOS, 0.7);
      // mandáselo
      tl.fromTo(q(".s13-cel"), { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "back.out(1.5)" }, MANDA - 0.2);
      K.girar(q(".s13-mini"), 260, 1050, MANDA, DUR - MANDA, 120);
      K.dibujar(q(".s13-flecha"), MANDA + 0.25, 0.35);
      K.dibujar(q(".s13-punta"), MANDA + 0.55, 0.15);
      tl.fromTo(q(".s13-btn"), { scale: 1 }, { scale: 1.08, svgOrigin: "260 1190", duration: 0.3, yoyo: true, repeat: 11, ease: "sine.inOut" }, MANDA + 0.3);
      // "al que sigue copiando y pegando"
      K.popSvg(q(".s13-osv"), MANDA + 0.5, 830, 1050);
      K.ojosTrance(MANDA + 0.5, DUR - MANDA - 0.5, 220);
      tl.fromTo(q(".s13-osv .hp-o-manos"), { y: 0 }, { y: -8, duration: 0.14, yoyo: true, repeat: 25, ease: "sine.inOut", immediateRender: false }, MANDA + 0.6);
      K.pop(q(".s13-tag"), MANDA + 0.7);
      tl.fromTo([q(".s13-tc"), q(".s13-tv")], { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.12, ease: "back.out(2)" }, COPIA - 0.25);
      K.dibujar(q(".s13-x1"), COPIA + 0.15, 0.2);
      K.dibujar(q(".s13-x2"), PEGA + 0.1, 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
