<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/hipnosis.js"></script>
  <style>
    @font-face { font-family: "Luckiest Guy"; font-display: block; src: url("assets/fonts/LuckiestGuy.woff2") format("woff2"); }
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Cormorant"; font-style: italic; font-weight: 500; font-display: block; src: url("assets/fonts/CormorantGaramond-Italic-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s08-cuenta"] .s08-capa, [data-composition-id="s08-cuenta"] .s08-escenario { position: absolute; inset: 0; }
    [data-composition-id="s08-cuenta"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s08-cuenta"] .s08-num { left: 0; width: 1080px; top: 560px; font-size: 230px; }
    [data-composition-id="s08-cuenta"] .s08-tag { left: 240px; width: 600px; top: 1462px; }
  </style>
  <div id="root" data-composition-id="s08-cuenta" data-width="1080" data-height="1920" data-duration="8.85">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="8.85" data-track-index="0">
      <div class="s08-escenario">
        <svg class="s08-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="hp-cartel s08-num s08-n1">UNO</div>
        <div class="hp-cartel s08-num s08-n2">DOS</div>
        <div class="hp-cartel rojo s08-num s08-n3">¡TRES!</div>
        <div class="hp-tag s08-tag">A LA CUENTA DE TRES...</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-cuenta";
      const DUR = 8.85;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      root.querySelector(".s08-svg").innerHTML =
        `<g class="s08-esp">${HP.espiral(540, 1000, 370, "s08-espg")}</g>` +
        `<g class="s08-hombre">${HP.mesmerino(420, 1560, 1.1, {})}</g>` +
        `<g class="s08-osv">${HP.osvaldo(910, 1520, 0.6, { trance: true })}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = HP.kit(tl, root);
      const { q } = K;
      const SUF = 0.0, CUENTA = 1.59, DESP = 3.70, UNO = 5.34, DOS = 6.41, TRES = 7.59;

      // la espiral acelera de a poco desde "cuenta"
      K.origen(q(".s08-espg"), "540 1000");
      tl.fromTo(q(".s08-espg"), { rotation: 0 }, { rotation: 160, duration: CUENTA, ease: "none" }, 0);
      tl.to(q(".s08-espg"), { rotation: 160 + 1500, duration: DUR - CUENTA, ease: "power1.in" }, CUENTA);
      K.ojosTrance(0, DUR, 220);
      K.balanceo(q(".s08-osv"), 910, 1520, 0, DUR, 3);
      tl.fromTo(q(".s08-hombre"), { y: 60 }, { y: 0, duration: 0.3, ease: "back.out(2)" }, 0);
      K.hablar(".hp-h-boca", 0.0, 8, 0.12);
      K.hablar(".hp-h-boca", UNO, 4, 0.14);
      // "¡Suficiente!": cejas furiosas y sacudón
      tl.fromTo(q(".hp-h-cejas"), { y: 0 }, { y: 10, duration: 0.12, ease: "power3.out" }, SUF + 0.05);
      K.sacudon(q(".hp-h"), SUF + 0.1, 1.3);
      // el reloj oscila
      K.vaiven(q(".hp-h-pendg"), 300, -330, 0.3, DUR, 20, 1.5);
      K.pop(q(".s08-tag"), CUENTA);
      tl.to(q(".s08-tag"), { scale: 1.05, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, DESP);
      // UNO, DOS, ¡TRES!
      K.golpe(q(".s08-n1"), UNO);
      tl.to(q(".s08-n1"), { opacity: 0, scale: 0.8, duration: 0.15 }, DOS - 0.15);
      K.golpe(q(".s08-n2"), DOS);
      tl.to(q(".s08-n2"), { opacity: 0, scale: 0.8, duration: 0.15 }, TRES - 0.15);
      K.golpe(q(".s08-n3"), TRES, -3);
      K.sacudon(q(".s08-escenario"), TRES, 1.6);
      K.origen(q(".hp-h-mano"), "-140 -200");
      tl.fromTo(q(".hp-h-mano"), { rotation: 0 }, { rotation: -12, duration: 0.1, ease: "power4.out", immediateRender: false }, TRES - 0.05);
      tl.to(q(".s08-tag"), { opacity: 0, duration: 0.15 }, TRES);
      // Osvaldo: ni se mueve (las espirales siguen)
      tl.to(q(".s08-osv"), { scale: 1.06, svgOrigin: "910 1520", duration: 0.2, yoyo: true, repeat: 1 }, TRES + 0.4);

      K.salida(q("#s08-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
