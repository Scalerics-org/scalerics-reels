<template>

  <script src="assets/hipnosis.js"></script>
  <style>

    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Cormorant"; font-style: italic; font-weight: 500; font-display: block; src: url("assets/fonts/CormorantGaramond-Italic-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s04-noches"] .s04-capa, [data-composition-id="s04-noches"] .s04-escenario { position: absolute; inset: 0; }
    [data-composition-id="s04-noches"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s04-noches"] .s04-globo { left: 640px; top: 900px; }
    [data-composition-id="s04-noches"] .s04-tag { left: 290px; width: 500px; top: 1462px; }
    [data-composition-id="s04-noches"] .s04-chas { left: 0; width: 1080px; top: 640px; font-size: 200px; }
  </style>
  <div id="root" data-composition-id="s04-noches" data-width="1080" data-height="1920" data-duration="4.49">
    <div id="s04-escena" class="s04-capa clip" data-start="0" data-duration="4.49" data-track-index="0">
      <div class="s04-escenario">
        <svg class="s04-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="hp-globo trance s04-globo">mmm...</div>
        <div class="hp-tag vio s04-tag">TODAS LAS NOCHES</div>
        <div class="hp-cartel s04-chas">¡CHAS!</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s04-noches";
      const DUR = 4.49;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = HP.INK;
      let estrellas = "";
      [[230, 900], [860, 1180], [200, 1240], [900, 640], [300, 640]].forEach(([x, y], k) => {
        estrellas += `<path class="s04-est" d="M${x} ${y - 34} L${x + 9} ${y - 9} L${x + 34} ${y} L${x + 9} ${y + 9} L${x} ${y + 34} L${x - 9} ${y + 9} L${x - 34} ${y} L${x - 9} ${y - 9} Z" fill="${HP.OROC}" stroke="${I}" stroke-width="5"/>`;
      });
      root.querySelector(".s04-svg").innerHTML =
        `<g class="s04-esp" opacity="0.55">${HP.espiral(540, 1000, 360, "s04-espg", { tinta: HP.VIO })}</g>` +
        // luna
        `<g class="s04-luna"><path d="M880 600 A90 90 0 1 0 960 740 A75 75 0 1 1 880 600 Z" fill="${HP.OROC}" stroke="${I}" stroke-width="7" stroke-linejoin="round"/></g>` +
        // reloj de pared
        `<g class="s04-reloj"><circle cx="220" cy="700" r="92" fill="${HP.CREMA}" stroke="${I}" stroke-width="9"/><circle cx="220" cy="700" r="76" fill="none" stroke="${HP.ORO}" stroke-width="6"/>
          <text x="220" y="644" text-anchor="middle" font-family="Luckiest Guy" font-size="30" fill="${I}" data-layout-ignore>12</text>
          <path class="s04-hora" d="M220 700 L190 650" stroke="${I}" stroke-width="10" stroke-linecap="round"/>
          <path class="s04-min" d="M220 700 L220 632" stroke="${HP.ROJOC}" stroke-width="7" stroke-linecap="round"/>
          <circle cx="220" cy="700" r="9" fill="${I}"/></g>` +
        `<g class="s04-osv">${HP.osvaldo(540, 1500, 1.05, { trance: true, brazos: "sonambulo" })}</g>` +
        `<g class="s04-ests">${estrellas}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = HP.kit(tl, root);
      const { q, qa } = K;
      const CONTAR = 0.56, TODAS = 2.25, CHAS = 3.95;

      K.girar(q(".s04-espg"), 540, 1000, 0, DUR, 70);
      K.ojosTrance(0, DUR, 220);
      tl.fromTo(q(".s04-osv"), { y: 50 }, { y: 0, duration: 0.45, ease: "power3.out" }, 0);
      K.balanceo(q(".s04-osv"), 540, 1500, 0, CHAS, 3.5);
      K.origen(q(".hp-o-mi"), "-140 -200"); K.origen(q(".hp-o-md"), "140 -200");
      tl.fromTo(q(".hp-o-mi"), { rotation: -3 }, { rotation: 3, duration: 0.6, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, 0);
      tl.fromTo(q(".hp-o-md"), { rotation: 3 }, { rotation: -3, duration: 0.6, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, 0);
      // "contar": globo de trance
      K.pop(q(".s04-globo"), CONTAR);
      tl.to(q(".s04-globo"), { y: -16, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, CONTAR + 0.35);
      // "todas las noches": luna y reloj
      K.popSvg(q(".s04-luna"), TODAS - 0.1, 900, 680);
      K.popSvg(q(".s04-reloj"), TODAS + 0.05, 220, 700);
      K.pop(q(".s04-tag"), TODAS + 0.2);
      tl.fromTo(q(".s04-min"), { rotation: 0 }, { rotation: 720, svgOrigin: "220 700", duration: 1.6, ease: "power1.inOut", immediateRender: false }, TODAS + 0.2);
      // ¡CHAS!
      K.golpe(q(".s04-chas"), CHAS, -4);
      K.sacudon(q(".s04-escenario"), CHAS, 1.2);
      qa(".s04-est").forEach((e, i) => {
        const bb = e.getBBox();
        K.popSvg(e, CHAS + i * 0.03, bb.x + bb.width / 2, bb.y + bb.height / 2, 0.25);
      });
      tl.to(q(".s04-globo"), { opacity: 0, duration: 0.1 }, CHAS - 0.1);
      tl.to([q(".s04-luna"), q(".s04-reloj")], { opacity: 0, duration: 0.1 }, CHAS - 0.1);

      K.salida(q("#s04-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
