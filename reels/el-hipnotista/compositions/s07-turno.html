<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/hipnosis.js"></script>
  <style>
    @font-face { font-family: "Luckiest Guy"; font-display: block; src: url("assets/fonts/LuckiestGuy.woff2") format("woff2"); }
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Cormorant"; font-style: italic; font-weight: 500; font-display: block; src: url("assets/fonts/CormorantGaramond-Italic-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s07-turno"] .s07-capa, [data-composition-id="s07-turno"] .s07-escenario { position: absolute; inset: 0; }
    [data-composition-id="s07-turno"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s07-turno"] .s07-tag { left: 560px; width: 400px; top: 1462px; }
    [data-composition-id="s07-turno"] .s07-globo { left: 60px; top: 800px; font-size: 44px; }
  </style>
  <div id="root" data-composition-id="s07-turno" data-width="1080" data-height="1920" data-duration="7.48">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="7.48" data-track-index="0">
      <div class="s07-escenario">
        <svg class="s07-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="hp-tag vio s07-tag">UNO POR UNO</div>
        <div class="hp-globo trance s07-globo">uno por uno...</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s07-turno";
      const DUR = 7.48;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = HP.INK, C = HP.CREMA, V = HP.VIO;
      let msjs = "";
      for (let k = 0; k < 4; k++) {
        const y = 960 + k * 104;
        msjs += `<g class="s07-m s07-m${k}"><rect x="560" y="${y}" width="370" height="84" rx="22" fill="${V}" stroke="${I}" stroke-width="5"/>
          <text x="582" y="${y + 36}" font-family="Lexend" font-weight="700" font-size="24" fill="${C}">Le recuerdo su turno</text>
          <text x="582" y="${y + 66}" font-family="Lexend" font-weight="700" font-size="24" fill="${C}">de mañana a las ${10 + k}...</text>
          <path class="s07-tilde" d="M880 ${y + 58} l10 10 l20 -22" fill="none" stroke="${HP.OROC}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
      }
      // caniche con moño
      const can = `<g class="s07-can" fill="${C}" stroke="${I}" stroke-width="6">
          <ellipse cx="300" cy="900" rx="95" ry="62"/>
          <circle cx="205" cy="845" r="40"/><circle cx="190" cy="800" r="36"/>
          <circle cx="170" cy="870" r="30"/><circle cx="400" cy="860" r="24"/>
          <path d="M398 860 L380 880" stroke-width="10"/>
          <circle cx="225" cy="980" r="26"/><circle cx="375" cy="980" r="26"/>
          <path d="M225 940 V975 M375 940 V975" stroke-width="12"/>
          <circle cx="198" cy="850" r="7" fill="${I}"/><circle cx="160" cy="858" r="9" fill="${I}"/>
          <path d="M215 818 l20 -24 l6 30 Z" fill="${HP.ROJOC}"/>
        </g>`;
      root.querySelector(".s07-svg").innerHTML =
        `<g class="s07-esp" opacity="0.35">${HP.espiral(320, 1150, 280, "s07-espg", { tinta: V })}</g>` +
        // reloj de pared
        `<g class="s07-reloj"><circle cx="230" cy="660" r="80" fill="${C}" stroke="${I}" stroke-width="9"/>
          <path class="s07-min" d="M230 660 L230 600" stroke="${HP.ROJOC}" stroke-width="7" stroke-linecap="round"/>
          <path class="s07-hora" d="M230 660 L262 630" stroke="${I}" stroke-width="10" stroke-linecap="round"/><circle cx="230" cy="660" r="8" fill="${I}"/></g>` +
        `<g class="s07-cel">${HP.celular(530, 600, 420, 840, "s07-clip")}
          <g clip-path="url(#s07-clip)"><rect x="530" y="600" width="420" height="96" fill="${V}"/>
            <text x="740" y="662" text-anchor="middle" font-family="Lexend" font-weight="800" font-size="30" fill="${C}">TURNOS · MAÑANA</text>
            <g class="s07-card"><rect x="556" y="720" width="370" height="200" rx="20" fill="#fff" stroke="${I}" stroke-width="5"/>
              <rect x="556" y="720" width="22" height="200" rx="8" fill="${HP.ORO}"/>
              <text x="600" y="778" font-family="Luckiest Guy" font-size="46" fill="${I}">10:00</text>
              <text x="600" y="830" font-family="Lexend" font-weight="800" font-size="30" fill="${I}">SRA. ELSA</text>
              <text x="600" y="878" font-family="Lexend" font-weight="600" font-size="28" fill="${V}" class="s07-canitxt">CANICHE · BAÑO</text></g>
            ${msjs}
          </g>${HP.celularBorde(530, 600, 420, 840)}</g>` +
        can +
        `<g class="s07-osv">${HP.osvaldo(300, 1480, 0.8, { trance: true, brazos: "sonambulo" })}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = HP.kit(tl, root);
      const { q, qa } = K;
      const TURNO = 1.21, CANICHE = 2.96, U1 = 3.91, U2 = 4.66, U3 = 5.65, U4 = 6.44;

      K.girar(q(".s07-espg"), 320, 1150, 0, DUR, 70);
      K.ojosTrance(0, DUR, 220);
      K.balanceo(q(".s07-osv"), 300, 1480, 0, DUR, 3);
      tl.fromTo(q(".s07-osv"), { x: -80 }, { x: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(q(".s07-cel"), { y: 100, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.3)" }, 0);
      tl.fromTo(q(".s07-reloj"), { opacity: 0.5 }, { opacity: 1, duration: 0.3 }, 0);
      tl.fromTo(q(".s07-min"), { rotation: 0 }, { rotation: 1080, svgOrigin: "230 660", duration: DUR, ease: "none" }, 0);
      tl.fromTo(q(".s07-hora"), { rotation: 0 }, { rotation: 90, svgOrigin: "230 660", duration: DUR, ease: "none" }, 0);
      // "turno": la tarjeta del turno
      K.popSvg(q(".s07-card"), TURNO - 0.05, 740, 820);
      // "caniche": aparece el caniche
      K.popSvg(q(".s07-can"), CANICHE - 0.05, 290, 890);
      tl.fromTo(q(".s07-can"), { y: 0 }, { y: -14, duration: 0.18, yoyo: true, repeat: 5, ease: "power1.inOut", immediateRender: false }, CANICHE + 0.3);
      // "uno por uno": los mensajes, de a uno, la tarjeta sube
      tl.to(q(".s07-card"), { y: -220, opacity: 0.0, duration: 0.4, ease: "power2.inOut" }, U1 - 0.3);
      [U1, U2, U3, U4].forEach((t, k) => {
        K.popSvg(q(".s07-m" + k), t, 745, 1002 + k * 104, 0.3);
      });
      tl.to(qa(".s07-m"), { y: -200, duration: 0.4, ease: "power2.inOut" }, U1 - 0.3);
      K.pop(q(".s07-tag"), U1);
      K.pop(q(".s07-globo"), U1 + 0.1);
      tl.to(q(".s07-globo"), { y: -14, duration: 0.5, yoyo: true, repeat: 5, ease: "sine.inOut" }, U1 + 0.45);
      tl.to(q(".s07-can"), { opacity: 0.0, duration: 0.3 }, U1 - 0.1);

      K.salida(q("#s07-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
