<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/hipnosis.js"></script>
  <style>
    @font-face { font-family: "Luckiest Guy"; font-display: block; src: url("assets/fonts/LuckiestGuy.woff2") format("woff2"); }
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Cormorant"; font-style: italic; font-weight: 500; font-display: block; src: url("assets/fonts/CormorantGaramond-Italic-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-hipnotizar"] .s01-capa, [data-composition-id="s01-hipnotizar"] .s01-escenario { position: absolute; inset: 0; }
    [data-composition-id="s01-hipnotizar"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-hipnotizar"] .s01-titulo { left: 0; width: 1080px; top: 520px; font-size: 92px; }
    [data-composition-id="s01-hipnotizar"] .s01-vol { left: 190px; width: 700px; top: 1452px; }
    [data-composition-id="s01-hipnotizar"] .s01-sello { left: 80px; width: 920px; top: 1290px; font-size: 68px; }
  </style>
  <div id="root" data-composition-id="s01-hipnotizar" data-width="1080" data-height="1920" data-duration="5.72">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="5.72" data-track-index="0">
      <div class="s01-escenario">
        <svg class="s01-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="hp-cartel s01-titulo">¡HIPNOSIS EN VIVO!</div>
        <div class="hp-tag s01-vol">VOLUNTARIO: OSVALDO</div>
        <div class="hp-sello s01-sello">¡YA VIENE HIPNOTIZADO!</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-hipnotizar";
      const DUR = 5.72;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = HP.INK;
      root.querySelector(".s01-svg").innerHTML =
        `<g class="s01-mundo">` +
        `<g class="s01-esp">${HP.espiral(540, 1000, 340, "s01-espg")}</g>` +
        // silla dorada de escenario detrás de Osvaldo
        `<g class="s01-silla"><rect x="640" y="960" width="300" height="420" rx="60" fill="${HP.ROJO}" stroke="${I}" stroke-width="8"/>
          <rect x="620" y="930" width="340" height="60" rx="30" fill="${HP.ORO}" stroke="${I}" stroke-width="7"/></g>` +
        HP.osvaldo(790, 1470, 0.9, { trance: true }) +
        HP.mesmerino(330, 1470, 1.0, {}) +
        `</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = HP.kit(tl, root);
      const { q } = K;

      const HIPNO = 0.40, COMER = 1.76, AHNO = 2.56, HIPNOTIZADO = 4.56;

      // cuadro 0: todo ya en escena, la espiral gira suave desde el principio
      K.girar(q(".s01-espg"), 540, 1000, 0, DUR, 110);
      tl.fromTo(q(".s01-esp"), { opacity: 0.75 }, { opacity: 1, duration: 0.4 }, 0);
      tl.fromTo(q(".hp-h"), { y: 40 }, { y: 0, duration: 0.45, ease: "back.out(1.6)" }, 0);
      tl.fromTo(q(".hp-o"), { y: 30 }, { y: 0, duration: 0.45, ease: "back.out(1.6)" }, 0.05);
      // el reloj oscila todo el tiempo
      K.vaiven(q(".hp-h-pendg"), 300, -330, 0, DUR, 22, 1.3);
      // los ojos de Osvaldo ya giran (se ven de cerca después)
      K.ojosTrance(0, DUR, 220);
      K.balanceo(q(".hp-o"), 0, 60, 0.2, DUR - 0.2, 2.2);
      // "hipnotizar": levanta el brazo del reloj y el cartel
      K.origen(q(".hp-h-brazo"), "140 -200");
      tl.to(q(".hp-h-brazo"), { rotation: -14, duration: 0.3, ease: "back.out(2)" }, HIPNO);
      K.hablar(".hp-h-boca", 0.05, 6, 0.11);
      tl.fromTo(q(".hp-h-cejas"), { y: 0 }, { y: -10, duration: 0.15, yoyo: true, repeat: 3, ease: "power2.out" }, HIPNO);
      K.golpe(q(".s01-titulo"), HIPNO + 0.05, -3);
      // "comerciante": etiqueta del voluntario, Mesmerino lo señala con la mano libre
      K.pop(q(".s01-vol"), COMER);
      tl.to(q(".hp-h-brazo"), { rotation: 8, duration: 0.3, ease: "power2.out" }, COMER - 0.1);
      // "Ah, no": zoom a la cara de Osvaldo, que ya tiene espirales
      tl.to(q(".s01-titulo"), { opacity: 0, y: -30, duration: 0.25 }, AHNO - 0.1);
      tl.to(q(".s01-vol"), { opacity: 0, duration: 0.2 }, AHNO);
      K.origen(q(".s01-mundo"), "790 1146");
      tl.to(q(".s01-mundo"), { scale: 2.1, x: -250, y: -200, duration: 0.7, ease: "power3.inOut" }, AHNO);
      // "hipnotizado": sello
      K.sello(q(".s01-sello"), HIPNOTIZADO, -4);
      K.sacudon(q(".s01-escenario"), HIPNOTIZADO, 0.8);

      K.salida(q("#s01-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
