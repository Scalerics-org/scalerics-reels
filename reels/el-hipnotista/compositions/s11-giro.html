  <style>

    @font-face { font-family: "Cormorant"; font-style: italic; font-weight: 500; font-display: block; src: url("assets/fonts/CormorantGaramond-Italic-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s11-giro"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

    [data-composition-id="s11-giro"] .s11-cartel .s11-t { position: absolute; left: 0; right: 0; text-align: center; font-family: "Luckiest Guy", sans-serif; line-height: 1; white-space: nowrap; color: #ffd36b; text-shadow: 0 6px 0 #120a0e; }

    [data-composition-id="s11-giro"] .s11-t2 { top: 106px; font-size: 104px; }
    [data-composition-id="s11-giro"] .s11-t span { display: inline-block; opacity: 0.12; }

    [data-composition-id="s11-giro"] .s11-nadie { left: 660px; top: 1040px; }
  </style>
  <div id="root" data-composition-id="s11-giro" data-width="1080" data-height="1920" data-duration="4.42">
    <div id="s11-escena" class="s11-capa clip" data-start="0" data-duration="4.42" data-track-index="0">
      <div class="s11-escenario">
        <svg class="s11-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="hp-tag s11-mano">A MANO</div>
        <div class="hp-tag negro s11-nadie">NADIE LE DIJO</div>
        <div class="s11-cartel"><div class="s11-bombs"></div><div class="s11-t s11-t1"></div><div class="s11-t s11-t2"></div></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s11-giro";
      const DUR = 4.42;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = HP.INK;
      const q0 = (s) => root.querySelector(s);
      q0(".s11-t1").innerHTML = "SE PUEDE".split("").map((c) => `<span>${c === " " ? "&nbsp;" : c}</span>`).join("");
      q0(".s11-t2").innerHTML = "HACER SOLO".split("").map((c) => `<span>${c === " " ? "&nbsp;" : c}</span>`).join("");
      let b = "";
      for (let x = 14; x <= 830; x += 41) b += `<i class="s11-b" style="left:${x}px;top:-4px"></i><i class="s11-b" style="left:${x}px;top:200px"></i>`;
      q0(".s11-bombs").innerHTML = b;
      root.querySelector(".s11-svg").innerHTML =
        `<g class="s11-esp" opacity="0.45">${HP.espiral(540, 1180, 330, "s11-espg", { tinta: HP.VIO })}</g>` +
        `<g class="s11-manog"><path class="s11-manop" d="M190 1010 L190 900 C190 880 222 880 222 900 L222 850 C222 828 254 828 254 850 L254 840 C254 818 286 818 286 840 L286 860 C286 840 318 840 318 860 L318 960 C318 1000 296 1020 262 1024 L230 1024 C210 1020 196 1016 190 1010 Z M190 950 C170 930 150 935 150 955 C160 990 180 1010 200 1016" fill="${HP.CREMA}" stroke="${HP.ORO}" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/></g>` +
        `<g class="s11-glob"><path d="M720 860 h240 a30 30 0 0 1 30 30 v80 a30 30 0 0 1 -30 30 h-170 l-40 36 l6 -36 h-36 a30 30 0 0 1 -30 -30 v-80 a30 30 0 0 1 30 -30 Z" fill="${HP.CREMA}" stroke="${I}" stroke-width="7" stroke-linejoin="round"/>
          <circle cx="790" cy="930" r="13" fill="${I}"/><circle cx="840" cy="930" r="13" fill="${I}"/><circle cx="890" cy="930" r="13" fill="${I}"/>
          <path class="s11-x1" d="M720 870 L990 1000" stroke="${HP.ROJOC}" stroke-width="16" stroke-linecap="round"/><path class="s11-x2" d="M990 870 L720 1000" stroke="${HP.ROJOC}" stroke-width="16" stroke-linecap="round"/></g>` +
        `<g class="s11-osv">${HP.osvaldo(540, 1430, 0.95, { trance: true, brazos: "tipea" })}</g>` +
        `<g><rect x="380" y="1395" width="320" height="56" rx="14" fill="#2b1d3a" stroke="${I}" stroke-width="7"/><path d="M400 1414 h280 M400 1432 h280" stroke="#4a3560" stroke-width="6" stroke-dasharray="22 8"/></g>`;
      const tl = gsap.timeline({ paused: true });
      const K = HP.kit(tl, root);
      const { q, qa } = K;
      const MANO = 0.6, NADIE = 1.24, QUE = 2.04, SOLO = 3.08;

      K.girar(q(".s11-espg"), 540, 1180, 0, DUR, 70);
      K.ojosTrance(0, DUR, 220);
      tl.fromTo(q(".s11-osv"), { y: 40 }, { y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(q(".hp-o-mi"), { y: 0 }, { y: -12, duration: 0.14, yoyo: true, repeat: 29, ease: "sine.inOut", immediateRender: false }, 0);
      tl.fromTo(q(".hp-o-md"), { y: -12 }, { y: 0, duration: 0.14, yoyo: true, repeat: 29, ease: "sine.inOut", immediateRender: false }, 0);
      // "mano": la mano dorada se dibuja
      K.dibujar(q(".s11-manop"), MANO - 0.2, 0.5);
      K.pop(q(".s11-mano"), MANO);
      tl.fromTo(q(".s11-manog"), { rotation: -8 }, { rotation: 8, svgOrigin: "250 1020", duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, MANO + 0.3);
      // "nadie le dijo": globo vacío tachado
      K.popSvg(q(".s11-glob"), NADIE - 0.1, 855, 930);
      K.dibujar(q(".s11-x1"), NADIE + 0.35, 0.18);
      K.dibujar(q(".s11-x2"), NADIE + 0.5, 0.18);
      K.pop(q(".s11-nadie"), NADIE + 0.1);
      // el cartel se prende letra por letra
      K.pop(q(".s11-cartel"), QUE - 0.25);
      const letras = qa(".s11-t span");
      letras.forEach((l, i) => tl.to(l, { opacity: 1, duration: 0.05 }, QUE + (i * (SOLO - QUE)) / letras.length));
      tl.fromTo(qa(".s11-t2 span"), { scale: 1 }, { scale: 1.2, duration: 0.12, yoyo: true, repeat: 1, stagger: 0.03, ease: "power2.out", immediateRender: false }, SOLO);
      tl.fromTo(qa(".s11-b"), { opacity: 1 }, { opacity: 0.2, duration: 0.12, yoyo: true, repeat: 7, stagger: { each: 0.01, from: "edges" }, ease: "steps(1)", immediateRender: false }, SOLO);
      K.sacudon(q(".s11-cartel"), SOLO, 0.8);

      K.salida(q("#s11-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
