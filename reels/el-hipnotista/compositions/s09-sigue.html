<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/hipnosis.js"></script>
  <style>
    @font-face { font-family: "Luckiest Guy"; font-display: block; src: url("assets/fonts/LuckiestGuy.woff2") format("woff2"); }
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Cormorant"; font-style: italic; font-weight: 500; font-display: block; src: url("assets/fonts/CormorantGaramond-Italic-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s09-sigue"] .s09-capa, [data-composition-id="s09-sigue"] .s09-escenario { position: absolute; inset: 0; }
    [data-composition-id="s09-sigue"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s09-sigue"] .s09-tag { left: 240px; width: 600px; top: 1462px; }
    [data-composition-id="s09-sigue"] .s09-sello { left: 300px; width: 480px; top: 560px; font-size: 54px; }
  </style>
  <div id="root" data-composition-id="s09-sigue" data-width="1080" data-height="1920" data-duration="6.94">
    <div id="s09-escena" class="s09-capa clip" data-start="0" data-duration="6.94" data-track-index="0">
      <div class="s09-escenario">
        <svg class="s09-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="hp-sello vio s09-sello">SIGUE EN TRANCE</div>
        <div class="hp-tag vio s09-tag">LAS 2 DE LA MAÑANA</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s09-sigue";
      const DUR = 6.94;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const I = HP.INK, C = HP.CREMA, V = HP.VIO;
      let renglones = "";
      for (let k = 0; k < 8; k++) renglones += `<rect x="742" y="${790 + k * 44}" width="${150 + ((k * 47) % 90)}" height="14" rx="6" fill="${k % 3 ? "#c9bb98" : V}"/>`;
      root.querySelector(".s09-svg").innerHTML =
        `<g class="s09-esp" opacity="0.4">${HP.espiral(540, 1150, 320, "s09-espg", { tinta: V })}</g>` +
        // la tienda online en el celular
        `<g class="s09-cel">${HP.celular(90, 680, 290, 520, "s09-clip")}
          <g clip-path="url(#s09-clip)"><rect x="90" y="680" width="290" height="80" fill="${V}"/>
            <text x="235" y="732" text-anchor="middle" font-family="Lexend" font-weight="800" font-size="28" fill="${C}">MI TIENDA</text>
            <rect x="120" y="790" width="230" height="170" rx="16" fill="#e9dcc0" stroke="${I}" stroke-width="5"/>
            <path d="M180 930 L180 850 Q235 810 290 850 L290 930 Z" fill="${HP.ORO}" stroke="${I}" stroke-width="5"/>
            <text x="235" y="1004" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="26" fill="${I}">ALIMENTO</text>
            <text x="235" y="1080" text-anchor="middle" font-family="Lexend" font-weight="800" font-size="34" fill="${I}">STOCK:</text>
            <g class="s09-s12"><text x="235" y="1150" text-anchor="middle" font-family="Luckiest Guy" font-size="64" fill="${HP.ROJOC}">12</text></g>
            <g class="s09-s11"><text x="235" y="1150" text-anchor="middle" font-family="Luckiest Guy" font-size="64" fill="${HP.ROJOC}">11</text></g>
          </g>${HP.celularBorde(90, 680, 290, 520)}</g>` +
        // el lápiz que corrige a mano
        `<g class="s09-lapiz"><path d="M330 1060 L410 980 L440 1010 L360 1090 L320 1100 Z" fill="${HP.ORO}" stroke="${I}" stroke-width="6" stroke-linejoin="round"/><path d="M410 980 L440 1010" stroke="${HP.ROJOC}" stroke-width="14"/></g>` +
        // el reporte que se desenrolla
        `<g class="s09-rep"><rect x="720" y="700" width="260" height="440" fill="#fbf6ea" stroke="${I}" stroke-width="6"/>
          <text x="850" y="760" text-anchor="middle" font-family="Lexend" font-weight="800" font-size="30" fill="${I}">REPORTE</text>${renglones}</g>` +
        `<g class="s09-rollo"><rect x="704" y="676" width="292" height="44" rx="22" fill="${C}" stroke="${I}" stroke-width="6"/></g>` +
        // reloj 2:00 y luna
        `<g class="s09-reloj"><circle cx="540" cy="820" r="96" fill="${C}" stroke="${I}" stroke-width="9"/><circle cx="540" cy="820" r="80" fill="none" stroke="${HP.ORO}" stroke-width="6"/>
          <path d="M540 820 L540 750" stroke="${HP.ROJOC}" stroke-width="7" stroke-linecap="round"/>
          <path class="s09-hora" d="M540 820 L540 770" stroke="${I}" stroke-width="11" stroke-linecap="round"/><circle cx="540" cy="820" r="9" fill="${I}"/></g>` +
        `<g class="s09-osv">${HP.osvaldo(540, 1500, 0.9, { trance: true, brazos: "sonambulo" })}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = HP.kit(tl, root);
      const { q } = K;
      const STOCK = 1.11, REP = 3.11, DOS = 4.67, MAN = 5.18;

      K.girar(q(".s09-espg"), 540, 1150, 0, DUR, 70);
      K.ojosTrance(0, DUR, 220);
      K.balanceo(q(".s09-osv"), 540, 1500, 0, DUR, 3.5);
      tl.fromTo(q(".s09-osv"), { y: 50 }, { y: 0, duration: 0.4, ease: "power3.out" }, 0);
      K.sello(q(".s09-sello"), 0.2, -4);
      tl.to(q(".s09-sello"), { opacity: 0, duration: 0.2 }, DOS - 0.3);
      // stock: 12 -> 11 a mano
      tl.fromTo(q(".s09-cel"), { x: -80, opacity: 0.4 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.1);
      gsap.set(q(".s09-s11"), { opacity: 0 });
      gsap.set(q(".s09-lapiz"), { opacity: 0 });
      tl.fromTo(q(".s09-lapiz"), { opacity: 0, x: 60, y: -40 }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, STOCK - 0.2);
      tl.to(q(".s09-lapiz"), { x: -14, y: 10, duration: 0.08, yoyo: true, repeat: 7, ease: "none" }, STOCK + 0.15);
      tl.to(q(".s09-s12"), { opacity: 0, duration: 0.1 }, STOCK + 0.6);
      tl.to(q(".s09-s11"), { opacity: 1, duration: 0.1 }, STOCK + 0.6);
      tl.to(q(".s09-lapiz"), { opacity: 0, duration: 0.2 }, REP);
      // el reporte se desenrolla
      gsap.set(q(".s09-rep"), { svgOrigin: "850 700", smoothOrigin: false, scaleY: 0 });
      gsap.set(q(".s09-rollo"), { opacity: 0 });
      tl.to(q(".s09-rollo"), { opacity: 1, duration: 0.15 }, REP - 0.25);
      tl.fromTo(q(".s09-rep"), { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power2.out", immediateRender: false }, REP - 0.1);
      // las 2 de la mañana
      K.popSvg(q(".s09-reloj"), DOS - 0.25, 540, 820);
      tl.fromTo(q(".s09-hora"), { rotation: -30 }, { rotation: 60, svgOrigin: "540 820", duration: 0.5, ease: "back.out(2)", immediateRender: false }, DOS - 0.1);
      K.pop(q(".s09-tag"), DOS);
      // bostezo
      K.origen(q(".hp-o-boca"), "0 -262");
      tl.to(q(".hp-o-boca"), { scaleY: 2.4, scaleX: 1.4, duration: 0.35, ease: "power2.out" }, MAN);
      tl.to(q(".hp-o-boca"), { scaleY: 1, scaleX: 1, duration: 0.4, ease: "power2.in" }, MAN + 0.9);

      K.salida(q("#s09-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
