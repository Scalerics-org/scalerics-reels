                <line class="ln-fino s04-cd" x1="540.0" y1="762.0" x2="540.0" y2="740.0" />

              <line class="ln s04-hora" x1="540" y1="880" x2="540" y2="810" />

  <script>
    (function () {
      const ID = "s04-tres-horas";
      const DUR = 3.8;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * 0.04;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t0 === 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.08, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const etiq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const sacar = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);

      const CONTESTASTE = 0.18, TRES = 0.88, O = 1.48, OTRO = 2.08, CERRASTE = 2.68;
      tl.fromTo(q(".s04-todo"), { scale: 0.98, svgOrigin: "540 900" }, { scale: 1.02, svgOrigin: "540 900", duration: DUR, ease: "none" }, 0);

      // el reloj arranca medio dibujado
      dibujar(qa(".s04-cd"), 0, 0.45, 0.4);
      // "contestaste": las agujas vuelan tres horas
      tl.fromTo(q(".s04-min"), { rotation: 0, svgOrigin: "540 880" }, { rotation: 1080, svgOrigin: "540 880", duration: 0.8, ease: "power2.inOut" }, CONTESTASTE);
      tl.fromTo(q(".s04-hora"), { rotation: 0, svgOrigin: "540 880" }, { rotation: 90, svgOrigin: "540 880", duration: 0.8, ease: "power2.inOut" }, CONTESTASTE);
      tl.fromTo(q(".s04-mas"), { opacity: 0, scale: 0.6, svgOrigin: "790 880" }, { opacity: 1, scale: 1, svgOrigin: "790 880", duration: 0.35, ease: "back.out(2)" }, TRES);
      punch(q(".s04-reloj-in"), TRES + 0.05, "540 880", 1.05);
      etiq(q(".s04-e1"), TRES);

      // "o al otro día": el reloj se corre y aparece tu local
      tl.to(q(".s04-mas"), { opacity: 0, duration: 0.2 }, O);
      tl.to(q(".s04-reloj"), { x: -250, y: -20, duration: 0.45, ease: "power3.inOut" }, O);
      tl.to(q(".s04-reloj-in"), { scale: 0.6, svgOrigin: "540 880", opacity: 0.45, duration: 0.45, ease: "power3.inOut" }, O);
      gsap.set(q(".s04-local"), { x: 780, y: 1140 });
      dibujar(qa(".s04-ld"), O + 0.1, 0.5);
      dibujar([q(".s04-suelo")], O + 0.05, 0.5);
      tl.fromTo(q(".s04-lt"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, O + 0.45);
      dibujar([q(".s04-luna")], OTRO - 0.1, 0.45);
      sacar(q(".s04-e1"), OTRO - 0.15);
      etiq(q(".s04-e2"), OTRO);

      // "cerraste": baja la persiana y cuelga el cartel
      tl.fromTo(q(".s04-persiana"), { scaleY: 0, opacity: 0, svgOrigin: "0 -140" }, { scaleY: 1, opacity: 1, svgOrigin: "0 -140", duration: 0.4, ease: "bounce.out" }, CERRASTE - 0.25);
      tl.fromTo(q(".s04-cerrado"), { opacity: 0, rotation: -14, svgOrigin: "0 -104" }, { opacity: 1, rotation: 0, svgOrigin: "0 -104", duration: 0.5, ease: "elastic.out(1, 0.5)" }, CERRASTE + 0.1);
      tl.to(qa(".s04-ld"), { opacity: 0.5, duration: 0.4 }, CERRASTE + 0.3);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
