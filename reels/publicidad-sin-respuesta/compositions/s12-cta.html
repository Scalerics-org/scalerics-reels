<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s12-cta"] .s12-capa { position: absolute; inset: 0; }
    [data-composition-id="s12-cta"] .s12-marca { position: absolute; left: 0; right: 0; top: 795px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 700; font-size: 110px; line-height: 1.1; letter-spacing: -0.02em; color: #efeee5; white-space: nowrap; }
    [data-composition-id="s12-cta"] .s12-marca span { display: inline-block; }
    [data-composition-id="s12-cta"] .s12-bajada { position: absolute; left: 0; right: 0; top: 950px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 500; font-size: 34px; color: #efeee5; }
    [data-composition-id="s12-cta"] .s12-pildora-caja { position: absolute; left: 0; right: 0; top: 1104px; display: flex; justify-content: center; }
    [data-composition-id="s12-cta"] .s12-pildora { display: inline-block; padding: 24px 52px; border-radius: 999px; background: #efeee5; font-family: "Lexend", sans-serif; font-weight: 600; font-size: 40px; line-height: 1.2; color: #0b1d35; white-space: nowrap; }
    [data-composition-id="s12-cta"] .s12-pildora b { font-weight: 800; }
  </style>
  <div id="root" data-composition-id="s12-cta" data-width="1080" data-height="1920" data-duration="5.07">
    <div id="s12-escena" class="s12-capa clip" data-start="0" data-duration="5.07" data-track-index="0">
      <div class="s12-marca"><span class="s12-w1">Scalerics</span></div>
      <div class="s12-bajada">Bots de WhatsApp para comercios</div>
      <div class="s12-pildora-caja"><div class="s12-pildora">Comentá <b>“BOT”</b></div></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s12-cta";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // tiempos (palabras de la locución, relativos a la escena)
      const COMENTA = 0.0;
      const BOT = 0.26;
      const CONTAMOS = 1.06;

      // nombre: entra desenfocado y se asienta
      tl.fromTo(q(".s12-w1"), { opacity: 0.25, filter: "blur(10px)", y: 10 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.45, ease: "power3.out" }, 0);
      // deriva lenta del bloque de marca (termina quieta antes del final)
      tl.fromTo(q(".s12-marca"), { scale: 0.97, transformOrigin: "540px 50%" }, { scale: 1, duration: 4.2, ease: "power1.out" }, 0);

      // bajada
      tl.fromTo(q(".s12-bajada"), { opacity: 0, y: 12 }, { opacity: 0.7, y: 0, duration: 0.45, ease: "power3.out" }, 0.6);

      // píldora: pop en "Comentá", golpe en "BOT" y pulsos suaves finitos cada ~1.2 s
      const p = q(".s12-pildora");
      tl.fromTo(p, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, COMENTA + 0.05);
      [BOT, BOT + 1.2, BOT + 2.4, BOT + 3.6].filter((t) => t < 4.6).forEach((t) => {
        tl.to(p, { scale: 1.06, duration: 0.2, ease: "sine.out" }, t);
        tl.to(p, { scale: 1, duration: 0.3, ease: "sine.inOut" }, t + 0.2);
      });
      // "contamos": la bajada se ilumina un toque
      tl.to(q(".s12-bajada"), { opacity: 0.95, duration: 0.25, yoyo: true, repeat: 1 }, CONTAMOS);

      // sin salida: el último cuadro queda quieto y legible
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
