  <script>
    (function () {
      const ID = "s03-te-escriben";
      const DUR = 6.19;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * 0.04;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t0 === 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.08, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const etiq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const sacar = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);

      const FUNCIONO = 0.47, TE = 0.97, ESCRIBIERON = 1.57, WHATSAPP = 2.17, PRECIO = 3.2, TIENEN = 3.98, HACEN = 4.98;
      tl.fromTo(q(".s03-todo"), { scale: 0.97, svgOrigin: "540 905" }, { scale: 1.02, svgOrigin: "540 905", duration: DUR, ease: "none" }, 0);

      // el posteo arranca medio dibujado
      dibujar(qa(".s03-pd"), 0, 0.5, 0.45);
      tl.fromTo(q(".s03-ptxt"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.1);
      // "funcionó": tilde verde
      tl.fromTo(q(".s03-ok"), { opacity: 0, scale: 0.3, svgOrigin: "350 730" }, { opacity: 1, scale: 1, svgOrigin: "350 730", duration: 0.32, ease: "back.out(2.2)" }, FUNCIONO);
      punch(q(".s03-post"), FUNCIONO + 0.05, "245 845", 1.05);
      etiq(q(".s03-e1"), FUNCIONO);

      // "te escribieron": el celular y la flecha
      dibujar(qa(".s03-td"), TE - 0.1, 0.55);
      tl.fromTo(q(".s03-cab"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, TE + 0.3);
      dibujar([q(".s03-flecha")], ESCRIBIERON - 0.1, 0.45);
      tl.fromTo(q(".s03-punta"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, ESCRIBIERON + 0.3);
      sacar(q(".s03-e1"), ESCRIBIERON - 0.15);
      etiq(q(".s03-e2"), ESCRIBIERON);
      // "WhatsApp": punch del celular y tipeo
      punch(q(".s03-tel"), WHATSAPP, "710 905", 1.04);
      gsap.set(q(".s03-tipeo"), { opacity: 0 });
      tl.to(q(".s03-tipeo"), { opacity: 1, duration: 0.1 }, WHATSAPP + 0.3);
      qa(".s03-tipeo circle").forEach((c, i) => tl.fromTo(c, { y: 0 }, { y: -8, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 3 }, WHATSAPP + 0.3 + i * 0.1));
      tl.to(q(".s03-tipeo"), { opacity: 0, duration: 0.1 }, PRECIO - 0.1);

      // los mensajes, uno por uno, y el contador
      gsap.set(qa(".s03-num, .s03-cont"), { opacity: 0 });
      [[".s03-m1", PRECIO, 803], [".s03-m2", TIENEN, 899], [".s03-m3", HACEN, 995]].forEach(([s, t, y], i) => {
        pop(q(s), t, "548 " + y);
        if (i === 0) pop(q(".s03-cont"), t + 0.05, "848 702");
        tl.to(q(".s03-n" + (i + 1)), { opacity: 1, duration: 0.08 }, t + 0.05);
        if (i > 0) tl.to(q(".s03-n" + i), { opacity: 0, duration: 0.08 }, t + 0.05);
        punch(q(".s03-cont"), t + 0.1, "848 702", 1.25);
      });
      tl.to(qa(".s03-flecha, .s03-punta"), { opacity: 0.4, duration: 0.3 }, PRECIO);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
