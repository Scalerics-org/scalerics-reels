  <script>
    (function () {
      const ID = "s11-respuesta";
      const DUR = 4.69;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * 0.04;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t0 === 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.08, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const etiq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const sacar = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);

      const CADA = 0.25, PAGASTE = 1.05, RESPUESTA = 1.85, AUNQUE = 2.75, ATENDIENDO = 3.15, MOSTRADOR = 3.75;
      tl.fromTo(q(".s11-todo"), { scale: 0.98, svgOrigin: "540 910" }, { scale: 1.02, svgOrigin: "540 910", duration: DUR, ease: "none" }, 0);

      // el celular arranca al centro, medio dibujado, con las preguntas
      gsap.set(q(".s11-tel"), { x: -230 });
      dibujar(qa(".s11-td"), 0, 0.5, 0.45);
      tl.fromTo(q(".s11-cab"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.15);
      pop(q(".s11-moneda"), 0.1, "650 694");
      qa(".s11-c").forEach((c, i) => pop(c, 0.05 + i * 0.08, "626 " + (802 + i * 136)));
      // cada mensaje recibe su respuesta verde
      [CADA, PAGASTE, RESPUESTA].forEach((t, i) => {
        pop(q(".s11-r" + (i + 1)), t, "914 " + (864 + i * 136));
        punch(q(".s11-moneda"), t + 0.1, "650 694", 1.25);
      });
      etiq(q(".s11-e1"), RESPUESTA);

      // "aunque estés atendiendo el mostrador": el celular se corre y aparecés vos
      tl.to(q(".s11-tel"), { x: 0, duration: 0.5, ease: "power3.inOut" }, AUNQUE);
      dibujar(qa(".s11-md"), ATENDIENDO - 0.35, 0.5);
      sacar(q(".s11-e1"), ATENDIENDO - 0.15);
      etiq(q(".s11-e2"), ATENDIENDO);
      // el celular vibra solo, vos seguís atendiendo
      tl.to(q(".s11-tel-in"), { x: 5, duration: 0.05, ease: "sine.inOut", yoyo: true, repeat: 7 }, MOSTRADOR);
      punch(q(".s11-r3"), MOSTRADOR + 0.1, "914 1136", 1.08);

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
