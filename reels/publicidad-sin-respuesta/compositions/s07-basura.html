  <script>
    (function () {
      const ID = "s07-basura";
      const DUR = 5.26;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * 0.04;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t0 === 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.08, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const etiq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const sacar = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);

      const QUEDA = 0.8, SIN = 1.1, PUBLICIDAD = 2.4, PAGASTE = 3.1, TIRASTE = 3.8, BASURA = 4.4;
      tl.fromTo(q(".s07-todo"), { scale: 0.98, svgOrigin: "540 920" }, { scale: 1.02, svgOrigin: "540 920", duration: DUR, ease: "none" }, 0);

      // los mensajes: el primero ya está, los otros entran
      const ms = qa(".s07-m");
      gsap.set(ms[0], { opacity: 1 });
      tl.fromTo(ms[0].querySelector("rect"), { scale: 0.9, svgOrigin: "260 695" }, { scale: 1, svgOrigin: "260 695", duration: 0.3, ease: "back.out(1.6)" }, 0);
      pop(ms[1], 0.18, "540 695");
      pop(ms[2], 0.36, "820 695");
      // "queda sin respuesta": se apagan
      tl.to(ms, { opacity: 0.5, duration: 0.3, stagger: 0.1 }, QUEDA);
      etiq(q(".s07-e1"), SIN);

      // "publicidad que pagaste": cada mensaje se vuelve billete
      const bs = qa(".s07-b");
      gsap.set(bs, { opacity: 0 });
      bs.forEach((b, i) => {
        const t = PUBLICIDAD + i * 0.3;
        tl.to(ms[i], { opacity: 0, duration: 0.2 }, t);
        tl.fromTo(b.querySelector(".s07-b-in"), { scale: 0.7, svgOrigin: [260, 540, 820][i] + " 696" }, { scale: 1, svgOrigin: [260, 540, 820][i] + " 696", duration: 0.35, ease: "back.out(2)" }, t);
        tl.to(b, { opacity: 1, duration: 0.15 }, t);
      });
      sacar(q(".s07-e1"), PAGASTE - 0.15);
      etiq(q(".s07-e2"), PAGASTE);
      punch(bs[1].querySelector(".s07-b-in"), PAGASTE + 0.1, "540 696", 1.1);

      // "tiraste": aparece el tacho; "basura": los billetes caen adentro
      dibujar(qa(".s07-td"), TIRASTE - 0.35, 0.45);
      tl.to(q(".s07-tapa"), { rotation: -28, svgOrigin: "430 950", duration: 0.25, ease: "power2.out" }, BASURA - 0.3);
      bs.forEach((b, i) => {
        const t = BASURA - 0.15 + i * 0.12;
        const cx = [260, 540, 820][i];
        tl.to(b, { x: 540 - cx, y: 330, duration: 0.42, ease: "power2.in" }, t);
        tl.to(b.querySelector(".s07-b-in"), { rotation: [-40, 15, 50][i], scale: 0.6, svgOrigin: cx + " 696", duration: 0.42, ease: "power1.in" }, t);
        tl.to(b, { opacity: 0, duration: 0.08 }, t + 0.36);
      });
      tl.to(q(".s07-tapa"), { rotation: 0, svgOrigin: "430 950", duration: 0.35, ease: "bounce.out" }, BASURA + 0.5);
      punch(q(".s07-tacho"), BASURA + 0.6, "540 1190", 1.05);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
