  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }

    [data-composition-id="s06-ahora"] .rotulo { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: #efeee5; }
    [data-composition-id="s06-ahora"] .rotulo-ac { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.2em; fill: #5ce611; }

  </style>
  <div id="root" data-composition-id="s06-ahora" data-width="1080" data-height="1920" data-duration="4.21">

      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s06-todo">
          <g class="s06-burbuja">

            <rect class="ln" x="700" y="900" width="150" height="140" rx="14" />

            <path class="ln" d="M735 886 V912 M815 886 V912" />
            <text class="s06-billete-txt" style="fill:#efeee5" x="775" y="1008" text-anchor="middle">+1</text>

  <script>
    (function () {
      const ID = "s06-ahora";
      const DUR = 4.21;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * 0.04;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t0 === 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.08, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const etiq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const sacar = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);

      const PREGUNTA = 0.41, QUIERE = 1.11, COMPRAR = 1.71, AHORA = 2.11, NO = 2.83, MANANA = 2.91;
      tl.fromTo(q(".s06-todo"), { scale: 1.12, svgOrigin: "540 880" }, { scale: 1.17, svgOrigin: "540 880", duration: DUR, ease: "none" }, 0);

      // la billetera arranca medio dibujada; la pregunta entra con golpe
      dibujar(qa(".s06-bd"), 0, 0.5, 0.45);
      tl.fromTo(q(".s06-boton"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
      pop(q(".s06-burbuja"), 0.05, "160 790");
      punch(q(".s06-burbuja"), PREGUNTA, "160 790", 1.08);

      // "quiere comprar": el billete asoma de la billetera
      gsap.set(q(".s06-billete"), { opacity: 0 });
      tl.to(q(".s06-billete"), { opacity: 1, duration: 0.1 }, QUIERE);
      tl.fromTo(q(".s06-billete"), { y: 60 }, { y: 0, duration: 0.4, ease: "back.out(1.8)" }, QUIERE);
      tl.to(q(".s06-billete"), { y: -14, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, COMPRAR);
      etiq(q(".s06-e1"), QUIERE + 0.1);

      // "ahora": golpe verde
      tl.fromTo(q(".s06-ya"), { opacity: 0, scale: 1.4, svgOrigin: "770 800" }, { opacity: 1, scale: 1, svgOrigin: "770 800", duration: 0.3, ease: "power3.out" }, AHORA);
      punch(q(".s06-ya"), AHORA + 0.4, "770 800", 1.06);
      // "no mañana": el calendario aparece apagado y se tacha
      pop(q(".s06-cal"), NO - 0.1, "775 970");
      tl.to(q(".s06-cal"), { opacity: 0.4, duration: 0.3 }, MANANA + 0.3);
      dibujar([q(".s06-tacha")], MANANA + 0.2, 0.35);
      punch(q(".s06-ya"), MANANA + 0.75, "770 800", 1.06);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
