  <script>
    (function () {
      const ID = "s09-bot";
      const DUR = 2.97;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          const t0 = t + i * 0.04;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t0 === 0 ? 1 : 0 });
          if (t0 > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t0);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t0);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.08, svgOrigin: origen, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      const etiq = (el, t) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      const sacar = (el, t) => tl.to(el, { opacity: 0, duration: 0.2 }, t);

      const HACEMOS = 0.27, BOTS = 0.67, WHATSAPP = 1.27, COMERCIOS = 1.77;
      tl.fromTo(q(".s09-todo"), { scale: 0.98, svgOrigin: "540 900" }, { scale: 1.02, svgOrigin: "540 900", duration: DUR, ease: "none" }, 0);

      // la caja de marca arranca medio dibujada
      dibujar([q(".s09-cd")], 0, 0.5, 0.45);
      tl.fromTo(q(".s09-mt"), { opacity: 0.3, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0);
      punch(q(".s09-mt"), HACEMOS, "540 680", 1.05);
      dibujar([q(".s09-rama")], HACEMOS, 0.4);

      // "bots": el celular con el robot
      dibujar(qa(".s09-td"), BOTS - 0.3, 0.4);
      pop(q(".s09-robot"), BOTS, "420 930");
      tl.to(q(".s09-guino"), { scaleY: 0.1, svgOrigin: "442 926", duration: 0.08, yoyo: true, repeat: 1 }, BOTS + 0.4);
      etiq(q(".s09-e1"), BOTS);

      // "WhatsApp": sale la burbuja verde
      tl.fromTo(q(".s09-burb"), { opacity: 0, x: -30, scale: 0.6, svgOrigin: "530 961" }, { opacity: 1, x: 0, scale: 1, svgOrigin: "530 961", duration: 0.35, ease: "back.out(1.8)" }, WHATSAPP);
      tl.to(q(".s09-burb"), { opacity: 0, duration: 0.2 }, COMERCIOS - 0.1);

      // "comercios": el local
      gsap.set(q(".s09-local"), { x: 730, y: 1140 });
      tl.fromTo(q(".s09-local-in"), { opacity: 0, scale: 0.6, svgOrigin: "0 0" }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.35, ease: "back.out(1.8)" }, COMERCIOS - 0.1);
      dibujar([q(".s09-suelo")], COMERCIOS - 0.15, 0.4);
      sacar(q(".s09-e1"), COMERCIOS - 0.15);
      etiq(q(".s09-e2"), COMERCIOS);
      punch(q(".s09-local-in"), COMERCIOS + 0.5, "0 -60", 1.06);

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
