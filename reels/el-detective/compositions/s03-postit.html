  <script>
    (function () {
      const ID = "s03-postit";
      const DUR = 5.85;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: 0 });
          tl.to(el, { opacity: 1, duration: 0.04 }, Math.max(0, t + i * 0.04));
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, d) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: d ?? 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };
      const popSvg = (el, t, origen) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.6, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(2)", immediateRender: false }, t);

      const tipear = (el, txt, t, cps, rojo) => {
        el.innerHTML = [...txt].map((c) => `<span class="k${rojo && rojo.includes(c) ? " r" : ""}">${c === " " ? "&nbsp;" : c}</span>`).join("");

      const sello = (el, t, rot) => {

      };
      const temblor = (el, t, f) => [[-12, 7], [10, -6], [-5, 3], [0, 0]].forEach(([x, y], i) => tl.to(el, { x: x * (f ?? 1), y: y * (f ?? 1), duration: 0.04, ease: "none" }, t + i * 0.045));
      const etiquetas = (lista) => {
        lista.forEach(([txt, t], i) => {
          const el = document.createElement("div");
          el.className = "etq";
          el.innerHTML = txt;
          q(".capa").appendChild(el);
          gsap.set(el, { opacity: 0 });
          tl.fromTo(el, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t);

        });
      };
      const POSTIT = 1.2, CAJA = 2.16, LUCIA = 3.0, TRES = 4.08, SIGNOS = 4.32, PREGUNTA = 4.8;

      dibujar(qa(".s03-tecla"), 0.15, 0.25);
      dibujar([q(".s03-numeros"), q(".s03-total")], 0.3, 0.4);
      // el post-it: pop y aleteo
      pop(q(".s03-postit"), POSTIT - 0.1);
      tl.fromTo(q(".s03-postit"), { rotation: -6 }, { rotation: -10, duration: 0.5, yoyo: true, repeat: 7, ease: "sine.inOut" }, POSTIT + 0.2);
      qa(".s03-preg span").forEach((s) => gsap.set(s, { opacity: 0 }));
      // la lupa entra y se para sobre el post-it
      gsap.set(q(".s03-lupa"), { opacity: 0, x: 980, y: 1300 });

      tl.to(q(".s03-lupa"), { x: 410, y: 885, duration: 0.6, ease: "power3.out" }, CAJA - 0.6);

      tl.to(q(".escenario"), { scale: 1.28, x: 120, y: -70, transformOrigin: "410px 885px", duration: 0.5, ease: "power3.inOut" }, LUCIA - 0.15);
      tl.to(q(".s03-caja"), { opacity: 0.5, duration: 0.4 }, LUCIA);
      // los tres signos de pregunta, rojos
