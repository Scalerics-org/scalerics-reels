<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/asmr.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s06-baja-la-voz"] .s06-capa, [data-composition-id="s06-baja-la-voz"] .s06-escenario { position: absolute; inset: 0; }
    [data-composition-id="s06-baja-la-voz"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s06-baja-la-voz"] .s06-tag { left: 0; right: 0; margin: 0 auto; width: 400px; top: 1310px; font-size: 34px; }
    [data-composition-id="s06-baja-la-voz"] .s06-vol { position: absolute; left: 70px; top: 640px; }
  </style>
  <div id="root" data-composition-id="s06-baja-la-voz" data-width="1080" data-height="1920" data-duration="3.78">
    <div id="s06-escena" class="s06-capa clip" data-start="0" data-duration="3.78" data-track-index="0">
      <div class="s06-escenario">
        <svg class="s06-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="as-tag amb s06-tag">TRABAJANDO</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s06-baja-la-voz";
      const DUR = 3.78;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = AS.kit(tl, root);
      const { q, qa } = K;

      // volumen: parlante y 5 rayitas
      let rayas = "";
      for (let i = 0; i < 5; i++) rayas += `<rect class="s06-r s06-r${i}" x="${190 + i * 34}" y="${780 - i * 22}" width="22" height="${40 + i * 22}" rx="8" fill="${AS.LAV}" stroke="${AS.INK}" stroke-width="4"/>`;
      q(".s06-svg").innerHTML =
        `<g class="s06-volumen"><path d="M80 740 H120 L170 700 V840 L120 800 H80 Z" fill="${AS.LAV2}" stroke="${AS.INK}" stroke-width="6" stroke-linejoin="round"/>${rayas}</g>
        <g class="s06-mic">${AS.mic(890, 760, 0.55, { sinPie: true })}</g>
        <g class="s06-beto">${AS.beto(540, 1430, 1.3, { cara: "enojado", dedo: true })}</g>`;

      const PODES = 0.95, BAJAR = 1.2, VOZ = 1.66, ESTOY = 2.03, TRAB = 2.31;
      const b = q(".s06-beto");
      // cuadro 0: Beto se da vuelta de golpe con el dedo en la boca
      tl.fromTo(b, { x: 120, rotation: 4, opacity: 0.6, transformOrigin: "50% 100%" }, { x: 0, rotation: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
      tl.fromTo(qa(".s06-beto .as-b-luz"), { opacity: 0.25 }, { opacity: 0.12, duration: 0.4, immediateRender: false }, 0);
      tl.fromTo(q(".s06-beto .as-b-brazo"), { y: 40 }, { y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 0.05);
      K.popSvg(q(".s06-volumen"), 0.2, "200 770");
      K.popSvg(q(".s06-mic"), 0.3, "890 760");
      // "¿podés bajar la voz?": las rayitas del volumen se apagan una por una y al micrófono se le caen las orejas
      [4, 3, 2, 1].forEach((i, k) => tl.to(q(".s06-r" + i), { opacity: 0.12, duration: 0.08 }, BAJAR + k * 0.12));
      const oi = q(".s06-mic .as-m-oi"), od = q(".s06-mic .as-m-od");
      K.origen(oi, "-110 -60"); K.origen(od, "110 -60");
      tl.to(oi, { rotation: -55, duration: 0.35, ease: "back.out(2)" }, VOZ - 0.1);
      tl.to(od, { rotation: 55, duration: 0.35, ease: "back.out(2)" }, VOZ - 0.1);
      tl.to(q(".s06-mic"), { y: 30, scale: 0.9, svgOrigin: "890 760", duration: 0.35 }, VOZ - 0.1);
      tl.to(q(".s06-mic .as-m-led"), { opacity: 0.15, duration: 0.15 }, VOZ);
      // "estoy trabajando": señala la pantalla (la cabeza se inclina) y cartel
      K.origen(q(".s06-beto .as-b-cabeza"), "0 -230");
      tl.to(q(".s06-beto .as-b-cabeza"), { rotation: -6, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, ESTOY);
      K.sello(q(".s06-tag"), TRAB, -3);
      K.hablar(".s06-beto .as-b-boca", PODES, 6, 0.1);

      K.salida(q("#s06-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
