<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/asmr.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s04-copiar"] .s04-capa, [data-composition-id="s04-copiar"] .s04-escenario { position: absolute; inset: 0; }
    [data-composition-id="s04-copiar"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s04-copiar"] .s04-tecla { position: absolute; top: 600px; height: 150px; box-sizing: border-box; border: 7px solid #120c22; border-radius: 26px; background: #2c2250;
      box-shadow: 0 16px 0 #120c22, inset 0 -10px 0 #3d3070; font-family: "Lexend", sans-serif; font-weight: 800; color: #e4dcff; text-align: center; line-height: 128px; }
    [data-composition-id="s04-copiar"] .s04-ctrl { left: 170px; width: 320px; font-size: 64px; }
    [data-composition-id="s04-copiar"] .s04-c { left: 540px; width: 160px; font-size: 80px; }
    [data-composition-id="s04-copiar"] .s04-v { left: 750px; width: 160px; font-size: 80px; }
    [data-composition-id="s04-copiar"] .s04-mas { left: 490px; width: 50px; top: 640px; font-size: 70px; }
  </style>
  <div id="root" data-composition-id="s04-copiar" data-width="1080" data-height="1920" data-duration="3.02">
    <div id="s04-escena" class="s04-capa clip" data-start="0" data-duration="3.02" data-track-index="0">
      <div class="s04-escenario">
        <svg class="s04-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="s04-tecla s04-ctrl">Ctrl</div>
        <div class="as-titulo s04-mas">+</div>
        <div class="s04-tecla s04-c">C</div>
        <div class="s04-tecla s04-v">V</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s04-copiar";
      const DUR = 3.02;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = AS.kit(tl, root);
      const { q, qa } = K;

      const filas = [["7", "~", "~", "~"], ["8", "~", "~", "~"], ["9", "", "", ""], ["10", "", "", ""]];
      const [b1] = AS.globo(60, 920, "2 tortas", "i", { fs: 34, cls: "s04-b1" });
      const [b2] = AS.globo(60, 1060, "1 pan casero", "i", { fs: 34, cls: "s04-b2" });
      q(".s04-svg").innerHTML =
        `<rect x="40" y="860" width="440" height="330" rx="34" fill="${AS.NOCHE2}" stroke="${AS.LAV3}" stroke-width="5" opacity="0.7"/>
        <text x="70" y="900" font-family="IBM Plex Mono" font-weight="600" font-size="24" fill="${AS.LAV}" letter-spacing="3">WHATSAPP</text>
        <rect class="s04-sel1" x="50" y="912" width="300" height="90" rx="24" fill="${AS.LAV}" opacity="0"/>
        <rect class="s04-sel2" x="50" y="1052" width="380" height="90" rx="24" fill="${AS.LAV}" opacity="0"/>
        ${b1}${b2}
        <g class="s04-pl">${AS.planilla(520, 860, 500, filas, { fs: 26, rh: 64, cols: [0.16, 0.24, 0.4, 0.2], titulo: "PEDIDOS" })}</g>
        <text class="s04-t1" x="736" y="1159" font-family="Lexend" font-weight="600" font-size="26" fill="${AS.AZ3}">2 tortas</text>
        <text class="s04-t2" x="736" y="1223" font-family="Lexend" font-weight="600" font-size="26" fill="${AS.AZ3}">1 pan casero</text>
        <g class="s04-cursor"><path d="M0 0 L0 54 L14 42 L24 66 L34 62 L24 38 L42 38 Z" fill="${AS.LAV2}" stroke="${AS.INK}" stroke-width="4" stroke-linejoin="round"/></g>`;

      const T = [0, 0.7, 1.38, 2.14]; // copiar, pegar, copiar, pegar
      const cursor = q(".s04-cursor");
      gsap.set(cursor, { x: 330, y: 980 });
      tl.fromTo(q(".s04-escenario"), { opacity: 0.6 }, { opacity: 1, duration: 0.2 }, 0);
      // las teclas: Ctrl siempre apretada; C y V se hunden en cada palabra
      const apretar = (el, t) => {
        tl.to(el, { y: 12, boxShadow: "0 4px 0 #120c22, inset 0 -10px 0 #3d3070", background: "#7a68c4", duration: 0.06 }, t);
        tl.to(el, { y: 0, boxShadow: "0 16px 0 #120c22, inset 0 -10px 0 #3d3070", background: "#2c2250", duration: 0.18 }, t + 0.3);
      };
      [[T[0], ".s04-c", ".s04-sel1"], [T[2], ".s04-c", ".s04-sel2"]].forEach(([t, k, sel]) => {
        apretar(q(".s04-ctrl"), t - 0.04); apretar(q(k), t);
        tl.to(q(sel), { opacity: 0.45, duration: 0.1 }, t);
        tl.to(q(sel), { opacity: 0, duration: 0.2 }, t + 0.55);
      });
      [[T[1], ".s04-t1", 1159], [T[3], ".s04-t2", 1223]].forEach(([t, txt, y]) => {
        apretar(q(".s04-ctrl"), t - 0.04); apretar(q(".s04-v"), t);
        K.tipearSvg(q(txt), t + 0.02, 0.25);
      });
      // el cursor va y viene entre el chat y la planilla
      tl.to(cursor, { x: 850, y: 1150, duration: 0.45, ease: "power2.inOut" }, T[0] + 0.15);
      tl.to(cursor, { x: 410, y: 1110, duration: 0.45, ease: "power2.inOut" }, T[1] + 0.15);
      tl.to(cursor, { x: 900, y: 1215, duration: 0.45, ease: "power2.inOut" }, T[2] + 0.2);
      tl.to(cursor, { x: 960, y: 1240, duration: 0.5, ease: "power1.inOut" }, T[3] + 0.3);

      K.salida(q("#s04-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
