<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/asmr.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s13-solo"] .s13-capa, [data-composition-id="s13-solo"] .s13-escenario { position: absolute; inset: 0; }
    [data-composition-id="s13-solo"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s13-solo"] .s13-tag { left: 0; right: 0; margin: 0 auto; width: 440px; top: 600px; }
    [data-composition-id="s13-solo"] .s13-hora { position: absolute; left: 0; right: 0; top: 780px; text-align: center; font-family: "Lexend", sans-serif; font-weight: 300; font-size: 120px; color: #e4dcff; letter-spacing: 0.02em; }
  </style>
  <div id="root" data-composition-id="s13-solo" data-width="1080" data-height="1920" data-duration="4.19">
    <div id="s13-escena" class="s13-capa clip" data-start="0" data-duration="4.19" data-track-index="0">
      <div class="s13-escenario">
        <svg class="s13-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="as-tag verde s13-tag">SIN TOCAR NADA</div>
        <div class="s13-hora">23:40</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s13-solo";
      const DUR = 4.19;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = AS.kit(tl, root);
      const { q, qa } = K;

      const PX = 290, PY = 680, PW = 500, PH = 740;
      const nombres = [["Sra. Ofelia", AS.LAV], ["Marcelo", AS.AZ], ["Lucía", AS.AMB]];
      let lista = "";
      nombres.forEach(([n, c], i) => {
        const y = PY + 130 + i * 130;
        lista += `<g class="s13-fila s13-f${i}"><rect x="${PX + 30}" y="${y}" width="${PW - 60}" height="110" rx="24" fill="${AS.NOCHE2}"/>
          <circle cx="${PX + 90}" cy="${y + 55}" r="30" fill="${c}" stroke="${AS.INK}" stroke-width="4"/>
          <text x="${PX + 140}" y="${y + 48}" font-family="Lexend" font-weight="600" font-size="30" fill="${AS.LAV2}">${n}</text>
          <text x="${PX + 140}" y="${y + 88}" font-family="Lexend" font-weight="400" font-size="26" fill="${AS.LAV}">Pedido listo</text>
          <path d="M${PX + PW - 100} ${y + 72} l8 8 l14 -16 M${PX + PW - 84} ${y + 72} l8 8 l14 -16" fill="none" stroke="${AS.VERDE}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>`;
      });
      const noti = `<g class="s13-noti">
        <rect x="${PX + 26}" y="${PY + 330}" width="${PW - 52}" height="250" rx="30" fill="${AS.LAV2}" stroke="${AS.INK}" stroke-width="5"/>
        <rect x="${PX + 50}" y="${PY + 354}" width="44" height="44" rx="12" fill="${AS.VERDE}"/>
        <path d="M${PX + 60} ${PY + 386} V${PY + 374} M${PX + 72} ${PY + 386} V${PY + 364} M${PX + 84} ${PY + 386} V${PY + 370}" stroke="${AS.INK}" stroke-width="5" stroke-linecap="round"/>
        <text x="${PX + 110}" y="${PY + 388}" font-family="IBM Plex Mono" font-weight="600" font-size="24" fill="${AS.NOCHE3}" letter-spacing="2">REPORTE DEL DÍA</text>
        <text class="s13-l1" x="${PX + 50}" y="${PY + 450}" font-family="Lexend" font-weight="600" font-size="28" fill="${AS.INK}">Pedidos: en la planilla</text>
        <text class="s13-l2" x="${PX + 50}" y="${PY + 496}" font-family="Lexend" font-weight="600" font-size="28" fill="${AS.INK}">Avisos: enviados</text>
        <text class="s13-l3" x="${PX + 50}" y="${PY + 542}" font-family="Lexend" font-weight="700" font-size="28" fill="${AS.VERDE2}">Vos: a dormir</text>
      </g>`;
      q(".s13-svg").innerHTML =
        `${AS.celular(PX, PY, PW, PH, {})}
        <g class="s13-chats"><text x="${PX + 46}" y="${PY + 100}" font-family="Lexend" font-weight="700" font-size="34" fill="${AS.LAV2}">Chats</text>${lista}</g>
        <g class="s13-bloq">${AS.luna(PX + PW / 2, PY + 270, 36)}</g>
        ${noti}`;

      const LISTO = 0.6, SALE = 1.05, SOLO = 1.23, REPORTE = 1.94, DIA = 2.39, CEL = 3.19;
      tl.fromTo(q(".s13-escenario"), { opacity: 0.6 }, { opacity: 1, duration: 0.25 }, 0);
      // los avisos salen solos, uno atrás del otro, sin ninguna mano
      [0, 1, 2].forEach((i) => {
        const f = q(".s13-f" + i);
        gsap.set(f, { opacity: 0 });
        tl.fromTo(f, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.22, ease: "back.out(1.6)", immediateRender: false }, LISTO - 0.4 + i * 0.32);
      });
      K.pop(q(".s13-tag"), SOLO - 0.1);
      // "el reporte del día te llega al celular": pantalla bloqueada de noche y la notificación
      tl.to(q(".s13-chats"), { opacity: 0, y: -30, duration: 0.25 }, REPORTE - 0.3);
      tl.to(q(".s13-tag"), { opacity: 0, duration: 0.2 }, REPORTE - 0.3);
      gsap.set([q(".s13-hora"), q(".s13-bloq")], { opacity: 0 });
      tl.to([q(".s13-hora"), q(".s13-bloq")], { opacity: 1, duration: 0.3 }, REPORTE - 0.15);
      gsap.set(q(".s13-noti"), { opacity: 0 });
      tl.fromTo(q(".s13-noti"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, DIA - 0.1);
      ["s13-l1", "s13-l2", "s13-l3"].forEach((c, i) => K.tipearSvg(q("." + c), DIA + 0.3 + i * 0.35, 0.3));
      tl.to(q(".s13-noti"), { scale: 1.04, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 1 }, CEL);

      K.salida(q("#s13-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
