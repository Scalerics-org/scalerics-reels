<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/asmr.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s10-ofelia"] .s10-capa, [data-composition-id="s10-ofelia"] .s10-escenario { position: absolute; inset: 0; }
    [data-composition-id="s10-ofelia"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s10-ofelia"] .s10-reloj { left: 600px; width: 400px; top: 1010px; font-size: 100px; color: #ff6f91; border-color: #ff6f91; text-shadow: 0 0 28px rgba(255, 111, 145, 0.8); }
  </style>
  <div id="root" data-composition-id="s10-ofelia" data-width="1080" data-height="1920" data-duration="5.32">
    <div id="s10-escena" class="s10-capa clip" data-start="0" data-duration="5.32" data-track-index="0">
      <div class="s10-escenario">
        <svg class="s10-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="as-reloj s10-reloj">01:00</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s10-ofelia";
      const DUR = 5.32;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = AS.kit(tl, root);
      const { q, qa } = K;

      // globo de audio de WhatsApp (genérico): play, onda y duración
      let ondita = "";
      for (let i = 0; i < 18; i++) ondita += `<rect class="s10-ob" x="${700 + i * 14}" y="${690 - (10 + ((i * 7) % 5) * 6)}" width="8" height="${20 + ((i * 7) % 5) * 12}" rx="4" fill="${AS.AMB3}"/>`;
      const [resp] = AS.globo(600, 1200, "zzz...", "i", { fs: 40, hora: "01:01", cls: "s10-resp" });
      q(".s10-svg").innerHTML =
        `<g class="s10-chat">
          <text x="606" y="610" font-family="IBM Plex Mono" font-weight="600" font-size="26" fill="${AS.LAV}" letter-spacing="3">SRA. OFELIA</text>
          <g class="s10-audio"><rect x="600" y="630" width="410" height="120" rx="26" fill="${AS.AMB2}" stroke="${AS.INK}" stroke-width="5"/>
            <circle cx="652" cy="690" r="30" fill="${AS.AMB3}"/><path d="M642 672 L670 690 L642 708 Z" fill="${AS.AMB2}"/>${ondita}
            <text x="996" y="738" text-anchor="end" font-family="IBM Plex Mono" font-weight="600" font-size="20" fill="${AS.NOCHE3}" data-layout-ignore>0:07</text></g>
        </g>
        ${AS.bizcocho(800, 880, 0.75, "s10-biz")}
        ${AS.luna(950, 1000, 34, "s10-luna")}
        ${resp}
        <g class="s10-beto">${AS.beto(320, 1430, 1.0, { cara: "cansado", cel: true })}</g>`;

      const OFELIA = 0.47, BIZ = 1.93, SI = 2.85, UNA = 3.73, PERDON = 4.41;
      tl.fromTo(q(".s10-beto"), { opacity: 0.6, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo(qa(".s10-beto .as-b-luz"), { opacity: 0.15 }, { opacity: 0.15, duration: 0.1 }, 0);
      K.hablar(".s10-beto .as-b-boca", 0.05, 14, 0.13);
      // el audio se graba: aparece el globo y la onda late
      K.pop(q(".s10-chat"), OFELIA - 0.2);
      qa(".s10-ob").forEach((b, i) => {
        gsap.set(b, { svgOrigin: `${700 + i * 14} 680`, smoothOrigin: false });
        tl.fromTo(b, { scaleY: 0.4 }, { scaleY: 1.2, duration: 0.18 + (i % 3) * 0.05, yoyo: true, repeat: 15, ease: "sine.inOut", immediateRender: false }, OFELIA + (i % 4) * 0.04);
      });
      K.popSvg(q(".s10-biz"), BIZ - 0.05, "800 870");
      K.flotar(q(".s10-biz"), BIZ + 0.4, 2.4, 8, 1.2);
      // "sí, a la una": el reloj en rosa y la luna
      K.sello(q(".s10-reloj"), UNA - 0.05, -3);
      K.popSvg(q(".s10-luna"), UNA + 0.1, "950 1000");
      // "perdón": baja la cabeza; la señora contesta dormida
      K.origen(q(".s10-beto .as-b-cabeza"), "0 -230");
      tl.to(q(".s10-beto .as-b-cabeza"), { rotation: 9, duration: 0.35, ease: "power2.out" }, PERDON - 0.05);
      tl.fromTo(q(".s10-beto .as-b-gota"), { opacity: 0, y: -10 }, { opacity: 1, y: 20, duration: 0.6, immediateRender: false }, PERDON);
      K.popSvg(q(".s10-resp"), PERDON + 0.3, "620 1240", 0.35);

      K.salida(q("#s10-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
