<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/asmr.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-orejas"] .s03-capa, [data-composition-id="s03-orejas"] .s03-escenario { position: absolute; inset: 0; }
    [data-composition-id="s03-orejas"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s03-orejas"] .s03-L { left: 120px; top: 1220px; font-size: 150px; width: 160px; }
    [data-composition-id="s03-orejas"] .s03-R { left: 800px; top: 1220px; font-size: 150px; width: 160px; }
  </style>
  <div id="root" data-composition-id="s03-orejas" data-width="1080" data-height="1920" data-duration="5.05">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="5.05" data-track-index="0">
      <div class="s03-escenario">
        <svg class="s03-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="as-titulo s03-L">L</div>
        <div class="as-titulo amb s03-R">R</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-orejas";
      const DUR = 5.05;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = AS.kit(tl, root);
      const { q, qa } = K;

      const MX = 540, MY = 1010, MS = 1.45;
      const izq = ["pedido", "¿hay pan?", "2 tortas"];
      const der = ["1 docena", "¿a qué hora?", "retiro mañana", "¿me guardás?", "3 flautas", "¿y bizcochos?"];
      const gi = izq.map((t, i) => AS.globo(20, 700 + i * 120, t, "i", { fs: 30, cls: "s03-gi s03-gi" + i })[0]).join("");
      const gd = der.map((t, i) => AS.globo(1100, 640 + i * 110, t, "d", { fs: 30, fill: AS.AMB2, cls: "s03-gd s03-gd" + i })[0]).join("");
      q(".s03-svg").innerHTML =
        `<g class="s03-pie"><path d="M${MX} ${MY + 110} L${MX} ${MY + 420}" stroke="${AS.INK}" stroke-width="34" stroke-linecap="round"/><path d="M${MX} ${MY + 110} L${MX} ${MY + 420}" stroke="${AS.LAV3}" stroke-width="16" stroke-linecap="round"/>
          <ellipse cx="${MX}" cy="${MY + 425}" rx="150" ry="28" fill="${AS.NOCHE2}" stroke="${AS.INK}" stroke-width="7"/></g>
        <g class="s03-arcos-i">${AS.arcos(MX - 330, MY, -1, AS.LAV, "s03-ai", 3)}</g>
        <g class="s03-arcos-d">${AS.arcos(MX + 330, MY, 1, AS.AMB, "s03-ad", 3)}</g>
        <g class="s03-mic">${AS.mic(MX, MY, MS, { sinPie: true })}</g>
        ${gi}${gd}`;

      const IZQ = 0.39, PEDIDOS1 = 1.19, DER = 2.55, MAS = 3.48, PEDIDOS2 = 4.13;
      const oi = q(".s03-mic .as-m-oi"), od = q(".s03-mic .as-m-od");
      K.origen(oi, oi.dataset.o); K.origen(od, od.dataset.o);

      // cuadro 0: el micrófono ya está y se acerca muy despacio
      tl.fromTo(q(".s03-escenario"), { scale: 0.94, opacity: 0.6 }, { scale: 1.02, opacity: 1, duration: DUR, ease: "none", transformOrigin: "50% 55%" }, 0);
      tl.fromTo(q(".s03-escenario"), { opacity: 0.5 }, { opacity: 1, duration: 0.3 }, 0);
      tl.to(q(".s03-mic .as-m-led"), { opacity: 0.25, duration: 0.35, yoyo: true, repeat: 7, ease: "sine.inOut" }, 0);

      // "oreja izquierda": L y la oreja se mueve; los pedidos entran por la izquierda
      K.pop(q(".s03-L"), IZQ - 0.1);
      tl.to(oi, { rotation: -12, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, IZQ);
      K.latir(".s03-ai", IZQ, 1.8);
      izq.forEach((_, i) => {
        const g = q(".s03-gi" + i);
        gsap.set(g, { opacity: 0 });
        const t = PEDIDOS1 - 0.45 + i * 0.22;
        tl.fromTo(g, { opacity: 0, x: -60 }, { opacity: 1, x: 80, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
        tl.to(g, { x: 170, y: MY - (700 + i * 120) - 20, scale: 0.15, opacity: 0, svgOrigin: `0 ${700 + i * 120 + 30}`, duration: 0.5, ease: "power2.in" }, t + 0.4);
      });
      tl.to(q(".s03-L"), { opacity: 0.35, duration: 0.3 }, DER - 0.2);

      // "oreja derecha": R; "más pedidos": una catarata de mensajes entra por la derecha y el micrófono se satura
      K.pop(q(".s03-R"), DER - 0.1);
      tl.to(od, { rotation: 12, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, DER);
      K.latir(".s03-ad", DER, 2.4);
      der.forEach((_, i) => {
        const g = q(".s03-gd" + i);
        gsap.set(g, { opacity: 0 });
        const t = MAS - 0.2 + i * 0.17;
        tl.fromTo(g, { opacity: 0, x: 60 }, { opacity: 1, x: -110, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
        tl.to(g, { x: -200, y: MY - (640 + i * 110) - 20, scale: 0.15, opacity: 0, svgOrigin: `1100 ${640 + i * 110 + 30}`, duration: 0.45, ease: "power2.in" }, t + 0.35);
      });
      K.vibrar(q(".s03-mic"), PEDIDOS2 - 0.1, 0.6, 6);
      tl.to(q(".s03-mic .as-m-led"), { scale: 1.5, svgOrigin: `0 -96`, duration: 0.15, yoyo: true, repeat: 3 }, PEDIDOS2);

      K.salida(q("#s03-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
