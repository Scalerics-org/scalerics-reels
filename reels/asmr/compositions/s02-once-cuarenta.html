  <script>
    (function () {
      const ID = "s02-once-cuarenta";
      const DUR = 5.73;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = AS.kit(tl, root);
      const { q, qa } = K;

      const filas = [["1", "~", "~", "~"], ["2", "~", "~", "~"], ["3", "~", "~", "~"], ["4", "~", "~", "~"], ["5", "~", "~", "~"], ["6", "~", "~", "~"]];
      const g1 = AS.globo(70, 1010, "2 tortas", "i", { fs: 30, cls: "s02-g s02-g1" })[0];
      const g2 = AS.globo(110, 1090, "1 docena", "i", { fs: 30, cls: "s02-g s02-g2" })[0];
      const g3 = AS.globo(60, 1170, "¿hay pan?", "i", { fs: 30, cls: "s02-g s02-g3" })[0];
      q(".s02-svg").innerHTML =
        `<g class="s02-mesa">
          ${AS.velador(150, 1410, 0.75, "s02-vel")}
          <g class="s02-beto">${AS.beto(400, 1430, 0.82, { cara: "cansado" })}</g>

      const ONCE = 0.8, CUARENTA = 1.52, BETO = 1.92, PANADERO = 2.48, PEDIDOS = 3.52, WHATSAPP = 4.0, PLANILLA = 4.8;

      // "hola...": entra el susurro; el reloj de la noche

      gsap.set(q(".s02-r2"), { opacity: 0 });
      K.pop(q(".s02-reloj"), ONCE - 0.15, 0.4);
      tl.to(q(".s02-r1"), { opacity: 0, y: -40, duration: 0.18 }, CUARENTA - 0.05);
      tl.fromTo(q(".s02-r2"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.18, immediateRender: false }, CUARENTA - 0.05);
      tl.to(q(".s02-reloj"), { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1 }, CUARENTA + 0.1);

      // "Beto": el reloj se achica arriba y aparece el escritorio

      gsap.set(q(".s02-mesa"), { opacity: 0 });
      tl.fromTo(q(".s02-mesa"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, BETO - 0.1);
      tl.fromTo(qa(".s02-beto .as-b-luz"), { opacity: 0.12 }, { opacity: 0.3, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, BETO);
      K.pop(q(".s02-tag"), PANADERO - 0.05);
      tl.fromTo(q(".s02-vel .as-vel-luz"), { opacity: 0.1 }, { opacity: 0.24, duration: 0.8, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, BETO);

      // "pasa los pedidos de WhatsApp a la planilla": los mensajes vuelan a las filas 4, 5 y 6
      ["s02-g1", "s02-g2", "s02-g3"].forEach((c, i) => {
        const t = PEDIDOS - 0.3 + i * 0.25;
        K.popSvg(q("." + c), t, null, 0.3);
        tl.to(q("." + c), { x: 560 - i * 30, y: [-50, -80, -110][i], scale: 0.4, opacity: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "power2.in" }, WHATSAPP + 0.1 + i * 0.3);
        const fila = q(".s02-pl .as-fila-" + (3 + i));
        const cel = Array.from(fila.querySelectorAll(".as-celda")).slice(1);
        gsap.set(cel, { opacity: 0 });
        tl.to(cel, { opacity: 0.3, duration: 0.15, stagger: 0.04 }, WHATSAPP + 0.55 + i * 0.3);
        tl.fromTo(fila.querySelector(".as-fila-fondo"), { opacity: 0 }, { opacity: 0.35, duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, WHATSAPP + 0.55 + i * 0.3);

      K.salida(q("#s02-escena"), DUR);
