<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/asmr.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s09-pedido-listo"] .s09-capa, [data-composition-id="s09-pedido-listo"] .s09-escenario { position: absolute; inset: 0; }
    [data-composition-id="s09-pedido-listo"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s09-pedido-listo"] .s09-faltan { left: 600px; top: 1190px; font-size: 36px; transform-origin: 50% 50%; }
    [data-composition-id="s09-pedido-listo"] .s09-tag { left: 70px; top: 640px; }
  </style>
  <div id="root" data-composition-id="s09-pedido-listo" data-width="1080" data-height="1920" data-duration="4.87">
    <div id="s09-escena" class="s09-capa clip" data-start="0" data-duration="4.87" data-track-index="0">
      <div class="s09-escenario">
        <svg class="s09-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="as-tag amb s09-tag">UNO POR UNO · A MANO</div>
        <div class="as-sello amb s09-faltan">FALTAN: MUCHOS</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s09-pedido-listo";
      const DUR = 4.87;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = AS.kit(tl, root);
      const { q, qa } = K;

      const PX = 300, PY = 680, PW = 480, PH = 660;
      const chat = (cls, nombre, color, recibido) => {
        const [r] = AS.globo(PX + 40, PY + 190, recibido, "i", { fs: 30 });
        const [m] = AS.globo(PX + PW - 40, PY + 330, "Pedido listo", "d", { fs: 34, hora: "23:58", ticks: "gris", cls: cls + "-m" });
        return `<g class="${cls}">${AS.celular(PX, PY, PW, PH, { nombre, colorAvatar: color })}${r}${m}
          <rect x="${PX + 40}" y="${PY + PH - 110}" width="${PW - 170}" height="64" rx="32" fill="${AS.NOCHE2}"/>
          <circle cx="${PX + PW - 82}" cy="${PY + PH - 78}" r="36" fill="${AS.AMB}" stroke="${AS.INK}" stroke-width="5"/>
          <path d="M${PX + PW - 96} ${PY + PH - 94} L${PX + PW - 62} ${PY + PH - 78} L${PX + PW - 96} ${PY + PH - 62} Z" fill="${AS.INK}"/></g>`;
      };
      q(".s09-svg").innerHTML =
        chat("s09-c1", "Sra. Ofelia", AS.LAV, "¿y mis bizcochos?") +
        chat("s09-c2", "Marcelo", AS.AZ, "¿la torta?") +
        AS.mano(PX + PW - 82, PY + PH - 70, 0.8, "s09-mano");

      const AVISO = 0.4, UNO = 1.08, P1 = 1.92, L1 = 2.66, P2 = 3.39, L2 = 4.45;
      const mano = q(".s09-mano");
      gsap.set(q(".s09-c2"), { opacity: 0 });
      // cuadro 0: el celular ya está
      tl.fromTo(q(".s09-escenario"), { opacity: 0.6, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0);
      gsap.set(mano, { y: 260, opacity: 0 });
      tl.to(mano, { y: 40, opacity: 1, duration: 0.4, ease: "power2.out" }, AVISO);
      K.pop(q(".s09-tag"), UNO - 0.05);
      // un "pedido listo" por chat: el dedo aprieta enviar y sale el globo
      const enviar = (t, c) => {
        tl.to(mano, { y: 0, duration: 0.1, ease: "power2.in" }, t - 0.12);
        tl.to(mano, { y: 40, duration: 0.18, ease: "power2.out" }, t);
        K.popSvg(q("." + c + "-m"), t, `${PX + PW - 40} ${PY + 370}`, 0.35);
      };
      gsap.set(q(".s09-c1-m"), { opacity: 0 });
      enviar(P1, "s09-c1");
      // cambia de chat a mano: el celular se desliza
      tl.to(q(".s09-c1"), { x: -160, opacity: 0, duration: 0.25, ease: "power2.in" }, L1 + 0.2);
      tl.fromTo(q(".s09-c2"), { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, L1 + 0.3);
      gsap.set(q(".s09-c2-m"), { opacity: 0 });
      enviar(P2, "s09-c2");
      K.sello(q(".s09-faltan"), L2 - 0.4, -6);
      tl.to(q(".s09-escenario"), { scale: 1.03, transformOrigin: "50% 60%", duration: DUR - L1, ease: "none" }, L1);

      K.salida(q("#s09-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
