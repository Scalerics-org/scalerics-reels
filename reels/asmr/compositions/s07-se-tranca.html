<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/asmr.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s07-se-tranca"] .s07-capa, [data-composition-id="s07-se-tranca"] .s07-escenario { position: absolute; inset: 0; }
    [data-composition-id="s07-se-tranca"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s07-se-tranca"] .s07-perdon { left: 0; right: 0; top: 640px; font-size: 84px; }
    [data-composition-id="s07-se-tranca"] .s07-fav { left: 0; right: 0; margin: 0 auto; width: 420px; top: 640px; }
    [data-composition-id="s07-se-tranca"] .s07-nr { left: 0; right: 0; margin: 0 auto; width: 560px; top: 1290px; font-size: 52px; }
  </style>
  <div id="root" data-composition-id="s07-se-tranca" data-width="1080" data-height="1920" data-duration="4.16">
    <div id="s07-escena" class="s07-capa clip" data-start="0" data-duration="4.16" data-track-index="0">
      <div class="s07-escenario">
        <svg class="s07-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="as-susurro s07-perdon">perdón...</div>
        <div class="as-tag s07-fav">MI FAVORITO</div>
        <div class="as-sello s07-nr">NO RESPONDE</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s07-se-tranca";
      const DUR = 4.16;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const tl = gsap.timeline({ paused: true });
      const K = AS.kit(tl, root);
      const { q, qa } = K;

      const filas = [["12", "Ofelia", "2 doc. bizcochos", "mañana"], ["13", "~", "~", "~"], ["14", "~", "~", "~"], ["15", "~", "~", "~"]];
      q(".s07-svg").innerHTML =
        `<g class="s07-asmr">
          <g class="s07-chica">${AS.asmrtista(370, 1430, 0.95)}</g>
          <g class="s07-mic">${AS.mic(790, 1080, 0.75)}</g>
          ${AS.estrellas([[680, 860, 18], [910, 900, 14], [820, 780, 10]], AS.LAV2, "s07-est")}
        </g>
        <g class="s07-pl">${AS.planilla(70, 700, 940, filas, { fs: 32, rh: 84, titulo: "PEDIDOS · PLANILLA" })}
          <rect class="s07-velo" x="70" y="700" width="940" height="484" rx="22" fill="${AS.LAV2}" opacity="0"/>
          <g class="s07-tit" opacity="0"><rect x="160" y="708" width="760" height="50" fill="${AS.AZ}"/><text x="540" y="743" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="26" fill="${AS.ROSA}" letter-spacing="3">PEDIDOS · (NO RESPONDE)</text></g>
          <g class="s07-rueda">${AS.rueda(540, 950, 70, AS.NOCHE3)}</g>
        </g>`;

      const AHORA = 0.76, FAV = 1.42, PLANILLA = 2.35, TRANCA = 3.18;
      // cuadro 0: la ASMRtista pide perdón en voz bajita (cabeza gacha)
      tl.fromTo(q(".s07-asmr"), { opacity: 0.6 }, { opacity: 1, duration: 0.3 }, 0);
      K.origen(q(".s07-chica .as-a-cabeza"), "0 -240");
      tl.fromTo(q(".s07-chica .as-a-cabeza"), { rotation: 0 }, { rotation: 8, duration: 0.5, ease: "sine.inOut", immediateRender: false }, 0);
      tl.to(q(".s07-chica .as-a-cabeza"), { rotation: 0, duration: 0.4, ease: "sine.inOut" }, AHORA);
      K.suave(q(".s07-perdon"), 0.05, 0.5);
      tl.to(q(".s07-perdon"), { opacity: 0, filter: "blur(10px)", duration: 0.3 }, AHORA);
      K.hablar(".s07-chica .as-a-boca", AHORA, 5, 0.12);
      // "mi favorito": estrellitas y cartel
      K.pop(q(".s07-fav"), FAV - 0.1);
      K.titilar(".s07-est", FAV - 0.05, 0.9);
      const oi = q(".s07-mic .as-m-oi"), od = q(".s07-mic .as-m-od");
      K.origen(oi, oi.dataset.o); K.origen(od, od.dataset.o);
      tl.to([oi, od], { rotation: (i) => (i ? 10 : -10), duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, FAV);

      // "la planilla": entra la planilla
      tl.to(q(".s07-asmr"), { opacity: 0, scale: 0.85, transformOrigin: "50% 70%", duration: 0.3 }, PLANILLA - 0.3);
      tl.to(q(".s07-fav"), { opacity: 0, duration: 0.2 }, PLANILLA - 0.3);
      gsap.set(q(".s07-pl"), { opacity: 0 });
      tl.fromTo(q(".s07-pl"), { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.5)", immediateRender: false }, PLANILLA - 0.15);
      // "se tranca": velo blanco, el título y la ruedita que gira sin fin
      tl.to(q(".s07-velo"), { opacity: 0.55, duration: 0.1 }, TRANCA - 0.05);
      tl.to(q(".s07-tit"), { opacity: 1, duration: 0.05 }, TRANCA);
      K.sacudon(q(".s07-pl"), TRANCA, 1);
      const r = q(".s07-rueda .as-rueda");
      gsap.set(q(".s07-rueda"), { opacity: 0 });
      tl.to(q(".s07-rueda"), { opacity: 1, duration: 0.1 }, TRANCA);
      tl.fromTo(r, { rotation: 0, svgOrigin: "540 950" }, { rotation: 360, svgOrigin: "540 950", duration: DUR - TRANCA, ease: "none", immediateRender: false }, TRANCA);
      K.sello(q(".s07-nr"), TRANCA + 0.2, -3);

      K.salida(q("#s07-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
