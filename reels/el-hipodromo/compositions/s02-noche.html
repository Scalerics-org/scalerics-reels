  <script>
    (function () {
      const ID = "s02-noche";
      const DUR = 4.10;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const sacudon = (t, f = 1) => [[-12, 7], [9, -5], [-4, 2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s02-escenario"), { x: x * f, y: y * f, duration: 0.04, ease: "none" }, t + i * 0.045));

      // cuadro 0: el tablero ya está, la hora cae

      tl.fromTo(q(".s02-tlbl"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 0.15);
      // luna: se enciende en "noche"
      tl.fromTo(q(".s02-luna"), { opacity: 0.25, rotation: -20, svgOrigin: "860 700" }, { opacity: 1, rotation: 0, svgOrigin: "860 700", duration: 0.4, ease: "back.out(2)" }, NOCHE - 0.1);
      tl.fromTo(q(".s02-halo"), { scale: 0.6, svgOrigin: "860 700" }, { scale: 1.5, svgOrigin: "860 700", duration: 1.2, yoyo: true, repeat: 2, ease: "sine.inOut" }, NOCHE);
      // la pista corre (la baranda se desliza)
      tl.fromTo(q(".s02-postes"), { x: 0 }, { x: -540, duration: DUR, ease: "none" }, 0);

      // "sale": el globo-flecha asoma por la izquierda, y en "flecha" cruza a toda velocidad
      gsap.set(q(".s02-globo"), { x: -800 });
      tl.to(q(".s02-globo"), { x: -560, duration: 0.5, ease: "power2.out" }, SALE);
      tl.to(q(".s02-globo"), { x: -520, duration: 0.7, ease: "sine.inOut" }, SALE + 0.5);
      tl.to(q(".s02-globo"), { x: 0, duration: 0.3, ease: "power4.out" }, FLECHA - 0.25);
      sacudon(FLECHA + 0.05);
      gsap.set(q(".s02-vel"), { opacity: 0 });
      tl.fromTo(q(".s02-vel"), { opacity: 0, x: -200 }, { opacity: 0.7, x: 0, duration: 0.25, immediateRender: false }, FLECHA - 0.2);
      tl.to(q(".s02-vel"), { opacity: 0.3, x: -60, duration: 1.2, ease: "sine.inOut" }, FLECHA + 0.1);
      gsap.set(q(".s02-polvo"), { opacity: 0 });
      tl.fromTo(q(".s02-polvo"), { opacity: 0.6, scale: 0.4, svgOrigin: "260 1260" }, { opacity: 0, scale: 2, svgOrigin: "260 1260", duration: 1, ease: "power2.out", immediateRender: false }, FLECHA);
      tl.to(q(".s02-globo"), { y: -8, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, FLECHA + 0.3);

      // "clienta": rótulo
      gsap.set(q(".s02-rot"), { opacity: 0 });
      tl.fromTo(q(".s02-rot"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, CLIENTA - 0.1);

      tl.to(q("#s02-escena"), { x: 300, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);
