<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>

    .s07-tu { top: 560px; font-size: 200px; font-weight: 900; }

  <div id="root" data-composition-id="s07-tiempo" data-width="1080" data-height="1920" data-duration="6.53">

      <div class="s07-escenario">
        <div class="s07-etiqueta s07-et1">Tu tiempo</div><div class="s07-etiqueta s07-et2">Automatizaciones</div>
        <svg class="s07-svg" viewBox="0 0 1080 1920">
      
      <line class="s07-trazo v s07-sub" x1="190" y1="1210" x2="890" y2="1210" />

        <div class="s07-w s07-tu"><span class="s07-tu1">Tu</span> <span class="s07-tu2">tiempo,</span></div>

  <script>
    (function () {
      const ID = "s07-tiempo";
      const DUR = 6.53;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // golpe: entra grande y se asienta EN la palabra
      const golpe = (el, t, k = 1.45) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: k }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, t - 0.05);
      };
      // sube: entra desde abajo
      const sube = (el, t, d = 110) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, y: d, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "back.out(1.8)", immediateRender: false }, t - 0.06);
      };
      // desliza: entra de costado
      const desliza = (el, t, d = 140) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, x: d, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out", immediateRender: false }, t - 0.06);
      };
      // sale: se va para arriba con blur
      const sale = (els, t, d = -120) => tl.to(els, { y: d, opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in", stagger: 0.04 }, t);
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };
      const popDiv = (el, t) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };

      tl.fromTo(q(".s07-et1"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25 }, 0);
      golpe(q(".s07-tu1"), 0.04, 1.5);
      golpe(q(".s07-tu2"), 0.2, 1.4);
      tl.to(q(".s07-tu"), { scale: 0.62, y: -40, transformOrigin: "50% 0%", duration: 0.3, ease: "power3.inOut" }, 0.82);
      sube(q(".s07-para"), 0.94, 70);
      golpe(q(".s07-solo"), 1.25, 1.25);
      golpe(q(".s07-vos"), 1.65, 1.3);
      sube(q(".s07-saber"), 1.95, 90);
      tl.to(q(".s07-solovos"), { scale: 1.05, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.25);
      // cambio: entra Scalerics
      sale([q(".s07-tu"), q(".s07-para"), q(".s07-solovos"), q(".s07-saber")], 2.9);
      tl.to(q(".s07-et1"), { opacity: 0, y: -10, duration: 0.15 }, 2.95);
      gsap.set(q(".s07-et2"), { opacity: 0 });
      tl.fromTo(q(".s07-et2"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, 3.12);
      sube(q(".s07-esas"), 3.12, 70);
      golpe(q(".s07-auto"), 3.38, 1.35);
      sube(q(".s07-hacemos"), 4.59, 70);
      golpe(q(".s07-scal"), 5.35, 1.5);
      dibujar(qa(".s07-sub"), 5.55, 0.4);
      tl.to(q(".s07-auto"), { scale: 1.03, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.65);
      tl.to(q(".s07-scal"), { scale: 1.04, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 5.85);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
