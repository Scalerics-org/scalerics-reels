<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s08-cta"] .s08-capa, [data-composition-id="s08-cta"] .s08-escenario { position: absolute; inset: 0; }
    [data-composition-id="s08-cta"] .s08-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s08-cta"] .s08-w { position: absolute; left: 0; right: 0; text-align: center; font-family: "Lexend", sans-serif; font-weight: 800; text-transform: uppercase; line-height: 1; white-space: nowrap; letter-spacing: -0.02em; color: #ffffff; }
    [data-composition-id="s08-cta"] .s08-w span { display: inline-block; }
    [data-composition-id="s08-cta"] .s08-etiqueta { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.34em; color: #5ce611; text-transform: uppercase; }
    [data-composition-id="s08-cta"] .s08-trazo { fill: none; stroke: #efeee5; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s08-cta"] .s08-trazo.v { stroke: #5ce611; }


    .s08-guarda { top: 500px; font-size: 172px; font-weight: 900; }
    .s08-lista { top: 700px; font-size: 86px; font-weight: 700; color: #efeee5; }
    .s08-lunes { top: 810px; font-size: 150px; font-weight: 900; color: #5ce611; }
    .s08-tit { position: absolute; left: 150px; top: 1052px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.24em; color: #5ce611; text-transform: uppercase; }
    .s08-k { position: absolute; left: 150px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.04em; color: #efeee5; opacity: 0.7; text-transform: uppercase; }
    .s08-v { position: absolute; right: 150px; font-family: "Lexend", sans-serif; font-weight: 700; font-size: 40px; text-transform: uppercase; letter-spacing: -0.01em; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s08-cta" data-width="1080" data-height="1920" data-duration="5.21">
    <div id="s08-escena" class="s08-capa clip" data-start="0" data-duration="5.21" data-track-index="0">
      <div class="s08-escenario">
        <div class="s08-etiqueta">Guardalo</div>
        <svg class="s08-svg" viewBox="0 0 1080 1920">
      
      <rect class="s08-trazo s08-card" x="110" y="1020" width="860" height="420" rx="30" />
        <line class="s08-trazo s08-sep" x1="150" y1="1206" x2="930" y2="1206" style="opacity:0.35" />
        <line class="s08-trazo s08-sep" x1="150" y1="1306" x2="930" y2="1306" style="opacity:0.35" />
        <path class="s08-trazo v s08-marcador" d="M 886 1020 L 886 1096 L 908 1078 L 930 1096 L 930 1020" />
        </svg>
        

        <div class="s08-w s08-guarda">Guardalo</div>
        <div class="s08-w s08-lista">y hacé tu lista</div>
        <div class="s08-w s08-lunes">el lunes.</div>
        <div class="s08-tit">La regla de las 3 veces</div>
        <div class="s08-k s08-k0" style="top:1136px">1 vez</div>
        <div class="s08-v s08-v0" style="top:1122px; color:#efeee5">a mano</div>
        <div class="s08-k s08-k1" style="top:1236px">2 veces</div>
        <div class="s08-v s08-v1" style="top:1222px; color:#efeee5">anotá cómo</div>
        <div class="s08-k s08-k2" style="top:1336px">todos los días</div>
        <div class="s08-v s08-v2" style="top:1322px; color:#5ce611">que se haga solo</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s08-cta";
      const DUR = 5.21;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      // golpe: entra grande y se asienta EN la palabra
      const golpe = (el, t, k = 1.45) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: k }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, t - 0.05);
      };
      // sube: entra desde abajo
      const sube = (el, t, d = 110) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, y: d, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "back.out(1.8)", immediateRender: false }, t - 0.06);
      };
      // desliza: entra de costado
      const desliza = (el, t, d = 140) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, x: d, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out", immediateRender: false }, t - 0.06);
      };
      // sale: se va para arriba con blur
      const sale = (els, t, d = -120) => tl.to(els, { y: d, opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in", stagger: 0.04 }, t);
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };
      const popDiv = (el, t) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };

      tl.fromTo(q(".s08-etiqueta"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25 }, 0);
      golpe(q(".s08-guarda"), 0.03, 1.5);
      sube(q(".s08-lista"), 0.62, 70);
      golpe(q(".s08-lunes"), 1.42, 1.5);
      // la tarjeta para guardar: la regla entera
      dibujar(qa(".s08-card"), 1.0, 0.6);
      dibujar(qa(".s08-sep"), 1.4, 0.4);
      popDiv(q(".s08-tit"), 1.3);
      [0, 1, 2].forEach((i) => { desliza(q(".s08-k" + i), 1.7 + i * 0.25, -60); desliza(q(".s08-v" + i), 1.78 + i * 0.25, 60); });
      // el marcador de "guardado" se dibuja y se llena
      dibujar(qa(".s08-marcador"), 2.7, 0.4);
      tl.to(q(".s08-marcador"), { fill: "#5ce611", duration: 0.2 }, 3.1);
      tl.to(q(".s08-marcador"), { y: 6, duration: 0.15, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.1);
      tl.to(q(".s08-lunes"), { scale: 1.05, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.6);
      tl.to(q(".s08-v2"), { scale: 1.05, transformOrigin: "100% 50%", duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.3);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, DUR - 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
