      const ID = "s01-dos-distribuidoras";

          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L + 2, strokeDashoffset: L + 2 });

          tl.fromTo(el, { strokeDashoffset: (L + 2) * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      // para trazos punteados: se revelan con opacidad y un pequeño desplazamiento

      pop(q(".s01-tic-b"), VENDEN + 0.35, 0.6);

      tl.to(q(".s01-vb"), { opacity: 0.9, duration: 0.2 }, UNA);
      punch(q(".s01-b"), UNA);
      tl.to(qa(".s01-a, .s01-ha"), { opacity: 0.5, duration: 0.4 }, UNA + 0.1);
