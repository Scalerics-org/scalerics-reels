      const DUR = 4.29;

      const q = (s) => root.querySelector(s);

        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });

        });
      };
      // pop de un elemento SVG alrededor de (ox, oy)
      const pop = (el, t, ox, oy, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: hasta ?? 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);

      const golpe = (el, t, ox, oy, k) => {
