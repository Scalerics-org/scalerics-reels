<template>

  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-tarjeta"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-tarjeta"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-tarjeta"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-tarjeta"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

    [data-composition-id="s01-tarjeta"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.35); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-tarjeta"] .relleno-ac { fill: #5ce611; }
    [data-composition-id="s01-tarjeta"] .t-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 50px; fill: #efeee5; }
    [data-composition-id="s01-tarjeta"] .t-dir { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 30px; fill: #efeee5; }
    [data-composition-id="s01-tarjeta"] .t-btn { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s01-tarjeta"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s01-tarjeta"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01-tarjeta" data-width="1080" data-height="1920" data-duration="3.97">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="3.97" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- la página web: ventana de navegador -->
        <g class="s01-nav">
          <rect class="ln s01-nav-l" x="230" y="700" width="620" height="420" rx="24" />
          <line class="ln s01-nav-l" x1="230" y1="760" x2="850" y2="760" />
          <circle class="ln-fino s01-nav-l" cx="272" cy="730" r="9" />
          <circle class="ln-fino s01-nav-l" cx="302" cy="730" r="9" />
          <circle class="ln-fino s01-nav-l" cx="332" cy="730" r="9" />
          <rect class="ln-tenue s01-nav-l" x="372" y="716" width="440" height="28" rx="14" />
          <rect class="ln-tenue s01-nav-l" x="280" y="800" width="520" height="40" rx="8" />
          <rect class="ln-tenue s01-nav-l" x="280" y="870" width="300" height="200" rx="12" />
          <path class="ln-tenue s01-nav-l" d="M620 880 H800 M620 920 H780 M620 960 H800 M620 1000 H740" />
        </g>
        <!-- la tarjeta personal -->
        <g class="s01-tarjeta">
          <rect class="ln s01-tj-l" x="250" y="760" width="580" height="330" rx="18" />
          <g class="s01-r1"><text class="t-nombre" x="300" y="852">Tu Local</text></g>
          <line class="ln-tenue s01-tj-l" x1="300" y1="884" x2="780" y2="884" />
          <g class="s01-r2">
            <path class="ln-fino" d="M316 966 C308 956 298 946 298 934 A18 18 0 0 1 334 934 C334 946 324 956 316 966 Z" />
            <circle class="ln-fino" cx="316" cy="934" r="5" />
            <text class="t-dir" x="352" y="946">Av. Rivera 2450</text>
          </g>
          <g class="s01-r3">
            <rect class="ln-fino" x="300" y="996" width="250" height="60" rx="30" />

          </g>
        </g>
        <!-- el ojo que se cierra: nadie lee -->
        <g class="s01-ojo">
          <path class="ln s01-ojo-l s01-ojo-arriba" d="M450 655 Q540 590 630 655" />
          <path class="ln s01-ojo-l" d="M450 655 Q540 720 630 655" />
          <circle class="ln s01-ojo-l s01-iris" cx="540" cy="655" r="24" />
          <circle class="relleno-ac s01-pupila" cx="540" cy="655" r="10" />
          <path class="ln s01-parpado" d="M450 655 Q540 712 630 655" />
          <path class="ln s01-pest" d="M480 682 L468 702 M540 692 V716 M600 682 L612 702" />
        </g>

      <div class="etiqueta"><span class="s01-e1">Tarjeta personal</span><span class="s01-e2">Nadie la lee</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-tarjeta";
      const DUR = 3.97;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (t + i * 0.04 <= 0.001) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, hasta) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: hasta ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const etiqueta = (el, t, antes) => {
        if (antes) tl.to(antes, { opacity: 0, y: -10, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
      };

      // tiempos (palabras de la locución, relativos a la escena)
      const PAGINA = 0.3;
      const TARJETA = 1.3;
      const NADIE = 2.7;
      const LEE = 3.3;

      // la ventana del navegador arranca medio dibujada (el cuadro 0 no puede ser negro)
      dibujar(qa(".s01-nav-l"), 0, 0.6, 0.45);
      tl.fromTo(q(".s01-nav"), { scale: 0.94, svgOrigin: "540 910" }, { scale: 1, svgOrigin: "540 910", duration: 0.7, ease: "power3.out" }, 0);
      tl.to(q(".s01-nav"), { scale: 1.04, svgOrigin: "540 910", duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, PAGINA + 0.3);

      // "tarjeta": la ventana se aplasta y queda una tarjeta personal
      tl.to(q(".s01-nav"), { scaleY: 0.2, opacity: 0, svgOrigin: "540 920", duration: 0.3, ease: "power3.in" }, TARJETA - 0.15);
      gsap.set(qa(".s01-r1, .s01-r2, .s01-r3"), { opacity: 0 });
      dibujar(qa(".s01-tj-l"), TARJETA, 0.45);
      tl.fromTo(q(".s01-tarjeta"), { scale: 1.08, svgOrigin: "540 925" }, { scale: 1, svgOrigin: "540 925", duration: 0.45, ease: "back.out(1.8)" }, TARJETA);
      pop(q(".s01-r1"), TARJETA + 0.2);
      pop(q(".s01-r2"), TARJETA + 0.35);
      pop(q(".s01-r3"), TARJETA + 0.5);
      etiqueta(q(".s01-e1"), TARJETA);
      // la tarjeta se mece apenas
      tl.to(q(".s01-tarjeta"), { rotation: -2, svgOrigin: "540 925", duration: 0.8, ease: "sine.inOut" }, TARJETA + 0.5);

      // "nadie lee": se abre un ojo arriba, mira de costado y se cierra; la tarjeta se apaga
      gsap.set(qa(".s01-pupila, .s01-parpado, .s01-pest"), { opacity: 0 });
      dibujar(qa(".s01-ojo-l"), NADIE - 0.35, 0.35);
      tl.to(q(".s01-pupila"), { opacity: 1, duration: 0.15 }, NADIE - 0.05);
      tl.to(qa(".s01-pupila, .s01-iris"), { x: 40, duration: 0.3, ease: "power2.inOut" }, NADIE + 0.1);
      tl.to(qa(".s01-ojo-arriba, .s01-iris, .s01-pupila"), { opacity: 0, duration: 0.12 }, LEE - 0.05);
      tl.to(q(".s01-parpado"), { opacity: 1, duration: 0.08 }, LEE - 0.05);
      dibujar([q(".s01-pest")], LEE, 0.2);
      tl.to(q(".s01-tarjeta"), { opacity: 0.4, rotation: 0, duration: 0.35, ease: "power2.out", svgOrigin: "540 925" }, LEE);
      etiqueta(q(".s01-e2"), NADIE, q(".s01-e1"));

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
