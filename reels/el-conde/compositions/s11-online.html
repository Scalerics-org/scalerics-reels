    (function () {
      const ID = "s11-online";
      const DUR = 7.55;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });
      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });

      const slam = (el, t) => {
        gsap.set(el, { opacity: 0 });

      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s11-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength ? el.getTotalLength() : 1000;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const sale = (el, t) => tl.to(el, { opacity: 0, scale: 0.85, duration: 0.2, ease: "power2.in" }, t);
      // etiquetas: varios .etiqueta; muestra(el, t) apaga la que estaba y prende esta
      let etActual = null;
      const muestra = (el, t) => {
        if (etActual) tl.to(etActual, { opacity: 0, y: -10, duration: 0.12 }, t - 0.12);
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, t);
        etActual = el;
      };


      const NO = 0.61, VAMP = 1.13, COMPRAN = 2.0, EN = 3.22, TIENDAS = 4.78, SOLAS = 6.0, HORA = 6.52;

      tl.to(q(".s11-colmillos"), { y: 240, rotation: 90, svgOrigin: "323 1036", duration: 0.5, ease: "power2.in" }, VAMP);
      tl.to(q(".s11-colmillos"), { opacity: 0, duration: 0.1 }, VAMP + 0.5);
      muestra(q(".s11-e1"), NO);
      pop(q(".s11-zz"), COMPRAN, 0.4);
      muestra(q(".s11-e2"), COMPRAN);
      tl.to(q(".s11-zz"), { y: -10, duration: 0.3, yoyo: true, repeat: 2 }, COMPRAN + 0.3);
      // entra la tienda online a pantalla
      tl.to([q(".s11-cama"), q(".s11-zz")], { opacity: 0.15, duration: 0.3 }, EN);

      tl.fromTo(q(".s11-cel"), { opacity: 0, y: 400, rotation: -6 }, { opacity: 1, y: 0, rotation: 0, duration: 0.45, ease: "back.out(1.3)", immediateRender: false }, EN + 0.1);

      // vende sola: el botón se aprieta solo
