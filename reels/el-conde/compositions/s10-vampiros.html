    (function () {
      const ID = "s10-vampiros";
      const DUR = 4.96;

        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };
      const dibujar = (el, t, d = 0.6) => {
        const L = el.getTotalLength ? el.getTotalLength() : 1000;
        gsap.set(el, { strokeDasharray: L, strokeDashoffset: L, opacity: 0 });
        tl.set(el, { opacity: 1 }, t);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      };
      const sale = (el, t) => tl.to(el, { opacity: 0, scale: 0.85, duration: 0.2, ease: "power2.in" }, t);
      // etiquetas: varios .etiqueta; muestra(el, t) apaga la que estaba y prende esta
      let etActual = null;
      const muestra = (el, t) => {
        if (etActual) tl.to(etActual, { opacity: 0, y: -10, duration: 0.12 }, t - 0.12);
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, t);
        etActual = el;
      };


      const TODOS = 0.52, VAMP = 0.82, NO = 2.13, TRABAJAN = 3.11, SIETE = 3.89;
      tl.fromTo(q(".s10-conde"), { x: -80, opacity: 0.5 }, { x: 0, opacity: 1, duration: 0.3 }, 0);
      tl.to(q(".s10-cabeza"), { rotation: 8, svgOrigin: "0 -340", duration: 0.4, ease: "sine.inOut" }, 0.1);
      // burbuja de pensamiento con vampiros
      gsap.set(q(".s10-burbuja"), { opacity: 0 });
      tl.fromTo(q(".s10-burbuja"), { opacity: 0, scale: 0.6, transformOrigin: "20% 80%" }, { opacity: 1, scale: 1, transformOrigin: "20% 80%", duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, 0.05);
      qa(".s10-vamps > g").forEach((g, i) => {
        gsap.set(g, { opacity: 0 });
        tl.to(g, { opacity: 1, duration: 0.15 }, TODOS + i * 0.1);
      });
      tl.to(q(".s10-vamps"), { y: -8, duration: 0.2, yoyo: true, repeat: 5, ease: "sine.inOut" }, VAMP);
      // "No, amo": se borra la burbuja

      tl.to(q(".s10-cabeza"), { rotation: 0, svgOrigin: "0 -340", duration: 0.2 }, NO);
      // la gente trabaja hasta las siete
      gsap.set(q(".s10-oficina"), { opacity: 0 });
      tl.fromTo(q(".s10-oficina"), { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.5)", immediateRender: false }, NO + 0.35);
      pop(q(".s10-h1"), TRABAJAN, 0.7);
      pop(q(".s10-h2"), SIETE - 0.1, 0.7);
      gsap.set(q(".s10-sello"), { rotation: -6 });
      slam(q(".s10-sello"), SIETE + 0.45);
      golpe(SIETE + 0.5, 12);
      muestra(q(".s10-e1"), TRABAJAN);

      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);
      window.__timelines = window.__timelines || {};
