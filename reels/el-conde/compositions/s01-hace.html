  <script>
    (function () {
      const ID = "s01-hace";
      const DUR = 6.13;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => [...root.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      const pop = (el, t, from = 0.6) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, t);
      };
      const slam = (el, t) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const golpe = (t, f = 14) => {
        [[-f, f * 0.6], [f * 0.8, -f * 0.5], [-f * 0.4, f * 0.2], [0, 0]].forEach(([x, y], i) => tl.to(q(".s01-escenario"), { x, y, duration: 0.04, ease: "none" }, t + i * 0.045));
      };

      const CUATRO = 0.23, COMPRARTE = 2.03, CERRAS = 3.91, SIETE = 4.96;

      // cuadro 0: el afiche ya está a medio aparecer y la cámara se acerca
      tl.fromTo(q(".s01-escenario"), { scale: 1.07 }, { scale: 1, duration: DUR, ease: "none", transformOrigin: "40% 60%" }, 0);
      tl.fromTo(q(".s01-luna"), { scale: 0.85, opacity: 0.6 }, { scale: 1, opacity: 1, svgOrigin: "790 840", duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(q(".s01-castillo"), { y: 60, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(q(".s01-conde"), { y: 40, opacity: 0.5 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 0);
      qa(".s01-ventana").forEach((v, i) => tl.to(v, { opacity: 0.4, duration: 0.12, yoyo: true, repeat: 5, ease: "none" }, 0.5 + i * 0.4));
      // respira la capa
      tl.to(q(".s01-cuerpo"), { scaleX: 1.03, svgOrigin: "0 0", duration: 0.8, yoyo: true, repeat: 6, ease: "sine.inOut" }, 0.3);

      // "cuatrocientos años"
      tl.fromTo(q(".s01-titulo"), { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in" }, CUATRO - 0.08);
      golpe(CUATRO + 0.12, 12);
      tl.to(q(".s01-titulo"), { y: -6, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, CUATRO + 0.4);

      // "comprarte algo": saca la bolsita
      gsap.set(q(".s01-brazo"), { opacity: 0 });
      tl.fromTo(q(".s01-brazo"), { opacity: 0, rotation: 30 }, { opacity: 1, rotation: 0, svgOrigin: "50 -290", duration: 0.35, ease: "back.out(2)", immediateRender: false }, COMPRARTE - 0.1);
      tl.to(q(".s01-brazo"), { rotation: -6, svgOrigin: "50 -290", duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" }, COMPRARTE + 0.3);
      qa(".s01-monedas circle").forEach((c, i) => {
        gsap.set(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 0, y: 30 }, { opacity: 1, y: -30 - i * 12, duration: 0.3, ease: "power2.out", immediateRender: false }, COMPRARTE + 0.3 + i * 0.08);
        tl.to(c, { y: 60, opacity: 0, duration: 0.35, ease: "power2.in" }, COMPRARTE + 0.62 + i * 0.08);
      });

      // el cartel de la tienda: ABIERTO -> se da vuelta -> CERRADO
      pop(q(".s01-cartel"), 2.8, 0.7);
      gsap.set(q(".s01-cordel"), { opacity: 0 });
      tl.to(q(".s01-cordel"), { opacity: 1, duration: 0.2 }, 2.8);
      tl.to(q(".s01-cartel"), { rotation: 3, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.1);
      tl.to(q(".s01-cartel"), { rotationY: 90, duration: 0.14, ease: "power2.in" }, CERRAS - 0.05);
      tl.set(q(".s01-abierto"), { display: "none" }, CERRAS + 0.09);
      tl.set(q(".s01-cerrado"), { display: "inline" }, CERRAS + 0.09);
      tl.to(q(".s01-cartel"), { rotationY: 0, duration: 0.18, ease: "back.out(2)" }, CERRAS + 0.09);
      // el Conde se indigna
      tl.to(q(".s01-cejas"), { y: 6, duration: 0.15 }, CERRAS);
      tl.to(q(".s01-brazo"), { opacity: 0, rotation: 30, svgOrigin: "50 -290", duration: 0.2 }, CERRAS + 0.1);

      // "siete": sello 19:00
      gsap.set(q(".s01-sello"), { rotation: -8 });
      slam(q(".s01-sello"), SIETE);
      golpe(SIETE + 0.05, 18);
      tl.to(q(".s01-cabeza"), { rotation: -4, svgOrigin: "0 -340", duration: 0.08, yoyo: true, repeat: 5 }, SIETE + 0.05);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, DUR - 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
