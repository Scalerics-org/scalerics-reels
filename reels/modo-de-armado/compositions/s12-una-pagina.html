      const qa = (s) => Array.from(root.querySelectorAll(s));
      // el hombrecito del pictograma (igual que en s01): pies en (0,0), ~300 px, sin cara

      const hombre = (o) => { o = o || {}; return '<g class="hb">' +

        '<g class="hb-bi">' + miembro(o.brazoI || "M-40 -196 L-58 -142 L-62 -100") + '</g>' +
        '<g class="hb-bd">' + miembro(o.brazoD || "M40 -196 L58 -142 L62 -100") + '</g>' +
        '<path class="tinta hb-cuerpo" d="M-50 -208 Q0 -224 50 -208 L46 -98 Q0 -88 -46 -98 Z" />' +
        '<circle class="tinta hb-cabeza" cx="0" cy="-258" r="36" />' + (o.extra || "") + '</g>'; };
      qa("[data-hombre]").forEach((g) => { g.innerHTML = hombre(JSON.parse(g.dataset.hombre || "{}")); });
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1) });
          if ((desde ?? 1) >= 1) { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, desde) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: desde ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };
      const golpe = (el, t, escala) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: escala ?? 2.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (el, t, d) => tl.to(el, { opacity: 0, duration: d ?? 0.2 }, t);
      const temblor = (t, f) => [[-12, 7], [9, -5], [-4, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s12-escenario"), { x: x * (f ?? 1), y: y * (f ?? 1), duration: 0.04, ease: "none" }, t + i * 0.045));
      const etiquetas = (lista) => lista.forEach(([sel, a, b]) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, a);
        if (b != null) tl.to(q(sel), { opacity: 0, y: -14, duration: 0.2 }, b);
      });

      const NUEVO = 0.52, UNA = 1.27, PAGINA = 1.49, PASO = 2.23, ANDA = 3.05;
      // el manual de 47 pasos se desarma: las hojas vuelan
      qa(".s12-hoja").forEach((h, i) => {
        tl.fromTo(h, { opacity: 1, x: 0, y: 0, rotation: 0 }, { opacity: 0, x: (i % 2 ? 1 : -1) * (400 + i * 40), y: -300 - i * 40, rotation: (i % 2 ? 40 : -40), transformOrigin: "50% 50%", duration: 0.5, ease: "power2.in" }, 0.05 + i * 0.04);
      });
      gsap.set(q(".s12-hojita"), { opacity: 0 });
      tl.fromTo(q(".s12-hojita"), { opacity: 0, scale: 0.7, rotation: -6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, NUEVO - 0.15);
      golpe(q(".s12-sello"), UNA + 0.1, 2.2);
      tl.to(q(".s12-sello"), { rotation: 8, svgOrigin: "765 675", duration: 0.2 }, PAGINA);
      golpe(q(".s12-uno"), PASO + 0.1, 2);
      // "andá a dormir": cama, hombrecito acostado, Z Z Z
      pop(q(".s12-cama"), ANDA - 0.4);
      gsap.set(q(".s12-manta"), { opacity: 0 });
      tl.fromTo(q(".s12-manta"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, ANDA + 0.05);
      gsap.set(q(".s12-h .hb"), { opacity: 0 });
      tl.fromTo(q(".s12-h .hb"), { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, ANDA - 0.2);
      tl.to(q(".s12-cama"), { y: 6, duration: 0.08, yoyo: true, repeat: 1 }, ANDA + 0.1);
      qa(".s12-z").forEach((z, i) => {
        gsap.set(z, { opacity: 0 });
        tl.fromTo(z, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, ANDA + 0.2 + i * 0.25);
        tl.to(z, { y: -10, duration: 0.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, ANDA + 0.5 + i * 0.25);
      });
      dibujar([q(".s12-luna")], ANDA, 0.4);
      etiquetas([[".s12-etiqueta", PASO]]);
