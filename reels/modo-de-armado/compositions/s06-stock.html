        '<g class="hb-bi">' + miembro(o.brazoI || "M-40 -196 L-58 -142 L-62 -100") + '</g>' +

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();

      const golpe = (el, t, escala) => {

      const temblor = (t, f) => [[-12, 7], [9, -5], [-4, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s06-escenario"), { x: x * (f ?? 1), y: y * (f ?? 1), duration: 0.04, ease: "none" }, t + i * 0.045));

      const NUEVE = 0.95, VENDISTE = 1.29, ACTUALIZA = 2.41, TIENDA = 3.34, MANO = 4.21;

      gsap.set(q(".s06-8"), { opacity: 0 });

      // "vendiste en el local": la caja se va y aparece el -1

      golpe(q(".s06-menos"), VENDISTE + 0.3, 1.8);
