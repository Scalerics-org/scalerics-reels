    (function () {
      const ID = "s10-aviso-stock";
      const DUR = 5.19;

      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      // el hombrecito del pictograma (igual que en s01): pies en (0,0), ~300 px, sin cara

      const hombre = (o) => { o = o || {}; return '<g class="hb">' +
        '<g class="hb-piernas">' + miembro(o.piernaI || "M-22 -104 L-27 -10 L-46 -10") + miembro(o.piernaD || "M22 -104 L27 -10 L46 -10") + '</g>' +
        '<g class="hb-bi">' + miembro(o.brazoI || "M-40 -196 L-58 -142 L-62 -100") + '</g>' +
        '<g class="hb-bd">' + miembro(o.brazoD || "M40 -196 L58 -142 L62 -100") + '</g>' +
        '<path class="tinta hb-cuerpo" d="M-50 -208 Q0 -224 50 -208 L46 -98 Q0 -88 -46 -98 Z" />' +
        '<circle class="tinta hb-cabeza" cx="0" cy="-258" r="36" />' + (o.extra || "") + '</g>'; };
      qa("[data-hombre]").forEach((g) => { g.innerHTML = hombre(JSON.parse(g.dataset.hombre || "{}")); });
      const tl = gsap.timeline({ paused: true });
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L * (desde ?? 1) });
          if ((desde ?? 1) >= 1) { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, desde) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: desde ?? 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, t);
      };
      const golpe = (el, t, escala) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: escala ?? 2.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in", immediateRender: false }, t - 0.1);
      };
      const fuera = (el, t, d) => tl.to(el, { opacity: 0, duration: d ?? 0.2 }, t);
      const temblor = (t, f) => [[-12, 7], [9, -5], [-4, 3], [0, 0]].forEach(([x, y], i) => tl.to(q(".s10-escenario"), { x: x * (f ?? 1), y: y * (f ?? 1), duration: 0.04, ease: "none" }, t + i * 0.045));
      const etiquetas = (lista) => lista.forEach(([sel, a, b]) => {
        gsap.set(q(sel), { opacity: 0 });
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, a);
        if (b != null) tl.to(q(sel), { opacity: 0, y: -14, duration: 0.2 }, b);
      });

      const AVISO = 0.27, LISTO = 0.97, SALE = 1.54, SOLO = 1.77, STOCK = 2.43, TIENDA = 3.01, ACTUALIZA = 3.45, VENDES = 3.98, LOCAL = 4.69;

      tl.fromTo(q(".s10-r2"), { opacity: 0.3, scale: 0.95, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 0.1);
      pop(q(".s10-cel"), 0.05);
      qa(".s10-cli").forEach((c, i) => { gsap.set(c, { opacity: 0 }); tl.fromTo(c, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, 0.15 + i * 0.06); });
      tl.to(q(".s10-cel"), { x: 4, duration: 0.05, yoyo: true, repeat: 5 }, AVISO);
      // "listo... sale solo": todos los globitos salen a la vez
      qa(".s10-glo").forEach((g, i) => {
        gsap.set(g, { opacity: 0 });
        tl.fromTo(g, { opacity: 0, x: 190 - [560, 670, 780, 890][i], y: 60, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, LISTO + i * 0.04);
        pop(q(".s10-ok" + i), SALE - 0.05 + i * 0.05, 0.4);
        tl.to(q(".s10-cli" + i), { y: -14, duration: 0.12, yoyo: true, repeat: 1 }, SALE + i * 0.05);
      });
      golpe(q(".s10-v1"), SOLO, 2);
      // abajo
      pop(q(".s10-local"), STOCK - 0.4);
      pop(q(".s10-caja"), STOCK - 0.3);
      pop(q(".s10-tienda"), STOCK - 0.1);
      gsap.set(q(".s10-7"), { opacity: 0 });
      gsap.set(q(".s10-8"), { opacity: 0 });
      tl.to(q(".s10-8"), { opacity: 1, duration: 0.15 }, STOCK);
      tl.fromTo(q(".s10-tienda"), { scale: 1 }, { scale: 1.04, svgOrigin: "795 1145", duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, TIENDA);
      gsap.set(q(".s10-cable"), { opacity: 0 });
      tl.to(q(".s10-cable"), { opacity: 1, duration: 0.2 }, ACTUALIZA - 0.2);
      tl.fromTo(q(".s10-cable"), { strokeDashoffset: 0 }, { strokeDashoffset: -150, duration: DUR - ACTUALIZA, ease: "none", immediateRender: false }, ACTUALIZA - 0.2);

      tl.to(q(".s10-caja"), { x: -160, y: -30, rotation: -20, opacity: 0, transformOrigin: "50% 50%", duration: 0.4, ease: "power2.in" }, VENDES - 0.1);
