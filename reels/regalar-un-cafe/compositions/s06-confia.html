  <script>
    (function () {
      const ID = "s06-confia";
      const DUR = 5.95;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };
      const pop = (el, t, a) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: a ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // cambia la etiqueta mono: n = 1, 2, 3...
      let etiq = 0;
      const etiqueta = (n, t) => {
        if (etiq) tl.to(q(".s06-e" + etiq), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s06-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etiq = n;
      };
      // badge de "no": círculo verde con X, entra con pop
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, t);
      };

      const COMPRA = 0.45, CONFIA = 1.35, CONVENCERLO = 2.85, SOLO = 4.03, MOTIVO = 4.55, VOLVER = 5.25;
      dibujar([q(".s06-suelo")], 0, 0.6, 0.5);
      pop(q(".s06-cli"), 0.0);
      tl.fromTo(q(".s06-cli"), { x: -40 }, { x: 0, duration: 0.6, ease: "power2.out" }, 0);
      // "compra": aparece la bolsa
      pop(q(".s06-bolsa"), COMPRA);
      // "confía": tilde verde arriba de la cabeza
      etiqueta(1, CONFIA);
      pop(q(".s06-ok"), CONFIA);
      dibujar([q(".s06-tilde")], CONFIA + 0.1, 0.3);
      // "convencerlo": el megáfono aparece y se tacha
      etiqueta(2, CONVENCERLO);
      pop(q(".s06-mega"), CONVENCERLO - 0.35);
      tl.fromTo(q(".s06-mega-ondas"), { opacity: 0 }, { opacity: 1, duration: 0.12, yoyo: true, repeat: 3 }, CONVENCERLO - 0.1);
      dibujar([q(".s06-tacha")], CONVENCERLO + 0.25, 0.35);
      tl.to(qa(".s06-mega, .s06-tacha"), { opacity: 0, duration: 0.3 }, SOLO);
      tl.to(q(".s06-ok"), { opacity: 0, duration: 0.3 }, SOLO);
      // "motivo para volver": una flecha que lo rodea y la taza al lado
      etiqueta(3, MOTIVO);
      dibujar([q(".s06-arco")], SOLO + 0.15, 0.8);
      tl.fromTo(q(".s06-punta"), { opacity: 0 }, { opacity: 1, duration: 0.12 }, SOLO + 0.9);
      pop(q(".s06-taza"), MOTIVO);
      dibujar(qa(".s06-taza-vapor"), MOTIVO + 0.2, 0.4);
      tl.to(qa(".s06-arco, .s06-punta"), { rotation: 25, svgOrigin: "600 1000", duration: 0.5, ease: "back.out(2)" }, VOLVER);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
