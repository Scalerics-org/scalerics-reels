  <script>
    (function () {
      const ID = "s09-puntos";
      const DUR = 5.87;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };
      const pop = (el, t, a) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: a ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // cambia la etiqueta mono: n = 1, 2, 3...
      let etiq = 0;
      const etiqueta = (n, t) => {
        if (etiq) tl.to(q(".s09-e" + etiq), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s09-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etiq = n;
      };
      // badge de "no": círculo verde con X, entra con pop
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, t);
      };

      const SCALERICS = 0.4, PUNTOS = 1.11, SUMA = 2.3, CADA = 2.9, COMPRA = 3.2, TARJETA = 4.4, CELULAR = 4.9;
      dibujar(qa(".s09-dib"), 0, 0.6, 0.5);
      tl.fromTo(q(".s09-head"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, SCALERICS);
      etiqueta(1, PUNTOS);
      tl.to(q(".s09-head tspan"), { opacity: 0.5, duration: 0.12, yoyo: true, repeat: 1 }, PUNTOS);
      // la tarjeta de sellos
      dibujar([q(".s09-tarjeta")], PUNTOS - 0.1, 0.5);
      qa(".s09-sello").forEach((s, i) => pop(s, PUNTOS + 0.2 + i * 0.05));
      const llenos = qa(".s09-lleno"), mas = qa(".s09-mas"), cuentas = qa(".s09-c");
      gsap.set(llenos, { opacity: 0 });
      gsap.set(mas, { opacity: 0 });
      gsap.set(cuentas, { opacity: 0 });
      [0, 1, 2].forEach((i) => tl.fromTo(llenos[i], { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.5)" }, PUNTOS + 0.6 + i * 0.08));
      tl.fromTo(cuentas[0], { opacity: 0 }, { opacity: 1, duration: 0.25 }, PUNTOS + 0.8);
      // "suma con cada compra": se llenan de a uno con +1
      etiqueta(2, SUMA);
      [SUMA, CADA, COMPRA].forEach((t, k) => {
        const i = 3 + k;
        tl.fromTo(llenos[i], { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.5)" }, t);
        tl.fromTo(mas[i], { opacity: 0, y: 6 }, { opacity: 1, y: -14, duration: 0.3, ease: "power2.out" }, t);
        tl.to(mas[i], { opacity: 0, y: -26, duration: 0.25 }, t + 0.35);
        tl.to(cuentas[k], { opacity: 0, duration: 0.1 }, t);
        tl.fromTo(cuentas[k + 1], { opacity: 0, scale: 1.15, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, t + 0.02);
      });
      // "tarjeta en el celular"
      etiqueta(3, TARJETA);
      tl.fromTo(q(".s09-tu"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, TARJETA);
      tl.to(q(".s09-cel"), { scale: 1.05, svgOrigin: "540 920", duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, CELULAR);

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
