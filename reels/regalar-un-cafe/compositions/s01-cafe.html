<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-cafe"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-cafe"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-cafe"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-cafe"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-cafe"] .plata { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 26px; fill: #5ce611; }
    [data-composition-id="s01-cafe"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s01-cafe"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01-cafe" data-width="1080" data-height="1920" data-duration="4.53">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="4.53" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <!-- poste y base de la balanza -->
        <path class="ln s01-dib-b" d="M540 712 V1150" />
        <path class="ln s01-dib-b" d="M430 1150 H650" />
        <path class="ln s01-dib-b" d="M510 1150 Q540 1110 570 1150" />
        <path class="ln s01-dib-b" d="M520 712 L540 682 L560 712" />
        <!-- brazo (gira) -->
        <g class="s01-brazo">
          <path class="ln s01-dib-b" d="M300 720 H780" />
          <circle class="ln-ac s01-eje" cx="540" cy="720" r="10" />
        </g>
        <!-- plato izquierdo: la taza -->
        <g class="s01-plato-a">
          <path class="ln s01-dib-b" d="M0 0 L-100 230 M0 0 L100 230" />
          <path class="ln s01-dib-b" d="M-120 230 H120 Q100 268 0 268 Q-100 268 -120 230 Z" />
          <g class="s01-taza">
            <path class="ln s01-dib-t" d="M-70 228 H70" />
            <path class="ln s01-dib-t" d="M-46 150 H46 L39 214 Q37 222 29 222 H-29 Q-37 222 -39 214 Z" />
            <path class="ln s01-dib-t" d="M45 165 Q78 163 75 186 Q72 206 40 203" />
            <path class="ln-ac s01-vapor" d="M-14 132 q-12 -16 0 -32 q12 -16 0 -32" />
            <path class="ln-ac s01-vapor" d="M16 132 q-12 -16 0 -32 q12 -16 0 -32" />
          </g>
          <!-- etiqueta de precio chiquita: barato -->
          <g class="s01-precio">
            <path class="ln" d="M-46 170 L-84 150" />
            <path class="ln" d="M-84 132 H-150 L-168 152 L-150 172 H-84 Z" />
            <text class="plata" x="-122" y="161" text-anchor="middle">$</text>
          </g>
        </g>
        <!-- plato derecho: lo caro -->
        <g class="s01-plato-b">
          <path class="ln s01-dib-b" d="M0 0 L-100 230 M0 0 L100 230" />
          <path class="ln s01-dib-b" d="M-120 230 H120 Q100 268 0 268 Q-100 268 -120 230 Z" />
          <g class="s01-pesado">
            <g class="s01-moneda"><circle class="ln" cx="-48" cy="206" r="22" /><text class="plata" x="-48" y="215" text-anchor="middle">$</text></g>
            <g class="s01-moneda"><circle class="ln" cx="0" cy="206" r="22" /><text class="plata" x="0" y="215" text-anchor="middle">$</text></g>
            <g class="s01-moneda"><circle class="ln" cx="48" cy="206" r="22" /><text class="plata" x="48" y="215" text-anchor="middle">$</text></g>
            <g class="s01-mega">
              <path class="ln" d="M-44 148 L36 112 V184 L-44 160 Z" />
              <path class="ln" d="M-64 146 H-44 V162 H-64 Z" />
              <path class="ln-ac" d="M56 126 L76 116 M60 148 H84 M56 170 L76 180" />
            </g>
          </g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s01-e1">Un café</span><span class="s01-e2">Un cliente nuevo</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-cafe";
      const DUR = 4.53;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const CAFE = 0.8;
      const BARATO = 2.0;
      const CONSEGUIR = 2.7;
      const CLIENTE = 3.3;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && t === 0) {
            gsap.set(el, { opacity: 1 }); // arranca ya visible: el cuadro 0 no puede ser negro
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };
      const pop = (el, t, a) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: a ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };

      // la balanza: brazo con pivote en 540,720 y platos colgados de las puntas (radio 240)
      const PIV = "540 720";
      const R = 240;
      const inclinar = (grados, t, dur, ease) => {
        const dy = R * Math.sin((grados * Math.PI) / 180);
        tl.to(q(".s01-brazo"), { rotation: grados, svgOrigin: PIV, duration: dur, ease }, t);
        tl.to(q(".s01-plato-a"), { y: 720 - dy, duration: dur, ease }, t);
        tl.to(q(".s01-plato-b"), { y: 720 + dy, duration: dur, ease }, t);
      };
      gsap.set(q(".s01-plato-a"), { x: 300, y: 720 });
      gsap.set(q(".s01-plato-b"), { x: 780, y: 720 });
      gsap.set(q(".s01-brazo"), { rotation: 0, svgOrigin: PIV });

      // arranca a medio dibujar (el cuadro 0 no puede ser negro)
      dibujar(qa(".s01-dib-b"), 0, 0.6, 0.45);
      dibujar(qa(".s01-dib-t"), 0, 0.6, 0.6);
      pop(q(".s01-eje"), 0.2);
      // con la taza sola, el plato izquierdo baja un poco
      inclinar(-5, 0.5, 0.6, "power2.out");

      // "café": vapor y etiqueta
      dibujar(qa(".s01-vapor"), CAFE - 0.05, 0.5);
      tl.to(qa(".s01-vapor"), { y: -8, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3 }, CAFE + 0.5);
      tl.fromTo(q(".s01-e1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CAFE);

      // "barato": cuelga la etiquetita de precio
      tl.fromTo(q(".s01-precio"), { opacity: 0, rotation: -25, svgOrigin: "-46 170" }, { opacity: 1, rotation: 0, svgOrigin: "-46 170", duration: 0.5, ease: "back.out(2)" }, BARATO);
      tl.to(q(".s01-precio"), { rotation: 6, svgOrigin: "-46 170", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1 }, BARATO + 0.5);

      // "conseguir un cliente nuevo": cae lo caro y la balanza se va para la derecha
      tl.to(q(".s01-e1"), { opacity: 0, duration: 0.2 }, CONSEGUIR - 0.1);
      tl.fromTo(q(".s01-e2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CONSEGUIR);
      qa(".s01-moneda").forEach((m, i) => {
        tl.fromTo(m, { opacity: 0, y: -160 }, { opacity: 1, y: 0, duration: 0.35, ease: "bounce.out" }, CONSEGUIR + i * 0.14);
      });
      tl.fromTo(q(".s01-mega"), { opacity: 0, y: -180, rotation: -20, svgOrigin: "0 150" }, { opacity: 1, y: 0, rotation: 0, svgOrigin: "0 150", duration: 0.4, ease: "power3.in" }, CLIENTE - 0.2);
      inclinar(13, CLIENTE + 0.2, 0.55, "back.out(2.2)");
      tl.fromTo(q(".s01-mega .ln-ac"), { opacity: 0 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 3 }, CLIENTE + 0.4);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
