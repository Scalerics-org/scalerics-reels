  <style>

    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s10-aviso"] .s10-capa { position: absolute; inset: 0; }
    [data-composition-id="s10-aviso"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s10-aviso"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-aviso"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-aviso"] .ln-badge { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s10-aviso"] .relleno { fill: #5ce611; }
    [data-composition-id="s10-aviso"] .plata { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 26px; fill: #5ce611; }

    [data-composition-id="s10-aviso"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.14em; fill: #efeee5; }
    [data-composition-id="s10-aviso"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s10-aviso"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
    [data-composition-id="s10-aviso"] .s10-noti { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #efeee5; }

  </style>
  <div id="root" data-composition-id="s10-aviso" data-width="1080" data-height="1920" data-duration="5.05">
    <div id="s10-escena" class="s10-capa clip" data-start="0" data-duration="5.05" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s10-parte1">
        <g class="s10-tarjeta">
        <rect class="ln s10-dib" x="250" y="790" width="284" height="200" rx="22" />
        <circle class="relleno" cx="300" cy="850" r="14" />
        <circle class="relleno" cx="346" cy="850" r="14" />
        <circle class="relleno" cx="392" cy="850" r="14" />
        <circle class="relleno" cx="438" cy="850" r="14" />
        <circle class="relleno" cx="300" cy="910" r="14" />
        <circle class="relleno" cx="346" cy="910" r="14" />
        <circle class="relleno" cx="392" cy="910" r="14" />
        <circle class="relleno" cx="438" cy="910" r="14" />
        <text class="mono" x="392" y="960" text-anchor="middle" style="fill:#5ce611">LLENA</text>
        </g>
        <g class="s10-tazawrap"><g transform="translate(760 840) scale(1.3)"><g class="s10-taza"><path class="ln" d="M-70 78 H70" /><path class="ln" d="M-46 0 H46 L39 64 Q37 72 29 72 H-29 Q-37 72 -39 64 Z" /><path class="ln" d="M45 15 Q78 13 75 36 Q72 56 40 53" /><path class="ln-ac s10-taza-vapor" d="M-14 -18 q-12 -16 0 -32 q12 -16 0 -32" /><path class="ln-ac s10-taza-vapor" d="M16 -18 q-12 -16 0 -32 q12 -16 0 -32" /></g></g></g>
        <g class="s10-precio">
        <path class="ln" d="M700 900 L662 930" />
        <path class="ln" d="M662 912 H596 L578 932 L596 952 H662 Z" />

        <path class="ln s10-suelo" d="M90 1130 H520" />
        <g class="s10-fig" ><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g>
        <g class="s10-cel">
        <rect class="ln" x="600" y="650" width="300" height="540" rx="46" />
        <path class="ln" d="M715 680 H785" />
        <g class="s10-burbuja">
        <rect class="ln-ac" x="622" y="770" width="256" height="150" rx="20" />

        <text class="s10-noti" x="646" y="856">Tenés un café</text>

        </g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s10-e1">Premios que cuestan poco</span><span class="s10-e2">Si deja de venir</span><span class="s10-e3">Le llega un aviso</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s10-aviso";
      const DUR = 5.05;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };
      const pop = (el, t, a) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: a ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // cambia la etiqueta mono: n = 1, 2, 3...
      let etiq = 0;
      const etiqueta = (n, t) => {
        if (etiq) tl.to(q(".s10-e" + etiq), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s10-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etiq = n;
      };
      // badge de "no": círculo verde con X, entra con pop
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, t);
      };

      const PREMIOS = 0.23, CUESTAN = 1.53, POCO = 2.03, Y = 2.71, DEJA = 3.03, VENIR = 3.43, LLEGA = 4.03, AVISO = 4.43;
      // la tarjeta llena arranca en pantalla
      dibujar(qa(".s10-dib"), 0, 0.5, 0.5);
      tl.fromTo(qa(".s10-tarjeta .relleno, .s10-tarjeta text"), { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.02 }, 0);
      // "premios": sale la taza de la tarjeta
      etiqueta(1, PREMIOS);
      tl.fromTo(q(".s10-tazawrap"), { opacity: 0, x: -360 }, { opacity: 1, x: 0, duration: 0.55, ease: "back.out(1.4)" }, PREMIOS);
      dibujar(qa(".s10-taza-vapor"), PREMIOS + 0.5, 0.4);
      tl.to(q(".s10-tarjeta"), { opacity: 0.4, duration: 0.3 }, PREMIOS + 0.3);
      // "cuestan poco": etiquetita chica
      tl.fromTo(q(".s10-precio"), { opacity: 0, rotation: 25, svgOrigin: "700 900" }, { opacity: 1, rotation: 0, svgOrigin: "700 900", duration: 0.45, ease: "back.out(2)" }, CUESTAN);
      tl.to(q(".s10-precio"), { scale: 0.8, svgOrigin: "700 900", duration: 0.25, ease: "power2.inOut" }, POCO);
      tl.to(q(".s10-parte1"), { opacity: 0, duration: 0.3 }, Y - 0.15);
      // "si deja de venir": el cliente se va y se apaga
      etiqueta(2, DEJA);
      dibujar([q(".s10-suelo")], Y, 0.4);
      const f = q(".s10-fig");
      tl.fromTo(f, { x: 400, y: 1130, opacity: 0 }, { opacity: 1, duration: 0.2 }, Y);
      tl.to(f, { x: 140, duration: 1.1, ease: "none" }, DEJA);
      tl.to(f, { opacity: 0.2, duration: 0.8 }, VENIR - 0.2);
      tl.fromTo(f.querySelector("path"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, DEJA);
      // el celular y el aviso
      pop(q(".s10-cel"), Y + 0.1);
      gsap.set(q(".s10-burbuja"), { opacity: 0 });
      etiqueta(3, LLEGA);
      tl.to(q(".s10-cel"), { rotation: 3, svgOrigin: "750 920", duration: 0.06, yoyo: true, repeat: 5 }, LLEGA);
      tl.fromTo(q(".s10-burbuja"), { opacity: 0, y: -30, scale: 0.9, svgOrigin: "750 845" }, { opacity: 1, y: 0, scale: 1, svgOrigin: "750 845", duration: 0.4, ease: "back.out(1.8)" }, LLEGA + 0.1);
      tl.to(q(".s10-burbuja rect"), { opacity: 0.4, duration: 0.12, yoyo: true, repeat: 1 }, AVISO);

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
