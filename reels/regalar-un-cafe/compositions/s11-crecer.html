  <script>
    (function () {
      const ID = "s11-crecer";
      const DUR = 7.49;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };
      const pop = (el, t, a) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: a ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // cambia la etiqueta mono: n = 1, 2, 3...
      let etiq = 0;
      const etiqueta = (n, t) => {
        if (etiq) tl.to(q(".s11-e" + etiq), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s11-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etiq = n;
      };
      // badge de "no": círculo verde con X, entra con pop
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, t);
      };

      const QUIENES = 0.48, CADA = 1.48, CUANTO = 1.78, VIENEN = 2.28, PARA = 3.16, CRECER = 3.28, MAS = 4.48, EMPEZA = 5.08, LOS = 6.18, TENES = 6.48;
      dibujar(qa(".s11-dib"), 0, 0.6, 0.5);
      tl.fromTo(q(".s11-tit"), { opacity: 0 }, { opacity: 0.6, duration: 0.3 }, 0.2);
      // "quiénes son": aparecen los clientes
      etiqueta(1, QUIENES);
      qa(".s11-fila").forEach((f, i) => tl.fromTo(f, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, QUIENES - 0.1 + i * 0.15));
      // "cada cuánto vienen"
      etiqueta(2, CADA);
      qa(".s11-fr").forEach((f, i) => tl.fromTo(f, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, [CADA, CUANTO, VIENEN][i]));
      tl.to(qa(".s11-fr")[2], { scale: 1.08, transformOrigin: "100% 50%", duration: 0.15, yoyo: true, repeat: 1 }, VIENEN + 0.35);
      tl.to(q(".s11-panel"), { opacity: 0, scale: 0.94, svgOrigin: "540 875", duration: 0.3, ease: "power2.in" }, PARA - 0.2);
      // "crecer": la multitud de afuera y los tuyos, todos apagados
      dibujar([q(".s11-suelo")], PARA, 0.5);
      qa(".s11-gente").forEach((g, i) => tl.fromTo(g, { opacity: 0, y: 14 }, { opacity: 0.45, y: 0, duration: 0.3, ease: "power3.out" }, CRECER + i * 0.08));
      qa(".s11-tuyo").forEach((g, i) => tl.fromTo(g, { opacity: 0, y: 14 }, { opacity: 0.45, y: 0, duration: 0.3, ease: "power3.out" }, CRECER + 0.3 + i * 0.08));
      // "más gente": X sobre la multitud
      etiqueta(3, MAS);
      badge(q(".s11-x"), MAS + 0.05);
      tl.to(qa(".s11-gente"), { opacity: 0.18, duration: 0.4 }, EMPEZA);
      tl.to(q(".s11-x"), { opacity: 0.4, duration: 0.4 }, EMPEZA + 0.3);
      // "los que ya tenés": se prenden los tuyos y sube la flecha
      etiqueta(4, LOS);
      qa(".s11-tuyo").forEach((g, i) => {
        tl.to(g, { opacity: 1, duration: 0.2 }, EMPEZA + 0.4 + i * 0.25);
        tl.fromTo(g, { y: 0 }, { y: -12, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, EMPEZA + 0.4 + i * 0.25);
      });
      dibujar([q(".s11-flecha")], LOS, 0.45);
      tl.fromTo(q(".s11-punta"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, LOS + 0.3);
      tl.to(qa(".s11-flecha, .s11-punta"), { y: -12, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, TENES + 0.3);

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
