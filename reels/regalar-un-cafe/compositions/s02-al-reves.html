  <script>
    (function () {
      const ID = "s02-al-reves";
      const DUR = 7.82;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };
      const pop = (el, t, a) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: a ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // cambia la etiqueta mono: n = 1, 2, 3...
      let etiq = 0;
      const etiqueta = (n, t) => {
        if (etiq) tl.to(q(".s02-e" + etiq), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s02-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etiq = n;
      };
      // badge de "no": círculo verde con X, entra con pop
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, t);
      };

      const COMERCIOS = 0.97, REVES = 1.97, VOLANTES = 2.97, PUBLICIDAD = 3.67, SORTEOS = 4.87, ENTRE = 5.87, CONOCEN = 6.97;
      // arranca a medio dibujar
      dibujar(qa(".s02-dib"), 0, 0.6, 0.5);
      tl.fromTo(q(".s02-dib-txt"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3);
      tl.fromTo(q(".s02-suelo"), { scaleX: 0.5, svgOrigin: "540 1150" }, { scaleX: 1, svgOrigin: "540 1150", duration: 0.7, ease: "power3.out" }, 0);
      etiqueta(1, 0.4);
      // "comercios": otros locales detrás, apagados
      qa(".s02-otro-g").forEach((g, i) => pop(g, COMERCIOS + i * 0.15, 0.4));
      // "al revés": la flecha sale del local hacia afuera
      etiqueta(2, REVES);
      dibujar([q(".s02-flecha")], REVES - 0.1, 0.55);
      tl.fromTo(q(".s02-punta"), { opacity: 0 }, { opacity: 1, duration: 0.12 }, REVES + 0.4);
      tl.to(qa(".s02-otros, .s02-flecha, .s02-punta"), { opacity: 0, duration: 0.3 }, VOLANTES - 0.35);
      // lo que pagan: cada cosa aparece en su palabra y le sale una moneda del local
      [[".s02-volantes", ".s02-m1", VOLANTES, 690], [".s02-mega", ".s02-m2", PUBLICIDAD, 840], [".s02-regalo", ".s02-m3", SORTEOS, 990]].forEach(([el, m, t, y]) => {
        pop(q(el), t);
        tl.fromTo(q(m), { opacity: 0, x: 250 - 880, y: 1080 - y }, { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power2.out" }, t + 0.05);
        tl.to(q(m), { scale: 1.25, transformOrigin: "50% 50%", duration: 0.12, yoyo: true, repeat: 1 }, t + 0.55);
      });
      tl.to(q(".s02-volantes"), { rotation: 6, svgOrigin: "0 0", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, VOLANTES + 0.35);
      tl.fromTo(q(".s02-mega-ondas"), { opacity: 0 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 5 }, PUBLICIDAD + 0.35);
      tl.to(q(".s02-regalo"), { y: -10, duration: 0.15, yoyo: true, repeat: 3 }, SORTEOS + 0.4);
      // "entre alguien que no conocen": una figurita con "?" entra al local
      etiqueta(3, ENTRE);
      tl.to(qa(".s02-volantes, .s02-mega, .s02-regalo"), { opacity: 0.35, duration: 0.3 }, ENTRE - 0.3);
      const p = q(".s02-nuevo"), preg = q(".s02-preg");
      tl.fromTo(p, { x: 1000, y: 1150, opacity: 0 }, { x: 920, opacity: 1, duration: 0.25, ease: "none" }, ENTRE - 0.3);
      tl.to(p, { x: 300, duration: 1.4, ease: "none" }, ENTRE - 0.05);
      tl.fromTo(p.querySelector("path"), { rotation: -4, svgOrigin: "0 -40" }, { rotation: 4, svgOrigin: "0 -40", duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 7 }, ENTRE - 0.3);
      tl.fromTo(preg, { x: 1000, y: 1000, opacity: 0 }, { x: 920, opacity: 1, duration: 0.25, ease: "none" }, ENTRE - 0.3);
      tl.to(preg, { x: 300, duration: 1.4, ease: "none" }, ENTRE - 0.05);
      tl.to(preg, { scale: 1.4, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 1 }, CONOCEN);
      tl.to([p, preg], { opacity: 0, duration: 0.25 }, ENTRE + 1.4);

      // salida
      tl.to(q("#s02-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
