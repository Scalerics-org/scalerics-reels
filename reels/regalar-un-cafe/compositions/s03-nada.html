<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s03-nada"] .s03-capa { position: absolute; inset: 0; }
    [data-composition-id="s03-nada"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

    [data-composition-id="s03-nada"] .txt { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 28px; fill: #efeee5; }
    [data-composition-id="s03-nada"] .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.14em; fill: #efeee5; }
    [data-composition-id="s03-nada"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s03-nada"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
    [data-composition-id="s03-nada"] .s03-sem { font-size: 20px; opacity: 0.5; }
  </style>
  <div id="root" data-composition-id="s03-nada" data-width="1080" data-height="1920" data-duration="3.96">
    <div id="s03-escena" class="s03-capa clip" data-start="0" data-duration="3.96" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <rect class="ln s03-caja" x="300" y="650" width="100" height="90" rx="12" />
        <text class="mono s03-sem" x="350" y="640" text-anchor="middle" data-layout-ignore>SEM 1</text>
        <path class="ln-ac s03-tilde" d="M328 696 L344 712 L374 678" />
        <rect class="ln s03-caja" x="430" y="650" width="100" height="90" rx="12" />
        <text class="mono s03-sem" x="480" y="640" text-anchor="middle" data-layout-ignore>SEM 2</text>
        <path class="ln-ac s03-tilde" d="M458 696 L474 712 L504 678" />
        <rect class="ln s03-caja" x="560" y="650" width="100" height="90" rx="12" />
        <text class="mono s03-sem" x="610" y="640" text-anchor="middle" data-layout-ignore>SEM 3</text>
        <path class="ln-ac s03-tilde" d="M588 696 L604 712 L634 678" />
        <rect class="ln s03-caja" x="690" y="650" width="100" height="90" rx="12" />
        <text class="mono s03-sem" x="740" y="640" text-anchor="middle" data-layout-ignore>SEM 4</text>
        <path class="ln-ac s03-tilde" d="M718 696 L734 712 L764 678" />
        <path class="ln s03-dib" d="M330 1150 V1030 H900 V1150" />
        <path class="ln s03-dib" d="M310 1030 H920" />
        <path class="ln s03-dib" d="M80 1150 H1000" />
        <g transform="translate(200 1150) scale(1.45)"><g class="s03-cliente" ><circle class="ln" cx="0" cy="-96" r="14" /><path class="ln" d="M0 -82 V-40 M0 -70 L-18 -52 M0 -70 L18 -52 M0 -40 L-14 0 M0 -40 L14 0" /></g></g>
        <path class="ln s03-plato" d="M530 1006 H710 M555 1006 Q620 1026 685 1006" />
        <g transform="translate(620 922)"><g class="s03-fantasma"><path class="ln" d="M-70 78 H70" /><path class="ln" d="M-46 0 H46 L39 64 Q37 72 29 72 H-29 Q-37 72 -39 64 Z" /><path class="ln" d="M45 15 Q78 13 75 36 Q72 56 40 53" /><path class="ln-ac s03-fantasma-vapor" d="M-14 -18 q-12 -16 0 -32 q12 -16 0 -32" /><path class="ln-ac s03-fantasma-vapor" d="M16 -18 q-12 -16 0 -32 q12 -16 0 -32" /></g></g>
        <g class="s03-x"><circle class="ln-badge" cx="700" cy="910" r="18" /><path class="ln-badge" d="M693 903 L707 917 M707 903 L693 917" /></g>
      </svg>
      <div class="etiqueta"><span class="s03-e1">Viene siempre</span><span class="s03-e2">Ni un café</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s03-nada";
      const DUR = 3.96;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };
      const pop = (el, t, a) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: a ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // cambia la etiqueta mono: n = 1, 2, 3...
      let etiq = 0;
      const etiqueta = (n, t) => {
        if (etiq) tl.to(q(".s03-e" + etiq), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s03-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etiq = n;
      };
      // badge de "no": círculo verde con X, entra con pop
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, t);
      };

      const VIENE = 0.35, TODAS = 0.65, SEMANAS = 1.25, NADA = 2.35, NI = 2.96, CAFE = 3.15;
      dibujar(qa(".s03-dib"), 0, 0.6, 0.5);
      pop(q(".s03-cliente"), 0.05);
      tl.to(q(".s03-cliente"), { y: -4, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.4);
      etiqueta(1, VIENE);
      // "todas las semanas": las cajas se dibujan y se tildan una tras otra
      dibujar(qa(".s03-caja"), 0.2, 0.4);
      tl.fromTo(qa(".s03-sem"), { opacity: 0 }, { opacity: 0.5, duration: 0.3, stagger: 0.05 }, 0.3);
      qa(".s03-tilde").forEach((el, i) => dibujar([el], TODAS + i * 0.2, 0.25));
      // "nada": un platito vacío en el mostrador
      dibujar([q(".s03-plato")], NADA - 0.15, 0.4);
      tl.to(qa(".s03-caja, .s03-tilde"), { opacity: 0.4, duration: 0.3 }, NADA);
      // "ni un café": la taza que no le dieron, punteada y con la X
      const f = q(".s03-fantasma");
      f.querySelectorAll("path").forEach((p) => p.setAttribute("stroke-dasharray", "10 12"));
      tl.fromTo(f, { opacity: 0, y: 12 }, { opacity: 0.45, y: 0, duration: 0.35, ease: "power3.out" }, NI);
      badge(q(".s03-x"), CAFE + 0.1);
      etiqueta(2, NI);

      // salida
      tl.to(q("#s03-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
