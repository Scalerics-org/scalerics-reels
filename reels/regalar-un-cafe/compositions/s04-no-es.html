  <script>
    (function () {
      const ID = "s04-no-es";
      const DUR = 3.68;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if (desde !== undefined && t === 0) {
            gsap.set(el, { opacity: 1 });
          } else {
            gsap.set(el, { opacity: 0 });
            tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.03);
          }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.03);
        });
      };
      const pop = (el, t, a) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: a ?? 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      // cambia la etiqueta mono: n = 1, 2, 3...
      let etiq = 0;
      const etiqueta = (n, t) => {
        if (etiq) tl.to(q(".s04-e" + etiq), { opacity: 0, duration: 0.2 }, t - 0.1);
        tl.fromTo(q(".s04-e" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etiq = n;
      };
      // badge de "no": círculo verde con X, entra con pop
      const badge = (el, t) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, t);
      };

      const INTENCION = 0.39, PLATA = 1.69, TIEMPO = 2.79;
      dibujar(qa(".s04-d1"), 0, 0.5, 0.55);
      badge(q(".s04-x1"), INTENCION + 0.15);
      tl.to(q(".s04-i1"), { scale: 1.08, svgOrigin: "270 910", duration: 0.15, yoyo: true, repeat: 1 }, INTENCION);
      etiqueta(1, INTENCION - 0.1);
      dibujar(qa(".s04-d2"), PLATA - 0.35, 0.45);
      tl.fromTo(q(".s04-pesos"), { opacity: 0, scale: 0.6, svgOrigin: "540 945" }, { opacity: 1, scale: 1, svgOrigin: "540 945", duration: 0.3, ease: "back.out(2)" }, PLATA - 0.05);
      badge(q(".s04-x2"), PLATA + 0.15);
      etiqueta(2, PLATA);
      dibujar(qa(".s04-d3"), TIEMPO - 0.4, 0.45);
      tl.fromTo(q(".s04-agujas"), { opacity: 0, rotation: -90, svgOrigin: "810 920" }, { opacity: 1, rotation: 0, svgOrigin: "810 920", duration: 0.5, ease: "power3.out" }, TIEMPO - 0.15);
      badge(q(".s04-x3"), TIEMPO + 0.1);
      // "nada de eso": todo se apaga y una raya verde lo cierra
      tl.to(qa(".s04-i1, .s04-i2, .s04-i3"), { opacity: 0.4, duration: 0.3 }, TIEMPO + 0.45);
      dibujar([q(".s04-raya")], TIEMPO + 0.35, 0.35);
      etiqueta(3, TIEMPO);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
