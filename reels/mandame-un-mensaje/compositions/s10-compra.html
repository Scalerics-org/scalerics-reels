  <script>
    (function () {
      const ID = "s10-compra";
      const DUR = 7.62;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s10-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };
      const ELIGE = 0.47, PRECIO = 1.27, PAGA = 1.87, MERCADO = 2.47, SIN = 2.87, NADA = 3.87, ENVIO = 4.67, DAC = 5.37, CORREO = 5.77, PEDIDOSYA = 6.57;
      dibujar(qa(".s10-dc"), 0, 0.5, 0.45);
      dibujar(qa(".s10-dz"), 0.1, 0.5, 0.5);
      gsap.set(qa(".s10-nom, .s10-precio"), { opacity: 0 });
      tl.to(q(".s10-nom"), { opacity: 1, duration: 0.25 }, 0.25);
      pop(q(".s10-boton"), 0.3, 540, 1080);
      // el dedo: "elige"
      const dedo = q(".s10-dedo"), onda = q(".s10-onda");
      gsap.set(dedo, { x: 680, y: 1240, opacity: 0 });
      tl.to(dedo, { opacity: 1, duration: 0.15 }, 0.1);
      tl.to(dedo, { x: 620, y: 800, duration: 0.35, ease: "power2.out" }, 0.1);
      const toque = (t) => {
      tl.to(dedo, { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, t);
      tl.fromTo(onda, { scale: 1, opacity: 0.9 }, { scale: 2.2, opacity: 0, duration: 0.4, ease: "power2.out" }, t);
      };
      toque(ELIGE);
      punch(q(".s10-cont"), ELIGE + 0.05, 540, 770, 1.03);
      et(1, ELIGE);
      // "precio"
      tl.fromTo(q(".s10-precio"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, PRECIO - 0.1);
      punch(q(".s10-precio"), PRECIO + 0.2, 430, 985, 1.1);
      // "paga"
      tl.to(dedo, { x: 620, y: 1082, duration: 0.3, ease: "power2.inOut" }, PAGA - 0.35);
      toque(PAGA);
      punch(q(".s10-boton"), PAGA, 540, 1080, 1.06);
      tl.to(dedo, { opacity: 0, duration: 0.2 }, PAGA + 0.3);
      // "Mercado Pago": pago aprobado
      tl.to(q(".s10-cont"), { opacity: 0, duration: 0.2 }, MERCADO - 0.2);
      gsap.set(qa(".s10-ok-txt, .s10-mp"), { opacity: 0 });
      dibujar(qa(".s10-dok"), MERCADO - 0.1, 0.4);
      tl.fromTo(q(".s10-ok-txt"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, MERCADO + 0.1);
      tl.to(q(".s10-mp"), { opacity: 1, duration: 0.3 }, MERCADO + 0.2);
      // "sin preguntar nada"
      pop(q(".s10-chat"), SIN, 826, 790);
      pop(q(".s10-x"), NADA - 0.1, 940, 690);
      tl.to(q(".s10-chat"), { opacity: 0.35, duration: 0.3 }, NADA);
      et(2, SIN);
      // "el envío": el celular se corre y sale la caja
      tl.to(qa(".s10-chat, .s10-x"), { opacity: 0, duration: 0.25 }, ENVIO - 0.3);
      tl.to(q(".s10-cel"), { scale: 0.72, x: -190, svgOrigin: "540 910", duration: 0.5, ease: "power3.inOut" }, ENVIO - 0.3);
      dibujar(qa(".s10-dk"), ENVIO, 0.45);
      tl.fromTo(q(".s10-caja"), { y: 0 }, { y: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, ENVIO + 0.5);
      et(3, ENVIO);
      [[1, DAC], [2, CORREO], [3, PEDIDOSYA]].forEach(([k, t]) => {
      const el = q(".s10-t" + k);
      gsap.set(el, { opacity: 0 });
      tl.fromTo(el, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(1.6)" }, t - 0.1);
      });

      // salida
      tl.to(q("#s10-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
