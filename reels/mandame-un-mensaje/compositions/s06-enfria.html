  <script>
    (function () {
      const ID = "s06-enfria";
      const DUR = 4.01;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s06-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;

      const ESPERA = 0.36, ENFRIA = 1.06, POCO = 1.56, HASTA = 2.33, DEJA = 2.56, CONTESTAR = 2.96;

      const col = q(".s06-col");
      tl.fromTo(q(".s06-termo"), { x: -10 }, { x: 0, duration: 0.5, ease: "power3.out" }, 0);
      // el nivel arranca alto y baja un escalón en cada espera
      [[ESPERA, 0.72], [ENFRIA, 0.48], [POCO, 0.3], [DEJA, 0.08]].forEach(([t, s], i) => {
      tl.fromTo(col, { scaleY: i === 0 ? 1 : [1, 0.72, 0.48, 0.3][i], svgOrigin: "380 1090" }, { scaleY: s, svgOrigin: "380 1090", duration: 0.35, ease: "power2.out" }, t);

      const r = q(".s06-r" + (i + 1));

      tl.fromTo(r.querySelector(".s06-r" + (i + 1) + "-aguja"), { rotation: 0, svgOrigin: "680 " + (760 + i * 120) }, { rotation: 540, svgOrigin: "680 " + (760 + i * 120), duration: HASTA - t, ease: "none" }, t);

      tl.to(qa(".s06-r1, .s06-r2, .s06-r3"), { opacity: 0, x: 30, duration: 0.25, ease: "power2.in" }, HASTA - 0.2);

      tl.to(q(".s06-burbuja"), { opacity: 0.3, duration: 0.35 }, CONTESTAR);
      pop(q(".s06-x"), CONTESTAR + 0.05, 864, 860);
      et(2, CONTESTAR);
      punch(q(".s06-x"), CONTESTAR + 0.6, 864, 860, 1.2);

      // salida

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
