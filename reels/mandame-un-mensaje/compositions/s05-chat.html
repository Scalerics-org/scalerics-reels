  <script>
    (function () {
      const ID = "s05-chat";
      const DUR = 10.5;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s05-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };
      const PRECIO = 0.46, ESPERA = 1.66, CONTESTAS = 2.46, PREGUNTA = 3.51, TALLE = 4.06, ESPERA2 = 5.13, ENVIO = 6.96, CUENTA = 7.96, FOTO = 8.76;
      tl.fromTo(q(".s05-cel"), { scale: 0.96, svgOrigin: "540 910" }, { scale: 1.03, svgOrigin: "540 910", duration: DUR, ease: "none" }, 0);
      dibujar(qa(".s05-dc"), 0, 0.5, 0.45);
      gsap.set(q(".s05-cab"), { opacity: 0 });
      tl.to(q(".s05-cab"), { opacity: 1, duration: 0.25 }, 0.2);
      const m = (k, t, ox, oy) => pop(q(".s05-m" + k), t, ox, oy);
      const reloj = (k, t, vueltas) => {
      pop(q(".s05-c" + k), t, k === 2 ? 470 : 550, [0, 760, 920, 1192][k]);
      tl.fromTo(q(".s05-c" + k + "-aguja"), { rotation: 0, svgOrigin: (k === 2 ? 470 : 550) + " " + [0, 760, 920, 1192][k] }, { rotation: 360 * vueltas, svgOrigin: (k === 2 ? 470 : 550) + " " + [0, 760, 920, 1192][k], duration: 1.2 * vueltas, ease: "none" }, t);
      };
      // "¿precio?" y espera
      m(1, PRECIO - 0.05, 726, 790);
      reloj(1, ESPERA - 0.2, 2);
      et(1, ESPERA);
      // "contestás"
      m(2, CONTESTAS - 0.05, 354, 870);
      tl.to(q(".s05-c1"), { opacity: 0.35, duration: 0.3 }, CONTESTAS);
      // "pregunta si hay talle" y espera otra vez
      m(3, TALLE - 0.3, 726, 950);
      reloj(2, ESPERA2 - 0.25, 2);
      et(2, ESPERA2);
      // "el envío", "el número de cuenta", "la foto del comprobante"
      tl.to(q(".s05-c2"), { opacity: 0.35, duration: 0.3 }, ENVIO - 0.3);
      m(4, ENVIO - 0.1, 726, 1030);
      et(3, ENVIO);
      m(5, CUENTA - 0.1, 354, 1110);
      tl.to(q(".s05-hilo"), { y: -70, duration: 0.45, ease: "power2.inOut" }, FOTO - 0.35);
      m(6, FOTO, 726, 1254);
      et(4, FOTO);
      reloj(3, FOTO + 0.7, 1.2);
      // la pila entera tiembla un poco: otra espera más
      tl.to(q(".s05-hilo"), { x: -4, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 5 }, FOTO + 1.2);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
