  <script>
    (function () {
      const ID = "s07-visto";
      const DUR = 5.02;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s07-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };
      const VISTO = 0.95, PERO = 1.65, VENTA = 1.95, TUYA = 2.85, DEJASTE = 3.75;
      dibujar([q(".s07-db")], 0, 0.5, 0.45);
      gsap.set(q(".s07-txt"), { opacity: 0 });
      tl.to(q(".s07-txt"), { opacity: 1, duration: 0.3 }, 0.15);
      gsap.set(q(".s07-tick"), { opacity: 0 });
      tl.to(q(".s07-tick"), { opacity: 1, duration: 0.15 }, 0.45);
      gsap.set(q(".s07-tick-ac"), { opacity: 0 });
      tl.to(q(".s07-tick-ac"), { opacity: 1, duration: 0.12 }, VISTO);
      punch(q(".s07-tick-ac"), VISTO, 713, 816, 1.5);
      tl.fromTo(q(".s07-msg"), { y: 20 }, { y: 0, duration: 1.2, ease: "power2.out" }, 0);
      et(1, VISTO);
      // "pero esa venta ya era tuya"
      tl.to(q(".s07-msg"), { opacity: 0.35, y: -20, duration: 0.4, ease: "power2.out" }, PERO);
      pop(q(".s07-bolsa"), VENTA - 0.1, 540, 1140);
      gsap.set(q(".s07-check"), { opacity: 0 });
      dibujar([q(".s07-check")], TUYA - 0.2, 0.35);
      punch(q(".s07-bolsa"), TUYA + 0.1, 540, 1140, 1.08);
      et(2, TUYA);
      // "y la dejaste ir": se va flotando
      gsap.set(q(".s07-estela"), { opacity: 0 });
      tl.to(q(".s07-estela"), { opacity: 0.8, duration: 0.3 }, DEJASTE - 0.2);
      tl.to(q(".s07-bolsa"), { x: 420, y: -60, rotation: 16, svgOrigin: "540 1060", opacity: 0, duration: 1.0, ease: "power2.in" }, DEJASTE - 0.2);
      tl.to(q(".s07-estela"), { opacity: 0, duration: 0.3 }, DEJASTE + 0.8);
      et(3, DEJASTE);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
