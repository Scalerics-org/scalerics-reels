<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-mensaje"] .s01-capa { position: absolute; inset: 0; }
    [data-composition-id="s01-mensaje"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-mensaje"] .ln { fill: none; stroke: #efeee5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-mensaje"] .ln-4 { fill: none; stroke: #efeee5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-mensaje"] .ln-ac { fill: none; stroke: #5ce611; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-mensaje"] .ln-ac4 { fill: none; stroke: #5ce611; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    [data-composition-id="s01-mensaje"] .ln-tenue { fill: none; stroke: rgba(239, 238, 229, 0.35); stroke-width: 3; stroke-linecap: round; }
    [data-composition-id="s01-mensaje"] .punto { fill: #efeee5; }
    [data-composition-id="s01-mensaje"] .ui { font-family: "Lexend", sans-serif; font-weight: 500; font-size: 26px; fill: #efeee5; }
    [data-composition-id="s01-mensaje"] .ui-nombre { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 24px; fill: #efeee5; }
    [data-composition-id="s01-mensaje"] .ui-boton { font-family: "Lexend", sans-serif; font-weight: 600; font-size: 26px; fill: #efeee5; }
    [data-composition-id="s01-mensaje"] .pesos { font-family: "Lexend", sans-serif; font-weight: 700; font-size: 26px; fill: #5ce611; }
    [data-composition-id="s01-mensaje"] .etiqueta { position: absolute; left: 0; right: 0; top: 1268px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.3em; text-transform: uppercase; color: #5ce611; }
    [data-composition-id="s01-mensaje"] .etiqueta span { position: absolute; left: 0; right: 0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01-mensaje" data-width="1080" data-height="1920" data-duration="4.45">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="4.45" data-track-index="0">
      <svg viewBox="0 0 1080 1920" aria-hidden="true">
        <g class="s01-todo">
          <!-- el celular con el posteo -->
          <g class="s01-cel">
            <rect class="ln s01-dc" x="230" y="610" width="400" height="600" rx="52" />
            <line class="ln s01-dc" x1="400" y1="638" x2="460" y2="638" />
            <circle class="ln-4 s01-dc" cx="282" cy="686" r="18" />
            <text class="ui-nombre s01-txt" x="312" y="694">tu_comercio</text>
            <rect class="ln-4 s01-dc" x="262" y="722" width="336" height="236" rx="18" />
            <!-- la zapatilla -->
            <path class="ln s01-dz" d="M340 900 V858 Q342 826 372 822 L404 818 Q420 846 452 852 L500 860 Q530 866 532 888 V900 Z" />
            <path class="ln-4 s01-dz" d="M340 884 H532" />
            <path class="ln-4 s01-dz" d="M392 834 L402 848 M410 828 L420 844" />
            <text class="ui s01-txt" x="266" y="1000">Zapatilla urbana</text>
            <!-- donde iría el precio: el botón de mensaje -->
            <g class="s01-boton">
              <rect class="ln" x="262" y="1032" width="336" height="72" rx="36" />
              <text class="ui-boton" x="430" y="1077" text-anchor="middle">Mandame un mensaje</text>
            </g>
            <g class="s01-badge"><circle class="ln-ac4" cx="598" cy="1032" r="18" /><path class="ln-ac4" d="M590 1024 L606 1040 M606 1024 L590 1040" /></g>
          </g>
          <!-- la burbuja de espera -->
          <g class="s01-burbuja">
            <path class="ln" d="M690 770 H880 Q904 770 904 794 V836 Q904 860 880 860 H740 L710 884 L716 860 H690 Q666 860 666 836 V794 Q666 770 690 770 Z" />
            <circle class="punto s01-pt" cx="740" cy="815" r="9" />
            <circle class="punto s01-pt" cx="785" cy="815" r="9" />
            <circle class="punto s01-pt" cx="830" cy="815" r="9" />
          </g>
          <!-- el cliente con la plata en la mano -->
          <line class="ln-tenue s01-suelo" x1="660" y1="1180" x2="1000" y2="1180" />
          <g class="s01-cliente">
            <g class="s01-cliente-in">
              <circle class="ln s01-df" cx="0" cy="-166" r="24" />
              <path class="ln s01-df" d="M0 -142 V-70 M0 -122 L-44 -104 M0 -122 L26 -86 M0 -70 L-24 0 M0 -70 L24 0" />
              <g class="s01-billete">
                <rect class="ln-ac4" x="-104" y="-126" width="62" height="38" rx="6" />
                <text class="pesos" x="-73" y="-98" text-anchor="middle">$</text>
              </g>
            </g>
          </g>
        </g>
      </svg>
      <div class="etiqueta"><span class="s01-e1">Mandame un mensaje</span><span class="s01-e2">Venta perdida</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-mensaje";
      const DUR = 4.45;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // tiempos (relativos a la escena = palabras de la locución)
      const COMPRARTE = 0.5;
      const MANDARTE = 1.4;
      const MENSAJE = 2.0;
      const PERDISTE = 3.1;
      const VENTA = 3.6;

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s01-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };

      // todo se acerca despacio
      tl.fromTo(q(".s01-todo"), { scale: 0.97, svgOrigin: "560 910" }, { scale: 1.02, svgOrigin: "560 910", duration: DUR, ease: "none" }, 0);

      // el celular arranca medio dibujado (el cuadro 0 no puede ser negro)
      dibujar(qa(".s01-dc"), 0, 0.6, 0.45);
      dibujar(qa(".s01-dz"), 0.15, 0.6, 0.5);
      gsap.set(qa(".s01-txt"), { opacity: 0 });
      tl.to(qa(".s01-txt"), { opacity: 1, duration: 0.3 }, 0.25);
      // el cliente, con la plata en la mano
      gsap.set(q(".s01-cliente"), { x: 850, y: 1180 });
      dibujar(qa(".s01-df"), 0.05, 0.55, 0.4);
      dibujar([q(".s01-suelo")], 0, 0.5, 0.5);
      pop(q(".s01-billete"), COMPRARTE, -73, -107);
      punch(q(".s01-billete"), COMPRARTE + 0.45, -73, -107, 1.15);

      // "mandarte un mensaje": el botón donde iría el precio, y la burbuja de espera
      pop(q(".s01-boton"), MANDARTE - 0.1, 430, 1068);
      et(1, MANDARTE);
      pop(q(".s01-burbuja"), MENSAJE, 710, 884);
      const pts = qa(".s01-pt");
      gsap.set(pts, { opacity: 0.3 });
      for (let k = 0; k < 3; k++) {
        pts.forEach((p, i) => {
          tl.to(p, { opacity: 1, duration: 0.14, yoyo: true, repeat: 1, ease: "sine.inOut" }, MENSAJE + 0.3 + k * 0.42 + i * 0.12);
        });
      }
      // el cliente espera: golpecito con el pie (la plata baja)
      tl.to(q(".s01-billete"), { y: 8, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, MENSAJE + 0.4);

      // "perdiste": se da vuelta y se va, con la plata
      tl.to(q(".s01-cliente-in"), { scaleX: -1, svgOrigin: "0 -90", duration: 0.18, ease: "power2.inOut" }, PERDISTE - 0.1);
      tl.to(q(".s01-billete text"), { scaleX: -1, svgOrigin: "-73 -107", duration: 0.18, ease: "power2.inOut" }, PERDISTE - 0.1);
      tl.to(q(".s01-cliente"), { x: 1090, duration: 0.9, ease: "power2.in" }, PERDISTE + 0.1);
      tl.to(q(".s01-cliente"), { opacity: 0, duration: 0.3 }, PERDISTE + 0.9);
      tl.to(q(".s01-burbuja"), { opacity: 0.35, duration: 0.3 }, PERDISTE + 0.2);
      // "venta": badge X sobre el botón
      pop(q(".s01-badge"), VENTA, 598, 1032);
      tl.to(q(".s01-boton"), { opacity: 0.4, duration: 0.3 }, VENTA + 0.1);
      et(2, VENTA);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
