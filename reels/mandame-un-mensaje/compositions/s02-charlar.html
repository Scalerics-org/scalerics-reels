  <script>
    (function () {
      const ID = "s02-charlar";
      const DUR = 3.5;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          if ((desde ?? 1) < 1) gsap.set(el, { opacity: 1 });
          else { gsap.set(el, { opacity: 0 }); tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04); }
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, ox, oy) => {
        gsap.set(el, { opacity: 0 });
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: ox + " " + oy }, { opacity: 1, scale: 1, svgOrigin: ox + " " + oy, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, ox, oy, s) => tl.to(el, { scale: s ?? 1.1, svgOrigin: ox + " " + oy, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      // etiqueta: et(n, t) muestra la n y esconde la anterior
      let etPrev = null;
      const et = (k, t) => {
        const el = q(".s02-e" + k);
        if (etPrev) tl.to(etPrev, { opacity: 0, duration: 0.2 }, t - 0.15);
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etPrev = el;
      };
      const CHARLAR = 1.45, QUIERE = 2.19, COMPRAR = 2.35;
      gsap.set(q(".s02-f"), { x: 640, y: 1150 });
      dibujar(qa(".s02-f-d"), 0, 0.55, 0.4);
      dibujar([q(".s02-suelo")], 0, 0.5, 0.5);
      pop(q(".s02-f-billete"), 0.25, -117, -171);
      punch(q(".s02-f-billete"), 0.5, -117, -171, 1.15);
      tl.fromTo(q(".s02-f-in"), { rotation: -2, svgOrigin: "0 0" }, { rotation: 2, svgOrigin: "0 0", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

      qa(".s02-b").forEach((b, i) => pop(b, CHARLAR - 0.35 + i * 0.12, 830, 760 + i * 100));

      dibujar([q(".s02-tacha")], CHARLAR + 0.05, 0.35);
      et(1, CHARLAR);
      // "quiere comprar": se van las burbujas y aparece la bolsa
      tl.to(qa(".s02-b, .s02-tacha"), { opacity: 0, x: 40, duration: 0.3, ease: "power2.in" }, QUIERE - 0.1);
      pop(q(".s02-bolsa"), QUIERE, 325, 1150);
      punch(q(".s02-f-billete"), COMPRAR, -117, -171, 1.25);
      tl.to(q(".s02-f-billete"), { x: -40, y: 30, duration: 0.5, ease: "power2.inOut" }, COMPRAR + 0.25);
      punch(q(".s02-bolsa"), COMPRAR + 0.6, 325, 1150, 1.08);
      et(2, QUIERE);

      // salida

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
