<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/playa.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s02-mate"] .s02-capa, [data-composition-id="s02-mate"] .s02-escenario { position: absolute; inset: 0; }
    [data-composition-id="s02-mate"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s02-mate"] .s02-tag { left: 90px; top: 1420px; }
    [data-composition-id="s02-mate"] .s02-ay { left: 800px; top: 630px; font-size: 64px; color: #10202b; }
  </style>
  <div id="root" data-composition-id="s02-mate" data-width="1080" data-height="1920" data-duration="2.00">
    <div id="s02-escena" class="s02-capa clip" data-start="0" data-duration="2.00" data-track-index="0">
      <div class="s02-escenario">
        <svg class="s02-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="pl-mano s02-ay">¡auxilio!</div>
        <div class="pl-tag s02-tag">Y VOS: TOMANDO MATE</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s02-mate";
      const DUR = 2.0;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      root.querySelector(".s02-svg").innerHTML =
        // a lo lejos, la clienta pidiendo ayuda en el mar
        `<g class="s02-lejos">${PL.clienta(820, 900, 0.42, { cara: "asustada", mano: "auxilio", id: "s02-cc", agua: PL.TUR })}</g>` +
        // la sombrilla y el dueño en la reposera, de espaldas al mar
        `<path d="M300 1380 L330 700" stroke="${PL.INK}" stroke-width="16" stroke-linecap="round"/>
         <path d="M60 760 Q330 560 600 660 Q520 690 470 720 Q400 680 330 700 Q260 690 190 730 Q130 730 60 760 Z" fill="${PL.ROJO}" stroke="${PL.INK}" stroke-width="9" stroke-linejoin="round"/>
         <path d="M190 730 Q250 620 330 600 M470 720 Q430 630 330 600" fill="none" stroke="${PL.CRE}" stroke-width="12" opacity="0.8"/>` +
        `<g class="s02-due">${PL.dueno(430, 1370, 1.2, { cara: "dormido", mate: true, lentes: true, zzz: true })}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = PL.kit(tl, root);
      const { q } = K;
      const TOMANDO = 0.63, MATE = 0.94;

      tl.fromTo(q(".s02-escenario"), { scale: 1.05 }, { scale: 1, duration: DUR, ease: "power1.out", transformOrigin: "40% 70%" }, 0);
      K.popSvg(q(".s02-due"), 0, "430 1370", 0.3, 0.8);
      // zzz suben
      tl.fromTo(q(".s02-due .pl-d-zzz"), { y: 10, opacity: 0.4 }, { y: -20, opacity: 1, duration: 0.8, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);
      // toma mate: la mano sube a la boca y vuelve
      const mano = q(".s02-due .pl-d-mano");
      tl.to(mano, { x: -150, y: -260, rotation: -10, duration: 0.3, ease: "power2.out", svgOrigin: "160 -230" }, TOMANDO - 0.1);
      tl.to(mano, { x: 0, y: 0, rotation: 0, duration: 0.3, ease: "power2.inOut", svgOrigin: "160 -230" }, MATE + 0.5);
      // la clienta lejos se hunde y sube
      const cu = q(".s02-lejos .pl-c-cuerpo");
      tl.fromTo(cu, { y: 0 }, { y: 80, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0);
      K.pop(q(".s02-ay"), 0.2);
      tl.to(q(".s02-ay"), { rotation: 4, duration: 0.15, yoyo: true, repeat: 7, ease: "sine.inOut" }, 0.3);
      K.pop(q(".s02-tag"), MATE);

      K.salida(q("#s02-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
