<template>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/playa.js"></script>
  <style>
    @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: url("assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
    @font-face { font-family: "Black Ops One"; font-weight: 400; font-display: block; src: url("assets/fonts/BlackOpsOne.woff2") format("woff2"); }
    @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    [data-composition-id="s01-bandera"] .s01-capa, [data-composition-id="s01-bandera"] .s01-escenario { position: absolute; inset: 0; }
    [data-composition-id="s01-bandera"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    [data-composition-id="s01-bandera"] .s01-roja { left: 190px; top: 610px; font-size: 80px; }
    [data-composition-id="s01-bandera"] .s01-wa { left: 470px; top: 1400px; }
  </style>
  <div id="root" data-composition-id="s01-bandera" data-width="1080" data-height="1920" data-duration="3.66">
    <div id="s01-escena" class="s01-capa clip" data-start="0" data-duration="3.66" data-track-index="0">
      <div class="s01-escenario">
        <svg class="s01-svg" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
        <div class="pl-sello s01-roja">BANDERA ROJA</div>
        <div class="pl-tag rojo s01-wa">EN TU WHATSAPP</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s01-bandera";
      const DUR = 3.66;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const svg = root.querySelector(".s01-svg");
      const [g1] = PL.globo(330, 760, "¿Hola?", "i", { fs: 34, cls: "s01-g1" });
      const [g2] = PL.globo(740, 820, "¿Talle M?", "i", { fs: 34, cls: "s01-g2" });
      const [g3] = PL.globo(840, 690, "¿Hay alguien?", "i", { fs: 30, cls: "s01-g3" });
      svg.innerHTML =
        PL.olas(1010, { L: 180, amp: 16, h: 400, color: PL.TUR3, cls: "s01-o1", op: 0.6 }) +
        PL.bandera(170, 1360, 760, PL.ROJO, { w: 380, th: 250, palo: 22, trazo: 9, cls: "s01-band" }) +
        `<g class="s01-cli">${PL.clienta(680, 1150, 1.15, { cara: "asustada", mano: "auxilio", id: "s01-cc", agua: PL.TUR })}</g>` +
        PL.olas(1190, { L: 200, amp: 20, h: 200, color: PL.TUR, cls: "s01-o2" }) +
        `<g class="s01-globos">${g1}${g2}${g3}</g>`;
      const tl = gsap.timeline({ paused: true });
      const K = PL.kit(tl, root);
      const { q } = K;

      const ROJA = 0.56, CLIENTA = 1.69, AHOGA = 1.94, WA = 2.82;

      // cuadro 0: la bandera ya flamea y la cámara se acerca
      tl.fromTo(q(".s01-escenario"), { scale: 1.08 }, { scale: 1, duration: DUR, ease: "power1.out", transformOrigin: "30% 50%" }, 0);
      K.flamear(".s01-band .pl-b-tela", 0, DUR, 0.18);
      K.olear(".s01-o1, .s01-o2", 0, DUR, 180, 1.2);
      K.sello(q(".s01-roja"), ROJA, -4);
      K.sacudon(q(".s01-escenario"), ROJA + 0.02, 1);
      // la clienta asoma del agua con la mano en alto y se hunde y sube
      const cuerpo = q(".s01-cli .pl-c-cuerpo");
      gsap.set(cuerpo, { y: 260 });
      tl.to(cuerpo, { y: 0, duration: 0.3, ease: "back.out(1.8)" }, CLIENTA - 0.2);
      [0, 0.5, 1.0].forEach((d) => {
        tl.to(cuerpo, { y: 70, duration: 0.2, ease: "power2.in" }, AHOGA + d);
        tl.to(cuerpo, { y: 0, duration: 0.25, ease: "power2.out" }, AHOGA + d + 0.22);
      });
      const mano = q(".s01-cli .pl-c-mano");
      K.origen(mano, "110 -40");
      tl.fromTo(mano, { rotation: -8 }, { rotation: 10, duration: 0.18, yoyo: true, repeat: 7, ease: "sine.inOut", svgOrigin: "110 -40", immediateRender: false }, CLIENTA);
      // los globos de chat flotan alrededor
      ["s01-g1", "s01-g2", "s01-g3"].forEach((c, i) => {
        const el = q("." + c);
        K.popSvg(el, WA - 0.3 + i * 0.18, K.centro(el), 0.35, 0.4);
        tl.to(el, { y: -14, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, WA + i * 0.18 + 0.1);
      });
      K.pop(q(".s01-wa"), WA);

      K.salida(q("#s01-escena"), DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
