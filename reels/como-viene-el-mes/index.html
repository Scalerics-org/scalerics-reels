<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Lexend"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Lexend-var.woff2") format("woff2"); }
      @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: block; src: url("assets/fonts/Caveat-var.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
      #precarga { position: absolute; left: -9999px; font: 800 40px "Lexend"; }
      #precarga2 { position: absolute; left: -9999px; font: 700 40px "Caveat"; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1220; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b1220; }
      #fondo { position: absolute; inset: 0; background: #0b1220; z-index: 0; }
      #capa3d { position: absolute; inset: 0; width: 1080px; height: 1920px; z-index: 2; transform-origin: 540px 960px; }
      #tres { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      .firma { position: absolute; left: 50%; top: 1795px; height: 46px; width: auto; transform: translateX(-50%); opacity: 0.95; z-index: 4; filter: drop-shadow(0 0 3px rgba(11,18,32,0.95)) drop-shadow(0 0 10px rgba(11,18,32,0.85)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="35.28" data-width="1080" data-height="1920">
      <div id="precarga">Rubén</div><div id="precarga2">TICKETS</div>
      <div id="fondo" class="clip" data-start="0" data-duration="35.28" data-track-index="0"></div>
      <div id="el-cartel" class="scene" style="z-index:1" data-composition-id="cartel" data-composition-src="compositions/cartel.html" data-start="19.12" data-duration="2.7" data-track-index="12" data-track-kind="graphics"></div>
      <div id="capa3d" class="clip" data-start="0" data-duration="35.28" data-track-index="1"><canvas id="tres" width="1080" height="1920"></canvas></div>
      <div id="el-s00-gancho" class="scene" style="z-index:3" data-composition-id="s00-gancho" data-composition-src="compositions/s00-gancho.html" data-start="0" data-duration="1.95" data-track-index="2" data-track-kind="graphics"></div>
      <div id="el-s05-r2" class="scene" style="z-index:3" data-composition-id="s05-r2" data-composition-src="compositions/s05-r2.html" data-start="12.05" data-duration="1.03" data-track-index="3" data-track-kind="graphics"></div>
      <div id="el-s09-cierre" class="scene" style="z-index:3" data-composition-id="s09-cierre" data-composition-src="compositions/s09-cierre.html" data-start="33.28" data-duration="2" data-track-index="4" data-track-kind="graphics"></div>

      <audio id="mezcla" src="assets/audio/mezcla.wav" data-start="0" data-duration="35.28" data-track-index="30" data-volume="1"></audio>
    </div>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["tres"] = new Promise((ok) => { window.__tresListo = ok; });
    </script>
    <script type="module" src="assets/tres.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#fondo", { opacity: 1, duration: 35.28 }, 0);
      // el último cuadro de la parte 1 se va girando 540° y achicándose (el giro clásico del cartel)
      tl.set("#capa3d", { opacity: 0 }, 19.12);   // (ronda 2) corte seco al cartel (el giro pasaba por la pelada espejada)
      // la parte 2 entra por un iris que se abre desde la tablet
      tl.set("#capa3d", { scale: 1, rotation: 0, opacity: 1, clipPath: "circle(0px at 540px 1150px)" }, 19.39);
      tl.fromTo("#capa3d", { clipPath: "circle(0px at 540px 1150px)" }, { clipPath: "circle(1900px at 540px 1150px)", duration: 0.3, ease: "power2.in", immediateRender: false }, 21.5);
      tl.set("#capa3d", { clipPath: "none" }, 21.83);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
