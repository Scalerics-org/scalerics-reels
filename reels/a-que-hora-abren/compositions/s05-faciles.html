  <script>
    (function () {
      const ID = "s05-faciles";
      const DUR = 4.64;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };

      const FACILES = 0.74, RESPUESTA = 2.44, SIEMPRE = 3.34, MISMA = 3.74;
      dibujar(qa(".s05-dq"), 0, 0.5, 0.45);
      tl.fromTo(qa(".s05-tq"), { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.1 }, 0.15);
      // "fáciles": las tres preguntas laten
      [".s05-q1", ".s05-q2", ".s05-q3"].forEach((s, i) => punch(q(s), FACILES + i * 0.1, "290 " + (732 + i * 160), 1.07));
      etq(".s05-e1", FACILES);
      tl.fromTo(q(".s05-q"), { x: 0 }, { x: -12, duration: DUR, ease: "none" }, 0);
      // "respuesta": flechas y respuestas
      dibujar(qa(".s05-fl"), RESPUESTA - 0.35, 0.35);
      [".s05-r1", ".s05-r2", ".s05-r3"].forEach((s, i) => pop(q(s), RESPUESTA + i * 0.12, "640 " + (732 + i * 160)));
      // "siempre la misma": la respuesta se repite como un sello
      tl.fromTo(q(".s05-fant"), { opacity: 0, x: -14, y: 14 }, { opacity: 1, x: 0, y: 0, duration: 0.4, ease: "power3.out" }, SIEMPRE);
      [".s05-r1", ".s05-r2", ".s05-r3"].forEach((s, i) => punch(q(s), MISMA + i * 0.08, "740 " + (732 + i * 160), 1.08));
      etq(".s05-e2", MISMA);

      // salida
      tl.to(q("#s05-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
