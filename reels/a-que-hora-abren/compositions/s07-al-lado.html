  <script>
    (function () {
      const ID = "s07-al-lado";
      const DUR = 4.50;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };

      const NO = 1.2, ESCRIBE = 2.4, CONTESTA = 4.0;
      dibujar(qa(".s07-d"), 0, 0.6, 0.45);
      dibujar(qa(".s07-df"), 0, 0.5, 0.4);
      tl.fromTo(qa(".s07-tuyo text, .s07-otro text"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);
      // le había escrito a tu local: espera
      dibujar([q(".s07-arco1")], 0.15, 0.5);
      tl.fromTo(q(".s07-espera"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
      tl.fromTo(q(".s07-ag"), { rotation: 0, svgOrigin: "300 700" }, { rotation: 360, svgOrigin: "300 700", duration: 1.6, ease: "none" }, 0.4);
      // "no espera": se da vuelta hacia el de al lado
      tl.to(qa(".s07-arco1, .s07-espera"), { opacity: 0, duration: 0.3 }, NO);
      tl.to(q(".s07-fig"), { x: 30, duration: 0.4, ease: "power3.out" }, NO);
      tl.to(q(".s07-fig"), { y: -10, duration: 0.15, yoyo: true, repeat: 1 }, NO);
      tl.to(q(".s07-tuyo"), { opacity: 0.6, duration: 0.4 }, NO + 0.2);
      etq(".s07-e1", NO + 0.1);
      // "escribe": la pregunta viaja al de al lado
      pop(q(".s07-preg"), ESCRIBE - 0.2, "645 1088");
      dibujar([q(".s07-arco2")], ESCRIBE, 0.5);
      tl.to(q(".s07-preg"), { x: 150, y: -190, opacity: 0, duration: 0.6, ease: "power2.in" }, ESCRIBE + 0.3);
      punch(q(".s07-otro"), ESCRIBE + 0.85, "790 900", 1.05);
      // "contesta": vuelve al instante, tu local se apaga
      pop(q(".s07-resp"), CONTESTA - 0.25, "795 720");
      punch(q(".s07-resp"), CONTESTA + 0.12, "795 690", 1.1);
      tl.to(q(".s07-tuyo"), { opacity: 0.3, duration: 0.3 }, CONTESTA - 0.2);
      etq(".s07-e2", CONTESTA - 0.25);

      // salida
      tl.to(q("#s07-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
