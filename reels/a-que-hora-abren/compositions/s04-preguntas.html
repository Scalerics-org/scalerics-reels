  <script>
    (function () {
      const ID = "s04-preguntas";
      const DUR = 3.58;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };

      const ABREN = 0.0, CUANTO = 1.3, TENES = 2.36;
      tl.fromTo(q(".s04-tel"), { scale: 0.97, svgOrigin: "490 920" }, { scale: 1.02, svgOrigin: "490 920", duration: DUR, ease: "none" }, 0);
      dibujar(qa(".s04-dib"), 0, 0.5, 0.4);
      tl.fromTo(q(".s04-cab"), { opacity: 0.3 }, { opacity: 1, duration: 0.3 }, 0);
      tl.fromTo(q(".s04-b1"), { opacity: 0.4, scale: 0.85, svgOrigin: "326 860" }, { opacity: 1, scale: 1, svgOrigin: "326 860", duration: 0.35, ease: "back.out(1.6)" }, ABREN);
      pop(q(".s04-cont"), 0.15, "800 720");
      gsap.set(qa(".s04-n2, .s04-n3"), { opacity: 0 });
      pop(q(".s04-b2"), CUANTO - 0.1, "326 954");
      tl.set(q(".s04-n1"), { opacity: 0 }, CUANTO);
      tl.set(q(".s04-n2"), { opacity: 1 }, CUANTO);

      tl.set(q(".s04-n3"), { opacity: 1 }, TENES);
      punch(q(".s04-cont"), TENES, "800 720", 1.3);
      etq(".s04-e1", TENES + 0.4);
      tl.to(q(".s04-cont"), { rotation: 8, svgOrigin: "800 720", duration: 0.08, yoyo: true, repeat: 5 }, 3.0);

      // salida
      tl.to(q("#s04-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);
