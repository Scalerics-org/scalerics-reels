  <script>
    (function () {
      const ID = "s06-esperando";
      const DUR = 4.40;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };

      const ATENDES = 0.4, ESPERANDO = 2.4, HORA = 3.36, DOS = 3.95;
      dibujar(qa(".s06-d"), 0, 0.55, 0.45);
      dibujar(qa(".s06-dt"), 0, 0.55, 0.45);
      tl.fromTo(qa(".s06-m1, .s06-m2, .s06-m3"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.12 }, 0.2);
      tl.fromTo(q(".s06-tilde"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.6);
      // "atendés": la bolsa pasa de vos al cliente
      tl.fromTo(q(".s06-bolsa"), { x: -70, opacity: 0 }, { x: -70, opacity: 1, duration: 0.2 }, ATENDES - 0.2);
      tl.to(q(".s06-bolsa"), { x: 60, duration: 0.7, ease: "power2.inOut" }, ATENDES);
      tl.to(q(".s06-bolsa"), { y: -14, duration: 0.35, ease: "sine.out", yoyo: true, repeat: 1 }, ATENDES);
      etq(".s06-e1", ATENDES);
      tl.fromTo(q(".s06-mostr"), { x: 0 }, { x: 8, duration: 2, ease: "none" }, 0);
      // los mensajes laten: siguen ahí
      tl.to(qa(".s06-m1, .s06-m2, .s06-m3"), { opacity: 0.5, duration: 0.3, stagger: 0.1 }, 1.4);
      // "esperando": el reloj
      pop(q(".s06-reloj"), ESPERANDO - 0.15, "720 690");
      tl.fromTo(q(".s06-tel"), { rotation: 0 }, { rotation: 0, duration: 0.01 }, 0);
      tl.to(q(".s06-tel"), { x: 4, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, ESPERANDO);
      etq(".s06-e2", ESPERANDO);
      tl.fromTo(q(".s06-ag"), { rotation: 0, svgOrigin: "720 690" }, { rotation: 360, svgOrigin: "720 690", duration: 0.6, ease: "power2.inOut" }, HORA - 0.3);
      gsap.set(qa(".s06-h1, .s06-h2"), { opacity: 0 });
      pop(q(".s06-h1"), HORA, "830 690");
      tl.fromTo(q(".s06-ag"), { rotation: 360, svgOrigin: "720 690" }, { rotation: 720, svgOrigin: "720 690", duration: 0.45, ease: "power2.inOut", immediateRender: false }, DOS - 0.3);
      tl.set(q(".s06-h1"), { opacity: 0 }, DOS);
      tl.fromTo(q(".s06-h2"), { opacity: 0, scale: 1.3, svgOrigin: "830 690" }, { opacity: 1, scale: 1, svgOrigin: "830 690", duration: 0.2, ease: "power3.out" }, DOS);

      // salida
      tl.to(q("#s06-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
