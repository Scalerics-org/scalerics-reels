  <script>
    (function () {
      const ID = "s11-pedidos";
      const DUR = 4.72;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };

      const PEDIDOS = 0.11, TURNOS = 1.31, CONSULTA = 2.41, VOS = 3.01, TE = 3.31, PASA = 3.71;
      tl.fromTo(q(".s11-fila"), { x: 10 }, { x: -10, duration: DUR, ease: "none" }, 0);
      // pedido: arranca medio dibujado
      dibujar(qa(".s11-d1"), 0, 0.5, 0.45);
      tl.fromTo(q(".s11-r1"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, PEDIDOS);
      dibujar([q(".s11-t1")], PEDIDOS + 0.4, 0.3);
      punch(q(".s11-ped"), PEDIDOS + 0.7, "220 900", 1.08);
      etq(".s11-e1", 0.6);
      // turno
      dibujar(qa(".s11-d2"), TURNOS - 0.4, 0.45);
      tl.fromTo(q(".s11-r2"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, TURNOS - 0.2);
      pop(q(".s11-celda"), TURNOS + 0.1, "460 952");
      punch(q(".s11-tur"), TURNOS + 0.45, "460 905", 1.08);
      // consulta
      dibujar(qa(".s11-d3"), CONSULTA - 0.35, 0.45);
      tl.fromTo(q(".s11-con text"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, CONSULTA);
      tl.fromTo(q(".s11-r3"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, CONSULTA - 0.1);
      // vos aparece, y la consulta vuela hacia vos
      pop(q(".s11-vos"), VOS - 0.15, "900 930");
      tl.fromTo(q(".s11-rv"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, VOS);
      dibujar([q(".s11-arco")], TE - 0.1, 0.35);
      tl.to(q(".s11-con"), { x: 160, y: -110, scale: 0.6, svgOrigin: "700 900", duration: 0.45, ease: "power2.inOut" }, TE);
      tl.to(q(".s11-con"), { opacity: 0, duration: 0.15 }, PASA - 0.1);
      punch(q(".s11-vos"), PASA, "900 930", 1.15);
      tl.to(qa(".s11-ped, .s11-tur, .s11-r1, .s11-r2, .s11-r3"), { opacity: 0.5, duration: 0.3 }, TE);
      etq(".s11-e2", TE);

      // salida
      tl.to(q("#s11-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
