  <script>
    (function () {
      const ID = "s01-abren";
      const DUR = 5.20;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };

      const HORA = 0.5, CONTESTAS = 2.4, VOS = 3.0, PERDIENDO = 3.8, VENTAS = 4.2;
      tl.fromTo(q(".s01-tel"), { scale: 0.97, svgOrigin: "440 920" }, { scale: 1.02, svgOrigin: "440 920", duration: DUR, ease: "none" }, 0);
      // arranca medio dibujado
      dibujar(qa(".s01-dib"), 0, 0.6, 0.45);
      tl.fromTo(q(".s01-cab"), { opacity: 0.3 }, { opacity: 1, duration: 0.3 }, 0);
      // "hora": entra la pregunta y la notificación
      pop(q(".s01-burbuja"), HORA - 0.15, "276 860");
      tl.fromTo(q(".s01-meta"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, HORA + 0.2);
      pop(q(".s01-notif"), HORA + 0.1, "622 632");
      etq(".s01-e1", HORA + 0.2);
      punch(q(".s01-notif"), 1.4, "622 632", 1.25);
      // "contestás vos": vos estás ocupado, el chat espera
      dibujar(qa(".s01-dv"), CONTESTAS - 0.3, 0.5);
      tl.fromTo(q(".s01-rvos"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, VOS);
      punch(q(".s01-rvos"), VOS + 0.3, "840 1100", 1.2);
      tl.fromTo(q(".s01-bolsa"), { rotation: -6, svgOrigin: "948 1030" }, { rotation: 6, svgOrigin: "948 1030", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 5 }, CONTESTAS);
      tl.fromTo(q(".s01-espera"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, CONTESTAS);
      tl.fromTo(q(".s01-aguja"), { rotation: 0, svgOrigin: "300 972" }, { rotation: 540, svgOrigin: "300 972", duration: DUR - CONTESTAS, ease: "none" }, CONTESTAS);
      punch(q(".s01-notif"), VOS, "622 632", 1.25);
      // "perdiendo ventas": la venta se va y el chat se apaga
      tl.fromTo(q(".s01-tag"), { opacity: 0, scale: 0.6, svgOrigin: "705 1010" }, { opacity: 1, scale: 1, svgOrigin: "705 1010", duration: 0.3, ease: "back.out(2)" }, PERDIENDO - 0.1);
      tl.to(q(".s01-tag"), { x: 300, y: 60, rotation: 20, svgOrigin: "705 1010", opacity: 0, filter: "blur(6px)", duration: 0.6, ease: "power2.in" }, VENTAS);
      tl.to(qa(".s01-burbuja, .s01-espera"), { opacity: 0.4, duration: 0.3 }, VENTAS + 0.1);
      etq(".s01-e2", VENTAS);

      // salida
      tl.to(q("#s01-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
