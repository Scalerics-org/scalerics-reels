            <rect class="ln s09-d" x="460" y="740" width="160" height="290" rx="28" />

  <script>
    (function () {
      const ID = "s09-sistema";
      const DUR = 3.82;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };

      const CELULAR = 0.9, SE = 2.02, SISTEMA = 2.8;
      const CX = 540, CY = 910, RIN = 128, ROUT = 168, N = 9;
      const pt = (r, a) => (CX + r * Math.cos(a)).toFixed(1) + " " + (CY + r * Math.sin(a)).toFixed(1);
      let d = "";
      for (let i = 0; i < N; i++) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
        const p0 = pt(RIN, a - 0.2), p1 = pt(ROUT, a - 0.12), p2 = pt(ROUT, a + 0.12), p3 = pt(RIN, a + 0.2);
        const sig = pt(RIN, a + (2 * Math.PI) / N - 0.2);
        d += (i === 0 ? "M" + p0 : "") + " L" + p1 + " L" + p2 + " L" + p3 + " A" + RIN + " " + RIN + " 0 0 1 " + sig;
      }
      q(".s09-dientes").setAttribute("d", d + " Z");

      dibujar(qa(".s09-d"), 0, 0.55, 0.45);
      // el celular en la mano tiembla: malabares
      tl.to(q(".s09-tel"), { x: 6, rotation: 2, svgOrigin: "540 1000", duration: 0.08, ease: "none", yoyo: true, repeat: 21 }, 0.1);
      pop(q(".s09-b"), CELULAR, "630 740");
      etq(".s09-e1", CELULAR);
      tl.to(q("#s09-mano"), { opacity: 0.45, duration: 0.3 }, CELULAR + 0.4);
      // "se arregla": se va; entra el engranaje
      tl.to(q("#s09-mano"), { opacity: 0, scale: 0.7, filter: "blur(6px)", transformOrigin: "540px 940px", duration: 0.35, ease: "power2.in" }, SE - 0.15);
      dibujar(qa(".s09-dg"), SE + 0.05, 0.55);
      tl.fromTo(q(".s09-engranaje"), { rotation: -30, svgOrigin: "540 910" }, { rotation: 60, svgOrigin: "540 910", duration: DUR - SE, ease: "none" }, SE);
      etq(".s09-e2", SE + 0.1);
      tl.fromTo(q("#s09-sis"), { scale: 1 }, { scale: 1.12, transformOrigin: "540px 910px", duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, SISTEMA);
      tl.to(q(".s09-e2"), { scale: 1.08, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, SISTEMA);

      // salida
      tl.to(q("#s09-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
