        <g class="s08-dif">
          <text class="rotulo s08-rd" x="140" y="700">DIFÍCIL</text>
          <rect class="ln-fino s08-d" x="140" y="720" width="380" height="190" rx="24" />
          <line class="ln-tenue s08-l" x1="170" y1="768" x2="490" y2="768" />

  <script>
    (function () {
      const ID = "s08-la-mas-facil";
      const DUR = 5.30;
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => Array.from(root.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      // trazos que se dibujan solos; si arrancan en el cuadro 0 se ven medio dibujados
      const dibujar = (els, t, dur, desde) => {
        els.forEach((el, i) => {
          const L = el.getTotalLength();
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
          gsap.set(el, { opacity: t <= 0 ? 1 : 0 });
          if (t > 0) tl.to(el, { opacity: 1, duration: 0.04 }, t + i * 0.04);
          tl.fromTo(el, { strokeDashoffset: L * (desde ?? 1) }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t + i * 0.04);
        });
      };
      const pop = (el, t, origen) => {
        tl.fromTo(el, { opacity: 0, scale: 0.85, svgOrigin: origen }, { opacity: 1, scale: 1, svgOrigin: origen, duration: 0.35, ease: "back.out(1.6)" }, t);
      };
      const punch = (el, t, origen, s) => {
        tl.to(el, { scale: s ?? 1.12, svgOrigin: origen, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, t);
      };
      // etiquetas: entra la nueva, se va la anterior
      let etqPrev = null;
      const etq = (sel, t) => {
        if (etqPrev) tl.to(q(etqPrev), { opacity: 0, duration: 0.2 }, t - 0.12);
        tl.fromTo(q(sel), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
        etqPrev = sel;
      };

      const PERDISTE = 0.8, DIFICIL = 2.4, LA = 3.41, FACIL = 4.4;
      dibujar(qa(".s08-d"), 0, 0.6, 0.45);
      tl.fromTo(q(".s08-rd"), { opacity: 0.3 }, { opacity: 1, duration: 0.3 }, 0);
      dibujar(qa(".s08-l"), 0.3, 0.5);
      tl.fromTo(q(".s08-dif"), { x: 0 }, { x: 14, duration: 3.4, ease: "none" }, 0);
      punch(q(".s08-dif"), PERDISTE, "330 815", 1.04);
      tl.to(qa(".s08-l"), { opacity: 0.6, duration: 0.2, yoyo: true, repeat: 3, stagger: 0.1 }, PERDISTE + 0.3);
      // "difícil": tachada, no fue esa
      dibujar([q(".s08-tacha")], DIFICIL, 0.35);
      pop(q(".s08-b1"), DIFICIL + 0.2, "520 720");
      tl.to(q(".s08-dif"), { opacity: 0.4, duration: 0.3 }, DIFICIL + 0.4);
      etq(".s08-e1", DIFICIL);
      // "la perdiste": la más fácil, grande, con el aro
      pop(q(".s08-fac"), LA - 0.1, "760 1002");
      dibujar([q(".s08-aro")], LA + 0.3, 0.6);
      tl.fromTo(q(".s08-rf"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, FACIL);
      punch(q(".s08-fac"), FACIL, "760 1002", 1.1);
      punch(q(".s08-aro"), FACIL, "760 1002", 1.06);
      etq(".s08-e2", FACIL);

      // salida
      tl.to(q("#s08-escena"), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, DUR - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
